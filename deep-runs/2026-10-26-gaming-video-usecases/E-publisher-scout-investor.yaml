  p_typical: 0.09
  grounded: inferred
  evidence: "competitor-and-ua.md section 1: Gemini takes video input, 'about 6 hours of video in 2M context' (general LLMs can partly do this)"
  proposed: "Agent answers only from indexed sessions and returns session IDs with timestamps for each count"
  shallow: false
  mechanism: "Diligence footage is indexed per second with screen labels and transcripts; the agent answers with counts computed from labels and links clips"
  example: "Partner asks 'did anyone find the guild feature unprompted?'; agent answers '2 of 20, at minutes 14 and 17' with both clips"
  cost: S
  depends_on: "scout-1 indexed footage; existing ask-question agent"
  buyer: "Investment partner or publishing committee member"
  input: "recruited-playtesters video + transcripts + data-room metric tables"
  why_existing_tools_cannot: "Playtest AI summarises per test; general video LLMs can answer but lack per-second screen labels and counts across 20 sessions (market.md section 1; competitor-and-ua.md section 1 Gemini note)"
  willingness_to_pay: "2 - expected as a free feature of the audit; commoditisation risk from general video LLMs"

- id: scout-14
