  cost: M
  depends_on: "short-form video sampling at scale; store listing lookup"
  buyer: "Publishing BD scout at a casual or hyper-casual publisher"
  input: "public-streams-and-ugc short-form clips + store metadata"
  why_existing_tools_cannot: "Ad intelligence tracks paid creatives by impressions, and stream tools track viewers; neither reads organic clip content per unsigned title (competitor-and-ua.md sections 2 and 5)"
  willingness_to_pay: "3 - same buyer pays $249-1,249/month for stream data (market.md section 5); unproven for mobile UGC"

- id: scout-17
  title: "Streamability test: 5 paid micro-creators stream the pitch build; the AI counts clip-worthy moments per hour, aligns chat spikes to gameplay, and marks the minute each creator's commentary goes flat"
  level: L4
  cell: {buyer-role: publishing-scout-bd, video-source: creator-sponsored-streams, signal-extracted: speech-or-think-aloud, analysis-type: highlight-or-clip-generation, lifecycle-moment: publisher-pitch-or-diligence, delivery-form: per-cohort-report, companion-data: chat-and-voice-logs, value-lever-b2b: de-risk-a-go-kill-decision}
