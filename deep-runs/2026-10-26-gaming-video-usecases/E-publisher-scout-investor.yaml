- id: scout-1
  title: "Pitch-build FTUE scorecard: 20 recruited testers play the first 20 minutes over cloud capture; report gives time-to-first-core-action, tutorial-card dwell, mis-taps and quit minute, each as a percentile against a library of shipped-game FTUEs"
  level: L4
  cell: {buyer-role: publishing-scout-bd, video-source: publisher-pitch-builds, signal-extracted: input-timing-and-hesitation, analysis-type: benchmark-vs-competitor, lifecycle-moment: publisher-pitch-or-diligence, delivery-form: per-cohort-report, pricing-model: per-audit-or-certification, value-lever-b2b: de-risk-a-go-kill-decision, buyer-org-type: publisher}
  object: "PlaytestCloud Professional Basic EUR 1,130/month for 120 Video Tokens/year, about EUR 113 per recorded session (market.md section 1)"
  situation: "Scout receives a pitch build on Monday and must give a sign / pass / revise view to the publishing committee within 5 working days; today the only numbers are the developer's own deck"
  consequence: "Without an independent percentile the committee debates taste; with it the scout can say 'time to first merge is 74 s, slower than 85% of the comp library' and ask for a revised FTUE before a term sheet"
  p_typical: 0.30
  grounded: inferred
  evidence: "market.md section 1: PlaytestCloud AI 'uses the OpenAI API on video transcripts and survey responses'; market.md section 9: 'No vendor found that applies computer vision to production player gameplay video'"
  proposed: "Fixed-price audit: 20 testers, 20 minutes each, 72-hour turnaround, one page of 6 percentiles plus 3 clips per percentile"
  shallow: false
  mechanism: "Pitch build runs on vendor-controlled cloud devices; testers play; the User Test pipeline adds a per-title screen classifier (tutorial card, CTA highlight, fail screen, store) and touch overlay; metrics are compared with the same metrics computed on 200+ shipped games' first sessions"
  example: "Merge-2 mobile pitch: median first merge at 74 s vs comp median 18 s, 6 of 20 testers quit at the energy wall at minute 8; scout asks for an energy-free first 15 minutes before signing"
  cost: M
  depends_on: "cloud-device capture of side-loaded builds; recruited tester panel; a benchmark library of FTUE metrics from 200+ titles"
  buyer: "Publishing BD scout or head of publishing at a mobile publisher"
  input: "publisher-pitch-builds played by recruited testers (screen video) + touch input + build-and-config metadata"
  why_existing_tools_cannot: "PlaytestCloud and Antidote summarise transcripts and surveys of one game's testers, with no cross-game FTUE benchmark computed from pixels (market.md section 1 'Does NOT do'; section 9 gap map)"
  willingness_to_pay: "4 - publishers already pay EUR 113-141 per recorded session (20 sessions = EUR 2.3-2.8k) and GameRefinery about $45-51k/year for feature intelligence (market.md Signals; competitor-and-ua.md section 1 Prices)"

- id: scout-2
  title: "Instrumentation audit: video of soft-launch sessions is aligned to the developer's event stream and flags events that fire on the wrong screen, e.g. tutorial_complete firing at card 3 of 7, which inflates reported tutorial completion"
  level: L4
  cell: {buyer-role: publishing-scout-bd, video-source: own-players-consented-sdk, signal-extracted: ui-state-and-screen-flow, analysis-type: root-cause-of-a-metric-change, lifecycle-moment: soft-launch, delivery-form: per-cohort-report, companion-data: telemetry-events, constraint-to-overcome: joining-video-to-events, value-lever-b2b: de-risk-a-go-kill-decision}
  object: "Unity ordered funnels vs GameAnalytics any-order funnels give different drop-off for the same players (methods-churn-funnel.md section 1 INFERRED)"
  situation: "Developer's data room shows 90% tutorial completion and 34% D1; scout cannot tell whether events are placed where the deck says they are"
  consequence: "If tutorial_complete fires 4 screens early, true completion may be 61%, not 90%, and the deal is priced on a number the game does not achieve"
  p_typical: 0.04
  grounded: inferred
  evidence: "methods-churn-funnel.md section 1: 'Funnel quality is bounded by instrumentation: a step that was never instrumented ... does not exist in the data'"
  proposed: "Report lists each named event with the screen observed at fire time in 200 sampled sessions and a match rate per event"
  shallow: false
  mechanism: "Capture SDK in the soft-launch build records 1-5 fps video with event markers; the screen classifier labels each frame; for every event the system checks which screen was visible at fire time and recomputes the funnel on observed screens"
  example: "Puzzle RPG soft launch in the Philippines: 'tutorial_complete' fires on the third card in 100% of 200 sessions; observed completion of the last card is 61%; publisher re-bases its D7 forecast before signing"
  cost: M
  depends_on: "developer agrees to ship the capture SDK in the soft-launch build; per-title screen classifier"
  buyer: "Publishing BD scout or data lead at a publisher doing pre-signing diligence"
  input: "own-players-consented-sdk video from soft launch + developer telemetry-events with timestamps"
  why_existing_tools_cannot: "Event analytics tools trust the events they receive and cannot see the screen at fire time; replay SDKs show game canvases as black boxes or screenshots with no game-state labels (methods-churn-funnel.md section 1; market.md section 2 'Does NOT do')"
  willingness_to_pay: "4 - diligence buyers pay five figures for third-party game data (Sensor Tower median $75,000/year, competitor-and-ua.md section 1 Prices); a single mis-stated funnel changes a deal price"

- id: scout-3
  title: "Tamper-evident sampling: vendor holds the sampling seed and signs a session log so the developer cannot hand-pick which soft-launch sessions the publisher sees"
  level: L3
  cell: {buyer-role: investor, video-source: own-players-consented-sdk, analysis-type: cohort-comparison, lifecycle-moment: publisher-pitch-or-diligence, constraint-to-overcome: sampling-bias, capture-trigger-and-sampling: random-sample, delivery-form: per-cohort-report, buyer-org-type: investor}
  object: "Practical sampling knob '(d) user-level sampling (e.g. 1-5% of new installs) with Wi-Fi-only upload' (methods-churn-funnel.md section 7 INFERRED)"
  situation: "Developer offers 'our best 50 session recordings' as evidence; investor has no way to know what the other 4,950 looked like"
  consequence: "A curated sample overstates engagement; a signed random sample makes the footage admissible in an investment memo"
  p_typical: 0.02
  grounded: inferred
  evidence: "methods-churn-funnel.md section 7: sampling knobs; market.md Signals: 'Playtest panel quality is a hidden risk'"
  proposed: "Every report header prints sample rate, seed hash, sessions eligible, sessions captured, sessions dropped for upload failure"
  shallow: false
  mechanism: "SDK draws the 3% sample from a vendor-issued seed; each captured session is hashed into an append-only log; the report states selection rules and a coverage figure the developer cannot alter"
  example: "Seed-stage investor sees 'captured 1,412 of 1,480 eligible first sessions (95.4%), 68 lost to no Wi-Fi in 72 h', and accepts the FTUE readout as independent"
  cost: S
  depends_on: "capture SDK with server-side sampling config"
  buyer: "Game investor (VC partner or analyst) at a games-focused fund"
  input: "own-players-consented-sdk video + install counts from the developer's attribution or store console"
  why_existing_tools_cannot: "Session replay tools sample for the app owner, who controls the config; no source shows a third-party-verifiable sampling log (methods-churn-funnel.md section 6 Sentry sampling settings are client-set)"
  willingness_to_pay: "3 - not priced alone; it is what makes scout-2, scout-4 and scout-21 credible to an investment committee"

- id: scout-4
  title: "Fixable-vs-structural churn split: last 60 seconds before app kill for 300 soft-launch D1 churners, each labelled UI-fixable (missed button, unclear goal) or structural (core loop repeated, no new mechanic), with share per class"
  level: L4
  cell: {buyer-role: investor, video-source: own-players-consented-sdk, signal-extracted: ui-state-and-screen-flow, analysis-type: funnel-drop-off-why, lifecycle-moment: soft-launch, capture-trigger-and-sampling: always-on-ring-buffer, value-lever-b2b: de-risk-a-go-kill-decision, delivery-form: managed-service-with-analyst}
  object: "Rovio result: real pass rate vs churn r = -0.144 but vs 'churn without completing the level' r = -0.586 (methods-churn-funnel.md section 3)"
  situation: "Soft launch shows D1 27%; investor needs to know whether the publisher can lift it after signing or whether the core loop caps it"
  consequence: "If 70% of churn moments are UI-fixable, the investor prices upside; if 70% are structural, the round is passed or priced on today's metrics"
  p_typical: 0.07
  grounded: inferred
  evidence: "methods-churn-funnel.md section 3 INFERRED: 'churn is tied to specific failure moments; those moments are exactly what a short video clip around the last failure would show'"
  proposed: "Memo page: 300 churn clips, two classes, top 5 moments per class with counts and one clip each"
  shallow: false
  mechanism: "60-second on-device ring buffer uploads only when the first session ends and the player does not return within 24 h; classifier labels the final screen and last actions; analyst reviews 10% of labels and assigns fixable/structural"
  example: "Idle tycoon soft launch: 58% of D1 churners leave on the second upgrade screen without tapping the glowing button (fixable); 22% leave after the 4th identical stage (structural); investor models D1 +4 pp upside"
  cost: M
  depends_on: "scout-3 sampling; capture SDK ring buffer; analyst time 2 days per memo"
  buyer: "Investor or publisher BD evaluating a soft-launch title"
  input: "own-players-consented-sdk ring-buffer clips + session-end and return events"
  why_existing_tools_cannot: "Funnels show where players drop, not why (Unity docs 'investigate'); no paper or product predicts churn from human gameplay video (methods-churn-funnel.md sections 1 and 3)"
  willingness_to_pay: "4 - analytics vendors sell exactly this framing with headline lifts (FunCraft +40% D1, EA 30% faster onboarding; methods-churn-funnel.md Signals)"

- id: scout-5
  title: "Comp-set auto-teardown: the pitch build and its 5 nearest comps (from public YouTube FTUE walkthroughs) are placed on one timeline showing the minute of first store prompt, first ad, first energy gate and first social ask"
  level: L4
  cell: {buyer-role: publishing-scout-bd, video-source: public-streams-and-ugc, signal-extracted: economy-and-store-events, analysis-type: benchmark-vs-competitor, lifecycle-moment: publisher-pitch-or-diligence, delivery-form: per-cohort-report, game-platform-and-genre: mobile-midcore-f2p, value-lever-b2b: replace-labour-hours}
  object: "GameRefinery analysts 'download and play games and map each feature into a database; about 260 features are tracked manually' (competitor-and-ua.md section 1)"
  situation: "Scout needs to know whether the pitch monetises earlier or later than the games it claims as comps, and has 2 days, not the 2 weeks a manual teardown takes"
  consequence: "Scout sees the pitch shows a starter pack at minute 2 while comps wait until minute 9 to 14, and asks for that change before signing instead of discovering it in soft-launch reviews"
  p_typical: 0.08
  grounded: inferred
  evidence: "competitor-and-ua.md section 7 INFERRED: 'FTUE and monetisation-flow teardown of competitors has no named automated product in search results'"
  proposed: "One horizontal timeline per game, 6 event types, aligned at minute 0, with the pitch row highlighted"
  shallow: false
  mechanism: "For each comp the system fetches 3 public FTUE walkthrough videos, the VLM labels store, ad, gate and social-ask screens per second, and the median minute per event is plotted beside the pitch build's tester median"
  example: "Pitch for a squad RPG: first paid offer at 2:10 vs comps' median 11:40; first energy gate at 6:00 vs comps' 25:00; publisher makes signing conditional on moving both"
  cost: S
  depends_on: "scout-1 tester footage; VLM screen labelling; public video fetch"
  buyer: "Publishing BD scout at a mobile publisher"
  input: "public-streams-and-ugc FTUE walkthroughs of comps + publisher-pitch-builds tester video"
  why_existing_tools_cannot: "Automated tags in market intelligence read store metadata and ad creatives, not recorded gameplay (competitor-and-ua.md section 1 INFERRED); Gamedexy flows are human-captured for 25 games (section 1)"
  willingness_to_pay: "4 - GameRefinery about $45-51k/year and Gamedexy Pro $99/year show the same buyer pays for flow references (competitor-and-ua.md section 1)"

- id: scout-6
  title: "Clone-risk check: pitch-build footage is matched against a footage index of top-grossing titles for core-loop and UI-layout similarity, flagging any title above 0.85 similarity with side-by-side frames"
  level: L3
  cell: {buyer-role: publishing-scout-bd, video-source: publisher-pitch-builds, signal-extracted: ui-state-and-screen-flow, analysis-type: benchmark-vs-competitor, lifecycle-moment: publisher-pitch-or-diligence, delivery-form: enforcement-or-cert-evidence-pack, value-lever-b2b: de-risk-a-go-kill-decision, buyer-org-type: publisher}
  object: "Game UI Database: 55,000+ screenshots, 1,700+ videos, 1,341 titles, human-captured (competitor-and-ua.md section 1)"
  situation: "A pitch looks close to a known hit; legal asks whether the shop, board and HUD layout are near-copies before the publisher puts its name on it"
  consequence: "A near-copy found after launch becomes a takedown or dispute; found before signing it becomes a revision request or a pass"
  p_typical: 0.03
  grounded: speculative
  evidence: "competitor-and-ua.md section 1: Game UI Database and Gamedexy are human-captured references with no similarity search described"
  proposed: "Report shows top 3 matches, similarity score per screen type (board, shop, HUD), and 4 paired frames each"
  shallow: false
  mechanism: "Frame embeddings of the pitch build's main screens are compared with embeddings of an index built from public walkthroughs of the top 500 grossing games; screens above threshold are paired for human review"
  example: "Merge puzzle pitch scores 0.91 on board layout and 0.88 on shop layout against a top-20 title; publisher legal requires a new shop and board art before contract"
  cost: M
  depends_on: "footage index of 500 top titles (shared with scout-5); frame-embedding model"
  buyer: "Publishing BD scout plus publisher legal counsel"
  input: "publisher-pitch-builds tester video + public-streams-and-ugc index of top titles"
  why_existing_tools_cannot: "UI reference libraries are browsable screenshot collections built by hand, with no visual matching against a submitted build (competitor-and-ua.md section 1)"
  willingness_to_pay: "3 - no price signal in the notes; bought as a line in a per-deal audit, not alone"

- id: scout-7
  title: "Off-the-shelf asset detector: share of on-screen characters, props and VFX matched to engine-marketplace asset previews, reported as % of screen-time made of bought assets"
  level: L3
  cell: {buyer-role: investor, video-source: publisher-pitch-builds, signal-extracted: structured-game-state-reconstruction, analysis-type: benchmark-vs-competitor, lifecycle-moment: prototype-and-greenlight, delivery-form: per-cohort-report, buyer-org-type: investor, constraint-to-overcome: accuracy-and-trust}
  object: "Fab marketplace listing pages exist for Unreal assets (methods-churn-funnel.md section 2 cites a Fab listing for an idle detector)"
  situation: "Investor sees a polished vertical slice and needs to know how much of the art is owned versus bought, which sets the cost of reaching a distinct look"
  consequence: "A slice that is 70% marketplace assets needs a re-art budget the deck did not include; a slice that is 10% does not"
  p_typical: 0.02
  grounded: speculative
  evidence: "none in notes for asset matching; methods-churn-funnel.md section 2 shows Fab as a live asset marketplace"
  proposed: "One number (marketplace screen-time share) plus the 10 matched assets with their listing names"
  shallow: false
  mechanism: "Object crops from 30 minutes of footage are embedded and searched against a crawled index of marketplace preview images; matches above threshold are listed with screen-time seconds"
  example: "PC action pitch: 64% of enemy screen-time matches 3 marketplace creature packs; investor adds $300k re-art to the budget before agreeing the round size"
  cost: L
  depends_on: "crawled index of marketplace previews; licence check on crawling those previews"
  buyer: "Game investor at seed or Series A"
  input: "publisher-pitch-builds footage (internal capture or tester capture)"
  why_existing_tools_cannot: "No vendor in the notes analyses pitch footage for asset provenance; CV game-state tools target HUD and events, not art origin (methods-churn-funnel.md section 4)"
  willingness_to_pay: "2 - investors would ask for it inside a diligence pack; no evidence of a standalone budget"

- id: scout-8
  title: "QA-debt estimate: an agent plays the pitch build 3 hours on 4 devices, VLM triage counts crashes and visual glitches per hour, and the report converts them to tester-weeks at $15-50 per tester hour"
  level: L4
  cell: {buyer-role: publishing-scout-bd, video-source: automated-bot-or-agent-playthrough, signal-extracted: visual-errors-and-glitches, analysis-type: anomaly-alert, lifecycle-moment: publisher-pitch-or-diligence, delivery-form: per-cohort-report, value-lever-b2b: de-risk-a-go-kill-decision, capture-trigger-and-sampling: scheduled-bot-playthrough}
  object: "VLM zero-shot baseline precision 0.50 / accuracy 0.72 on 100 industrial QA videos (adjacent-usecases.md section 1)"
  situation: "Publisher must budget post-signing QA and launch date; developer says the build is 'near beta'"
  consequence: "A build with 14 crashes per agent-hour gets a later launch date and a QA line in the deal; one with 0.5 does not"
  p_typical: 0.06
  grounded: inferred
  evidence: "adjacent-usecases.md section 1: outsourced game QA 'USD 15 to 50 per tester hour'; market.md section 3: '77% did less QA than they should have'"
  proposed: "Report states crashes/hour, glitches/hour (human-confirmed), and a tester-week range, with each confirmed bug as a clip"
  shallow: false
  mechanism: "Vision-based agent plays build for 3 hours per device on 2 Android tiers and 2 iOS devices; VLM flags glitch candidates; a human confirms flags (precision 0.50 means half are false); confirmed rates are scaled to a tester-week estimate"
  example: "Casual shooter pitch: 9 crashes and 31 confirmed glitches in 12 agent-hours; publisher adds 6 tester-weeks ($9.6k at $40/h) and moves launch 1 month"
  cost: M
  depends_on: "agent playthrough capability (partner with an AI-QA vendor or own); human confirmation step"
  buyer: "Publishing BD scout or publishing producer"
  input: "automated-bot-or-agent-playthrough video + crash-and-error-logs from the device"
  why_existing_tools_cannot: "modl.ai, nunu.ai and Razer QA Companion sell testing to the developer during production; none produces a third-party readiness estimate for an evaluator (market.md section 3 'Does NOT do')"
  willingness_to_pay: "3 - QA spend is real ($1,000-5,000 per small mobile test cycle, adjacent-usecases.md section 1) but the scout buys an estimate, not the testing"

- id: scout-9
  title: "Device-reach readout: pitch build is run on 12 Android tiers, video-derived frame pacing and load-screen seconds are measured, and the report states the share of target-market installs below 30 fps"
  level: L4
  cell: {buyer-role: publishing-scout-bd, video-source: platform-or-emulator-capture, signal-extracted: performance-fps-and-load, analysis-type: benchmark-vs-competitor, lifecycle-moment: publisher-pitch-or-diligence, game-platform-and-genre: mobile-midcore-f2p, delivery-form: per-cohort-report, value-lever-b2b: de-risk-a-go-kill-decision}
  object: "'same build can run 60 fps on a flagship and 24 fps on a mid-tier phone' (adjacent-usecases.md section 6)"
  situation: "Publisher targets Southeast Asia and LATAM where mid- and low-tier Android dominate; developer only tested on flagships"
  consequence: "If 45% of target installs fall below 30 fps, UA spend in those markets is wasted until optimisation; the deal adds an optimisation milestone"
  p_typical: 0.05
  grounded: inferred
  evidence: "adjacent-usecases.md section 6: 'compatibility testing of a major mobile title can need 500 to 2,000+ device-OS combinations'"
  proposed: "Table: device tier x median fps x load seconds x estimated market share for each of 3 target countries"
  shallow: false
  mechanism: "Build runs a fixed 10-minute agent route on 12 device models in a device farm; frame duplication in captured video gives fps and stalls; load and wait screens are timed by the screen classifier"
  example: "Midcore RPG pitch: median 22 fps on 5 of 12 devices covering an estimated 41% of Indonesian Android installs; publisher requires a low-spec mode before Indonesia soft launch"
  cost: M
  depends_on: "device-farm access; device-share data per market (bought, not in notes)"
  buyer: "Publishing BD scout or publishing producer at a mobile publisher"
  input: "platform-or-emulator-capture on device farm + device-perf-counters where available"
  why_existing_tools_cannot: "GameBench needs its SDK or lab engagement and is sold to the developer; the evaluator has no access to the developer's perf counters (adjacent-usecases.md section 6)"
  willingness_to_pay: "3 - device-farm testing is bought per device-hour (adjacent-usecases.md section 6); scout buys it bundled in a diligence audit"

- id: scout-10
  title: "Content-runway estimate: soft-launch footage gives levels or stages cleared per player-day for the top 10% cohort, divided by the developer's stated content pipeline, reported as weeks until that cohort runs out"
  level: L4
  cell: {buyer-role: investor, video-source: own-players-consented-sdk, signal-extracted: structured-game-state-reconstruction, analysis-type: cohort-comparison, lifecycle-moment: soft-launch, delivery-form: per-cohort-report, buyer-org-type: investor, value-lever-b2b: create-data-that-did-not-exist}
  object: "GameRefinery Live Events Tracker: 'analysts monitor live events daily' across Match3, Midcore and Casual (competitor-and-ua.md section 1)"
  situation: "Investor funds a live game whose top players are its payers; the question is whether a 12-person team can produce content faster than those players consume it"
  consequence: "If top players clear 30 levels/day and the team ships 40 levels/week, payers hit the end in under 2 weeks after each update and churn; the investor sizes the team budget accordingly"
  p_typical: 0.03
  grounded: inferred
  evidence: "methods-churn-funnel.md section 4: Q3Vision reconstructs game state from screen video only; ICCS 2020 HUD OCR runs in real time"
  proposed: "One chart: cumulative content available vs cumulative content consumed by top 10%, by week, with the crossover week marked"
  shallow: false
  mechanism: "OCR of the level number on the HUD in sampled sessions gives levels per player-day per cohort; the developer's roadmap gives levels per week; the crossover is computed for top 1%, 10% and median cohorts"
  example: "Match-3 soft launch: top 10% clear 28 levels/day, roadmap is 50 levels/week; crossover at week 3 after launch; investor makes a content-team hire a condition of the round"
  cost: S
  depends_on: "scout-3 sampled footage; HUD OCR for level number"
  buyer: "Game investor at Series A or a publisher funding a live title"
  input: "own-players-consented-sdk video + developer content roadmap"
  why_existing_tools_cannot: "Progression events exist only if the developer instruments and shares them; an evaluator gets aggregates in a deck, and live-ops trackers cover the top 100-250 published games by hand (competitor-and-ua.md section 1 INFERRED)"
  willingness_to_pay: "3 - investor question with no direct price in notes; sold inside a soft-launch diligence package"

- id: scout-11
  title: "Iteration-velocity diff: three pitch builds submitted 3-4 weeks apart are played along the same FTUE route, and the report counts friction points fixed, unchanged and newly introduced per build"
  level: L4
  cell: {buyer-role: investor, video-source: publisher-pitch-builds, signal-extracted: ui-state-and-screen-flow, analysis-type: build-to-build-regression-diff, lifecycle-moment: prototype-and-greenlight, delivery-form: per-cohort-report, value-lever-b2b: de-risk-a-go-kill-decision, companion-data: build-and-config-metadata}
  object: "PlaytestCloud / Nitro Games: tested builds with no tutorial, then designed the tutorial; completion rose to 90% (methods-churn-funnel.md section 2)"
  situation: "Investor backs teams, not builds, and wants evidence the team acts on player evidence between builds"
  consequence: "A team that fixes 9 of 12 flagged friction points in 4 weeks is a different bet from one that fixes 1 and adds 5 new ones"
  p_typical: 0.04
  grounded: inferred
  evidence: "methods-churn-funnel.md section 2: Nitro Games case shows iterative build testing raising tutorial completion to 90%"
  proposed: "Table of friction points by ID with status per build (open / fixed / regressed) and a fix rate"
  shallow: false
  mechanism: "Each build is played by 15 testers on the same route; friction points get stable IDs by screen and action; the diff matches IDs across builds"
  example: "Strategy game: build 1 has 12 friction points; build 3 fixes 9, keeps 3, adds 2; investor writes 'team iterates on evidence' in the IC memo"
  cost: S
  depends_on: "scout-1 audit run on each build; friction-point ID matching across builds"
  buyer: "Game investor (pre-seed to Series A) or publisher greenlight committee"
  input: "publisher-pitch-builds from 3 dates + build-and-config-metadata"
  why_existing_tools_cannot: "Playtest platforms report per test, not a cross-build friction ledger read by a third party (market.md section 1)"
  willingness_to_pay: "3 - sold as a 3-audit bundle; same per-session anchor as scout-1 (market.md Signals)"

- id: scout-12
  title: "Investment-committee clip reel: 3-minute reel of 12 clips (6 delight, 6 friction) cut from tester footage, each captioned with how many of the 20 testers showed the same moment"
  level: L4
  cell: {buyer-role: publishing-scout-bd, video-source: recruited-playtesters, signal-extracted: input-timing-and-hesitation, analysis-type: highlight-or-clip-generation, lifecycle-moment: publisher-pitch-or-diligence, delivery-form: clip-reel, effort: XS-repackage-existing-user-test-product, buyer-org-type: publisher}
  object: "PlaytestCloud 'First Findings' 'links each friction point to its clip' (market.md section 1)"
  situation: "Publishing committee of 6 people will not watch 20 sessions; the scout has 5 minutes in the meeting"
  consequence: "Committee members see the same 12 moments with counts and argue about evidence, not recollection"
  p_typical: 0.12
  grounded: quote
  evidence: "market.md section 1: First Findings 'groups findings by theme, and links each friction point to its clip'"
  proposed: "Export as MP4 with burned-in captions and a link list back to full sessions"
  shallow: false
  mechanism: "Existing User Test pipeline picks the clearest clip per finding, ranks by tester count, and renders a captioned reel"
  example: "Committee watches 6 testers tap the inactive map icon at minute 3 ('6/20') and 9 testers smile at the first boss ('9/20') and signs with one FTUE condition"
  cost: S
  depends_on: "scout-1 footage and findings"
  buyer: "Publishing BD scout presenting to a publishing committee"
  input: "recruited-playtesters video + think-aloud transcript"
  why_existing_tools_cannot: "First Findings links findings to clips for researchers inside one test, not an IC-ready counted reel (market.md section 1); the gap is packaging, so general video LLMs could close it"
  willingness_to_pay: "2 - useful but scouts can cut it themselves; included in the audit, not priced alone"

- id: scout-13
  title: "Diligence ask-agent: committee members query the diligence footage and data-room metrics in chat, e.g. 'how many testers saw the starter pack before minute 5', and get counts plus clips"
  level: L4
  cell: {buyer-role: investor, video-source: recruited-playtesters, signal-extracted: economy-and-store-events, analysis-type: ask-a-question-over-footage, lifecycle-moment: publisher-pitch-or-diligence, delivery-form: ask-question-agent-chat, effort: XS-repackage-existing-user-test-product, buyer-org-type: investor}
  object: "Frame assumption: 'the company building this already has ... a report/ask-question agent (the User Test product)' (A-frame.yaml assumptions)"
  situation: "Partner reads the memo the night before IC and has a question the memo does not answer"
