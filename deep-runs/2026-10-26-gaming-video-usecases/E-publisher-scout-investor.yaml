  cost: M
  depends_on: "VOD fetch and chat logs from stream platforms; per-demo end-screen detection by VLM"
  buyer: "Publishing BD scout at a PC publisher"
  input: "public-streams-and-ugc VODs + chat-and-voice-logs from stream platforms"
  why_existing_tools_cannot: "Hatchet and Streams Charts report viewers and hours per category, not how far streamers got in the demo (market.md section 5)"
  willingness_to_pay: "4 - publishers pay Hatchet $249-1,249+/month for stream analytics (market.md section 5)"

- id: scout-16
  title: "Unsigned-mobile-prototype radar: short-form UGC clips are clustered by visible mechanic and game title (OCR of title cards and HUD), and the scout gets a weekly list of unsigned titles whose clip count grew 3x week on week"
