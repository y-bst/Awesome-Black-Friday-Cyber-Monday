  cost: M
  depends_on: "agent playthrough partner or in-house agent; scout-5 comp index; emulator farm"
  buyer: "Head of publishing / BD at a publisher with an open submission inbox"
  input: "automated-bot-or-agent-playthrough of publisher-pitch-builds + submission form metadata"
