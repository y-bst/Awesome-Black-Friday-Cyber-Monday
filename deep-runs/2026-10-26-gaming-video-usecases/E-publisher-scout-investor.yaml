  why_existing_tools_cannot: "Creator platforms measure clicks, keys and views, not what happens inside the stream (competitor-and-ua.md section 5 INFERRED)"
  willingness_to_pay: "3 - creator costs anchor it ($0.02-0.20 per view on YouTube via Jestr, competitor-and-ua.md section 5); analysis is a small add-on"

- id: scout-18
