- id: brand-1
  title: Logo-seconds ledger per sampled session for a 3D trackside billboard, counted only when the logo covers at least 2% of the frame
  level: L4
  cell: {buyer-role: brand-advertiser, video-source: own-players-consented-sdk, signal-extracted: brand-logo-exposure, analysis-type: ad-verification-and-fraud, lifecycle-moment: live-event-or-update, delivery-form: dashboard, pricing-model: cpm-or-per-impression-verified, game-platform-and-genre: competitive-multiplayer, capture-trigger-and-sampling: random-sample}
  object: "Relo Metrics-style logo detection ('prominence, screen share, duration', market.md section 5) applied to one billboard texture in a racing game's 3D scene"
  situation: A beverage brand has paid for a 4-week billboard placement; the game can report 'billboard loaded' but not 'billboard on screen at readable size', so a billboard behind the camera for a 90-second lap counts the same as one filling 8% of the frame
  consequence: The brand pays per load, cannot defend the spend to its CMO, and renews blind or drops
  p_typical: 0.15
  grounded: quote
  evidence: "market.md section 5, Relo Metrics: 'CV detects every visible sponsor logo across broadcast, streaming and social video (prominence, screen share, duration)... Search found no esports or in-game equivalent.'"
  proposed: Run a logo detector at 2 fps on 1-3% of consented sessions and report seconds with logo above 2% of frame area and 50% unoccluded, with a confidence interval, per placement per week
  mechanism: Per-frame detector on sampled consented footage yields seconds-of-readable-exposure per session, extrapolated to the full player base with an interval; the brand sees a verified number instead of a load count
  example: "Weekly report for a drinks brand in a racing game: median 41 s readable exposure per session, p10 3 s, 600 s contract floor per 1,000 sessions met on 6 of 7 days"
  cost: M
  depends_on: Sampled capture SDK in the host game (the existing video ingestion), brand reference logo images, a one-off camera-angle calibration per placement
  buyer: Sponsorship measurement lead at a consumer brand, or the agency analyst who writes the post-campaign report
  input: Sampled own-player screen video at 2 fps plus the placement ID and the build number from build metadata
  why_existing_tools_cannot: "market.md section 5: Relo Metrics runs on broadcast, streaming and social video only and search found no in-game equivalent; Hatchet measures 'viewership metadata (hours watched, viewers, chat)' not pixels"
  willingness_to_pay: "3 - Hatchet publishes $249 to $1,249+/month with custom publisher quotes (market.md section 5); no in-game price exists, so the price is inferred from sports-sponsorship measurement"

- id: brand-2
  title: Contract-clause verifier for a paid creator stream, timing the minutes the product is on screen, spoken and named against the brief
  level: L4
  cell: {buyer-role: brand-advertiser, video-source: creator-sponsored-streams, signal-extracted: brand-logo-exposure, analysis-type: compliance-audit, lifecycle-moment: ua-campaign-launch, delivery-form: enforcement-or-cert-evidence-pack, pricing-model: per-audit-or-certification, buyer-org-type: agency, companion-data: attribution-campaign-and-creative-id}
  object: "A 3-hour sponsored Twitch VOD against a brief that says '10 minutes of product-on-screen, 3 verbal mentions, link in chat'"
  situation: An agency has paid a creator $8,000 for a 3-hour stream and today checks delivery by a producer scrubbing the VOD, or trusts the creator's own report
  consequence: Under-delivery goes unclaimed, or the agency spends 3 to 6 producer-hours per stream on verification
  p_typical: 0.12
  grounded: inferred
  evidence: "competitor-and-ua.md section 5: 'Monitoring today is by viewership counts, tracked links and keys, not by what is shown in the clip.'"
  proposed: Return a timestamped evidence pack with seconds of logo on screen, transcript lines containing the product name, and a pass/fail per brief clause
  mechanism: Logo detector plus speech transcript plus OCR of chat-link overlays on the VOD, scored against structured brief clauses, output as a signed PDF with clip links for each clause
  example: "Agency receives: product on screen 7 min 40 s of 10 contracted, 2 of 3 verbal mentions (timestamps 00:41:12 and 01:58:03), link overlay shown 0 times; invoices a make-good stream"
  cost: M
  depends_on: Existing video ingestion and transcription from the User Test product, a brief-to-clause parser
  buyer: Influencer campaign manager at a gaming-adjacent brand or its agency
  input: Public VOD or creator-supplied recording plus the campaign brief text and tracking link IDs
  why_existing_tools_cannot: "competitor-and-ua.md section 5: Gamesight ties creator content to 'clicks, wishlists and purchases' and Lurkit sells key distribution; neither reads what is shown in the clip"
  willingness_to_pay: "3 - Lurkit paid quests carry 15-20% commission and Jestr clips cost $0.01-$0.20 per view (competitor-and-ua.md section 5); a $8,000 stream makes 1-2% verification fee plausible"

- id: brand-3
  title: Disclosure-label audit of sponsored game streams, flagging the minutes where no paid-promotion label or '#ad' text is visible
  level: L4
  cell: {buyer-role: brand-advertiser, video-source: creator-sponsored-streams, signal-extracted: on-screen-text-ocr, analysis-type: compliance-audit, lifecycle-moment: live-event-or-update, delivery-form: alert-or-slack, pricing-model: per-audit-or-certification, value-lever-b2b: avoid-fine-or-cert-failure, go-to-market-channel: through-services-vendor}
  object: "Stream overlay and title area of a sponsored VOD where a '#ad' or 'Includes paid promotion' label should appear"
  situation: A brand's legal team wants proof that every one of 40 creators in a launch wave showed a disclosure label during the first 5 minutes and after each product mention
  consequence: A missing label exposes the brand to an advertising-standards complaint and forces takedowns after the fact
  p_typical: 0.06
  grounded: speculative
  evidence: "none; competitor-and-ua.md section 5 says 'Nothing found reads clip content', so the absence of a clip-content product is the only support"
  proposed: Live OCR on a stream tap that posts a Slack alert when 5 minutes pass after a product mention with no disclosure text
  mechanism: OCR over stream frames at 0.5 fps plus a speech trigger on product names; alerts when the label is missing within a 5-minute window
  example: "Slack alert at 00:22:10: creator 17 said the product name at 00:17:05, no disclosure text detected for 5 min 5 s"
  cost: S
  depends_on: Public stream access, list of creator channels, product-name keywords
  buyer: Legal or brand-compliance manager at the advertiser, or the agency compliance lead
  input: Public stream video plus a speech transcript and the contracted product keyword list
  why_existing_tools_cannot: "competitor-and-ua.md section 5: Lurkit and Gamesight measure tracked links and keys; no source shows a tool that reads on-screen disclosure text"
  willingness_to_pay: "2 - no price signal in the notes; legal risk is real but the buyer pool is small and the same check is cheap for a human with a checklist"

- id: brand-4
  title: Brand-adjacency scoring of what is on screen in the 10 seconds around every sponsor logo appearance in public gameplay clips
  level: L4
  cell: {buyer-role: brand-advertiser, video-source: public-streams-and-ugc, signal-extracted: social-or-chat-content, analysis-type: content-rating-classification, lifecycle-moment: ua-campaign-launch, delivery-form: weekly-digest-email, pricing-model: per-month-seat, buyer-org-type: brand-advertiser, automation-level: insight-for-human}
  object: "Frames within +/-10 s of a logo detection in a gameplay stream, showing a kill-cam, a death screen, a slur in chat overlay or a gambling overlay"
  situation: A family-brand sponsor of an esports league sees its logo on screen at the moment a streamer rages, loses 0-5, or shows a chat window full of abuse
  consequence: The brand attaches itself to toxic or violent moments without knowing, and only learns from a social post
  p_typical: 0.07
  grounded: inferred
  evidence: "adjacent-usecases.md section 3: 'vision-based toxicity (offensive gestures, names, UGC on screen) was not evidenced in sources'"
  proposed: Weekly email scoring each placement's 10-second context into violence, loss/rage, abuse-in-chat and gambling-overlay buckets with the 5 worst clips linked
  mechanism: VLM classifies frames adjacent to each detected logo into context buckets and aggregates per placement and per creator
  example: "Weekly digest: 14% of exposure seconds for placement X occurred during a loss screen, 3% beside visible abusive chat; top 5 clips linked"
  cost: M
  depends_on: A logo detector (brand-1 capability), VLM call per sampled clip
  buyer: Brand-safety manager at a consumer brand or its media agency
  input: Public stream or VOD frames, OCR of chat overlay, logo detections
  why_existing_tools_cannot: "adjacent-usecases.md section 3: voice and text moderation (Modulate, GGWP) exist but vision-based context on screen is not evidenced; market.md section 5: Hatchet reports audience metadata only"
  willingness_to_pay: "2 - Modulate prices voice moderation per hour (10 cents extra per hour, up to $20,000/month, adjacent-usecases.md section 3) for studios, but no brand-safety price for in-game context appears in the notes"

- id: brand-5
  title: Rendered-and-visible proof for a brand's playable or rewarded ad inside a mobile game, from 1-5 fps frames of the ad session
  level: L4
  cell: {buyer-role: brand-advertiser, video-source: ad-and-playable-ad-sessions, signal-extracted: ad-render-and-viewability, analysis-type: ad-verification-and-fraud, lifecycle-moment: ua-campaign-launch, delivery-form: per-cohort-report, pricing-model: cpm-or-per-impression-verified, game-platform-and-genre: mobile-casual-hypercasual, capture-trigger-and-sampling: random-sample}
  object: "A 30-second rewarded video served by an ad network inside a hyper-casual game, where the close button or a system banner can cover the creative"
  situation: A non-gaming brand buys rewarded inventory by CPM; the network reports an impression, but the frame may show the ad covered, muted, skipped at 2 seconds or paused behind a notification
  consequence: The brand pays for impressions where under 50% of the creative was visible
  p_typical: 0.12
  grounded: inferred
  evidence: "competitor-and-ua.md section 2: 'screenshotting ads seen inside another game mislabels them as that game's creative (vendor guide)'; no public AppLovin ad library exists"
  proposed: Sample 0.5-1% of ad sessions at 1-5 fps and report share of impressions with the creative above 50% visible for 2 s or more, per network and per app
  mechanism: Frame classifier checks creative present, size on screen, occlusion by close button or system UI, and elapsed seconds; output joined to the network's impression ID
  example: "Brand sees: network A 91% verified-visible impressions, network B 64%, 11% of B's impressions ended before 2 s"
  cost: M
  depends_on: Capture SDK present in the ad-hosting app or a partner network, impression ID passed from the ad SDK
  buyer: Programmatic or media buyer at a brand advertiser or agency
  input: Sampled on-device frames during ad sessions plus ad SDK impression IDs
  why_existing_tools_cannot: "competitor-and-ua.md section 2: ad libraries expose creatives but 'not what happens after install'; section 3 says every tool 'analyses the ad video plus network metrics' and never the player's screen"
  willingness_to_pay: "3 - Segwise tiers are $499-$1,699/month by ad spend and Sensor Tower median $75,000 a year (competitor-and-ua.md sections 1 and 3); a verification line item priced per verified thousand impressions is inferred"

- id: brand-6
  title: Game-moment context tag on every rewarded-ad impression (mid-fail, level-complete, store screen) so the brand buys only the moments it wants
  level: L4
  cell: {buyer-role: brand-advertiser, video-source: ad-and-playable-ad-sessions, signal-extracted: ui-state-and-screen-flow, analysis-type: creative-insight-for-ads, lifecycle-moment: ua-campaign-launch, delivery-form: api-or-sdk, pricing-model: cpm-or-per-impression-verified, companion-data: attribution-campaign-and-creative-id, game-platform-and-genre: mobile-midcore-f2p}
  object: "The screen state in the 2 seconds before a rewarded ad opens: 'fail screen', 'level-complete screen', 'shop screen'"
  situation: A cosmetics brand's rewarded ad plays right after a player fails level 12 for the fourth time, versus right after a win, and its completion rate differs but the buyer cannot see the moment
  consequence: The brand's creative is blamed for a 40% skip rate that is really a moment-of-frustration effect
  p_typical: 0.07
  grounded: inferred
  evidence: "competitor-and-ua.md section 3: 'None links an ad element to what the acquired player did on device'; geeklab.app source says it is 'hard to see which creative acquired players who later retain and pay'"
  proposed: Return a context label per impression (win, fail, store, idle) and report completion and click-through by label
  mechanism: Per-title screen classifier labels the pre-ad frames; labels attach to impression IDs and are exposed through an API for bid decisions
  example: "Report: completion rate 78% after a win screen, 41% after the fourth consecutive fail screen; brand bids only on win moments"
  cost: M
  depends_on: Per-title screen classifier (a few hundred labelled frames per game, methods-churn-funnel.md section 4), ad SDK hook
  buyer: Media planner at a brand advertiser buying in-game rewarded inventory
  input: Own-player or partner-network on-device frames before and during ad slots plus impression IDs
  why_existing_tools_cannot: "competitor-and-ua.md section 3: Segwise, Alison and Vidmob tag the ad creative and network metrics; none describes the screen state the player was in when the ad opened"
  willingness_to_pay: "2 - Replai handled over $5B a year of video spend (market.md section 6) so budgets exist, but the brand buyer here is not evidenced and mobile ad networks may offer this to themselves"

- id: brand-7
  title: Share-of-voice map of competitor-brand logos in the same game, counted from public streams per title per week
  level: L4
  cell: {buyer-role: brand-advertiser, video-source: public-streams-and-ugc, signal-extracted: brand-logo-exposure, analysis-type: benchmark-vs-competitor, lifecycle-moment: season-or-battle-pass-start, delivery-form: weekly-digest-email, pricing-model: per-month-seat, buyer-org-type: brand-advertiser, game-platform-and-genre: pc}
  object: "Liveries, billboards and branded cosmetics on screen in a top-10 Twitch category, comparing the brand's logo against a rival's"
  situation: A shoe brand sponsors a sports game's season pass; its rival sponsors the neighbouring league; the brand wants the ratio of on-screen seconds, not a viewership count
  consequence: Share-of-voice decisions rely on a sponsor's own deck, so the brand cannot tell whether a 2x price premium buys a 2x exposure advantage
  p_typical: 0.08
  grounded: quote
  evidence: "market.md section 5: Relo Metrics measures sponsor logos 'across broadcast, streaming and social video'; Hatchet Pro from $1,249/month; section 9: 'Relo-style CV exists in sports but was not found for in-game moments or esports'"
  proposed: Weekly table of logo-seconds by brand per game, normalised by hours watched, with 3 example clips per brand
  mechanism: Logo detector over sampled stream segments of the top streams in a game category, multiplied by hours watched from stream-analytics counts to give exposure-weighted share of voice
  example: "Table: rival logo 52 s per stream-hour in the season's 40 largest streams vs the brand's 19 s; ratio 2.7 to 1"
  cost: M
  depends_on: A stream-sampling pipeline, a logo library of the brand and 5 named rivals, public viewership counts
  buyer: Sponsorship strategist at a brand or its agency
  input: Public streams and VODs sampled at 0.5 fps plus viewership counts from a stream-analytics feed
  why_existing_tools_cannot: "market.md section 5: Hatchet, Streams Charts and SullyGnome report hours watched and viewers; section 9 says stream analytics 'measure audience metadata, not in-game content'"
  willingness_to_pay: "3 - Hatchet Pro $1,249+/month and EA and NASCAR named as clients (market.md section 5); per-seat at similar level is inferred"

- id: brand-8
  title: Make-good evidence pack for a league sponsorship, with logo seconds per match and a per-invoice-line video citation
  level: L4
  cell: {buyer-role: brand-advertiser, video-source: esports-vod, signal-extracted: brand-logo-exposure, analysis-type: compliance-audit, lifecycle-moment: live-event-or-update, delivery-form: enforcement-or-cert-evidence-pack, pricing-model: per-audit-or-certification, game-platform-and-genre: competitive-multiplayer, value-lever-b2b: reduce-cost-per-incident}
  object: "An esports match VOD with a sponsor logo on the in-game scoreboard, caster desk and player jerseys, against a contract promising 20 minutes of logo exposure per match"
  situation: A league invoices 40 matches; the sponsor believes about a third of the on-screen time was cut by replays and ad breaks but has no count
  consequence: The brand pays for 800 contracted minutes while the broadcast delivers 540 and cannot prove it
  p_typical: 0.10
  grounded: quote
  evidence: "market.md section 5: 'Riot Games renewed esports reporting (relationship since 2019)' with Hatchet, and 'Search found no esports or in-game equivalent' of Relo Metrics"
  proposed: Per-match minutes of logo exposure by surface (scoreboard, jersey, desk) with timestamps, and a delta against the contract, as one PDF per invoice
  mechanism: Logo detector and surface classifier on broadcast VOD, grouped by on-screen surface, compared to the contracted minimum
  example: "Match 17: 11 min 20 s total exposure vs 20 min contracted; 9 min 30 s of replays carry the logo too small to read; credit note requested for 43%"
  cost: M
  depends_on: VOD access from the league or public, per-league overlay templates
  buyer: Head of sponsorship at a brand or its sports-marketing agency
  input: Esports VOD plus the sponsorship contract's exposure clauses
  why_existing_tools_cannot: "market.md section 5: Relo Metrics does broadcast sports but 'Search found no esports or in-game equivalent'; section 9 notes Hatchet covers audience metadata only"
  willingness_to_pay: "3 - Hudl is from USD 1,500 per program per year for traditional sports analytics (adjacent-usecases.md section 8); esports sponsorship measurement is not priced in the notes"

- id: brand-9
  title: Branded cosmetic screen-time counter in kill-cams and replays, counting seconds the skin is visible to other players, not the wearer
  level: L4
  cell: {buyer-role: brand-advertiser, video-source: console-share-and-platform-clips, signal-extracted: brand-logo-exposure, analysis-type: benchmark-vs-competitor, lifecycle-moment: season-or-battle-pass-start, delivery-form: dashboard, pricing-model: revenue-share, game-platform-and-genre: console, effort: requires-partner-or-platform-deal}
  object: "A brand-licensed jersey skin worn by characters in kill-cam and share clips from a console shooter"
  situation: A fashion brand co-sells a skin in a season pass; the publisher reports sales of the skin, but the brand wants seconds seen by others in clips, kill-cams and replays
  consequence: The collab is judged on skin sales alone, so the brand cannot prove the 5x cost of a premium licence is repaid in exposure
  p_typical: 0.06
  grounded: inferred
  evidence: "market.md section 4: Medal has about 10M MAU and users upload about 2B clips a year; Relo Metrics measures sponsor logos in video (section 5)"
  proposed: Count logo-bearing skin seconds per 1,000 shared clips and per kill-cam, split by self-view and other-view
  mechanism: Skin-specific detector on shared clips and kill-cams, plus attribution of whose character wears it, output as seconds and clip counts
  example: "Season report: skin appears 3.1 s in 7% of 40,000 sampled share clips, 83% of it in other-player view"
  cost: L
  depends_on: Platform clip access (console share or a clip service API), per-skin detector trained on 100-300 labelled frames, publisher approval
  buyer: Licensing manager at a fashion or sports brand
  input: Platform shared clips and kill-cam recordings, plus the cosmetic's catalogue ID
  why_existing_tools_cannot: "market.md section 4: Medal and General Intuition 'do not sell insight back to studios'; its clip API is auto-clipping and retrieval only, no brand analytics"
  willingness_to_pay: "2 - no price in the notes; Medal's value is as AI training data (reported $500M offer), so clip access is expensive and brand-side budget is unproven"

- id: brand-10
  title: Pre-signing placement check on a publisher's pitch build, measuring size and readability of the promised logo across 3 device resolutions
  level: L4
  cell: {buyer-role: brand-advertiser, video-source: publisher-pitch-builds, signal-extracted: brand-logo-exposure, analysis-type: automated-test-generation, lifecycle-moment: publisher-pitch-or-diligence, delivery-form: issue-tracker-ticket, pricing-model: per-build-or-release, effort: S-weeks, capture-trigger-and-sampling: scheduled-bot-playthrough}
  object: "The in-game billboard or product-placement prop shown in a pitch deck screenshot, versus the same prop on a 720p, 1080p and 1440p run"
  situation: A publisher pitches a brand a placement 'visible on every track'; the brand wants an independent bot run of 20 laps before paying a 6-figure fee
  consequence: The brand discovers after launch that the logo is under 1% of the frame on a mid-tier phone and unreadable
  p_typical: 0.05
  grounded: speculative
  evidence: "market.md section 3: nunu.ai agents are 'fully vision-based, taking a live stream from the device and issuing taps, swipes, keyboard input'; no source covers placement checks"
  proposed: Run a vision agent through 20 laps on 3 resolutions and output the logo pixel height and readable seconds per lap
  mechanism: Vision-based agent plays the build, a detector measures logo height in pixels and legibility by OCR on each lap
  example: "Report: logo 38 px tall on 1080p, 14 px on 720p (OCR fails), visible in 6 of 20 laps; brand renegotiates placement to a start-line arch"
  cost: M
  depends_on: Publisher pitch build access, an agent that can drive the game (nunu.ai-style), a logo detector
  buyer: Brand partnership manager or agency integration planner
  input: Bot-playthrough video of the pitch build at 3 resolutions plus the pitch placement mock-up
  why_existing_tools_cannot: "market.md section 3: modl.ai and nunu.ai agents test builds for bugs, not for brand placement; 'does NOT do' notes say no behaviour or marketing analysis"
  willingness_to_pay: "2 - nunu.ai reports QA cost down 30-50% (market.md section 3); the brand buyer pays a one-off fee, size not evidenced"

- id: brand-11
  title: Per-region creative check on server-swapped billboards, confirming the right brand variant renders in each of 6 regions
  level: L4
  cell: {buyer-role: brand-advertiser, video-source: cloud-gaming-server-render, signal-extracted: ad-render-and-viewability, analysis-type: ad-verification-and-fraud, lifecycle-moment: new-market-or-language-launch, delivery-form: alert-or-slack, pricing-model: per-audit-or-certification, processing-location: edge-or-platform-server, game-platform-and-genre: cloud-streamed}
  object: "A dynamically swapped billboard texture in a cloud-streamed game, where each region should show a different localised creative"
  situation: A global brand buys 6 regional variants for one placement; a CMS misconfiguration serves the US variant in 2 of the 6 regions for 4 days
  consequence: The brand pays for 12 region-days of wrong creative, one in the wrong language, and learns it from a user's screenshot
  p_typical: 0.04
  grounded: speculative
  evidence: "none; market.md section 9 only supports that platforms rendering sessions at scale hold a data asset others cannot get (platform-owner perspective)"
  proposed: Every 15 minutes a server-side frame grab per region compares the billboard with the contracted variant and posts a mismatch to Slack
  mechanism: Server-side frame capture at the render node, template match of the billboard region against the expected creative per region, alert on mismatch within one 15-minute cycle
  example: "Slack: region SG showing variant US-02 since 09:14 for 3 h 40 min; expected SG-01"
  cost: S
  depends_on: A cloud-gaming platform deal granting render-node frame access, placement coordinates per title
  buyer: Regional marketing lead at a global brand
  input: Cloud-render frames at the server plus the creative-variant map per region
  why_existing_tools_cannot: "market.md section 9: no vendor found that applies computer vision to production-player video from consumer devices; competitor-and-ua.md section 2 notes ad libraries cannot see inside the game"
  willingness_to_pay: "2 - no price signal in the notes; value tied to avoiding wasted media spend, small buyer pool, depends on a platform deal"

- id: brand-12
  title: Impression reconciliation audit that compares an ad network's reported impressions with frames captured on 0.5% of sessions
  level: L4
  cell: {buyer-role: brand-advertiser, video-source: own-players-consented-sdk, signal-extracted: ad-render-and-viewability, analysis-type: ad-verification-and-fraud, lifecycle-moment: ua-campaign-launch, delivery-form: per-cohort-report, pricing-model: per-audit-or-certification, capture-trigger-and-sampling: random-sample, value-lever-b2b: create-data-that-did-not-exist, buyer-org-type: agency}
  object: "One network's monthly report of 4,000,000 impressions for a brand's campaign, against frames from a 0.5% sample of the app's sessions"
  situation: An agency suspects that impressions fire when the ad view is created, not when it is shown, and sees no way to check without the app's own recording
  consequence: The brand pays CPM on a measured overcount that could be 10-30% and cannot argue the credit without evidence
  p_typical: 0.07
  grounded: inferred
  evidence: "competitor-and-ua.md section 2: 'Meta Ads Library is free, shows only active ads... no spend data' and AppLovin 'publishes no public competitor ad library'"
  proposed: Quarterly audit that returns the ratio of reported to observed impressions with a 95% interval and 20 example frames per discrepancy class
  mechanism: Frame classifier on sampled sessions counts ad-visible events, compared to the network's impression log by timestamp; ratios and intervals reported
  example: "Audit: 4.0M reported, 3.1M observed (95% interval 2.9-3.3M), 23% overcount, main class: ad closed before first frame rendered"
  cost: M
  depends_on: A cooperating app with capture SDK and consent, impression logs from the network
  buyer: Media agency audit lead for a brand advertiser
  input: Sampled own-player frames during ad slots and the network impression log
  why_existing_tools_cannot: "competitor-and-ua.md section 3: Segwise, Alison, Vidmob and Replai 'analyse the ad video plus network metrics (impressions, IPM, CPI)'; none compares those metrics with what the screen showed"
  willingness_to_pay: "3 - Segwise Pro $1,699/month for $250K-$500K ad spend (competitor-and-ua.md section 3); an audit at about 1% of spend is inferred"

- id: brand-13
  title: Earned-exposure valuation of a brand's in-game placement from organically shared clips, priced at a cost-per-view equivalent
  level: L4
  cell: {buyer-role: brand-advertiser, video-source: console-share-and-platform-clips, signal-extracted: brand-logo-exposure, analysis-type: creative-insight-for-ads, lifecycle-moment: live-event-or-update, delivery-form: weekly-digest-email, pricing-model: per-month-seat, effort: requires-partner-or-platform-deal, buyer-org-type: brand-advertiser}
  object: "Share-button clips from a sports game showing an in-stadium ad board, with views from a clip platform"
  situation: A telecom brand paid for stadium boards; 12,000 players posted clips in a month showing the board for about 2.5 s each, but nobody counted
  consequence: The brand ignores free earned media that, at $0.01-$0.05 per TikTok view (an unverified directory range), is worth thousands per month
  p_typical: 0.05
  grounded: inferred
  evidence: "competitor-and-ua.md section 5: Jestr pays per 1,000 views with 'typical cost per view cited at $0.02-$0.20 YouTube and $0.01-$0.05 TikTok (directory, unverified)'"
  proposed: Count clips, logo-seconds and view-weighted seconds, and convert to a cost-per-view equivalent
  mechanism: Logo detector on shared clips weighted by clip view counts, converted using a published cost-per-view range
  example: "Month 3: 12,000 clips carry the board, 8,400 views per clip median; equivalent paid-media value $7,100 at $0.07 per 1,000"
  cost: M
  depends_on: Clip platform data access (Medal retrieval API or console share data), view counts
  buyer: Brand sponsorship analyst
  input: Platform shared clips with view counts, board creative reference image
  why_existing_tools_cannot: "market.md section 4: Medal offers an auto-clipping API and a clip-retrieval API, 'No studio-facing analytics product or pricing found'; Hatchet counts viewers not logos"
