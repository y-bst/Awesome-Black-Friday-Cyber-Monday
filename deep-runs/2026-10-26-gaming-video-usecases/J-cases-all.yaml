    and tallying by hand, and it catches what transcript-only AI cannot: the tester who says "got it" and then merges the wrong tiles three times. PlaytestCloud''s AI uses the OpenAI API on transcripts
    and survey responses, not pixels, and keys on "think-aloud speech, not on visible behaviour" (market.md §1; methods-churn-funnel.md §2), so a say-versus-do mismatch count requires frame-level outcome
    detection that their stack does not have. It also builds the per-mechanic outcome detectors and labelled frames that every later live-player product needs, so it is the low-risk first sale that funds
