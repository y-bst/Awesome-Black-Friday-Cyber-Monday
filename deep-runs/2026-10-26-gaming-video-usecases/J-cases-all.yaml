- id: f2p-1
  title: 'Per-step FTUE drop-reason report: for every Progression funnel step losing >5% of starters, classify 50 abandoner clips into 6 reason codes and show 3 clips per code'
  buyer: Product lead / head of product owning D1 and FTUE at a mid-size mobile F2P studio
  input: SDK ring-buffer clips (480p, 5 fps) with touch overlay + GameAnalytics or Amplitude progression events keyed by user_id
  grounded: quote
  evidence: Unity's own tutorial lists only candidate causes ('a bug that crashes the game, or the level is too hard') ... unexpected drop-offs 'indicate good places to investigate' (methods-churn-funnel.md
    §1)
  scores:
    impact: 5.0
    confidence: 4.0
    willingness: 4.0
    cost: 3.0
    moat: 3.0
  case_a: Build this first because it answers the one question every mobile F2P product lead already asks every week and cannot answer. The buyer is the head of product who owns D1 and FTUE at a mid-size
    mobile studio. Today they get a GameAnalytics or Unity funnel that says tutorial step 3 lost 12%. Unity's own docs offer only "a bug ... or the level is too hard" and tell them to "investigate" (methods-churn-funnel.md
    §1). The report replaces the guess and the follow-up PlaytestCloud order. PlaytestCloud costs EUR 13.6k-33.9k a year for 120-240 sessions, about EUR 113-141 per analysed session (market.md WTP), and
    returns in 48 hours from recruited testers who are not the cohort that dropped. The founder can sell it on day one as a repackage of the existing User Test report on recruited footage, then switch the
    input to SDK clips of real abandoners, so the first revenue arrives before the SDK is finished. Incumbents cannot copy it quickly. PlaytestCloud's AI reads transcripts and surveys, not pixels, and has
    no link to production telemetry. Funnel vendors have no video. Game-engine session replay is screenshot-only or "alpha" (market.md §1, §2; methods-churn-funnel.md §6). The market.md gap map finds no
    vendor that joins live-player CV to retention.
  case_b: Explore later, do not build first. The live-player version depends on a production capture SDK (f2p-2) that does not exist yet. Apple's 2019 Glassbox action requires explicit consent and a visible
    recording indicator (methods-churn-funnel.md §7), so the consent prompt becomes one more FTUE step, and the players who opt in during their first session are the ones least likely to abandon. The reason
    codes are weaker than they look. Card dismissed in under 1 s, CTA not tapped, 3+ fails, app backgrounded and OS interruption can all be logged as events, and the methods note says so itself ("most of
    these can in principle be instrumented as events"). UXCam already ships rage-tap and unresponsive-gesture detection, and Amplitude sold EA the funnel-plus-Session-Replay pairing (methods-churn-funnel.md
    §1, §2, §6). That puts an analytics incumbent one game-canvas feature away. The "why" has to be inferred from behaviour with no think-aloud, and the per-title screen classifier trained on "a few hundred
    frames" is an INFERRED guess, not a measured accuracy. That makes it per-title setup work every time a studio signs. The price anchor (€113-141 per session) comes from research budgets for recruited
    panels. No note shows a product lead with a budget line for video evidence; that buyer's money currently goes to GameAnalytics and Amplitude seats. The proposed first ship, "repackage User Test on recruited
    footage", is already served by PlaytestCloud First Findings, which groups friction by theme and links each point to its clip (market.md §1).
- id: altdata-22
  title: 'White-label analyst workbench: the ask-question agent over the intel firm''s own analyst capture and bot capture, proposing feature tags with clip evidence for analyst confirmation'
  buyer: Head of research operations at a game-intelligence firm (GameRefinery/Liftoff Intelligence, Sensor Tower Live Ops team)
  input: analyst-recorded competitor gameplay video and voice notes, plus the firm's feature taxonomy
  grounded: quote
  evidence: 'competitor-and-ua.md section 1: GameRefinery ''runs on human analysts'' with ''about 260 features are tracked manually''; Liftoff ''library of 2,500+ game feature deconstructions''; Sensor
    Tower Playliner logs ''hundreds of hours'' of playtime.'
  scores:
    impact: 4.0
    confidence: 4.0
    willingness: 4.0
    cost: 1.0
    moat: 2.0
  case_a: 'This should be first on speed of revenue: it is an XS repackage of the User Test ingestion and the ask-question agent, sold per analyst seat to a buyer with a large manual bill. The buyer is
    the head of research operations at a game-intelligence firm (Liftoff Intelligence/GameRefinery, Sensor Tower''s Live Ops team). GameRefinery''s analysts play games and tag about 260 features by hand.
    The firm keeps 2,500+ deconstructions, and Playliner logs "hundreds of hours" of play with "no collection tooling named" (competitor-and-ua.md §1). The workbench replaces the analyst scrubbing hours
    of their own recordings to fill taxonomy fields. The analyst keeps the accept/reject step, so the firm keeps its human-verified label quality, which is what it sells. The price anchor is the analyst
    headcount behind products that sell at $45-51k/yr (GameRefinery) and $29.5k-$115k/yr (Sensor Tower, median $75k) (competitor-and-ua.md §1, §8). A seat tool cheaper than one analyst is an easy budget
    decision. These firms have no gameplay-video tooling of their own: their only automated tagging reads store metadata (51 features), not gameplay. Building ingestion, transcription and a grounded clip-returning
    agent would take them quarters, and they could buy us instead. A single logo here also opens the white-label channel that competitor-and-ua.md §8 names as the natural route to the intel buyer.'
  case_b: Defer. Cheap to build, but also cheap to copy, and the market is about three logos. The named buyers are Liftoff/GameRefinery and Sensor Tower/Playliner, plus perhaps AppMagic (competitor-and-ua.md
    §1). Both of the big two are acquisitive, well-funded firms. Vungle bought GameRefinery explicitly for image recognition and creative tagging, and a generic Gemini video call (1 FPS, about 6 h in context)
    already gets most of the way to "propose tags with timestamps". That is why moat scores 2. Human-verified deconstruction is the product these firms sell, so an outside vendor sitting inside that loop,
    holding their taxonomy and footage, is a procurement and IP hurdle, not a quick seat sale. The WTP line borrows the $45-115k/yr end-customer contract price, but no note shows these firms buying external
    analyst tooling at all; "no collection tooling is named" is an absence, not demand. Accuracy is unproven for this task. Many of the 260 features (meta loops, economy depth) never appear in a single
    2-hour session, and VLMs are "substantially" weaker on temporal events (methods-churn-funnel.md §4). Analysts would still verify every tag, so the "days to hours" target is unsupported.
- id: design-18
  title: 'Soft-launch ''levels to retune'' package: analyst plus AI reviews about 500 fail clips across Levels 1-60 and delivers 10 ranked levels, each with a proposed change and 5 clips, in 5 working days'
  buyer: Game director or lead designer at a mid-size studio in soft launch
  input: event-triggered fail clips from soft-launch players + progression events
  grounded: inferred
  evidence: most results within 48 hours (market.md §1); median D1 about 22%, P75 just above 30% (methods-churn-funnel.md §1)
  scores:
    impact: 4.0
    confidence: 4.0
    willingness: 4.0
    cost: 2.0
    moat: 3.0
  case_a: 'Sell this first because the founder can run it with an analyst next week, and it lands on the most expensive decision a mid-size studio makes: go or kill in soft launch. The buyer is the game
    director or lead designer of a mid-core title in soft launch, with D1 at 24%. The 2026 GameAnalytics benchmark puts median D1 at about 22% and P75 just above 30% (methods-churn-funnel.md §1), so this
    is the zone where the UA budget is either released or cut. The package gives a fixed-scope deliverable in 5 working days: 10 ranked levels, each with a proposed tuning change and 5 clips. It replaces
    weeks of designer guesswork and the extra recruited PlaytestCloud rounds bought at EUR 113-141 a session within EUR 13.6k-33.9k/yr contracts (market.md WTP). A managed project is priced per build, so
    it does not need a procurement cycle for a new SaaS line. The analyst covers the accuracy gap while the clustering model improves, and each project produces labelled fail clips that later feed the self-serve
    product. PlaytestCloud cannot copy it quickly: its panel is recruited testers with "no churn or retention link to production telemetry", and its AI reads speech, not frames (market.md §1). Funnel vendors
    have the fail counts and no footage (methods-churn-funnel.md §1).'
  case_b: Drop as a first product; at most a delivery wrapper on f2p-1/design-2 later. It is grounded only by inference (p_typical 0.09). The cited evidence is a turnaround time and a D1 benchmark. No note
    shows a studio buying a "levels to retune" package. The "which levels" half is already served. GameAnalytics progression funnels give per-level Fail/Complete ratios and are recommended for spotting
    "where difficulty spikes may cause churn", and Rovio/Aalto predict per-level difficulty and churn without any players (methods-churn-funnel.md §1, §3). Only the "why" is new, and about 500 clips over
    60 levels is roughly 8 clips a level, too few to carry a "64% of clips" claim. The figures in the example, such as "expected fail -15%", are invented. Delivery needs a capture SDK and consent flow inside
    the soft-launch build before launch, while the sales cycle has to fit a soft-launch window of a few weeks. The analyst-led managed service has services margins and does not use the founder's automated
    stack as its edge. PlaytestCloud can put L23 in front of recruited testers in 48 hours as it stands.
- id: design-2
  title: Clip reel of each churned player's last failed attempt per level, for the 10 levels with the most 'quit without completing' 7-day churners
  buyer: Lead designer at a mobile casual or midcore F2P studio
  input: 60 s ring buffer per attempt from consented own players + level and session events for the churn label
  grounded: inferred
  evidence: 'Real pass rate vs churn: Spearman r = -0.144; vs ''churn without completing the level'': r = -0.586 (methods-churn-funnel.md §3)'
  scores:
    impact: 4.0
    confidence: 4.0
    willingness: 4.0
    cost: 3.0
    moat: 3.0
  case_a: Build this first because it is the one option whose core claim rests on published evidence that churn sits in specific failure moments. In the Aalto/Rovio study, pass rate barely correlates with
    churn (r = -0.144), but "churn without completing the level" does (r = -0.586) (methods-churn-funnel.md §3). The buyer is the lead designer at a casual or mid-core mobile F2P studio. The clip reel puts
    in front of them the last failed attempt of each 7-day churner on the 10 worst levels, so they can tell "too hard" from "bug" or "didn't see the key tile". Those are the two causes Unity's docs leave
    open. The reel replaces guesswork and generic session replay. EA paired funnels with Session Replay and cut onboarding time by 30% (methods-churn-funnel.md §1), which shows buyers pay for the "why".
    The price anchor is PlaytestCloud at about EUR 113-141 per analysed session. Real churners' clips are worth more, because no recruited panel can produce them. The capture design is cheap and privacy-light.
    It keeps a 60 s ring buffer per attempt on the device, holds it until the churn label resolves, and uploads about 15 MB on Wi-Fi only for churners. This is the Sentry on-error pattern keyed to churn
    (methods-churn-funnel.md §6, §7). Incumbents cannot copy it quickly. Sentry keeps the buffer only on errors, PostHog's Unity replay is screenshot-only "alpha", IV Metrics caps customers at 50-100 human-reviewed
    videos, and no paper or vendor predicts churn from human gameplay frames.
  case_b: The mechanism has a likely fatal flaw, so explore, do not build. The design holds the last-attempt clip on the device "until the 7-day churn label resolves". But a churned player by definition
    does not open the app for those 7 days, so the game never runs to upload it. Many churners uninstall, which deletes the buffer, and iOS background upload is limited. The clips arrive mainly from players
    who came back, who are by definition not churners. The fix is to upload every session's last attempt eagerly and discard later. That brings back the bandwidth, Wi-Fi-wait and consent cost the option
    was meant to avoid (methods-churn-funnel.md §7). The anchor statistic (Roohi r = -0.586) comes from simulated agent populations on Angry Birds levels. It links churn to failure moments, not to anything
    a clip can explain. A clip reel is human viewing, and IV Metrics already records rendered Unity gameplay video with touch overlay for $49-99/month (market.md §2). It is one "trigger on level fail" setting
    from this, and that price sets the WTP ceiling far below 4. The EA 30%-onboarding evidence belongs to Amplitude, an incumbent.
- id: vendor-10
  title: 'Supplier to a market-intel firm: automated live-event logger that turns the firm''s analyst playthrough recordings into rows (event type, start date, offer price, currency)'
  buyer: Head of product data at a market-intelligence vendor (Sensor Tower, Liftoff Intelligence/GameRefinery, AppMagic class)
  input: Recorded daily playthroughs of tracked games (bot or analyst), plus the firm's game catalogue and event taxonomy
  grounded: quote
  evidence: 'competitor-and-ua.md section 1: Sensor Tower bought Playliner, whose team logs ''hundreds of hours'' of playtime across 230+ games; ''No collection tooling is named''; adjacent-usecases.md
    section 7: ''gathering takes large human resources''.'
  scores:
    impact: 4.0
    confidence: 4.0
    willingness: 4.0
    cost: 3.0
    moat: 3.0
  case_a: 'Put this first if the founder wants one large contract over many small ones. The buyer is the head of product data at Sensor Tower, Liftoff Intelligence/GameRefinery or AppMagic. All three already
    sell live-ops coverage that is collected by hand. Playliner logs "hundreds of hours" across 230+ games with no named tooling. GameRefinery documents 35+ event types as analyst screenshots and comments.
    The trade press says gathering "takes large human resources", because events cannot be scraped (competitor-and-ua.md §1; adjacent-usecases.md §7). The logger replaces that play-and-screenshot work with
    a daily warehouse table (event type, first/last seen, offer price, currency, screenshot URL). Analysts review only the low-confidence rows. That can take coverage from about 230 games to 2,000 without
    10x headcount. The price anchors are strong. The firms'' end-customer contracts run $29.5k-$115k/yr. Sensor Tower spent on three acquisitions in 2024-25 (data.ai, about $300M by one estimate; Video
    Game Insights; Playliner), all to extend coverage (competitor-and-ua.md §1, §8). The underlying parts are mature: screen classification, OCR on clean store UI and price parsing (methods-churn-funnel.md
    §4). These firms have not built it, though. Their automated tagging reads store metadata and ad creatives, not recorded gameplay, and no source shows any vendor extracting events or prices from gameplay
    video.'
  case_b: Defer. Capture is the hard, unsolved part, and the founder's existing assets do not cover it. Logging live events across 2,000 games every day means someone or something has to play each game
    daily, progressed far enough to unlock event shops, in each region. Live events "are announced without notice and cannot be scraped" (adjacent-usecases.md §7). No note shows bot playthroughs reliably
    reaching gated live-ops screens in live F2P games. nunu.ai and Cradle prove that agents can play, not that this works at fleet scale. Botting competitor titles also raises ToS problems. Ingestion and
    reporting, the parts the founder already has, are the easy part. The buyer pool is the same two or three intel firms as altdata-22 (it is also a variant of compintel-18). Sensor Tower just bought Playliner
    for this function and could extend it in-house. The acquisition prices cited (data.ai about $300M) value data businesses, not suppliers of tooling, so they do not show that a tooling vendor gets paid.
    OCR on stylised event and store fonts is a stated weak point (methods-churn-funnel.md §4), and localised price parsing at 2,000-game scale would push many rows to "low confidence". That erodes the claimed
    labour saving.
- id: cfo-1
  title: 'Per-session playtest swap: consented-SDK FTUE clips of own players analysed at under EUR 2 each, sold as a line-item replacement for PlaytestCloud tokens at EUR 113-141 each'
  buyer: CFO or VP Finance at a mobile-midcore-f2p mid-size studio that already holds a playtest contract
  input: own-player screen video (first 10 min, 2% sample) + telemetry tutorial-step events + touch input
  grounded: quote
  evidence: 'market.md section 1: ''Basic tier works out to roughly EUR 113 per recorded player-session''; methods-churn-funnel.md section 7: 1.8 GB/hour stored costs about $0.04/month in S3'
  scores:
    impact: 4.0
    confidence: 4.0
    willingness: 4.0
    cost: 3.0
    moat: 2.0
  case_a: 'Build this first because it is the only option where the buyer already holds a signed budget line and the sale is a price comparison. The buyer is the CFO or VP Finance at a mid-size mobile F2P
    studio. That studio already pays PlaytestCloud EUR 13,560-33,900 a year for 120-240 recorded sessions, about EUR 113-141 per session (market.md section 1, Signals of willingness to pay). The cost of
    capture is negligible: one stored player-hour costs about $0.04 a month in S3 (methods-churn-funnel.md section 7). So a per-session quote below EUR 2 turns 120 sessions a year into 6,000+ for the same
    renewal, and those sessions come from real installs, not paid panellists, whose incentive disputes degrade quality (market.md section 1). It replaces the playtest token line, and it reuses the ingestion,
    transcription and report agent the founder already ships, so most of the work is the capture SDK and a small per-title screen classifier, which is mature technology (button and popup detection about
    90% mAP, methods-churn-funnel.md section 4). PlaytestCloud cannot copy it quickly for two reasons. Its AI reads transcripts and surveys, not pixels. And its business is a recruited panel sold by the
    token, so pricing analysed live-player sessions at EUR 2 would cannibalise its own EUR 113 unit (market.md section 1 ''Does NOT do'', section 9 gap map). This is also the FTUE capture base that f2p-9
    and publisher-2 build on, so selling it first pays for the platform.'
  case_b: 'Drop it as a standalone option. It is f2p-1 with a pricing claim attached, and the swap compares two different products. PlaytestCloud''s EUR 113-141 buys recruited testers talking aloud on prototypes,
    concepts, kids'' and competitor tests before launch (market.md §1). Consented SDK clips exist only once a build has live installs, and they carry no speech, so the "why" has to be inferred from behaviour
    alone (methods-churn-funnel.md §2 INFERRED). A research lead will not give up the pre-launch panel for this, so for most studios it is an extra cost, not a replacement. The CFO is also the wrong buyer.
    A EUR 13.6k line item gets renewed by the research or product team. And the SDK needs the engine lead''s approval plus an iOS consent prompt with a visible recording indicator (methods-churn-funnel.md
    §7, Apple 2019). Neither of those is a finance decision. The EUR 1.80 price leaves out the per-title screen classifier each game needs (methods-churn-funnel.md §4 INFERRED). Once you sell "per recorded
    session from live players", the price comparison becomes IV Metrics at $49-99/month and UXCam at about $21k/year (market.md §2), not PlaytestCloud. The example''s "41% never saw the booster button"
    also claims more than video shows: you cannot see where a player is looking without eye tracking. The eye-tracking work in methods-churn-funnel.md §2 shows players miss things that are plainly on screen.
    Moat is scored 2. PlaytestCloud already links each friction point to its clip in First Findings, so adding an SDK intake is a short step for it.'
- id: tns-1
  title: Report button auto-attaches a 90-second ring-buffer clip with kill-feed and player-name OCR to the moderation ticket
  buyer: Trust and safety lead at a mid-size or AAA studio running a competitive multiplayer title
  input: Consented on-device screen video (ring buffer) plus the report payload (reporter ID, accused ID, match ID)
  grounded: quote
  evidence: 'adjacent-usecases.md section 3: ''only about 23% of player reports contained actionable evidence''; section 9: ''NOT FOUND: no off-the-shelf vendor of a rolling last-30-seconds game-client
    buffer attached to a ticket'''
  scores:
    impact: 4.0
    confidence: 4.0
    willingness: 4.0
    cost: 4.0
    moat: 3.0
  case_a: 'Build this first because the research names a measured, expensive failure with no product against it. In the Activision/Modulate case only about 23% of player reports carried actionable evidence,
    so roughly 77% of the moderation queue cannot be decided (adjacent-usecases.md section 3). The buyer is the trust-and-safety lead at a mid-size or AAA studio running a competitive multiplayer title.
    That budget line is real and large: Modulate''s public tiers run up to USD 20,000 a month for voice moderation alone, and third parties report USD 10-50k monthly minimums for AAA (adjacent-usecases.md
    section 3). Today studios replace the missing footage by asking players to record and attach video by hand, as the Resolution Games and Arrowhead support pages show. The research states plainly ''NOT
    FOUND: no off-the-shelf vendor of a rolling last-30-seconds game-client buffer attached to a ticket'' (adjacent-usecases.md section 9). Incumbents cannot copy it quickly. Modulate and GGWP are voice
    and text pipelines that never see the screen. Fullview and Screendesk are browser tools. Medal clips on the player''s PC with no ticket or OCR link (market.md section 4). Upload happens only on Report,
    which keeps bandwidth and consent cost low (methods-churn-funnel.md section 7 ring-buffer pattern). It sells as a per-report or per-MAU add-on next to the voice contract, and the same ring buffer later
    serves support and QA tickets.'
  case_b: 'Explore later, do not lead with it. The headline number is borrowed. "Only about 23% of reports contained actionable evidence" comes from a Modulate case study on voice-chat reports (adjacent-usecases.md
    §3). It is not a measure of gameplay-cheat reports, and voice already has a paid evidence tool. For cheating, the notes show operators rely on server-side ML on inputs, timing and recoil (Riot, Activision,
    FACEIT; adjacent-usecases.md §2). That data already covers every match without client video. The client clip is also the evidence a cheater can most easily tamper with, because it is recorded on their
    own machine. False accusation is the stated risk: FACEIT will not ban on its own ML flag alone. So a 90 s clip does not make a report decidable on its own. The mechanism also depends on the weakest
    parts of the vision stack. HUD OCR is unreliable on stylised low-res fonts (Q3Vision), and temporal events such as a 180-degree flick are "substantially harder" for VLMs than single-frame ones (methods-churn-funnel.md
    §4). The capture cost is real too. An always-on encode in a competitive shooter competes for frame time and needs CTO sign-off. The buffer records other players'' names and chat, which are third-party
    data (methods-churn-funnel.md §7). Medal''s auto-clipping API already saves event-triggered clips on PC (market.md §4), and GGWP already ingests anti-cheat data (adjacent-usecases.md §3). Either is
    one integration away from this. The notes give no price signal for evidence packs (adjacent-usecases.md: anti-cheat "None published").'
- id: f2p-9
  title: 'Soft-launch comprehension read by market: compare FTUE reason-code mix for 300 consented first sessions each in Philippines, Canada and Brazil to tell ''FTUE problem'' from ''wrong market'' before
    go/kill'
  buyer: Product lead and studio head at a mobile F2P studio in soft launch
  input: Consented first-session clips per market + D1 per market + device model
  grounded: inferred
  evidence: 'market.md section 1 VERIFIED: PlaytestCloud tokens ''other methods or advanced targeting from 1.5 tokens'' (inference: market-targeted recruited panels are bought today; here applied to real
    soft-launch installs)'
  scores:
    impact: 5.0
    confidence: 3.0
    willingness: 4.0
    cost: 2.0
    moat: 3.0
  case_a: 'Build this first because it attaches to the most expensive decision a mobile F2P studio makes, the soft-launch go/kill, and nothing in the market answers the question it answers. The buyer is
    the product lead and studio head of a title in soft launch. Their numbers sit in the ambiguous band, 24% D1 in one market and 31% in another, against GameAnalytics'' 22% median and 30% P75 (methods-churn-funnel.md
    section 1). Funnels give per-market drop counts and stop at ''investigate''. Playtest panels recruit testers rather than the actual soft-launch audience of the Philippines or Brazil, so neither tool
    can tell ''FTUE problem'' from ''wrong market'' (market.md section 1, methods-churn-funnel.md section 1 INFERRED). The price anchors are EUR 113-141 per analysed playtest session, with targeted recruiting
    at 1.5 tokens (market.md section 1), and the $45-51k a year studios pay GameRefinery for market intelligence (competitor-and-ua.md prices). So a per-game report on 900 sessions across three markets
    sells easily in the five figures. It is S effort once the FTUE classifier from cfo-1 exists: the same capture, sliced by market with confidence intervals. Incumbents cannot copy it. PlaytestCloud has
    no live-install capture and no retention link, and analytics vendors have no pixels (market.md section 9 gap map).'
  case_b: 'Defer. This is a report view on top of f2p-1, and it also depends on an unbuilt consent-bias calibration (f2p-20). Its own scores flag it as thin: p_typical 0.06, grounded "inferred". The only
    evidence cited is that PlaytestCloud charges more tokens for advanced targeting. No note shows anyone buying a per-market FTUE read. Sample size is the first problem. 300 consented first sessions per
    market within 10 days needs thousands of soft-launch installs per market at realistic opt-in rates. Split across 6 reason codes and several steps, each cell gets a few dozen clips, so the confidence
    intervals will be too wide to settle a go/kill. Opt-in rates also likely differ by market, which confounds the very comparison being sold. The notes say nothing about whether D1 gaps between markets
    come from FTUE comprehension rather than audience mix. The example''s actual cause, device latency, can be found from device model plus telemetry or GameBench (adjacent-usecases.md §6), without video.
    Finally, there is no think-aloud in any language, and the classifier is trained per title, so Brazil vs Canada differences in reading UI text will not show up in pixels-plus-taps.'
- id: publisher-2
  title: 'Soft-launch week-2 go/kill memo: 300 first sessions from the test market split into ''quit on a fixable screen'' vs ''quit after free play began'', 3 clips per bucket'
  buyer: Head of publishing / CFO who signs off soft-launch UA budget at a publisher
  input: Event-triggered 90 s clips at first session end from 1-5% of soft-launch installs plus D1/D7 return flags
  grounded: inferred
  evidence: 'Rovio/Aalto: real pass rate vs churn r = -0.144; vs ''churn without completing the level'' r = -0.586 (methods-churn-funnel.md §3)'
  scores:
    impact: 5.0
    confidence: 3.0
    willingness: 4.0
    cost: 3.0
    moat: 3.0
  case_a: Build this first because it turns video into a one-page decision that a publisher's finance head signs, and the evidence says the signal exists. Rovio and Aalto found churn correlates only weakly
    with level pass rate (r = -0.144) but strongly with 'churn without completing the level' (r = -0.586) (methods-churn-funnel.md section 3). That means the last 60 seconds before a player's final close
    are the diagnostic moment, and only a clip shows them. The buyer is the head of publishing or CFO who releases soft-launch UA budget. Today that call rests on D1, D7 and CPI alone, so fixable FTUE titles
    get killed and rejected core loops get eight more weeks of spend. The memo replaces both that guess and the recruited-panel playtest. Those playtests cost EUR 1,130-2,825 a month with 'no churn or retention
    link to production telemetry' (market.md section 1 'Does NOT do'). A per-soft-launch price of $8-15k is small next to one wasted UA cycle, and publishers run many soft launches, so it recurs. No incumbent
    can produce the 'fixable screen versus core-loop rejection' split. Funnels show where, not why (methods-churn-funnel.md section 1). No paper or vendor predicts churn from human gameplay frames (methods-churn-funnel.md
    section 3), so the founder would own the benchmark of bucket shares against eventual outcomes.
  case_b: Defer, and merge with f2p-9 rather than ranking both. They are the same soft-launch read sold to two buyers. The rules in the memo (above 50% fixable means iterate, below 20% means kill) are made
    up. The notes contain no study linking these buckets to outcomes after a relaunch. The Rovio r = -0.586 it rests on comes from simulated agents on Angry Birds levels, not from footage of real players
    (methods-churn-funnel.md §3). Mechanically, "the last 60 s before the final app close" is only known to be final days later. So every session end in the sample has to be buffered and uploaded, then
    joined to D1/D7 flags. With a 1-5% opt-in sample, the non-returners you most need are the players least likely to accept a recording prompt. The publisher also does not own the build. The developer
