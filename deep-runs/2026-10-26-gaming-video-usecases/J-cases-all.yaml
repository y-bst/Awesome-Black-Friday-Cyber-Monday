    the ad and network metrics, and "none links an ad element to what the acquired player did on device in the first session" (competitor-and-ua.md §3). The demand is stated by buyers, not inferred: GeekLab
    says it is "hard to see which creative acquired players who later retain and pay, especially on iOS", and FoxData reports fail-state hooks lead across 10,000+ ads, so the problem hits the most common
    creative pattern (competitor-and-ua.md §3). It replaces two expensive mistakes at once: product rewriting an FTUE for a problem the creative caused, and UA continuing to buy a low-CPI creative that
    brings in players who hunt for a mechanic the game does not have. The price anchors are strong: UA teams pay Segwise $499-1,699/month on spend-based tiers, agencies charge EUR 363-500 per AI video and
    $3,000-5,000 per playable, Sett raised $57M and Replai claims $5B/year of ad spend on this demand (competitor-and-ua.md §3, §8; market.md WTP), so a per-creative cohort report priced against media spend
    lands in an existing line. Incumbents cannot copy it quickly because creative-intelligence vendors have no capture on the player''s device, no consent flow and no gameplay classifier, and analytics
    vendors have no ad-element taxonomy; joining MMP creative ID to first-session video behaviour requires both, which is exactly the moat score this option earned (4 of 5). Starting on Android, where creative
