    Segwise already connects to AppsFlyer, Adjust, Branch and Singular and tags hooks (competitor-and-ua.md §3). Adding "D1 by hook tag" is one feature flag for Segwise and would show that fail-state hooks
    retain worse without any video. The behavioural classifier is weak: new players swipe the map and tap scenery whether or not an ad misled them. The D1 gap can also come from a different audience that
    the creative reached rather than a broken promise. The incentive problem is the biggest. UA teams buy misleading creatives knowingly because the CPI maths works, so evidence that the ad over-promised
    often changes nothing. The demand rests on vendor claims (FoxData) and one GeekLab complaint. It has p_typical 0.06 and depends on f2p-2, which is not built.

    '
