    four-year-old vendor story about designing a tutorial, not about choosing between prototypes at greenlight (methods §2). PlaytestCloud already owns the panel, the customers and the per-session budget
    (EUR 113-141, market.md §1). Gemini takes video input natively (competitor-and-ua.md §1), so adding a frame check to transcript AI is one feature for PlaytestCloud. And at greenlight, budgets are small
    and decisions rest on judgement, so the buyer will not pay extra for a count they could make themselves.

    '
