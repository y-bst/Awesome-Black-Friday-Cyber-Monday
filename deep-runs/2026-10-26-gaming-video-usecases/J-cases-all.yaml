  scores:
    impact: 4.0
    confidence: 4.0
    willingness: 3.0
    cost: 2.0
    moat: 2.0
  case_a: 'Build the build-diff alert first because it is the cheapest thing on the list that sells a number the buyer already tracks: the product lead and release owner at a mobile F2P studio shipping
    weekly watches D1 by build every Monday, and today a 2 pp drop on a build that only changed popup art is invisible to the funnel, because a step with no event "does not exist in the data" and Unity
    funnels cannot be edited without "invalidating any existing data" (methods-churn-funnel.md §1). The alert replaces the blind rollback or the week of waiting for D1 to settle, and at 100k installs/day
    each day of a 2 pp drop is roughly 2,000 lost day-1 players, so one caught regression pays for a year of the product. Effort is S-weeks: it reuses the f2p-1 reason-code classifier, needs only build
    version in clip metadata, and runs on the first 500 event-triggered clips of the new build, which fits the ring-buffer sampling pattern Sentry already established for errors (methods-churn-funnel.md
    §3, §7) and avoids the upload problem of full capture. The price anchor is the FTUE outcome budget analytics vendors already sell into (FunCraft +40% D1, EA 30% faster onboarding; methods-churn-funnel.md
    WTP), and it is naturally priced per build or as an add-on seat to the per-step report, so it lifts contract value with no new buyer. Incumbents cannot copy it quickly because GameAnalytics, Unity and
    Amplitude compare instrumented event counts, while mainstream replay tools reconstruct native UI trees and are "alpha" or screenshot-only on game canvases (PostHog Unity; methods-churn-funnel.md §3);
    a per-screen dwell and tap-latency diff needs a per-title UI-state classifier on rendered pixels, which none of them has. A Slack post with three before/after clip pairs within 24 h of rollout is also
    the most demo-able wedge the founder can show in a sales call.'
  case_b: 'Build this later, as a feature of f2p-1, and do not sell it first. It has no classifier of its own: it diffs the reason codes from f2p-1 and is listed as a variant of ds-14, so it cannot ship
    or be priced before those exist. The motivating scenario is invented (grounded: inferred, p_typical 0.07). The only evidence is an INFERRED line in methods-churn-funnel.md §1 saying un-instrumented
    steps are missing from the data. The cheap incumbent fix is one event: add popup-shown and popup-dismissed events to the build. And Amplitude already pairs funnels with session replay for exactly this
    "why" (the EA case, methods §1), so an analytics vendor is one feature away. The 24-hour promise also fights the capture limits. To get 500 triggered clips from a new build in a day, the studio has
    to record a large consented cohort of live players. iOS requires explicit consent and a visible recording indicator, and uploads wait for Wi-Fi (methods §7). A 30% shift threshold on dwell will also
    fire on every intended art or content change, so release owners will start ignoring the Slack channel. Finally, the willingness-to-pay line cites FTUE outcome case studies (FunCraft, EA), not anyone
    paying for build-regression alerts, so the price is not supported.

    '
