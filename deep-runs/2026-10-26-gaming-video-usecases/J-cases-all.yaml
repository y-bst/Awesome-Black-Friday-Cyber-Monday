    in video they show up as a change in dwell and transitions. The anchor is the release-regression budget performance vendors already sell into: HeadSpin sold Zynga, Jam City and Bandai Namco on the claim
    that "over 30 per cent" of players left over a bad experience, and GameBench sells enterprise SDKs to studios (market.md section 3; adjacent-usecases.md section 6). Pricing per release or per title
