  cost: M
  depends_on: "An emulator or platform partner with an opt-in consent flow; a join key from platform account to the studio's install ID (MMP or login ID)"
  buyer: "Product lead pays; CTO or engine lead at a mobile F2P studio is the approver who has nothing to block"
  input: "Emulator-captured video of opted-in players plus emulator input log; studio telemetry joined by install ID"
  why_existing_tools_cannot: "market.md section 2: IV Metrics, PostHog and UXCam all need an SDK inside the game, and PostHog Unity is screenshot-based; no vendor in market.md captures without touching the binary"
  willingness_to_pay: "4 - IV Metrics charges $49-99/month for SDK-based gameplay video and PlaytestCloud about EUR 113 per recorded session (market.md 'Signals of willingness to pay'); removing the integration step removes the CTO veto that blocks both"

- id: cto-2
