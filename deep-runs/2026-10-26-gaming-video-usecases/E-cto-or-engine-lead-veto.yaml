  grounded: inferred
  evidence: "market.md section 9: 'No vendor found that applies computer vision to production player gameplay video from consumer devices'; methods-churn-funnel.md section 7 (c): 'UI-state recognition does not need 30 fps 720p'"
  proposed: "Emulator-side recorder that encodes 1 fps 480p from the compositor for players who opted in inside the emulator client, keyed to the package name, delivered to the studio per cohort"
  shallow: false
  mechanism: "The platform taps its own compositor output and input log, samples 1 fps at 480p, runs UI-state classification in its cloud, and sells per-title FTUE step reports to the studio; nothing changes in the game binary"
