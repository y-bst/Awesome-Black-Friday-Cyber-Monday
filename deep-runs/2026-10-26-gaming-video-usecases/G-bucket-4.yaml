- id: rating-13
  title: 'Monetising-on-frustration check: offer popups opening within 3 s of the 4th consecutive fail screen, measured by cohort'
  level: L4
  cell:
    buyer-role: rating-and-consumer-compliance
    video-source: own-players-consented-sdk
    signal-extracted: ui-state-and-screen-flow
    analysis-type: cohort-comparison
