- id: vendor-6
  title: 'Visual soft-lock event for a crash-reporting SDK: loading spinner or frozen frame > 20 s with no error is reported as an issue with the last 60 s of video'
  level: L4
  cell:
    buyer-role: white-label-vendor
    video-source: own-players-consented-sdk
    signal-extracted: load-and-wait-screens
    analysis-type: anomaly-alert
    delivery-form: issue-tracker-ticket
    capture-trigger-and-sampling: on-crash-or-anomaly
    companion-data: crash-and-error-logs
    buyer-org-type: analytics-or-mmp-vendor
    processing-location: on-device
  object: Sentry mobile replay `onErrorSampleRate` (recommended 1.0) buffers and uploads only if an error occurs, keeping about the last minute (methods-churn-funnel.md section 6)
  situation: A game hangs on a loading screen after a server timeout; no exception fires, so the error-triggered buffer never uploads
  consequence: Crash-free-sessions stays at 99.8% while players kill the app on a stuck spinner; the crash vendor's dashboard shows nothing
  p_typical: 0.06
  grounded: inferred
  evidence: 'methods-churn-funnel.md section 6 INFERRED: ''the same pattern keyed on churn-relevant triggers (tutorial step abandon, app kill on fail screen, N fails in a row, first session end) is the
