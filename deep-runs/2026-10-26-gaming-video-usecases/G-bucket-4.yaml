  depends_on: consented clip capture on trigger; fail and offer events
  buyer: Compliance lead, jointly with the monetisation lead, at a mobile F2P publisher
  input: Event-triggered clips around fails plus purchase events
  why_existing_tools_cannot: Funnels show where not why (Unity docs, methods-churn-funnel.md WTP complaints) and fail-and-offer timing needs the on-screen order of overlays that telemetry often misses (methods-churn-funnel.md
    s2 INFERRED).
  willingness_to_pay: '2 - anchor: PlaytestCloud''s USD/EUR 113-141 per session shows what a why-answer costs (market.md s1) and a sample of 100 clips as a USD 1,000-3,000 study; the buyer tension is that
