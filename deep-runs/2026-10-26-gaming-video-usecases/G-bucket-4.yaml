  example: Declared 'no simulated gambling'; 11 moments of a reel-spin animation with currency spend; report lists 3 clips and the answer to change
  cost: M
  depends_on: A full-playthrough capture and the studio's declared answers as structured data
  buyer: Release manager or compliance lead at a publisher
  input: QA playthrough video of the shop and event screens plus build metadata (declared rating answers)
  why_existing_tools_cannot: 'adjacent-usecases.md section 4: no AI product audits footage against compliance lists (accessibility case); no note lists a vendor doing content-rating classification from
    footage'
  willingness_to_pay: '2 - speculative: no price in notes; the human equivalent is an audit, MGATS prices by 150-250 testing hours (adjacent-usecases.md section 4)'
