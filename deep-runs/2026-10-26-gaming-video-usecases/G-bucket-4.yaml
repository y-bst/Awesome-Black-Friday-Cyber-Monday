  object: a regulator or counsel request for 'all versions of the store screen shown between March and August'; the 'Gameplay telemetry and video acquisition system' patent shows synchronised capture is
    a known pattern (methods-churn-funnel.md s6)
  situation: a consumer authority asks for every version of the pull screen shown to players in 2 regions across 19 builds; engineering has 4 builds archived and no screenshots
  consequence: the studio cannot prove what players were shown; reconstruction by hand costs 2-3 weeks of an engineer
  p_typical: 0.07
  grounded: speculative
  evidence: 'none in notes on enforcement; related: ''evidence pack'' use cases for bans (B-perspectives trust-and-safety-lead) and bug reports with video attached (adjacent-usecases.md s1).'
  proposed: per CI build, bot captures 40-120 key screens in each region, stores them with a SHA-256 chain and a build id, and exports a dated PDF and ZIP
  shallow: false
  mechanism: CI-triggered bot run; keyframes, build id, locale and timestamp stored append-only with hashes; search by screen type. Changes from reconstruction after the request to a standing archive.
  example: 'Request for the starter-pack screen in Brazil during Q2: 6 builds and 11 screens exported in 20 minutes.'
  cost: M
  depends_on: CI hook; store-reaching bot; storage with retention rules (S3 about USD 0.023 per GB-month, methods-churn-funnel.md s7)
  buyer: General counsel or compliance lead at a publisher with 5 or more live titles
  input: Bot footage from each CI build, build and config metadata
  why_existing_tools_cannot: Session replay and bug-video tools capture what a user did, not a complete, versioned, hashed set of the screens that exist (market.md s2 Bugsee/Instabug 'neither is game-specific');
    GDPR masking warnings (market.md s2) do not arise for synthetic captures.
  willingness_to_pay: '3 - anchor: enterprise annual licence in the USD 20-75k range (UXCam median USD 21k, Sensor Tower median USD 75k, market.md WTP list and competitor-and-ua.md s1); no compliance-specific
    price in notes'
