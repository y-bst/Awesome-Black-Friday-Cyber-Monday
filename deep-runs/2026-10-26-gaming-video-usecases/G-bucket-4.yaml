- id: vendor-1
  title: '''Watch this step'' button on a GameAnalytics Progression funnel step that opens 10 sampled clips of players who dropped at that step'
  level: L4
  cell:
    buyer-role: white-label-vendor
    video-source: own-players-consented-sdk
    signal-extracted: ui-state-and-screen-flow
    analysis-type: funnel-drop-off-why
    lifecycle-moment: ftue-first-session
    delivery-form: white-label-embed
    buyer-org-type: analytics-or-mmp-vendor
    go-to-market-channel: oem-white-label
    pricing-model: oem-royalty-or-white-label
    capture-trigger-and-sampling: event-triggered-clip
  object: GameAnalytics funnel 'Total Churn' column (share who matched step 1 but not later steps) on a Progression funnel built from tutorial Progression events (methods-churn-funnel.md section 1)
  situation: A studio on GameAnalytics sees 'Total Churn' of 38% between tutorial step 3 and step 4 of a Progression funnel; today the funnel ends there and the studio guesses
  consequence: The vendor's dashboard answers 'where' and loses the 'why' to session replay or playtest vendors the studio pays separately (UXCam median about $21k/yr, PlaytestCloud EUR 13.6k-33.9k/yr)
  p_typical: 0.22
  grounded: quote
  evidence: 'methods-churn-funnel.md section 1: ''GameAnalytics funnel "Total Churn" = share of users who matched the first step but not all later steps, i.e. historical drop-off, not prediction''; market.md
    section 6: GameAnalytics ''Live Map'' session replay. No video.'
  proposed: Embed iframe or React component rendered inside the vendor's funnel view; clips keyed by the vendor's own user ID and Progression event ID
  shallow: false
  mechanism: Vendor SDK keeps a 60-second ring buffer at 2 fps 480p; when a user fires step 3 but not step 4 within 120 s, the buffer uploads; our model labels the screen states and returns 10 clips plus
    a 3-line cause summary into the vendor's UI
  example: 'Match-3 FTUE, step 3 ''booster tutorial'': 7 of 10 clips show the booster card dismissed in under 1 s, then a fail screen; the summary says ''card skipped, booster never used'''
  cost: M
  depends_on: Vendor agreeing to add a ring-buffer module to its existing SDK; User Test product's ingestion and report agent
  buyer: Head of product or BD lead at a game-analytics SaaS (GameAnalytics-class) with an SDK in thousands of mobile games
  input: Ring-buffer video from the vendor's SDK on consented players, plus the vendor's Progression events and user IDs
  why_existing_tools_cannot: 'methods-churn-funnel.md section 1 INFERRED: ''Event funnels answer "where" and "how many"; every tool above leaves "why" to a hypothesis step''; market.md section 6: GameAnalytics
    IQ Suite has no video'
  willingness_to_pay: 3 - vendor would pay a royalty only if it can resell; the end-customer anchor is UXCam median about $21k/yr and IV Metrics $49-99/month for capped replay (market.md section 2, Signals)
  _from_file: E-analytics-vendor-white-label.yaml
- id: vendor-2
  title: 'Retroactive funnel step from pixels: define a new step after the fact (''shop button visible and not tapped for 6 s'') and back-fill it over 30 days of stored keyframes'
  level: L4
  cell:
    buyer-role: white-label-vendor
    video-source: own-players-consented-sdk
    signal-extracted: ui-state-and-screen-flow
    analysis-type: funnel-drop-off-why
    delivery-form: api-or-sdk
    buyer-org-type: analytics-or-mmp-vendor
    constraint-to-overcome: per-game-ui-generalisation
    value-lever-b2b: create-data-that-did-not-exist
    pricing-model: oem-royalty-or-white-label
  object: 'Unity Funnel Analyzer rule: editing a funnel is blocked because it ''would invalidate any existing data'', so a new hypothesis means a new funnel (methods-churn-funnel.md section 1)'
  situation: A product manager asks a question the game was never instrumented for; the analytics vendor can only start collecting from the next build
  consequence: Every new hypothesis costs one release cycle (1-2 weeks) and the historical cohort is lost; the vendor's funnel feature looks rigid next to replay tools
  p_typical: 0.05
  grounded: quote
  evidence: 'methods-churn-funnel.md section 2 INFERRED: ''Most of these can in principle be instrumented as events, but only if anticipated; video captures them retroactively for any screen, which is the
    practical difference.'''
  proposed: 'API call: POST /virtual-events {game_id, description, example_frames[3]} returns a virtual event stream the vendor''s funnel builder treats as a native event'
  shallow: false
  mechanism: Vendor stores 1 keyframe per screen change (about 40 per session); a VLM matches the text definition plus 3 example frames against stored keyframes and emits a virtual event with timestamp
    and user ID into the vendor's event store
  example: Idle tycoon, analyst types 'first shop visit where the starter pack is visible'; 30 days back-filled for 12,000 sampled users in 4 hours; the step becomes a funnel column
  cost: L
  depends_on: Keyframe retention in vendor storage (about $0.04 per stored player-hour per month on S3, methods-churn-funnel.md section 7); a per-title screen vocabulary (vendor-8)
  buyer: Product lead at an analytics SaaS that owns a funnel builder (Unity Analytics, GameAnalytics, Amplitude-class)
  input: Keyframes captured by the vendor's SDK at screen changes, plus the vendor's existing event stream and user IDs
  why_existing_tools_cannot: 'methods-churn-funnel.md section 1: Unity funnels cannot be edited without invalidating data; section 1 INFERRED: ''a step that was never instrumented ... does not exist in
    the data'''
  willingness_to_pay: 3 - differentiates a funnel product against Amplitude's case studies (FunCraft +40% D1, EA 30% faster onboarding; methods-churn-funnel.md Signals) but no price exists for virtual events
  _from_file: E-analytics-vendor-white-label.yaml
- id: vendor-3
