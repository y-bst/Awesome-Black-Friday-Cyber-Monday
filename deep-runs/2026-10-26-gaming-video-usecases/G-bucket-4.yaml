    companion-data: purchase-and-ad-revenue-events
    delivery-form: per-cohort-report
    lifecycle-moment: d1-to-d7
  object: fail screen followed by an offer popup; rage quit definitions and 'low-action time' signals in methods-churn-funnel.md s2
  situation: on level 7, 61% of sessions that reach a 4th fail see an 'Extra moves' offer within 3 s; the compliance lead wants to see whether the pattern targets players in distress
  consequence: pressure at a moment of frustration is a vulnerability-exploitation argument in a complaint; the monetisation lead will resist because it converts
  p_typical: 0.06
  grounded: inferred
  evidence: 'methods-churn-funnel.md s2: ''the exact screen state at the moment of app kill (rage quit vs. interruption)'' and repeated failed gestures exist in video but not in event streams'
