  situation: A mid-core game answered 'no simulated gambling'; its gacha screen shows a spinning reel with prize odds on a second tab
  consequence: Rating body or store reclassifies after launch; a region is delisted until a new rating, 2-6 weeks (my estimate, not in notes)
  p_typical: 0.07
