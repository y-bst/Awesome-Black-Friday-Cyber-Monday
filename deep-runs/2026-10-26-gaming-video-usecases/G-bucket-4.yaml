  situation: A UA team runs a 'fail-state hook' creative and a 'cinematic' creative on Meta; the MMP reports installs and D1 per creative but not whether the promised moment appeared in session 1
  consequence: Creative tools score the ad (Segwise, Alison, Replai) and the MMP scores retention; neither shows the ad-to-gameplay mismatch that drives D1 loss for one creative
