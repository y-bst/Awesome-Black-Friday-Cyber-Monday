  shallow: false
  mechanism: 'On-device: compare frame hashes every 500 ms; if the frame is static or a spinner class persists > 20 s, trigger the existing ring buffer upload; cloud model labels the screen and groups by
    screen and build'
  example: 'Build 3.12.0: 1,840 ''visual hang'' issues on screen ''loading: guild war'', 92% on Android 12 Mali GPUs; engineer opens the grouped issue with 5 clips'
  cost: S
  depends_on: Crash vendor's existing replay buffer (Sentry, Embrace, Bugsee class); a spinner and static-frame detector
  buyer: Product lead at a crash and performance monitoring vendor (Sentry, Embrace, Bugsee/Instabug-Luciq class)
  input: Existing error-replay ring buffer, plus crash and error logs and device perf counters
  why_existing_tools_cannot: 'market.md section 2: Bugsee and Instabug are ''not game-specific, and neither does automated visual analysis of the recorded frames''; Sentry uploads only on error (methods-churn-funnel.md
    section 6)'
  willingness_to_pay: 3 - crash vendors sell replay already; Smartlook-class pricing is called 'very high' by reviewers (market.md Signals), so the add-on must ride inside existing tiers
  _from_file: E-analytics-vendor-white-label.yaml
- id: vendor-7
  title: On-device screen-state classifier licensed into the vendor's SDK that ships labels, not video (about 2 KB per session instead of 450 MB)
  level: L4
  cell:
    buyer-role: white-label-vendor
    video-source: own-players-consented-sdk
    signal-extracted: ui-state-and-screen-flow
    processing-location: on-device
    constraint-to-overcome: bandwidth-and-storage
    delivery-form: api-or-sdk
    pricing-model: oem-royalty-or-white-label
    buyer-org-type: analytics-or-mmp-vendor
    effort: L-multi-quarter
  object: 'Arithmetic in methods-churn-funnel.md section 7: a 30-minute first session at 2 Mbps is about 450 MB of upload; 100k installs/day at 10 minutes and 1 Mbps is about 7.5 TB/day'
  situation: 'An analytics vendor with 2,000 games on its SDK cannot add video upload: its customers would see APK size, data use and store-review risk'
  consequence: The vendor stays event-only; video insight remains a separate SDK the studio must integrate
  p_typical: 0.04
  grounded: quote
  evidence: 'methods-churn-funnel.md section 7 INFERRED knob (e): ''on-device CV that uploads only extracted events/labels plus a few keyframes'''
  proposed: A 3-6 MB quantised model plus per-title head shipped as an optional module of the vendor SDK; output = screen-state events appended to the vendor's event stream
  shallow: false
  mechanism: Every 1 s, a small CNN classifies the current frame into the title's screen vocabulary (about 20 classes) and emits a state-change event; 3 keyframes per session upload only on Wi-Fi
  example: 'Hyper-casual title: 50k sessions/day produce screen-change events ''tutorial_card_shown'', ''fail_screen'', ''store_open'' with dwell ms, no video upload; vendor dashboard shows dwell per card'
  cost: L
  depends_on: Per-title screen vocabulary (vendor-8); device performance budget agreed with the vendor's engine customers (<1-2 ms/frame per the cto-or-engine-lead-veto perspective)
  buyer: SDK product lead at an analytics or engine-services vendor
  input: Frames rendered on the player's device, sampled at 1 fps; output joined to the vendor's existing events
  why_existing_tools_cannot: 'market.md section 2: PostHog Unity is screenshot-based and UXCam reconstructs native UI trees, so ''engine-rendered game canvases show up as a black box''; none classifies
    game screens on device'
  willingness_to_pay: 4 - royalty per MAU through the vendor; studios already pay UXCam about $21k/yr median for replay (market.md section 2), and the on-device route removes the upload cost that blocks
    the vendor
  _from_file: E-analytics-vendor-white-label.yaml
