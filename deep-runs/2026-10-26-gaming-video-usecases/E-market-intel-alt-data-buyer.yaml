- id: altdata-1
  title: "Daily automated live-ops event log for 500 mobile titles from scheduled emulator bot sessions, replacing analyst play-and-screenshot logging"
  level: L3
  cell: {buyer-role: data-buyer-market-intel, video-source: platform-or-emulator-capture, signal-extracted: ui-state-and-screen-flow, analysis-type: benchmark-vs-competitor, lifecycle-moment: live-event-or-update, delivery-form: licensed-dataset, capture-trigger-and-sampling: scheduled-bot-playthrough, value-lever-b2b: replace-labour-hours, buyer-org-type: data-or-market-intel-buyer}
  object: "Sensor Tower Live Ops (ex-Playliner) 'hundreds of hours' of playtime across 230+ games; GameRefinery Live Events Tracker, 35+ event types documented as screenshots plus analyst comments"
  situation: "Every 24 h a bot session opens each tracked title on an emulator, visits home screen, event hub and shop, and records 3-5 min; a banner or event tab appears that was absent in the previous run"
  consequence: "The intel firm covers 500 titles instead of 230 with the same analyst headcount, and event start dates are stamped within 24 h instead of whenever an analyst next plays that game"
  p_typical: 0.18
  grounded: quote
  evidence: "competitor-and-ua.md §1: Playliner team logs 'hundreds of hours' of playtime to capture live ops across 230+ top games; adjacent-usecases.md §7: live events 'cannot be scraped; gathering takes large human resources'"
  proposed: "Pilot on 100 Match3 and Midcore titles against the 35 GameRefinery event types; measure recall against the analyst log over 30 days, target 90% of events detected within 24 h"
  mechanism: "Bot navigates to home, event hub and shop; a VLM classifies each screen against a 35-type event taxonomy (tournament, battle pass, limited-time shop, login calendar, team competition); OCR reads countdown timers and reward amounts; a diff against the prior day emits start and end rows per event"
  example: "Monday 06:00 run of a top-10 match-3 game shows a new team-competition tab with a 3d 4h timer; the feed emits event_type=team_competition, start=Mon, end=Thu 10:00, reward=1,000 coins, and the analyst only reviews the 12 s clip"
  cost: M
  depends_on: "emulator farm with one kept-alive account per title past FTUE; a vision agent or per-title navigation script that reaches the event hub"
  buyer: "Head of live-ops intelligence product at a market-intel firm (Sensor Tower, Liftoff/GameRefinery, AppMagic class)"
  input: "scheduled emulator/bot gameplay video of competitor titles, plus the firm's own store metadata and revenue/download estimates"
  why_existing_tools_cannot: "competitor-and-ua.md §7: live-ops logging is done by analysts playing games; §1 INFERRED: no source shows a vendor extracting event cadence from gameplay video automatically"
  willingness_to_pay: "4 - Sensor Tower bought Playliner (Jun 2025) for human-logged live-ops coverage; Sensor Tower contracts median $75,000/yr, range $29,500-$115,460 (competitor-and-ua.md §1 Prices)"
  shallow: false

- id: altdata-2
  title: "Daily in-game shop price-point feed: every SKU's local price, hard-currency quantity and bonus % read by OCR from bot-captured shop screens of 300 top-grossing titles"
  level: L4
  cell: {buyer-role: data-buyer-market-intel, video-source: automated-bot-or-agent-playthrough, signal-extracted: economy-and-store-events, analysis-type: benchmark-vs-competitor, lifecycle-moment: price-or-economy-change, delivery-form: warehouse-table-export, pricing-model: annual-enterprise-licence, value-lever-b2b: create-data-that-did-not-exist, buyer-org-type: investor}
  object: "the in-game shop screen of each title (bundle cards with price button, currency amount, '+X% bonus' ribbon, 'best value' tag)"
  situation: "Bot opens the shop once a day per title, scrolls the full shop at 2 fps, and the OCR output for a SKU differs from yesterday's row"
  consequence: "An alt-data desk sees a price or bundle change on the day it ships, rather than inferring it weeks later from revenue estimates; table rows look like (title, sku_slot, price_local, currency_qty, bonus_pct, first_seen, last_seen)"
  p_typical: 0.10
  grounded: inferred
  evidence: "competitor-and-ua.md §1: GameRefinery automated tags 'read app-store metadata to infer 51 features ... The input is store metadata, not gameplay video'; §1 INFERRED: 'Automated tagging in the market today reads store metadata and ad creatives, not recorded gameplay sessions'"
  proposed: "Ship as a 300-title CSV/Snowflake share with 90 days of history; acceptance test = OCR price matches store receipt for 98% of 500 hand-checked SKUs"
  mechanism: "Bot scrolls the shop; a detector boxes each bundle card; OCR reads price, currency quantity, bonus ribbon and timer; a SKU matcher links today's card to yesterday's by artwork embedding and slot; changes emit a row with before/after values"
  example: "A top-20 grossing match-3 title's $9.99 coin pack drops from 6,000 to 5,000 coins on day 41 of the quarter; the hedge-fund analyst sees a 20% effective price rise in the feed the next morning and adjusts the quarterly revenue model"
  cost: M
  depends_on: "altdata-1 bot farm reaching the shop; per-country store accounts; SKU identity matching across UI redesigns"
  buyer: "Alt-data analyst at a hedge fund covering listed game publishers, or pricing-intelligence product lead at a market-intel firm"
  input: "bot/emulator video of shop screens, plus store-listed IAP price ladders and the firm's revenue estimates"
  why_existing_tools_cannot: "competitor-and-ua.md §1: automated tags come from store metadata; store IAP listings give a price but not the currency quantity or bonus shown inside the game, which only the shop screen carries (inferred)"
  willingness_to_pay: "4 - Sensor Tower API add-on $5,000-$20,000/yr and extra modules $1,500-$5,000+/month (competitor-and-ua.md §1 Prices); firms buy both Sensor Tower and GameRefinery (Liquid and Grit page)"
  shallow: false

- id: altdata-3
  title: "Shop first-viewport share-of-shelf index: which offer types occupy the slots visible without scrolling, as % of screen area, per genre per month"
