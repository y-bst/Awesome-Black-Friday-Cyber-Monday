  cell: {buyer-role: data-buyer-market-intel, video-source: automated-bot-or-agent-playthrough, signal-extracted: ui-state-and-screen-flow, analysis-type: benchmark-vs-competitor, lifecycle-moment: live-event-or-update, delivery-form: dashboard, game-platform-and-genre: mobile-midcore-f2p, value-lever-b2b: create-data-that-did-not-exist, buyer-org-type: data-or-market-intel-buyer}
  object: "the first viewport of the in-game shop (above-the-fold card positions 1-4)"
  situation: "Each shop capture's first frame is segmented into offer cards before any scroll; offer type is classified as starter pack, VIP/subscription, currency, battle pass, limited-time bundle or cosmetic"
  consequence: "Intel firm sells a new benchmark line: 'midcore top-50 gave 41% of first-viewport area to limited-time bundles in Q3 vs 28% in Q2', which no store metadata can produce"
  p_typical: 0.04
  grounded: inferred
  evidence: "competitor-and-ua.md §1 INFERRED: 'No source shows a vendor extracting FTUE steps, shop layouts or event cadence from gameplay video automatically'"
  proposed: "Add as a tab in the firm's existing monetisation module; 6-class offer classifier validated on 1,000 hand-labelled shop frames"
  mechanism: "Segment first shop frame into cards; classify each card into 6 offer types; compute pixel-area share and slot rank; aggregate by genre (GameRefinery 52-subgenre taxonomy) and month"
  example: "A monetisation consultant buying the module sees that 4 of the top-10 midcore titles moved the battle pass into slot 1 after season start and uses it in a pitch to a client"
  cost: S
  depends_on: "altdata-2 shop capture; genre taxonomy from the intel firm"
  buyer: "Product manager, monetisation benchmarks, at a market-intel firm"
  input: "bot-captured shop video, plus the firm's genre tags"
  why_existing_tools_cannot: "competitor-and-ua.md §1: human-captured flow libraries (Gamedexy 25 games, Game UI Database 1,341 titles) are static screenshots without time series; market.md §9: no CV-based competitor gameplay analysis vendor found"
  willingness_to_pay: "3 - bundled into GameRefinery-class subscriptions at $45-51k/yr (competitor-and-ua.md §1 Prices); stand-alone flow references sell low (Gamedexy Pro $99/yr)"
  shallow: false

- id: altdata-4
  title: "Monetisation pressure index per listed publisher: offer pop-ups, store prompts and rewarded-ad prompts per 30 min of session 1 and session 5, tracked monthly"
  level: L4
  cell: {buyer-role: investor, video-source: automated-bot-or-agent-playthrough, signal-extracted: economy-and-store-events, analysis-type: root-cause-of-a-metric-change, lifecycle-moment: price-or-economy-change, delivery-form: weekly-digest-email, buyer-org-type: investor, value-lever-b2b: create-data-that-did-not-exist, pricing-model: annual-enterprise-licence}
  object: "full-screen offer pop-ups and store prompts shown between levels in session 1 (first 30 min) and session 5 of each title"
  situation: "The same scripted bot persona (no spend, median-skill play) is replayed monthly on each title; counts of interrupting offers change by more than 25% month on month"
  consequence: "A sell-side analyst covering a listed publisher sees that pop-up frequency doubled in its top 3 titles in the last month of a quarter and flags revenue pull-forward or retention risk in the earnings preview"
  p_typical: 0.04
  grounded: speculative
  evidence: "none on investor demand in the notes; competitor-and-ua.md §1 shows Sensor Tower bought data.ai (est. $300M on about $100M revenue), indicating money in cross-app data products"
  proposed: "Backtest the index against 8 quarters of reported bookings for 6 listed publishers before selling it"
  mechanism: "Bot plays a fixed 30-min script; a screen classifier tags each interruption as IAP offer, store prompt, rewarded-ad prompt or interstitial; counts per 30 min aggregate to title and to publisher ticker by revenue weight"
  example: "In month 3 of a quarter a listed social-casino publisher's titles go from 2.1 to 4.6 offer pop-ups per 30 min; the index alert goes out in the Monday digest to 40 fund subscribers"
  cost: M
  depends_on: "altdata-1 bot farm; title-to-ticker mapping; a fixed bot persona so counts are comparable across months"
  buyer: "Sell-side equity analyst or buy-side games analyst covering listed publishers"
  input: "bot gameplay video of sessions 1 and 5, plus the firm's revenue estimates and ticker map"
  why_existing_tools_cannot: "competitor-and-ua.md §1: live-event trackers log events, not how often a player is interrupted by offers; methods-churn-funnel.md §2 INFERRED: an un-instrumented step does not exist in event data, and competitors' event data is not available at all"
  willingness_to_pay: "3 - investor demand for game data is implied by Sensor Tower's data.ai purchase (competitor-and-ua.md §1); no direct investor price signal in the notes"
  shallow: false

- id: altdata-5
  title: "Ad-network share-of-impressions estimate per title: identify which network served each in-game interstitial or rewarded ad from end-card and close-button layout"
  level: L4
  cell: {buyer-role: investor, video-source: platform-or-emulator-capture, signal-extracted: ad-render-and-viewability, analysis-type: benchmark-vs-competitor, delivery-form: licensed-dataset, constraint-to-overcome: accuracy-and-trust, game-platform-and-genre: mobile-casual-hypercasual, buyer-org-type: investor, value-lever-b2b: create-data-that-did-not-exist}
  object: "the ad end card, close-button style, privacy/AdChoices icon placement and store-redirect overlay that differ by ad network SDK"
  situation: "During capture an ad plays inside a hybrid-casual game; a classifier trained on known network templates labels it AppLovin, Unity, Mintegral, Moloco or other"
  consequence: "An investor covering ad-tech gets a monthly estimate of each network's share of served ads across 1,000 casual titles, a figure no network publishes"
  p_typical: 0.03
  grounded: inferred
  evidence: "competitor-and-ua.md §2: 'AppLovin publishes no public competitor ad library'; §3: Segwise connects to Meta, Google, TikTok, AppLovin, Unity, Mintegral, Moloco, i.e. these are the networks to separate"
  proposed: "Train on 2,000 labelled ad captures; publish per-network precision; never click ads during capture"
  mechanism: "Detect ad start (full-screen takeover, timer, skip/close glyph); classify network from end-card template, close-button glyph and redirect overlay; count per title per month; weight by title download estimates"
  example: "Across 1,000 hybrid-casual titles in September the panel attributes 62% of captured rewarded ads to one network vs 55% in June; the fund analyst uses it in an ad-tech share note"
  cost: M
  depends_on: "real-device or emulator capture that ad networks still serve fill to; template library per network refreshed monthly"
  buyer: "Buy-side analyst covering ad-tech (AppLovin, Unity) or ad-intelligence product lead at Sensor Tower/AppMagic"
  input: "bot/emulator gameplay video including served ads, plus title download estimates"
  why_existing_tools_cannot: "competitor-and-ua.md §2: no AppLovin public ad library and screenshotting ads inside games mislabels them; §3: creative tools analyse ads bought by the customer, not ads served inside third-party games"
  willingness_to_pay: "4 - Sensor Tower Ad Intelligence and Pathmatics data are sold to marketers (competitor-and-ua.md §1); investor appetite inferred from Sensor Tower contract sizes up to $115,460/yr; risk: emulator traffic may be flagged as fraud and receive no fill"
  shallow: false

- id: altdata-6
  title: "In-network ad creative library for networks with no public library: record every ad served inside captured games, link it to the advertiser via the store page it redirects to, log first-seen and last-seen"
  level: L3
  cell: {buyer-role: data-buyer-market-intel, video-source: ad-and-playable-ad-sessions, signal-extracted: ad-render-and-viewability, analysis-type: creative-insight-for-ads, lifecycle-moment: ua-campaign-launch, delivery-form: licensed-dataset, buyer-org-type: data-or-market-intel-buyer, value-lever-b2b: create-data-that-did-not-exist, capture-trigger-and-sampling: scheduled-bot-playthrough}
  object: "the served ad video plus its end card's store-page redirect (app name, developer) inside third-party games"
  situation: "A rewarded or interstitial ad plays during a bot session; the capture keeps the full ad and the redirect target app ID"
  consequence: "The intel firm's creative gallery gains AppLovin-network creatives with correct advertiser attribution, a coverage hole competitors fill with manual screenshots"
  p_typical: 0.05
  grounded: quote
  evidence: "competitor-and-ua.md §2: 'AppLovin publishes no public competitor ad library; screenshotting ads seen inside another game mislabels them as that game's creative (vendor guide)'"
  proposed: "Run 20 bot hours/day on 200 ad-heavy titles; dedupe creatives by perceptual hash; report frequency per creative as a spend proxy"
  mechanism: "Ad-start detector cuts the ad clip; perceptual hash dedupes creatives; end-card OCR plus redirect URL identify the advertiser app; frequency per day across the panel becomes a relative spend proxy"
