  cost: M
  depends_on: "altdata-5 ad detection; ad fill to capture devices; legal check that storing served ads for analysis is permitted"
  buyer: "Ad-intelligence product lead at a market-intel firm (Sensor Tower Ad Intelligence, AppMagic, SocialPeta class)"
  input: "ads served inside bot/emulator game sessions, plus store redirect metadata"
  why_existing_tools_cannot: "competitor-and-ua.md §2: Meta Ads Library shows only Facebook/Instagram ads and AppLovin has no library; §7: competitor ad review is via free libraries plus occasional paid tools"
  willingness_to_pay: "4 - Sensor Tower Ad Intelligence Creative Gallery is a paid module; extra modules $1,500-$5,000+/month (competitor-and-ua.md §1 Prices)"
  shallow: false

- id: altdata-7
  title: "Consented Android panel time-split index: share of each title's play time spent in core loop vs menus/meta vs shop vs ads, from 1 fps screen capture on 5,000 paid panelists"
  level: L4
  cell: {buyer-role: data-buyer-market-intel, video-source: platform-or-emulator-capture, signal-extracted: ui-state-and-screen-flow, analysis-type: cohort-comparison, delivery-form: licensed-dataset, capture-trigger-and-sampling: opt-in-panel, constraint-to-overcome: sampling-bias, processing-location: on-device, pricing-model: annual-enterprise-licence}
  object: "per-frame screen class (core gameplay, menu/meta, shop, ad, loading) across every game a panelist opens"
  situation: "A panelist's device classifies frames on-device at 1 fps and uploads only class labels and 1 keyframe per minute; weekly totals per title are aggregated"
  consequence: "The intel firm sells a per-title engagement composition metric (for example 9% of minutes in ads for a hybrid-casual title vs 2% for a midcore title) that download and revenue estimates cannot show"
  p_typical: 0.08
  grounded: inferred
  evidence: "methods-churn-funnel.md §7 INFERRED: '(e) on-device CV that uploads only extracted events/labels plus a few keyframes'; §7 VERIFIED Apple 2019: screen recording needs 'explicit user consent and ... a clear visual indication'"
  proposed: "Android-only panel, paid incentive per week, quota-sampled by country and spend tier; publish panel composition with every release"
  mechanism: "On-device 5-class screen classifier at 1 fps; labels and app ID uploaded on Wi-Fi; server weights panelists to market demographics and outputs minutes by class per title per week"
  example: "After a hybrid-casual title adds a second interstitial slot, its ad-minute share in the panel rises from 6% to 11% within 2 weeks; the intel firm's subscribers see it in the weekly engagement table"
  cost: L
  depends_on: "a panel app with consent and visible recording indicator; Android-only distribution; incentive budget; a generic screen classifier that works across titles without per-game training"
  buyer: "Head of panel/consumer-data product at a market-intel firm"
  input: "on-device classified screen labels from consented panelists, plus app usage stats"
  why_existing_tools_cannot: "market.md §5: stream analytics measure audience metadata not in-game content; competitor-and-ua.md §1 INFERRED: automated tagging reads store metadata and ad creatives, not recorded gameplay"
  willingness_to_pay: "3 - Sensor Tower paid an estimated $300M for data.ai (competitor-and-ua.md §1); panel recruitment cost and iOS exclusion (methods-churn-funnel.md §7) cap it"
  shallow: false

