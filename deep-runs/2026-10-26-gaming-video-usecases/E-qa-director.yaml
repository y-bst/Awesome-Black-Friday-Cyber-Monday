  example: "Match-3 RPG build 4.12: cluster '28 clips, Mali-G52 MC2, driver r32p1, battle screen, magenta terrain' opens QA-8812; the QA director pulls a Galaxy A12 from the drawer and reproduces in 10 minutes"
