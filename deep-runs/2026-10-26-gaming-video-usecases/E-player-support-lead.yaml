  shallow: false
  mechanism: "Client keeps 60 s of 360p H.264 in memory or a capped file; on support tap it is uploaded and linked to the ticket id, so the agent sees what the player saw"
  example: "Match-3 game, player writes 'I lost my moves'; clip shows 2 moves consumed by a combo animation that froze for 6 s; agent replies with the right refund macro in the first touch"
  cost: M
  depends_on: "consented capture SDK for Unity and Unreal with ring buffer; ticket-system connector"
  buyer: "Head of player support at a mobile or PC F2P studio"
  input: "Own-player screen video (ring buffer) plus ticket text, device model, build id from the helpdesk SDK"
  why_existing_tools_cannot: "Helpshift captures fields not pixels, Fullview/Screendesk are web or browser tools, and no game-client vendor was found (adjacent-usecases.md s.9)"
  willingness_to_pay: "4: Helpshift already charges a platform fee plus a per-issue rate with 1,000 issues/month included (adjacent-usecases.md s.9); a per-ticket-with-clip price in the same unit is a natural fit"

