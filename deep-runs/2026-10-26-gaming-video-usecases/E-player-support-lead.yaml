  p_typical: 0.35
  grounded: quote
  evidence: "adjacent-usecases.md s.9: 'players self-record and attach; agents watch'; methods-churn-funnel.md s.6: Sentry onErrorSampleRate buffers 'about the last minute before the error'; market.md s.3 Razer hotkey captures 'the 20 seconds before an issue'"
