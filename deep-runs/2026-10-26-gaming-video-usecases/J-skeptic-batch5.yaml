- id: scout-2
  case: >-
    Drop or fold this into a later analytics-QA feature. The notes give no evidence of the demand. The option's own grounding is "inferred" and p_typical is 0.04. methods-churn-funnel.md section 1 says only that ordered and any-order funnels give different numbers and that uninstrumented steps do not exist in the data. No source records a mis-fired tutorial_complete event or a deal priced on a false funnel. The capture burden lands on the wrong party. The developer under diligence has to ship a recording SDK in the soft-launch build and collect consent with a visible indicator on iOS (Apple 2019, methods-churn-funnel.md section 7), and the audit's only outcome is to lower their own valuation. A developer who agreed to that could just as easily hand over a debug build that overlays event names on screen, which a scout or QA contractor can check in an afternoon at USD 15-50/hour (adjacent-usecases.md section 1). There is no audit budget line either. Sensor Tower's USD 75k/year median buys market-wide intelligence across all titles, not a per-deal check. Each deal also needs its own per-title screen classifier, so this sells as low-volume services work rather than a product.
- id: cfo-12
  case: >-
    Explore later, and only as a reporting view on ua-1, not as a separate first product. The join it depends on breaks where the pain is worst. GeekLab's complaint is that linking a creative to retained players is weak "especially on iOS" (competitor-and-ua.md section 3), and on-device video does not restore a user-level creative ID that the platform withholds. Sample size is the second problem. With consented capture of 1-5% of new installs (methods-churn-funnel.md section 7) spread across 120 creatives, most creatives get too few clips to rank. The top 2% of creatives take about 60.7% of spend (Segwise, competitor-and-ua.md section 3), and those few already have D1 and ROAS cohorts in the MMP. Reading a quit as "searching for the ad's mechanic" from the screen has no accuracy figure anywhere in the notes. A dollar figure built on that label invites the UA team to dispute it, and in any case they decide on ROAS. The CFO does not buy creative tools; the notes show UA tools priced to the UA team by ad spend (Segwise USD 499-1,699/month). Segwise already connects to AppsFlyer, Adjust and Singular, so a "first-session quit cost per creative" column is close to a feature flag for them once any post-install signal exists.
- id: ua-1
  case: >-
    Explore, do not build first. The idea fills a real gap (competitor-and-ua.md section 3 INFERRED), but three dependencies stack up. First, the MMP has to pass creative_id into the game SDK at install, which is unreliable on iOS, the platform GeekLab names. Second, the game needs consented first-session capture, and the consent prompt sits in exactly the first five minutes being measured, so it adds friction and biases the sample toward players who opt in. Third, the vendor needs access to ad video files, and AppLovin, a major casual network, has no public ad library (competitor-and-ua.md section 2). The decision it informs is already made without video. UA managers cut or scale creatives on D1 and ROAS per creative cohort, and AppLovin's AI tests creative combinations by itself (competitor-and-ua.md section 3). So the "promise kept at minute X" number is a diagnostic that explains a choice the dashboard already makes. The USD 2-5k/month price is the option's own estimate, not a figure from the notes, and the only real anchor is USD 499-1,699/month. Some mismatch between the ad and the game is also deliberate, because exaggerated ads can win on CPI, so the buyer may not act on the finding. The VLM labelling of the mechanic in ads and in clips has no accuracy figure in the notes.
- id: ds-14
  case: >-
    Defer. This is a feature of the core platform, not a first product. It depends on ds-1, video features from at least 2,000 sessions per version, which is the always-on capture and processing pipeline that methods-churn-funnel.md section 7 calls unrealistic at full scale on mobile. The "S-weeks" effort only holds once that pipeline exists. Its headline example, a loading screen growing from 3.1 s to 9.4 s on Mali GPUs, is the case where video is weakest. adjacent-usecases.md section 6 says reliable load and fps measurement uses in-game profiling or GameBench rather than video. A single timer event or performance SDK catches that regression more cheaply, and Sentry-style tooling already samples sessions in production. Running per-screen KS tests across every screen and device tier creates a multiple-comparisons problem, so the Slack channel risks filling with false drift alerts after each release. The buyer is an on-call data scientist with no budget line of their own. The moat score of 2 is fair. GameAnalytics shipped AnalyticsIQ and an MCP server in 2025-26 (market.md section 6), and anomaly alerts on event-timed dwell are one release away for them, with no video needed.
- id: qa-10
  case: >-
    Drop as a first product. It sits in the most crowded corner of the map, the only place where vendors already ship CV on gameplay footage (market.md section 9). Razer QA Companion-AI already does vision-based bug detection "directly from recorded footage" with Jira integration (market.md section 3). ManaMind finds bugs "through video and audio alone". modl.ai and nunu.ai own the bot runs that produce the footage, so a "review last night's video" queue is a short step for any of them. The accuracy is not there for unattended triage. The best zero-shot VLM reached precision 0.50 and accuracy 0.72 on industrial QA video, and many of its flags were on-screen log text. Temporal glitches are "substantially harder" (adjacent-usecases.md section 1; methods-churn-funnel.md section 4). Only 16% of developers fully trust AI QA output (market.md section 3). The 98.79% keyframe recall in the mechanism measures retrieving a known bug's frame given a written report (arXiv 2508.04895). It says nothing about finding bugs nobody has reported. Per-confirmed-bug billing hands the "is this new?" call to the buyer, which invites disputes and makes revenue lumpy. The buyer pool is limited to studios that already run nightly bot farms. The option also uses none of the founder's assets (real-player video, the User Test report agent), in a category that has raised USD 35.8M with no breakout (Naavik, market.md section 3).
