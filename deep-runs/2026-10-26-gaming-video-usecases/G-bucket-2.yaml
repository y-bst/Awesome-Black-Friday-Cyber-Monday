  example: '30-minute runner session: 5.5 minutes of ads removed (18%); delivered hours count only game frames'
  cost: S
  depends_on: ad-impression callbacks from the mediation SDK
  buyer: Lab data acquisition lead; studio legal
  input: SDK video + ad impression events
  why_existing_tools_cannot: No capture tool in market.md §2 marks ad segments in recorded footage; ad tools analyse the ad, not the session (competitor-and-ua.md §3)
  willingness_to_pay: 3 - buyer pays per game-frame hour, so ad minutes are dead weight; inferred
  _from_file: E-ai-training-data-buyer.yaml
- id: data-7
  title: 'Active-play hour metering: trim loading, energy-timer waits, menu idle and AFK on device and bill only hours in which inputs cause visible state change'
  level: L4
  cell:
    buyer-role: data-buyer-training
    video-source: own-players-consented-sdk
    signal-extracted: load-and-wait-screens
    analysis-type: training-dataset-export
    delivery-form: licensed-dataset
    pricing-model: data-licence-per-hour
    constraint-to-overcome: bandwidth-and-storage
    processing-location: on-device
  object: 'methods-churn-funnel.md §7: ''a 30-minute first session at 2 Mbps is about 450 MB of upload''; §2 ''Universal Boredom Detector'' tracks idle time'
  situation: Midcore RPG session lasts 42 minutes but the player waits on energy timers and loading screens for 11 and idles for 2
  consequence: Untrimmed upload is 630 MB at 2 Mbps; trimmed is 435 MB, and the lab is billed for 29 active minutes instead of 42
  p_typical: 0.04
  grounded: inferred
  evidence: 'methods-churn-funnel.md §7 bitrate arithmetic: 2 Mbps = about 0.9 GB/hour; methods-churn-funnel.md §2 idle detector'
  proposed: 'Invoice line ''active hours'' with definition: >=1 input per 20 s and >=2% pixel change per second'
  shallow: false
  mechanism: On-device classifier tags load/wait screens; idle rule marks >20 s without input; trimmed segments never upload
  example: Session 42 min raw -> 29 min active (wait 8, load 3, idle 2); upload 630 MB -> 435 MB
  cost: S
  depends_on: data-1 SDK; per-game loading-screen classifier
  buyer: Lab data acquisition lead
  input: SDK video + input stream
  why_existing_tools_cannot: Sentry and Bugsee buffer by time and errors, not play activity (methods-churn-funnel.md §6, market.md §2)
  willingness_to_pay: 4 - buyers count licensed hours (Worldmodeldata ~1M hours, market.md §4), so an active hour is the unit they price
  _from_file: E-ai-training-data-buyer.yaml
- id: data-8
  title: 'Per-frame game-state sidecar: HP, ammo, currency, level id and score read from the HUD (or joined from telemetry) and exported as a time-aligned JSON track'
  level: L3
  cell:
    buyer-role: data-buyer-training
    video-source: own-players-consented-sdk
    signal-extracted: structured-game-state-reconstruction
    analysis-type: training-dataset-export
    delivery-form: licensed-dataset
    companion-data: telemetry-events
