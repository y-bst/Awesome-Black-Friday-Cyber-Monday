  object: 'methods-churn-funnel.md §4 Q3Vision: ''reconstructs Quake III game state from screen video only ... OCR for health, armour, ammo and weapon; OCR limited by low-resolution, stylised HUD fonts'''
  situation: Lab trains agents on shooter footage and needs a reward signal (damage taken, kills) that RGB+inputs alone do not give
  consequence: With a state track the lab uses hp deltas as reward and level id as task label; without it the lab hand-labels or skips the title
