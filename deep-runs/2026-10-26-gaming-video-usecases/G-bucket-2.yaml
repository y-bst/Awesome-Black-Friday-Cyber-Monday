  cost: M
  depends_on: data-1; per-game HUD map; optional telemetry join
  buyer: Research lead for agent training at a world-model lab
  input: SDK video + HUD OCR + telemetry events
  why_existing_tools_cannot: Medal sells clips+inputs without state (market.md §4); CV state parsing (Omnic, Q3Vision) is per-title and sold to players or papers (market.md §4, methods-churn-funnel.md §4)
  willingness_to_pay: 4 - state labels are supervision on top of the clips+inputs asset General Intuition is valued on ($2.3B, market.md §4); inferred
  _from_file: E-ai-training-data-buyer.yaml
