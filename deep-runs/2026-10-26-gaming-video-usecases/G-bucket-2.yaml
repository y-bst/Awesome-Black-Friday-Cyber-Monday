- id: data-12
  title: 'Same-checkpoint branch sets: group sessions that start from one identical level state (level id + RNG seed) so a lab gets 500 different human input sequences from one start frame'
  level: L3
  cell:
    buyer-role: data-buyer-training
    video-source: own-players-consented-sdk
    signal-extracted: structured-game-state-reconstruction
