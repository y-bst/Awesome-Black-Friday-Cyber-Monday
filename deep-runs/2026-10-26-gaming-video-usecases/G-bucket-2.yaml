- id: adnet-21
  title: 'Licensed dataset of ad-viewing sessions: 100,000 hours of ad frames paired with touch traces and outcomes, sold to creative-model and fraud-model builders'
  level: L3
  cell:
    buyer-role: data-buyer-training
    video-source: ad-and-playable-ad-sessions
    signal-extracted: bot-or-fraud-behaviour
    analysis-type: training-dataset-export
    delivery-form: licensed-dataset
    pricing-model: data-licence-per-hour
    constraint-to-overcome: privacy-and-consent
    buyer-org-type: data-or-market-intel-buyer
    value-lever-b2b: produce-a-sellable-asset
  object: paired ad-surface video, touch coordinates and click outcome for each session
  situation: An ad-model vendor wants labelled human versus bot ad sessions to train a classifier and the network sits on 1M sessions a day
  consequence: The network could resell frames but would breach consent and publisher contracts; the licence is valuable only if minors and publisher games are excluded
  p_typical: 0.02
  grounded: quote
  evidence: 'market.md section 4 and Signals of willingness to pay: Worldmodeldata licensed nearly 1M hours of game data, Origin Lab 500k+ hours from 250+ games, OpenAI reportedly offered $500M for Medal;
    Muse/Bleeding Edge EULA consent criticism'
  proposed: Consent-filtered, de-identified human-vs-bot labelled ad sessions licensed per hour
  shallow: false
  mechanism: Opt-in or contract-cleared ad sessions are packaged with labels from the network's confirmed-fraud list and licensed by the hour
  example: A fraud-detection startup licenses 20,000 hours of labelled human-vs-bot ad sessions for a 12-month term
  cost: L
  depends_on: consent and contractual rights to the footage; de-identification; label set
  buyer: ML lead at an ad-fraud or creative-model vendor
  input: Opt-in ad-surface video plus touch traces plus the network's fraud labels
  why_existing_tools_cannot: 'market.md section 4: the training-data buyers purchase game-world footage with inputs for world models, not ad-session data with fraud labels; no note shows a market for that'
  willingness_to_pay: '2: world-model buyers pay for hours (Worldmodeldata about 1M hours licensed) but the notes show no price for ad-session data; legal exposure is high and the network''s publishers
    may veto'
  _from_file: E-ad-network-and-mediation-ops.yaml
- id: data-1
  title: 'Frame-aligned input track export: every mobile touch and controller event stamped to the frame it lands on, sold as paired video+action hours'
  level: L3
  cell:
    buyer-role: data-buyer-training
    video-source: own-players-consented-sdk
    signal-extracted: input-timing-and-hesitation
    analysis-type: training-dataset-export
    delivery-form: licensed-dataset
    companion-data: touch-and-controller-input
    pricing-model: data-licence-per-hour
    buyer-org-type: data-or-market-intel-buyer
    value-lever-b2b: produce-a-sellable-asset
    game-platform-and-genre: mobile-casual-hypercasual
  object: 'market.md §4 Medal: ''users upload about 2B clips/year, which can carry controller and mouse inputs''; methods-churn-funnel.md §6: ''value lies in clips paired with recorded inputs (which button,
    when)'''
  situation: A world-model lab wants action-conditioned mobile data; the known paired corpus (Medal) is PC clips saved on the player's PC with keyboard/mouse/controller, not multi-touch
  consequence: Lab gets mobile hours where each frame carries the touch that caused the next frames; the same hours without an input track are worth a fraction for action-conditioned models
  p_typical: 0.25
  grounded: quote
  evidence: 'methods-churn-funnel.md §6: ''value lies in clips paired with recorded inputs (which button, when)''; market.md WTP: ''AI labs pay for gameplay video plus inputs as training data'''
  proposed: 'Export schema per session: MP4 (720p, 30 fps) + inputs.parquet (t_ms, frame_idx, pointer_id, x_norm, y_norm, phase) aligned on frame_idx'
  shallow: false
  mechanism: Capture SDK logs each touch/controller event with the presentation timestamp of the frame on screen; pipeline maps events to frame_idx and packs per-game shards
  example: 'Match-3, 2,000 opted-in adults, 40-minute sessions: a swap gesture is pointer down/move/up on frames 1,204-1,219 and the cascade plays on frames 1,220-1,290'
  cost: M
  depends_on: capture SDK with consent screen and input hook; studio licence to resell footage (data-3, data-17)
  buyer: Data acquisition lead at a world-model or embodied-AI lab (General Intuition-, Worldmodeldata-type)
  input: Own-player SDK screen video + touch/controller event stream + build id
  why_existing_tools_cannot: Session-replay SDKs record or screenshot without input pairing and IV Metrics caps at 50-100 videos/month (market.md §2); Medal's paired corpus is PC clips (market.md §4)
  willingness_to_pay: 5 - reported ~$500M OpenAI offer for Medal and $454M raised by General Intuition on clips+inputs (market.md §4 and WTP section)
  _from_file: E-ai-training-data-buyer.yaml
- id: data-2
  title: 'Per-shard quality grade card: input-to-frame sync error, effective fps, resolution, active-play share and HUD-occlusion % printed per shard and priced as grade A/B/C'
  level: L4
  cell:
    buyer-role: data-buyer-training
    video-source: own-players-consented-sdk
    signal-extracted: performance-fps-and-load
    analysis-type: training-dataset-export
    delivery-form: licensed-dataset
    constraint-to-overcome: accuracy-and-trust
    pricing-model: data-licence-per-hour
    automation-level: auto-created-ticket-or-asset
  object: 'methods-churn-funnel.md §7: ''low fps (1-5 fps screenshots, as UXCam does) or 360-480p, since UI-state recognition does not need 30 fps 720p'''
  situation: Lab diligence samples 1% of a 10,000-hour delivery and finds dropped frames and inputs drifting 3+ frames from the visual response; no per-shard metric was supplied
  consequence: Lab discounts or rejects the whole delivery; with a grade card, grade A (>=28 fps effective, >=720p, median sync <=1 frame, >=70% active play) clears acceptance and grade C is sold cheaper
  p_typical: 0.04
  grounded: inferred
  evidence: 'methods-churn-funnel.md §7: analytics capture is tuned down to 1-5 fps or 360-480p; market.md §4: Worldmodeldata ''licensed nearly 1M hours'''
  proposed: Grade card JSON per shard; acceptance contract references grade thresholds instead of manual spot checks
  shallow: false
  mechanism: Pipeline finds the first frame where pixels change inside the touched region after each input and takes the median offset; counts duplicate frames for effective fps; frame classifier splits
    active vs menu/load
  example: 'Shard RPG-0412: 9.6 h, 28.7 fps effective, 720p, median sync 1 frame (33 ms), active play 64%, HUD occlusion 11% -> grade B'
  cost: S
  depends_on: data-1 export pipeline
  buyer: Dataset QA / data acquisition lead at a world-model lab
  input: Own-player SDK video + input track + device perf counters
  why_existing_tools_cannot: No vendor in market.md §2-4 grades gameplay footage for training use; analytics SDKs deliberately capture at 1-5 fps (methods-churn-funnel.md §6-7)
  willingness_to_pay: 4 - buyers licensing ~1M hours (Worldmodeldata, market.md §4) need machine acceptance metrics; inferred, no price
  _from_file: E-ai-training-data-buyer.yaml
- id: data-3
  title: 'Chain-of-title ledger per clip: consent text version, timestamp, AI-training opt-in flag, age-gate result and revocation status shipped with every hour'
  level: L3
  cell:
    buyer-role: data-buyer-training
    video-source: own-players-consented-sdk
    analysis-type: training-dataset-export
    delivery-form: licensed-dataset
