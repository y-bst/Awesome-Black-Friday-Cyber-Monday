    pricing-model: annual-enterprise-licence
    buyer-org-type: data-or-market-intel-buyer
    capture-trigger-and-sampling: opt-in-panel
  object: 'market.md §4 Microsoft Muse: ''Matches were recorded under the EULA, which drew criticism over consent'''
  situation: Lab counsel reviews a 50,000-hour purchase; the footage was captured under an analytics consent ('help us make the game better'), not an AI-training consent
  consequence: Counsel blocks the purchase or demands indemnity; footage with a separate third-party AI-training opt-in clears review
  p_typical: 0.09
  grounded: quote
  evidence: 'market.md §4: Muse ''recorded under the EULA, which drew criticism over consent''; methods-churn-funnel.md §7: Apple requires ''explicit user consent and ... a clear visual indication when
    recording'''
  proposed: Separate consent toggle 'used to train third-party AI models' with its own text hash; manifest per shard lists clip ids with consent record ids
  shallow: false
  mechanism: SDK shows an AI-training toggle distinct from analytics consent; ledger stores consent text hash, pseudonymous player id, locale, age-gate result; shard manifest joins clip id to consent record
  example: 'Lab legal queries clip 88231: consent v3 (2026-08-02, en-GB), ''third-party AI training'' = yes, age gate 18+, not revoked'
  cost: M
  depends_on: SDK consent screen; studio counsel signs consent text
  buyer: Head of data licensing / counsel at a world-model lab
  input: SDK consent events + telemetry account fields + clip ids
  why_existing_tools_cannot: Capture vendors in market.md §2 record analytics consent only; the Muse case (market.md §4) shows EULA-only capture is contested
  willingness_to_pay: 4 - clean title gates the purchases of buyers funded at $454M (General Intuition, market.md §4); inferred
  _from_file: E-ai-training-data-buyer.yaml
- id: data-4
  title: 'Minor-session exclusion: quarantine any session with age gate under 16, a kids-mode or parental-control screen in frame, or a child voice on the mic track, before it enters a shard'
  level: L3
  cell:
    buyer-role: data-buyer-training
    video-source: own-players-consented-sdk
    signal-extracted: voice-chat
    analysis-type: training-dataset-export
    constraint-to-overcome: minors-coppa-gdpr-k
    delivery-form: licensed-dataset
    game-platform-and-genre: mobile-casual-hypercasual
    processing-location: vendor-cloud
  object: market.md §1 PlaytestCloud product lines include 'kids' playtests'; methods-churn-funnel.md §7 privacy hazards of game video
  situation: Casual puzzle game with a broad age audience feeds the licensing pipeline; some players lied at the age gate or play on a parent's account
  consequence: One minor's session in a delivered shard exposes both studio and lab to COPPA/GDPR-K claims; the lab requires an exclusion report before payment
  p_typical: 0.05
  grounded: inferred
  evidence: 'market.md §1: PlaytestCloud runs separate ''kids'' playtests'', so minors are a known share of players; methods-churn-funnel.md §2 cites an eye-tracking study of 43 children aged 7-16 playing
    games'
  proposed: Shard manifest carries exclusion counts per rule (age gate, kids UI, child voice)
  shallow: false
  mechanism: 'Three filters: telemetry age-gate field; frame classifier for kids-mode and parental-control screens; audio classifier for child voice; any hit quarantines the session from export (kept for
    studio analytics if consent allows)'
  example: '100,000 sessions: 6.2% excluded (age gate <16 in 4.1%, child voice in 2.1%); manifest lists counts per rule'
  cost: M
  depends_on: data-3 ledger; mic track captured only where voice chat exists
  buyer: Lab counsel and studio privacy lead (joint sign-off)
  input: SDK video + mic audio + account age field
  why_existing_tools_cannot: No capture or replay vendor in market.md §2 or methods-churn-funnel.md §6 filters footage by age
  willingness_to_pay: 3 - bought as a purchase condition, not a feature; no price in the notes
  _from_file: E-ai-training-data-buyer.yaml
- id: data-5
  title: 'On-frame PII redaction: blur player nameplates, guild chat panels, OS notification banners and payment sheets in every frame, with the redaction mask shipped as a side channel'
  level: L3
  cell:
    buyer-role: data-buyer-training
    video-source: own-players-consented-sdk
    signal-extracted: on-screen-text-ocr
    analysis-type: training-dataset-export
    constraint-to-overcome: privacy-and-consent
    delivery-form: licensed-dataset
    game-platform-and-genre: mobile-midcore-f2p
    processing-location: on-device
  object: 'methods-churn-funnel.md §7: ''player names and chat in HUD/social panels, notifications overlaying the screen, payment sheets'''
  situation: Midcore strategy game with clan chat bottom-left and player names over units; iOS notification banners appear mid-session
  consequence: Unredacted frames carry third parties' names and messages the consenting player had no right to license; lab counsel rejects shards with visible chat
  p_typical: 0.07
  grounded: quote
  evidence: 'methods-churn-funnel.md §7 privacy hazards quote above; market.md §2: PostHog Unity SDK is ''screenshot-based, with no built-in masking of text or images'''
  proposed: Mask channel lets the lab exclude synthetic (blurred) pixels from its loss
  shallow: false
  mechanism: OCR + detector on keyframes locates nameplates, chat boxes, OS banners and the store payment sheet; boxes tracked across frames and blurred; binary mask per frame exported
  example: Clan chat panel blurred on 312 of 1,800 frames; an iOS banner with a contact name blurred for 4 s; mask stored as mask_000312.png sequence
  cost: M
  depends_on: data-1 pipeline; per-game nameplate/chat region detector
  buyer: Lab counsel; studio privacy lead
  input: SDK video + OCR + chat-panel region map
  why_existing_tools_cannot: PostHog Unity has no masking (market.md §2); UXCam occlusion masks native views, not an engine-rendered canvas (methods-churn-funnel.md §6)
  willingness_to_pay: 4 - Bugsee GDPR masking warnings (market.md §2) show counsel asks for it; no explicit price
  _from_file: E-ai-training-data-buyer.yaml
- id: data-6
  title: 'Third-party ad excision: cut rewarded and interstitial ad segments out of F2P sessions so another advertiser''s creative is not resold inside a game-footage licence'
  level: L3
  cell:
    buyer-role: data-buyer-training
    video-source: own-players-consented-sdk
    signal-extracted: ad-render-and-viewability
    analysis-type: training-dataset-export
    companion-data: purchase-and-ad-revenue-events
    delivery-form: licensed-dataset
    game-platform-and-genre: mobile-casual-hypercasual
    constraint-to-overcome: studio-ip-and-prerelease-leak
  object: 'competitor-and-ua.md §2: ''screenshotting ads seen inside another game mislabels them as that game''s creative'''
  situation: Hypercasual runner shows 11 interstitials per 30-minute session; each ad is a different studio's video the game studio has no right to license
  consequence: Shard contains third-party copyrighted creative and non-game dynamics; lab pays for 30 minutes and gets 24.5 minutes of game
