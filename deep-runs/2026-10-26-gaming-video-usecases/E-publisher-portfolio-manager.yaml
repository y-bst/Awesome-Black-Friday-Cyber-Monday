- id: publisher-1
  title: "Portfolio FTUE scorecard: the same 8 video-derived first-session metrics computed for all 30 titles and ranked in one table with percentile bands"
  level: L3
  cell: {buyer-role: product-retention, video-source: own-players-consented-sdk, signal-extracted: ui-state-and-screen-flow, analysis-type: cohort-comparison, lifecycle-moment: ftue-first-session, delivery-form: dashboard, buyer-org-type: publisher, pricing-model: per-game}
  object: "Unity ordered funnels vs GameAnalytics 'Any Order' funnels (methods-churn-funnel.md §1): the same players produce different drop-off numbers"
  situation: "Monthly portfolio review: 30 titles from 9 studios instrument tutorial steps differently (one title logs 6 progression events, another 22), so 'tutorial completion' is not comparable across titles"
  consequence: "The manager cannot say whether title 14's 61% tutorial completion is worse than title 3's 74%; the comparison is decided by which studio defined steps more coarsely, and FTUE fixes are assigned by argument, not by rank"
  p_typical: 0.15
  grounded: inferred
  evidence: "'Steps must be completed in exact order or the user counts as lost' (Unity) vs 'Funnels are Any Order' (GameAnalytics), methods-churn-funnel.md §1"
  proposed: "One scorecard schema owned by the publisher; per-title screen classifier bootstrapped from VLM labels on about 300 frames per title"
  shallow: false
  mechanism: "From 200 sampled first sessions per title, a per-title screen classifier labels tutorial card, forced-tap overlay, free play, fail screen, store, offer popup; it computes 8 fixed metrics (seconds to first free input, forced-tutorial minutes, mean tutorial-card dwell, unnoticed-CTA rate, minute of first fail, minute of first store exposure, rage taps per session, screen at app kill) and ranks the 30 titles"
  example: "Match-3 title 14 sits at P20 for forced-tutorial minutes (6.5 min vs portfolio median 2.8 min); the manager asks its studio to cut two forced steps before the next soft-launch cohort"
  cost: M
  depends_on: "a capture path in each title (SDK, emulator or platform capture) and per-title classifier bootstrapping"
  buyer: "VP publishing / portfolio manager at a mobile publisher with 30 live or soft-launch titles"
  input: "Consented device screen video of the first 15 minutes at 1-2 fps, touch overlay, install date and build id"
  why_existing_tools_cannot: "Event funnels count only what each studio instrumented and leave 'why' to 'investigate' (methods-churn-funnel.md §1); session-replay SDKs do not interpret game state (market.md §2 'Does NOT do')"
  willingness_to_pay: "4 - publishers already pay five figures a year per intelligence feed: Sensor Tower median $75,000/yr, GameRefinery $45-51k/yr (competitor-and-ua.md §1 Prices); at about $2k per title per year the portfolio contract is $60k"

- id: publisher-2
  title: "Soft-launch week-2 go/kill memo: 300 first sessions from the test market split into 'quit on a fixable screen' vs 'quit after free play began', 3 clips per bucket"
  level: L4
  cell: {buyer-role: finance-exec, video-source: own-players-consented-sdk, analysis-type: funnel-drop-off-why, lifecycle-moment: soft-launch, delivery-form: per-cohort-report, value-lever-b2b: de-risk-a-go-kill-decision, capture-trigger-and-sampling: targeted-cohort, buyer-org-type: publisher}
  object: "GameAnalytics 2026 benchmark: median D1 about 22%, P75 just above 30%, median D7 just under 4% (methods-churn-funnel.md §1 Benchmarks)"
  situation: "Title at day 14 of soft launch in 2 test markets with D1 24%, between median and P75; the publisher must choose scale, iterate 8 weeks, or kill"
  consequence: "Today the call rests on D1, D7 and CPI only; a title with a fixable FTUE flaw gets killed, or a title whose core loop is rejected gets 8 more weeks of UA spend"
  p_typical: 0.12
  grounded: quote
  evidence: "Rovio/Aalto: real pass rate vs churn r = -0.144; vs 'churn without completing the level' r = -0.586 (methods-churn-funnel.md §3)"
  proposed: "Memo states the share of D1 loss in each bucket; 'fixable' share above 50% means iterate, below 20% with low free-play dwell means kill"
  shallow: false
  mechanism: "Classifies the last 60 s before each non-returning player's final app close: fixable screen (unnoticed CTA, unreadable card, load wait above 20 s, blocked input) vs core-loop rejection (quit after 3+ minutes of free play without fail); outputs bucket shares and the 3 most common screens per bucket"
  example: "Puzzle RPG: 58% of non-returning players quit during a 40-second forced hero-upgrade tutorial; memo says iterate; D1 moves from 24% to 29% in the next build"
  cost: M
  depends_on: "publisher-1 scorecard classifier and consented capture in the soft-launch build"
  buyer: "Head of publishing / CFO who signs off soft-launch UA budget at a publisher"
  input: "Event-triggered 90 s clips at first session end from 1-5% of soft-launch installs plus D1/D7 return flags"
  why_existing_tools_cannot: "PlaytestCloud analyses recruited testers' transcripts with 'no churn or retention link to production telemetry' (market.md §1 'Does NOT do'); funnels show where, not why (methods-churn-funnel.md §1 INFERRED)"
  willingness_to_pay: "5 - the memo guards a soft-launch UA budget; publishers pay PlaytestCloud EUR 1,130-2,825/month for recorded sessions without a retention link (market.md §1); priced per soft launch at $8-15k (inferred)"

- id: publisher-3
  title: "Minute-of-first-paid-offer benchmark: when the first store screen or offer popup appears in each of 30 titles, how long it stays, the share dismissed in under 1 s, and whether a price was legible"
  level: L4
  cell: {buyer-role: monetisation, signal-extracted: economy-and-store-events, analysis-type: cohort-comparison, lifecycle-moment: ftue-first-session, delivery-form: dashboard, buyer-org-type: publisher, companion-data: purchase-and-ad-revenue-events}
  object: "methods-churn-funnel.md §2 INFERRED list: 'a visible CTA never tapped (UI not noticed)' and 'dwell/reading time ... before dismiss'"
  situation: "Portfolio monetisation review: starter packs appear at different minutes in 30 titles, and only purchases are logged, not offers seen and closed"
  consequence: "The publisher cannot set a portfolio rule for first-offer timing; titles that show a $4.99 pack at minute 2 burn the offer on players who have not yet had a win"
  p_typical: 0.07
  grounded: inferred
  evidence: "PlaytestCloud's AI 'keys on think-aloud speech, not on visible behaviour' (methods-churn-funnel.md §2)"
  proposed: "Portfolio guideline derived from the distribution: first paid offer after the first win screen, dwell target above 3 s"
  shallow: false
  mechanism: "Store/offer screen detector plus OCR on price strings; per title outputs the distribution of first-offer minute, dwell seconds, share closed within 1 s, and offer-seen-to-purchase rate joined to purchase events"
  example: "Two idle titles: title 7 shows a $4.99 starter pack at minute 2 and 81% close it within 1 s; title 22 shows it at minute 11 after the first boss win, dwell 6 s, 3.1% buy; title 7 moves its pack"
  cost: S
  depends_on: "publisher-1 capture and screen classifier"
  buyer: "Head of monetisation at the publisher's central live-ops team"
  input: "Consented first-session screen video plus purchase and ad-revenue events keyed by install id"
  why_existing_tools_cannot: "'A step that was never instrumented ... does not exist in the data' (methods-churn-funnel.md §1 INFERRED); an offer seen and closed is only an event if the studio anticipated it"
  willingness_to_pay: "3 - monetisation is budgeted but the notes give no direct price for offer-exposure analytics; nearest anchor is EUR 113-141 per analysed session at PlaytestCloud (market.md §1)"

- id: publisher-4
  title: "Genre yardstick: an agent plays the first 20 minutes of the top 40 grossing games in each of the publisher's 5 genres every month on emulator, and the scorecard places each portfolio title against them"
  level: L3
  cell: {buyer-role: competitive-intel, video-source: automated-bot-or-agent-playthrough, signal-extracted: ui-state-and-screen-flow, analysis-type: benchmark-vs-competitor, delivery-form: dashboard, effort: M-one-quarter, constraint-to-overcome: per-game-ui-generalisation, buyer-org-type: publisher}
  object: "Gamedexy: '186 chronological flows, 1,887 screens, 25 mobile games', human-captured, Pro $99/year (competitor-and-ua.md §1)"
  situation: "Manager wants to know whether the portfolio merge title's FTUE is long or short for its genre; the only reference libraries cover 25 games and are captured by hand"
  consequence: "Without a genre baseline every studio argues its genre is different; with 200 competitor FTUEs re-run monthly, structural gaps become a number"
  p_typical: 0.07
  grounded: quote
  evidence: "GameRefinery: 'about 260 features are tracked manually'; Playliner logs 'hundreds of hours' of playtime across 230+ games (competitor-and-ua.md §1)"
  proposed: "Only structural metrics (forced-tutorial screens, currencies shown by minute 10, minute of first offer, minute of first social prompt) are compared, since agent timing is not human timing"
  shallow: false
  mechanism: "A VLM agent completes each competitor FTUE on emulator instances; the same screen classifier extracts structural metrics; a monthly re-run flags competitor FTUE changes as a diff"
  example: "Portfolio merge title shows 4 currencies by minute 10; top-10 merge games median 2; studio defers gems to day 2"
  cost: M
  depends_on: "vision agent able to finish FTUEs (nunu.ai-class, market.md §3) and the publisher-1 schema"
  buyer: "Competitive-intelligence analyst reporting to the portfolio manager at a publisher"
  input: "Emulator capture of agent playthroughs of public store builds plus store rank and genre tags"
  why_existing_tools_cannot: "Automated tagging 'reads store metadata and ad creatives, not recorded gameplay sessions' (competitor-and-ua.md §1 INFERRED); no vendor does CV-based competitor gameplay analysis (market.md §9)"
  willingness_to_pay: "4 - Sensor Tower median $75,000/yr and its 2025 purchase of human-logged Playliner show publishers pay for game-feature coverage (competitor-and-ua.md §1, §8)"

- id: publisher-5
  title: "Pitch-build check: 40 panel players play a developer's pitch build for 20 minutes; report places its FTUE scorecard inside the distribution of the publisher's 30 titles at the same stage"
  level: L3
  cell: {buyer-role: publishing-scout-bd, video-source: publisher-pitch-builds, analysis-type: benchmark-vs-competitor, lifecycle-moment: publisher-pitch-or-diligence, delivery-form: per-cohort-report, effort: XS-repackage-existing-user-test-product, constraint-to-overcome: studio-ip-and-prerelease-leak, buyer-org-type: publisher}
  object: "PlaytestCloud / Nitro Games case: 'tested builds with no tutorial to see what players understand unaided ... tutorial completion rose to 90%' (methods-churn-funnel.md §2)"
  situation: "Publishing BD reviews 15 pitches a quarter; each developer shows its own retention slide and a trailer"
  consequence: "Signings rest on the developer's own numbers; a pitch with an unreadable core gesture is signed and the flaw surfaces 6 months later in soft launch"
  p_typical: 0.06
  grounded: inferred
  evidence: "PlaytestCloud's AI reads 'video transcripts and survey responses' (market.md §1)"
  proposed: "Pitch builds stay on the vendor's watermarked test pipeline (Antidote-style anti-leak) so developers agree to share them"
  shallow: false
  mechanism: "Existing User Test product records panel sessions with think-aloud; the scorecard classifier adds quit minute, unaided discovery of the core gesture, and forced-tutorial minutes; the report adds a percentile against portfolio titles' own pitch-stage sessions"
  example: "Developer says 'tutorial tested'; 22 of 40 players never find the merge gesture without the hand pointer; publisher signs with a milestone to rework the tutorial before soft launch"
  cost: S
  depends_on: "the existing User Test product and a stored archive of portfolio titles' pitch-stage sessions"
  buyer: "Publishing BD scout / head of external development at a publisher"
  input: "Recorded panel sessions of a pitch build (screen, touch, voice) plus a short post-play survey"
  why_existing_tools_cannot: "Playtest vendors return one report per test with no cross-title baseline; the AI reads transcripts, not pixels (market.md §1 'Does NOT do')"
  willingness_to_pay: "4 - EUR 113-141 per analysed session (market.md §1 INFERRED) makes a 40-player check about EUR 5k, small against a signing commitment"

- id: publisher-6
  title: "Cross-studio pattern digest: when one title's FTUE change lifts D1 by 2+ points, a before/after clip pair and screen-flow diff goes to the other 29 studio teams"
  level: L3
  cell: {buyer-role: product-retention, analysis-type: build-to-build-regression-diff, lifecycle-moment: new-version-release, delivery-form: weekly-digest-email, buyer-org-type: publisher, value-lever-b2b: cut-time-to-insight, companion-data: build-and-config-metadata}
  object: "Deconstructor of Fun 2025 FTUE case: sessions grouped by early behaviour and tied to D1 led to a branching tutorial (competitor-and-ua.md §1)"
  situation: "Title 9 removes a name-entry screen and D1 rises from 26% to 28.5%; 6 other portfolio titles still ask for a name in minute 1"
  consequence: "Wins stay inside one studio; the publisher pays for the same discovery 6 more times"
  p_typical: 0.04
  grounded: inferred
  evidence: "Unity funnel edit 'would invalidate any existing data', so a new hypothesis means a new funnel (methods-churn-funnel.md §1)"
  proposed: "Digest lists which other titles contain the removed screen type, with a link to their own clip of it"
  shallow: false
  mechanism: "Compares screen-flow graphs between build N-1 and N, tags the diff (step removed, card shortened, offer moved), joins the D1 delta from the publisher warehouse, and finds sibling titles whose flow still has the removed step"
  example: "Digest of week 42: 'name entry removed in title 9, D1 +2.5 pts; still present in titles 3, 5, 12, 17, 21, 28' with two 10-second clips"
  cost: S
  depends_on: "publisher-1 scorecard running across titles and build ids in capture metadata"
  buyer: "Portfolio manager / head of central product at a publisher"
  input: "Consented first-session video for two consecutive builds per title plus D1 by build"
  why_existing_tools_cannot: "Amplitude and GameAnalytics are deployed per title and see events, not screens, so a pattern in one title cannot be searched for in another (methods-churn-funnel.md §1)"
  willingness_to_pay: "2 - no buyer signal found for internal knowledge transfer; sells only as a feature of the publisher-1 contract"

- id: publisher-7
