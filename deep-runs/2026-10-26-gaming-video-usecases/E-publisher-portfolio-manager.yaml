- id: publisher-8
  title: "Publisher-standard capture module inside the publisher SDK bundle: one consent screen, 90-second ring buffer uploaded only on 4 triggers, 1% of new installs, Wi-Fi only"
  level: L3
  cell: {buyer-role: engineering-performance, video-source: own-players-consented-sdk, delivery-form: api-or-sdk, capture-trigger-and-sampling: event-triggered-clip, constraint-to-overcome: integration-effort-per-engine, buyer-org-type: publisher, processing-location: vendor-cloud}
  object: "Sentry onErrorSampleRate 'buffers and uploads only if an error occurs, keeping about the last minute before the error' (methods-churn-funnel.md §6)"
  situation: "30 titles across Unity, Unreal and Cocos from 9 studios; negotiating an SDK integration with each studio separately takes a quarter per studio"
  consequence: "Portfolio benchmarks stall at the 5 titles whose studios said yes; the 4 triggers (tutorial abandon, app kill on fail screen, 3 rage taps within 300 ms, first session end) keep upload near 1 MB per clip"
  p_typical: 0.05
  grounded: quote
  evidence: "'A studio at 100k new installs/day recording only the first 10 minutes at 1 Mbps would ingest about 7.5 TB/day' (methods-churn-funnel.md §7 INFERRED)"
  proposed: "Module ships with the publisher's existing ads/analytics bundle so titles get capture in one release cycle"
  shallow: false
  mechanism: "Engine plugins for Unity, Unreal and Cocos record a 90 s on-device ring buffer at 2 fps 480p and upload it only on trigger; consent copy and visible recording indicator identical across titles to meet Apple's 2019 rule"
  example: "Publisher adds the module to SDK bundle v5; 22 of 30 titles get capture in one release cycle without per-studio negotiation"
  cost: M
  depends_on: "nothing"
  buyer: "Head of publishing technology who maintains the SDK bundle shipped in all portfolio titles"
  input: "On-device screen frames, touch events, trigger events from the publisher analytics SDK"
  why_existing_tools_cannot: "IV Metrics is Unity-only and capped at 50-100 videos/month; PostHog Unity is screenshot-only with no masking (market.md §2)"
  willingness_to_pay: "3 - a prerequisite more than a product; IV Metrics $49-99/month per project is the visible anchor (market.md §2)"

