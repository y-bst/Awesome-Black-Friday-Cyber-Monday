  level: L3
  cell: {buyer-role: finance-exec, signal-extracted: input-timing-and-hesitation, analysis-type: root-cause-of-a-metric-change, lifecycle-moment: sunset-decision, delivery-form: per-cohort-report, buyer-org-type: publisher, value-lever-b2b: de-risk-a-go-kill-decision}
  object: "methods-churn-funnel.md §2 INFERRED signals: 'pause/menu toggling; time-to-first-meaningful-action'"
  situation: "Title 27 revenue down 30% over 2 quarters; logs show fewer sessions but not whether content ran out, new players bounce, or an OS update slowed loading"
  consequence: "The publisher keeps a 6-person team on a title whose veterans have exhausted content, or cuts a title whose decline is a fixable load regression"
  p_typical: 0.03
  grounded: inferred
  evidence: "'The predictive ceiling is set by feature content, not model class' (methods-churn-funnel.md §3 INFERRED)"
  proposed: "Report labels the decline 'content exhausted', 'FTUE bounce' or 'technical' with clip evidence for each"
  shallow: false
  mechanism: "Distributions of veteran behaviour (seconds idle in hub, share of sessions replaying max level, store screen visits) and new-player behaviour (publisher-1 metrics) compared month-on-month against a 6-month-old baseline"
