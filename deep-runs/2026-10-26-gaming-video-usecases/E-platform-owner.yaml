- id: platform-1
  title: "Genre FTUE benchmark from emulator capture of the top 2,000 mobile titles: tutorial cards shown, minutes to first store screen, first-session length and D1 return per title vs genre median"
  level: L4
  cell: {buyer-role: platform-owner, video-source: platform-or-emulator-capture, signal-extracted: ui-state-and-screen-flow, analysis-type: benchmark-vs-competitor, lifecycle-moment: ftue-first-session, delivery-form: dashboard, buyer-org-type: platform-or-store, pricing-model: annual-enterprise-licence, go-to-market-channel: bundled-with-platform, value-lever-b2b: create-data-that-did-not-exist}
  object: "market.md §9 gap map: 'No vendor found that applies computer vision to production player gameplay video'; methods-churn-funnel.md §1 benchmarks: 'many top-performing studios store data in-house and never appear in public benchmarks'"
  situation: "The platform already renders first sessions of 2,000 titles with no game SDK; a studio asks developer relations how its FTUE compares with its genre"
  consequence: "The platform gets a developer-program asset no SDK vendor can match; studios see their title against an anonymised genre median; without per-studio opt-in the benchmark leaks rival titles' numbers and studios may block the emulator"
  p_typical: 0.15
  grounded: inferred
  evidence: "'many top-performing studios store data in-house and never appear in public benchmarks' (methods-churn-funnel.md §1)"
  proposed: "Ship 5 metrics for 3 genres (match-3, merge, idle) to 50 opted-in studios before widening"
  shallow: false
  mechanism: "Per-genre screen classifier (tutorial card, store, fail, level-complete), bootstrapped by a VLM on about 300 labelled frames per title, runs on a 2% sample of first sessions at 1 fps; computes 5 metrics per title and places each in percentiles across 52 subgenres"
  example: "A match-3 studio sees 11 tutorial cards and 9.5 min to first store screen vs a genre median of 6 cards and 4 min, and D1 return on the platform of 24% vs 31%; it cuts 4 cards in the next build"
  cost: M
  depends_on: "platform capture consent toggle; per-genre screen taxonomy; studio opt-in for inclusion"
  buyer: "Head of developer relations or platform BD at an Android emulator or cloud-gaming platform"
  input: "Platform-side frame capture at 1 fps of first sessions plus platform session start/end and return-visit events"
  why_existing_tools_cannot: "GameRefinery deconstructions are analysts playing games by hand, about 260 features logged manually (competitor-and-ua.md §1); GameAnalytics benchmarks are event-only and miss studios that keep data in-house (methods-churn-funnel.md §1)"
  willingness_to_pay: "4: competitor-intel buyers pay Sensor Tower a median $75,000/yr and GameRefinery about $45-51k/yr (competitor-and-ua.md §1 Prices); the platform would pay an annual licence and give the output away as a developer perk"

- id: platform-2
  title: "Uninstall exit report: a 60-second platform ring buffer before each title's last session, classified into end-screen type (fail screen, interstitial ad, store, loading, error dialog), sent to the studio weekly as a % breakdown"
  level: L4
  cell: {buyer-role: platform-owner, video-source: platform-or-emulator-capture, signal-extracted: ui-state-and-screen-flow, analysis-type: funnel-drop-off-why, lifecycle-moment: post-churn-winback, delivery-form: per-cohort-report, capture-trigger-and-sampling: always-on-ring-buffer, processing-location: edge-or-platform-server, pricing-model: free-with-platform}
  object: "methods-churn-funnel.md §1 Unity funnel docs: unexpected drop-offs 'indicate good places to investigate'; market.md §1 Steam Playtest: 'No recording or analysis is provided'"
  situation: "A player uninstalls a title from the emulator, or does not reopen it within 7 days; the last 60 s before that session closed is kept, all other buffer content is overwritten"
  consequence: "The studio learns what was on screen when players left, at zero integration cost; the platform uses it to win studio partnerships; the 7-day wait means the report lags one week behind a build"
  p_typical: 0.12
  grounded: inferred
  evidence: "Funnels 'show where drop offs happen' and leave the cause to 'investigate game play, user interface, or other issues' (methods-churn-funnel.md §1)"
  proposed: "Launch for hypercasual titles first where end screens are few and visually distinct"
  shallow: false
  mechanism: "Edge job keeps a 60 s ring buffer per running title; on uninstall or session close the buffer is classified into 6 end-screen classes plus 'interrupted by another app'; aggregates per title per week"
  example: "A hypercasual runner sees 38% of final sessions end within 5 s of a 30-second unskippable interstitial after level 3; the studio moves the first interstitial to level 6"
  cost: S
  depends_on: "ring-buffer capture in the emulator client; end-screen classifier; consent text covering the platform's own capture"
  buyer: "Developer-program product manager at an emulator or PC app-player platform"
  input: "Platform ring-buffer video of the final 60 s plus uninstall and session-close events from the platform client"
  why_existing_tools_cannot: "Event funnels answer where, not why, and replay SDKs need per-game integration (methods-churn-funnel.md §1, §6); Steam's free playtest channel provides no capture or analysis (market.md §1)"
  willingness_to_pay: "3: studios pay IV Metrics $49-99/month for capped gameplay replay (market.md §2); the platform would fund it as a free perk, not charge per report"

- id: platform-3
  title: "Emulator release gate: agents replay a fixed 3-minute route in the top 500 titles on the current and candidate emulator build; frame diff plus VLM flags missing textures, flicker and black screens per title and files blocking tickets"
  level: L4
  cell: {buyer-role: engineering-performance, video-source: automated-bot-or-agent-playthrough, signal-extracted: visual-errors-and-glitches, analysis-type: build-to-build-regression-diff, lifecycle-moment: new-version-release, delivery-form: issue-tracker-ticket, buyer-org-type: platform-or-store, capture-trigger-and-sampling: scheduled-bot-playthrough, automation-level: auto-created-ticket-or-asset}
  object: "adjacent-usecases.md §1: best zero-shot VLM 'precision 0.50 / accuracy 0.72 on 100 industrial videos'; methods-churn-funnel.md §4: temporal glitches 'substantially harder' for VLMs"
  situation: "The platform changes its graphics backend or GPU driver layer and must ship to millions of installs without breaking any top-500 title"
  consequence: "Regressions caught before release instead of via a ticket spike; diffing against the previous build's frames cuts false positives that zero-shot detection produces at 0.50 precision"
  p_typical: 0.05
  grounded: inferred
  evidence: "'best off-the-shelf VLM zero-shot baseline reached precision 0.50 / accuracy 0.72 on 100 industrial videos' (adjacent-usecases.md §1)"
  proposed: "Start with 100 titles and a pixel-diff threshold, add VLM labelling only on frames that differ"
  shallow: false
  mechanism: "Recorded input macros replayed deterministically on both builds; per-frame perceptual diff isolates divergent frames; a VLM labels divergent frames into 5 glitch classes; one ticket per title with side-by-side clips"
  example: "Vulkan backend change in build N+1: 14 of 500 titles render without a shadow pass, 2 show a black screen after the splash; release held 2 days"
  cost: M
  depends_on: "deterministic replay of recorded inputs inside the emulator; GPU test farm; ticket integration"
  buyer: "VP engineering or graphics compatibility lead at an Android emulator company"
  input: "Agent or macro playthrough video on internal emulator builds plus build and config metadata (graphics mode, driver version)"
  why_existing_tools_cannot: "Razer QA Companion-AI and ManaMind detect bugs in the studio's own build, not a platform's compatibility layer across 500 titles (market.md §3); zero-shot VLM precision is 0.50 (adjacent-usecases.md §1)"
  willingness_to_pay: "4: outsourced game QA costs $15-50 per tester hour (adjacent-usecases.md §1); 500 titles x 3 min x every release is weekly labour the platform pays for today"

- id: platform-4
  title: "Per-title load-screen time by host GPU: a classifier recognises each title's own loading screens in 1 fps capture and reports seconds per load by GPU family and emulator graphics mode"
  level: L4
  cell: {buyer-role: engineering-performance, video-source: platform-or-emulator-capture, signal-extracted: load-and-wait-screens, analysis-type: cohort-comparison, companion-data: device-perf-counters, delivery-form: dashboard, game-platform-and-genre: mobile-midcore-f2p, buyer-org-type: platform-or-store}
  object: "adjacent-usecases.md §6: 'reliable fps/load measurement uses in-game profiling or GameBench rather than video alone'"
  situation: "Players on low-end PC hosts complain a title is slow; the platform's counters show CPU/GPU load but not which game screen is a load screen"
  consequence: "Compat team sets per-title default graphics mode from evidence; load screens are game UI so only the video identifies them without game hooks"
  p_typical: 0.04
  grounded: inferred
  evidence: "'same build can run 60 fps on a flagship and 24 fps on a mid-tier phone' (adjacent-usecases.md §6)"
  proposed: "Label load screens once per title with a VLM, then run a tiny per-title classifier on the edge"
  shallow: false
  mechanism: "VLM labels spinner, progress-bar and splash screens per title from 50 sessions; a small classifier then times every load in sampled sessions; joined with host GPU and graphics mode from the platform's counters"
  example: "Midcore RPG 'Arena loading' screen: median 41 s on Intel UHD 620 hosts vs 9 s on GTX 1650; compat team sets DirectX mode as default for that title and the median falls to 14 s"
  cost: S
  depends_on: "platform capture; host hardware inventory per session"
  buyer: "Performance and compatibility lead at an emulator platform"
  input: "Platform capture at 1 fps plus host CPU/GPU model and emulator graphics settings"
  why_existing_tools_cannot: "GameBench and device clouds measure counters on lab devices or via SDK and do not know which frame is a game load screen (adjacent-usecases.md §6)"
  willingness_to_pay: "3: internal engineering spend; no external price; GameBench sells comparable measurement on enterprise quote (adjacent-usecases.md §6)"

- id: platform-5
  title: "OEM title-health scorecard: phone game-assistant capture on opted-in devices detects texture pop-in, stutter frames and thermal-driven render-scale drops in the top 100 titles, scored per chipset vs rival devices"
  level: L3
  cell: {buyer-role: engineering-performance, buyer-org-type: device-oem, video-source: platform-or-emulator-capture, signal-extracted: visual-errors-and-glitches, analysis-type: benchmark-vs-competitor, delivery-form: per-cohort-report, pricing-model: annual-enterprise-licence, game-platform-and-genre: mobile-midcore-f2p}
  object: "adjacent-usecases.md §6 GameBench: 'used by game studios, device makers, chipset vendors'; INFERRED: 'its edge is rendering/visual defects per device model'"
  situation: "A chipset vendor's gaming program decides which 10 titles get optimisation engineers before a flagship launch"
  consequence: "Engineer time goes to titles where artefacts are visible on its silicon; counters alone show fps but not pop-in or resolution drops"
  p_typical: 0.06
  grounded: inferred
  evidence: "'INFERRED: video-only analysis competes with cheap counters for fps; its edge is rendering/visual defects per device model and no-SDK use on shipped builds' (adjacent-usecases.md §6)"
  proposed: "Pilot with one OEM game-mode app on 3 devices and 20 titles"
  shallow: false
  mechanism: "OEM game assistant samples 1 frame/s plus 2-second 60 fps bursts every 5 minutes; detectors score pop-in, stutter (repeated frames) and render-scale (edge sharpness) per title per chipset over session time"
  example: "A gacha RPG drops to about 40% render scale after 18 min on chipset X vs 27 min on a rival; the vendor funds a 2-week engine sprint with the studio"
  cost: M
  depends_on: "OEM game-mode capture hook; rival devices in a lab for the comparison"
  buyer: "Gaming program lead at a phone OEM or mobile chipset vendor"
  input: "OEM game-assistant capture on consenting devices plus SoC thermal and clock counters"
  why_existing_tools_cannot: "GameBench measures fps, CPU/GPU, battery and thermals, not visible rendering artefacts (adjacent-usecases.md §6)"
  willingness_to_pay: "3: OEMs and chipset vendors already buy GameBench SDK and Labs on enterprise pricing (adjacent-usecases.md §6)"

- id: platform-6
  title: "Signed 'verified human session' flag for emulator ad inventory: platform scores input cadence plus on-screen behaviour per session and attaches a signed human/bot flag to each ad request"
  level: L3
  cell: {buyer-role: ad-network-ops, video-source: platform-or-emulator-capture, signal-extracted: bot-or-fraud-behaviour, analysis-type: ad-verification-and-fraud, companion-data: touch-and-controller-input, pricing-model: cpm-or-per-impression-verified, buyer-org-type: ad-network-or-dsp, automation-level: closed-loop-in-game-action}
  object: "adjacent-usecases.md §2: server-side LSTM '88.6% accuracy with 0.97% false-positive rate'; B-perspectives ad-network-and-mediation-ops: 'fraud (bots and emulator farms) visible on screen'"
  situation: "Ad networks discount or block all emulator traffic because multi-instance farms replay macros to farm rewarded ads"
  consequence: "Human emulator sessions earn full CPM again; macro farms are dropped; at 0.97% false positives about 1 in 100 human sessions loses ad revenue"
  p_typical: 0.05
  grounded: speculative
  evidence: "'server-side LSTM reached 88.6% accuracy with 0.97% false-positive rate in one paper; authors stress false accusations as the key risk' (adjacent-usecases.md §2)"
  proposed: "Offer the flag to one mediation partner as a bid-request field for 30 days and compare fill and CPM"
  shallow: false
  mechanism: "Model on key/touch inter-press timing variance, camera movement and menu dwell in the video; identical screen sequences across instances on one host mark a farm; flag signed with a platform key per session"
  example: "A mediation platform accepts 80% of emulator sessions scored human at full CPM and drops a 3,000-instance farm replaying the same 12-step macro"
  cost: M
  depends_on: "network partner willing to read the flag; per-session signing; input log from the keymapping layer"
  buyer: "Fraud and supply-quality lead at an ad network or mediation platform (sold by the emulator platform)"
  input: "Platform capture plus keymapping-layer input timing and multi-instance host metadata"
  why_existing_tools_cannot: "Anybrain and FACEIT Human Input Detection score inputs for cheating and sell to game operators, not ad networks (adjacent-usecases.md §2); ad tools analyse the creative, not the device session (competitor-and-ua.md §3)"
  willingness_to_pay: "3: no price in the notes; buyer signal is the ad-network persona's interest in emulator-farm fraud; priced per verified impression"

- id: platform-7
  title: "Rewarded-ad render audit: platform captures 30 s around each sampled ad call and reports whether the creative rendered, % of frames covered by game UI, seconds before close tap and black-frame playables, per publisher app"
  level: L4
  cell: {buyer-role: ad-network-ops, video-source: ad-and-playable-ad-sessions, signal-extracted: ad-render-and-viewability, analysis-type: ad-verification-and-fraud, delivery-form: api-or-sdk, capture-trigger-and-sampling: event-triggered-clip, buyer-org-type: ad-network-or-dsp, pricing-model: cpm-or-per-impression-verified}
  object: "competitor-and-ua.md §3 INFERRED: 'Every tool above analyses the ad video plus network metrics (impressions, IPM, CPI)'"
  situation: "A network pays a publisher app for rewarded views it cannot see; the platform renders those views on screen"
  consequence: "The network claws back payment for impressions hidden behind game UI and alerts the publisher; the advertiser gets render evidence"
  p_typical: 0.04
  grounded: inferred
  evidence: "'None links an ad element to what the acquired player did on device in the first session' (competitor-and-ua.md §3)"
  proposed: "Sample 1% of ad calls; report per app per week"
  shallow: false
  mechanism: "Ad-call event triggers a 30 s clip; detector finds the ad surface, measures occlusion by overlays, black frames and time-to-close; aggregates per publisher app"
  example: "One publisher app shows rewarded video behind a semi-transparent shop overlay in 22% of impressions; network withholds payout on those and notifies the publisher"
  cost: M
  depends_on: "ad-call hook in the platform client; agreement with the network on data sharing"
  buyer: "Supply-quality or ad-ops lead at an ad network or DSP"
  input: "Platform clips around ad calls plus ad-call metadata (network, placement id, creative id)"
  why_existing_tools_cannot: "UA creative tools (Segwise, Alison, Replai) read the ad file and network metrics, never what rendered on the device (competitor-and-ua.md §3)"
  willingness_to_pay: "3: no direct price in notes; UA teams pay $499-1,699/month for creative tagging (competitor-and-ua.md §3), verification would sit on the network's supply-quality budget"

- id: platform-8
  title: "Listing-truth check: compare mechanics shown in a title's store preview and top 5 ads with the first 15 minutes of real platform sessions; flag titles whose advertised core loop appears in under 5% of sessions"
  level: L4
  cell: {buyer-role: platform-owner, video-source: competitor-store-and-ad-video, signal-extracted: ui-state-and-screen-flow, analysis-type: compliance-audit, lifecycle-moment: ua-campaign-launch, delivery-form: enforcement-or-cert-evidence-pack, buyer-org-type: platform-or-store, value-lever-b2b: avoid-fine-or-cert-failure}
  object: "competitor-and-ua.md §2: 'App Store previews may only use footage captured in the app itself'; §3 INFERRED: no tool links the ad to what the acquired player did"
  situation: "Players leave 1-star reviews saying 'the game is nothing like the ad'; the store has no evidence beyond reviews"
  consequence: "The store attaches a review flag or requests a new preview with clip evidence; studios relying on misleading ads lose featuring"
  p_typical: 0.06
  grounded: inferred
  evidence: "'AI Vidia states App Store previews may only use footage captured in the app itself (vendor)' (competitor-and-ua.md §2)"
  proposed: "Run on the 200 titles with the most 'not like the ad' review mentions"
  shallow: false
  mechanism: "VLM describes the core mechanic in each preview/ad in a fixed vocabulary; the same labeller runs on 400 first sessions; share of sessions containing the advertised mechanic is computed per title"
  example: "A 'pull the pin' ad mechanic appears in 0 of 400 captured first sessions of the title; the store asks the developer for a new preview and adds a 'gameplay differs from ads' note"
  cost: M
  depends_on: "ad library access (Meta Ads Library, TikTok Creative Center) plus platform capture"
  buyer: "Store policy and review lead at an app store or emulator storefront"
  input: "Store preview videos and public ad-library videos plus platform capture of first sessions"
  why_existing_tools_cannot: "Ad-creative tools analyse the ad only, never post-install gameplay (competitor-and-ua.md §3); store preview rules are checked by human review (competitor-and-ua.md §2)"
  willingness_to_pay: "2: no price in notes; driven by store reputation and consumer-protection pressure, so the store would build rather than buy"

- id: platform-9
  title: "Submission rating cross-check: an agent plays a submitted build for 20 minutes; VLM labels violence level, simulated-gambling screens and paid random-reward items; mismatches with the developer's IARC answers go to the human reviewer with timestamps"
  level: L4
  cell: {buyer-role: rating-and-consumer-compliance, video-source: automated-bot-or-agent-playthrough, signal-extracted: dark-pattern-and-disclosure-ui, analysis-type: content-rating-classification, lifecycle-moment: certification-submission, delivery-form: enforcement-or-cert-evidence-pack, buyer-org-type: platform-or-store, pricing-model: per-audit-or-certification}
  object: "adjacent-usecases.md §3 INFERRED: 'vision-based toxicity (offensive gestures, names, UGC on screen) was not evidenced in sources'; market.md §3 nunu.ai agent 'fully vision-based'"
  situation: "A store reviews hundreds of submissions a week against self-declared rating questionnaires it cannot verify by playing each game"
  consequence: "Reviewers watch 15-second clips instead of playing; misdeclared gambling mechanics are caught before publication"
  p_typical: 0.04
  grounded: inferred
  evidence: "nunu.ai agent 'fully vision-based, taking a live stream from the device and issuing taps, swipes, keyboard input' (market.md §3)"
  proposed: "Label 4 descriptors only (violence, blood, simulated gambling, paid random items) in v1"
  shallow: false
  mechanism: "Vision agent plays 20 minutes; VLM tags frames against 4 rating descriptors; compares to questionnaire answers; outputs a timestamped clip per mismatch"
  example: "A 'casual farming' game answered 'no simulated gambling' but a slot-machine screen with gem purchase appears at 07:12; the reviewer gets the 15-second clip and requests a rating change"
  cost: M
  depends_on: "vision agent able to pass tutorials; descriptor taxonomy mapped to IARC questions"
  buyer: "Head of store review or content policy at an app store or emulator storefront"
  input: "Agent playthrough video of the submitted build plus the developer's rating questionnaire"
  why_existing_tools_cannot: "Vision agents (nunu.ai, modl.ai) are sold to studios for QA, not to stores for rating checks (market.md §3); no vision-based content moderation product was found (adjacent-usecases.md §3)"
  willingness_to_pay: "3: no price in notes; stores pay human reviewers per submission; a per-audit fee fits"

- id: platform-10
  title: "Weekly dark-pattern sweep of the catalogue: OCR and VLM over sampled sessions of the top 1,000 titles detect new paid-offer countdowns under 60 s, loot-box screens missing an odds link and gem bundles without a real-money equivalent"
  level: L4
  cell: {buyer-role: rating-and-consumer-compliance, video-source: platform-or-emulator-capture, signal-extracted: dark-pattern-and-disclosure-ui, analysis-type: anomaly-alert, lifecycle-moment: live-event-or-update, delivery-form: alert-or-slack, buyer-org-type: platform-or-store, constraint-to-overcome: accuracy-and-trust}
  object: "adjacent-usecases.md §7: 'most live events are announced without notice and cannot be scraped'"
  situation: "A title changes its shop in a live-ops update after store approval; the store learns from a regulator or press"
  consequence: "Policy team opens a ticket within 24 h of the change; false alerts on legitimate event timers cost reviewer time"
  p_typical: 0.03
  grounded: inferred
  evidence: "'most live events are announced without notice and cannot be scraped; gathering takes large human resources' (adjacent-usecases.md §7)"
  proposed: "Alert only on change vs last week's state per title, not on absolute presence"
  shallow: false
  mechanism: "Shop and chest screens classified per title; OCR reads timers, prices and links; diff against the previous week's state; alert on 3 rule types"
  example: "After update 4.2 a top-50 title adds a 'last chance 00:45' paid offer and drops the odds link from its chest screen; the store opens a policy ticket the next morning"
  cost: M
  depends_on: "platform capture covering shop screens; per-title shop-screen classifier from platform-1"
  buyer: "Compliance lead for consumer protection at an app store or emulator storefront"
  input: "Sampled platform capture of shop, chest and offer screens plus title update timestamps"
  why_existing_tools_cannot: "Live events are logged by analysts playing games daily (GameRefinery, Playliner) and cannot be scraped (adjacent-usecases.md §7, competitor-and-ua.md §1)"
  willingness_to_pay: "2: no price in notes; regulatory exposure is the driver; store would fund it as internal compliance"

- id: platform-11
  title: "Mobile gameplay world-model dataset: consented emulator sessions with frame-synced keymap and touch inputs, PII-masked, labelled with game-state events, licensed per hour to AI labs with a revenue share to the title's studio"
  level: L3
  cell: {buyer-role: data-buyer-training, video-source: platform-or-emulator-capture, signal-extracted: structured-game-state-reconstruction, analysis-type: training-dataset-export, delivery-form: licensed-dataset, companion-data: touch-and-controller-input, pricing-model: data-licence-per-hour, value-lever-b2b: produce-a-sellable-asset, buyer-org-type: data-or-market-intel-buyer}
  object: "market.md §4: 'Medal has about 10M MAU ... clips/year, which can carry controller and mouse inputs'; Worldmodeldata 'licensed nearly 1M hours of game data from studios'"
  situation: "World-model labs buy paired video plus inputs; the platform holds mobile-game sessions with keymapping inputs that PC clip sites lack"
  consequence: "Highest revenue per hour of any option; Muse EULA backlash shows a platform EULA alone is not enough consent, and studio IP rights must be cleared per title"
  p_typical: 0.12
  grounded: inferred
  evidence: "'OpenAI reportedly offered $500M for Medal in late 2024'; 'Worldmodeldata ... licensed nearly 1M hours of game data from studios' (market.md §4)"
  proposed: "License only titles whose studio signs an opt-in and only sessions from adult accounts with explicit player consent"
  shallow: false
  mechanism: "Edge redaction (platform-12), then per-frame alignment of key/touch events, game-state labels (menu, combat, death) from per-genre classifiers, and per-title manifests with rights flags"
  example: "A lab licenses 50,000 hours across 120 opted-in mobile titles (MOBA, gacha RPG, runner) with per-frame key and touch events; each studio receives a share per hour of its title"
  cost: L
  depends_on: "platform-12 redaction; studio rights agreements; player consent flow"
  buyer: "Data acquisition lead at an AI lab training world models or game agents"
  input: "Platform capture plus keymapping-layer key and touch events and title metadata"
  why_existing_tools_cannot: "Medal and General Intuition hold PC clips; Worldmodeldata and Origin Lab license from studios title by title; none cites mobile touch-synced input at platform scale (market.md §4)"
  willingness_to_pay: "5: reported $500M offer for Medal, General Intuition at $2.3B, Worldmodeldata licensing about 1M hours (market.md §4, Signals of willingness to pay)"

- id: platform-12
  title: "Edge redaction before anything leaves the platform: OCR blurs player names, chat panels, friend lists and OS notifications; payment sheets and login screens drop the whole frame; each clip carries a per-title rights tag"
  level: L4
  cell: {buyer-role: platform-owner, video-source: platform-or-emulator-capture, signal-extracted: on-screen-text-ocr, processing-location: edge-or-platform-server, constraint-to-overcome: privacy-and-consent, delivery-form: api-or-sdk, automation-level: auto-created-ticket-or-asset, buyer-org-type: platform-or-store}
  object: "market.md §2: PostHog Unity SDK 'screenshot-based, with no built-in masking of text or images'; methods-churn-funnel.md §7 INFERRED: 'player names and chat in HUD/social panels, notifications overlaying the screen, payment sheets'"
  situation: "Any outbound use (studio reports, datasets, support clips) would ship raw frames with third-party names and payment details"
  consequence: "Every other platform option becomes shippable; residual leak risk sits in stylised fonts OCR misses"
  p_typical: 0.07
  grounded: quote
  evidence: "'Privacy hazards specific to game video: player names and chat in HUD/social panels, notifications overlaying the screen, payment sheets' (methods-churn-funnel.md §7)"
  proposed: "Measure miss rate on 1,000 hand-labelled frames from 20 chat-heavy titles before enabling any export"
  shallow: false
  mechanism: "Per-frame text detection plus a classifier for chat/friend-list panels; blur boxes; full-frame drop on payment and login screen classes; rights tag looked up from the studio opt-in table and clips without opt-in discarded at the edge"
  example: "A 10-minute clip from a guild-chat MMO leaves the edge with 212 name boxes blurred and 3 payment frames dropped; clips of a title without studio opt-in never leave"
  cost: M
  depends_on: "studio opt-in registry; GPU capacity at the platform edge"
  buyer: "Privacy engineering lead or DPO at the emulator or cloud platform"
  input: "Raw platform capture frames before export plus studio opt-in status per title"
  why_existing_tools_cannot: "PostHog's Unity replay has no text masking and app replay masks native UI views, not engine-rendered text (market.md §2, methods-churn-funnel.md §6)"
