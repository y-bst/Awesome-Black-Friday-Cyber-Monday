  why_existing_tools_cannot: "Localisation QA vendors compare translations by screenshot (adjacent-usecases.md s5 Gridly, Alconost), not regional content gating; human audits are per hour and per title (adjacent-usecases.md s4)."
  willingness_to_pay: "2 - signal: regulatory driver but market-by-market and episodic; no price in notes; per-market sweep sold as a managed project is my assumption"

