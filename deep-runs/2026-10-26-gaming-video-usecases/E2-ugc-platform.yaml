  object: "the in-experience purchase prompt (game pass or developer product) and its confirm dialog, seen with a child-age test account; altdata-13 measures seconds to first purchase prompt for an investor, not as a consumer-protection check"
  situation: "a creator's experience shows a 'Limited! 10:00' prompt every 90 seconds to every visitor, including accounts flagged under 13"
  consequence: "pressure aimed at children is the pattern that consumer authorities pursue; the platform has no per-experience measurement of it"
  p_typical: 0.06
  grounded: speculative
