- id: ugc-1
  title: "Self-declared maturity check: an agent plays each newly published experience for 10 minutes and a VLM labels blood, weapon use, horror, crude humour, romance and random-reward spending, then diffs the labels against the creator's questionnaire answers"
  level: L4
  cell: {buyer-role: platform-owner, video-source: automated-bot-or-agent-playthrough, signal-extracted: ui-state-and-screen-flow, analysis-type: content-rating-classification, lifecycle-moment: prototype-and-greenlight, delivery-form: api-or-sdk, game-platform-and-genre: ugc-platform-experiences, buyer-org-type: ugc-platform-operator, capture-trigger-and-sampling: scheduled-bot-playthrough, automation-level: auto-created-ticket-or-asset}
  object: "the maturity or content-descriptor questionnaire on the experience publish form, versus the 10-minute bot footage of the same place; the same mismatch idea exists for app builds in platform-9 but no leaf covers creator-made experiences"
  situation: "a creator publishes an experience declared 'all ages' whose first 4 minutes include a bleeding NPC and a chainsaw prop; the platform receives thousands of publishes and republishes per week and reviews almost none by hand"
  consequence: "a child sees content that the label said was safe; the platform's ratings team learns of it from parent complaints, not from its own check, and has no timestamped evidence to show the creator"
  p_typical: 0.14
  grounded: speculative
  evidence: "none on UGC platforms in the notes. Nearest: bot or agent playthroughs already exist (nunu.ai vision-only agent issuing taps and keys from a live stream, market.md s3; Cradle screenshot-in agent finishing 40-minute missions in a AAA game, methods-churn-funnel.md s4). Self-declaration being the label source on UGC platforms is from the audit note in H-audit-1.yaml, not verified here."
  proposed: "per experience, emit a label vector (violence, blood, fear, sexual themes, crude language, simulated gambling) with the first timestamp and one keyframe per label, plus a match or mismatch flag against each questionnaire answer; mismatches go to a human queue"
  shallow: false
  mechanism: "A general vision agent (not a per-game script) joins the experience as a test account, explores for a fixed budget, and a VLM classifies sampled frames against the platform's own maturity rubric. Changes who produces the label evidence (the platform, not only the creator) and when (at every publish, not on complaint)."
  example: "A tycoon-style experience declared 'all ages' shows a skull-and-blood vending machine at minute 3; the bot files a mismatch with the frame and the questionnaire line 'blood: none'."
  cost: L
  depends_on: "a general exploring agent that can start in an unknown experience (the nunu.ai or Cradle class), the platform's maturity rubric in machine-readable form, and the existing frame-annotation and report agent of the User Test product"
  buyer: "Head of ratings and content policy, or trust and safety director, at a UGC game platform"
  input: "Footage from an automated playthrough of the published place plus the creator's declaration fields and the place-version ID"
  why_existing_tools_cannot: "AI QA agents look for rendering and physics bugs in one studio's build (adjacent-usecases.md s1; market.md s3 modl.ai 'does NOT do'), moderation vendors score voice and text (adjacent-usecases.md s3 'vision-based toxicity was not evidenced'), and zero-shot VLMs reach only precision 0.50 on bug videos (adjacent-usecases.md s1), so a rubric-tuned labeller on exploration footage is not on the shelf."
  willingness_to_pay: "4 - signal: UGC platforms are trust and safety buyers at scale; the nearest priced anchor is voice moderation at up to USD 20,000 per month for 200,000 hours (Modulate, adjacent-usecases.md s3); no UGC rating price in the notes; a per-experience fee of USD 0.20-1.00 is my assumption"

- id: ugc-2
  title: "Update-triggered re-rating: when a creator publishes a new place version above a player-count threshold, a bot replays only the changed areas and alerts if any maturity label rises a level compared with the previous version's footage"
  level: L4
  cell: {buyer-role: rating-and-consumer-compliance, video-source: automated-bot-or-agent-playthrough, signal-extracted: visual-errors-and-glitches, analysis-type: build-to-build-regression-diff, lifecycle-moment: live-event-or-update, delivery-form: alert-or-slack, game-platform-and-genre: ugc-platform-experiences, buyer-org-type: ugc-platform-operator, companion-data: build-and-config-metadata, automation-level: auto-created-ticket-or-asset}
  object: "the place-version hash on each republish and the prior version's label vector; maturity is judged once at launch today and never again (H-audit-1.yaml brief: 're-rating after an update')"
  situation: "an experience with 80,000 daily players and an 'all ages' label adds a seasonal 'haunted' map at 18:00; no reviewer sees it until the weekend"
  consequence: "the label stays frozen at the launch version while the content changes under 80,000 players a day; an update is the cheapest moment to slip content past a one-time label"
  p_typical: 0.07
  grounded: inferred
  evidence: "no UGC evidence in the notes. Build-to-build visual diffing on emulator footage is the pattern in the platform emulator-release-gate leaf in E-platform-owner.yaml; Sentry-style event triggers are described in methods-churn-funnel.md s7 INFERRED (event-triggered clip)."
  proposed: "trigger on version hash change for experiences above 5,000 daily players; diff scene graph or visited-area footage, re-label only changed spawn points, page the ratings on-call only when a label rises one or more levels"
  shallow: false
  mechanism: "A version-change event starts a targeted bot run that navigates to areas whose assets changed (from the build metadata) and re-labels them; the result is a label delta, not a new full rating. Changes the cadence of rating from once to per-update, at a cost proportional to the change."
  example: "A roleplay hangout adds a 'morgue' interior in a Thursday update; the bot reaches it in 90 seconds and raises 'graphic injury: new, mild to moderate' with 2 frames."
  cost: M
  depends_on: "ugc-1 labeller; a publish-event hook from the platform's place store; asset diff metadata per version"
  buyer: "Ratings operations lead at a UGC game platform"
  input: "Bot footage per place version plus the version-to-version asset diff and daily active player count"
  why_existing_tools_cannot: "QA regression diff tools compare one studio's own builds against its own baseline (adjacent-usecases.md s1 Razer QA Companion-AI), and rating tools run at submission, not per live update (adjacent-usecases.md s4 human audits at 150-250 hours per pass); no vendor in market.md s9 gap map sells post-publish monitoring of third-party content."
  willingness_to_pay: "3 - signal: avoiding one child-safety incident per quarter is the lever; no price in the notes; per-update pricing under USD 0.30 per changed area is my assumption"

- id: ugc-3
  title: "Gambling-like mechanic spotter for creator-made experiences: agent finds coin flips, crash games, slot reels and case-opening scenes that stake premium currency or player-to-player items, with the odds screen (or its absence) captured"
  level: L4
  cell: {buyer-role: rating-and-consumer-compliance, video-source: automated-bot-or-agent-playthrough, signal-extracted: economy-and-store-events, analysis-type: content-rating-classification, lifecycle-moment: live-event-or-update, delivery-form: issue-tracker-ticket, game-platform-and-genre: ugc-platform-experiences, buyer-org-type: ugc-platform-operator, constraint-to-overcome: per-game-ui-generalisation}
  object: "an in-experience 'spin' or 'bet' panel that spends the platform's virtual currency; analogue is the simulated-gambling spotter for one studio's build in rating-7"
  situation: "a creator ships a 'lucky wheel' that costs 100 premium currency for a random pet, with the percentages absent and a countdown on the 'x5 luck' boost"
  consequence: "a mechanic that adult regulators treat as gambling-like sits in an experience open to 9-year-olds; the platform is the party answering the regulator, not the creator"
  p_typical: 0.06
  grounded: speculative
  evidence: "none on platform liability in the notes (my prior knowledge, unverified). Nothing sold for UGC: market.md s9 gap map lists no vendor reading in-game economy screens from footage; rating-7 is the single-title version."
  proposed: "per experience, list each randomised-reward purchase path with taps to odds, currency spent, and a 3-frame strip; severity High when real-money currency is staked on a chance outcome and no odds are shown"
  shallow: false
  mechanism: "The bot hunts for purchase prompts and chance animations (VLM plus OCR on button text reading 'Spin', 'Open' or 'Bet'), triggers them with a test wallet, and records currency in, reward out, and whether odds text exists. Output is a mechanic inventory per experience that feeds the rating bump."
  example: "A pet-simulator clone: 'Mythic Egg 500 gems' with no odds; the bot opens 5 eggs, logs 5 outcomes and files a ticket 'random paid reward, no odds, countdown boost'."
  cost: L
  depends_on: "ugc-1 exploring agent; a sandbox test wallet that cannot spend real money; platform rubric for 'simulated gambling'"
  buyer: "Consumer protection and ratings lead at a UGC game platform"
  input: "Bot footage of purchase and reward screens with test-wallet transaction logs from the platform side"
  why_existing_tools_cannot: "Human audits are priced by testing hours (MGATS 150-250 hours, adjacent-usecases.md s4) and cannot cover 100,000+ experiences; session-replay SDKs record canvas as black boxes (market.md s2 'Does NOT do') and creators do not install them; analytics vendors see events only for the owner's own game (methods-churn-funnel.md s1)."
  willingness_to_pay: "3 - signal: regulator exposure, no price in notes; per-flagged-experience review pricing near USD 2-5 is my assumption against outsourced QA at USD 15-50 per hour (adjacent-usecases.md s1)"

- id: ugc-4
  title: "Cloaking detector: the same experience is played with an under-13, a 13-17 and a verified-adult test account, at minute 0 and minute 45, and the footage sets are compared for content that appears only for some accounts or only late"
  level: L4
  cell: {buyer-role: trust-safety, video-source: automated-bot-or-agent-playthrough, signal-extracted: ui-state-and-screen-flow, analysis-type: cohort-comparison, lifecycle-moment: live-event-or-update, delivery-form: enforcement-or-cert-evidence-pack, game-platform-and-genre: ugc-platform-experiences, buyer-org-type: ugc-platform-operator, capture-trigger-and-sampling: targeted-cohort, constraint-to-overcome: accuracy-and-trust}
  object: "the age-band attribute on the bot account and the scene reached at join versus after a 45-minute wait; the 'clean for reviewers, different for players' pattern"
  situation: "an experience checks the visitor's account age, join time or a hidden server flag and swaps a sanitized lobby for an explicit one for a subset"
  consequence: "a one-time review or a single bot run sees only the clean version; the label passes while the experience shows different content to the players it targets"
  p_typical: 0.03
  grounded: speculative
  evidence: "none in the notes. Cohort comparison with differing account profiles is the idea behind targeted-cohort capture in methods-churn-funnel.md s7 (sampling knobs); the evasion pattern is my inference, not evidenced here."
  proposed: "run 6 profile x time combinations on 1% of experiences plus all those with a creator-reputation drop; compute frame-set difference; alert when two profiles differ above a threshold in violence or sexual-theme label"
  shallow: false
  mechanism: "Parallel bot sessions under different synthetic account profiles and dwell times; footage per profile is labelled by the same classifier and compared pairwise. Differences are the evidence, and the clip pair goes into an enforcement pack."
  example: "A hangout shows a plain lobby to the 'under 13' profile and an alcohol bar with graphic posters to the 'adult' profile after 20 minutes; the pair of clips with timestamps becomes the removal evidence."
  cost: M
  depends_on: "ugc-1; synthetic test accounts per age band allowed by platform policy"
  buyer: "Trust and safety investigations lead at a UGC game platform"
  input: "Parallel bot playthrough footage under 3 account age bands and 2 dwell times per experience"
  why_existing_tools_cannot: "Anti-cheat and fraud tools judge player input, not creator content (adjacent-usecases.md s2 Anybrain, FACEIT); one-shot rating tools run once with one profile (adjacent-usecases.md s4); no vendor sells multi-profile differential playthroughs (market.md s9 gap map)."
  willingness_to_pay: "3 - signal: sold as an investigation tool for a small team; no price in notes; per-investigation value is the human hours saved (outsourced QA at USD 15-50 per hour, adjacent-usecases.md s1)"

- id: ugc-5
  title: "Coverage-stamped labels: each maturity label ships with the percentage of the map's navigable volume and scripted events the bot actually saw, and labels below 60% coverage are routed to a human reviewer"
  level: L4
  cell: {buyer-role: rating-and-consumer-compliance, video-source: automated-bot-or-agent-playthrough, signal-extracted: structured-game-state-reconstruction, analysis-type: content-rating-classification, lifecycle-moment: certification-submission, delivery-form: dashboard, game-platform-and-genre: ugc-platform-experiences, buyer-org-type: ugc-platform-operator, constraint-to-overcome: sampling-bias}
  object: "a 'coverage' number next to the label: visited cells of the place's floor-plan or camera-position grid over total, plus count of trigger events the bot fired"
  situation: "a 10-minute bot run on a 400-room horror mansion sees 7 rooms and returns 'mild'"
  consequence: "a clean-looking label produced from a thin sample is worse than none: the ratings team and parents trust it; a reviewer cannot tell a certain label from a lucky one"
  p_typical: 0.04
  grounded: inferred
  evidence: "sampling bias is named for player footage in methods-churn-funnel.md s7; the agent-coverage limit follows from VLMs struggling with unpredictable behaviour (adjacent-usecases.md s1 citing arXiv 2501.11782) and from only 16% of devs fully trusting AI QA outcomes (market.md s3 modl.ai survey)."
  proposed: "attach {coverage_pct, events_fired, minutes_played, label_confidence} to every label; route below-threshold labels to a queue sorted by daily players; re-run with a different exploration seed when below 60%"
  shallow: false
  mechanism: "The agent logs visited positions and fired triggers (from the engine's game-state view or from footage-derived position estimates), computes coverage, and the platform uses coverage to decide human review versus auto-label. Changes the label from a verdict to a verdict with a confidence."
  example: "A 'Backrooms' style maze labelled mild at 12% coverage is sent to a human; the second seed finds a jump-scare chase at minute 14."
  cost: M
  depends_on: "ugc-1; engine-level position telemetry for bot accounts or footage-derived minimap estimates"
  buyer: "Ratings operations manager at a UGC game platform"
  input: "Bot footage plus bot position and trigger logs, place geometry bounds"
  why_existing_tools_cannot: "AI QA vendors report bugs found, not how much of the content they saw (market.md s3 modl.ai, nunu.ai, no coverage-of-content claims found); trust in AI QA outcomes is low (16% fully trust, market.md s3) and a coverage number is what moves it."
  willingness_to_pay: "3 - signal: an add-on to ugc-1 rather than a stand-alone buy; priced inside the labelling fee; no direct price evidence"

- id: ugc-6
  title: "Report-time clip triage: on a player report, the platform's 60-second ring buffer is classified as 'creator-made content' (route to ratings team, counts against the experience) or 'other players' conduct' (route to conduct moderation)"
  level: L4
  cell: {buyer-role: trust-safety, video-source: platform-or-emulator-capture, signal-extracted: social-or-chat-content, analysis-type: evidence-pack-for-enforcement, lifecycle-moment: live-event-or-update, delivery-form: issue-tracker-ticket, game-platform-and-genre: ugc-platform-experiences, buyer-org-type: ugc-platform-operator, capture-trigger-and-sampling: on-player-report}
  object: "the 'Report experience' versus 'Report player' choice, and the attached 60-second clip; tns-1 attaches a clip to a player report but does not split creator content from player conduct"
  situation: "a 12-year-old taps Report after seeing a gore scene; the clip shows the scene is a pre-built prop, not another player"
  consequence: "reports about creator content land in the conduct queue, age while a team that cannot act on them reads them, and never feed the experience's mismatch rate"
  p_typical: 0.08
  grounded: inferred
  evidence: "only about 23% of Activision voice reports contained actionable evidence (adjacent-usecases.md s3); tns-1 and tns-12 in E-trust-and-safety-lead.yaml show the clip-on-report and clustering pattern."
  proposed: "classifier outputs {content_source: creator|player, severity, category}; per-experience count of creator-source reports per 1,000 visits feeds ugc-11 reliability score"
  shallow: false
  mechanism: "A VLM labels each reported clip's offending element as scripted (static or repeating across 2+ reports of the same coordinates) or dynamic (a player avatar's action), then routes accordingly and aggregates per place. Changes what a report is used for: an input to the label audit, not a one-off ticket."
  example: "11 reports in one day show the same blood-pool prop at the same coordinates of a hangout; the system opens one ratings case with the 3 clearest clips."
  cost: M
  depends_on: "platform-side ring-buffer capture on report with consent and redaction; clustering by place coordinates"
  buyer: "Trust and safety operations lead at a UGC game platform"
  input: "Player-report clips from platform or emulator capture plus the place ID, version and coordinates of the camera"
  why_existing_tools_cannot: "Voice and text moderation vendors take chat as input (adjacent-usecases.md s3 Modulate, GGWP); report triage today is manual with about 77% lacking actionable evidence (adjacent-usecases.md s3); consented SDK capture belongs to the game owner, not to a visiting player of a third-party experience (methods-churn-funnel.md s7 consent floor)."
  willingness_to_pay: "3 - signal: reports at platform scale; moderation per-hour pricing of 7.5-12 cents (Modulate, adjacent-usecases.md s3) is the nearest anchor for per-report cost"

- id: ugc-7
  title: "Creator appeal pack: when an experience is age-restricted or down-rated, the creator gets the cited rule, 3 timestamped frames, and a 'fix list' of which props or scenes triggered it; a re-test bot replays only the cited route"
  level: L4
  cell: {buyer-role: platform-owner, video-source: automated-bot-or-agent-playthrough, signal-extracted: visual-errors-and-glitches, analysis-type: evidence-pack-for-enforcement, lifecycle-moment: certification-submission, delivery-form: enforcement-or-cert-evidence-pack, game-platform-and-genre: ugc-platform-experiences, buyer-org-type: ugc-platform-operator, effort: M-one-quarter}
  object: "the creator-facing moderation notice and the 'Appeal' button; today it names a policy but not the frame (H-audit-1.yaml brief: 'creator appeal packs')"
  situation: "an obby is re-rated 'teen' for a skeleton-and-blood checkpoint; the creator cannot tell which of 40 checkpoints triggered it, and files a support ticket"
  consequence: "creators churn from the platform or re-publish a clone to dodge the label; each appeal costs a human reviewer 15-30 minutes"
  p_typical: 0.07
  grounded: inferred
  evidence: "bug-report enrichment with video and repro steps is the accepted pattern in QA (adjacent-usecases.md s1; MGATS 'concerns' with video examples, s4); no source on UGC appeals."
  proposed: "notice template: rule name, label raised, 3 clips of 8 seconds with burn-in timestamps, and a one-click 'request re-test of this route' that runs the same bot path and returns pass or fail within 1 hour"
  shallow: false
  mechanism: "The labelling run keeps the route and frames that justified each label; the pack renders them for the creator and the re-test replays that route. Changes who does the fix loop: the creator self-serves it, rather than a reviewer."
  example: "A creator removes one checkpoint prop, clicks re-test, and the bot passes the route 54 seconds later; the label returns to 'all ages' without a ticket."
  cost: M
  depends_on: "ugc-1 with stored routes and keyframes; a creator-facing console page"
  buyer: "Creator support and ratings policy lead at a UGC game platform"
  input: "Stored bot footage per label, route logs and creator re-submission build"
  why_existing_tools_cannot: "Human accessibility and rating services deliver reports after 7 business days (MGATS, adjacent-usecases.md s4); QA tools give repro to the studio that owns the build, not to an external creator under a platform's policy (adjacent-usecases.md s1)."
  willingness_to_pay: "3 - signal: the lever is support-cost reduction; assume 15-30 minutes saved per appeal at USD 15-50 per hour (adjacent-usecases.md s1), so USD 4-25 per appeal"

