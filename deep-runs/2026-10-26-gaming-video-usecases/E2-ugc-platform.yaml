  level: L4
  cell: {buyer-role: rating-and-consumer-compliance, video-source: automated-bot-or-agent-playthrough, signal-extracted: dark-pattern-and-disclosure-ui, analysis-type: compliance-audit, lifecycle-moment: new-market-or-language-launch, delivery-form: per-cohort-report, game-platform-and-genre: ugc-platform-experiences, buyer-org-type: ugc-platform-operator, constraint-to-overcome: store-or-platform-policy}
  object: "the platform's region switch on the bot account and the creator-exposed 'region policy' API; rating-8 does this for one studio's build, not for a catalogue where creators may ignore the flag"
  situation: "the platform opens a market where paid random items are restricted and asks creators to read a region flag; 3,000 of the top experiences are 'supposed to' comply"
  consequence: "a non-compliant experience in a restricted market is the platform's liability; today compliance is checked by creator attestation"
  p_typical: 0.05
  grounded: speculative
  evidence: "none on regional rules in the notes (prior knowledge, unverified). Regional launch scanning of a catalogue by footage is the shape of the platform leaf 'Regional-launch localisation scan' in E-platform-owner.yaml; localisation-from-video is an evidenced gap (adjacent-usecases.md Count and gaps)."
  proposed: "for the top 3,000 experiences by daily players, run 1 bot per restricted region and list those still showing a randomised paid reward within 5 minutes, with the frame"
  shallow: false
  mechanism: "Replay of the ugc-3 inventory under region profiles; any randomised paid path visible in a restricted region is a failure. Changes verification from creator attestation to observed behaviour."
  example: "A pet-simulator experience hides its 'Egg' shop in region A but not in region B; the report lists 41 non-compliant experiences before launch day."
  cost: M
  depends_on: "ugc-3 inventory; region-profile bot accounts; the platform's region policy flag"
  buyer: "Regional compliance lead at a UGC game platform"
