  why_existing_tools_cannot: "Analytics SDKs measure prompts for the owner of one game (methods-churn-funnel.md s1), not across third-party creators; human audits are 150-250 hours per pass (adjacent-usecases.md s4); capturing real children's sessions is blocked by consent rules (methods-churn-funnel.md s7)."
  willingness_to_pay: "3 - signal: avoiding a regulator finding; no price in notes; table-per-week fee near USD 2,000-5,000 per month is my assumption"

