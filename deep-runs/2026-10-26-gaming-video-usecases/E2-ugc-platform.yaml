  cost: L
  depends_on: "platform ability to spawn spectator sessions; ugc-1 labeller; report-rate telemetry per instance"
  buyer: "Trust and safety on-call lead at a UGC game platform"
  input: "Spectator capture of a flagged instance plus report counts per instance"
  why_existing_tools_cannot: "Anti-cheat vendors score player input (adjacent-usecases.md s2), voice moderation scores audio (adjacent-usecases.md s3), and vision-based toxicity is 'not evidenced' in the notes (adjacent-usecases.md s3 INFERRED)."
  willingness_to_pay: "3 - signal: platform T and S budgets; no price in notes; priced per triggered capture is my assumption"

- id: ugc-11
  title: "Creator declaration reliability score: monthly precision and recall of each creator's self-declared labels against bot audits, used to route trusted creators to light sampling and risky ones to every-publish audits"
  level: L4
  cell: {buyer-role: rating-and-consumer-compliance, video-source: automated-bot-or-agent-playthrough, signal-extracted: ui-state-and-screen-flow, analysis-type: cohort-comparison, lifecycle-moment: soft-launch, delivery-form: warehouse-table-export, game-platform-and-genre: ugc-platform-experiences, buyer-org-type: ugc-platform-operator, constraint-to-overcome: cost-per-session, value-lever-b2b: replace-labour-hours}
  object: "a per-creator row: declared labels, audited labels, mismatch count over the last 20 publishes; no leaf prices the audit by creator risk"
  situation: "100,000+ experiences cannot all be audited at full depth; 2% of creators produce most mismatches"
  consequence: "uniform auditing wastes budget on honest creators or leaves repeat offenders sampled at the same low rate"
  p_typical: 0.05
  grounded: inferred
  evidence: "cost per session is named as a constraint in methods-churn-funnel.md s7 (sampling knobs: user-level sampling 1-5%); risk-based sampling is my adaptation. No creator-risk evidence in the notes."
  proposed: "score = mismatches/audits over the last 20 publishes with a 90-day decay; creators under 0.05 get 5% sampling, over 0.2 get 100% plus a human review of the first 3 publishes"
  shallow: false
  mechanism: "The audit results of ugc-1 are aggregated per creator; the score sets sampling depth for future publishes. Changes the budget allocation from uniform to risk-weighted."
  example: "Studio-account A (84 clean publishes) is sampled at 5%; account B (6 of 9 mismatches) is audited on every publish and its updates are gated for 24 hours."
  cost: S
  depends_on: "ugc-1 output; a creator ID join"
  buyer: "Head of ratings operations at a UGC game platform"
  input: "Audit label vectors per publish, creator IDs, declared labels"
  why_existing_tools_cannot: "QA vendors price by run and by build (market.md s3 quote-based), and no tool exposes a per-creator reliability score for third-party content; session-replay vendors price per video (market.md s2 IV Metrics capped at 50-100 videos)."
  willingness_to_pay: "2 - signal: a cost-saving layer on top of ugc-1, not a stand-alone product; no price evidence"

- id: ugc-12
  title: "Parent-facing 'what to expect' reel: 3 neutral 8-second clips per experience, chosen as the highest-severity moments from bot footage, shown in the family dashboard next to the maturity label"
  level: L4
  cell: {buyer-role: platform-owner, video-source: automated-bot-or-agent-playthrough, signal-extracted: ui-state-and-screen-flow, analysis-type: highlight-or-clip-generation, lifecycle-moment: new-version-release, delivery-form: clip-reel, game-platform-and-genre: ugc-platform-experiences, buyer-org-type: ugc-platform-operator, constraint-to-overcome: minors-coppa-gdpr-k}
  object: "the label chip on an experience's page and the parental-controls screen, plus 3 clips from bot footage (no real player in them)"
  situation: "a parent sees 'Moderate' on an experience and cannot tell if it means cartoon bats or realistic gore"
  consequence: "labels are abstract; parents either block broadly or trust blindly; a reel makes the platform's label verifiable and cuts the 'what does this mean' ticket"
  p_typical: 0.06
  grounded: inferred
  evidence: "highlight clip generation from recorded gameplay is a bought product (competitor-and-ua.md s4); bot footage avoids real children's video (methods-churn-funnel.md s7 privacy hazards)."
  proposed: "choose top-3 severity segments from the label run, mask avatar names, loop 8 seconds, show in the parental view with the label reasons as text"
  shallow: false
  mechanism: "Segments with the highest rubric severity are cut from the ugc-1 footage and shown as the label's evidence. Changes who can verify a label: a parent, not only the platform."
  example: "The reel for a 'Moderate' zombie shooter shows cartoon-style hits, a screaming enemy and a dark corridor; a parent sets the account to allow it."
  cost: S
  depends_on: "ugc-1 with stored per-segment severity; a parental dashboard surface"
  buyer: "Product lead for family safety and parental controls at a UGC game platform"
  input: "Bot footage segments with severity scores, version ID"
  why_existing_tools_cannot: "Highlight tools pick exciting moments from the player's own play (competitor-and-ua.md s4 'trigger on noise or need hand configuration'), not the moments that justify a rating."
  willingness_to_pay: "2 - signal: a product feature rather than a cost line; no price evidence; adoption depends on parent engagement"

- id: ugc-13
  title: "Label provenance archive: for every experience version, hash-chained bot footage, label vector, rubric version and reviewer decision kept so the platform can answer 'why was this rated all-ages on date X' within an hour"
  level: L4
  cell: {buyer-role: rating-and-consumer-compliance, video-source: automated-bot-or-agent-playthrough, signal-extracted: ui-state-and-screen-flow, analysis-type: evidence-pack-for-enforcement, lifecycle-moment: certification-submission, delivery-form: enforcement-or-cert-evidence-pack, game-platform-and-genre: ugc-platform-experiences, buyer-org-type: ugc-platform-operator, constraint-to-overcome: security-review-soc2-residency}
  object: "a record keyed by place-version hash with the rubric version used; rating-11 archives a studio's own purchase screens, not a platform's rating decisions on others' content"
  situation: "a regulator or a parent's lawyer asks why an experience was 'all ages' 5 weeks ago"
  consequence: "without the footage and the rubric version, the platform cannot show what the label was based on; the answer is a manual search over reviewer notes"
  p_typical: 0.05
  grounded: inferred
  evidence: "hash-chained evidence packs appear as tns-16 and rating-11 (G-titles-all.txt); no UGC regulator inquiry evidence in the notes."
  proposed: "store per version: footage hash, label vector, rubric version, coverage, reviewer id and decision; export a signed PDF plus clips for a given experience and date range"
  shallow: false
  mechanism: "Every label run writes an immutable record; a query tool assembles the pack. Changes the audit cost from days of reconstruction to a query."
  example: "A legal request for experience X on 12 September returns the 3 clips, the 'violence: none' vector and the rubric v14 within 40 minutes."
  cost: S
  depends_on: "ugc-1 and ugc-5 outputs; immutable storage with residency choice"
  buyer: "Legal and ratings operations at a UGC game platform"
  input: "Label run artifacts, rubric versions, reviewer decisions"
  why_existing_tools_cannot: "Human audit reports are one-off documents (MGATS, adjacent-usecases.md s4); QA tools store video per bug, not per rating decision (adjacent-usecases.md s1)."
  willingness_to_pay: "2 - signal: avoids legal reconstruction cost; no price in notes; bundled with ugc-1"

- id: ugc-14
  title: "Portal-chain audit: the bot follows teleport doors and 'play next' links up to 3 hops from an all-ages experience and flags destinations whose labels are higher than the entry experience"
  level: L4
  cell: {buyer-role: trust-safety, video-source: automated-bot-or-agent-playthrough, signal-extracted: ui-state-and-screen-flow, analysis-type: content-rating-classification, lifecycle-moment: live-event-or-update, delivery-form: issue-tracker-ticket, game-platform-and-genre: ugc-platform-experiences, buyer-org-type: ugc-platform-operator, constraint-to-overcome: per-game-ui-generalisation}
  object: "an in-world portal or door that sends the player to another experience, and the destination's label; no leaf follows these links"
  situation: "an all-ages 'hub' experience has a doorway with the text 'Secret party' that teleports to an unlabeled 17+ experience"
  consequence: "labels are per place, but children move between places in 2 taps; the unit of exposure is the chain"
  p_typical: 0.03
  grounded: speculative
  evidence: "none in the notes; the scenario is from my inference about UGC hubs. Screen-flow classification (menu and button detection around 90% mAP on mobile games) is in methods-churn-funnel.md s4 INFERRED."
  proposed: "detect portals from footage (door, glowing ring, 'Teleport' sign), trigger up to 3 hops, label each landing, and list chains where max label minus entry label is 1 or more"
  shallow: false
  mechanism: "The agent treats teleports as edges in an exposure graph and applies ugc-1 to each node; output is a list of chains with entry to destination footage. Changes the object rated from a place to a reachable path."
  example: "'Birthday Hub' to 'Dark Club' to 'Casino Night' is flagged as a 2-hop chain with 3 frames."
  cost: M
  depends_on: "ugc-1; platform API listing teleport destinations or footage-based portal detection"
  buyer: "Trust and safety policy lead at a UGC game platform"
  input: "Bot footage across hops plus the destination labels"
  why_existing_tools_cannot: "QA tools test one build in isolation (adjacent-usecases.md s1); label systems score nodes, not links; no vendor in market.md s9 gap map covers cross-experience flows."
  willingness_to_pay: "2 - signal: low-volume but severe cases; no price in notes"

- id: ugc-15
  title: "Audio descriptor pass on bot footage: lyrics, voice-over and sound effects scored for profanity, screams, gunfire and sudden loudness jumps above 15 dB, added to the label vector beside the visual labels"
  level: L4
  cell: {buyer-role: rating-and-consumer-compliance, video-source: automated-bot-or-agent-playthrough, signal-extracted: game-audio-and-sfx, analysis-type: content-rating-classification, lifecycle-moment: prototype-and-greenlight, delivery-form: api-or-sdk, game-platform-and-genre: ugc-platform-experiences, buyer-org-type: ugc-platform-operator}
  object: "audio track of the bot playthrough, scored per 5-second window; creator-uploaded audio assets are a known blind spot for image-only checks"
  situation: "a horror experience declared mild plays a sustained scream loop and explicit lyrics from an uploaded track, with a clean-looking visual scene"
  consequence: "a visual-only labeller gives 'mild'; the exposure is audible"
  p_typical: 0.07
  grounded: inferred
  evidence: "voice and text toxicity is mature (adjacent-usecases.md s3); sound-effect and lyric classification for rating is not evidenced there; the 'game-audio-and-sfx' axis value is unused in the leaf lists."
  proposed: "per 5-second window emit {profanity, scream, gunfire, loudness_jump_db}; add max and count to the label vector and attach the 3 loudest windows to the evidence pack"
  shallow: false
  mechanism: "Audio is transcribed and classified in windows from the same run as the visual labeller; labels merge into one vector. Changes the rating signal from picture-only to picture and sound."
  example: "A 'Scary Elevator' experience triggers a 94-dB scream at minute 6 with explicit lyrics in the lobby track; the audio vector raises 'fear' and 'language'."
  cost: S
  depends_on: "ugc-1; audio capture in the bot sessions"
  buyer: "Ratings and content policy lead at a UGC game platform"
  input: "Audio track of bot footage"
  why_existing_tools_cannot: "Voice moderation tools are built for live player voice (Modulate ToxMod, adjacent-usecases.md s3), not for scripted audio and music in creator-made places; accessibility reviews check subtitles, not content (adjacent-usecases.md s4)."
  willingness_to_pay: "2 - signal: Modulate hours-based pricing 7.5-12 cents per hour (adjacent-usecases.md s3) is the unit anchor; small incremental revenue over ugc-1"

- id: ugc-16
  title: "REFUSE: always-on recording of child players' sessions inside third-party experiences to derive maturity labels from what they actually saw"
  level: L4
  cell: {buyer-role: rating-and-consumer-compliance, video-source: platform-or-emulator-capture, signal-extracted: ui-state-and-screen-flow, analysis-type: content-rating-classification, lifecycle-moment: live-event-or-update, delivery-form: dashboard, game-platform-and-genre: ugc-platform-experiences, buyer-org-type: ugc-platform-operator, capture-trigger-and-sampling: always-on-ring-buffer, constraint-to-overcome: minors-coppa-gdpr-k}
  object: "continuous footage of children in UGC experiences, as an alternative to synthetic-account bots (ugc-1)"
  situation: "a faster way to cover dynamic servers would be to watch real players, most of whom are minors on a UGC platform"
  consequence: "it creates a store of minors' sessions with names, chat and other players' avatars; the privacy, security and trust cost exceeds the labelling gain, because bots reach the same footage without a child present"
  p_typical: 0.03
  grounded: inferred
  evidence: "Apple 2019 action on screen-recording analytics and consent floor (methods-churn-funnel.md s7); hazards of names, chat and payment sheets on video (same section); refused in a related form as rating-26 and tns-27."
  proposed: "decline; use synthetic-account bots and report-triggered clips with redaction (ugc-1, ugc-6)"
  shallow: false
  mechanism: "Not built. A refusal leaf: always-on capture of minors for a rating purpose."
  example: "A platform asks for 1% of all sessions from under-13 accounts recorded at 480p to 'verify labels'; the vendor declines and offers ugc-1 plus ugc-6 instead."
  cost: L
  depends_on: "parental consent flows and a retention policy; none would make the trade-off acceptable here"
  buyer: "Trust and safety lead at a UGC game platform (the likely requester, who would still decline after a privacy review)"
  input: "Platform capture of minors' sessions"
  why_existing_tools_cannot: "Consent and minor-protection rules (methods-churn-funnel.md s7) and the low trust in AI outputs (market.md s3) argue against it; the same labels are available from synthetic bots."
  willingness_to_pay: "1 - signal: legal and privacy teams would block the purchase; no price evidence"

- id: ugc-17
  title: "REFUSE: auto-delisting of an experience and automatic creator bans triggered by the maturity classifier alone, with no human review"
  level: L4
  cell: {buyer-role: trust-safety, video-source: automated-bot-or-agent-playthrough, signal-extracted: ui-state-and-screen-flow, analysis-type: content-rating-classification, lifecycle-moment: live-event-or-update, delivery-form: enforcement-or-cert-evidence-pack, game-platform-and-genre: ugc-platform-experiences, buyer-org-type: ugc-platform-operator, automation-level: closed-loop-in-game-action}
  object: "an automatic 'unpublish plus strike' action fired by a classifier score"
  situation: "a VLM at precision 0.50 flags a cartoon skeleton as gore on a popular family experience with 200,000 daily players"
  consequence: "false removals hit honest creators and income; creator appeal volume spikes; trust in the label falls; a one-sided automatic ban is the product the persona would not buy"
  p_typical: 0.04
  grounded: quote
  evidence: "best off-the-shelf VLM zero-shot reached precision 0.50 and accuracy 0.72 on 100 industrial videos (adjacent-usecases.md s1); FACEIT states no ban from the ML flag alone (adjacent-usecases.md s2); related refusal tns-28."
  proposed: "decline; keep the classifier as a triage queue with human confirmation before any restriction, per ugc-1, ugc-5, ugc-7"
  shallow: false
  mechanism: "Not built. A refusal leaf: closed-loop enforcement from a classifier."
  example: "A 'Halloween Obby' is delisted 2 hours before a seasonal event by a false flag and the creator publishes a cloned place under another account."
  cost: M
  depends_on: "none that would change the verdict at current accuracy"
  buyer: "Trust and safety lead at a UGC game platform"
  input: "Classifier output from bot footage"
  why_existing_tools_cannot: "Accuracy is not enough for unattended action (adjacent-usecases.md s1 INFERRED: triage, not unattended detection); an anti-cheat precedent forbids single-flag bans (adjacent-usecases.md s2)."
  willingness_to_pay: "1 - signal: the persona refuses; creator backlash is the cost"
