  object: "methods-churn-funnel.md section 7 INFERRED sampling knobs: '(d) user-level sampling (e.g. 1-5% of new installs) with Wi-Fi-only upload'"
  situation: "Only 3% of installs consent and they skew to high-end Android on Wi-Fi; a churn feature learned on them may not hold for the 97%"
  consequence: "Data scientist can state 'video-derived finding X holds after reweighting, ESS = 4,100' or reject it; without this the video insight is dismissed as a biased sample"
  p_typical: 0.05
  grounded: inferred
  evidence: "methods-churn-funnel.md section 7: 'Full capture is unrealistic on mobile'; Wi-Fi-only upload; 1-5% sampling"
  proposed: "Table capture_weights(user_id, propensity, weight, ess_contribution) refreshed per cohort day"
  shallow: false
  mechanism: "Logistic propensity model on telemetry covariates for captured vs not; inverse-propensity weights; balance diagnostics per covariate"
