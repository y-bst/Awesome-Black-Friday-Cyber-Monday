  object: "methods-churn-funnel.md section 2 INFERRED list: 'dwell/reading time on a tutorial card before dismiss; taps on non-interactive art; ... time-to-first-meaningful-action; the exact screen state at the moment of app kill'"
  situation: "Studio data scientist retrains a D7 churn XGBoost on log features (sessions, progression, spend) and wants new feature content, not a new model class"
  consequence: "Model gets 6-10 columns that did not exist in any event stream; if they add under 0.01 AUC the purchase is cancelled at renewal"
  p_typical: 0.35
  grounded: quote
  evidence: "methods-churn-funnel.md section 3 INFERRED: 'the predictive ceiling is set by feature content, not model class. Video is an untested source of new features'"
  proposed: "Nightly table video_session_features(user_id, session_id, feature_name, value, computed_at, model_version)"
  shallow: false
  mechanism: "Per-title UI-state classifier labels each sampled frame; aggregator computes dwell, gap and count features per session; loader writes rows to the customer warehouse schema"
  example: "Match-3 title: players who dwell under 1.5 s on the booster tutorial card churn by D7 at 1.4x the rate of those who read it; the feature enters the model as tut_card_dwell_s"
  cost: M
  depends_on: "per-title UI-state classifier (ds-10); consented SDK capture of the first session"
  buyer: "Data scientist / head of analytics at a mid-size mobile F2P studio"
  input: "Consented SDK screen video of first session at 1-5 fps + touch overlay + telemetry events with user_id"
  why_existing_tools_cannot: "Session-replay SDKs record but do not interpret game state (market.md section 2 'Does NOT do'); no paper predicts churn from human gameplay frames (methods-churn-funnel.md section 3)"
  willingness_to_pay: "3 - analytics teams already pay UXCam median ~$21k/yr for replay (market.md section 2); in-house builders (NCSOFT, Rovio) show big studios may build instead (methods-churn-funnel.md WTP)"

- id: ds-2
  title: "App-kill moment classifier: last 10 s before backgrounding labelled fail-screen / store-screen / loading / notification-overlay / mid-play, turning binary churn into 'quit on fail' vs 'quit on interruption'"
  level: L4
  cell: {buyer-role: analytics-bi, video-source: own-players-consented-sdk, signal-extracted: device-context-interruptions-and-app-switch, analysis-type: churn-prediction-features, capture-trigger-and-sampling: always-on-ring-buffer, constraint-to-overcome: ground-truth-labels, delivery-form: warehouse-table-export}
  object: "methods-churn-funnel.md section 2 INFERRED: 'the exact screen state at the moment of app kill (rage quit vs. interruption)'; section 3 Rovio r = -0.586 for 'churn without completing the level'"
  situation: "Last session of a user who never returns; telemetry only shows session_end with no reason"
  consequence: "Churn label noise drops: players who left on an incoming call or notification are no longer trained as 'game-caused churn'; level-difficulty fixes target the 'quit on fail' share only"
  p_typical: 0.06
  grounded: inferred
  evidence: "methods-churn-funnel.md section 3: real pass rate vs churn r = -0.144, vs churn without completing r = -0.586"
  proposed: "Column last_screen_class with 5 values and confidence, one row per session_end"
  shallow: false
  mechanism: "30 s on-device ring buffer flushed only on app background; classifier tags the final frames; label joined to session_end event"
  example: "Puzzle game level 27: 41% of final sessions end on the fail screen vs 9% on a notification overlay; designer lowers level-27 move count instead of reworking the store"
  cost: S
  depends_on: "ring-buffer capture in the SDK (Sentry onErrorSampleRate pattern); UI-state classifier"
  buyer: "Churn-model owner (data scientist) at a mobile casual studio"
  input: "Last 30 s ring-buffer clip at app background + session_end and progression events"
  why_existing_tools_cannot: "GameAnalytics 'Total Churn' is historical drop-off without reason (methods-churn-funnel.md section 1); Sentry buffers only on errors, not on app kill (methods-churn-funnel.md section 6)"
  willingness_to_pay: "3 - Firebase churn prediction was sold to games but caught 275 of 145k churns (methods-churn-funnel.md section 1), so label quality is a felt pain"

- id: ds-3
