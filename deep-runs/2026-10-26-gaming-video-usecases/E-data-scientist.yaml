  level: L4
  cell: {buyer-role: analytics-bi, video-source: recruited-playtesters, signal-extracted: ui-state-and-screen-flow, analysis-type: funnel-drop-off-why, lifecycle-moment: soft-launch, delivery-form: per-cohort-report, companion-data: telemetry-events, value-lever-b2b: create-data-that-did-not-exist}
  object: "methods-churn-funnel.md section 1 INFERRED: 'Funnel quality is bounded by instrumentation: a step that was never instrumented ... does not exist in the data'; Unity funnels cannot be edited without invalidating data"
  situation: "Soft-launch build has 14 tutorial events; video of 200 first sessions shows 22 distinct FTUE screens"
  consequence: "Data scientist learns 8 screens are invisible to the funnel before soft-launch cohorts are spent; event spec gets 8 new events in the next build instead of a redo after launch"
  p_typical: 0.05
  grounded: quote
  evidence: "methods-churn-funnel.md section 1: Unity Funnel Analyzer editing 'would invalidate any existing data', so a new hypothesis means a new funnel"
  proposed: "Report table: screen_id, sessions_seen, matching_event (null if none), median dwell s"
  shallow: false
  mechanism: "Cluster frames into screen types, align each session's screen sequence with its event sequence by timestamp, emit unmatched screens and orphan events"
  example: "Idle tycoon soft launch in Philippines: 'choose manager' popup has no event and 18% of players stall there; event added in build 0.9.3"
  cost: S
  depends_on: "video-to-event clock alignment (ds-4)"
  buyer: "Analytics lead / data scientist preparing a soft launch at a mid-size studio"
  input: "200-500 playtester or opt-in first-session videos + raw event log for the same sessions"
  why_existing_tools_cannot: "GameAnalytics and Unity funnels only count events that exist (methods-churn-funnel.md section 1); playtest AI reads transcripts not pixels (market.md section 1 PlaytestCloud)"
  willingness_to_pay: "3 - per-build fee comparable to a PlaytestCloud run at ~EUR 113-141 per session (market.md section 1); sold as a one-off audit"

- id: ds-4
  title: "Video-to-event clock alignment service: per-session offset estimated from on-screen anchors (level-complete banner vs progression event), with a join_quality score 0-1 and rejection of sessions over 2 s residual"
  level: L4
  cell: {buyer-role: analytics-bi, video-source: own-players-consented-sdk, signal-extracted: on-screen-text-ocr, analysis-type: churn-prediction-features, constraint-to-overcome: joining-video-to-events, delivery-form: api-or-sdk, effort: S-weeks}
  object: "Data-scientist perspective note 'how to join video to events' (B-perspectives.yaml); methods-churn-funnel.md section 6 patent 'Gameplay telemetry and video acquisition system' (synchronised capture)"
  situation: "Device clock, upload time and server event time disagree by 0.5-30 s; a hesitation feature measured in seconds is meaningless if the offset is unknown"
  consequence: "Features computed on misaligned sessions are dropped instead of polluting the model; the data scientist can report what share of sessions joined cleanly"
  p_typical: 0.04
  grounded: inferred
  evidence: "methods-churn-funnel.md section 6: a patent for synchronised gameplay telemetry and video exists, i.e. sync is a known problem"
  proposed: "Columns: session_id, offset_ms, anchors_matched, residual_ms, join_quality"
  shallow: false
  mechanism: "Detect 3+ anchor screens per session (level start, level complete, store open), match to the corresponding events, fit a linear offset/drift, score residual"
  example: "RPG with server-authoritative events: 7% of sessions show 12 s drift from a backgrounded upload; they are excluded from the hesitation feature"
  cost: S
  depends_on: "anchor-screen detector per title; event log with client and server timestamps"
  buyer: "Data engineer / data scientist at any studio joining video to telemetry"
  input: "Sampled SDK video + telemetry events with client and server timestamps"
  why_existing_tools_cannot: "Session-replay tools for games are screenshot-based without game-state understanding (market.md section 2 PostHog Unity, 'Does NOT do'), so no anchor matching exists"
  willingness_to_pay: "2 - infrastructure nobody buys alone; bundled into ds-1. Signal: in-house analytics heads only accept tables joined to their event IDs (B-perspectives in-house-analytics-head)"

- id: ds-5
