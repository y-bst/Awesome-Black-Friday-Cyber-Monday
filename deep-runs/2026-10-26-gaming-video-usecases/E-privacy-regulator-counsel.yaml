  situation: "An emulator instance records a player who, inside the same Android guest, signs in to Google Play with a password and opens a banking app between two game sessions"
  consequence: "A platform-level capture sees every pixel of the guest OS, not only the game; one leaked credential frame turns a data asset into a breach"
