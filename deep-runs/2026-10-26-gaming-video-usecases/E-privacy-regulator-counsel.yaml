- id: privacy-1
  title: "On-device blur of everything outside a per-game allow-list of regions (tutorial card, CTA) before a frame is encoded"
  level: L4
  cell: {buyer-role: product-retention, video-source: own-players-consented-sdk, signal-extracted: on-screen-text-ocr, analysis-type: funnel-drop-off-why, lifecycle-moment: ftue-first-session, constraint-to-overcome: privacy-and-consent, processing-location: on-device, buyer-org-type: mid-size-studio}
  object: "methods-churn-funnel.md section 7 INFERRED: 'player names and chat in HUD/social panels, notifications overlaying the screen, payment sheets'"
  situation: "A 10-minute FTUE capture at 1 Mbps in a match-3 game; at level 5 the friend panel shows real Facebook names and an OS banner shows a message preview"
  consequence: "Without the blur, one frame leaks a third party's name into a vendor cloud; with it, legal signs the SDK and the product lead still sees tutorial-card dwell time"
  p_typical: 0.12
  grounded: quote
  evidence: "PostHog Unity SDK is 'screenshot-based, with no built-in masking of text or images' (market.md section 2); 'Privacy hazards specific to game video' (methods-churn-funnel.md section 7)"
  proposed: "Ship the allow-list as a per-title JSON of rectangles plus a text detector; report the blurred-area percentage per clip so counsel can audit it"
  shallow: false
  mechanism: "Inverts masking: instead of listing what to hide, list the 3-6 regions the analysis needs and blur the rest on the device, so unknown overlays are hidden by default"
  example: "Counsel at a 60-person studio approves capture of the first 10 minutes because only the tutorial card, the highlighted CTA and the fail screen survive in the uploaded frames"
  cost: M
  depends_on: "SDK frame hook; a per-title region list (a few hundred labelled frames per game)"
  buyer: "Privacy counsel or DPO at a mid-size mobile F2P studio, co-signed by the product lead"
  input: "Device screen frames from the SDK plus the per-game allow-list; no audio"
  why_existing_tools_cannot: "market.md section 2: PostHog Unity has no masking and UXCam-style masking works on native view trees, not engine canvases"
  willingness_to_pay: "4: counsel is a veto holder, not a payer; the price rides inside the per-session fee (UXCam median about $21k/year, market.md section 2)"

