  cost: L
  depends_on: "A platform partner that controls the guest OS render path"
  buyer: "Privacy counsel and gaming program lead at an emulator or cloud-gaming platform"
  input: "Emulator guest-OS frames plus the foreground package name"
  why_existing_tools_cannot: "market.md section 2 'Does NOT do': generic replay tools reconstruct view trees inside one app; none sits below the guest OS"
  willingness_to_pay: "3: platform legal treats it as a launch gate; no price in the notes, so priced as a free-with-platform feature of a cross-game data asset"

