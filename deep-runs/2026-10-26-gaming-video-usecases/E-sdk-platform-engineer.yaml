  object: "B-perspectives.yaml cto-or-engine-lead-veto: 'any SDK that costs >1-2 ms per frame, adds APK size or triggers thermal throttling is refused'"
  situation: "Capture is switched on for a 2 percent cohort; on Mali-G52 phones the encoder pushes frame time from 14 ms to 17 ms and the phone throttles after 9 minutes"
  consequence: "Without a governor the CTO blocks the SDK on the allow-list; with it the cohort shrinks automatically on bad devices and the studio keeps capture elsewhere"
  p_typical: 0.07
  grounded: inferred
  evidence: "adjacent-usecases.md section 6: 'same build can run 60 fps on a flagship and 24 fps on a mid-tier phone'; GameBench tracks thermals but is a separate lab/SDK product"
  proposed: "Governor publishes a per-device-model overhead table (ms per frame, mAh per recorded minute) to the engine lead each release"
  shallow: false
  mechanism: "Closed loop inside the SDK: reads frame time and thermal API, lowers fps or bitrate in 3 steps, then stops; reports overhead per device model back to the studio"
  example: "Racing game: SDK shuts itself off on 11 phone models, keeps capturing on 140, engine lead signs off the integration"
  cost: M
  depends_on: "Native capture module and device-model telemetry"
  buyer: "CTO or lead engine programmer who owns the SDK allow-list, mid-size and AAA studios"
  input: "Device perf counters (frame time, thermal state, battery) read by the SDK itself"
  why_existing_tools_cannot: "GameBench and device clouds measure the game on lab devices (adjacent-usecases.md section 6); none measures the capture SDK's own cost on shipped player devices"
  willingness_to_pay: "2 - a gate, not a product; no price signal in the notes, value is removing a veto"

