  object: "methods-churn-funnel.md section 7 sampling knob (b) and section 6 Sentry onErrorSampleRate pattern; FTUE tutorial step 3"
  situation: "A new player on a mid-range Android force-closes the game 40 s into tutorial step 3 on the 'level failed' screen"
  consequence: "The studio gets 17 MB of upload for that one churn moment instead of about 450 MB for a full 30-minute first session at 2 Mbps"
  p_typical: 0.18
  grounded: quote
  evidence: "methods-churn-funnel.md section 7: 'a 30-120 s on-device ring buffer uploaded only on trigger (tutorial abandon, app kill on fail screen, rage taps, repeated fails), as Sentry does for errors'"
  proposed: "Ship the SDK with a trigger DSL (step_id, fail_count>=3, app_background_within_5s_of_fail_screen) and a 90 s default buffer"
  shallow: false
  mechanism: "SDK keeps a hardware-encoded rolling buffer in RAM or a 20 MB ring file; a trigger evaluated on game events flushes it to a Wi-Fi upload queue; cloud side runs the screen-state classifier and explains the drop"
  example: "Match-3 game: 5 percent of D0 churners at level 4 have a clip showing a booster popup covering the board; product lead moves the popup"
  cost: M
  depends_on: "Existing video ingestion and the 'why' report agent; a game-event hook (one call per tutorial step) from the studio"
  buyer: "Product lead / retention manager at a mid-size mobile F2P studio"
  input: "Own-player screen video (ring buffer, 480p) plus touch overlay plus tutorial-step events"
  why_existing_tools_cannot: "Sentry-style buffers fire on errors only and are not game-aware, and Unity funnels stop at 'investigate' (methods-churn-funnel.md sections 1 and 6); PlaytestCloud sees recruited testers, not churners (market.md section 1)"
  willingness_to_pay: "3 - FunCraft +40 percent D1 case and EA funnel-plus-replay case (methods-churn-funnel.md section 1); PlaytestCloud pays about EUR 113-141 per recorded session (market.md section 1), so a triggered clip at a fraction of that is credible"

