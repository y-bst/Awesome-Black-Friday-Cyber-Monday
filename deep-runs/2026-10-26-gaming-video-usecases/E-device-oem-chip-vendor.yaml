  why_existing_tools_cannot: "Studio replay SDKs require each game to integrate (market.md §2); device-lab tools test only lab routes (adjacent-usecases.md §6); only the platform holder can run this across titles without an SDK (B-perspectives platform-owner)"
  willingness_to_pay: "3 - the OEM would build rather than buy the on-device part; it would license the per-title screen classifiers; no price evidence for platform-level capture in the notes"

