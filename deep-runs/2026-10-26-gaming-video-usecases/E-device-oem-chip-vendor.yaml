  example: "Warehouse query: 'title Y, build 3.4, store screen, mid-tier SoC: 18% of seconds below 30 fps vs 2% on battle screen' -> dev-relations emails the studio a 10-second lab repro"
  cost: L
  depends_on: "OEM game launcher with overlay hooks; consent text approved by privacy counsel; per-title screen labels for top 500 titles"
