  level: L3
  cell: {buyer-role: platform-owner, video-source: platform-or-emulator-capture, signal-extracted: performance-fps-and-load, analysis-type: anomaly-alert, delivery-form: warehouse-table-export, buyer-org-type: device-oem, processing-location: on-device, constraint-to-overcome: privacy-and-consent, capture-trigger-and-sampling: opt-in-panel, value-lever-b2b: increase-coverage-from-sample-to-all}
  object: "methods-churn-funnel.md §7 '(e) on-device CV that uploads only extracted events/labels plus a few keyframes'"
  situation: "A title update makes the battle-pass screen render at uncapped frame rate with heavy blur; 1.2M of our devices run the title, but the device lab only tests the battle scene"
  consequence: "Without fleet data the OEM sees only aggregated 'average fps per title', missing that drops cluster on one menu screen on one chipset tier"
  p_typical: 0.05
  grounded: inferred
  evidence: "'Practical sampling knobs ... (e) on-device CV that uploads only extracted events/labels plus a few keyframes' (methods-churn-funnel.md §7)"
  proposed: "Ship as an opt-in 'help improve gaming' toggle in the OEM game launcher; rows land in the OEM warehouse joined to SoC tier and OS build"
  shallow: false
