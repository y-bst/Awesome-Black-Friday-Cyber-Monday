  level: L4
  cell: {buyer-role: qa, video-source: automated-bot-or-agent-playthrough, signal-extracted: load-and-wait-screens, analysis-type: anomaly-alert, lifecycle-moment: pre-launch-qa, delivery-form: issue-tracker-ticket, buyer-org-type: device-oem, value-lever-b2b: replace-labour-hours, constraint-to-overcome: per-game-ui-generalisation}
  object: "market.md §3 nunu.ai 'The agent is \"fully vision-based, taking a live stream from the device and issuing taps, swipes, keyboard input\"'"
  situation: "Prototype firmware with a new GPU driver; 11 of the top 500 titles hang on their splash screen because of a Vulkan extension check; crash logs are empty because the process is alive"
  consequence: "A contract test team plays 500 titles by hand for 2 weeks; hangs found in week 2 leave too little time for studios to patch before launch"
  p_typical: 0.09
  grounded: quote
  evidence: "'The agent is \"fully vision-based, taking a live stream from the device and issuing taps, swipes, keyboard input\". Supports PC, iOS, Android' (market.md §3)"
  proposed: "Classify the first 3 minutes of each title into 5 outcomes; tickets with clip for every non-gameplay outcome"
  shallow: false
  mechanism: "Agent installs, launches and taps through consent and login screens; a screen classifier tracks state per second; 'same frame for 60 s', 'spinner over 90 s', 'home screen visible' and 'rotated letterbox' each map to an outcome; clips of the last 30 s attach to the ticket"
  example: "Run report: '489 reached gameplay, 11 stuck on splash (all Unity 2021 Vulkan), 0 crashes' -> driver fix in 3 days instead of 2 weeks"
  cost: M
  depends_on: "vision agent able to pass logins and consent screens; test accounts for 500 titles"
  buyer: "Device compatibility QA manager at a phone OEM or chipset vendor"
  input: "bot playthrough capture on prototype + firmware and driver build ID + logcat"
  why_existing_tools_cannot: "nunu.ai and modl.ai test one studio's build, not 500 third-party titles on a device (market.md §3); outsourced QA is hourly labour at USD 15-50 per hour (adjacent-usecases.md §1)"
  willingness_to_pay: "5 - replaces 2 weeks of a contract test team per device launch, several launches per year; outsourced QA USD 15-50 per tester hour and 500-2,000+ combinations (adjacent-usecases.md §1, §6)"

