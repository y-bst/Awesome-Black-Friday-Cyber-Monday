  p_typical: 0.04
  grounded: inferred
  evidence: "'ICCS 2020: cascade classifiers detect HUD, then OCR reads and interprets its text' (methods-churn-funnel.md §4); Gemini 'default 1 FPS sampling, about 6 hours of video in 2M context' (competitor-and-ua.md §1)"
  proposed: "Ingest review videos by device name; output per device, title, scene: median fps, min fps, minute of first drop, with links to source timestamps"
  shallow: false
