- id: oem-1
  title: "Cross-SoC rendering-artefact diff: the same bot route in the top 200 titles is played on our flagship and on 2 rival flagships, and a frame-aligned diff flags artefacts that appear only on our GPU (missing shadows, banding, z-fighting, flicker)"
  level: L3
  cell: {buyer-role: engineering-performance, video-source: automated-bot-or-agent-playthrough, signal-extracted: visual-errors-and-glitches, analysis-type: benchmark-vs-competitor, lifecycle-moment: new-version-release, delivery-form: issue-tracker-ticket, buyer-org-type: device-oem, companion-data: build-and-config-metadata, capture-trigger-and-sampling: scheduled-bot-playthrough, game-platform-and-genre: mobile-midcore-f2p}
  object: "adjacent-usecases.md §6 'INFERRED: video-only analysis competes with cheap counters for fps; its edge is rendering/visual defects per device model and no-SDK use on shipped builds'"
  situation: "A title ships update 5.2 that adds volumetric fog; on our Adreno-class GPU the fog renders as 8-step colour bands while the rival Mali and Apple devices show a smooth gradient; FPS counters are identical on all three"
  consequence: "The artefact reaches reviewers before our driver team knows; tech YouTubers show the banded fog side by side and the phone gets tagged 'worse for gaming' during its launch window"
  p_typical: 0.08
  grounded: inferred
  evidence: "'video-only analysis competes with cheap counters for fps; its edge is rendering/visual defects per device model and no-SDK use on shipped builds' (adjacent-usecases.md §6)"
  proposed: "Weekly diff run over the top 200 titles by installs on our devices; tickets routed to driver team or to the studio via the OEM developer-relations program"
  shallow: false
  mechanism: "Agent replays a recorded 3-minute route per title on 3 devices; frames are aligned by scene classifier and HUD OCR timestamps; a perceptual diff plus a VLM labels regions that differ (banding, missing shadow pass, texture LOD, flicker across 2+ frames) and tags the device where the defect exists"
  example: "Weekly run: 'Title X 5.2, fog banding on SM8xxx only, 14/14 runs, driver 0762' opens DRV-4410; driver team finds a precision downgrade in a shader compiler path and ships a fix in the next GPU driver update"
  cost: L
  depends_on: "device lab with rival devices; agent that can reach the same scene on 3 devices (nunu.ai-class vision agent); per-title route recording"
  buyer: "GPU driver and game-compatibility lead at a mobile chipset vendor, or gaming program lead at a phone OEM"
  input: "bot playthrough video captured over HDMI/USB from 3 devices + GPU driver version + build ID + device perf counters"
  why_existing_tools_cannot: "GameBench measures FPS, CPU/GPU, thermals and battery, not visual defects (adjacent-usecases.md §6); Razer QA Companion-AI detects rendering bugs on PC tester builds, not per phone SoC (market.md §3)"
  willingness_to_pay: "4 - GameBench says its SDK and Labs are used by device makers and chipset vendors on enterprise pricing (adjacent-usecases.md §6); OEMs already fund per-title optimisation programs (B-perspectives device-oem-and-chip-vendor)"

- id: oem-2
  title: "Nightly GPU-driver regression gate: 50 fixed game captures are replayed on each driver build and a golden-frame comparison blocks the build when a new artefact class appears in 2+ titles"
  level: L4
  cell: {buyer-role: engineering-performance, video-source: automated-bot-or-agent-playthrough, signal-extracted: visual-errors-and-glitches, analysis-type: build-to-build-regression-diff, lifecycle-moment: pre-launch-qa, delivery-form: alert-or-slack, buyer-org-type: device-oem, automation-level: auto-created-ticket-or-asset, constraint-to-overcome: accuracy-and-trust}
  object: "methods-churn-funnel.md §4 '2026 study of off-the-shelf VLMs on 19,738 keyframes ... Temporal glitches (multi-frame) are \"substantially harder\" for VLMs than spatial ones'"
  situation: "Driver build 512.3 changes texture-compression decode; 3 of 50 golden scenes show blocky ASTC artefacts on foliage; unit tests and conformance suites pass"
  consequence: "Without a game-footage gate the regression ships in an OTA to 4M phones and is found through player forum posts 2 weeks later; a rollback OTA costs a full release cycle"
  p_typical: 0.06
  grounded: inferred
  evidence: "'off-the-shelf VLMs ... already detect \"a certain range\" of visual bugs; hybrid approaches likely needed' (methods-churn-funnel.md §4)"
  proposed: "Deterministic replay where the engine allows it, else agent route; SSIM per region plus VLM labelling only on regions where SSIM drops below 0.92"
  shallow: false
  mechanism: "Fixed corpus of 50 scenes (10 engines x 5 effect types: foliage, particles, post-process, UI text, shadows); each nightly driver build renders them; pixel-level SSIM against the last good build flags regions; a VLM classifies the regression type; alert posts to the driver channel with side-by-side crops"
  example: "'#gpu-driver-nightly: build 512.3 FAIL, ASTC block artefacts on foliage in 3/50 scenes (Unity URP x2, Unreal 5 x1)' -> commit bisected the same morning"
  cost: M
  depends_on: "replayable scene corpus licensed from or agreed with 10+ studios; device farm slot per nightly build"
  buyer: "GPU driver QA manager at a mobile chipset vendor"
  input: "scheduled bot playthrough capture of 50 scenes + driver build ID + golden frames from the previous build"
  why_existing_tools_cannot: "VLM zero-shot precision was 0.50 on industrial QA video (adjacent-usecases.md §1), so a golden-frame diff narrows the region first; no vendor in the notes sells a driver-side gate built on game footage (market.md §9 gap map)"
  willingness_to_pay: "4 - a dedicated in-house test lab is estimated at USD 40k-100k (adjacent-usecases.md §1); a rollback OTA on millions of phones costs more than a year of the tool"

- id: oem-3
  title: "Perceived-smoothness score per title per device: high-speed camera or HDMI capture of displayed frames gives frame-time variance and stutter count that the in-game FPS counter averages away"
  level: L4
  cell: {buyer-role: engineering-performance, video-source: internal-qa-builds, signal-extracted: performance-fps-and-load, analysis-type: benchmark-vs-competitor, delivery-form: dashboard, buyer-org-type: device-oem, companion-data: device-perf-counters, game-platform-and-genre: competitive-multiplayer}
  object: "adjacent-usecases.md §6 'reliable fps/load measurement uses in-game profiling or GameBench rather than video alone'"
  situation: "Both our phone and the rival phone report 'average 59.8 fps' in a 5v5 MOBA teamfight, but on our phone 1 frame in 40 is held for 33 ms during skill effects; players feel it as hitching"
  consequence: "Average FPS marketing claims tie, while user reviews say the rival 'feels smoother'; the performance team has no number to chase"
  p_typical: 0.15
  grounded: inferred
  evidence: "'same build can run 60 fps on a flagship and 24 fps on a mid-tier phone; physical devices still needed for touch latency, thermals, battery' (adjacent-usecases.md §6)"
  proposed: "Report P99 displayed frame time, count of frames held > 2 vsync intervals per minute, and the scene where they cluster"
  shallow: false
  mechanism: "Capture at 240 fps from an external high-speed camera or HDMI out; a frame-change detector timestamps each new displayed frame; a scene classifier (lobby, teamfight, ultimate animation) splits the stutter count by scene; joined to GPU/CPU counters to say which unit was busy"
  example: "Dashboard row: 'MOBA title, teamfight scene, ours 11 holds/min, rival 2 holds/min, CPU big-core at max frequency during holds' -> scheduler team changes task placement for that game's render thread"
  cost: M
  depends_on: "capture rig per device; scene classifier per title (20-50 titles)"
  buyer: "Performance engineering lead at a phone OEM"
  input: "displayed-frame capture (camera or HDMI) + device perf counters (CPU/GPU frequency, temperatures)"
  why_existing_tools_cannot: "Counter-based tools (GameBench, PerfDog) report frames rendered, which is why the notes say video alone is not used for fps (adjacent-usecases.md §6; market.md §3); none labels the game scene where stutter clusters"
  willingness_to_pay: "4 - WeTest PerfDog Professional cited at about USD 1,200 for 50 test hours (market.md §3); GameBench is bought by device makers (adjacent-usecases.md §6)"

- id: oem-4
  title: "Thermal-degradation moment finder: in a 30-minute run, video detects the minute a title silently drops render resolution or graphics preset, joined to skin-temperature counters, per device"
  level: L4
  cell: {buyer-role: engineering-performance, video-source: automated-bot-or-agent-playthrough, signal-extracted: visual-errors-and-glitches, analysis-type: root-cause-of-a-metric-change, delivery-form: per-cohort-report, buyer-org-type: device-oem, companion-data: device-perf-counters, game-platform-and-genre: mobile-midcore-f2p}
  object: "market.md §3 HeadSpin 'Video quality KPIs (blockiness, blurriness, reference-free MOS) for game streams'; adjacent-usecases.md §6 GameBench 'thermals'"
  situation: "Open-world RPG at minute 22: skin temperature reaches 44 C, the game's dynamic resolution scaler drops from 1080p to 720p; FPS counter stays at 60, so a counter-based report says 'stable'"
  consequence: "Thermal tuning looks successful in counter reports while players see a blurry image after 20 minutes; reviewers' 30-minute tests catch it"
  p_typical: 0.07
  grounded: inferred
  evidence: "HeadSpin tracks 'blockiness, blurriness, reference-free MOS' for game streams (market.md §3); GameBench 'measures FPS, frame stability, memory, CPU/GPU, battery, thermals' (adjacent-usecases.md §6)"
  proposed: "Report per title: minutes to first quality drop, temperature at that minute, frames-per-watt before and after"
  shallow: false
  mechanism: "Reference-free sharpness and blockiness score on each second of footage; a change-point detector marks the minute the score drops by more than 15%; a VLM checks whether the drop is a preset change (shadows off, foliage density lower) or a resolution change; joined to temperature and frequency counters"
  example: "Report: 'RPG title, ours: quality drop at minute 22 at 44 C; rival: minute 31 at 43 C' -> thermal team moves the throttle threshold and adds a vapour chamber note to the next hardware revision"
  cost: M
  depends_on: "30-minute agent route per title; counter logging tool already used in the lab"
  buyer: "Thermal and performance engineering lead at a phone OEM"
  input: "bot playthrough capture (30 min) + skin and SoC temperature + CPU/GPU frequency counters"
  why_existing_tools_cannot: "HeadSpin's video quality KPIs target game streams, and GameBench reads thermals and FPS, but neither notes a link from in-game resolution or preset drops to temperature (market.md §3; adjacent-usecases.md §6)"
  willingness_to_pay: "3 - same buyer pays GameBench enterprise (adjacent-usecases.md §6); the value is one hardware decision per device generation, so it is a lab tool, not a fleet product"

- id: oem-5
