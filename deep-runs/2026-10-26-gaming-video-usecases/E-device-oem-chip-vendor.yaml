- id: oem-12
  title: "Foldable and cutout layout checker: bot plays each title in folded, unfolded and flex-mode states and a UI detector flags HUD buttons under the camera hole, letterboxing and layouts that break on the fold transition"
  level: L4
  cell: {buyer-role: qa, video-source: automated-bot-or-agent-playthrough, signal-extracted: ui-state-and-screen-flow, analysis-type: compliance-audit, lifecycle-moment: pre-launch-qa, delivery-form: issue-tracker-ticket, buyer-org-type: device-oem, capture-trigger-and-sampling: scheduled-bot-playthrough, game-platform-and-genre: mobile-casual-hypercasual}
  object: "methods-churn-funnel.md §4 'YOLOv5-ABLN ... clickable mobile-game elements; tested on 298 UI screens from 6 popular games; mAP 91.9%'"
  situation: "A new foldable unfolds from 21:9 to 6:5 mid-session; in a casual title the 'Claim' button lands under the hinge crease and the pause button sits under the punch-hole camera"
  consequence: "Device-specific 1-star reviews in launch week; the OEM's compatibility list shows 'supported' because the game did not crash"
  p_typical: 0.07
  grounded: inferred
  evidence: "'compatibility testing of a major mobile title can need 500 to 2,000+ device-OS combinations' (adjacent-usecases.md §6)"
  proposed: "Per title and posture: list of interactive elements overlapping cutout, crease band or screen edge, with a screenshot each, auto-filed to the studio through dev relations"
  shallow: false
  mechanism: "Agent drives the top 500 titles through first 5 minutes in 3 postures and triggers a fold transition at 2 points; a clickable-element detector boxes buttons; geometry check against the device's cutout and crease masks; a VLM checks the frame after transition for stretched, black or frozen output"
  example: "'Casual title C: pause button 60% under camera hole (unfolded), Claim button on crease (flex mode); fold transition freezes the frame for 4 s' -> ticket to studio and launcher forces 'letterbox' for this title until fixed"
  cost: M
  depends_on: "device masks per model; agent able to reach first 5 minutes of 500 titles"
  buyer: "Compatibility QA lead for foldables at a phone OEM"
  input: "scheduled bot playthrough captures per posture + device geometry masks + build metadata"
  why_existing_tools_cannot: "Device clouds record video per run but do not analyse layout overlap (adjacent-usecases.md §6); NetEase-style widget detection is for a studio's own game, not a cross-title device sweep (methods-churn-funnel.md §4)"
  willingness_to_pay: "4 - foldable launch success depends on the top 500 apps; compatibility testing is a stated cost driver at 500-2,000+ combinations (adjacent-usecases.md §6)"

- id: oem-13
