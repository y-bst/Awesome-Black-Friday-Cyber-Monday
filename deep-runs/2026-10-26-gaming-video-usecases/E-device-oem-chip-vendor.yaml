- id: oem-9
  title: "Per-title allow-list for our AI upscaler or frame interpolation: score ghosting on HUD text, crosshairs and fast particles from captured footage on 100 titles and enable the feature by default only where the score passes"
  level: L4
  cell: {buyer-role: engineering-performance, video-source: automated-bot-or-agent-playthrough, signal-extracted: visual-errors-and-glitches, analysis-type: compliance-audit, delivery-form: api-or-sdk, buyer-org-type: device-oem, automation-level: closed-loop-in-game-action, game-platform-and-genre: competitive-multiplayer}
  object: "methods-churn-funnel.md §4 'Temporal glitches (multi-frame) are \"substantially harder\" for VLMs than spatial ones'"
  situation: "The chip's frame interpolation doubles 60 to 120 fps but makes HUD numbers smear in a battle royale; enabled globally it gets reported on Reddit within a week"
  consequence: "Feature enabled per title by hand for 20 titles only; the remaining 480 popular titles never get it, so the marketing feature reaches few users"
  p_typical: 0.03
  grounded: inferred
  evidence: "'Temporal glitches (multi-frame) are \"substantially harder\" for VLMs than spatial ones' (methods-churn-funnel.md §4)"
  proposed: "A score per title per feature version; config pushed to devices via the OEM game launcher title profile"
  shallow: false
  mechanism: "Capture the same route with feature on and off; detect HUD and text regions (YOLO-class UI detector), compute edge ghosting and text OCR confidence on interpolated frames vs real frames; a title passes when OCR confidence drops under 3% and ghosting stays under threshold"
  example: "'Battle royale title: HUD ammo count OCR confidence -14% on interpolated frames -> blocked; puzzle title: -0.5% -> enabled' pushed to 3M devices in the next profile update"
  cost: M
  depends_on: "route recording per title; launcher title-profile channel; oem-1 capture rig"
  buyer: "Product manager for GPU features (upscaling, frame generation) at a chipset vendor or OEM"
  input: "bot playthrough capture with feature on/off + feature version"
  why_existing_tools_cannot: "UI element detectors exist (mAP 91.9% on mobile game screens, methods-churn-funnel.md §4) but no vendor applies them to score upscaler or interpolation artefacts per title (market.md §9 gap map)"
  willingness_to_pay: "4 - the feature is a launch differentiator and coverage scales from 20 to 500 titles; anchor GameBench enterprise and PerfDog USD 1,200 per 50 test hours (adjacent-usecases.md §6; market.md §3)"

