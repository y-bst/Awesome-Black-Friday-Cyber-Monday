- id: bi-15
  case: >-
    Drop it as a lead product: almost every column in the proposed table can be built without video. 'Share reaching state X within 60 s' and 'median seconds to first action' are progression and design events that GameAnalytics tells studios to log for every tutorial step (methods-churn-funnel.md section 1). A BI head who already has MMP rows in the warehouse can join them to those events in an afternoon. The table also measures a proxy (first-minute behaviour) for something the MMP already reports per creative (D1 retention, ROAS). UA moves spend on those numbers, so the decision in the example does not need the new column. The sample maths fails where the money is. The option itself needs about 300 sampled installs per creative, yet studios test 50-200 new variants per title per week and the top 2% of creatives take 60.7% of spend (competitor-and-ua.md section 3). At the 1-5% user sampling the notes call practical (methods-churn-funnel.md section 7), only the handful of creatives that already have dense cohort data would ever qualify. The one verified complaint (GeekLab) is specifically about iOS, where consent is also the hardest: Apple requires explicit consent and a visible recording indicator (methods-churn-funnel.md section 7), and it would have to be asked of a brand-new install in its first minute. Asking then biases exactly the cohort being measured. The gap claim rests on one vendor blog line and an INFERRED absence, with p_typical 0.06. And Segwise already connects to AppsFlyer, Adjust and the other MMPs, so an event-based version of this join is one feature away for them.
- id: scout-1
  case: >-
    Defer it, because the moat is a benchmark library that does not exist and has to be built before the first sale. The percentile needs the same metrics computed on 200+ shipped games' first sessions. Each game needs its own screen classifier trained on a few hundred labelled frames (methods-churn-funnel.md section 4 INFERRED), and cross-game generality is a known weak point (NVIDIA's patents assume per-game configuration). Without that library the product is a 20-tester recruited playtest. That is the User Test product the frame asks us to go beyond, and it would compete with PlaytestCloud at PlaytestCloud's own price. PlaytestCloud is the incumbent best placed to add a cross-game percentile. It ran 5,000+ playtests in 2024, has a 1.5M-player panel, and claims half of the $5B+ grossing mobile games tested on it (market.md section 1). Antidote already captures touches, controller inputs and game events, runs cloud-streaming playtests and has an anti-leak SDK (market.md section 1). That covers the capture side of this option. The demand evidence is borrowed. The price anchors come from UX-research playtest buyers and from GameRefinery feature-intel subscribers, and no note names a publishing scout who pays for diligence evidence or says how many pitch builds a publisher reviews a year. Grounding is 'inferred' from a gap-map absence. With 20 testers, a percentile against the library has a confidence interval wide enough for a developer to dispute in committee.
- id: design-17
  case: >-
    Drop it: this is the option where video adds the least over events the studio already controls. The 'not enough coins' popup, the next screen, a replay of Level 12 and a store purchase are all screens the studio built. An economy A/B test is planned in advance, so this is exactly the case where the notes say these signals 'can be instrumented as events, but only if anticipated' (methods-churn-funnel.md section 2 INFERRED). GameAnalytics Resource and Progression events and any Amplitude path chart already give per-arm popup counts and next-step transitions. Every number in the example (3.1 vs 1.0 popups, 22% vs 9% quit) can be derived from events, with no capture, consent or classifier. The cited evidence is one generic INFERRED line that funnels leave 'why' to a hypothesis. The willingness signal is an Amplitude case study about D1, not an economy designer paying for footage, and p_typical is 0.06. Sampling is also against it. Targeted capture of D1-D7 players who reach Levels 18-22, against a median D7 just under 4% (methods-churn-funnel.md section 1), leaves few clips per arm once consent and Wi-Fi-only upload are applied. At best it is a clip-attachment feature on an existing A/B report, not a product to sell first.
- id: qa-2
  case: >-
    Defer it as a trigger inside the shared ring-buffer SDK rather than lead with it. The incumbents are one trigger rule away. Bugsee already records continuous 10 fps video and attaches it to crashes (market.md section 2). Sentry already buffers the last minute and uploads on a condition (methods-churn-funnel.md section 6). A 'frozen frame plus taps' or 'spinner over 45 s' condition needs no UI tree and no game understanding, so UXCam's native-view limitation does not protect this. Razer QA Companion-AI already sells vision-based detection on footage with zero integration (adjacent-usecases.md section 1). Detection without video is also mostly available. A client watchdog on any spinner and the server seeing claim retries that never complete would have caught the 'Event Reward after reconnect' example, so video adds the repro clip, not the alert. Accuracy is the real risk. Static-screen-plus-taps and 2-4-frame loops fire on puzzle players thinking, idle animations, unskippable dialogue and long loads on mid-tier phones that run at 24 fps (adjacent-usecases.md section 6). Temporal events are 'substantially harder' for VLMs (methods-churn-funnel.md section 4), and zero-shot VLM bug detection reached only 0.50 precision (adjacent-usecases.md section 1). Only 16% of developers fully trust AI QA outcomes (market.md signals), so a noisy hourly Slack count will be muted within a week. Always-on capture with continuous perceptual hashing also needs a large consented population, a visible iOS recording indicator, and battery and CPU headroom on low-end devices, all for an event with p_typical 0.12.
- id: liveops-11
  case: >-
    Drop it: the question can be answered more cheaply and more reliably without video. Scroll depth and 'tier N visible' on a battle-pass screen the studio built are one-sprint client events. Season launches are planned weeks ahead, so this is anticipated instrumentation, the case the notes say events can cover (methods-churn-funnel.md section 2 INFERRED). The method also confuses correlation with cause. Players who scroll to tier 15 are more engaged and would buy more anyway, so the 9% vs 1.4% attach gradient does not show that moving the reward preview will lift attach. Only an A/B test shows that, and the studio can run one for free. 'Price on screen for 2 s or more' is not attention: the only cited evidence is eye-tracking studies (43 children; a HUD redesign) showing that players miss information that is on screen (methods-churn-funnel.md section 2), which argues against screen-time as a proxy for 'seen'. The statistics are thin. At 3-4.5% attach, a few hundred sampled battle-pass visits yield only a dozen or so purchasers to split across depth buckets. The buyer would use the product once per season, and payment sheets on screen add masking work (methods-churn-funnel.md section 7). The willingness anchor is borrowed from competitor-intel subscriptions (Sensor Tower, GameRefinery), a different buyer, and grounding is inferred with p_typical 0.06.
