  object: "subscription upsell and consent dialogs; contrast ratios and subtitle size are checkable items with no vendor (adjacent-usecases.md s4 INFERRED)"
  situation: "a first-session subscription dialog has a 320x96 px 'Continue' button at 7:1 contrast and a 90x24 px 'No thanks' at 2.1:1"
  consequence: "asymmetric choice design is a dark pattern; it also fails the legibility checks that Xbox accessibility testing looks at"
  p_typical: 0.06
  grounded: inferred
  evidence: "adjacent-usecases.md s4: 'checkable-from-pixels items (subtitle size/contrast, flashing, colour-only cues) are candidates; no vendor found doing it'"
  proposed: "one screenshot upload gives the 2 button boxes, area ratio, contrast ratio and a pass line at ratio under 3:1 area and 4.5:1 contrast"
  shallow: false
  mechanism: "Detector finds the primary and the dismiss button on a dialog frame, measures area and WCAG-style contrast; flags ratios above thresholds. Changes who can run a dark-pattern lint: any designer, in minutes."
  example: "An indie puzzle game uploads 6 dialogs; 2 fail, each with a fix suggestion of 'raise No thanks to 44 px height'."
  cost: S
  depends_on: "nothing beyond a UI-element detector (YOLO-class mAP about 90%, methods-churn-funnel.md s4)"
