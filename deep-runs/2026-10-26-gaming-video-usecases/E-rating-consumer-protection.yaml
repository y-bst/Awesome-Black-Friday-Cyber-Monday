- id: rating-21
  title: "Gacha near-miss animation detector: reveal sequences that flash a top-tier glow then downgrade the result"
  level: L4
  cell: {buyer-role: rating-and-consumer-compliance, video-source: public-streams-and-ugc, signal-extracted: visual-errors-and-glitches, analysis-type: anomaly-alert, delivery-form: per-cohort-report, game-platform-and-genre: mobile-midcore-f2p, effort: L-multi-quarter}
