  cost: M
  depends_on: "bot on production with test accounts; baseline store of approved screens (rating-11 archive)"
  buyer: "Compliance lead and live-ops manager at a mobile F2P studio"
  input: "Scheduled bot footage of the production game"
  why_existing_tools_cannot: "Live-event trackers (GameRefinery Live Events Tracker, Playliner) run on human analysts for competitors, 35+ event types and 100-230 games (adjacent-usecases.md s7; competitor-and-ua.md s1) and never watch the studio's own live config for compliance fields."
  willingness_to_pay: "3 - anchor: studios pay five figures a year for live-ops tracking (competitor-and-ua.md s1, s8); a per-game monthly USD 500-1,500 is within QA tool ranges (GameDriver from USD 150/month, market.md WTP)"

- id: rating-16
