  cell: {buyer-role: rating-and-consumer-compliance, video-source: support-ticket-attachment, signal-extracted: dark-pattern-and-disclosure-ui, analysis-type: ask-a-question-over-footage, delivery-form: ask-question-agent-chat, companion-data: support-ticket-text, constraint-to-overcome: minors-coppa-gdpr-k, lifecycle-moment: post-churn-winback}
  object: "a parent's refund ticket attaching a 40 s clip; Resolution Games and Arrowhead support pages ask players to record video by hand (adjacent-usecases.md s9)"
  situation: "a USD 99.99 pack was bought in one tap by a child; the support agent must decide to refund or refuse and whether to flag a design issue"
  consequence: "refusals that look wrong on the clip feed chargebacks and complaints; accumulation of the same design fault is invisible in tickets"
  p_typical: 0.05
  grounded: inferred
  evidence: "adjacent-usecases.md s9: 'players self-record and attach; agents watch' and 'gap is automatic capture plus AI summary of the clip into the ticket; no priced evidence'"
  proposed: "agent reads the clip, answers 4 questions (was price in money shown, was there a confirm step, button size, was the age gate passed) and tags the ticket; weekly count per screen"
  shallow: false
  mechanism: "VLM over a ticket clip with a fixed rubric of purchase-clarity questions; results tagged on the ticket and aggregated by screen. Changes the support output from a refund decision to a design finding."
  example: "12 refund clips in a month; 9 show the same 1-tap 'Buy' with no confirm, and the aggregate points at one dialog."
  cost: S
  depends_on: "the existing ask-question agent; ticket system connector"
  buyer: "Head of player support with the compliance lead as consumer of the aggregate"
  input: "Player-submitted clips attached to tickets, ticket text"
  why_existing_tools_cannot: "Helpshift auto-captures device and session state but no video confirmed (adjacent-usecases.md s9), and non-game replay tools (Fullview, Screendesk) do not read game screens (adjacent-usecases.md s9)."
  willingness_to_pay: "2 - anchor: Helpshift monthly platform fee plus per-issue rate with 1,000 issues/month included (adjacent-usecases.md s9); reviewers call it expensive, so add-ons struggle"

- id: rating-13
  title: "Monetising-on-frustration check: offer popups opening within 3 s of the 4th consecutive fail screen, measured by cohort"
  level: L4
  cell: {buyer-role: rating-and-consumer-compliance, video-source: own-players-consented-sdk, signal-extracted: ui-state-and-screen-flow, analysis-type: cohort-comparison, capture-trigger-and-sampling: event-triggered-clip, companion-data: purchase-and-ad-revenue-events, delivery-form: per-cohort-report, lifecycle-moment: d1-to-d7}
  object: "fail screen followed by an offer popup; rage quit definitions and 'low-action time' signals in methods-churn-funnel.md s2"
  situation: "on level 7, 61% of sessions that reach a 4th fail see an 'Extra moves' offer within 3 s; the compliance lead wants to see whether the pattern targets players in distress"
  consequence: "pressure at a moment of frustration is a vulnerability-exploitation argument in a complaint; the monetisation lead will resist because it converts"
  p_typical: 0.06
  grounded: inferred
  evidence: "methods-churn-funnel.md s2: 'the exact screen state at the moment of app kill (rage quit vs. interruption)' and repeated failed gestures exist in video but not in event streams"
  proposed: "per level: share of fail-then-offer sequences under 3 s and the conversion in each; report with 10 sample clips"
  shallow: false
  mechanism: "Screen-state sequence extraction from sampled clips; counts fail-to-offer latency; compares conversion in the fast and slow groups. Changes the audit from 'is there an offer' to 'when and after what is it shown'."
  example: "Puzzle game: 61% of offers appear in under 3 s after the 4th fail on level 7; conversion 4.1% vs 1.3% in the slow group."
  cost: M
  depends_on: "consented clip capture on trigger; fail and offer events"
  buyer: "Compliance lead, jointly with the monetisation lead, at a mobile F2P publisher"
  input: "Event-triggered clips around fails plus purchase events"
  why_existing_tools_cannot: "Funnels show where not why (Unity docs, methods-churn-funnel.md WTP complaints) and fail-and-offer timing needs the on-screen order of overlays that telemetry often misses (methods-churn-funnel.md s2 INFERRED)."
  willingness_to_pay: "2 - anchor: PlaytestCloud's USD/EUR 113-141 per session shows what a why-answer costs (market.md s1) and a sample of 100 clips as a USD 1,000-3,000 study; the buyer tension is that it reduces revenue"

- id: rating-14
