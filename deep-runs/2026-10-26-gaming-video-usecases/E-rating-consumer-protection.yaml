  consequence: "a disclosure that exists but cannot be read is not clear and conspicuous (my prior knowledge, unverified); it passes a bot on one device and fails on others"
  p_typical: 0.04
  grounded: speculative
  evidence: "adjacent-usecases.md s6: 'same build can run 60 fps on a flagship and 24 fps on a mid-tier phone; physical devices still needed'; adjacent-usecases.md s4: contrast and subtitle size are checkable from pixels."
