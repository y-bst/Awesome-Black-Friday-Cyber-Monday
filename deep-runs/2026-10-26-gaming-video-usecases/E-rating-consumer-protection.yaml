  why_existing_tools_cannot: "VLMs are weak at temporal glitches (methods-churn-funnel.md s4; adjacent-usecases.md s1 arXiv 2607.25921) and no notes list any vendor on animation design."
  willingness_to_pay: "1 - anchor: no price signal in notes; a niche ethics review; the persona would use it only if an external critic published first"

