  why_existing_tools_cannot: "Device clouds record per-run video and logs but do not read legibility (adjacent-usecases.md s6), and GameBench measures fps, memory and thermals only (adjacent-usecases.md s6)."
  willingness_to_pay: "2 - anchor: outsourced QA at USD 15-50 per hour and a mobile test cycle of USD 1,000-5,000 (adjacent-usecases.md s1); a check adds a few hours to a cycle"

