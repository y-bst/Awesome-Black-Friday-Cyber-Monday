- id: rating-1
  title: "Bot walks every randomised-item purchase path and checks that the odds table is reachable within 1 tap before the pay confirmation"
  level: L4
  cell: {buyer-role: rating-and-consumer-compliance, video-source: automated-bot-or-agent-playthrough, signal-extracted: dark-pattern-and-disclosure-ui, analysis-type: compliance-audit, lifecycle-moment: pre-launch-qa, delivery-form: enforcement-or-cert-evidence-pack, effort: M-one-quarter, buyer-org-type: mid-size-studio, game-platform-and-genre: mobile-midcore-f2p}
  object: "the gacha banner 'Pull x10' button and its confirm dialog; analogue is the MGATS audit that logs 'concerns' with repro steps and video (adjacent-usecases.md s4)"
  situation: "a release candidate adds 3 new randomised banners; the compliance lead has 2 days before store submission and 14 banner and bundle paths to check by hand"
  consequence: "a missing or buried odds link is found by a store reviewer or a regulator instead of by the studio; one rejected submission costs about 5-7 days of release delay"
  p_typical: 0.12
  grounded: speculative
  evidence: "none on loot-box rules in the notes; the nearest evidence is that human compliance-style audits are priced by hours (MGATS 150-250 testing hours, adjacent-usecases.md s4) and that no vendor audits footage for such UI items (adjacent-usecases.md s4 'NOT FOUND'). Odds-disclosure store rules are from my prior knowledge, unverified here."
  proposed: "per banner, emit pass/fail on 4 checks (odds link taps from pull button, odds visible before payment, percentages sum to 100, text legible) with the 3 key frames attached"
  shallow: false
  mechanism: "A scripted or agent playthrough reaches each purchase screen; a VLM plus OCR locates the randomised-item button, counts taps to the odds table, and reads the percentages; output is a per-path checklist with frames. Changes who does the audit (bot, not the compliance lead) and where (every build, not the final one)."
  example: "A match-3 live-ops team ships a 'Mystery Chest' with 5-tier rewards; the bot finds the odds sit under a 'Details' tab 3 taps away, with the 'Buy' button on the first screen, and files a ticket with 3 frames."
  cost: M
  depends_on: "a bot or scripted path that can reach each store screen (for example the Razer, modl.ai or in-house bot class in market.md s3), plus the existing frame-annotation and report agent of the User Test product"
  buyer: "Compliance or legal-ops lead at a mid-size mobile F2P studio or publisher"
  input: "Footage from an automated playthrough of an internal QA build, plus the store catalogue config listing which products are randomised"
  why_existing_tools_cannot: "QA video agents look for rendering and physics bugs (market.md s3 Razer QA Companion-AI; adjacent-usecases.md s1), session-replay SDKs show only a black box or screenshots for game canvases (market.md s2 'Does NOT do'), and human accessibility-style audits take 150-250 hours (adjacent-usecases.md s4)."
  willingness_to_pay: "3 - anchor: a human audit pass at 150-250 hours x USD 15-50 per outsourced QA hour (adjacent-usecases.md s1) is USD 2,250-12,500 per pass; a per-build fee of USD 500-1,500 is plausible; no compliance-specific price in the notes"

- id: rating-2
  title: "OCR of on-screen drop rates reconciled against the server drop-table in build config, mismatch above 0.1 percentage point raised as a ticket"
  level: L4
  cell: {buyer-role: rating-and-consumer-compliance, video-source: internal-qa-builds, signal-extracted: on-screen-text-ocr, analysis-type: build-to-build-regression-diff, lifecycle-moment: new-version-release, delivery-form: issue-tracker-ticket, companion-data: build-and-config-metadata, automation-level: auto-created-ticket-or-asset, constraint-to-overcome: joining-video-to-events, pricing-model: per-build-or-release}
  object: "the drop-rate table text on the banner details screen versus the 'build and config metadata' drop-table (companion-data axis); OCR limits on stylised HUD fonts (methods-churn-funnel.md s4)"
  situation: "a designer edits a pity threshold from 90 to 80 in remote config, but the localised odds text still reads 0.6% for the top tier"
  consequence: "the game shows odds that differ from the real ones; in a consumer-protection inquiry this is a misleading-practice finding, not a bug"
  p_typical: 0.05
  grounded: speculative
  evidence: "none in notes for odds disclosure; OCR on clean-font game UI is called 'mature, cheap' (methods-churn-funnel.md s4 INFERRED) and Nimdzi says generic screenshot tools fall short for linguistic testing (adjacent-usecases.md s5)."
  proposed: "nightly job: OCR every odds screen in 3 languages, parse percentages, diff against config JSON, open a ticket per mismatch with frame and config line"
  shallow: false
  mechanism: "OCR plus numeric parsing of disclosure text from footage, joined to the config file shipped with the build; flags any displayed-versus-configured difference above 0.1 pp. Changes who finds the mismatch (a machine at build time, not a regulator)."
  example: "Gacha RPG, German build: the screen shows '0,6 %' for SSR while config says 0.5; the ticket lands in the live-ops board with the frame."
  cost: M
  depends_on: "bot or scripted capture of the odds screens; read access to build config; an issue-tracker connector"
  buyer: "Compliance lead with a live-ops engineer at a gacha or loot-box heavy mid-size studio"
  input: "Footage of odds screens per language plus build and config metadata (drop tables)"
  why_existing_tools_cannot: "Localisation LQA checks translation, truncation and placeholders by screenshot and hand (adjacent-usecases.md s5) and none reads numbers against config; analytics vendors see events, not what the text on screen said (methods-churn-funnel.md s1 'funnels show where not why')."
  willingness_to_pay: "3 - anchor: avoiding a fine is the lever (no price in notes); SaaS sits near per-build pricing of USD 300-1,000; GameDriver starts at USD 150/month (market.md WTP list) as the floor for QA-adjacent automation"

- id: rating-3
  title: "Fake-urgency detector: countdown on an offer popup compared with how often the same offer reappears for the same player"
  level: L4
  cell: {buyer-role: rating-and-consumer-compliance, video-source: own-players-consented-sdk, signal-extracted: dark-pattern-and-disclosure-ui, analysis-type: compliance-audit, capture-trigger-and-sampling: event-triggered-clip, companion-data: telemetry-events, lifecycle-moment: live-event-or-update, delivery-form: weekly-digest-email}
  object: "offer popup text 'Ends in 02:13:44' (an OCR target) and the offer_id event in telemetry; offer screens dismissed in under a second are a live-ops complaint in B-perspectives live-ops-manager"
  situation: "one starter-pack offer with a 3-hour countdown is shown to the same player on 4 consecutive days with the timer reset each time"
  consequence: "countdown pressure that is not real is the type of dark pattern that consumer authorities target; the studio finds it only after a complaint cluster"
  p_typical: 0.04
  grounded: speculative
  evidence: "none in notes on dark-pattern law; the clip-on-event pattern comes from Sentry error-triggered buffers (methods-churn-funnel.md s6) and the 'offer-screen dismissed' pain from the perspectives file. FTC action on fake urgency is from my prior knowledge, unverified here."
  proposed: "capture a 10 s clip when an offer popup opens, OCR the timer, key by offer_id and player; weekly digest lists offers shown with 3 or more different 'ending' times"
  shallow: false
  mechanism: "On an offer-open event the SDK keeps a 10 s clip; OCR reads the countdown and the discount claim; a join on offer_id and player counts repeats with fresh timers. Changes what is audited: the shown claim, not the configured rule."
  example: "A casual puzzle game: the 'Last chance - 80% off' pack appears 11 times in 7 days for 1 in 40 sampled players, each with 'ends in 1h'."
  cost: M
  depends_on: "an event-triggered capture SDK with consent (market.md s2 IV Metrics Unity SDK class); offer events in telemetry"
  buyer: "Compliance lead or legal counsel at a publisher of mobile F2P titles (with the monetisation lead as the affected team)"
  input: "Event-triggered 10 s clips from consented players plus offer and purchase telemetry"
  why_existing_tools_cannot: "Session replay for games is screenshot-only or black-box (market.md s2 PostHog and generic replay 'Does NOT do'), and event analytics record that an offer opened, not the countdown text the player saw (methods-churn-funnel.md s2 INFERRED)."
  willingness_to_pay: "2 - anchor: the buyer is a cost centre; the only price evidence is the analytics-adjacent UXCam median about USD 21k/year (market.md WTP list) as the ceiling for a per-game licence; monetisation lead will resist"

- id: rating-4
  title: "Virtual-currency stranding audit: store crawl finds item prices in gems with no real-money equivalent and pack sizes that never divide into item prices"
  level: L4
  cell: {buyer-role: rating-and-consumer-compliance, video-source: automated-bot-or-agent-playthrough, signal-extracted: economy-and-store-events, analysis-type: compliance-audit, lifecycle-moment: price-or-economy-change, delivery-form: dashboard, companion-data: purchase-and-ad-revenue-events, game-platform-and-genre: mobile-casual-hypercasual}
  object: "the gem pack ladder (for example 80 / 500 / 1,200 / 2,500 gems) and item price labels in the store screen; GameRefinery's tracking of 'currencies' and 'limited-time shops' by analysts (competitor-and-ua.md s1)"
  situation: "a hero costs 300 gems and no pack leaves the player at exactly 300; the store shows no currency-to-money conversion"
  consequence: "obfuscated pricing in virtual currency is a stated focus of EU consumer enforcement (my prior knowledge, unverified); the studio needs a list of every screen that lacks a real-money price"
  p_typical: 0.04
  grounded: speculative
  evidence: "none on regulation in the notes; the manual precedent is GameRefinery analysts logging currencies and shops by hand with 260 features (competitor-and-ua.md s1)."
  proposed: "per store screen: price label count, share of labels with a real-money equivalent, and the list of items whose price cannot be reached exactly from any single pack"
  shallow: false
  mechanism: "A store crawl by bot; OCR reads prices and currency icons; the economy table gives pack sizes; a small solver computes stranded remainders. Output is a per-screen table, not a score."
  example: "A hypercasual game with 6 packs: 7 of 12 cosmetics are priced in a way that strands 20-70 gems; none of the 12 shows a currency conversion."
  cost: M
  depends_on: "store-navigating bot; pack and item catalogue as companion data"
  buyer: "Compliance lead at a mobile F2P studio, shared with the monetisation lead"
  input: "Bot footage of the store plus the purchase catalogue"
  why_existing_tools_cannot: "Competitor-intelligence tools log currencies and shops with human analysts for the top 100-250 games only (competitor-and-ua.md s1, s8) and cover a studio's own pre-release store screens not at all."
  willingness_to_pay: "2 - anchor: the output is an audit table; a human equivalent is hours of analyst time at USD 15-50 per hour (adjacent-usecases.md s1); no regulator-driven price in the notes"

