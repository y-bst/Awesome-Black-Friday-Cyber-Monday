  cost: M
  depends_on: "public video crawler; per-game screen detector bootstrapped by a general VLM (methods-churn-funnel.md s4 INFERRED)"
  buyer: "Compliance lead at a publisher; secondary buyer is a competitive-intel analyst"
  input: "Public stream and UGC video of purchase and pull screens"
  why_existing_tools_cannot: "Competitor tools are analyst-played at USD 45-115k/year and cover feature tags (competitor-and-ua.md s1, s8); stream analytics count audience (market.md s5 Hatchet, Streams Charts)."
  willingness_to_pay: "3 - anchor: Sensor Tower median USD 75,000/year and GameRefinery USD 45-51k/year (competitor-and-ua.md s1); firms buy both, so a compliance module at USD 15-30k is plausible"

- id: rating-15
  title: "Remote-config change watch: nightly production crawl diffed against the approved screen baseline, Slack alert when a live-ops edit alters a disclosure"
  level: L4
  cell: {buyer-role: rating-and-consumer-compliance, video-source: automated-bot-or-agent-playthrough, signal-extracted: dark-pattern-and-disclosure-ui, analysis-type: build-to-build-regression-diff, lifecycle-moment: live-event-or-update, delivery-form: alert-or-slack, capture-trigger-and-sampling: scheduled-bot-playthrough, automation-level: auto-created-ticket-or-asset}
  object: "weekly events and offers pushed by remote config without a new binary; live events are announced without notice (adjacent-usecases.md s7 pocketgamer quote)"
  situation: "the live-ops manager launches a Tuesday event with a new currency and a 4-hour countdown shop; compliance only reviews binaries"
  consequence: "the highest-change surface of the game, weekly offers, is the one that escapes review; issues live for days"
  p_typical: 0.06
  grounded: inferred
  evidence: "adjacent-usecases.md s7: 'most live events are announced without notice and cannot be scraped; gathering takes large human resources'; B-perspectives live-ops-manager: weekly events and offers"
  proposed: "07:00 UTC crawl of 25 purchase and offer screens in 4 regions; screens whose text, price, timer or odds link differ from baseline raise an alert with before/after frames"
  shallow: false
  mechanism: "Scheduled bot runs on the live production game; screen diff by OCR and layout; alert routed to compliance on any change in tracked disclosure fields. Changes the review unit from a binary to a live config state."
