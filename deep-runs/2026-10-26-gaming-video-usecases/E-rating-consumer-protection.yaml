  level: L4
  cell: {buyer-role: rating-and-consumer-compliance, video-source: creator-sponsored-streams, signal-extracted: on-screen-text-ocr, analysis-type: ad-verification-and-fraud, lifecycle-moment: ua-campaign-launch, delivery-form: weekly-digest-email, pricing-model: per-hour-of-video, buyer-org-type: publisher}
