  p_typical: 0.03
  grounded: speculative
  evidence: "none in the notes on near-miss design; the capability depends on temporal frame analysis, which methods-churn-funnel.md s4 and adjacent-usecases.md s1 (VLMs struggle with temporal glitches) rate as weak."
