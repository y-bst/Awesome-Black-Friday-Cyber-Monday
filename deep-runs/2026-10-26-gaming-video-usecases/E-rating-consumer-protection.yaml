  p_typical: 0.05
  grounded: inferred
  evidence: "competitor-and-ua.md s2 INFERRED: 'No source describes a product that ingests YouTube/Twitch/TikTok gameplay of a competitor and returns features, monetisation touchpoints'; market.md s9 gap map"
