- id: rating-18
  title: "Ad-to-game claim check: UA video shows a mechanic that does not appear in the first 20 levels of the real build"
  level: L4
  cell: {buyer-role: rating-and-consumer-compliance, video-source: competitor-store-and-ad-video, signal-extracted: ui-state-and-screen-flow, analysis-type: compliance-audit, lifecycle-moment: ua-campaign-launch, delivery-form: alert-or-slack, companion-data: attribution-campaign-and-creative-id, buyer-org-type: publisher}
