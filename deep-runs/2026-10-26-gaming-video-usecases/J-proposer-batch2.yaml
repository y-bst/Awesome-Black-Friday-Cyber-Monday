- id: cfo-1
  case: >-
    Build this first because it is the only option where the buyer already holds a signed budget line and the sale is a price
    comparison. The buyer is the CFO or VP Finance at a mid-size mobile F2P studio. That studio already pays PlaytestCloud
    EUR 13,560-33,900 a year for 120-240 recorded sessions, about EUR 113-141 per session (market.md section 1, Signals of
    willingness to pay). The cost of capture is negligible: one stored player-hour costs about $0.04 a month in S3
    (methods-churn-funnel.md section 7). So a per-session quote below EUR 2 turns 120 sessions a year into 6,000+ for the same
    renewal, and those sessions come from real installs, not paid panellists, whose incentive disputes degrade quality
    (market.md section 1). It replaces the playtest token line, and it reuses the ingestion, transcription and report agent the
    founder already ships, so most of the work is the capture SDK and a small per-title screen classifier, which is mature
    technology (button and popup detection about 90% mAP, methods-churn-funnel.md section 4). PlaytestCloud cannot copy it
    quickly for two reasons. Its AI reads transcripts and surveys, not pixels. And its business is a recruited panel sold by the
    token, so pricing analysed live-player sessions at EUR 2 would cannibalise its own EUR 113 unit (market.md section 1 'Does
    NOT do', section 9 gap map). This is also the FTUE capture base that f2p-9 and publisher-2 build on, so selling it first
    pays for the platform.
- id: tns-1
  case: >-
    Build this first because the research names a measured, expensive failure with no product against it. In the
    Activision/Modulate case only about 23% of player reports carried actionable evidence, so roughly 77% of the moderation queue
    cannot be decided (adjacent-usecases.md section 3). The buyer is the trust-and-safety lead at a mid-size or AAA studio
    running a competitive multiplayer title. That budget line is real and large: Modulate's public tiers run up to USD 20,000 a
    month for voice moderation alone, and third parties report USD 10-50k monthly minimums for AAA (adjacent-usecases.md section
    3). Today studios replace the missing footage by asking players to record and attach video by hand, as the Resolution
    Games and Arrowhead support pages show. The research states plainly 'NOT FOUND: no off-the-shelf vendor of a rolling
    last-30-seconds game-client buffer attached to a ticket' (adjacent-usecases.md section 9). Incumbents cannot copy it
    quickly. Modulate and GGWP are voice and text pipelines that never see the screen. Fullview and Screendesk are browser
    tools. Medal clips on the player's PC with no ticket or OCR link (market.md section 4). Upload happens only on Report, which
    keeps bandwidth and consent cost low (methods-churn-funnel.md section 7 ring-buffer pattern). It sells as a per-report or
    per-MAU add-on next to the voice contract, and the same ring buffer later serves support and QA tickets.
- id: f2p-9
  case: >-
    Build this first because it attaches to the most expensive decision a mobile F2P studio makes, the soft-launch go/kill, and
    nothing in the market answers the question it answers. The buyer is the product lead and studio head of a title in soft
    launch. Their numbers sit in the ambiguous band, 24% D1 in one market and 31% in another, against GameAnalytics' 22% median
    and 30% P75 (methods-churn-funnel.md section 1). Funnels give per-market drop counts and stop at 'investigate'. Playtest
    panels recruit testers rather than the actual soft-launch audience of the Philippines or Brazil, so neither tool can tell
    'FTUE problem' from 'wrong market' (market.md section 1, methods-churn-funnel.md section 1 INFERRED). The price anchors are
    EUR 113-141 per analysed playtest session, with targeted recruiting at 1.5 tokens (market.md section 1), and the $45-51k a
    year studios pay GameRefinery for market intelligence (competitor-and-ua.md prices). So a per-game report on 900 sessions
    across three markets sells easily in the five figures. It is S effort once the FTUE classifier from cfo-1 exists: the same
    capture, sliced by market with confidence intervals. Incumbents cannot copy it. PlaytestCloud has no live-install capture and
    no retention link, and analytics vendors have no pixels (market.md section 9 gap map).
- id: publisher-2
  case: >-
    Build this first because it turns video into a one-page decision that a publisher's finance head signs, and the evidence
    says the signal exists. Rovio and Aalto found churn correlates only weakly with level pass rate (r = -0.144) but strongly
    with 'churn without completing the level' (r = -0.586) (methods-churn-funnel.md section 3). That means the last 60 seconds
    before a player's final close are the diagnostic moment, and only a clip shows them. The buyer is the head of publishing or
    CFO who releases soft-launch UA budget. Today that call rests on D1, D7 and CPI alone, so fixable FTUE titles get killed and
    rejected core loops get eight more weeks of spend. The memo replaces both that guess and the recruited-panel playtest. Those
    playtests cost EUR 1,130-2,825 a month with 'no churn or retention link to production telemetry' (market.md section 1 'Does
    NOT do'). A per-soft-launch price of $8-15k is small next to one wasted UA cycle, and publishers run many soft launches, so
    it recurs. No incumbent can produce the 'fixable screen versus core-loop rejection' split. Funnels show where, not why
    (methods-churn-funnel.md section 1). No paper or vendor predicts churn from human gameplay frames (methods-churn-funnel.md
    section 3), so the founder would own the benchmark of bucket shares against eventual outcomes.
- id: compintel-15
  case: >-
    Build this first because it ships in weeks with zero new technology. It is the existing User Test recruit, record and report
    pipeline, re-aimed at a rival game over 30 days. It meets a demand that is already paid for at high prices. The buyer is the
    competitive-intel analyst or games user-research lead at a mid-size studio or publisher. Those teams pay GameRefinery about
    $45-51k a year and Sensor Tower a median of $75k a year (competitor-and-ua.md prices). Yet feature and live-ops coverage
    there is a human play-and-log process confined to the top 100-250 games (competitor-and-ua.md section 1). The day-14+
    systems that drive rival revenue, such as guild wars, PvP and endgame shops, are out of reach of bots, which stall early
    (market.md section 3). PlaytestCloud's competitor playtests are single-session recruited humans whose transcripts are read,
    not pixels (market.md section 1). At EUR 113-141 per recorded session, 150 sessions price the study at about EUR 17-21k, a
    managed project the buyer can expense against the intelligence budget. PlaytestCloud could run a longitudinal panel, but it
    lacks frame-level tagging of unlocks, offers and prices across 150 sessions. Sensor Tower and GameRefinery do not record
    players at all (market.md section 9 gap map). It also generates revenue and labelled rival footage while the capture SDK
    products mature.
