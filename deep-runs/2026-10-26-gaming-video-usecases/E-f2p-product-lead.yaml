- id: f2p-1
  title: "Per-step FTUE drop-reason report: for every Progression funnel step losing >5% of starters, classify 50 abandoner clips into 6 reason codes and show 3 clips per code"
  level: L4
  cell: {buyer-role: product-retention, video-source: own-players-consented-sdk, signal-extracted: ui-state-and-screen-flow, analysis-type: funnel-drop-off-why, lifecycle-moment: ftue-first-session, delivery-form: per-cohort-report, companion-data: telemetry-events, game-platform-and-genre: mobile-midcore-f2p}
  object: "GameAnalytics Progression funnel 'Total Churn' per tutorial step (methods-churn-funnel.md §1)"
  situation: "Tutorial step 3 ('first upgrade') loses 12% of starters on build 1.40; the funnel shows the step and the count, never the cause"
  consequence: "Today the product lead guesses, or orders a PlaytestCloud test that returns in 48 h from 10 recruited testers who are not the live cohort that dropped; the fix ships a release later or targets the wrong cause"
  p_typical: 0.60
  grounded: quote
  evidence: "Unity's own tutorial lists only candidate causes ('a bug that crashes the game, or the level is too hard') ... unexpected drop-offs 'indicate good places to investigate' (methods-churn-funnel.md §1)"
  proposed: "Ship first as a repackage of the User Test report on recruited footage, then switch the input to SDK clips of real abandoners"
  shallow: false
  mechanism: "Per-title screen classifier (tutorial card visible, CTA highlighted, popup open, fail screen, level-complete, store) plus touch overlay labels each abandon clip with one reason code: card dismissed in <1 s, tap on non-interactive art, highlighted CTA not tapped within 15 s, 3+ fails, app backgrounded on fail screen, OS interruption; the report gives share per code per step and per build"
  example: "Merge game, step 'merge two swords' loses 12%: 41% of abandoner clips show 3+ drags onto the wrong tile; designer doubles the drop-target size and checks the step in the next build's report"
  cost: M
  depends_on: "f2p-2 trigger ring buffer; event-to-frame timestamp join; per-title screen labels (a few hundred frames, methods-churn-funnel.md §4 INFERRED)"
  buyer: "Product lead / head of product owning D1 and FTUE at a mid-size mobile F2P studio"
  input: "SDK ring-buffer clips (480p, 5 fps) with touch overlay + GameAnalytics or Amplitude progression events keyed by user_id"
  why_existing_tools_cannot: "Funnels give 'where' only and PlaytestCloud's AI reads transcripts and surveys of recruited testers, not the pixels of live players (methods-churn-funnel.md §1, market.md §1 'Does NOT do')"
  willingness_to_pay: "4 - studios pay PlaytestCloud €13.6k-33.9k/yr for 120-240 analysed sessions, about €113-141 each (market.md 'Signals of willingness to pay')"

- id: f2p-2
  title: "Churn-trigger ring buffer: keep the last 60 s on device at 480p/5 fps and upload over Wi-Fi only when one of 5 FTUE triggers fires"
  level: L4
  cell: {buyer-role: product-retention, video-source: own-players-consented-sdk, capture-trigger-and-sampling: event-triggered-clip, constraint-to-overcome: bandwidth-and-storage, processing-location: on-device, delivery-form: api-or-sdk, lifecycle-moment: ftue-first-session}
  object: "Sentry onErrorSampleRate ring-buffer pattern and the 450 MB-per-first-session upload estimate (methods-churn-funnel.md §6, §7)"
  situation: "Triggers: tutorial step started and not completed within 120 s; app backgrounded on a fail screen; 3 consecutive level fails; rage taps (3+ taps within 300 ms) on a non-interactive area; first session ending under 5 min"
  consequence: "Without trigger-keyed capture the studio either records everything (about 7.5 TB/day at 100k installs/day) or records random sessions that rarely contain the drop moment"
  p_typical: 0.15
  grounded: quote
  evidence: "'onErrorSampleRate (recommended 1.0) buffers and uploads only if an error occurs, keeping about the last minute before the error' ... 'the same pattern keyed on churn-relevant triggers ... is the obvious adaptation' (methods-churn-funnel.md §6)"
  proposed: "Unity and Unreal plugin with a remote-config trigger list and a 1-5% install sample rate"
  shallow: false
  mechanism: "On-device encoder writes a 60 s circular buffer; trigger rules evaluated against the game's own events; clip plus 10 s after the trigger is queued and uploaded on Wi-Fi, otherwise discarded after 24 h"
  example: "Puzzle game, level 3: player fails 3 times and backgrounds the app on the fail screen; a 70 s clip arrives the next morning tagged 'fail-screen exit, level 3'"
  cost: M
  depends_on: "iOS consent prompt with visible recording indicator (Apple 2019 rule); engine render-surface capture for Unity and Unreal"
  buyer: "Product lead, with sign-off from the client engineering lead, at a mobile F2P studio"
  input: "Game render surface + touch events + game progression events"
  why_existing_tools_cannot: "Sentry ring-buffers only on errors; PostHog Unity is screenshot-based and 'alpha'; IV Metrics caps at 50-100 videos/month with no churn triggers (methods-churn-funnel.md §6, market.md §2)"
  willingness_to_pay: "3 - indies pay IV Metrics $49-99/month for capped gameplay video (market.md §2); as plumbing alone it is a feature, value comes from f2p-1"

- id: f2p-3
  title: "Build diff alert: when tutorial-card dwell, step duration or reason-code mix shifts >30% between two builds, post the 3 most changed clip pairs to Slack within 24 h of rollout"
  level: L4
  cell: {buyer-role: product-retention, analysis-type: build-to-build-regression-diff, lifecycle-moment: new-version-release, delivery-form: alert-or-slack, signal-extracted: input-timing-and-hesitation, companion-data: build-and-config-metadata, value-lever-b2b: cut-time-to-insight, pricing-model: per-build-or-release}
  object: "Unity funnel rule 'editing a funnel ... would invalidate any existing data' and the un-instrumented-step note (methods-churn-funnel.md §1)"
  situation: "D1 drops 2 pp after build 1.43, which changed only the art of the reward popup; the event funnel is identical across builds because the popup has no event"
  consequence: "The team rolls back blind or waits a week of D1 data; at 100k installs/day each day of a 2 pp drop is about 2,000 lost day-1 players"
  p_typical: 0.07
  grounded: inferred
  evidence: "'a step that was never instrumented (e.g. player looked at the shop button for 6 s and did not tap) does not exist in the data' (methods-churn-funnel.md §1 INFERRED)"
  proposed: "Compare per-screen dwell and reason-code distributions between build N and N-1 on the first 500 triggered clips of the new build"
  shallow: false
  mechanism: "Per screen class, compute median dwell, tap-to-CTA latency and reason-code shares per build version; flag shifts above 30% with a two-sample test and pick clip pairs closest to each build's median"
  example: "Build 1.43: median dwell on reward popup falls from 3.8 s to 0.9 s and 'tap outside CTA' doubles; Slack alert shows the new popup hides the Continue button behind the coin burst"
  cost: S
  depends_on: "f2p-1 classifier; build version in clip metadata"
  buyer: "Product lead and release owner at a mobile F2P studio shipping weekly"
  input: "Triggered clips from two builds + build and config metadata + D1 by build"
  why_existing_tools_cannot: "Funnels compare instrumented event counts only, and Unity funnels cannot be edited without invalidating data (methods-churn-funnel.md §1)"
  willingness_to_pay: "4 - analytics vendors sell FTUE outcomes with headline numbers (FunCraft +40% D1, EA 30% faster onboarding; methods-churn-funnel.md 'Signals of willingness to pay')"

- id: f2p-4
  title: "Instrumentation gap finder: cluster every distinct FTUE screen seen in footage, diff against the event taxonomy, and open a ticket per un-evented screen with a ready-to-paste design-event spec"
  level: L3
  cell: {buyer-role: product-retention, signal-extracted: ui-state-and-screen-flow, analysis-type: funnel-drop-off-why, lifecycle-moment: soft-launch, delivery-form: issue-tracker-ticket, automation-level: auto-created-ticket-or-asset, value-lever-b2b: create-data-that-did-not-exist}
  object: "GameAnalytics FTUE advice to 'split the tutorial into more milestones to figure out what causes the drop-off' (methods-churn-funnel.md §1)"
  situation: "Soft launch: footage shows an 'additional content 85 MB' download screen between tutorial steps 2 and 3 that has no event, and 9% of abandon clips end on it"
  consequence: "The funnel attributes those losses to step 3; the team redesigns the wrong screen"
  p_typical: 0.04
  grounded: inferred
  evidence: "'Most of these can in principle be instrumented as events, but only if anticipated; video captures them retroactively for any screen' (methods-churn-funnel.md §2 INFERRED)"
  proposed: "Weekly job listing screen clusters with frequency, position in session and abandon share, each with a proposed event name"
  shallow: false
  mechanism: "Unsupervised clustering of keyframes by layout embedding, matched against screens that already fire events; unmatched clusters with >1% of session time become Jira tickets with a sample frame and a suggested GameAnalytics design-event string"
  example: "Ticket 'FTUE: unevented screen #14 (asset download), seen in 31% of first sessions, 9% of abandons end here; add design event ftue:download:start/complete'"
  cost: S
  depends_on: "f2p-2 clips; read access to the event taxonomy"
  buyer: "Product lead plus game analyst at a mobile F2P studio in soft launch"
  input: "Random-sample FTUE clips + event schema export"
  why_existing_tools_cannot: "Funnels only contain anticipated steps; generic replay tools see an engine canvas as one black box with no screen identity (methods-churn-funnel.md §1, market.md §2 'Does NOT do')"
  willingness_to_pay: "3 - saves an analytics sprint; nearest spend anchor is UXCam median about $21k/yr for replay (market.md §2)"

- id: f2p-5
  title: "Quit-type classifier on the last 10 s before app background: rage quit on fail screen vs mid-action interruption vs idle, so D1 churn per step splits into product-caused and not"
  level: L3
  cell: {buyer-role: product-retention, signal-extracted: device-context-interruptions-and-app-switch, analysis-type: churn-prediction-features, lifecycle-moment: d1-to-d7, companion-data: telemetry-events, delivery-form: warehouse-table-export, constraint-to-overcome: privacy-and-consent}
  object: "'the exact screen state at the moment of app kill (rage quit vs. interruption)' (methods-churn-funnel.md §2 INFERRED)"
  situation: "Step 5 shows 15% churn; some of those players were interrupted mid-level by a call and never came back, others quit on the third fail screen"
  consequence: "Both groups count as step-5 churn, so the team cannot size the fixable share and over-invests in the level"
  p_typical: 0.04
  grounded: quote
  evidence: "Sony patents define rage quitting ... disconnects scored 2 points vs menu exits 1 point (methods-churn-funnel.md §2)"
  proposed: "Column quit_type in the clip table, with three values and a confidence score"
  shallow: false
  mechanism: "Classifier over last frame state (fail screen, active play, menu, idle), seconds since last touch, touch burst pattern and the OS lifecycle reason the game receives; in-app capture never records other apps, so notification content is never stored"
  example: "Runner game: 38% of step-5 quits happen mid-run with a touch 0.3 s earlier and an OS pause (interruption); 47% follow the third fail screen; team adds a resume-run on return and fixes difficulty for the 47%"
  cost: S
  depends_on: "f2p-2 clips; OS lifecycle events in telemetry"
  buyer: "Product lead and data scientist at a mobile F2P studio"
  input: "Final 10 s of triggered clips + touch events + app lifecycle events"
  why_existing_tools_cannot: "Telemetry logs a session end, not what was on screen or whether play was mid-action; only patents and research describe rage-quit typing (methods-churn-funnel.md §2)"
  willingness_to_pay: "3 - no direct price; it sharpens the f2p-1 report rather than standing alone"

- id: f2p-6
  title: "First-launch wait audit: seconds on splash, asset-download and loading screens per device model from footage, plus the share of first sessions that end on a wait screen, by Android GPU tier"
  level: L4
  cell: {buyer-role: product-retention, signal-extracted: load-and-wait-screens, companion-data: device-perf-counters, game-platform-and-genre: mobile-midcore-f2p, lifecycle-moment: ftue-first-session, analysis-type: cohort-comparison, delivery-form: dashboard}
  object: "'same build can run 60 fps on a flagship and 24 fps on a mid-tier phone' (adjacent-usecases.md §6)"
  situation: "Low-tier Android installs show D1 8 pp below flagships; the funnel has a 'loading_complete' event but nothing about the 40 s spent on the download bar before it"
  consequence: "Product lead treats the gap as audience quality and buys fewer low-tier users instead of shrinking the first download"
  p_typical: 0.07
  grounded: quote
  evidence: "HeadSpin CEO quote: 'over 30 per cent of people left their game due to a bad experience' (market.md §3)"
  proposed: "Dashboard row per GPU tier: median wait seconds per wait screen, % of first sessions ending on a wait screen, D1"
  shallow: false
  mechanism: "Wait-screen detector (progress bar, spinner, splash) timestamps entry and exit on each clip and joins device model and perf counters from the session"
  example: "Mali-G52 phones spend median 47 s on asset download vs 9 s on flagships; 11% of their first sessions end there; team moves 60 MB of assets to after tutorial step 4"
  cost: S
  depends_on: "f2p-2 clips; device model in session metadata"
  buyer: "Product lead at a mobile midcore F2P studio with a large Android share"
  input: "First-session clips + device model + device perf counters"
  why_existing_tools_cannot: "GameBench and HeadSpin measure lab devices, not real first sessions, and fps/load counters need in-game profiling (adjacent-usecases.md §6, market.md §3)"
  willingness_to_pay: "3 - studios and OEMs pay GameBench enterprise pricing; outsourced QA $15-50/tester hour (adjacent-usecases.md 'Signals of willingness to pay')"

- id: f2p-7
  title: "Warehouse feature table: 14 per-user first-session video features (card dwell ms, CTA hesitation ms, mis-tap count, fail-screen dwell, quit type) keyed by user_id and session_id"
  level: L3
  cell: {buyer-role: product-retention, analysis-type: churn-prediction-features, delivery-form: warehouse-table-export, constraint-to-overcome: joining-video-to-events, value-lever-b2b: create-data-that-did-not-exist, companion-data: telemetry-events, processing-location: customer-cloud-byoc}
  object: "'No paper was found that predicts churn or engagement directly from human gameplay video frames' (methods-churn-funnel.md §3)"
  situation: "The studio's XGBoost D7 churn model plateaus; deep models on the same logs add nothing"
  consequence: "Without new feature content the model cannot get better, and the product lead cannot target interventions"
  p_typical: 0.06
  grounded: quote
  evidence: "'the predictive ceiling is set by feature content, not model class. Video is an untested source of new features, which is a research gap rather than a proven lift' (methods-churn-funnel.md §3 INFERRED)"
  proposed: "Daily partitioned table in Snowflake or BigQuery written inside the customer's cloud; schema published before any model is promised"
  shallow: false
  mechanism: "Per-clip extractors emit numeric features; a join key maps clip frame timestamps to event IDs; table written to the customer's warehouse with no footage leaving their bucket"
  example: "Data scientist adds 'median tutorial-card dwell' and 'mis-taps in first 3 min' to the D7 model; the product lead reads feature importance to pick the next FTUE fix"
  cost: M
  depends_on: "f2p-2 clips; event-ID join; sampled users only (1-5%) so the model trains on the sampled cohort"
  buyer: "Product lead sponsoring, studio data scientist consuming, at a mid-size F2P studio"
  input: "Triggered and random-sample clips + telemetry events + D1/D7 labels"
  why_existing_tools_cannot: "Churn literature and tools are log-only; Firebase predictions use events only (methods-churn-funnel.md §1, §3)"
  willingness_to_pay: "3 - lift is unproven (research gap, methods-churn-funnel.md §3); paid as a pilot, not a contract"

- id: f2p-8
  title: "A/B 'why B won' pack: for an FTUE test (short vs long tutorial), compare clip-derived step durations and reason codes between arms and attach 5 contrasting clip pairs to the experiment page"
  level: L3
  cell: {buyer-role: product-retention, analysis-type: ab-test-variant-explanation, lifecycle-moment: ab-test-running, companion-data: build-and-config-metadata, delivery-form: in-tool-annotation, capture-trigger-and-sampling: targeted-cohort, signal-extracted: input-timing-and-hesitation}
  object: "Deconstructor of Fun 2025 FTUE case: 'ask if the player knows the game, then branch to a detailed tutorial' (competitor-and-ua.md §1)"
  situation: "Variant B (skippable tutorial) wins D1 by 1.5 pp but loses D7 by 0.4 pp; nobody knows which behaviour drives each"
  consequence: "The team ships B on D1 alone, or argues for two weeks; the next test repeats the same blind spot"
  p_typical: 0.07
  grounded: quote
  evidence: "FunCraft: 'funnel analysis showed new players wanted easier puzzles rather than tutorials; FTUE rebuilt; D1 retention +40%' (methods-churn-funnel.md §1)"
  proposed: "Annotation block on the experiment in the A/B tool: per-arm reason-code shares plus clip pairs"
  shallow: false
  mechanism: "Capture sample split by Remote Config variant; same extractors as f2p-1; differences above 20% per screen surfaced with paired clips nearest each arm's median"
  example: "Arm B players who skip reach the first boss without having used the dodge; 62% of B's level-6 fails show no dodge input; team keeps the skip but adds a dodge prompt at level 5"
  cost: S
  depends_on: "f2p-1; variant ID in clip metadata"
  buyer: "Product lead running FTUE experiments at a mobile F2P studio"
  input: "Clips from both arms + variant assignment + D1/D7 per arm"
  why_existing_tools_cannot: "A/B tools report metric deltas per arm, and the only replay-plus-funnel case found (EA, Amplitude) was a manual review (methods-churn-funnel.md §1)"
  willingness_to_pay: "3 - bundled with f2p-1; no separate price anchor in the notes"

- id: f2p-9
  title: "Soft-launch comprehension read by market: compare FTUE reason-code mix for 300 consented first sessions each in Philippines, Canada and Brazil to tell 'FTUE problem' from 'wrong market' before go/kill"
  level: L3
  cell: {buyer-role: product-retention, lifecycle-moment: soft-launch, value-lever-b2b: de-risk-a-go-kill-decision, analysis-type: cohort-comparison, delivery-form: per-cohort-report, pricing-model: per-game, capture-trigger-and-sampling: targeted-cohort}
  object: "GameAnalytics 2026 benchmarks: median D1 about 22%, P75 just above 30% (methods-churn-funnel.md §1)"
  situation: "Soft-launch D1 is 24% in the Philippines and 31% in Canada; the go/kill meeting is in 3 weeks"
  consequence: "Without a read on why, the team either kills a game whose FTUE fails in one language or scales one that only works for genre veterans"
  p_typical: 0.06
  grounded: quote
  evidence: "'many top-performing studios store data in-house and never appear in public benchmarks' (methods-churn-funnel.md §1)"
  proposed: "One report per market with reason-code shares, step timings and 10 clips, delivered within 10 days of soft launch"
  shallow: false
  mechanism: "Targeted capture of the first 300 consented installs per market; f2p-1 classifier; market differences reported per step with confidence intervals"
  example: "Philippines players fail the level-2 timing mechanic 2.3x as often as Canada; same comprehension, different device latency; team ships a timing-window change, not a kill"
  cost: S
  depends_on: "f2p-1; f2p-20 consent-bias calibration"
  buyer: "Product lead and studio head at a mobile F2P studio in soft launch"
  input: "Consented first-session clips per market + D1 per market + device model"
  why_existing_tools_cannot: "Playtest panels recruit testers rather than the soft-launch audience, and funnels give per-market drop counts only (market.md §1, methods-churn-funnel.md §1)"
  willingness_to_pay: "4 - a go/kill decision; studios pay €113-141 per analysed playtest session (market.md §1) and $45-51k/yr for competitor intelligence (competitor-and-ua.md §1 prices)"

- id: f2p-10
  title: "Competitor FTUE teardown from public 'first 30 minutes' videos: step count, seconds to first reward, first forced-tutorial exit and first IAP offer timestamp for 20 rival titles, refreshed per major update"
  level: L3
  cell: {buyer-role: product-retention, video-source: public-streams-and-ugc, signal-extracted: on-screen-text-ocr, analysis-type: benchmark-vs-competitor, lifecycle-moment: ftue-first-session, delivery-form: dashboard, constraint-to-overcome: commoditisation-by-general-video-llms}
  object: "GameRefinery 'about 260 features are tracked manually' and Gamedexy '186 chronological flows, 1,887 screens, 25 mobile games' (competitor-and-ua.md §1)"
  situation: "Product lead plans an FTUE rework and wants to know how long rivals' tutorials run and when they show the first offer"
  consequence: "Today a designer plays 5 rivals by hand or buys a human-built flow library covering 25 games"
  p_typical: 0.09
  grounded: quote
  evidence: "'No source shows a vendor extracting FTUE steps, shop layouts or event cadence from gameplay video automatically' (competitor-and-ua.md §1 INFERRED)"
  proposed: "Table per rival with timestamps and keyframes, linked to the source video at each step"
  shallow: false
  mechanism: "VLM segments a long-play video into FTUE steps, OCRs reward and price text, and timestamps first-offer popups; human spot-check per title"
  example: "Rival A shows its starter pack at 4:10 after the first win; rival B at 11:30 after the first loss; product lead moves the team's own pack test to post-first-win"
  cost: S
  depends_on: "nothing (public video); legal review of video-platform terms"
  buyer: "Product lead or designer at a mobile F2P studio planning an FTUE rework"
  input: "Public YouTube/TikTok first-play videos of rival games"
  why_existing_tools_cannot: "Teardowns are human-played (GameRefinery, Playliner) and flow libraries are human-captured; Gemini can watch 6 h of video but nobody packages FTUE extraction (competitor-and-ua.md §1)"
  willingness_to_pay: "3 - Gamedexy Pro is $99/yr, GameRefinery about $45-51k/yr (competitor-and-ua.md §1); a team could also point Gemini at the videos itself"

- id: f2p-11
  title: "On-device stuck detector: when one tutorial screen persists >20 s with 3+ taps outside the highlighted CTA, fire a pulsing-arrow hint and log it for holdout comparison"
  level: L4
  cell: {buyer-role: product-retention, analysis-type: real-time-in-session-intervention, processing-location: on-device, automation-level: closed-loop-in-game-action, constraint-to-overcome: device-performance, signal-extracted: input-timing-and-hesitation, lifecycle-moment: ftue-first-session}
  object: "ICCS 2020 HUD detection 'fast enough for real-time use during play' (methods-churn-funnel.md §4) and Affectiva's Unity plug-in used for runtime adaptation in Nevermind (market.md §7)"
  situation: "A player sits on the 'equip item' card for 25 s tapping the character art"
  consequence: "The game knows its own screen state, so the engine team can build this with touch events alone; video inference adds 1-2 ms per frame and battery drain for no extra signal. Product lead would buy the logic, not the vision model"
  p_typical: 0.04
  grounded: quote
  evidence: "Commercial idle/hesitation detector for Unreal ('Universal Boredom Detector') tracks idle time (methods-churn-funnel.md §2)"
  proposed: "Offer as a rule pack learned from f2p-1 reason codes, executed on engine events, no on-device video"
  shallow: false
  mechanism: "Thresholds learned offline from clips (dwell and off-target taps that preceded abandonment) shipped as Remote Config rules evaluated on touch events and screen IDs"
  example: "Rule 'equip card >20 s and 3 off-target taps' triggers the arrow; holdout shows step completion 81% vs 74%"
  cost: M
  depends_on: "f2p-1 reason codes; Remote Config; holdout framework"
  buyer: "Product lead at a mobile F2P studio"
  input: "Offline: clips + touches; online: touch events + screen IDs only"
  why_existing_tools_cannot: "Existing detectors use idle time only with no learned thresholds per screen (methods-churn-funnel.md §2)"
  willingness_to_pay: "2 - as on-device video inference it is refused (frame budget); the learned rule pack alone is a feature of f2p-1"

- id: f2p-12
  title: "Ask-the-footage chat scoped to one funnel step: 'show players who skipped the shop tutorial and still bought in D1' returns a clip list filtered by joined purchase events"
  level: L3
  cell: {buyer-role: product-retention, analysis-type: ask-a-question-over-footage, delivery-form: ask-question-agent-chat, effort: XS-repackage-existing-user-test-product, companion-data: purchase-and-ad-revenue-events, video-source: own-players-consented-sdk, lifecycle-moment: d1-to-d7}
  object: "PlaytestCloud 'First Findings ... links each friction point to its clip' (market.md §1)"
  situation: "Product lead has a hypothesis the night before a roadmap review and no analyst free"
