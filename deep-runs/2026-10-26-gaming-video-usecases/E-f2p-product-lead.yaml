  mechanism: "Agent translates the question into a filter over clip labels (screens, reason codes) and joined events (purchase within 24 h), then summarises the returned clips"
  example: "Query returns 37 clips; 29 show players closing the shop tutorial and later opening the shop from the lobby; product lead cuts the forced shop step"
  cost: S
  depends_on: "existing User Test agent; f2p-1 labels; purchase events join"
  buyer: "Product lead at a mobile F2P studio"
  input: "Labelled clips + purchase and progression events"
  why_existing_tools_cannot: "Playtest AI searches transcripts of recruited testers; live players do not think aloud, so search must run on visual labels plus events (market.md §1, methods-churn-funnel.md §2 INFERRED)"
  willingness_to_pay: "3 - buyers value less manual video watching ('The AI analysis has been a real time-saver', market.md §1); expected as part of the platform"

- id: f2p-13
  title: "Monday FTUE digest email: top 3 new friction moments from last week's installs with D1 delta per step, one 15 s clip each, and week-over-week reason-code shift"
  level: L4
  cell: {buyer-role: product-retention, delivery-form: weekly-digest-email, lifecycle-moment: d1-to-d7, analysis-type: root-cause-of-a-metric-change, pricing-model: per-month-seat, value-lever-b2b: cut-time-to-insight}
  object: "Playio: 'per-step drop-off beats overall completion ... 12% leave at step three' (methods-churn-funnel.md §1)"
  situation: "Product lead reviews retention every Monday; the dashboard is opened twice a month"
  consequence: "Insight dies in an unopened dashboard; the digest is the delivery the lead actually reads"
  p_typical: 0.12
  grounded: inferred
