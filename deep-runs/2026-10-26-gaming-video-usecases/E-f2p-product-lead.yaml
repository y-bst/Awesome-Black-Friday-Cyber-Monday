  p_typical: 0.15
  grounded: quote
  evidence: "PlaytestCloud's AI 'uses the OpenAI API on video transcripts and survey responses' (market.md §1)"
  proposed: "Reuse the User Test ask-a-question agent, add a filter layer over joined events"
