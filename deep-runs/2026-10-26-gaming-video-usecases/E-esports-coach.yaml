    buyer-role: esports-team-or-league
    video-source: public-streams-and-ugc
    signal-extracted: structured-game-state-reconstruction
    analysis-type: benchmark-vs-competitor
    lifecycle-moment: live-event-or-update
    delivery-form: per-cohort-report
    game-platform-and-genre: competitive-multiplayer
    effort: M-one-quarter
    pricing-model: managed-project
    constraint-to-overcome: sampling-bias
  object: market.md section 5 Hatchet pricing (Essentials USD 249/month, Pro from USD 1,249/month) measures viewership, not pixels
  situation: Quarter-final in 36 hours; opponent has 14 public VODs on Twitch and YouTube across 3 patches
  consequence: Analyst watches 4 of 14 VODs; defaults (eco-round buy pattern, rotation delay of 9 s) are missed
  p_typical: 0.12
  grounded: quote
  evidence: 'market.md section 5: "No evidence it analyses the gameplay pixels inside streams"'
