- id: esports-1
  title: Scrim VOD to round-by-round mistake table for a PC tactical shooter, no data feed
  level: L3
  cell:
    buyer-role: esports-team-or-league
    video-source: esports-vod
    signal-extracted: structured-game-state-reconstruction
    analysis-type: coaching-feedback
    lifecycle-moment: season-or-battle-pass-start
    delivery-form: in-tool-annotation
    game-platform-and-genre: competitive-multiplayer
    effort: S-weeks
    pricing-model: per-month-seat
  object: 'adjacent-usecases.md section 8 row: ClutchLabs (AI video analyst for Valorant scrims, VOD-derived metrics without data feeds)'
  situation: Coach uploads 6 scrim maps of 13+ rounds each after a Saturday block and has 90 minutes before the Sunday review
  consequence: Coach scrubs about 80 rounds by hand and reviews the loud ones; quiet repeat mistakes (2 teammates dying 3 s apart with no trade) stay unseen
  p_typical: 0.25
  grounded: quote
  evidence: 'adjacent-usecases.md section 8: "coaches/analysts scrub VODs and comment by hand"'
  proposed: Round table (round, first death time, trade within 5 s yes/no, ult unused at death) with 3 auto-picked clips per map
  shallow: false
  mechanism: HUD OCR and minimap detection rebuild each round as a row; rule flags 'dead with ultimate charged' and 'untraded death within 5 s'
  example: '13-round Ascent scrim: rounds 4, 7 and 9 flagged for untraded double deaths, coach reviews 3 clips instead of 45 minutes'
  cost: S
  depends_on: existing video ingestion and ask-question agent; one per-title HUD template (about 300 labelled frames per game)
  buyer: Head coach or analyst at a pro or semi-pro esports org
  input: Per-player 1080p60 scrim recordings (OBS), team roster file
  why_existing_tools_cannot: ClutchLabs and Omnic already sell this for Valorant (adjacent-usecases.md section 8); the leaf is the low-end, so it only wins on titles they skip and on price
  willingness_to_pay: 3 - StatStack USD 49 to 149/month and DataCoach USD 0 to 18/month are the anchors (adjacent-usecases.md section 8); buyer is a team, not a studio
- id: esports-2
  title: Phone-screen VOD parser for a mobile MOBA (Mobile Legends, Wild Rift, Honor of Kings)
  level: L3
  cell:
    buyer-role: esports-team-or-league
    video-source: esports-vod
    signal-extracted: ui-state-and-screen-flow
    analysis-type: coaching-feedback
    delivery-form: per-cohort-report
    game-platform-and-genre: mobile-midcore-f2p
    effort: M-one-quarter
    capture-trigger-and-sampling: opt-in-panel
    go-to-market-channel: direct-sales
  object: 'market.md section 4 Omnic.AI: titles listed are VALORANT, Fortnite, Rocket League, OW2, Madden NFL 25, Marvel Rivals, Apex (no mobile title)'
  situation: Mobile esports squad records ranked games with the phone's built-in screen recorder; no API exposes kill feed, gold or lane positions
  consequence: 'Coach of a Mobile Legends team has no tool: PC-only parsers skip the title, so reviews stay a phone watched on a sofa'
  p_typical: 0.08
  grounded: quote
  evidence: 'competitor-and-ua.md section 4 (INFERRED): "none is shown handling mobile gameplay recorded on-device."'
  proposed: 'Per-match sheet: gold lead timeline, objective timers (Lord, Turtle), death list with map position, 5 auto-clips'
  shallow: false
  mechanism: Per-title detector for kill feed, gold counter and minimap icons on a landscape 1080x2400 frame, run on uploaded recordings
  example: Squad plays 5 scrim games, report shows team lost 3 Lord fights after losing 2 lane towers within 90 s; coach drills lane-rotation timing
  cost: M
  depends_on: one per-title mobile HUD template; screen recordings uploaded by players
  buyer: Coach or analyst of a mobile esports team (SEA, LATAM, MENA scenes)
  input: Phone screen recordings 1080p30 with game audio; roster and hero picks typed by coach
  why_existing_tools_cannot: Highlight and VOD tools target PC and console titles (competitor-and-ua.md section 4); Omnic's title list has no mobile game (market.md section 4)
  willingness_to_pay: 2 - same USD 3 to 149/month band (adjacent-usecases.md section 8); mobile esports budgets are not in the notes
- id: esports-3
  title: Finger-touch overlay analysis of skill-shot accuracy and ability cancels on mobile
  level: L3
  cell:
    buyer-role: esports-team-or-league
    video-source: recruited-playtesters
    signal-extracted: input-timing-and-hesitation
    analysis-type: coaching-feedback
    companion-data: touch-and-controller-input
    game-platform-and-genre: mobile-midcore-f2p
    effort: M-one-quarter
    pricing-model: freemium-self-serve
  object: 'methods-churn-funnel.md section 6 and IV Metrics (market.md section 2): Unity SDK records rendered gameplay with touch overlays'
  situation: Player aims a skill shot, joystick finger drifts 40 px and the cast cancels; this is invisible in the match log
  consequence: Coach tells the player to 'aim better'; the cause (thumb crossing the joystick dead zone) is never measured
  p_typical: 0.05
  grounded: inferred
  evidence: 'methods-churn-funnel.md section 7: "Medal shows synchronised input + video is worth more than video alone"'
  proposed: 'Per-ability table: cast attempts, cancels, aim error in degrees against the nearest target, thumb path'
  shallow: false
  mechanism: Overlay touch dots on screen video, detect joystick centre drift and cast-button taps, compare aim vector with target position at cast frame
  example: 'Brawl Stars player: 31% of Super casts cancelled in the first 0.2 s by thumb slip; fix is a joystick sensitivity change'
  cost: M
  depends_on: touch overlay capture on the player's phone or a capture app; per-title ability icon detector
  buyer: Coach or serious ranked player (self-serve)
  input: Screen video with touch overlay (IV Metrics-style) and ability cooldown HUD
  why_existing_tools_cannot: Mobalytics-class tools read API data, not finger position (adjacent-usecases.md section 8); Medal pairs input with video only for AI training (market.md section 4)
  willingness_to_pay: 2 - USD 9.99/month Mobalytics Plus and USD 0 to 18/month DataCoach are the ceiling (adjacent-usecases.md section 8)
- id: esports-4
  title: 'Reaction-latency histogram: first sight of enemy to first aim correction'
  level: L3
  cell:
    buyer-role: esports-team-or-league
    video-source: esports-vod
    signal-extracted: player-skill-and-mechanics
    analysis-type: coaching-feedback
    companion-data: none-video-only
    game-platform-and-genre: pc
    effort: M-one-quarter
    delivery-form: dashboard
    constraint-to-overcome: per-game-ui-generalisation
  object: 'methods-churn-funnel.md section 4: NiceShot AI (open source) YOLOv8n + OpenCV + FFmpeg detects kill, death and medal pop-ups'
  situation: Entry fragger loses 11 of 20 opening duels in a week; coach cannot tell slow reaction from bad crosshair placement
  consequence: Coach drills aim trainers when the real fault is late reaction to peeks, so the week is spent on the wrong skill
  p_typical: 0.06
  grounded: inferred
  evidence: 'methods-churn-funnel.md section 4: "Mature, cheap pieces: menu/screen classification, button/popup detection (mAP ~90% on mobile games), death/kill pop-up detection"'
  proposed: 'Per-player histogram: median ms from enemy model first visible to crosshair velocity change, split by map site'
  shallow: false
  mechanism: Enemy detector gives first-visible frame; crosshair motion from optical flow at screen centre gives onset; difference in frames at 60 fps = 16.7 ms steps
  example: Player A median 247 ms vs team 198 ms on A-site peeks; coach adds peek-timing drills, not aim trainers
  cost: M
  depends_on: enemy detector per title; 60 fps source (at 30 fps resolution is 33 ms)
  buyer: Performance coach at a pro esports org
  input: 1080p60 first-person VOD, no other data
  why_existing_tools_cannot: Event-based clippers detect kills, not the frames before the kill (methods-churn-funnel.md section 4); Mobalytics GPI uses match data (market.md section 8)
  willingness_to_pay: 2 - Hudl from USD 1,500 per program per year is the traditional-sports benchmark (adjacent-usecases.md section 8)
- id: esports-5
  title: Scrim-block fatigue curve from mechanical metrics, not faces
  level: L3
  cell:
    buyer-role: esports-team-or-league
    video-source: esports-vod
    signal-extracted: player-skill-and-mechanics
    analysis-type: anomaly-alert
    delivery-form: weekly-digest-email
    companion-data: none-video-only
    game-platform-and-genre: competitive-multiplayer
    effort: S-weeks
    constraint-to-overcome: accuracy-and-trust
  object: methods-churn-funnel.md section 5 INFERRED line and market.md section 7 (biometrics 'often oversold' per Player Research)
  situation: Team plays 8 maps in a 6-hour scrim block; by map 6 first-bullet accuracy and callout rate drop but nobody measures it
  consequence: Coach keeps the block at 6 hours when the data shows output falls after hour 4; wasted scrim time and tilted players
  p_typical: 0.04
  grounded: speculative
  evidence: 'market.md section 7: "Biometrics are "often oversold""'
  proposed: Per-player line chart of opening-duel win rate and reaction latency by map number, break recommendation after the knee
  shallow: false
  mechanism: Compute the same 3 mechanical metrics per map from VOD and fit a drop per hour; no face or voice involved
  example: 'Squad''s opening-duel win rate: 54% maps 1-3, 41% maps 6-8; coach cuts the block to 4 maps with a 30-minute break'
  cost: S
  depends_on: metrics from leaves 1 and 4; 8+ scrim maps of history per player
  buyer: Head coach or performance lead at an esports org
  input: Scrim VOD with timestamps of map start
  why_existing_tools_cannot: Facecam emotion tools (Affectiva, iMotions) are oversold and legally risky (market.md section 7; methods-churn-funnel.md section 7); mechanical decay needs no face
  willingness_to_pay: 2 - no price in the notes for fatigue tools; Hudl USD 1,500 per program per year is the nearest sports benchmark (adjacent-usecases.md section 8)
- id: esports-6
  title: Opponent tendency report from public streams and VOD before a bracket match
  level: L3
