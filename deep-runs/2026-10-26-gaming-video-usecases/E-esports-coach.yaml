- id: esports-8
  title: Online-qualifier cheat evidence pack from player-submitted POV video
  level: L3
  cell:
    buyer-role: trust-safety
    video-source: esports-vod
    signal-extracted: bot-or-fraud-behaviour
    analysis-type: evidence-pack-for-enforcement
    delivery-form: enforcement-or-cert-evidence-pack
    constraint-to-overcome: accuracy-and-trust
    game-platform-and-genre: competitive-multiplayer
    pricing-model: outcome-based-per-bug-or-uplift
    effort: L-multi-quarter
  object: 'adjacent-usecases.md section 2: FACEIT Human Input Detection; AI-based and DMA cheats were 40% of cheating bans in May 2026'
  situation: Open qualifier with 128 teams; a team of 5 posts a protest with a 3-minute clip; admins have 2 hours before the bracket advances
  consequence: Admin judges by eye; a wrong ban removes a team, a missed cheat voids the bracket
  p_typical: 0.05
  grounded: quote
  evidence: 'adjacent-usecases.md section 2: "NOT FOUND: no source confirms Riot, Activision or any vendor running computer vision on recorded footage as a production anti-cheat."'
