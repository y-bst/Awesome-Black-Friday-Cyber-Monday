  shallow: false
  mechanism: Detect screen-reading pixel bots by snap-to-target latency below 80 ms across 30+ duels and inhuman path linearity
  example: Qualifier admin sees 'snap latency 62 ms median, 24 duels, player's earlier median 190 ms' and requests a LAN re-test
  cost: L
