  example: Opponent takes B-site on Haven 68% of attack rounds and rotates 9 s late after a plant; coach prepares a stack
  cost: M
  depends_on: leaf 1 parser; patch calendar; VOD download rights
  buyer: Analyst at an esports org or tournament organiser
  input: Public stream VODs (Twitch, YouTube) of named players, match schedule
  why_existing_tools_cannot: Stream analytics sell audience metadata only (market.md section 5); Cloud9 builds VOD agendas from game data, not from public pixels (adjacent-usecases.md section 8)
  willingness_to_pay: 3 - Hatchet USD 249 to 1,249/month and GameRefinery about USD 45-51k per year show intel buyers pay (market.md sections 5-6, competitor-and-ua.md section 8)
