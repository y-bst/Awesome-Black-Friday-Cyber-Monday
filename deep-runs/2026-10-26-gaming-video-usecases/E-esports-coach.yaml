  input: Player POV recordings submitted for the protest, match logs where available
  why_existing_tools_cannot: Anybrain and FACEIT detect via input and client signals (adjacent-usecases.md section 2); the vision-based work found is academic only (VADNet, arXiv 2103.10031)
  willingness_to_pay: 3 - FACEIT is both vendor and operator; operator budgets exist but no price is published (adjacent-usecases.md section 2)
