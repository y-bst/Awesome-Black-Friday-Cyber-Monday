  p_typical: 0.05
  grounded: quote
  evidence: "adjacent-usecases.md section 5: 'clients take screenshots of every screen in the localised build and translators judge from them'; Nimdzi wished-for 'language-aware visual anomaly detection (truncation, RTL rendering)'; no vendor found"
  proposed: "OCR event hub frames per language, compare rendered text box width against button bounds and flag ellipsis, clipped glyphs or untranslated English; weekly table: language x screen size x overflow share"
  shallow: false
  mechanism: "Frame-level OCR plus bounding-box check on event hub screens from live players, by language and screen size, replacing manual LQA playthroughs of server-pushed text"
  example: "Thai event title wraps to 3 lines and covers the timer on 6.1-inch devices for 22% of Thai players; fix by shortening the string, same day"
  cost: M
  depends_on: "SDK capture across languages, per-language OCR, UI element bounds from a one-time per-game calibration"
  buyer: "Live-ops manager with the localisation lead at a mid-size mobile studio"
  input: "event hub screen frames from live players, language code, screen size, string table version"
  why_existing_tools_cannot: "Gridly, Alconost and MarsTranslation do LQA from screenshots by human reviewers per build (adjacent-usecases.md section 5); 'a recording-based check that flags overflow/untranslated strings per language fits an evident gap; no vendor found'"
  willingness_to_pay: "2: no price found for localisation QA (adjacent-usecases.md section 5 price signals: none); Keywords Studios revenue EUR 780M shows the services market is large but labour-priced"

- id: liveops-9
  title: "Popup-chain counter: number of modals (daily reward, offer, event splash, rating prompt) a player must dismiss before reaching gameplay in the first 10 s of each session, per day"
  level: L4
  cell: {buyer-role: live-ops, video-source: own-players-consented-sdk, signal-extracted: ui-state-and-screen-flow, analysis-type: cohort-comparison, lifecycle-moment: d1-to-d7, delivery-form: dashboard, companion-data: telemetry-events, pricing-model: per-game}
  object: "session-start modal queue: daily reward, event splash, offer popup, rating prompt, push-permission prompt"
  situation: "Day 5 of an event week the same player sees 4 modals in a row at app open; modal telemetry exists per modal but not as an ordered chain with real on-screen time"
  consequence: "Dismiss fatigue: players tap close on the 4th modal without reading, so the offer in position 4 shows a 71% sub-second close; live-ops cannot see queue order effects"
  p_typical: 0.06
  grounded: inferred
  evidence: "methods-churn-funnel.md section 2 INFERRED: signals 'that exist in screen video (plus touch overlay) but not in standard event streams'; competitor-and-ua.md section 7 none; persona premise 'offer screens dismissed in under a second'"
  proposed: "Per session, count modal frames between app-open and first gameplay frame, record dwell per modal; dashboard of median chain length per day and per cohort; alert when median goes above 3"
  shallow: false
  mechanism: "Screen-state sequence per session start from video gives chain length and per-modal dwell, which individual modal events cannot order or time"
  example: "Event week: median chain 2.1 on Monday, 4.0 on Friday after the offer team added a flash sale; Friday offer conversion halves"
  cost: S
  depends_on: "screen-state classifier for modal types, SDK capture on session start, 10 s clip at app open"
  buyer: "Live-ops manager at a mobile F2P studio"
  input: "first 10 s of screen video at each session start on 3% of sessions, modal event logs"
  why_existing_tools_cannot: "GameAnalytics funnels take Design, Resource and Progression events; a step never instrumented 'does not exist in the data' (methods-churn-funnel.md section 1); mainstream replay tools do not read game scenes (market.md section 2)"
  willingness_to_pay: "3: cheap to run since only 10 s per session; anchor IV Metrics Pro $99/month and Segwise $499-1,699/month for a narrow single-purpose tool"

