- id: liveops-1
  title: "Event-banner noticed-rate: per event, share of players who had the event entry tile on screen for at least 1 s and never tapped it, posted to Slack on event day 1"
  level: L4
  cell: {buyer-role: live-ops, video-source: own-players-consented-sdk, signal-extracted: ui-state-and-screen-flow, analysis-type: root-cause-of-a-metric-change, lifecycle-moment: live-event-or-update, delivery-form: alert-or-slack, capture-trigger-and-sampling: random-sample, game-platform-and-genre: mobile-midcore-f2p}
  object: "main-menu event entry tile / banner on the home screen during the first 3 sessions after an event goes live"
  situation: "Event launched Tuesday 10:00 UTC; by 16:00 telemetry shows 31% event entry vs a 45% target, and nobody knows whether players did not see the tile or saw it and declined"
  consequence: "The live-ops manager reruns the event or buys a push campaign blind; with the noticed-rate split, a tile placed below the fold on 18:9 phones is fixed the same day instead of at the next weekly review"
  p_typical: 0.22
  grounded: quote
  evidence: "methods-churn-funnel.md section 2 INFERRED: 'a visible CTA never tapped (UI not noticed)'; section 1 INFERRED: 'every tool above leaves why to a hypothesis step'"
  proposed: "Sample 2% of players for the first 3 sessions of an event; classify each home-screen frame for tile visible yes/no and tapped yes/no; Slack message 'noticed 52%, tapped-after-notice 61%' with 5 clips of not-noticed sessions"
  shallow: false
  mechanism: "A per-title screen classifier on 1-2 fps frames marks event-tile visible/tapped per session and splits the entry-rate gap into not-seen vs seen-and-declined, per device screen ratio"
  example: "Match-3 game, 'Pirate Cove' event: tile hidden behind the new daily-reward carousel on 20:9 phones; 41% of those players never had it visible"
  cost: M
  depends_on: "consented capture SDK with sampling trigger, per-game tile detector (a few hundred labelled frames), the existing User Test video ingestion"
  buyer: "Live-ops manager at a mobile midcore F2P studio"
  input: "1-2 fps screen video of first 3 sessions after event launch, plus event_view and event_enter telemetry, plus device model and screen ratio"
  why_existing_tools_cannot: "Funnels show where not why (methods-churn-funnel.md section 1: Unity docs only say 'investigate'); UXCam-class replay shows a black box for game canvases (market.md section 2); PlaytestCloud AI keys on think-aloud speech from recruited testers, not production players (market.md section 1)"
  willingness_to_pay: "3: product teams already pay PlaytestCloud EUR 113-141 per recorded session (market.md) and UXCam median about $21k/year; live-ops is the weekly repeat buyer"

- id: liveops-2
  title: "Offer-dismiss latency: for each IAP offer popup, time from popup render to close-tap, flagging popups closed in under 1 s and the player reading dwell on the price line"
  level: L4
  cell: {buyer-role: live-ops, video-source: own-players-consented-sdk, signal-extracted: input-timing-and-hesitation, analysis-type: funnel-drop-off-why, lifecycle-moment: live-event-or-update, delivery-form: per-cohort-report, companion-data: touch-and-controller-input, capture-trigger-and-sampling: event-triggered-clip}
  object: "limited-time offer popup (e.g. 'Starter Pack $4.99' modal) shown after level-complete"
  situation: "Offer shown 40,000 times a day; telemetry records offer_shown and offer_closed but the close timestamp is logged on the server with up to 2 s of drift, so sub-second dismissals are invisible"
  consequence: "Live-ops keeps rotating offer art and price points when the real problem is that 63% of closes happen before the price is legible; fix is trigger timing, not price"
  p_typical: 0.12
  grounded: quote
  evidence: "adjacent persona note: 'offer screens dismissed in under a second'; methods-churn-funnel.md section 2 INFERRED: 'dwell/reading time on a tutorial card before dismiss'"
  proposed: "Clip-triggered capture 3 s before to 3 s after each offer popup on 1% of impressions; frame-level popup appear and tap timestamps; report share closed under 1 s per offer id and per trigger point"
  shallow: false
  mechanism: "Frame-accurate popup-appearance and touch-overlay timestamps from video replace server-logged times; groups dismissals into reflex (<1 s), read (1-5 s) and deliberate (>5 s) per offer and per trigger"
  example: "Puzzle game: the post-level 'Starter Pack' modal gets 63% reflex closes when it appears on the level-complete confetti frame, 22% when shown 1.5 s later"
  cost: M
  depends_on: "capture SDK with touch overlay, popup detector per title, join to offer_id event"
  buyer: "Live-ops manager (with monetisation lead as consumer) at a mobile F2P studio"
  input: "6-second screen clips with touch overlay around offer popups, offer_id and trigger_id events, purchase events"
  why_existing_tools_cannot: "Event analytics logs offer_shown and offer_closed with server-side clocks; 'a step that was never instrumented... does not exist in the data' (methods-churn-funnel.md section 1 INFERRED); IV Metrics records video but caps at 50-100 human-reviewed videos a month (market.md section 2)"
  willingness_to_pay: "3: IV Metrics Pro $99/month shows indie willingness; a studio spending on offers pays more; Halfbrick +5 pp D7 from one targeted action shows value of a precise trigger (methods-churn-funnel.md section 3)"

- id: liveops-3
  title: "Overnight bot sweep of 40 competitor games that logs every live event, shop price point and event timer by OCR, delivered as a Monday competitor-cadence table"
  level: L3
  cell: {buyer-role: live-ops, video-source: automated-bot-or-agent-playthrough, signal-extracted: on-screen-text-ocr, analysis-type: benchmark-vs-competitor, lifecycle-moment: live-event-or-update, delivery-form: weekly-digest-email, buyer-org-type: mid-size-studio, game-platform-and-genre: mobile-midcore-f2p, effort: L-multi-quarter}
  object: "competitor home screen, event hub, limited-time shop and countdown timers in 40 named midcore games"
  situation: "Live-ops manager plans next month's calendar and wants to know when the top 40 competitors run battle passes, flash sales and collab events, and at which price points; today it is a human opening each game daily"
  consequence: "Calendar clashes (own event launching the same weekend as 3 competitor collabs) go unseen; analysts at GameRefinery log 100+ games by hand for a five-figure subscription"
  p_typical: 0.08
  grounded: quote
  evidence: "adjacent-usecases.md section 7: 'most live events are announced without notice and cannot be scraped; gathering takes large human resources'; competitor-and-ua.md section 1: Playliner 'hundreds of hours of playtime... 230+ top games'"
  proposed: "Device farm with 40 logged-in accounts; VLM agent opens the event hub each day, OCRs event name, end timer, currency, price tiles; diff against yesterday; table of new events by game and genre"
  shallow: false
  mechanism: "A vision agent plays each competitor to the event hub and shop daily, OCRs names, timers and prices, and diffs day over day to build an event calendar and price-change log"
  example: "Monday digest: 'Game X started a 7-day pirate collab Thursday, 3 new $9.99 chests, battle pass price moved $9.99 to $11.99'"
  cost: L
  depends_on: "device farm with competitor accounts, per-game navigation scripts, VLM agent, store-ToS review"
  buyer: "Live-ops manager or head of live-ops at a mid-size mobile studio"
  input: "bot-recorded screen video of competitor games, daily, plus optional own event calendar to overlay"
  why_existing_tools_cannot: "GameRefinery Live Events Tracker and Sensor Tower Playliner are analysts playing by hand, coverage 100-250 games (competitor-and-ua.md section 1; adjacent-usecases.md section 7); no vendor shown extracting this from video (competitor-and-ua.md section 7 INFERRED)"
  willingness_to_pay: "4: Sensor Tower median $75,000/yr, GameRefinery about $45-51k/yr (competitor-and-ua.md section 8); Sensor Tower bought Playliner in Jun 2025 to extend live-ops coverage"

- id: liveops-4
  title: "Live-event launch detector from public streams and TikTok clips: spot a competitor's new event banner in creator footage within hours of launch and post the clip to Slack"
  level: L3
  cell: {buyer-role: live-ops, video-source: public-streams-and-ugc, signal-extracted: ui-state-and-screen-flow, analysis-type: anomaly-alert, lifecycle-moment: live-event-or-update, delivery-form: alert-or-slack, go-to-market-channel: self-serve, effort: M-one-quarter}
  object: "event splash and event hub frames visible in YouTube, Twitch and TikTok gameplay of 25 competitor titles"
  situation: "A competitor launches an unannounced Friday event; creators are playing it within hours, but no tool reads the pixels of their footage, only view counts"
  consequence: "Live-ops learns about the clash on Monday from a colleague; with an alert at launch hour 2 they could shift their own offer or push timing"
  p_typical: 0.04
  grounded: inferred
  evidence: "competitor-and-ua.md section 2 INFERRED: 'No source describes a product that ingests YouTube/Twitch/TikTok gameplay of a competitor and returns features, monetisation touchpoints or FTUE steps'; market.md section 5: Hatchet 'measures viewership metadata'"
  proposed: "Poll creator uploads for 25 titles every 30 min; sample frames; classify event splash screens against last week's library; Slack alert with the 20-second clip and detected event name"
  shallow: false
  mechanism: "Frame classifier on public video flags a new event-splash layout not seen before in that title, and posts the clip and timestamp; no device or SDK needed"
  example: "Sunday 03:00 UTC a TikTok clip of a competing match-3 game shows a new Lunar-New-Year splash; alert reaches live-ops by 07:00"
  cost: M
  depends_on: "public-video ingestion, per-title splash library, creator video retrieval via platform APIs"
  buyer: "Live-ops manager at a mobile studio, or competitive-intel analyst"
  input: "public creator video (YouTube, Twitch, TikTok), no other data"
  why_existing_tools_cannot: "Hatchet and Streams Charts count viewers and chat, not in-game content (market.md section 5); 'Nothing found reads clip content' (competitor-and-ua.md section 5 INFERRED)"
  willingness_to_pay: "2: no direct price signal; Hatchet Essentials $249/month is the nearest viewership-metadata anchor (market.md); coverage of mobile creators is thin so signal is noisy"

- id: liveops-5
  title: "New-mechanic confusion detector: open-close-reopen loops on a freshly shipped panel (3 or more reopenings within 90 s) flagged per build and cohort with the loop clip"
  level: L4
  cell: {buyer-role: live-ops, video-source: own-players-consented-sdk, signal-extracted: input-timing-and-hesitation, analysis-type: build-to-build-regression-diff, lifecycle-moment: new-version-release, delivery-form: ask-question-agent-chat, capture-trigger-and-sampling: event-triggered-clip, companion-data: build-and-config-metadata}
  object: "newly shipped panel in version 3.14, e.g. a 'Clan Race' tab with progress bar and tier rewards"
  situation: "Version 3.14 ships Wednesday; by Thursday 09:00 only 9% of players who opened the Clan Race tab joined a race, and the PRD expected 25%"
  consequence: "Without evidence the team guesses 'rewards too low' and edits the economy; the video shows players reopening the tab 3 times looking for the join button that sits in a collapsed drawer"
  p_typical: 0.11
  grounded: inferred
  evidence: "methods-churn-funnel.md section 2 INFERRED: 'camera spinning/wandering (lost); pause/menu toggling'; section 2 VERIFIED: rage taps 'at least 3 taps within a set radius with at most 300 ms between taps'"
  proposed: "Trigger a 60 s clip when the same panel is opened 3 times within 90 s or 3 rage-tap clusters occur on it; compare share of such sessions between 3.13 and 3.14 builds"
  shallow: false
  mechanism: "Event-triggered clips around repeated panel toggles and rage taps, grouped by build id, with a VLM caption of what the player was trying to find"
  example: "Thursday report: 14% of Clan Race openers loop 3+ times; clips show tapping the tier art (non-interactive) 5 times, then leaving"
  cost: M
  depends_on: "event-triggered ring buffer SDK, panel open/close telemetry, ask-question agent from the User Test product"
  buyer: "Live-ops manager and feature product owner at a mobile F2P studio"
  input: "60 s screen clips with touch overlay, panel open/close events, build id"
  why_existing_tools_cannot: "Unity funnels 'indicate good places to investigate'; editing a funnel 'would invalidate any existing data' (methods-churn-funnel.md section 1); rage-tap detection exists in UXCam for native UI but not for engine-rendered canvases (methods-churn-funnel.md sections 2 and 6)"
  willingness_to_pay: "3: EA paired funnels with Session Replay to cut onboarding time 30% (methods-churn-funnel.md section 1); same-day evidence reduces a hotfix debate; price anchor $99/month IV Metrics to $21k/year UXCam"

- id: liveops-6
  title: "Countdown-timer ignored detector: players who see 'ends in 2h' on the event tile, close it, and leave the app within 60 s; measures whether urgency copy works"
  level: L4
  cell: {buyer-role: live-ops, video-source: own-players-consented-sdk, signal-extracted: on-screen-text-ocr, analysis-type: cohort-comparison, lifecycle-moment: live-event-or-update, delivery-form: per-cohort-report, value-lever-b2b: de-risk-a-go-kill-decision, capture-trigger-and-sampling: targeted-cohort}
  object: "countdown timer text on the event tile and in the final-day event banner"
  situation: "Last 6 hours of a 7-day event; 38% of eligible players have not entered; timer text reads 'ends in 05:42:10'"
  consequence: "Live-ops cannot tell whether the end-of-event push should exist; if players read the timer and still leave, urgency is saturated and a different mechanic is needed"
  p_typical: 0.04
  grounded: speculative
  evidence: "none"
  proposed: "Sample clips from non-entrants during final 6 hours; OCR the timer value on screen at moment of tile dismissal; bucket by hours remaining; report entry rate after seeing timer under 6 h vs over 24 h"
  shallow: false
  mechanism: "OCR reads the countdown value in the frame at dismissal, giving 'time remaining as seen' per player, which telemetry does not store"
  example: "Cohort that saw 'ends in 05:xx' entered at 6%, cohort that saw 'ends in 2d' entered at 14%: urgency does not move players, so drop the final-day push"
  cost: S
  depends_on: "capture of targeted cohort, timer-region OCR per title"
  buyer: "Live-ops manager at a mobile F2P studio"
  input: "screen clips of non-entrants in last 6 hours of event, event end time"
  why_existing_tools_cannot: "Event analytics knows server time but not what number the player's screen showed; no source shows this extraction (methods-churn-funnel.md section 2 INFERRED: signals that exist in video but not in event streams)"
  willingness_to_pay: "2: narrow question; could be answered once a quarter, so low recurring spend; no price signal in notes"

- id: liveops-7
  title: "Event-reward visual smoke test on real devices: detect wrong icon, 'x0' quantity or placeholder text on the reward-claim screen within 2 h of a remote-config event push"
  level: L4
  cell: {buyer-role: live-ops, video-source: own-players-consented-sdk, signal-extracted: visual-errors-and-glitches, analysis-type: anomaly-alert, lifecycle-moment: live-event-or-update, delivery-form: issue-tracker-ticket, automation-level: auto-created-ticket-or-asset, capture-trigger-and-sampling: on-crash-or-anomaly}
  object: "reward-claim modal of a server-configured event (icon, quantity text, claim button) after a remote-config push"
  situation: "Events are configured in a live-ops CMS and pushed without an app build, so they skip build QA; a mis-keyed reward id shows a grey placeholder with 'x0' on 14% of devices"
  consequence: "Players hit a broken claim screen for hours; support tickets spike the next morning (live-ops finds out from tickets, not from QA)"
  p_typical: 0.09
  grounded: inferred
  evidence: "market.md section 3 research: arXiv 2508.04895 'A VLM picks the frame matching a bug report: top-1 F1 0.79'; adjacent-usecases.md section 1: 'accuracy is good enough for triage and bug-report enrichment, not for unattended detection'"
  proposed: "After each config push, capture reward-claim modal frames from the first 200 players; VLM checks icon present, quantity > 0, no placeholder string; open Jira ticket with 3 frames when 5 of 200 fail"
  shallow: false
  mechanism: "VLM triage on reward-screen frames from the first 200 live players after a config push, auto-opening a ticket with frames and device list when 2.5% show broken content"
  example: "Halloween event: reward 'Ghost Pack' shows grey icon and 'x0' on Android 11 Samsung devices; ticket opened 47 minutes after push"
  cost: M
  depends_on: "consented SDK with on-anomaly trigger, config-push webhook, Jira integration (Razer-style)"
  buyer: "Live-ops manager (QA director as co-consumer) at a mobile studio"
  input: "reward-screen frames from first 200 players after push, config diff, device model"
  why_existing_tools_cannot: "Razer QA Companion-AI sits next to testers on PC builds (market.md section 3); modl.ai and nunu.ai play builds before release, not server-config pushes seen by real players (market.md section 3 does-not-do notes); crash logs show nothing for a grey icon (persona premise)"
  willingness_to_pay: "3: QA is under-funded (77% did less QA than they should have, market.md); outsourced QA $15-50 per tester hour; but only 16% fully trust AI QA, which caps price"

- id: liveops-8
