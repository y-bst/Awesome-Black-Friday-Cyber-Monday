- id: liveops-12
  title: "Winback re-entry check: record the first 90 s after a lapsed player returns via an event push and flag stacked modals, forced update screens or load stalls above 8 s"
  level: L4
  cell: {buyer-role: live-ops, video-source: own-players-consented-sdk, signal-extracted: load-and-wait-screens, analysis-type: funnel-drop-off-why, lifecycle-moment: post-churn-winback, delivery-form: per-cohort-report, capture-trigger-and-sampling: targeted-cohort, companion-data: attribution-campaign-and-creative-id}
