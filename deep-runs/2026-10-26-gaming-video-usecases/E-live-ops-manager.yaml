  level: L4
  cell: {buyer-role: live-ops, video-source: own-players-consented-sdk, signal-extracted: text-overflow-and-untranslated, analysis-type: anomaly-alert, lifecycle-moment: new-market-or-language-launch, delivery-form: per-cohort-report, buyer-org-type: mid-size-studio, constraint-to-overcome: per-game-ui-generalisation}
