  evidence: "adjacent-usecases.md section 9: 'players self-record and attach; agents watch'; 'no off-the-shelf vendor of a rolling last-30-seconds game-client buffer attached to a ticket'; section 3: 'about 23% of player reports contained actionable evidence'"
