- id: f2p-1
  case: >-
    Build this first because it answers the one question every mobile F2P product lead already asks every week and
    cannot answer. The buyer is the head of product who owns D1 and FTUE at a mid-size mobile studio. Today they get a
    GameAnalytics or Unity funnel that says tutorial step 3 lost 12%. Unity's own docs offer only "a bug ... or the level
    is too hard" and tell them to "investigate" (methods-churn-funnel.md §1). The report replaces the guess and the
    follow-up PlaytestCloud order. PlaytestCloud costs EUR 13.6k-33.9k a year for 120-240 sessions, about EUR 113-141 per
    analysed session (market.md WTP), and returns in 48 hours from recruited testers who are not the cohort that dropped.
    The founder can sell it on day one as a repackage of the existing User Test report on recruited footage, then switch
    the input to SDK clips of real abandoners, so the first revenue arrives before the SDK is finished. Incumbents cannot
    copy it quickly. PlaytestCloud's AI reads transcripts and surveys, not pixels, and has no link to production
    telemetry. Funnel vendors have no video. Game-engine session replay is screenshot-only or "alpha" (market.md §1, §2;
    methods-churn-funnel.md §6). The market.md gap map finds no vendor that joins live-player CV to retention.
- id: altdata-22
  case: >-
    This should be first on speed of revenue: it is an XS repackage of the User Test ingestion and the ask-question
    agent, sold per analyst seat to a buyer with a large manual bill. The buyer is the head of research operations at
    a game-intelligence firm (Liftoff Intelligence/GameRefinery, Sensor Tower's Live Ops team). GameRefinery's analysts
    play games and tag about 260 features by hand. The firm keeps 2,500+ deconstructions, and Playliner logs "hundreds of
    hours" of play with "no collection tooling named" (competitor-and-ua.md §1). The workbench replaces the analyst
    scrubbing hours of their own recordings to fill taxonomy fields. The analyst keeps the accept/reject step, so the
    firm keeps its human-verified label quality, which is what it sells. The price anchor is the analyst headcount
    behind products that sell at $45-51k/yr (GameRefinery) and $29.5k-$115k/yr (Sensor Tower, median $75k)
    (competitor-and-ua.md §1, §8). A seat tool cheaper than one analyst is an easy budget decision. These firms have no
    gameplay-video tooling of their own: their only automated tagging reads store metadata (51 features), not gameplay.
    Building ingestion, transcription and a grounded clip-returning agent would take them quarters, and they could buy
    us instead. A single logo here also opens the white-label channel that competitor-and-ua.md §8 names as the natural
    route to the intel buyer.
- id: design-18
  case: >-
    Sell this first because the founder can run it with an analyst next week, and it lands on the most expensive
    decision a mid-size studio makes: go or kill in soft launch. The buyer is the game director or lead designer of a
    mid-core title in soft launch, with D1 at 24%. The 2026 GameAnalytics benchmark puts median D1 at about 22% and P75
    just above 30% (methods-churn-funnel.md §1), so this is the zone where the UA budget is either released or cut. The
    package gives a fixed-scope deliverable in 5 working days: 10 ranked levels, each with a proposed tuning change and 5
    clips. It replaces weeks of designer guesswork and the extra recruited PlaytestCloud rounds bought at EUR 113-141 a
    session within EUR 13.6k-33.9k/yr contracts (market.md WTP). A managed project is priced per build, so it does not
    need a procurement cycle for a new SaaS line. The analyst covers the accuracy gap while the clustering model
    improves, and each project produces labelled fail clips that later feed the self-serve product. PlaytestCloud cannot
    copy it quickly: its panel is recruited testers with "no churn or retention link to production telemetry", and its
    AI reads speech, not frames (market.md §1). Funnel vendors have the fail counts and no footage (methods-churn-funnel.md
    §1).
- id: design-2
  case: >-
    Build this first because it is the one option whose core claim rests on published evidence that churn sits in
    specific failure moments. In the Aalto/Rovio study, pass rate barely correlates with churn (r = -0.144), but "churn
    without completing the level" does (r = -0.586) (methods-churn-funnel.md §3). The buyer is the lead designer at a
    casual or mid-core mobile F2P studio. The clip reel puts in front of them the last failed attempt of each 7-day
    churner on the 10 worst levels, so they can tell "too hard" from "bug" or "didn't see the key tile". Those are the two
    causes Unity's docs leave open. The reel replaces guesswork and generic session replay. EA paired funnels with
    Session Replay and cut onboarding time by 30% (methods-churn-funnel.md §1), which shows buyers pay for the "why". The
    price anchor is PlaytestCloud at about EUR 113-141 per analysed session. Real churners' clips are worth more, because
    no recruited panel can produce them. The capture design is cheap and privacy-light. It keeps a 60 s ring buffer per
    attempt on the device, holds it until the churn label resolves, and uploads about 15 MB on Wi-Fi only for churners.
    This is the Sentry on-error pattern keyed to churn (methods-churn-funnel.md §6, §7). Incumbents cannot copy it
    quickly. Sentry keeps the buffer only on errors, PostHog's Unity replay is screenshot-only "alpha", IV Metrics caps
    customers at 50-100 human-reviewed videos, and no paper or vendor predicts churn from human gameplay frames.
- id: vendor-10
  case: >-
    Put this first if the founder wants one large contract over many small ones. The buyer is the head of product data
    at Sensor Tower, Liftoff Intelligence/GameRefinery or AppMagic. All three already sell live-ops coverage that is
    collected by hand. Playliner logs "hundreds of hours" across 230+ games with no named tooling. GameRefinery documents
    35+ event types as analyst screenshots and comments. The trade press says gathering "takes large human resources",
    because events cannot be scraped (competitor-and-ua.md §1; adjacent-usecases.md §7). The logger replaces that
    play-and-screenshot work with a daily warehouse table (event type, first/last seen, offer price, currency, screenshot
    URL). Analysts review only the low-confidence rows. That can take coverage from about 230 games to 2,000 without 10x
    headcount. The price anchors are strong. The firms' end-customer contracts run $29.5k-$115k/yr. Sensor Tower spent
    on three acquisitions in 2024-25 (data.ai, about $300M by one estimate; Video Game Insights; Playliner), all to
    extend coverage (competitor-and-ua.md §1, §8). The underlying parts are mature: screen classification, OCR on clean
    store UI and price parsing (methods-churn-funnel.md §4). These firms have not built it, though. Their automated
    tagging reads store metadata and ad creatives, not recorded gameplay, and no source shows any vendor extracting
    events or prices from gameplay video.
