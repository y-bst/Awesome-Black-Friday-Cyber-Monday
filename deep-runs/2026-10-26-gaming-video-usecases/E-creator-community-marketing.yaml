- id: creator-1
  title: "On-device ring buffer saves the 20 seconds around a detected clip-worthy moment in a mobile midcore session and queues it as a 9:16 post candidate"
  level: L4
  cell:
    buyer-role: community-and-creator-marketing
    video-source: own-players-consented-sdk
    signal-extracted: player-skill-and-mechanics
    analysis-type: highlight-or-clip-generation
    capture-trigger-and-sampling: event-triggered-clip
    processing-location: on-device
    game-platform-and-genre: mobile-midcore-f2p
    delivery-form: clip-reel
  object: "competitor-and-ua.md section 4: highlight tools are PC/console and 'none is shown working on mobile gameplay recorded on-device'; Hypetrigger needs a crop region, colour filter and text pattern per game"
  situation: "A player lands a 12-hit combo or clears a level with 1 move left in a mobile midcore game; no streamer is watching, so no existing clipper ever sees it"
  consequence: "The community team has no supply of real-player clips for TikTok/Shorts and pays creators or an agency for content instead (Admiral EUR 363-500 per AI video)"
  p_typical: 0.14
  grounded: inferred
  evidence: "competitor-and-ua.md s4 INFERRED: existing highlight tools target streamers on PC/console titles; none is shown on mobile gameplay recorded on-device (paraphrased)"
  proposed: "Per-title list of 6-10 moment labels bootstrapped by a VLM, on-device trigger, 20 s buffer uploaded only on Wi-Fi after player taps 'share'"
  shallow: false
  mechanism: "Event trigger fires from detected moment labels; the buffer is cut to 9:16 on device and scored for hook strength before upload; the community manager sees a ranked queue instead of raw footage"
  example: "Match-3 game: 'board cleared with 1 move left' labelled by a screen classifier; 40 clips/day reach the queue and the manager approves 5 for TikTok"
  cost: M
  depends_on: "capture SDK with ring buffer, VLM-bootstrapped per-title moment detector"
  buyer: "Community manager at a mid-size mobile midcore F2P studio"
  input: "On-device screen video (ring buffer) plus game events marking level end and combo count"
  why_existing_tools_cannot: "competitor-and-ua.md s4: Hypetrigger, Eklipse and Outplayed target PC/console streamers and need per-game configs or integrations; market.md s4: Ludeo and Medal sell playable or auto-clips, not mobile moment ranking"
  willingness_to_pay: "3 - Ludeo has about $42M raised and 100+ indie studios on self-serve (market.md s4) and Medal's auto-clipping API is free, so clip cutting alone is priced near zero; pay appears only if it replaces creator seeding at EUR 363-500 per video (competitor-and-ua.md s3)"

- id: creator-2
