  cost: M
  depends_on: "creator-1 moment detector, share-tap event in telemetry"
  buyer: "Head of community or growth marketing at a hypercasual or casual publisher"
  input: "Sampled own-player screen video plus share and level events from telemetry"
  why_existing_tools_cannot: "competitor-and-ua.md s5: Gamesight and Lurkit track clicks and keys, not clip content; market.md s2: session-replay SDKs show a black box for game canvases"
  willingness_to_pay: "2 - no buyer signal for share-moment analytics in the notes; closest anchor is Hatchet Essentials $249/month (market.md s5) as a marketing analytics seat"

