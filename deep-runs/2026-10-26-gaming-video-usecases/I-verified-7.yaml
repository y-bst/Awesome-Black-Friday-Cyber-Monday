  already_offered: false
  proposed: Per duel, detect first frame of enemy silhouette in each POV, align POVs by the broadcast round timer OCR, subtract, aggregate by region and tick rate
  shallow: false
  mechanism: Enemy-visible detector run on both POVs; alignment by OCR of the round clock and kill-feed; window = attacker-first-sight minus defender-first-sight; server log adds RTT per player so the residual
