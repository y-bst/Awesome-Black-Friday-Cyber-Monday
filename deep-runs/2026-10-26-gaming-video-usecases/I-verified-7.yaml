- id: netcode-1
  title: 'Tick-stamped ring buffer: each captured frame carries a 16-byte sidecar (client frame no., last server snapshot tick, RTT estimate, interp delay ms, prediction-error mm) so any clip can be laid
    against the server log tick by tick'
  level: L4
  cell:
    buyer-role: engineering-performance
    video-source: own-players-consented-sdk
    signal-extracted: structured-game-state-reconstruction
    analysis-type: root-cause-of-a-metric-change
    delivery-form: api-or-sdk
    game-platform-and-genre:
    - competitive-multiplayer
    - pc
    - console
    capture-trigger-and-sampling: always-on-ring-buffer
    constraint-to-overcome: joining-video-to-events
    processing-location: on-device
    effort: M-one-quarter
    companion-data: telemetry-events
    companion-data-off-axis: server-tick-ping-and-region-logs
  object: The netcode layer's own per-frame state (last acked snapshot tick, smoothed RTT, interpolation delay) that the engine already holds in memory; the 30-120 s on-device ring buffer pattern in methods-churn-funnel.md
    section 7 (b)
  situation: 'A PC and console 5v5 shooter at 64 Hz server tick: the netcode lead cannot use any player clip as evidence because the video has a wall-clock timestamp and the server log has a tick number,
    and client clocks drift 20-80 ms'
  consequence: Without the sidecar every netcode option below is guesswork on alignment; with it, frame N of a clip maps to server tick T and RTT R to within one frame (16.6 ms at 60 fps)
  p_typical: 0.05
  grounded: inferred
  evidence: 'methods-churn-funnel.md section 7 INFERRED (b): ''a 30-120 s on-device ring buffer uploaded only on trigger ... as Sentry does for errors''; methods-churn-funnel.md section 6: Sentry onErrorSampleRate
    keeps ''about the last minute before the error'''
  already_offered: false
  proposed: Engine plugin (Unreal NetDriver hook, Unity Netcode for GameObjects / Photon Fusion callback) that writes 16 bytes per frame into the encoder's SEI/user-data channel; server log keyed by match
    ID and tick
  shallow: false
  mechanism: The capture SDK embeds the netcode state in the video stream itself, so the clip and the server's per-tick log join on (match_id, tick) with no clock sync step; all analysis runs in the vendor
    cloud on trigger uploads only
  example: 'A clip uploaded after a ''that''s not fair'' report: frame 3,412 = server tick 118,902, RTT 74 ms, interp 31 ms; the server''s lag-compensated hitbox history for that tick is pulled and overlaid
    automatically'
  cost: M
  depends_on: A low-cost capture path (cto-5 hardware encoder) and the cto-2 self-cost limiter; one integration per netcode stack (Unreal, NGO, Photon, custom)
  buyer: Lead network or online-services programmer at a PC/console competitive multiplayer studio; CTO signs the allow-list
  input: Consented ring-buffer video plus the engine's per-frame netcode state; server per-tick logs (hit validation, snapshot send, region, server instance ID)
  why_existing_tools_cannot: 'adjacent-usecases.md section 9: no vendor ships a rolling game-client buffer at all; market.md section 2: IV Metrics, PostHog and UXCam record screens with no engine or server
    tick join; adjacent-usecases.md section 2: anti-cheat work is server-side ML on input and timing with no video'
  willingness_to_pay: 3 - enabler, not bought alone; the paying use is the options below; Sentry-style on-error buffering is a pattern studios already accept (methods-churn-funnel.md section 6)
  variants_of: cto-5
  bucket: 7
  perspective: netcode
- id: netcode-2
  title: '''I shot first'' hit-registration adjudicator: victim and shooter clips at the same tick, server''s rewound hitbox overlaid, each disputed death classed as lag-comp cap exceeded, favour-the-shooter
    window, hitbox/animation desync bug, or clean miss'
  level: L4
  cell:
    buyer-role: engineering-performance
    video-source: own-players-consented-sdk
    signal-extracted: player-skill-and-mechanics
    analysis-type: root-cause-of-a-metric-change
    delivery-form: issue-tracker-ticket
    game-platform-and-genre:
    - competitive-multiplayer
    - pc
    - console
    capture-trigger-and-sampling: on-player-report
    automation-level: auto-created-ticket-or-asset
    companion-data: touch-and-controller-input
    companion-data-off-axis: server-tick-ping-and-region-logs
    lifecycle-moment: new-version-release
    constraint-to-overcome: joining-video-to-events
  object: The server's lag-compensation rewind (hitbox positions stored per tick, rewind cap e.g. 200 ms) and the player's crosshair over the enemy model in the shooter's frame at fire time
  situation: After patch 7.2, 'my shots don't register' posts triple on Reddit; telemetry shows hit rate flat, so the netcode team cannot tell a perception problem from a hitbox bug
  consequence: Only the 'hitbox/animation desync' class becomes a Jira ticket (with the frame pair and tick); the others become counts by region and ping bucket, so the team stops chasing 1,000 anecdotes
  p_typical: 0.12
  grounded: inferred
  evidence: 'adjacent-usecases.md section 2 ''What is manual today'': players submit video clips and forum posts by hand; adjacent-usecases.md section 3: ''only about 23% of player reports contained actionable
    evidence'''
  already_offered: false
  proposed: On a 'shot did not register' report button or on a server-side 'fire with crosshair-on-model but no hit' event, upload 3 s around the shot; classifier outputs one of 4 classes with the frame
    pair and the rewound hitbox render
  shallow: false
  mechanism: Vision locates crosshair and enemy silhouette in the shooter's frame at the fire tick; server log gives the rewound hitbox at (fire tick - RTT - interp); if the silhouette and the rewound hitbox
    diverge by more than 5 cm with RTT under the cap, it is an animation-replication bug and a ticket is filed
  example: '1,240 disputed shots in 48 h: 61% clean misses, 22% RTT over the 200 ms cap (mostly Sao Paulo players on the Virginia server), 14% favour-the-shooter, 3% hitbox lag on the new crouch-slide animation;
    one ticket, fixed in 7.2.1'
  cost: M
  depends_on: netcode-1 tick sidecar; server hit-validation log retained 72 h
  buyer: Netcode lead at a PC/console shooter studio (5v5 tactical, battle royale)
  input: Shooter and victim ring-buffer clips, controller or mouse input, server hit-validation and rewind log
  why_existing_tools_cannot: 'adjacent-usecases.md section 2: Vanguard and Ricochet publish server-side ML on input/timing/recoil, not video; no vendor in market.md section 9 joins player footage to server
    state'
  willingness_to_pay: '4 - hit-reg complaints are a top live-service grievance and the studio already staffs this by hand; no published price, enterprise quote like anti-cheat (adjacent-usecases.md section
    2 ''Price signals: None published. INFERRED: enterprise quote only'')'
  bucket: 7
  perspective: netcode
- id: netcode-3
  title: 'Cross-POV desync detector: two consented players in the same match, frames at the same server tick compared on shared world state (door open vs closed, enemy alive vs ragdoll, objective owner),
