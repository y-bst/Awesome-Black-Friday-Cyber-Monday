    constraint-to-overcome: joining-video-to-events
  object: Pro league POV VODs (all 10 player cams recorded per match) and the match's server tick rate and per-player ping
  situation: Pros claim peeker's advantage is worse on the new Seoul servers; the studio's server log shows ping but not the asymmetric visibility delay players actually experience on screen
  consequence: A measured 'peeker's window' (e.g. 71 ms Seoul vs 48 ms Frankfurt at 128 Hz) decides whether to raise tick rate or move the league's server, instead of arguing from anecdotes
  p_typical: 0.06
  grounded: inferred
  evidence: 'adjacent-usecases.md section 8: ClutchLabs derives VOD metrics ''without data feeds''; esports VOD is already recorded per player; market.md section 9: ''Relo-style CV exists in sports but
