  situation: Doubling tick rate on a 60-player battle royale roughly doubles server CPU; finance asks whether players will notice, and retention A/B tests take 4 weeks to read
  consequence: 'Within 5 days the test reads ''rubber-band snaps over 30 cm: 2.1 vs 0.6 per match-minute; fire-to-marker 5.2 vs 3.4 frames'' with 10 example clips per arm, beside D7 and cost per CCU'
