    companion-data-off-axis: server-tick-ping-and-region-logs
    constraint-to-overcome: joining-video-to-events
    automation-level: auto-created-ticket-or-asset
  object: Replicated actors whose state the server owns (doors, destructibles, capture points, death state); two clients' frames tagged with the same tick via netcode-1
  situation: A new build changes replication priority to save bandwidth; on 1-2% of matches one teammate sees a door open and walks into it while another sees it closed, and no counter flags this because
    each client is self-consistent
  consequence: 'Desync that is invisible to single-client telemetry becomes a per-build rate (''door-state mismatches per 1,000 match-minutes: 0.4 on 7.1, 6.8 on 7.2'') with two side-by-side clips per ticket'
  p_typical: 0.04
  grounded: inferred
  evidence: 'methods-churn-funnel.md section 4: computer vision on game UI reads HUD and state from frames; market.md section 9: ''Session-replay SDKs record or screenshot but do not interpret game state'''
  already_offered: false
  proposed: Sample 2% of matches where 2+ players are consented; for each tick bucket, run a per-game state reader on both POVs and diff a list of 20 replicated objects
  shallow: false
  mechanism: Per-title object detector (door, capture-point flag colour, enemy health bar) reads state from both POVs; server log is the referee; a disagreement with the server on one client for more than
    300 ms is a desync event keyed by object class, build and region
  example: 'Build 7.2: destructible-wall state disagrees between squadmates in 3.1% of Frankfurt matches vs 0.2% on 7.1; root cause a relevancy-distance change; ticket includes two clips and the actor ID'
  cost: L
  depends_on: netcode-1; per-title state reader (structured-game-state-reconstruction) for 20 object classes; matches with 2+ consented players
  buyer: Netcode or online-services lead; QA director reads the per-build rate at release gate
  input: Two or more players' consented clips from the same match plus build metadata and server state log
  why_existing_tools_cannot: 'market.md section 3: AI QA agents (modl.ai, nunu.ai, Razer) test builds with bots in isolation, not live multi-client matches; adjacent-usecases.md section 1: video bug detection
    is per-stream'
  willingness_to_pay: 3 - QA spend is proven (outsourced QA USD 15-50/hour, adjacent-usecases.md 'Signals of willingness to pay') but multi-client desync is a narrow bug class
  bucket: 7
  perspective: netcode
- id: netcode-4
