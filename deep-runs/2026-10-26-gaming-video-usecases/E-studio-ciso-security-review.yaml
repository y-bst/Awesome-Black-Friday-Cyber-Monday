  cost: S
  depends_on: "OCR pipeline already in the video product; Jira API access"
  buyer: "CISO / application security lead at a AAA studio"
  input: "internal-qa-builds video attachments + crash-and-error-logs metadata"
  why_existing_tools_cannot: "market.md section 3: AI QA tools (Razer, ManaMind) look for rendering and physics bugs, not secrets; secret scanners in code repos do not read video"
