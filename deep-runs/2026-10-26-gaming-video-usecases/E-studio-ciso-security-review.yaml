- id: ciso-10
  title: "Clearance-tiered clip rendering: the same clip is served with different redaction levels to internal staff, outsourced QA, localisation vendors and marketing agencies"
  level: L3
  cell: {buyer-role: outsourced-qa-vendor, video-source: outsourced-tester-rigs, delivery-form: in-tool-annotation, constraint-to-overcome: studio-ip-and-prerelease-leak, buyer-org-type: outsourced-services-vendor, go-to-market-channel: through-services-vendor}
  object: "market.md section 3 Keywords Studios: 'QA revenue is labour-based outsourcing'; adjacent-usecases.md section 5: 'clients take screenshots of every screen in the localised build and translators judge from them'"
  situation: "studio shares gameplay video with three external firms; the localisation vendor needs only text screens, the QA vendor needs the bug moment, the agency needs nothing unannounced"
  consequence: "today one export is shared with all; the widest audience sees unannounced content; or the studio refuses to share video and outsourced work slows"
  p_typical: 0.03
  grounded: inferred
  evidence: "adjacent-usecases.md section 5: translators judge from screenshots of every screen; market.md section 3: Keywords sells outsourced QA"
  proposed: "each viewer group gets a policy (blur unannounced assets, crop to UI text, time-window around the bug); the player renders the policy at view time from one stored master"
  shallow: false
  mechanism: "VLM and asset-ID tags mark segments and regions per clip; policies per group decide what is blurred, cropped or hidden; outsourced users never get the master file"
  example: "A bug clip from a pre-alpha console build: internal sees all; the outsourced QA firm sees the 20 seconds around the crash; the localisation vendor sees only cropped dialogue boxes."
  cost: M
  depends_on: "ciso-6 audit log; region and segment tagging; SSO groups per external firm"
  buyer: "CISO at the studio; ops director at the outsourced QA or localisation firm (wants access granted faster)"
  input: "outsourced-tester-rigs and internal-qa-builds video + build-and-config-metadata (asset reveal flags)"
  why_existing_tools_cannot: "adjacent-usecases.md section 5 and market.md section 3: localisation and QA vendors exchange screenshots and video files; no tool in the notes renders per-audience redacted views"
  willingness_to_pay: "2 - security value high, budget owner unclear; sold as part of an enterprise licence or through the services vendor"

- id: ciso-11
  title: "SDK security attestation pack: signed reproducible binaries, SBOM, declared egress hosts, no dynamic code loading, and a sandbox report the studio can re-run"
  level: L3
  cell: {buyer-role: engineering-performance, delivery-form: api-or-sdk, constraint-to-overcome: anti-cheat-conflict, buyer-org-type: aaa-studio, game-platform-and-genre: competitive-multiplayer, effort: M-one-quarter}
  object: "B-perspectives cto-or-engine-lead-veto: 'anti-cheat (EAC, BattlEye) may flag screen capture hooks'; market.md section 3 Razer: 'Needs no SDK or game instrumentation'"
  situation: "competitive multiplayer title with kernel anti-cheat; a capture SDK hooks the render path and opens an outbound connection"
  consequence: "a render hook plus network egress looks like a cheat or an exfiltration channel; CISO and engine lead refuse integration; a compromised vendor SDK would ship to every player"
  p_typical: 0.07
  grounded: inferred
  evidence: "market.md section 3: Razer QA Companion 'Needs no SDK or game instrumentation' sold as an advantage; adjacent-usecases.md section 2: Riot Vanguard is kernel level"
  proposed: "publish per-release SBOM and Sigstore signatures; fixed list of egress hostnames; anti-cheat vendor allow-list entry; a container the studio runs to observe SDK network and file behaviour for 30 minutes"
  shallow: false
  mechanism: "release engineering change at the vendor: deterministic builds, signing, documented hook points, anti-cheat partner registration; the studio's own sandbox report is the evidence"
  example: "A competitive PC shooter's security team runs the sandbox, sees only 2 egress hosts and a signed DLL registered with the anti-cheat vendor, and approves capture for its 5% opt-in panel."
  cost: M
  depends_on: "a capture SDK release process; partnership with at least one anti-cheat vendor"
