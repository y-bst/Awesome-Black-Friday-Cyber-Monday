  situation: "EU or Korean publisher security review: questionnaire asks the region of storage and of every model call; a US-hosted LLM API call is an international transfer"
  consequence: "a single cross-region model call fails the residency clause; the deal is lost even if storage is in-region"
  p_typical: 0.15
  grounded: inferred
  evidence: "market.md section 1: PlaytestCloud 'uses the OpenAI API on video transcripts and survey responses'"
