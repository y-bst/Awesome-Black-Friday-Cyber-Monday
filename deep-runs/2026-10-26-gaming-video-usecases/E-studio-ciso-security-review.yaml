  why_existing_tools_cannot: "market.md section 2: replay SDKs (UXCam, Smartlook, PostHog) are built for native apps, not kernel anti-cheat environments; adjacent-usecases.md section 2 lists no capture vendor with anti-cheat compatibility"
  willingness_to_pay: "2 - no one pays for it; without it competitive-multiplayer studios do not integrate at all"

