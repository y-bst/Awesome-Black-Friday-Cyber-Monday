- id: ciso-1
  title: "On-device debug-overlay stripper: frames showing dev console, FPS/memory overlay or log text are blurred or dropped before any upload from beta builds"
  level: L4
  cell: {video-source: beta-and-early-access-testers, signal-extracted: on-screen-text-ocr, processing-location: on-device, constraint-to-overcome: studio-ip-and-prerelease-leak, companion-data: build-and-config-metadata, effort: M-one-quarter}
  object: "adjacent-usecases.md section 1: VLM baseline on 100 industrial QA videos, 'many flagged anomalies were on-screen log messages'"
  situation: "closed beta of a PC or Android build compiled with a development flag; a tester toggles the debug menu, or the build ships with an on-screen log stream that prints internal server hostnames and asset paths"
  consequence: "without stripping, every uploaded clip carries internal hostnames, build hashes and unreleased asset names to the vendor cloud; CISO vetoes the SDK for any non-gold build"
  p_typical: 0.04
  grounded: inferred
  evidence: "adjacent-usecases.md section 1: 'many flagged anomalies were on-screen log messages'; market.md section 1 Antidote: 'Anti-leak SDK watermarks a player ID on screen'"
  proposed: "ship a 2-class on-device detector (debug overlay present / absent) per build flavour; frames with score >0.5 are replaced by a grey frame plus an event 'debug_overlay_redacted' with timestamp"
  shallow: false
  mechanism: "a small on-device classifier plus OCR keyword list (localhost, .internal, build hash regex, 'DEV') runs on the 1-5 fps capture stream; matched regions are blurred, frames above 30% coverage are dropped; the redaction log is uploaded so analysts see where gaps are"
  example: "Mid-size studio closed beta of a midcore Android shooter: 2,000 testers, 11% of sessions show the dev FPS overlay because QA forgot to strip it; the tool drops 3,400 frames and the CISO signs off on beta capture."
  cost: M
  depends_on: "capture SDK with a frame hook before encode; per-studio keyword and overlay templates (one afternoon of labelling per build flavour)"
  buyer: "CISO / vendor-risk reviewer at a mid-size or AAA studio (approver), paid by the product or UX research budget"
  input: "beta tester device capture at 1-5 fps + build-and-config-metadata (build flavour, debug flag)"
  why_existing_tools_cannot: "market.md section 2: PostHog Unity replay is screenshot-based 'with no built-in masking of text or images'; Antidote (market.md section 1) watermarks but does not remove debug content"
  willingness_to_pay: "3 - not bought standalone; it is the condition for any beta capture contract; anchor is PlaytestCloud EUR 13.6k-33.9k/yr (market.md signals) that the CISO would otherwise block"

- id: ciso-2
  title: "Customer-cloud deployment: the whole video pipeline runs inside the studio's own AWS/GCP account; vendor staff and vendor cloud never hold a frame"
  level: L3
  cell: {buyer-org-type: aaa-studio, processing-location: customer-cloud-byoc, constraint-to-overcome: security-review-soc2-residency, pricing-model: annual-enterprise-licence, go-to-market-channel: engine-asset-store-or-marketplace, effort: L-multi-quarter}
  object: "market.md section 3 Razer QA Companion-AI: 'GA on AWS Marketplace since 13 Nov 2025'"
  situation: "AAA studio security review of any vendor that will receive unreleased build footage; questionnaire asks where footage is stored, who has keys, which subprocessors see it"
  consequence: "SaaS-only vendors fail the review at the 'subprocessors' line; BYOC turns a 4-6 month vendor-risk review into a software-licence review of 2-4 weeks"
  p_typical: 0.18
  grounded: inferred
  evidence: "market.md section 3: Razer 'GA on AWS Marketplace since 13 Nov 2025'; market.md section 1: PlaytestCloud 'uses the OpenAI API on video transcripts and survey responses'"
  proposed: "package ingestion, frame sampling, labelling and report agent as a Terraform/Helm bundle that runs in the customer VPC; model calls go to the customer's own Bedrock or Vertex endpoint"
  shallow: false
  mechanism: "the existing User Test product is split into a control plane (vendor, licence and updates only) and a data plane (customer account: storage, transcoding, VLM calls, report agent); outbound egress from the data plane is restricted to the customer's model endpoint"
  example: "A AAA publisher runs the pipeline in its own eu-west-1 account on 400 hours of pre-alpha playtest footage; the security team inspects VPC flow logs and sees zero bytes to the vendor."
  cost: L
  depends_on: "existing video ingestion and report agent made deployable as containers; a model-provider abstraction so Bedrock/Vertex/Azure OpenAI can be swapped"
  buyer: "CISO plus head of user research or QA at a AAA studio or publisher"
  input: "any video source the studio already holds (internal QA, recruited playtesters, beta capture) + the studio's own telemetry warehouse"
  why_existing_tools_cannot: "market.md section 1: PlaytestCloud AI sends transcripts to the OpenAI API (a third-party subprocessor); no playtest vendor in market.md offers a customer-account deployment"
  willingness_to_pay: "4 - AAA buys security-packaged tools through cloud marketplaces (Razer on AWS Marketplace, market.md section 3); enterprise licence priced in the PlaytestCloud Enterprise / Sensor Tower $75k/yr band (competitor-and-ua.md section 1)"

- id: ciso-3
  title: "Leak hunter: daily scan of YouTube, Twitch, TikTok and X clips for frames matching unreleased build content, with a takedown-ready evidence pack per hit"
  level: L4
  cell: {video-source: public-streams-and-ugc, signal-extracted: structured-game-state-reconstruction, analysis-type: evidence-pack-for-enforcement, delivery-form: enforcement-or-cert-evidence-pack, lifecycle-moment: pre-launch-qa, constraint-to-overcome: studio-ip-and-prerelease-leak, value-lever-b2b: reduce-cost-per-incident}
  object: "market.md section 5 Hatchet: 'measures viewership metadata ... No evidence it analyses the gameplay pixels inside streams'"
  situation: "closed beta or press preview running; a tester streams or clips footage of an unannounced map or character; the studio learns of it from Reddit hours later"
  consequence: "unannounced content spreads before reveal; marketing beat lost; legal has no frame-accurate proof linking the clip to a build"
  p_typical: 0.06
  grounded: inferred
  evidence: "market.md section 5: Hatchet measures 'hours watched, viewers, chat'; competitor-and-ua.md section 5: 'Nothing found reads clip content'"
  proposed: "reference set = 200-500 keyframes of embargoed content exported from internal QA builds; scan new public clips with game-title keyword filter, perceptual-hash plus VLM similarity; alert within 2 hours with URL, timestamp, matched reference frame"
  shallow: false
  mechanism: "the studio uploads embargoed reference frames (new hero model, map layout, UI of unreleased mode); a crawler pulls public clips tagged with the game name, samples at 1 fps, matches against references, and the report agent writes the DMCA notice body with side-by-side frames"
  example: "Day 3 of a closed beta for a PC hero shooter: a 41-second TikTok shows the unannounced 6th hero's ultimate; the CISO gets a Slack alert 90 minutes after upload with a pre-filled takedown and the build number the footage came from."
  cost: M
  depends_on: "public clip crawler and storage; reference-frame upload flow; ciso-4 watermark for attribution to a tester (optional)"
  buyer: "CISO or anti-piracy / IP protection lead at a AAA studio or publisher"
  input: "public-streams-and-ugc + embargoed reference frames from internal-qa-builds + build-and-config-metadata (reveal calendar)"
  why_existing_tools_cannot: "market.md section 5 and competitor-and-ua.md section 5: stream and UGC monitoring reads viewership counts and links, not pixels; Hatchet pricing $249-$1,249+/month buys audience data only"
  willingness_to_pay: "4 - publishers already pay Hatchet $249-$1,249+/month for stream data (market.md section 5); a single leaked reveal costs a marketing beat; priced per title per beta window"

- id: ciso-4
  title: "Per-tester invisible watermark in captured and streamed frames, plus a decode API that names the tester behind a leaked clip"
  level: L4
  cell: {video-source: beta-and-early-access-testers, analysis-type: evidence-pack-for-enforcement, delivery-form: api-or-sdk, constraint-to-overcome: studio-ip-and-prerelease-leak, pricing-model: per-build-or-release, buyer-org-type: aaa-studio}
  object: "market.md section 1 Antidote: 'Anti-leak SDK watermarks a player ID on screen'"
  situation: "a 90-second leaked clip of a closed beta appears re-encoded at 480p on YouTube; the studio has 5,000 testers under NDA and no way to know which one"
  consequence: "visible watermarks are cropped out by leakers; without attribution the NDA is unenforceable and the next beta is cancelled or shrunk"
  p_typical: 0.05
  grounded: inferred
  evidence: "market.md section 1: Antidote 'Anti-leak SDK watermarks a player ID on screen' (visible, cropable)"
  proposed: "embed a tester-ID spread-spectrum mark in the rendered frame via the SDK render hook; decode service returns tester ID and confidence from 10+ seconds of re-encoded video"
  shallow: false
  mechanism: "the capture SDK already sits on the render path; it adds an imperceptible per-tester pattern to the framebuffer, so both the vendor capture and any third-party screen recording carry it; decode API takes a URL and returns tester ID, build and session date"
  example: "A leaked 480p re-upload is decoded to tester #3127, session of 14 Oct; legal sends the NDA breach notice the same day and the beta key is revoked."
  cost: M
  depends_on: "SDK render-path hook (already needed for capture); key management per beta; ciso-3 to find the clip"
  buyer: "CISO / IP protection lead; legal counsel as co-signer"
  input: "beta-and-early-access-testers device render + tester ID from the beta key system"
  why_existing_tools_cannot: "market.md section 1: the only anti-leak feature found (Antidote) is a visible on-screen player ID, removable by cropping; no source in market.md decodes attribution from a re-encoded public clip"
  willingness_to_pay: "4 - leak attribution is a standing AAA ask (persona note in B-perspectives: 'leak liability'); priced per beta window; anchors are Antidote $115-$475 per game per month (market.md section 1)"

- id: ciso-5
  title: "Embargo-zone capture mask: segments recorded inside levels, modes or characters flagged 'unannounced' in the build manifest are never uploaded; only derived event labels leave the device"
  level: L4
  cell: {video-source: own-players-consented-sdk, signal-extracted: structured-game-state-reconstruction, processing-location: on-device, companion-data: telemetry-events, constraint-to-overcome: studio-ip-and-prerelease-leak, lifecycle-moment: soft-launch}
  object: "methods-churn-funnel.md section 7 inferred: '(e) on-device CV that uploads only extracted events/labels plus a few keyframes'"
  situation: "soft-launch build in 3 countries contains a dormant season-2 map and an unannounced character reachable by 0.5% of players through an exploit or a hidden flag"
  consequence: "a fleet-wide capture SDK would upload footage of content that marketing will not reveal for 4 months; CISO forbids capture in the soft-launch build unless the zones are masked"
  p_typical: 0.03
  grounded: inferred
  evidence: "methods-churn-funnel.md section 7: '(e) on-device CV that uploads only extracted events/labels plus a few keyframes'"
  proposed: "build pipeline exports a list of zone IDs and asset IDs with a reveal date; SDK reads the game's current zone from telemetry; while in an embargoed zone it keeps only event labels (fail, retry, idle seconds) and discards pixels"
  shallow: false
  mechanism: "a manifest of embargoed zone IDs is signed by the studio and shipped in the build; the SDK checks the zone event stream and switches the encoder off while inside; analysts see a 'masked segment, 74 s, zone S2_MAP_03' placeholder with the labels"
  example: "Soft launch of a mobile midcore F2P in Canada, Philippines, Denmark: 0.4% of sessions enter the hidden season-2 arena; those 74-second segments arrive as labels only and the funnel report still counts them."
  cost: S
  depends_on: "capture SDK with zone-aware toggle; studio telemetry emitting zone or level IDs"
  buyer: "CISO approving a soft-launch SDK; product lead pays"
  input: "own-players-consented-sdk + telemetry-events (zone/level ID) + build-and-config-metadata (embargo list)"
  why_existing_tools_cannot: "market.md section 2: session-replay SDKs (UXCam, Smartlook, PostHog Unity) mask native text fields at best and have no notion of game zone or reveal date"
  willingness_to_pay: "3 - bundled feature, not a SKU; without it the soft-launch capture contract (product budget, PlaytestCloud-scale EUR 13.6k+/yr per market.md signals) is vetoed"

- id: ciso-6
  title: "Viewer audit log streamed to the studio SIEM: every play, scrub and export of a clip by any vendor or studio user, with seconds watched"
  level: L4
  cell: {delivery-form: api-or-sdk, constraint-to-overcome: security-review-soc2-residency, buyer-org-type: aaa-studio, processing-location: vendor-cloud, effort: S-weeks, value-lever-b2b: reduce-cost-per-incident}
  object: "market.md section 1: PlaytestCloud 'most results within 48 hours' with per-player recordings reviewed; Player Research described as 'people-heavy agency'"
  situation: "vendor-risk questionnaire line 'who at the vendor can view customer data and how is access logged'; or a leak investigation needing to know which 6 people watched a clip before it surfaced"
  consequence: "without per-clip access logs the studio cannot exclude the vendor as the leak source; the security review stalls on the access-control section"
  p_typical: 0.08
  grounded: inferred
  evidence: "market.md section 1: managed playtest analysis and agencies imply human vendor viewers; no source in market.md mentions viewing audit logs"
  proposed: "emit one event per play/seek/export (user, clip ID, start-end seconds, IP, device) as JSON to the customer's Splunk/Datadog/Sentinel endpoint within 60 s; vendor staff access requires a customer-approved ticket ID"
  shallow: false
  mechanism: "the player component logs every range request; a just-in-time access broker denies vendor-staff playback unless the customer approved a time-boxed grant; logs are pushed, not pulled"
  example: "After a leak, the CISO queries Splunk: clip 88213 was watched by 4 studio users and 1 vendor analyst for 22 seconds under grant #455; the vendor is cleared within an hour."
  cost: S
  depends_on: "existing User Test player; SSO/SAML; a webhook or syslog exporter"
  buyer: "CISO / vendor-risk reviewer"
  input: "all footage held by the vendor + identity provider data"
  why_existing_tools_cannot: "market.md sections 1-2: playtest and session-replay vendors document recording and AI summary features; none of the extracts lists viewer-level audit export"
  willingness_to_pay: "2 - table stakes, not separately paid; it removes a blocker in a deal priced at EUR 13.6k-33.9k/yr (market.md signals)"

- id: ciso-7
  title: "Player-PII scrubber for production footage: player names, chat panel, OS notifications and payment sheets blurred on-device before upload"
  level: L4
  cell: {video-source: own-players-consented-sdk, signal-extracted: social-or-chat-content, processing-location: on-device, constraint-to-overcome: privacy-and-consent, game-platform-and-genre: mobile-midcore-f2p, capture-trigger-and-sampling: event-triggered-clip}
