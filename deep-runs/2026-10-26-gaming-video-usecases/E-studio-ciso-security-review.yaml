  level: L4
  cell: {video-source: internal-qa-builds, signal-extracted: on-screen-text-ocr, analysis-type: anomaly-alert, delivery-form: issue-tracker-ticket, buyer-org-type: aaa-studio, constraint-to-overcome: studio-ip-and-prerelease-leak, automation-level: auto-created-ticket-or-asset}
  object: "adjacent-usecases.md section 1: '247 industrial QA videos and 100 long videos (41 hours) from an industrial QA pipeline'; 'many flagged anomalies were on-screen log messages'"
  situation: "QA bug tickets carry attached videos; the Jira project is shared with an outsourced QA vendor; some clips show a debug console with a staging token or an admin web panel"
  consequence: "credentials leak to third-party tester rigs via Jira attachments; rotation happens only after an incident"
  p_typical: 0.02
  grounded: inferred
  evidence: "adjacent-usecases.md section 1: bug reports in industrial QA pipelines 'already include gameplay video' and 'many flagged anomalies were on-screen log messages'"
  proposed: "OCR every attached QA clip at 1 fps, run secret patterns (AWS key regex, JWT, bearer, internal domains), open a security ticket with frame and timestamp, and quarantine the attachment from external Jira groups"
  shallow: false
  mechanism: "a Jira/Perforce webhook sends each new video attachment to OCR; regex plus entropy detectors flag secrets; the ticket is auto-restricted and a rotation task is filed"
