- id: indie-1
  title: "Weekly 'why they quit level 3' digest: three 10-second death/quit clips with a one-line cause each, for a solo dev's Steam Playtest or early-access build"
  level: L4
  cell: {buyer-role: design-balance, video-source: beta-and-early-access-testers, signal-extracted: input-timing-and-hesitation, analysis-type: funnel-drop-off-why, lifecycle-moment: prototype-and-greenlight, delivery-form: weekly-digest-email, pricing-model: freemium-self-serve, buyer-org-type: indie-studio, capture-trigger-and-sampling: event-triggered-clip, go-to-market-channel: engine-asset-store-or-marketplace, effort: S-weeks}
  object: "Steam Playtest child app (market.md section 1, Valve): 'No recording or analysis is provided.'"
  situation: "40 testers on a Steam Playtest build; 25 never get past level 3; the dev has no analytics events beyond 'level_start' and cannot watch 25 sessions"
  consequence: "Dev guesses (nerf the boss? add a tutorial?) and ships the wrong fix; one wrong fix costs a 2-week sprint of a 1-person studio"
  p_typical: 0.14
  grounded: inferred
  evidence: "market.md section 1: 'This free distribution channel is a substitute for recruitment, but it leaves a gap: no capture and no analysis. A vendor could fill that gap.'"
  proposed: "Engine plugin drops a 60 s ring buffer, uploads only the last 10 s before each quit/death on level 3, a VLM labels cause (unseen hazard, unclear UI, unfair spike), Monday email lists top 3 causes with clips"
  shallow: false
  mechanism: "Ring-buffer capture keyed on quit or 3rd death in a level, VLM cause labelling, ranked by number of testers affected; runs for the dev who has no analyst"
  example: "Platformer level 3: 14 of 25 quitters died to an off-screen saw blade within 2 s of a camera pan; digest says 'camera reveals hazard too late', dev moves the camera trigger"
  cost: M
  depends_on: "Unity/Godot capture plugin; existing video ingestion and report agent"
  buyer: "Solo developer / founder of a 1-3 person indie studio"
  input: "Own-build ring-buffer clips from Steam Playtest testers plus level_start and death events"
  why_existing_tools_cannot: "market.md section 1: Steam Playtest gives no recording or analysis; PlaytestCloud AI reads transcripts and surveys not pixels and costs about EUR 113 per session; IV Metrics caps at 50 videos for $49 and shows them to a human only (section 2)"
  willingness_to_pay: "4: $29-49/month; anchor IV Metrics Indie $49/month (50 videos) and We Playtest Games $79/month (market.md)"

