  why_existing_tools_cannot: "Feature databases are analyst-built or store-metadata tagged (competitor-and-ua.md section 1); no vendor does CV deconstruction of gameplay (market.md section 9)"
  willingness_to_pay: "3 - intel buyers pay GameRefinery about $45-51k/year for feature data (competitor-and-ua.md section 1 Prices); this is one slice of that"

