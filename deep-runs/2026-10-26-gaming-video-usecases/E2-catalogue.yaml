  level: L3
  cell: {buyer-role: platform-owner, video-source: platform-or-emulator-capture, signal-extracted: structured-game-state-reconstruction, analysis-type: cohort-comparison, lifecycle-moment: publisher-pitch-or-diligence, delivery-form: dashboard, value-lever-b2b: de-risk-a-go-kill-decision, buyer-org-type: subscription-catalogue-operator}
  object: "competitor-and-ua.md section 1: GameRefinery tracks about 260 features 'manually' by analysts; automated tags read 'app-store metadata ... not gameplay video'"
  situation: "The operator is offered a third extraction shooter while two similar titles are already in the catalogue"
  consequence: "Licence spend goes to titles that add a new kind of session instead of a third copy of the same one; the curator sees overlap in play, not in store genre tags"
  p_typical: 0.06
  grounded: inferred
  evidence: "'The input is store metadata, not gameplay video' (competitor-and-ua.md section 1); scout-6 clone-risk check uses similarity for a different buyer and decision"
  proposed: "Dashboard tile per candidate: 5 nearest catalogue titles with similarity score, side-by-side 10 s clips, co-play share among their subscribers"
  shallow: false
  mechanism: "Embedding from sampled frames (screen-class sequence, action density per minute, camera mode, HUD layout) computed from platform capture of catalogue titles and from a bot or panel run of the candidate; cosine similarity; joined with the service's co-play table"
  example: "Candidate extraction shooter at 0.86 to an existing title whose 72% of active players also play the third; curator passes and licenses a cozy farming title at 0.41 to its nearest neighbour"
  cost: M
  depends_on: "platform capture across the catalogue; catalog-3 or a bot run for the candidate"
  buyer: "Catalogue strategy lead at a subscription service"
