- id: catalog-1
  title: "Tried-and-bounced share per catalogue title: % of subscribers whose total lifetime play is under 20 minutes, split by the screen class they left on (character creator, shader-compile wait, publisher account-link, forced tutorial, first fail screen), benchmarked against the catalogue median for the genre"
  level: L4
  cell: {buyer-role: platform-owner, video-source: cloud-gaming-server-render, signal-extracted: ui-state-and-screen-flow, analysis-type: benchmark-vs-competitor, lifecycle-moment: sunset-decision, delivery-form: per-cohort-report, game-platform-and-genre: cloud-streamed, buyer-org-type: subscription-catalogue-operator}
  object: "methods-churn-funnel.md section 2 INFERRED: 'the exact screen state at the moment of app kill (rage quit vs. interruption)' is visible in video but not in standard event streams"
  situation: "A catalogue lead holds 400 titles and sees launches and hours per title, but not why 41% of a title's launchers never pass 20 minutes; the licence for that title renews in 90 days"
  consequence: "Without the exit-screen split, a high bounce share reads as 'players do not like it' and the title is dropped; with it, the lead sees that 60% of bouncers left on a publisher account-link screen, which is a fixable contract item and not a content verdict"
  p_typical: 0.16
  grounded: inferred
  evidence: "'Signals that exist in screen video ... the exact screen state at the moment of app kill' (methods-churn-funnel.md section 2 INFERRED); 'a 30-minute first session at 2 Mbps is about 450 MB of upload' does not apply when frames render in the service's data centre (methods-churn-funnel.md section 7)"
  proposed: "Quarterly per-title row: launchers, bounce share, top 3 exit screens with share and 3 clips each, genre-median bounce share"
  shallow: false
  mechanism: "Server-side tap of the cloud encoder output at 1 fps for the last 120 s of every session under 20 cumulative minutes; per-title screen classifier bootstrapped by a general VLM labels the exit screen; aggregates joined to the service's own launch and hours tables"
  example: "A AAA open-world title: 41% bounce vs 22% genre median; 58% of bouncers exit on the publisher account-link screen; the lead asks the publisher to remove the link requirement before renewal instead of dropping the title"
  cost: M
  depends_on: "encoder tap on the cloud stack; per-title screen classifier; subscriber terms that cover service-quality analysis of streamed sessions"
  buyer: "Catalogue and content lead at a subscription service with a cloud tier (Game Pass Ultimate / PlayStation Plus Premium class)"
  input: "cloud-gaming-server-render frames + the service's own launch, session and hours tables"
  why_existing_tools_cannot: "Funnels show where, not why, and only for events the studio instrumented (methods-churn-funnel.md Signals complaints); the catalogue operator does not receive studio telemetry, and playtest vendors measure recruited testers only (market.md section 1 Antidote 'Does NOT do')"
  willingness_to_pay: "4 - catalogue operators already buy title-level intelligence at the scale of Sensor Tower's $75k median contract (competitor-and-ua.md section 1 Prices); the output feeds licence spend far above that"

- id: catalog-2
  title: "Engaged-hours audit for engagement-based payouts: of each title's billed play hours, the share that is actual play vs pause menu, idle-in-hub over 5 minutes, login or matchmaking queue, and AFK farming loops, reported per title per month"
  level: L4
  cell: {buyer-role: platform-owner, video-source: cloud-gaming-server-render, signal-extracted: load-and-wait-screens, analysis-type: compliance-audit, lifecycle-moment: sunset-decision, delivery-form: warehouse-table-export, pricing-model: annual-enterprise-licence, value-lever-b2b: create-data-that-did-not-exist, buyer-org-type: subscription-catalogue-operator}
  object: "methods-churn-funnel.md section 1 INFERRED / section 2: telemetry sees session length; 'pause/menu toggling' and idle time are listed as video-only signals"
  situation: "Part of a title's licence fee is tied to hours played on the service; one title's hours rose 30% after an update that added an idle-reward loop"
  consequence: "The operator pays for hours in which nobody is playing; the audit gives a per-title 'engaged-hours' column that renegotiation can cite, and exposes titles whose hours are inflated by AFK loops"
  p_typical: 0.04
  grounded: speculative
  evidence: "Engagement-linked licence terms are not described in the notes; idle and menu toggling as video-only signals are (methods-churn-funnel.md section 2 INFERRED)"
  proposed: "Monthly warehouse table: title_id, billed_hours, engaged_hours, pause_hours, queue_hours, afk_loop_hours, sample_n"
  shallow: false
  mechanism: "1 fps frame sample plus controller-input stream; a frame is 'engaged' when gameplay screen class and non-zero input within 30 s coincide; pause, queue and loading screens classified per title; repeated identical input cycles over 10 minutes flagged as AFK loop"
  example: "A survival title: 1.2M billed hours in March, 31% of them in a camp screen with no input for over 5 minutes after the idle-crafting update; the operator cites the engaged-hours figure in the payout review"
  cost: M
  depends_on: "catalog-1 encoder tap; contract language that defines engaged hours; publisher acceptance of the method"
  buyer: "Catalogue finance and content-licensing lead at a subscription service"
  input: "cloud-gaming-server-render frames + controller input + billed-hours ledger"
  why_existing_tools_cannot: "Hours come from session start and end events, which cannot tell a pause menu or idle hub from play (methods-churn-funnel.md section 2); fps and counters tools measure performance, not play (adjacent-usecases.md section 6)"
  willingness_to_pay: "4 - recovers licence spend directly; comparable 'pay to extend coverage' buying is Sensor Tower's acquisitions of Playliner and Video Game Insights (competitor-and-ua.md section 8)"

- id: catalog-3
  title: "Pre-signing catalogue fit test: a candidate title's build is hosted on the service's own cloud servers, 60 opted-in subscribers play 2 sessions each, and the report gives predicted bounce share, minutes to first core action and session-2 return against the 5 most similar titles already in the catalogue"
  level: L4
  cell: {buyer-role: publishing-scout-bd, video-source: cloud-gaming-server-render, signal-extracted: input-timing-and-hesitation, analysis-type: benchmark-vs-competitor, lifecycle-moment: publisher-pitch-or-diligence, delivery-form: per-cohort-report, constraint-to-overcome: studio-ip-and-prerelease-leak, pricing-model: per-audit-or-certification, buyer-org-type: subscription-catalogue-operator}
  object: "market.md section 1 Antidote: 'Also offers cloud-streaming playtests' (recruited testers, no churn link); scout-1 does the same for publishers with recruited testers"
  situation: "A publisher offers a mid-size title for a 24-month catalogue deal; the operator must decide in 3 weeks and has only the publisher's own sales and review numbers"
  consequence: "The operator prices the deal against comparable in-catalogue titles measured the same way; the build never leaves the operator's servers, so the publisher accepts the test"
  p_typical: 0.12
  grounded: inferred
  evidence: "Antidote cloud-streaming playtests exist for recruited testers (market.md section 1); 'Does NOT do: no churn or LTV link'; ciso-23 server-rendered playtests show the leak argument"
  proposed: "Fixed-fee diligence pack, 10 working days, 6 metrics each as a percentile against the 5 nearest catalogue titles, 12 clips"
  shallow: false
  mechanism: "Build hosted on cloud blades; opted-in subscriber panel invited with a reward; encoder tap at 2 fps; same classifier and metric set as catalog-1 run on both the candidate and the 5 nearest catalogue titles (nearest by genre tag and catalog-4 loop embedding)"
  example: "A co-op roguelite: minutes to first run 4.1 vs comp median 2.3; session-2 return 68% vs comp 51%; the operator offers a longer term at a lower upfront fee"
  cost: M
  depends_on: "ability to host unreleased or unlisted builds on the cloud tier; opted-in subscriber panel; catalog-1 metric library"
  buyer: "Content acquisition lead at a subscription service"
  input: "cloud-gaming-server-render frames of panel sessions + controller input + the service's own metrics for comparable titles"
  why_existing_tools_cannot: "Playtest vendors report one game's recruited testers with no cross-title benchmark from pixels (market.md section 9 gap map); public benchmarks miss top studios that keep data in-house (methods-churn-funnel.md section 1)"
  willingness_to_pay: "4 - publishers pay EUR 113-141 per recorded session (market.md section 1); 120 sessions here is about EUR 14-17k, small against a catalogue deal"

