- id: f2p-1
  case: >-
    Explore later, do not build first. The live-player version depends on a production capture SDK (f2p-2) that does not exist yet. Apple's
    2019 Glassbox action requires explicit consent and a visible recording indicator (methods-churn-funnel.md §7), so the consent prompt
    becomes one more FTUE step, and the players who opt in during their first session are the ones least likely to abandon. The reason codes
    are weaker than they look. Card dismissed in under 1 s, CTA not tapped, 3+ fails, app backgrounded and OS interruption can all be
    logged as events, and the methods note says so itself ("most of these can in principle be instrumented as events"). UXCam already ships
    rage-tap and unresponsive-gesture detection, and Amplitude sold EA the funnel-plus-Session-Replay pairing (methods-churn-funnel.md §1, §2,
    §6). That puts an analytics incumbent one game-canvas feature away. The "why" has to be inferred from behaviour with no think-aloud, and
    the per-title screen classifier trained on "a few hundred frames" is an INFERRED guess, not a measured accuracy. That makes it per-title
    setup work every time a studio signs. The price anchor (€113-141 per session) comes from research budgets for recruited panels. No note
    shows a product lead with a budget line for video evidence; that buyer's money currently goes to GameAnalytics and Amplitude seats. The
    proposed first ship, "repackage User Test on recruited footage", is already served by PlaytestCloud First Findings, which groups friction
    by theme and links each point to its clip (market.md §1).
- id: altdata-22
  case: >-
    Defer. Cheap to build, but also cheap to copy, and the market is about three logos. The named buyers are Liftoff/GameRefinery and Sensor
    Tower/Playliner, plus perhaps AppMagic (competitor-and-ua.md §1). Both of the big two are acquisitive, well-funded firms. Vungle bought
    GameRefinery explicitly for image recognition and creative tagging, and a generic Gemini video call (1 FPS, about 6 h in context)
    already gets most of the way to "propose tags with timestamps". That is why moat scores 2. Human-verified deconstruction is the product
    these firms sell, so an outside vendor sitting inside that loop, holding their taxonomy and footage, is a procurement and IP hurdle, not a
    quick seat sale. The WTP line borrows the $45-115k/yr end-customer contract price, but no note shows these firms buying external analyst
    tooling at all; "no collection tooling is named" is an absence, not demand. Accuracy is unproven for this task. Many of the 260 features
    (meta loops, economy depth) never appear in a single 2-hour session, and VLMs are "substantially" weaker on temporal events
    (methods-churn-funnel.md §4). Analysts would still verify every tag, so the "days to hours" target is unsupported.
- id: design-18
  case: >-
    Drop as a first product; at most a delivery wrapper on f2p-1/design-2 later. It is grounded only by inference (p_typical 0.09). The
    cited evidence is a turnaround time and a D1 benchmark. No note shows a studio buying a "levels to retune" package. The "which levels"
    half is already served. GameAnalytics progression funnels give per-level Fail/Complete ratios and are recommended for spotting
    "where difficulty spikes may cause churn", and Rovio/Aalto predict per-level difficulty and churn without any players
    (methods-churn-funnel.md §1, §3). Only the "why" is new, and about 500 clips over 60 levels is roughly 8 clips a level, too few to carry
    a "64% of clips" claim. The figures in the example, such as "expected fail -15%", are invented. Delivery needs a capture SDK and consent
    flow inside the soft-launch build before launch, while the sales cycle has to fit a soft-launch window of a few weeks. The analyst-led
    managed service has services margins and does not use the founder's automated stack as its edge. PlaytestCloud can put L23 in front
    of recruited testers in 48 hours as it stands.
- id: design-2
  case: >-
    The mechanism has a likely fatal flaw, so explore, do not build. The design holds the last-attempt clip on the device "until the 7-day
    churn label resolves". But a churned player by definition does not open the app for those 7 days, so the game never runs to upload it.
    Many churners uninstall, which deletes the buffer, and iOS background upload is limited. The clips arrive mainly from players who came
    back, who are by definition not churners. The fix is to upload every session's last attempt eagerly and discard later. That brings back
    the bandwidth, Wi-Fi-wait and consent cost the option was meant to avoid (methods-churn-funnel.md §7). The anchor statistic (Roohi
    r = -0.586) comes from simulated agent populations on Angry Birds levels. It links churn to failure moments, not to anything a clip can
    explain. A clip reel is human viewing, and IV Metrics already records rendered Unity gameplay video with touch overlay for $49-99/month
    (market.md §2). It is one "trigger on level fail" setting from this, and that price sets the WTP ceiling far below 4. The EA
    30%-onboarding evidence belongs to Amplitude, an incumbent.
- id: vendor-10
  case: >-
    Defer. Capture is the hard, unsolved part, and the founder's existing assets do not cover it. Logging live events across 2,000 games
    every day means someone or something has to play each game daily, progressed far enough to unlock event shops, in each region. Live
    events "are announced without notice and cannot be scraped" (adjacent-usecases.md §7). No note shows bot playthroughs reliably
    reaching gated live-ops screens in live F2P games. nunu.ai and Cradle prove that agents can play, not that this works at fleet scale.
    Botting competitor titles also raises ToS problems. Ingestion and reporting, the parts the founder already has, are the easy part. The
    buyer pool is the same two or three intel firms as altdata-22 (it is also a variant of compintel-18). Sensor Tower just bought Playliner
    for this function and could extend it in-house. The acquisition prices cited (data.ai about $300M) value data businesses, not suppliers
    of tooling, so they do not show that a tooling vendor gets paid. OCR on stylised event and store fonts is a stated weak point
    (methods-churn-funnel.md §4), and localised price parsing at 2,000-game scale would push many rows to "low confidence". That erodes the
    claimed labour saving.
