- id: tns-1
  title: "Report button auto-attaches a 90-second ring-buffer clip with kill-feed and player-name OCR to the moderation ticket"
  level: L4
  cell: {buyer-role: trust-safety, video-source: own-players-consented-sdk, signal-extracted: on-screen-text-ocr, analysis-type: evidence-pack-for-enforcement, capture-trigger-and-sampling: on-player-report, delivery-form: issue-tracker-ticket, game-platform-and-genre: competitive-multiplayer}
  object: "Activision/Modulate case study figure 'only about 23% of player reports contained actionable evidence' (adjacent-usecases.md section 3)"
  situation: "A player taps Report on a teammate after a round; today the ticket holds a name and a category, and the moderator has no footage."
  consequence: "Moderators close roughly 77% of reports for lack of evidence; with a clip each report becomes decidable in one review of 90 seconds."
  p_typical: 0.25
  grounded: quote
  evidence: "adjacent-usecases.md section 3: 'only about 23% of player reports contained actionable evidence'; section 9: 'NOT FOUND: no off-the-shelf vendor of a rolling last-30-seconds game-client buffer attached to a ticket'"
  proposed: "Ring buffer of 90 s on device, uploaded only when Report is pressed; OCR reads the kill feed lines and the names in the HUD and writes them into the ticket fields."
  shallow: false
  mechanism: "On report, the SDK uploads the buffered 90 s; a game-specific OCR/UI detector extracts accused player ID, kill-feed entries and the timestamp of the first contested event; the ticket is created with those fields filled."
  example: "5v5 shooter: player reports 'aimbot'; ticket arrives with clip, three kill-feed lines naming the accused and a marker at 0:41 where the accused turns 180 degrees and kills in 0.2 s."
  cost: M
  depends_on: "capture SDK with ring buffer and consent prompt; a report button in the client; a ticket queue (Jira/Zendesk) with an API"
  buyer: "Trust and safety lead at a mid-size or AAA studio running a competitive multiplayer title"
  input: "Consented on-device screen video (ring buffer) plus the report payload (reporter ID, accused ID, match ID)"
  why_existing_tools_cannot: "Voice and text moderation (Modulate, GGWP) never see the screen, and the support clip buffers (Fullview, Screendesk) are non-game browser tools; no game-client buffer attached to a ticket was found (adjacent-usecases.md sections 3 and 9)."
  willingness_to_pay: "4 - Modulate lists up to USD 20,000/month for voice hours and Activision runs it at scale (adjacent-usecases.md section 3), so T&S has a budget line for evidence; priced here per report-clip or per MAU."

- id: tns-2
  title: "Second-look review of a server-flagged cheater: the AI watches the 30-second clip around the flag and recommends confirm, refute or escalate before any ban"
  level: L4
  cell: {buyer-role: trust-safety, video-source: own-players-consented-sdk, signal-extracted: player-skill-and-mechanics, analysis-type: evidence-pack-for-enforcement, companion-data: touch-and-controller-input, automation-level: recommendation, constraint-to-overcome: accuracy-and-trust, value-lever-b2b: reduce-cost-per-incident}
  object: "Server-side LSTM 'reached 88.6% accuracy with 0.97% false-positive rate' and FACEIT 'no ban is triggered solely by its flag' (adjacent-usecases.md section 2)"
  situation: "An ML layer flags 1,000 accounts in a week; at 0.97% false positives on, say, 100,000 reviewed accounts about 970 innocent players are flagged."
  consequence: "Wrongful bans produce appeals, refunds and press; a visual second opinion lowers the number of accounts a human must open."
  p_typical: 0.06
  grounded: quote
  evidence: "adjacent-usecases.md section 2: authors 'stress false accusations as the key risk'; FACEIT: 'no ban is triggered solely by its flag'"
  proposed: "Flag event triggers a clip upload; the AI lines up input trace and video and returns a verdict with the frames it relied on; humans see only 'refute' and 'escalate' cases."
  shallow: false
  mechanism: "VLM plus input-trace comparison on the clip around a server flag; outputs a three-way verdict and the 3 frames that support it; refuted cases are auto-cleared from the review queue."
  example: "Battle royale: flag for 'inhuman recoil control'; clip shows the player using a controller with strong aim-assist and a legitimate spray pattern; verdict 'refute', account stays unbanned."
  cost: M
  depends_on: "server-side flagging model already in place; event-triggered clip capture; input trace alongside video"
  buyer: "Trust and safety lead or anti-cheat operations manager at a studio or tournament platform"
  input: "Event-triggered video clip plus input trace plus the server flag score and features"
  why_existing_tools_cannot: "Anybrain and FACEIT's Human Input Detection judge inputs, not pixels, and only Anybrain mentions supporting appeals; no vendor of vision-based review of flags was found (adjacent-usecases.md section 2)."
  willingness_to_pay: "3 - no public anti-cheat price exists (adjacent-usecases.md section 2, 'enterprise quote only'); value is fewer appeals and refunds."

- id: tns-3
  title: "Pixel-bot and aimbot trajectory detector: compares crosshair motion in the clip against the touch or controller input trace"
  level: L4
  cell: {buyer-role: trust-safety, video-source: own-players-consented-sdk, signal-extracted: bot-or-fraud-behaviour, analysis-type: anomaly-alert, companion-data: touch-and-controller-input, constraint-to-overcome: anti-cheat-conflict, processing-location: edge-or-platform-server, game-platform-and-genre: competitive-multiplayer}
  object: "'computer-vision aimbots (read the screen, evade memory scanning)' and FACEIT's statement that AI-based and DMA cheats were 40% of cheating bans in May 2026 (adjacent-usecases.md section 2)"
  situation: "A screen-reading bot moves the crosshair with injected mouse events; memory scanners see nothing, and the input trace shows movement that does not correspond to any human wrist path."
  consequence: "Cheats that evade memory scanning survive; 40% of May 2026 FACEIT cheating bans were AI or DMA cheats."
  p_typical: 0.12
  grounded: quote
  evidence: "adjacent-usecases.md section 2: 'vision-cheat growth (screen-reading bots) is the reason video-level detection is a live problem; sellers of it are few'"
  proposed: "Per-match feature: ratio of on-screen target-acquisition frames to input events, flagged when acquisition occurs in under 100 ms with zero overshoot across 20 kills."
  shallow: false
  mechanism: "Detect target and crosshair position per frame, compute acquisition latency and overshoot, and score against the input trace; flags matches where video and input agree too perfectly or disagree with the human motor profile."
  example: "Tactical shooter: account scores 11 flick kills with 0 px overshoot and 70 ms acquisition in one match; alert goes to the T&S queue with the clip."
  cost: L
  depends_on: "game-specific crosshair and enemy detector; clip plus input capture; baseline human distribution per game"
  buyer: "Anti-cheat or trust and safety lead at a PC competitive-shooter studio"
  input: "Event-triggered clips plus raw input stream and server hit events"
  why_existing_tools_cannot: "Riot Vanguard and Ricochet work on kernel and server-side input signals, not video; the only vision work found is academic (VADNet, arXiv 2103.10031) (adjacent-usecases.md section 2)."
  willingness_to_pay: "3 - Anybrain claims >99% detection but publishes no price; FACEIT built its own layer in Season 9 (5 Aug 2026), showing the operators fund this themselves (adjacent-usecases.md section 2)."

- id: tns-4
  title: "Emulator and bot-farm cluster detector: finds hundreds of accounts whose captured screen flows are frame-identical"
  level: L4
  cell: {buyer-role: trust-safety, video-source: platform-or-emulator-capture, signal-extracted: bot-or-fraud-behaviour, analysis-type: cohort-comparison, effort: requires-partner-or-platform-deal, buyer-org-type: platform-or-store, game-platform-and-genre: mobile-midcore-f2p, pricing-model: per-mau}
  object: "'fraud (bots and emulator farms)' visible on screen; platform-owner perspective 'video of thousands of games without an SDK' (B-perspectives.yaml); Medal 'about 2 billion clips/year' (market.md section 4)"
  situation: "A mobile RPG's event leaderboard is topped by 300 accounts that all open the same 7 screens in the same order with tap timing variance under 30 ms."
  consequence: "Real players abandon the leaderboard; bot rewards inflate the economy; today detection depends on server timing signals the botter has learned to randomise."
  p_typical: 0.05
  grounded: inferred
  evidence: "adjacent-usecases.md section 2: 'players submit video clips of suspected cheaters... volunteer Discord groups'; no source covers bot-farm detection from video"
  proposed: "Hash the sequence of detected UI states per session, cluster sessions with identical sequences and sub-human timing variance, return account lists."
  shallow: false
  mechanism: "UI-state sequence fingerprinting on sampled platform-side video; clusters of near-identical flows with scripted tap cadence are scored as farms."
  example: "Emulator vendor samples 1% of sessions of a gacha game; finds 312 accounts running the same 9-screen daily loop with 11 ms timing variance; sends the list to the studio."
  cost: L
  depends_on: "emulator or platform capture deal; per-title UI-state detector; account ID mapping"
  buyer: "Trust and safety or fraud lead at a mobile studio, or platform-integrity lead at an emulator or app-store owner"
  input: "Platform-side screen video of emulator sessions plus account and device IDs"
  why_existing_tools_cannot: "Session replay and event analytics see accounts one at a time and tools reading store metadata do not see play at all (competitor-and-ua.md section 1; market.md section 2 'Does NOT do')."
  willingness_to_pay: "2 - no price evidence in the notes; buyer signal is the platform-owner perspective only and the deal needs a partner."

