  depends_on: "consent for continuous capture; storage and bandwidth budget"
  buyer: "Trust and safety lead (would refuse), CFO and privacy counsel veto"
  input: "Continuous screen video of every player"
  why_existing_tools_cannot: "Not a gap; sampling and ring buffers (Sentry pattern, Steam) already solve evidence capture at a fraction of the volume (methods-churn-funnel.md section 6)."
  willingness_to_pay: "1 - refuse: cost per session dominates; storage is cheap at USD 0.04 per player-hour-month but upload and consent are the constraints (methods-churn-funnel.md section 7)."

