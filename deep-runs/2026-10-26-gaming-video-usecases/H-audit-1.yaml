contested_themes:
  - theme: "Licensing gameplay footage + inputs to AI labs"
    positive_ids: [data-1, cfo-11, data-17, platform-11, vendor-19, data-20, privacy-17]
    refusal_ids: [privacy-18, ciso-14, indie-25, data-16, oem-22, creator-27, liveops-22, outsource-24, support-30, tns-29]
    disagreement: "Consent and rights. A separate AI-training opt-in with a payout, sold by the rights holder, is accepted. Reuse under the analytics EULA, platform capture without a licence from each studio, and any vendor resale clause are refused (studio IP, minors in the sample)."
  - theme: "Emotion / arousal from gameplay pixels"
    positive_ids: [ds-7, design-11, uxr-15, sdk-24, privacy-19]
    refusal_ids: [bi-26, vendor-22, publisher-13, data-30, altdata-20, f2p-25, oem-23, design-21, scout-24]
    disagreement: "Validity and actionability against regulation. Aggregate curves per level, with 50 or more sessions behind each, tested against outcomes, pass. A per-session or per-title score with no link to a step or outcome is refused, and EU AI Act disclosure applies."
  - theme: "Closed-loop in-session intervention"
    positive_ids: [ds-23, f2p-11, design-16, liveops-15, adnet-25, support-17]
    refusal_ids: [indie-26, cfo-19, monet-26, cto-22, platform-30, design-23, a11y-26, player-25]
    disagreement: "A hint or help prompt with a built-in holdout is accepted. A currency gift or discount (IAP cannibalisation, about 8% in cfo-19), a monetised trigger on frustration (manipulation), a cloud model in the frame loop, or auto-tuning without a designer is refused."
  - theme: "Unattended AI verdicts (release gates, badges, tickets, bans, sign-offs)"
    positive_ids: [publisher-18, platform-24, indie-4, qa-10, outsource-16]
    refusal_ids: [qa-9, a11y-28, uxr-26, outsource-22, privacy-20, cert-25, rating-25, support-29, esports-25, loc-23]
    disagreement: "Automation level. Buyers accept AI that triages and recommends. Owners of the decision refuse verdicts with no human sign-off, citing VLM precision of about 0.50 and the 16% who fully trust AI QA."
  - theme: "Cross-game benchmarks and market-intel feeds built from platform capture"
    positive_ids: [platform-28, altdata-15, compintel-14, platform-1, liveops-28, altdata-7]
    refusal_ids: [ciso-26, altdata-19, oem-24, esports-26]
    disagreement: "Market-intel buyers would pay 4. The observed studio treats the feed as its IP handed to rivals and may retaliate. Aggregates only, no clips and a per-studio opt-out is the proposed compromise; platform-28 meets none of these conditions."
  - theme: "Generic ask-a-question / AI-summary product"
    positive_ids: [indie-3, f2p-12, liveops-17, vendor-20, publisher-25]
    refusal_ids: [ds-21, cfo-13, monet-30, bi-25, compintel-32]
    disagreement: "Commoditisation. Chat scoped to a step or offer that returns clip lists and structured rows is bought. Prose-only chat or summaries over all sessions are refused because the BI team can reproduce them with Gemini at 1 fps."
  - theme: "Capture scope: trigger-scoped ring buffer vs always-on"
    positive_ids: [sdk-1, support-1, tns-1, qa-1, creator-1]
    refusal_ids: [player-27, privacy-14, rating-26, tns-27, cfo-7, f2p-22]
    disagreement: "A ring buffer that uploads only on a trigger passes. Holding all sessions from install, attaching voice chat, recording minors or capturing every install priced per MAU is refused on consent, battery and backlash grounds."
  - theme: "Per-case evidence packs for bans and appeals"
    positive_ids: [support-11, tns-16, platform-22, privacy-21]
    refusal_ids: [cfo-23, privacy-20]
    disagreement: "T&S and support want a clip and input timeline per appeal. The CFO refuses packs priced per case for studios without competitive operations, because one wrongful-ban dispute costs more than a year of fees."
  - theme: "Processing location: vendor cloud vs studio cloud for pre-release footage"
    positive_ids: [cfo-1, monet-28, platform-16]
    refusal_ids: [a11y-31, loc-26, cert-26, ciso-12, platform-14, bi-30]
    disagreement: "Per-session pricing in the vendor cloud is the default economics. Release, localisation and security owners refuse vendor-cloud upload of unreleased builds. The BYOC tier (cfo-25, at a 40% premium) is the price of passing review."
  - theme: "Video-only performance measurement vs counters"
    positive_ids: [oem-3, cto-17, oem-14, scout-9]
    refusal_ids: [qa-8, cert-27]
    disagreement: "OEMs value perceived smoothness measured at the display output. QA and cert refuse video-derived FPS as a replacement for GameBench/PerfDog counters on cert floors."
  - theme: "Ad creatives cut from real player footage"
    positive_ids: [ua-17, publisher-22, ua-4, ua-24]
    refusal_ids: [brand-25, creator-26]
    disagreement: "UA wants volume from consented footage. Brand and community refuse it because friend lists and logos are visible and per-clip rights are missing, and they refuse auto-publishing without approval of each clip."
  - theme: "Competitor teardown as a self-serve or managed product"
    positive_ids: [indie-6, cfo-4, compintel-1]
    refusal_ids: [compintel-32, compintel-29, altdata-24]
    disagreement: "Price and commoditisation. Automated per-title extraction that replaces a $45-75k subscription is bought. A YouTube-link wrapper (a general video LLM does 80% of it free) and a $2,000 managed PDF per game are refused."
  - theme: "Paying players to share sessions"
    positive_ids: [cfo-26, data-20, creator-17, support-9, platform-29]
    refusal_ids: [player-23, player-12]
    disagreement: "Soft-currency payment for consent is accepted. Swapping out a rewarded ad (lost ad revenue) and a bonus per cited clip (biases what players share) are refused."

expert_missing:
  # "A founder who has sold analytics to 20 game studios reads the 943 titles; the first 10 options they say are missing."
  - "Live-services SRE pager from players' screens: on-call engineer at a live-service studio; input: SDK keyframes sampled at 1/min plus region, ISP and build; mechanism: OCR plus classifier counts 'connection lost', 'server maintenance' and login-error dialogs per region every 5 min and pages PagerDuty when the rate triples, before tickets or social posts arrive."
  - "Store-review-to-clip join: product lead at a mobile F2P studio; input: App Store / Google Play review text plus consented SDK clips from the same build, device and country; mechanism: clusters 1-3 star review topics ('stuck at level 40', 'ads after every level') and attaches matching clips with the share of sessions that show the same moment, separating real defects from venting."
  - "Narrative engagement map: narrative director at a single-player console studio; input: beta or recruited footage plus subtitle track; mechanism: per cutscene and dialogue node it measures skip rate, time to skip, dwell on choices and quest-log opens within 60 s after a story beat, flagging 'lost the plot' points before lock."
  - "Audio QA bug detector: QA director at a AAA studio; input: internal QA rig footage with game audio plus build metadata; mechanism: detects missing SFX on animation events, looping or cut-off VO, music silence, clipping above -1 dBFS and A/V offset over 80 ms, filing one Jira ticket per event type with the clip."
  - "Official esports data feed from broadcast: league data-rights lead at a mobile esports league; input: broadcast VOD and live stream; mechanism: HUD OCR and kill-feed parsing rebuild game state (gold, kills, objectives) into a low-latency API sold to betting operators and broadcast graphics, for titles with no official data API."
  - "Patch-notes and known-issues drafter: community manager at a live-service studio; input: nightly bot-route diff of build N vs N-1 plus open Jira clusters; mechanism: lists every visible change (new shop tab, rebalanced numbers read by OCR, moved buttons) and drafts player-facing patch notes with GIFs, plus a 'known issues' list from the top visual bug clusters."
  - "72-hour launch war-room board: executive producer at a studio launching a title; input: SDK ring-buffer clips, helpdesk ticket clips and public TikTok/Twitch clips; mechanism: merges all three into one hourly ranked list of the top 5 visible problems by affected sessions and views, each with a clip, an owner and its trend since launch."
  - "Twitch Drops / sponsored watch-time farming detector: creator-program manager paying for a Drops campaign; input: public live streams of the game during the campaign; mechanism: detects looped footage, menu-idle AFK streams and identical frame sequences across channels and credits only active-gameplay minutes in the campaign invoice."
  - "Localisation reception from own-title creator streams: localisation lead at a publisher shipping in 12 languages; input: public JP, BR, DE and TR streams of its own game plus transcripts; mechanism: aligns streamer speech ('this translation makes no sense') with the on-screen string ID and screen, ranking strings by complaints per 1,000 stream minutes per language."
  - "Cloud-gaming idle-session reclaim: capacity lead at a cloud-gaming service; input: server-rendered frames at 0.2 fps plus controller input stream; mechanism: classifies menu-idle, pause-screen and AFK states over 5+ minutes, warns the player, then suspends the GPU instance, reporting GPU-hours saved per title."

yield_estimate: 0.05
# Basis: a fill over the 8 empty cells at 10-12 options each gives about 90 raw options. Measured duplicate pressure in G-counts:
# about 5% absorbed as exact duplicates (48 of 997 in) and about 26% carried variants_of (262 of 997). Four of the 8 cells border an
# existing label (netcode vs support-16/oem-15, esports integrity vs esports-10, UGC rating vs platform-9, coaching vs the refused
# real-time overlays), so expect 40-50% of a fill to land as duplicates or variants. That leaves about 45-55 genuinely new options,
# about 0.05 of 943. The base will also shrink when the cross-bucket dedupe finishes, but that does not raise the absolute yield.
# This is BELOW 0.10: stop the generation loop. If anything is run, make it one targeted pass on cells 1, 2, 5 and 6 (netcode, IP
# enforcement, UGC rating, subscription catalogue), and add the 10 expert_missing lines directly, without another full loop.
