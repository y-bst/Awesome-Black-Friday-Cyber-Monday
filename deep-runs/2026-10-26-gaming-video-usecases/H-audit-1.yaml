# Stage H audit, loop 1 (IDEATE run). Read: A-frame, B-perspectives, C-axes, G-counts-1..6, G-titles-all.txt (943), research/*.
# Method: buyer-role x video-source / analysis-type / delivery-form pairs were counted over the normalised cells of the 943 merged leaves
# (positive options only), then every candidate cell was searched in title + situation + mechanism + example + input + buyer of all
# G-merged-*.yaml leaves before it was listed. Most strictly label-empty 4-tuples are nonsense combinations (for example
# data-buyer-training x weekly-digest-email), so each cell below names its 4 axes plus one qualifier key where the qualifier is what
# makes it empty. Where a different situation sits under the same 4 labels, the cell says so in `label_neighbour`.

empty_cells:
  - cell:
      buyer-role: engineering-performance
      video-source: own-players-consented-sdk
      analysis-type: root-cause-of-a-metric-change
      delivery-form: issue-tracker-ticket
      qualifier: "companion-data: server tick and ping logs, game-platform-and-genre: competitive-multiplayer, signal: rubber-banding, hit-registration mismatch, desync"
      label_neighbour: [support-16, oem-15, cto-18]  # these cover fps/thermal lag and hitches, not netcode
    brief: >
      No leaf covers online play as the player saw it: rubber-banding, 'I shot first' hit-registration disputes and desync, matched to server
      tick and ping logs. Re-walk cto-or-engine-lead-veto as an online-services/netcode lead (or add that perspective) for 10+ options on what the
      player's screen proves against the server log, by region, ISP and build.
  - cell:
      buyer-role: finance-exec   # studio legal/IP counsel paid from the exec budget; no legal role in C-axes
      video-source: competitor-store-and-ad-video
      analysis-type: evidence-pack-for-enforcement
      delivery-form: enforcement-or-cert-evidence-pack
      qualifier: "signal: our gameplay or UI reused in a clone app or in another advertiser's video ad"
      label_neighbour: [scout-6, ciso-3, ciso-19]  # pitch-build clone risk, pre-release leaks, scam lures; none is clones or ad theft in live stores
    brief: >
      Nothing detects copycat apps or rival video ads that reuse a studio's own footage, UI or mechanic, and nothing assembles the takedown or
      store-complaint pack. Have studio-ciso-security-review (IP-protection hat) plus competitive-intel-analyst write 10+ options over store
      listings, preview videos and ad libraries (Meta Ads Library, TikTok Creative Center), with frame-matched evidence per infringing item.
  - cell:
      buyer-role: esports-team-or-league
      video-source: esports-vod
      analysis-type: anomaly-alert
      delivery-form: alert-or-slack
      qualifier: "signal: deliberate under-performance and betting-linked match-fixing"
      label_neighbour: [esports-10, esports-8]  # pause abuse, map-bug exploits and qualifier cheating, not fixing
    brief: >
      The pairs esports-team-or-league x alert-or-slack and x api-or-sdk have 0 options, and no text mentions match-fixing, throwing or betting
      integrity. Re-walk esports-coach as a league integrity and data-rights officer (ESIC-style) for 10+ options: throw detection from mechanics,
      live alerts during broadcast, and integrity evidence for sanctions.
  - cell:
      buyer-role: product-retention
      video-source: own-players-consented-sdk
      analysis-type: coaching-feedback
      delivery-form: api-or-sdk
      qualifier: "automation-level: post-session only (not the real-time overlays refused in esports-24, cto-22, platform-30)"
      label_neighbour: [esports-15, esports-20]  # emulator coach mode and a weekly digest sold to players, not to the studio
    brief: >
      product-retention x coaching-feedback has 0 options: nobody sells a studio a post-match 'review your last game' feature it embeds for its own
      players as a retention lever (new ranked players, D7). f2p-product-lead plus esports-coach should write 10+ options covering mistake cards,
      death recaps and drills, each with a retention holdout.
  - cell:
      buyer-role: platform-owner   # UGC platform (Roblox / UEFN class)
      video-source: automated-bot-or-agent-playthrough
      analysis-type: content-rating-classification
      delivery-form: api-or-sdk
      qualifier: "game-platform-and-genre: ugc-platform-experiences"
      label_neighbour: [platform-9]  # app-store build submission rating; no leaf rates UGC experiences
    brief: >
      UGC experiences appear only as signs and banners (tns-5), brand adjacency (brand-16) and monetisation tracking (altdata-13). Nothing labels the
      maturity or content of 100k+ creator-made experiences, which are self-declared today. platform-owner plus rating-and-consumer-protection-compliance
      plus trust-and-safety-lead should write 10+ options: maturity labels, re-rating after an update, gambling-like mechanics, and creator appeal packs.
  - cell:
      buyer-role: platform-owner   # subscription catalogue (Game Pass, Apple Arcade, Netflix Games class)
      video-source: cloud-gaming-server-render
      analysis-type: benchmark-vs-competitor
      delivery-form: per-cohort-report
      qualifier: "lifecycle-moment: catalogue licence renewal or sunset-decision"
      label_neighbour: [platform-16]  # a per-title funnel for publishers; no leaf has the curator as buyer
    brief: >
      No leaf mentions subscription services or catalogue curators, although they pay studios to license titles and decide renewals. platform-owner
      should be re-walked as a subscription catalogue lead for 10+ options: title quality versus the catalogue, the 'tried and bounced' share,
      the content runway, and evidence for renewal or removal, from server-side frames they already render.
  - cell:
      buyer-role: outsourced-qa-vendor
      video-source: public-streams-and-ugc
      analysis-type: bug-reproduction
      delivery-form: per-cohort-report
      qualifier: "go-to-market-channel: through-services-vendor (pre-sales audit of a prospect's live game)"
      label_neighbour: []
    brief: >
      outsourced-qa-vendor has 0 options on 12 of 16 video sources, own-player and public footage among them. All 15 vendor rows read the vendor's own
      rigs. outsourced-qa-and-loc-vendor should write 10+ options in which the vendor uses public streams and store videos of a prospect's
      shipped game as a free bug, localisation or accessibility audit that opens a deal, plus post-sale coverage of players' real devices.
  - cell:
      buyer-role: trust-safety
      video-source: automated-bot-or-agent-playthrough
      analysis-type: anomaly-alert
      delivery-form: enforcement-or-cert-evidence-pack
      qualifier: "capture-trigger-and-sampling: scheduled spectator bots in live top-ladder matches and public lobbies, before any report"
      label_neighbour: [tns-22, tns-6]  # these review rounds that were already flagged, or use spectator video after a report
    brief: >
      trust-safety x automated-bot has 0 options. Every T&S leaf reacts to a report, a server flag or a public clip. trust-and-safety-lead should write
      10+ proactive options: spectator bots on high-MMR matches to find closet cheaters, gold-seller and scam-bot sweeps of public hubs,
      and honeypot lobbies, each ending in a human-reviewed evidence pack.

