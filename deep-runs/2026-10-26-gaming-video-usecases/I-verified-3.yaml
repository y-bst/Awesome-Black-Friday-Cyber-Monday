  example: 'Tutorial step 3 ''build the farm'': 22 of 30 clips show the player dragging the farm onto water tiles that do not accept it, then closing the app'
  cost: M
  depends_on: Capture SDK with consent UI and trigger API; funnel events from the studio's analytics
  buyer: UX researcher embedded in a live mobile F2P team
  input: Consented live-player ring-buffer clips + funnel/progression events
  why_existing_tools_cannot: 'methods-churn-funnel.md s6: replay tools fall back to screenshots or show nothing useful for game canvases; market.md s9 gap map: no vendor links CV on production player video to retention'
  willingness_to_pay: 4 - UXCam median about $21k/yr for generic replay (market.md s2) and EUR 13.6k-33.9k/yr for playtests (market.md WTP) are both budgets this competes for
  already_offered: false
  perspective: game-ux-researcher
  cell_values_added:
  - 'signal-extracted: input-timing-and-hesitation'
  - 'capture-trigger-and-sampling: always-on-ring-buffer'
  - 'capture-trigger-and-sampling: opt-in-panel'
