  grounded: quote
  evidence: 'methods-churn-funnel.md section 1: Electronic Arts ''funnel analysis exposed onboarding friction, then Session Replay was used to review those interactions'' (Amplitude case study); Unity docs: unexpected drop-offs
    ''indicate good places to investigate game play, user interface, or other issues'''
  proposed: Ring buffer of 60 s keyed on 'session end within 120 s of step N start without step N complete'
