  object: PlaytestCloud multi-session tests 'check whether players remember early tutorial elements in later sessions' (methods-churn-funnel.md s2); longitudinal set-up fee 8.7 Video Tokens (methods-churn-funnel.md s7)
  situation: A 5-day longitudinal test of 10 players where the day-3 survey asks 'do you remember how to X', which primes the answer
  consequence: Survey recall overstates learning; behavioural detection shows e.g. 4 of 10 never used dodge again after the tutorial, which predicts mid-game difficulty walls
  p_typical: 0.05
  grounded: quote
  evidence: 'methods-churn-funnel.md s2: ''PlaytestCloud multi-session tests check whether players remember early tutorial elements in later sessions'''
  proposed: Per-mechanic usage curve by day and participant, with first unprompted use timestamp
  shallow: false
  mechanism: Detect mechanic-specific visual signatures (merge animation, dodge roll, crafting screen) per session; compute first unprompted use after the tutorial and frequency per day; join across the participant's sessions
  example: 'Action RPG longitudinal test: dodge used by 9/10 in the tutorial, 4/10 on day 2, 3/10 on day 3; designers add a forced dodge encounter at the start of chapter 2'
  cost: M
  depends_on: Per-mechanic detectors per title; participant ID stable across sessions
  buyer: UX researcher running longitudinal tests at a midcore or PC studio
  input: Multi-day recruited playtester videos + participant ID + session dates
  why_existing_tools_cannot: 'methods-churn-funnel.md s2: recall is checked by asking; market.md s1: PlaytestCloud AI reads transcripts, not mechanic use in pixels'
  willingness_to_pay: 3 - longitudinal tests already carry an 8.7-token set-up fee (about EUR 1,000, methods-churn-funnel.md s7), so buyers of them have budget, but they are a minority of tests
  already_offered: false
  perspective: game-ux-researcher
  cell_values_added:
  - 'lifecycle-moment: ftue-first-session'
  - 'game-platform-and-genre: pc'
- id: uxr-7
  title: 'Panel-bias calibration: same FTUE step coded for 12 paid testers and 200 consented live players, showing where testers behave unlike real players (e.g. testers read tutorial cards 4x longer)'
  level: L4
  cell:
    buyer-role: ux-research
    video-source: own-players-consented-sdk
    signal-extracted: input-timing-and-hesitation
    analysis-type: cohort-comparison
    lifecycle-moment: ftue-first-session
    delivery-form: per-cohort-report
    constraint-to-overcome: sampling-bias
    capture-trigger-and-sampling: targeted-cohort
    buyer-org-type: publisher
    value-lever-b2b: increase-coverage-from-sample-to-all
  object: Testers are 'paid about $5-9 USD for a 15-minute playtest plus survey' (market.md s1); '>80%' of players clicked straight through the instruction screen at live events (methods-churn-funnel.md s2)
  situation: Lab test shows tutorial cards understood; live funnel shows 12% leave at step 3; researcher cannot tell whether the lab or the build is wrong
  consequence: Without calibration, research findings get dismissed by product ('testers are not our players'); with it, the researcher can state which lab findings transfer and which are artefacts of paid attention
  p_typical: 0.03
  grounded: inferred
  evidence: 'methods-churn-funnel.md section 2 INFERRED: ''Playtest video (PlaytestCloud et al.) gives the "why" but from recruited testers with think-aloud, small n; in-the-wild device video would give large n without think-aloud'';
    market.md section 1: tester-side complaints about ''low pay for the effort'''
  proposed: 'One chart per FTUE step: lab vs live distribution of dwell, skip and mis-tap, with a ''transfers / does not transfer'' verdict'
  shallow: false
  mechanism: Run the same per-title screen classifier and hesitation metrics on both sources; compare distributions per step (card dwell, skip rate, retries); flag steps where lab and live differ by >2x
  example: 'Casual merge game: lab testers read card 2 for median 6 s, live players for 1.4 s and 63% skip it; the team stops using lab tests to validate tutorial text length'
  cost: M
  depends_on: Consented live-player capture SDK at the FTUE (the f2p-product-lead option); same classifier for both sources
  buyer: Head of games user research at a publisher with both a playtest budget and live games
  input: Recruited playtester video + consented live-player FTUE clips + funnel step events
  why_existing_tools_cannot: 'market.md s1: PlaytestCloud and Antidote analyse only recruited testers ''not the studio''s live players''; methods-churn-funnel.md s6: replay tools record live players but do not interpret game
    state'
  willingness_to_pay: 2 - valuable to the research team's credibility, but no budget line exists for 'validating our own method'; sold only as a feature of a combined lab+live product
  already_offered: false
  perspective: game-ux-researcher
  cell_values_added:
  - 'buyer-org-type: publisher'
  - 'value-lever-b2b: increase-coverage-from-sample-to-all'
