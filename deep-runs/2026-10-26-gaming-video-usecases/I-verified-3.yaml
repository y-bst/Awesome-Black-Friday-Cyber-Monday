    companion-data: touch-and-controller-input
    effort: L-multi-quarter
    constraint-to-overcome: per-game-ui-generalisation
    game-platform-and-genre: competitive-multiplayer
  object: Footsteps, reload and objective-complete sounds in a multiplayer match recording
  situation: A hard-of-hearing player relies on visual indicators; the lead wants a list of gameplay-relevant sounds that never get an on-screen counterpart
  consequence: Off-screen enemy footsteps are the only warning in 100% of flank deaths; nobody lists these sounds today
  p_typical: 0.03
  grounded: speculative
  evidence: none
  proposed: 'Ticket per sound class: occurrences, share with a visual indicator within 500 ms, example clips'
  shallow: false
  mechanism: Classify game SFX from audio, detect HUD indicator changes in the same 500 ms window from video, report sound classes whose indicator rate is below 50%
  example: 'Footstep SFX: 1,240 occurrences in 20 matches, 3% with any directional HUD cue; flagged for the design backlog'
  cost: L
  depends_on: SFX classifier per game; HUD change detector; deterministic QA captures with audio
  buyer: Accessibility lead at a studio shipping a competitive multiplayer title
  input: Match recordings with audio from internal QA, plus controller input log
  why_existing_tools_cannot: 'adjacent-usecases.md section 4: no vendor does footage-based accessibility checks; section 3: audio AI exists only for voice toxicity'
  willingness_to_pay: 2 - no price signal; buyer would likely fund it only if bundled into an audit priced like MGATS
  already_offered: false
  perspective: accessibility-compliance-officer
