  title: 'Why-clips for a chosen funnel step: researcher picks the step with the drop (e.g. 12% leave at tutorial step 3) and gets 30 coded ring-buffer clips from consented players who quit there'
  level: L3
  cell:
    buyer-role: ux-research
    video-source: own-players-consented-sdk
