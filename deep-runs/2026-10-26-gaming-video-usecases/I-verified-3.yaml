  object: Full-screen flashes in explosion and lightning effects across 40 levels
  situation: A new VFX pass adds strobing; the lead needs a per-level flash count before release
  consequence: A seizure-risk sequence reaches players; remediation after launch costs a patch plus platform re-review
  p_typical: 0.06
  grounded: inferred
  evidence: 'adjacent-usecases.md section 4 names flashing as a candidate pixel-checkable item with no vendor found; section 1: nunu.ai and modl.ai agents already produce bot footage'
  proposed: 'Per-level table: max flashes per second, share of frame area, worst clip; fail line at 3 flashes per second'
  shallow: false
  mechanism: Compute luminance and red-saturation change per frame over a sliding 1-second window on the bot footage, count transitions over a set area fraction, rank levels
  example: 'Level 17 boss: 5 flashes per second over 38% of frame for 2.4 seconds; clip attached to the VFX ticket'
  cost: S
  depends_on: Bot playthrough footage that reaches every level (nunu.ai or in-house bot)
  buyer: Accessibility and compliance lead at a publisher
  input: Bot-recorded video of each level plus build metadata
  why_existing_tools_cannot: 'adjacent-usecases.md section 4: flashing named as candidate, no vendor found; market.md section 3: QA agents report bugs, not flash rates'
  willingness_to_pay: 2 - cheap to compute so a standalone price would be low; only a bundled per-audit price (adjacent-usecases.md section 4, MGATS 150-250 hours) is evidenced
  already_offered: false
  perspective: accessibility-compliance-officer
  cell_values_added:
  - 'signal-extracted: accessibility-contrast-and-subtitles'
  - 'companion-data: build-and-config-metadata'
