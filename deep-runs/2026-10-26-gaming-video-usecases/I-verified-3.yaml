  object: Weekly shipping builds of a mobile midcore game; settings menu text-size slider and subtitle toggle
  situation: A weekly build changes the font atlas; the signed-off 1.0 text scale silently drops by 12%
  consequence: Accessibility passes at launch and erodes release by release; per-build manual audits are skipped for cost
  p_typical: 0.07
  grounded: inferred
  evidence: 'adjacent-usecases.md section 4: ''expert and disabled-player playthroughs; video is evidence, not the analysis input'' (audits are human work per submission); methods-churn-funnel.md section 4 INFERRED: ''Mature,
    cheap pieces: menu/screen classification, button/popup detection (mAP ~90% on mobile games)''. Inference: a per-build bot diff reuses those detectors on a fixed screen list'
  proposed: Slack alert when any of 20 tracked screens differs by more than 5% in text height or 0.5 in contrast ratio from the baseline build
  shallow: false
  mechanism: Bot visits a fixed list of 20 screens each build, measures text height and contrast per screen, compares with the stored baseline, alerts on deltas over thresholds
  example: 'Build 3.12: shop screen body text height down 12% and contrast 4.1:1 vs baseline 5.0:1, alert posted with both screenshots'
  cost: M
  depends_on: Scheduled bot playthrough that reaches the 20 screens; a baseline store per build
  buyer: Accessibility lead at a mid-size mobile studio that ships weekly
  input: Bot-captured video and screenshots per build, build and config metadata
  why_existing_tools_cannot: 'market.md section 3: GameDriver and modl.ai test function and bugs, not text metrics; adjacent-usecases.md section 4: accessibility audits are human and per build'
  willingness_to_pay: 2 - GameDriver starter plans from USD 150 per month (market.md section 3) is the nearest price for build-level automation
  already_offered: false
  perspective: accessibility-compliance-officer
