- id: uxr-5
  title: 'Task-success scoring per participant: success / fail / gave-up / needed-moderator-help, time-on-task, and number of wrong screens visited, for 5-8 scripted tasks'
  level: L4
  cell:
    buyer-role: ux-research
    video-source: recruited-playtesters
    signal-extracted:
    - ui-state-and-screen-flow
    - speech-or-think-aloud
    analysis-type: funnel-drop-off-why
    lifecycle-moment: new-version-release
    delivery-form: per-cohort-report
    automation-level: insight-for-human
  object: Task script of a usability playtest; GameAnalytics docs recommend Progression events for 'tutorial steps, level completion' (methods-churn-funnel.md s1)
  situation: A usability test with 8 participants and 6 tasks ('claim daily reward', 'join a guild', 'upgrade a hero') on a build without event instrumentation for those tasks
  consequence: 'Without instrumentation the researcher hand-times every task; with scoring, the report reads e.g. ''join a guild: 3/8 success, median 2:40, 5 visited the Friends screen first'''
  p_typical: 0.12
  grounded: inferred
  evidence: 'methods-churn-funnel.md s1 INFERRED: ''Funnel quality is bounded by instrumentation: a step that was never instrumented ... does not exist in the data''; s4: mobile-game button/popup detection mAP 91.9%'
  proposed: Researcher defines each task by a start screen and a success screen; system computes path and time between them
  shallow: false
  mechanism: Screen classifier labels every frame; task windows are bounded by researcher-marked start and success screens; path length and wrong-screen visits are counted; 'needed help' detected from moderator speech in the
    transcript
  example: 'Guild feature usability test: 5 of 8 open Friends before Guild; the team moves the Guild entry out of the Social submenu before the update ships'
  cost: S
  depends_on: Per-title screen labels; researcher UI to mark start and success screens once
  buyer: UX researcher at a mobile midcore studio
  input: Recruited playtester video + task script + moderator transcript
  why_existing_tools_cannot: 'methods-churn-funnel.md s1: Unity and GameAnalytics funnels need events instrumented in advance and Unity funnels cannot be edited without invalidating data; playtest vendors (market.md s1) do
    not score tasks from pixels'
  willingness_to_pay: '3 - standard usability metric; researchers will expect it in the base playtest price rather than pay extra (market.md WTP: AI ''included at no extra charge'' at PlaytestCloud per adjacent-usecases.md
    s10)'
  already_offered: false
  perspective: game-ux-researcher
  cell_values_added:
  - 'signal-extracted: speech-or-think-aloud'
- id: uxr-6
  title: 'Retention-of-learning check in multi-day tests: detects whether a mechanic taught on day 1 (e.g. merge, dodge, crafting) is used unprompted on day 3, per participant, without asking'
  level: L4
  cell:
    buyer-role: ux-research
