# in 180; rejected 2; merged duplicates 5; surviving 173. Not ranked.
- id: a11y-1
  title: Subtitle size and contrast sweep over cutscene footage, one clip per failing line
  level: L4
  cell:
    buyer-role: accessibility-compliance
    video-source: internal-qa-builds
    signal-extracted:
    - accessibility-contrast-and-subtitles
    - on-screen-text-ocr
    analysis-type: compliance-audit
    lifecycle-moment:
    - pre-launch-qa
    - certification-submission
    delivery-form: enforcement-or-cert-evidence-pack
    companion-data: build-and-config-metadata
    pricing-model: per-build-or-release
    game-platform-and-genre:
    - single-player-narrative
    - pc
    - console
    buyer-org-type: publisher
    value-lever-b2b:
    - replace-labour-hours
    - avoid-fine-or-cert-failure
  object: MGATS 'concerns' that carry repro steps, expected/actual and video examples against Xbox Accessibility Guidelines v3.2 (adjacent-usecases.md section 4)
  situation: A narrative game has 40 minutes of cutscenes and 212 subtitle lines; the accessibility lead needs to know which lines fall under the studio's own size and contrast threshold before submission
  consequence: Today an expert watches the footage by hand; lines over snow or fire backgrounds fail contrast and are found only in the MGATS round, about 7 business days later
  p_typical: 0.08
  grounded: inferred
  evidence: 'adjacent-usecases.md section 4: ''NOT FOUND: no AI product that audits gameplay footage for subtitles, contrast or colourblind issues''; MGATS turnaround goal about 7 business days'
  proposed: 'Per-line report: timestamp, subtitle crop, glyph height as % of frame height, contrast ratio against the 5x5 patch behind it, pass/fail against thresholds in a config file'
  shallow: false
  mechanism: OCR the subtitle band per frame, measure glyph height and contrast ratio (default 4.5:1) against the sampled background, group per line, emit a clip and crop for each failure
  example: 'Build 1.4.2, reel of 212 lines: 31 lines under 4.5:1 over snow scenes, each delivered as a 3-second clip with the measured ratio'
  cost: M
  depends_on: QA footage ingestion (exists in User Test product); a subtitle-region detector per title
  buyer: Accessibility and compliance lead at a publisher shipping narrative console/PC titles
  input: Recorded cutscene and QA playthrough video from internal builds plus build and config metadata (subtitle size setting)
  why_existing_tools_cannot: 'adjacent-usecases.md section 4: MGATS and AbleGamers are human-led and no vendor audits subtitles from footage; generic AI audit tools target web WCAG, not game canvases'
  willingness_to_pay: 3 - MGATS is priced by 150-250 testing hours (adjacent-usecases.md section 4); at outsourced QA rates of USD 15-50 per hour (section 1) one cycle is roughly USD 2,300-12,500, so a per-build pre-check
    is priced against that
  already_offered: false
  perspective: accessibility-compliance-officer
  cell_values_added:
  - 'signal-extracted: on-screen-text-ocr'
  - 'lifecycle-moment: certification-submission'
  - 'game-platform-and-genre: pc'
  - 'game-platform-and-genre: console'
  - 'buyer-org-type: publisher'
  - 'value-lever-b2b: replace-labour-hours'
  - 'value-lever-b2b: avoid-fine-or-cert-failure'
- id: a11y-2
  title: Colour-only cue detector that replays footage through three colour-vision simulations
  level: L4
  cell:
    buyer-role: accessibility-compliance
    video-source: automated-bot-or-agent-playthrough
    signal-extracted: accessibility-contrast-and-subtitles
    analysis-type: compliance-audit
    lifecycle-moment: pre-launch-qa
    delivery-form: issue-tracker-ticket
    companion-data: build-and-config-metadata
    effort: M-one-quarter
    pricing-model: per-build-or-release
    game-platform-and-genre: competitive-multiplayer
    buyer-org-type: publisher
    value-lever-b2b: avoid-fine-or-cert-failure
    automation-level: auto-created-ticket-or-asset
  object: Team markers, rarity colours and health-bar states in a competitive shooter HUD; Xbox Accessibility Guidelines colour-only cue concern
  situation: Red and green team outlines in a 5v5 shooter; the lead must show whether a deuteranope can tell them apart
  consequence: A colour-only cue ships unflagged; the first report is a player complaint or a platform audit failure
  p_typical: 0.06
  grounded: inferred
  evidence: 'adjacent-usecases.md section 4: ''INFERRED: checkable-from-pixels items (subtitle size/contrast, flashing, colour-only cues) are candidates; no vendor found doing it'''
  proposed: Ticket per UI element pair whose simulated colour distance falls below a set threshold, with side-by-side original and simulated frames
  shallow: false
  mechanism: Segment HUD elements that change state, transform each frame through protanopia, deuteranopia and tritanopia matrices, flag element pairs whose mean colour distance falls below a threshold while the shape and
    icon are identical
  example: 'Team outline red vs green: distance under threshold in deuteranopia on 100% of sampled frames, no icon difference; ticket opened with 6 frame pairs'
  cost: M
  depends_on: A bot or QA capture that visits each HUD state; a HUD element segmenter
  buyer: Accessibility lead at a publisher with a multiplayer title
  input: Bot or QA playthrough video of the HUD states, build metadata for the colour-blind mode setting
  why_existing_tools_cannot: 'adjacent-usecases.md section 4: no vendor audits colour-only cues from footage; market.md section 3: AI QA agents (modl.ai, nunu.ai) look for bugs, not accessibility defects'
  willingness_to_pay: 2 - no price signal exists for this check; only the MGATS 150-250 hour benchmark (adjacent-usecases.md section 4) sets the human cost it replaces
  already_offered: false
  perspective: accessibility-compliance-officer
  cell_values_added:
  - 'buyer-org-type: publisher'
  - 'value-lever-b2b: avoid-fine-or-cert-failure'
  - 'automation-level: auto-created-ticket-or-asset'
- id: a11y-3
  title: 'Subtitle coverage ratio: spoken lines in the audio track that never appear as on-screen text'
  level: L4
  cell:
    buyer-role: accessibility-compliance
    video-source: internal-qa-builds
    signal-extracted:
    - speech-or-think-aloud
    - on-screen-text-ocr
    - accessibility-contrast-and-subtitles
    - game-audio-and-sfx
    analysis-type: compliance-audit
    lifecycle-moment: certification-submission
    delivery-form: enforcement-or-cert-evidence-pack
    companion-data: build-and-config-metadata
    pricing-model: per-audit-or-certification
    game-platform-and-genre:
    - single-player-narrative
    - console
    buyer-org-type: publisher
  object: Dialogue audio track against the subtitle band in the same recording (MGATS evidence format, adjacent-usecases.md section 4)
  situation: A 12-hour campaign recorded by QA with subtitles on; ambient barks and radio chatter are voiced but not captioned
  consequence: Deaf and hard-of-hearing players miss plot-relevant lines; the gap is found only if a human listens and reads at the same time
  p_typical: 0.05
  grounded: inferred
  evidence: 'adjacent-usecases.md section 4: expert and disabled-player playthroughs are the method; ''video is evidence, not the analysis input'''
  proposed: 'Coverage report: voiced lines, captioned lines, ratio, list of uncaptioned lines with timestamps and speaker'
  shallow: false
  mechanism: Run speech recognition on the game audio, OCR the subtitle band, align by time, report lines with no match within 1.5 seconds and subtitles that lag speech by more than 500 ms
  example: 'Chapter 6 reel: 412 voiced lines, 371 captioned (90%), 41 uncaptioned radio barks listed with timestamps'
  cost: M
  depends_on: Transcription already exists in the User Test product; add a subtitle-band OCR and an aligner
  buyer: Accessibility and compliance lead at a publisher or console-first studio
  input: QA footage with the game audio channel plus subtitle setting metadata
  why_existing_tools_cannot: 'adjacent-usecases.md section 4: no AI product audits subtitles from footage; Can I Play That? audits are human-led'
  willingness_to_pay: 3 - same per-audit anchor as MGATS (150-250 testing hours, adjacent-usecases.md section 4); no fixed fee published
  already_offered: false
  perspective: accessibility-compliance-officer
  cell_values_added:
  - 'signal-extracted: on-screen-text-ocr'
  - 'signal-extracted: accessibility-contrast-and-subtitles'
  - 'signal-extracted: game-audio-and-sfx'
  - 'game-platform-and-genre: console'
  - 'buyer-org-type: publisher'
- id: a11y-4
  title: 'Audio-cue visual-counterpart check: sound effects with no on-screen indicator within 500 ms'
  level: L4
  cell:
    buyer-role: accessibility-compliance
    video-source: internal-qa-builds
    signal-extracted: game-audio-and-sfx
    analysis-type: compliance-audit
    lifecycle-moment: pre-launch-qa
