- id: cert-1
  title: "Controller-disconnect pause check: bot pulls the pad at 3 moments and the detector times the on-screen reconnect message"
  level: L4
  cell: {buyer-role: certification-release, video-source: automated-bot-or-agent-playthrough, signal-extracted: ui-state-and-screen-flow, analysis-type: compliance-audit, lifecycle-moment: certification-submission, delivery-form: enforcement-or-cert-evidence-pack, companion-data: touch-and-controller-input, game-platform-and-genre: console}
  object: "Dev-kit capture of the reconnect/pause screen after a controller drop; evidence format modelled on MGATS 'concerns' with repro steps, expected/actual and video (adjacent-usecases.md section 4)"
  situation: "Co-op action game on a dev kit; the harness drops pad 1 in the main menu, during a 40-second cutscene and mid-boss-fight, 3 drops per build"
  consequence: "A cutscene drop with no message after 10 seconds is found by the platform tester, not by the studio; the build is returned and the submission slot is lost"
  p_typical: 0.06
  grounded: inferred
  evidence: "none on console certification in the four notes (absence in the notes, not proof of absence in the market); closest: adjacent-usecases.md section 4, MGATS logs failures 'with repro steps, expected/actual results and video/screenshot examples'"
  proposed: "Per-drop verdict: message visible within 2 s yes/no, game clock frozen yes/no, clip of the 15 seconds after the drop"
  shallow: false
  mechanism: "Classify frames after each injected disconnect: message region present within 2 s, frame-difference below threshold (game frozen), message text OCR matches the platform wording; emit pass/fail per moment with the clip"
  example: "Build 0.9.3: menu drop message at +0.8 s pass; combat drop pass at +1.1 s; cutscene drop no message for 10 s, fail, 15-second clip attached to the evidence pack"
  cost: M
  depends_on: "Console dev-kit capture feed and an input-injection harness; screen-state classifier trained on the title's pause and reconnect screens"
  buyer: "Release manager at a console-first studio or publisher"
  input: "Dev-kit HDMI or platform capture video of a scripted playthrough plus controller input log with the disconnect timestamps"
  why_existing_tools_cannot: "market.md section 3: nunu.ai agents are vision-based and test via natural-language commands but are sold as bug finders, and no note lists a vendor that checks platform certification requirements; adjacent-usecases.md section 1: Razer QA Companion-AI is PC-hotkey based"
  willingness_to_pay: "3 - one resubmission loop is the cost avoided (duration not in the notes); human cost it replaces is outsourced QA at USD 15-50 per tester hour (adjacent-usecases.md section 1), so a 30-hour requirement pass per build is USD 450-1,500"

