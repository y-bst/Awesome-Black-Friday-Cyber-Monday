- id: cert-4
  title: "Network-loss error message audit: bot cuts the connection on 12 screens and the detector checks for a message, a dismiss path and a dead end"
  level: L4
  cell: {buyer-role: certification-release, video-source: automated-bot-or-agent-playthrough, signal-extracted: ui-state-and-screen-flow, analysis-type: bug-reproduction, lifecycle-moment: certification-submission, delivery-form: issue-tracker-ticket, companion-data: crash-and-error-logs, game-platform-and-genre: competitive-multiplayer}
  object: "Error dialogs and post-dialog screens captured after an injected connection cut; modl.ai and nunu.ai style agents (market.md section 3)"
  situation: "An online shooter: connection cut in matchmaking, lobby, loading, loadout, store, mid-match and post-match, 12 screens in total; the dismiss button on the 'connection lost' dialog is the object"
  consequence: "Loadout screen shows no message and no exit for 45 seconds, a soft lock that crash logs do not show; the title fails the online-error requirement"
  p_typical: 0.06
  grounded: inferred
  evidence: "none on certification; qa-director persona in B-perspectives.yaml notes 'stuck states... that crash logs never show'; market.md section 3 nunu.ai: agent is 'fully vision-based, taking a live stream from the device and issuing taps'"
  proposed: "Per screen: message seen yes/no, time to message, dismiss reachable yes/no, return-to-menu reachable within 20 s yes/no"
  shallow: false
  mechanism: "Agent navigates to each of 12 screens, a network shim cuts traffic, the detector labels the next 60 seconds: dialog present, button reachable by the agent, menu reached; unrecoverable states reported with the clip"
  example: "Loadout screen: no dialog, agent presses every button for 45 s, no state change: ticket 'soft lock offline at loadout' with 20-second clip"
  cost: M
  depends_on: "Agent that can navigate the build (nunu.ai-class or in-house bot); network fault injection on the dev kit"
  buyer: "Release manager at a studio shipping an online console title"
