  why_existing_tools_cannot: "market.md section 3: AI QA agents are sold as general bug finders and nunu.ai's agent is built to control, not to audit; adjacent-usecases.md section 1: VLM zero-shot precision was 0.50 on 100 industrial videos, so soft-lock claims need a scripted oracle"
  willingness_to_pay: "3 - nunu.ai customer Roboto Games runs 400+ automated tests a month and cites 30-50% QA cost cuts (market.md section 3); GameDriver starts at USD 150 per month (market.md section 3)"

- id: cert-5
