  situation: "A racing game with 14 HUD widgets and 9 menu screens; the 4K build moved the minimap 38 px toward the edge in the last UI pass"
  consequence: "Clipped lap counter on an overscanned TV is found by a platform tester on one SKU; build returned"
  p_typical: 0.07
  grounded: inferred
  evidence: "adjacent-usecases.md section 5: 'wished-for features include language-aware visual anomaly detection (truncation, RTL rendering)'; no note mentions safe areas"
