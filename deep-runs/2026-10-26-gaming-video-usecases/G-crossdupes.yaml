# Stage G cross-bucket dedupe (IDEATE run). Only pairs from different buckets.
# Duplicate = same mechanism + same buyer + same input. Different buyer or delivery form = variant.
# Refusals are never merged; refusal vs positive across buckets = contested.
duplicates:
  - survivor: cto-1
    merged: [ciso-25]
    reason: zero-SDK emulator-side capture of opted-in sessions delivered per title to the studio; product lead pays, CTO/CISO approves; same emulator video + input log
  - survivor: ds-17
    merged: [bi-14]
    reason: first-session store-screen dwell and price OCR turned into payer-propensity features for the analytics owner of the payer model, monetisation lead consuming
  - survivor: ds-2
    merged: [sdk-18]
    reason: app-kill classifier on the last seconds before backgrounding plus OS lifecycle events, splitting fail-screen quits from interruptions, for the churn-model owner and designer
  - survivor: privacy-6
    merged: [sdk-17]
    reason: capture gated on the game's own age-gate result so no minor frame is buffered; privacy counsel buyer; same age-gate signal input
  - survivor: ciso-7
    merged: [sdk-6]
    reason: on-device blur of names, chat panels, OS notifications and payment sheets before encode/upload; privacy counsel and CISO as buyers; same raw device frames
  - survivor: data-17
    merged: [cfo-11]
    reason: studio CFO packages its own consented footage plus synced inputs as a licensed world-model dataset with a revenue share per hour
  - survivor: monet-14
    merged: [liveops-27]
    reason: bot-captured competitor shop screens OCR'd daily and diffed into price-tier change alerts for the studio's monetisation / live-ops manager
  - survivor: altdata-1
    merged: [vendor-10]
    reason: automated live-event logger (35-type taxonomy, OCR of timers and prices, daily diff) sold to a market-intel firm to replace analyst play-and-screenshot logging
  - survivor: liveops-11
    merged: [monet-21]
    reason: season day-1 battle-pass scroll depth and premium-price visibility from pass-screen clips, joined to pass purchases, for live-ops and monetisation lead
  - survivor: monet-1
    merged: [liveops-2]
    reason: per-offer popup render-to-close latency from clips with touch overlay, sub-1 s closes counted as unread, for the monetisation lead (live-ops co-consumer)
  - survivor: tns-9
    merged: [creator-12]
    reason: public TikTok/YouTube clips scanned for impossible currency-counter jumps, alert to live-ops within the hour to disable the exploit
  - survivor: sdk-30
    merged: [tns-19]
    reason: public video matched to pre-release scenes and the per-tester watermark decoded to name the leaker, for the studio security lead
  - survivor: altdata-23
    merged: [compintel-18]
    reason: bot playthrough plus VLM tagging against the 260-feature taxonomy with clip evidence per tag, sold to a market-intel firm to extend deep coverage
  - survivor: ciso-2
    merged: [sdk-12, qa-18]
    reason: whole analysis pipeline deployed in the studio's own AWS/GCP account so pre-release QA footage never reaches the vendor; CISO with QA/research lead as buyers
  - survivor: ciso-6
    merged: [privacy-27]
    reason: per-clip access log of every human or agent read of footage, handed to the vendor-risk reviewer
  - survivor: ua-1
    merged: [f2p-14]
    reason: mechanic shown in each ad creative checked against acquired players' first-session clips joined on MMP creative ID; UA pauses mismatched creatives
  - survivor: publisher-2
    merged: [scout-4]
    reason: last 60 s before app kill for ~300 soft-launch non-returners labelled fixable-screen vs core-loop rejection, for the publisher deciding on the title
  - survivor: uxr-15
    merged: [design-11]
    reason: pixel-only arousal model averaged per level and overlaid on the designer's intended pacing curve, from playtest/beta gameplay video, for the level designer
  - survivor: qa-15
    merged: [cfo-17]
    reason: one bot pass per locale with OCR overflow, truncation, untranslated-key and tofu flags per build, for QA/localisation lead
  - survivor: cert-16
    merged: [a11y-5]
    reason: luminance-flash scan over recorded cutscene/level footage (>3 flashes/s over a large area) with clips, for the publisher's accessibility/release lead
  - survivor: compintel-9
    merged: [ua-6]
    reason: competitor ad-library videos matched scene by scene against agent playthroughs of the same game, for the publisher's CI analyst and UA creative lead
  - survivor: monet-7
    merged: [ua-28]
    reason: consented clips around ad impressions checked for black/frozen/cut-off ad frames vs mediation logs, for the studio monetisation lead re-ordering the waterfall
  - survivor: outsource-1
    merged: [loc-20]
    reason: loc-defect detectors (truncation, overflow, untranslated) run on an LQA vendor's own tester rig recordings, bought by the vendor's ops director
  - survivor: outsource-13
    merged: [a11y-25]
    reason: accessibility detectors (subtitle size, contrast, colour-only cues, flashing) pre-screen a QA vendor's tester rig footage for human confirmation
