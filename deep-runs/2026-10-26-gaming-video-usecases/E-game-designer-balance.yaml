- id: design-10
  title: "Human-vs-bot difficulty gap per new level: agent attempts-to-pass vs human attempts from fail clips, flagging levels where humans need 2x+ the attempts the bot predicts"
  level: L4
  cell: {buyer-role: design-balance, video-source: automated-bot-or-agent-playthrough, signal-extracted: player-skill-and-mechanics, analysis-type: cohort-comparison, lifecycle-moment: pre-launch-qa, delivery-form: per-cohort-report, capture-trigger-and-sampling: scheduled-bot-playthrough, effort: L-multi-quarter}
  object: "Roohi et al. DRL agents on 168 Angry Birds Dream Blast levels (methods-churn-funnel.md §3)"
  situation: "Weekly batch of 20 new levels; bot pass rate predicts difficulty, but the bot reads the board perfectly and humans do not"
  consequence: "Levels with perceptual difficulty (a combo hard to see) ship rated 'easy' and become walls; the gap list names which levels to retune before release"
  p_typical: 0.04
  grounded: inferred
  evidence: "a population model (skill, persistence, boredom) predicts per-level churn (methods-churn-funnel.md §3); AI playtesting 'complements humans, cannot replace them' (adjacent-usecases.md §10)"
  proposed: "Gap ratio column next to the bot's predicted difficulty, with clips of humans missing the move the bot found"
  shallow: false
  mechanism: "Bot runs 500 seeds per level; the first 2,000 human attempts are classified pass/fail from video; gap ratio per level plus clips where humans miss the bot's key move"
  example: "Level 812: bot 1.6 attempts, humans 4.9; clips show players miss a diagonal match under a jelly layer; the designer recolours the jelly"
  cost: L
  depends_on: "an agent playthrough vendor (modl.ai, nunu.ai) or in-house bot; fail capture from design-1"
  buyer: "Level design lead at a large casual studio shipping 20+ levels a week"
  input: "bot playthrough video + human event-triggered fail clips + level events"
  why_existing_tools_cannot: "modl.ai and nunu.ai bots play builds before release and do not analyse real players' footage (market.md §3)"
  willingness_to_pay: "3: King and Nitro are reported modl.ai customers (market.md §3), so bot budgets exist; the human side is an add-on"

- id: design-11
  title: "Felt-difficulty curve for Levels 1-40 from a gameplay-pixel arousal model, overlaid on the designer's intended sawtooth (a breather every 5 levels)"
  level: L4
  cell: {buyer-role: design-balance, video-source: beta-and-early-access-testers, signal-extracted: emotion-arousal-from-pixels, analysis-type: cohort-comparison, lifecycle-moment: soft-launch, delivery-form: dashboard, companion-data: none-video-only, constraint-to-overcome: accuracy-and-trust}
  object: "Makantasis et al. arousal from gameplay pixels (methods-churn-funnel.md §5)"
  situation: "The level spreadsheet marks Levels 10, 15 and 20 as breathers; pass rates exist but say nothing about whether breathers feel restful"
  consequence: "If arousal stays high on breathers, players get no relief and session length falls; the designer moves breathers or cuts their target count"
  p_typical: 0.03
  grounded: inferred
  evidence: "arousal predicted from gameplay video alone, over 78% accuracy on average and 98% at best (methods-churn-funnel.md §5)"
  proposed: "Per-level arousal vs intended-intensity line chart with 3 clips per outlier level"
  shallow: false
  mechanism: "A pixel-only arousal model trained per genre on AGAIN-style labels scores each level attempt; mean per level compared to the intended curve"
  example: "Breather Level 15 scores 0.71 vs 0.44 target; cause is a 30 s timer the designer forgot; the timer is removed"
  cost: L
  depends_on: "per-genre arousal model and labels; AGAIN covers 9 games and 1,100 videos (methods-churn-funnel.md §5)"
  buyer: "Lead designer at a mid-size studio in soft launch"
  input: "beta tester gameplay video only, no face cam"
  why_existing_tools_cannot: "PlaytestCloud's AI keys on think-aloud speech, not visible behaviour (methods-churn-funnel.md §2); no studio-facing pixel-arousal product was found (market.md §7)"
