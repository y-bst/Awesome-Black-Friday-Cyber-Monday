- id: design-1
  title: "Per-level fail-margin histogram read from the fail screen (targets left, moves left), so the designer sees whether Level 37 fails are near-misses (1-2 targets left) or blowouts (6+ left)"
  level: L4
  cell: {buyer-role: design-balance, video-source: own-players-consented-sdk, signal-extracted: on-screen-text-ocr, analysis-type: funnel-drop-off-why, lifecycle-moment: d1-to-d7, delivery-form: dashboard, game-platform-and-genre: mobile-casual-hypercasual, capture-trigger-and-sampling: event-triggered-clip}
  object: "GameAnalytics Progression funnel 'Fail/Complete' ratio (methods-churn-funnel.md §1)"
  situation: "Match-3 Level 37 shows Fail/Complete of 4.1 after build 1.42; the funnel gives the ratio but not how close each fail was"
  consequence: "Without the margin the designer adds +3 moves blind; if 70% of fails end with 1-2 targets left, +2 moves fixes it; if 70% end with 6+ left, the board layout is the problem and extra moves change nothing"
  p_typical: 0.12
  grounded: inferred
  evidence: "'Progression' funnels take Progression events only and add Complete/Start and Fail/Complete ratios (methods-churn-funnel.md §1)"
  proposed: "OCR the fail-screen counters on a 3 s clip at each Fail event; histogram per level per build"
  shallow: false
  mechanism: "A per-title fail-screen detector plus OCR reads targets-remaining and moves-remaining at every fail; output is a fail-margin histogram per level, joined to level ID from the progression event"
  example: "Level 37: 68% of 2,400 sampled fails end with 1 target left; the designer adds 2 moves in remote config instead of redrawing the board"
  cost: S
  depends_on: "per-title fail-screen classifier trained on a few hundred labelled frames (methods-churn-funnel.md §4 inferred); level ID from progression events"
  buyer: "Lead level designer at a mid-size mobile casual studio"
  input: "3 s event-triggered clip at each Fail progression event from consented SDK players + GameAnalytics progression events"
  why_existing_tools_cannot: "Funnels report historical drop-off, 'not prediction', and no fail state (methods-churn-funnel.md §1); targets-left could be logged only if anticipated (methods-churn-funnel.md §2 inferred)"
  willingness_to_pay: "3: designers already pay about EUR 113-141 per recorded session for playtest video (market.md §1 PlaytestCloud); a studio that already logs targets-left as an event gets this free"

- id: design-2
  title: "Clip reel of each churned player's last failed attempt per level, for the 10 levels with the most 'quit without completing' 7-day churners"
  level: L4
  cell: {buyer-role: design-balance, video-source: own-players-consented-sdk, signal-extracted: ui-state-and-screen-flow, analysis-type: funnel-drop-off-why, lifecycle-moment: d1-to-d7, delivery-form: clip-reel, capture-trigger-and-sampling: always-on-ring-buffer, constraint-to-overcome: bandwidth-and-storage}
  object: "Roohi et al. 'churn without completing the level' correlation r = -0.586 (methods-churn-funnel.md §3)"
  situation: "A player fails Level 52 three times, kills the app on the fail screen and does not return for 7 days"
  consequence: "The designer watches 20 last-attempt clips for Level 52 instead of guessing between 'too hard' and 'bug', the two causes Unity's docs list"
  p_typical: 0.22
  grounded: inferred
  evidence: "Real pass rate vs churn: Spearman r = -0.144; vs 'churn without completing the level': r = -0.586 (methods-churn-funnel.md §3)"
  proposed: "Keep the last 2 attempts on device (about 15 MB at 1 Mbps), upload on Wi-Fi once the 7-day churn label resolves"
  shallow: false
  mechanism: "60 s on-device ring buffer per level attempt; upload is held until the 7-day churn label resolves, then the churned player's last attempt is uploaded and grouped by level"
  example: "Puzzle game Level 52: 14 of 20 last-attempt clips show the player never found the hidden key tile; the designer adds a sparkle hint on attempt 3"
  cost: M
  depends_on: "capture SDK with ring buffer and deferred upload; churn label from telemetry"
  buyer: "Lead designer at a mobile casual or midcore F2P studio"
  input: "60 s ring buffer per attempt from consented own players + level and session events for the churn label"
  why_existing_tools_cannot: "Sentry-style replay keeps 'about the last minute before the error' only on errors, not churn triggers (methods-churn-funnel.md §6); no paper predicts churn from human gameplay frames (methods-churn-funnel.md §3)"
  willingness_to_pay: "4: EA paired funnels with Session Replay for a 30% cut in onboarding time (methods-churn-funnel.md §1); Unity replay is still 'alpha' at PostHog (methods-churn-funnel.md §6)"

- id: design-3
  title: "'Visible-but-never-used' report per mechanic: seconds the booster or ability button was on screen before the first tap, and share of players with zero uses by Level 30"
  level: L4
  cell: {buyer-role: design-balance, video-source: own-players-consented-sdk, signal-extracted: ui-state-and-screen-flow, analysis-type: cohort-comparison, lifecycle-moment: ftue-first-session, delivery-form: per-cohort-report, companion-data: touch-and-controller-input, capture-trigger-and-sampling: random-sample}
  object: "methods-churn-funnel.md §2 inferred list item 'a visible CTA never tapped (UI not noticed)'"
  situation: "Hammer booster unlocks at Level 8; telemetry shows 61% of players reach Level 20 with zero hammer uses and cannot say whether they saw the button"
  consequence: "The designer cannot tell 'not noticed' (fix: highlight or forced use) from 'noticed and judged useless' (fix: raise its power); Levels 15-20 stay tuned on the assumption players use it"
  p_typical: 0.08
  grounded: inferred
  evidence: "Signals that exist in screen video (plus touch overlay) but not in standard event streams: ... a visible CTA never tapped (UI not noticed) (methods-churn-funnel.md §2)"
  proposed: "Per-mechanic exposure-to-first-use table, 10 clips of players opening the info card and closing it"
  shallow: false
  mechanism: "A button detector (mAP about 90% on mobile game UI, methods-churn-funnel.md §4) marks frames where each mechanic's button is visible; the touch overlay gives the first tap; output is visible-seconds-before-first-use and never-used share per mechanic per cohort"
  example: "Hammer visible a median 410 s across Levels 8-14 before first tap; 38% open the booster info card then close it; the designer moves the forced-use tutorial from Level 8 to Level 11, where the board needs it"
  cost: S
  depends_on: "per-title labels for each mechanic button; touch overlay in capture"
  buyer: "Lead game designer owning core mechanics, mobile casual or midcore studio"
  input: "random 2% of new installs, first 30 levels at 1-5 fps screenshots + touch input + level events"
  why_existing_tools_cannot: "Event streams log taps, not exposure: 'a step that was never instrumented ... does not exist in the data' (methods-churn-funnel.md §1 inferred)"
  willingness_to_pay: "3: no direct price; nearest is Gamedexy Pro at $99/year for human-captured FTUE flows (competitor-and-ua.md §1), so designers pay small sums for UI-flow evidence"

- id: design-4
  title: "Per-move think-time strip for a puzzle level: median seconds between moves by move number, split into no-touch pauses (reading the board) and touch-down-without-commit pauses (hovering)"
  level: L4
  cell: {buyer-role: design-balance, video-source: beta-and-early-access-testers, signal-extracted: input-timing-and-hesitation, analysis-type: funnel-drop-off-why, lifecycle-moment: soft-launch, delivery-form: in-tool-annotation, companion-data: touch-and-controller-input, game-platform-and-genre: mobile-casual-hypercasual}
  object: "UXCam rage-tap rule '3 taps ... at most 300 ms between taps' and the Unreal 'Universal Boredom Detector' (methods-churn-funnel.md §2)"
  situation: "Level 64 has a normal fail rate, but session length is +40% and next-day return is -6 points; telemetry has moves, not pauses"
  consequence: "The designer finds cognitive overload (9+ s pauses before moves 3-6 on a board with 4 blocker types) that the fail rate never shows; players who pass still quit tired"
  p_typical: 0.07
  grounded: inferred
  evidence: "'Universal Boredom Detector' tracks idle time and 'shorter inactivity or low-action time before full idle' (methods-churn-funnel.md §2)"
  proposed: "Heat strip of pause seconds per move number drawn over the level thumbnail"
  shallow: false
  mechanism: "Touch timestamps plus board-change detection from frames give per-move latency and hover-without-commit events; aggregated into a per-move strip per level"
  example: "Level 64: median pause 11 s at move 4 vs 3 s level average; the designer removes one blocker type and the pause falls to 5 s in build 1.44"
  cost: S
  depends_on: "touch input captured in sync with video"
  buyer: "Puzzle level designer at a casual mobile studio"
  input: "consented soft-launch beta recordings + touch stream + move events"
  why_existing_tools_cannot: "Rage-tap and idle detectors flag frustration or boredom, not per-move thinking load (methods-churn-funnel.md §2); funnels carry no timing between moves (methods-churn-funnel.md §1)"
  willingness_to_pay: "2: a designer can ask engineers to log move timestamps for free; value is retroactive for levels nobody instrumented (methods-churn-funnel.md §2 inferred)"

- id: design-5
  title: "Death classifier for a 3D action level: 'route not known' deaths (camera wandering or backtracking for 10+ s before death) vs 'execution' deaths (same spot, 3+ retries, jump input under 150 ms late)"
  level: L4
  cell: {buyer-role: design-balance, video-source: beta-and-early-access-testers, signal-extracted: player-skill-and-mechanics, analysis-type: root-cause-of-a-metric-change, lifecycle-moment: soft-launch, game-platform-and-genre: pc, companion-data: touch-and-controller-input, constraint-to-overcome: per-game-ui-generalisation}
  object: "'camera spinning/wandering (lost)' (methods-churn-funnel.md §2 inferred) and the Roohi population model of 'skill, persistence' (methods-churn-funnel.md §3)"
  situation: "Chapter 3 bridge in a Steam Early Access build: 23% of players die there 5+ times"
  consequence: "Execution deaths call for a wider platform or a checkpoint; knowledge deaths call for a sightline or landmark; tuning the wrong one leaves the wall in place"
  p_typical: 0.04
  grounded: inferred
  evidence: "camera spinning/wandering (lost) listed among signals absent from standard event streams (methods-churn-funnel.md §2)"
  proposed: "Per death zone: knowledge/execution split plus 5 clips of each"
  shallow: false
  mechanism: "Controller input stream plus camera-motion estimate from frames classify the 20 s before each death; output is a per-zone split with sample clips"
  example: "Bridge: 71% execution deaths at one jump with input 120 ms late; the designer extends coyote time from 80 to 150 ms instead of adding a signpost"
  cost: M
  depends_on: "death events with position from telemetry; controller input capture"
  buyer: "Lead level designer at an indie or mid-size PC action-platformer studio"
  input: "Steam Playtest / Early Access opt-in recordings + controller input + death events with xyz"
  why_existing_tools_cannot: "Steam Playtest gives distribution with 'No recording or analysis' (market.md §1 Valve); death heatmaps show where, not whether the player knew the route"
  willingness_to_pay: "3: indie anchors $49-99/month (IV Metrics, market.md §2) and $115-475 per game per month (Antidote, market.md §1)"

- id: design-6
  title: "Continue-offer margin table: for every '+5 moves' purchase, OCR of targets left when the offer appeared, per level and per price point"
  level: L4
  cell: {buyer-role: design-balance, video-source: own-players-consented-sdk, signal-extracted: economy-and-store-events, analysis-type: cohort-comparison, lifecycle-moment: price-or-economy-change, delivery-form: warehouse-table-export, companion-data: purchase-and-ad-revenue-events, game-platform-and-genre: mobile-casual-hypercasual}
  object: "Continue offer on the fail screen, joined to purchase events; GameAnalytics 'Resource' events (methods-churn-funnel.md §1)"
  situation: "Continue price raised from 900 to 1,200 coins in build 1.45; continue purchase rate falls 18%"
  consequence: "If near-miss buyers (1-2 targets left) kept buying, the drop comes from far-off players and the price holds; if near-miss buyers dropped, the price cuts both revenue and pass rate"
  p_typical: 0.06
  grounded: inferred
  evidence: "Standard funnels take Design, Resource and Progression events (methods-churn-funnel.md §1); no vendor links device video to monetisation telemetry (market.md §9)"
  proposed: "Table rows: level, price, targets_left_bucket, offers_shown, offers_bought"
  shallow: false
  mechanism: "At each continue-offer screen, OCR reads targets and moves remaining; joined to the purchase event; one row per offer exported to the warehouse"
  example: "Level 120 at 1,200 coins: near-miss buy rate unchanged at 34%, 5+-targets buy rate 9% to 2%; the designer keeps the price and adds a cheaper '+3 moves' tier"
  cost: S
  depends_on: "fail-screen OCR from design-1"
  buyer: "Economy designer at a casual F2P studio, with the monetisation lead"
  input: "event-triggered clip at the continue-offer screen + purchase and resource events"
  why_existing_tools_cannot: "Purchase events record that a continue was bought, not the board state at the offer; no vendor applies CV to production player video linked to monetisation (market.md §9 gap map)"
  willingness_to_pay: "4: economy prices move revenue directly; buyers pay $30K-$115K/yr for monetisation intelligence on competitors (competitor-and-ua.md §8 inferred)"

- id: design-7
  title: "'Can't afford' upgrade-screen log: each visit where the OCR'd upgrade price exceeds the OCR'd wallet balance, counted per player day and item tier, as a churn feature"
  level: L4
  cell: {buyer-role: design-balance, video-source: own-players-consented-sdk, signal-extracted: economy-and-store-events, analysis-type: churn-prediction-features, lifecycle-moment: d1-to-d7, delivery-form: warehouse-table-export, game-platform-and-genre: mobile-midcore-f2p, constraint-to-overcome: joining-video-to-events}
  object: "methods-churn-funnel.md §1 inferred example 'player looked at the shop button for 6 s and did not tap'"
  situation: "Midcore RPG days 3-5: the hero level-15 upgrade costs 12,000 gold while the median day-4 wallet is 4,300"
  consequence: "Players open the upgrade screen 6+ times a day without buying; no event fires because nothing was bought; the gold wall stays invisible until D7 drops"
  p_typical: 0.05
  grounded: inferred
  evidence: "a step that was never instrumented (e.g. 'player looked at the shop button for 6 s and did not tap') does not exist in the data (methods-churn-funnel.md §1)"
  proposed: "Column unaffordable_views_per_day per player, joined on session ID"
  shallow: false
  mechanism: "Screen classifier detects the upgrade screen; OCR reads price and wallet; emits one 'unaffordable view' row per visit with player and session ID"
  example: "Day-4 players with 5+ unaffordable views churn by D7 at 2.1x the rate of others; the designer raises day-3 daily-quest gold from 1,500 to 2,500"
  cost: M
  depends_on: "screen classifier and OCR per title; session ID shared between SDK and analytics"
  buyer: "Economy designer at a midcore F2P studio; the studio data scientist consumes the table"
  input: "random 1% of D1-D7 players at 1 fps + session and resource events"
  why_existing_tools_cannot: "Resource events log completed sources and sinks, not attempted sinks; packaged churn prediction caught 275 of 145k churn instances in one case (methods-churn-funnel.md §1), so new features are needed"
  willingness_to_pay: "3: Halfbrick gained +5 pp D7 acting on predicted churners (methods-churn-funnel.md §1); no direct price for a feature table"

- id: design-8
