  level: L4
  cell: {buyer-role: design-balance, video-source: own-players-consented-sdk, signal-extracted: on-screen-text-ocr, analysis-type: anomaly-alert, lifecycle-moment: new-version-release, delivery-form: issue-tracker-ticket, companion-data: telemetry-events, constraint-to-overcome: ground-truth-labels}
