  level: L4
  cell: {buyer-role: design-balance, video-source: own-players-consented-sdk, signal-extracted: visual-errors-and-glitches, analysis-type: build-to-build-regression-diff, lifecycle-moment: live-event-or-update, delivery-form: alert-or-slack, companion-data: build-and-config-metadata, game-platform-and-genre: mobile-casual-hypercasual}
  object: "VideoGameQA-Bench 'visual unit/regression tests' (methods-churn-funnel.md §4)"
  situation: "Halloween event skin ships in build 1.47; Levels 200-240 fail rate +9% with identical level JSON"
  consequence: "The designer spends 2 days re-checking level data; the cause is pumpkin particles covering the target counter and the bottom 2 rows"
  p_typical: 0.03
  grounded: inferred
  evidence: "VideoGameQA-Bench (NeurIPS 2025 D&B): visual unit/regression tests, needle-in-a-haystack, glitch detection (methods-churn-funnel.md §4)"
