- id: design-13
  title: "New-mechanic intro card read time (seconds visible before dismiss) joined to misuse rate of that mechanic in the next 3 levels"
  level: L4
  cell: {buyer-role: design-balance, video-source: own-players-consented-sdk, signal-extracted: ui-state-and-screen-flow, analysis-type: funnel-drop-off-why, lifecycle-moment: live-event-or-update, delivery-form: per-cohort-report, companion-data: touch-and-controller-input, constraint-to-overcome: joining-video-to-events}
