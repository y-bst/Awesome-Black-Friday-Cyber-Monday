- id: scout-2
  case: >-
    Build this first for the publishing BD scout or data lead at a mobile publisher doing pre-signing diligence, because it
    puts a hard check on the one number every deal is priced on. Soft-launch data rooms report tutorial completion and D1
    from the developer's own events, and the notes are explicit that "funnel quality is bounded by instrumentation" and that
    Unity and GameAnalytics already give different drop-off for the same players (methods-churn-funnel.md section 1). If
    tutorial_complete fires on card 3 of 7, the observed completion falls from 90% to 61%, and that gap moves a minimum
    guarantee by far more than the cost of the audit. The price anchor is the diligence and market-data budget publishers
    already pay: Sensor Tower at a $75,000/year median, GameRefinery at about $45-51k (competitor-and-ua.md section 8). A
    per-deal audit at low five figures fits that line. It replaces trusting the developer's dashboard, or a manual analyst
    playthrough that cannot sample 200 sessions. Incumbents cannot copy it quickly: event-analytics tools trust the events
    they receive and never see the screen, and replay SDKs render game canvases as black boxes with no game-state labels
    (market.md section 2 "Does NOT do"; methods-churn-funnel.md section 4). The founder's existing video ingestion plus a
    per-title screen classifier, the mature, cheap part of game CV at about 90% mAP, is most of the build. Each audit also
    puts the capture SDK into a soft-launch build, which opens the studio-side products afterwards.
- id: cfo-12
  case: >-
    Sell this first to the CFO and UA lead at a mobile casual or midcore studio spending $250k+/month, because it turns
    first-session video straight into a dollar figure per creative to cut, and that is the language a budget owner signs on.
    The gap is documented: GeekLab says it is "hard to see which creative acquired players who later retain and pay,
    especially on iOS", and the notes conclude that no tool "links an ad element to what the acquired player did on device
    in the first session" (competitor-and-ua.md section 3). Tilting Point puts the highest churn in the first 30 minutes
    (methods-churn-funnel.md section 1), so the wasted spend sits exactly where sampled FTUE capture is cheapest. The anchor
    is a budget that already exists: Segwise charges $499-1,699/month by ad spend, and Sett raised $57M on UA tooling demand
    (competitor-and-ua.md section 8; market.md section 6). A digest that finds $38-52k/month of mismatch spend pays for a
    $3-5k/month subscription inside one 2-week cycle. It replaces ROAS dashboards that show which creatives lose money but
    not why, and manual creative reviews that never see the player. Segwise, Alison and Replai stop at the install and have
    no on-device footage, so copying this means building a capture SDK, consent flows and a per-title screen model, which is
    a different company. The value is also easy to audit: pause the creative, and the spend saved shows up on next month's
    statement.
- id: ua-1
  case: >-
    Build this first for the UA manager or head of growth at a mobile F2P publisher buying on Meta, AppLovin and TikTok,
    because it adds the one number missing next to CPI and IPM: did the acquired player ever see what the ad promised, and
    at which minute. UA teams already pay for frame-level ad tagging (Segwise $499-1,699/month, Replai $8M+ raised with
    Activision and Dream Games as clients, Sett $57M; competitor-and-ua.md section 8, market.md section 6), so the buyer,
    the workflow and the budget line already exist. This product extends that tagging past the install. It replaces the
    guesswork GeekLab describes, where creative-to-retained-player linkage is weak, especially on iOS (competitor-and-ua.md
    section 3), and a weekly cadence fits teams testing 50-200 new variants per title per week. The mechanism reuses one
    vision-language labeller on both sides of the join (ad frames 3-8 s and first-session clips), and the creative_id
    passthrough from the MMP is a standard field, so the integration is light. The output also has a second buyer inside
    the same studio: "only 31% see a booster before minute 6" tells the product team to change the FTUE as well as the media
    plan. Incumbents cannot ship this behind a feature flag, because every one of them analyses the ad file and network
    metrics and has no consented on-device footage (competitor-and-ua.md section 3 INFERRED). The capture SDK and the
    player-consent relationship are the moat, and the founder's ingestion and labelling stack already covers the vision
    work.
- id: ds-14
  case: >-
    Build this first as the cheapest wedge into the live-ops analytics team: an S-effort alert for the data scientist on call
    for release metrics at a live mobile studio, answering the question every release raises, "D1 fell 2 points and no event
    changed: why?" The notes show this gap directly: funnels show "where" only for instrumented steps, and "every tool above
    leaves why to a hypothesis step", with Unity's own docs offering only candidate causes (methods-churn-funnel.md section
    1). Loading screens, inserted popups and consent dialogs that carry no events are invisible to GameAnalytics, but in
    video they show up as a change in dwell and transitions. The anchor is the release-regression budget performance
    vendors already sell into: HeadSpin sold Zynga, Jam City and Bandai Namco on the claim that "over 30 per cent" of players
    left over a bad experience, and GameBench sells enterprise SDKs to studios (market.md section 3; adjacent-usecases.md
    section 6). Pricing per release or per title is easy to justify against one day of a broken build. It replaces a week of
    hypothesis queries and an ad-hoc QA repro with a Slack message 48 hours after launch that names the screen, the device
    tier and 3 clips. The statistics are simple KS tests, so the accuracy risk sits in screen classification, which is the
    mature part of game CV (methods-churn-funnel.md section 4). Incumbents cannot copy it because replay tools see game
    canvases as black boxes and performance tools measure fps, not screen flow. Once it runs on every release, the same
    per-screen features feed every other studio product.
- id: qa-10
  case: >-
    Sell this first to the QA director at a mid-size or AAA studio already running nightly bot or agent playthroughs,
    because it uses footage the studio already produces and currently deletes unwatched, and because pricing per confirmed
    bug removes the main buying objection. Only 16% of developers fully trust AI QA outcomes and 77% did less QA than they
    should have (market.md section 3), so a vendor paid only for clips a tester confirms as new bugs carries the precision
    risk itself. The research makes the mechanism credible: FFmpeg keyframes keep the bug moment in 98.79% of cases using a
    median 1.9% of frames, and VLM frame matching reaches 0.89 accuracy (arXiv 2508.04895, market.md section 3). That is
    good enough for triage, which is all the product claims (adjacent-usecases.md section 1). The anchor is the labour it
    replaces: outsourced QA at $15-50 per tester hour, or 40 hours of footage nobody reviews (adjacent-usecases.md section
    1). A morning queue of 9 confirmed new bugs in 50 minutes of tester time is clearly worth paying for. Incumbents leave
    the slot open: modl.ai and nunu.ai report only what their own agents assert, and Razer and ManaMind analyse individual
    tester sessions. None does cross-run triage deduped against open Jira tickets, and none bills per outcome (market.md
    section 3). Naavik calls the category early, with case studies "still hard to find", so a vendor that publishes billed
    bug counts gets the first real proof point. Because it needs no player consent or consumer SDK, it can ship this quarter
    on the founder's existing ingestion pipeline.
