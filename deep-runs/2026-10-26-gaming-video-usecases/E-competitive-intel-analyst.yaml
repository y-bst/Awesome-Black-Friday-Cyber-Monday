  title: "Post-update feature reception from streams: share of streamer screen-time spent in a rival's new mode or feature in the 14 days after release, joined with chat sentiment while that screen is visible"
  level: L4
  cell: {buyer-role: competitive-intel, video-source: public-streams-and-ugc, signal-extracted: social-or-chat-content, analysis-type: benchmark-vs-competitor, lifecycle-moment: season-or-battle-pass-start, delivery-form: weekly-digest-email, companion-data: chat-and-voice-logs, game-platform-and-genre: competitive-multiplayer}
  object: "market.md §5: Hatchet rebranded with 'AI Smart Search', covers 30+ platforms; competitor-and-ua.md §5 INFERRED: 'Nothing found reads clip content (a bug visible, a competitor feature praised, a monetisation complaint on screen)'"
