  why_existing_tools_cannot: "Sensor Tower/AppMagic report downloads and revenue for soft-launch apps but not gameplay; GameRefinery deep tags appear only after analysts play (competitor-and-ua.md §1)"
  willingness_to_pay: "4 - acquisitions of Playliner, Video Game Insights and data.ai show acquirers paying to extend game coverage (competitor-and-ua.md §8)"

- id: compintel-7
  title: "Version-change replay: when a competitor's store version number changes, the agent replays the stored FTUE route and a screen-by-screen diff lists added, removed and re-ordered steps, new offers and new HUD elements"
  level: L4
  cell: {buyer-role: competitive-intel, video-source: automated-bot-or-agent-playthrough, signal-extracted: ui-state-and-screen-flow, analysis-type: build-to-build-regression-diff, lifecycle-moment: new-version-release, delivery-form: alert-or-slack, capture-trigger-and-sampling: event-triggered-clip, companion-data: build-and-config-metadata}
  object: "competitor-and-ua.md §1: Gamedexy flows are static human-captured snapshots (186 flows, 25 games)"
  situation: "Rival ships v4.12 with a reworked tutorial; the analyst's teardown from v4.08 silently becomes wrong"
  consequence: "Product decisions are benchmarked against an outdated rival flow; 1 to 4 store updates per month per top game multiply the staleness"
  p_typical: 0.05
  grounded: inferred
  evidence: "competitor-and-ua.md §1 INFERRED: 'automated tagging in the market today reads store metadata and ad creatives, not recorded gameplay sessions'"
  proposed: "Diff report: v4.08 vs v4.12, 14 steps vs 11, step 6 'choose a hero' removed, new $1.99 offer at step 9, side-by-side keyframes"
  shallow: false
  mechanism: "Store version watcher triggers a fresh install; the agent follows the previous step list; sequence alignment of classified screens produces insert/delete/reorder operations; changed regions are highlighted on keyframe pairs"
  example: "Diff shows rival moved its guild prompt from day 3 to minute 9 in v4.12; social-features designer adds an early guild nudge to own roadmap"
  cost: S
  depends_on: "compintel-1 stored flows; store version feed"
  buyer: "Competitive-intel analyst at a publisher"
  input: "Agent playthrough video of new and previous version + store version metadata"
  why_existing_tools_cannot: "Store trackers report a version bump and release notes, not what changed in-game; human libraries refresh irregularly (competitor-and-ua.md §1, adjacent-usecases.md §7)"
  willingness_to_pay: "3 - part of the $45-115k/yr intelligence budget (competitor-and-ua.md §8); not sold alone"

- id: compintel-8
  title: "Competitor A/B test detector: 20 fresh installs per game across devices and geos, FTUE flows clustered; divergent clusters are reported as live variants and the variant still present 4 weeks later is marked the likely winner"
  level: L4
  cell: {buyer-role: competitive-intel, video-source: automated-bot-or-agent-playthrough, signal-extracted: ui-state-and-screen-flow, analysis-type: ab-test-variant-explanation, lifecycle-moment: ab-test-running, delivery-form: per-cohort-report, value-lever-b2b: create-data-that-did-not-exist, constraint-to-overcome: cost-per-session}
  object: "competitor-and-ua.md §1: Deconstructor of Fun 2025 FTUE case, a tutorial that branches by 'ask if the player knows the game'"
  situation: "A top rival is testing two tutorials, one with a 'have you played before?' branch; a single analyst install sees only one arm"
  consequence: "Teardowns describe one arm as 'the' rival FTUE; the rival's winning change is copied only after it is global, if at all"
  p_typical: 0.02
  grounded: inferred
  evidence: "competitor-and-ua.md §1: 'sessions grouped by early behaviour and tied to day-1 retention, leading to a tutorial change (ask if the player knows the game, then branch to a detailed tutorial)'"
  proposed: "Report per game: number of distinct FTUE variants seen, share of installs per variant, step-level differences, persistence over 4 weekly re-runs"
  shallow: false
  mechanism: "Agent runs 20 clean installs per game with varied device model, OS and country; classified step sequences are clustered by edit distance; clusters with stable differences are variants; weekly re-runs track which variant survives"
  example: "Rival V shows variant A (11 steps) on 12 of 20 installs and variant B (7 steps with skip) on 8; by week 4 all installs get B; product lead prioritises a skip-tutorial test"
  cost: M
  depends_on: "compintel-1 pipeline; device/geo diversity in the emulator farm; budget for 20x the sessions per game"
  buyer: "Competitive-intel analyst at a publisher; consumed by product leads"
  input: "Agent playthroughs from 20 installs per game + device, OS and country metadata"
  why_existing_tools_cannot: "Human teardowns play one account per game (competitor-and-ua.md §1); no source in the notes describes detecting rival A/B tests from gameplay"
  willingness_to_pay: "3 - novel data with no price anchor in the notes; value rides on the $45-115k/yr intelligence budget (competitor-and-ua.md §8)"

- id: compintel-9
  title: "Ad-to-game fidelity index: match scenes from each competitor's video ads (Meta Ads Library, TikTok Creative Center) against agent playthrough footage and report the share of ad seconds that appear in the first 60 minutes of real play"
  level: L4
  cell: {buyer-role: competitive-intel, video-source: competitor-store-and-ad-video, signal-extracted: ui-state-and-screen-flow, analysis-type: creative-insight-for-ads, lifecycle-moment: ua-campaign-launch, delivery-form: dashboard, companion-data: attribution-campaign-and-creative-id, buyer-org-type: publisher}
  object: "competitor-and-ua.md §3 INFERRED: 'Every tool above analyses the ad video plus network metrics ... None links an ad element to what the acquired player did on device in the first session'"
  situation: "UA and CI teams see a rival scaling pin-pull ads and cannot tell if pin-pull exists in the game, appears as a level-1 hook, or is a fake-ad mechanic"
  consequence: "Publisher copies a rival's ad hook without knowing the rival backs it with an in-game mini-game in level 1, losing retention on the mismatch"
  p_typical: 0.04
  grounded: quote
  evidence: "competitor-and-ua.md §2 INFERRED: 'Competitor ad libraries expose creatives but not what happens after install'"
  proposed: "Per rival: % of ad scenes found in game, minute where the ad mechanic first appears, whether it recurs after minute 30"
  shallow: false
  mechanism: "Ad videos pulled from free libraries are embedded scene-by-scene; agent playthrough frames are embedded the same way; nearest-neighbour matching with a threshold gives an ad-in-game coverage score and first-appearance timestamp"
  example: "Rival T: 0% of its top 20 ad scenes in game; rival S: pin-pull ad matches level 1-3 then every 10th level; UA lead tests pin-pull ads only for own title that has the matching mini-game"
  cost: M
  depends_on: "compintel-1 playthrough corpus; ad-library scraper for Meta and TikTok; frame embedding index"
  buyer: "Competitive-intel analyst paired with UA creative strategist at a publisher"
  input: "Competitor ad videos from free ad libraries + agent playthrough video of the same game"
  why_existing_tools_cannot: "Sensor Tower Creative Gallery, Segwise, Alison and Replai analyse ad video plus network metrics only (competitor-and-ua.md §1, §3)"
  willingness_to_pay: "3 - UA budgets pay Segwise $499-1,699/month and Sett raised $57M on creative demand (competitor-and-ua.md §3, market.md §6); no signal for this specific index"

- id: compintel-10
  title: "Streamer quit-point map for a rival game: across 500 Twitch/YouTube VODs, classify the last in-game screen before the streamer leaves the game or switches category, aggregated by level, mode and session hour"
  level: L4
  cell: {buyer-role: competitive-intel, video-source: public-streams-and-ugc, signal-extracted: ui-state-and-screen-flow, analysis-type: funnel-drop-off-why, lifecycle-moment: live-event-or-update, delivery-form: per-cohort-report, game-platform-and-genre: pc, value-lever-b2b: create-data-that-did-not-exist}
  object: "market.md §5: Hatchet 'measures viewership metadata (hours watched, viewers, chat) per category and creator. No evidence it analyses the gameplay pixels inside streams ... where streamers quit'"
  situation: "A rival PC roguelite's season update loses streamers within 2 weeks; the publisher's own similar game is 3 months from launch"
  consequence: "Analyst reports the viewership drop from Streams Charts but cannot say whether streamers quit at a boss, a grind wall or a menu"
  p_typical: 0.04
  grounded: quote
  evidence: "market.md §9 INFERRED: 'Stream analytics (Hatchet, Streams Charts) measure audience metadata, not in-game content'"
  proposed: "Histogram of last-screen class per VOD (boss fight, death screen, shop, loading, menu), with 3 sample clips per bar"
  shallow: false
  mechanism: "VOD URLs for the category pulled from stream trackers; the last 5 minutes before a category switch or stream end are sampled at 1 fps; a per-game screen classifier labels state; deaths and fail screens counted"
  example: "62% of 500 streamer exits follow a third death at the Act 2 boss; design lead adds a checkpoint before the equivalent boss in own game"
  cost: M
  depends_on: "VOD access within platform terms; per-game screen classifier bootstrapped by a VLM (methods-churn-funnel.md §4 INFERRED)"
  buyer: "Competitive-intel analyst at a PC/console publisher; consumed by design leads"
  input: "Public Twitch/YouTube VOD video + stream metadata (category switch timestamps, chat volume)"
  why_existing_tools_cannot: "Hatchet, Streams Charts and SullyGnome report hours watched and viewers, not in-game state (market.md §5)"
  willingness_to_pay: "3 - publishers pay Hatchet $249-1,249+/month for stream analytics (market.md §5); pixel-level add-on unpriced"

