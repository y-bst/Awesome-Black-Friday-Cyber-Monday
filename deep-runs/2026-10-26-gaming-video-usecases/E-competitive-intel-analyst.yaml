  object: "competitor-and-ua.md §3: Segwise says 'playables being too slow to tag by hand so most teams skip them'; playables cost '$3,000-$5,000 each externally'"
  situation: "Rival runs 14 playables; the UA team budgets $40k for own playables and wants to know which interaction patterns rivals keep running past 30 days"
  consequence: "Playable briefs copy what a strategist remembers seeing once; rivals' long-running playables go unanalysed"
  p_typical: 0.04
  grounded: quote
  evidence: "competitor-and-ua.md §3: playables 'too slow to tag by hand so most teams skip them'"
  proposed: "Per playable: mechanic tag, interactions to CTA, forced fail yes/no, days live, in-game match from compintel-9"
  shallow: false
