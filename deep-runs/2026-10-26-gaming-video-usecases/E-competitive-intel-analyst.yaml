- id: compintel-1
  title: "Scheduled vision-agent playthrough of the first 30 minutes of each top-200 grossing mobile competitor, output as a numbered FTUE flow (screen, forced tap, tutorial card, reward popup, first free choice) with timestamps"
  level: L3
  cell: {buyer-role: competitive-intel, video-source: automated-bot-or-agent-playthrough, signal-extracted: ui-state-and-screen-flow, analysis-type: benchmark-vs-competitor, lifecycle-moment: ftue-first-session, delivery-form: dashboard, buyer-org-type: publisher, capture-trigger-and-sampling: scheduled-bot-playthrough, value-lever-b2b: replace-labour-hours}
  object: "competitor-and-ua.md §1: Gamedexy '186 chronological flows, 1,887 screens, 25 mobile games; Pro $99/year' and GameRefinery 'about 260 features are tracked manually'"
  situation: "Product lead asks the analyst for an FTUE comparison of 12 match-3 rivals before an FTUE rework; today that is 12 installs x 30-60 minutes of play plus screenshots and a write-up"
  consequence: "About 24 analyst-hours per refresh; coverage stops at the 25 games Gamedexy has or the games the analyst has time to play; flows go stale after each competitor update"
  p_typical: 0.35
  grounded: quote
  evidence: "competitor-and-ua.md §1 INFERRED: 'No source shows a vendor extracting FTUE steps, shop layouts or event cadence from gameplay video automatically.'"
  proposed: "Per-game FTUE card: step count, seconds of unskippable tutorial, taps to first free move, minute of first reward and first offer, with the clip for each step"
  shallow: false
  mechanism: "A vision agent installs and plays each competitor on an emulator farm; a per-genre screen classifier labels frames (tutorial card, forced-tap highlight, reward popup, store, fail screen); the system emits an ordered step list with timestamps and keyframes into a dashboard the analyst filters by genre"
  example: "Match-3 benchmark: rival A reaches first free move at 0:14 after 3 forced taps, own game at 1:05 after 11; product lead removes 2 tutorial cards in the next build"
  cost: M
  depends_on: "Vision agent that can play mobile games from screen pixels (nunu.ai-class, market.md §3) running on an emulator farm; per-genre screen classifier"
  buyer: "Competitive-intel analyst or market-research lead at a mobile publisher with 5-30 live titles"
  input: "Emulator-captured video of agent playthroughs + the agent's own tap log + store metadata (app version, country)"
  why_existing_tools_cannot: "GameRefinery and Playliner rely on analysts playing by hand and Gamedexy flows are human-captured for 25 games (competitor-and-ua.md §1, §7); market.md §9 found no CV-based competitor gameplay analysis"
  willingness_to_pay: "4 - publishers pay GameRefinery about $45-51k/yr and Sensor Tower median $75k/yr for feature intelligence, some buy both (competitor-and-ua.md §8)"

- id: compintel-2
  title: "Daily login-and-capture bot for 230 competitor games that diffs home-screen banners, event icons and shop tabs against yesterday and classifies each new element into a live-event type (battle pass, limited-time shop, tournament, login calendar)"
  level: L4
  cell: {buyer-role: competitive-intel, video-source: automated-bot-or-agent-playthrough, signal-extracted: economy-and-store-events, analysis-type: anomaly-alert, lifecycle-moment: live-event-or-update, delivery-form: alert-or-slack, capture-trigger-and-sampling: scheduled-bot-playthrough, value-lever-b2b: replace-labour-hours, buyer-org-type: publisher}
  object: "competitor-and-ua.md §1: Sensor Tower Playliner team logs 'hundreds of hours' of playtime across 230+ top games; adjacent-usecases.md §7: GameRefinery documents '35+ live event types as screenshots plus analyst comments'"
  situation: "A rival launches an unannounced 72-hour event on Tuesday 09:00 UTC; the analyst learns of it on Thursday from a Playliner digest or a Discord post"
  consequence: "Live-ops team cannot counter-program inside the event window; 2 of 3 days of the rival event are gone before anyone reacts"
  p_typical: 0.25
  grounded: quote
  evidence: "adjacent-usecases.md §7: 'most live events are announced without notice and cannot be scraped; gathering takes large human resources'"
  proposed: "Slack alert within 6 hours of event start: game, event type, duration countdown read by OCR, rewards shown, 20-second clip of the event entry screen"
  shallow: false
  mechanism: "Bot logs in once per day per game on a persistent account, records 90 seconds of home screen, event hub and shop; image diff against the previous capture isolates new UI regions; a VLM classifies the region into the 35-type event taxonomy and OCRs the countdown"
  example: "Tuesday 14:00 alert: 'Rival X: new Treasure Hunt event, 3d 0h remaining, top reward 500 gems, entry from home banner slot 2'; live-ops moves own double-XP weekend forward by 2 days"
  cost: M
  depends_on: "compintel-1 agent and emulator farm; persistent logged-in competitor accounts; event-type taxonomy"
  buyer: "Competitive-intel analyst serving the live-ops team of a mobile publisher"
  input: "Emulator capture from scheduled bot sessions + previous-day capture for diff + store version history"
  why_existing_tools_cannot: "Playliner and GameRefinery Live Events Tracker are human-logged and limited to about 100-230 games (competitor-and-ua.md §1, adjacent-usecases.md §7); store trackers (AppTweak) see store-listing events, not in-game ones (adjacent-usecases.md §7)"
  willingness_to_pay: "4 - Sensor Tower bought Playliner (Jun 2025) to own human-logged live-ops data; extra Sensor Tower modules $1,500-5,000+/month (competitor-and-ua.md §1, §8)"

- id: compintel-3
  title: "Daily OCR of competitor shop screens in 6 storefront countries (US, JP, DE, BR, IN, TR) producing a time series of each bundle's local price, gem amount, bonus percentage and 'best value' badge position"
  level: L4
  cell: {buyer-role: competitive-intel, video-source: automated-bot-or-agent-playthrough, signal-extracted: on-screen-text-ocr, analysis-type: benchmark-vs-competitor, lifecycle-moment: price-or-economy-change, delivery-form: warehouse-table-export, companion-data: build-and-config-metadata, game-platform-and-genre: mobile-midcore-f2p}
  object: "competitor-and-ua.md §1: GameRefinery Live Events Tracker covers 'limited-time shops, currencies, ad implementation and IAP' through daily analyst monitoring"
  situation: "Monetisation lead plans a regional price cut in Brazil and asks what top-10 midcore rivals charge for their $4.99-equivalent pack in BRL and how many gems it gives"
  consequence: "Analyst answers from 2-3 screenshots taken weeks ago in one country; gem-per-dollar comparison across 10 games x 6 countries (60 cells) is never built"
  p_typical: 0.12
  grounded: inferred
  evidence: "competitor-and-ua.md §1: human analysts track IAP across live events; market.md §9: 'No vendor found that does CV-based competitor gameplay analysis (auto-deconstructing a rival's ... economy ...)'"
  proposed: "Warehouse table: date, game, country, sku_label, local_price, hard_currency_amount, bonus_pct, badge, screen_position; joined to FX for USD-normalised gems per dollar"
  shallow: false
  mechanism: "Bot opens the shop on emulator instances with store locale set per country; OCR reads price strings, currency counts and bonus ribbons; row-level parser writes one record per visible SKU per day"
  example: "Table shows rival Y cut its BRL starter pack from R$27.90 to R$19.90 on 3 Oct and doubled gems; monetisation lead matches in BR only and leaves US price"
  cost: M
  depends_on: "compintel-1 agent reaching the shop; emulator instances with per-country store accounts; OCR tuned on stylised shop fonts"
  buyer: "Competitive-intel analyst supplying the monetisation lead at a midcore publisher"
  input: "Emulator capture of shop screens per country + store country/locale config + FX rates"
  why_existing_tools_cannot: "Sensor Tower/AppMagic give revenue and download estimates, not in-game SKU prices; GameRefinery logs IAP by hand (competitor-and-ua.md §1); methods-churn-funnel.md §4 notes stylised HUD OCR is a weak piece, so a generic OCR tool will misread shop ribbons"
  willingness_to_pay: "3 - covered today only inside $45-115k/yr intelligence contracts (competitor-and-ua.md §8); no standalone price signal for per-SKU price data"

- id: compintel-4
  title: "Benchmark of minutes-of-play and screens-seen until a competitor's first IAP offer, first rewarded-ad prompt and first interstitial, per game and per genre quartile"
  level: L4
  cell: {buyer-role: competitive-intel, video-source: automated-bot-or-agent-playthrough, signal-extracted: economy-and-store-events, analysis-type: benchmark-vs-competitor, lifecycle-moment: ftue-first-session, delivery-form: per-cohort-report, game-platform-and-genre: mobile-casual-hypercasual, value-lever-b2b: create-data-that-did-not-exist}
  object: "B-perspectives.yaml publisher-portfolio-manager notices 'time-to-first-purchase'; competitor-and-ua.md §1 GameRefinery tracks 'ad implementation and IAP' manually"
  situation: "Own casual title shows its first offer at minute 2; the monetisation lead asks if that is early versus the top 50 casual games"
  consequence: "Decision rests on opinion; nobody holds a distribution of first-offer timing across 50 games"
  p_typical: 0.12
  grounded: inferred
  evidence: "competitor-and-ua.md §2 INFERRED: 'gameplay recorded from a device is the only path to post-install flow (FTUE, offers, shops, events)'"
  proposed: "Genre report: median, P25, P75 minute of first offer, first rewarded prompt and first interstitial across 50 games, own game marked on the strip"
  shallow: false
  mechanism: "From compintel-1 captures, a detector tags the first frame of each monetisation surface (IAP popup, rewarded-ad button, full-screen ad); time and screen index since launch are recorded; quartiles are computed per genre"
  example: "Casual top-50 median first interstitial at minute 6:40, own game at 2:10; monetisation lead delays it to after level 5"
  cost: S
  depends_on: "compintel-1 playthrough corpus; detector for ad and offer surfaces"
  buyer: "Competitive-intel analyst at a casual publisher, report consumed by monetisation lead"
  input: "Agent playthrough video + agent tap log (to separate agent-triggered vs forced offers)"
  why_existing_tools_cannot: "Ad-intelligence tools (Sensor Tower Creative Gallery, AppMagic) see ads a competitor buys, not ads it shows inside its game (competitor-and-ua.md §1, §3)"
  willingness_to_pay: "3 - bundled in GameRefinery-class contracts at $45-51k/yr (competitor-and-ua.md §8); alone it is a feature, not a contract"

- id: compintel-5
  title: "Ad-load map of competitor hypercasual games: interstitials and rewarded videos per 10 minutes of play, their trigger point (level end, revive, double reward) and the serving network read from the ad end-card"
  level: L4
  cell: {buyer-role: competitive-intel, video-source: automated-bot-or-agent-playthrough, signal-extracted: ad-render-and-viewability, analysis-type: benchmark-vs-competitor, lifecycle-moment: d1-to-d7, delivery-form: dashboard, game-platform-and-genre: mobile-casual-hypercasual, buyer-org-type: publisher}
  object: "competitor-and-ua.md §2: 'AppLovin publishes no public competitor ad library; screenshotting ads seen inside another game mislabels them as that game's creative'"
  situation: "Hypercasual publisher tuning ad frequency wants to know how many interstitials per 10 minutes the top 30 rivals show after the first session, and which mediation they run"
  consequence: "Ad frequency is set by gut or by a single manual play session; rivals at 4 ads/10 min vs 1.5 ads/10 min is invisible"
  p_typical: 0.05
  grounded: inferred
  evidence: "competitor-and-ua.md §3 INFERRED: every creative tool 'analyses the ad video plus network metrics'; none observes the host game's ad placements"
  proposed: "Per-game row: interstitials/10 min, rewarded offers/10 min, rewarded placements by type, network logos seen on end-cards, measured over 3 sessions on day 1, 3, 7"
  shallow: false
  mechanism: "Agent plays 3 sessions spread over 7 days; detector marks full-screen ad starts, close buttons and rewarded prompts; OCR and logo matching on end-cards and privacy icons identify the ad network"
  example: "Rival Z shows 3.8 interstitials/10 min by day 7 and AppLovin end-cards on 70% of them; own game at 1.6 raises frequency after level 20 only"
  cost: M
  depends_on: "compintel-1 agent with multi-day persistence; logo set for 10 major ad networks"
  buyer: "Competitive-intel analyst at a hypercasual publisher; also ad-monetisation manager"
  input: "Agent playthrough video over 3 days + device clock + agent tap log"
  why_existing_tools_cannot: "Ad libraries list creatives a game buys, not ads it serves; AppLovin has no public library (competitor-and-ua.md §2); Segwise/Alison analyse own ads only (competitor-and-ua.md §3)"
  willingness_to_pay: "3 - UA/monetisation buyers pay Segwise $499-1,699/month for adjacent ad analytics (competitor-and-ua.md §3); no direct signal for ad-load benchmarks"

- id: compintel-6
  title: "Soft-launch radar: when a new title from a watched publisher appears in a test market store (PH, CA, AU, NZ), install it within 24 hours on a geo-matched emulator and deliver an FTUE and monetisation teardown within 48 hours"
  level: L3
  cell: {buyer-role: competitive-intel, video-source: automated-bot-or-agent-playthrough, signal-extracted: ui-state-and-screen-flow, analysis-type: benchmark-vs-competitor, lifecycle-moment: soft-launch, delivery-form: alert-or-slack, value-lever-b2b: cut-time-to-insight, buyer-org-type: publisher}
  object: "competitor-and-ua.md §1: 'coverage is limited to the top roughly 100-250 games for live ops' (INFERRED); soft-launch titles are by definition outside the top grossing"
  situation: "A major rival soft-launches a merge game in the Philippines; it has 5k downloads, so no tracker deep-tags it for weeks"
  consequence: "Publisher learns the new mechanic only at global launch, 6-12 months later, too late to adapt its own pipeline title"
  p_typical: 0.09
  grounded: inferred
  evidence: "competitor-and-ua.md §1: GameRefinery analyst tags replace automatic store-metadata tags only 'once a game is fully analysed'"
  proposed: "Alert card: title, studio, market, core loop summary, first 10 FTUE steps, first offer price, unusual mechanics flagged against the genre library"
  shallow: false
  mechanism: "Store-listing watcher on 40 watched developer accounts triggers install; agent plays 45 minutes; the FTUE/monetisation pipeline from compintel-1 and compintel-4 runs; a VLM writes a 1-page diff against the closest 5 games in the library"
  example: "Alert 31 hours after the PH listing: 'Rival W merge-RPG: hero gacha at minute 8, energy timer at minute 12, $0.99 starter pack'; scouting flags it as a threat to own merge title in pre-production"
  cost: M
  depends_on: "compintel-1 pipeline; per-country store accounts and geo-matched emulators; watch-list of developer accounts"
