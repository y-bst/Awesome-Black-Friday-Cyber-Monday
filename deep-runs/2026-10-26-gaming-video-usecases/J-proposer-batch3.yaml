- id: f2p-3
  case: >-
    Build the build-diff alert first because it is the cheapest thing on the list that sells a number the buyer already tracks: the product lead and release owner at a mobile F2P studio shipping weekly watches D1 by build every Monday, and today a 2 pp drop on a build that only changed popup art is invisible to the funnel, because a step with no event "does not exist in the data" and Unity funnels cannot be edited without "invalidating any existing data" (methods-churn-funnel.md §1).
    The alert replaces the blind rollback or the week of waiting for D1 to settle, and at 100k installs/day each day of a 2 pp drop is roughly 2,000 lost day-1 players, so one caught regression pays for a year of the product.
    Effort is S-weeks: it reuses the f2p-1 reason-code classifier, needs only build version in clip metadata, and runs on the first 500 event-triggered clips of the new build, which fits the ring-buffer sampling pattern Sentry already established for errors (methods-churn-funnel.md §3, §7) and avoids the upload problem of full capture.
    The price anchor is the FTUE outcome budget analytics vendors already sell into (FunCraft +40% D1, EA 30% faster onboarding; methods-churn-funnel.md WTP), and it is naturally priced per build or as an add-on seat to the per-step report, so it lifts contract value with no new buyer.
    Incumbents cannot copy it quickly because GameAnalytics, Unity and Amplitude compare instrumented event counts, while mainstream replay tools reconstruct native UI trees and are "alpha" or screenshot-only on game canvases (PostHog Unity; methods-churn-funnel.md §3); a per-screen dwell and tap-latency diff needs a per-title UI-state classifier on rendered pixels, which none of them has.
    A Slack post with three before/after clip pairs within 24 h of rollout is also the most demo-able wedge the founder can show in a sales call.
- id: design-30
  case: >-
    Ship the graybox "core mechanic used correctly by minute 5" score first because it is an XS repackage of the User Test product the company already runs (ingestion, transcription, report agent), so it can be in a customer's hands in weeks with no SDK, no live-player consent and no platform review.
    The buyer is the creative director or lead designer at greenlight, a moment where a wrong call costs a whole production budget, and the method is proven: Nitro Games tested no-tutorial builds to see what players understood unaided and took tutorial completion to 90% with "big increases" in D1 (methods-churn-funnel.md §2).
    The price anchor is already set: studios pay PlaytestCloud about EUR 113-141 per recorded and analysed session (EUR 13.6k-33.9k/year), smaller studios pay Antidote $115-475 per game per month or We Playtest Games $15 per test (market.md §1, WTP), so a per-session or per-prototype fee of 20 testers slots into an existing line item.
    It replaces the designer watching 20 recordings and tallying by hand, and it catches what transcript-only AI cannot: the tester who says "got it" and then merges the wrong tiles three times.
    PlaytestCloud's AI uses the OpenAI API on transcripts and survey responses, not pixels, and keys on "think-aloud speech, not on visible behaviour" (market.md §1; methods-churn-funnel.md §2), so a say-versus-do mismatch count requires frame-level outcome detection that their stack does not have.
    It also builds the per-mechanic outcome detectors and labelled frames that every later live-player product needs, so it is the low-risk first sale that funds the harder SDK options.
- id: uxr-1
  case: >-
    The silent-friction coder should be first because it sells to the buyer with the clearest, already-spent budget: the in-house games user researcher at a mid-size mobile studio who pays PlaytestCloud EUR 113-141 per session or Antidote $115-475 per game per month (market.md WTP), and whose sessions are paid for but only partly mined.
    In a 12-player unmoderated FTUE test the researcher today scrubs about 3 hours of video to find the minutes where testers went quiet, because PlaytestCloud's AI "uses the OpenAI API on video transcripts and survey responses" and keys on speech, not on visible behaviour (market.md §1; methods-churn-funnel.md §2); the coder cuts that to reviewing 20-40 marked clips.
    The rules are not speculative: UXCam already defines rage taps as at least 3 taps within 300 ms in a set radius and a commercial "Universal Boredom Detector" sells idle and low-action detection (methods-churn-funnel.md §2), so the detection logic has precedent and only needs to run on game pixels plus touch overlay.
    Effort is S-weeks, the input already exists (Antidote captures touch and controller input alongside video; market.md §1), and the deliverable is a marker track on the timeline the company already ships, so it is sold as a per-session upgrade that raises the yield of sessions already bought rather than a new budget fight.
    Incumbents cannot flip a flag for this because it needs a per-title UI-state classifier (tutorial card visible, popup open, fail screen) trained on labelled frames; transcript summarisation and survey sentiment do not produce it, and generic replay tools cannot read game canvases (methods-churn-funnel.md §3).
    Named PlaytestCloud customers (Ubisoft, Supercell, Zynga, Rovio, Metacore) are exactly the researchers who would see silent struggle markers as more evidence per euro, which makes this the fastest credible enterprise wedge.
- id: indie-15
  case: >-
    The soft-launch go/kill read deserves to be first because it attaches to the single highest-stakes decision a small studio makes: a 1-3 person indie with 500 Canadian test installs and a D1 of 17% against a 2026 median of about 22% (GameAnalytics; methods-churn-funnel.md §1) must decide in a week whether to keep spending months on the game.
    Today that founder has no analyst and two bad options: guess from the funnel, which shows where but never why, or buy 30 recruited sessions at about EUR 113 each from PlaytestCloud (about EUR 3,390), whose Indie Pass offers only 5 tokens a month and whose testers are not the cohort that churned (market.md §1).
    The product replaces both with 30 randomly sampled real first sessions from the soft-launch build, tagged by friction step and compared to benchmark medians, delivered as a one-page "fix or kill" verdict with clips.
    The price anchor is the indie spend already visible in the notes: IV Metrics charges $49-99/month just to record 50-100 gameplay videos with no analysis, and We Playtest Games charges $79/month (market.md §1, WTP), so $79-99 per soft launch is an impulse purchase that converts on a self-serve page.
    Incumbents cannot easily match it because IV Metrics records but does not interpret, GameAnalytics publishes benchmarks but no "why" and notes top studios are missing from them, and PlaytestCloud's model is recruited panels priced per token; combining sampled live-player video, a friction classifier and a benchmark comparison in one verdict cuts across all three.
    Every soft launch is also a top-of-funnel lead: an indie that keeps its game becomes the next per-build or per-step customer, so this is the cheapest acquisition channel the founder can run.
- id: f2p-14
  case: >-
    The ad-promise mismatch detector should be built first because it is the only option that taps the largest, best-funded budget in mobile games, user acquisition, with a capability nobody sells: the product lead and UA manager at a casual or midcore F2P studio can see that a fail-state creative has high IPM and a D1 9 pp below average, but every creative tool (Segwise, Replai, Alison) tags the ad and network metrics, and "none links an ad element to what the acquired player did on device in the first session" (competitor-and-ua.md §3).
    The demand is stated by buyers, not inferred: GeekLab says it is "hard to see which creative acquired players who later retain and pay, especially on iOS", and FoxData reports fail-state hooks lead across 10,000+ ads, so the problem hits the most common creative pattern (competitor-and-ua.md §3).
    It replaces two expensive mistakes at once: product rewriting an FTUE for a problem the creative caused, and UA continuing to buy a low-CPI creative that brings in players who hunt for a mechanic the game does not have.
    The price anchors are strong: UA teams pay Segwise $499-1,699/month on spend-based tiers, agencies charge EUR 363-500 per AI video and $3,000-5,000 per playable, Sett raised $57M and Replai claims $5B/year of ad spend on this demand (competitor-and-ua.md §3, §8; market.md WTP), so a per-creative cohort report priced against media spend lands in an existing line.
    Incumbents cannot copy it quickly because creative-intelligence vendors have no capture on the player's device, no consent flow and no gameplay classifier, and analytics vendors have no ad-element taxonomy; joining MMP creative ID to first-session video behaviour requires both, which is exactly the moat score this option earned (4 of 5).
    Starting on Android, where creative ID is available on device, gives a clean first market while iOS attribution limits are worked around through opt-in cohorts.
