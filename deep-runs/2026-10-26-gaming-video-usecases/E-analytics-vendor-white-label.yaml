  depends_on: "Vendor agreeing to add a ring-buffer module to its existing SDK; User Test product's ingestion and report agent"
  buyer: "Head of product or BD lead at a game-analytics SaaS (GameAnalytics-class) with an SDK in thousands of mobile games"
