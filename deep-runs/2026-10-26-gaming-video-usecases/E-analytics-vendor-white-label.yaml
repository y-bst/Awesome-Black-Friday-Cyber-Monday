  evidence: "methods-churn-funnel.md section 1: 'GameAnalytics funnel \"Total Churn\" = share of users who matched the first step but not all later steps, i.e. historical drop-off, not prediction'; market.md section 6: GameAnalytics 'Live Map' session replay. No video."
