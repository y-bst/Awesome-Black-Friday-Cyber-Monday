  why_existing_tools_cannot: "methods-churn-funnel.md section 1 INFERRED: 'Event funnels answer \"where\" and \"how many\"; every tool above leaves \"why\" to a hypothesis step'; market.md section 6: GameAnalytics IQ Suite has no video"
  willingness_to_pay: "3 - vendor would pay a royalty only if it can resell; the end-customer anchor is UXCam median about $21k/yr and IV Metrics $49-99/month for capped replay (market.md section 2, Signals)"

