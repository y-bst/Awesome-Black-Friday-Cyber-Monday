topic: "AI analysis of gameplay video captured from players' devices: what to build that gaming companies would pay for, beyond user research"
request_type: ideate
unit: "an option: one concrete product capability or service that a gaming company would buy"
leaf_test: >
  An option is a leaf only when it names (1) the buyer role inside a gaming company, (2) the input: which video source plus which
  other data, (3) the mechanism: what the AI detects, computes or produces, (4) one concrete example of it in use (a game type,
  a moment, a decision taken), and (5) why existing tools cannot do it, citing a research note. A category ("use video for
  retention") is not a leaf. A designer could sketch the leaf tomorrow from the line alone.
audience: "the founder deciding which 2-3 capabilities to build and sell first; per option they decide build / explore / drop"
artifact_description: >
  Four research notes (search-extract based, not full-page reads): market.md (61 companies: playtest platforms, session replay,
  AI QA, vision on gameplay, stream analytics, ad-creative intel, emotion tools, 2025-26 launches, gap map, willingness to pay);
  methods-churn-funnel.md (funnel tools and what they cannot see, churn prediction research, computer vision on game UI,
  emotion from gameplay pixels, session replay, cost/privacy/sampling); competitor-and-ua.md (teardowns are manual, UA creative
  tools analyse the ad not the player, highlight tools, UGC monitoring, store video testing, prices); adjacent-usecases.md
  (QA, anti-cheat, toxicity, accessibility, localisation, performance, live-ops, esports, support, balancing; vendors, buyers, prices).
artifacts:
  - path: deep-runs/2026-10-26-gaming-video-usecases/research/market.md
    kind: other
    objects: companies, products, prices, buyers, gaps
  - path: deep-runs/2026-10-26-gaming-video-usecases/research/methods-churn-funnel.md
    kind: other
    objects: tools, papers, accuracy numbers, costs, privacy constraints
  - path: deep-runs/2026-10-26-gaming-video-usecases/research/competitor-and-ua.md
    kind: other
    objects: vendors, prices, manual steps, complaints
  - path: deep-runs/2026-10-26-gaming-video-usecases/research/adjacent-usecases.md
    kind: other
    objects: use cases, vendors, buyers, prices
assumptions:
  - "video can be captured from the player's device with consent (SDK, platform or emulator capture), at sampled rate, with inputs and events alongside"
  - "the company building this already has video ingestion, transcription and a report/ask-question agent (the User Test product)"
rubric: impact
extra_leaf_fields:
  buyer: "role and company type"
  input: "video source + other data"
  why_existing_tools_cannot: "one line citing a research note"
  willingness_to_pay: "1-5, with the price or buyer signal from the notes that supports it"
quota_per_perspective: 20
mode: full
