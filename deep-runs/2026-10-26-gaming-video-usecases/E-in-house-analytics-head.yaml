  level: L3
  cell: {buyer-role: analytics-bi, video-source: own-players-consented-sdk, capture-trigger-and-sampling: event-triggered-clip, delivery-form: api-or-sdk, analysis-type: funnel-drop-off-why, constraint-to-overcome: bandwidth-and-storage, signal-extracted: ui-state-and-screen-flow, effort: M-one-quarter}
  object: "Sentry replay pattern: onErrorSampleRate buffers about the last minute and uploads only when an error occurs (methods-churn-funnel.md section 6), adapted to triggers 'tutorial abandon, app kill on fail screen, N fails in a row' (section 6 INFERRED)"
  situation: "Full capture of a 30-minute first session at 2 Mbps is about 450 MB per player (methods-churn-funnel.md section 7); the BI head wants only the 60 s around event patterns he already defines in SQL"
  consequence: "Capturing by rule, not by lottery, cuts upload to a small share of sessions and keeps 100% of the cases he cares about; he refuses a capture tool he cannot configure in his own language"
