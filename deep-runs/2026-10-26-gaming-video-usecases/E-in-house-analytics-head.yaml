  example: "Trigger 'fail_count >= 3 on level_id = 12 within 5 min' fires on 1.8% of sessions and uploads 62 s clips; 1,100 clips in a week with no random sampling"
  cost: M
  depends_on: "SDK with on-device ring buffer and remote config"
  buyer: "Head of analytics/BI with the SDK platform engineer as co-signer"
  input: "on-device event counters plus ring-buffered screen video"
  why_existing_tools_cannot: "Error-triggered buffers exist for crashes only (Sentry, methods-churn-funnel.md section 6); IV Metrics records full sessions up to 50-100 videos a month (market.md section 2)"
  willingness_to_pay: "3 - bandwidth savings are real (about 7.5 TB/day at 100k installs/day, methods-churn-funnel.md section 7); no game price in notes"

