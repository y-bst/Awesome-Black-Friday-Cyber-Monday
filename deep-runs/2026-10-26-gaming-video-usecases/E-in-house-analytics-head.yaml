  level: L4
  cell: {buyer-role: analytics-bi, video-source: own-players-consented-sdk, signal-extracted: input-timing-and-hesitation, analysis-type: root-cause-of-a-metric-change, delivery-form: warehouse-table-export, constraint-to-overcome: joining-video-to-events, companion-data: touch-and-controller-input}
