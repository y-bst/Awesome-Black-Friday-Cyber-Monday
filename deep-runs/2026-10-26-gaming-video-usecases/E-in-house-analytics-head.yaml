  consequence: "Every join between video and events is off by a variable amount; hesitation metrics (the thing the video was bought for) are quietly wrong"
  p_typical: 0.06
  grounded: inferred
  evidence: "methods-churn-funnel.md section 6: 'synchronised input + video is worth more than video alone'; patent 11000771 on synchronised capture"
  proposed: "Align using visible on-screen events (level start banner, currency counter change) as anchors; write offset_ms and anchor_count per session"
  shallow: false
