  level: L3
  cell: {buyer-role: analytics-bi, video-source: own-players-consented-sdk, signal-extracted: ui-state-and-screen-flow, analysis-type: ask-a-question-over-footage, delivery-form: warehouse-table-export, constraint-to-overcome: commoditisation-by-general-video-llms, value-lever-b2b: de-risk-a-go-kill-decision, pricing-model: managed-project}
  object: "Zero-shot VLM baseline of precision 0.50 / accuracy 0.72 on 100 industrial videos, where many flagged anomalies were on-screen log messages (adjacent-usecases.md section 1)"
  situation: "The BI head points Gemini at 200 sessions and gets plausible prose; nobody knows its error rate for 'tutorial popup dismissed in under 1 s'"
  consequence: "Without a confusion matrix per label the output is not allowed into a model or a board slide; the harness is what turns 'we tried Gemini' into a number"
  p_typical: 0.05
  grounded: quote
  evidence: "adjacent-usecases.md section 1: 'best off-the-shelf VLM zero-shot baseline reached precision 0.50 / accuracy 0.72 on 100 industrial videos'; methods-churn-funnel.md section 4: VLMs 'detect a certain range of visual bugs'"
  proposed: "Table label_quality(label, model_version, precision, recall, n_frames) refreshed on every model or prompt change, includes the studio's Gemini prompt as one of the contenders"
  shallow: false
  mechanism: "Stratified frame sampling, 300 human labels per title, and automatic scoring of any labeller (vendor model, Gemini prompt, per-title detector) written to a warehouse table"
