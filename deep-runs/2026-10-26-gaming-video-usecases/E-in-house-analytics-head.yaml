  cell: {buyer-role: analytics-bi, video-source: beta-and-early-access-testers, signal-extracted: facecam-expression, analysis-type: cohort-comparison, delivery-form: warehouse-table-export, constraint-to-overcome: minors-coppa-gdpr-k, companion-data: facecam}
