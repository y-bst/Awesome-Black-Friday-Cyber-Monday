  situation: "A model upgrade in March moves 'popup open' from 12% to 15% of frames with no game change; a D1 comparison across build 4.10 and 4.12 is now meaningless"
  consequence: "Time series built on video labels break at every model upgrade; the BI head refuses data whose definition can move under his dashboards-of-record"
  p_typical: 0.03
  grounded: inferred
  evidence: "competitor-and-ua.md section 3: Segwise 'describes taggers drifting on labels' and publishes a creative tag taxonomy (vendor)"
