- id: bi-1
  title: "Table video_ui_state_events: one row per screen-state change (tutorial card, CTA highlighted, popup, fail screen) per sampled first session, keyed to the studio's own session_id"
  level: L3
  cell: {buyer-role: analytics-bi, video-source: own-players-consented-sdk, signal-extracted: ui-state-and-screen-flow, analysis-type: funnel-drop-off-why, lifecycle-moment: ftue-first-session, delivery-form: warehouse-table-export, companion-data: telemetry-events, processing-location: customer-cloud-byoc}
  object: "GameAnalytics Progression funnel for tutorial steps (methods-churn-funnel.md section 1) and the 'small vision vocabulary' of tutorial card visible / CTA highlighted / popup open / fail screen / level-complete (methods-churn-funnel.md section 4 INFERRED)"
  situation: "Tutorial step 3 shows 12% leaving; the funnel has no column for what was on screen at the moment of leaving, and the analytics head will not open a replay tool to look"
  consequence: "Without the table, the why of a funnel step stays a hypothesis (Unity docs: 'investigate'); with it, a SQL GROUP BY on screen_state at last_event answers it for 1-5% of sessions"
  p_typical: 0.12
  grounded: quote
  evidence: "methods-churn-funnel.md section 1 INFERRED: 'Event funnels answer where and how many; every tool above leaves why to a hypothesis step (Unity's own docs say investigate)'"
  proposed: "Per-title detector emits rows (session_id, t_ms, screen_state, confidence) into the customer's Snowflake schema nightly"
  shallow: false
  mechanism: "A per-title screen classifier runs on sampled first-session video and writes one row per state change into a warehouse table the BI head joins on session_id; no UI, no replay viewer"
  example: "Match-3 game, 4,000 sampled sessions: table shows 31% of players who left at tutorial step 3 had the 'booster explainer' popup open for under 1 s before the app went to background"
  cost: M
  depends_on: "consented capture of first 10 minutes at 1-5 fps; per-title label set of a few hundred frames"
  buyer: "Head of analytics/BI at a mid-size mobile F2P studio that owns Amplitude/GameAnalytics and Snowflake"
  input: "sampled first-session screen video at 1-5 fps plus the studio's tutorial_step events and session_id"
  why_existing_tools_cannot: "Event funnels give where not why (methods-churn-funnel.md section 1); replay tools like PostHog Unity are screenshot-only and viewer-shaped (market.md section 2); no vendor extracts game state into a table (market.md section 9)"
  willingness_to_pay: "4 - PlaytestCloud list works out to about 113-141 EUR per recorded and analysed session (market.md section 1); a table at 10-20 EUR per 100 sessions replaces hypothesis time; UXCam median about 21k USD/year (market.md section 2)"

- id: bi-2
  title: "Table event_video_mismatch: sessions where a telemetry event fired but the video shows no matching screen, or the screen appeared without the event"
  level: L4
  cell: {buyer-role: analytics-bi, video-source: own-players-consented-sdk, signal-extracted: structured-game-state-reconstruction, analysis-type: anomaly-alert, delivery-form: warehouse-table-export, companion-data: telemetry-events, constraint-to-overcome: ground-truth-labels, value-lever-b2b: create-data-that-did-not-exist}
  object: "Ordered-funnel (Unity) vs any-order (GameAnalytics) drop-off rules that give different numbers for the same players (methods-churn-funnel.md section 1 INFERRED)"
  situation: "tutorial_step_3_complete is logged by 94% of players but the video shows the step-3 card for only 81% of the same sampled sessions; 13 points of the funnel are phantom"
  consequence: "Every downstream funnel, churn model and A/B readout inherits the phantom completions; the BI head currently has no independent ground truth to audit instrumentation against"
  p_typical: 0.04
  grounded: inferred
  evidence: "methods-churn-funnel.md section 1 INFERRED: 'Funnel quality is bounded by instrumentation... Ordered-funnel rules (Unity) and any-order rules (GameAnalytics) produce different drop-off numbers for the same players'"
  proposed: "Weekly job joins video_ui_state_events to the event stream per session_id and writes rows with mismatch_type in (event_without_screen, screen_without_event, order_swap)"
  shallow: false
  mechanism: "Video-derived screen sequence is used as independent ground truth against the telemetry stream; mismatches are tabulated per event name and per build"
  example: "After build 4.12 the 'shop_opened' event double-fires on 7% of sessions; table lists the 212 affected session_ids and the build"
  cost: S
  depends_on: "bi-1 table"
  buyer: "Head of analytics/BI who owns the event taxonomy"
  input: "video-derived state table plus raw event stream per session_id"
  why_existing_tools_cannot: "Funnel tools trust the events they are given (methods-churn-funnel.md section 1); session replay is for watching, not for auditing event counts (methods-churn-funnel.md section 6)"
  willingness_to_pay: "4 - the buyer already pays for Amplitude/GameAnalytics instrumentation; no price signal for audits in the notes, so the anchor is Sensor Tower-class 29,500-115,460 USD/year contracts for data a team trusts (competitor-and-ua.md section 1)"

- id: bi-3
  title: "Retroactive funnel step: define a new step in plain language after launch and backfill it as a column for sampled past sessions"
  level: L3
  cell: {buyer-role: analytics-bi, video-source: own-players-consented-sdk, signal-extracted: input-timing-and-hesitation, analysis-type: cohort-comparison, lifecycle-moment: d1-to-d7, delivery-form: warehouse-table-export, value-lever-b2b: cut-time-to-insight, constraint-to-overcome: joining-video-to-events}
  object: "Unity Funnel Analyzer rule that editing a funnel is blocked because it 'would invalidate any existing data' (methods-churn-funnel.md section 1)"
  situation: "Product asks on a Tuesday whether players who stared at the shop button for 6 s without tapping churn more; that event was never instrumented"
  consequence: "Today the answer takes a client release plus 2-4 weeks of new data; with retroactive extraction it takes a query over footage already stored"
  p_typical: 0.05
  grounded: quote
  evidence: "methods-churn-funnel.md section 2: 'Most of these can in principle be instrumented as events, but only if anticipated; video captures them retroactively for any screen, which is the practical difference'"
  proposed: "Analyst writes a one-line definition, job runs over stored clips and returns session_id, step_hit boolean and t_ms in a new table"
  shallow: false
  mechanism: "A general video model labels stored clips against a natural-language step definition and writes a boolean plus timestamp per session into the warehouse"
  example: "'shop button visible and not tapped for 6 s' backfilled over 3,000 d1 sessions in one afternoon; hit rate 9%, D7 retention 4 points lower than non-hit"
  cost: M
  depends_on: "retained clips for at least 14 days; bi-6 label quality harness to know the hit-rate error"
  buyer: "Head of analytics/BI at a mid-size mobile studio"
  input: "stored sampled session clips plus touch overlay plus event stream"
  why_existing_tools_cannot: "Funnels cannot add steps retroactively (methods-churn-funnel.md section 1); an in-house Gemini script can, but offers no versioned definitions or joined output (competitor-and-ua.md section 1: Gemini takes video, no game FTUE extraction covered)"
  willingness_to_pay: "3 - the saved cost is one client release cycle; no direct price in the notes, nearest anchor is IV Metrics Pro 99 USD/month for 100 videos (market.md section 2), so this must price well above that"

- id: bi-4
  title: "Column session_end_reason: classify the last 10 s of video before app kill as rage-quit, interruption (call, notification) or crash"
  level: L4
  cell: {buyer-role: analytics-bi, video-source: own-players-consented-sdk, signal-extracted: device-context-interruptions-and-app-switch, analysis-type: churn-prediction-features, lifecycle-moment: d1-to-d7, delivery-form: warehouse-table-export, capture-trigger-and-sampling: on-crash-or-anomaly, companion-data: crash-and-error-logs}
  object: "Session-end handling in Sony's rage-quit patent (disconnect 2 points vs menu exit 1 point, methods-churn-funnel.md section 2) and the INFERRED 'exact screen state at the moment of app kill (rage quit vs. interruption)' (section 2)"
  situation: "Session length of 41 s ends with app_background; telemetry cannot say whether the player was on a fail screen or got a phone call"
  consequence: "Churn models treat all short sessions alike; interruptions inflate early-exit rates and can make a healthy level look like a churn driver"
  p_typical: 0.05
  grounded: inferred
  evidence: "methods-churn-funnel.md section 2 INFERRED: 'the exact screen state at the moment of app kill (rage quit vs. interruption)'"
  proposed: "On-device ring buffer of 30-120 s uploaded on app kill under 60 s session; one label per session written to warehouse"
  shallow: false
  mechanism: "Classifier reads the final frames and overlay (call banner, notification, fail screen, frozen frame) and writes an enum into a session-level column"
  example: "Hyper-casual game: 18% of sessions under 60 s end on an iOS notification banner, not a fail screen; level 6 was wrongly flagged as a churn level"
  cost: S
  depends_on: "ring-buffer capture on app lifecycle events"
  buyer: "Head of analytics/BI or the data scientist who owns the churn model"
  input: "last 30-120 s of screen video plus app lifecycle events and crash logs"
  why_existing_tools_cannot: "Event analytics sees app_background only (methods-churn-funnel.md section 1); Sentry-style ring buffers capture errors, not interruptions, and give video to a human (methods-churn-funnel.md section 6)"
  willingness_to_pay: "3 - cheap to run (30-120 s per ended session); Sentry replay pattern is established pricing logic but no game price in notes; buyer signal is Firebase Predictions use by Halfbrick for +5 pp D7 (methods-churn-funnel.md section 1)"

- id: bi-5
  title: "Table sample_weights: inverse-probability weight per sampled session so video-derived rates extrapolate to the full install cohort"
  level: L4
  cell: {buyer-role: analytics-bi, video-source: own-players-consented-sdk, analysis-type: cohort-comparison, delivery-form: warehouse-table-export, constraint-to-overcome: sampling-bias, capture-trigger-and-sampling: random-sample, companion-data: telemetry-events, value-lever-b2b: increase-coverage-from-sample-to-all}
  object: "Practical sampling knob 'user-level sampling (e.g. 1-5% of new installs) with Wi-Fi-only upload' (methods-churn-funnel.md section 7 INFERRED)"
  situation: "Wi-Fi-only upload at 3% sampling over-represents players with home Wi-Fi, who skew to higher-spending tablet users; video-derived rates are biased by 8 points on one segment"
  consequence: "The BI head would never publish a number from a biased 3% sample, so the video data stays unused"
  p_typical: 0.04
  grounded: inferred
  evidence: "methods-churn-funnel.md section 7: 'user-level sampling (e.g. 1-5% of new installs) with Wi-Fi-only upload'; also 'opt-in cohorts' push (section 7 INFERRED)"
  proposed: "Model P(captured | country, device tier, install source, payer flag from events) and emit weight per session_id; rates in downstream queries use SUM(weight)"
  shallow: false
  mechanism: "Propensity model over the studio's event-side attributes estimates capture probability, writes weights to the warehouse so every video-derived metric can be reweighted to the cohort"
  example: "Share of players who skip the tutorial: raw 14% in sample, weighted 19% for all installs; the decision to shorten the tutorial uses 19%"
  cost: S
  depends_on: "bi-1 table; telemetry for all installs"
  buyer: "Head of analytics/BI or studio data scientist"
  input: "capture log (who was sampled, who uploaded) plus telemetry for the whole cohort"
  why_existing_tools_cannot: "Playtest vendors sell recruited panels with no population frame (market.md section 1, panel-quality note); replay tools sell random sessions without weights (market.md section 2)"
  willingness_to_pay: "3 - not priced in notes; it is a trust feature that unlocks the rest, so it is bundled into the table price rather than sold alone"

- id: bi-6
