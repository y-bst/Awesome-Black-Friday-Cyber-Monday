# Stage D critique: IDEATE run (gaming gameplay-video AI)
# Inputs read: A-frame.yaml, B-perspectives.yaml, C-axes.yaml only. No research notes.
# Overall blind spot: 17 of 20 perspectives and all 3 example cells sit INSIDE a studio and want to BUY.
# The grid has almost no one who blocks the deal, no one who would resell or white-label it, no one
# who buys the data rather than the insight, and no axis for the companion data that the leaf test requires.

missing_perspectives:
  - slug: studio-ciso-security-review
    who: "CISO or security/vendor-risk reviewer at a mid-size or AAA studio"
    notices: "a capture SDK records unreleased builds, unannounced content and internal debug UI; asks for SOC 2, data residency, encryption, who at the vendor can watch footage, and leak liability; vetoes cloud upload of pre-release footage"
    why_missing: "the only deal-killer in the list is privacy-counsel, who looks at players; nobody looks at the studio's own IP leaking through the vendor, which is the most common reason security blocks screen-capture tools"
  - slug: cto-or-engine-lead-veto
    who: "CTO or lead engine programmer who owns frame budget and the SDK allow-list"
    notices: "any SDK that costs >1-2 ms per frame, adds APK size or triggers thermal throttling is refused; anti-cheat (EAC, BattlEye) may flag screen capture hooks; wants zero-integration or engine-level options"
    why_missing: "sdk-platform-engineer is framed as the integrator who makes it work, not the person whose job is to say no; build-vs-buy and SDK fatigue are absent"
  - slug: in-house-analytics-head-build-vs-buy
    who: "Head of analytics/BI who already owns Amplitude/GameAnalytics/Snowflake and has access to general video LLMs"
    notices: "'we can point Gemini at a sample of sessions ourselves'; refuses another dashboard; only accepts output as tables in the warehouse joined to their event IDs"
    why_missing: "data-scientist is a willing consumer of features; nobody represents the incumbent stack owner or the commoditisation threat from general-purpose video models, which attacks every 'why existing tools cannot' line"
  - slug: player-opt-in
    who: "The player asked to share their screen (adult and minor), and the community manager who fields their reaction"
    notices: "opt-in rate, what incentive makes them share (currency, beta access), Reddit backlash over 'the game records me', battery drain complaints in reviews"
    why_missing: "the whole input assumption depends on consent at scale, yet no perspective owns opt-in rate or the reputational cost; privacy counsel covers legality, not willingness"
  - slug: analytics-or-attribution-vendor-white-label
    who: "BD or product lead at an analytics, attribution or engine vendor (MMP, game-analytics SaaS, engine services, backend-as-a-service) who would embed or white-label the capability"
    notices: "wants an API/OEM licence to add 'see why' to their existing dashboards; already has the SDK installed in thousands of games, solving distribution and consent plumbing"
    why_missing: "buyers are all end users; the reseller/OEM channel, which removes the SDK-adoption problem, has no voice"
  - slug: outsourced-qa-and-loc-vendor
    who: "Ops director at an outsourced QA, localisation or player-support vendor (full-service game services firm)"
    notices: "either buys the tool to raise tester throughput and margin, or fights it because it replaces billable headcount; owns the testers' capture rigs already"
    why_missing: "qa-director is in-house; the service vendors who own most external test hours and a ready source of footage are not represented, as either buyer or blocker"
  - slug: ad-network-and-mediation-ops
    who: "Product/ops at an ad network, mediation platform or DSP serving rewarded and interstitial ads inside games"
    notices: "whether the ad actually rendered and was visible, ad placement quality, player reaction to the ad, playable-ad completion, fraud (bots and emulator farms) visible on screen"
    why_missing: "ua-manager is the studio side of ads; the supply side, which pays for verification and fraud detection at CPM scale, is absent"
  - slug: in-game-advertiser-brand
    who: "Brand or agency buying intrinsic in-game ads, sponsorships or creator integrations"
    notices: "on-screen logo exposure seconds, viewability of billboards in 3D scenes, sponsored-stream verification; pays measurement vendors today"
    why_missing: "no perspective treats the video as proof-of-exposure for a third-party advertiser; money that is outside the studio budget"
  - slug: market-intel-and-alt-data-buyer
    who: "Market intelligence firm or investment analyst buying cross-game behavioural and monetisation data"
    notices: "live-ops cadence, price-point changes, store layouts, engagement shifts across titles, sold as a panel or feed"
    why_missing: "ai-training-data-buyer is the only data buyer; aggregated insight data (not raw training video) is a separate, proven market"
  - slug: publisher-scout-or-investor-diligence
    who: "Publishing BD scout or game investor evaluating a pitch build or soft-launch title"
    notices: "wants an independent read of FTUE quality and player behaviour before signing or funding; today relies on the developer's own metrics"
    why_missing: "publisher-portfolio-manager manages owned games; the pre-deal evaluator, who pays for third-party evidence, is missing"
  - slug: rating-and-consumer-protection-compliance
    who: "Compliance lead facing age ratings (ESRB/PEGI/IARC), loot-box and dark-pattern rules (EU consumer law, FTC settlements, regional approvals)"
    notices: "evidence from footage of odds disclosure, countdown pressure, currency obfuscation, content descriptors; audits are per build and manual"
    why_missing: "accessibility-compliance-officer covers one compliance domain only; monetisation and rating compliance is a larger, fine-driven budget"
  - slug: certification-release-manager
    who: "Release manager submitting builds to console certification and store review"
    notices: "cert failures on UI requirements (error messages, save indicators, safe areas) found late; wants pre-submission check from footage"
    why_missing: "platform-owner is the platform side; the studio-side cert role is a recurring per-release spend with clear pass/fail ROI"
  - slug: localisation-lead
    who: "Localisation lead shipping in 10-15 languages"
    notices: "text overflow, truncation, untranslated strings and font fallback visible only in-game; LQA is manual playthrough per language"
    why_missing: "localisation is named in the research scope but has no perspective and no buyer-role value"
  - slug: creator-and-community-marketing
    who: "Community or creator-program manager"
    notices: "which in-game moments players clip and share, creator content performance, ready-to-post clips from real sessions, sentiment on stream"
    why_missing: "ua-manager covers paid acquisition only; organic and creator marketing is a separate buyer for clip-reel delivery"
  - slug: device-oem-and-chip-vendor
    who: "Gaming program lead at a phone OEM or mobile chipset vendor"
    notices: "per-title frame pacing, thermal throttling and rendering artefacts on their hardware versus competitors; pays for game optimisation programs"
    why_missing: "platform-owner mentions OEMs only as a capture source; OEMs as buyers of per-game performance evidence are not represented"

missing_axes:
  - name: value-lever-b2b
    values: [replace-labour-hours, increase-coverage-from-sample-to-all, cut-time-to-insight, create-data-that-did-not-exist, de-risk-a-go-kill-decision, avoid-fine-or-cert-failure, produce-a-sellable-asset, reduce-cost-per-incident, enable-automated-action]
    why_missing: "the mechanism-type axis (remove-friction, change-default, change-incentive...) is a consumer behaviour-change lever set; it describes what a game does to a player, not why a company pays a vendor. For a B2B analytics product the lever is what budget line it moves. Recommend replacing mechanism-type with this axis, or keeping mechanism-type only as a sub-field for options that act on the player in-session."
  - name: companion-data
    values: [none-video-only, telemetry-events, touch-and-controller-input, device-perf-counters, crash-and-error-logs, purchase-and-ad-revenue-events, attribution-campaign-and-creative-id, support-ticket-text, survey-or-nps, chat-and-voice-logs, facecam, build-and-config-metadata]
    why_missing: "the leaf test requires 'video source plus which other data', yet the grid has no axis for the other data; the join is where differentiation and the 'joining-video-to-events' constraint live"
  - name: buyer-org-type
    values: [indie-studio, mid-size-studio, aaa-studio, publisher, platform-or-store, ad-network-or-dsp, analytics-or-mmp-vendor, outsourced-services-vendor, agency, brand-advertiser, data-or-market-intel-buyer, investor, device-oem, regulator-or-rating-body]
    why_missing: "buyer-role mixes job function and organisation; extra_leaf_fields asks for 'role and company type', and sales motion, price and consent model depend on the org, not the role"
  - name: game-platform-and-genre
    values: [mobile-casual-hypercasual, mobile-midcore-f2p, pc, console, cloud-streamed, web-html5, xr-headset, ugc-platform-experiences, competitive-multiplayer, single-player-narrative]
    why_missing: "capture feasibility, anti-cheat conflict, closed-platform policy and which signals matter all change by platform and genre; the grid assumes mobile F2P implicitly"
  - name: capture-trigger-and-sampling
    values: [always-on-ring-buffer, event-triggered-clip, random-sample, targeted-cohort, opt-in-panel, on-player-report, on-crash-or-anomaly, scheduled-bot-playthrough]
    why_missing: "cost, bandwidth, bias and consent all hinge on when video is captured; constraint axis lists the problems but no axis lists the design choices that solve them"
  - name: processing-location
    values: [on-device, edge-or-platform-server, vendor-cloud, customer-cloud-byoc]
    why_missing: "security review and privacy counsel decide on where pixels go; on-device extraction (features not video) can unlock otherwise unsellable options"
  - name: automation-level
    values: [insight-for-human, recommendation, auto-created-ticket-or-asset, closed-loop-in-game-action]
    why_missing: "analysis-type and delivery-form describe output, not whether the system acts; closed-loop options (live intervention, auto-ban, auto-generated creative) are a distinct and higher-value slot"
  - name: go-to-market-channel
    values: [direct-sales, self-serve, engine-asset-store-or-marketplace, oem-white-label, bundled-with-platform, through-services-vendor]
    why_missing: "the founder must decide how it is sold, and several options only exist via a channel (white-label to MMPs, bundle with an emulator/cloud platform)"

missing_values:
  - axis: buyer-role
    add: [localisation, accessibility-compliance, rating-and-consumer-compliance, certification-release, engineering-performance, analytics-bi, community-and-creator-marketing, esports-team-or-league, publishing-scout-bd, ad-network-ops, brand-advertiser, data-buyer-training, data-buyer-market-intel, investor, white-label-vendor, outsourced-qa-vendor]
    why: "perspectives esports-coach, accessibility-compliance-officer, ai-training-data-buyer and publisher-portfolio-manager have no matching buyer-role value, so their options cannot be placed in a cell; external buyers have no slots at all"
  - axis: video-source
    add: [cloud-gaming-server-render, automated-bot-or-agent-playthrough, beta-and-early-access-testers, console-share-and-platform-clips, creator-sponsored-streams, ad-and-playable-ad-sessions, outsourced-tester-rigs, publisher-pitch-builds]
    why: "AI agents playing the build produce video with no consent problem; cloud and console capture avoid an SDK; ad sessions and sponsored streams feed the advertiser and ad-network buyers"
  - axis: signal-extracted
    add: [game-audio-and-sfx, voice-chat, facecam-expression, attention-proxy-cursor-or-camera, device-context-interruptions-and-app-switch, ad-render-and-viewability, brand-logo-exposure, dark-pattern-and-disclosure-ui, text-overflow-and-untranslated, accessibility-contrast-and-subtitles, structured-game-state-reconstruction, bot-or-fraud-behaviour, load-and-wait-screens]
    why: "audio is absent entirely; interruptions outside the game (notifications, app switch) are a likely churn cause invisible to telemetry; compliance, localisation and ad buyers need signals the list does not name"
  - axis: analysis-type
    add: [ask-a-question-over-footage, build-to-build-regression-diff, ab-test-variant-explanation, ad-verification-and-fraud, content-rating-classification, early-ltv-or-payer-prediction, real-time-in-session-intervention, automated-test-generation, creative-generation-from-gameplay, evidence-pack-for-enforcement]
    why: "the company already has an ask-question agent and no slot reuses it; regression diff and A/B explanation are the commonest product questions; several values describe insight but none describe generated output"
  - axis: lifecycle-moment
    add: [prototype-and-greenlight, publisher-pitch-or-diligence, certification-submission, new-market-or-language-launch, ab-test-running, season-or-battle-pass-start, price-or-economy-change, sunset-decision]
    why: "go/kill and pitch moments carry the highest willingness to pay per decision; cert and localisation releases are recurring spend"
  - axis: delivery-form
    add: [warehouse-table-export, issue-tracker-ticket, engine-editor-plugin, ask-question-agent-chat, generated-creative-files, enforcement-or-cert-evidence-pack, white-label-embed, weekly-digest-email]
    why: "the analytics-head veto is avoided only by warehouse delivery; QA lives in the issue tracker; the existing agent is a delivery form not listed"
  - axis: mechanism-type
    add: [replace-with-value-lever-b2b-axis]
    why: "current values are consumer behaviour levers; see missing_axes.value-lever-b2b. If kept, add 'detect-and-explain' and 'automate-a-human-task', which are what an analytics product actually does"
  - axis: effort
    add: [XS-repackage-existing-user-test-product, requires-partner-or-platform-deal]
    why: "the frame says ingestion, transcription and the agent already exist, so some options are days of work; others are gated by a partnership rather than engineering time"
  - axis: constraint-to-overcome
    add: [studio-ip-and-prerelease-leak, security-review-soc2-residency, anti-cheat-conflict, closed-console-platform-rules, minors-coppa-gdpr-k, player-opt-in-rate, per-game-ui-generalisation, ground-truth-labels, commoditisation-by-general-video-llms, integration-effort-per-engine]
    why: "the deal-killers raised in missing_perspectives have no constraint value, and 'why existing tools cannot' needs the general-model substitute named explicitly"
  - axis: pricing-model
    add: [per-hour-of-video, per-build-or-release, outcome-based-per-bug-or-uplift, annual-enterprise-licence, oem-royalty-or-white-label, cpm-or-per-impression-verified, data-licence-per-hour, freemium-self-serve, per-audit-or-certification]
    why: "white-label, ad verification, data licensing and compliance audits are priced in ways the list cannot express; per-MAU is wrong for most external buyers"

past_misses_check: "not applicable: ideate run"

notes:
  - "All 3 example_cells and the highest p_typical values are in-studio buyers. Expect generation to collapse onto product/UA/QA; force at least one cell per external org type."
  - "Perspective list has one blocker (privacy-counsel). Add the blockers above so each option is generated with its veto in view."
  - "pruned cell finance-exec x api-or-sdk is fine; no pruning exists for cells that are illegal or unsellable (e.g. emotion-arousal-from-pixels x EU players x per-cohort-report, minors x always-on capture); add pruning or flag them as constrained."
