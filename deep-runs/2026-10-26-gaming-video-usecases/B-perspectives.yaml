- slug: f2p-product-lead
  who: "Product lead of a mobile free-to-play game, owns D1/D7 retention and the FTUE"
  notices: "funnels say where players drop, not why; wants the why per step, per cohort, per build, without recruiting testers"
  p_typical: 0.85
- slug: ua-manager
  who: "User acquisition manager spending on Meta, AppLovin and TikTok creatives"
  notices: "creative tools analyse the ad, never what the acquired player did on device; wants to link ad moment to first-session behaviour and to mine real gameplay for creatives"
  p_typical: 0.70
- slug: qa-director
  who: "QA director for a studio shipping weekly on fragmented Android"
  notices: "visual glitches, stuck states and device-specific rendering that crash logs never show; reproduction cost; trust in AI QA is low"
  p_typical: 0.75
- slug: live-ops-manager
  who: "Live-ops manager running weekly events and offers"
  notices: "event UI not noticed, offer screens dismissed in under a second, confusion at new mechanics; wants same-day evidence"
  p_typical: 0.55
- slug: game-designer-balance
  who: "Lead designer tuning difficulty and economy"
  notices: "where players die, hesitate, grind or quit in a level; what they look at; which mechanic they never discover"
  p_typical: 0.50
- slug: monetisation-lead
  who: "Monetisation lead owning IAP and ad placements"
  notices: "store screens scrolled past, rewarded-ad prompts ignored, purchase hesitation, price anchoring on screen"
  p_typical: 0.45
- slug: competitive-intel-analyst
  who: "Analyst doing competitor teardowns for a publisher"
  notices: "teardowns are 100% manual; wants FTUE, monetisation and live-ops cadence extracted from competitor gameplay video at scale"
  p_typical: 0.50
- slug: player-support-lead
  who: "Head of player support"
  notices: "tickets without reproduction; wants the last 60 seconds before the complaint and an automatic summary"
  p_typical: 0.30
- slug: trust-and-safety-lead
  who: "Trust and safety lead"
  notices: "cheating, griefing and harassment visible on screen, not in chat logs; evidence packs for bans"
  p_typical: 0.35
- slug: studio-cfo
  who: "Studio CFO or VP who signs the vendor contract"
  notices: "what is it replacing (a tester, an analyst, a tool), what it costs per session, what proves ROI in 90 days"
  p_typical: 0.40
- slug: data-scientist
  who: "Studio data scientist who owns the churn model"
  notices: "video-derived features as new churn predictors; label quality; sampling bias; how to join video to events"
  p_typical: 0.45
- slug: sdk-platform-engineer
  who: "Engineer who would integrate a capture SDK"
  notices: "bandwidth, battery, storage, consent UI, store policy, on-device vs cloud processing, sampling triggers"
  p_typical: 0.40
- slug: platform-owner
  who: "Owner of a distribution platform (emulator, cloud gaming, app store, device OEM) that already renders or captures sessions at scale"
  notices: "video of thousands of games without an SDK; cross-game benchmarks; a data asset others cannot get; policy and consent at platform level"
  p_typical: 0.12
- slug: indie-solo-dev
  who: "Solo or 3-person indie studio"
  notices: "cannot afford playtests or analysts; wants a $50/month answer to 'why do people quit level 3'"
  p_typical: 0.20
- slug: publisher-portfolio-manager
  who: "Publisher managing 30 games"
  notices: "cross-game benchmarks of FTUE quality, onboarding length, time-to-first-purchase; go/kill decisions at soft launch"
  p_typical: 0.15
- slug: esports-coach
  who: "Esports coach or competitive player"
  notices: "mechanics, decisions and mistakes from VOD; already pays Mobalytics-class tools"
  p_typical: 0.10
- slug: accessibility-compliance-officer
  who: "Accessibility and compliance lead at a publisher (CVAA, Xbox guidelines, EU rules)"
  notices: "evidence from footage of contrast, text size, colour-only cues, input alternatives; audits are manual and per build"
  p_typical: 0.08
- slug: ai-training-data-buyer
  who: "Buyer of gameplay video as world-model training data"
  notices: "paired video plus inputs plus events is worth more than analytics; consent and licensing"
  p_typical: 0.08
- slug: privacy-regulator-counsel
  who: "Privacy counsel reviewing a capture SDK"
  notices: "screen recording consent (Apple 2019), emotion recognition limits (EU AI Act), minors, retention; what makes a use case unsellable"
  p_typical: 0.10
- slug: game-ux-researcher
  who: "In-house UX researcher who runs moderated playtests today"
  notices: "what they would delegate to an agent and what they would never trust it with; the research use case as the beachhead"
  p_typical: 0.30
