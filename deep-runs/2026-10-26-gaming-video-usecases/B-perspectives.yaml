# Stage B perspectives, patched by Stage D
- slug: f2p-product-lead
  who: Product lead of a mobile free-to-play game, owns D1/D7 retention and the FTUE
  notices: funnels say where players drop, not why; wants the why per step, per cohort, per build, without recruiting testers
  p_typical: 0.85
- slug: ua-manager
  who: User acquisition manager spending on Meta, AppLovin and TikTok creatives
  notices: creative tools analyse the ad, never what the acquired player did on device; wants to link ad moment to first-session behaviour and to mine real gameplay for creatives
  p_typical: 0.7
- slug: qa-director
  who: QA director for a studio shipping weekly on fragmented Android
  notices: visual glitches, stuck states and device-specific rendering that crash logs never show; reproduction cost; trust in AI QA is low
  p_typical: 0.75
- slug: live-ops-manager
  who: Live-ops manager running weekly events and offers
  notices: event UI not noticed, offer screens dismissed in under a second, confusion at new mechanics; wants same-day evidence
  p_typical: 0.55
- slug: game-designer-balance
  who: Lead designer tuning difficulty and economy
  notices: where players die, hesitate, grind or quit in a level; what they look at; which mechanic they never discover
  p_typical: 0.5
- slug: monetisation-lead
  who: Monetisation lead owning IAP and ad placements
  notices: store screens scrolled past, rewarded-ad prompts ignored, purchase hesitation, price anchoring on screen
  p_typical: 0.45
- slug: competitive-intel-analyst
  who: Analyst doing competitor teardowns for a publisher
  notices: teardowns are 100% manual; wants FTUE, monetisation and live-ops cadence extracted from competitor gameplay video at scale
  p_typical: 0.5
- slug: player-support-lead
  who: Head of player support
  notices: tickets without reproduction; wants the last 60 seconds before the complaint and an automatic summary
  p_typical: 0.3
- slug: trust-and-safety-lead
  who: Trust and safety lead
  notices: cheating, griefing and harassment visible on screen, not in chat logs; evidence packs for bans
  p_typical: 0.35
- slug: studio-cfo
  who: Studio CFO or VP who signs the vendor contract
  notices: what is it replacing (a tester, an analyst, a tool), what it costs per session, what proves ROI in 90 days
  p_typical: 0.4
- slug: data-scientist
  who: Studio data scientist who owns the churn model
  notices: video-derived features as new churn predictors; label quality; sampling bias; how to join video to events
  p_typical: 0.45
- slug: sdk-platform-engineer
  who: Engineer who would integrate a capture SDK
  notices: bandwidth, battery, storage, consent UI, store policy, on-device vs cloud processing, sampling triggers
  p_typical: 0.4
- slug: platform-owner
  who: Owner of a distribution platform (emulator, cloud gaming, app store, device OEM) that already renders or captures sessions at scale
  notices: video of thousands of games without an SDK; cross-game benchmarks; a data asset others cannot get; policy and consent at platform level
  p_typical: 0.12
- slug: indie-solo-dev
  who: Solo or 3-person indie studio
  notices: cannot afford playtests or analysts; wants a $50/month answer to 'why do people quit level 3'
  p_typical: 0.2
- slug: publisher-portfolio-manager
  who: Publisher managing 30 games
  notices: cross-game benchmarks of FTUE quality, onboarding length, time-to-first-purchase; go/kill decisions at soft launch
  p_typical: 0.15
- slug: esports-coach
  who: Esports coach or competitive player
  notices: mechanics, decisions and mistakes from VOD; already pays Mobalytics-class tools
  p_typical: 0.1
- slug: accessibility-compliance-officer
  who: Accessibility and compliance lead at a publisher (CVAA, Xbox guidelines, EU rules)
  notices: evidence from footage of contrast, text size, colour-only cues, input alternatives; audits are manual and per build
  p_typical: 0.08
- slug: ai-training-data-buyer
  who: Buyer of gameplay video as world-model training data
  notices: paired video plus inputs plus events is worth more than analytics; consent and licensing
  p_typical: 0.08
- slug: privacy-regulator-counsel
  who: Privacy counsel reviewing a capture SDK
  notices: screen recording consent (Apple 2019), emotion recognition limits (EU AI Act), minors, retention; what makes a use case unsellable
  p_typical: 0.1
- slug: game-ux-researcher
  who: In-house UX researcher who runs moderated playtests today
  notices: what they would delegate to an agent and what they would never trust it with; the research use case as the beachhead
  p_typical: 0.3
- slug: studio-ciso-security-review
  who: CISO or security/vendor-risk reviewer at a mid-size or AAA studio
  notices: a capture SDK records unreleased builds, unannounced content and internal debug UI; asks for SOC 2, data residency, encryption, who at the vendor can watch footage, and leak liability; vetoes
    cloud upload of pre-release footage
  p_typical: 0.1
  added_by: stage-D
- slug: cto-or-engine-lead-veto
  who: CTO or lead engine programmer who owns frame budget and the SDK allow-list
  notices: any SDK that costs >1-2 ms per frame, adds APK size or triggers thermal throttling is refused; anti-cheat (EAC, BattlEye) may flag screen capture hooks; wants zero-integration or engine-level
    options
  p_typical: 0.1
  added_by: stage-D
- slug: in-house-analytics-head-build-vs-buy
  who: Head of analytics/BI who already owns Amplitude/GameAnalytics/Snowflake and has access to general video LLMs
  notices: '''we can point Gemini at a sample of sessions ourselves''; refuses another dashboard; only accepts output as tables in the warehouse joined to their event IDs'
  p_typical: 0.1
  added_by: stage-D
- slug: player-opt-in
  who: The player asked to share their screen (adult and minor), and the community manager who fields their reaction
  notices: opt-in rate, what incentive makes them share (currency, beta access), Reddit backlash over 'the game records me', battery drain complaints in reviews
  p_typical: 0.1
  added_by: stage-D
- slug: analytics-or-attribution-vendor-white-label
  who: BD or product lead at an analytics, attribution or engine vendor (MMP, game-analytics SaaS, engine services, backend-as-a-service) who would embed or white-label the capability
  notices: wants an API/OEM licence to add 'see why' to their existing dashboards; already has the SDK installed in thousands of games, solving distribution and consent plumbing
  p_typical: 0.1
  added_by: stage-D
- slug: outsourced-qa-and-loc-vendor
  who: Ops director at an outsourced QA, localisation or player-support vendor (full-service game services firm)
  notices: either buys the tool to raise tester throughput and margin, or fights it because it replaces billable headcount; owns the testers' capture rigs already
  p_typical: 0.1
  added_by: stage-D
- slug: ad-network-and-mediation-ops
  who: Product/ops at an ad network, mediation platform or DSP serving rewarded and interstitial ads inside games
  notices: whether the ad actually rendered and was visible, ad placement quality, player reaction to the ad, playable-ad completion, fraud (bots and emulator farms) visible on screen
  p_typical: 0.1
  added_by: stage-D
- slug: in-game-advertiser-brand
  who: Brand or agency buying intrinsic in-game ads, sponsorships or creator integrations
  notices: on-screen logo exposure seconds, viewability of billboards in 3D scenes, sponsored-stream verification; pays measurement vendors today
  p_typical: 0.1
  added_by: stage-D
- slug: market-intel-and-alt-data-buyer
  who: Market intelligence firm or investment analyst buying cross-game behavioural and monetisation data
  notices: live-ops cadence, price-point changes, store layouts, engagement shifts across titles, sold as a panel or feed
  p_typical: 0.1
  added_by: stage-D
- slug: publisher-scout-or-investor-diligence
  who: Publishing BD scout or game investor evaluating a pitch build or soft-launch title
  notices: wants an independent read of FTUE quality and player behaviour before signing or funding; today relies on the developer's own metrics
  p_typical: 0.1
  added_by: stage-D
- slug: rating-and-consumer-protection-compliance
  who: Compliance lead facing age ratings (ESRB/PEGI/IARC), loot-box and dark-pattern rules (EU consumer law, FTC settlements, regional approvals)
  notices: evidence from footage of odds disclosure, countdown pressure, currency obfuscation, content descriptors; audits are per build and manual
  p_typical: 0.1
  added_by: stage-D
- slug: certification-release-manager
  who: Release manager submitting builds to console certification and store review
  notices: cert failures on UI requirements (error messages, save indicators, safe areas) found late; wants pre-submission check from footage
  p_typical: 0.1
  added_by: stage-D
- slug: localisation-lead
  who: Localisation lead shipping in 10-15 languages
  notices: text overflow, truncation, untranslated strings and font fallback visible only in-game; LQA is manual playthrough per language
  p_typical: 0.1
  added_by: stage-D
- slug: creator-and-community-marketing
  who: Community or creator-program manager
  notices: which in-game moments players clip and share, creator content performance, ready-to-post clips from real sessions, sentiment on stream
  p_typical: 0.1
  added_by: stage-D
- slug: device-oem-and-chip-vendor
  who: Gaming program lead at a phone OEM or mobile chipset vendor
  notices: per-title frame pacing, thermal throttling and rendering artefacts on their hardware versus competitors; pays for game optimisation programs
  p_typical: 0.1
  added_by: stage-D
