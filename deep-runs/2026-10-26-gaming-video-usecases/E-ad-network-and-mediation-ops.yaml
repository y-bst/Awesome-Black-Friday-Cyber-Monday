  example: "Runner game: after the frequency change app-kill-after-ad is 11%; Slack alert goes to the publisher success manager, who proposes a cap of 1 per 3 levels"
  cost: S
  depends_on: "ring-buffer capture in the SDK; session-end hook"
  buyer: "Publisher success manager at a mediation platform"
  input: "Triggered 30-60 s on-device clips around ad close and app kill, placement id, frequency cap settings"
  why_existing_tools_cannot: "methods-churn-funnel.md section 6: Sentry-style error ring buffers key on crashes, and replay tools key on UI trees; no note shows a trigger keyed on ad-close-then-kill"
  willingness_to_pay: "2: speculative, no price in the notes; an alert is cheap to build and a publisher-retention argument for the network, est. bundled into a premium SDK tier"

- id: adnet-12
