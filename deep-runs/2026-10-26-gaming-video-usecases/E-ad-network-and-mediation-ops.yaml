  cost: M
  depends_on: "random-sample capture in the SDK; agreement on a viewability definition with advertisers"
  buyer: "Billing or measurement ops lead at an ad network or DSP"
  input: "Randomly sampled ad-surface frames plus SDK impression id, foreground and audio-state flags"
  why_existing_tools_cannot: "market.md section 5: Relo Metrics-style CV exists for broadcast sports and was not found for in-game moments; market.md section 2: generic replay tools see black boxes for game canvases"
  willingness_to_pay: "2: no price signal in the notes for viewability in games; Hatchet $249-$1,249/month shows marketers pay for measurement, speculative at CPM-linked pricing"

- id: adnet-11
  title: "Ad-fatigue app-kill alert: flag publisher games where the app is killed or backgrounded within 2 s of an ad close in more than 8% of sessions"
  level: L4
  cell: {buyer-role: ad-network-ops, video-source: own-players-consented-sdk, signal-extracted: device-context-interruptions-and-app-switch, analysis-type: anomaly-alert, lifecycle-moment: d1-to-d7, delivery-form: alert-or-slack, capture-trigger-and-sampling: on-crash-or-anomaly, game-platform-and-genre: mobile-casual-hypercasual, companion-data: telemetry-events}
  object: "session end timestamp within 2 s after an interstitial close, with the ad frames and the state of the game before it"
