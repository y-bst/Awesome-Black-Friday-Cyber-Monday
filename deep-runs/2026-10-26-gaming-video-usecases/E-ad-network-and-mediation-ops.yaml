- id: adnet-25
  title: "Closed-loop ad suppression: skip the next interstitial when pixel-based arousal reads 'frustrated' for the last 20 s"
  level: L4
  cell: {buyer-role: ad-network-ops, video-source: own-players-consented-sdk, signal-extracted: emotion-arousal-from-pixels, analysis-type: real-time-in-session-intervention, automation-level: closed-loop-in-game-action, processing-location: on-device, constraint-to-overcome: accuracy-and-trust, buyer-org-type: ad-network-or-dsp, game-platform-and-genre: mobile-midcore-f2p}
  object: "on-device arousal estimate from gameplay pixels 20 s before an ad call, used to hold or show the ad"
  situation: "A player has failed a level 5 times in 3 minutes and the network SDK is about to show an interstitial"
  consequence: "At 78% average accuracy for arousal (98% best case), roughly 1 in 5 decisions is wrong; revenue lost by skipping ads and players still annoyed by wrongly shown ads; the lift in D1 is unproven"
  p_typical: 0.04
  grounded: quote
  evidence: "methods-churn-funnel.md section 5: Makantasis et al. ACII 2019, 'arousal predicted from gameplay video alone, over 78% accuracy on average and 98% at best'; section 3 INFERRED: video features are 'a research gap rather than a proven lift'"
  proposed: "Do not ship closed-loop; log arousal as a feature in a shadow mode for 2 months and test with a holdout"
  shallow: false
  mechanism: "An on-device model reads gameplay frames, outputs an arousal and frustration score, and the SDK adjusts ad timing within a game that opts in"
  example: "Match-3 game: after 5 fails the SDK delays an interstitial by one level; the A/B test shows +1.1 points D1 but -6% ad revenue per DAU"
  cost: L
  depends_on: "per-game arousal model; ground-truth labels; A/B infrastructure; publisher opt-in"
  buyer: "Mediation platform product lead; publisher monetisation lead as the approver"
