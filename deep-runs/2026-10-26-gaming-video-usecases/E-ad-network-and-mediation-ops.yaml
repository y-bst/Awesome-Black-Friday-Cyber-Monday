  p_typical: 0.05
  grounded: inferred
  evidence: "methods-churn-funnel.md section 2: 'the exact screen state at the moment of app kill (rage quit vs. interruption)' is visible in video and absent from events; Sentry's onErrorSampleRate pattern buffers the last minute and uploads only on trigger (section 6)"
  proposed: "Trigger a clip upload on app kill within 2 s of ad close and a Slack alert when the share exceeds the 8% threshold for a placement"
