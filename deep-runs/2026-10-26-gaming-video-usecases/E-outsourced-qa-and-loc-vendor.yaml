  object: "Nimdzi 'The Linguist, the Bot and the Bug Report' wished-for feature: language-aware visual anomaly detection (truncation, RTL rendering); adjacent-usecases.md section 5"
  situation: "A German build of a mobile midcore game: 1,400 UI screens, a button label 'Belohnung einlösen' clipped at 9 of 14 characters on a 5.5-inch device; today a linguist scrolls tester footage and screenshots by hand per language"
  consequence: "The vendor bills LQA hours per language; every extra language multiplies screen-review hours linearly, so the vendor loses fixed-price bids to rivals that quote lower"
  p_typical: 0.07
  grounded: quote
  evidence: "adjacent-usecases.md section 5: 'generic screenshot tools fall short for linguistic testing automation; wished-for features include language-aware visual anomaly detection (truncation, RTL rendering)'"
  proposed: "Detect text regions with OCR, compare rendered glyph count with source-string length from the TMS export, flag clipped, overlapping or still-English strings with a cropped frame attached"
  shallow: false
  mechanism: "OCR the tester footage, align each recognised string to a TMS string ID, test rendered text bounding box against its parent widget box, emit a ticket per screen with the crop"
  example: "Vendor runs 11 languages on a match-3 build; the tool returns 63 truncated labels in German and Finnish in one night, each with a frame and the string key, instead of a linguist watching 6 hours per language"
  cost: M
  depends_on: "OCR plus UI-widget detection (mAP about 91% on mobile game UI per methods-churn-funnel.md section 4), a TMS string-key export from the client"
  buyer: "Ops director or LQA lead at a full-service localisation and QA vendor (Alconost, Gridly-style, Keywords-style)"
  input: "tester rig screen video of the localised build plus the TMS string export with character limits"
  why_existing_tools_cannot: "adjacent-usecases.md section 5: no vendor found offering a recording-based overflow check; Gridly, Alconost and MarsTranslation LQA are human review of screenshots and video"
  willingness_to_pay: "3: no price in notes for LQA; buyer signal is Nimdzi naming the wish and per-language LQA being sold by the hour (outsourced QA USD 15 to 50 per tester hour, adjacent-usecases.md section 1)"

