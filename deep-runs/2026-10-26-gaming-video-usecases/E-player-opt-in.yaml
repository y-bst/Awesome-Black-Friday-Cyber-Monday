  cell: {buyer-role: product-retention, video-source: own-players-consented-sdk, analysis-type: ab-test-variant-explanation, constraint-to-overcome: player-opt-in-rate, capture-trigger-and-sampling: opt-in-panel, game-platform-and-genre: mobile-midcore-f2p, delivery-form: dashboard}
