  grounded: inferred
  evidence: "Apple 2019 rule: 'explicit user consent and ... a clear visual indication when recording' (methods-churn-funnel.md section 7); 'Practical sampling knobs ... user-level sampling (e.g. 1-5% of new installs)' (methods-churn-funnel.md section 7)"
  proposed: "Ship three prompt variants behind a remote flag; dashboard shows accept rate, D1/D7 retention and spend of accepters vs decliners per variant"
  shallow: false
  mechanism: "Randomises consent-prompt timing and copy per new install, logs accept/decline/dismiss with dwell time, then compares accepter telemetry against decliners per variant so the studio picks the variant with the best accept rate that does not skew who is recorded"
  example: "Match-3 studio tests 'at install' vs 'after level-3 win' vs 'D2 start' on 30k installs each, picks the variant that reaches 12% accept without the accepters' D1 exceeding decliners' D1 by more than 3 points"
  cost: S
  depends_on: "own-player capture SDK and a remote-config flag service"
  buyer: "Product lead or FTUE owner at a mid-size mobile F2P studio"
  input: "consent-prompt impression, accept, decline and dwell-time events plus telemetry events (D1, D7, spend) per install; video only for accepters"
  why_existing_tools_cannot: "Replay vendors treat consent as a one-line opt-in flag and none measure or test the accept rate (methods-churn-funnel.md section 6 and 7); playtest vendors recruit paid testers so never face the question (market.md section 1)"
  willingness_to_pay: "3: bundled into the capture product; the buyer already pays for funnel and replay tools (UXCam median about $21k/year, market.md section 2)"
