- id: a11y-25
  title: Outsourced QA vendor sells an AI-assisted accessibility audit at a fixed price per title
  level: L4
  cell:
    buyer-role: outsourced-qa-vendor
    video-source: outsourced-tester-rigs
    signal-extracted: accessibility-contrast-and-subtitles
    analysis-type: compliance-audit
    lifecycle-moment: pre-launch-qa
    delivery-form: managed-service-with-analyst
    buyer-org-type: outsourced-services-vendor
    pricing-model: managed-project
    go-to-market-channel: through-services-vendor
    value-lever-b2b: replace-labour-hours
  object: Keywords Studios QA revenue and 'Mighty Build and Test' platform; outsourced QA at USD 15-50 per tester hour (adjacent-usecases.md section 1)
  situation: A services vendor wants a margin-positive accessibility audit product alongside functional QA
  consequence: Accessibility audit hours are billed at tester rates and capped by human capacity; the vendor either has no offer or resells MGATS-like manual work
  p_typical: 0.06
  grounded: inferred
  evidence: 'adjacent-usecases.md section 1: Keywords sells AI-driven Mighty Build and Test and outsourced game QA runs ''USD 15 to 50 per tester hour''; market.md section 3: Keywords ''QA revenue is labour-based
    outsourcing''. Inference: nothing states a services vendor wants an accessibility audit product.'
  already_offered: false
  proposed: Vendor runs the detectors on its testers' capture rigs and a human reviews flagged items; price per title
  shallow: false
  mechanism: Detectors run on footage the vendor's rigs already record; a human tester confirms each flag and signs the report
  example: 'A 100-hour manual accessibility pass becomes 30 hours: 70 hours of footage review is replaced by flag confirmation'
  cost: M
  depends_on: Detector set; a services partner willing to cannibalise billable hours
  buyer: Operations director at an outsourced QA or localisation vendor
  input: Tester rig video of the studio's build
  why_existing_tools_cannot: 'market.md section 3: Keywords and others have no productised AI video analysis; adjacent-usecases.md section 4: accessibility audits are human'
  willingness_to_pay: 3 - at USD 15-50 per tester hour (adjacent-usecases.md section 1) 70 saved hours is USD 1,050-3,500 of margin per title, if the vendor accepts lower billings
  perspective: accessibility-compliance-officer
- id: adnet-1
  title: 'Blank-or-hidden-ad detector: classify the last 3 frames before every rewarded-ad close as rendered / black / frozen / close-button-missing, per ad adapter and device model'
  level: L4
  cell:
    buyer-role: ad-network-ops
    video-source: ad-and-playable-ad-sessions
    signal-extracted: ad-render-and-viewability
    analysis-type: ad-verification-and-fraud
    buyer-org-type: ad-network-or-dsp
    companion-data: purchase-and-ad-revenue-events
    delivery-form: dashboard
    game-platform-and-genre: mobile-casual-hypercasual
  object: 'rewarded-ad session on a publisher''s Android game: SDK-reported ''ad completed'' event versus the rendered frames of the ad surface'
  situation: The mediation SDK logs impression=true and reward=granted, but 4% of completions on one adapter on Android 12 mid-range phones show a black rectangle for the full 30 s
  consequence: The network bills advertisers for impressions no one saw and publishers see 'rewarded video unavailable' complaints; one blank adapter on 4% of 2M daily rewarded views is 80,000 wasted impressions
    a day
  p_typical: 0.15
  grounded: inferred
  evidence: 'market.md section 2 INFERRED: engine-rendered game canvases ''show up as a black box or as screenshots''; no note covers ad rendering, so this is an extension of the same capture limit to ad
    surfaces'
  already_offered: false
  proposed: 'Per adapter x device x OS: share of ad sessions with a visible creative, with 5 sample clips of the worst cell'
  shallow: false
  mechanism: A small on-device or edge frame classifier reads sampled frames (1-2 fps) of the ad surface and returns a visibility verdict; the verdict is joined to the SDK impression id and rolled up per
    adapter, device model and OS
  example: 'Hyper-casual runner: ad network ops sees ''Adapter X, Pixel 6a, Android 12: 9% blank'' on Monday, pauses that adapter for the model, and refunds the affected impressions'
  cost: M
  depends_on: an ad-surface capture hook in the network's own SDK; consented sampling; impression id passed to the verdict
  buyer: Ad quality or SDK ops lead at a mediation platform or ad network
  input: Ad-surface screen frames sampled at 1-2 fps from the network's own SDK plus the SDK impression id, adapter name, device model, OS version
  why_existing_tools_cannot: 'market.md section 2: Bugsee and Instabug record video of crashes but do no automated visual analysis of frames, and PostHog Unity replay is screenshot-only; no note lists any
    tool that verifies an ad actually rendered'
  willingness_to_pay: '3: no ad-network price in the notes (speculative); the nearest anchor is UXCam about $21k/year median (market.md section 2) and a loss of 4% of billable impressions is a direct revenue
    number for the buyer'
  perspective: ad-network-and-mediation-ops
- id: adnet-2
  title: 'Accidental-click classifier: tap lands within 400 ms of an interstitial appearing, on the close-button area, with no visible reading dwell'
  level: L4
  cell:
    buyer-role: ad-network-ops
    video-source: ad-and-playable-ad-sessions
    signal-extracted: input-timing-and-hesitation
    analysis-type: ad-verification-and-fraud
    buyer-org-type: ad-network-or-dsp
    companion-data: touch-and-controller-input
    capture-trigger-and-sampling: event-triggered-clip
    delivery-form: alert-or-slack
  object: interstitial ad frame sequence with the touch overlay at the moment of the first tap after appearance
  situation: A player is mid-swipe in a runner game when a full-screen interstitial pops up at t=0 and the tap at t=+0.31 s opens the store page; the click is billed as a valid CPC/CPI intent
  consequence: Advertisers' install quality drops, the network gets refund requests; if accidental clicks are 15% of one publisher's clicks, that publisher is a quality risk
  p_typical: 0.05
  grounded: inferred
  evidence: 'methods-churn-funnel.md section 2: ''Signals that exist in screen video (plus touch overlay) but not in standard event streams: ... repeated failed gestures (mis-swipes) ... time-to-first-meaningful-action'';
    UXCam rage-tap rule uses a 300 ms threshold'
  already_offered: false
  proposed: Flag clicks with tap latency under 400 ms after render and a preceding in-game swipe still in progress; score publisher games by accidental-click share
  shallow: false
  mechanism: Video of the ad surface plus touch trace; classifier labels the click as deliberate (dwell on CTA, pause in prior game input) or accidental (carry-over gesture, hit on a moving close button);
    output is a per-publisher accidental-click rate
  example: Puzzle game publisher A has 18% accidental clicks versus a 5% network median; the network adds a 1.0 s input guard to A's interstitial and invoices fall back
  cost: M
  depends_on: touch event stream and ad-surface frame capture in the network SDK; click event id
  buyer: Traffic quality or publisher-ops manager at an ad network or mediation platform
  input: Ad-surface video plus touch coordinates with timestamps, the prior 2 s of game touch input, click and install postbacks
  why_existing_tools_cannot: 'methods-churn-funnel.md section 2: UXCam rage-tap and unresponsive-gesture rules work on app view trees with a fixed 300 ms rule, not on game canvases or ad surfaces; competitor-and-ua.md
    section 2 shows ad spy tools only see the creative, not the click moment'
  willingness_to_pay: '2: no price signal in the notes for click-quality tools; speculative demand because refunds and advertiser churn are a network cost, est. a per-publisher-game monthly fee'
  perspective: ad-network-and-mediation-ops
- id: adnet-3
  title: 'Emulator-farm fingerprint from screen video: 200 sessions with identical frame sequences and tap coordinates on a 1-pixel grid'
  level: L4
  cell:
    buyer-role: ad-network-ops
    video-source: ad-and-playable-ad-sessions
    signal-extracted: bot-or-fraud-behaviour
    analysis-type: ad-verification-and-fraud
    buyer-org-type: ad-network-or-dsp
    companion-data: touch-and-controller-input
    capture-trigger-and-sampling: random-sample
    processing-location: vendor-cloud
    constraint-to-overcome: ground-truth-labels
  object: per-session sequence of ad-surface and game-surface frames plus tap trace, clustered across sessions that share a campaign id
  situation: A campaign's installs arrive with 200 sampled sessions that show the same 14 frames in the same order, taps at the same pixel (540, 1620) at the same timestamp offset +/-20 ms
  consequence: The advertiser pays CPI for emulator installs; the network discovers it at D7 payer rate rather than at hour 2, and the invalid share is clawed back from the publisher
  p_typical: 0.12
  grounded: inferred
  evidence: 'adjacent-usecases.md section 2: ''vision-cheat growth (screen-reading bots) is the reason video-level detection is a live problem; sellers of it are few''; Anybrain claims detection of pixel-bot
    cheats; FACEIT says AI-based and DMA cheats were 40% of cheating bans in May 2026'
  already_offered: false
  proposed: Cluster sampled sessions by frame-sequence hash and tap-coordinate entropy; auto-flag clusters over 50 sessions for campaign pause
  shallow: false
  mechanism: Perceptual hashes of keyframes and quantised tap coordinates give a per-session fingerprint; near-duplicate clustering across sessions of one campaign or publisher marks scripted traffic; humans
    see 3 sample clips
  example: 'Casual card game, campaign X: 612 of 3,000 sampled installs fall into 4 near-identical trajectories; campaign is paused at 6 hours instead of at the D7 payer check'
  cost: M
  depends_on: sampled session capture with touch trace; campaign id; labelled fraud cases from the network's existing blocklist
  buyer: Fraud and traffic quality lead at an ad network, DSP or mobile measurement vendor
  input: Sampled on-device screen frames and touch traces from the network SDK, campaign id, device and IP metadata
  why_existing_tools_cannot: 'adjacent-usecases.md section 2: no source confirms any vendor running computer vision on recorded footage as production anti-cheat; vision work found is academic or built as
    test cheats, and public detail is server-side input and timing models'
  willingness_to_pay: '3: no price in the notes for ad fraud; Anybrain is quote-only; speculative because invalid-traffic refunds are a direct line item for a network'
  perspective: ad-network-and-mediation-ops
- id: adnet-4
  title: 'Interrupt-quality score per placement: label what the player was doing in the 2 s before each interstitial (mid-swipe, boss fight, results screen, menu) and rank placements'
  level: L4
  cell:
    buyer-role: ad-network-ops
    video-source: own-players-consented-sdk
    signal-extracted: ui-state-and-screen-flow
    analysis-type: anomaly-alert
    lifecycle-moment: live-event-or-update
    delivery-form: per-cohort-report
    game-platform-and-genre: mobile-midcore-f2p
    companion-data: purchase-and-ad-revenue-events
    value-lever-b2b: increase-coverage-from-sample-to-all
    buyer-org-type: ad-network-or-dsp
  object: interstitial placement id on a publisher's game, with the game-surface frames of the 2 s before the ad call
  situation: A publisher sets a placement 'level_end' but the ad fires on 11% of calls while the player is still in the boss-fight animation of the next level
  consequence: Players kill the app within 3 s of the ad close, publishers blame the network, and the placement's eCPM looks high while D1 falls; a 3-point D1 loss on 300k daily installs is 9,000 lost day-1
    players
  p_typical: 0.04
  grounded: inferred
  evidence: 'methods-churn-funnel.md section 6 INFERRED: sampling keyed on ''tutorial step abandon, app kill on fail screen'' is the adaptation; no note shows any vendor labelling the moment an ad interrupts'
  already_offered: false
  proposed: A 'moment type' tag on each ad call and a table of placement x moment x app-kill-within-5-s share
  shallow: false
  mechanism: A UI-state classifier labels the game frame at the ad call (fail screen, in-action, results, menu, loading); the label is joined to the ad event and to the 5 s after close; output ranks placements
    by interrupt cost
  example: 'Match-3 game: placement ''after_fail'' kills 14% of sessions within 5 s of close versus 3% for ''after_win''; the mediation team recommends moving frequency from the first to the second'
  cost: M
  depends_on: consented sampled capture in the mediation SDK; per-game UI-state labels bootstrapped by a VLM
  buyer: Publisher-success or yield manager at a mediation platform serving rewarded and interstitial ads
  input: Sampled game-surface frames around each ad call from the mediation SDK plus ad events, revenue events, session-end timestamps
  why_existing_tools_cannot: 'market.md section 2: generic replay tools reconstruct native UI trees and miss game canvases; competitor-and-ua.md section 3: every UA tool analyses the ad plus network metrics
    (IPM, CPI), none the player state at ad time'
  willingness_to_pay: '3: no price in the notes for placement analytics; a yield manager already bills on eCPM, so a tool that moves D1 and ad revenue per DAU has a direct anchor (speculative, est. a few
    $k per month per publisher account)'
  perspective: ad-network-and-mediation-ops
- id: adnet-5
  title: 'Adapter-by-device render-defect matrix: run scheduled bot playthroughs on 40 device models and score each mediated network''s ad for overlap, stretch, notch cut-off and wrong orientation'
  level: L4
  cell:
    buyer-role: ad-network-ops
    video-source: automated-bot-or-agent-playthrough
    signal-extracted: visual-errors-and-glitches
    analysis-type: build-to-build-regression-diff
    lifecycle-moment: new-version-release
    capture-trigger-and-sampling: scheduled-bot-playthrough
    delivery-form: issue-tracker-ticket
    buyer-org-type: ad-network-or-dsp
    automation-level: auto-created-ticket-or-asset
    companion-data: build-and-config-metadata
  object: mediation SDK release candidate rendering ads from 6 networks on a device farm
  situation: SDK 4.9 ships; on foldables an ad is stretched to 1.4x aspect and its close button sits under the camera cut-out on 3 of 40 tested models
  consequence: The defect is found by publishers in store reviews 4 days later; with the matrix it is a ticket at hour 2 with the clip attached
  p_typical: 0.08
  grounded: inferred
  evidence: 'market.md section 3: Razer QA Companion-AI detects rendering bugs from footage and files Jira tickets with video; nunu.ai agents play via a live device stream; adjacent-usecases.md section
    6: 500 to 2,000+ device-OS combinations for a major mobile title; none of these point at ad SDKs'
  already_offered: false
  proposed: Nightly device-farm run against the SDK release candidate; ticket per defect with clip, device, adapter and network
  shallow: false
  mechanism: A scripted or vision-agent bot plays a test game that requests ads from each mediated network on a device farm; a visual-defect classifier compares each ad frame set to expected layout rules
    and opens a ticket
  example: 'SDK 4.9 release candidate: ticket ''Network C interstitial close button hidden on Galaxy Z Fold, landscape'' with 12 s clip attached before release goes out'
  cost: M
  depends_on: device farm access (AWS Device Farm, BrowserStack, own lab); a test game with the SDK; Jira integration
  buyer: SDK QA lead or release manager at a mediation platform
  input: Bot-driven screen video on real devices from a test game, ad requests per network, device and OS metadata, expected layout rules
  why_existing_tools_cannot: 'market.md section 3 and adjacent-usecases.md section 1: Razer, ManaMind and nunu.ai test game content, not third-party ad creatives injected at runtime; GameDriver is object-level
    and has no video'
  willingness_to_pay: '3: QA anchors in the notes are outsourced QA USD 15-50 per tester hour and GameDriver from $150/month; an SDK vendor with hundreds of customers would justify low five figures per
    year (speculative)'
  perspective: ad-network-and-mediation-ops
- id: adnet-6
  title: 'Playable-ad drop-off trace: per-second map of where players abandon a playable and what they hesitated on, delivered per creative id'
  level: L4
  cell:
    buyer-role: ad-network-ops
    video-source: ad-and-playable-ad-sessions
    signal-extracted: input-timing-and-hesitation
    analysis-type: funnel-drop-off-why
    lifecycle-moment: ua-campaign-launch
    delivery-form: per-cohort-report
    game-platform-and-genre: mobile-casual-hypercasual
    pricing-model: per-mau
    buyer-org-type: ad-network-or-dsp
    companion-data:
    - touch-and-controller-input
    - attribution-campaign-and-creative-id
  object: 'playable ad session: first 30 s of interaction with the touch overlay, ending in close, store click or timeout'
  situation: A playable has 38% completion but 70% of drop-offs happen at second 9, where an unlabelled draggable item appears and 4 taps hit nothing
  consequence: The advertiser sees only 'low completion' in the network dashboard and rebuilds the whole playable at $3,000-$5,000; the actual fix is moving one hint by 2 s
  p_typical: 0.06
  grounded: inferred
  evidence: 'competitor-and-ua.md section 3: Segwise (vendor) describes ''playables being too slow to tag by hand so most teams skip them'', and playables cost ''playables $3,000-$5,000 each externally
    (AppAgent) up to $30,000+ for complex ones''. Inference: this names a tagging gap and a spend line, but no note describes a per-second hesitation view inside a playable.'
  already_offered: false
  proposed: A second-by-second hesitation and dead-tap map per playable, with 10 sample clips of the main drop second
  shallow: false
  mechanism: Screen frames and touch trace of playable sessions are segmented into states (intro, first action, hint, fail, end card); dead taps and idle seconds are counted per state and aggregated per
    creative id
  example: 'Merge playable P-221: 61% of players wait 5+ s at second 9 on an unlabelled draggable; network sends the advertiser a report and a suggested hint position, and completion rises on the next version'
  cost: M
  depends_on: playable runtime instrumented to export frames and touches, with the network's viewer consent in the ad container
  buyer: Creative-services or playable-ads product manager at an ad network, white-labelled to advertisers
  input: Playable ad screen frames at 2-5 fps plus touch coordinates, creative id, impression and click events
  why_existing_tools_cannot: 'competitor-and-ua.md section 3: Segwise, Alison.ai and Vidmob tag ads and report network metrics; playables are tagged by hand or skipped; none returns a per-second view of
    player hesitation inside the playable'
  willingness_to_pay: '3: Segwise tiers $499-$1,699/month by ad spend and playable build costs of $3,000-$5,000 each show budget exists, est. $500-$1,500/month per advertiser seat resold by the network'
  perspective: ad-network-and-mediation-ops
- id: adnet-7
  title: 'Post-install truth card: sell advertisers a per-creative panel of 50 consented first-session clips from their own acquired installs'
  level: L3
  cell:
    buyer-role: ad-network-ops
    video-source: own-players-consented-sdk
    signal-extracted: ui-state-and-screen-flow
    analysis-type: creative-insight-for-ads
    lifecycle-moment: ua-campaign-launch
    delivery-form: clip-reel
    value-lever-b2b: produce-a-sellable-asset
    companion-data: attribution-campaign-and-creative-id
    capture-trigger-and-sampling: opt-in-panel
    buyer-org-type: ad-network-or-dsp
  object: creative id from the network's own impression log joined to the first 5 minutes of footage from opt-in installs in the network SDK
  situation: An advertiser asks why creative C-17 has CPI $1.20 but no payers; the network holds creative and install data but nothing on what players did after the click
  consequence: The network loses budget to networks with better post-install optimisation; a 10% budget loss on $2M monthly spend is $200,000
  p_typical: 0.07
  grounded: quote
  evidence: 'competitor-and-ua.md section 3 INFERRED: ''Every tool above analyses the ad video plus network metrics (impressions, IPM, CPI). None links an ad element to what the acquired player did on device
    in the first session''; GeekLab: hard to see which creative acquired players who later retain and pay'
  already_offered: false
  proposed: Clip reel and a 'promise kept' score per creative, delivered through the network's advertiser console
  shallow: false
  mechanism: Where the network SDK is also in the advertised game, opt-in sessions are sampled for the first 5 minutes; a VLM labels the screens and the mechanic shown in the ad, and the network sells a
    per-creative 'shown vs delivered' score as an advertiser add-on
  example: Casual puzzle advertiser sees that 60% of C-17 installs never reach the advertised bomb mechanic before minute 5, swaps the creative, and CPI-to-payer ratio improves
  cost: L
  depends_on: the network SDK present in the advertised game (partner studios only); opt-in consent; creative id join
  buyer: Product lead for advertiser tools at an ad network or DSP
  input: Consented first-session video from advertiser games that run the network SDK, creative id and install id, the ad creative itself
  why_existing_tools_cannot: 'competitor-and-ua.md section 3: Segwise, Alison.ai, Replai, Vidmob stop at the ad and network metrics; GeekLab says creative-to-retained-player linkage is weak, especially
    on iOS'
  willingness_to_pay: '3: UA tool anchors are Segwise $499-$1,699/month and Sensor Tower about $75,000/year median; a network could price it as an add-on to media spend, speculative'
  perspective: ad-network-and-mediation-ops
- id: adnet-8
  title: 'Rival-network ad library built by bots: scheduled playthroughs of 300 games log which advertiser creative each competing network actually serves, with timestamp and placement'
  level: L4
  cell:
    buyer-role: ad-network-ops
    video-source: automated-bot-or-agent-playthrough
    signal-extracted: ad-render-and-viewability
    analysis-type: benchmark-vs-competitor
    capture-trigger-and-sampling: scheduled-bot-playthrough
    delivery-form: api-or-sdk
    buyer-org-type: ad-network-or-dsp
    game-platform-and-genre: mobile-midcore-f2p
    value-lever-b2b: create-data-that-did-not-exist
  object: ad creatives shown inside publisher games during bot sessions, identified by network SDK name on screen and the end-card store link
  situation: A network wants to know which top-10 advertisers its competitor serves in a puzzle game and at what frequency; AppLovin publishes no public ad library and manual screenshots mislabel ads as
    that game's creative
  consequence: Sales teams guess competitor share of voice from Sensor Tower estimates priced at $29,500-$115,460 a year; a bot library gives per-game frequency and creative lists
  p_typical: 0.04
  grounded: quote
  evidence: 'competitor-and-ua.md section 2: ''AppLovin publishes no public competitor ad library; screenshotting ads seen inside another game mislabels them as that game''s creative (vendor guide)'''
  already_offered: false
  proposed: A weekly table of (publisher game, network, advertiser, creative hash, count) from bot sessions across 300 games
  shallow: false
  mechanism: Vision-agent bots play 300 games on rented devices; the ad-frame detector tags the ad network by SDK chrome and end-card, extracts the advertised app from the store handoff, and hashes the
    creative for dedupe
  example: Network strategy team sees a rival gave 22% of interstitials in 40 hyper-casual games to one advertiser, and builds a targeted pitch to that advertiser
  cost: L
  depends_on: device farm access; per-game login handling; legal review of terms of service
  buyer: Competitive intelligence or sales strategy lead at an ad network or mediation platform
  input: Bot-driven screen video on rented devices, store handoff URLs on ad click, a list of 300 target games
  why_existing_tools_cannot: 'competitor-and-ua.md section 2: AppLovin has no public library and manual spying mislabels ads; section 1: Sensor Tower (whole platform) is priced at $29,500-$115,460 a year
    via Vendr, and its Ad Intelligence Creative Gallery shows creatives by network, not what each game actually serves in session'
  willingness_to_pay: '2: Sensor Tower median $75,000/year is an anchor for the category, but the notes show no buyer asking for in-game served-ad capture; speculative, partly a terms-of-service risk'
  perspective: ad-network-and-mediation-ops
  variants_of: altdata-6
- id: adnet-9
  title: 'Reward-not-granted evidence clip: auto-attach the 30 s ring buffer to a publisher''s ''I watched the ad but got nothing'' ticket and diff SDK reward callback against frames'
  level: L4
  cell:
    buyer-role: ad-network-ops
    video-source: support-ticket-attachment
    signal-extracted: economy-and-store-events
    analysis-type: evidence-pack-for-enforcement
    capture-trigger-and-sampling: on-player-report
    delivery-form: enforcement-or-cert-evidence-pack
    companion-data: support-ticket-text
    buyer-org-type: ad-network-or-dsp
    automation-level: auto-created-ticket-or-asset
  object: rewarded-ad session ring buffer (30 s) from the player's device attached to a support ticket, with the SDK 'reward granted' callback timestamp
  situation: A player writes in with 'watched the full ad, got no gems'; the SDK log says the callback fired 0.4 s after the close, the game says it never arrived, and neither side has proof
  consequence: Each dispute takes 3-5 days of back and forth; with 1,000 disputes a month the network pays agents or refunds without evidence
  p_typical: 0.05
  grounded: inferred
  evidence: 'adjacent-usecases.md section 9: ''NOT FOUND: no off-the-shelf vendor of a rolling last-30-seconds game-client buffer attached to a ticket''; Helpshift auto-captures device and session state
    but no video confirmed'
  already_offered: false
  proposed: Verdict 'ad completed and reward callback missing' or 'ad skipped at 11 s' with the clip, for the publisher and the network to share
  shallow: false
  mechanism: On player report, the last 30 s of the ad surface is uploaded; the model checks completion (end card shown, timer reached 0) against the reward callback log and emits a verdict plus the clip
  example: Fantasy RPG publisher disputes 120 rewarded views in one month; the clips show 87 were truly completed and the callback failed on one adapter, so the network credits the publisher and files a
    bug
  cost: M
  depends_on: ring-buffer capture in the network SDK; report trigger in the host game; ticketing connector
  buyer: Publisher support or billing-disputes manager at a mediation platform or ad network
  input: On-report 30 s ring buffer of ad surface, SDK callback log, ticket text, device and OS
  why_existing_tools_cannot: 'adjacent-usecases.md section 9: Helpshift captures device and session state and no video was confirmed; Fullview, Screendesk are non-game and web-based; players self-record
    and agents watch'
  willingness_to_pay: '2: Helpshift is priced per issue with 1,000 issues/month included and reviewed as expensive; a dispute-evidence tool is a niche add-on, speculative'
  perspective: ad-network-and-mediation-ops
- id: adnet-10
  title: 'Billed-versus-seen impression audit: reconcile the network''s billed rewarded impressions with frame-verified ones for one publisher game and issue a credit memo'
  level: L4
  cell:
    buyer-role: ad-network-ops
    video-source: ad-and-playable-ad-sessions
    signal-extracted: ad-render-and-viewability
    analysis-type: compliance-audit
    delivery-form: enforcement-or-cert-evidence-pack
    pricing-model: cpm-or-per-impression-verified
    buyer-org-type: ad-network-or-dsp
    value-lever-b2b: avoid-fine-or-cert-failure
  object: 'monthly impression invoice line for one publisher game: 1.2M billed impressions versus a 20,000-session verified sample'
