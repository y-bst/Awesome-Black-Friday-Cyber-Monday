  why_existing_tools_cannot: "market.md s1: PlaytestCloud First Findings works within one playtest"
  willingness_to_pay: "3 - repository value grows with archive size; research teams pay for repositories but this one competes with the playtest vendor's own"

- id: uxr-12
  title: "Kids' playtest coder without think-aloud: for 7-12 year olds who do not verbalise, codes missed on-screen information (instruction visible but next action unrelated), random tapping bursts and adult-help requests"
  level: L4
  cell: {buyer-role: ux-research, video-source: recruited-playtesters, signal-extracted: input-timing-and-hesitation, analysis-type: funnel-drop-off-why, lifecycle-moment: ftue-first-session, delivery-form: per-cohort-report, constraint-to-overcome: minors-coppa-gdpr-k, processing-location: customer-cloud-byoc}
  object: "PlaytestCloud product line 'kids' playtests' (market.md s1); eye-tracking study of 43 children aged 7-16: 'some players even missed relevant information' (methods-churn-funnel.md s2)"
  situation: "Kids' test of a casual education game: transcripts are near-empty, so transcript-based AI produces no findings"
  consequence: "Today all kids' footage is coded by hand; pixel coding gives findings where the speech-based AI is blind, and BYOC processing keeps minors' footage in the studio's cloud"
  p_typical: 0.04
  grounded: quote
  evidence: "methods-churn-funnel.md s2: 'perception patterns varied a lot and some players even missed relevant information during playing'; market.md s1: kids' playtests are a listed product line"
  proposed: "No face, no voice retained; only screen and touch; footage deleted after coding"
  shallow: false
  mechanism: "Screen classifier detects instruction overlays; if the next touch is outside the indicated region or a burst of >5 taps in 2 s follows, mark 'instruction missed'; adult voice in audio marks 'help requested'"
  example: "Kids' word game: 6 of 9 children tap the decorative owl instead of the letter tiles after the instruction card; the team animates the tiles"
  cost: M
  depends_on: "uxr-1 classifier; BYOC deployment; parental consent flow from the panel vendor"
  buyer: "UX researcher at a studio making games for children (education, casual family)"
  input: "Recruited child playtester screen + touch overlay (no facecam)"
  why_existing_tools_cannot: "market.md s1: PlaytestCloud AI depends on transcripts; methods-churn-funnel.md s7: minors and biometric rules push away from face cam"
  willingness_to_pay: "3 - niche segment but kids' tests are a named paid product line (market.md s1); compliance cost of BYOC raises price"

- id: uxr-13
