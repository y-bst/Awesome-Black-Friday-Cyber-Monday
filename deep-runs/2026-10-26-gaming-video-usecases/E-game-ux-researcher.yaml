- id: uxr-1
  title: "Silent-friction coder for unmoderated playtests: flags struggle moments where the tester says nothing (card dwell under 1 s, 3+ taps on non-interactive art, 2+ fail screens in a row) and links each to its clip"
  level: L4
  cell: {buyer-role: ux-research, video-source: recruited-playtesters, signal-extracted: input-timing-and-hesitation, analysis-type: funnel-drop-off-why, lifecycle-moment: ftue-first-session, delivery-form: in-tool-annotation, effort: S-weeks, companion-data: touch-and-controller-input}
  object: "PlaytestCloud AI analysis 'uses the OpenAI API on video transcripts and survey responses' (market.md section 1, PlaytestCloud); methods-churn-funnel.md section 2 INFERRED list of signals 'that exist in screen video (plus touch overlay) but not in standard event streams'"
  situation: "A 12-player unmoderated FTUE test where 5 of 12 testers go quiet during tutorial steps 3-5; transcript-based AI produces no annotation for those minutes"
  consequence: "Researcher today scrubs 12 x 15 min = 3 h of video to find silent struggles; with the coder, each silent struggle shows as a timeline marker with type (mis-tap, dwell, repeat-fail) and the researcher reviews only 20-40 marked clips"
  p_typical: 0.25
  grounded: quote
  evidence: "market.md s1: 'the AI reads transcripts and surveys, not pixels. Nothing indicates computer-vision analysis of the gameplay frames'; methods-churn-funnel.md s2 INFERRED: 'dwell/reading time on a tutorial card before dismiss; taps on non-interactive art; a visible CTA never tapped'"
  proposed: "Add a 'silent' marker track to the existing User Test timeline, fed by per-title screen classifier plus touch overlay"
  shallow: false
  mechanism: "Per-title UI-state classifier (tutorial card visible, popup open, fail screen) plus touch overlay produces timed events; rules fire on dwell <1 s on cards, >=3 taps within 300 ms on non-interactive regions, >=2 consecutive fail screens, with no speech segment in the same 10 s window"
  example: "Match-3 FTUE test: tester 7 taps the locked booster icon 4 times in 2 s without speaking; marker 'tap on locked art, silent' at 04:12 lands in the readout as evidence that the booster lock state is unclear"
  cost: S
  depends_on: "Touch/controller overlay captured alongside video (Antidote already captures it; PlaytestCloud mobile capture needs checking); per-title screen labels for ~200 frames"
  buyer: "In-house games user researcher at a mid-size mobile studio already paying PlaytestCloud or Antidote"
  input: "Recruited playtester screen recording + touch overlay + think-aloud audio transcript"
  why_existing_tools_cannot: "market.md s1: PlaytestCloud AI keys on transcripts and surveys, not pixels; methods-churn-funnel.md s2: its AI 'keys on think-aloud speech, not on visible behaviour'"
  willingness_to_pay: "4 - studios already pay about EUR 113-141 per recorded and analysed session to PlaytestCloud (market.md WTP); this raises the yield of sessions already bought"

- id: uxr-2
  title: "Say-do contradiction flags: tester says 'that was easy' within 30 s of the third fail screen on the same level, or rates difficulty 2/5 in the survey after 4 retries"
  level: L4
  cell: {buyer-role: ux-research, video-source: recruited-playtesters, signal-extracted: speech-or-think-aloud, analysis-type: cohort-comparison, lifecycle-moment: prototype-and-greenlight, delivery-form: per-cohort-report, companion-data: survey-or-nps, automation-level: insight-for-human}
  object: "PlaytestCloud 'per-player summary, flagging moments of enjoyment/frustration' from transcripts and surveys (market.md s1); survey responses attached to each recorded session"
  situation: "Post-test survey shows median difficulty 2/5, while footage shows 6 of 10 testers failed level 4 three or more times"
  consequence: "Readouts that rely on what testers say overstate ease; designers ship a level that real players fail; the report shows each contradiction pair (utterance or survey answer + fail count + clip) so the researcher can weigh behaviour over self-report"
  p_typical: 0.06
  grounded: inferred
  evidence: "methods-churn-funnel.md s5: gameplay-feature models were 'significantly' more accurate than facial-feature models for perceived frustration; market.md s1: PlaytestCloud AI reads 'video transcripts and survey responses'"
  proposed: "One table per study: participant, statement or survey item, behavioural counter-evidence, clip link"
  shallow: false
  mechanism: "Align transcript sentiment and survey answers to UI-state events (fail screen count, retries, time on level); flag pairs where stated difficulty or enjoyment diverges from behaviour by a set threshold"
  example: "Puzzle prototype greenlight test: 7 of 10 say the tutorial 'made sense', but 5 of those 7 never used the hint button the tutorial introduced; the contradiction table goes into the greenlight deck"
  cost: S
  depends_on: "uxr-1 screen-state events; survey answers exported per participant"
  buyer: "UX research lead at a mid-size studio preparing greenlight or milestone readouts"
  input: "Recruited playtester video + think-aloud transcript + post-session survey answers"
  why_existing_tools_cannot: "market.md s1: PlaytestCloud flags frustration from what is said in transcripts; nothing reads the fail screens to check it against what was done"
  willingness_to_pay: "3 - bundled feature rather than a separate line item; the PlaytestCloud customer quote 'a real time-saver' (market.md WTP) shows value is in saved review time, which this adds little to"

- id: uxr-3
  title: "Moderator co-pilot for live moderated sessions: side-panel prompt within 5 s when the participant scrolls past the shop CTA twice or dwells >8 s on one screen, with a suggested non-leading probe"
  level: L4
  cell: {buyer-role: ux-research, video-source: recruited-playtesters, signal-extracted: attention-proxy-cursor-or-camera, analysis-type: real-time-in-session-intervention, lifecycle-moment: prototype-and-greenlight, delivery-form: alert-or-slack, processing-location: vendor-cloud, automation-level: recommendation}
  object: "PlaytestCloud 'moderated sessions' product line (market.md s1); Antidote synced face and gameplay recording 'up to 4K' with controller inputs (market.md s1)"
  situation: "A 60-minute remote moderated session on a PC prototype where the moderator also takes notes and misses that the player hovered over the crafting tab 3 times without opening it"
  consequence: "Missed probes cannot be recovered after the session; the co-pilot surfaces 'hovered crafting tab 3x, never opened; ask: what were you expecting to find there?' while the participant is still on that screen"
  p_typical: 0.04
  grounded: inferred
  evidence: "market.md s1 lists 'moderated sessions' at PlaytestCloud; methods-churn-funnel.md s4: HUD detection plus OCR is 'fast enough for real-time use during play, not only on recordings' (ICCS 2020)"
  proposed: "Moderator-only overlay in the session tool; never shown to the participant; probes come from a fixed non-leading template set"
  shallow: false
  mechanism: "Stream the shared screen at 1-2 fps to a screen-state and cursor tracker; rules on dwell, hover-without-click and repeated back-navigation produce a one-line prompt plus a template probe in the moderator view"
  example: "PC survival prototype: after the player hovers the crafting tab for the third time, the moderator sees the prompt and asks; the answer ('I thought that was settings') becomes a finding that the tab icon reads as a cog"
  cost: M
  depends_on: "Low-latency screen stream from the session tool; per-title screen labels; moderator UI"
  buyer: "Senior UX researcher running 6-10 moderated sessions per milestone at a PC or console studio"
  input: "Live screen share of recruited playtester + cursor/controller input + moderator audio"
  why_existing_tools_cannot: "market.md s1: PlaytestCloud and Antidote AI summarise recordings after the session; methods-churn-funnel.md s4 shows real-time HUD detection exists only in research"
  willingness_to_pay: "3 - moderated sessions are low volume (6-10 per milestone); price anchor is the session itself (EUR 113-141 per token, market.md WTP) so a per-seat add-on of a few hundred EUR per month is the ceiling"

- id: uxr-4
  title: "Auto-filled observation grid (rainbow sheet): rows = 25-40 researcher-defined observations, columns = participants, each filled cell linked to the timestamp where it was seen"
  level: L4
  cell: {buyer-role: ux-research, video-source: recruited-playtesters, signal-extracted: ui-state-and-screen-flow, analysis-type: ask-a-question-over-footage, lifecycle-moment: soft-launch, delivery-form: warehouse-table-export, value-lever-b2b: replace-labour-hours, effort: XS-repackage-existing-user-test-product}
  object: "PlaytestCloud 'First Findings' that 'reviews all videos in an order, groups findings by theme, and links each friction point to its clip' (market.md s1)"
  situation: "Researcher has 12 sessions and a list of 30 observations ('opened the shop before level 5', 'skipped the story card', 'used the hint') and must mark each per participant"
  consequence: "Today this is a manual pass of about 1 h per session; with the grid, researcher only verifies cells (click to play the 10 s clip) and corrects wrong ones, and the grid exports as CSV for the deck"
  p_typical: 0.05
  grounded: inferred
  evidence: "market.md s1: First Findings groups by theme, which is vendor-defined; methods-churn-funnel.md s4 INFERRED: 'the needed vision vocabulary is small per game (tutorial card visible, CTA highlighted, popup open, fail screen, level-complete screen, store screen)'"
  proposed: "Researcher types observations in plain language; the ask-question agent answers each per participant as yes / no / unclear with a clip; unclear cells stay empty"
  shallow: false
  mechanism: "Each observation becomes a question run by the existing ask-question agent over each participant's footage; answers become cells with a timestamp and confidence; low-confidence cells are left blank for the human"
  example: "Midcore RPG soft-launch study: 'equipped the new sword within 2 min of receiving it' is yes for 4 of 12; the 8 'no' clips show the equip prompt hidden behind a reward popup"
  cost: S
  depends_on: "Existing User Test ask-question agent; per-participant session segmentation"
  buyer: "In-house UX researcher at a mid-size or AAA studio"
  input: "Recruited playtester session videos + researcher's observation list"
  why_existing_tools_cannot: "market.md s1: First Findings groups findings by theme it chooses; no source shows a researcher-defined observation grid filled from pixels"
  willingness_to_pay: "4 - it replaces the most hated manual hour per session; anchored on EUR 1,130-2,825 per month PlaytestCloud plans (market.md WTP) as the budget line it sits next to"

- id: uxr-5
  title: "Task-success scoring per participant: success / fail / gave-up / needed-moderator-help, time-on-task, and number of wrong screens visited, for 5-8 scripted tasks"
  level: L4
  cell: {buyer-role: ux-research, video-source: recruited-playtesters, signal-extracted: ui-state-and-screen-flow, analysis-type: funnel-drop-off-why, lifecycle-moment: new-version-release, delivery-form: per-cohort-report, automation-level: insight-for-human}
  object: "Task script of a usability playtest; GameAnalytics docs recommend Progression events for 'tutorial steps, level completion' (methods-churn-funnel.md s1)"
  situation: "A usability test with 8 participants and 6 tasks ('claim daily reward', 'join a guild', 'upgrade a hero') on a build without event instrumentation for those tasks"
  consequence: "Without instrumentation the researcher hand-times every task; with scoring, the report reads e.g. 'join a guild: 3/8 success, median 2:40, 5 visited the Friends screen first'"
  p_typical: 0.12
  grounded: inferred
  evidence: "methods-churn-funnel.md s1 INFERRED: 'Funnel quality is bounded by instrumentation: a step that was never instrumented ... does not exist in the data'; s4: mobile-game button/popup detection mAP 91.9%"
  proposed: "Researcher defines each task by a start screen and a success screen; system computes path and time between them"
  shallow: false
  mechanism: "Screen classifier labels every frame; task windows are bounded by researcher-marked start and success screens; path length and wrong-screen visits are counted; 'needed help' detected from moderator speech in the transcript"
  example: "Guild feature usability test: 5 of 8 open Friends before Guild; the team moves the Guild entry out of the Social submenu before the update ships"
  cost: S
  depends_on: "Per-title screen labels; researcher UI to mark start and success screens once"
  buyer: "UX researcher at a mobile midcore studio"
  input: "Recruited playtester video + task script + moderator transcript"
  why_existing_tools_cannot: "methods-churn-funnel.md s1: Unity and GameAnalytics funnels need events instrumented in advance and Unity funnels cannot be edited without invalidating data; playtest vendors (market.md s1) do not score tasks from pixels"
  willingness_to_pay: "3 - standard usability metric; researchers will expect it in the base playtest price rather than pay extra (market.md WTP: AI 'included at no extra charge' at PlaytestCloud per adjacent-usecases.md s10)"

- id: uxr-6
  title: "Retention-of-learning check in multi-day tests: detects whether a mechanic taught on day 1 (e.g. merge, dodge, crafting) is used unprompted on day 3, per participant, without asking"
  level: L4
  cell: {buyer-role: ux-research, video-source: recruited-playtesters, signal-extracted: player-skill-and-mechanics, analysis-type: cohort-comparison, lifecycle-moment: d1-to-d7, delivery-form: per-cohort-report, capture-trigger-and-sampling: opt-in-panel}
  object: "PlaytestCloud multi-session tests 'check whether players remember early tutorial elements in later sessions' (methods-churn-funnel.md s2); longitudinal set-up fee 8.7 Video Tokens (methods-churn-funnel.md s7)"
  situation: "A 5-day longitudinal test of 10 players where the day-3 survey asks 'do you remember how to X', which primes the answer"
  consequence: "Survey recall overstates learning; behavioural detection shows e.g. 4 of 10 never used dodge again after the tutorial, which predicts mid-game difficulty walls"
  p_typical: 0.05
  grounded: quote
  evidence: "methods-churn-funnel.md s2: 'PlaytestCloud multi-session tests check whether players remember early tutorial elements in later sessions'"
  proposed: "Per-mechanic usage curve by day and participant, with first unprompted use timestamp"
  shallow: false
  mechanism: "Detect mechanic-specific visual signatures (merge animation, dodge roll, crafting screen) per session; compute first unprompted use after the tutorial and frequency per day; join across the participant's sessions"
  example: "Action RPG longitudinal test: dodge used by 9/10 in the tutorial, 4/10 on day 2, 3/10 on day 3; designers add a forced dodge encounter at the start of chapter 2"
  cost: M
  depends_on: "Per-mechanic detectors per title; participant ID stable across sessions"
  buyer: "UX researcher running longitudinal tests at a midcore or PC studio"
  input: "Multi-day recruited playtester videos + participant ID + session dates"
  why_existing_tools_cannot: "methods-churn-funnel.md s2: recall is checked by asking; market.md s1: PlaytestCloud AI reads transcripts, not mechanic use in pixels"
  willingness_to_pay: "3 - longitudinal tests already carry an 8.7-token set-up fee (about EUR 1,000, methods-churn-funnel.md s7), so buyers of them have budget, but they are a minority of tests"

- id: uxr-7
  title: "Panel-bias calibration: same FTUE step coded for 12 paid testers and 200 consented live players, showing where testers behave unlike real players (e.g. testers read tutorial cards 4x longer)"
  level: L4
  cell: {buyer-role: ux-research, video-source: own-players-consented-sdk, signal-extracted: input-timing-and-hesitation, analysis-type: cohort-comparison, lifecycle-moment: ftue-first-session, delivery-form: per-cohort-report, constraint-to-overcome: sampling-bias, capture-trigger-and-sampling: targeted-cohort}
  object: "Testers are 'paid about $5-9 USD for a 15-minute playtest plus survey' (market.md s1); '>80%' of players clicked straight through the instruction screen at live events (methods-churn-funnel.md s2)"
  situation: "Lab test shows tutorial cards understood; live funnel shows 12% leave at step 3; researcher cannot tell whether the lab or the build is wrong"
  consequence: "Without calibration, research findings get dismissed by product ('testers are not our players'); with it, the researcher can state which lab findings transfer and which are artefacts of paid attention"
  p_typical: 0.03
  grounded: inferred
  evidence: "methods-churn-funnel.md s2 INFERRED: 'Playtest video gives the why but from recruited testers with think-aloud, small n; in-the-wild device video would give large n without think-aloud'; market.md s1: tester complaints about pay disputes"
  proposed: "One chart per FTUE step: lab vs live distribution of dwell, skip and mis-tap, with a 'transfers / does not transfer' verdict"
  shallow: false
  mechanism: "Run the same per-title screen classifier and hesitation metrics on both sources; compare distributions per step (card dwell, skip rate, retries); flag steps where lab and live differ by >2x"
  example: "Casual merge game: lab testers read card 2 for median 6 s, live players for 1.4 s and 63% skip it; the team stops using lab tests to validate tutorial text length"
  cost: M
  depends_on: "Consented live-player capture SDK at the FTUE (the f2p-product-lead option); same classifier for both sources"
  buyer: "Head of games user research at a publisher with both a playtest budget and live games"
  input: "Recruited playtester video + consented live-player FTUE clips + funnel step events"
  why_existing_tools_cannot: "market.md s1: PlaytestCloud and Antidote analyse only recruited testers 'not the studio's live players'; methods-churn-funnel.md s6: replay tools record live players but do not interpret game state"
  willingness_to_pay: "2 - valuable to the research team's credibility, but no budget line exists for 'validating our own method'; sold only as a feature of a combined lab+live product"

- id: uxr-8
  title: "Why-clips for a chosen funnel step: researcher picks the step with the drop (e.g. 12% leave at tutorial step 3) and gets 30 coded ring-buffer clips from consented players who quit there"
  level: L3
  cell: {buyer-role: ux-research, video-source: own-players-consented-sdk, signal-extracted: ui-state-and-screen-flow, analysis-type: funnel-drop-off-why, lifecycle-moment: ftue-first-session, delivery-form: clip-reel, capture-trigger-and-sampling: event-triggered-clip, companion-data: telemetry-events}
  object: "Playio: '12% leave at step three' (methods-churn-funnel.md s1); Sentry onErrorSampleRate ring buffer 'keeping about the last minute' (methods-churn-funnel.md s6)"
  situation: "Amplitude or GameAnalytics funnel shows a drop at one FTUE step; the researcher would otherwise recruit 10 testers and wait 48 h"
  consequence: "Researcher gets live-player evidence the same day and recruits a lab test only for the hypothesis the clips raise"
  p_typical: 0.6
  grounded: quote
  evidence: "methods-churn-funnel.md s1: Unity docs say drop-offs 'indicate good places to investigate'; EA case 'Session Replay was used to review those interactions' (Amplitude)"
  proposed: "Ring buffer of 60 s keyed on 'session end within 120 s of step N start without step N complete'"
  shallow: false
  mechanism: "On-device 60 s ring buffer at 2-5 fps uploads only when the funnel-abandon trigger fires; clips are coded with the same screen-state and hesitation vocabulary as lab sessions"
  example: "Tutorial step 3 'build the farm': 22 of 30 clips show the player dragging the farm onto water tiles that do not accept it, then closing the app"
  cost: M
  depends_on: "Capture SDK with consent UI and trigger API; funnel events from the studio's analytics"
  buyer: "UX researcher embedded in a live mobile F2P team"
  input: "Consented live-player ring-buffer clips + funnel/progression events"
  why_existing_tools_cannot: "methods-churn-funnel.md s6: replay tools fall back to screenshots or show nothing useful for game canvases; market.md s9 gap map: no vendor links CV on production player video to retention"
  willingness_to_pay: "4 - UXCam median about $21k/yr for generic replay (market.md s2) and EUR 13.6k-33.9k/yr for playtests (market.md WTP) are both budgets this competes for"

- id: uxr-9
  title: "Study-script dry run by an agent: before spending tokens, a bot plays the test build through every scripted task and reports blockers (crash at task 4, task 2 unreachable in 15 min)"
  level: L4
  cell: {buyer-role: ux-research, video-source: automated-bot-or-agent-playthrough, signal-extracted: visual-errors-and-glitches, analysis-type: bug-reproduction, lifecycle-moment: pre-launch-qa, delivery-form: issue-tracker-ticket, capture-trigger-and-sampling: scheduled-bot-playthrough, value-lever-b2b: reduce-cost-per-incident}
  object: "PlaytestCloud free trial = 2 tokens, Basic = 120 tokens/year (market.md s1); nunu.ai agents 'fully vision-based, taking a live stream from the device and issuing taps' (market.md s3)"
  situation: "A study goes live with a build where the shop crashes on Android 12; 10 recruited sessions (about EUR 1,130 of tokens) are wasted"
  consequence: "Dry run catches blockers before recruitment; researcher reschedules with the fixed build instead of burning a study"
  p_typical: 0.04
  grounded: inferred
  evidence: "market.md s3: nunu.ai and modl.ai agents play builds for QA; market.md s1: token pricing per recorded player"
  proposed: "One-click 'pilot my script' on the study set-up page, returning pass/blocked per task with clip"
  shallow: false
  mechanism: "Feed the task script as natural-language goals to a vision agent; record the run; mark each task reached / blocked / timed out; attach the frame where it blocked"
  example: "Hero-collector usability test: agent cannot reach 'open guild' because the guild unlock requires level 10 and the test account is level 3; researcher changes the test account before launch"
  cost: M
  depends_on: "Partnership with or reuse of a vision game agent (nunu.ai-class); build access"
  buyer: "UX research operations lead at a studio running 20+ studies a year"
  input: "Agent playthrough video of the test build + study task script"
  why_existing_tools_cannot: "market.md s3: QA agents test builds for bugs and say 'nothing about churn, monetisation or UX'; no playtest vendor offers a pre-flight run"
  willingness_to_pay: "2 - saves a wasted study a few times a year; researcher would expect it free in the playtest platform"

- id: uxr-10
  title: "Stakeholder readout reel: 90-second auto-cut of the top 5 friction moments per study, each captioned with participant count (e.g. '7 of 12 missed the upgrade button')"
  level: L4
  cell: {buyer-role: ux-research, video-source: recruited-playtesters, signal-extracted: speech-or-think-aloud, analysis-type: highlight-or-clip-generation, lifecycle-moment: prototype-and-greenlight, delivery-form: clip-reel, effort: XS-repackage-existing-user-test-product}
  object: "First Findings 'links each friction point to its clip' (market.md s1); highlight tools 'need per-game config' (competitor-and-ua.md s4)"
  situation: "Researcher has 15 minutes in a greenlight meeting; designers do not open a 40-finding report"
  consequence: "A reel of real players struggling changes design decisions faster than a slide; today it takes 2-3 h to cut"
  p_typical: 0.15
  grounded: inferred
  evidence: "market.md s1: First Findings clip linking; competitor-and-ua.md s4: Hypetrigger and Eklipse target streamers, triggers on kills and audio hype"
  proposed: "Reel ordered by frequency x severity, each clip 10-20 s with burned-in caption and participant ID"
  shallow: false
  mechanism: "Rank findings by number of participants affected; pick the clearest clip per finding (speech + visible struggle); stitch with captions"
  example: "Card-battler prototype: reel opens with 3 players saying 'where is my deck?' while the deck button sits behind the energy bar"
  cost: S
  depends_on: "uxr-1 or First-Findings-style finding list"
  buyer: "UX researcher presenting to a game director or greenlight committee"
  input: "Recruited playtester videos + finding list"
  why_existing_tools_cannot: "competitor-and-ua.md s4: highlight tools detect kills and audio spikes for streamers, not friction moments"
  willingness_to_pay: "3 - time-saver valued but expected inside the playtest product (adjacent-usecases.md s10: PlaytestCloud AI 'included at no extra charge')"

- id: uxr-11
  title: "Cross-study ask-a-question: 'across the last 6 studies, how many players tried to tap the locked chest before level 5?' returns a count plus clips from each study"
  level: L4
  cell: {buyer-role: ux-research, video-source: recruited-playtesters, signal-extracted: ui-state-and-screen-flow, analysis-type: ask-a-question-over-footage, lifecycle-moment: new-version-release, delivery-form: ask-question-agent-chat, effort: XS-repackage-existing-user-test-product}
  object: "PlaytestCloud 'over 5,000 playtests ran in 2024' (market.md s1); First Findings scope is 'across your entire playtest' (one study)"
  situation: "A designer asks whether the locked-chest confusion seen in March still exists after two redesigns; the answer is buried in 3 studies' footage"
  consequence: "Today the researcher re-watches old studies or answers from memory; the agent answers in minutes with counts per study"
  p_typical: 0.2
  grounded: inferred
  evidence: "market.md s1: First Findings 'reviews all videos' of one playtest; no cross-study query is described"
  proposed: "Index every study by title and build; queries filter by build range"
