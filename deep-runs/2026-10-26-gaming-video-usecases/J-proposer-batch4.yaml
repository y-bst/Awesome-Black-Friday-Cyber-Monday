- id: bi-15
  case: >
    Build this first because it sells to the best-funded AI buyer in games through the buyer who controls the warehouse. That buyer is the head of analytics/BI at a mid-size mobile studio or publisher, and the UA manager is the person who acts on it.
    UA money is proven: Sett raised 57M USD on UA creative demand, Replai reports 5B USD/year of ad spend through its platform (market.md section 6), and Segwise charges 499-1,699 USD/month scaled to ad spend (competitor-and-ua.md section 3).
    Every one of those tools analyses the ad plus IPM/CPI and stops at the install. GeekLab names the missing link as a complaint, "hard to see which creative acquired players who later retain and pay, especially on iOS" (competitor-and-ua.md section 3), and the note's own inference says none of them links an ad to what the acquired player did on device in the first session.
    The product replaces the slow D7/ROAS lag and the guesswork in between. A daily creative_id x first-60s table shows within 24 hours that 'merge-fail-hook-17' players take 44 s to the first merge against 29 s for the calm demo, so UA moves spend before a week of bad cohorts has been bought at 1.41 USD iOS CPI.
    Delivered as a BYOC warehouse table, it avoids the "yet another dashboard" objection and it gets more valuable with each first-session clip the SDK collects for other options.
    Incumbents cannot copy it quickly. Segwise, Alison and Replai have no on-device capture or game-state classifier, and replay vendors render game canvases as a black box (market.md section 2). Closing the gap would mean building both the SDK and the vision layer.
- id: scout-1
  case: >
    Build this first because it is a fixed-price audit that a publishing scout can buy on a credit card this quarter, with no SDK integration, no live-player consent burden and no studio engineering time.
    The scout already has a hard deadline (a sign / pass / revise view to the committee in about 5 days) and today has only the developer's own deck.
    The price anchor is already set: PlaytestCloud Professional Basic is EUR 1,130/month for 120 Video Tokens, about EUR 113 per recorded session, so a 20-tester audit is a EUR 2.3-2.8k purchase publishers already make, and they pay GameRefinery about 45-51k USD/year for feature intelligence (market.md section 1; competitor-and-ua.md section 1).
    It replaces a recruited playtest whose AI only summarises transcripts and surveys ("uses the OpenAI API on video transcripts and survey responses", market.md section 1) with pixel-derived numbers a committee can argue over: time to first merge 74 s, slower than 85% of the comp library.
    It is the cheapest route to market for the founder, because the existing User Test pipeline plus a per-title screen classifier and touch overlay is most of the build, and the input is recruited footage the company already knows how to handle.
    The moat is the cross-game FTUE benchmark library. market.md section 9 finds no vendor applying computer vision to gameplay video at this level, and GameRefinery deconstructs games with human analysts. Each audit adds titles to the comp set, so a late entrant has no percentile to quote.
- id: design-17
  case: >
    Build this first because it attaches to a decision economy designers at casual and midcore F2P studios already make every week: ship or kill an A/B economy variant. It turns the vague "B made more money but lost D7" into a specific fix.
    The research is explicit that this is the gap: event funnels and A/B tools "answer 'where' and 'how many'; every tool above leaves 'why' to a hypothesis step" (methods-churn-funnel.md section 1).
    It replaces the hypothesis meeting and the follow-up test. Seeing that arm B players hit 'not enough coins' 3.1x as often on Levels 18-22, and that 22% then quit while 40% replay Level 12, lets the designer keep the +4% revenue and patch the churn with a Level-20 coin bonus instead of throwing the variant away.
    The willingness signal is that analytics vendors already sell studios on this kind of outcome with headline numbers: Amplitude's FunCraft case reports +40% D1 and its EA case 30% faster onboarding using funnel plus session replay (methods-churn-funnel.md signals).
    Build cost is small (one popup classifier, a next-screen classifier and the arm ID from config) and capture is targeted to Levels 15-25 in both arms, so the consent and bandwidth footprint is a narrow cohort rather than always-on recording.
    Amplitude and GameAnalytics cannot ship it with a feature flag. Generic session replay reconstructs native UI trees and sees an engine canvas as a black box or screenshots (market.md section 2), so they have no frames from which to detect a popup or the screen that follows it.
- id: qa-2
  case: >
    Build this first because soft-locks are a defect class that today's tooling misses by design. The buyer, a QA director or live-ops QA lead at a mobile F2P studio, feels it as a crisis on every event day.
    Sentry's mobile replay uploads its last-minute buffer only "if an error occurs" (methods-churn-funnel.md section 6). A spinner that never resolves after a network reconnect throws no error, so it reaches the studio only as an unexplained funnel drop and as support tickets without a repro.
    The trigger is computable on device with cheap signals: a perceptual-hash change under 2% for 20 s with 5+ taps, a spinner held past 45 s, or a 2-4 frame loop. The output is a Slack line with counts and clips, such as '212 soft-locks/hour on Event Reward popup, build 4.13, 94% after network reconnect', which a team can hotfix the same afternoon.
    It replaces players self-recording bugs and support agents watching those videos by hand, which studios such as Resolution Games and Arrowhead ask for today (adjacent-usecases.md section 9). It also replaces QA trying to reproduce issues blind.
    The price anchor is UXCam at about 21k USD/year median for generic replay (market.md section 2), and 77% of developers say they do less QA than they should (market.md, modl.ai survey).
    Incumbents are not one flag away. UXCam's "unresponsive gestures" logic reads native view trees that do not exist on a game canvas, Sentry keys capture on exceptions, and AI QA agents such as modl.ai and nunu.ai play builds before release rather than watching live players after a server config change.
- id: liveops-11
  case: >
    Build this first because the battle pass is the largest repeating monetisation lever in mobile F2P, and day 1 of a season is the one moment when the live-ops manager and monetisation lead will act within hours on evidence.
    The note's evidence supports the core claim that what a player saw on screen is missing from events. Eye-tracking work found "some players even missed relevant information during playing" (methods-churn-funnel.md section 2), but that evidence comes from lab studies on tens of players, not the live cohort.
    The product replaces the default post-mortem ("the pass is too expensive, cut the price") with a measurable alternative. Seventy percent of openers never scrolled past tier 3, so they never saw the tier-30 exclusive, and attach rises from 1.4% to 9% with scroll depth. Moving the reward preview recovers attach without discounting.
    The willingness signal is that studios already pay Sensor Tower and GameRefinery 45-75k USD/year in part to track rivals' battle passes (competitor-and-ua.md section 8). Seeing their own pass through their own players' eyes sits in the same budget line at per-game pricing.
    Capture is narrow: battle-pass screen visits on season days 1-3 with a touch overlay and a single screen-state classifier, joined to IAP events the studio already has.
    Event analytics cannot copy it quickly, because telemetry records that the screen opened and not what was rendered or for how long. Replay vendors see the engine canvas as a black box (market.md section 2), so scroll depth and on-screen price dwell are only available from the pixels.
