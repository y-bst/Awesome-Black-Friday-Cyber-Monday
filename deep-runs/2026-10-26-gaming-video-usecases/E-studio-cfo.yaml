- id: cfo-1
  title: "Per-session playtest swap: consented-SDK FTUE clips of own players analysed at under EUR 2 each, sold as a line-item replacement for PlaytestCloud tokens at EUR 113-141 each"
  level: L4
  cell: {buyer-role: finance-exec, video-source: own-players-consented-sdk, signal-extracted: ui-state-and-screen-flow, analysis-type: funnel-drop-off-why, lifecycle-moment: ftue-first-session, delivery-form: per-cohort-report, pricing-model: per-session, value-lever-b2b: replace-labour-hours}
  object: "PlaytestCloud Professional Basic EUR 1,130/month for 120 Video Tokens/year (market.md section 1, about EUR 113 per recorded session)"
  situation: "Annual renewal of a EUR 13,560 PlaytestCloud contract; the CFO asks what the same budget buys if sessions come from live players instead of a paid panel"
  consequence: "CFO sees 120 sessions/year become 6,000+ sessions/year at the same spend; if the per-session price is not printed on the quote, the CFO will not compare and renews the incumbent"
  p_typical: 0.35
  grounded: quote
  evidence: "market.md section 1: 'Basic tier works out to roughly EUR 113 per recorded player-session'; methods-churn-funnel.md section 7: 1.8 GB/hour stored costs about $0.04/month in S3"
  proposed: "Quote every plan as price per analysed session next to the incumbent's per-token price, on page 1 of the order form"
  shallow: false
  mechanism: "Capture SDK records the first 10 minutes of 2% of new installs; existing User Test pipeline tags tutorial screen, CTA tap, fail screen, app-kill screen; report groups drop-offs per funnel step with 3 clips each"
  example: "Mobile match-3 studio drops PlaytestCloud Basic, buys 5,000 FTUE sessions/quarter at EUR 1.80; report shows 41% of step-4 quitters never saw the booster button"
  cost: M
  depends_on: "capture SDK with consent prompt; per-title screen classifier for tutorial/fail/store screens"
  buyer: "CFO or VP Finance at a mobile-midcore-f2p mid-size studio that already holds a playtest contract"
  input: "own-player screen video (first 10 min, 2% sample) + telemetry tutorial-step events + touch input"
  why_existing_tools_cannot: "PlaytestCloud's AI reads transcripts and surveys of recruited testers, not live players' pixels (market.md section 1 'Does NOT do')"
  willingness_to_pay: "4 - studios already pay EUR 13.6k-33.9k/year for 120-240 sessions (market.md Signals of willingness to pay)"

- id: cfo-2
  title: "ROI receipts ledger: every video finding is linked to the build that shipped its fix and to the D1/D7 delta 14 days after release, exported as one renewal page"
  level: L4
  cell: {buyer-role: finance-exec, video-source: own-players-consented-sdk, analysis-type: root-cause-of-a-metric-change, lifecycle-moment: new-version-release, delivery-form: per-cohort-report, value-lever-b2b: de-risk-a-go-kill-decision, companion-data: build-and-config-metadata}
  object: "Amplitude case-study headline numbers (FunCraft +40% D1, EA 30% faster onboarding) in methods-churn-funnel.md Signals of willingness to pay"
  situation: "Day 85 of a 90-day contract; CFO needs one number to justify renewal and the vendor has only a list of insights"
  consequence: "Without a finding-to-metric chain the contract is classed as 'research spend' and is first to be cut; with it, the CFO can state 'finding #12 shipped in build 1.8.3, D1 +1.6 pp on 40k installs'"
  p_typical: 0.06
  grounded: inferred
  evidence: "methods-churn-funnel.md Signals: analytics vendors sell onboarding outcomes with headline numbers; market.md Signals: proof is thin, Naavik says AI-QA case studies are still hard to find"
  proposed: "Each finding gets a status field (open / shipped in build X) and a pre/post D1 cohort comparison computed from the studio's event export"
  shallow: false
  mechanism: "Finding IDs are written into Jira tickets; the system reads build-and-config metadata, matches the release containing the ticket, and computes D1/D7 for installs 14 days before vs after on the affected funnel step"
  example: "RPG studio CFO opens the ledger at renewal: 9 findings shipped, 6 with measurable step lift, sum of step conversion gains converted to $210k annualised via ARPDAU"
  cost: M
  depends_on: "cfo-1 or any finding stream; issue-tracker integration; read access to the studio's retention table"
  buyer: "CFO or COO at a mid-size or AAA studio renewing an analytics vendor"
  input: "findings from own-player video + Jira ticket status + build metadata + D1/D7 cohort table from the warehouse"
  why_existing_tools_cannot: "Funnel tools report drop-off but not which fix moved it, and AI QA lacks case studies (market.md section 3 Naavik quote; methods-churn-funnel.md section 1 INFERRED)"
  willingness_to_pay: "4 - feature that decides the renewal of a EUR 13.6k-33.9k contract (market.md Signals)"

- id: cfo-3
  title: "Uplift-share contract: fee = 10% of the first-year revenue attributed to a measured D1 lift on a 10% holdout, zero fee if lift is under 0.5 pp"
  level: L4
  cell: {buyer-role: finance-exec, analysis-type: ab-test-variant-explanation, lifecycle-moment: ab-test-running, pricing-model: outcome-based-per-bug-or-uplift, value-lever-b2b: de-risk-a-go-kill-decision, buyer-org-type: mid-size-studio}
  object: "Halfbrick +5 pp D7 on targeted churners and Surge 275 of 145k churners caught (methods-churn-funnel.md section 1)"
  situation: "CFO will not sign a fixed fee for an unproven category and asks the vendor to carry the risk"
  consequence: "CFO signs without a budget line; vendor carries attribution disputes (seasonality, UA mix shifts) and needs a holdout the studio controls"
  p_typical: 0.05
  grounded: inferred
  evidence: "methods-churn-funnel.md Signals: 'a customer complaint shows recall can be very low (275 of 145k)'; market.md Signals: only 16% fully trust AI QA outcomes"
  proposed: "Contract annex defines holdout size, measurement window (28 days), revenue proxy (ARPDAU x retained users) and a cap of 2x a fixed-fee equivalent"
  shallow: false
  mechanism: "Studio's remote-config splits new installs 90/10; fixes from video findings ship only to the 90%; monthly report computes D1 and revenue difference with confidence interval and invoices the share"
  example: "Casual studio ships 3 tutorial fixes found in video; D1 rises 1.1 pp on 300k installs/month; invoice is 10% of the modelled $48k annual gain"
  cost: M
  depends_on: "remote-config or A/B framework at the studio; cfo-2 ledger"
  buyer: "CFO at a mid-size mobile studio with no budget line for user research"
  input: "own-player video findings + A/B assignment + D1/revenue events"
  why_existing_tools_cannot: "Playtest and replay vendors sell tokens or seats, never tie fee to retention outcome (market.md Signals of willingness to pay price list)"
  willingness_to_pay: "3 - CFO likes zero downside, but attribution fights and 28-day windows delay cash; no outcome-priced vendor in the notes to anchor on"

- id: cfo-4
  title: "Seat-cut competitor teardown: automated FTUE, shop and live-event extraction from public gameplay video of 50 named rival titles at $15k/year, sold as a replacement for one $45-75k intelligence subscription"
  level: L3
  cell: {buyer-role: competitive-intel, video-source: public-streams-and-ugc, signal-extracted: on-screen-text-ocr, analysis-type: benchmark-vs-competitor, delivery-form: dashboard, pricing-model: annual-enterprise-licence, value-lever-b2b: replace-labour-hours}
  object: "Sensor Tower median $75,000/yr (range $29,500-$115,460) and GameRefinery $45-51k/yr (competitor-and-ua.md section 1 Prices)"
  situation: "Budget review where the studio holds both Sensor Tower and GameRefinery; CFO asks which one can go"
  consequence: "If video extraction covers the FTUE and live-op fields the analyst uses weekly, one subscription is cut and the saving pays the tool 3x; if it covers only the top 50 games while GameRefinery covers 2,500 deconstructions, the CFO keeps the incumbent"
  p_typical: 0.08
  grounded: quote
  evidence: "competitor-and-ua.md section 1: 'about 260 features are tracked manually'; Playliner team logs 'hundreds of hours' of playtime across 230+ games"
  proposed: "Price per tracked title (50 titles = $15k) and publish a field-coverage table against the GameRefinery feature list"
  shallow: false
  mechanism: "Pull YouTube/Twitch gameplay of each rival weekly; VLM + OCR tags tutorial steps, shop prices, event banners, battle-pass tiers; diff against last week; dashboard lists new events and price changes"
  example: "Publisher's CFO cancels the AppMagic Premium tier and one GameRefinery seat after the dashboard flags a rival's $4.99 starter-pack change 6 days before the human-logged tracker"
  cost: L
  depends_on: "public video crawler; per-genre shop and event detectors; legal review of using public streams"
  buyer: "CFO approving a market-intelligence vendor list at a publisher"
  input: "public YouTube/Twitch/TikTok gameplay of rival titles + store metadata"
  why_existing_tools_cannot: "Deconstructions and live-ops tracking are produced by analysts playing by hand; automated tags read store metadata, not gameplay (competitor-and-ua.md section 1 VERIFIED and INFERRED)"
  willingness_to_pay: "4 - five-figure annual contracts already paid, some firms buy both (competitor-and-ua.md section 8)"

- id: cfo-5
  title: "Outsourced-QA invoice offset: AI pre-screens tester-rig recordings and returns only flagged 20-second windows, cutting billed review hours at $15-50/hour"
  level: L4
  cell: {buyer-role: qa, video-source: outsourced-tester-rigs, signal-extracted: visual-errors-and-glitches, analysis-type: bug-reproduction, lifecycle-moment: pre-launch-qa, pricing-model: per-hour-of-video, value-lever-b2b: replace-labour-hours, buyer-org-type: aaa-studio}
