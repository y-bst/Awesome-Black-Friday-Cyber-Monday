  cost: M
  depends_on: "access to outsourced vendor's capture rigs; per-title bug taxonomy"
  buyer: "CFO or VP Production paying an outsourced QA vendor"
  input: "outsourced-tester-rig video + build metadata + tester bug reports"
  why_existing_tools_cannot: "Razer QA Companion sits next to the studio's own PC testers and outsourced vendors' revenue is labour-based (market.md section 3 Razer and Keywords 'Does NOT do')"
  willingness_to_pay: "3 - QA spend is real but only 16% fully trust AI QA outcomes (market.md section 3 modl.ai survey)"

