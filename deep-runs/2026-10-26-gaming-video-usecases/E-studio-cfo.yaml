  consequence: "CFO pays $2/hour of video for AI triage instead of $25/hour of tester review; QA director resists because zero-shot VLM precision is 0.50, so the saving is only on review, not on verification"
  p_typical: 0.07
  grounded: quote
  evidence: "adjacent-usecases.md section 1: 'testers watch hours of footage and hunt frames'; 'best off-the-shelf VLM zero-shot baseline reached precision 0.50'"
