- id: cfo-1
  case: >-
    Drop it as a standalone option. It is f2p-1 with a pricing claim attached, and the swap compares two different products.
    PlaytestCloud's EUR 113-141 buys recruited testers talking aloud on prototypes, concepts, kids' and competitor tests before
    launch (market.md §1). Consented SDK clips exist only once a build has live installs, and they carry no speech, so the "why"
    has to be inferred from behaviour alone (methods-churn-funnel.md §2 INFERRED). A research lead will not give up the pre-launch
    panel for this, so for most studios it is an extra cost, not a replacement. The CFO is also the wrong buyer. A EUR 13.6k line
    item gets renewed by the research or product team. And the SDK needs the engine lead's approval plus an iOS consent prompt with
    a visible recording indicator (methods-churn-funnel.md §7, Apple 2019). Neither of those is a finance decision. The EUR 1.80
    price leaves out the per-title screen classifier each game needs (methods-churn-funnel.md §4 INFERRED). Once you sell "per
    recorded session from live players", the price comparison becomes IV Metrics at $49-99/month and UXCam at about $21k/year
    (market.md §2), not PlaytestCloud. The example's "41% never saw the booster button" also claims more than video shows: you
    cannot see where a player is looking without eye tracking. The eye-tracking work in methods-churn-funnel.md §2 shows players
    miss things that are plainly on screen. Moat is scored 2. PlaytestCloud already links each friction point to its clip in
    First Findings, so adding an SDK intake is a short step for it.
- id: tns-1
  case: >-
    Explore later, do not lead with it. The headline number is borrowed. "Only about 23% of reports contained actionable evidence"
    comes from a Modulate case study on voice-chat reports (adjacent-usecases.md §3). It is not a measure of gameplay-cheat reports,
    and voice already has a paid evidence tool. For cheating, the notes show operators rely on server-side ML on inputs, timing and
    recoil (Riot, Activision, FACEIT; adjacent-usecases.md §2). That data already covers every match without client video. The
    client clip is also the evidence a cheater can most easily tamper with, because it is recorded on their own machine. False
    accusation is the stated risk: FACEIT will not ban on its own ML flag alone. So a 90 s clip does not make a report decidable
    on its own. The mechanism also depends on the weakest parts of the vision stack. HUD OCR is unreliable on stylised low-res fonts
    (Q3Vision), and temporal events such as a 180-degree flick are "substantially harder" for VLMs than single-frame ones
    (methods-churn-funnel.md §4). The capture cost is real too. An always-on encode in a competitive shooter competes for frame time
    and needs CTO sign-off. The buffer records other players' names and chat, which are third-party data (methods-churn-funnel.md
    §7). Medal's auto-clipping API already saves event-triggered clips on PC (market.md §4), and GGWP already ingests anti-cheat
    data (adjacent-usecases.md §3). Either is one integration away from this. The notes give no price signal for evidence packs
    (adjacent-usecases.md: anti-cheat "None published").
- id: f2p-9
  case: >-
    Defer. This is a report view on top of f2p-1, and it also depends on an unbuilt consent-bias calibration (f2p-20). Its own
    scores flag it as thin: p_typical 0.06, grounded "inferred". The only evidence cited is that PlaytestCloud charges more tokens
    for advanced targeting. No note shows anyone buying a per-market FTUE read. Sample size is the first problem. 300 consented
    first sessions per market within 10 days needs thousands of soft-launch installs per market at realistic opt-in rates. Split
    across 6 reason codes and several steps, each cell gets a few dozen clips, so the confidence intervals will be too wide to settle
    a go/kill. Opt-in rates also likely differ by market, which confounds the very comparison being sold. The notes say nothing
    about whether D1 gaps between markets come from FTUE comprehension rather than audience mix. The example's actual cause, device
    latency, can be found from device model plus telemetry or GameBench (adjacent-usecases.md §6), without video. Finally, there is
    no think-aloud in any language, and the classifier is trained per title, so Brazil vs Canada differences in reading UI text
    will not show up in pixels-plus-taps.
- id: publisher-2
  case: >-
    Defer, and merge with f2p-9 rather than ranking both. They are the same soft-launch read sold to two buyers. The rules in the
    memo (above 50% fixable means iterate, below 20% means kill) are made up. The notes contain no study linking these buckets to
    outcomes after a relaunch. The Rovio r = -0.586 it rests on comes from simulated agents on Angry Birds levels, not from footage
    of real players (methods-churn-funnel.md §3). Mechanically, "the last 60 s before the final app close" is only known to be final
    days later. So every session end in the sample has to be buffered and uploaded, then joined to D1/D7 flags. With a 1-5% opt-in
    sample, the non-returners you most need are the players least likely to accept a recording prompt. The publisher also does not
    own the build. The developer has to ship the SDK and the iOS consent indicator (methods-churn-funnel.md §7) in a soft-launch
    build. Publishers make go/kill calls on D1, D7, CPI and ROAS, so a qualitative memo from a biased sample will be overruled
    whenever it disagrees with those metrics. The $8-15k price is marked inferred, with no buyer signal behind it, and the example's
    24%-to-29% D1 lift is invented.
- id: compintel-15
  case: >-
    Drop as a first product, because it is already served. PlaytestCloud sells both competitor playtests and multi-day longitudinal
    tests (market.md §1; methods-churn-funnel.md §7). This option combines two SKUs the incumbent already lists, so it is a
    configuration change for them. It does not use the founder's distinctive asset either: no CV, no live players, just recruited
    panels and transcripts, which is the incumbent's home ground. Moat is scored 2. The buyer already pays for late-game coverage
    across hundreds of games. GameRefinery's Live Events Tracker and Sensor Tower's Playliner log daily live ops and "hundreds of
    hours" of play across 230+ titles, plus 2,500+ deconstructions, for $45-75k a year (competitor-and-ua.md §1, §8). A $17-21k study
    of one rival competes with that. A 30-day diary panel also breaks the cheap recruited-tester model. Testers are paid $5-9 per
    15 minutes (market.md §1), so 30 days of real play costs far more, attrition will be high, and tester incentives already
    distort session quality (market.md WTP complaints). Recruited players also do not spend real money or join real guilds, so the
    day-14 guild-war monetisation pressure the option promises to show is the behaviour it is least likely to capture.
