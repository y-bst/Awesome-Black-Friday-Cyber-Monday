  level: L3
  cell: {buyer-role: ua-marketing, video-source: automated-bot-or-agent-playthrough, signal-extracted: ui-state-and-screen-flow, analysis-type: creative-insight-for-ads, lifecycle-moment: ua-campaign-launch, delivery-form: api-or-sdk, game-platform-and-genre: web-html5, go-to-market-channel: self-serve}
  object: "playable ad HTML5 file from SparkLabs or an agency, 30-60 seconds of interaction"
  situation: "A UA team runs 40 playable variants and tags none because tagging is slow"
  consequence: "Playables are the largest blind spot in the creative tag table; the team cannot say which end card wins"
  p_typical: 0.06
  grounded: quote
  evidence: "competitor-and-ua.md section 3: Segwise 'describes ... playables being too slow to tag by hand so most teams skip them'; 'playables stayed under 15/month' (Sensor Tower 2026 report)"
  proposed: "Auto-play the playable on three virtual devices, produce per-second tags and a one-line summary, post to the creative tag table"
  shallow: false
  mechanism: "Headless browser plus a vision agent plays the HTML5 playable and records it; VLM tags interactions and end card timing"
  example: "40 playables tagged overnight; the team learns that 'swipe-to-merge' playables with the end card at 22 s beat those at 30 s"
  cost: M
  depends_on: "playable file access; headless browser harness"
  buyer: "Creative strategist at a UA team"
  input: "Playable ad HTML5 build played by a bot, plus network metrics if joined"
  why_existing_tools_cannot: "competitor-and-ua.md section 3: Segwise tags playables but its blog says they are slow to tag by hand and most teams skip them; Alison.ai and Vidmob list video, and no source shows automated frame tagging of interactive playables"
  willingness_to_pay: "2: playables cost $3,000-$5,000 each externally, so tagging has a clear owner, but Segwise at $499-$1,699/month already claims playables; est. $200-500/month"

