  level: L4
  cell: {buyer-role: ua-marketing, video-source: own-players-consented-sdk, signal-extracted: bot-or-fraud-behaviour, analysis-type: evidence-pack-for-enforcement, lifecycle-moment: d1-to-d7, delivery-form: enforcement-or-cert-evidence-pack, pricing-model: outcome-based-per-bug-or-uplift, value-lever-b2b: reduce-cost-per-incident}
