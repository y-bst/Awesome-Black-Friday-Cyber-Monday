- id: ua-1
  title: "Ad-promise vs first-session check: tag the mechanic shown at second 3-8 of each video ad, then test whether the acquired player ever performs it in the first 5 minutes"
  level: L4
  cell: {buyer-role: ua-marketing, video-source: own-players-consented-sdk, signal-extracted: ui-state-and-screen-flow, analysis-type: creative-insight-for-ads, lifecycle-moment: ua-campaign-launch, companion-data: attribution-campaign-and-creative-id, delivery-form: dashboard}
  object: "creative_id on the install record joined to the first 5 minutes of on-device footage; the ad's own frames 3-8 s"
  situation: "A Meta creative shows a merge-chain explosion at 0:04; installs from it spend 5 minutes in tutorial text and never trigger a merge chain of 3+"
  consequence: "The UA manager keeps paying CPI for a promise the game does not keep until minute 12; D1 of that creative cohort is 9 points under the cohort from a creative showing the real opening"
  p_typical: 0.06
  grounded: quote
  evidence: "competitor-and-ua.md section 3 INFERRED: 'None links an ad element to what the acquired player did on device in the first session; that link is the gap GeekLab describes.'"
  proposed: "Per creative, a 'promise kept at minute X, by N% of installs' number next to CPI and IPM"
  shallow: false
  mechanism: "A vision-language model labels the mechanic and UI state in the ad (frame-level) and in each consented first-session clip; a join on creative_id gives the share of installs that reach the advertised mechanic and the median minute they reach it"
  example: "Match-3 meta game: creative C-4471 promises a rocket-booster cascade; only 31% of its installs see a booster before minute 6, versus 78% for C-4502; budget shifts to C-4502 and the FTUE gets a booster in level 2"
  cost: M
  depends_on: "creative_id passed from the MMP to the SDK at install; consented first-session capture; ad video files from the ad network"
  buyer: "UA manager or head of growth at a mobile F2P studio or publisher spending on Meta, AppLovin and TikTok"
  input: "Ad creative video from the ad network library plus consented on-device first-session screen video, touch overlay, creative_id and campaign id from the MMP"
  why_existing_tools_cannot: "competitor-and-ua.md section 3: Segwise, Alison.ai, Vidmob and Replai read the ad plus network metrics (IPM, CPI) and stop at the install; GeekLab says creative-to-retained-player linkage is weak"
  willingness_to_pay: "4: UA creative tooling is bought at $499-$1,699/month (Segwise published tiers) and Replai/Sett have raised $8M+/$57M; a creative-to-behaviour link is a step above those anchors, est. $2-5k/month per game"

- id: ua-2
  title: "Creative-cohort reel: 20 first-session clips per creative id, sorted by where the player stopped, delivered with the CPI table"
  level: L3
  cell: {buyer-role: ua-marketing, video-source: own-players-consented-sdk, signal-extracted: input-timing-and-hesitation, analysis-type: cohort-comparison, lifecycle-moment: ftue-first-session, delivery-form: clip-reel, capture-trigger-and-sampling: targeted-cohort, effort: XS-repackage-existing-user-test-product}
  object: "per-creative install cohort; first-session clips ending at app kill or at the first interstitial"
  situation: "Two creatives have the same CPI of $1.41 on iOS but D1 of 22% vs 31%; the UA manager wants to watch why"
  consequence: "Without the clips the manager guesses from the ad; with them she sees that cohort A quits at a hard-gated energy popup at minute 2"
  p_typical: 0.14
  grounded: inferred
  evidence: "methods-churn-funnel.md section 2 INFERRED: video captures 'taps on non-interactive art; a visible CTA never tapped; the exact screen state at the moment of app kill'; competitor-and-ua.md section 3: GeekLab, hard to see which creative acquired players who retain"
  proposed: "Targeted-cohort capture keyed on creative_id with 1-5% sampling; reel of 20 clips per creative with the stop reason labelled"
  shallow: false
  mechanism: "Reuse the existing ingestion and reporting agent; add creative_id as a cohort dimension and a stop-reason classifier (app kill on popup, idle, rage taps)"
  example: "Hyper-casual puzzle: creative 'ASMR sort' cohort shows 14 of 20 clips stopped on a rewarded-ad prompt at minute 1; the creative is kept and the prompt delayed to level 4"
  cost: S
  depends_on: "existing User Test ingestion, consented SDK capture, creative_id join"
  buyer: "UA manager, with the product lead as a second reader, at a mobile studio"
  input: "Consented first-session screen video plus touch overlay plus MMP creative_id"
  why_existing_tools_cannot: "market.md section 2: IV Metrics caps at 50-100 human-reviewed videos and has no creative_id join; PostHog Unity replay is screenshot-only; market.md section 1: PlaytestCloud analyses recruited testers, not acquired players"
  willingness_to_pay: "3: close to the product-lead use case already priced (PlaytestCloud about EUR 113 per analysed session); a UA budget holder would pay if it ties to creative decisions, est. $1-2k/month per game"

- id: ua-3
  title: "Hour-1 value signal: video-derived first-session features pushed to the MMP as a custom event so Meta and AppLovin bid on predicted payers 2-3 days before D3"
  level: L4
  cell: {buyer-role: ua-marketing, video-source: own-players-consented-sdk, signal-extracted: input-timing-and-hesitation, analysis-type: early-ltv-or-payer-prediction, lifecycle-moment: ftue-first-session, delivery-form: api-or-sdk, companion-data: purchase-and-ad-revenue-events, automation-level: closed-loop-in-game-action}
  object: "custom event postback in the MMP (AppsFlyer, Adjust) fired at install + 60 minutes"
  situation: "A payer-conversion model uses only event logs; players who linger 6 s on the shop button and then back out are not in the feature set"
  consequence: "Value-based bidding learns from D3-D7 purchases, so a bad creative burns three more days of spend; with an hour-1 signal the campaign is cut at hour 24"
  p_typical: 0.05
  grounded: inferred
  evidence: "methods-churn-funnel.md section 3 INFERRED: 'Video is an untested source of new features, which is a research gap rather than a proven lift'; section 2: 'player looked at the shop button for 6 s and did not tap' does not exist in event data"
  proposed: "Score each consented first session 0-100 on video-derived engagement (mechanic discovered, hesitation, shop dwell) and send a custom event when score exceeds a threshold"
  shallow: false
  mechanism: "On-device or edge CV extracts a small feature vector per session (screens seen, dwell, failed gestures); a model trained on D7 payers maps it to a score; the score is sent as an MMP event the ad network optimises toward"
  example: "Mid-core RPG: players with score above 70 are 4x as likely to pay by D14; AppLovin optimises to the 'hour1_high' event and CPI of payers falls"
  cost: L
  depends_on: "months of consented sessions with D14 labels; MMP custom-event integration; ground-truth payer labels"
  buyer: "UA lead and data scientist at a mid-core F2P studio"
  input: "Consented first-session video-derived features, purchase and ad-revenue events, MMP install id"
  why_existing_tools_cannot: "methods-churn-funnel.md section 3: all published churn work is log-based; Firebase Predictions caught 275 of 145k churn instances for one dating app; no vendor uses video features"
  willingness_to_pay: "3: large upside but unproven lift; Halfbrick got +5 points D7 from churn targeting (Firebase case, vendor); buyer signal is bid-optimisation budget rather than a tool line"

- id: ua-4
  title: "Near-fail and comeback moment miner: find the 3-8 second moments in real player footage where a fail was avoided by one move, to cut as hooks"
  level: L4
  cell: {buyer-role: ua-marketing, video-source: own-players-consented-sdk, signal-extracted: player-skill-and-mechanics, analysis-type: creative-generation-from-gameplay, lifecycle-moment: ua-campaign-launch, delivery-form: generated-creative-files, capture-trigger-and-sampling: event-triggered-clip, processing-location: on-device}
  object: "level-complete screen with 1 move or 1 life left; the 6 seconds before it"
  situation: "A puzzle game has 40,000 level completions a day; the creative team films staged near-fails with an actor's hands"
  consequence: "Staged footage is rejected by the audience as fake; real near-fail clips give authentic fail-state hooks, the format a 10,000-ad vendor analysis calls most common"
  p_typical: 0.09
  grounded: quote
  evidence: "competitor-and-ua.md section 3: 'FoxData says fail-state hooks lead in 10,000+ ads analysed'; 'Replai ... automatic variation generation' and section 4: highlight tools need per-game configs and are 'not shown handling mobile gameplay recorded on-device'"
  proposed: "Event-triggered 10-second clip when a level ends with at most 1 move left; rank by tension (progress bar, shake, timer) and export a trimmed 9:16 file"
  shallow: false
  mechanism: "Game fires an event at near-fail; SDK uploads a ring-buffer clip from consented players; VLM scores tension and clarity; top clips exported with the player id stripped"
  example: "Water-sort game exports 30 near-fail clips a week; 6 become the first 3 seconds of Meta ads"
  cost: M
  depends_on: "ring-buffer capture in the game; consent that covers marketing reuse; event hook for near-fail"
  buyer: "Creative strategist or UA manager at a mobile puzzle or casual studio"
  input: "Consented ring-buffer clips triggered by near-fail game events, plus touch overlay"
  why_existing_tools_cannot: "competitor-and-ua.md section 4: Hypetrigger, Eklipse, Outplayed target PC/console streams and need per-game configs; Sett and Replai generate from templates and tags, not from a studio's own consented mobile sessions"
  willingness_to_pay: "3: studios pay EUR 363-500 per AI video (Admiral) and $3,000-$5,000 per playable; a source of real hooks saves that production cost, est. $1-3k/month"

- id: ua-5
  title: "Store preview selector: cut the 30-second App Store preview and 3 variants from real session footage ranked by first-3-seconds gameplay content"
  level: L3
  cell: {buyer-role: ua-marketing, video-source: own-players-consented-sdk, signal-extracted: ui-state-and-screen-flow, analysis-type: highlight-or-clip-generation, lifecycle-moment: soft-launch, delivery-form: generated-creative-files, constraint-to-overcome: store-or-platform-policy}
  object: "Apple app preview slots: up to 3 videos of up to 30 seconds per product page"
  situation: "A studio has 2,000-5,000 daily page views and tests one preview at a time, each test needing 14 days"
  consequence: "The ASO manager picks the preview by taste; the cost is a 14-day test slot wasted on a weak clip"
  p_typical: 0.07
  grounded: quote
  evidence: "competitor-and-ua.md section 6: 'Apple allows app preview videos up to 30 seconds, up to three per product page'; 'AI Vidia states App Store previews may only use footage captured in the app itself (vendor)'; 'Highlight selection from recorded gameplay would feed this step'"
  proposed: "Output three 30-second candidate previews built from consented real sessions, each starting with gameplay inside 3 seconds"
  shallow: false
  mechanism: "Select clips by game-state richness and visual clarity; assemble 3 variants; check the footage is captured in-app so it satisfies store rules"
  example: "RPG soft-launch: three previews generated; the variant opening with a boss hit wins the Apple PPO test by 11% conversion"
  cost: M
  depends_on: "consented capture with marketing-reuse consent; a clip library from ua-4"
  buyer: "ASO manager or UA manager at a mobile studio"
  input: "Consented own-player session clips plus store listing conversion data"
  why_existing_tools_cannot: "competitor-and-ua.md section 6: stores run the A/B test for free but leave clip choice and cutting manual; Mootion and Reelmind trailer tools have unverified claims and use raw footage from the user"
  willingness_to_pay: "2: store tests are free and the saving is small; vendor claims of +15-35% conversion are unverified; est. under $500 per release"

- id: ua-6
  title: "Competitor ad-to-first-session gap report: bot plays the competitor's game after its top video ad and logs what the ad promised vs what minutes 0-10 deliver"
  level: L4
  cell: {buyer-role: ua-marketing, video-source: automated-bot-or-agent-playthrough, signal-extracted: ui-state-and-screen-flow, analysis-type: benchmark-vs-competitor, lifecycle-moment: ua-campaign-launch, delivery-form: per-cohort-report, effort: L-multi-quarter, buyer-org-type: publisher}
  object: "competitor top-spend creative from Sensor Tower Creative Gallery; competitor first 10 minutes in store build"
  situation: "A rival's ad shows a base-builder battle at 0:05; the UA manager wants to know how long until a player sees it"
  consequence: "Without it, the team copies the ad hook and gets the same early drop as an install funnel that delivers the battle at minute 14"
  p_typical: 0.05
  grounded: inferred
  evidence: "competitor-and-ua.md section 2 INFERRED: 'Competitor ad libraries expose creatives but not what happens after install; gameplay recorded from a device is the only path to post-install flow'; section 1: GameRefinery deconstruction is 'a human-play-and-log process priced at five-figure annual contracts'"
  proposed: "Weekly: for the 20 highest-spend rival creatives, a one-page 'promised at second N, delivered at minute M' table with clip links"
  shallow: false
  mechanism: "Vision agent installs the competitor build on a device, taps through FTUE using screen understanding, records video; a labeller times the first appearance of each mechanic shown in the ad"
  example: "Hypercasual publisher finds a rival's top creative promises a 'level 50 board' that appears only after 11 levels, and writes a creative that starts on the real level 1"
  cost: L
  depends_on: "agent that can play unfamiliar mobile games from pixels (nunu.ai-class); ad library feed"
  buyer: "Head of UA or competitive-intel analyst at a mobile publisher"
  input: "Competitor ad video from ad libraries plus bot-recorded gameplay video of the competitor's store build"
  why_existing_tools_cannot: "competitor-and-ua.md section 7: FTUE and monetisation teardown has no named automated product; the closest are human-built libraries (Gamedexy, Game UI Database); market.md section 9: PlaytestCloud competitor playtests are recruited humans"
  willingness_to_pay: "3: GameRefinery about $45-51k/yr and Sensor Tower median $75k/yr prove spend on competitor intel; an ad-to-game layer could ride on the same budget, est. $15-30k/yr"

- id: ua-7
