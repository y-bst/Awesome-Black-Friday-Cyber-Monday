  level: L4
  cell: {buyer-role: ua-marketing, video-source: own-players-consented-sdk, signal-extracted: bot-or-fraud-behaviour, analysis-type: ad-verification-and-fraud, lifecycle-moment: ua-campaign-launch, companion-data: attribution-campaign-and-creative-id, delivery-form: warehouse-table-export, pricing-model: per-session}
  object: "sub-publisher id from the MMP; touch trace and screen video of the first 3 minutes"
  situation: "AppLovin sends 120 sub-publisher ids; 9 of them deliver installs where the screen shows 1-second-interval identical taps for 40 seconds and then app close"
  consequence: "UA pays $1.41 CPI for installs that never play; the manager sees D1 retention but not which sub-publisher produced scripted sessions"
  p_typical: 0.04
  grounded: speculative
  evidence: "none; closest is competitor-and-ua.md section 3 INFERRED on the missing link between ad source and what the acquired player did on device"
  proposed: "Per sub-publisher share of sessions with scripted-looking input, joined to CPI and D1, as a table in the warehouse"
  shallow: false
  mechanism: "Classifier over touch overlay timing and screen change, trained on labelled bot sessions; outputs a per-session score aggregated per sub-publisher"
  example: "Casual game blocks 9 sub-publishers and recovers about 7% of weekly budget"
  cost: M
  depends_on: "consented sessions; labelled examples of fraud sessions from the studio or MMP"
  buyer: "UA manager or fraud analyst at a mobile studio"
  input: "Consented first-session video and touch overlay joined to MMP sub-publisher id"
  why_existing_tools_cannot: "competitor-and-ua.md section 2: AppLovin has no public library and spy-style screenshots mislabel ads; MMP fraud tools see click and install patterns, not on-screen play (inferred, no source names a video-based fraud product)"
  willingness_to_pay: "2: MMP fraud suites already exist, so the incremental buyer signal is weak; est. a share of recovered spend, 3-5% as outcome fee"

