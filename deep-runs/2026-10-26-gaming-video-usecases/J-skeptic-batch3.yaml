- id: f2p-3
  case: >
    Build this later, as a feature of f2p-1, and do not sell it first. It has no classifier of its own: it diffs the reason codes from
    f2p-1 and is listed as a variant of ds-14, so it cannot ship or be priced before those exist. The motivating scenario is invented
    (grounded: inferred, p_typical 0.07). The only evidence is an INFERRED line in methods-churn-funnel.md §1 saying un-instrumented
    steps are missing from the data. The cheap incumbent fix is one event: add popup-shown and popup-dismissed events to the build. And
    Amplitude already pairs funnels with session replay for exactly this "why" (the EA case, methods §1), so an analytics vendor is one
    feature away. The 24-hour promise also fights the capture limits. To get 500 triggered clips from a new build in a day, the studio
    has to record a large consented cohort of live players. iOS requires explicit consent and a visible recording indicator, and uploads
    wait for Wi-Fi (methods §7). A 30% shift threshold on dwell will also fire on every intended art or content change, so release owners
    will start ignoring the Slack channel. Finally, the willingness-to-pay line cites FTUE outcome case studies (FunCraft, EA), not anyone
    paying for build-regression alerts, so the price is not supported.
- id: design-30
  case: >
    Drop it as a standalone product. Keep it, at most, as a toggle in the existing User Test report. The "XS repackage" label hides the
    hard part: each graybox prototype needs its own detector for "the mechanic was used correctly". Prototypes change every week and
    use placeholder art with weak visual feedback, so every build means new labelling work. Where a detector is easy to build, a single
    game event the prototype developer adds in an hour gives the same count without any video. The scale also favours a human: 20 testers
    times 5 minutes is about 100 minutes of footage, and a lead designer can tick "used it correctly, yes or no" faster than a vendor can
    configure a detector. The demand evidence is thin. grounded is "inferred" and p_typical is 0.1, and the Nitro Games case is a
    roughly four-year-old vendor story about designing a tutorial, not about choosing between prototypes at greenlight (methods §2).
    PlaytestCloud already owns the panel, the customers and the per-session budget (EUR 113-141, market.md §1). Gemini takes video input
    natively (competitor-and-ua.md §1), so adding a frame check to transcript AI is one feature for PlaytestCloud. And at greenlight,
    budgets are small and decisions rest on judgement, so the buyer will not pay extra for a count they could make themselves.
- id: uxr-1
  case: >
    This is the weakest skeptic target in the batch: it is a sound improvement to the founder's existing product. But it is a feature
    that raises the yield of sessions customers already pay for, not a new product with its own budget line, and incumbents are close to
    shipping it. Antidote already records touches, controller inputs and game events next to gameplay video, and its "AI Insights"
    analyses player recordings and flags moments in the footage (market.md §1). Silent-struggle markers are one rule set away for
    Antidote, and one Gemini video call away for PlaytestCloud. The buyer, a researcher already paying PlaytestCloud or Antidote, gets
    recordings from that vendor's panel. The item's own depends_on admits that PlaytestCloud's mobile touch overlay "needs checking". So
    the product could sit downstream of a competitor that can cut off exports or copy the feature. The saving is about 3 hours of
    scrubbing per 12-player study. That is modest, and PlaytestCloud's First Findings already links each friction point to its clip.
    The rules are also noisy. More than 80% of players click straight through instruction screens (methods §2), so "card dwell under
    1 s" will flag ordinary skipping as struggle. Every new title also needs about 200 labelled frames before the markers mean anything.
    Ship it inside User Test. Do not lead the sales pitch with it.
- id: indie-15
  case: >
    Drop it. The item's own evidence field says "no note states an indie soft-launch go/kill need". Its moat scores 1, and it repeats
    publisher-2, which already sits higher in the top 25. The buyer is a 1-3 person indie with a $300 test budget, and the price anchor
    is $79-99 per soft launch. That does not cover a quarter of effort (effort M) plus SDK integration support for each customer. The
    substitutes are cheap or free. The founder of a game with 500 installs can watch 30 first sessions in an afternoon. We Playtest Games
    sells recruited sessions from $15 (market.md §1). The comparison is also weak. Thirty sampled sessions from $300 of Canadian traffic
    are compared against a GameAnalytics median that leaves out the top studios who keep data in-house (methods §1). An automated "fix or
    kill" verdict on that basis risks a wrong call on 9 months of work, and nobody would accept that accountability from a vendor. The
    capture consent rules (Apple's visible indicator, methods §7) apply to an indie as much as to a large studio.
- id: f2p-14
  case: >
    Explore later, because the data plumbing and the incentives work against it. It needs the MMP creative ID joined on the device to a
    video recording of the same player. The item itself says iOS restricts that ("iOS limited by attribution rules"), and GeekLab names
    iOS as where the attribution problem is worst (competitor-and-ua.md §3). So the product only works on Android, and adding video to
    ad-attribution data raises the consent burden. The decision it supports, pausing a creative with low D1, can already be made from the
    per-creative retention and ROAS that MMP cohorts report today. Segwise already connects to AppsFlyer, Adjust, Branch and Singular and
    tags hooks (competitor-and-ua.md §3). Adding "D1 by hook tag" is one feature flag for Segwise and would show that fail-state hooks
    retain worse without any video. The behavioural classifier is weak: new players swipe the map and tap scenery whether or not an ad
    misled them. The D1 gap can also come from a different audience that the creative reached rather than a broken promise. The incentive
    problem is the biggest. UA teams buy misleading creatives knowingly because the CPI maths works, so evidence that the ad over-promised
    often changes nothing. The demand rests on vendor claims (FoxData) and one GeekLab complaint. It has p_typical 0.06 and depends on
    f2p-2, which is not built.
