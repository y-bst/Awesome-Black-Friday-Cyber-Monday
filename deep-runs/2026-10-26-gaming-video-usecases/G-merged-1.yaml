    processing-location: vendor-cloud
  object: PostHog Unity session replay, which market.md section 2 records as 'screenshot-based, with no built-in masking'
  situation: A product lead asks to add a screenshot-replay SDK to the live game to see FTUE screens
  consequence: A synchronous GPU-to-CPU readback stalls the pipeline; on a mid-tier phone a 1080p readback plus JPEG encode on the CPU can cost several ms (estimate 3-10 ms), which shows up as a visible
    hitch once per second; the engine lead refuses
  p_typical: 0.07
  grounded: inferred
  evidence: 'market.md section 2: ''The Unity SDK is screenshot-based, with no built-in masking of text or images''; methods-churn-funnel.md section 6: ''PostHog lists Unity replay only as alpha'''
  proposed: Do not sell this path; replace with async GPU readback or hardware-encoder capture (cto-5)
  shallow: false
  mechanism: None to build; this leaf records the refusal so the founder does not ship a screenshot-based SDK to game studios
  example: A hypercasual runner at 60 fps hitches every 1,000 ms during the tutorial; the engine lead removes the SDK in the next build and blocks the vendor
  cost: S
  depends_on: nothing
  buyer: CTO or engine lead of a mobile casual studio (refusing)
  input: Screenshots from the render thread plus touch events
  why_existing_tools_cannot: 'market.md section 2: generic replay tools fall back to screenshots on engine canvases; methods-churn-funnel.md section 6 INFERRED: ''app replay tools either fall back to screenshots
    or show nothing useful'''
  willingness_to_pay: 1 - refused regardless of price; the only paid analogue (IV Metrics $49-99/month, market.md section 2) is bought by indies who have no engine lead
  refusal: true
- id: cto-5
  title: Engine plugin that blits the backbuffer to a 640x360 texture at 2 fps and feeds the hardware encoder, 60-second ring buffer in about 2 MB
  level: L4
  cell:
    buyer-role: engineering-performance
    video-source: own-players-consented-sdk
    signal-extracted: ui-state-and-screen-flow
    analysis-type: funnel-drop-off-why
    lifecycle-moment:
    - soft-launch
    - ftue-first-session
    delivery-form: engine-editor-plugin
    effort: M-one-quarter
    constraint-to-overcome:
    - device-performance
    - bandwidth-and-storage
    value-lever-b2b: de-risk-a-go-kill-decision
    companion-data: telemetry-events
    game-platform-and-genre: mobile-midcore-f2p
    capture-trigger-and-sampling:
    - always-on-ring-buffer
    - event-triggered-clip
    processing-location: on-device
    go-to-market-channel: engine-asset-store-or-marketplace
  object: Unity URP / Unreal RHI final backbuffer; Android MediaCodec and iOS VideoToolbox surface input; methods-churn-funnel.md section 7 sampling knobs (b) and (c)
  situation: The engine lead will accept capture only if it never touches the CPU and stays under 0.3 ms GPU on a mid-tier phone
  consequence: Capture becomes allow-listable; the ring buffer uploads only on a trigger, so bandwidth stays near zero for untriggered sessions
  p_typical: 0.07
  grounded: inferred
  evidence: 'methods-churn-funnel.md section 7 INFERRED (b): ''a 30-120 s on-device ring buffer uploaded only on trigger''; (c): ''low fps (1-5 fps screenshots...) or 360-480p'''
  proposed: 'Asset-store plugin for Unity and Unreal: GPU downscale blit, zero-copy hand-off to the hardware encoder at 250 kbps, 60-second in-memory ring, upload on trigger over Wi-Fi'
  shallow: false
  mechanism: One extra downscale draw call per captured frame on the GPU, encoded by the phone's hardware encoder; 60 s x 250 kbps is about 1.9 MB held in RAM; no CPU pixel copies
  example: 'Midcore F2P soft launch: plugin measured at 0.12 ms GPU on Adreno 619; tutorial-abandon trigger uploads 60 s clips from 4% of new installs'
  cost: M
  depends_on: Per-engine render pipeline hooks (URP, HDRP, Unreal mobile renderer); the circuit breaker in cto-2
  buyer: CTO or lead engine programmer at a mobile F2P studio on Unity or Unreal
  input: Engine backbuffer frames plus game events marking trigger moments
  why_existing_tools_cannot: 'market.md section 2: IV Metrics records rendered gameplay but documents no cost ceiling or ring buffer; methods-churn-funnel.md section 6: Sentry''s error-buffer pattern exists
    for app UI, not game canvases'
  willingness_to_pay: 4 - this is the form the CTO allows; buyer signal is IV Metrics $49-99/month for an SDK of this type and UXCam median about $21k/year for app replay (market.md 'Signals of willingness
    to pay')
  variants_of: sdk-1
- id: cto-6
  title: 'No video on the device: upload the engine replay stream and re-render it headless in the cloud, then run video AI on the render'
  level: L3
  cell:
    buyer-role: engineering-performance
    video-source: cloud-gaming-server-render
    signal-extracted:
    - structured-game-state-reconstruction
    - on-screen-text-ocr
    analysis-type: ask-a-question-over-footage
    lifecycle-moment: live-event-or-update
    delivery-form: ask-question-agent-chat
    effort: L-multi-quarter
    constraint-to-overcome:
    - anti-cheat-conflict
    - bandwidth-and-storage
    companion-data: telemetry-events
    game-platform-and-genre:
    - competitive-multiplayer
    - pc
    - console
    processing-location:
    - vendor-cloud
    - on-device
  object: Engine replay or demo files that multiplayer titles already record for kill-cams and spectating (Unreal's replay system); methods-churn-funnel.md section 7 bandwidth figures
  situation: A PC competitive shooter under EAC wants to know why new players quit in match 2, but the CTO forbids screen capture hooks and 2-4 GB/hour of video upload
  consequence: Replay streams are network-state data, so no capture hook exists for anti-cheat to flag and the client-side cost is what the game already pays for kill-cams
  p_typical: 0.03
  grounded: speculative
  evidence: 'methods-churn-funnel.md section 7: ''720p H.264 game capture: 5-10 Mbps = 2.3-4.6 GB/hour''; market.md section 4: Microsoft Muse trained on recorded Bleeding Edge matches with controller actions'
  proposed: Ingest replay files from the game's servers, render them on cloud GPUs from the player's camera at 720p 10 fps, and hand the render plus exact game state to the question agent
  shallow: false
  mechanism: Server-side replay files go to a headless build of the game in the vendor's or the studio's cloud; the build renders the player's view; the AI reads both pixels and ground-truth state (no OCR
    guessing)
  example: 'Match 2 of 1,800 new players re-rendered: 62% of quitters died within 20 s of spawn to a weapon they never saw on screen; answer returned in the chat with clips'
  cost: L
  depends_on: A title with a deterministic replay system; a headless rendering build supplied by the studio; cloud GPU budget
  buyer: CTO or lead engine programmer at a PC or console competitive multiplayer studio
  input: Server-recorded replay files plus match telemetry; no device video
  why_existing_tools_cannot: 'market.md section 2: all replay SDKs capture pixels on the client; adjacent-usecases.md section 2: anti-cheat is kernel-level (Vanguard) and screen-reading code looks like
    a vision aimbot'
  willingness_to_pay: 4 - removes both the bandwidth and anti-cheat vetoes; competitive titles already pay for player insight (Hatchet $249-1,249+/month, market.md section 5) but have no capture path today
