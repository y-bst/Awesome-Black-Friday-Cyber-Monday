- id: cto-1
  title: 'Zero-binary capture from the emulator compositor: 1 fps 480p clips of opted-in players, game APK untouched'
  level: L3
  cell:
    buyer-role:
    - engineering-performance
    - product-retention
    video-source:
    - platform-or-emulator-capture
    - own-players-consented-sdk
    signal-extracted:
    - ui-state-and-screen-flow
    - input-timing-and-hesitation
    analysis-type:
    - funnel-drop-off-why
    - cohort-comparison
    lifecycle-moment: ftue-first-session
    delivery-form: per-cohort-report
    effort:
    - requires-partner-or-platform-deal
    - M-one-quarter
    constraint-to-overcome:
    - device-performance
    - integration-effort-per-engine
    - privacy-and-consent
    - joining-video-to-events
    - per-game-ui-generalisation
    value-lever-b2b:
    - de-risk-a-go-kill-decision
    - produce-a-sellable-asset
    companion-data:
    - telemetry-events
    - touch-and-controller-input
    game-platform-and-genre:
    - mobile-midcore-f2p
    - mobile-casual-hypercasual
    capture-trigger-and-sampling: opt-in-panel
    processing-location: edge-or-platform-server
    go-to-market-channel: bundled-with-platform
  object: The game frame already composed on the host GPU by a PC Android emulator; market.md section 2 note that session-replay SDKs record or screenshot inside the game process
  situation: A midcore F2P studio wants FTUE video of real players, but the engine lead refuses any SDK that adds frame time, APK size or a capture hook to the shipping build
  consequence: With an in-game SDK the request dies at the allow-list; with emulator capture the cost lands on the host PC (0 ms on the game's own frame budget, 0 KB APK delta) and the CTO has nothing to
    veto
  p_typical: 0.08
  grounded: inferred
  evidence: 'market.md section 9: ''No vendor found that applies computer vision to production player gameplay video from consumer devices''; methods-churn-funnel.md section 7 (c): ''UI-state recognition
    does not need 30 fps 720p'''
  proposed: Emulator-side recorder that encodes 1 fps 480p from the compositor for players who opted in inside the emulator client, keyed to the package name, delivered to the studio per cohort
  shallow: false
  mechanism: The platform taps its own compositor output and input log, samples 1 fps at 480p, runs UI-state classification in its cloud, and sells per-title FTUE step reports to the studio; nothing changes
    in the game binary
  example: 'A midcore RPG on emulator: 2,300 opted-in first sessions show 41% leave on the hero-summon screen after the 3rd tap on a locked button; the CTO signed nothing because no code shipped'
  cost: M
  depends_on: An emulator or platform partner with an opt-in consent flow; a join key from platform account to the studio's install ID (MMP or login ID)
  buyer: Product lead pays; CTO or engine lead at a mobile F2P studio is the approver who has nothing to block
  input: Emulator-captured video of opted-in players plus emulator input log; studio telemetry joined by install ID
  why_existing_tools_cannot: 'market.md section 2: IV Metrics, PostHog and UXCam all need an SDK inside the game, and PostHog Unity is screenshot-based; no vendor in market.md captures without touching
    the binary'
  willingness_to_pay: 4 - IV Metrics charges $49-99/month for SDK-based gameplay video and PlaytestCloud about EUR 113 per recorded session (market.md 'Signals of willingness to pay'); removing the integration
    step removes the CTO veto that blocks both
  also_from:
  - sdk-4
  merge_note: same zero-SDK emulator/platform-host capture with per-title FTUE reports, product lead pays
  contested_by:
  - oem-24
- id: cto-2
  title: Self-measuring capture module that switches itself off when its p95 cost passes 0.5 ms per frame or the device reports thermal state 'serious'
  level: L4
  cell:
    buyer-role: engineering-performance
    video-source: own-players-consented-sdk
    signal-extracted: performance-fps-and-load
    analysis-type:
    - anomaly-alert
    - cohort-comparison
    lifecycle-moment: soft-launch
    delivery-form:
    - api-or-sdk
    - dashboard
    - per-cohort-report
    effort:
    - M-one-quarter
    - S-weeks
    constraint-to-overcome: device-performance
    value-lever-b2b:
    - de-risk-a-go-kill-decision
    - enable-automated-action
    companion-data: device-perf-counters
    buyer-org-type:
    - mid-size-studio
    - aaa-studio
    game-platform-and-genre: mobile-midcore-f2p
    capture-trigger-and-sampling: targeted-cohort
    processing-location: on-device
    automation-level: closed-loop-in-game-action
  object: The capture SDK's own CPU and GPU timer per frame, Android PowerManager thermal status and iOS ProcessInfo.thermalState; the 1-2 ms per frame veto line in the CTO persona
  situation: Soft launch on 400 Android models; the engine lead will allow-list a capture SDK only if it can prove it never takes more than a fixed slice of a 16.6 ms (60 fps) or 33.3 ms (30 fps) frame
  consequence: Without a self-limiter the SDK is refused; with it, the analytics team must also see how many sessions were excluded, or video samples skew to flagship phones
  p_typical: 0.06
  grounded: inferred
  evidence: 'methods-churn-funnel.md section 7 INFERRED: ''Full capture is unrealistic on mobile''; adjacent-usecases.md section 6: ''same build can run 60 fps on a flagship and 24 fps on a mid-tier phone'''
  proposed: 'Circuit breaker: measure own cost over a 300-frame window, disable for the session at p95 > 0.5 ms, thermal >= serious or battery < 20%, and report exclusion counts per device tier'
  shallow: false
  mechanism: SDK wraps its blit and encode calls in GPU timestamp queries, keeps a rolling p95, and on breach stops capture and logs a 'capture_suppressed' event with reason; a dashboard shows capture coverage
    by device tier
  example: Mali-G52 phones hit the 0.5 ms line in 18% of sessions; capture auto-disabled there, and the funnel report flags that tier as under-sampled at 3% vs 11% for Adreno 7xx
  cost: S
  depends_on: A capture path that uses GPU blit plus hardware encoder (cto-5); telemetry pipeline to receive the suppression events
  buyer: CTO or lead engine programmer at a mobile F2P or midcore studio who owns the SDK allow-list
  input: On-device capture plus the SDK's own timers, thermal status and battery level
  why_existing_tools_cannot: 'market.md section 2: IV Metrics reports FPS/RAM of the game but no vendor documents a hard self-cost ceiling; PostHog Unity is screenshot-based with no cost guard'
  willingness_to_pay: '3 - not bought on its own; it is the condition for the allow-list that every SDK-based option depends on (market.md section 2: IV Metrics $49-99/month only happens after integration)'
  also_from:
  - sdk-3
  merge_note: same self-measuring SDK that stops capture on p95 frame-cost or thermal breach
- id: cto-3
  title: 'Overhead proof pack per build: SDK on vs off on 20 farm devices, frame-time p95 delta, APK delta in KB, mAh per hour, skin temperature after 30 minutes'
  level: L4
  cell:
    buyer-role: engineering-performance
    video-source: automated-bot-or-agent-playthrough
    signal-extracted: performance-fps-and-load
    analysis-type:
    - build-to-build-regression-diff
    - evidence-pack-for-enforcement
    lifecycle-moment: new-version-release
    delivery-form:
    - enforcement-or-cert-evidence-pack
    - issue-tracker-ticket
    effort: M-one-quarter
    constraint-to-overcome:
    - device-performance
    - bandwidth-and-storage
    pricing-model: free-with-platform
    value-lever-b2b:
    - de-risk-a-go-kill-decision
    - reduce-cost-per-incident
    companion-data: device-perf-counters
    capture-trigger-and-sampling: scheduled-bot-playthrough
    automation-level: auto-created-ticket-or-asset
  object: The SDK allow-list review the engine lead runs before any third-party binary ships; GameBench-style counters (FPS, CPU/GPU, battery, thermals) in adjacent-usecases.md section 6
  situation: Every release train, the engine lead must re-approve third-party SDKs; a capture SDK update could add 2 ms on Mali GPUs with no one noticing until reviews mention battery drain
  consequence: No evidence means the SDK is removed at the first performance regression, and the video product loses the customer
  p_typical: 0.05
  grounded: inferred
  evidence: 'adjacent-usecases.md section 6: GameBench ''measures FPS, frame stability, memory, CPU/GPU, battery, thermals''; ''compatibility testing of a major mobile title can need 500 to 2,000+ device-OS
    combinations'''
  proposed: 'Auto-generated PDF and JSON per SDK version x game build: 20 devices, same bot path, A/B with capture on/off, pass/fail against the studio''s thresholds'
  shallow: false
  mechanism: Vendor runs a scripted bot path twice per device (capture on, capture off), collects perf counters, diffs frame time p50/p95, binary size, battery drain and temperature, and posts the pack
    to the studio's allow-list ticket
  example: 'SDK 2.3 on build 1.18: +0.21 ms p95 on Snapdragon 680, +0.44 ms on Mali-G57, +312 KB APK, +38 mAh/hour; all under the 0.5 ms line, ticket auto-approved'
  cost: M
  depends_on: Device farm access (AWS Device Farm or BrowserStack, adjacent-usecases.md section 6); a bot path per title
  buyer: CTO or engine lead at any studio integrating the capture SDK
  input: Device-farm bot playthrough video plus device perf counters, two runs per device
  why_existing_tools_cannot: 'adjacent-usecases.md section 6: GameBench measures the game, not the delta caused by one third-party SDK; no capture vendor in market.md section 2 publishes per-device overhead'
  willingness_to_pay: 2 - the CTO expects it free as part of the SDK (sales enabler, not a line item); the device-farm cost per run is the vendor's (adjacent-usecases.md section 6 per device-hour pricing)
- id: cto-4
  title: 'REFUSED: screenshot capture that calls ReadPixels on the render thread every second'
  level: L3
  cell:
    buyer-role: engineering-performance
    video-source: own-players-consented-sdk
    signal-extracted: ui-state-and-screen-flow
    analysis-type: funnel-drop-off-why
    lifecycle-moment: ftue-first-session
