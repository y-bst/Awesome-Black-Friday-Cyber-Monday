- id: takedown-1
  title: "Own-footage ad finder: weekly frame-match of Meta Ads Library and TikTok Creative Center game ads against the studio's 400 trailer and gameplay keyframes, one row per rival ad with matched timestamps"
  level: L4
  cell: {buyer-role: finance-exec, video-source: competitor-store-and-ad-video, signal-extracted: structured-game-state-reconstruction, analysis-type: evidence-pack-for-enforcement, delivery-form: enforcement-or-cert-evidence-pack, lifecycle-moment: live-event-or-update, value-lever-b2b: reduce-cost-per-incident}
  object: "competitor-and-ua.md section 2: 'Meta Ads Library is free, shows only active ads on Facebook/Instagram, no spend data'; weekly monitoring uses Meta Ads Library plus TikTok Creative Center"
  situation: "a mid-size mobile studio's top-grossing match-3 game has a 0:21 trailer and 14 UA video ads; a rival advertiser starts running a 15-second ad whose seconds 3-11 are the studio's own level-clear sequence with the logo cropped out"
  consequence: "the studio's UA team sees CPI rise on the same audience while legal learns of the ad only when a colleague spots it; with no frame-matched proof, legal cannot file a Meta IP report that the reviewer will act on within days"
  p_typical: 0.12
  grounded: inferred
  evidence: "competitor-and-ua.md section 2: libraries show active ads only; section 3: every creative tool 'analyses the ad video plus network metrics' (Segwise, Alison.ai, Vidmob, Replai) and none matches a rival ad back to the studio's own source footage"
  proposed: "studio uploads 300-500 keyframes of its own footage once; a weekly crawl of the two libraries for ads in the game's genre and country list is sampled at 1 fps and matched by perceptual hash plus a VLM check; each hit gets a row with ad ID, advertiser page, first-seen date, matched timestamps and the two frames side by side"
  shallow: false
  mechanism: "crawler collects ad video from the public libraries, samples at 1 fps, compares each frame with the studio's reference set (perceptual hash first, a vision-language model second to confirm same scene and not just same genre); runs of 3 or more consecutive matched seconds become a candidate; the report agent writes the evidence row"
  example: "Match-3 studio: the scan on Monday finds 6 ads from 4 advertiser pages that reuse 3-9 seconds of the studio's footage; legal reviews the 6 rows in 40 minutes and files 4 reports the same day."
  cost: M
  depends_on: "ad-library crawler (the studio's own video ingestion and report agent already exist); reference-frame upload; a legal reviewer for every hit"
  buyer: "head of legal or IP counsel at a mobile publisher, with the UA director as co-sponsor"
  input: "competitor-store-and-ad-video from Meta Ads Library and TikTok Creative Center + the studio's own trailer and gameplay frames"
  why_existing_tools_cannot: "competitor-and-ua.md section 3: creative-analytics tools tag the ad and join it to network metrics; none compares a rival ad to the studio's own source footage; section 2: Meta Ads Library only lists active ads, so a removed ad leaves no record"
  willingness_to_pay: "3 - no price for enforcement tooling in the notes; the anchors are Segwise $499-$1,699/month for UA creative tagging and Sensor Tower median $75,000/yr (competitor-and-ua.md sections 3 and 1); a legal budget would pay on avoided incident cost, not per scan"

- id: takedown-2
  title: "Preview-video lookalike watch: new App Store and Google Play listings whose 30-second preview or screenshots reuse the studio's footage, checked daily in the 21 days after each launch or major update"
  level: L4
  cell: {buyer-role: brand-advertiser, video-source: competitor-store-and-ad-video, signal-extracted: ui-state-and-screen-flow, analysis-type: anomaly-alert, lifecycle-moment: ua-campaign-launch, delivery-form: alert-or-slack, capture-trigger-and-sampling: random-sample}
  object: "competitor-and-ua.md section 2: 'Apple allows app preview videos up to 30 seconds, up to three per product page'; 'AI Vidia states App Store previews may only use footage captured in the app itself (vendor)'"
  situation: "day 4 of a global launch that cost USD 600k in UA; a new listing in the same category appears with a preview whose second 5-14 is the studio's FTUE tutorial screens and a near-identical icon"
  consequence: "the clone's listing competes for the same search keywords during the launch window; every day it stays up diverts installs, and an Apple App Review complaint filed after day 10 costs the launch window"
  p_typical: 0.08
  grounded: inferred
  evidence: "competitor-and-ua.md section 2: previews are capped at 30 s and 3 per page and may only show in-app footage, so a preview that shows the studio's UI is a policy breach as well as an IP issue; section 1: GameRefinery 'automated tags' read store metadata, not video"
  proposed: "daily poll of new releases in the category's top-200 new list and keyword searches for the game name and 5 mechanic phrases in 8 languages; matching of preview frames to the studio's reference set; Slack alert with listing URL, matched seconds and a prefilled store-complaint text"
  shallow: false
  mechanism: "scheduled store crawl pulls preview videos and screenshots of new and updated listings, frame-matches them against the studio's reference set, and scores icon, screenshot and preview similarity separately; alert fires when preview similarity exceeds a threshold set by legal"
  example: "A casual-puzzle publisher launching in 40 countries gets an alert on day 4: a listing published 9 hours earlier reuses 11 seconds of the tutorial; the complaint goes to Apple the same afternoon."
  cost: M
  depends_on: "store crawler and rate-limit-safe access to public listings; legal-approved complaint templates"
  buyer: "ASO manager and IP counsel at a mobile publisher (UA marketing budget)"
  input: "competitor-store-and-ad-video (listing previews and screenshots) + the studio's reference frames and launch calendar"
  why_existing_tools_cannot: "competitor-and-ua.md section 6: store tools run the studio's own page experiments; section 1: GameRefinery auto-tagging reads store metadata and ASO monitors track listing changes, not whether a preview contains the studio's own footage"
  willingness_to_pay: "2 - cheap versus a launch budget but sold by value protected; analogous ASO monitoring is a low-hundreds per month purchase (AppTweak class, adjacent-usecases.md section 7); no price for IP watch in the notes"

- id: takedown-3
  title: "Asset-level reuse matcher: finds the studio's character sprites, 3D model silhouettes and UI atlases inside clone-game gameplay videos, even when recoloured or rescaled"
  level: L4
  cell: {buyer-role: finance-exec, video-source: competitor-store-and-ad-video, signal-extracted: visual-errors-and-glitches, analysis-type: evidence-pack-for-enforcement, delivery-form: enforcement-or-cert-evidence-pack, game-platform-and-genre: mobile-midcore-f2p, companion-data: build-and-config-metadata}
  object: "methods-churn-funnel.md section 4: 'button/popup detection (mAP ~90% on mobile games)' and 'a per-title detector trained on a few hundred labelled frames is plausibly enough'"
  situation: "a clone of a midcore collector game ships with 38 of the studio's 120 hero portraits and the studio's currency icon, each recoloured by 15% and scaled 80%"
  consequence: "text-only store complaints ('looks similar') are rejected; frame crops of identical hero art with the studio's asset file names in a side-by-side table are what an IP reviewer accepts, and without them the studio cannot show the copying is of expression and not of the idea"
  p_typical: 0.05
  grounded: inferred
  evidence: "methods-churn-funnel.md section 4: a per-title detector trained on a few hundred labelled frames is plausibly enough; market.md section 9: 'No vendor found that does CV-based competitor gameplay analysis'"
  proposed: "build a per-title template set from the studio's art repository (hero portraits, currency icons, button atlas: 200-1,000 images), run local-feature matching over 1 fps frames from the clone's store preview and a 10-minute recorded install session, output one cropped pair per asset with a similarity score"
  shallow: false
  mechanism: "the studio exports its art bundle to a reference index; each frame of the clone video is segmented into regions and matched by local-feature and embedding similarity tolerant to recolour and scale; matched regions are cropped and paired with the source asset file name and its commit date"
  example: "Legal at a collector-game studio gets a table of 38 matched hero portraits with source file names and first-commit dates, attached to a Google Play developer-policy report on a clone."
  cost: L
  depends_on: "access to the studio's art repository and its commit history; competitor install capture on a test device"
  buyer: "IP counsel at a midcore publisher, with the art director signing off the matches"
  input: "competitor-store-and-ad-video + a recorded 10-minute install session of the clone + the studio's art repository and build-and-config-metadata"
  why_existing_tools_cannot: "market.md section 9: no vendor does CV competitor gameplay analysis; competitor-and-ua.md section 1: feature tagging is human-play-and-log, not asset matching"
  willingness_to_pay: "3 - sold per case to a studio facing a damaging clone; no published price, anchored on a managed-project engagement in the PlaytestCloud EUR 13.6k-33.9k band (market.md signals)"

- id: takedown-4
  title: "Tamper-evident ad capture: every suspect ad is archived at first sight with MP4, library URL, advertiser page ID, country, capture clock and SHA-256, because Meta Ads Library lists only active ads"
  level: L4
  cell: {buyer-role: finance-exec, video-source: competitor-store-and-ad-video, signal-extracted: on-screen-text-ocr, analysis-type: evidence-pack-for-enforcement, delivery-form: enforcement-or-cert-evidence-pack, constraint-to-overcome: accuracy-and-trust, pricing-model: per-audit-or-certification}
  object: "competitor-and-ua.md section 2: 'Meta Ads Library is free, shows only active ads on Facebook/Instagram, no spend data'"
  situation: "a rival stops its infringing ad 36 hours after the studio's first complaint and the ad disappears from the library; two weeks later legal needs the ad to support a claim against the same advertiser's next account"
  consequence: "with no archived copy the studio has only a colleague's phone screenshot, which an opposing counsel or platform reviewer can dismiss; archiving after the fact is impossible"
  p_typical: 0.07
  grounded: inferred
  evidence: "competitor-and-ua.md section 2: libraries show only active ads; adjacent-usecases.md section 2 (anti-cheat): ban appeals rest on clip evidence, and one paper stresses 'false accusations as the key risk'"
  proposed: "on first match, store the video, a full-page render of the library entry, response headers and a hash with an RFC 3161 timestamp; export a PDF/ZIP evidence file with a chain-of-capture log that legal can hand to outside counsel"
  shallow: false
  mechanism: "the crawler snapshots each candidate at detection time: raw media bytes, rendered page, URL, advertiser page ID, country and capture clock, hashes them and requests a third-party timestamp; the evidence file lists every capture step so a reviewer can re-run it"
  example: "Four months after a rival's ad ran for 9 days, the studio's counsel attaches the archived MP4 and timestamp to a letter before action; the ad has long been gone from Meta Ads Library."
  cost: S
  depends_on: "takedown-1 or any crawler that surfaces candidates; a timestamping service account"
  buyer: "IP counsel or paralegal at a publisher; outside law firm as the consumer of the file"
  input: "competitor-store-and-ad-video (public ad library pages) + crawler metadata"
  why_existing_tools_cannot: "competitor-and-ua.md section 2: the free library drops inactive ads and offers no capture record; section 1: Sensor Tower Creative Gallery shows impressions, network and duration per ad but is a research view, not a signed archive"
  willingness_to_pay: "2 - a feature of takedown-1 rather than a stand-alone buy; priced per audit file, with no price anchor in the notes"

- id: takedown-5
  title: "Per-platform notice drafter: from one evidence row, generates the Apple, Google Play, Meta, TikTok and YouTube report text, each filling that platform's own required fields and attaching the matched frames"
  level: L4
  cell: {buyer-role: finance-exec, video-source: public-streams-and-ugc, signal-extracted: on-screen-text-ocr, analysis-type: evidence-pack-for-enforcement, delivery-form: ask-question-agent-chat, automation-level: auto-created-ticket-or-asset, effort: XS-repackage-existing-user-test-product}
  object: "competitor-and-ua.md section 2: previews and ad libraries sit on separate platforms (Apple, Google Play, Meta, TikTok) with different rules, e.g. 'App Store previews may only use footage captured in the app itself'"
  situation: "one infringing asset lives as a Meta ad, a TikTok Creative Center entry, a YouTube upload and an App Store preview at once; today legal writes four different complaints by hand in 25 minutes each"
  consequence: "inconsistent reports get rejected on one platform and accepted on another, so the clone is removed from 2 of 4 places; legal spends 100 minutes on a single asset"
  p_typical: 0.09
  grounded: speculative
  evidence: "none"
  proposed: "template library per platform, filled by the existing report agent from the evidence row; output is a draft in a legal queue, never sent without a named reviewer clicking approve"
  shallow: false
  mechanism: "the report agent reads the evidence row (matched frames, timestamps, advertiser IDs, source file names, first-publication date) and writes four platform-specific drafts with the field names each platform's form asks for; a legal reviewer edits and submits"
  example: "Counsel at a publisher approves 4 drafts in 12 minutes instead of writing them in 100 minutes, and the pack is reused for the next hit from the same advertiser."
  cost: S
  depends_on: "takedown-1 or takedown-4 producing the evidence rows; templates reviewed by the studio's counsel"
  buyer: "IP counsel at a publisher"
  input: "evidence rows + public-streams-and-ugc and ad URLs for the same asset"
  why_existing_tools_cannot: "the notes show no vendor in this area; the User Test report agent already writes structured findings from footage (A-frame assumptions), so the gap is templates and a reviewer queue, not a new model"
  willingness_to_pay: "2 - labour saving of about 90 minutes per asset; no price in the notes, small seat licence feel (Alison.ai $10-$25 per user per month, competitor-and-ua.md section 3)"

- id: takedown-6
  title: "Repeat-offender graph: clusters rival ads, store listings and developer accounts by which of the studio's frames they reuse, to show one actor behind 14 accounts and support an account-termination request"
  level: L4
  cell: {buyer-role: finance-exec, video-source: competitor-store-and-ad-video, signal-extracted: bot-or-fraud-behaviour, analysis-type: cohort-comparison, delivery-form: dashboard, buyer-org-type: publisher}
  object: "competitor-and-ua.md section 2: 'screenshotting ads seen inside another game mislabels them as that game's creative (vendor guide)'; section 1 Sensor Tower Creative Gallery rows carry network and advertiser"
  situation: "over 5 weeks, 14 Meta advertiser pages and 3 Play developer accounts publish ads and listings that all reuse the same 6 clips from the studio's footage, each with a new page name after a takedown"
  consequence: "each complaint removes one item and the actor re-registers, so legal files 40 complaints a quarter; a single graph showing a common creative fingerprint is what makes a platform terminate the account"
  p_typical: 0.04
  grounded: inferred
  evidence: "competitor-and-ua.md section 2 and section 1: tools list ads one by one with network metadata; no source shows linking ads to an actor by shared reused footage"
  proposed: "node = ad, listing, advertiser page, developer account; edge = shares a matched clip, same end-card store URL, same payment descriptor shown on the page; dashboard shows clusters with first-seen date and takedown history"
  shallow: false
  mechanism: "matched clips from takedown-1 and takedown-2 are tagged with a clip ID; ads and listings that share clip IDs, end-card links or identical caption text are joined into one cluster; the dashboard counts reports filed, removed and re-appeared per cluster"
  example: "Legal sees one cluster of 17 items from 14 pages in 5 weeks, files one escalation to Meta's repeat-infringer team, and the cluster stops re-appearing for 60 days."
  cost: M
  depends_on: "takedown-1 and takedown-4 running for at least 4-6 weeks to build history"
  buyer: "IP counsel and brand protection lead at a publisher with several top-grossing titles"
  input: "competitor-store-and-ad-video over many weeks + the studio's takedown log"
  why_existing_tools_cannot: "competitor-and-ua.md section 1: ad-intelligence tools rank creatives by impressions and show network per ad but have no notion of one actor reusing one source clip"
  willingness_to_pay: "2 - only worth buying after takedown-1 shows a repeat pattern; no price anchor, would sit in the annual enterprise band of Sensor Tower $29,500-$115,460 (competitor-and-ua.md section 8)"

- id: takedown-7
  title: "Ad-network sweep: a nightly bot plays 30 top rewarded-ad slots across 25 mid-core and casual games, records every ad shown, and matches them to the studio's footage, because AppLovin and similar networks publish no ad library"
  level: L4
  cell: {buyer-role: ua-marketing, video-source: competitor-store-and-ad-video, signal-extracted: ad-render-and-viewability, analysis-type: evidence-pack-for-enforcement, capture-trigger-and-sampling: scheduled-bot-playthrough, delivery-form: enforcement-or-cert-evidence-pack}
  object: "competitor-and-ua.md section 2: 'AppLovin publishes no public competitor ad library; screenshotting ads seen inside another game mislabels them as that game's creative (vendor guide)'"
  situation: "an infringing ad runs only inside other publishers' rewarded-video slots on AppLovin and Unity Ads, where there is no public library to search"
  consequence: "the ad reaches the studio's own lapsed players for weeks without ever appearing in Meta or TikTok libraries; the studio finds out from a Discord complaint"
  p_typical: 0.05
  grounded: inferred
  evidence: "competitor-and-ua.md section 2: no AppLovin public ad library; section 6 of the same note: store experiments run only on the studio's own page; adjacent-usecases.md section 6: device-lab rigs exist (HeadSpin, WeTest PerfDog, market.md section 3)"
  proposed: "10 real devices on a rotating schedule, each opening 3 host games and triggering rewarded and interstitial ad slots; each ad is recorded to its end card, the store link read, and the ad matched to the reference set"
  shallow: false
  mechanism: "a device rig plays host games, triggers ad slots, records ad video plus end-card URL, labels the host game and network, and runs the footage matcher; an ad containing a run of 3 or more matched seconds is stored with a hash and the device clock"
  example: "A casual publisher's rig records 1,900 ad impressions in a week across 25 host games and finds 3 ads with 8 seconds of its footage, all ending on one Play listing, none ever in Meta Ads Library."
  cost: L
  depends_on: "device farm or in-house rig; takedown-1 matcher; legal check that host-game terms allow automated play"
  buyer: "UA director plus IP counsel at a mobile publisher; the UA budget funds the rig"
  input: "competitor-store-and-ad-video captured from live ad slots + the studio's reference frames"
  why_existing_tools_cannot: "competitor-and-ua.md section 2: AppLovin has no public library and hand screenshots mislabel the ad's owner; Sensor Tower Creative Gallery (section 1) covers networks it ingests, with impressions, but not frame-level reuse of a given studio's footage"
  willingness_to_pay: "2 - UA teams already pay $499-$1,699/month (Segwise) and Sensor Tower $75,000 median; a rig is costlier to run, so only studios with repeated ad theft pay"

- id: takedown-8
  title: "Harm quantifier: joins a matched rival ad's impressions from ad intelligence with the studio's CPI to estimate diverted installs, giving legal a damages line for a demand letter"
  level: L4
  cell: {buyer-role: finance-exec, video-source: competitor-store-and-ad-video, signal-extracted: ad-render-and-viewability, analysis-type: root-cause-of-a-metric-change, delivery-form: per-cohort-report, companion-data: attribution-campaign-and-creative-id, value-lever-b2b: de-risk-a-go-kill-decision}
  object: "competitor-and-ua.md section 1: Sensor Tower Ad Intelligence 'Creative Gallery ... showing impressions, network and duration per ad, share-of-voice ranking'; section 3: 'top 2% of gaming video creatives took 60.7% of spend (unverified)'"
  situation: "a rival ad with 6 seconds of the studio's footage ran 19 days and the studio's iOS CPI in the same country rose 22% over the same 19 days"
  consequence: "without a number, a demand letter says 'significant harm' and counsel cannot decide whether to sue, settle or only file a takedown; the 22% CPI move is not linked to the ad by any tool"
  p_typical: 0.05
  grounded: speculative
  evidence: "competitor-and-ua.md section 3: GeekLab says it is hard to see which creative acquired players who later retain and pay; section 1: impressions per ad are published by ad-intelligence tools"
  proposed: "report: impressions of the infringing ad by country and day, the studio's CPI and installs by day, a difference-in-differences vs 2 control countries, with the confidence interval stated; marked as an estimate, never as proof of causation"
  shallow: false
  mechanism: "takes matched-ad exposure by day and country, the studio's MMP installs and spend by day, builds a control from countries with no matched ad, and reports the estimated lost installs and cost with a range"
  example: "Counsel reads 'estimated 31k diverted installs, USD 90k-140k at the studio's CPI' in a demand letter and the rival settles within 3 weeks."
  cost: M
  depends_on: "takedown-1 matches; MMP exports (companion-data); ad-intelligence impressions licence (Sensor Tower or AppMagic)"
  buyer: "general counsel or finance partner at a publisher"
  input: "competitor-store-and-ad-video impressions + attribution-campaign-and-creative-id data"
  why_existing_tools_cannot: "competitor-and-ua.md section 3: 'Every tool above analyses the ad video plus network metrics'; none ties a rival's ad to the studio's own CPI and installs"
  willingness_to_pay: "2 - valuable only in a dispute; a one-off managed project, anchored on analyst-led work at Keywords-class vendors (market.md section 3) with no price in the notes"

- id: takedown-9
  title: "Fan-versus-infringer triage: classifies public videos that use the studio's footage as fan content, creator-programme content or commercial reuse, so legal sends notices only to the third group"
  level: L4
  cell: {buyer-role: community-and-creator-marketing, video-source: public-streams-and-ugc, signal-extracted: on-screen-text-ocr, analysis-type: content-rating-classification, delivery-form: weekly-digest-email, constraint-to-overcome: accuracy-and-trust}
  object: "competitor-and-ua.md section 5: 'Monitoring today is by viewership counts, tracked links and keys, not by what is shown in the clip. Nothing found reads clip content'"
  situation: "of 600 public videos a month that show the studio's gameplay, 580 are fans and 20 are a rival's promo, a free-to-play funnel page or a re-upload with ads; a blanket automated takedown tool hits a top streamer"
  consequence: "a notice sent to a 400k-subscriber creator by mistake costs the community team a week of repair; legal cannot tell the 20 from the 580 without watching them"
  p_typical: 0.07
  grounded: inferred
  evidence: "competitor-and-ua.md section 5: Gamesight, Lurkit, Hatchet measure viewership and tracked links; market.md section 5: Hatchet 'measures viewership metadata'; nothing reads the clip"
  proposed: "per video: is the channel in the studio's creator programme, is a competing store link or QR on screen or in the description, is the footage cropped to hide the logo; output is three bins and a weekly digest of the third bin only"
  shallow: false
  mechanism: "VLM and OCR read the video frames and its on-screen overlays, compare channel ID with the creator-programme list, detect a competing install CTA or store link, and assign a bin with the evidence frame; humans review bin 3"
  example: "Community lead gets a Monday digest of 23 videos that carry a rival game's install link on top of the studio's footage, and sends none of the 577 fan videos a notice."
  cost: M
  depends_on: "public clip crawler; creator-programme list; legal rule for what counts as commercial reuse"
  buyer: "community and creator-marketing lead with legal as approver, publisher or mid-size studio"
  input: "public-streams-and-ugc + creator programme list"
  why_existing_tools_cannot: "competitor-and-ua.md section 5: creator tools count views and clicks and do not read clip content; no tool separates fan, programme and commercial reuse"
  willingness_to_pay: "2 - Hatchet-class stream analytics $249-$1,249+/month (market.md signals) is the budget the community team already holds"

- id: takedown-10
  title: "Watermark and credit leftover detector: finds clone videos that still carry the studio's logo traces, studio name or a ripped 'Powered by' end card in blurred or cropped corners"
  level: L4
  cell: {buyer-role: finance-exec, video-source: public-streams-and-ugc, signal-extracted: brand-logo-exposure, analysis-type: evidence-pack-for-enforcement, delivery-form: enforcement-or-cert-evidence-pack, constraint-to-overcome: ground-truth-labels}
  object: "market.md section 5 Relo Metrics: 'CV detects every visible sponsor logo across broadcast, streaming and social video (prominence, screen share, duration)'"
  situation: "a rival's 20-second ad pans over a corner where the studio's logo was blurred, with a 12 px ghost edge and half of a copyright line visible for 0.8 seconds"
  consequence: "frame-level feature matching misses it because the rest of the scene was re-rendered; a human watching at normal speed never sees the 0.8 seconds, yet it is the strongest proof of copying"
  p_typical: 0.03
  grounded: inferred
  evidence: "market.md section 5 Relo Metrics: logo detection in sports video is a mature product but 'Search found no esports or in-game equivalent'; methods-churn-funnel.md section 4: OCR is limited by low-resolution, stylised fonts"
  proposed: "a detector for blurred, inpainted and cropped logo remnants, trained on 2,000 synthetic samples made from the studio's own logo with blur, crop and inpaint variants; output the timestamps and corner crops"
  shallow: false
  mechanism: "synthetic augmentation of the studio's logo and copyright text produces training data for a small detector that flags residual shapes, colours and text fragments at 5 fps over ad and video frames"
  example: "A scan flags 3 ads where the studio's logo remains as a 9 px edge in the top-left corner, and counsel cites those frames as the first exhibit."
  cost: M
  depends_on: "studio logo and font assets; takedown-1 crawler"
  buyer: "IP counsel at a publisher"
  input: "public-streams-and-ugc and ad video + the studio's logo and copyright line assets"
  why_existing_tools_cannot: "market.md section 5: Relo Metrics finds clean sponsor logos in sports broadcasts, not residue of a deleted logo in game footage; methods-churn-funnel.md section 4 shows OCR struggles on low-resolution HUD fonts"
  willingness_to_pay: "1 - useful as an add-on feature, not a purchase on its own; no price anchor in the notes"

- id: takedown-11
  title: "Bait-and-switch evidence: compares what a rival ad shows (our footage) with a recorded 10-minute install session of the advertised app, and writes the mismatch as a misleading-advertising complaint"
  level: L4
  cell: {buyer-role: finance-exec, video-source: competitor-store-and-ad-video, signal-extracted: ui-state-and-screen-flow, analysis-type: ad-verification-and-fraud, delivery-form: enforcement-or-cert-evidence-pack, lifecycle-moment: post-churn-winback}
  object: "competitor-and-ua.md section 2: 'Competitor ad libraries expose creatives but not what happens after install; gameplay recorded from a device is the only path to post-install flow (FTUE, offers, shops, events)'"
  situation: "a rival ad shows the studio's boss fight; the advertised app on install opens a different, simpler game with 3 interstitial ads in the first 60 seconds"
  consequence: "lapsed players of the studio's game click the ad, install the rival and blame the studio for a poor experience; the studio's store rating drops by reviews written about the rival's app"
  p_typical: 0.06
  grounded: inferred
  evidence: "competitor-and-ua.md section 2: ad libraries show creatives, not post-install flow; methods-churn-funnel.md section 4: menu and screen classification is a mature piece (button and popup detection mAP ~90%)"
  proposed: "a recorded install session of the advertised app (emulator capture), screen-flow labelled, aligned side by side with the ad's seconds; the report states which promised scenes never appear in 10 minutes of play"
  shallow: false
  mechanism: "the ad and an emulator-recorded install session are both segmented into scenes and labelled; the matcher shows promised scenes absent from the product, and the report quotes the claims on screen"
  example: "Legal files a misleading-advertising complaint with scene 1 (boss fight, our footage) shown against 10 minutes of the rival app that contains no boss fight."
  cost: M
  depends_on: "takedown-1; emulator capture of the rival install; legal view of local advertising law"
  buyer: "legal and brand protection at a publisher with a licensed or high-profile IP"
  input: "competitor-store-and-ad-video + an emulator capture of the rival install"
  why_existing_tools_cannot: "competitor-and-ua.md section 2: libraries hide post-install flow; section 1: GameRefinery feature data comes from analysts playing by hand and is not set up for a one-off ad-versus-product comparison"
  willingness_to_pay: "2 - occasional high-value case; no price in the notes; a managed project priced like analyst work"

- id: takedown-12
