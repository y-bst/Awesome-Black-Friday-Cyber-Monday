  why_existing_tools_cannot: "adjacent-usecases.md section 5: localisation tools check the studio's own text; no note shows cross-country search for third-party reuse"
  willingness_to_pay: "2 - bundled into takedown-1 for publishers with 5+ markets; no separate price in the notes"

- id: takedown-14
  title: "Pre-signing clone check against the studio's own catalogue: before a UA agency or co-publisher pitches a 'similar game', matches its promo footage with the studio's catalogue to prove the pitch deck contains studio footage"
  level: L4
  cell: {buyer-role: publishing-scout-bd, video-source: competitor-store-and-ad-video, signal-extracted: structured-game-state-reconstruction, analysis-type: benchmark-vs-competitor, lifecycle-moment: publisher-pitch-or-diligence, delivery-form: per-cohort-report}
  object: "market.md section 9: 'No vendor found that does CV-based competitor gameplay analysis'; the existing scout-6 leaf checks pitch builds for clone risk against top-grossing titles"
  situation: "a studio is shown a pitch deck from a would-be partner with a 'proof of concept' clip; scenes 2 and 4 are 11 seconds of the studio's own game"
  consequence: "the studio's BD team has no way to know the partner trained its pitch on the studio's own footage; the studio negotiates blind"
  p_typical: 0.03
  grounded: speculative
  evidence: "market.md section 9: no vendor does CV competitor gameplay analysis; competitor-and-ua.md section 7: competitor comparison is manual today"
  proposed: "BD uploads any pitch clip received and gets a similarity report against the studio's catalogue in 15 minutes"
  shallow: false
  mechanism: "a self-serve upload checks the clip against the studio's catalogue frames and outputs the matched timestamps and the share of the clip that is studio footage"
  example: "A BD lead drops in a 90-second partner pitch video and learns 14% of it is the studio's footage."
  cost: S
  depends_on: "takedown-1 reference set"
  buyer: "BD lead at a publisher or studio"
  input: "competitor-store-and-ad-video (a partner or agency pitch clip received outside the stores) + the studio's catalogue frames"
  why_existing_tools_cannot: "market.md section 9: no CV on competitor gameplay found; the closest manual work is competitor-and-ua.md section 7"
  willingness_to_pay: "1 - rare event, tiny budget; free-with-platform feel as an add-on"

- id: takedown-15
  title: "Licensed-IP policing report: quarterly pack for a film, anime or sports licensor showing every public ad or clone app that uses the licensed characters, with matched frames and what the studio did about each"
  level: L4
  cell: {buyer-role: brand-advertiser, video-source: competitor-store-and-ad-video, signal-extracted: brand-logo-exposure, analysis-type: compliance-audit, delivery-form: enforcement-or-cert-evidence-pack, pricing-model: per-audit-or-certification, buyer-org-type: brand-advertiser}
  object: "market.md section 5 Relo Metrics: sponsor logo detection with 'prominence, screen share, duration' sold to marketers; no in-game equivalent found"
  situation: "a studio holds a game licence for a film franchise; the licence requires it to police unauthorised use of the characters and report each quarter to the licensor"
  consequence: "with no systematic scan the studio reports 'none found' while the licensor's own agency finds a clone ad using the characters; the licence renewal is at risk"
  p_typical: 0.04
  grounded: speculative
  evidence: "market.md section 5: Relo Metrics shows brand-detection on video is a paid product for sponsorships; no source covers licensed-character policing of game ads"
  proposed: "character reference set provided by the licensor; quarterly sweep of ads, store listings and public videos; report lists each hit, its status and the action taken"
  shallow: false
  mechanism: "the licensor supplies reference art; the system matches ads, listings and clips by character face and costume embeddings; the output is a counts-and-status table per quarter"
  example: "Studio sends its licensor a 12-page quarterly report with 9 hits, 7 removed, 2 pending, instead of a one-line email."
  cost: M
  depends_on: "licensor reference art; takedown-1 crawler"
  buyer: "licensing manager at the studio, report consumed by the licensor's brand team"
  input: "competitor-store-and-ad-video + licensor character art"
  why_existing_tools_cannot: "market.md section 5: logo-detection vendors cover sponsorship exposure, not unauthorised character use in game ads"
  willingness_to_pay: "2 - annual licence cost makes a report of this size a small line; no price in the notes"

- id: takedown-16
  title: "Paste-a-link triage in chat: a community manager pastes a player-reported ad or listing URL into the existing ask-a-question agent and gets 'matches our footage / does not match' with frames in under 2 minutes"
  level: L4
  cell: {buyer-role: player-support, video-source: public-streams-and-ugc, signal-extracted: structured-game-state-reconstruction, analysis-type: ask-a-question-over-footage, delivery-form: ask-question-agent-chat, capture-trigger-and-sampling: on-player-report, effort: XS-repackage-existing-user-test-product}
  object: "A-frame assumption: 'the company building this already has video ingestion, transcription and a report/ask-question agent (the User Test product)'"
  situation: "a player writes in Discord 'this ad is your game but it is not yours, 3 of 5 stars on the install'; the community manager cannot tell if the ad contains the studio's footage"
  consequence: "the report sits for 3 days in a Discord thread, then nobody forwards it to legal; the clone runs on"
  p_typical: 0.09
  grounded: speculative
  evidence: "none; the capability reuses the User Test ingestion and agent named in A-frame assumptions"
  proposed: "a Slack or web chat box: paste a URL, the agent downloads the public video, matches against the reference set, answers with matched timestamps and a button 'send to legal queue'"
  shallow: false
  mechanism: "the existing ingestion pipeline fetches the public video, a matcher runs against the reference set, the agent answers with matched seconds and a confidence, and a button files the row to the legal queue"
  example: "A community manager pastes 5 player-reported links on a Friday and sends 2 to legal in 10 minutes."
  cost: S
  depends_on: "takedown-1 reference set; public video fetch rights"
  buyer: "community manager or player-support lead at a mid-size studio"
  input: "public-streams-and-ugc reported by players + reference frames"
  why_existing_tools_cannot: "competitor-and-ua.md section 5: UGC monitoring tools do not read clip content; community managers use viewership dashboards"
  willingness_to_pay: "2 - a feature in the same bundle as takedown-1; seat price level (Alison.ai $10-$25 per user per month)"

- id: takedown-17
  title: "REFUSAL: fully automatic filing of takedown notices with no human reviewer, because one wrong notice against a creator or a rival's genuine game creates liability"
  level: L3
  cell: {buyer-role: finance-exec, video-source: competitor-store-and-ad-video, analysis-type: evidence-pack-for-enforcement, delivery-form: enforcement-or-cert-evidence-pack, automation-level: closed-loop-in-game-action}
  object: "adjacent-usecases.md section 2: one paper's server-side LSTM reached 88.6% accuracy with 0.97% false positives and 'the authors stress false accusations as the key risk'"
  situation: "a matcher with a 1% false-positive rate scans 10,000 ads a month and would file about 100 wrong notices a month"
  consequence: "counsel refuses to put the studio's name to notices nobody read; a false claim creates liability and platform blocking; the buyer pays only for drafts in a review queue"
  p_typical: 0.06
  grounded: inferred
  evidence: "adjacent-usecases.md section 2: false accusations are the key risk in automated detection; the studio's counsel would see the same risk"
  proposed: "keep takedown-5 as a drafter with a named human approver; never a submit-without-review mode"
  shallow: false
  mechanism: "the product would auto-submit reports when the match score exceeds a threshold; this is the version the legal buyer refuses"
  example: "A vendor demo that files 40 notices overnight is rejected by the general counsel at the first meeting."
  cost: S
  depends_on: "takedown-5"
  buyer: "general counsel at a publisher (refuses)"
  input: "competitor-store-and-ad-video + match scores"
  why_existing_tools_cannot: "no tool is needed to make this; the item records what the buyer will not buy"
  willingness_to_pay: "1 - refused; buyers pay for review-queue drafts instead"

- id: takedown-18
  title: "REFUSAL: 'mechanic clone' accusation reports that claim a rival copied a core loop or UI layout, sold per accusation, when game mechanics are not protected by the notice routes the stores accept"
  level: L3
  cell: {buyer-role: competitive-intel, video-source: competitor-store-and-ad-video, signal-extracted: ui-state-and-screen-flow, analysis-type: benchmark-vs-competitor, delivery-form: enforcement-or-cert-evidence-pack, pricing-model: outcome-based-per-bug-or-uplift}
  object: "competitor-and-ua.md section 1: GameRefinery tracks about 260 features per game by hand, with a taxonomy of '4 categories, 12 genres and 52 subgenres' (market.md section 6)"
  situation: "a vendor offers a 'clone score' for any rival whose loop matches 8 of the studio's 12 tracked features and sells it per accusation"
  consequence: "legal knows feature similarity within a genre is common (12 genres, 52 subgenres) and stores will not remove a game for sharing a mechanic; the score creates noise and false claims"
  p_typical: 0.05
  grounded: inferred
  evidence: "market.md section 6: GameRefinery taxonomy of 12 genres and 52 subgenres means many titles share features by design; competitor-and-ua.md section 1: feature coverage is analyst-built"
  proposed: "restrict the product to expression-level evidence (footage, art, UI assets, audio); show mechanic similarity only as an internal benchmark, never as a complaint"
  shallow: false
  mechanism: "the refused product would rank rivals by feature overlap with the studio's game and propose notices on that basis"
  example: "Counsel at a publisher rejects a vendor's 'clone score' pitch: 8 of 12 features shared is normal within match-3."
  cost: M
  depends_on: "feature-tag data (GameRefinery-style)"
  buyer: "competitive-intel lead (would like it) and legal (refuses)"
  input: "competitor-store-and-ad-video + feature tags"
  why_existing_tools_cannot: "this is a refusal item"
  willingness_to_pay: "1 - refused by legal; competitive-intel may buy the benchmark view alone, at the GameRefinery $45k-$51k per year band (competitor-and-ua.md section 1)"

- id: takedown-19
  title: "REFUSAL: outcome-based pricing where the vendor earns a fee per ad or listing removed, because the vendor then has a reason to file borderline claims"
  level: L3
  cell: {buyer-role: finance-exec, video-source: public-streams-and-ugc, analysis-type: evidence-pack-for-enforcement, delivery-form: managed-service-with-analyst, pricing-model: outcome-based-per-bug-or-uplift}
  object: "competitor-and-ua.md section 5: Jestr pays per 1,000 views and Lurkit takes a 15-20% commission on paid quests; commission-for-outcome models exist in creator marketing"
  situation: "a vendor proposes USD 40 per removed ad; at 100 ads a month that is USD 4,000 a month and the vendor controls which ads are reported"
  consequence: "a fee on removal invites borderline claims against fan videos; the studio's general counsel refuses any structure where the filer is paid by volume"
  p_typical: 0.04
  grounded: inferred
  evidence: "competitor-and-ua.md section 5: commission models in creator marketing (Lurkit 15-20% on paid quests) show the pricing pattern a vendor would copy"
  proposed: "price per seat or per audit file, never per removal"
  shallow: false
  mechanism: "the refused model charges per successful removal"
  example: "A counsel at a mid-size studio crosses out the per-removal clause in a vendor's order form."
  cost: S
  depends_on: "none"
  buyer: "general counsel at a publisher (refuses)"
  input: "n/a"
  why_existing_tools_cannot: "this is a refusal item"
  willingness_to_pay: "1 - refused"

- id: takedown-20
  title: "Prior-art dating file: dated archive of the studio's own store previews, trailers and 20 stable UI screens, so a counter-notice from a clone developer claiming first publication can be answered with a dated record"
  level: L4
  cell: {buyer-role: finance-exec, video-source: competitor-store-and-ad-video, signal-extracted: ui-state-and-screen-flow, analysis-type: evidence-pack-for-enforcement, delivery-form: enforcement-or-cert-evidence-pack, lifecycle-moment: prototype-and-greenlight}
  object: "competitor-and-ua.md section 2: 'Apple allows app preview videos up to 30 seconds, up to three per product page'; store previews change with each page experiment"
  situation: "a clone developer files a counter-notice saying its game was published first; the studio's soft-launch build was visible in 4 test markets 5 months before the clone's listing, but nobody kept dated copies of the page"
  consequence: "the studio cannot prove priority; the platform restores the clone after 10-14 days under the counter-notice process"
  p_typical: 0.04
  grounded: speculative
  evidence: "competitor-and-ua.md section 6: store listing experiments change previews and screenshots, which means the live page is not a dated record"
  proposed: "weekly snapshot of the studio's own listings in every market, with hash and timestamp, kept for 7 years, plus an auto-built first-seen table"
  shallow: false
  mechanism: "a weekly crawl of the studio's own pages stores media with hashes and timestamps; a table of first appearance per asset is generated on demand"
  example: "Counsel answers a counter-notice with a table: 'hero portrait H12 first seen 14 March, 5 months before the clone's listing'."
  cost: S
  depends_on: "nothing beyond a crawler and storage"
  buyer: "IP counsel at a publisher"
  input: "competitor-store-and-ad-video methods applied to the studio's own listings"
  why_existing_tools_cannot: "competitor-and-ua.md section 6: store tools run experiments on the page but do not keep an evidential record of what was live and when"
  willingness_to_pay: "2 - a cheap add-on to takedown-4; cloud storage is about USD 0.04 per player-hour-month equivalent (methods-churn-funnel.md section 7), so the cost is trivial"
