  level: L4
  cell: {buyer-role: ua-marketing, video-source: competitor-store-and-ad-video, signal-extracted: brand-logo-exposure, analysis-type: compliance-audit, delivery-form: alert-or-slack, pricing-model: per-month-seat, buyer-org-type: agency}
  object: "competitor-and-ua.md section 3: agencies are paid per creative, 'EUR 363-500 per AI video (Admiral), $3,000-$5,000 per playable (AppAgent)'"
  situation: "a UA agency was given 12 gameplay clips for a 90-day campaign; on day 104 the same clips appear in a different client's Meta ad"
  consequence: "the studio's footage appears in ads for a rival title; the studio has the agency contract but no dated proof of reuse, so the claim rests on a screenshot"
  p_typical: 0.05
  grounded: speculative
  evidence: "competitor-and-ua.md section 3: studios buy creatives from agencies at EUR 363-500 each; section 2: ad libraries show active ads, so reuse can be matched and dated"
  proposed: "each licensed clip gets an ID and an expiry date; the scan matches new ads against the licensed clip set and raises an alert when a match appears after expiry or on an advertiser page that is not the licensee's"
  shallow: false
  mechanism: "the studio registers licensed clips with licensee, start, end and territories; matches from takedown-1 are checked against the registry; a match after expiry or on another advertiser creates a Slack alert with the clause reference"
  example: "UA director gets an alert on day 104: 4 of the 12 licensed clips are running in an ad from a page owned by the agency's other client."
  cost: S
  depends_on: "takedown-1; a licence registry the studio keeps already in contract tooling"
  buyer: "UA director and legal at a publisher that uses 2-5 external agencies"
  input: "competitor-store-and-ad-video + the studio's licence registry"
  why_existing_tools_cannot: "competitor-and-ua.md section 3: creative tools tag and score ads, but none tracks licence terms on source footage"
  willingness_to_pay: "2 - small per-seat price; $10-$25 per user per month (Alison.ai) to $499/month (Segwise) as the nearest UA-tool budget"

- id: takedown-13
