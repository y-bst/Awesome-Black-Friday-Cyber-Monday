  level: L4
  cell: {buyer-role: finance-exec, video-source: public-streams-and-ugc, signal-extracted: text-overflow-and-untranslated, analysis-type: evidence-pack-for-enforcement, lifecycle-moment: new-market-or-language-launch, delivery-form: enforcement-or-cert-evidence-pack}
  object: "adjacent-usecases.md section 5 (localisation QA from video and screenshots): OCR of on-screen text in many languages is the basis of localisation review"
  situation: "two weeks after the studio opens Vietnam and Turkey, ads in those markets show the studio's gameplay with Vietnamese and Turkish captions that promote a different app; the studio's legal team reads neither language"
  consequence: "queries on English keywords find nothing in those two markets; the infringement runs for the first 6 weeks of the launch unseen"
  p_typical: 0.04
  grounded: inferred
  evidence: "adjacent-usecases.md section 5: localisation QA uses OCR over video and screenshots; competitor-and-ua.md section 2: Meta Ads Library and TikTok Creative Center are filterable by country"
  proposed: "country-by-country sweep in the 8 launch markets, OCR plus machine translation of captions, and an evidence row that carries both the original and the English caption"
