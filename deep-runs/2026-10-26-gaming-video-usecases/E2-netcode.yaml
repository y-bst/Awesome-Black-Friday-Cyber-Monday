  cost: S
  depends_on: "netcode-5 snap detector running on-device; ASN lookup in matchmaking; a relay or route-override control"
  buyer: "Live-ops manager or live-service network ops at a competitive multiplayer publisher"
  input: "On-device snap counts and 3 trigger clips; matchmaking log with ASN, region, server instance"
  why_existing_tools_cannot: "adjacent-usecases.md section 9: Helpshift captures device, version and session state but no video; support-16 and oem-15 diagnose local fps and thermal lag, not route-level network lag"
  willingness_to_pay: "3 - live-ops buys incident speed; ticket deflection is priced per issue in Helpshift (adjacent-usecases.md section 9: monthly fee plus per-issue rate)"

- id: netcode-7
  title: "Lag-switch vs genuine-lag ruling for a T&S report: accused's server-side packet gaps (inputs silent 400-1,500 ms then burst-delivered) matched to the reporter's clip showing the accused teleporting into a kill; clean jitter elsewhere in the match"
  level: L4
  cell: {buyer-role: trust-safety, video-source: own-players-consented-sdk, signal-extracted: bot-or-fraud-behaviour, analysis-type: evidence-pack-for-enforcement, delivery-form: enforcement-or-cert-evidence-pack, game-platform-and-genre: competitive-multiplayer, capture-trigger-and-sampling: on-player-report, constraint-to-overcome: accuracy-and-trust, companion-data: touch-and-controller-input, companion-data-off-axis: server-tick-ping-and-region-logs}
  object: "Server input-receipt log per player (gap length, burst size, timestamps of buffered inputs) and the reporter's clip around the reported kill"
  situation: "'He's lag switching' reports on console ranked: some are real (deliberate packet holding), most are players on bad Wi-Fi; banning the second group is a false accusation"
  consequence: "Pack shows pattern 'gap only when in combat, 9 of 9 kills preceded by a 600-900 ms gap, burst of 40+ inputs' vs 'random gaps across the match'; the moderator rules with evidence instead of guessing"
  p_typical: 0.09
  grounded: inferred
  evidence: "adjacent-usecases.md section 2: server-side LSTM at 88.6% accuracy, 'authors stress false accusations as the key risk'; FACEIT says 'no ban is triggered solely by its flag'"
  proposed: "Correlate gap timing with combat state (from the clip: enemy on screen, damage taken) over the whole match; output a 1-page pack with the 3 clearest gap-kill clips and the gap histogram"
  shallow: false
  mechanism: "Server log flags input gaps; reporter and other consented players' clips show what the gap looked like (accused frozen then teleported); a combat-conditioned gap ratio above 5x the non-combat ratio marks deliberate lag switching"
  example: "Ranked report on a PS5 player: combat gap ratio 11x, kills during gap-burst 9 of 9; 30-day ban upheld on appeal using the pack; a second accused with ratio 1.1x is cleared and the reporter gets a 'network issue, not cheating' reply"
  cost: M
  depends_on: "netcode-1; server input-receipt log retained 7 days; tns-16 tamper-evident pack format"
  buyer: "Trust and safety lead or anti-cheat ops lead at a console or PC competitive publisher"
  input: "Reporter's ring-buffer clip, accused's server input-receipt log, match combat events"
  why_existing_tools_cannot: "adjacent-usecases.md section 2: Anybrain and FACEIT Human Input Detection judge inputs, not network timing seen on screen; tns-2 second-looks cheat flags but has no packet-gap evidence"
  willingness_to_pay: "4 - T&S teams pay at scale (Modulate up to USD 20,000/month, adjacent-usecases.md section 3); 77% of reports lack actionable evidence (same section)"

- id: netcode-8
  title: "'Died behind the wall' report filter: cheat reports whose clip shows the reporter killed after reaching cover are matched to the server's rewound position and auto-answered as lag compensation, not wallhack, and counted per region for the netcode team"
  level: L4
  cell: {buyer-role: trust-safety, video-source: own-players-consented-sdk, signal-extracted: structured-game-state-reconstruction, analysis-type: root-cause-of-a-metric-change, delivery-form: issue-tracker-ticket, game-platform-and-genre: competitive-multiplayer, capture-trigger-and-sampling: on-player-report, automation-level: recommendation, value-lever-b2b: reduce-cost-per-incident, companion-data: support-ticket-text, companion-data-off-axis: server-tick-ping-and-region-logs}
  object: "Moderation queue category 'wallhack/aimbot'; the server's rewound hitbox position of the victim at the shooter's fire tick vs the victim's own POV at death"
  situation: "A third of 'wallhack' reports in a 5v5 shooter are victims killed 100-180 ms after they reached cover on their own screen; moderators spend 4 minutes each before closing them"
  consequence: "Those reports leave the cheat queue with an explanation card to the reporter; the per-region count ('behind-cover deaths per 100 deaths: 7.2 in OCE vs 2.1 in EU') goes to the netcode team as a KPI ticket"
  p_typical: 0.06
  grounded: inferred
  evidence: "adjacent-usecases.md section 3: 'only about 23% of player reports contained actionable evidence'; adjacent-usecases.md section 2: players submit clips of suspected cheaters by hand"
  proposed: "Classifier: victim on-screen position at death inside cover polygon AND server rewind shows victim exposed at (fire tick - shooter RTT) AND shooter RTT under cap -> 'lag compensation' class"
  shallow: false
  mechanism: "Victim POV frame at death plus map cover geometry gives 'in cover on own screen'; server rewind gives 'exposed on shooter's timeline'; if both, the report is reclassified and a weekly aggregate ticket is filed for netcode by region and ping gap"
  example: "Week 12: 3,900 wallhack reports, 1,310 reclassified as lag comp (most from players with 140+ ms vs shooters at 20 ms); moderators save about 87 hours; netcode ticket proposes lowering the rewind cap from 200 to 140 ms"
  cost: M
  depends_on: "netcode-1; map cover geometry per map; tns-1 report-button clip attach"
  buyer: "Trust and safety lead (queue cost) with netcode lead as second consumer"
  input: "Victim's report clip, reporter's free-text reason, server rewind log, shooter RTT"
  why_existing_tools_cannot: "adjacent-usecases.md section 3: GGWP and Modulate classify voice and text, not gameplay frames; tns-11 summarises report clips but does not test them against server rewind"
  willingness_to_pay: "4 - moderator hours are a direct cost and the queue is mostly unactionable (77% per adjacent-usecases.md section 3)"

