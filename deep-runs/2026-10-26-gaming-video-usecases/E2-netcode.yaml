# Stage E2 targeted fill, audit 1 empty cell 1 (netcode as the player saw it). Persona: cto-or-engine-lead-veto re-walked as the
# online-services / netcode lead; positive options. label_neighbour not repeated: support-16, oem-15, cto-18 (fps, thermal, hitches);
# also kept clear of tns-1, tns-2, tns-11, tns-16 (generic report clips and cheat second-look), esports-4 (reaction latency), cto-6 and
# data-14 (replay re-render). Off-axis companion data is named in `companion-data-off-axis`, since C-axes has no server-log value.
- id: netcode-1
  title: "Tick-stamped ring buffer: each captured frame carries a 16-byte sidecar (client frame no., last server snapshot tick, RTT estimate, interp delay ms, prediction-error mm) so any clip can be laid against the server log tick by tick"
  level: L4
  cell: {buyer-role: engineering-performance, video-source: own-players-consented-sdk, signal-extracted: structured-game-state-reconstruction, analysis-type: root-cause-of-a-metric-change, delivery-form: api-or-sdk, game-platform-and-genre: competitive-multiplayer, capture-trigger-and-sampling: always-on-ring-buffer, constraint-to-overcome: joining-video-to-events, processing-location: on-device, effort: M-one-quarter, companion-data: telemetry-events, companion-data-off-axis: server-tick-ping-and-region-logs}
  object: "The netcode layer's own per-frame state (last acked snapshot tick, smoothed RTT, interpolation delay) that the engine already holds in memory; the 30-120 s on-device ring buffer pattern in methods-churn-funnel.md section 7 (b)"
  situation: "A PC and console 5v5 shooter at 64 Hz server tick: the netcode lead cannot use any player clip as evidence because the video has a wall-clock timestamp and the server log has a tick number, and client clocks drift 20-80 ms"
  consequence: "Without the sidecar every netcode option below is guesswork on alignment; with it, frame N of a clip maps to server tick T and RTT R to within one frame (16.6 ms at 60 fps)"
  p_typical: 0.05
  grounded: inferred
  evidence: "methods-churn-funnel.md section 7 INFERRED (b): 'a 30-120 s on-device ring buffer uploaded only on trigger ... as Sentry does for errors'; methods-churn-funnel.md section 6: Sentry onErrorSampleRate keeps 'about the last minute before the error'"
  proposed: "Engine plugin (Unreal NetDriver hook, Unity Netcode for GameObjects / Photon Fusion callback) that writes 16 bytes per frame into the encoder's SEI/user-data channel; server log keyed by match ID and tick"
  shallow: false
  mechanism: "The capture SDK embeds the netcode state in the video stream itself, so the clip and the server's per-tick log join on (match_id, tick) with no clock sync step; all analysis runs in the vendor cloud on trigger uploads only"
  example: "A clip uploaded after a 'that's not fair' report: frame 3,412 = server tick 118,902, RTT 74 ms, interp 31 ms; the server's lag-compensated hitbox history for that tick is pulled and overlaid automatically"
  cost: M
  depends_on: "A low-cost capture path (cto-5 hardware encoder) and the cto-2 self-cost limiter; one integration per netcode stack (Unreal, NGO, Photon, custom)"
  buyer: "Lead network or online-services programmer at a PC/console competitive multiplayer studio; CTO signs the allow-list"
  input: "Consented ring-buffer video plus the engine's per-frame netcode state; server per-tick logs (hit validation, snapshot send, region, server instance ID)"
  why_existing_tools_cannot: "adjacent-usecases.md section 9: no vendor ships a rolling game-client buffer at all; market.md section 2: IV Metrics, PostHog and UXCam record screens with no engine or server tick join; adjacent-usecases.md section 2: anti-cheat work is server-side ML on input and timing with no video"
  willingness_to_pay: "3 - enabler, not bought alone; the paying use is the options below; Sentry-style on-error buffering is a pattern studios already accept (methods-churn-funnel.md section 6)"

- id: netcode-2
  title: "'I shot first' hit-registration adjudicator: victim and shooter clips at the same tick, server's rewound hitbox overlaid, each disputed death classed as lag-comp cap exceeded, favour-the-shooter window, hitbox/animation desync bug, or clean miss"
  level: L4
  cell: {buyer-role: engineering-performance, video-source: own-players-consented-sdk, signal-extracted: player-skill-and-mechanics, analysis-type: root-cause-of-a-metric-change, delivery-form: issue-tracker-ticket, game-platform-and-genre: competitive-multiplayer, capture-trigger-and-sampling: on-player-report, automation-level: auto-created-ticket-or-asset, companion-data: touch-and-controller-input, companion-data-off-axis: server-tick-ping-and-region-logs}
  object: "The server's lag-compensation rewind (hitbox positions stored per tick, rewind cap e.g. 200 ms) and the player's crosshair over the enemy model in the shooter's frame at fire time"
  situation: "After patch 7.2, 'my shots don't register' posts triple on Reddit; telemetry shows hit rate flat, so the netcode team cannot tell a perception problem from a hitbox bug"
  consequence: "Only the 'hitbox/animation desync' class becomes a Jira ticket (with the frame pair and tick); the others become counts by region and ping bucket, so the team stops chasing 1,000 anecdotes"
  p_typical: 0.12
  grounded: inferred
  evidence: "adjacent-usecases.md section 2 'What is manual today': players submit video clips and forum posts by hand; adjacent-usecases.md section 3: 'only about 23% of player reports contained actionable evidence'"
  proposed: "On a 'shot did not register' report button or on a server-side 'fire with crosshair-on-model but no hit' event, upload 3 s around the shot; classifier outputs one of 4 classes with the frame pair and the rewound hitbox render"
  shallow: false
  mechanism: "Vision locates crosshair and enemy silhouette in the shooter's frame at the fire tick; server log gives the rewound hitbox at (fire tick - RTT - interp); if the silhouette and the rewound hitbox diverge by more than 5 cm with RTT under the cap, it is an animation-replication bug and a ticket is filed"
  example: "1,240 disputed shots in 48 h: 61% clean misses, 22% RTT over the 200 ms cap (mostly Sao Paulo players on the Virginia server), 14% favour-the-shooter, 3% hitbox lag on the new crouch-slide animation; one ticket, fixed in 7.2.1"
  cost: M
  depends_on: "netcode-1 tick sidecar; server hit-validation log retained 72 h"
  buyer: "Netcode lead at a PC/console shooter studio (5v5 tactical, battle royale)"
  input: "Shooter and victim ring-buffer clips, controller or mouse input, server hit-validation and rewind log"
  why_existing_tools_cannot: "adjacent-usecases.md section 2: Vanguard and Ricochet publish server-side ML on input/timing/recoil, not video; no vendor in market.md section 9 joins player footage to server state"
  willingness_to_pay: "4 - hit-reg complaints are a top live-service grievance and the studio already staffs this by hand; no published price, enterprise quote like anti-cheat (adjacent-usecases.md section 2 'Price signals: None published. INFERRED: enterprise quote only')"

- id: netcode-3
  title: "Cross-POV desync detector: two consented players in the same match, frames at the same server tick compared on shared world state (door open vs closed, enemy alive vs ragdoll, objective owner), mismatches lasting 300+ ms filed per build"
  level: L4
  cell: {buyer-role: engineering-performance, video-source: own-players-consented-sdk, signal-extracted: structured-game-state-reconstruction, analysis-type: build-to-build-regression-diff, lifecycle-moment: new-version-release, delivery-form: issue-tracker-ticket, game-platform-and-genre: competitive-multiplayer, capture-trigger-and-sampling: random-sample, companion-data: build-and-config-metadata, companion-data-off-axis: server-tick-ping-and-region-logs}
  object: "Replicated actors whose state the server owns (doors, destructibles, capture points, death state); two clients' frames tagged with the same tick via netcode-1"
  situation: "A new build changes replication priority to save bandwidth; on 1-2% of matches one teammate sees a door open and walks into it while another sees it closed, and no counter flags this because each client is self-consistent"
  consequence: "Desync that is invisible to single-client telemetry becomes a per-build rate ('door-state mismatches per 1,000 match-minutes: 0.4 on 7.1, 6.8 on 7.2') with two side-by-side clips per ticket"
  p_typical: 0.04
  grounded: inferred
  evidence: "methods-churn-funnel.md section 4: computer vision on game UI reads HUD and state from frames; market.md section 9: 'Session-replay SDKs record or screenshot but do not interpret game state'"
  proposed: "Sample 2% of matches where 2+ players are consented; for each tick bucket, run a per-game state reader on both POVs and diff a list of 20 replicated objects"
  shallow: false
  mechanism: "Per-title object detector (door, capture-point flag colour, enemy health bar) reads state from both POVs; server log is the referee; a disagreement with the server on one client for more than 300 ms is a desync event keyed by object class, build and region"
  example: "Build 7.2: destructible-wall state disagrees between squadmates in 3.1% of Frankfurt matches vs 0.2% on 7.1; root cause a relevancy-distance change; ticket includes two clips and the actor ID"
  cost: L
  depends_on: "netcode-1; per-title state reader (structured-game-state-reconstruction) for 20 object classes; matches with 2+ consented players"
  buyer: "Netcode or online-services lead; QA director reads the per-build rate at release gate"
  input: "Two or more players' consented clips from the same match plus build metadata and server state log"
  why_existing_tools_cannot: "market.md section 3: AI QA agents (modl.ai, nunu.ai, Razer) test builds with bots in isolation, not live multi-client matches; adjacent-usecases.md section 1: video bug detection is per-stream"
  willingness_to_pay: "3 - QA spend is proven (outsourced QA USD 15-50/hour, adjacent-usecases.md 'Signals of willingness to pay') but multi-client desync is a narrow bug class"

- id: netcode-4
  title: "Peeker's-advantage meter from esports VOD: for each first-contact duel, frames between attacker first seeing the defender and defender first seeing the attacker, read from both player POVs, per server region and tick rate (64 vs 128 Hz)"
  level: L4
  cell: {buyer-role: engineering-performance, video-source: esports-vod, signal-extracted: player-skill-and-mechanics, analysis-type: cohort-comparison, delivery-form: per-cohort-report, game-platform-and-genre: competitive-multiplayer, value-lever-b2b: create-data-that-did-not-exist, companion-data: telemetry-events, companion-data-off-axis: server-tick-ping-and-region-logs}
  object: "Pro league POV VODs (all 10 player cams recorded per match) and the match's server tick rate and per-player ping"
  situation: "Pros claim peeker's advantage is worse on the new Seoul servers; the studio's server log shows ping but not the asymmetric visibility delay players actually experience on screen"
  consequence: "A measured 'peeker's window' (e.g. 71 ms Seoul vs 48 ms Frankfurt at 128 Hz) decides whether to raise tick rate or move the league's server, instead of arguing from anecdotes"
  p_typical: 0.06
  grounded: inferred
  evidence: "adjacent-usecases.md section 8: ClutchLabs derives VOD metrics 'without data feeds'; esports VOD is already recorded per player; market.md section 9: 'Relo-style CV exists in sports but was not found for in-game moments or esports'"
  proposed: "Per duel, detect first frame of enemy silhouette in each POV, align POVs by the broadcast round timer OCR, subtract, aggregate by region and tick rate"
  shallow: false
  mechanism: "Enemy-visible detector run on both POVs; alignment by OCR of the round clock and kill-feed; window = attacker-first-sight minus defender-first-sight; server log adds RTT per player so the residual not explained by ping is attributed to tick and interpolation"
  example: "Champions qualifier, 2,400 duels: median window 64 ms at 64 Hz and 41 ms at 128 Hz; the league moves playoff servers to 128 Hz and the studio budgets the extra server cost"
  cost: M
  depends_on: "League VOD rights for per-player POV; per-title enemy-visible detector"
  buyer: "Netcode lead at the publisher of an esports title; league operations co-funds"
  input: "Esports POV VODs plus server tick rate, region and per-player ping from the match log"
  why_existing_tools_cannot: "adjacent-usecases.md section 8: Mobalytics, StatStack, ClutchLabs and Omnic sell player-skill metrics to players and teams, none measures network fairness; esports-4 measures reaction latency, not the network-induced window"
  willingness_to_pay: "3 - publisher engineering budget, no price signal in the notes; nearest is Hudl at USD 1,500 per programme per year (adjacent-usecases.md section 8)"

- id: netcode-5
  title: "Tick-rate A/B explainer: 30 Hz vs 60 Hz servers in two regions, visible rubber-band snaps per match-minute and fire-to-hit-marker frames per arm, next to server cost per CCU, so the tick decision has a player-facing number"
  level: L4
  cell: {buyer-role: engineering-performance, video-source: own-players-consented-sdk, signal-extracted: visual-errors-and-glitches, analysis-type: ab-test-variant-explanation, lifecycle-moment: ab-test-running, delivery-form: per-cohort-report, game-platform-and-genre: competitive-multiplayer, value-lever-b2b: de-risk-a-go-kill-decision, companion-data: telemetry-events, companion-data-off-axis: server-tick-ping-and-region-logs}
  object: "Server fleet config (tick rate per region) and the cloud cost line per concurrent user; local-camera snap-back events and hit-marker frames in consented clips"
  situation: "Doubling tick rate on a 60-player battle royale roughly doubles server CPU; finance asks whether players will notice, and retention A/B tests take 4 weeks to read"
  consequence: "Within 5 days the test reads 'rubber-band snaps over 30 cm: 2.1 vs 0.6 per match-minute; fire-to-marker 5.2 vs 3.4 frames' with 10 example clips per arm, beside D7 and cost per CCU"
  p_typical: 0.07
  grounded: inferred
  evidence: "methods-churn-funnel.md section 1: event analytics judges funnels by counts and cannot see what the player saw (section 2); adjacent-usecases.md section 6: 'reliable fps/load measurement uses in-game profiling' (so video's edge is perception, not counters)"
  proposed: "Random 1% sample of matches per arm, 60 s ring-buffer uploads every 10 minutes of play; snap detector on camera optical flow; arm label from server config"
  shallow: false
  mechanism: "Optical-flow discontinuity on the local camera (backwards jump over 30 cm with no player input reversal) counts as a visible correction; hit-marker detector times frames from muzzle flash to marker; results split by arm, ping bucket and device"
  example: "EU-West at 60 Hz: visible snaps fall 71%, D7 flat; NA-East at 60 Hz: snaps fall 18% because NA players are ping-bound; the studio ships 60 Hz in EU only and saves the NA spend"
  cost: M
  depends_on: "netcode-1; an A/B framework at server-fleet level"
  buyer: "Head of online services or CTO at a battle royale or extraction shooter studio; CFO is the second reader"
  input: "Consented ring-buffer samples, controller input, server tick config per match, cloud cost per region"
  why_existing_tools_cannot: "market.md section 2 and 6: GameAnalytics, IV Metrics and UXCam report events and screens, none counts visible corrections; methods-churn-funnel.md section 2: event analytics 'cannot see' what was on screen"
  willingness_to_pay: "4 - the decision is a server bill in the millions per year; the closest priced analogue is UXCam's median USD 21k/year for replay (market.md 'Signals of willingness to pay')"

- id: netcode-6
  title: "ISP-route incident alert during a live event: visible rubber-band rate in sampled clips spikes 4x for one ASN (e.g. one Brazilian ISP) while other ISPs in the region are flat; Slack alert to live-ops with 3 clips, the ASN, and the relay to reroute through"
  level: L4
  cell: {buyer-role: live-ops, video-source: own-players-consented-sdk, signal-extracted: visual-errors-and-glitches, analysis-type: anomaly-alert, lifecycle-moment: live-event-or-update, delivery-form: alert-or-slack, game-platform-and-genre: competitive-multiplayer, capture-trigger-and-sampling: on-crash-or-anomaly, companion-data: telemetry-events, companion-data-off-axis: server-tick-ping-and-region-logs}
  object: "Client IP's ASN and region from the matchmaking log; per-ASN rate of visible snaps from netcode-5's detector"
  situation: "Saturday of a season-launch event: 18,000 players in Sao Paulo are rubber-banding; ping graphs look normal because packet loss and jitter on one ISP's peering path are not in the ping average"
  consequence: "Live-ops posts a known-issue message in 20 minutes instead of after 600 support tickets, and the network team turns on the alternate relay for that ASN"
  p_typical: 0.11
  grounded: inferred
  evidence: "adjacent-usecases.md section 7: live-ops monitoring of events is staffed by hand; methods-churn-funnel.md section 7 (b): trigger-based ring-buffer uploads"
  proposed: "Detector runs on-device on the ring buffer; only counts are sent each minute, with clip upload when the session's snap count passes 5 per minute"
  shallow: false
  mechanism: "On-device snap counter emits a 4-byte metric per minute; the backend computes per-ASN baselines over 7 days and alerts at 4x; three representative clips are uploaded for the alert so a human sees the problem, not a chart"
