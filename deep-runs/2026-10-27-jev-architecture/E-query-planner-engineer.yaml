- id: planner-17
  title: "Automatic contrast for 'why': the planner runs a churner-vs-retainer lift scan over all closed fields and returns the 5 fields with the largest lift as hypotheses, each with counts"
  level: L3
  cell: {part: query-path, query-path: automatic-contrast-cohort-diff, question-type: why, mechanism-type: auto-discover-without-question, evidence-form: contrast-vs-baseline, question-origin: discriminative-contrast-churn-vs-retain, scope: all-players}
  object: "memo item 2 planner has three routes; B-perspectives observability builder: 'BubbleUp: what attribute values differ between the churned group and the baseline'"
  situation: "Studio asks 'why do players quit?' with no step named; the funnel template (planner-9) needs a step, and retrieval needs a term"
