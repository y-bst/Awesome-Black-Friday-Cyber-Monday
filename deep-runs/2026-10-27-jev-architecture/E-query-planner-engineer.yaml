  example: "'Did players notice the stamina bar?' -> 'Tier: backfill, 512 sessions, ETA 6 min' -> Slack post 6 min later: '201 of 512 noticed (39.3%), clips attached'"
  cost: S
  depends_on: "backfill queue and a Slack integration"
  part: query
  ingest_cost: S
  query_cost: S
  better_than_fixed_table: "The fixed table is uniformly fast and uniformly limited; tiers let slow questions exist without breaking the fast-answer expectation"

- id: planner-27
  title: "Confidence-aware counting: observation rows carry confidence 0-1, SQL counts exclude rows below 0.6 by default, and the answer reports the excluded count and the number at threshold 0.4"
  level: L4
  cell: {part: query-path, evidence-form: confidence-score, uncertainty-policy: answer-with-ci-and-n, query-path: sql-over-closed-fields, extraction-trigger: on-low-confidence-or-disagreement, representation: timestamped-observation-log}
  object: "memo item 1 observation log; memo item 3 'accuracy against hand-labelled sessions'"
