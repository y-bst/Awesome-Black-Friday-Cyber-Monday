  shallow: false
  mechanism: "Query path plus extraction trigger. Per-field precision-by-confidence curve from the golden set is stored so the planner can print the expected precision next to the threshold"
  example: "'How many players rage-quit?' -> '38 of 512 at confidence >= 0.6 (expected precision 0.91); 53 at >= 0.4 (precision 0.74)'"
  cost: S
  depends_on: "confidence on every observation row and a golden set per field"
  part: query
  ingest_cost: S
  query_cost: S
  better_than_fixed_table: "The fixed table has one answer per question with no confidence; this makes every count adjustable for precision and tells the studio what it costs"

- id: planner-28
  title: "Plan explanation line: every answer ends with 'computed by <route> over <field@version> for <n> sessions, <k> excluded because <reason>' generated from the plan object, not by the LLM"
  level: L4
  cell: {part: chatbot-ui, evidence-form: extraction-provenance-model-and-schema-version, delivery-surface: chatbot, query-path: retrieval-then-llm, user-segment: ux-researcher, uncertainty-policy: always-answer}
