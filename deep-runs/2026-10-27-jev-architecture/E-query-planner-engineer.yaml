  p_typical: 0.09
  grounded: quote
  evidence: "memo: 'the question set grows from real use'"
  proposed: "query_log(plan_id, route, field_spec_hash, asker, outcome); weekly job clusters field specs by enum overlap >= 0.7 and entity match; cluster size >= 3 -> merge to one field, mark as ingestion-time, backfill history once"
  shallow: false
  mechanism: "Feedback loop from query log into question generation. Promotion changes extraction-trigger for that field from on-first-question to at-ingestion; dedup collapses versions"
  example: "stamina_bar_noticed@v1..v4 (4 specs, 3 askers) -> merged stamina_bar_noticed@v5 {noticed_unprompted, noticed_after_tip, never_mentioned}; computed at ingestion from Monday; weekly report lists 6 promoted fields"
  cost: S
  depends_on: "field registry with specs and the backfill log"
  part: question-generation
  ingest_cost: M
  query_cost: S
  better_than_fixed_table: "The fixed table's question list never changes after launch; this adds a measured number of questions per week from what studios actually asked"

- id: planner-20
  title: "Refused: cross-studio semantic cache and shared plan library; cache keys, cohort ids and synthesised field specs are namespaced by studio_id, and only the anonymised plan shape (no values, no entity names) may be shared"
  level: L4
  cell: {part: tenancy-access-control, tenancy-and-deployment: logically-isolated-per-studio, query-path: semantic-cache-similar-question, mechanism-type: transfer-across-games, reuse-scope-of-extraction: genre-shared, user-segment: jev-internal-ops}
