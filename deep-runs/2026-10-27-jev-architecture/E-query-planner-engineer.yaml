- id: planner-25
  title: "Clarify only on denominator ambiguity: if the question parses to 2 or more plans with different denominators the chatbot asks one two-option question; otherwise it never asks and states its chosen scope in the header"
  level: L4
  cell: {part: chatbot-ui, uncertainty-policy: ask-clarifying-question, mechanism-type: narrow-or-clarify-the-question, question-type: how-many, latency-tier: under-2s, user-segment: producer-exec}
  object: "B-perspectives query-planner-engineer notices: 'classify question -> SQL vs retrieval vs backfill'"
  situation: "'What share of players quit at step 4?' can mean 'of all 512' or 'of the 463 who reached step 4'; the numbers are 24.2% vs 26.8%"
  consequence: "Always asking makes the chatbot slow and annoying (a producer gives up after 2 clarifications); never asking silently picks one and the deck gets the wrong one"
  p_typical: 0.08
