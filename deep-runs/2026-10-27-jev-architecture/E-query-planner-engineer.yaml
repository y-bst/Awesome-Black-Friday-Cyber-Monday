  proposed: "Planner emits up to 2 candidate plans; if denominators differ -> 'Of all 512 players, or of the 463 who reached step 4?' with both numbers precomputed so the click is instant; if plans differ only in grouping, answer the first and offer the second as a one-line follow-up"
  shallow: false
  mechanism: "Query path plus UI. Both candidate plans execute in parallel (both under 2 s) so the clarification response costs 0 extra latency"
  example: "'share quitting at step 4' -> two buttons: 'of all players: 124 of 512 (24.2%)' and 'of those reaching step 4: 124 of 463 (26.8%)'"
  cost: XS
  depends_on: "denominator rule (planner-8)"
  part: ui
  ingest_cost: S
  query_cost: S
  better_than_fixed_table: "The fixed-table chatbot has no notion of two denominators; this exposes the one ambiguity that changes a published number"

- id: planner-26
  title: "Three latency tiers with a visible promise: sql and clip under 2 s, retrieval under 30 s, backfill in minutes with a Slack post on completion, and the chatbot states the tier before executing"
  level: L4
  cell: {part: query-path, latency-tier: under-30s, delivery-surface: slack-jira-integration, query-path: lazy-backfill-extraction, mechanism-type: push-instead-of-pull, user-segment: studio-analyst}
