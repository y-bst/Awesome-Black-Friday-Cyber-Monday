  example: "Sentiment question over step 2 retrieves 40 rows including the planted one; SQL count: 12 positive, 21 negative, 7 neutral; the summary cites rows; the planted utterance appears as a quoted row flagged 'off-topic'"
  cost: S
  depends_on: "retrieval executor returning structured rows"
  part: evaluation
  ingest_cost: S
  query_cost: S
  better_than_fixed_table: "The fixed table never exposed quotes to the model at query time; this keeps the new quote-bearing route at the same safety level"

- id: planner-22
