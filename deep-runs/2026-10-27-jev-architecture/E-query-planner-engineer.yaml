  example: "'How long do players take to finish the tutorial?' -> median 1,140 s across 375 completers, computed from first step_on_screen=1 to tutorial_outcome=complete across videos; 14 sessions with a gap > 60 s between videos listed separately"
  cost: S
  depends_on: "session-to-video linkage (spec unspecified: 'how videos of one session are linked')"
  part: store
  ingest_cost: S
  query_cost: S
  better_than_fixed_table: "The per-video table cannot express a session; this makes every count a per-player count"

