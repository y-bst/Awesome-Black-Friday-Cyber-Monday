- id: planner-1
  title: "Planner emits a typed plan JSON {route, fields, filters, cohort, evidence_form} and the chatbot executes the plan, not the question"
  level: L3
  cell: {part: query-path, query-path: sql-over-closed-fields, question-type: how-many, latency-tier: under-2s, mechanism-type: defer-to-query-time, representation: timestamped-observation-log, user-segment: studio-analyst}
  object: "memo item 2: 'closed-field questions become aggregate queries over all players (instant); open-field questions retrieve matching observation rows'"
  situation: "A studio analyst types 'how many players quit during the tutorial'. The planner must pick one of three routes (sql, retrieval, backfill) and the chatbot today has no intermediate object between the question and the answer"
  consequence: "Without a typed plan the route choice, the fields used and the denominator are invisible; the same question can be answered two ways on two days and the studio notices the discrepancy"
  p_typical: 0.55
  grounded: quote
  evidence: "memo: 'The chatbot runs a query planner: closed-field questions become aggregate queries over all players (instant)'"
  proposed: "One model call produces plan JSON validated against a schema with 5 required keys; execution is deterministic code; the plan is stored next to the answer"
  shallow: false
  mechanism: "Changes the query path for every asker. Plan shape: {route: sql|retrieval|backfill|clip, fields: [field_id@version], filters: [{field, op, value}], cohort: cohort_id|null, group_by: [step_id], evidence_form: count-with-denominator|quote-with-timestamp|clip}. Executor runs SQL over the observation log (session_id, t_ms, field, value, confidence, video_index) or a vector/keyword retrieval; the LLM sees only plan + results"
  example: "'How many players quit in the tutorial?' -> {route: sql, fields: [tutorial_outcome@v3], filters: [{tutorial_outcome, =, quit}], group_by: [], evidence_form: count-with-denominator} -> '137 of 512 sessions (26.8%)' in 0.4s"
  cost: M
  depends_on: "observation log with closed fields keyed by session_id (memo item 1)"
  part: query
  ingest_cost: S
  query_cost: S
  better_than_fixed_table: "The fixed table can only answer by scanning its own columns; a plan can combine fields, filters and cohorts that no fixed question anticipated, and every answer records how it was computed"

- id: planner-2
  title: "Coverage gate before SQL: if the field is non-null in fewer than 80% of eligible sessions the planner routes to backfill instead of answering from the partial column"
  level: L4
  cell: {part: query-path, query-path: lazy-backfill-extraction, uncertainty-policy: abstain-below-coverage, evidence-form: coverage-statement-n-of-m-players, schema-evolution: lazy-backfill-on-demand, latency-tier: minutes}
  object: "memo item 2: 'genuinely new questions trigger a one-time batch extraction over all sessions whose result is cached as a new field'"
  situation: "A field added last week by backfill exists for 212 of 512 sessions; a new question hits that field. Plain SQL would silently compute 'quit rate' over 212 sessions as if it were all 512"
  consequence: "The studio reads 26.8% as a population number when it is a number over a biased 41% subset (the subset is whichever sessions were ingested after the field was added)"
  p_typical: 0.15
  grounded: inferred
  evidence: "memo: 'cached as a new field, so the question set grows from real use' (no statement about sessions ingested before the field existed)"
  proposed: "Per field, maintain coverage = count(sessions with value) / count(eligible sessions); planner reads it in the same round trip; below 0.80 it queues backfill for the missing sessions and answers from the covered subset with a coverage line"
  shallow: false
  mechanism: "Store: a field_coverage view (field_id, version, n_covered, n_eligible, updated_at) refreshed on every backfill job. Query path: planner checks coverage before choosing sql; threshold 0.80 default, studio-configurable per field"
  example: "'What share of players who skipped the movement tip later quit?' uses skipped_movement_tip@v1 with coverage 212/512. Answer: 'Among 212 sessions with this field: 61 (28.8%). 300 sessions are being backfilled, ETA 6 min; the number will update.' Final answer arrives 6 minutes later over 512"
  cost: S
  depends_on: "backfill job queue (memo item 2)"
  part: query
  ingest_cost: S
  query_cost: S
  better_than_fixed_table: "The fixed table is 100% covered by construction but cannot grow; this lets the field set grow without ever reporting a partial column as a population statistic"

- id: planner-3
  title: "Named cohort objects: 'players who X' is compiled to a cohort row (predicate SQL, materialised session_id list, created_at, field versions) that follow-ups reference by id"
  level: L3
  cell: {part: query-path, scope: query-time-defined-cohort, question-type: find-players-who, query-path: sql-over-closed-fields, evidence-form: per-player-list, representation: timestamped-observation-log, user-segment: game-designer}
  object: "spec.md item 4: 'a question over, say, 500 players is fast'; B-perspectives query-planner-engineer: 'cohort vs player, follow-ups'"
  situation: "Designer asks 'which players stalled more than 3 minutes on step 4?' then 'how many of them quit?' then 'show me 5 clips of them'"
  consequence: "Without a cohort object each follow-up re-derives the cohort from the chat text and can drift (a second parse yields 2 minutes instead of 3), so the three answers do not describe the same players"
  p_typical: 0.2
  grounded: inferred
  evidence: "spec.md: 'A chatbot for the gaming studio answers the studio's questions from that table'"
  proposed: "cohorts table: (cohort_id, studio_id, predicate_sql, session_ids[], n, field_versions, created_at); the planner resolves 'them', 'those players', 'this group' to the latest cohort_id in the conversation"
  shallow: false
  mechanism: "Query path plus store. The first find-players-who question returns the per-player list and writes a cohort row; later plans carry cohort: <id> and the executor joins on the materialised session_ids instead of re-evaluating the predicate"
  example: "Q1 'players who spent over 180s on step 4' -> cohort c_8812, n=44 of 512. Q2 'how many of them quit' -> {route: sql, cohort: c_8812, fields: [tutorial_outcome@v3]} -> '19 of 44 (43.2%) vs 26.8% overall'. Q3 'show 5 clips' -> {route: clip, cohort: c_8812, limit: 5}"
  cost: S
  depends_on: "session_id as the primary key for all answers (session-stitching) and the plan object (planner-1)"
  part: query
  ingest_cost: S
  query_cost: S
  better_than_fixed_table: "The fixed table has no notion of a saved player set; every cohort question is a fresh scan and follow-ups cannot be guaranteed to use the same players"

- id: planner-4
  title: "Follow-up scope inheritance: the planner carries the previous plan's filters, cohort and build_version as defaults and shows the inherited scope in the answer header"
  level: L4
  cell: {part: chatbot-ui, query-path: sql-over-closed-fields, question-type: how-many, scope: query-time-defined-cohort, user-segment: game-designer, latency-tier: under-2s}
  object: "B-perspectives query-planner-engineer notices: 'follow-ups'; spec.md item 4 chatbot"
  situation: "After 'how many players quit in build 1.4.2?', the designer asks 'and at which step?' The second question has no build filter in its text"
  consequence: "If the filter is dropped the step breakdown is over all builds and contradicts the first number; if it is kept silently the studio cannot tell"
  p_typical: 0.3
  grounded: inferred
  evidence: "spec.md: 'A chatbot for the gaming studio answers the studio's questions from that table'"
  proposed: "Plan has inherited_from: <plan_id> and the answer header prints 'Scope: build 1.4.2, 203 sessions (inherited from your previous question; say \"all builds\" to reset)'"
  shallow: false
  mechanism: "Conversation state holds the last 3 plans; the planner prompt receives them as structured JSON, not as chat text; filters are inherited unless the new question names a conflicting value"
  example: "Q1 build 1.4.2 quit count: 58 of 203. Q2 'at which step?' -> group_by step_id, same filter -> 'step 4: 31, step 2: 14, step 6: 9, other: 4 (of 58 quits in build 1.4.2)'"
  cost: XS
  depends_on: "plan object (planner-1)"
  part: ui
  ingest_cost: S
  query_cost: S
  better_than_fixed_table: "Keeps a multi-turn analysis on one consistent population, which the single-table chatbot does not track"

- id: planner-5
  title: "Semantic cache keyed on the canonicalised plan hash, not on question text, with the cached answer stamped by data snapshot and field versions"
  level: L3
  cell: {part: query-path, query-path: semantic-cache-similar-question, latency-tier: sub-200ms-cached, mechanism-type: reuse-or-cache-prior-work, tenancy-and-deployment: logically-isolated-per-studio, moment-in-journey: steady-state-weekly}
  object: "spec.md constraint: 'Answering a studio's question must be fast'"
  situation: "Five analysts at one studio ask 'tutorial quit rate' with 11 different wordings over a week; sessions are added nightly"
  consequence: "Text-keyed caches miss on wording and serve stale numbers after new sessions land; plan-keyed caches hit on all 11 wordings and are invalidated by the snapshot id"
  p_typical: 0.12
  grounded: inferred
  evidence: "spec.md: 'Reading 500 transcripts per question was too slow and too much data'"
  proposed: "cache key = sha256(studio_id + canonical_plan_json + data_snapshot_id + field_versions); entry stores answer object; hit latency under 200 ms; miss executes and writes"
  shallow: false
  mechanism: "Query path. Canonicalisation sorts filters, lowercases values, resolves cohort ids to their predicate hash. Studio_id in the key forbids cross-tenant hits by construction"
  example: "'what % of players abandon onboarding' and 'tutorial churn rate' both canonicalise to {sql, tutorial_outcome@v3=quit, denominator: all} -> hit -> '137 of 512 (26.8%), data as of 2026-10-26 23:10' in 90 ms"
  cost: S
  depends_on: "plan object (planner-1) and a nightly data_snapshot_id"
  part: query
  ingest_cost: S
  query_cost: S
  better_than_fixed_table: "The fixed-table chatbot recomputes or re-prompts per question; this makes repeated questions sub-200 ms and never serves a number computed under an older field version"

- id: planner-6
  title: "Backfill answers progressively: first 50 sessions in 20 s with a 95% CI, then refined every 100 sessions until all 512 are extracted"
  level: L4
  cell: {part: query-path, query-path: progressive-answer-then-refine, latency-tier: progressive-streaming, uncertainty-policy: give-range-then-refine, evidence-form: count-with-denominator, mechanism-type: approximate-then-refine, extraction-trigger: on-first-question}
  object: "memo item 2: 'genuinely new questions trigger a one-time batch extraction over all sessions'"
  situation: "Analyst asks 'how many players read the crafting tooltip before quitting' and no field exists; full backfill over 512 sessions takes 7 minutes"
  consequence: "A 7-minute silent wait is abandoned; a 20-second range answer keeps the analyst in the conversation and the final number arrives in the same thread"
  p_typical: 0.08
  grounded: inferred
  evidence: "spec.md: 'Answering a studio's question must be fast'"
  proposed: "Backfill job processes sessions in random order; after 50 it posts 'between 9% and 27% (n=50, Wilson 95%)'; after each 100 more it edits the same message; final message carries n=512"
  shallow: false
  mechanism: "Query path plus UI. Job emits partial aggregates to a stream; the answer message is editable in place; random order (seeded by job id) makes the early estimate unbiased with respect to ingestion date"
  example: "t=20s: 'Early estimate: 9 of 50 (18%, CI 9-31%)'. t=2m: '41 of 250 (16.4%, CI 12-21%)'. t=7m: '82 of 512 (16.0%)'"
  cost: M
  depends_on: "backfill job queue with per-session results written incrementally"
  part: query
  ingest_cost: L
  query_cost: M
  better_than_fixed_table: "The fixed table cannot answer the question at all; this answers in 20 s with an honest range and converges to an exact count"

- id: planner-7
  title: "Empty-store policy: when no field matches and retrieval returns fewer than 3 rows above 0.75 similarity the planner replies with a coverage statement and a queued backfill, never a free-text guess"
  level: L4
  cell: {part: query-path, uncertainty-policy: abstain-below-coverage, query-path: retrieval-then-llm, evidence-form: coverage-statement-n-of-m-players, question-type: outside-game-target, latency-tier: under-30s}
  object: "B-perspectives query-planner-engineer notices: 'what to answer when the store has nothing'"
  situation: "Studio asks 'did anyone complain about the font size in the inventory?'; retrieval returns 1 row at 0.62 similarity"
  consequence: "The LLM, given one weak row, writes a confident paragraph; one wrong number and the studio stops trusting every later answer (ask-your-data-veteran)"
  p_typical: 0.09
  grounded: inferred
  evidence: "memo: 'open-field questions retrieve matching observation rows across players and the model reads only those'"
  proposed: "Thresholds: min_rows=3, min_sim=0.75. Below either: 'No observations about inventory font size in 512 sessions at the current question set. Backfill queued (ETA 6 min); I will post the result here.'"
  shallow: false
  mechanism: "Query path. The retrieval executor returns (rows, max_sim, n_above_threshold); the planner's answer template branches on these numbers before any generation call is made"
  example: "'Why do players quit at the smithing tutorial?' when no smithing observations exist -> 'No observations mention smithing in 512 sessions. 0 of 512. Backfill queued.' instead of a plausible-sounding paragraph"
  cost: XS
  depends_on: "retrieval over observation rows with similarity scores"
  part: query
  ingest_cost: S
  query_cost: S
  better_than_fixed_table: "The fixed-table chatbot either says nothing or invents; this states coverage as a number and converts the gap into a new field"

- id: planner-8
  title: "Denominator enforcement: every count answer joins a canonical eligible_sessions view and the executor rejects a plan whose evidence_form is count without a denominator source"
  level: L4
  cell: {part: evaluation, evidence-form: count-with-denominator, question-type: how-many, uncertainty-policy: answer-with-ci-and-n, query-path: sql-over-closed-fields, user-segment: producer-exec}
  object: "spec.md item 4: 'a question over, say, 500 players'; memo item 1 answers table replaced by observation log"
  situation: "Question 'how many quit at step 4' when 37 of 512 sessions never reached step 4 and 12 sessions have a missing video; the naive denominator is 512, the defensible one is 463"
  consequence: "A producer puts '27%' in a greenlight deck; next month the number is 30% with no change in players because the denominator moved"
  p_typical: 0.08
  grounded: inferred
  evidence: "spec.md: 'The answers form a structured table per video' (per video, so session denominators are not defined today)"
  proposed: "eligible_sessions(session_id, reached_step[], complete_video_set bool, build_version); plan must name denominator: all|reached_step:k|complete_only; the answer prints both numerator and denominator and which rule was used"
  shallow: false
  mechanism: "Store view plus executor validation rule. Executor throws PlanError if evidence_form=count and denominator is null; the planner retries once with a denominator"
  example: "'Quit rate at step 4' -> '124 of 463 sessions that reached step 4 (26.8%); 37 sessions never reached step 4; 12 excluded for missing videos'"
  cost: S
  depends_on: "session stitching that marks complete vs incomplete video sets"
  part: evaluation
  ingest_cost: S
  query_cost: S
  better_than_fixed_table: "The per-video answers table has no session-level denominator; this makes every percentage reproducible month to month"

- id: planner-9
  title: "'Why' questions are decomposed into a fixed 3-part plan: step funnel over closed fields, then friction observations at the top-drop step, then 5 quotes with timestamps"
  level: L3
  cell: {part: query-path, question-type: why, query-path: agentic-multi-tool-plan, granularity: tutorial-step, evidence-form: quote-with-timestamp, representation: step-funnel-state-machine-per-player, subject-domain: onboarding-tutorial}
  object: "spec.md item 3: 'The targets are mostly detecting churn in the tutorial and just after it'"
  situation: "Designer asks 'why do players leave the tutorial?' which has no single field and no single retrieval"
  consequence: "Routed as pure retrieval, the answer is 10 quotes with no numbers; routed as pure SQL it is a funnel with no reasons; the designer needs both in one answer"
  p_typical: 0.15
  grounded: quote
  evidence: "spec.md: 'The targets are mostly detecting churn in the tutorial and just after it'"
  proposed: "Template plan why_tutorial: [sql funnel by step_id -> pick step with max drop -> retrieval filter step_id=k, field in (friction, sentiment<0) -> top 5 quotes by confidence]; total budget 3 calls, 8 s"
  shallow: false
  mechanism: "Query path. The planner recognises why + tutorial scope and instantiates a stored 3-step plan rather than free planning; each step's output is a typed input to the next"
  example: "Funnel: step4 drop 24% (124 of 512). Friction at step 4: 71 observations, top codes: 'cannot find crafting menu' 38, 'timer too short' 19. Quotes: 'where is the... I pressed everything' (s_0417, 00:13:42)"
  cost: M
  depends_on: "step_id as a closed field on observations, friction code enum"
  part: query
  ingest_cost: M
  query_cost: M
  better_than_fixed_table: "The fixed table gives a quit flag per video; this gives the step, the share, the coded reason and the evidence quote in one answer under 10 s"

- id: planner-10
  title: "Text-to-semantic-layer: the planner maps questions onto 12 named metrics (step_completion, stall_time, quit_rate, retry_count...) defined in a metrics.yaml, and raw SQL generation is disabled"
  level: L3
  cell: {part: query-path, query-path: text-to-semantic-layer-metrics, representation: olap-cube-materialized-views, latency-tier: under-2s, mechanism-type: narrow-or-clarify-the-question, schema-evolution: append-only-versioned-fields, user-segment: studio-analyst}
  object: "memo item 2: 'closed-field questions become aggregate queries over all players (instant)'"
  situation: "Two analysts ask 'average time on step 3'; one planner run writes AVG over all observations at step 3, the other AVG of per-session max; the numbers differ by 40 s"
  consequence: "Text-to-SQL over a timestamped log is ambiguous about session vs observation grain; metric definitions pin the grain once"
  p_typical: 0.07
  grounded: inferred
  evidence: "memo: 'timestamped atomic observations across all videos of a session'"
  proposed: "metrics.yaml entries: {name: stall_time, grain: session x step, sql: max(t_ms)-min(t_ms) where field=step_on_screen, unit: s, dims: [step_id, build_version, cohort]}; planner output is {metric, dims, filters}; executor templates the SQL"
  shallow: false
  mechanism: "Query path and store. Materialised view per metric x dim refreshed nightly; the planner selects metric and dims; unknown metric -> planner-7 empty-store policy or backfill"
  example: "'how long do players sit on step 3' -> {metric: stall_time, dims: [step_id=3], agg: median} -> 'median 94 s, p90 310 s, n=488 sessions that reached step 3'"
  cost: M
  depends_on: "step_on_screen observations with session-relative t_ms (session stitching)"
  part: query
  ingest_cost: M
  query_cost: S
  better_than_fixed_table: "The fixed table answers only the questions written per game; 12 metrics x 6 dimensions give 72 answerable aggregate shapes per game with one shared definition"

- id: planner-11
  title: "Refused: open-ended agentic planning with unbounded tool calls; the planner is capped at 3 tool calls and a 2 s compute budget per answer, and a plan that needs more is converted to a backfill job"
  level: L4
  cell: {part: query-path, query-path: agentic-multi-tool-plan, latency-tier: under-2s, mechanism-type: defer-to-query-time, effort: XS-days, user-segment: jev-internal-ops}
  object: "spec.md constraint: 'Answering a studio's question must be fast'"
  situation: "A ReAct-style planner given SQL, retrieval and transcript-read tools takes 14 calls and 41 s on 'compare step 4 friction between controllers and keyboard' and times out on 1 of 5 runs"
  consequence: "Low willingness: p95 latency and cost per answer become unpredictable, and a 41 s answer with a different path on each run cannot be cached or reproduced"
  p_typical: 0.05
  grounded: inferred
  evidence: "spec.md: 'Reading 500 transcripts per question was too slow and too much data'"
  proposed: "Hard limits in the executor: max_calls=3, max_wall=2000 ms for sql/retrieval routes; over budget -> write a backfill plan and answer with planner-6 progressive mode"
  shallow: false
  mechanism: "Executor-level budget, not prompt-level. Each tool call decrements a counter; the planner receives remaining budget as a field and must emit a final answer when it hits 0"
  example: "'Which tutorial step has the most rage quits among players who muted the game?' -> needs cohort + funnel + retrieval = 3 calls, 1.6 s -> allowed. Adding 'and what did they say in the first 2 minutes' -> 4th call -> queued as a backfill with the partial answer shown"
  cost: XS
  depends_on: "plan executor (planner-1)"
  part: query
  ingest_cost: S
  query_cost: S
  better_than_fixed_table: "Keeps the fixed-table speed guarantee (one scan, one answer) while allowing composed questions the table cannot express"

- id: planner-12
  title: "Field synthesis before backfill: the planner drafts the new field's definition (name, closed enum of 4-7 values, evidence requirement) from the question plus 20 sampled sessions, and the backfill runs that definition"
  level: L3
  cell: {part: question-generation, question-origin: failed-query-log, query-path: lazy-backfill-extraction, extraction-trigger: on-first-question, schema-evolution: append-only-versioned-fields, representation: fixed-mcq-answers, reuse-scope-of-extraction: game-specific}
  object: "memo item 2: 'whose result is cached as a new field, so the question set grows from real use'; memo item 3 'each with an answer type and an evidence requirement'"
  situation: "Question 'did players understand the parry prompt?' has no field; a naive backfill asks the LLM the raw question per session and gets 512 free-text paragraphs that cannot be counted"
  consequence: "A free-text backfill produces a column that cannot be aggregated, so the next analyst's 'how many' question over it fails again"
  p_typical: 0.06
  grounded: quote
  evidence: "memo: 'each with an answer type and an evidence requirement'"
  proposed: "Synthesis step: run the question over 20 random sessions open-ended, cluster answers, propose enum {understood_first_try, understood_after_retry, never_understood, prompt_not_shown, unclear}, require quote+timestamp per value; store field spec v1; backfill 512 with the enum"
  shallow: false
  mechanism: "Question generation at query time. Field spec = {name, question_text, enum[], evidence: quote_with_timestamp, scope: tutorial-step:parry, origin: failed-query-log, created_from_plan: <plan_id>}; the extraction prompt is templated from the spec"
  example: "parry_prompt_understanding@v1 over 512 sessions: understood_first_try 301, after_retry 118, never 54, not_shown 22, unclear 17 -> 'never understood: 54 of 490 shown (11.0%)'"
  cost: M
  depends_on: "backfill queue and a field registry with versions"
  part: question-generation
  ingest_cost: M
  query_cost: M
  better_than_fixed_table: "The fixed question set is written once per game by hand; this writes a new closed question from a real studio question, with the same countable shape"

- id: planner-13
  title: "Studio confirms the synthesised field on a 20-session dry run before the full backfill is spent: the chatbot shows the enum and 5 sample answers with clips and asks approve / edit / cancel"
  level: L4
  cell: {part: chatbot-ui, mechanism-type: human-in-the-loop, query-path: lazy-backfill-extraction, uncertainty-policy: ask-clarifying-question, evidence-form: clip-montage-n-examples, user-segment: ux-researcher, moment-in-journey: first-studio-question}
  object: "memo item 3: 'judged by two tests: coverage of real studio questions and accuracy against hand-labelled sessions'"
  situation: "Synthesised enum for 'did players understand the parry prompt' conflates 'prompt not shown' with 'never understood'; the researcher would have caught it in 30 s"
  consequence: "Without the gate the 512-session backfill (about 7 min and the full inference bill) produces a field the studio distrusts and asks to redo"
  p_typical: 0.08
  grounded: inferred
  evidence: "memo: 'accuracy against hand-labelled sessions'"
  proposed: "Dry-run card: field name, enum, 5 sessions x (value, quote, 8 s clip); buttons approve, edit enum, cancel; auto-approve after 10 min if the asker is offline so the answer still arrives"
  shallow: false
  mechanism: "UI plus query path. Backfill job has states draft -> dry_run(20) -> awaiting_approval -> full(512) -> cached; edits to the enum re-run the 20-session dry run"
  example: "Researcher sees 'never_understood' on s_0231 where the clip shows the prompt never appeared; edits enum to add prompt_not_shown; approves; full backfill runs with v2"
  cost: S
  depends_on: "field synthesis (planner-12) and clip lookup (planner-15)"
  part: ui
  ingest_cost: S
  query_cost: M
  better_than_fixed_table: "The fixed table's questions were never shown to the studio for review per field; this makes each new field studio-validated before it is counted"

- id: planner-14
  title: "'What did players say about X' routes to BM25 keyword search over utterances with player and step filters, returns quotes with timestamps, and uses embeddings only as a second pass when BM25 returns under 5 hits"
  level: L3
  cell: {part: query-path, query-path: full-text-keyword-search, question-type: what-said, representation: inverted-full-text-index, modality: speech-transcript, evidence-form: quote-with-timestamp, build-or-buy: open-source-component}
  object: "memo item 1: 'utterance ... quote with timestamp as evidence'"
  situation: "Studio asks 'what did players say about the dodge roll?'; embedding retrieval returns utterances about jumping and sprinting ranked above the 9 utterances that contain 'dodge' or 'roll'"
  consequence: "Term-specific questions get semantically adjacent but wrong quotes; the studio reads a quote about jumping as evidence about dodge"
  p_typical: 0.2
  grounded: inferred
  evidence: "memo: 'short open fields' and 'quote with timestamp as evidence'"
  proposed: "Inverted index over utterance text (session_id, video_index, t_ms, step_id, speaker=player); query terms plus game-specific synonyms list (dodge, roll, dash); BM25 top 50; fallback to embeddings when hits < 5"
  shallow: false
  mechanism: "Query path and store. Route what-said -> keyword first; results grouped per session so one talkative player cannot fill all 10 slots (max 2 quotes per session)"
  example: "'dodge roll' -> 9 sessions, 14 utterances; answer: 14 quotes grouped by step, 7 at step 5 ('it does not roll when I press it', s_0102, 00:21:07), with a count line '9 of 512 sessions mention dodge or roll'"
  cost: S
  depends_on: "utterance-level rows with t_ms and step_id"
  part: query
  ingest_cost: S
  query_cost: S
  better_than_fixed_table: "The fixed table has no quotes at all; this returns verbatim, timestamped speech for any term with a per-session count"

- id: planner-15
  title: "Clip route: a plan with route=clip returns (session_id, video_index, t_start_ms, t_end_ms) tuples computed from observation timestamps with a 5 s lead-in and 10 s tail, and the UI plays them without any model call"
  level: L3
