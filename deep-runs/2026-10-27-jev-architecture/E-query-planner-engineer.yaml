  cost: XS
  depends_on: "plan object (planner-1)"
  part: ui
  ingest_cost: S
  query_cost: S
  better_than_fixed_table: "The fixed-table chatbot's answers are indistinguishable from guesses; this marks census vs sample on every answer"

- id: planner-29
  title: "Refused for cohort scope, allowed for one player: map-reduce over raw transcripts at query time is only permitted when scope is a single session (about 8 videos, 40k tokens, under 30 s), and any cohort-scope raw read is rewritten as a backfill"
  level: L4
  cell: {part: query-path, query-path: map-reduce-over-raw, scope: one-player, latency-tier: under-30s, representation: raw-transcript-only, mechanism-type: defer-to-query-time, effort: S-weeks}
