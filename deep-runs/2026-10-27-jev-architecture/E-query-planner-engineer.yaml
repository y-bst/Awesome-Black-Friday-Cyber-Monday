  evidence: "memo: 'pruned by the game target'"
  proposed: "entities table per game (entity, aliases[], in_target bool); planner step 0 matches question noun phrases; unmatched -> route retrieval on open fields with the phrase, then backfill with the phrase added to the ontology as a new entity"
  shallow: false
  mechanism: "Query path plus question generation. Each out-of-target hit appends the entity to the ontology with origin=failed-query-log so the next ingestion extracts for it at ingestion time"
  example: "'do players open the shop before finishing the tutorial?' -> 'shop' not in target -> retrieval: 23 open observations mention shop -> backfill field shop_opened_before_tutorial_end over 512 -> '88 of 512 (17.2%)' after 6 min; 'shop' now an ontology entity"
  cost: S
  depends_on: "ontology entity list per game (memo item 3)"
  part: query
  ingest_cost: S
  query_cost: M
  better_than_fixed_table: "Questions outside the game target are simply unanswerable from the fixed table; this answers them once slowly and then fast forever"

- id: planner-19
  title: "Failed-query log feeds weekly question induction: every backfill-routed or abstained plan is logged, and when 3 or more plans in a week collapse to the same field spec the field is promoted to the ingestion-time question set"
  level: L3
  cell: {part: feedback-loop-from-query-log, question-origin: failed-query-log, extraction-trigger: scheduled-batch, schema-evolution: append-only-versioned-fields, moment-in-journey: steady-state-weekly, mechanism-type: precompute-more}
  object: "memo item 2: 'so the question set grows from real use'"
