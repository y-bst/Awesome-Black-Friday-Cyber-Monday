- id: planner-23
  title: "Session-grain rule in the executor: every aggregate groups by session_id, never by video_id, and 'how long' plans sum durations across a session's videos with inter-video gaps counted separately"
  level: L4
  cell: {part: session-stitching, granularity: session, question-type: how-long, query-path: sql-over-closed-fields, representation: timestamped-observation-log, evidence-form: count-with-denominator}
