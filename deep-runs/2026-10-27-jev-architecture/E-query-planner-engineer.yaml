- id: planner-18
  title: "Out-of-ontology entity detector: the planner extracts noun phrases from the question, checks them against the game's entity list, and routes unmatched entities (for example 'shop', 'guild') straight to retrieval over open fields then backfill, skipping SQL"
  level: L4
  cell: {part: query-path, question-type: outside-game-target, query-path: lazy-backfill-extraction, latency-tier: minutes, question-origin: ontology-generated, representation: hybrid, extraction-trigger: on-first-question}
  object: "memo item 3: 'Questions are generated from an ontology (entities x dimensions x outcomes), pruned by the game target'; C-axes example cell outside-game-target"
  situation: "A studio whose game target was tutorial churn asks about the in-game shop, which the ontology pruned away"
