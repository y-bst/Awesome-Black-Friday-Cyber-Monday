- id: planner-16
  title: "Compare-versions route: the planner detects two build_version values and runs the same metric plan twice, returning the difference with a two-proportion CI and the two denominators"
  level: L4
  cell: {part: query-path, question-type: compare-versions, scope: build-version-pair, evidence-form: contrast-vs-baseline, modality: build-version-metadata, uncertainty-policy: answer-with-ci-and-n, moment-in-journey: new-build-version}
