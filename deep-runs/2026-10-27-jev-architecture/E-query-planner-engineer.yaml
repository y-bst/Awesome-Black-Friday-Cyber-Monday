  evidence: "spec.md: 'Reading 500 transcripts per question was too slow and too much data'"
  proposed: "Route raw allowed iff scope.session_count == 1; the planner uses it for 'what happened to player s_0417 in the tutorial' and returns a timeline with timestamps; cohort questions over raw -> backfill with the same prompt"
  shallow: false
  mechanism: "Executor rule plus one-player timeline route: concatenate the session's transcripts and observations in t_ms order, one model call, answer is a timeline with 10-20 timestamped entries"
  example: "'What happened to player 417?' -> 8 videos, 38k tokens, 22 s -> timeline: 00:00 start, 02:14 first friction at camera, 13:42 'where is the crafting menu', 15:05 quit"
  cost: S
  depends_on: "session stitching to order a session's transcripts"
  part: query
  ingest_cost: S
  query_cost: L
  better_than_fixed_table: "The fixed table cannot narrate one player's session; this does, while keeping cohort questions off the raw path that the spec already rejected"

- id: planner-30
  title: "Scheduled digest from the query log: the 10 most-run plans of the last 30 days are re-executed on each night's new sessions and the deltas are pushed weekly, so steady-state questions are never typed"
  level: L3
  cell: {part: feedback-loop-from-query-log, delivery-surface: scheduled-digest, query-path: cached-prior-answer, mechanism-type: push-instead-of-pull, latency-tier: push-no-query, moment-in-journey: steady-state-weekly, question-origin: learned-from-studio-usage}
  object: "memo item 2: 'the question set grows from real use'"
  situation: "By week 6 the same 10 plans account for 70% of a studio's questions and each is re-typed on Monday morning"
  consequence: "Analysts spend Monday re-asking; the chatbot is a reporting tool with extra typing"
  p_typical: 0.06
  grounded: inferred
  evidence: "spec.md: 'A chatbot for the gaming studio answers the studio's questions'"
  proposed: "digest job: top 10 plans by run count per studio; run on the latest snapshot; compare with the previous week; post a digest with value, delta, n, and a flag when the delta exceeds the CI; no LLM call needed"
  shallow: false
  mechanism: "Feedback loop plus delivery surface. Plans are already stored (planner-1, planner-5); the digest is a scheduled replay and diff"
  example: "Monday digest: 'Tutorial quit rate 24.1% (n=640), down from 26.8% (n=512); step 4 stall median 88 s, was 94 s; 2 of 10 metrics moved beyond their CI'"
  cost: S
  depends_on: "plan store and nightly snapshots"
  part: query
  ingest_cost: S
  query_cost: S
  better_than_fixed_table: "The fixed table answers only when asked; this delivers the recurring answers without a question"

- id: planner-31
  title: "Recall estimate on find-players-who: after retrieval, sample 30 sessions from the non-matched set, run the extraction on them, and report estimated recall with a CI next to the per-player list"
  level: L4
  cell: {part: evaluation, question-type: find-players-who, evidence-form: recall-estimate, query-path: retrieval-then-llm, uncertainty-policy: answer-with-ci-and-n, scope: all-players, latency-tier: under-30s}
  object: "B-perspectives ediscovery-tar-practitioner: 'retrieval-then-LLM without a recall estimate is indefensible'; memo item 2 retrieval route"
  situation: "Studio asks 'find all players who tried to skip the tutorial'; retrieval returns 44 sessions; nobody knows how many were missed"
  consequence: "The designer treats 44 as the full set and reports 8.6%; the true share may be 15%"
  p_typical: 0.04
  grounded: inferred
  evidence: "memo: 'retrieve matching observation rows across players and the model reads only those'"
  proposed: "null-set sample of 30 sessions, extraction prompt for the predicate, k hits -> recall estimate = 44 / (44 + k x (468/30)) with a binomial CI; cost about 30 model calls, 15 s in parallel"
  shallow: false
  mechanism: "Evaluation inside the query path. Runs only for find-players-who with retrieval route; result stored on the cohort object (planner-3) as recall_estimate"
  example: "'44 players found; recall estimate 71% (CI 52-86%) from a 30-session check that found 2 missed; estimated true count 62. Say \"backfill\" to get the exact set'"
  cost: S
  depends_on: "cohort objects and per-session extraction callable at query time"
  part: evaluation
  ingest_cost: S
  query_cost: M
  better_than_fixed_table: "The fixed table has 100% recall on its own questions and 0% on anything else; this gives a measured recall on new questions"

- id: planner-32
  title: "Schema-on-read route: a plan may filter on JSON keys inside the open observation field when the key appears in at least 50 sessions, using a nightly key-frequency table as the planner's catalogue"
  level: L3
  cell: {part: query-path, representation: wide-event-schema-on-read, schema-evolution: schema-on-read, query-path: sql-over-closed-fields, representation: learned-schema-from-data, question-origin: induced-from-data, latency-tier: under-2s}
  object: "memo item 1: 'closed enum fields and short open fields'"
  situation: "The ingestion model has been writing open attributes like {menu_opened: 'crafting'} into the open field for weeks; the planner cannot see them"
  consequence: "Questions about 'crafting menu' go to backfill although 300 sessions already carry the attribute"
  p_typical: 0.05
  grounded: quote
  evidence: "memo: 'short open fields'"
  proposed: "open field stored as JSON variant; nightly key_stats(key, n_sessions, top_values[10]); planner catalogue lists keys with n >= 50; plan filter {json_key: menu_opened, op: =, value: crafting}"
  shallow: false
  mechanism: "Store plus query path. Columnar JSON (variant) columns make key filters an indexed scan; keys below 50 sessions are hidden from the planner and routed to backfill"
  example: "'How many players opened the crafting menu during the tutorial?' -> catalogue hit menu_opened (n=312) -> '188 of 312 sessions with the attribute (60.3%); 200 sessions lack the attribute, backfill offered'"
  cost: M
  depends_on: "JSON-capable columnar store and open field written as key:value"
  part: query
  ingest_cost: S
  query_cost: S
  better_than_fixed_table: "Lets questions use attributes the extractor wrote spontaneously, which the fixed table has no place for"

- id: planner-33
  title: "Pre/post route needs build_version: when it is missing on old sessions the planner triggers a cheap OCR backfill of the version string from the title screen frame before running the comparison"
  level: L4
  cell: {part: frame-pipeline, question-type: did-the-fix-work-pre-post, modality: on-screen-text-ocr, extraction-trigger: on-first-question, schema-evolution: lazy-backfill-on-demand, scope: build-version-pair}
  object: "spec.md unspecified: no mention of build versions; A-frame assumption 'original videos remain available for re-processing, including frames'"
  situation: "Studio asks 'did the 1.5 patch fix the step 4 stall?'; build_version is null on 203 sessions ingested before the field existed"
  consequence: "The comparison silently becomes 'null vs 1.5' and the answer is a non-answer, or the planner refuses and the studio waits for a manual join"
  p_typical: 0.05
  grounded: inferred
  evidence: "A-frame: 'original videos remain available for re-processing, including frames'"
  proposed: "Backfill job type ocr_version: sample 3 frames from video 1 at 0 s, 5 s, 10 s; OCR; regex v\\d+\\.\\d+(\\.\\d+)?; write build_version with confidence; about 0.2 s per session, 512 sessions in under a minute"
  shallow: false
  mechanism: "Frame pipeline triggered by the query path. Cheapest possible frame job; result is a session-level field used by planner-16"
  example: "OCR fills 197 of 203 missing versions in 45 s; comparison runs: '1.4: 55 of 203; 1.5: 13 of 61; 6 sessions with unreadable version excluded'"
  cost: S
  depends_on: "frame access per video and an OCR step"
  part: ingestion
  ingest_cost: S
  query_cost: S
  better_than_fixed_table: "The fixed table has no version dimension; this adds one retroactively in under a minute"

- id: planner-34
  title: "Planner golden set: 60 studio questions with expected route, fields and denominator, run on every planner prompt or model change, with release blocked below 95% route accuracy"
  level: L4
  cell: {part: evaluation, query-path: sql-over-closed-fields, question-origin: learned-from-studio-usage, extraction-trigger: on-model-upgrade, user-segment: jev-internal-ops, evidence-form: count-with-denominator}
  object: "memo item 3: 'judged by two tests: coverage of real studio questions and accuracy against hand-labelled sessions' (both about questions, neither about routing)"
  situation: "A planner prompt edit to support compare-versions silently starts routing 'how many' questions to retrieval; counts become samples"
  consequence: "Numbers drift without any ingestion change and the drift is discovered by a studio"
  p_typical: 0.09
  grounded: quote
  evidence: "memo: 'coverage of real studio questions and accuracy against hand-labelled sessions'"
  proposed: "golden_plans.yaml: 60 entries {question, expected_route, expected_fields, expected_denominator, tolerance}; CI job runs the planner, diffs plans, fails under 57 of 60; 20 of the 60 are tutorial-churn phrasings from real logs"
  shallow: false
  mechanism: "Evaluation of the query path, independent of extraction accuracy. Expected plans are hand-written once per route template and extended from the failed-query log monthly"
  example: "Entry: 'what share of players bail during onboarding' -> expected {sql, tutorial_outcome, denominator: all}; a prompt change that yields {retrieval} fails the build"
  cost: S
  depends_on: "plan object (planner-1)"
  part: evaluation
  ingest_cost: S
  query_cost: S
  better_than_fixed_table: "The fixed table has no routing to break; once routing exists, this is the regression test that the memo's two tests do not cover"

- id: planner-35
  title: "Counterfactual 'why didn't they' questions are narrowed by the planner into two answerable plans (how many did, plus what those who did not say) with an explicit line that causes are not observed"
  level: L4
  cell: {part: query-path, question-type: counterfactual-why-not, mechanism-type: narrow-or-clarify-the-question, uncertainty-policy: ask-clarifying-question, query-path: full-text-keyword-search, evidence-form: quote-with-timestamp}
  object: "spec.md item 3 'churn in the tutorial'; B-perspectives query-planner-engineer 'what to answer when the store has nothing'"
  situation: "Designer asks 'why didn't players use the dash in the tutorial?'; no observation records a reason for not doing something"
  consequence: "An unguarded LLM answer invents motives; the designer redesigns the dash prompt on a fabricated reason"
  p_typical: 0.05
  grounded: inferred
  evidence: "memo: 'friction signal, sentiment, quote with timestamp as evidence' (reasons for inaction are not among the observation types)"
  proposed: "Rewrite rule: counterfactual-why-not -> plan A {sql: count sessions with action=dash during tutorial} + plan B {keyword: dash|dodge among sessions without the action, quotes} + fixed line 'Reasons for not acting are not observed; these are quotes from non-users mentioning the dash'"
  shallow: false
  mechanism: "Query path. The planner's route table maps counterfactual-why-not to a two-plan bundle; no generation step is allowed to state a cause"
  example: "'Why didn't players dash?' -> '96 of 512 used dash during the tutorial (18.8%). Among the 416 who did not, 23 mention it: \"is there a dodge button?\" (s_0288, 00:04:31) ... Reasons for not acting are not observed.'"
  cost: XS
  depends_on: "action observations and keyword index (planner-14)"
  part: query
  ingest_cost: S
  query_cost: S
  better_than_fixed_table: "The fixed table cannot answer the question and the raw chatbot answers it falsely; this answers the observable part and names the unobservable part"
