  situation: "Retrieval returns 120 of 500 sessions; the null set is 380; a 385-sample would read nearly all of them anyway"
  consequence: "Sampling 385 of 380 is pointless; reading all 380 observation logs (about 2 to 3 minutes in parallel) gives exact recall and a complete list, and the result is cached as a field so the next ask is instant"
  p_typical: 0.07
