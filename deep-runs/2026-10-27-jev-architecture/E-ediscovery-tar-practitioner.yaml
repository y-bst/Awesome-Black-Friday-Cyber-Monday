- id: tar-24
  title: "REFUSE: a genre-shared classifier or question bank applied to a new game without a 200-session per-game validation sample; recall from game A is not evidence for game B"
  level: L3
  cell: {part: evaluation, reuse-scope-of-extraction: genre-shared, mechanism-type: transfer-across-games, moment-in-journey: first-cohort-ingested, question-origin: genre-template-library, uncertainty-policy: abstain-below-coverage}
  object: "A-frame.yaml assumption: 'studios are many and each game differs, so per-game hand-written questions do not scale'"
  situation: "A 'tutorial_abandon' field validated at kappa 0.81 on an RPG is applied to a rhythm game whose tutorial has no steps on screen"
  consequence: "Low willingness. TAR classifiers are matter-specific and are re-validated per matter; the persona refuses to report counts on a transferred field until the new game's control sample shows kappa at or above 0.6 and a recall estimate; until then the field is examples_only for that game"
  p_typical: 0.07
  grounded: quote
  evidence: "A-frame.yaml: 'studios are many and each game differs, so per-game hand-written questions do not scale'"
  proposed: "On first-cohort-ingested: pin the 200-session control sample, run two coders on every transferred field, compute kappa, run elusion on one retrieval; fields pass or stay examples_only; a per-game validation page lists field, kappa, recall, status"
  mechanism: "Changes evaluation at onboarding: transfer is allowed, counting on transferred fields is gated per game"
  example: "Rhythm game: tutorial_abandon kappa 0.41 (the coder confuses song restarts with abandonment); field stays examples_only; the studio writes a protocol edit and it passes at 0.72"
  cost: S
  depends_on: "control sample (tar-4), two-coder QC (tar-10)"
  part: evaluation
  ingest_cost: M
  query_cost: S
  better_than_fixed_table: "Per-game tables are implicitly validated by their author; a shared bank needs an explicit per-game check or it is worse than the table"
  shallow: false

- id: tar-25
  title: "Re-validate on game update: when build-version changes, the control sample is re-drawn from the new build's sessions and every validated field's kappa and recall are recomputed; fields that drop below threshold are flagged on the dashboard"
