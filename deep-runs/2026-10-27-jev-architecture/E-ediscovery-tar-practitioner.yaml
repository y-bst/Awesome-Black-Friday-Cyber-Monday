  better_than_fixed_table: "The table's churn questions are guessed by a writer; these are the observations that in fact separate churners in this game"
  shallow: false

- id: tar-29
  title: "Precision check on the positive list: sample 100 of the returned players (or all if fewer), code them against the protocol, and report precision with CI alongside recall; overturned players are removed and the overturn reasons are appended to the protocol's borderline rule"
  level: L4
  cell: {part: evaluation, evidence-form: recall-estimate, question-type: find-players-who, uncertainty-policy: answer-with-ci-and-n, mechanism-type: human-in-the-loop, latency-tier: minutes}
  object: "memo.md item 2: 'the model reads only those'"
  situation: "CAL returns 71 players; 100% of them are LLM-coded; the elusion test (tar-1) says recall is 86% but says nothing about how many of the 71 are wrong"
  consequence: "Recall without precision lets a classifier that says yes to everything pass; a 100-row precision sample at 92% means about 6 of the 71 are false positives, and the designer sees '65 to 71 players' rather than 71"
  p_typical: 0.07
  grounded: quote
  evidence: "memo.md: 'retrieve matching observation rows across players and the model reads only those'"
  proposed: "Second coder (model B or human via tar-23) codes min(100, n_returned) positives; precision with Wilson CI; overturned rows get a reason text; reasons are clustered and the top 2 are proposed as borderline-rule edits"
  mechanism: "Changes evaluation: every per-player-list answer carries precision as well as recall, and overturns edit the protocol"
  example: "71 returned, 71 checked by model B, 66 confirmed (93%, CI 85 to 97); 5 overturned for 'menu opened but tutorial completed'; protocol v2 adds that exclusion"
  cost: S
  depends_on: "protocols (tar-9), a second coder"
  part: evaluation
  ingest_cost: S
  query_cost: M
  better_than_fixed_table: "The table's cells have no precision figure; this attaches one to every list"
  shallow: false

- id: tar-30
  title: "REFUSE: always-answer as the chatbot's uncertainty policy; a count whose validation cannot run within the query budget returns examples and a 'run validation' button, never a number"
  level: L3
  cell: {part: chatbot-ui, uncertainty-policy: always-answer, question-type: how-many, delivery-surface: chatbot, latency-tier: under-2s, user-segment: producer-exec}
  object: "spec.md constraint: 'Answering a studio's question must be fast.'"
  situation: "A 2-second latency target with a 500-session population; a new how-many question cannot be sampled and coded in 2 seconds"
  consequence: "Low willingness. Fast and wrong destroys trust faster than slow and right; the persona would rather return '8 example quotes, count pending (about 40 s)' than a 2-second number from top-k retrieval; a wrong number in a greenlight deck is not recoverable"
  p_typical: 0.1
  grounded: quote
  evidence: "spec.md: 'Answering a studio's question must be fast.'"
  proposed: "Policy table in the planner: how-many and find-players-who never resolve via always-answer; under-2s tier serves closed fields and cached validated answers only; everything else streams examples first and the validated number when ready"
  mechanism: "Changes chatbot-ui and the planner's policy: a number is a validated artefact, an example is not"
  example: "'How many players quit at the crafting step?' on an unvalidated field: 8 quotes in 1.5 s, then '72 players (CI 64 to 81)' at 38 s"
  cost: S
  depends_on: "tar-4, tar-18"
  part: chatbot-ui
  ingest_cost: S
  query_cost: S
  better_than_fixed_table: "The table is fast because it is pre-chosen; this keeps fast for what is validated and refuses to fake it for what is not"
  shallow: false

- id: tar-31
  title: "Chain of custody for sessions: hash of each video file, capture device id, upload time and stitching decision are recorded, and an answer can show that all 9 videos of a cited session were present and in order when the extraction ran"
  level: L3
  cell: {part: session-stitching, collection-protocol: true, evidence-form: extraction-provenance-model-and-schema-version, modality: build-version-metadata, granularity: video, user-segment: studio-security-reviewer}
  object: "spec.md unspecified: 'how videos of one session are linked'"
  situation: "A cited 'abandoned at 01:52:10' sits in video 8; video 7 failed to upload and was re-sent two days later; the stitcher built the session without it the first time"
  consequence: "Evidence in a matter travels with a custody record; here the first extraction coded the player as abandoning at a point that was really a 15-minute gap, and nothing records that video 7 was missing at the time"
  p_typical: 0.04
  grounded: quote
  evidence: "spec.md: 'Unspecified ... how videos of one session are linked'"
  proposed: "Ingestion manifest per session {video_id, sha256, captured_at, uploaded_at, duration_s, sequence_no, gap_before_s}; stitching writes {session_id, manifest_version, n_videos, total_gap_s, complete flag}; extractions record manifest_version; an answer citing a session with complete = false shows a warning"
  mechanism: "Changes session-stitching and the store: a versioned manifest per session, referenced by every extraction"
  example: "'Players who abandoned the tutorial': 71 players; 3 flagged 'session incomplete at extraction time (1 video missing)'; re-extraction after the manifest completed moves 1 of them to not-abandoned"
  cost: S
  depends_on: "video upload metadata"
  part: session-stitching
  ingest_cost: S
  query_cost: S
  better_than_fixed_table: "The per-video table never knows a video is missing from a session; the manifest does"
  shallow: false

- id: tar-32
  title: "Stabilisation-based stop for ontology question materialisation: generated fields are materialised over all history only when the control sample shows prevalence at or above 2% and kappa at or above 0.6; the rest stay as lazy protocols"
  level: L4
  cell: {part: question-generation, question-origin: ontology-generated, schema-evolution: lazy-backfill-on-demand, extraction-trigger: on-cohort-size-threshold, mechanism-type: precompute-more, effort: S-weeks}
  object: "memo.md item 3: 'Questions are generated from an ontology (entities x dimensions x outcomes), pruned by the game target'"
  situation: "The ontology yields 1,400 candidate questions for a game; materialising all of them over 500 sessions is 700,000 session-field codes, most with prevalence near zero"
  consequence: "Pruning by richness is what keeps a review proportionate; 1,400 fields where 1,100 have under 2% prevalence or kappa under 0.6 would fill the store with noise columns that the planner would then route counts to"
  p_typical: 0.09
  grounded: quote
  evidence: "memo.md: 'Questions are generated from an ontology (entities x dimensions x outcomes), pruned by the game target, each with an answer type and an evidence requirement'"
  proposed: "Every generated question runs tar-4 and tar-10 on the 200-session control sample (280,000 codes once, cheap at ingestion); pass gate: prevalence at or above 2% and kappa at or above 0.6; passed fields are materialised over all sessions; failed ones are stored as protocols with their sample stats and backfilled only on first question"
  mechanism: "Changes question-generation and schema-evolution: materialisation is gated by sample statistics, not by ontology membership"
  example: "1,400 generated; 310 pass; 'tutorial narrator skipped' passes at 22% and kappa 0.79; 'player praised the font' fails at 0.5% and stays lazy; a later question about fonts backfills it in 3 minutes"
  cost: M
  depends_on: "ontology generator (memo.md item 3), tar-4, tar-10"
  part: question-generation
  ingest_cost: L
  query_cost: S
  better_than_fixed_table: "The table is small because a human chose; this is large where the data supports it and lazy where it does not, with the numbers to show why"
  shallow: false

- id: tar-33
  title: "Deposition-style per-player timeline export for one cited player: all observations in session order with obs_ids, redaction markers and clip links, so a studio can review one player end to end before quoting them"
  level: L3
  cell: {part: export-integration, scope: one-player, question-type: timeline, granularity: session, evidence-form: quote-with-timestamp, delivery-surface: dashboard-standard-report}
  object: "memo.md item 1: 'timestamped atomic observations across all videos of a session'"
  situation: "A producer wants to show player 217's whole tutorial in a review meeting; the chatbot returns one quote at a time"
  consequence: "A single quote out of a 3-hour session is the e-discovery 'document out of context' problem; a one-player timeline with 9 video links and all 340 observations lets the reviewer see that the 'endless' complaint came 2 minutes after a crash"
  p_typical: 0.12
  grounded: quote
  evidence: "memo.md: 'timestamped atomic observations across all videos of a session (step on screen, action, utterance, friction signal, sentiment, quote with timestamp as evidence)'"
  proposed: "Endpoint timeline(session_id) returns ordered rows {obs_id, video_id, t_session, type, step_id, text_redacted, confidence, clip_url}; rendered as a scrollable page with step bands and a crash marker; printable"
  mechanism: "Changes export-integration: a per-session document view over the observation log"
  example: "Player 217: 340 observations, crash at 00:39:05, 'this tutorial is endless' at 00:41:12, abandon at 00:44:30; the producer reclassifies the complaint as crash-related"
  cost: S
  depends_on: "observation log with session ordering (tar-12)"
  part: export-integration
  ingest_cost: S
  query_cost: S
  better_than_fixed_table: "The table shows option letters per video; the timeline shows what the player did"
  shallow: false
