- id: tar-1
  title: "Elusion test on every find-players-who answer: draw 385 sessions at random from the null set (sessions the retrieval did not return), code them against the same protocol, and report recall with a 95% CI next to the player list"
  level: L4
  cell: {part: evaluation, query-path: retrieval-then-llm, question-type: find-players-who, evidence-form: recall-estimate, uncertainty-policy: answer-with-ci-and-n, scope: all-players, latency-tier: minutes}
  object: "memo.md item 2: 'open-field questions retrieve matching observation rows across players and the model reads only those'"
  situation: "Studio asks 'find all players who rage-quit during the tutorial'; retrieval returns 62 of 500 players; the other 438 are never read and nobody knows how many positives sit in them"
  consequence: "Without the test the chatbot ships 62 as the answer; an elusion sample of 385 of the 438 that finds 9 positives implies about 10 missed players, recall about 86% (95% CI 78 to 92); the studio sees that number instead of a bare list"
  p_typical: 0.12
  grounded: quote
  evidence: "memo.md: 'open-field questions retrieve matching observation rows across players and the model reads only those'"
  proposed: "After the retrieval pass, sample 385 null-set sessions (gives +/-5pp at 95%), run the same extraction prompt over their observation rows, count positives, compute recall = found / (found + estimated_missed) with a Wilson interval; render 'Recall 86% (78 to 92), n=385 sampled of 438'"
  mechanism: "Changes evaluation and the answer record: every per-player-list answer gets {n_returned, n_null, n_sampled, positives_in_sample, recall_point, recall_ci_low, recall_ci_high, protocol_id}; the sampled rows are cached so a re-ask costs nothing"
  example: "'Which players abandoned the tutorial at the crafting step?' returns 62 players; elusion sample finds 9 of 385 null sessions positive; answer shows '62 players (estimated 72 total, recall 86%, CI 78 to 92)'"
  cost: M
  depends_on: "observation log rows per session (memo.md item 1) and a per-question coding protocol (tar-9)"
  part: evaluation
  ingest_cost: S
  query_cost: M
  better_than_fixed_table: "The fixed table has no recall concept at all; a wrong count is invisible. The elusion number is defensible to a producer who is about to cut a tutorial step on it"
  shallow: false

- id: tar-2
  title: "Continuous active learning (CAL) loop for find-players-who: seed from the first retrieval hits, train a per-question ranker over all 500 sessions, review the top 50 per round, retrain, stop when 3 consecutive rounds yield under 2 new positives"
  level: L3
  cell: {part: query-path, query-path: progressive-answer-then-refine, question-type: find-players-who, mechanism-type: approximate-then-refine, latency-tier: progressive-streaming, evidence-form: per-player-list, effort: M-one-quarter}
  object: "memo.md item 2: 'genuinely new questions trigger a one-time batch extraction over all sessions'"
  situation: "A new question with prevalence around 10% over 500 sessions; a flat batch extraction reads all 500 session logs before the first answer appears"
  consequence: "CAL reads about 150 to 200 session logs (rounds of 50) to reach stabilisation at 10% prevalence instead of 500, and the studio sees a growing player list after round 1 (about 20 seconds) rather than after the full batch"
  p_typical: 0.08
  grounded: quote
  evidence: "memo.md: 'genuinely new questions trigger a one-time batch extraction over all sessions whose result is cached as a new field'"
  proposed: "Ranker = logistic regression over TF-IDF of observation text plus closed-field one-hots per session; round r: score all unreviewed sessions, LLM-code top 50 against the protocol, add labels, retrain; emit the positive list after each round; stop rule: 3 rounds with under 2 new positives, then run tar-1 on the remainder"
  mechanism: "Changes the query path for per-player-list questions: {question, protocol} produces a stream of {round, n_reviewed, n_positive, players[]} records and a final recall estimate, instead of one batch job"
  example: "'Find players who never discovered the dodge button in the tutorial': round 1 seeds from 11 retrieval hits, round 4 has 48 positives after 200 sessions coded, rounds 5 to 7 add 1, 0, 1; stop; elusion on the 300 unread confirms recall 91%"
  cost: M
  depends_on: "observation log rows per session (memo.md item 1); an LLM coder that returns a binary code per session for a protocol"
  part: query-path
  ingest_cost: S
  query_cost: M
  better_than_fixed_table: "A new question that is not in the table costs one ranked pass of 150 to 200 reads with a recall number, not a 500-read batch with none"
  shallow: false

- id: tar-3
  title: "Seed set from studio-supplied example clips: the studio marks 5 positive and 5 negative 30-second clips in the review UI, and those become the labelled seed for the CAL ranker and the written protocol's examples"
  level: L3
  cell: {part: question-generation, question-origin: few-shot-tracker-from-examples, query-path: query-by-example-clip, delivery-surface: chatbot, granularity: variable-length-moment-or-episode, user-segment: ux-researcher}
  object: "spec.md constraint: 'Buyers are gaming studios. Their questions are not known in advance.'"
  situation: "A UX researcher cannot phrase 'that thing where players spin the camera looking for the exit' as a closed question, but can point at 5 clips where it happens"
  consequence: "A text-only question for this behaviour retrieves 14 rows, mostly wrong; a 5-positive, 5-negative seed gives the ranker a 0.8 precision at the top 50 in the first round in comparable TAR matters"
  p_typical: 0.07
  grounded: inferred
  evidence: "spec.md: 'Their questions are not known in advance.' and memo.md item 1 'quote with timestamp as evidence'"
  proposed: "Chatbot offers 'show me examples' mode; the user tags clips as positive or negative; each tag stores {session_id, t_start, t_end, label, tagger, protocol_draft}; seed labels feed tar-2 and the 10 clips are pasted into the protocol as the coding examples"
  mechanism: "Changes question-generation: a question can be born as a labelled seed set plus a one-line description, not as text alone; the seed is versioned with the field"
  example: "Researcher tags 5 clips of 'camera spinning at tutorial exit door' and 5 of normal navigation; CAL finds 37 of 500 players; the protocol file shows the 10 clips so a colleague codes the elusion sample the same way"
  cost: M
  depends_on: "clip lookup by session_id and time range; CAL loop (tar-2)"
  part: question-generation
  ingest_cost: S
  query_cost: M
  better_than_fixed_table: "Table questions must be written as text with options before anyone has seen the behaviour; a seed set captures behaviour a question-writer never anticipated"
  shallow: false

- id: tar-4
  title: "Richness (prevalence) estimate before any backfill: code a fixed 200-session random control sample against the new field first, and show the studio the expected positive count and CI before the full extraction runs"
  level: L4
  cell: {part: cost-governance, extraction-trigger: on-first-question, query-path: sampled-map-reduce-with-ci, uncertainty-policy: give-range-then-refine, mechanism-type: approximate-then-refine, latency-tier: under-30s}
  object: "memo.md item 2: 'a one-time batch extraction over all sessions whose result is cached as a new field'"
  situation: "Studio asks 'how many players read the crafting tooltip aloud'; prevalence is 0.5%, so the full answer is 2 or 3 players; a 500-session batch runs for that"
  consequence: "Control-sample first gives '0 to 3 of 200, under 2% of players' in 20 seconds; the studio can decide the full extraction is not worth it; prevalence under 1% also means a later elusion sample of 385 will likely find 0 positives and the recall CI will be uninformative, which the studio is told up front"
  p_typical: 0.06
  grounded: quote
  evidence: "memo.md: 'genuinely new questions trigger a one-time batch extraction over all sessions'"
  proposed: "Pin a control sample of 200 session_ids per game at onboarding (stratified by build-version); every new field is coded on these first; return {positives, n=200, ci_low, ci_high, projected_total_for_population}; button 'run on all 500'"
  mechanism: "Changes cost-governance and the extraction trigger: new fields go control-sample first, population second; the control sample doubles as the precision/recall validation set for the field later"
  example: "'How many players quit during the tutorial because of a crash?' control sample: 7 of 200 (3.5%, CI 1.4 to 7.1); projected 18 of 500; studio clicks run-on-all and gets 16"
  cost: S
  depends_on: "a fixed random sample of session_ids per game, stored with the game record"
  part: cost-governance
  ingest_cost: S
  query_cost: S
  better_than_fixed_table: "The table answers only pre-chosen questions; this answers any new question approximately in 20 seconds and tells the studio whether the exact answer is worth computing"
  shallow: false

- id: tar-5
  title: "REFUSE: top-k retrieval-then-LLM as the final answer to any find-players-who or how-many question without a recall estimate attached"
  level: L3
  cell: {part: query-path, query-path: retrieval-then-llm, question-type: find-players-who, uncertainty-policy: always-answer, evidence-form: per-player-list, user-segment: producer-exec}
  object: "memo.md item 2: 'retrieve matching observation rows across players and the model reads only those'"
  situation: "Retrieval returns 200 rows for 'players who complained the tutorial was too long'; the model reads 200 rows and lists 41 players; the index has 48,000 rows and the retriever's recall for this phrasing was never measured"
  consequence: "Low willingness. Keyword-style retrieval in the Blair and Maron study found 20% of relevant documents while the searchers believed 75%; a producer who cuts a tutorial step on a 41-player list that is really 90 players has acted on a number nobody can defend; the persona would not ship it"
  p_typical: 0.1
  grounded: inferred
  evidence: "memo.md item 2 describes retrieval as the open-field path with no validation step"
  proposed: "Hard rule in the planner: per-player-list and how-many answers from the retrieval path must carry either an elusion estimate (tar-1) or a control-sample estimate (tar-4); if neither can run in budget, the answer is labelled 'examples only, not a count' and shows no number"
  mechanism: "Changes the query path output contract: answer_kind is one of {count_with_recall, examples_only}; the chatbot cannot emit a bare count from top-k retrieval"
  example: "'How many players found the tutorial too long?' with no validation budget returns '12 example quotes; count not estimated, click to run a 200-session sample'"
  cost: S
  depends_on: "tar-1 or tar-4"
  part: query-path
  ingest_cost: S
  query_cost: S
  better_than_fixed_table: "The table at least reads every video; unvalidated retrieval is strictly worse than the table on recall and this rule stops it from pretending otherwise"
  shallow: false

- id: tar-6
  title: "REFUSE: semantic-cache reuse of a prior answer for a new find-players-who phrasing unless the cache key includes the protocol id and the prior answer's recall estimate is above the target"
  level: L3
  cell: {part: query-path, query-path: semantic-cache-similar-question, question-type: find-players-who, mechanism-type: reuse-or-cache-prior-work, latency-tier: sub-200ms-cached, uncertainty-policy: abstain-below-coverage}
  object: "memo.md item 2: 'whose result is cached as a new field, so the question set grows from real use'"
  situation: "'Players who got lost in the tutorial' was answered last week; this week a designer asks 'players who could not find the objective marker'; cosine similarity 0.87 returns the cached list"
  consequence: "Low willingness. The two protocols differ (lost includes backtracking without a marker complaint); the cached list of 54 is served in 150 ms with a recall number that was computed for a different question; the persona treats that as coding one matter with another matter's classifier"
  p_typical: 0.05
  grounded: quote
  evidence: "memo.md: 'whose result is cached as a new field, so the question set grows from real use'"
  proposed: "Cache hit requires: same protocol_id, or the new question's text matched by an LLM judge as 'same coding rule' with 3 of the 10 protocol examples re-coded identically; cached answers with recall_ci_low under 0.70 are never served as counts; otherwise the chatbot says 'a similar question exists, here is its protocol, confirm or edit'"
  mechanism: "Changes the semantic cache: key = (game, protocol_id, schema_version) and the hit path returns the protocol for confirmation, not the list"
  example: "Designer confirms the 'lost' protocol does not cover 'marker', edits it; the CAL loop reuses the 54 as seed labels and adds 19 more players"
  cost: S
  depends_on: "protocol objects per field (tar-9); recall estimates stored with answers (tar-1)"
  part: query-path
  ingest_cost: S
  query_cost: S
  better_than_fixed_table: "The table never conflates two questions because each is a column; this keeps that property while still letting prior work seed the new question"
  shallow: false

- id: tar-7
  title: "Redaction layer at ingestion, before indexing: player real names, voice-chat of third parties, and on-screen friend lists or chat overlays are redacted in transcript and OCR fields, and a redaction log records each span"
  level: L3
  cell: {part: tenancy-access-control, extraction-trigger: at-ingestion, modality: on-screen-text-ocr, representation: timestamped-observation-log, tenancy-and-deployment: logically-isolated-per-studio, user-segment: jev-internal-ops}
  object: "memo.md item 1: 'Video frames add screen state and on-screen text' and spec.md unspecified 'What a transcript contains'"
  situation: "A player's Steam overlay shows a friend list with 14 real names; OCR puts them into the observation log; a studio analyst later asks 'what did players read on screen' and the names come back as a quote"
  consequence: "Privilege review in e-discovery happens before production, never after; here the quote-with-timestamp evidence path (memo.md item 1) would produce third-party names to the studio with no way to recall them"
  p_typical: 0.15
  grounded: quote
  evidence: "memo.md: 'Video frames add screen state and on-screen text, because speech alone cannot answer where did they click'"
  proposed: "Ingestion pass: NER over transcript and OCR for PERSON and HANDLE, overlay-region classifier for chat and friend-list panes, replace spans with [NAME_1], [HANDLE_3] tokens; write redaction_log {session_id, field, t, span_start, span_end, reason}; indexing reads only the redacted fields; the raw field is stored encrypted and only re-readable by jev-internal-ops on ticket"
  mechanism: "Changes ingestion and the store: two column families per text field (raw_encrypted, redacted_indexed); the chatbot and export touch only redacted"
  example: "'What did players say about the tutorial?' returns 'I told [NAME_1] this tutorial is endless' with timestamp; the redaction log shows 1 span redacted, reason PERSON"
  cost: M
  depends_on: "OCR and transcript fields in the observation log"
  part: tenancy-access-control
  ingest_cost: M
  query_cost: S
  better_than_fixed_table: "The table only stores option letters so it leaks nothing; a quote-bearing observation log needs this to keep that property while adding evidence"
  shallow: false

- id: tar-8
  title: "Confidentiality term list per studio: unannounced feature and character names supplied at onboarding are tokenised in every field that could leave the tenant (cross-game ontology, shared cache, benchmark aggregates, model-vendor prompts)"
  level: L3
  cell: {part: tenancy-access-control, tenancy-and-deployment: shared-multi-tenant, reuse-scope-of-extraction: genre-shared, moment-in-journey: game-onboarding-day-0, question-origin: onboarding-interview-with-studio, extraction-trigger: on-new-game-onboarding}
  object: "memo.md item 3: 'Questions are generated from an ontology (entities x dimensions x outcomes)'"
  situation: "Ontology learns entity 'Ember Forge' from Studio A's sessions; an induced question 'did the player open the Ember Forge menu' is proposed to Studio B six months before Studio A's announcement"
  consequence: "Cross-studio leakage via a shared ontology is the vendor-risk reviewer's objection; a per-studio confidentiality list applied like a privilege screen makes the induced question read 'did the player open the [FEATURE_7] menu' outside tenant A, which is useless to B and safe to A"
  p_typical: 0.05
  grounded: quote
  evidence: "memo.md: 'Questions are generated from an ontology (entities x dimensions x outcomes), pruned by the game target'"
  proposed: "Onboarding form: list of confidential terms (expected 20 to 200 per pre-release title); a term-screen runs before any write to a shared structure (ontology entity table, semantic cache, benchmark tables, third-party model calls flagged non-private); tokens are stable per studio; a monthly report lists how many spans were screened"
  mechanism: "Changes tenancy-access-control: a screen function sits between tenant store and every shared artefact, with a log"
  example: "'Do players stall at the Ember Forge tutorial step?' answers normally inside Studio A; the genre-shared question library stores the pattern as 'stall at [crafting-station] step' only"
  cost: S
  depends_on: "an ontology or any shared cross-studio structure (memo.md item 3)"
  part: tenancy-access-control
  ingest_cost: S
  query_cost: S
  better_than_fixed_table: "Per-game hand-written tables never share anything; this lets the question library be shared without sharing the studio's secrets"
  shallow: false

- id: tar-9
  title: "A written coding protocol per field: one-paragraph definition, 3 positive and 3 negative examples with session_id and timestamp, the decision rule for borderline cases, and a version number; the LLM coder, the human QC coder and the elusion sampler all read the same file"
  level: L3
  cell: {part: question-generation, question-origin: ontology-generated, evidence-form: extraction-provenance-model-and-schema-version, schema-evolution: append-only-versioned-fields, user-segment: ux-researcher, effort: S-weeks}
  object: "memo.md item 3: 'each with an answer type and an evidence requirement'"
  situation: "Field 'tutorial_frustration' is coded by model version 3 at ingestion and by a human on the elusion sample; the human counts sighing as frustration, the prompt did not say"
  consequence: "Without a shared protocol the recall estimate measures disagreement between two definitions, not recall; TAR validation is only accepted when reviewers and the classifier work from one coding manual"
  p_typical: 0.09
  grounded: quote
  evidence: "memo.md: 'each with an answer type and an evidence requirement, and judged by two tests: coverage of real studio questions and accuracy against hand-labelled sessions'"
  proposed: "Protocol object {field_id, version, definition_text, positives[3]{session_id,t,why}, negatives[3], borderline_rule, answer_type, evidence_requirement}; the extraction prompt is rendered from it; the QC UI shows it beside the clip; every answer cites protocol version"
  mechanism: "Changes question-generation output: a generated question is not shipped until its protocol has 6 examples drawn from real sessions; examples are checked to still exist after re-ingestion"
  example: "Protocol tutorial_frustration v2 adds 'audible sigh with no words counts as positive'; the control sample re-coded under v2 moves prevalence from 18% to 23%, and both numbers are kept with their version"
  cost: S
  depends_on: "clip lookup by session_id and timestamp"
  part: question-generation
  ingest_cost: S
  query_cost: S
  better_than_fixed_table: "A table question with options is a protocol with zero examples; adding 6 examples is what makes the field auditable by someone other than its author"
  shallow: false

- id: tar-10
  title: "Two-coder disagreement QC: a second extraction pass with a different model (or temperature) over the 200-session control sample; rows where the two codes differ go to a human review queue; a field with an overturn rate above 20% is sent back to protocol editing"
  level: L4
  cell: {part: evaluation, extraction-trigger: on-low-confidence-or-disagreement, mechanism-type: human-in-the-loop, evidence-form: confidence-score, uncertainty-policy: escalate-to-human-analyst, scope: cohort}
  object: "memo.md item 3: 'accuracy against hand-labelled sessions'"
  situation: "Field 'quit_reason' has 6 options; model A and model B agree on 61% of the control sample; the studio dashboard reports quit_reason shares to one decimal place"
  consequence: "An overturn rate of 39% on a six-way code means the dashboard shares are noise; in review QC a second-pass overturn above 20% halts the review and the protocol is rewritten; here the field would be flagged 'not for counts' until the rate drops"
  p_typical: 0.08
  grounded: quote
  evidence: "memo.md: 'judged by two tests: coverage of real studio questions and accuracy against hand-labelled sessions'"
  proposed: "Per field: run coder B on the control sample at field creation and at every model upgrade; store agreement, Cohen's kappa; disagreements (expected 20 to 80 rows) queue to a human with the protocol and the clip; kappa under 0.6 sets field.status = examples_only"
  mechanism: "Changes evaluation: every field carries {kappa, overturn_rate, n_adjudicated, status}; the planner refuses count answers on examples_only fields"
  example: "quit_reason kappa 0.48; the human adjudicates 78 rows, finds 'got bored' and 'too long' were being used interchangeably; the options are merged, kappa rises to 0.74 and counts are re-enabled"
  cost: M
  depends_on: "control sample (tar-4) and protocols (tar-9)"
  part: evaluation
  ingest_cost: M
  query_cost: S
  better_than_fixed_table: "The table's accuracy is unknown per question; this gives each column a kappa and turns off the ones that cannot support a count"
  shallow: false

- id: tar-11
  title: "Keyword search results on 'players who mention X' are expanded with a synonym and misspelling set and always reported with a sampled recall figure; bare keyword hit lists are labelled 'keyword cull, recall unknown'"
  level: L4
  cell: {part: query-path, query-path: full-text-keyword-search, question-type: what-said, representation: inverted-full-text-index, evidence-form: recall-estimate, user-segment: live-ops-community}
  object: "memo.md item 1: 'utterance ... quote with timestamp as evidence'"
  situation: "Community manager types 'players who said the tutorial is boring'; the index matches 'boring' in 23 utterances; players also said 'snooze', 'yawn', 'get on with it', 'zzz' and the ASR wrote 'boaring' twice"
  consequence: "Blair and Maron (1985) measured 20% recall for keyword search where the searchers estimated 75%; a 23-player list for 'boring' is likely a third of the true set; the live-ops person posts a patch note built on it"
  p_typical: 0.14
  grounded: quote
  evidence: "memo.md: 'quote with timestamp as evidence'"
  proposed: "Keyword path: LLM generates 10 to 20 synonyms and 3 ASR-style misspellings per term, union the hits, then sample 100 non-hit utterances tagged with the same sentiment field and code them; show 'keyword set: boring, snooze, yawn ... 41 players; sampled recall 70% (CI 60 to 79)'"
  mechanism: "Changes the keyword query path: query expansion is logged with the answer and a 100-row elusion sample runs automatically on sentiment-bearing rows"
  example: "'Boring' alone: 23 players; expanded: 41; elusion sample on 100 negative-sentiment rows outside the hit set finds 12 more, so the answer states 41 found, about 58 estimated"
  cost: S
  depends_on: "inverted index over utterance_text with a sentiment field per row"
  part: query-path
  ingest_cost: S
  query_cost: S
  better_than_fixed_table: "The table cannot search free text at all; this adds free text search with the one number that keeps it from being misleading"
  shallow: false

- id: tar-12
  title: "Family-level responsiveness: a hit in any video of a session marks the whole session as a candidate, and coding, sampling and recall are all computed at session (player) granularity, never at video granularity"
  level: L3
  cell: {part: session-stitching, granularity: session, question-type: find-players-who, representation: timestamped-observation-log, scope: all-players, evidence-form: coverage-statement-n-of-m-players}
  object: "spec.md item 3: 'The answers form a structured table per video' and item 1 'one session is many videos'"
  situation: "A player's session has 9 videos; the quit is in video 9 and the complaint in video 4; a per-video classifier codes 8 videos negative and 1 positive; an elusion sample drawn over videos oversamples long sessions"
  consequence: "E-discovery codes families (email plus attachments) as a unit because a responsive attachment makes the family responsive; a per-video unit here means a 500-player question is really a 4,000-video question and the recall denominator is wrong by the session length distribution"
  p_typical: 0.1
  grounded: quote
  evidence: "spec.md: 'A session can be n hours; each video is capped at 15 minutes, so one session is many videos.' and 'The answers form a structured table per video'"
  proposed: "Stitcher assigns session_id to every video; coding unit = session; the LLM coder reads the session's observation rows in order with video boundaries marked; sampling frames are session lists; answers report 'n of m players' with m = players with at least one ingested video"
  mechanism: "Changes session-stitching and every evaluation computation: unit of coding, sampling and reporting is the session; videos are evidence locations within it"
  example: "'Players who complained before quitting the tutorial': 500 sessions, 4,100 videos; session-level coding finds 71; a per-video count would have reported 94 positive videos from 71 players"
  cost: S
  depends_on: "a session_id linking videos (spec.md names this as unspecified)"
  part: session-stitching
  ingest_cost: S
  query_cost: S
  better_than_fixed_table: "The per-video table double-counts players and loses cross-video evidence; session-level coding counts players once"
  shallow: false

- id: tar-13
  title: "Near-duplicate collapsing of repeated tutorial-step attempts into one attempt-thread per player, with attempt_count and first/last timestamps, so review and sampling do not re-read the same loop 7 times"
  level: L3
  cell: {part: ingestion-extraction, representation: step-funnel-state-machine-per-player, granularity: tutorial-step, subject-domain: onboarding-tutorial, mechanism-type: precompute-more, extraction-trigger: at-ingestion}
  object: "memo.md item 1: 'step on screen, action, utterance, friction signal'"
  situation: "A player retries the crafting step 7 times in 11 minutes; the observation log has 7 near-identical blocks of 'step 3 entered, inventory opened, step 3 failed'"
  consequence: "Email threading and near-dupe detection cut review volume by 30 to 50% in TAR matters; here a reviewer or LLM coder reads the same failure 7 times and retrieval returns 7 rows from one player for a 'players who' question, which inflates apparent prevalence"
  p_typical: 0.07
  grounded: quote
  evidence: "memo.md: 'timestamped atomic observations across all videos of a session (step on screen, action, utterance, friction signal, sentiment ...)'"
  proposed: "Ingestion groups consecutive observations with the same step_id into an attempt; consecutive attempts of the same step with Jaccard similarity of action sequences above 0.8 collapse into one thread row {player_id, step_id, attempt_count, t_first, t_last, distinct_utterances[]}; retrieval and coding read thread rows; the originals stay for clip lookup"
  mechanism: "Changes ingestion-extraction and the store: a derived attempt_thread table beside the observation log; coding unit for step questions is the thread"
  example: "'Why do players fail the crafting step?' reads 212 thread rows for 500 players instead of 1,540 attempt blocks; the 7-attempt player appears once with attempt_count 7"
  cost: M
  depends_on: "step transitions from the screen-state classifier"
  part: ingestion-extraction
  ingest_cost: M
  query_cost: S
  better_than_fixed_table: "The table has one row per video, so a 7-attempt loop spread over 2 videos is 2 rows with no attempt count; the thread row carries the count"
  shallow: false

- id: tar-14
  title: "Metadata culling before any model reads: build-version, capture date range, platform and player segment filters are applied as closed-field SQL first, and the answer states the culled population size as its denominator"
  level: L4
  cell: {part: query-path, query-path: sql-over-closed-fields, scope: query-time-defined-cohort, modality: build-version-metadata, evidence-form: count-with-denominator, latency-tier: under-2s}
  object: "memo.md item 2: 'closed-field questions become aggregate queries over all players (instant)'"
  situation: "Studio asks 'did players stall at step 3 after the 1.2 patch'; the retrieval path reads rows from all 500 players including 310 who played 1.1"
  consequence: "Custodian and date-range culling in e-discovery is the first step and the one that cuts volume most; here it cuts 500 to 190 sessions and makes the elusion sample 190, not 500, and the reported denominator correct"
  p_typical: 0.2
  grounded: quote
  evidence: "memo.md: 'closed-field questions become aggregate queries over all players (instant)'"
