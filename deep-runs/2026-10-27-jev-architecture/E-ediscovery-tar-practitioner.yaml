  consequence: "A classifier trained on one document population drifts when the population changes; a pre/post comparison on a drifted field attributes the drift to the fix; the re-validation catches that step3_stall's kappa fell from 0.81 to 0.33 on build 1.3"
  p_typical: 0.08
  grounded: quote
  evidence: "memo.md: 'whose result is cached as a new field, so the question set grows from real use'"
