  mechanism: "Changes the query path: a size-based switch between sampled elusion and exhaustive null read; the exhaustive branch materialises the field"
  example: "'Players who muted the tutorial narrator': retrieval 120, null 380 read in 2.5 minutes, 17 more found, retrieval recall was 88%, field materialised"
  cost: S
  depends_on: "parallel coder over observation logs"
  part: query-path
  ingest_cost: S
  query_cost: L
