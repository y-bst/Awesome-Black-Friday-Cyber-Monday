  mechanism: "Changes evaluation: a coverage predicate per modality and a three-valued code (positive, negative, not-coverable)"
  example: "'Players who said the tutorial was confusing': 68 of 360 speaking (19%, CI 15 to 23); 140 silent players excluded; offers 'ask the same of screen-state instead'"
  cost: S
  depends_on: "speech_seconds per session from the transcript stage"
  part: evaluation
  ingest_cost: S
  query_cost: S
  better_than_fixed_table: "The table codes a silent player's video with option 'no complaint' and cannot distinguish silence from satisfaction"
  shallow: false

