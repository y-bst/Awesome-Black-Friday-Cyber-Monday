  mechanism: "Changes schema-evolution: field validity is per (field, build_version), not global"
  example: "'Did the 1.3 fix reduce step-3 stalls?' answers 'step3_stall is not validated on 1.3 (kappa 0.33); protocol needs updating for the moved step' instead of a misleading drop from 31% to 4%"
  cost: M
  depends_on: "build_version on sessions; tar-4 and tar-10"
  part: schema-evolution
  ingest_cost: M
  query_cost: S
  better_than_fixed_table: "The per-game table silently keeps answering old questions on new builds; this detects when a column stopped meaning what it meant"
  shallow: false

- id: tar-26
  title: "Coverage denominator excludes players with no usable evidence for the modality asked: what-said answers report 'n of m players with at least 60 seconds of speech', and silent players are listed as not-coverable rather than negative"
  level: L4
