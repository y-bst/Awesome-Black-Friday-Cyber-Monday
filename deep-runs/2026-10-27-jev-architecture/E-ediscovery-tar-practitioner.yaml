  consequence: "A custodian whose mailbox was never collected is reported as 'not collected', not as 'no responsive documents'; coding silent players negative understates complaint prevalence among speaking players (14% of 500 is 19% of 360) and the studio does not know the question could not be asked of 28% of players"
  p_typical: 0.12
  grounded: quote
  evidence: "spec.md: 'Each video is converted to a transcript. The owner's view: the transcript alone is not enough'"
