- id: tar-21
  title: "Recall and precision targets per question-type stored in the planner: find-players-who requires recall CI lower bound at or above 0.70; how-many requires CI half-width at or below 5 points; otherwise the answer is labelled 'preliminary' and the UI offers to extend the sample"
  level: L4
  cell: {part: query-path, question-type: find-players-who, uncertainty-policy: abstain-below-coverage, evidence-form: recall-estimate, mechanism-type: narrow-or-clarify-the-question, user-segment: studio-analyst}
  object: "memo.md item 2: the query planner with three tiers"
  situation: "A CAL run stops at 150 sessions; the elusion sample is 100 rows and finds 4 positives; recall point 0.80 but CI 0.62 to 0.91"
  consequence: "Courts have accepted 75% recall with a defensible estimate as reasonable; a lower CI bound of 0.62 does not meet it; the planner labels the answer preliminary and offers 200 more elusion rows (about 40 seconds) rather than shipping 0.80 as if it were settled"
  p_typical: 0.05
  grounded: inferred
  evidence: "memo.md: 'The chatbot runs a query planner: closed-field questions become aggregate queries ... open-field questions retrieve ... genuinely new questions trigger a one-time batch extraction'"
  proposed: "Config table {question_type, metric, threshold}; the planner compares after validation; below threshold: status = preliminary, button 'extend sample by N' with projected CI; above: status = validated"
  mechanism: "Changes the query path: a validation gate with per-question-type thresholds, and a loop to extend sampling"
  example: "'Players who skipped the tutorial entirely': preliminary at recall CI 0.62 to 0.91; extended by 200 rows, CI 0.74 to 0.88, validated"
  cost: S
  depends_on: "tar-1 and tar-2"
  part: query-path
  ingest_cost: S
  query_cost: M
