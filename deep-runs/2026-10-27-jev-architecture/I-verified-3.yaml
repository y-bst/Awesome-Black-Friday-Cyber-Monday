  object: 'memo.md item 1: ''timestamped atomic observations ... friction signal'''
  situation: Player 302 shows 14 friction observations between 00:31:05 and 00:38:40 with gaps of 10-40 s; the studio asks
    'how long were players stuck on step 2?'
  consequence: One friction_era 00:31:05-00:38:40 (7m35s, 14 events) answers the question directly; counting raw friction
    events would give '14 frictions' and summing their instants gives nothing
  p_typical: 0.07
  grounded: inferred
  evidence: "memo.md: 'step on screen, action, utterance, friction signal, sentiment, quote with timestamp as evidence' (point observations of friction imply duration-of-stuck questions; collapsing them into episodes is not mentioned)"
  already_offered: false
  proposed: era(player_id, session_id, era_type in {friction, idle, step, affect_negative}, concept_id, start_t_ms, end_t_ms,
    n_events, gap_ms_used=45000); rebuilt when the gap parameter changes
  shallow: false
  mechanism: 'Store: a standardised derived table, computed at ingestion, that turns point observations into episodes with
    a documented gap rule'
  example: Median friction_era length at tutorial_step 2 = 5m10s (n=203 players with any era); 38% of players have an era
