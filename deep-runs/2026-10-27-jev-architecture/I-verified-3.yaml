  object: 'spec.md item 4: ''A chatbot for the gaming studio answers the studio''s questions from that table, so that a question
    over, say, 500 players is fast'''
  situation: Studio asks 'what share of players who hit crafting-menu-confusion in step 4 quit before step 5?'
  consequence: The per-video MCQ table cannot join a free-text concept to the step timeline; the hits table answers with SELECT
    COUNT(DISTINCT player_id) FILTER (quit_step<5) / COUNT(DISTINCT player_id) FROM tracker_hits JOIN step_timeline in under
    1 s
  p_typical: 0.09
  grounded: quote
  evidence: "spec.md: 'so that a question over, say, 500 players is fast.'; 'Reading 500 transcripts per question was too slow and too much data, which is why the fixed-question table exists.'"
  already_offered: false
