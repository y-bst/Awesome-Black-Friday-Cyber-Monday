- id: tar-15
  title: 'Bates-style immutable observation ids with provenance: every observation row has a stable id (game, session, seq)
    plus model_version, prompt_hash, schema_version, and a quote cited in a studio report can be re-found after re-extraction'
  level: L3
  perspective: tar
  cell:
    part: store
    representation: timestamped-observation-log
    extraction-trigger: on-model-upgrade
    modality: speech-transcript
    evidence-form: extraction-provenance-model-and-schema-version
    effort: S-weeks
    user-segment: studio-data-engineer
    subject-domain: onboarding-tutorial
    schema-evolution: model-upgrade-reextract
  object: 'memo.md item 1: ''quote with timestamp as evidence'''
  situation: A producer's slide cites observation 'player 217 at 00:41:12 said the tutorial is endless'; two weeks later ingestion
    re-runs with a new model, timestamps shift by 1 to 3 seconds and the row is re-segmented
  consequence: A production number that cannot be re-found is a defensibility failure; here the studio's cited evidence no
    longer resolves, and nobody can tell whether the quote changed or the model did
  p_typical: 0.09
  grounded: inferred
  evidence: "memo.md: 'quote with timestamp as evidence' (cited evidence implies stable references; re-extraction shifting timestamps and ids is not discussed)"
  already_offered: false
  proposed: obs_id = {game_id}-{session_id}-{seq:06d} assigned once and never reassigned; re-extraction writes new rows with
    new ids and a supersedes link; each row stores model_version, prompt_hash, schema_version, extracted_at; the chatbot cites
    obs_id in every quote; a lookup endpoint resolves any old obs_id to the row and its successors
  mechanism: 'Changes the store: append-only observation rows with supersedes chains; no update-in-place on re-extraction'
  example: Slide cites JEV-A1-0217-004112; after re-ingestion the lookup returns the original row (model v3) and its successor
    (model v4, timestamp 00:41:10, same text)
  cost: S
  depends_on: observation log (memo.md item 1)
  part: store
  ingest_cost: S
  query_cost: S
  better_than_fixed_table: Table cells carry no provenance; a cited quote with a permanent id survives model upgrades and
    schema changes
  shallow: false
