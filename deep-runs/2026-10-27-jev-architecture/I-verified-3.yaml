# Stage G merged leaves, bucket 3 (part: store, ideate run). Rejected: none. Cells normalised against C-axes.yaml.
# Survivors keep their id; absorbed duplicate ids are in `absorbed`, their perspective slugs in `also_from`;
# `variants_of` = same mechanism, different part or scope; refusal rows carry `refusal: true`; `contested_by` lists refusals that collide with a positive.
- id: clinical-1
  title: 'Standard concept vocabulary (concept table: concept_id, domain in {step, mechanic, ui_element, affect, friction,
    churn_event, input_action}, standard_flag) plus a per-game source_to_concept_map (game_id, source_value, target_concept_id,
    similarity, mapped_by); unmapped source values get concept_id 0'
  level: L4
  perspective: clinical
  cell:
    part: store
    representation: common-data-model-with-per-game-vocab-map
    granularity: game
    extraction-trigger: on-new-game-onboarding
    question-origin: genre-template-library
    effort: M-one-quarter
    moment-in-journey: game-onboarding-day-0
    tenancy-and-deployment: logically-isolated-per-studio
    reuse-scope-of-extraction: universal-primitives
    schema-evolution: deprecate-and-migrate
  object: 'spec.md item 3: ''a fixed set of questions with options, written per game target''; memo.md item 3: ''ontology
    (entities x dimensions x outcomes), pruned by the game target'''
  situation: A new studio onboards 'Harbor Tycoon' whose tutorial steps are named tut_01_place_dock, tut_02_hire_crew, tut_03_first_shipment;
    the existing question bank was written for a different game's step names
  consequence: Every question written against standard concepts (concept 4001 'tutorial_step', 4120 'inventory_panel', 7002
    'frustration') runs on Harbor Tycoon the day its 3 step names and 40 UI names are mapped; without the map every game needs
    its own question bank and cross-game questions are impossible
  p_typical: 0.12
  grounded: inferred
  evidence: "spec.md: 'The transcript is run through a fixed set of questions with options, written per game target.'; 'Buyers are gaming studios. Their questions are not known in advance.' (per-game question sets imply each new game needs its own bank; a shared concept vocabulary or per-game name map is not mentioned)"
  already_offered: false
  proposed: Tables concept(concept_id, concept_name, domain_id, standard_flag, valid_start, valid_end), concept_relationship(concept_id_1,
    concept_id_2, relationship in {maps_to, is_a, part_of}), source_to_concept_map(game_id, source_vocabulary, source_value,
    target_concept_id, similarity, mapped_by, valid_start_build, valid_end_build); JEV ops owns the vocabulary, each studio
    owns its map
  shallow: false
  mechanism: 'Store: every observation row carries a concept_id from the shared vocabulary plus the game''s own source_value;
    question generation and the query planner address concepts only; a game is onboarded by filling its map, not by writing
    questions'
  example: Studio asks 'what share of players abandon during the step where they first move a unit?' Planner resolves 'first
    move a unit' to concept 4015 'first_unit_move_step', the map says that is tut_02_hire_crew in Harbor Tycoon, and SELECT
    COUNT(DISTINCT player_id) ... WHERE step_concept_id=4015 AND churn_within_step runs over 500 players in 200 ms
  cost: M
  depends_on: nothing (the vocabulary starts with the concepts the current fixed questions already imply)
  part: store
  ingest_cost: M
  query_cost: S
  better_than_fixed_table: One question bank serves every game; a question written once is answerable on a game onboarded
    tomorrow
