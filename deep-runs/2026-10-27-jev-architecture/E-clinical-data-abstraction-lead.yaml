  situation: "Someone proposes letting the model propose fields per game ('crew_frustration_level', 'dock_confusion') from the data to avoid curating a vocabulary"
  consequence: "Low willingness: this is the pre-CDM situation of every institution coding its own way; 9 games produce 9 incompatible 'frustration' fields, no cross-game question, no reusable phenotype, no validation that transfers; the persona will only accept induced fields as candidate concepts routed into the vocabulary request flow (clinical-25), never as queryable fields in their own right"
  p_typical: 0.05
