- id: clinical-1
  title: "Standard concept vocabulary (concept table: concept_id, domain in {step, mechanic, ui_element, affect, friction, churn_event, input_action}, standard_flag) plus a per-game source_to_concept_map (game_id, source_value, target_concept_id, similarity, mapped_by); unmapped source values get concept_id 0"
  level: L4
  cell: {part: store, representation: common-data-model-with-per-game-vocab-map, granularity: game, reuse-scope-of-extraction: universal-primitives, schema-evolution: deprecate-and-migrate, question-origin: genre-template-library, tenancy-and-deployment: logically-isolated-per-studio}
  object: "spec.md item 3: 'a fixed set of questions with options, written per game target'; memo.md item 3: 'ontology (entities x dimensions x outcomes), pruned by the game target'"
  situation: "A new studio onboards 'Harbor Tycoon' whose tutorial steps are named tut_01_place_dock, tut_02_hire_crew, tut_03_first_shipment; the existing question bank was written for a different game's step names"
  consequence: "Every question written against standard concepts (concept 4001 'tutorial_step', 4120 'inventory_panel', 7002 'frustration') runs on Harbor Tycoon the day its 3 step names and 40 UI names are mapped; without the map every game needs its own question bank and cross-game questions are impossible"
  p_typical: 0.12
  grounded: quote
  evidence: "spec.md: 'Buyers are gaming studios. Their questions are not known in advance.'; A-frame assumption 'per-game hand-written questions do not scale'"
  proposed: "Tables concept(concept_id, concept_name, domain_id, standard_flag, valid_start, valid_end), concept_relationship(concept_id_1, concept_id_2, relationship in {maps_to, is_a, part_of}), source_to_concept_map(game_id, source_vocabulary, source_value, target_concept_id, similarity, mapped_by, valid_start_build, valid_end_build); JEV ops owns the vocabulary, each studio owns its map"
  shallow: false
  mechanism: "Store: every observation row carries a concept_id from the shared vocabulary plus the game's own source_value; question generation and the query planner address concepts only; a game is onboarded by filling its map, not by writing questions"
  example: "Studio asks 'what share of players abandon during the step where they first move a unit?' Planner resolves 'first move a unit' to concept 4015 'first_unit_move_step', the map says that is tut_02_hire_crew in Harbor Tycoon, and SELECT COUNT(DISTINCT player_id) ... WHERE step_concept_id=4015 AND churn_within_step runs over 500 players in 200 ms"
  cost: M
  depends_on: "nothing (the vocabulary starts with the concepts the current fixed questions already imply)"
  part: store
  ingest_cost: M
  query_cost: S
  better_than_fixed_table: "One question bank serves every game; a question written once is answerable on a game onboarded tomorrow"

- id: clinical-2
  title: "Every observation row stores source_value (the game's literal name or on-screen string) next to concept_id, and the chatbot shows both in evidence so a studio can audit a mapping from inside an answer"
  level: L4
  cell: {part: store, representation: common-data-model-with-per-game-vocab-map, evidence-form: extraction-provenance-model-and-schema-version, modality: on-screen-text-ocr, user-segment: studio-data-engineer, granularity: utterance}
  object: "memo.md item 1: 'closed enum fields and short open fields'"
  situation: "The step counter reads 'Dock placement (1/3)' on screen in 480 of 500 players; the mapping assigned it to concept 4001 'tutorial_step' with step_index 1, but one studio designer insists dock placement is pre-tutorial"
  consequence: "Because the row keeps source_value='Dock placement (1/3)' the designer sees exactly which on-screen string was counted and can re-map it; a row holding only concept_id 4001 cannot be argued with and the studio stops trusting the number"
  p_typical: 0.08
  grounded: inferred
  evidence: "spec.md unspecified: 'What a transcript contains (speech only, on-screen text, events)'"
  proposed: "observation(..., concept_id, source_value VARCHAR(200), source_vocabulary in {ocr, speech, telemetry, classifier}, source_concept_id); chatbot evidence card prints 'counted as tutorial_step (from on-screen text: Dock placement (1/3))'"
  shallow: false
  mechanism: "Store: two columns per coded field (source_value, concept_id) instead of one; chatbot UI: evidence card renders the source string under the concept name"
  example: "Answer: '22% of 500 players (110) left during tutorial_step 2. Counted as tutorial_step 2 from on-screen strings: Hire crew (2/3) in 497 players, Crew hiring (2/3) in 3 players (older build)'"
  cost: S
  depends_on: "clinical-1 vocabulary and map"
  part: store
  ingest_cost: S
  query_cost: S
  better_than_fixed_table: "A disputed count can be traced to the literal strings that produced it"

- id: clinical-3
  title: "concept_ancestor table (ancestor_concept_id, descendant_concept_id, min_levels) so a question about 'any inventory UI element' rolls up 11 child concepts in one join without the question author listing them"
  level: L4
  cell: {part: query-path, query-path: sql-over-closed-fields, representation: entity-relation-graph, question-type: how-many, granularity: game-system, latency-tier: under-2s}
  object: "memo.md item 2: 'closed-field questions become aggregate queries over all players (instant)'"
  situation: "Studio asks 'how many players opened anything in the inventory while stuck on step 3?'; the game has 11 inventory-related UI elements (bag, crafting tab, sort button, 8 item slots) each mapped to its own concept"
  consequence: "Planner joins concept_ancestor WHERE ancestor_concept_id=4120 'inventory_panel' and gets all 11 descendants; without hierarchy the planner either lists the 11 by hand (misses the 12th added next build) or falls back to LLM reading"
  p_typical: 0.06
  grounded: quote
  evidence: "memo.md item 3: 'ontology (entities x dimensions x outcomes)' (an ontology with no stated hierarchy table or roll-up query)"
  proposed: "concept_ancestor rebuilt nightly from concept_relationship is_a/part_of edges; planner rewrites 'any X' and 'X or its parts' into an ancestor join; max depth 6"
  shallow: false
  mechanism: "Query path: a transitive-closure table over the concept hierarchy; planner rule: a plural or 'any' noun phrase that resolves to a non-leaf concept expands via ancestor join"
  example: "SELECT COUNT(DISTINCT o.player_id) FROM observation o JOIN concept_ancestor a ON o.concept_id=a.descendant_concept_id WHERE a.ancestor_concept_id=4120 AND o.step_concept_id=4003 AND o.friction_era_id IS NOT NULL returns 143 of 500 in 180 ms"
  cost: S
  depends_on: "clinical-1 concept_relationship edges"
  part: query-path
  ingest_cost: S
  query_cost: S
  better_than_fixed_table: "Questions at any level of the hierarchy (one button, one panel, all UI) answer from the same rows"

- id: clinical-4
  title: "Semi-automatic vocabulary mapper at game onboarding: ingest the design doc, patch notes and 20 pilot sessions, propose a map for every observed source value with a similarity score, studio confirms in a mapping screen; release gate is unmapped rate under 5% of observed source values by frequency"
  level: L4
  cell: {part: collection-protocol, moment-in-journey: game-onboarding-day-0, question-origin: design-doc-patch-notes-store-page-derived, mechanism-type: human-in-the-loop, reuse-scope-of-extraction: universal-primitives, effort: S-weeks, user-segment: game-designer}
  object: "spec.md item 3: 'written per game target'; A-frame assumption 'studios are many and each game differs'"
  situation: "Harbor Tycoon onboarding: 20 pilot sessions surface 312 distinct on-screen strings, 3 step names and 44 UI element labels; the studio designer has 2 hours"
  consequence: "Mapper auto-maps 260 strings at similarity above 0.85, queues 52 for the designer sorted by frequency, and reports unmapped frequency share 3.1% after review; the studio is live on the whole question bank in one afternoon instead of a question-writing project"
  p_typical: 0.07
  grounded: inferred
  evidence: "spec.md: 'Ingestion time and cost are not a concern'; memo.md item 3 does not say how a new game's names reach the ontology"
  proposed: "mapping_candidates(game_id, source_value, freq, top3 [(concept_id, similarity)], status in {auto, confirmed, rejected, unmapped}); screen lists candidates by freq desc; gate: sum(freq of unmapped)/sum(freq) < 0.05 before chatbot opens"
  shallow: false
  mechanism: "Collection protocol: a mapping task runs before question answering; proposals come from embedding similarity of source strings and design-doc context to concept names and synonyms; a human confirms; the gate is a measured coverage number"
  example: "Designer confirms 'Hire crew (2/3)' -> tutorial_step index 2 and 'Dockhand' -> npc_guide; rejects 'Skip' -> tutorial_skip_button (it is a dialogue skip) and maps it to dialogue_skip_button; first question 'where do players churn in the tutorial?' answers the same day"
  cost: M
  depends_on: "clinical-1"
  part: collection-protocol
  ingest_cost: M
  query_cost: S
  better_than_fixed_table: "Onboarding effort is a 2-hour mapping review, not writing and tuning a per-game question set"

- id: clinical-5
  title: "Cohort (phenotype) definition as a versioned JSON artifact: entry event, inclusion rules with time windows, exit rule, era collapse gap; materialised into cohort(cohort_definition_id, player_id, start_t_ms, end_t_ms); 'tutorial churner v3' is one such artifact"
  level: L4
  cell: {part: question-generation, representation: step-funnel-state-machine-per-player, query-path: sql-over-closed-fields, question-type: find-players-who, scope: query-time-defined-cohort, schema-evolution: append-only-versioned-fields, user-segment: studio-analyst}
  object: "spec.md item 3: 'The targets are mostly detecting churn in the tutorial and just after it'"
  situation: "Three studio analysts each ask 'how many players churned in the tutorial' over one week and get 18%, 23% and 31% because each run of the chatbot interprets 'churned' differently (quit to menu, idle 5 min, recording ended)"
  consequence: "With a named definition tutorial_churner_v3 = {entry: tutorial_step index>=1; exit: first of (quit_to_menu, idle_era>=300s, recording_end) before tutorial_complete; exclude: recording_end within 60s of session start} the number is 23% of 500 every time, and the chatbot names the definition and version in the answer"
  p_typical: 0.09
  grounded: quote
  evidence: "spec.md: 'The targets are mostly detecting churn in the tutorial and just after it' (no definition of churn given)"
  proposed: "cohort_definition(id, name, version, json, author, created_at, validation_id); cohort(cohort_definition_id, player_id, start_t_ms, end_t_ms) rebuilt on ingestion; chatbot answers '23% (115/500) by tutorial_churner v3'"
  shallow: false
  mechanism: "Question generation: cohort logic becomes a first-class, shareable, versioned object evaluated by a fixed engine over the observation log; natural-language 'churners' resolves to the studio's pinned default definition"
  example: "Studio asks 'which players churned at the crew-hiring step?' Planner runs cohort tutorial_churner_v3 intersected with step_concept_id=4002 at end_t_ms; returns 41 player_ids with end timestamps in 250 ms"
  cost: M
  depends_on: "clinical-1; an observation log with session-clock timestamps"
  part: question-generation
  ingest_cost: S
  query_cost: S
  better_than_fixed_table: "'Churn' means one reproducible thing per studio, shareable across games, instead of whatever the per-video question happened to encode"

- id: clinical-6
  title: "Every cohort definition ships a validation record: positive predictive value and sensitivity from hand review of 50 sampled members and 50 sampled non-members, with 95% CI; the chatbot prints 'PPV 0.92 (46/50), sensitivity 0.84' under any count that uses the cohort"
  level: L4
  cell: {part: evaluation, evidence-form: recall-estimate, uncertainty-policy: answer-with-ci-and-n, question-type: how-many, mechanism-type: human-in-the-loop, user-segment: ux-researcher}
  object: "memo.md item 3: 'judged by two tests: coverage of real studio questions and accuracy against hand-labelled sessions'"
  situation: "A producer is about to re-cut the crew-hiring step on the strength of '23% churn there'; the cohort was defined last week and never checked"
  consequence: "The validation record says PPV 0.92 and sensitivity 0.84 on 100 reviewed sessions, so the true rate is bounded roughly 21% to 27%; a cohort with PPV under 0.80 is flagged 'not validated for decisions' and the producer sees that flag before re-cutting"
  p_typical: 0.05
  grounded: quote
  evidence: "memo.md item 3: 'accuracy against hand-labelled sessions'"
  proposed: "cohort_validation(cohort_definition_id, version, n_pos_reviewed, tp, n_neg_reviewed, fn, ppv, sens, ci_low, ci_high, reviewer, reviewed_at); release gate PPV >= 0.80 for a 'validated' badge"
  shallow: false
  mechanism: "Evaluation: a stratified sample (50 in, 50 out) per cohort version is reviewed by a human with the clips; the resulting PPV and sensitivity are stored with the definition and surfaced with every answer that uses it"
  example: "Answer: '23% (115/500) are tutorial_churner v3. Validation: PPV 0.92 (46/50), sensitivity 0.84 (42/50), reviewed 2026-10-20 by JEV ops. Adjusted estimate 21-27%.'"
  cost: M
  depends_on: "clinical-5; a clip viewer for reviewers"
  part: evaluation
  ingest_cost: S
  query_cost: S
  better_than_fixed_table: "A number arrives with a measured error, not an implied certainty"

- id: clinical-7
  title: "Phenotype library of 30 genre-shared cohort definitions written against standard concepts (tutorial_churner, skip_tutorial, stuck_on_step_over_3min, never_opened_map, rage_quit_after_death_streak) that run unchanged on any game once its map exists, giving day-0 answers"
  level: L3
  cell: {part: question-generation, question-origin: genre-template-library, reuse-scope-of-extraction: genre-shared, moment-in-journey: game-onboarding-day-0, mechanism-type: transfer-across-games, subject-domain: onboarding-tutorial, scope: cross-game}
  object: "memo.md item 3: 'Questions are generated from an ontology ... pruned by the game target'"
  situation: "Harbor Tycoon's first 120 sessions land on day 1; the studio has not asked anything yet"
  consequence: "All 30 library cohorts are materialised overnight; the first studio question 'anything odd in the tutorial?' is answered from library counts (stuck_on_step_over_3min: 38% at step 2 vs library median 12% across 9 city-builders) rather than by a fresh extraction"
  p_typical: 0.08
  grounded: inferred
  evidence: "A-frame assumption: 'studios are many and each game differs, so per-game hand-written questions do not scale'"
  proposed: "library/ folder of cohort JSON with genre tags, each with a validation record on at least 2 games; nightly job materialises every library cohort for every game whose map covers its concepts; coverage flag per (game, cohort)"
  shallow: false
  mechanism: "Question generation: reusable cohort logic replaces per-game questions; the library grows when a studio-written definition is generalised by replacing game-specific concepts with standard ones"
  example: "Day 1 report for Harbor Tycoon: 30 cohort prevalences with denominators; 'stuck_on_step_over_3min at tutorial_step 2: 46/120 (38%)' is the top outlier against genre medians"
  cost: M
  depends_on: "clinical-1, clinical-5"
  part: question-generation
  ingest_cost: S
  query_cost: S
  better_than_fixed_table: "Thirty validated questions answer on a new game before anyone writes one"

- id: clinical-8
  title: "Source-span constraint: an extracted value is rejected at write time unless it carries evidence_span (video_id, t_start_ms, t_end_ms, modality, verbatim snippet up to 200 chars or frame_id); fields that cannot cite a span are stored as 'not documented', never as a value"
  level: L4
  cell: {part: ingestion-extraction, evidence-form: quote-with-timestamp, representation: timestamped-observation-log, uncertainty-policy: abstain-below-coverage, modality: speech-transcript, extraction-trigger: at-ingestion}
  object: "memo.md item 1: 'quote with timestamp as evidence'"
  situation: "The extractor answers 'player felt confused by the crew UI: yes' for a session where the player never speaks and the crew UI is never on screen"
  consequence: "The write is rejected (no span); the field is 'not documented' for that session and drops out of the denominator; the studio never sees a hallucinated yes, and the unsupported-claim rate becomes measurable (rejected writes per 1,000)"
  p_typical: 0.22
  grounded: quote
  evidence: "memo.md item 1: 'quote with timestamp as evidence'"
  proposed: "CHECK constraint evidence_span IS NOT NULL on observation and field_values; rejected_writes(extractor_run_id, field_id, reason) counted per run; span verified by re-reading the cited window (snippet must appear in transcript within the window, frame_id must exist)"
  shallow: false
  mechanism: "Ingestion: abstraction-with-evidence as a hard schema rule, with mechanical verification that the cited span exists and contains the snippet"
  example: "Field 'quit_reason' for player 217: value 'controls' with span (video 3, 00:04:12-00:04:19, speech, 'these controls are so clunky I am done'); for player 304 the extractor cites a window with no speech, the write is rejected and quit_reason='not documented'"
  cost: S
  depends_on: nothing
  part: ingestion-extraction
  ingest_cost: S
  query_cost: S
  better_than_fixed_table: "No answer exists in the store that cannot be shown on a timeline"

- id: clinical-9
  title: "Transcript term table modelled on NOTE_NLP: one row per detected concept mention with offset, lexical_variant, negated, temporality in {present, past, hypothetical}, certainty, experiencer in {player, npc, stream_chat, other_voice}; prevalence queries exclude negated and hypothetical by default"
  level: L4
  cell: {part: ingestion-extraction, modality: speech-transcript, question-type: prevalence-of-quoted-sentiment, representation: timestamped-observation-log, granularity: utterance, query-path: sql-over-closed-fields}
  object: "spec.md item 2: 'Each video is converted to a transcript'"
  situation: "Studio asks 'how many players said they would quit?'; transcripts contain 'I'd quit if this took any longer' (hypothetical), 'I didn't quit, I just alt-tabbed' (negated), and the NPC guide's line 'don't quit now!' (experiencer npc)"
  consequence: "A keyword count returns 212 of 500; the term table with modifiers returns 37 present, non-negated, player-experienced mentions, and the chatbot can show the 175 excluded with their modifier"
  p_typical: 0.05
  grounded: inferred
  evidence: "spec.md unspecified: 'What a transcript contains'"
  proposed: "transcript_term(session_id, video_id, t_ms, offset_start, offset_end, lexical_variant, concept_id, negated BOOL, temporality, certainty in {certain, probable, possible}, experiencer, extractor_run_id); default query filter negated=false AND temporality='present' AND experiencer='player'"
  shallow: false
  mechanism: "Ingestion: a concept-mention pass over the transcript writes modifiers alongside the mention; the query planner applies the default modifier filter and reports what it excluded"
  example: "Answer: '37 of 500 players (7.4%) stated an intent to quit during the tutorial. Excluded: 118 hypothetical, 31 negated, 26 spoken by the NPC guide.' with 37 timestamped quotes"
  cost: M
  depends_on: "speaker attribution between player voice and in-game voice lines"
  part: ingestion-extraction
  ingest_cost: M
  query_cost: S
  better_than_fixed_table: "'How many said X' stops counting people who said not-X or if-X"

- id: clinical-10
  title: "Inter-abstractor agreement as the release gate: 10% of sessions are double-extracted by two independent configurations (different model or prompt), Cohen's kappa per field; a field is exposed to the chatbot only when kappa is at least 0.70 over at least 50 double-extracted sessions"
  level: L4
  cell: {part: evaluation, uncertainty-policy: abstain-below-coverage, extraction-trigger: on-low-confidence-or-disagreement, evidence-form: confidence-score, question-origin: ontology-generated, user-segment: jev-internal-ops}
  object: "memo.md item 3: 'each with an answer type and an evidence requirement'"
  situation: "The ontology generates 400 candidate fields for Harbor Tycoon; 90 of them ('player seemed bored', 'UI felt cluttered') are judgement calls the two extractors agree on at kappa 0.3"
  consequence: "The 90 low-kappa fields are withheld or shown with a 'low agreement (kappa 0.31)' badge; the studio never bases a decision on a field that two readers of the same video would not agree on; the ontology learns which dimension types are unreliable"
  p_typical: 0.08
  grounded: inferred
  evidence: "memo.md item 3: 'accuracy against hand-labelled sessions' (accuracy only, no agreement metric)"
  proposed: "agreement(field_id, field_version, n_double, kappa, ci_low, computed_at); field_status in {released, badge_low_agreement, withheld}; double extraction sample chosen by stratified random over games and session length"
  shallow: false
  mechanism: "Evaluation: a continuous 10% double-abstraction sample yields a per-field reliability number that gates exposure, mirrors registry abstraction QA"
  example: "Field 'quit_reason' kappa 0.81 (n=62) released; field 'felt_bored' kappa 0.29 (n=58) withheld; chatbot, asked 'were players bored?', replies that the field is withheld for low agreement and offers idle_era and silence stats instead"
  cost: M
  depends_on: "clinical-8 so disagreements can be inspected by span"
  part: evaluation
  ingest_cost: M
  query_cost: S
  better_than_fixed_table: "Unreliable questions are measured and withheld rather than answered with the same confidence as reliable ones"

- id: clinical-11
  title: "Adjudication queue: the double-extraction disagreements from clinical-10 are routed to a human abstractor with both spans side by side; adjudicated labels become the gold set and each adjudication writes a decision rule into the field's abstraction manual"
  level: L4
  cell: {part: feedback-loop-from-query-log, mechanism-type: human-in-the-loop, user-segment: jev-internal-ops, evidence-form: clip, extraction-trigger: on-low-confidence-or-disagreement, delivery-surface: notebook}
  object: "memo.md item 3: 'accuracy against hand-labelled sessions'"
  situation: "Extractor A says quit_reason='difficulty', extractor B says 'controls' for player 217 at 00:04:12; the player said 'these controls are so clunky I keep dying'"
  consequence: "Adjudicator picks 'controls' and adds rule 'when a control complaint is given as the cause of deaths, code controls not difficulty' to the manual; next extractor version agrees on this pattern; gold set grows by 1 without a separate labelling project"
  p_typical: 0.06
  grounded: inferred
  evidence: "memo.md item 3 (hand-labelled sessions exist but no process for producing them is given)"
  proposed: "adjudication(field_id, session_id, value_a, span_a, value_b, span_b, decision, rule_text, adjudicator, decided_at); target throughput 40 items per hour per adjudicator; rules appended to manual (clinical-12)"
  shallow: false
  mechanism: "Feedback loop: disagreement, not random sampling, selects what humans look at; each decision is written back as a rule and a gold label"
  example: "Weekly queue for Harbor Tycoon: 84 disagreements, 2 hours of adjudication, 11 new decision rules, kappa for quit_reason rises from 0.72 to 0.86 on the next double-extraction sample"
  cost: M
  depends_on: "clinical-10"
  part: feedback-loop-from-query-log
  ingest_cost: M
  query_cost: S
  better_than_fixed_table: "The fixed table has no mechanism to learn from its own errors; this one converts each disagreement into a rule"

- id: clinical-12
  title: "Abstraction manual per field as the extraction prompt: definition, allowed values, 3 positive and 3 negative worked examples, decision rules, and an explicit 'not documented' rule; manual_version is stored on every value and the manual is diffable"
  level: L4
  cell: {part: question-generation, schema-evolution: append-only-versioned-fields, evidence-form: extraction-provenance-model-and-schema-version, question-origin: ontology-generated, extraction-trigger: on-new-field-added, build-or-buy: build-in-house}
  object: "memo.md item 3: 'each with an answer type and an evidence requirement'"
  situation: "Field 'quit_reason' changes meaning in week 6 when 'controls' is split into 'controls_input' and 'controls_camera'; 1,200 sessions carry the old value"
  consequence: "Old rows carry manual_version 2, new rows 3; the chatbot either reports the two versions separately or re-extracts the 1,200 under v3; a prompt kept in a code file without a version would silently mix definitions in one count"
  p_typical: 0.07
  grounded: inferred
  evidence: "memo.md item 2: 'cached as a new field, so the question set grows from real use'"
  proposed: "field_manual(field_id, manual_version, definition, allowed_values[], examples_pos[3], examples_neg[3], rules[], not_documented_rule, created_at); extraction prompt is rendered from the manual; field_values.manual_version NOT NULL"
  shallow: false
  mechanism: "Question generation: an ontology-generated question is not released until it has a manual with examples and a not-documented rule; the manual is the prompt and the audit document"
  example: "quit_reason v3 manual: allowed {difficulty, controls_input, controls_camera, boredom, bug, external, not_documented}; rule 4: 'code external when the player says they must leave for a reason outside the game'; chatbot answer footer: 'quit_reason manual v3, extractor run 2026-10-24-b'"
  cost: S
  depends_on: nothing
  part: question-generation
  ingest_cost: S
  query_cost: S
  better_than_fixed_table: "Every value is traceable to a definition with examples, and definition drift is visible instead of silent"

- id: clinical-13
  title: "Three-valued missingness on every field: {value, absent, not_observable, not_abstracted}; denominators exclude not_observable and not_abstracted, and every count prints the three exclusion counts"
  level: L4
  cell: {part: store, uncertainty-policy: answer-with-ci-and-n, evidence-form: coverage-statement-n-of-m-players, question-type: how-many, modality: silence-or-absence-of-speech, latency-tier: under-2s}
  object: "spec.md item 4: 'a question over, say, 500 players is fast'"
  situation: "Studio asks 'what share of players complained about the camera?'; 140 of 500 players have no microphone audio, 60 sessions were ingested before the camera field existed"
  consequence: "Answer is 38/300 (12.7%) with 'not observable: 140 (no speech audio), not yet extracted: 60'; a two-valued store would report 38/500 (7.6%) and the studio under-prioritises the camera"
  p_typical: 0.06
  grounded: inferred
  evidence: "spec.md unspecified: 'What a transcript contains (speech only, on-screen text, events)'"
  proposed: "field_values.status in {value, absent, not_observable, not_abstracted}; not_observable set from observation_period (clinical-14) per modality required by the field's manual; chatbot template 'X of N (p%); excluded: a not observable, b not extracted'"
  shallow: false
  mechanism: "Store: a status column distinguishes 'we looked and it was not there' from 'we could not look' from 'we have not looked'; query path uses status to build denominators"
  example: "Harbor Tycoon camera complaint: 38 of 300 observable (12.7%, CI 9.3-17.0); 140 not observable (no mic); 60 not abstracted (ingested before field v1), backfill queued"
  cost: S
  depends_on: "clinical-14 for not_observable"
  part: store
  ingest_cost: S
  query_cost: S
  better_than_fixed_table: "Percentages are over players who could have shown the thing, not over everyone"

- id: clinical-14
  title: "observation_period table per player and modality: time ranges where recording was on, game in foreground, speech audio present, webcam present; every rate uses observable time or observable players as its denominator"
  level: L4
  cell: {part: session-stitching, granularity: session, modality: silence-or-absence-of-speech, representation: time-series-signals-affect-pace-silence, question-type: how-long, evidence-form: count-with-denominator}
  object: "spec.md item 1: 'A session can be n hours; each video is capped at 15 minutes, so one session is many videos'"
