  evidence: "A-frame assumption: 'studios are many and each game differs'"
  proposed: "If pursued at all: induced fields land in candidate_concept(game_id, proposed_name, examples[], freq) and are promoted to the shared vocabulary by ops with a manual; never exposed to the chatbot directly"
  shallow: false
  mechanism: "Store: refusal of schema inference as a representation; induced names are candidates for the vocabulary, not columns"
  example: "Harbor Tycoon induces 'dock_confusion'; Forge Quest induces 'forge_confusion'; the question 'where are players confused across our games?' is impossible until both are mapped to concept ui_confusion with target element"
  cost: S
  depends_on: "clinical-1"
  part: store
  ingest_cost: S
  query_cost: S
  better_than_fixed_table: "Not better: it recreates the per-game question set problem with machine-written names"

- id: clinical-29
  title: "REFUSED by this persona: the chatbot emitting a count or percentage produced by retrieval-then-LLM reading of rows under an undefined cohort ('about 18% of players seemed to churn')"
  level: L3
  cell: {part: query-path, query-path: retrieval-then-llm, uncertainty-policy: always-answer, question-type: how-many, evidence-form: none, user-segment: producer-exec}
  object: "memo.md item 2: 'open-field questions retrieve matching observation rows across players and the model reads only those'"
  situation: "Studio asks 'what share of players churned because of the controls?'; the planner retrieves 160 rows and asks the model for a share"
  consequence: "Low willingness: a percentage with no definition, no denominator statement and no validation record is a number the studio will quote in a meeting and later find wrong; the persona allows retrieval-then-LLM for narrative answers (what did players say) but requires any count to resolve to a defined cohort or field with status counts (clinical-5, clinical-13); otherwise the chatbot answers 'I can show 160 matching quotes; to give a share I need a definition' and offers the form (clinical-27)"
  p_typical: 0.07
  grounded: quote
  evidence: "memo.md item 2"
  proposed: "Planner rule: numeric answer types (count, share, median) must bind to a cohort_definition_id or field_id; the LLM path may only produce lists, quotes and summaries"
  shallow: false
  mechanism: "Query path: a type rule separating defined-quantity questions from narrative questions"
  example: "Question 'share churned due to controls' -> 'quit_reason=controls_input OR controls_camera among tutorial_churner v3: 27/115 (23.5%); 40 churners have quit_reason not documented' rather than 'about 18%'"
  cost: S
  depends_on: "clinical-5, clinical-12"
  part: query-path
  ingest_cost: S
  query_cost: S
  better_than_fixed_table: "Not better as proposed; the fixed table at least has a stated definition per column"

- id: clinical-30
  title: "REFUSED by this persona: cross-studio benchmarks built by pooling raw observation rows, quotes or clips in a shared multi-tenant table"
  level: L3
  cell: {part: tenancy-access-control, tenancy-and-deployment: shared-multi-tenant, scope: cross-studio-benchmark, representation: timestamped-observation-log, user-segment: publisher-portfolio}
  object: "spec.md: 'Buyers are gaming studios'"
  situation: "To make genre benchmarks fast, someone proposes one observation table across all games with a game_id column and row-level filters"
  consequence: "Low willingness: one filter bug exposes pre-release footage quotes of one studio to another; the persona accepts cross-studio aggregates only through the network-study path (clinical-21) with minimum cell size 5 and hashed game ids, which costs a nightly batch instead of a 200 ms query"
  p_typical: 0.05
  grounded: inferred
  evidence: "spec.md: 'Buyers are gaming studios' (competing tenants); nothing in memo.md on isolation"
  proposed: "Benchmarks served only from results tables produced by per-tenant package runs; raw tables physically or logically isolated per studio"
  shallow: false
  mechanism: "Tenancy: refusal of row pooling; aggregates-only exchange"
  example: "Genre median 'stuck at step 2' = 12% computed from 9 per-tenant result rows, refreshed nightly; no row of Harbor Tycoon is readable from another tenant's planner"
  cost: S
  depends_on: "clinical-21"
  part: tenancy-access-control
  ingest_cost: S
  query_cost: M
  better_than_fixed_table: "Not applicable; this is a constraint on how benchmarks may be built"

- id: clinical-31
  title: "Mapping coverage statement printed with every concept-level answer: 'concept inventory_panel covers 14 of 17 inventory-related source strings observed in this game; 3 unmapped (listed)' so a count is read with its vocabulary gap"
  level: L4
  cell: {part: chatbot-ui, evidence-form: coverage-statement-n-of-m-players, uncertainty-policy: answer-with-ci-and-n, representation: common-data-model-with-per-game-vocab-map, user-segment: studio-analyst, latency-tier: under-2s}
  object: "memo.md item 2: 'closed-field questions become aggregate queries over all players (instant)'"
  situation: "Build 1.3 added a 'Warehouse' tab under inventory; its string is still concept 0; the analyst asks about inventory use"
  consequence: "Answer: '143 of 500 opened the inventory during step 3. Coverage: 14 of 17 inventory strings mapped; unmapped: Warehouse (seen in 61 players), Sort by weight (12), Quick sell (4). Map them?'; the analyst knows 61 players may be missing and can fix it in one click"
  p_typical: 0.05
  grounded: inferred
  evidence: "spec.md: 'The question set is small, so most of what is in the video and transcript is never captured'"
  proposed: "Planner computes, for each concept subtree used in a query, the set of source strings in the game that share a parent by co-occurrence or embedding similarity above 0.8 and are concept 0; prints counts; link to mapping screen (clinical-4)"
  shallow: false
  mechanism: "Chatbot UI: an explicit vocabulary-coverage footer, the analogue of reporting unmapped source codes in a CDM study"
  example: "After mapping Warehouse, the same question returns 171 of 500 (34.2%) and coverage 15 of 17"
  cost: S
  depends_on: "clinical-1, clinical-4"
  part: chatbot-ui
  ingest_cost: S
  query_cost: S
  better_than_fixed_table: "A count tells the reader what it could not see"

- id: clinical-32
  title: "Measurement table for quantities separate from the observation table for events: (player_id, t_ms, measurement_concept_id, value_as_number, unit_concept_id, value_as_concept_id, evidence_span) for time-in-step seconds, attempt counts, HUD-read resources and health"
  level: L4
  cell: {part: store, question-type: how-many, granularity: tutorial-step, modality: on-screen-text-ocr, representation: common-data-model-with-per-game-vocab-map, query-path: sql-over-closed-fields}
  object: "memo.md item 1: 'closed enum fields and short open fields'"
  situation: "Studio asks 'how much gold did players have when they churned at crew hiring?' and 'how many hire attempts before giving up?'"
  consequence: "Both are AVG/percentile queries over measurement joined to churn_event; with quantities stored as open text ('had some gold', 'tried several times') the planner must parse 500 strings at query time"
  p_typical: 0.08
  grounded: quote
  evidence: "memo.md item 1: 'short open fields' (quantities would land there without a typed table)"
  proposed: "measurement(player_id, session_id, t_ms, measurement_concept_id, value_as_number DOUBLE, unit_concept_id, value_as_concept_id, source_value, evidence_span); HUD OCR writes gold, health, crew_count every 10 s; counters from input events"
  shallow: false
  mechanism: "Store: numeric observations get a typed table with units, as in a clinical measurement table, so 'how many / how much' is arithmetic"
  example: "Median gold at churn (step 2) = 40 (IQR 25-55, n=41) vs median gold of completers at the same step 120; hire attempts before giving up: median 3 (n=47)"
  cost: S
  depends_on: "HUD OCR at a fixed cadence; clinical-1 concepts for measurements"
  part: store
  ingest_cost: M
  query_cost: S
  better_than_fixed_table: "Quantities are numbers with units, not multiple-choice bins chosen before the question was known"

- id: clinical-33
  title: "Affect coded as a standard vocabulary with modifiers rather than a free sentiment string: affect_concept in 12 values (frustration, confusion, boredom, delight, surprise, ...), intensity 1-3, target_concept_id (the UI element, step, mechanic or self), source modality in {speech, prosody, webcam}; 'frustration at crew UI' and 'frustration at own play' are different rows"
  level: L4
  cell: {part: ingestion-extraction, question-type: how-felt, modality: audio-non-speech, subject-domain: player-affect, representation: common-data-model-with-per-game-vocab-map, evidence-form: quote-with-timestamp}
  object: "memo.md item 1: 'friction signal, sentiment'"
  situation: "Studio asks 'are players frustrated by the crew UI or by the difficulty?'"
  consequence: "GROUP BY target_concept_id over affect rows at step 2: ui_element crew_panel 61 players, mechanic crew_cost 23, self 18; a single 'sentiment: negative' field cannot separate these and a free string ('annoyed at hiring thing') cannot be grouped"
  p_typical: 0.07
  grounded: quote
  evidence: "memo.md item 1: 'sentiment' (one dimension, no target)"
  proposed: "affect(player_id, t_ms, affect_concept_id, intensity, target_concept_id, modality, evidence_span, extractor_run_id); manual (clinical-12) with 3 examples per affect concept; kappa gate (clinical-10) per affect concept"
  shallow: false
  mechanism: "Ingestion: affect as a coded concept with a target link into the same vocabulary as steps and UI elements"
  example: "Answer: 'Frustration at step 2 in 102 of 500 players: 61 directed at crew_panel, 23 at crew cost, 18 at own play; 5 clips per target'"
  cost: M
  depends_on: "clinical-1; prosody or webcam signals optional"
  part: ingestion-extraction
  ingest_cost: M
  query_cost: S
  better_than_fixed_table: "'How did they feel' answers with a target and a count, not a per-video sentiment option"

- id: clinical-34
  title: "Re-abstraction audit: each month a random 2% of sessions per game is re-extracted with the current certified extractor and compared field by field with stored values; a field whose disagreement exceeds 5% triggers a full re-extract of that field and a note on every answer using it until done"
  level: L4
  cell: {part: feedback-loop-from-query-log, extraction-trigger: scheduled-batch, schema-evolution: model-upgrade-reextract, evidence-form: extraction-provenance-model-and-schema-version, moment-in-journey: steady-state-weekly, user-segment: jev-internal-ops}
  object: "memo.md item 2: 'whose result is cached as a new field'"
  situation: "A vocabulary change in week 10 shifted how 'help opened' is coded; cached values from weeks 1-9 drift from what the current extractor would write"
  consequence: "Audit on 82 sessions: help_opened disagreement 11% (threshold 5%); full re-extract queued for 4,100 sessions; chatbot footer 'help_opened under re-extraction, 11% drift measured 2026-11-02' until complete"
  p_typical: 0.05
  grounded: quote
  evidence: "memo.md item 2 (cached fields with no stated expiry or audit)"
  proposed: "reabstraction_audit(month, game_id, field_id, n, disagreement_rate); threshold 0.05; re-extract job per field; answer footer reads field_status"
  shallow: false
  mechanism: "Feedback loop: cached extractions have a measured shelf life, checked by periodic re-abstraction, as registries re-abstract a sample"
  example: "October audit, Harbor Tycoon: 14 fields under 2% drift, quit_reason 3.8%, help_opened 11% -> re-extract"
  cost: S
  depends_on: "clinical-26 certified extractor; clinical-12 manual versions"
  part: feedback-loop-from-query-log
  ingest_cost: M
  query_cost: S
  better_than_fixed_table: "Stale cached answers are detected and replaced, rather than served forever"

- id: clinical-35
  title: "Abstraction window protocol per subject domain: for onboarding-tutorial questions the dense, double-extracted window is first launch to tutorial_complete or churn_event plus 10 minutes; outside the window extraction runs at single pass; the window boundaries are stored per player so coverage statements can say 'inside window'"
  level: L4
  cell: {part: cost-governance, subject-domain: onboarding-tutorial, granularity: variable-length-moment-or-episode, mechanism-type: narrow-or-clarify-the-question, evidence-form: coverage-statement-n-of-m-players, extraction-trigger: at-ingestion}
  object: "spec.md item 1: 'A session can be n hours'; item 3: 'detecting churn in the tutorial and just after it'"
  situation: "A 4-hour session where the tutorial ends at 00:38; the double-extraction sample (clinical-10) and the 200-char evidence spans are costly over 3 h 20 m of mid-game play nobody asks about yet"
  consequence: "Window 00:00-00:48 gets double extraction, affect at 10 s cadence and HUD measurements; 00:48-04:00 gets single-pass observations only; the churn kappa is computed where it matters and the answer footer states 'tutorial window: 500 of 500 players fully observed'"
  p_typical: 0.06
  grounded: quote
  evidence: "spec.md: 'Ingestion time and cost are not a concern' (persona reads this as: spend it where agreement is measured, not uniformly)"
  proposed: "abstraction_window(player_id, domain, start_t_ms, end_t_ms, rule_version); extraction config per domain {density, double_extract BOOL, measurement_cadence_s}; a mid-game question later triggers a window for 'core-loop' with its own rules"
  shallow: false
  mechanism: "Cost governance: extraction density and QA are defined per subject-domain window, like an abstraction protocol's data-collection window, and the window is recorded"
  example: "Tutorial window median 41 min over 500 players; outside-window observations exist at single pass, so 'what happened at hour 3' still answers but is marked single-pass, kappa unmeasured"
  cost: S
  depends_on: "clinical-15 step eras to find tutorial_complete; clinical-16 churn_event"
  part: cost-governance
  ingest_cost: M
  query_cost: S
  better_than_fixed_table: "QA effort concentrates where the studio's named target lives, and the answer says whether it was inside the QA'd window"
