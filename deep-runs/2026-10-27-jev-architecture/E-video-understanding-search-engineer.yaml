  object: "memo.md item 2: 'result is cached as a new field'"
  situation: "The video-text model is upgraded (vidsearch-16); 30 studio-defined trackers have thresholds tuned to the old vector space and would silently change their counts"
  consequence: "Every tracker is re-fitted from its stored positive and negative shot ids; a studio sees 'tracker climb-wall: precision 0.91 to 0.93, count 206 to 211' before the switch; answers carry model_version"
  p_typical: 0.07
  grounded: "quote"
  evidence: "memo.md item 2: 'cached as a new field'; spec.md 'Unspecified' includes nothing on versioning"
  proposed: "shot_embeddings keyed by (shot_id, model_version); trackers store example ids not vectors; migration job re-fits and writes a diff report per studio"
  shallow: false
  part: "store"
  mechanism: "Dual-index period; lazy re-embed on first query touching an old cohort; tracker re-fit and diff; retire old index when 100% of touched cohorts are migrated"
  example: "After upgrade, 'how many players tried the wall at step 3?' answers 211 of 500 (model v2, previously 206 under v1), with the diff visible in the answer footer"
  cost: "S"
  ingest_cost: "M"
  query_cost: "S"
  better_than_fixed_table: "Counts survive model changes with a measured delta; the table silently changes when its model does"
  depends_on: "vidsearch-14, vidsearch-16"

- id: "vidsearch-29"
  title: "Time-coded sidecar export per video (WebVTT for speech, OCR and captions; JSON for events, cues and shots) keyed by the studio's player id, so the studio's own video tools and MAM can scrub the footage with JEV's tracks"
  level: "L4"
  cell: {part: "export-integration", delivery-surface: "warehouse-share-or-export", tenancy-and-deployment: "export-only-no-hosting", user-segment: "studio-data-engineer", representation: "timestamped-observation-log", effort: "XS-days", build-or-buy: "open-source-component"}
  object: "spec.md 'Unspecified': 'how videos of one session are linked'"
  situation: "A studio's UX team uses its own video review tool and wants JEV's events on the scrub bar rather than in a chatbot"
  consequence: "Each 15-minute file ships with 4 sidecars; the studio opens any session in its own tool and jumps between deaths, stuck moments and prompts without JEV hosting anything"
  p_typical: 0.05
  grounded: "quote"
  evidence: "spec.md: 'Unspecified ... how videos of one session are linked'"
  proposed: "Export job writes {video_id}.speech.vtt, {video_id}.ocr.vtt, {video_id}.captions.vtt, {video_id}.events.json with both video offset and session offset; manifest.json links the files of a session in order"
  shallow: false
  part: "ui"
  mechanism: "Track-to-VTT conversion on the video clock; manifest with session order and gaps; delivered to the studio's bucket"
  example: "A studio researcher opens session 0417 in their review tool, jumps to the 4 death markers in step 4, and writes the ticket from the scrub bar; no chatbot question typed"
  cost: "XS"
  ingest_cost: "S"
  query_cost: "S"
  better_than_fixed_table: "The table is not time-coded and cannot be laid on a timeline; sidecars can"
  depends_on: "vidsearch-1, vidsearch-4"

- id: "vidsearch-30"
  title: "Coverage line on every visual answer: players_with_indexed_shots / players_in_filter, shots_searched, sample_density and the benchmark recall for the query family, with abstention when fewer than 80% of players in the filter have an indexed step"
  level: "L4"
  cell: {part: "chatbot-ui", evidence-form: "coverage-statement-n-of-m-players", uncertainty-policy: "abstain-below-coverage", question-type: "how-many", delivery-surface: "chatbot", effort: "XS-days", mechanism-type: "narrow-or-clarify-the-question"}
  object: "spec.md step 4: 'A chatbot for the gaming studio answers the studio's questions from that table'"
  situation: "A by-example count over a cohort where 140 of 500 sessions are still being embedded would silently report 118 players as if from 500"
  consequence: "The chatbot says 'indexed 360 of 500 players; 118 found; recall for this query family 0.72' or abstains with an ETA when under 80% are indexed"
  p_typical: 0.12
  grounded: "quote"
  evidence: "memo.md item 3: 'each with an answer type and an evidence requirement'"
  proposed: "Answer envelope {n_players_filter, n_players_indexed, n_found, shots_searched, model_version, benchmark_recall, abstained: bool, eta_s}"
  shallow: false
  part: "ui"
  mechanism: "Counts read from index metadata, not from the model; abstention rule evaluated before any search"
  example: "'How many players hesitated at the bench?' during ingestion -> 'Only 360 of 500 players indexed (ETA 40 min); partial answer withheld'; after ingestion -> '118 of 500 (recall about 0.72)'"
  cost: "XS"
  ingest_cost: "S"
  query_cost: "S"
  better_than_fixed_table: "The table's chatbot reports counts without saying what was searched; this never does"
  depends_on: "vidsearch-2, vidsearch-17"

- id: "vidsearch-31"
  title: "Per-step 'canonical moment' thumbnail strip in the chatbot: for any step-scoped answer, show the medoid shot thumbnail per cohort plus the 3 most divergent shots, so the studio sees what 'normal' and 'off' look like before reading numbers"
  level: "L4"
  cell: {part: "chatbot-ui", delivery-surface: "chatbot", evidence-form: "clip-montage-n-examples", question-type: "compare-steps", granularity: "tutorial-step", user-segment: "game-designer", effort: "XS-days"}
  object: "spec.md step 4: 'A chatbot for the gaming studio answers the studio's questions'"
  situation: "A text answer 'step 4 has 31% drop-off' leaves the designer unsure what players were looking at"
  consequence: "Every step answer carries a 4-thumbnail strip (medoid plus 3 outliers) that opens into clips; the designer recognises the rope bridge instantly"
  p_typical: 0.09
  grounded: "quote"
  evidence: "spec.md: 'what is on screen is largely lost'"
  proposed: "Precomputed per (game, step_id, cohort): medoid_shot_id and 3 max-distance shot ids; rendered as thumbnails with timecodes in the answer card"
  shallow: false
  part: "ui"
  mechanism: "Nightly medoid and outlier computation over step shot vectors; answer renderer attaches the strip when the answer is step-scoped"
  example: "'Which step loses the most players?' -> 'Step 4 (31%)' with a strip: medoid shows the rope bridge; outliers show a player in the settings menu, one on the map, one at the wrong ledge"
  cost: "XS"
  ingest_cost: "S"
  query_cost: "S"
  better_than_fixed_table: "The answer shows the screen; the table has no image"
  depends_on: "vidsearch-2, vidsearch-8"

- id: "vidsearch-32"
  title: "Genre spotter and embedding models trained only on JEV-owned or consented footage, stored centrally, while every index and tracker stays in a per-studio collection; cross-game transfer happens through model weights, never through shared vectors or shared caches"
  level: "L3"
  cell: {part: "tenancy-access-control", tenancy-and-deployment: "logically-isolated-per-studio", reuse-scope-of-extraction: "genre-shared", mechanism-type: "transfer-across-games", scope: "cross-game", effort: "S-weeks", build-or-buy: "build-in-house"}
  object: "spec.md step 4: 'A chatbot for the gaming studio'"
  situation: "The genre spotter (vidsearch-4) needs footage from 8 games; studio A's contract forbids its footage improving studio B's product"
  consequence: "Training pool is restricted to footage with a transfer clause (or JEV's own playtests); the model card lists contributing games; a studio can opt out and still use the model; no vector, cache or benchmark crosses a studio collection"
  p_typical: 0.06
  grounded: "inferred"
  evidence: "spec.md: 'Buyers are gaming studios'; nothing in spec.md or memo.md states a tenancy model"
  proposed: "training_pool(session_id, studio_id, transfer_consent: bool); model_card(model_version, games[], n_hours); per-studio HNSW collections with no cross-collection search"
  shallow: false
  part: "store"
  mechanism: "Consent flag gates the training pool; models deployed as shared weights; indexes isolated per studio"
  example: "Studio B onboards a puzzle game and gets day-0 events from a spotter trained on 6 consenting studios' footage; its 500-player index is searchable only by studio B"
  cost: "S"
  ingest_cost: "S"
  query_cost: "S"
  better_than_fixed_table: "Transfer across games is possible at all under isolation; the table transfers nothing"
  depends_on: "vidsearch-4"

- id: "vidsearch-33"
  title: "Retry-loop detection by temporal self-similarity: a session's shot-embedding self-similarity matrix is scanned for off-diagonal runs (cosine over 0.9, length 3 or more shots) within 3 minutes, emitted as a 'repeated attempt' episode with attempt count"
  level: "L4"
  cell: {part: "ingestion-extraction", representation: "timestamped-observation-log", granularity: "variable-length-moment-or-episode", modality: "frame-embeddings", question-type: "how-many", extraction-trigger: "at-ingestion", effort: "XS-days", mechanism-type: "auto-discover-without-question"}
  object: "memo.md item 1: 'friction signal' as an observation field"
  situation: "A player retries the tutorial jump 7 times; there is no death screen, no error sound and no speech, only the same 8 s of footage repeating"
  consequence: "A repeated_attempt episode with attempt_count=7 and span 00:12:04 to 00:13:31 exists for that player; the cohort question 'how many retries before quitting' is a SQL aggregate"
  p_typical: 0.05
  grounded: "quote"
  evidence: "memo.md item 1: 'friction signal'"
  proposed: "episodes(session_id, kind=repeated-attempt, t_start_ms, t_end_ms, attempt_count, shot_ids[]); computed from the per-session shot-vector self-similarity matrix with a 3-minute band"
  shallow: false
  part: "ingestion"
  mechanism: "Per session, cosine self-similarity over shot vectors inside a sliding 3-minute band; off-diagonal runs merged into episodes; written as intervals"
  example: "'How many attempts do players make at the tutorial jump before quitting?' -> churners median 6 attempts, completers median 2, 500 of 500 players, with 12 clips of 6-plus-attempt players"
  cost: "XS"
  ingest_cost: "S"
  query_cost: "S"
  better_than_fixed_table: "Counts retries that leave no textual or audible trace"
  depends_on: "vidsearch-2"
