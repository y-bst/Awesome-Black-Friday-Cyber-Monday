- id: "vidsearch-1"
  title: "Shot table as the atomic temporal unit: a video shot-boundary detector (TransNetV2) plus UI-transition detector cuts each session into variable-length shots (median 6 s), and every downstream field attaches to a shot_id rather than to a 15-minute video or a fixed window"
  level: "L4"
  cell: {part: "frame-pipeline", representation: "hierarchical-temporal-summary-tree", granularity: "variable-length-moment-or-episode", modality: "frame-embeddings", extraction-trigger: "at-ingestion", effort: "S-weeks", build-or-buy: "open-source-component", mechanism-type: "change-data-at-source"}
  object: "spec.md step 1: 'each video is capped at 15 minutes, so one session is many videos'; step 3: 'The answers form a structured table per video'"
  situation: "A 2.4-hour session arrives as 10 files; the pipeline's only time unit is the file, so a 40-second loading freeze and a 9-minute boss fight are both 'in video 4'"
  consequence: "Every session becomes 800-1,600 shots keyed on session clock; 'what happened' questions resolve to a shot list with start_ms and end_ms instead of a file index"
  p_typical: 0.12
  grounded: "quote"
  evidence: "spec.md: 'Long multi-video sessions' listed as a known problem; memo.md item 1: 'timestamped atomic observations across all videos of a session'"
  proposed: "shots(session_id, shot_id, t_start_ms, t_end_ms, video_id, video_offset_ms, cut_kind in {hard-cut, fade, ui-transition, loading, none-30s-max}, thumb_uri)"
  shallow: false
  part: "ingestion"
  mechanism: "TransNetV2 over decoded frames at 8 fps plus a UI-transition rule (over 60% of pixels change and a menu or dialog layout is detected) produce cut points; a 30-s maximum forces a cut inside long static or continuous play; the shots table is the join key for embeddings, captions, events and OCR"
  example: "Studio asks 'what happened right before players quit tutorial step 3'; the chatbot returns the last 3 shots before each exit (median 18 s of footage per player) for 212 of 500 players, as a shot list with thumbnails, no transcript needed"
  cost: "S"
  ingest_cost: "S"
  query_cost: "S"
  better_than_fixed_table: "The fixed table has one row per 15-minute file; a shot row localises any later field to a 6-s span"
  depends_on: "nothing"

- id: "vidsearch-2"
  title: "Video-text joint embedding per shot (one vector from a video-native model such as InternVideo2 or Marengo, 8 frames sampled inside the shot, not a single keyframe), stored in a per-studio HNSW index with session_id, step_id and build_version as pre-filters"
  level: "L4"
  cell: {part: "store", representation: "clip-or-frame-embeddings", granularity: "variable-length-moment-or-episode", query-path: "query-by-example-clip", modality: "frame-embeddings", latency-tier: "under-2s", effort: "M-one-quarter", build-or-buy: "open-source-component", tenancy-and-deployment: "logically-isolated-per-studio"}
  object: "spec.md step 2: 'The owner's view: the transcript alone is not enough; what is on screen is largely lost'"
  situation: "A studio wants moments where the player 'drags an item onto the wrong slot'; no transcript word, no OCR string and no single frame captures a drag"
  consequence: "Motion-bearing moments (drag, repeated tap, camera spin, backing out of a menu) become searchable; 1,200 session-hours of a 500-player cohort index as about 900,000 shot vectors of 512 dims (1.8 GB), queryable in under 300 ms"
  p_typical: 0.15
  grounded: "quote"
  evidence: "spec.md: 'Transcript loses visual information.'"
  proposed: "shot_embeddings(session_id, shot_id, model_version, vec float16[512]); HNSW M=16, ef_search=128; payload filters player_id, step_id, build_version, t_to_session_end_s"
  shallow: false
  part: "store"
  mechanism: "At ingestion, 8 uniformly spaced frames per shot go through the video encoder; the text tower of the same model embeds studio queries; cosine search returns shot ids; the shots table resolves them to session clock and file offset"
  example: "'How many players tried to drag the crafting item instead of tapping it?' -> text-tower query, top-2,000 shots filtered to step_id=craft-intro, threshold cosine 0.31 calibrated on 40 labelled shots; answer: 118 of 500 players, with a 12-clip montage"
  cost: "M"
  ingest_cost: "M"
  query_cost: "S"
  better_than_fixed_table: "Answers questions about actions and motion that were never written as a question and have no words attached"
  depends_on: "vidsearch-1"

- id: "vidsearch-3"
  title: "Query-by-example clip: the studio pastes one clip (session_id plus a 4-20 s range) and the system returns the nearest shots across all 500 players with a count, a per-player list and a cosine histogram, so 'find more like this' needs no words"
  level: "L4"
  cell: {part: "query-path", query-path: "query-by-example-clip", question-type: "find-players-who", evidence-form: "clip-montage-n-examples", latency-tier: "under-2s", user-segment: "game-designer", delivery-surface: "chatbot", mechanism-type: "reuse-or-cache-prior-work"}
  object: "spec.md constraint: 'Buyers are gaming studios. Their questions are not known in advance.'"
  situation: "A designer watched one session, saw a player wander the hub for 2 minutes after the tutorial, and cannot describe it in words precisely enough for a text question"
  consequence: "The question is asked by pointing: the designer gets 'moments like this' for 347 of 500 players within 2 s, and the pasted clip becomes a named, reusable tracker"
  p_typical: 0.1
  grounded: "quote"
  evidence: "memo.md item 2: 'open-field questions retrieve matching observation rows across players and the model reads only those'"
  proposed: "POST /search/by-example {session_id, t_start_ms, t_end_ms, filters} -> {n_players, n_shots, histogram, examples[12]}; example embedding is the mean of the covered shots' vectors"
  shallow: false
  part: "query"
  mechanism: "Example clip -> covered shot vectors -> mean vector -> filtered HNSW search -> per-player max similarity -> count above a threshold the user adjusts with a slider that re-counts live from the cached top-5,000"
  example: "Designer pastes 14 s of a player circling the hub after tutorial step 6; system returns 347 of 500 players with at least one shot above 0.35, 61% of whom churned within 10 minutes vs 23% baseline"
  cost: "S"
  ingest_cost: "S"
  query_cost: "S"
  better_than_fixed_table: "The fixed table can only return what a question author foresaw; this returns what a human noticed once"
  depends_on: "vidsearch-2"

- id: "vidsearch-4"
  title: "Genre event-spotting model trained once per genre (as action spotting is trained once per sport): a temporal head over shot embeddings emits time-localised events {death, respawn, level-complete, menu-open, menu-close, purchase-prompt, tutorial-prompt-shown, reward-popup, loading, pause} with a 1-s tolerance, and is applied to every new game of that genre on day 0"
  level: "L4"
  cell: {part: "ingestion-extraction", representation: "timestamped-observation-log", granularity: "variable-length-moment-or-episode", extraction-trigger: "on-new-game-onboarding", reuse-scope-of-extraction: "genre-shared", moment-in-journey: "game-onboarding-day-0", mechanism-type: "transfer-across-games", effort: "L-multi-quarter", build-or-buy: "build-in-house"}
  object: "spec.md step 3: 'a fixed set of questions with options, written per game target'"
  situation: "The 41st game is onboarded; nobody has written its questions, and the first cohort of 500 sessions lands tonight"
  consequence: "A 10-class event stream exists for every session before any human writes anything; per-game work shrinks to a 30-minute calibration check on 20 sessions"
  p_typical: 0.08
  grounded: "quote"
  evidence: "A-frame.yaml assumption: 'studios are many and each game differs, so per-game hand-written questions do not scale'"
  proposed: "events(session_id, t_ms, event_class, confidence, shot_id, model_version, genre); per-genre training set 2,000 labelled events from JEV-owned sessions across at least 8 games of that genre"
  shallow: false
  part: "ingestion"
  mechanism: "A 1-D temporal convolution plus NMS over the sequence of shot vectors, trained with SoccerNet-style spotting loss; class set is universal per genre; per-game threshold calibration on 20 sessions sets a target 0.85 precision"
  example: "New puzzle game, day 0: 'where in the tutorial do players die most?' -> COUNT(events WHERE event_class=death) GROUP BY step_id; answer in 1 s: step 4, 1.9 deaths per player vs 0.3 elsewhere, 500 of 500 players covered"
  cost: "L"
  ingest_cost: "S"
  query_cost: "S"
  better_than_fixed_table: "Zero per-game authoring for the 10 commonest events, and the events have timestamps the table never had"
  depends_on: "vidsearch-2"

- id: "vidsearch-5"
  title: "Natural-language moment retrieval (temporal grounding, Moment-DETR style) returning start-end spans inside a session rather than whole chunks, so 'the moment the player gives up on the lock-pick minigame' resolves to a 7-s span with a confidence"
  level: "L4"
  cell: {part: "query-path", query-path: "clip-lookup", question-type: "when", granularity: "variable-length-moment-or-episode", evidence-form: "clip", latency-tier: "under-30s", effort: "M-one-quarter", build-or-buy: "open-source-component"}
  object: "memo.md item 1: 'quote with timestamp as evidence'"
  situation: "A studio asks a 'when' question whose answer lies between two shot boundaries and is not a transcript quote (the player simply stops trying)"
  consequence: "Evidence is a span, not a quote: the chatbot answers 'at 00:41:12 to 00:41:19, confidence 0.78' per player and plays it"
  p_typical: 0.06
  grounded: "quote"
  evidence: "memo.md item 1 lists 'quote with timestamp as evidence' as the only evidence form; spec.md: 'what is on screen is largely lost'"
  proposed: "Two-stage: HNSW over shots selects top-50 candidate windows per player; a grounding model over the window's 64 frames plus the query text emits spans; stored as moments(session_id, t_start_ms, t_end_ms, query_hash, conf)"
  shallow: false
  part: "query"
  mechanism: "Coarse shot retrieval then fine span regression; results cached by (query_hash, session_id) so the second studio asking the same thing gets sub-200 ms"
  example: "'When do players abandon the lock-pick minigame in the tutorial?' -> 500 players, 134 abandon spans found, median 63 s into the minigame, each with a playable 7-s clip"
  cost: "M"
  ingest_cost: "S"
  query_cost: "M"
  better_than_fixed_table: "The table holds an answer per video with no time; this returns the second it happened"
  depends_on: "vidsearch-2"

- id: "vidsearch-6"
  title: "Dense video captioning per shot at ingestion: a video-LLM writes one 15-30 word caption of what is visible and what the player does per shot, stored as a time-coded caption track and indexed in both BM25 and the embedding index"
  level: "L4"
  cell: {part: "ingestion-extraction", representation: "timestamped-observation-log", granularity: "variable-length-moment-or-episode", modality: "frame-embeddings", extraction-trigger: "at-ingestion", query-path: "full-text-keyword-search", effort: "S-weeks", build-or-buy: "managed-cloud-service", uncertainty-policy: "answer-with-ci-and-n"}
  object: "spec.md step 2: 'Each video is converted to a transcript'"
  situation: "A silent player (no speech for 40 minutes) completes or abandons the tutorial; the transcript is empty and the fixed questions answer 'unknown' for every field"
  consequence: "Every shot has text even when the player says nothing; the 2.4-hour session becomes about 1,200 captions (30,000 tokens) which a long-context model reads in one call when a question needs it"
  p_typical: 0.2
  grounded: "quote"
  evidence: "spec.md: 'The transcript alone is not enough; what is on screen is largely lost.'"
  proposed: "captions(session_id, shot_id, caption, visible_ui[], player_action, model_version); caption prompt forbids guessing intent and asks only for visible state and action"
  shallow: false
  part: "ingestion"
  mechanism: "Per shot, 8 frames plus the previous caption go to a multimodal model; output is validated to a 30-word limit and a closed player_action vocabulary of 25 verbs (tap, drag, open-menu, close-menu, idle, read, retry, navigate, purchase-view, dismiss)"
  example: "'Did silent players read the crafting tutorial prompt or dismiss it?' -> captions with player_action in {read, dismiss} on step-2 shots: 500 players covered, 203 dismissed within 2 s, 41 silent players included who the transcript-only table could not score"
  cost: "S"
  ingest_cost: "L"
  query_cost: "S"
  better_than_fixed_table: "Coverage of silent players rises from 0 to 100%; captions are a queryable text track the table cannot derive after the fact"
  depends_on: "vidsearch-1"

- id: "vidsearch-7"
  title: "Hierarchical temporal index frame -> shot -> play -> step -> session -> player, each level with its own pooled embedding and summary, and a router that sends a question to the level matching its granularity word (moment, step, session, player)"
  level: "L4"
  cell: {part: "store", representation: "hierarchical-temporal-summary-tree", granularity: "session", query-path: "progressive-answer-then-refine", latency-tier: "progressive-streaming", mechanism-type: "approximate-then-refine", effort: "M-one-quarter", build-or-buy: "build-in-house"}
  object: "spec.md step 4: 'Reading 500 transcripts per question was too slow and too much data'"
  situation: "A question such as 'which players lost momentum after the tutorial' is session-scale, while 'what did they click' is shot-scale; one flat index serves both badly"
  consequence: "Session-level questions search 500 vectors, shot-level questions search 900,000; coarse-to-fine descent keeps any question under 2 s and always returns the finer level as evidence"
  p_typical: 0.1
  grounded: "quote"
  evidence: "spec.md: 'Reading 500 transcripts per question was too slow and too much data, which is why the fixed-question table exists.'"
  proposed: "tree_nodes(session_id, level in {shot, play, step, session}, node_id, parent_id, t_start_ms, t_end_ms, vec, summary_120tok); play = run of shots between two spotted events"
  shallow: false
  part: "store"
  mechanism: "Mean-pooled child vectors plus a 120-token summary per node; the router picks the level from question granularity, searches, then expands children of the top hits for evidence"
  example: "'Which players disengaged after tutorial step 6?' -> step-level vectors for 500 players against a 'low-activity wandering' text query, then shot-level evidence for the top 80; first answer at 1.4 s, refined list at 9 s"
  cost: "M"
  ingest_cost: "M"
  query_cost: "S"
  better_than_fixed_table: "One structure serves moment, step and session questions; the table has one grain (video) and nothing above or below"
  depends_on: "vidsearch-1, vidsearch-4"

- id: "vidsearch-8"
  title: "Cross-player temporal alignment to a canonical tutorial timeline by DTW over shot-embedding sequences (reference = medoid session), yielding per-player step boundaries and dwell without a screen classifier or a hand-written step list"
  level: "L4"
  cell: {part: "session-stitching", representation: "step-funnel-state-machine-per-player", granularity: "tutorial-step", question-origin: "induced-from-data", extraction-trigger: "on-cohort-size-threshold", subject-domain: "onboarding-tutorial", effort: "S-weeks", mechanism-type: "auto-discover-without-question"}
  object: "spec.md step 3: 'The targets are mostly detecting churn in the tutorial and just after it'"
  situation: "50 sessions of a new game are in; step boundaries are needed to compute drop-off but the studio has not provided a step list"
  consequence: "A canonical timeline with 8-15 segments emerges from the data; each player's session is warped onto it, giving enter and exit times per segment for all 500 players"
  p_typical: 0.05
  grounded: "quote"
  evidence: "spec.md: 'The targets are mostly detecting churn in the tutorial and just after it.'"
  proposed: "alignment(session_id, canonical_segment_id, t_enter_ms, t_exit_ms, warp_cost); canonical segments are change-points in the medoid session's embedding sequence, named later by one human from thumbnails"
  shallow: false
  part: "ingestion"
  mechanism: "Pick the medoid of the first 50 sessions' first-30-minute embedding sequences; segment it by change-point detection; DTW every session against it with a Sakoe-Chiba band of 20%; segments with warp_cost over the 90th percentile are flagged 'off-path'"
  example: "'Where do players fall off the tutorial?' at day 3 with 50 sessions: drop-off per canonical segment, segment 5 loses 31% of players; 7 'off-path' players shown as clips, no step list ever written"
  cost: "S"
  ingest_cost: "S"
  query_cost: "S"
  better_than_fixed_table: "Step structure is induced, so the funnel exists before any question is authored"
  depends_on: "vidsearch-2"

- id: "vidsearch-9"
  title: "Highlight reel per tutorial step generated weekly: the 12 highest-friction shots (death, stuck, backtrack, dismiss events, ranked by rarity) across the cohort, cut into a 90-s reel with on-screen player id and timecode, delivered without a question"
  level: "L4"
  cell: {part: "export-integration", delivery-surface: "clip-reel", question-type: "what-surprised-unknown-unknowns", mechanism-type: "push-instead-of-pull", latency-tier: "push-no-query", moment-in-journey: "steady-state-weekly", user-segment: "producer-exec", evidence-form: "clip-montage-n-examples", effort: "S-weeks"}
  object: "spec.md constraint: 'Their questions are not known in advance.'"
  situation: "A producer never opens the chatbot; the studio's weekly meeting wants to see, not read"
  consequence: "A 90-s reel per step lands in Slack every Monday; the producer's questions that follow are specific ('why do 4 of these 12 players tap the locked chest') and are already answerable by example clip"
  p_typical: 0.07
  grounded: "quote"
  evidence: "spec.md: 'A chatbot for the gaming studio answers the studio's questions'; memo.md item 2 assumes a typed question"
  proposed: "Reel job: per step, score shots by sum of event weights (death 3, stuck 2, dismiss 1) times inverse frequency of the shot's cluster; ffmpeg concat with burned-in captions; posted with a link back to each source moment"
  shallow: false
  part: "ui"
  mechanism: "Weekly batch over the step-level tree nodes; selects top-12 shots by friction-times-rarity; renders reel; posts to the studio channel"
  example: "Monday reel for step 3 shows 12 players; 9 of them open the map instead of the crafting bench; the producer asks by example clip and gets 184 of 500 players doing the same"
  cost: "S"
  ingest_cost: "S"
  query_cost: "S"
  better_than_fixed_table: "Surfaces what nobody asked; the table only ever answers what was asked"
  depends_on: "vidsearch-4, vidsearch-7"

- id: "vidsearch-10"
  title: "Game SFX fingerprinting without labels: recurring 0.5-3 s audio snippets across sessions are clustered into the game's sound-cue vocabulary (failure jingle, level-up, error buzz, purchase chime), named once per game from 20 examples, and emitted as time-coded events"
  level: "L4"
  cell: {part: "ingestion-extraction", modality: "audio-non-speech", representation: "timestamped-observation-log", granularity: "variable-length-moment-or-episode", question-origin: "induced-from-data", extraction-trigger: "on-cohort-size-threshold", effort: "S-weeks", build-or-buy: "open-source-component", reuse-scope-of-extraction: "game-specific"}
  object: "spec.md 'Unspecified': 'What a transcript contains (speech only, on-screen text, events)'"
  situation: "The failure jingle plays 1,900 times across 500 sessions; speech-to-text discards it and no question asks about it"
  consequence: "Deaths, errors and rewards are counted from audio with under 1% false positives and sub-100-ms timing, cheaper than any visual model, and the vocabulary is discovered rather than written"
  p_typical: 0.04
  grounded: "quote"
  evidence: "spec.md: 'Unspecified: What a transcript contains (speech only, on-screen text, events)'"
  proposed: "audio_cues(session_id, t_ms, cue_id, name, confidence); cue vocabulary built by landmark fingerprinting over non-speech audio of the first 50 sessions, keeping snippets recurring in over 30% of sessions"
  shallow: false
  part: "ingestion"
  mechanism: "Separate speech from non-speech with a VAD; fingerprint non-speech audio (spectral peak landmarks); cluster recurring fingerprints; one human names 10-20 cue clusters from 20 played examples; later sessions are matched in real time"
  example: "'How many failure sounds before a player quits step 4?' -> mean 4.2 failure cues in the 3 minutes before exit for churners vs 1.1 for completers, 500 of 500 players, computed from a 90,000-row table in under 1 s"
  cost: "S"
  ingest_cost: "S"
  query_cost: "S"
  better_than_fixed_table: "A new event class the table cannot express, obtained from a signal the pipeline currently throws away"
  depends_on: "nothing"

- id: "vidsearch-11"
  title: "Temporal pattern queries over the event stream using MATCH_RECOGNIZE (SQL row-pattern matching): 'menu-open then menu-close within 3 s, repeated 3 or more times within 60 s' runs as SQL over the events table, not as an LLM read"
  level: "L4"
  cell: {part: "query-path", query-path: "sql-over-closed-fields", question-type: "how-many", representation: "timestamped-observation-log", latency-tier: "under-2s", effort: "XS-days", build-or-buy: "open-source-component", mechanism-type: "defer-to-query-time"}
  object: "memo.md item 2: 'closed-field questions become aggregate queries over all players (instant)'"
  situation: "The studio asks about a sequence ('opened the shop, closed it, then quit within a minute'), which is three events in order with time gaps, not a count of one field"
  consequence: "Sequence questions over 500 players answer in under 2 s from a 2-million-row events table, with a per-player list and the exact matched spans as clips"
  p_typical: 0.06
  grounded: "quote"
  evidence: "memo.md item 2: 'closed-field questions become aggregate queries over all players (instant)'"
  proposed: "events table in DuckDB or Flink SQL; the chatbot's planner compiles sequence wording into PATTERN (A B+ C) DEFINE clauses with WITHIN windows; matches stored as pattern_matches(session_id, pattern_hash, t_start_ms, t_end_ms)"
  shallow: false
  part: "query"
  mechanism: "LLM writes the row-pattern SQL from the question plus the event vocabulary; executed over events partitioned by session; results joined to shots for clips"
  example: "'How many players opened the shop and quit within a minute during the tutorial?' -> PATTERN (shop_open shop_close quit) WITHIN 60 s: 37 of 500 players, 29 of them at step 5, clips attached"
  cost: "XS"
  ingest_cost: "S"
  query_cost: "S"
  better_than_fixed_table: "Order and timing between events are expressible; the table has no time axis at all"
  depends_on: "vidsearch-4"

- id: "vidsearch-12"
  title: "Embedding-space outlier moments per step: shots at step k whose nearest-neighbour density across the cohort is in the bottom 2% are surfaced as 'unexpected behaviour' with a montage, answering what-surprised questions without a question"
  level: "L4"
  cell: {part: "question-generation", question-type: "what-surprised-unknown-unknowns", question-origin: "induced-from-data", query-path: "automatic-contrast-cohort-diff", mechanism-type: "auto-discover-without-question", representation: "clip-or-frame-embeddings", evidence-form: "clip-montage-n-examples", effort: "S-weeks"}
  object: "spec.md known problem: 'The question set is small, so most of what is in the video and transcript is never captured.'"
  situation: "At step 2, 11 players do something no question covers (they open the settings menu and change the controls); it is rare, visual and silent"
  consequence: "The system lists the 5 lowest-density clusters per step with sizes (11, 8, 6, 4, 3 players), and the studio discovers the control-remap behaviour on day 2 of the cohort"
  p_typical: 0.05
  grounded: "quote"
  evidence: "spec.md: 'The question set is small, so most of what is in the video and transcript is never captured.'"
  proposed: "Nightly job: per step, k-NN density (k=20) over shot vectors; bottom 2% clustered (HDBSCAN); clusters with 3 or more players reported with a caption-derived name"
  shallow: false
  part: "question-generation"
  mechanism: "Density estimation over the cohort's shot embeddings per step; outlier clusters named by summarising their captions; results written as candidate questions with example clips"
  example: "Day 2 report for step 2: cluster 'player opens settings and changes controls' (11 of 500), 8 of 11 churned at step 3; the studio adds a 'control remap' tracker from those 11 clips"
  cost: "S"
  ingest_cost: "S"
  query_cost: "S"
  better_than_fixed_table: "Produces the questions the table never had, from the data itself"
  depends_on: "vidsearch-2, vidsearch-8"

- id: "vidsearch-13"
  title: "Churn-vs-retain contrast in embedding space: for each step, find the shot clusters whose frequency differs most between players who quit within 10 minutes and players who continued (log-odds over 2), and report them as ranked discriminative moments with clips"
  level: "L4"
  cell: {part: "question-generation", question-origin: "discriminative-contrast-churn-vs-retain", query-path: "automatic-contrast-cohort-diff", question-type: "why", scope: "cohort", evidence-form: "contrast-vs-baseline", mechanism-type: "auto-discover-without-question", effort: "S-weeks"}
  object: "spec.md step 3: 'The targets are mostly detecting churn in the tutorial and just after it'"
  situation: "The studio asks 'why do players churn at step 4' and the fixed options (too hard, confusing, boring) were written before anyone watched the footage"
  consequence: "The answer is a ranked list of visual behaviours with odds ratios: 'repeated camera spin at the bridge' 4.1x, 'opens map 3+ times' 2.7x, each with 12 clips per cohort"
  p_typical: 0.08
  grounded: "quote"
  evidence: "memo.md item 3: questions 'pruned by the game target'; the churn options are chosen by the author, not by the footage"
  proposed: "contrast_moments(game, step_id, cluster_id, n_churn, n_retain, log_odds, name, example_shot_ids[12]); clusters from k-means (k=50) over step-k shot vectors"
  shallow: false
  part: "question-generation"
  mechanism: "Cluster all step-k shots; count players per cluster in each cohort; rank by log-odds with a Haldane correction; name clusters from captions; emit as answer plus candidate closed fields"
  example: "'Why do players churn at step 4?' -> top discriminative moment: 'player spins the camera 360 degrees at the rope bridge' present in 71% of churners vs 19% of retainers (n=133 vs 367), 12 clips each"
  cost: "S"
  ingest_cost: "S"
  query_cost: "S"
  better_than_fixed_table: "The 'why' options come from the footage, not from the question author's guess"
  depends_on: "vidsearch-2, vidsearch-8"

- id: "vidsearch-14"
  title: "Few-shot visual tracker from examples: a studio marks 10-20 example shots (by query-by-example or from a reel), a prototype classifier over shot embeddings is fitted in under 10 s, back-filled over all history, and the result becomes a named closed field"
  level: "L4"
