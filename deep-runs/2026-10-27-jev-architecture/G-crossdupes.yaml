# Stage G cross-bucket duplicates (ideate run). Only pairs whose ids sit in different G-bucket files.
# duplicates: same mechanism for the same input; survivor keeps its id, merged ids fold into it.
# variants: same mechanism at a different part, scope or input; both kept.
# contested: positive option vs refusal rows from another bucket on the same mechanism.
