    cost: 2.0
    query_speed: 5.0
  case_a: 'Defer this, or treat it as a special case of stitch-27 and clinical-16. It is one query template (''why'' + step -> GROUP BY friction_reason), not an architectural choice. It depends on two things
    that are not built: a per-genre friction_reason enum and analyst-2''s step_state, which is not in the top 25. The enum is where the real cost and risk sit. memo.md item 3 already plans to generate closed
    fields from an ontology. A hand-defined per-genre reason enum duplicates that, and spec.md says ''each game differs, so per-game hand-written questions do not scale'', which applies just as much to
    hand-written reason lists. The option''s own example shows the problem: ''other 23'' of 94 is 24% of quitters already falling outside the enum on the tutorial case it was designed for. On a studio''s
    unknown question the ''other'' bucket will be larger, and it is exactly the part the studio cares about. Assigning a single friction_reason to each stall at ingestion also asks today''s models for a
    causal judgement from a 15-minute clip. That label is the least reliable thing an extractor produces, and the confident percentages hide the uncertainty. This option only helps tutorial ''why did they
    quit at step N'' questions. Ship it as a planner template once the memo''s ontology and stitch-27''s session-scope quit_reason exist, not as a separate build.'
  case_b: 'Build this because ''why do players quit at step 3'' is the literal shape of the target in spec.md item 3, ''detecting churn in the tutorial and just after it'', and today the nearest artifact
    is an MCQ ''reason for struggle: A/B/C/D'' per video that nobody aggregates, so the studio gets one option letter per video and no ranked answer. With a closed friction_reason enum tagged on each stall
    or quit observation at ingestion, the planner maps ''why'' plus a step to a GROUP BY over the quitters and returns a reason list with counts, share of quitters and three clips per reason. Worked example:
    step 3 quitters (94) split into cannot-find-ui 38 (40%), misread-text 21 (22%), input-fail 12 (13%) and other 23, with the ''other'' quotes listed, so the analyst files three concrete tickets instead
    of one vague one. It runs at query time as a single aggregate (instant), which fits the speed constraint, and the enum is defined per genre so it scales across studios without hand-writing per-game
    questions. It is complementary to obs-3: contrast finds unanticipated attributes, while this gives the stable, trusted, clip-backed reason taxonomy that studios will request weekly and that the evaluation
    set can score against hand-labelled sessions. Without it, the most common churn question falls through to the planner''s slow open-field retrieval path every time, and answers drift between runs because
    reasons are re-invented from free text.'
- id: cv-3
  title: OCR text track per keyframe with region class (hud, objective-tracker, dialog, tooltip, error-popup, chat), stored as a second timestamped text stream parallel to the speech transcript
  part: ingestion
  mechanism: PaddleOCR or cloud OCR on each keyframe; deduplicate identical text across consecutive keyframes into (text, first_t, last_t) spans; index text in an inverted index alongside transcript
  evidence: 'memo.md: ''Video frames add screen state and on-screen text''; spec.md: ''What a transcript contains (speech only, on-screen text, events)'''
  scores:
    impact: 4.0
    confidence: 5.0
    fit: 4.0
    cost: 2.0
    query_speed: 4.0
  case_a: Build this because it directly fixes the owner's first-named problem, 'transcript loses visual information', and memo.md already commits to it ('Video frames add screen state and on-screen text,
    because speech alone cannot answer where did they click'); spec.md lists on-screen text as an unspecified transcript content, so today it is simply unknown whether it is captured. Running OCR per keyframe,
    deduplicating identical text into (text, first_t, last_t) spans with a region class (hud, objective-tracker, dialog, tooltip, error-popup, chat) and indexing it beside the transcript gives a second,
    searchable stream. The tutorial prompt 'Press E to craft' is on screen for 4 seconds and the player never says it, so no speech-based question can ever answer 'did players see the craft prompt'; with
    this track it is a keyword lookup joined to the step-3 exit, e.g. 'Inventory full' popup seen by 61 of 500, in an inverted-index query. Cost is purely ingestion (cost 2, which the constraints say is
    not a concern) with query cost near zero, and unlike a vision-model description it is deterministic, auditable evidence that a studio can verify by opening the frame. It is also the cheapest way to
    get exact on-screen strings (UI labels, error messages, objective text) that vision-language models paraphrase or hallucinate. Without it, every question about what the player saw rather than said stays
    unanswerable, however good the planner is.
  case_b: The real case against this one is weak; the most I can argue is about scope and sequencing. It depends on cv-1, the keyframe table, which has to come first. Per-region classification (hud, objective-tracker,
    dialog, tooltip, error-popup, chat) needs a layout model or per-game region map, and per-game hand mapping does not scale (spec.md). A modern multimodal model reading keyframes at ingestion (A-frame
    assumption) can produce screen state and on-screen text in the same pass the memo already plans ('Video frames add screen state and on-screen text'). That makes a separate PaddleOCR pipeline with its
    own deduplication and inverted index a second visual extractor to maintain. Generic OCR also does badly on stylised game fonts, outlined HUD text and text over moving backgrounds. Exact-string search
    such as text='Inventory full' misses typo-variant and localised strings, and the spec leaves languages unspecified. In the 'did players see the craft prompt' example, text being on screen is not the
    same as the player reading it, so the count overstates exposure. Fold it into the memo's frame pass as an on_screen_text field on observations, without a separate OCR stack. Add region classes only
    for games whose HUD layout the step list already describes.
- id: extract-7
  title: 'Negative-evidence extraction: for every step in the game''s step list, emit an explicit row seen / not_seen / unknown per session with the coverage basis, so ''how many players never opened X''
    has a denominator'
  part: ingestion
  mechanism: 'Session-level pass after all videos: for each step_id in the game''s step list, output {status: seen|not_seen|unknown, first_ts, basis: frames|speech|both|no_coverage}. unknown is forced when
    any video of the session is missing or when frame coverage for the session is under 80%. Store step_presence(session_id, step_id, status, basis)'
  evidence: 'memo.md: ''closed-field questions become aggregate queries over all players (instant)'' (an aggregate needs a denominator, and a missing row cannot distinguish absence from an unprocessed video)'
  scores:
    impact: 4.0
    confidence: 4.0
    fit: 4.0
    cost: 2.0
    query_speed: 5.0
  case_a: 'There is only a modest case for folding this rather than rejecting it. The seen / not_seen / unknown distinction is right, and without it a missing-video session is silently counted as ''never
    reached'', so there is no case to drop the idea. The case is that it should not be a separate ingestion pass. It overlaps latency-15, whose per-player step state-machine rows already give one row per
    player per step with an outcome enum. A status of not_reached plus a coverage flag on those rows gives the same denominator, with no second step_presence table to keep consistent. It also depends on
    two things that are not built: a step list per game, and a session-completeness flag from the stitcher (obs-29 / stitch-1). The 80% frame-coverage threshold for forcing ''unknown'' is arbitrary and
    untested. The option is graded ''inferred'', not quoted, and the worked range ''85-140'' shows that on real data with 11% of sessions incomplete the answer becomes a wide interval that studios may find
    less useful than expected. It also covers only steps in a predeclared list, so a studio''s unknown question about something off the list still cannot tell absence from no coverage. Build it as columns
    on latency-15''s step rows plus a session coverage field, not as its own extraction pass.'
  case_b: 'Build this because every aggregate the memo promises (''closed-field questions become aggregate queries over all players'') needs a denominator, and an observation log that only stores things
    that happened cannot supply one: a missing row means either ''did not happen'' or ''video 7 was not processed''. spec.md says a session is many 15-minute videos, so partial processing and missing videos
    are the normal case. The option adds a session-level pass emitting seen / not_seen / unknown per step with a basis (frames, speech, both, no_coverage), forcing unknown when a video is missing or frame
    coverage is under 80%, stored as step_presence(session_id, step_id, status, basis). Worked example: ''how many players never opened the inventory during the tutorial'' returns 85 of 445 with full coverage
    (19.1%), 55 sessions excluded, range 85-140, instead of a flat 140 that sends the studio to redesign a step that was fine. That is the worst failure mode for a studio-facing product, a confidently wrong
    count, and the fixed table cannot even express the distinction. Ingestion cost is a one-off pass (cost 2), query cost is a plain SQL filter (instant), and it relies on the stitcher''s completeness flag
    and a per-game step list that the ontology in memo.md item 3 already produces. Without it, every ''never'', ''how many did not'' and percentage-of-players question is silently wrong by an unknown margin.'
- id: stitch-27
  title: 'Session roll-up pass: after per-segment extraction, one LLM call reads the session''s concatenated observation rows (not raw transcript, about 2-4k tokens) and writes session-scope fields: quit_reason,
    churn_step, arc_summary, 3 representative evidence URIs'
  part: ingestion-extraction
  mechanism: 'Changes ingestion and store: one extra call per session over 2-4k tokens; outputs are session-scope closed fields queryable by SQL and an open summary for retrieval'
  evidence: 'memo.md: ''Ingestion produces a session-level observation log, not answers'''
  scores:
    impact: 4.0
    confidence: 4.0
    fit: 4.0
    cost: 2.0
    query_speed: 5.0
  case_a: Build this because the studio's most common question, 'why did this player quit', needs a judgement over the whole session, and nothing in the current or memo design computes one at the right
    level. spec.md says a session is many videos with answers per video, so asking per video yields about 10 contradictory quit reasons for one player; asking at query time means reading 500 x 400 observation
    rows per question, which breaks the few-seconds budget. The fix is one extra LLM call per session over the concatenated observation rows (about 2-4k tokens, since it reads rows, not raw transcript)
    that writes session-scope closed fields (quit_reason, churn_step) and an arc_summary plus three evidence URIs. It follows memo.md item 1 ('ingestion produces a session-level observation log') by adding
    the one derived layer the log needs to be queryable. 'Top 3 reasons players quit the tutorial' then becomes a GROUP BY on quit_reason returning, for example, could not find objective 17, combat too
    hard 12, crash 8, each with evidence, in under 2 s. The marginal ingestion cost is tiny against what already runs, and the output gives the hand-labelled evaluation set a single field per session to
    score against. Without it, the headline churn question is either slow, contradictory or both, and the planner has no session-level field to aggregate on.
  case_b: Defer this, and narrow it to closed fields. It depends on stitch-4, which is not among the top 25 options, and on per-segment extraction producing clean observation rows first. A one-shot LLM
    judgement of 'quit_reason' over 2-4k tokens of already-compressed rows stacks two layers of model abstraction. Any friction the per-segment pass did not log cannot appear in the quit_reason, so the
    session field inherits and hides the observation log's recall gaps. A free-form quit_reason has to be normalised before GROUP BY works. The example's 'could not find objective' 17 / 'combat too hard'
    12 / 'crash' 8 implies a closed enum that the option does not define, so it either duplicates analyst-15's friction_reason enum or produces labels that will not group. It also overlaps clinical-16's
    churn_event table, which already stores churn_step, churn type and last step and UI, and it is a variant of latency-10. arc_summary is free text for retrieval, which the memo's open-field path already
    covers by retrieving matching rows. The useful part is churn_step and a quit cause with evidence URIs. That fits as two more columns in clinical-16's churn_event row, produced by the same session pass.
    A separate roll-up whose fields are fixed in advance also does not help with studio questions that are unknown.
- id: latency-12
  title: 'Precomputed question-answer bank: the top 200 ontology-generated questions per game are answered at ingestion for the all-players cohort and the 8 standard segments, and the planner''s first branch
    is bank lookup'
  part: question-generation
  mechanism: Question generation output feeds an ingestion-time answer job; the chatbot's semantic cache (latency-2) is seeded with the bank
  evidence: 'spec.md Constraints: "Ingestion time and cost are not a concern. Answering a studio''s question must be fast."'
  scores:
    impact: 4.0
    confidence: 4.0
    fit: 4.0
    cost: 2.0
    query_speed: 5.0
  case_a: 'The spec states that ''Ingestion time and cost are not a concern. Answering a studio''s question must be fast''. A precomputed answer bank is the most direct way to turn that asymmetry into speed:
    spend ingestion compute once, then answer from a lookup. Of the roughly 900 ontology candidates that memo point 3 generates, the top 200, ranked by coverage of real studio questions, are answered for
    the all-players cohort and 8 standard segments. That is 1,800 rows per game per build, so storage is trivial. A paraphrase such as ''where do mobile players drop in the tutorial'' then returns in about
    110 ms with its evidence refs (''step 3: 44% of 212 mobile players''), and the other 700 candidates still resolve by cube or column scan in under 2 s. Without the bank, every common question goes through
    planning, aggregation and model synthesis at query time, so the tutorial and segment questions studios ask most often pay full latency, and the memo''s ''instant'' tier exists only for fields that happen
    to match exactly. The bank also replaces the frozen hand-written table with one that is generated, 10x wider and segment-aware, and that is promoted or demoted by the query log. This is the memo''s
    ''question set grows from real use'' made concrete. It reuses the ontology generator the memo already commits to, so the main new pieces are an ingestion job and a cache seed, which fit within a quarter.'
  case_b: 'Defer it, and when it is built, fold it into the semantic cache (latency-2) rather than keeping it as its own option. spec.md sets the query budget at a few seconds, and the option''s own example
    shows the memo''s closed-field cube path already answers 700 of the 900 candidate questions in under 2 s, so the 110 ms bank hit buys speed the constraint does not ask for, while the cost is real: 200
    questions x 9 cohorts = 1,800 natural-language answers that must be regenerated whenever players are added or a build changes. The speed also comes with a correctness risk that the owner''s brief (''fast,
    correct'') cares about more: matching a studio''s paraphrase to a stored question at cosine similarity will sometimes return the answer to a nearby question with a different cohort, step or build filter,
    and it will do so confidently and in 110 ms. The option depends on an ontology generator that three contesting options (convo-21, longctx-8, qgen-16) refuse as the primary question source, and on a
    ranking signal that does not exist until a query log does; until then the ''top 200'' is ranked by the owner''s churn targets, which is the same tutorial-churn question set the fixed table already covers.
    Studio questions are stated to be unknown, so a bank of ontology guesses is a bet on the head of a distribution nobody has measured, and the long tail falls through to the planner anyway. The honest
    remaining value is as a warm-start seed for latency-2 after the first month of real queries, when the ranking is measured instead of guessed.'
- id: qgen-10
  title: 'Per-step transition templates: for each tutorial step in the entity table, generate exactly 6 questions (entered, dwell_s, attempts, exit_reason enum, skipped, first_utterance_after_enter) from
    a step state machine'
  part: question-generation
  mechanism: question-generation emits the 6 templates per step; ingestion fills them from the screen-state classifier plus transcript; store keeps the transition log as the source and the 54 fields as
    a materialised view
  evidence: 'spec.md Known problems: "The question set is small, so most of what is in the video and transcript is never captured."'
  scores:
    impact: 4.0
    confidence: 4.0
    fit: 4.0
    cost: 2.0
    query_speed: 5.0
  case_a: 'The spec''s first named problem is that ''The question set is small, so most of what is in the video and transcript is never captured''. In the tutorial this shows up as hand-written questions
    covering steps 1, 3 and 5 of 9, only because those were the known problems. Per-step transition templates fix this structurally: each step gets the same 6 questions (entered, dwell_s, attempts, exit_reason
    enum, skipped, first_utterance_after_enter), filled from the screen-state classifier plus the transcript. For a 9-step tutorial that gives 54 closed fields as a materialised view over a transition log.
    ''Where do players drop in the tutorial'' then becomes a funnel query that returns in milliseconds. In the example, it shows step 7 with abandoned=18% against 4% or less elsewhere, a p50 dwell of 6m40s,
    and ''what now'' as the first utterance for 61 players. Today that stall is invisible until someone at the studio reads transcripts. Because the templates are generated from a state machine, every new
    game with a step list gets uniform coverage for free, with no per-game hand-writing, which the frame assumes does not scale. The templates also apply memo point 3''s ontology (entities x dimensions
    x outcomes) to the target the owner says matters most, tutorial churn, so they can ship first as the reference slice of the ontology generator. The store keeps the transition log as the source, so new
    per-step questions can be added later as views without re-extraction.'
  case_b: 'Reject as a separate option and fold the useful part into owner-31 (the per-step table it is explicitly a variant of) and latency-15 (per-player step state-machine rows), both already in the
    top 25. It only helps tutorial questions, which is the one area the existing fixed table already targets (spec.md: targets are ''mostly detecting churn in the tutorial''), so it does little for the
    stated problem that most of the video is never captured outside the tutorial. The decisive weakness is the dependency: it needs a screen-state classifier that recognises step boundaries and a per-game
    step list from qgen-2, and neither is built; without them the six fields are filled by the model guessing from transcript, and exit_reason as an enum per step is exactly the kind of field where a model
    will pick a plausible label with no visual grounding. Only two of the six templates (entered, dwell_s) are cheap and reliable; first_utterance_after_enter is a trivial text lookup, and attempts and
    skipped are definitions that vary by game and by step. Fixing the count at exactly six, when owner-31 uses eight columns, is arbitrary, and a fixed per-step schema is the fixed-table approach again
    at finer granularity rather than a question-generation framework that generalises to games with no steps. Keeping the transition log as source with a materialised view is sound, but that is a store
    design that belongs to the per-step table, not a question-generation option.'
- id: extract-3
  title: 'Session state card carried across videos: after video k is extracted, a 200-token card (current step, unresolved friction, player traits, inventory) is prepended to the video k+1 prompt and stored
    per boundary'
  part: ingestion
  mechanism: 'Extraction output for each video includes a state_card object: {current_step, open_frictions: [{label, since_ts}], traits: [max 5 short strings], last_goal_stated}. The next video''s prompt
    starts with the card; the model must emit resolved_frictions referencing since_ts when a friction closes. Store table session_boundary(session_id, video_idx, state_card_json)'
  evidence: 'spec.md: ''A session can be n hours; each video is capped at 15 minutes, so one session is many videos.''; ''Long multi-video sessions.'''
  scores:
    impact: 4.0
    confidence: 4.0
    fit: 4.0
    cost: 2.0
    query_speed: 5.0
  case_a: 'The spec names ''Long multi-video sessions'' as a known problem and states that each video is capped at 15 minutes. As a result, every per-video extraction today starts blind: video 5 opens with
    ''still can''t find it'', ''it'' is unresolvable, and friction_type defaults to none. A 200-token state card ({current_step, open_frictions with since_ts, traits, last_goal_stated}) is prepended to
    the next video''s prompt and stored per boundary in session_boundary. It turns a 40-minute hunt for the map button from 3 unrelated low-severity rows into one friction with a true start and end time.
    That makes cross-video questions answerable with a fast aggregate, which per-video rows cannot express at all. One example is ''how long were tutorial quitters stuck before quitting'', answered as a
    median of 14 min 20 s across 37 churners instead of durations capped at 15 minutes. These cross-video stalls are the frictions most likely to precede churn, the owner''s main target, so undercounting
    them biases exactly the answers studios pay for. The cost is entirely at ingestion (one small sequential dependency and about 200 extra tokens per video), which the spec says is acceptable, while query
    cost is unchanged. It also strengthens the memo''s session-level observation log, which needs friction rows that span video boundaries to be correct. The only prerequisite is an ordered video index
    per session, which JEV must build anyway because the spec lists video linkage as unspecified.'
  case_b: 'Defer; the cross-video stall problem is real, but a carried card is the wrong mechanism and it is already covered by the session roll-up and stitching options (stitch-27, stitch-1, obs-29). Chaining
    makes video k+1 extraction depend on video k, which turns a parallel batch job into a serial one for a 12-video session and means any reprocessing of video 3 forces reprocessing of 4 through 12; the
    owner says ingestion cost is fine, but serial latency to first answer and the re-run blast radius are real operating costs. Worse, the card is an unaudited free-text summary written by the model: a
    wrong ''current_step'' or a hallucinated open friction on video 3 is then injected as ground truth into every later prompt and compounds, with nothing in the design to detect it. The cost of the card
    is paid on every video to fix the minority of cases where video 5 begins with an unresolvable pronoun, and the free-string labels in open_frictions make the ''resolved_frictions references since_ts''
    matching fragile, since the model must reproduce a label verbatim. The stated example answer (median stuck time across videos) can be computed after the fact by merging friction rows with the same step
    across the stitched session timeline, with no serial dependency and with a model that reads the whole session''s observation log in one pass; the frame''s assumption of a modern long-context model makes
    that available. The spec also lists video linkage as unspecified, so the card has no reliable ordered input yet, and the stitching option has to be built first anyway.'
- id: extract-28
  title: 'Step identification with explicit fallback chain: step_id comes from the frame classifier, then OCR match of on-screen prompt text against the step list, then speech; the chosen source and a confidence
    are stored, and rows with step_id=unknown are excluded from step denominators with a coverage statement'
  part: ingestion
  mechanism: 'Per window: step_source in {frame_classifier, ocr_match, speech, unknown}, step_conf 0-1. OCR match: on-screen prompt text fuzzy-matched (>=0.8) against the glossary''s step prompt strings.
    Speech fallback: the model infers step from utterances with conf<=0.6. Materialised per game and build: step_coverage(step_id, n_players_identified, n_players_total). Chatbot: any per-step answer prints
    ''step identified for 470 of 500 players''; an answer where coverage differs by more than 10 points between two builds is flagged'
  evidence: 'memo.md: ''step on screen'''
  scores:
    impact: 4.0
    confidence: 4.0
    fit: 4.0
    cost: 2.0
    query_speed: 5.0
  case_a: Fold into the per-step table and the planner's answer rendering, and reject the fallback chain as a standalone ingestion build. The one valuable idea is the denominator statement ('step identified
    for 470 of 500 players') with a flag when coverage shifts between builds; that is cheap, belongs in answer formatting (planner-1 evidence form, stat-7), and needs no new ingestion machinery. The chain
    itself rests on a frame classifier that does not exist, trained per game on a specific build's screenshots, so the option builds a classifier-staleness problem and then a fallback to paper over it.
    The OCR stage needs a per-game glossary of step prompt strings, which is the hand-written per-game content that the frame says does not scale across many studios, and the speech stage with its 'conf<=0.6'
    and the 0.8 fuzzy threshold are invented numbers with no calibration plan or labelled sessions behind them. A modern multimodal model at ingestion, given the step list, can name the step from frames
    directly without a trained classifier, which removes both the stale-classifier scenario and the chain. The scenario motivating it (build 1.2 restyles the UI and two of nine steps collapse) is an edge
    case, and the option's evidence is a one-word quote from memo.md ('step on screen') that does not mention fallbacks or coverage. The confidence stored per window also multiplies row width across every
    ingested window for a benefit that is realised only at version-compare questions.
  case_b: The memo makes 'step on screen' the backbone of the observation log, and nearly every tutorial-churn answer is a per-step rate. That makes it the highest-stakes field to get silently wrong. The
    failure it prevents is concrete and likely. A frame classifier trained on build 1.1 screenshots meets a restyled build 1.2, its confidence collapses on 2 of 9 steps, and the step-level counts fall to
    near zero. A compare-versions answer then tells the studio those steps were 'fixed', a confident and wrong answer to exactly the question studios ask after every patch. The fallback chain resolves step_id
    from the frame classifier first, then from OCR fuzzy-matching (0.8 or more) against the glossary's prompt strings, then from speech at confidence 0.6 or less, and stores step_source and step_conf. It
    also materialises step_coverage per game and build, so every per-step answer can print 'step identified for 470 of 500 players' and flag a coverage swing of more than 10 points between builds. The studio
    question 'did the stealth step stall rate improve in 1.2?' then gets '22% vs 9%, but coverage dropped from 480 to 310, classifier likely stale', which is correct and still a fast lookup. The cost is
    a few extra fields per window plus one small materialised table, which is negligible at ingestion and free at query time. Without the chain, JEV's speed advantage just delivers wrong per-step answers
    faster, and studios lose trust in the product.
- id: playfill-10
  title: 'Planner unit resolver: question nouns (boss, match, run, level, quest, floor, round, mission) map to unit_type, named entities (''the Warden'', ''Drowned Bell'') fuzzy-match a unit_id from OCR''d
    labels, and the plan groups by play_unit instead of falling to retrieval; a noun with no unit_type in the manifest gets a clarifying reply naming the declared structure'
  part: query-path
  mechanism: 'Step 1: extract unit nouns and named entities. Step 2: map nouns to unit_type via lexicon; map names to unit_id by edit distance (2 or less) or embedding cosine 0.85 or more against catalogue
    labels and aliases. Step 3: emit plan over play_unit or cube. If no unit_type maps, reply ''This game is declared match-or-round-based; did you mean match?'''
  evidence: 'memo.md: ''closed-field questions become aggregate queries over all players (instant)'' (routing to the instant path depends on a closed field matching; mapping unit nouns and names to such
    a field is not described)'
  scores:
    impact: 4.0
    confidence: 4.0
    fit: 4.0
    cost: 2.0
    query_speed: 5.0
  case_a: 'Defer until the play_unit table (playfill-1) and its alias catalogue exist, and then fold into the typed planner (planner-1). It has a hard dependency on a per-game unit catalogue with aliases,
    which is hand-curated per-game content and the same scaling problem the frame warns about, and it is marked ''inferred'' in its own evidence, with no spec or memo line asking for it. The scenario is
    non-tutorial play (bosses, matches, runs), while spec.md says the targets are mostly tutorial and the period just after it, so the first quarter''s studio questions largely do not touch this path. The
    planner is a language model reading the question: if the catalogue''s unit labels and aliases (a few hundred strings per game) are placed in its context, it resolves ''the Warden'' to boss_warden_of_ash
    without a hand-built edit-distance and embedding pipeline, and handles nicknames and typos better than a 2-edit threshold or a 0.85 cosine cut that someone must tune. The 0.8 s versus 6-minute comparison
    is a straw man, since a planner with a schema-aware prompt would not start a backfill for a field that exists. OCR''d labels that feed the fuzzy match are themselves noisy, so the resolver''s accuracy
    is capped by cv OCR quality that is not yet built. The hard-coded clarifying reply about ''match-or-round-based'' also presupposes a manifest declaration that no other option guarantees. Keep the idea
    as a prompt-time catalogue injection, not a separate component.'
  case_b: 'The memo routes closed-field questions to an ''instant'' aggregate path, but it never says how a studio''s words reach a closed field. Studios ask in their own vocabulary (''the Warden'', ''the
    Drowned Bell'', ''the match after the tutorial''), not in column names. Without a resolver, the planner sees no match and falls through to the memo''s backfill tier. In the example, that means a 6-minute
    extraction for ''who quit after the Warden fight in hour 3'' when the answer was already stored. The unit resolver maps question nouns (boss, match, run, level, quest, floor, round, mission) to unit_type
    through a lexicon, and named entities to unit_id by edit distance of 2 or less, or embedding cosine of 0.85 or more, against OCR''d catalogue labels and aliases. It then emits a filtered plan over play_unit,
    which returns ''29 players, with a clip of each final attempt'' in 0.8 s. When the game declares no such unit type, it replies with a clarifying question that names the declared structure instead of
    guessing. This matters because JEV''s buyers are many studios with different genres, and the spec says their questions are unknown in advance. Anything past the tutorial in a non-step game is unreachable
    by the instant path today. The resolver is cheap: it runs at query time over a small catalogue in milliseconds, and nothing is added at ingestion beyond the aliases already captured in the unit catalogue.
    It is the piece that decides whether the memo''s fast tier actually gets used.'
