    chat panel covered it", cached as a human answer with 12 session ids.
  consequence: A human tier exists without widening who can see footage; overnight latency; the studio sees exactly which analysts opened which sessions
  better_than_fixed_table: The fixed table has no fallback when a question is not in the table; this adds one with an access trail
  ingest_cost: S
