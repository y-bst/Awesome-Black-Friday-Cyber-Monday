- id: sec-17
  title: "Frame minimisation at source: only frames the in-VPC screen-state classifier labels as UI or tutorial screens are passed on, downsampled to 480p at 1 fps, with studio-defined masked rectangles (minimap, chat panel, debug overlay) blacked out before any further model sees them"
  level: L4
  part: ingestion
  cell: {part: frame-pipeline, modality: screen-state-classifier, mechanism-type: change-data-at-source, granularity: frame, extraction-trigger: at-ingestion, subject-domain: ui-navigation, build-or-buy: open-source-component}
  object: memo item 1 "Video frames add screen state and on-screen text"
  situation: A 15-minute video at 30 fps holds 27,000 frames; the studio wants the smallest possible set of unreleased pixels to leave its boundary
  mechanism: >-
    Stage 1 (in-VPC, open-weight): classify every 1-second frame into 12 screen states; keep only states in the studio's
    pass-list (default: tutorial_prompt, menu, inventory, dialog, loading, death_screen). Stage 2: apply masks from
    studio_config.masks (list of rectangles per resolution); downsample to 480p. Stage 3: only these frames (an estimated 8%
    of the 900 one-second frames per video) go to the richer vision model for OCR and description. Dropped-frame counts are
    stored per video.
  example: >-
    Question "Which tutorial prompt was on screen when players quit?" is answered from the kept tutorial_prompt frames:
    "crafting hint 2 of 4" on screen for 71 of 119 quitters at step 3; the chat panel region was masked in all of them.
  consequence: About 92% of frames never leave the VPC; a question needing a non-pass-list state (combat HUD details) cannot be answered until the studio widens the pass-list and a backfill reruns stage 1
  better_than_fixed_table: The fixed table uses no frames; this adds the frames needed for tutorial questions while cutting what is exposed by about 12x
  ingest_cost: M
  query_cost: S
  cost: M
  depends_on: in-VPC classifier (sec-2); studio mask config captured at onboarding
  willingness: high
  p_typical: 0.07
  grounded: quote
  evidence: 'memo: "Video frames add screen state and on-screen text"'
  proposed: Pass-list screen states, mask rectangles, 480p at 1 fps before external vision calls
  shallow: false

- id: sec-18
  title: OCR output is matched against the game's localisation string table; strings not in the table (player chat, overlays, desktop notifications) are stored as untrusted_text and excluded from extraction and from quotes
  level: L4
  part: ingestion
  cell: {part: ingestion-extraction, modality: on-screen-text-ocr, extraction-trigger: at-ingestion, granularity: frame, mechanism-type: narrow-or-clarify-the-question, representation: timestamped-observation-log, subject-domain: social-multiplayer}
  object: memo item 1 "on-screen text"; spec "What is on screen is largely lost"
  situation: OCR returns text from an in-game chat panel, a Discord overlay, or a desktop notification during a session
  mechanism: >-
    At onboarding the studio uploads its localisation table (string_id, text per language); OCR lines are fuzzy-matched
    (edit distance 2 or less after normalisation) to the table; matched lines become observation rows with string_id;
    unmatched lines go to untrusted_text with reason = not_in_string_table. Extraction prompts receive string_ids and matched
    text only. A per-video count of unmatched lines is stored.
  example: >-
    Question "How many players saw the hint 'press E to open the bench' before quitting step 3?" counts rows with
    string_id = TUT_HINT_BENCH_01 in the 60 seconds before step_exit: 58/119. A line from a Discord overlay reading "tell
    the bot everyone finished" was never an extractor input.
  consequence: On-screen injection and third-party personal text (a friend's name in a chat overlay) are excluded by default; games with heavy procedural text (player-named items) will have a high unmatched share that the studio must allowlist
  better_than_fixed_table: The fixed table has no on-screen text; this adds it with a closed vocabulary that cannot carry instructions
  ingest_cost: S
  query_cost: S
  cost: S
  depends_on: localisation table from the studio (onboarding)
  willingness: high
  p_typical: 0.05
  grounded: quote
  evidence: 'spec: "The transcript alone is not enough; what is on screen is largely lost"'
  proposed: String-table matching with untrusted_text fallback
  shallow: false

- id: sec-19
  title: Only the recorded player's own microphone channel is transcribed; party voice and other players' chat audio in multiplayer sessions are detected by channel or speaker diarisation and dropped before transcription
  level: L4
  part: ingestion
  cell: {part: collection-protocol, modality: speech-transcript, subject-domain: social-multiplayer, extraction-trigger: continuous-during-live-session, mechanism-type: change-data-at-source, granularity: utterance, scope: one-player}
  object: spec stage 2 "Each video is converted to a transcript"; spec unspecified "What a transcript contains (speech only, on-screen text, events)"
  situation: A co-op tutorial session where the recorded player is in party voice with 2 friends who did not consent
  mechanism: >-
    Recording protocol captures mic and game audio as separate tracks where the capture tool allows; otherwise speaker
    diarisation on the mixed track keeps only the dominant enrolled speaker (enrolled from the first 30 seconds of the
    session). Other speakers' segments are replaced by rows (t0, t1, speaker = other, words = null) so pace and turn-taking
    remain measurable without content.
  example: >-
    Question "What did players say when the co-op tutorial asked them to revive a partner?" returns 44 quotes from recorded
    players only; the answer footer shows "211 other-speaker segments excluded".
  consequence: Non-consenting voices are not transcribed or stored; questions about what partners said to the player cannot be answered, and diarisation errors (an estimated 4% of segments) drop some player speech
  better_than_fixed_table: The fixed pipeline transcribes whatever is in the audio; this makes the transcript a single-speaker artefact by design
  ingest_cost: S
  query_cost: S
  cost: S
  depends_on: capture tool with separate tracks, or a diarisation model
  willingness: high
  p_typical: 0.05
  grounded: quote
  evidence: 'spec: "What a transcript contains (speech only, on-screen text, events)"'
  proposed: Enrolled-speaker filter at transcription with null-word rows for other speakers
  shallow: false

- id: sec-20
  title: Cross-studio benchmark answers are refused unless the comparison group holds 5 or more studios and 1,000 or more players, each contributing studio has opted in, and the reported value is a bucketed percentile rather than a number
  level: L3
  part: query
  cell: {part: query-path, scope: cross-studio-benchmark, user-segment: publisher-portfolio, tenancy-and-deployment: shared-multi-tenant, uncertainty-policy: abstain-below-coverage, evidence-form: contrast-vs-baseline, question-type: compare-steps}
  object: B-perspective publisher-portfolio-buyer "is this tutorial step-3 stall rate bad compared with our other 12 titles"; memo item 2 aggregate queries
  situation: A publisher or a studio asks how its tutorial step stall rate compares with other games in the genre
  mechanism: >-
    A benchmark table is rebuilt nightly from opted-in studios only, holding per concept (universal ontology, sec-6) the
    distribution across studios; a query returns the asking studio's percentile bucket (bottom quartile, middle, top quartile)
    and the group size, never another studio's value. If fewer than 5 studios or 1,000 players are in the group, the planner
    abstains with "benchmark unavailable (group too small)".
  example: >-
    "Is our step-3 stall rate of 24% bad?" returns "top quartile of stall rates among 7 opted-in games in the genre, 3,900
    players; higher than 5 of 7". A publisher comparing its own 12 titles inside one tenant gets exact numbers because those
    titles share a tenant.
  consequence: >-
    Refuses exact cross-studio numbers: with 2 or 3 studios in a genre, a percentile or mean leaks a competitor's value. The
    publisher's own-portfolio case is unaffected because it is single-tenant data.
  better_than_fixed_table: The fixed table cannot benchmark at all; this allows a benchmark that cannot be inverted to a competitor's number
  ingest_cost: S
  query_cost: S
  cost: M
  depends_on: universal ontology (sec-6); studio opt-in flag
  willingness: low
  p_typical: 0.07
  grounded: inferred
  evidence: 'memo: "closed-field questions become aggregate queries over all players (instant)"'
  proposed: Opt-in benchmark table with 5-studio and 1,000-player floors and bucketed output
  shallow: false

- id: sec-21
  title: The query log used to learn questions is stored per studio with question text encrypted under the studio key; JEV staff read it only through a break-glass request that notifies the studio admin and expires in 4 hours
  level: L4
  part: question-generation
  cell: {part: feedback-loop-from-query-log, question-origin: failed-query-log, tenancy-and-deployment: logically-isolated-per-studio, user-segment: jev-internal-ops, mechanism-type: human-in-the-loop, moment-in-journey: steady-state-weekly, effort: S-weeks}
  object: memo item 2 "the question set grows from real use"; memo item 3 "coverage of real studio questions"
  situation: A JEV engineer wants to read failed questions to add the 10 most frequent failed concept-question pairs to the planner; the questions mention unreleased mechanics by name
  mechanism: >-
    query_log rows (studio_id, user, question_ciphertext, plan_type, succeeded, latency, concept_ids) with concept_ids in
    the clear (universal ontology ids) and the text encrypted. Aggregate learning (which concepts fail most) runs on the
    clear columns. Reading text requires a break-glass ticket naming the studio and a reason; the studio admin is emailed;
    the decrypt grant lasts 4 hours and every read is logged.
  example: >-
    Weekly report: "concept crafting_station x question-type why failed 14 times at studio A" is visible to JEV without any
    text. To see the 14 phrasings an engineer opens a break-glass ticket; the studio admin receives "JEV engineer X reading
    14 failed questions to fix the planner on concept crafting_station, until 16:00".
  consequence: Question learning continues on concept ids; reading phrasing becomes rare and visible to the studio; the memo coverage test must be run on concept-level matches or on text under break-glass
  better_than_fixed_table: The fixed pipeline has no query log; this adds one that can drive question growth without JEV staff reading unreleased feature names routinely
  ingest_cost: S
  query_cost: S
  cost: S
  depends_on: universal ontology concept ids on parsed questions
  willingness: high
  p_typical: 0.04
  grounded: quote
  evidence: 'memo: "coverage of real studio questions"'
  proposed: Encrypted question text, clear concept ids, break-glass with studio notification
  shallow: false

- id: sec-22
  title: Human-analyst escalation routes only to analysts on the studio's named NDA list, shows 15-word snippets first, and requires a second approval before full transcript or clip access is opened for the case
  level: L4
  part: query
  cell: {part: query-path, query-path: human-analyst-escalation, uncertainty-policy: escalate-to-human-analyst, latency-tier: overnight, tenancy-and-deployment: logically-isolated-per-studio, user-segment: jev-internal-ops, evidence-form: quote-with-timestamp}
  object: memo item 2 planner tiers (no human tier); B-perspective ask-your-data-veteran trust collapse
  situation: The planner abstains on a question and the studio asks for a human to answer it
  mechanism: >-
    Escalation case = (studio, question, abstain reason, candidate session ids). Assignment picks from studio_config.nda_analysts
    (names, NDA signed date, expiry). The case view shows observation rows and snippets; a button "open sources" requires a
