- id: sec-23
  title: Every cached answer stores the list of session ids it was computed from; a deletion or key revocation for any of those sessions invalidates the cached answer and its evidence links within 24 hours
  level: L4
  part: query
  cell: {part: query-path, query-path: cached-prior-answer, schema-evolution: deprecate-and-migrate, evidence-form: coverage-statement-n-of-m-players, tenancy-and-deployment: logically-isolated-per-studio, mechanism-type: reuse-or-cache-prior-work, latency-tier: sub-200ms-cached}
  object: memo item 2 "cached as a new field"; spec stage 4 chatbot answers from the table
  situation: A player withdraws, a studio deletes a build's sessions, or a key is revoked (sec-14) after answers citing those sessions were cached
  mechanism: >-
    cache entry adds source_session_ids (array) and source_schema_version. A nightly job joins the cache against a
    deleted_sessions table and marks matching entries stale; a stale hit recomputes before answering and the new answer carries
    "recomputed after n sessions were removed". Field-level backfill results (memo item 2) are per-session rows, so they
    delete with the session.
  example: >-
    Cached answer "84/500 players stalled at step 3" cites 500 session ids; 20 are deleted on a withdrawal batch; the next
    identical question recomputes to "80/480 (recomputed after 20 sessions were removed)" and the 5 clips attached to the
    old answer no longer resolve.
  consequence: Deletion obligations extend to derived answers, not only rows; nightly invalidation adds a recomputation burst after large deletions
  better_than_fixed_table: The fixed table has no cache and no deletion story for derived answers; this makes deletion propagate to everything that cited the session
  ingest_cost: S
  query_cost: S
  cost: S
  depends_on: semantic cache (sec-7); deleted_sessions table
  willingness: high
  p_typical: 0.04
  grounded: inferred
  evidence: 'memo: "its result is cached as a new field"'
  proposed: source_session_ids on cache entries plus nightly invalidation join
  shallow: false

- id: sec-24
  title: Embedding vectors of transcript chunks are stored only in a per-studio vector index encrypted under the studio key; a shared cross-studio vector index is refused because embeddings of unreleased dialogue can be inverted to text
  level: L3
  part: store
  cell: {part: store, representation: transcript-chunks-with-embeddings, query-path: retrieval-then-llm, tenancy-and-deployment: logically-isolated-per-studio, build-or-buy: open-source-component, granularity: utterance, effort: S-weeks}
  object: memo item 2 "open-field questions retrieve matching observation rows across players and the model reads only those"
  situation: Retrieval over open fields or transcript chunks needs a vector index; the cheap design is one shared index with a studio_id filter
  mechanism: >-
    One index per studio (and per region, sec-11), created from an open-source vector store with encryption at rest under
    the studio KMS key; the embedding model is the same for all studios but inference runs in-VPC or under a ZDR contract
    (sec-1); the planner opens only the asking studio's index. Chunk payload holds snippet, session_id, t0, t1, concept_ids.
  example: >-
    "What did players say about the crafting bench hint?" retrieves the top 200 chunks from studio A's index, the model reads
    them and answers "63 players mention the hint; 41 say it was hidden by the chat panel" with 10 quotes and timestamps.
    No vector of studio A's dialogue sits in a structure any other tenant's query touches.
  consequence: >-
    Refuses the shared index: a filter bug or a nearest-neighbour side channel exposes vectors that recover an estimated
    50 to 90% of tokens under inversion attacks. Per-studio indexes cost more memory (30 indexes instead of 1) and lose
    cross-studio similarity search, which the reviewer does not want anyway.
  better_than_fixed_table: The fixed table has no retrieval path for open questions; this adds one whose blast radius on a bug is one tenant
  ingest_cost: M
  query_cost: S
  cost: M
  depends_on: per-studio keys; embedding inference under sec-1 contracts
  willingness: low
  p_typical: 0.05
  grounded: quote
  evidence: 'memo: "open-field questions retrieve matching observation rows across players and the model reads only those"'
  proposed: Per-studio encrypted vector indexes, no shared index
  shallow: false

- id: sec-25
  title: The agentic planner's tool set is read-only at query time; a tool that would send footage to a model (backfill, clip transcode of an embargoed build, re-extraction) returns a quote of cost and vendor and requires an admin click, and can never target another studio's sessions
  level: L4
  part: query
  cell: {part: query-path, query-path: agentic-multi-tool-plan, mechanism-type: human-in-the-loop, tenancy-and-deployment: logically-isolated-per-studio, user-segment: studio-analyst, latency-tier: minutes, question-type: outside-game-target}
  object: memo item 2 "genuinely new questions trigger a one-time batch extraction over all sessions"
  situation: An analyst asks a question outside the extracted fields and the planner decides to backfill, which would send 500 sessions of frames and audio to a vendor
  mechanism: >-
    Tools are typed as read (sql, retrieve, cache, clip_lookup for released builds) or footage-moving (backfill_field,
    reextract, clip_transcode for embargoed builds). Footage-moving tools return a plan card (sessions, frames, seconds of
    audio, vendor, model, cost, ETA) and a pending job id; only an admin role can confirm; the job is bound to the asking
    studio's session set by the RLS role (sec-5). The planner answers meanwhile with what read tools give (progressive).
  example: >-
    "How many players tried to craft before the tutorial unlocked crafting?" has no field. The chatbot answers "no field yet;
    from speech, 31 players mention trying to craft early (coverage 500/500 for speech); a backfill over screen state would
    cost 500 sessions to vendor A model Y, about 40 minutes; admin approval needed". The admin confirms; 142/500 arrives later.
  consequence: A single analyst question cannot move footage; the lazy path of memo item 2 gains an approval step and an interim answer; admins see every backfill as a cost and vendor decision
  better_than_fixed_table: The fixed table cannot answer outside its questions; this can, with each footage movement approved
  ingest_cost: S
  query_cost: M
  cost: M
  depends_on: planner tiers (memo item 2); roles (sec-9); audit log (sec-16)
  willingness: high
  p_typical: 0.06
  grounded: quote
  evidence: 'memo: "genuinely new questions trigger a one-time batch extraction over all sessions"'
  proposed: Read vs footage-moving tool typing with admin confirmation cards
  shallow: false

- id: sec-26
  title: Build metadata carries embargoed_until; any answer, digest or export that includes an embargoed build is restricted to users with the embargo role until the date passes, after which the restriction lifts automatically and cross-build comparisons open to all project members
  level: L4
  part: query
  cell: {part: tenancy-access-control, modality: build-version-metadata, question-type: compare-versions, scope: build-version-pair, moment-in-journey: new-build-version, user-segment: producer-exec, delivery-surface: scheduled-digest}
  object: spec stage 1 session capture (no build concept); memo item 2 aggregate queries; B-perspective game-designer-asker "comparing versions"
  situation: A studio ingests sessions of build 1.4 (unannounced features) while build 1.3 is live and the whole studio uses the chatbot
  mechanism: >-
    builds table gains embargoed_until (date) and embargo_role (string). The planner adds a predicate excluding embargoed
    builds for askers without the role and states it: "excluding 1 embargoed build". Scheduled digests and exports apply the
    same filter per recipient. A daily job clears the flag when the date passes and re-enables cached comparisons.
  example: >-
    A producer without the role asks "Did step-3 stalls drop between 1.3 and 1.4?" and gets "1.3: 24% of 480 players; 1.4 is
    embargoed until the announcement date; ask a user with the embargo role". After the date, the same question returns
    "24% to 15% (480 vs 390 players)".
  consequence: Pre-announcement data is invisible to most of the studio without separate projects; a mis-set date hides data from everyone until an admin fixes it
  better_than_fixed_table: The fixed table has no build concept, so pre-release results mix with live ones for every user
  ingest_cost: S
  query_cost: S
  cost: S
  depends_on: build_version on sessions (session stitching); roles (sec-9)
  willingness: high
  p_typical: 0.05
  grounded: inferred
  evidence: 'spec: "A player gameplay session is captured as video. A session can be n hours"'
  proposed: embargoed_until and embargo_role on builds, enforced by the planner, digests and exports
  shallow: false

- id: sec-27
  title: Player identity is an HMAC pseudonym computed with a studio-held key before upload; JEV never holds the mapping, find-players-who answers return pseudonyms, and the studio re-identifies in its own warehouse
  level: L4
  part: store
  cell: {part: export-integration, modality: player-profile-metadata, question-type: find-players-who, evidence-form: per-player-list, tenancy-and-deployment: logically-isolated-per-studio, user-segment: studio-data-engineer, delivery-surface: api-sdk}
  object: spec stage 4 "a question over, say, 500 players"; memo item 1 session-level observation log
  situation: The studio uploads sessions with its internal player ids and later asks for the list of players who churned at a step
  mechanism: >-
    The upload SDK computes player_pseudo_id = HMAC-SHA256(studio_key, player_id) client-side; JEV stores only the pseudonym
    plus allowed profile fields chosen at onboarding (platform, region bucket, playtest wave). Answers with per-player lists
    return pseudonyms; the export (sec-13) and the API carry the same ids so the studio joins them to telemetry with the key
    it holds.
  example: >-
    "Which players quit at tutorial step 3 and never returned?" returns 97 pseudonyms with timestamps; the studio data
    engineer joins to its player table and finds 61 of the 97 were on the mobile platform.
  consequence: A JEV breach exposes no studio player identifiers; JEV cannot answer questions that need profile fields the studio did not include at onboarding
  better_than_fixed_table: The fixed table keys on video and whatever id the studio sent; this fixes the key as a pseudonym by construction
  ingest_cost: S
  query_cost: S
  cost: S
  depends_on: upload SDK; studio-held key
  willingness: high
  p_typical: 0.1
  grounded: quote
  evidence: 'spec: "so that a question over, say, 500 players is fast"'
  proposed: Client-side HMAC pseudonymisation in the upload SDK
  shallow: false

- id: sec-28
  title: Slack and Jira integrations post counts, percentages and deep links only; quotes, snippets and clips are never posted into a third-party chat tool, and the deep link requires SSO on the JEV side
  level: L4
  part: ui
  cell: {part: chatbot-ui, delivery-surface: slack-jira-integration, evidence-form: count-with-denominator, user-segment: producer-exec, tenancy-and-deployment: logically-isolated-per-studio, moment-in-journey: steady-state-weekly, effort: XS-days}
  object: spec stage 4 chatbot; memo item 1 "quote with timestamp as evidence"
  situation: A producer wants the weekly tutorial-churn number in a Slack channel and a Jira ticket per top issue
  mechanism: >-
    Integration payload schema is limited to: metric name, value, denominator, build, date range, deep link. The renderer
    for these surfaces has no quote or clip field. A Jira ticket body holds the same plus concept ids; the deep link opens the
    chatbot answer behind SSO (sec-9) where the role decides whether quotes and clips appear.
  example: >-
    Slack post: "Tutorial step-3 abandonment, build 1.3, week 43: 24% (115/480). Open in JEV". Clicking it shows the analyst
    the 115 pseudonyms, 10 quotes and 5 clips; the Slack message itself carries none.
  consequence: >-
    Refuses the convenient "post the 5 clips to the channel" feature: a Slack workspace commonly includes contractors and
    external guests, and Slack retention is outside the studio's control. Producers get numbers where they already are.
  better_than_fixed_table: The fixed-table chatbot has no push surface; this adds one that cannot carry footage or speech
  ingest_cost: S
  query_cost: S
  cost: S
  depends_on: SSO deep links (sec-9)
  willingness: low
  p_typical: 0.04
  grounded: inferred
  evidence: 'memo: "quote with timestamp as evidence"'
  proposed: Numbers-plus-link payload schema for chat tool integrations
  shallow: false

- id: sec-29
  title: Public-reviews-and-community mining as a question source is disabled for any game with an embargoed build or an unannounced title; querying the public web with the title or codename is itself a leak signal
  level: L3
  part: question-generation
  cell: {part: question-generation, question-origin: public-reviews-and-community-mining, moment-in-journey: pre-launch-greenlight, modality: build-version-metadata, tenancy-and-deployment: logically-isolated-per-studio, subject-domain: onboarding-tutorial, mechanism-type: transfer-across-games}
  object: memo item 3 question generation inputs; C-axes question-origin value public-reviews-and-community-mining
  situation: The question generator wants to seed tutorial questions from Steam reviews and Reddit threads for a title that has not been announced
  mechanism: >-
    studio_config.public_mining = off by default; it can be turned on per game only when the game has no embargoed build
    and announced = true. When off, the generator uses genre-template and ontology sources only; when on, searches use the
    public title string, never internal codenames, and the search log is kept in the per-studio audit.
  example: >-
    For an unannounced title the generator seeds tutorial-churn questions from the genre library ("did the player skip the
    crafting tutorial prompt") rather than from reviews of the studio's previous game, which would require naming the studio
    in a search. After announcement, mining the previous game's reviews adds 12 questions such as "did players complain the
    bench hint disappears too fast".
  consequence: >-
    Refuses an otherwise cheap question source before announcement: a search query containing a codename reaches a search
    vendor's logs. Post-announcement the source is allowed with public names only.
  better_than_fixed_table: Fixed questions are hand-written and so leak nothing; this keeps that property while allowing mining once the title is public
  ingest_cost: S
  query_cost: S
  cost: S
  depends_on: embargo flag on builds (sec-26); announced flag per game
  willingness: low
  p_typical: 0.03
  grounded: inferred
  evidence: 'memo: "Questions are generated from an ontology (entities x dimensions x outcomes), pruned by the game target"'
  proposed: public_mining flag gated on announced and no embargoed build
  shallow: false

- id: sec-30
  title: Continuous extraction during a live playtest session (streaming frames and audio to a vendor as the player plays) is refused for embargoed builds; extraction starts only after the session is closed, masked (sec-17) and scanned (sec-3)
  level: L3
  part: ingestion
  cell: {part: ingestion-extraction, extraction-trigger: continuous-during-live-session, latency-tier: push-no-query, modality: frame-embeddings, tenancy-and-deployment: logically-isolated-per-studio, mechanism-type: push-instead-of-pull, subject-domain: onboarding-tutorial}
  object: spec stage 1 "A session can be n hours; each video is capped at 15 minutes"; A-frame "ingestion cost fine"
  situation: A proposal to alert the studio in real time when a player stalls in the tutorial, which requires streaming each 15-minute video to a model as it closes
  mechanism: >-
    Ingestion is batch-only for embargoed builds: a session's videos are processed after session_end plus a 10-minute hold
    during which masking, string-table matching and quarantine run. Real-time alerts are allowed for released builds and
    for in-VPC-only pipelines (sec-2, sec-12). The decision is a per-studio setting with a default of batch.
  example: >-
    A studio wants "ping us when a player has been on tutorial step 3 for 3 minutes". For the embargoed build the answer is a
    morning digest: 23 players crossed 3 minutes on step 3 yesterday, median 4 min 50 s. For the released build the same
    rule fires a live alert within 60 seconds.
  consequence: >-
    Refuses real-time for unreleased content: streaming bypasses the minimisation and quarantine stages and multiplies the
    number of vendor calls that touch raw frames. Studios lose live intervention during playtests of unreleased builds.
  better_than_fixed_table: The fixed pipeline is batch too; this keeps batch for sensitive builds while allowing live alerts where the content is public
  ingest_cost: S
  query_cost: S
  cost: S
  depends_on: embargo flag (sec-26); masking and quarantine stages
  willingness: low
  p_typical: 0.04
  grounded: quote
  evidence: 'spec: "A session can be n hours; each video is capped at 15 minutes, so one session is many videos"'
  proposed: Batch-only ingestion with a 10-minute hold for embargoed builds
  shallow: false

- id: sec-31
  title: Per-studio vendor allowlist decides at query time which model may read retrieved rows; if no allowed vendor is available for the modality, the planner abstains with a coverage statement instead of silently routing to another model
  level: L4
  part: query
  cell: {part: query-path, query-path: retrieval-then-llm, uncertainty-policy: abstain-below-coverage, tenancy-and-deployment: logically-isolated-per-studio, build-or-buy: managed-cloud-service, latency-tier: under-30s, question-type: what-said}
  object: memo item 2 "the model reads only those"
  situation: The retrieval tier needs a model to read 200 observation rows with quotes; the studio allows only vendor A, which is down or rate-limited
  mechanism: >-
    The planner's model selector takes the studio allowlist (sec-1) as a hard filter; fallback order is within the allowlist
    only (vendor A model Y, then vendor A model X, then in-VPC open-weight model if deployed). If none responds within 20
    seconds the answer is "could not read the 200 matching rows under your vendor policy; counts only: 63 rows match" and
    the question is queued for retry.
  example: >-
    "What did players say about the bench hint?" during a vendor A outage returns "63 matching rows across 500 players;
    quote reading unavailable under your vendor policy; retry queued" rather than quotes produced by an unapproved vendor B.
  consequence: Availability of the retrieval tier is bounded by the studio's own allowlist; the studio sees the trade-off in the answer and can widen the list
  better_than_fixed_table: The fixed-table chatbot runs on whatever model JEV picks; this makes the read model a studio policy at query time too
  ingest_cost: S
  query_cost: S
  cost: S
  depends_on: vendor allowlist (sec-1)
  willingness: high
  p_typical: 0.05
  grounded: quote
  evidence: 'memo: "the model reads only those"'
  proposed: Allowlist-filtered model selector with abstain-and-queue on exhaustion
  shallow: false

- id: sec-32
  title: A vendor-risk packet (subprocessor list, regions, ZDR contract ids, SSO config, retention settings, last 90 days of footage movements) is generated from the live configuration and audit log as a standard report for the studio's security team
  level: L4
  part: ui
  cell: {part: tenancy-access-control, delivery-surface: dashboard-standard-report, user-segment: jev-internal-ops, moment-in-journey: renewal-review, evidence-form: extraction-provenance-model-and-schema-version, latency-tier: minutes, effort: XS-days}
  object: spec "Buyers are gaming studios"; sec-1 allowlist, sec-11 region, sec-16 audit log as inputs
  situation: Annual renewal or initial procurement, when the studio sends a 200-question vendor questionnaire
  mechanism: >-
    A report page per studio reads studio_config (region, vendors, contracts, retention days, mask count, roles, embargoed
    builds) and the model-call audit log and renders: subprocessors in use (not a generic list), footage movements by vendor
    for 90 days, users with clip_access, break-glass events, key status. Exportable as PDF and JSON; regenerated on demand.
  example: >-
    The packet shows "vendor A (eu-west, ZDR JEV-A-0042) received 1,204 videos; 0 other vendors; 6 users with clip_access;
    2 break-glass reads; raw video retention 90 days; 1 embargoed build". The security reviewer checks the tutorial-churn
    answers were produced under exactly these settings.
  consequence: Procurement time drops from weeks of questionnaire exchange to a packet the studio can verify against its own SIEM copy; the packet is only as true as the audit log, which must be tamper-evident (append-only with daily hash chain)
  better_than_fixed_table: The fixed pipeline has no configuration a studio can audit; this makes the security posture a report that the data itself supports
  ingest_cost: S
  query_cost: S
  cost: S
  depends_on: sec-1, sec-11, sec-16
  willingness: high
  p_typical: 0.03
  grounded: inferred
  evidence: 'spec: "Buyers are gaming studios"'
  proposed: Config-plus-audit-driven vendor-risk report page
  shallow: false
