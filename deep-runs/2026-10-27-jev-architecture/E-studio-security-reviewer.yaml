    Studio asks "How many players stalled at tutorial step 3?" during a partial upgrade: "84/500 (312 sessions extracted
    with model X, 188 with model Y; stall definition unchanged between versions)".
  consequence: No frame is sent to a model the studio has not approved; upgrade rollout across 30 studios takes weeks, and JEV must support 2 schema versions concurrently
  better_than_fixed_table: The fixed table is silently re-run; this makes each model that sees footage an explicit, approved, logged choice
  ingest_cost: M
  query_cost: S
  cost: M
  depends_on: provenance columns (sec-1); versioned fields
  willingness: high
  p_typical: 0.05
  grounded: inferred
  evidence: 'memo: "one-time batch extraction over all sessions whose result is cached as a new field"'
