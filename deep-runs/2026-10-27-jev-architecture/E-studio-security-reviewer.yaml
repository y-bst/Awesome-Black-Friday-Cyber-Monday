- id: sec-14
  title: Raw video and transcripts are encrypted per studio with a key the studio can revoke; crypto-shredding on revocation makes re-processing impossible, which contradicts the frame assumption that originals remain available
  level: L3
  part: store
  cell: {part: store, tenancy-and-deployment: logically-isolated-per-studio, schema-evolution: model-upgrade-reextract, extraction-trigger: on-model-upgrade, mechanism-type: defer-to-query-time, moment-in-journey: renewal-review, effort: S-weeks}
  object: A-frame assumption "original videos remain available for re-processing, including frames"; memo item 2 backfill over all sessions
  situation: A game launches, the studio ends its contract, or a leak investigation requires proof that footage is gone
  mechanism: >-
    Each studio has a KMS key; video objects, transcripts and quarantined text are encrypted under a per-session data key
    wrapped by the studio key. The studio (admin role) can revoke the key with a 7-day grace period; after revocation every
    backfill, re-extraction or clip request for that studio returns "source unavailable (key revoked on date)". Observation
    rows (closed fields and 15-word snippets) remain readable unless the studio also deletes the project.
  example: >-
    After launch the studio revokes the key for build 0.9 footage. A later question "Show me clips of players stalling at the
    old crafting bench" answers from rows only: 97/500 stalled, 0 clips available, snippets still shown.
  consequence: The memo item 2 backfill and any model-upgrade re-extraction become impossible for revoked sessions, so new fields have coverage gaps that the coverage statement must show; the reviewer prefers this to indefinite retention of pre-release footage
  better_than_fixed_table: Fixed answers survive deletion as well; this additionally gives the studio a provable kill switch on the raw material
  ingest_cost: S
  query_cost: S
  cost: S
  depends_on: per-studio KMS keys; coverage statements in answers
  willingness: high
  p_typical: 0.06
  grounded: inferred
  evidence: 'A-frame: "original videos remain available for re-processing, including frames"'
  proposed: Per-studio envelope encryption with studio-held revocation
  shallow: false

- id: sec-15
  title: Re-extraction on model upgrade is blocked per studio until the studio admin approves the new vendor and model version in the allowlist; sessions remain on the old schema_version and answers show mixed-version coverage until then
  level: L4
  part: ingestion
  cell: {part: schema-evolution, extraction-trigger: on-model-upgrade, schema-evolution: model-upgrade-reextract, evidence-form: extraction-provenance-model-and-schema-version, mechanism-type: human-in-the-loop, tenancy-and-deployment: logically-isolated-per-studio, uncertainty-policy: answer-with-ci-and-n}
  object: memo item 2 "one-time batch extraction over all sessions"; A-frame assumption "a modern long-context multimodal model is available at ingestion"
  situation: JEV upgrades the extraction model; re-sending every stored video of every studio to a new vendor endpoint would otherwise happen automatically
  mechanism: >-
    A model upgrade creates a pending allowlist entry per studio (vendor, model_version, endpoint_region, zdr_contract_id,
    diff summary of the 200-session eval). Re-extraction jobs for a studio are queued until an admin approves; approval is
    logged. While mixed, every answer footer carries "n sessions on schema v3 (model X), m on v4 (model Y)".
