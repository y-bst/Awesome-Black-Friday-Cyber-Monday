- id: latency-1
  title: "Materialised step-funnel cube (game x build x tutorial-step x cohort-filter) refreshed on each ingestion commit, so count/how-long questions are one row lookup"
  level: L4
  cell: {part: store, representation: olap-cube-materialized-views, granularity: tutorial-step, query-path: precomputed-aggregate, latency-tier: sub-200ms-cached, mechanism-type: precompute-more, question-type: how-many}
  object: "spec.md stage 3: 'The answers form a structured table per video'; memo point 2: 'closed-field questions become aggregate queries over all players (instant)'"
  situation: "A studio analyst asks 'what share of 500 players quit during tutorial step 3 on build 1.4' and the planner must answer in under 2 s"
  consequence: "Aggregate rows exist before the question: planner matches (step=3, build=1.4, metric=exit_rate) and reads 1 row; no scan of ~600k observation rows (500 players x ~1.2k observations) per question"
  p_typical: 0.45
  grounded: quote
  evidence: "memo.md: 'closed-field questions become aggregate queries over all players (instant)'"
  proposed: "Table funnel_cube(game_id, build_id, step_id, segment_key, players_entered, players_exited, players_completed, median_seconds, p90_seconds, retries_sum, ingested_through_ts); incremental upsert per ingested session; segment_key covers the 8 most-used closed filters (platform, device, prior-genre-experience, language, age-band, input-type, session-length-bucket, recruit-source)"
  shallow: false
  mechanism: "Store-side: after each session's observation log commits, a trigger rolls the per-player step rows into the cube partition for that game/build; the planner's first branch is cube lookup; cube misses fall through to column scan"
  example: "Studio asks 'how many players never reached step 4'. Planner reads funnel_cube rows for steps 3 and 4 on build 1.4: players_entered(step4)=312 of 500 -> '188 of 500 (37.6%) did not reach step 4; median time in step 3 for leavers 4m10s'. Response time 120 ms"
  cost: M
  depends_on: "per-player step state rows (latency-15) or the memo's observation log with a step_on_screen field"
  part: store
  ingest_cost: S
  query_cost: S
  better_than_fixed_table: "Same latency as the fixed table but keyed on steps and segments rather than on a hand-written question id, so any count/how-long question over closed fields is answerable without a new question being written"

- id: latency-2
  title: "Semantic answer cache keyed on (question embedding, normalised cohort filter, data watermark); cosine >= 0.92 hit returns the stored answer plus 'as of N players' note"
  level: L4
  cell: {part: query-path, query-path: semantic-cache-similar-question, latency-tier: sub-200ms-cached, mechanism-type: reuse-or-cache-prior-work, representation: question-answer-bank-precomputed, moment-in-journey: steady-state-weekly, evidence-form: coverage-statement-n-of-m-players}
  object: "spec.md stage 4: 'A chatbot for the gaming studio answers the studio's questions from that table'"
  situation: "Three analysts at the same studio ask paraphrases of 'where in the tutorial do players drop' within one week"
  consequence: "Second and later askers get the first answer in under 200 ms without a planner LLM call or a store query; the cache entry records n_players=500 and ingested_through_ts so the note 'as of 500 players ingested 2026-10-25' is shown"
  p_typical: 0.25
  grounded: inferred
  evidence: "spec.md: 'a question over, say, 500 players is fast'"
  proposed: "Cache row: (studio_id, game_id, q_embedding, filter_hash, schema_version, watermark_ts, answer_json, evidence_refs); lookup = ANN over q_embedding filtered by studio_id+game_id+filter_hash; threshold 0.92 tuned on a 200-pair paraphrase set; miss -> planner"
  shallow: false
  mechanism: "Query path: a pre-planner stage embeds the question (small embedding model, ~30 ms), normalises the cohort filter into a canonical hash, and looks up prior answers; hits short-circuit the planner"
  example: "Day 1: 'which tutorial step loses the most players' -> planner, 1.8 s, cached. Day 3: 'biggest drop-off point in the tutorial?' cosine 0.94 to the day-1 entry, same filter hash, same watermark -> served in 90 ms with the day-1 evidence clip list"
  cost: S
  depends_on: "nothing (works over the existing fixed table too)"
  part: query
  ingest_cost: S
  query_cost: S
  better_than_fixed_table: "The fixed table caches extraction, not answers; this caches the planner+aggregation work, which is the only part of the fixed-table path that still costs an LLM call per question"

- id: latency-3
  title: "Watermark-scoped cache invalidation: each cached answer carries max(session_ingested_at) and schema_version; new ingestion invalidates only entries whose cohort filter intersects the new sessions"
  level: L4
  cell: {part: store, query-path: cached-prior-answer, mechanism-type: reuse-or-cache-prior-work, schema-evolution: append-only-versioned-fields, extraction-trigger: at-ingestion, latency-tier: sub-200ms-cached}
  object: "memo.md point 2: 'its result is cached as a new field'"
  situation: "A new batch of 60 sessions on build 1.5 lands while 40 cached answers exist, 30 of them filtered to build 1.4"
  consequence: "Only the 10 entries whose filter includes build 1.5 (or no build filter) are marked stale; the 30 build-1.4 entries keep serving at 90 ms; stale entries are recomputed by a background worker before the next ask, so the studio never sees a cold cache after ingestion"
  p_typical: 0.08
  grounded: inferred
  evidence: "spec.md: 'Ingestion time and cost are not a concern. Answering a studio's question must be fast.'"
  proposed: "Invalidation predicate = filter_hash intersects set(new_session attributes) OR schema_version < current; stale entries recomputed in order of hit-count-last-30-days, budget 200 recomputes per ingestion batch"
  shallow: false
  mechanism: "Store: cache rows gain (watermark_ts, filter_predicate_json); the ingestion commit hook evaluates the predicate against the new sessions' attribute set and flags matches stale; a worker recomputes flagged rows, most-hit first"
  example: "Cached 'step-3 exit rate on build 1.4' = 37.6% stays valid when build 1.5 sessions arrive; cached 'step-3 exit rate, all builds' is recomputed in the background to 35.9% (560 players) and the next asker sees the new number with 'as of 560 players'"
  cost: S
  depends_on: "latency-2 (answer cache) and ingestion commit hook"
  part: store
  ingest_cost: S
  query_cost: S
  better_than_fixed_table: "The fixed table has no answer cache at all; without scoped invalidation a cache either serves wrong numbers after ingestion or is flushed entirely, which is the trust-collapse case"

- id: latency-4
  title: "Two-tier progressive answer: closed-field aggregate streamed within 2 s, then LLM-read refinement over retrieved observation rows streamed within 30 s, with the first tier labelled 'from counts' and the second 'from quotes'"
  level: L4
  cell: {part: query-path, query-path: progressive-answer-then-refine, latency-tier: progressive-streaming, mechanism-type: approximate-then-refine, question-type: why, uncertainty-policy: give-range-then-refine, delivery-surface: chatbot}
  object: "memo.md point 2: 'open-field questions retrieve matching observation rows across players and the model reads only those'"
  situation: "Designer asks 'why do players quit at step 3' which has both a closed component (friction_signal counts at step 3) and an open one (what they said)"
  consequence: "At 1.5 s the chat shows 'step 3: 188 exits; friction signals: 61% repeated-failed-input, 22% menu-confusion, 9% silence > 60 s'; at 18 s a second block appends 3 themes with 2 quotes each; the analyst can stop reading at tier 1"
  p_typical: 0.15
  grounded: quote
  evidence: "memo.md: 'the model reads only those'"
  proposed: "Planner emits a plan with two stages; stage 1 is SQL over closed fields, stage 2 is retrieval (k <= 150 rows) + one LLM call; the UI renders stage 1 immediately and streams stage 2 tokens"
  shallow: false
  mechanism: "Query path and UI: planner always produces a cheap stage and an expensive stage for why/how-felt/what-said questions; both run concurrently; stage 1 result is final-formatted, stage 2 is appended"
  example: "'why do players quit at step 3' -> tier 1 (1.4 s): counts above; tier 2 (17 s): 'Theme A: the jump prompt disappears before players read it (41 quotes, e.g. 02:13 \"wait what did it say\"); Theme B: ...'"
  cost: M
  depends_on: "observation log with closed friction_signal enum and retrievable utterance rows"
  part: query
  ingest_cost: S
  query_cost: M
  better_than_fixed_table: "Fixed table can only ever give tier 1 and only for pre-written questions; this gives a numeric tier at fixed-table speed and an open tier the fixed table cannot produce at all"

- id: latency-5
  title: "Sampled map-reduce with confidence interval for new-field questions: run the extractor on a random 50 of 500 sessions, return estimate +/- CI in under 30 s, continue to all 500 in the background and promote the result to a cached field"
  level: L4
  cell: {part: query-path, query-path: sampled-map-reduce-with-ci, latency-tier: under-30s, mechanism-type: approximate-then-refine, uncertainty-policy: answer-with-ci-and-n, extraction-trigger: on-first-question, evidence-form: count-with-denominator, scope: all-players}
  object: "memo.md point 2: 'genuinely new questions trigger a one-time batch extraction over all sessions whose result is cached as a new field'"
  situation: "Studio asks 'how many players tried to skip the tutorial cutscene' and no field exists; a full 500-session pass is ~500 x 1.5k-token session summaries = 750k tokens plus 500 calls"
  consequence: "At ~20 s the chat shows '14 of 50 sampled players (28%, 95% CI 17-42%) tried to skip; full pass of 500 running, expected in 6 min'; the field skip_cutscene_attempt is then available for every later question at cube speed"
  p_typical: 0.12
  grounded: quote
  evidence: "memo.md: 'triggers a one-time batch extraction over all sessions'"
  proposed: "Sample size 50 uniform random with stratification by build; Wilson interval; background job writes the field with extraction_provenance (model, prompt_hash, schema_version); the answer message is updated in place when the full pass completes"
  shallow: false
  mechanism: "Query path: the lazy-backfill branch is split into sample-first (parallel 50 calls, p95 under 20 s) and full (queued); the planner returns the sample answer with n and CI and a job id"
  example: "'how many players tried to skip the cutscene' -> 28% (n=50, CI 17-42) at 19 s; at 6 min 31 s the message updates to '131 of 500 (26.2%)'"
  cost: M
  depends_on: "per-session summary or observation log small enough to read per session (latency-10 keeps it under 2k tokens)"
  part: query
  ingest_cost: S
  query_cost: M
  better_than_fixed_table: "Fixed table answers nothing outside its question list; this answers an unknown question in under 30 s with an honest range instead of a 6-minute wait or a refusal"

- id: latency-6
  title: "Per-studio backfill budget governor: estimate cost = n_sessions x mean_session_tokens x price before any lazy backfill; if the estimate exceeds the studio's remaining monthly budget, run the 50-session sample now and queue the remainder for the overnight window"
  level: L4
  cell: {part: cost-governance, query-path: lazy-backfill-extraction, mechanism-type: narrow-or-clarify-the-question, extraction-trigger: on-first-question, latency-tier: overnight, user-segment: jev-internal-ops, uncertainty-policy: give-range-then-refine}
  object: "memo.md point 2: 'genuinely new questions trigger a one-time batch extraction over all sessions'"
  situation: "One analyst asks 12 novel questions in an afternoon against 2,000 sessions; each full backfill is ~3M input tokens"
  consequence: "Without a governor the 12 questions spend ~36M tokens in one afternoon; with it, each gets a sampled answer in under 30 s and the 12 full passes are batched into one overnight run (latency-8) that reads each session once"
  p_typical: 0.06
  grounded: inferred
  evidence: "spec.md: 'Ingestion time and cost are not a concern' (ingestion, not query-triggered re-extraction, which the memo introduces)"
  proposed: "Budget table per studio (monthly_token_budget, spent, reserved); estimator uses stored mean tokens per session summary; thresholds: under 5% of remaining budget -> run now; 5-25% -> sample now + queue; over 25% -> sample now + ask the studio owner to approve"
  shallow: false
  mechanism: "Cost governance in the planner: a pre-execution estimator and a per-studio ledger decide run-now / sample-and-queue / sample-and-ask"
  example: "'how many players read the control hints aloud' over 2,000 sessions -> estimate 3.1M tokens = 12% of remaining budget -> sampled answer now (n=50), full pass queued for the 02:00 batch, answer message updated next morning"
  cost: S
  depends_on: "latency-5 (sampled map-reduce) and latency-8 (batching queue)"
  part: query
  ingest_cost: S
  query_cost: S
  better_than_fixed_table: "Fixed table has a fixed bill; the memo's lazy backfill has an unbounded one; the governor keeps the unbounded path while capping the bill per studio per month"

- id: latency-7
  title: "Prompt-prefix caching of each session's observation log so that every extraction call in the same batch window reuses the cached session context and pays only for the question suffix"
  level: L4
  cell: {part: ingestion-extraction, extraction-trigger: scheduled-batch, mechanism-type: reuse-or-cache-prior-work, representation: timestamped-observation-log, granularity: session, latency-tier: overnight, build-or-buy: managed-cloud-service}
  object: "memo.md point 1: 'a session-level observation log ... timestamped atomic observations across all videos of a session'"
  situation: "Nightly batch has 9 new-field questions to run over 2,000 sessions; naive execution reads each ~60k-token session log 9 times = 1.08B input tokens"
  consequence: "With the session log as a cached prefix and the 9 questions as suffixes (or one multi-question suffix, latency-8), input cost drops to ~1 full read + 8 cached reads per session; at a 90% cached-token discount the bill is ~0.2x of naive"
  p_typical: 0.07
  grounded: inferred
  evidence: "memo.md: 'timestamped atomic observations across all videos of a session'"
  proposed: "Batch runner orders calls session-major (all questions for session A, then session B), sets the session log as the cacheable prefix, keeps the prefix under the vendor's cache TTL (5 min) by running a session's questions back-to-back"
  shallow: false
  mechanism: "Ingestion/batch extraction: the call layout is reordered so the long static part (session log) is a cache-eligible prefix and the variable part (question + answer schema) is a short suffix"
  example: "Nightly questions 'tried to skip cutscene', 'read hints aloud', 'mentioned a competitor' run over session S-1042 as three calls within 40 s; the 58k-token log is billed once in full and twice at the cached rate"
  cost: S
  depends_on: "vendor prompt caching available on the ingestion model; session log materialised as text"
  part: ingestion
  ingest_cost: S
  query_cost: S
  better_than_fixed_table: "Fixed table reads each transcript once for a fixed question set and can never add a question cheaply; this makes adding the 10th question nearly free per session"

- id: latency-8
  title: "New-field question batching queue: lazy-backfill requests accumulate until 10 questions or 02:00, then one multi-question pass per session answers all of them in a single call"
  level: L4
  cell: {part: ingestion-extraction, extraction-trigger: scheduled-batch, query-path: lazy-backfill-extraction, mechanism-type: reuse-or-cache-prior-work, latency-tier: overnight, schema-evolution: eager-backfill-all-history, moment-in-journey: steady-state-weekly}
  object: "memo.md point 2: 'a one-time batch extraction over all sessions whose result is cached as a new field'"
  situation: "Across one week a studio's analysts generate 23 novel questions; each is a separate full pass under the memo's design"
  consequence: "23 passes x 2,000 sessions = 46,000 model calls become 3 nightly passes x 2,000 = 6,000 calls, each answering up to 10 questions as one JSON object; per-question marginal cost is ~1/8 of a dedicated pass"
  p_typical: 0.09
  grounded: quote
  evidence: "memo.md: 'the question set grows from real use'"
  proposed: "Queue table pending_fields(question_id, answer_schema, requested_by, requested_at); nightly job groups by game, emits one prompt with up to 10 answer slots per session; results written as 10 new versioned fields; sample answers (latency-5) serve the asker meanwhile"
  shallow: false
  mechanism: "Ingestion-side batch: the backfill trigger writes to a queue instead of starting a pass; a scheduler drains the queue once per night per game with multi-slot prompts"
  example: "Monday 10:00 'skipped cutscene?', 14:00 'used the gamepad?', 16:30 'said the word boring?' all get sampled answers; Tuesday 02:00 one pass over 2,000 sessions fills three fields; Tuesday 08:00 all three answers show full-n numbers"
  cost: M
  depends_on: "latency-5 (sampled answers) so the asker is not blocked overnight"
  part: ingestion
  ingest_cost: M
  query_cost: S
  better_than_fixed_table: "Keeps the fixed table's 'one read per session' economics while letting the question list grow by 10 per night from real usage"

- id: latency-9
  title: "Three-tier store with a planner rule that the under-2s tier may touch only hot (cube rows in Postgres) and warm (observation Parquet with zone maps on game, build, step, player) and never cold (transcripts, frames in object storage)"
  level: L4
  cell: {part: store, representation: olap-cube-materialized-views, latency-tier: under-2s, query-path: sql-over-closed-fields, mechanism-type: precompute-more, build-or-buy: open-source-component, granularity: session}
  object: "spec.md stage 4: 'Reading 500 transcripts per question was too slow and too much data'"
  situation: "A planner plan for 'median time to finish the tutorial by platform' would read 500 session logs if observation rows were in object storage"
  consequence: "Hot tier answers in ~50 ms; warm tier column scan over ~2.4M observation rows (2,000 sessions x 1.2k) partition-pruned to one game/build finishes in ~400 ms on one node; cold tier is reachable only from the minutes/overnight tiers"
  p_typical: 0.09
  grounded: quote
  evidence: "spec.md: 'Reading 500 transcripts per question was too slow and too much data, which is why the fixed-question table exists'"
  proposed: "Hot: funnel_cube + answer cache in Postgres; warm: observations as Parquet/ClickHouse partitioned by (game_id, build_id) with min/max zone maps on step_id and ts; cold: S3 transcripts/frames; planner plan validator rejects cold-tier reads for the under-2s tier"
  shallow: false
  mechanism: "Store layout plus a static planner constraint; the plan validator checks which tier each step touches before execution"
  example: "'median tutorial completion time on mobile' -> warm scan over per-player step rows filtered platform=mobile, build=1.4 -> 11m42s (n=212) in 380 ms; no transcript is opened"
  cost: M
  depends_on: "observation log written as columnar files; per-player step rows"
  part: store
  ingest_cost: S
  query_cost: S
  better_than_fixed_table: "Fixed table is one hot tier with a fixed width; this keeps hot-tier latency for closed questions while making the full observation log scannable in under 2 s rather than unreachable"

- id: latency-10
  title: "Hierarchical temporal summary tree (utterance -> 5-min window -> video -> session) precomputed at ingestion so map-reduce and backfill read the 1.5k-token session node first and descend only on low confidence"
  level: L4
  cell: {part: ingestion-extraction, representation: hierarchical-temporal-summary-tree, granularity: session, query-path: map-reduce-over-raw, mechanism-type: precompute-more, extraction-trigger: at-ingestion, latency-tier: minutes}
  object: "spec.md stage 1: 'A session can be n hours; each video is capped at 15 minutes, so one session is many videos'"
  situation: "A backfill question over 500 two-hour sessions must choose between reading 8 x ~3.5k-token video transcripts (28k) per session or one session summary"
  consequence: "Reading the session node costs ~1.5k tokens per session (750k total, ~2 min with 50-way parallelism) versus 14M tokens (~25 min); the extractor flags confidence < 0.7 and re-reads only those sessions' video nodes (typically 10-15%)"
  p_typical: 0.12
  grounded: quote
  evidence: "spec.md: 'one session is many videos'"
  proposed: "Node schema (level, parent_id, t_start, t_end, summary_text <= 300 tokens for window, <= 1500 for session, step_ids_covered, friction_count, quote_refs); built bottom-up at ingestion; query reads top-down with a per-question confidence threshold"
  shallow: false
  mechanism: "Ingestion builds the tree once; query-time readers address a node level instead of raw transcript ranges"
  example: "'did players mention the tutorial being too long' -> session nodes answer for 436 of 500 with confidence >= 0.7; 64 descend to video nodes (8 x 300 tokens); total 1.0M tokens, 2m40s, instead of 14M tokens"
  cost: M
  depends_on: "session stitching that orders videos within a session"
  part: ingestion
  ingest_cost: M
  query_cost: M
  better_than_fixed_table: "Fixed table has no path to a new question; this gives a minutes-tier path whose cost scales with session count, not with session hours"

- id: latency-11
  title: "Small-model-first extraction cascade for backfill: a cheap model answers every session, and only answers with confidence < 0.7 or that disagree with a second cheap sample go to the large model"
  level: L4
  cell: {part: ingestion-extraction, extraction-trigger: on-low-confidence-or-disagreement, mechanism-type: approximate-then-refine, query-path: lazy-backfill-extraction, evidence-form: confidence-score, latency-tier: minutes, build-or-buy: managed-cloud-service}
  object: "memo.md point 2: 'a one-time batch extraction over all sessions'"
  situation: "Backfill of 'did the player fail the jump at step 3 three or more times' over 2,000 sessions"
  consequence: "At a 15x price gap between small and large models, routing 20% of sessions to the large model costs 0.2 x 15 + 0.8 x 1 = 3.8 units versus 15 units for large-only; wall time drops because the small model is faster and the large-model tail runs in parallel"
  p_typical: 0.08
  grounded: inferred
  evidence: "spec.md: 'Ingestion time and cost are not a concern' (true for first ingestion; backfill multiplies it by the number of new questions)"
  proposed: "Cascade rule: small model with logprob-derived confidence; escalate if confidence < 0.7 OR two small samples at temperature 0.7 disagree; record escalation rate per field as an evaluation metric; target escalation 10-25%"
  shallow: false
  mechanism: "Extraction step gets a two-model router with a stored confidence per answer; evaluation compares small-only vs cascade accuracy on the hand-labelled set the memo names"
  example: "'failed the step-3 jump 3+ times' -> small model answers 2,000 sessions in 4 min, 310 escalate, large model finishes them in 3 min; field accuracy on the 100 golden sessions 94% vs 95% large-only"
  cost: M
  depends_on: "golden set from memo point 3 ('accuracy against hand-labelled sessions') to tune the threshold"
  part: ingestion
  ingest_cost: S
  query_cost: S
  better_than_fixed_table: "Makes each added question ~4x cheaper than running the table's extraction model on everything, so the question list can grow 4x for the same bill"

- id: latency-12
  title: "Precomputed question-answer bank: the top 200 ontology-generated questions per game are answered at ingestion for the all-players cohort and the 8 standard segments, and the planner's first branch is bank lookup"
  level: L4
  cell: {part: question-generation, representation: question-answer-bank-precomputed, question-origin: ontology-generated, query-path: precomputed-aggregate, latency-tier: sub-200ms-cached, mechanism-type: precompute-more, extraction-trigger: at-ingestion, scope: cohort}
  object: "memo.md point 3: 'Questions are generated from an ontology (entities x dimensions x outcomes), pruned by the game target'"
  situation: "The ontology prunes to ~900 candidate questions; 200 of them (ranked by coverage of real studio questions, memo point 3) are worth precomputing"
  consequence: "Any studio question that paraphrases one of the 200 returns in under 200 ms with the stored evidence refs; the remaining 700 are answered by cube or column scan in under 2 s; bank size x 9 cohorts = 1,800 rows per game per build, trivial storage"
  p_typical: 0.2
  grounded: quote
  evidence: "memo.md: 'judged by two tests: coverage of real studio questions and accuracy against hand-labelled sessions'"
  proposed: "bank(game_id, build_id, question_id, segment_key, answer_json, evidence_refs, n, computed_at); recomputed incrementally on ingestion; the bank's hit rate per week is the metric that decides which questions stay in the 200"
  shallow: false
  mechanism: "Question generation output feeds an ingestion-time answer job; the chatbot's semantic cache (latency-2) is seeded with the bank"
  example: "Ontology question 'exit rate per tutorial step' x segment 'mobile' is precomputed; studio asks 'where do mobile players drop in the tutorial' -> bank hit, 110 ms: 'step 3: 44% of 212 mobile players; step 1: 9%; ...'"
  cost: M
  depends_on: "ontology generator and a ranking signal (initially the owner's churn targets, later the query log)"
  part: question-generation
  ingest_cost: M
  query_cost: S
  better_than_fixed_table: "It is the fixed table done 10x wider and per segment, generated instead of hand-written, and demoted/promoted by usage rather than frozen"

- id: latency-13
  title: "REFUSED: long-context model over all raw transcripts of 500 players at query time as the default path for open questions"
  level: L3
  cell: {part: query-path, query-path: map-reduce-over-raw, representation: raw-transcript-only, latency-tier: minutes, mechanism-type: defer-to-query-time, scope: all-players, effort: XS-days}
  object: "spec.md stage 4: 'Reading 500 transcripts per question was too slow and too much data'"
  situation: "The long-context-skeptic proposes skipping the store and reading raw transcripts per question"
  consequence: "Low willingness. 500 two-hour sessions x ~28k tokens = 14M input tokens per question; at a $3/M input price that is ~$42 per question and, at 50 parallel calls of ~30 s each, a p50 of ~5 min and p95 over 10 min. A studio asking 30 questions a day would spend ~$1,260/day. Acceptable only as the minutes-tier fallback behind latency-10 and latency-5, never as the default"
  p_typical: 0.3
  grounded: quote
  evidence: "spec.md: 'Reading 500 transcripts per question was too slow and too much data, which is why the fixed-question table exists'"
  proposed: "Keep raw map-reduce as a planner branch reachable only when the summary-tree and sampled paths return confidence < 0.5, with the cost estimate shown before running"
  shallow: false
  mechanism: "Query path: raw transcripts are read per question with no intermediate store"
  example: "'why do players quit at step 3' over 500 players -> 14M tokens, ~5 min, ~$42, result not cached as a field unless someone writes the schema afterwards"
  cost: L
  depends_on: "nothing"
  part: query
  ingest_cost: S
  query_cost: L
  better_than_fixed_table: "Answers any question, but 100-300x slower and at a per-question cost the fixed table never has; it is the baseline the fixed table was built to escape"

- id: latency-14
  title: "REFUSED unless capped: agentic multi-tool planner with open-ended tool loops; accepted only with a hard cap of 3 tool calls and an 8 s wall budget before the plan degrades to the progressive path"
  level: L4
  cell: {part: query-path, query-path: agentic-multi-tool-plan, latency-tier: under-30s, mechanism-type: defer-to-query-time, uncertainty-policy: give-range-then-refine, delivery-surface: chatbot, question-type: compare-steps}
  object: "memo.md point 2: 'The chatbot runs a query planner'"
  situation: "A planner that iterates (query, inspect, re-query) on 'compare step 2 and step 3 friction for players who later churned'"
  consequence: "Uncapped loops produce a p95 of 40-90 s and 5-12 LLM calls per question; with the cap, p95 stays under 10 s and the fourth call is replaced by returning what has been computed plus 'refine with: ...' suggestions"
