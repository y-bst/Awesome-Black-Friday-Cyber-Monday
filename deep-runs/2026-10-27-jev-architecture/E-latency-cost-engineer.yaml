  p_typical: 0.09
  grounded: quote
  evidence: "spec.md: 'detecting churn in the tutorial and just after it'"
  proposed: "contrast(game_id, build_id, outcome_def, field, value, rate_churn, rate_retain, ratio, chi2_p, n_churn, n_retain, computed_at); outcome_def defaults to 'quit before tutorial end'; also computed for any saved cohort definition"
  shallow: false
  mechanism: "Scheduled batch computes contrasts; query path answers why/segment questions from the table and offers clips per attribute"
  example: "'why do players churn in the tutorial' -> top 5 contrast rows with ratios and n, each with a 'show clips' button, in 150 ms"
  cost: S
  depends_on: "latency-15 player_step rows and closed enum fields"
  part: query
  ingest_cost: S
  query_cost: S
  better_than_fixed_table: "The fixed table only answers questions someone wrote; the contrast table answers the question the studio did not know to ask, and does it at table speed"

- id: latency-30
  title: "REFUSED: continuous extraction during a live session (streaming inference per minute of play); no studio question needs sub-session freshness and it would cost streaming rates on every hour recorded"
  level: L3
  cell: {part: ingestion-extraction, extraction-trigger: continuous-during-live-session, latency-tier: push-no-query, mechanism-type: push-instead-of-pull, modality: speech-transcript, effort: L-multi-quarter}
  object: "spec.md stage 1: 'A player's gameplay session is captured as video'"
  situation: "A proposal to extract observations while the session is being recorded so the studio can watch a live friction feed"
  consequence: "Low willingness. Batch ingestion after the session can use prompt caching (latency-7), batching (latency-8) and off-peak pricing; streaming forfeits all three and adds a live inference endpoint to run; none of the spec's named problems (small question set, lost visuals, long sessions) is helped by freshness"
  p_typical: 0.04
  grounded: quote
  evidence: "spec.md: 'Ingestion time and cost are not a concern' (no freshness requirement is stated anywhere)"
  proposed: "Keep ingestion post-session; if a live feed is ever sold, run only the cheap signals of latency-26 live and leave LLM extraction in batch"
  shallow: false
  mechanism: "Ingestion runs per minute of live play instead of per completed video"
  example: "A live 'player stuck at step 3' alert during a playtest session would cost per-minute inference on all concurrent sessions; the same alert computed 20 minutes after the session ends costs batch rates"
  cost: L
  depends_on: "live capture infrastructure that does not exist in spec.md"
  part: ingestion
  ingest_cost: L
  query_cost: S
  better_than_fixed_table: "Nothing for the stated problems; only freshness, which nobody asked for"

- id: latency-31
  title: "Cohort-size gate for backfill: a query-time-defined cohort under 30 players is answered by retrieval over just those players' rows, and only cohorts of 30 or more trigger a materialised field over all sessions"
  level: L4
  cell: {part: query-path, extraction-trigger: on-cohort-size-threshold, scope: query-time-defined-cohort, query-path: lazy-backfill-extraction, mechanism-type: narrow-or-clarify-the-question, latency-tier: under-30s, effort: XS-days}
  object: "memo.md point 2: 'genuinely new questions trigger a one-time batch extraction over all sessions'"
  situation: "'did the 12 players who quit at step 5 ever open the map' asks a novel question about 12 players"
  consequence: "Reading 12 session nodes (~18k tokens, 12 parallel calls, ~8 s) answers it; a full 500-session field (~750k tokens) would be 40x the cost for a question about 12 people; the gate also prevents the field table from filling with one-off columns"
  p_typical: 0.05
  grounded: quote
  evidence: "memo.md: 'triggers a one-time batch extraction over all sessions'"
  proposed: "Planner rule: cohort_size < 30 -> per-player read with coverage statement; >= 30 -> sampled answer (latency-5) + queued field (latency-8); threshold configurable per studio"
  shallow: false
  mechanism: "Query path chooses between scoped read and materialised field by cohort size"
  example: "'did the 12 step-5 quitters open the map' -> 12 session nodes read -> '3 of 12 opened the map (confidence >= 0.8 for 11 of 12)' in 8 s; no new field"
  cost: XS
  depends_on: "latency-10 session nodes"
  part: query
  ingest_cost: S
  query_cost: S
  better_than_fixed_table: "Answers small-cohort questions the table never could, without paying for a full-population field each time"

- id: latency-32
  title: "Stale-while-revalidate for cube and bank answers: serve the cached number with its ingested-as-of timestamp immediately, recompute in the background when new sessions since the watermark exceed 5% of the cohort"
  level: L4
  cell: {part: query-path, query-path: cached-prior-answer, mechanism-type: reuse-or-cache-prior-work, latency-tier: sub-200ms-cached, evidence-form: coverage-statement-n-of-m-players, moment-in-journey: first-cohort-ingested, uncertainty-policy: always-answer}
  object: "memo.md point 2: 'aggregate queries over all players (instant)'"
  situation: "Sessions arrive continuously during a playtest week; strict invalidation (latency-3) would make most cached answers miss during the day"
  consequence: "Answers stay under 200 ms all day; the 'as of 480 of 500 players (ingested 14:05)' note tells the asker what is missing; background recompute runs when the delta crosses 5% (25 sessions) or at 30-minute intervals"
  p_typical: 0.07
  grounded: quote
  evidence: "memo.md: '(instant)'"
  proposed: "Cache entry gains (n_at_compute, sessions_since_watermark); serve rule: always serve if sessions_since < 5% of n, else serve and enqueue recompute; UI shows the as-of line on every cached answer"
  shallow: false
  mechanism: "Query path: cache serving policy with a freshness note in the answer"
  example: "At 15:10, 'step-3 exit rate' -> '36.2% as of 480 of 500 players (14:05); updating' in 95 ms; at 15:11 the message updates to 35.9% (n=500)"
  cost: XS
  depends_on: "latency-3 watermarks"
  part: query
  ingest_cost: S
  query_cost: S
  better_than_fixed_table: "The fixed table has no notion of 'as of'; this keeps cache speed during ingestion and states the denominator"

- id: latency-33
  title: "Nightly Parquet export of the cube, player_step rows and contrast table to the studio's warehouse, so heavy BI queries run on the studio's compute and never enter JEV's query budget"
  level: L4
  cell: {part: export-integration, delivery-surface: warehouse-share-or-export, tenancy-and-deployment: federated-query-into-studio-warehouse, user-segment: studio-data-engineer, latency-tier: overnight, mechanism-type: push-instead-of-pull, schema-evolution: append-only-versioned-fields}
  object: "spec.md stage 4: 'A chatbot for the gaming studio answers the studio's questions from that table'"
  situation: "A studio data team runs 200 dashboard queries a day joining tutorial outcomes to their telemetry"
  consequence: "Those 200 queries hit Snowflake, not the chatbot; JEV's query-time inference bill is unaffected; the export schema is append-only with versioned columns (new field = new column, never a rename) so the studio's dbt models do not break"
  p_typical: 0.06
  grounded: inferred
  evidence: "spec.md: 'Buyers are gaming studios. Their questions are not known in advance.'"
  proposed: "Nightly job writes partitioned Parquet (game_id, build_id, dt) for funnel_cube, player_step, contrast, observations (enum columns only) to a per-studio bucket or Snowflake share; a schema manifest with field versions is published alongside"
  shallow: false
  mechanism: "Export integration: precomputed tables leave JEV; the chatbot remains for open and clip questions"
  example: "Studio joins player_step (step 3, outcome=quit) to its own purchase events in Snowflake to ask 'do step-3 quitters ever return'; JEV answers nothing at query time"
  cost: S
  depends_on: "latency-1, latency-15, latency-29 tables"
  part: store
  ingest_cost: S
  query_cost: S
  better_than_fixed_table: "The fixed table is only reachable via the chatbot; the export makes the precomputed layer joinable to telemetry at the studio's cost"

- id: latency-34
  title: "Per-step representative-quote index built at ingestion: top 10 quotes per (step, sentiment, friction_signal) chosen by centroid distance, stored as a small table so 'what do players say about step 3' needs no retrieval and no LLM"
  level: L4
  cell: {part: store, representation: per-step-summary, granularity: tutorial-step, query-path: precomputed-aggregate, question-type: what-said, latency-tier: sub-200ms-cached, mechanism-type: precompute-more, evidence-form: quote-with-timestamp}
  object: "memo.md point 1: 'utterance, friction signal, sentiment, quote with timestamp as evidence'"
  situation: "'what do players say about step 3' is the most common open question in the query log"
  consequence: "Answer is 10 quotes per sentiment bucket with timestamps and clip refs from a 40-row read (~20 ms), with the count of all matching utterances as the denominator; retrieval-then-LLM (latency-19) is reserved for questions the index does not cover"
  p_typical: 0.08
  grounded: quote
  evidence: "memo.md: 'quote with timestamp as evidence'"
  proposed: "step_quotes(game_id, build_id, step_id, sentiment, friction_signal, rank, utterance, ts, player_id, clip_url, n_total); refreshed incrementally; selection = 10 nearest to the embedding centroid of the bucket plus 2 farthest for diversity"
  shallow: false
  mechanism: "Store: an ingestion-time quote summary per step bucket; query path reads it before considering retrieval"
  example: "'what do players say about step 3' -> 'Negative (412 utterances from 97 players), 10 representative: 02:13 \"wait what did it say\" ...; Confused (203): ...' in 25 ms"
  cost: S
  depends_on: "observation embeddings and latency-16 log"
  part: store
  ingest_cost: S
  query_cost: S
  better_than_fixed_table: "Gives what-said answers with evidence at the table's latency; the table has only option-letter answers"
