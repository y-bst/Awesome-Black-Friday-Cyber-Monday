- id: longctx-9
  title: "Quote-verification in the reduce step: every per-player answer must carry a verbatim quote and a timestamp; the reducer drops any answer whose quote is not a substring of that player's transcript within 30 s of the timestamp"
  level: L4
  cell: {part: evaluation, evidence-form: quote-with-timestamp, query-path: map-reduce-over-raw, uncertainty-policy: abstain-below-coverage, granularity: utterance, mechanism-type: defer-to-query-time, effort: XS-days, user-segment: studio-analyst}
  object: "memo.md item 1: 'quote with timestamp as evidence'"
  situation: "Map call for player 412 returns {quit_at_step: 3, quote: 'I give up on this farm'} but the transcript contains no such string (hallucinated evidence)"
  consequence: "The answer for player 412 is marked 'unverified' and excluded from the count; the reduce output reads '61/500 verified, 4 unverified'; the analyst never sees a fabricated quote as evidence"
  p_typical: 0.09
  grounded: quote
  evidence: "memo.md: 'quote with timestamp as evidence'"
  proposed: "Reducer runs normalised substring match (case, punctuation stripped) over the window [t-30s, t+30s] of the session document; mismatch -> status unverified; report both counts"
  shallow: false
  mechanism: "Deterministic post-filter between map and reduce; no model call; per-player status field added to the map JSON"
  example: "'What did players say right before quitting step 3?' returns 34 quotes; 2 fail verification and are listed separately as 'model-reported, quote not found'"
  cost: S
  depends_on: "longctx-1, longctx-4"
  part: evaluation
  ingest_cost: S
  query_cost: S
  better_than_fixed_table: "The table stores an option letter with no evidence; this stores a checkable quote and refuses unverifiable ones"

- id: longctx-10
  title: "Two-level reduce for 'why' questions: 500 per-player free-text reasons -> 10 shards of 50 -> one final call that outputs at most 8 labelled reason buckets, each with count/denominator and 3 example quotes"
  level: L4
  cell: {part: query-path, question-type: why, query-path: map-reduce-over-raw, evidence-form: clip-montage-n-examples, scope: all-players, latency-tier: under-30s, mechanism-type: defer-to-query-time, user-segment: game-designer}
  object: "spec.md step 3: 'The targets are mostly detecting churn in the tutorial and just after it'"
  situation: "Designer asks 'why do players quit at step 3'; 500 map outputs each contain a 1-2 sentence reason; a single reduce over 100k tokens of reasons produces vague buckets"
  consequence: "Shard reduce (10 calls of about 10k tokens) each produces up to 8 candidate buckets with counts; the final call merges buckets by meaning and sums counts; the designer gets 'build menu not found 29/61, prompt text unclear 14/61, bored 9/61, other 9/61' with quotes"
  p_typical: 0.08
  grounded: quote
  evidence: "spec.md: 'detecting churn in the tutorial and just after it'"
  proposed: "Reduce prompt schema: [{label, count, player_ids, quotes[3]}]; final merge must preserve sum of counts = number of verified map answers"
  shallow: false
  mechanism: "Hierarchical reduce with a fixed output schema; bucket labels are free text but counts are arithmetic over player ids, so they reconcile"
  example: "'Why do players quit at step 3?' -> 4 buckets with 61 players accounted for; the designer opens 'build menu not found' and sees 29 player ids and 3 quotes with timestamps"
  cost: S
  depends_on: "longctx-1, longctx-9"
  part: query
  ingest_cost: S
  query_cost: M
  better_than_fixed_table: "The table's 'why' column is a multiple-choice option picked at ingestion; this discovers the reasons from the data at query time"

- id: longctx-11
  title: "Model tiering on the cost curve: map step uses a small model (about $0.10/M) over 13M tokens, reduce uses a frontier model over about 100k tokens; per-question cost about $1.60 uncached"
  level: L4
  cell: {part: cost-governance, query-path: map-reduce-over-raw, mechanism-type: defer-to-query-time, latency-tier: under-30s, effort: XS-days, build-or-buy: managed-cloud-service, scope: all-players, user-segment: jev-internal-ops}
  object: "spec.md constraint: 'Answering a studio's question must be fast'; A-frame assumption: 'query-time budget is a few seconds'"
  situation: "The owner rejects raw map-reduce because $13 per question at frontier prices times 50 questions per day per studio is $650/day"
  consequence: "Map cost falls 10x; the map task (find, quote, classify one session) is within small-model capability for closed outputs; the reduce (merge, label, reconcile) keeps the strong model; per-studio bill at 50 questions/day is about $80/day uncached, about $15/day with caching (longctx-2)"
  p_typical: 0.06
  grounded: inferred
  evidence: "spec.md: 'Ingestion time and cost are not a concern. Answering a studio's question must be fast.'"
  proposed: "Planner picks map model by output type: closed (boolean, enum, timestamp) -> small model; open 'why' reasons -> mid model; reduce always frontier; log agreement between small and frontier on a 5% shadow sample"
  shallow: false
  mechanism: "Two model endpoints in the fan-out; shadow-sampling writes a per-question agreement rate to the query log for longctx-19"
  example: "'How many players skipped step 4?' maps with the small model (boolean + timestamp), reduces with the frontier model; the 5% shadow sample shows 96% agreement, so the small model stays"
  cost: S
  depends_on: "longctx-1"
  part: query
  ingest_cost: S
  query_cost: S
  better_than_fixed_table: "Reaches near-table cost per question without fixing the question set"

- id: longctx-12
  title: "Promote a map prompt to a column after its 4th use: the same per-session JSON the map step already produced is written as a field, old sessions are backfilled with the same prompt overnight, and the planner answers from SQL thereafter"
  level: L4
  cell: {part: schema-evolution, schema-evolution: lazy-backfill-on-demand, query-path: lazy-backfill-extraction, extraction-trigger: on-first-question, question-origin: learned-from-studio-usage, mechanism-type: reuse-or-cache-prior-work, latency-tier: sub-200ms-cached, moment-in-journey: steady-state-weekly}
  object: "memo.md item 2: 'cached as a new field, so the question set grows from real use'"
  situation: "The weekly 'how many players finished the tutorial' question has been run 4 times as a raw map-reduce"
  consequence: "This is where the persona concedes structure: a recurring count becomes a column; the column's definition is the map prompt text plus model version, so it is reproducible; the first three runs still answered in under 30 s without any schema work"
  p_typical: 0.12
  grounded: quote
  evidence: "memo.md: 'the question set grows from real use'"
  proposed: "Field registry row: {field_id, map_prompt_hash, model_version, output_schema, created_from_question_ids}; backfill job reuses the map step; new sessions get the field at ingestion from then on"
  shallow: false
  mechanism: "Map outputs are always written to a per-question result table keyed (question_hash, session_id); promotion flips a flag that makes ingestion run the prompt on new sessions and the planner read the table instead of fanning out"
  example: "'Tutorial completion rate' asked weekly; after week 4 it is a column; week 5's answer is a SQL count in 150 ms with the same quote evidence the map step stored"
  cost: M
  depends_on: "longctx-1, longctx-6"
  part: store
  ingest_cost: M
  query_cost: S
  better_than_fixed_table: "Columns are created by real usage with their prompt as the definition; the table's columns were guessed per game target"

