- id: longctx-1
  title: "Query-time map-reduce: 500 parallel calls, each reads one player's whole stitched session transcript with the studio question, returns {answer, quote, timestamp} JSON; one reduce call aggregates"
  level: L4
  cell: {part: query-path, representation: raw-transcript-only, query-path: map-reduce-over-raw, granularity: session, scope: all-players, latency-tier: under-30s, question-type: how-many, mechanism-type: defer-to-query-time, evidence-form: count-with-denominator}
  object: "spec.md step 4: 'Reading 500 transcripts per question was too slow and too much data, which is why the fixed-question table exists'"
  situation: "A studio asks a question the fixed table has no column for; the store has 500 players with a 2-hour session each (8 videos, speech-only transcript about 26k tokens per session, 13M tokens total)"
  consequence: "The question is answered from the full transcript in one pass instead of being refused; the 'too slow' claim in spec.md was true for sequential reads and is false for 500 concurrent calls of 26k tokens each (each call returns in 4-8 s; wall-clock 10-20 s)"
  p_typical: 0.35
  grounded: quote
  evidence: "spec.md: 'Reading 500 transcripts per question was too slow and too much data'"
  proposed: "Fan out one call per session, require a JSON object per player, reduce with a second prompt; 13M input tokens at $1/M is $13 per question uncached, $1.30 with prefix caching"
  shallow: false
  mechanism: "Chatbot planner builds prompt = [session transcript as cached prefix] + [question + output schema]; 500 calls run with concurrency 500; map outputs (about 200 tokens each) are concatenated (100k tokens) into one reduce call that emits counts with denominators and 5 example quotes"
  example: "Studio asks 'How many of the 500 players quit during the tutorial, and at which step?'; each map call returns {quit_in_tutorial: true, step: 'build a farm', quote: 'this is taking forever', t: '00:21:14'}; reduce reports 'quit in tutorial: 61/500 (12%); step 3 build-a-farm: 34 of the 61'"
  cost: M
  depends_on: "session stitching into one ordered transcript per player (longctx-4); concurrency limit of at least 500 on the model API"
  part: query
  ingest_cost: S
  query_cost: L
  better_than_fixed_table: "Answers any question, including ones nobody wrote, with a per-player quote; the table answers only the questions written per game target"

- id: longctx-2
  title: "Prompt-cache each stitched session transcript as a fixed prefix so every later question over the same 500 players pays the cached-input price (about 10%) instead of full price"
  level: L4
  cell: {part: cost-governance, representation: raw-transcript-only, query-path: map-reduce-over-raw, mechanism-type: reuse-or-cache-prior-work, scope: all-players, latency-tier: under-30s, effort: XS-days, build-or-buy: managed-cloud-service}
  object: "spec.md constraint: 'Ingestion time and cost are not a concern. Answering a studio's question must be fast.'"
  situation: "The studio asks a second, third, tenth question over the same 500 sessions within the cache lifetime (minutes to hours depending on provider); the transcript part of every prompt is byte-identical"
  consequence: "Per-question cost drops from about $13 to about $1.30 at $1/M and 90% cache discount; latency drops because cached prefix tokens are not re-processed (time-to-first-token falls from 3-5 s to under 1 s per call)"
  p_typical: 0.12
  grounded: inferred
  evidence: "spec.md: 'Ingestion time and cost are not a concern'"
  proposed: "Order the prompt as transcript first, question last; pin cache by session id; refresh caches for a studio's cohort at the start of each analyst session (a warm-up call per session costs the full price once)"
  shallow: false
  mechanism: "At query time the planner sends transcript as the first content block flagged cacheable; the question goes in the final block; a cache-warm job runs when the analyst opens the chatbot so the first question is already cheap"
  example: "Analyst opens the chatbot at 09:00; a warm-up pass over 500 sessions costs $13 once; the next 20 questions ('who stalled at step 3', 'what did they say about the crafting UI', 'how long did step 4 take') cost about $1.30 each"
  cost: S
  depends_on: "longctx-1; a provider with prefix caching on contexts of at least 30k tokens"
  part: query
  ingest_cost: S
  query_cost: M
  better_than_fixed_table: "Repeated questions become cheap without having pre-decided the question; the table is cheap only for its own columns"

- id: longctx-3
  title: "Sampled map-reduce with a confidence interval: read 50 random sessions first and answer in about 3 s as 'k/50 (95% CI)', then keep reading to 500 and tighten the number in the same chat message"
  level: L4
  cell: {part: query-path, query-path: sampled-map-reduce-with-ci, latency-tier: progressive-streaming, uncertainty-policy: give-range-then-refine, evidence-form: count-with-denominator, scope: all-players, mechanism-type: approximate-then-refine, question-type: how-many}
  object: "spec.md step 4: 'a question over, say, 500 players is fast'"
  situation: "Question is a prevalence question (how many, what share); the full 500-session read would take 15-25 s"
  consequence: "The analyst sees a usable range in 3 s and the exact figure 20 s later; a question whose answer is 0/50 or 50/50 can be stopped early (Wilson interval already tight enough for the decision)"
  p_typical: 0.15
  grounded: inferred
  evidence: "spec.md: 'Answering a studio's question must be fast'"
  proposed: "Planner samples n=50 uniformly by player id, computes a Wilson 95% interval, streams 'provisional 12/50 (24%, CI 14-37%)', then updates to '61/500 (12.2%, CI 9.6-15.4%)'"
  shallow: false
  mechanism: "Two-phase fan-out; phase 1 returns in parallel over 50 sessions; the chat message is a live object that the reduce step rewrites as phases complete; the CI is computed from counts, not by the model"
  example: "'What share of players skipped the step-4 crafting tutorial?' shows 'about 1 in 4 (CI 14-37%), reading the rest...' at 3 s and '23% (116/500, CI 20-27%)' at 22 s"
  cost: M
  depends_on: "longctx-1"
  part: query
  ingest_cost: S
  query_cost: M
  better_than_fixed_table: "First number arrives in the same time the table would take, for a question the table does not have, and it carries a CI the table never shows"

- id: longctx-4
  title: "Stitch the n 15-minute video transcripts into one ordered session document with '[video 3/8 | 00:30:00-00:45:00]' headers and '[gap 00:02:10 between video 3 and 4]' markers; store that text file as the primary artifact"
  level: L3
  cell: {part: session-stitching, representation: raw-transcript-only, granularity: session, modality: speech-transcript, extraction-trigger: at-ingestion, schema-evolution: schema-on-read, effort: XS-days, mechanism-type: change-data-at-source}
  object: "spec.md step 1: 'A session can be n hours; each video is capped at 15 minutes, so one session is many videos' and Unspecified: 'how videos of one session are linked'"
  situation: "A tutorial lasts 25 minutes and crosses the boundary of video 1 and video 2; a per-video table answers 'did the player finish the tutorial' as 'no' for video 1 and 'not applicable' for video 2"
  consequence: "Every downstream reader (model or human) sees the session as one timeline with absolute timestamps; per-video answer rows and their cross-video contradictions disappear"
  p_typical: 0.2
  grounded: quote
  evidence: "spec.md: 'Long multi-video sessions'"
  proposed: "Ingestion job orders videos by capture start time, rewrites each utterance timestamp to session-absolute time, inserts headers and gap markers, writes sessions/{player_id}/{session_id}.txt"
  shallow: false
  mechanism: "Stitcher takes the list of video files for a session (ordered by recording start time from file metadata), concatenates transcripts, converts video-relative timestamps to session-absolute, and emits a single text document; nothing else is extracted"
  example: "Player 217's tutorial runs 00:11:40-00:36:20; the question 'how long did the tutorial take' is answered from one document as 24 min 40 s; the old per-video table had a video-1 row saying 'tutorial not completed'"
  cost: S
  depends_on: "a session id that groups a player's videos (currently unspecified in spec.md); recording start timestamps per video"
  part: ingestion
  ingest_cost: S
  query_cost: S
  better_than_fixed_table: "Session-level questions (how long, did they finish, what happened after) become answerable; the per-video table cannot represent anything that crosses a 15-minute boundary"

- id: longctx-5
  title: "Screen-narration transcript: at ingestion a multimodal model writes one timestamped line every 2 s describing screen state and on-screen text, interleaved with speech, so the raw document carries the visual channel without a schema"
  level: L3
  cell: {part: ingestion-extraction, modality: screen-state-classifier, representation: raw-transcript-only, granularity: frame, extraction-trigger: at-ingestion, reuse-scope-of-extraction: universal-primitives, effort: S-weeks, mechanism-type: precompute-more}
  object: "spec.md step 2: 'the transcript alone is not enough; what is on screen is largely lost'"
  situation: "Player says nothing for 90 s while a 'Build a farm' tutorial prompt sits on screen and the cursor hovers over the wrong menu"
  consequence: "The raw document now contains '00:14:02 SCREEN: tutorial prompt \"Build a farm\" visible; build menu closed; cursor over inventory' and query-time reads can answer 'where did they click' questions; document size rises from about 26k to about 80k tokens per 2-hour session (3x query cost)"
  p_typical: 0.08
  grounded: quote
  evidence: "spec.md: 'Transcript loses visual information'; memo.md: 'Video frames add screen state and on-screen text, because speech alone cannot answer \"where did they click\"'"
  proposed: "Sample 1 frame every 2 s (450 per video); batch 30 frames per multimodal call with the preceding narration as context; emit one line per frame in a fixed grammar 'HH:MM:SS SCREEN: <state>; TEXT: <ocr>; CURSOR: <element>'; merge by timestamp into the stitched transcript"
  shallow: false
  mechanism: "Frame sampler + multimodal narration job at ingestion; output is text lines, not fields; the stitched session file becomes a two-channel log (SPEECH and SCREEN lines) that any query-time prompt reads as plain text"
  example: "'Why did players stall on step 3?' map call reads for player 88: 90 s of SCREEN lines showing the build menu closed and the cursor over inventory, then '00:15:31 SPEECH: where is the build button'; reduce reports '41/500 stalled at step 3; 29 of those had the build menu closed for more than 60 s'"
  cost: M
  depends_on: "longctx-4; original videos kept (A-frame assumption)"
  part: ingestion
  ingest_cost: L
  query_cost: L
  better_than_fixed_table: "Visual state is available for any future question; the table captures only the visual facts someone wrote a question for"

- id: longctx-6
  title: "Cost-curve routing rule in the planner: estimate tokens = n_sessions x avg_session_tokens; under 20M tokens and no cached field, run raw map-reduce; over 20M or asked more than 3 times, backfill into a field"
  level: L4
  cell: {part: query-path, query-path: map-reduce-over-raw, mechanism-type: defer-to-query-time, schema-evolution: lazy-backfill-on-demand, scope: all-players, latency-tier: under-30s, effort: S-weeks, user-segment: jev-internal-ops}
  object: "memo.md item 2: 'genuinely new questions trigger a one-time batch extraction over all sessions whose result is cached as a new field'"
  situation: "The memo's planner sends every new question to a batch extraction (minutes) before answering; for a 500-player cohort at 26k tokens per session that is slower than just reading them now"
  consequence: "First-time questions over cohorts up to about 750 sessions (20M tokens) are answered in under 30 s with no backfill; only the repeated or very large ones pay for a field; the studio never waits 'minutes' for the first answer of a small cohort"
  p_typical: 0.07
  grounded: quote
  evidence: "memo.md: 'genuinely new questions trigger a one-time batch extraction over all sessions'"
  proposed: "Planner table: tokens<20M and asked<=3 -> map-reduce now; tokens>=20M -> sampled map-reduce now plus background backfill; asked>3 -> promote the map prompt to a field (longctx-12)"
  shallow: false
  mechanism: "Planner reads session token counts from a per-session metadata row (the only 'store' this option needs), multiplies by cohort size, and picks the path; thresholds are per-studio config"
  example: "Studio with 320 players asks 'did anyone mention the tutorial being too long?' for the first time; 320 x 26k = 8.3M tokens -> raw read in 14 s; the same question asked a 4th time next month triggers a field 'mentions_tutorial_length' backfilled overnight"
  cost: S
  depends_on: "longctx-1; per-session token count metadata"
  part: query
  ingest_cost: S
  query_cost: M
  better_than_fixed_table: "The table is the end state of this rule, reached only for questions that proved they recur, instead of being guessed up front"

- id: longctx-7
  title: "REFUSED: entity-relation graph (player, step, mechanic, UI element with temporal edges) as the session store"
  level: L3
  cell: {part: store, representation: entity-relation-graph, granularity: tutorial-step, query-path: sql-over-closed-fields, schema-evolution: deprecate-and-migrate, effort: L-multi-quarter, mechanism-type: precompute-more, build-or-buy: open-source-component}
  object: "memo.md item 3: 'Questions are generated from an ontology (entities x dimensions x outcomes)'"
  situation: "A graph schema must name the entity and relation types before any studio question exists; the first question that needs a relation nobody modelled ('did players who muted the music quit faster') requires a schema change and a re-extraction of every session"
  consequence: "Low willingness: the persona drops this. Reason: it repeats the fixed-table failure (deciding the vocabulary at ingestion) at higher build cost (L) and adds a query language the studio analyst does not speak; the raw document already contains every relation the graph could hold"
  p_typical: 0.05
  grounded: inferred
  evidence: "spec.md: 'The question set is small, so most of what is in the video and transcript is never captured'"
  proposed: "Drop; if graph-style traversal questions appear in the query log more than 10 times per month, revisit with the log as the schema source"
  shallow: false
  mechanism: "Not built; the planner answers 'relation' questions ('players who did X then Y') by asking the map prompt for X-then-Y per session"
  example: "'Which players opened the settings menu before abandoning step 3?' is answered by a map prompt over SCREEN lines in 15 s rather than by a graph edge that would have to be defined and backfilled first"
  cost: L
  depends_on: "nothing"
  part: store
  ingest_cost: L
  query_cost: S
  better_than_fixed_table: "Not better: it is the fixed table with edges; same closed vocabulary, more build"

- id: longctx-8
