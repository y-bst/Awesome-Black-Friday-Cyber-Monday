  level: L3
  cell: {part: question-generation, question-origin: ontology-generated, representation: question-answer-bank-precomputed, extraction-trigger: at-ingestion, granularity: tutorial-step, mechanism-type: precompute-more, reuse-scope-of-extraction: genre-shared, effort: M-one-quarter}
