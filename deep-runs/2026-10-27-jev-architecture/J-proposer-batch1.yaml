- "id": "tar-12"
  "case": "spec.md says one session is many videos and that 'the answers form a structured table per video', so today every 'how many players' answer is really a count of 15-minute clips; the option's own example shows 'players who complained before quitting the tutorial' returning 94 positive videos when only 71 players qualify, a one-third overstatement a studio would act on. Borrowing the e-discovery family rule (a responsive attachment makes the whole family responsive), a hit in any video marks the session, so a complaint in video 4 and a quit in video 9 become one positive player instead of one positive and eight negatives. That is what makes the cross-video tutorial-churn questions JEV is sold on answerable at all: 'did players who complained later quit', 'what did quitters say before quitting', 'what share of players hit friction anywhere in onboarding'. It also makes the memo's own quality gate meaningful: memo item 3 judges questions by 'accuracy against hand-labelled sessions', and that accuracy, plus any recall or elusion sample, is only valid if sampling and coding are done per session, otherwise long sessions (the engaged players) are oversampled and the recall denominator shifts with the session-length distribution. The cost is a group-by on session_id at ingestion and nothing extra at query time, so answers stay sub-second (scored impact 4, confidence 5, cost 1, query_speed 5). Its one dependency, a session_id linking videos, is delivered by stitch-1 and obs-29 in the same quarter. Without it, every number the chatbot returns, and every backfilled field the memo's planner adds later, inherits the wrong unit."
- "id": "obs-29"
  "case": "The memo's first component is a 'session-level observation log' of timestamped observations 'across all videos of a session', but spec.md lists 'how videos of one session are linked' as unspecified, so nothing today defines how time runs across a session; this option is the concrete mechanism that makes the memo's log exist. It orders videos by file wall-clock, assigns a monotonic session_t_ms, stores any gap over 5 s as an explicit gap row, and partitions by session_id so a 12-video session is one contiguous key range. That makes the sequence and dwell questions at the heart of tutorial churn answerable: 'how long did players spend on step 3' returns one 6m10s span when step 3 straddles videos 2 and 3 instead of two unrelated partials, 'what happened in the two minutes before the quit' is a range scan, and 'timeline of player 0042' is one ORDER BY over one partition in about 0.02 s. Storing gaps explicitly also keeps a recorder restart (gap_ms=120000 in the example) from being read as two minutes of idle friction, which would otherwise poison every dwell-based friction signal. The one refinement to take into the build is the one stitch-30 raises: files are capped at 15 minutes but can end early, so the offset should accumulate actual durations and wall-clock rather than assume video_idx*900000; the stored wall-clock and gap rows already make that a small change. It has no dependencies, costs a metadata pass at ingestion and nothing at query time (cost 1, confidence 5, query_speed 5). Without it, the planner, the backfill and 'before quit' retrieval are all built on per-video timestamps that do not compose."
- "id": "planner-23"
  "case": "The memo's planner turns closed-field questions into 'aggregate queries over all players (instant)', but the only table spec.md has is per video, so unless grain is enforced the planner (or the model writing its SQL) will group by video and silently return per-clip numbers. This option makes the rule mechanical in the executor: a sessions table (session_id, player_id, video_count, total_ms, gap_ms, complete) is the join anchor of every plan, every aggregate groups by session_id, and 'how long' plans sum durations across a session's videos with inter-video gaps counted separately. 'How many players quit?' is the clearest case: over the per-video table an 8-video session is 8 rows with one quit flag, so engaged long-session players weigh 8x in the denominator and the churn rate studios buy JEV for is understated. 'How long do players take to finish the tutorial?' becomes a correct median of 1,140 s across 375 completers, measured from first step_on_screen=1 to tutorial_outcome=complete across videos, with the 14 sessions that have a gap over 60 s listed separately instead of inflating the median. Because the rule lives in the executor rather than in prompt instructions, every unknown question the planner compiles, including fields added later by the memo's backfill, inherits correct grain without anyone having to remember it, which is what turns 'fast' answers into correct ones. The cost is one small table built at ingestion and one join over a few hundred rows at query time, well inside the few-second budget (cost 1, query_speed 5, confidence 5). Its dependency, session-to-video linkage, is supplied by stitch-1 or obs-29 in the same quarter."
- "id": "stitch-1"
  "case": "spec.md describes sessions of n hours split into 15-minute files and lists 'how videos of one session are linked' as unspecified; in the option's situation a 2h40m session arrives as 11 files and nothing records which is first, so 'did the player finish the tutorial' or 'how long was the session' is either unanswerable or answered from whichever video the chatbot happens to read. The manifest (one row per video: session_id, segment_index, wall_clock_start, duration_ms, gap_before_ms, source_file, stitch_confidence) is the smallest artifact that fixes this, and every downstream row (observation, answer, backfilled field) carries video_id that resolves through it. With it, 'how many of the 500 players quit during the tutorial' becomes: join answers to session_videos, take each session's last segment, count sessions with tutorial_complete=false, a sub-second query over 500 rows instead of a count of videos. stitch_confidence is what sets it apart: where order is inferred from filenames or upload order rather than a recorder session id, low-confidence sessions can be flagged in the answer ('12 sessions had uncertain ordering') rather than silently mis-sequencing a quit. It depends on nothing, costs a metadata pass at ingestion and nothing at query time (cost 1, confidence 5, query_speed 5), and it is the prerequisite that tar-12, planner-23 and stat-7 name, so building it first unblocks the whole session-grain cluster. Because the original videos remain available (A-frame assumption), it can be built retroactively over the existing corpus, so the current per-video answers become session-correct without re-running extraction. Without it, the memo's session-level observation log has no key to hang on."
- "id": "stat-7"
  "case": "spec.md promises that 'a question over, say, 500 players is fast', but because the answers table is per video, n is really video rows; the option's example shows 'players who called the tutorial confusing' returning 212 rows when the true answer is 88 of 403 players (21.8%), an error of more than 2x that a studio would carry into a design review. This option rolls videos into sessions and sessions into players before any count, and has each question in the schema declare its reducer, so the materialised player view knows that 'said the tutorial was confusing' is any-of across videos while 'tutorial outcome' is last-of, and the chatbot is forbidden from counting off the video table. Declared reducers matter most for the memo's growth path: when a 'genuinely new question' triggers a one-time batch extraction and is 'cached as a new field', the reducer is declared with it, so the new field is immediately countable per player with the right semantics instead of needing a second fix. It removes the systematic bias the option names, where long-session players, who are the retainers, inflate both numerator and denominator and push churn rates low, which is exactly the metric JEV's tutorial targets measure. Going to player rather than stopping at session also prepares the store for players with several sessions (return visits, day-2 questions), which session grain alone cannot express. The query is a lookup on a materialised view of a few hundred rows and the ingestion cost is a view refresh (cost 1, confidence 5, query_speed 5). Its dependency, session and player ids in capture metadata, is covered for sessions by stitch-1 in the same quarter; where a player id is absent, the view can treat each session as one player, which is still correct for single-session playtests."
