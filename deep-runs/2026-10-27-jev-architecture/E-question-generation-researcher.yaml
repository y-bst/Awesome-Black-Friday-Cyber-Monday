  evidence: "spec: 'fixed set of questions with options'"
  proposed: "generation step emits options; validator runs the question as multi-select on 50 videos; co-selection > 10% for any pair -> split into two boolean questions or mark multi_select=true; 'other' > 25% -> enum is not exhaustive, add values from the 'other' free text"
  mechanism: "evaluation inside question-generation; runs once per new question, 50 calls"
  example: "'why did the player stop at step 4' -> split into confused_at_step_4 (bool, quote), bored_at_step_4 (bool, quote), bug_at_step_4 (bool, screen evidence); 'other' drops from 31% to 6%"
  cost: S
  depends_on: "pilot videos"
  part: evaluation
  ingest_cost: S
  query_cost: S
  better_than_fixed_table: "hand-written options were never checked for exclusivity; counts from them are not stable"
  shallow: false

- id: qgen-24
  title: "Question and field versioning: every answer row carries question_version and extractor_version, a reworded question gets a new version, and the chatbot refuses to pool rows across versions unless a 30-video agreement test passed"
  level: L4
  cell: {part: schema-evolution, schema-evolution: append-only-versioned-fields, evidence-form: extraction-provenance-model-and-schema-version, extraction-trigger: on-model-upgrade, question-type: did-the-fix-work-pre-post, moment-in-journey: new-build-version}
  object: "memo item 2: 'cached as a new field'; spec: 'The answers form a structured table per video'"
  situation: "The ontology regenerates 'stalled at step 3' with a tighter definition in month 2; month-1 rows were answered under the old wording; a studio asks whether the build fix reduced stalls"
