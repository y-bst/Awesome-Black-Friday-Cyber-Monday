  grounded: inferred
  evidence: "spec: 'detecting churn in the tutorial'"
  proposed: "join per-player answers to the studio's KPI by player id; for each universal field compute correlation or lift; output a ranked list with n and a 95% CI; apply Benjamini-Hochberg at 0.1 across the field set"
  mechanism: "question-generation + evaluation; the ranked list is the producer's standard report; questions are generated for the top 10 behaviours at step granularity"
  example: "D1 retention: top correlate is attempts_at_step_4 (r = -0.31, n = 480, CI -0.39..-0.23); generated follow-ups: cause of failure at step 4, utterance at step 4, time to first success at step 4"
  cost: M
  depends_on: "player id join to studio telemetry or survey; universal field layer (qgen-19)"
  part: question-generation
  ingest_cost: S
  query_cost: S
  better_than_fixed_table: "the fixed table reports rates; this ranks which rates move the metric the studio is paid on"
  shallow: false

- id: qgen-28
  title: "Emergent topic clustering of player speech per step: cluster all utterances within each tutorial step, name clusters, and generate one prevalence question per cluster with >= 5% of players"
