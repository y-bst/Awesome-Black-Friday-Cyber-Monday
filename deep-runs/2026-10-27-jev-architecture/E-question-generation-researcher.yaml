  evidence: "memo: 'the question set grows from real use'"
  proposed: "answers (video_id, qid, q_version, extractor_version, value, evidence); pre/post queries filter on one version or run the agreement test (30 videos, both versions, kappa >= 0.8) before pooling"
  mechanism: "schema-evolution + store; the chatbot prints 'n=210 under v2 only; 290 earlier videos answered under v1, not pooled'"
  example: "'did the 1.2 build reduce step-3 stalls' -> v1 rows (build 1.1) and v2 rows (build 1.2) fail agreement (kappa 0.55) -> chatbot re-extracts the 290 v1 videos under v2 (lazy backfill, 6 minutes) then answers 41% -> 23%"
  cost: S
  depends_on: "question registry; backfill path"
  part: schema-evolution
  ingest_cost: S
  query_cost: M
  better_than_fixed_table: "the fixed table has no version; any edit to a question silently corrupts history"
  shallow: false

- id: qgen-25
  title: "Sequence-pattern questions: generate templates over the per-player step/event sequence (A then B within T, A repeated k times before B, never B after A) and compile them to regex over the event string"
  level: L4
  cell: {part: query-path, representation: step-funnel-state-machine-per-player, question-type: timeline, granularity: player, query-path: sql-over-closed-fields, latency-tier: under-2s, scope: all-players}
