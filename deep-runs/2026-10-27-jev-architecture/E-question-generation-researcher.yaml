- id: qgen-27
  title: "KPI-backward hypothesis questions: the studio names a metric (D1 retention), and the generator emits one question per observable behaviour in the universal layer, then reports behaviours whose per-player value correlates with the metric at |r| >= 0.2 with n >= 100"
  level: L4
  cell: {part: question-generation, question-origin: kpi-backward-from-studio-metrics, modality: game-telemetry, question-type: what-to-fix-first-prioritised, user-segment: producer-exec, evidence-form: chart, scope: all-players}
  object: "spec: 'The targets are mostly detecting churn in the tutorial and just after it'"
  situation: "A producer does not have questions; they have a retention number and want to know what in the tutorial moves it"
