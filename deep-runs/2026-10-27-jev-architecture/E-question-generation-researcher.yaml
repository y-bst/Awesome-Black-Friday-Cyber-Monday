  cell: {part: evaluation, representation: fixed-mcq-answers, question-origin: ontology-generated, extraction-trigger: on-new-field-added, effort: XS-days, uncertainty-policy: abstain-below-coverage}
  object: "spec: 'a fixed set of questions with options'"
  situation: "Generated options for 'why did the player stop' are {confused, bored, bug, other}; 'confused' and 'bored' co-occur in 30% of videos"
