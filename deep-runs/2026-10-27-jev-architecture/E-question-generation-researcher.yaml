- id: qgen-1
  title: "Every generated question carries a typed answer contract (answer_type, aggregation, null option 'not-observable', evidence rule, unit) and the planner routes on answer_type, not on question text"
  level: L4
  cell: {part: question-generation, question-origin: ontology-generated, representation: fixed-mcq-answers, evidence-form: quote-with-timestamp, uncertainty-policy: abstain-below-coverage, effort: S-weeks}
  object: "memo item 3: 'each with an answer type and an evidence requirement'"
  situation: "A studio asks 'how long do players spend on tutorial step 3' and the only stored field is the enum 'stalled on step 3: yes/no'; the planner has no way to know a duration question cannot be served from an enum"
  consequence: "The chatbot answers a duration question with a rate (41% stalled) and the studio reads it as a time; one wrong number and the chatbot is not asked again"
  p_typical: 0.28
  grounded: quote
  evidence: "memo: 'each with an answer type and an evidence requirement, and judged by two tests'; spec: 'a fixed set of questions with options'"
  proposed: "question record = {qid, template_id, slots, answer_type in {enum, count, duration_s, timestamp, quote, free_text_<=30_words}, aggregation in {rate, mean, p50, list}, null_option: not-observable, evidence: quote-with-timestamp | clip | none, version}"
  mechanism: "question-generation emits a schema row per question, not a prompt string; the answers table gets a typed column per qid; the planner compiles studio questions to (answer_type, aggregation) and refuses a route whose type does not match"
  example: "'how long on step 3' matches template dwell_time(step=3) -> answer_type duration_s, aggregation p50 -> 'p50 4m10s, n=487 of 500 observable, 13 not-observable (video cut before step 3)'"
  cost: S
  depends_on: "a question registry table keyed by qid; nothing else"
  part: question-generation
  ingest_cost: S
  query_cost: S
  better_than_fixed_table: "the fixed table has per-video answer text with no type, so counts, durations and quotes are indistinguishable to the chatbot"
  shallow: false

- id: qgen-2
  title: "Day-0 question instantiation by open IE over the studio's design doc, patch notes and store page: extract (step, mechanic, UI element, goal) tuples and fill ontology templates before any session is ingested"
  level: L3
  cell: {part: question-generation, question-origin: design-doc-patch-notes-store-page-derived, moment-in-journey: game-onboarding-day-0, granularity: tutorial-step, reuse-scope-of-extraction: game-specific, extraction-trigger: on-new-game-onboarding, effort: S-weeks}
  object: "memo item 3: ontology 'pruned by the game target'; spec constraint 'Their questions are not known in advance'"
  situation: "A new studio onboards with a 12-page tutorial design doc and no sessions yet; today someone hand-writes the per-game target questions from that doc"
  consequence: "Onboarding a game costs 1-2 analyst days of question writing, and the first cohort is extracted against questions that miss steps the doc names"
  p_typical: 0.12
  grounded: inferred
  evidence: "spec: 'written per game target'; memo: 'pruned by the game target'"
  proposed: "run an open-IE pass (triples + entity typing into the ontology's entity classes) over the docs, deduplicate to a game entity list, and instantiate every ontology template whose slots are filled"
  mechanism: "question-generation; input: design doc, patch notes, store page text; output: game entity table (name, type, aliases, source span) and ~5 templates x N entities questions; a human approves the entity table (10 min) not the questions"
  example: "design doc sentence 'the grapple is taught in the third room' yields entity {grapple: mechanic, taught_at: step 3}; templates fire: first_use_of(grapple), fail_count(grapple, step 3), confusion_utterance_about(grapple)"
  cost: S
  depends_on: "ontology templates with typed slots (qgen-1)"
  part: question-generation
  ingest_cost: S
  query_cost: S
  better_than_fixed_table: "the fixed table's questions are written by hand per game; this generates the game-specific ones from documents the studio already has, so step and mechanic names match the studio's vocabulary"
  shallow: false

- id: qgen-3
  title: "Schema induction from the first 20 pilot sessions: open-IE predicates over transcript+screen state are clustered into slots, and a slot becomes a closed enum when its top-8 values cover >=90% of instances"
  level: L4
  cell: {part: question-generation, question-origin: induced-from-data, representation: learned-schema-from-data, extraction-trigger: on-new-game-onboarding, moment-in-journey: first-cohort-ingested, schema-evolution: append-only-versioned-fields, effort: M-one-quarter}
  object: "memo item 1: 'closed enum fields and short open fields'; spec problem: 'The question set is small, so most of what is in the video and transcript is never captured'"
  situation: "The ontology was written from general game knowledge; a specific game has a recurring behaviour (players opening the map to find the tutorial exit) that no template names"
  consequence: "The behaviour is never a field; it is only findable by reading transcripts, which the spec says was too slow over 500 players"
  p_typical: 0.08
  grounded: inferred
  evidence: "spec: 'most of what is in the video and transcript is never captured'"
  proposed: "20 sessions -> open-IE triples (subject, predicate, object, t) -> cluster predicates by embedding (threshold 0.85) -> for each cluster with >=15 instances across >=5 players propose a field; enum if top-8 values cover 90%, else short open text"
  mechanism: "question-generation + schema-evolution; computed once per game at pilot, output is a candidate field list with example spans; the candidate fields are versioned as append-only"
  example: "predicate cluster {opens map, checks map, map screen} appears 42 times across 11 of 20 pilot players, all in steps 2-4; proposed field map_open_during_tutorial_step: enum {step1..step6, none}; studio later asks 'do churners open the map more' and it is a closed-field aggregate"
  cost: M
  depends_on: "observation log with t and screen state (memo item 1)"
  part: question-generation
  ingest_cost: M
  query_cost: S
  better_than_fixed_table: "the fixed table only contains what a person thought to ask; this adds fields for what the data shows repeatedly"
  shallow: false

- id: qgen-4
  title: "Discriminative question generation: for churned vs retained cohorts, rank candidate fields and open spans by mutual information with churn and generate questions only for the top 30"
  level: L4
  cell: {part: question-generation, question-origin: discriminative-contrast-churn-vs-retain, mechanism-type: auto-discover-without-question, query-path: automatic-contrast-cohort-diff, question-type: who-are-the-churners-segment-discovery, scope: cohort, evidence-form: contrast-vs-baseline}
  object: "spec: 'The targets are mostly detecting churn in the tutorial and just after it'"
  situation: "A studio has churn labels for 500 players (from telemetry or from 'did not reach step 7') and asks 'what is different about the churners'"
  consequence: "Without a contrast procedure the studio must guess questions one at a time; the answer to 'what should we ask' is itself unknown"
  p_typical: 0.07
  grounded: inferred
  evidence: "spec: 'detecting churn in the tutorial and just after it'; memo item 3 ontology has no outcome-conditioned generation"
  proposed: "fields: compute MI(field, churn) over closed fields; open spans: cluster utterances by embedding, compute per-cluster lift churn/retain; emit a question per top item with n, lift and 3 example clips"
  mechanism: "question-generation reads the answers table plus a churn label column; output is a ranked question list ('Did the player fail the grapple jump >=3 times?' lift 2.4x, n=131 churners) that becomes the game's extraction set"
  example: "'what differs about tutorial churners' -> top item: utterance cluster 'where do I go' at step 4, 38% of churners vs 9% of retained, 3 clips; the generated question 'did the player express goal confusion at step 4' is promoted to a closed field"
  cost: M
  depends_on: "a churn label per player (telemetry join or step-reached proxy); answers table"
  part: question-generation
  ingest_cost: M
  query_cost: S
  better_than_fixed_table: "the fixed table answers what was asked; this surfaces the questions that separate churners without anyone asking"
  shallow: false

- id: qgen-5
  title: "Question bank learned from the query log: cluster studio questions that hit the backfill path, and promote a cluster to an ingestion-time field when it has >=3 askers across >=2 studios"
  level: L4
  cell: {part: feedback-loop-from-query-log, question-origin: failed-query-log, extraction-trigger: on-cohort-size-threshold, moment-in-journey: steady-state-weekly, reuse-scope-of-extraction: genre-shared, tenancy-and-deployment: shared-multi-tenant}
  object: "memo item 2: 'genuinely new questions trigger a one-time batch extraction ... so the question set grows from real use'"
  situation: "Studio A asked 'how many players quit during the first boss' in March, studio B asks it in May; both pay the batch-extraction wait because promotion is per-studio"
  consequence: "Each studio waits minutes for a question another studio already paid for; the question set grows per studio, not per product"
  p_typical: 0.13
  grounded: quote
  evidence: "memo: 'so the question set grows from real use'"
  proposed: "query log row = {studio, question text, canonical template guess, route taken, latency, thumbs}; weekly job clusters backfilled questions (embedding, threshold 0.8), templates the cluster, and adds it to the genre bank; new games in that genre get it at day 0"
  mechanism: "feedback-loop-from-query-log -> question-generation; the promoted question is a template with slots (boss -> first_boss entity) so it transfers to games whose entity table has a matching type"
  example: "cluster 'quit/stop/rage-quit during first boss' from 2 studios -> template abandon_during(encounter=first_boss) -> studio C onboards, its design doc names 'Warden' as first boss, and the field is extracted at ingestion"
  cost: M
  depends_on: "query log with route; entity typing per game (qgen-2); tenancy policy allowing question templates (not answers) to be shared"
  part: feedback-loop-from-query-log
  ingest_cost: S
  query_cost: S
  better_than_fixed_table: "the fixed table never changes from use; this one grows from what studios actually asked"
  shallow: false

- id: qgen-6
  title: "Canonicalise incoming studio questions to a template id with slot values and an answer_type, and serve a cached answer only when (template, slots, cohort filter, schema version) all match"
  level: L4
  cell: {part: query-path, query-path: semantic-cache-similar-question, latency-tier: sub-200ms-cached, mechanism-type: reuse-or-cache-prior-work, question-type: how-many, uncertainty-policy: always-answer}
  object: "spec: 'A chatbot for the gaming studio answers the studio's questions from that table'"
  situation: "Two analysts ask 'how many players stalled at step 3' and 'how long did players stall at step 3' within an hour; an embedding-only cache treats them as the same question (cosine 0.93)"
  consequence: "The second analyst gets a count returned for a duration question; the wrong number is silent"
  p_typical: 0.09
  grounded: inferred
  evidence: "spec: 'so that a question over, say, 500 players is fast'"
  proposed: "canonicaliser = paraphrase classifier into template id + slot filler + answer_type; cache key is the full tuple; embedding similarity is only a candidate generator, never the match"
  mechanism: "query-path; a small classifier (fine-tuned on the generated question bank plus paraphrases) maps text to template; mismatched answer_type bypasses the cache"
  example: "'how long did players stall at step 3' -> template dwell_time(step=3), duration_s, p50; cache miss because the prior entry was stall_rate(step=3), count; a 300 ms aggregate runs instead"
  cost: S
  depends_on: "typed question registry (qgen-1)"
  part: query-path
  ingest_cost: S
  query_cost: S
  better_than_fixed_table: "today there is no mapping from a studio's wording to the table's columns except the model guessing; this makes the mapping explicit and testable"
  shallow: false

- id: qgen-7
  title: "Add 'not observable in this video' and 'cannot determine' to every multiple-choice question, store them as distinct values, and exclude them from denominators"
  level: L4
  cell: {part: question-generation, representation: fixed-mcq-answers, uncertainty-policy: abstain-below-coverage, evidence-form: coverage-statement-n-of-m-players, granularity: video, question-type: how-many}
  object: "spec: 'The transcript is run through a fixed set of questions with options'"
  situation: "A 15-minute video covers tutorial steps 1-2 only; the question 'did the player complete step 5' is forced to pick yes or no"
  consequence: "Forced choice on unobservable videos produces a 'no' that counts as a failure; step-5 completion rate is reported 30 points too low on a 500-player cohort"
  p_typical: 0.16
  grounded: inferred
  evidence: "spec: 'each video is capped at 15 minutes, so one session is many videos' and 'The answers form a structured table per video'"
  proposed: "every enum gets two reserved values NOT_OBSERVABLE and UNDETERMINED; aggregation = answered / observable; the chatbot states 'n=487 of 500 observable'"
  mechanism: "question-generation adds the options; store reserves the two values; query aggregates on observable rows; UI prints the coverage statement"
  example: "'what % completed step 5' -> 312 yes, 61 no, 127 NOT_OBSERVABLE (video ended earlier), 0 UNDETERMINED -> '84% of 373 observable players (127 videos did not reach step 5)'"
  cost: S
  depends_on: "nothing"
  part: question-generation
  ingest_cost: S
  query_cost: S
  better_than_fixed_table: "the fixed table has no way to say the question did not apply to this video"
  shallow: false

- id: qgen-8
  title: "Question decomposition (QDMR-style): compound studio questions are split into a DAG of template calls over closed fields and joined per player before the model sees anything"
  level: L4
  cell: {part: query-path, query-path: agentic-multi-tool-plan, question-type: find-players-who, mechanism-type: narrow-or-clarify-the-question, latency-tier: under-2s, scope: query-time-defined-cohort}
  object: "memo item 2: 'closed-field questions become aggregate queries over all players (instant); open-field questions retrieve matching observation rows'"
  situation: "A studio asks 'of players who failed the jump 3+ times, how many said something negative and then completed the tutorial anyway'"
  consequence: "The planner classifies the whole question as open and retrieves rows for all 500 players; latency goes to tens of seconds and the answer has no denominator"
  p_typical: 0.08
  grounded: quote
  evidence: "memo: 'open-field questions retrieve matching observation rows across players and the model reads only those'"
  proposed: "decompose into steps: s1 = players where fail_count(jump) >= 3; s2 = s1 and negative_utterance = true; s3 = s2 and completed_tutorial = true; answer = |s3| / |s1| with per-player list"
  mechanism: "query-path; a decomposer produces 3-6 steps each bound to a template id; only steps with no matching template fall to retrieval"
  example: "'fail jump 3+ times, negative, still completed' -> 131 players, 74 negative, 52 completed -> '40% of 131 (52), per-player list attached'"
  cost: M
  depends_on: "typed question registry (qgen-1); per-player keyed answers (session stitching across videos)"
  part: query-path
  ingest_cost: S
  query_cost: S
  better_than_fixed_table: "the fixed table is queried one column at a time; this composes columns per player so multi-condition questions stay instant"
  shallow: false

- id: qgen-9
  title: "Reliability gate per generated question: sample 3 extractions per video on 50 pilot videos, compute Fleiss kappa, and drop questions with kappa < 0.6 before they reach the answers table"
  level: L4
  cell: {part: evaluation, question-origin: pilot-sessions-then-freeze, evidence-form: confidence-score, extraction-trigger: on-low-confidence-or-disagreement, moment-in-journey: first-cohort-ingested, effort: XS-days}
  object: "memo item 3: 'judged by two tests: coverage of real studio questions and accuracy against hand-labelled sessions'"
  situation: "An ontology generates 300 questions for a game; 40 of them ('was the player frustrated during step 2') have model self-agreement below chance, but all 300 are extracted over 500 players"
  consequence: "Unreliable columns sit next to reliable ones with no marker; a studio averages one and takes it to a producer"
  p_typical: 0.07
  grounded: quote
  evidence: "memo: 'accuracy against hand-labelled sessions'"
  proposed: "each question gets a kappa from 3 samples x 50 videos (150 calls per question, 45k calls per game, ingestion-side); kappa < 0.6 -> drop or rewrite; 0.6-0.8 -> show with confidence badge; >= 0.8 -> plain"
  mechanism: "evaluation; adds a reliability column to the question registry; the chatbot prints the badge alongside any number from a 0.6-0.8 question"
  example: "'was the player frustrated during step 2' kappa 0.41 -> dropped; replaced by 'did the player say a negative word about step 2 (quote required)' kappa 0.83 -> kept"
  cost: S
  depends_on: "question registry; pilot videos"
  part: evaluation
  ingest_cost: M
  query_cost: S
  better_than_fixed_table: "the fixed table has no per-question reliability; hand-written questions were never tested for agreement"
  shallow: false

- id: qgen-10
  title: "Per-step transition templates: for each tutorial step in the entity table, generate exactly 6 questions (entered, dwell_s, attempts, exit_reason enum, skipped, first_utterance_after_enter) from a step state machine"
  level: L4
  cell: {part: question-generation, representation: step-funnel-state-machine-per-player, granularity: tutorial-step, question-origin: ontology-generated, question-type: timeline, subject-domain: onboarding-tutorial}
  object: "memo item 1: 'step on screen, action, utterance, friction signal'"
  situation: "A tutorial has 9 steps; hand-written questions cover steps 1, 3 and 5 because those were the known problems"
  consequence: "A stall at step 7 is invisible until a studio reads transcripts"
  p_typical: 0.14
  grounded: quote
  evidence: "memo: 'step on screen'"
  proposed: "state machine per player with states = steps + {not_started, abandoned}; transitions carry t; the 6 questions per step are derived fields of the transition log, 54 fields for 9 steps"
  mechanism: "question-generation emits the 6 templates per step; ingestion fills them from the screen-state classifier plus transcript; store keeps the transition log as the source and the 54 fields as a materialised view"
  example: "'where do players drop in the tutorial' -> exit_reason per step: step 7 has abandoned=18% vs <=4% elsewhere; dwell p50 at step 7 is 6m40s; first utterance after entering step 7 is 'what now' for 61 players"
  cost: S
  depends_on: "screen-state classifier that recognises step boundaries; step list per game (qgen-2)"
  part: question-generation
  ingest_cost: M
  query_cost: S
  better_than_fixed_table: "covers every step uniformly instead of the 3 someone guessed; timeline questions become a funnel query"
  shallow: false

- id: qgen-11
  title: "Induce event types with argument roles (ACE-style) from player speech and screen state, and make questions queries over roles rather than yes/no columns"
  level: L3
  cell: {part: ingestion-extraction, representation: learned-schema-from-data, question-origin: induced-from-data, granularity: variable-length-moment-or-episode, question-type: what-happened, schema-evolution: schema-on-read}
  object: "memo item 1: 'timestamped atomic observations ... with closed enum fields and short open fields'"
  situation: "A failed attempt has a cause (fell, enemy, timer), a reaction (quote), a step and a retry count; stored as 5 separate yes/no questions the pieces cannot be joined"
  consequence: "'why do players fail step 4' is unanswerable from columns even though each piece was extracted"
  p_typical: 0.05
  grounded: inferred
  evidence: "memo: 'atomic observations'; spec: 'fixed set of questions with options'"
  proposed: "event schema induction on 30 sessions: cluster trigger spans into event types (FailAttempt, AskForHelp, OpenMenu, SkipDialogue), each with roles {agent, step, cause, target, reaction_quote, t_start, t_end}; store events as rows with role columns"
  mechanism: "ingestion-extraction; the induced event types become the ontology's entity x outcome layer; question templates are generated per (event type, role) pair"
  example: "'why do players fail step 4' -> FailAttempt where step=4 grouped by cause: fell 58%, enemy 31%, timer 11%, n=203 events over 97 players, with reaction quotes"
  cost: L
  depends_on: "observation log with t; pilot sessions"
  part: ingestion-extraction
  ingest_cost: L
  query_cost: S
  better_than_fixed_table: "a 'why' question becomes a group-by over a role instead of a new question nobody wrote"
  shallow: false

- id: qgen-12
  title: "Answer-aware question generation over unconsumed material: generate the question each uncaptured observation would answer, cluster the generated questions, and propose clusters with >=20 members as new fields"
  level: L4
  cell: {part: question-generation, question-origin: induced-from-data, mechanism-type: auto-discover-without-question, question-type: what-surprised-unknown-unknowns, extraction-trigger: scheduled-batch, evidence-form: clip-montage-n-examples}
  object: "spec problem: 'most of what is in the video and transcript is never captured'"
  situation: "After extraction, 70% of transcript utterances and 85% of screen-state changes are referenced by no answer; nobody looks at them"
  consequence: "The unknown unknowns stay unknown; the studio's new question in month 3 was answerable from month-1 data that was never indexed"
  p_typical: 0.04
  grounded: quote
  evidence: "spec: 'The question set is small, so most of what is in the video and transcript is never captured'"
  proposed: "weekly: for each observation row with no answer provenance, generate 1 question (answer-aware QG, answer = the row); embed questions; cluster (0.82); clusters with >=20 rows across >=8 players become candidate fields shown to JEV ops with 5 clips"
  mechanism: "question-generation; consumption tracked by answer provenance (qid -> row ids); output is a ranked candidate-field list per game per week"
  example: "unconsumed utterances 'can I skip this' at steps 1-2 (34 players) -> generated question 'did the player ask to skip the tutorial' -> candidate field; studio later asks 'how many want to skip' and it is already a column"
  cost: M
  depends_on: "answer provenance (which rows each answer used); observation log"
  part: question-generation
  ingest_cost: M
  query_cost: S
  better_than_fixed_table: "the fixed table never tells you what it is missing; this measures the gap and proposes the questions to close it"
  shallow: false

- id: qgen-13
  title: "Coverage metric for the question set: share of observation rows consumed by at least one answer, reported per game per week with a target of >= 60%"
  level: L4
  cell: {part: evaluation, evidence-form: coverage-statement-n-of-m-players, question-origin: induced-from-data, moment-in-journey: steady-state-weekly, user-segment: jev-internal-ops, effort: XS-days}
  object: "memo item 3: 'coverage of real studio questions'"
  situation: "The memo measures coverage of studio questions, which are unknown; nothing measures coverage of the data"
  consequence: "Coverage can look 95% against 30 known questions while 80% of what players did is unindexed"
  p_typical: 0.06
  grounded: quote
  evidence: "memo: 'coverage of real studio questions and accuracy against hand-labelled sessions'"
  proposed: "data_coverage = consumed_rows / total_rows per modality (speech, screen state, on-screen text); dashboard row per game; alert when a game drops below 60% after a build update"
  mechanism: "evaluation; depends on provenance from extraction; feeds qgen-12's candidate generation"
  example: "game X week 4: speech 71%, screen-state 38%, OCR 12%; the OCR gap triggers 'tutorial hint text shown' questions"
  cost: S
  depends_on: "answer provenance"
  part: evaluation
  ingest_cost: S
  query_cost: S
  better_than_fixed_table: "the fixed table has no measure of what it ignores"
  shallow: false

- id: qgen-14
  title: "Structured information-need interview at onboarding: a 10-item form (goals, KPIs, 3 known problems, 3 hypotheses, last 5 questions the team asked each other) that selects ontology branches and seeds 20 game-specific questions"
  level: L3
  cell: {part: question-generation, question-origin: onboarding-interview-with-studio, moment-in-journey: game-onboarding-day-0, user-segment: game-designer, mechanism-type: narrow-or-clarify-the-question, effort: XS-days}
  object: "spec constraint: 'Their questions are not known in advance'"
  situation: "The ontology can generate 300 questions; the studio cares about 20 and will judge the product by whether those 20 are good"
  consequence: "Without elicitation the first answers are about things the studio did not ask, and trust is spent before the right questions arrive"
  p_typical: 0.1
  grounded: inferred
  evidence: "spec: 'Their questions are not known in advance'"
  proposed: "form fields: KPI (D1 retention), problem statements (free text, 3), hypotheses (3), recent questions (5); each free text is parsed into template + slots and marked priority 1; the generator fills the rest to 300"
  mechanism: "question-generation; the interview answers are stored as the studio's priority list and drive the order in which the first report is built"
  example: "hypothesis 'players do not notice the dodge prompt' -> templates saw_prompt(dodge), used(dodge) within 30 s of prompt, confusion_utterance_about(dodge); the first report leads with these"
  cost: S
  depends_on: "ontology templates (qgen-1)"
  part: question-generation
  ingest_cost: S
  query_cost: S
  better_than_fixed_table: "the fixed table is written by JEV staff guessing; this captures the studio's own questions in their words on day 0"
  shallow: false

- id: qgen-15
  title: "REFUSED by this perspective: JEV analysts hand-write the per-game question list for each new studio from a call with the designer"
  level: L3
  cell: {part: question-generation, question-origin: hand-written-per-game, moment-in-journey: game-onboarding-day-0, reuse-scope-of-extraction: game-specific, user-segment: jev-internal-ops, effort: XS-days}
  object: "spec: 'a fixed set of questions with options, written per game target'"
  situation: "Each new game gets a 2-day question-writing pass; 50 games per year is 100 analyst days and no two games are comparable"
  consequence: "Refused: it does not scale (frame assumption 3) and it produces untestable questions with no answer type; the only acceptable role for hand-writing is the 20 seed questions in qgen-14"
  p_typical: 0.3
  grounded: quote
  evidence: "spec: 'written per game target'"
  proposed: "do not build; keep hand-writing only as seeds inside a generated bank"
  mechanism: "none (refused)"
  example: "a designer's call yields 'do players get stuck on the jump' and nothing about the 8 other steps; the week-3 question about step 7 is unanswerable"
  cost: S
  depends_on: "nothing"
  part: question-generation
  ingest_cost: S
  query_cost: S
  better_than_fixed_table: "nothing; it is the fixed table"
  willingness: low
  shallow: false

- id: qgen-16
  title: "REFUSED by this perspective: an unconstrained LLM pass that writes 500 free-form questions per game with no ontology, no answer types and no deduplication"
  level: L3
  cell: {part: question-generation, question-origin: ontology-generated, representation: question-answer-bank-precomputed, mechanism-type: precompute-more, evaluation: none, effort: XS-days}
  object: "spec: 'The question set is small'"
  situation: "The obvious fix for 'the set is small' is to ask a model for 500 questions; 500 questions x 500 players x 4 videos each is 1M extraction answers per game"
  consequence: "Refused: without types the planner cannot route, without dedup 40% are paraphrases, without a reliability gate (qgen-9) most of the 1M answers are noise; ingestion cost is fine but the answers table becomes unqueryable"
  p_typical: 0.15
  grounded: inferred
  evidence: "spec: 'The question set is small, so most of what is in the video and transcript is never captured'"
  proposed: "do not build; generation must go through typed templates, dedup by canonical form, and the kappa gate"
  mechanism: "none (refused)"
