  cell: {part: question-generation, question-origin: emergent-topic-clustering-of-player-speech, question-type: prevalence-of-quoted-sentiment, modality: speech-transcript, granularity: tutorial-step, evidence-form: clip-montage-n-examples, extraction-trigger: scheduled-batch}
