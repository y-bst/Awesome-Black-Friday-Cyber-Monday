  mechanism: "query-path; question-generation emits the three sequence templates per event-type pair that co-occurs in >= 5% of players"
  example: "repeat(FailJump, 2, before OpenSettings) within 60 s -> 44 of 500 players; 31 of them churned (lift 3.1x)"
  cost: M
  depends_on: "session stitching (video order within a session); event log with t"
