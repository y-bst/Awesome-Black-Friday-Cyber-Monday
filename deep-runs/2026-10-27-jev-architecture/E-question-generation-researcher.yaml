- id: qgen-31
  title: "Multiple-comparison control on question banks: when a studio's session asks >= 20 generated questions on the same cohort, the chatbot reports which differences survive a false-discovery rate of 0.1 and labels the rest 'not significant at this n'"
  level: L4
  cell: {part: evaluation, uncertainty-policy: answer-with-ci-and-n, question-type: compare-versions, scope: build-version-pair, evidence-form: count-with-denominator, user-segment: studio-analyst}
  object: "spec: 'so that a question over, say, 500 players is fast'"
  situation: "An analyst compares builds 1.1 and 1.2 across 54 step fields; 3 differences appear at p < 0.05 by chance alone"
  consequence: "A build is credited with a fix it did not make; the next pre/post contradicts it and trust drops"
  p_typical: 0.06
  grounded: inferred
  evidence: "spec: 'a question over, say, 500 players'"
  proposed: "every comparison answer carries n per side, difference, 95% CI; a per-conversation ledger counts comparisons; at >= 20, BH-adjust and mark"
  mechanism: "evaluation inside query-path; applies to generated question banks because they are the source of the many comparisons"
  example: "'what changed from 1.1 to 1.2' over 54 fields -> 2 survive FDR 0.1 (step 4 attempts -1.1, step 7 abandon -9 points), 3 others shown as 'not significant at n = 240/260'"
  cost: S
  depends_on: "typed numeric answers with denominators (qgen-1, qgen-7)"
  part: evaluation
  ingest_cost: S
  query_cost: S
  better_than_fixed_table: "the fixed table reports every difference as real"
  shallow: false

- id: qgen-32
  title: "Null-instantiated slot semantics: distinguish 'slot not filled because absent' from 'slot not filled because unknown' for every role in an event, and let the chatbot report absence counts only where observability was positive"
  level: L4
  cell: {part: store, representation: learned-schema-from-data, uncertainty-policy: abstain-below-coverage, question-type: how-many, evidence-form: coverage-statement-n-of-m-players, modality: silence-or-absence-of-speech}
  object: "memo item 1: 'closed enum fields and short open fields'"
  situation: "A FailAttempt event has reaction_quote empty for 140 players; 90 were silent players (no speech anywhere in the session), 50 said nothing at that moment"
  consequence: "'How many players reacted negatively to failing' is reported over 500 when only 410 had any speech at all"
  p_typical: 0.05
  grounded: inferred
  evidence: "memo: 'closed enum fields and short open fields'"
  proposed: "each role stores value | ABSENT | UNKNOWN; per-session modality flags (speech_present, screen_present) set UNKNOWN for speech roles when speech_present = false; aggregations use the denominator excluding UNKNOWN"
  mechanism: "store + ingestion; the generated question gets the denominator rule for free from the role's modality"
  example: "'negative reaction to failing at step 4' -> 97 of 350 players with speech (28%), 90 silent players excluded and stated"
  cost: S
  depends_on: "event roles (qgen-11) or at minimum per-session speech-present flag"
  part: store
  ingest_cost: S
  query_cost: S
  better_than_fixed_table: "the fixed table's empty cell means nothing in particular; here it means one of two things, and the denominator follows"
  shallow: false

- id: qgen-33
  title: "Active validation loop in the chatbot: after each number, show 3 random supporting clips with a one-click 'wrong' per clip; a field whose wrong-rate exceeds 15% over 20 votes is flagged and re-queued for the kappa gate"
  level: L4
  cell: {part: feedback-loop-from-query-log, mechanism-type: human-in-the-loop, evidence-form: clip-montage-n-examples, extraction-trigger: on-low-confidence-or-disagreement, delivery-surface: chatbot, user-segment: studio-analyst}
  object: "memo item 3: 'accuracy against hand-labelled sessions'"
  situation: "Hand-labelled sessions are 50 per game; the deployed field drifts after a build changes the step-4 screen and nobody relabels"
  consequence: "A wrong field stays wrong until a studio notices; the hand-labelled set never grows"
  p_typical: 0.07
  grounded: quote
  evidence: "memo: 'accuracy against hand-labelled sessions'"
