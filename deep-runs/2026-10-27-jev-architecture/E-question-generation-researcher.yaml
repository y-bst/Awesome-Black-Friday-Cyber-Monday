  mechanism: "evaluation; the benchmark regenerates whenever the ontology or entity table changes"
  example: "paraphrase 'roughly how many ppl got stuck on the jump bit' -> expected template stall_rate(step=4), expected 27% +- 3; planner returned attempts mean -> route error logged"
  cost: S
  depends_on: "question registry; 50 labelled sessions per game"
