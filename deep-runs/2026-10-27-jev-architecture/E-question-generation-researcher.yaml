  evidence: "memo: 'genuinely new questions trigger a one-time batch extraction over all sessions'"
  proposed: "input 5 pos + 5 neg clips (each <= 20 s); model writes a definition and a boolean question with evidence rule; test on 20 held-out clips from the same game; precision and recall >= 0.8 required; then backfill as a versioned field"
  mechanism: "question-generation from examples; the induced definition is shown back to the designer for a one-click confirm"
  example: "5 clips of wall-walking near the ledge -> field walks_into_ledge_wall: bool, evidence clip; held-out 18 of 20 correct; backfill finds 96 of 500 players, 71 of them at step 5"
  cost: M
  depends_on: "clip lookup by timestamp; backfill path"
