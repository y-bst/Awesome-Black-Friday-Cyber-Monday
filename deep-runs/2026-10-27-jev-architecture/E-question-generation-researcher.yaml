- id: qgen-21
  title: "Question-to-field compiler: a new studio question is compiled into a field spec (name, answer_type, enum values, extraction prompt, evidence rule, 10 labelled test videos) and must pass >= 8 of 10 before the backfill runs"
  level: L4
  cell: {part: question-generation, query-path: lazy-backfill-extraction, extraction-trigger: on-first-question, schema-evolution: lazy-backfill-on-demand, evaluation: none, latency-tier: minutes, question-origin: studio-written-at-runtime}
  object: "memo item 2: 'genuinely new questions trigger a one-time batch extraction over all sessions whose result is cached as a new field'"
  situation: "A studio types 'did players notice the stamina bar'; the memo's backfill would run the raw question over 2,000 videos and cache whatever came back"
  consequence: "An untested prompt is cached as a permanent field; if it is wrong it is wrong for every future query on that field"
  p_typical: 0.08
  grounded: quote
  evidence: "memo: 'whose result is cached as a new field'"
  proposed: "compile step: model drafts the field spec; 10 videos are sampled and labelled by the model with 3 samples each; JEV ops or the studio confirms 10 answers with clips (5 min); if >= 8 agree, backfill all; else return 'needs clarification' with the 2 disagreeing clips"
  mechanism: "question-generation + query-path; the backfill stays, but a spec and a 10-video test sit in front of it"
  example: "'noticed the stamina bar' -> field stamina_bar_noticed: enum {looked_or_mentioned, no_evidence, NOT_OBSERVABLE}, evidence quote or gaze-free proxy 'utterance mentions stamina'; 9 of 10 agree; backfill 2,000 videos in 11 minutes"
  cost: M
  depends_on: "backfill path (memo item 2); clip lookup for evidence"
  part: question-generation
  ingest_cost: M
  query_cost: M
  better_than_fixed_table: "the fixed table's questions were never tested; new fields here are tested before they exist"
  shallow: false

- id: qgen-22
  title: "Question implication graph: store entailments between questions (skipped_tutorial=yes implies every step question = NOT_APPLICABLE) and use them to skip extraction and to flag inconsistent answers"
  level: L4
  cell: {part: store, representation: entity-relation-graph, evaluation: none, question-type: compare-steps, mechanism-type: precompute-more, schema-evolution: append-only-versioned-fields}
  object: "spec: 'The answers form a structured table per video'"
  situation: "A video where the player skipped the tutorial still gets 54 step questions extracted; 7 come back 'yes' for steps that never appeared"
  consequence: "Inconsistent rows inflate step counts, and 54 needless extractions per skipped video"
  p_typical: 0.05
  grounded: inferred
  evidence: "spec: 'structured table per video'"
  proposed: "edges {q_a=v implies q_b in S}; at extraction, evaluate parents first and short-circuit children; at evaluation, count violations per video and quarantine videos with >= 2"
  mechanism: "store holds the DAG as part of the question registry; ingestion orders extraction by DAG depth"
  example: "skipped_tutorial=yes for 23 of 500 players -> 23 x 54 = 1,242 extractions skipped; 4 videos violate completed_step_5=yes with entered_step_5=no and are quarantined"
  cost: S
  depends_on: "question registry (qgen-1)"
  part: store
  ingest_cost: S
  query_cost: S
  better_than_fixed_table: "the fixed table treats every question as independent; this makes contradictions detectable"
  shallow: false

- id: qgen-23
