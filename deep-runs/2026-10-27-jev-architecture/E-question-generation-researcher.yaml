  shallow: false

- id: qgen-30
  title: "Few-shot tracker definition: a studio defines a new question by marking 5 positive and 5 negative clips, and the system induces the question text, answer type and extraction prompt, validated on 20 held-out clips before backfill"
  level: L4
  cell: {part: question-generation, question-origin: few-shot-tracker-from-examples, extraction-trigger: on-studio-tracker-defined, query-path: query-by-example-clip, user-segment: game-designer, delivery-surface: chatbot, schema-evolution: lazy-backfill-on-demand}
  object: "memo item 2: 'genuinely new questions trigger a one-time batch extraction'"
  situation: "A designer cannot phrase 'that thing where they walk into the wall near the ledge' as a question but can point at 5 clips"
