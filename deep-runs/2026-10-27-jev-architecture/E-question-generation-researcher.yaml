- id: qgen-29
  title: "Synthetic studio-question benchmark generated from the ontology: 200 questions per game with known answers computed from labelled sessions, used to measure planner route accuracy and answer error before launch"
  level: L4
  cell: {part: evaluation, question-origin: ontology-generated, query-path: sql-over-closed-fields, evidence-form: recall-estimate, moment-in-journey: pre-launch-greenlight, user-segment: jev-internal-ops}
  object: "memo item 3: 'judged by two tests: coverage of real studio questions and accuracy against hand-labelled sessions'"
  situation: "The memo tests extraction accuracy but not whether the chatbot's planner routes a question to the right field; real studio questions do not exist before launch"
