- id: "obs-3"
  case: "Build this because it is the only option in the batch that answers the question studios ask most and cannot phrase as a schema: why did these players leave. spec.md names the core failure, 'the question set is small, so most of what is in the video and transcript is never captured', and a fixed table can only confirm a cause someone already suspected. The planner turns any 'why did cohort C do X' into cohort versus same-build baseline and runs one GROUP BY across all closed and attrs fields, returning attributes above 2x lift with n>=5 plus three example clips each. On the tutorial-churn question it returns 'first_death_before_step_4 = true: 71% vs 19%', 'utterance_count in tutorial = 0: 44% vs 9%' and 'settings_menu_opened: 38% vs 6%' in about 0.9 s over 500 players, which meets the few-seconds query budget with no model reading of rows. It extends memo.md item 2, whose closed-field aggregates need the asker to name the field; contrast removes that step and so makes unknown questions answerable on day one, and every new observation attribute becomes a candidate cause automatically with no extra question authored. Without it the studio guesses 'is it popups' one hypothesis at a time, and the memo's batch-extraction path is triggered once per guess at ingestion-scale cost. It is a cheap, deterministic query-path feature (cost 2, depends only on obs-1), so the quarter's risk is low and the payoff is the headline demo of the product."
- id: "analyst-15"
  case: "Build this because 'why do players quit at step 3' is the literal shape of the target in spec.md item 3, 'detecting churn in the tutorial and just after it', and today the nearest artifact is an MCQ 'reason for struggle: A/B/C/D' per video that nobody aggregates, so the studio gets one option letter per video and no ranked answer. With a closed friction_reason enum tagged on each stall or quit observation at ingestion, the planner maps 'why' plus a step to a GROUP BY over the quitters and returns a reason list with counts, share of quitters and three clips per reason. Worked example: step 3 quitters (94) split into cannot-find-ui 38 (40%), misread-text 21 (22%), input-fail 12 (13%) and other 23, with the 'other' quotes listed, so the analyst files three concrete tickets instead of one vague one. It runs at query time as a single aggregate (instant), which fits the speed constraint, and the enum is defined per genre so it scales across studios without hand-writing per-game questions. It is complementary to obs-3: contrast finds unanticipated attributes, while this gives the stable, trusted, clip-backed reason taxonomy that studios will request weekly and that the evaluation set can score against hand-labelled sessions. Without it, the most common churn question falls through to the planner's slow open-field retrieval path every time, and answers drift between runs because reasons are re-invented from free text."
- id: "cv-3"
  case: "Build this because it directly fixes the owner's first-named problem, 'transcript loses visual information', and memo.md already commits to it ('Video frames add screen state and on-screen text, because speech alone cannot answer where did they click'); spec.md lists on-screen text as an unspecified transcript content, so today it is simply unknown whether it is captured. Running OCR per keyframe, deduplicating identical text into (text, first_t, last_t) spans with a region class (hud, objective-tracker, dialog, tooltip, error-popup, chat) and indexing it beside the transcript gives a second, searchable stream. The tutorial prompt 'Press E to craft' is on screen for 4 seconds and the player never says it, so no speech-based question can ever answer 'did players see the craft prompt'; with this track it is a keyword lookup joined to the step-3 exit, e.g. 'Inventory full' popup seen by 61 of 500, in an inverted-index query. Cost is purely ingestion (cost 2, which the constraints say is not a concern) with query cost near zero, and unlike a vision-model description it is deterministic, auditable evidence that a studio can verify by opening the frame. It is also the cheapest way to get exact on-screen strings (UI labels, error messages, objective text) that vision-language models paraphrase or hallucinate. Without it, every question about what the player saw rather than said stays unanswerable, however good the planner is."
- id: "extract-7"
  case: "Build this because every aggregate the memo promises ('closed-field questions become aggregate queries over all players') needs a denominator, and an observation log that only stores things that happened cannot supply one: a missing row means either 'did not happen' or 'video 7 was not processed'. spec.md says a session is many 15-minute videos, so partial processing and missing videos are the normal case. The option adds a session-level pass emitting seen / not_seen / unknown per step with a basis (frames, speech, both, no_coverage), forcing unknown when a video is missing or frame coverage is under 80%, stored as step_presence(session_id, step_id, status, basis). Worked example: 'how many players never opened the inventory during the tutorial' returns 85 of 445 with full coverage (19.1%), 55 sessions excluded, range 85-140, instead of a flat 140 that sends the studio to redesign a step that was fine. That is the worst failure mode for a studio-facing product, a confidently wrong count, and the fixed table cannot even express the distinction. Ingestion cost is a one-off pass (cost 2), query cost is a plain SQL filter (instant), and it relies on the stitcher's completeness flag and a per-game step list that the ontology in memo.md item 3 already produces. Without it, every 'never', 'how many did not' and percentage-of-players question is silently wrong by an unknown margin."
- id: "stitch-27"
  case: "Build this because the studio's most common question, 'why did this player quit', needs a judgement over the whole session, and nothing in the current or memo design computes one at the right level. spec.md says a session is many videos with answers per video, so asking per video yields about 10 contradictory quit reasons for one player; asking at query time means reading 500 x 400 observation rows per question, which breaks the few-seconds budget. The fix is one extra LLM call per session over the concatenated observation rows (about 2-4k tokens, since it reads rows, not raw transcript) that writes session-scope closed fields (quit_reason, churn_step) and an arc_summary plus three evidence URIs. It follows memo.md item 1 ('ingestion produces a session-level observation log') by adding the one derived layer the log needs to be queryable. 'Top 3 reasons players quit the tutorial' then becomes a GROUP BY on quit_reason returning, for example, could not find objective 17, combat too hard 12, crash 8, each with evidence, in under 2 s. The marginal ingestion cost is tiny against what already runs, and the output gives the hand-labelled evaluation set a single field per session to score against. Without it, the headline churn question is either slow, contradictory or both, and the planner has no session-level field to aggregate on."
