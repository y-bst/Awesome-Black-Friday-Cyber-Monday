topic: "How to represent hours-long multi-video gameplay sessions and generate the extraction questions so that a studio's unknown questions get fast, correct answers across hundreds of players"
request_type: ideate
unit: "an option: one concrete design choice, component, or method for the representation, the query path, or the question-generation framework"
leaf_test: >
  An option is a leaf only when it names (1) which part it changes (ingestion/extraction, store, query path, question generation,
  evaluation, UI), (2) the mechanism concretely (what is computed, stored or asked, with its shape), (3) one worked example on a
  tutorial-churn question from a studio, (4) what it costs at ingestion vs at query time, and (5) what it does better than the
  current fixed-question table. A category ("use RAG") is not a leaf.
audience: "the JEV owner choosing the architecture for the next version; per option they decide build / prototype / drop"
artifact_description: >
  spec.md: the current pipeline (multi-video sessions, transcript, fixed multiple-choice questions per game target, answers table,
  studio chatbot) with constraints (ingestion cost fine, queries must be fast, studio questions unknown). memo.md: the owner's
  current direction (observation log, query planner with backfill, ontology-generated questions). Options may extend, replace
  or contradict the memo.
artifacts:
  - path: deep-runs/2026-10-27-jev-architecture/spec.md
    kind: other
    objects: pipeline stages, constraints, problems
  - path: deep-runs/2026-10-27-jev-architecture/memo.md
    kind: other
    objects: proposed components, query tiers, question ontology
assumptions:
  - original videos remain available for re-processing, including frames
  - a modern long-context multimodal model is available at ingestion; query-time budget is a few seconds
  - studios are many and each game differs, so per-game hand-written questions do not scale
rubric: impact
extra_leaf_fields:
  part: "ingestion | store | query | question-generation | evaluation | ui"
  ingest_cost: "S/M/L"
  query_cost: "S/M/L"
  better_than_fixed_table: "one line"
quota_per_perspective: 25
mode: full
