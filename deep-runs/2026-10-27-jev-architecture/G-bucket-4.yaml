    effort: S-weeks
  object: 'memo.md item 3: ''Questions are generated from an ontology (entities x dimensions x outcomes), pruned by the game
    target'''
  situation: The ontology yields 1,400 candidate questions for a game; materialising all of them over 500 sessions is 700,000
    session-field codes, most with prevalence near zero
  consequence: Pruning by richness is what keeps a review proportionate; 1,400 fields where 1,100 have under 2% prevalence
