    ingestion); pass gate: prevalence at or above 2% and kappa at or above 0.6; passed fields are materialised over all sessions;
    failed ones are stored as protocols with their sample stats and backfilled only on first question'
  mechanism: 'Changes question-generation and schema-evolution: materialisation is gated by sample statistics, not by ontology
    membership'
  example: 1,400 generated; 310 pass; 'tutorial narrator skipped' passes at 22% and kappa 0.79; 'player praised the font'
