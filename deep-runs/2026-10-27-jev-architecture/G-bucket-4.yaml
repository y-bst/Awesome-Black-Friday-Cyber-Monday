  situation: Studio asks 'how many players tried to use the dodge button before it was taught?'; no field exists; a naive
    backfill prompt 'answer this question per session' returns free text that cannot be counted
  consequence: The backfill produces 500 paragraphs, the cached 'field' is unqueryable, and the next similar question triggers
