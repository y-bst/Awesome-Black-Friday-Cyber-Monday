# Stage I verified leaves, bucket 5 (input G-merged-5.yaml; artifacts spec.md, memo.md). Only grounded, evidence and already_offered changed.
- id: askdata-1
  title: 'Every rate answer carries numerator, denominator, and coverage: ''23 of 412 players who reached step 3 (5.6%); 75
    of 487 ingested have no step-3 observation'''
  level: L4
  perspective: askdata
  cell:
    part: chatbot-ui
    evidence-form: count-with-denominator
    uncertainty-policy: answer-with-ci-and-n
    question-type: how-many
    query-path: sql-over-closed-fields
    scope: all-players
    user-segment: studio-analyst
    delivery-surface: chatbot
    mechanism-type: narrow-or-clarify-the-question
    effort: S-weeks
    granularity: tutorial-step
    representation: timestamped-observation-log
    subject-domain: onboarding-tutorial
  object: 'spec.md stage 4: ''A chatbot for the gaming studio answers the studio''s questions from that table, so that a question
    over, say, 500 players is fast'''
  situation: The studio asks 'what share of players stalled at the forge step' and the store has the stall field for only
    412 of 487 ingested sessions
  consequence: A bare '5.6%' later turns out to be computed over 412, the studio recomputes 23/487 = 4.7% from the export,
    and the chatbot is never trusted again; the three-number form makes the discrepancy visible on the first answer
  p_typical: 0.35
  grounded: inferred
  evidence: 'spec.md: ''The answers form a structured table per video''; a per-video table defines no per-player denominator
    or rule for players missing the field'
  already_offered: false
  proposed: 'Answer renderer template: ''{num} of {den} {den_definition} ({pct}%); {missing} of {ingested} players have no
    observation for this field'''
  shallow: false
  mechanism: Query path returns a 4-tuple (numerator, denominator, denominator_definition, missing_count) for every rate;
    the renderer refuses to print a percentage without all four; denominator_definition is a closed enum (ingested, reached_step,
    spoke_during_step, completed_tutorial)
  example: 'Studio: ''How many players quit during the forge tutorial step?'' Answer: ''31 of 412 players who reached the
    forge step quit before completing it (7.5%, 95% CI 5.3-10.5%). 75 of 487 ingested players never reached the forge step
    and are excluded.'''
  cost: S
  depends_on: a per-player field marking which tutorial steps were reached (session-stitching must give per-player, not per-video,
    rows)
  part: ui
  ingest_cost: S
  query_cost: S
  better_than_fixed_table: The fixed table has per-video rows with no stated denominator, so the same question yields different
    percentages depending on whether videos or players are counted
  also_from:
  - uxrepo
  - analyst
  absorbed:
  - uxrepo-17
  - analyst-3
- id: askdata-3
  title: 'Evidence drawer on every aggregate: click the number to get the per-player list with one timestamped quote each,
    and a ''show 5 clips'' button'
  level: L4
  perspective: askdata
  cell:
    part: chatbot-ui
    evidence-form: per-player-list
    representation: timestamped-observation-log
    question-type: find-players-who
    delivery-surface: clip-reel
    granularity: player
    query-path: progressive-answer-then-refine
    latency-tier: sub-200ms-cached
    mechanism-type: reuse-or-cache-prior-work
    user-segment: studio-analyst
    effort: M-one-quarter
    subject-domain: onboarding-tutorial
  object: 'memo.md item 1: ''quote with timestamp as evidence'''
  situation: The chatbot says 31 players quit at the forge step; a designer wants to see who and why before taking it to the
    producer
  consequence: Without the drawer the designer asks a second question ('which players?') and a third ('show me one'), each
    a new LLM call that may disagree with the first number; with the drawer the 31 is the list
  p_typical: 0.3
  grounded: quote
  evidence: 'memo.md: ''quote with timestamp as evidence'''
  already_offered: false
  proposed: Aggregate answer object carries the list of (player_id, session_id, video_index, timestamp, quote) rows that produced
    the count; UI renders a collapsed table and a clip-reel link
  shallow: false
  mechanism: SQL for a count is rewritten to also SELECT the evidence columns; the chatbot never computes a count without
    materialising the contributing rows, so count == len(rows) by construction
  example: 'Studio: ''How many players said the forge step was confusing?'' Answer: ''18 of 412 (4.4%)'' with a drawer listing
    18 players, e.g. P0231, video 3, 07:42, ''where do I even put the ore''; button ''play 5 random clips'''
  cost: M
  depends_on: 'observation rows store video_index and timestamp per observation (memo item 1); a clip service that can cut
    20-second windows from the original videos (A-frame assumption: originals remain available)'
  part: ui
  ingest_cost: S
  query_cost: S
  better_than_fixed_table: The fixed table stores an option letter per video, so a count cannot be traced back to a quote
    or a moment
  also_from:
  - analyst
  absorbed:
  - analyst-21
- id: askdata-4
  title: Replace the free-text box with 12 slot-filled question templates learned from the first 90 days of query log, e.g.
    '[share] of [cohort] who [event] at [step]'
  level: L3
  perspective: askdata
  cell:
    part: chatbot-ui
    question-origin: learned-from-studio-usage
    query-path: text-to-semantic-layer-metrics
    mechanism-type: narrow-or-clarify-the-question
    moment-in-journey: steady-state-weekly
    user-segment: game-designer
    effort: M-one-quarter
    granularity: tutorial-step
    scope: cohort
    subject-domain: onboarding-tutorial
  object: 'spec.md constraint: ''Buyers are gaming studios. Their questions are not known in advance.'''
  situation: After 90 days the query log shows 80% of questions match a dozen shapes (share-of-cohort-at-step, time-to-step,
    top-reasons-at-step, compare-build, list-players-who)
  consequence: Free text invites questions the store cannot answer and invites the model to improvise; templates with dropdowns
    for step, cohort and metric make the unanswerable question un-typeable, and the free-text box stays as a secondary 'ask
    anything' path with a lower trust badge
  p_typical: 0.08
  grounded: inferred
  evidence: 'spec.md: ''Buyers are gaming studios. Their questions are not known in advance''; once questions arrive, a query
    log would show which question shapes recur'
  already_offered: false
  proposed: Weekly job clusters the query log by parsed intent; any cluster with 20 or more questions in 30 days becomes a
    template; template picker UI with slots populated from the field catalog
  shallow: false
  mechanism: Query log rows (question, parsed_plan, thumbs) are clustered on the parsed_plan signature; a template is a plan
    with free slots; the UI exposes templates as forms; template answers are deterministic SQL with no LLM in the numeric
    path
  example: Template 'share of [cohort] who [event] at [step]' filled as cohort=all, event=quit, step=forge gives '31 of 412
    (7.5%)' from one SQL statement; the same question typed free-form goes through the planner and gets a 'planner-routed'
    badge
  cost: M
  depends_on: a query log with parsed plans (askdata-9) and at least 500 logged questions
  part: ui
  ingest_cost: S
  query_cost: S
  better_than_fixed_table: The fixed table fixes the questions at ingestion; templates fix the question shapes at query time
    while the slots (step, cohort, metric) stay open
  variants_of:
  - owner-19
- id: askdata-6
  title: 'Interpretation echo: the chatbot restates the question in field terms (''Interpreting as: players with >=1 stall
    observation at step forge, among players who reached forge'') before the number, with an edit link'
  level: L4
  perspective: askdata
  cell:
    part: chatbot-ui
    mechanism-type: narrow-or-clarify-the-question
    uncertainty-policy: ask-clarifying-question
    evidence-form: extraction-provenance-model-and-schema-version
    question-type: how-many
    latency-tier: under-2s
    effort: S-weeks
    delivery-surface: chatbot
    user-segment: studio-analyst
    granularity: tutorial-step
    representation: timestamped-observation-log
    subject-domain: onboarding-tutorial
  object: 'memo.md item 2: ''The chatbot runs a query planner'''
  situation: A studio analyst asks 'how many players got stuck at the forge' and 'stuck' could map to stall_flag, retry_count>=3,
    or said_confused
  consequence: Silent mapping to one field produces a number that is right for the field and wrong for the question; the echo
    line makes the mapping visible and correctable before the number is copied anywhere
  p_typical: 0.07
  grounded: inferred
  evidence: 'memo.md: ''timestamped atomic observations across all videos of a session (step on screen, action, utterance,
    friction signal, sentiment, quote with timestamp as evidence)''; the memo does not say which of several fields an ambiguous
    studio word maps to'
  already_offered: false
  proposed: Planner output includes a human-readable plan string and a list of alternative plans; UI shows 'Interpreting as
    ...' with 'change' revealing the alternatives; chosen alternative is logged as a correction
  shallow: false
  mechanism: Planner returns {plan, plan_text, alternatives[]}; renderer prints plan_text above the answer; selecting an alternative
    re-runs with that plan and writes (question, chosen_plan) to the query log for template learning
  example: 'Studio: ''how many got stuck at the forge?'' Chat: ''Interpreting as: players with at least one stall observation
    (no progress 45 s or more) at step forge, among 412 who reached it: 31 (7.5%). Did you mean players who said they were
    confused (18) or who retried 3+ times (44)?'''
  cost: S
  depends_on: the planner already producing a structured plan (memo item 2)
  part: ui
  ingest_cost: S
  query_cost: S
  better_than_fixed_table: The fixed table maps each question to one pre-written option set, so the studio never sees that
    'stuck' was interpreted one specific way
- id: askdata-11
  title: '''Why'' questions answer only as a ranked list of quoted reasons with counts; no synthesised narrative paragraph
    is allowed in the numeric answer path'
  level: L4
  perspective: askdata
  cell:
    part: chatbot-ui
    question-type: why
    evidence-form: quote-with-timestamp
    query-path: retrieval-then-llm
    uncertainty-policy: answer-with-ci-and-n
    modality: speech-transcript
    effort: S-weeks
    user-segment: game-designer
    granularity: tutorial-step
    representation: timestamped-observation-log
    subject-domain: onboarding-tutorial
  object: 'memo.md item 2: ''open-field questions retrieve matching observation rows across players and the model reads only
    those'''
  situation: A designer asks 'why do players quit at the forge step' and the model reads 31 observation rows
  consequence: 'A fluent paragraph (''players are confused by the ore slot and frustrated by the hammer timing'') is where
    invented reasons hide and cannot be checked; a ranked list ''ore slot not found: 14 players (quotes); hammer timing: 9;
    no reason stated: 8'' can be checked quote by quote'
  p_typical: 0.09
  grounded: inferred
  evidence: 'memo.md: ''open-field questions retrieve matching observation rows across players and the model reads only those'';
    the memo does not constrain the form of the answer the model writes from those rows'
  already_offered: false
  proposed: 'Response schema for why-questions: list of {reason_label, player_count, 3 quotes with player/video/timestamp};
    a fixed ''no reason stated: k'' bucket; the LLM output is validated against the schema and every quote is string-matched
    to a stored observation before display'
  shallow: false
  mechanism: The LLM is asked to cluster the retrieved rows into labelled reasons and cite row ids; a validator rejects any
    quote not present verbatim in the cited row and any count that does not equal the number of cited rows; failure falls
    back to 'could not group; here are the 31 quotes'
  example: '''Why do players quit at the forge?'' Answer: ''1. Cannot find where to place ore: 14 of 31 (P0231 v3 07:42 "where
    do I even put the ore"; ...). 2. Hammer timing fails: 9 of 31. 3. No reason spoken: 8 of 31.'' No paragraph.'
  cost: S
  depends_on: observation rows with quotes and ids (memo item 1)
  part: ui
  ingest_cost: S
  query_cost: M
  better_than_fixed_table: The fixed table has closed options only, so 'why' is either unanswerable or answered from an option
    list written before the reasons were known
- id: askdata-18
  title: 'Silent-player disclosure: every answer from speech fields states how many players were silent during the step and
    excludes them from the denominator by default, with a toggle'
  level: L4
  perspective: askdata
  cell:
    part: chatbot-ui
    modality: silence-or-absence-of-speech
    evidence-form: coverage-statement-n-of-m-players
    question-type: how-felt
    granularity: tutorial-step
    uncertainty-policy: answer-with-ci-and-n
    effort: S-weeks
    subject-domain: onboarding-tutorial
  object: 'spec.md stage 2: ''Each video is converted to a transcript'''
  situation: A studio asks 'how did players feel about the forge step' and 367 of 412 players said nothing during that step
  consequence: '''18% frustrated'' silently means 8 of 45 speakers; read as 18% of all players it is wrong by a factor of
    9; the disclosure line prevents the misread and the silent count is itself a finding (the step is 2 minutes of quiet failure)'
  p_typical: 0.07
  grounded: inferred
  evidence: 'spec.md: ''Each video is converted to a transcript''; players who say nothing during a step leave no speech evidence,
    and neither artifact measures silence'
  already_offered: false
  proposed: 'Per player per step: seconds_of_speech field computed at ingestion; the renderer prints ''among 45 players who
    spoke during this step (367 silent)''; a toggle switches the denominator to all 412 with the silent players counted as
    ''no evidence'''
  shallow: false
  mechanism: Ingestion computes speech seconds per (player, step) from transcript timestamps aligned with step boundaries;
    the semantic layer defines two denominators for every speech-derived metric; the renderer always prints which one is used
  example: '''How did players feel about the forge step?'' Answer: ''Among 45 players who spoke during the forge step: 8 frustrated
    (18%), 5 confused, 32 neutral. 367 players were silent during the step and are excluded; toggle to include them as no-evidence.'''
  cost: S
  depends_on: step boundaries per player aligned to transcript time (session-stitching and frame pipeline)
  part: ui
  ingest_cost: S
  query_cost: S
  better_than_fixed_table: The fixed table's sentiment option is filled for every video whether or not the player spoke, so
    silence is indistinguishable from neutral
  variants_of:
  - ops-3
