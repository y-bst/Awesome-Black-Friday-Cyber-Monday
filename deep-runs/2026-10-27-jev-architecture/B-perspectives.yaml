- slug: store-designer
  who: Data engineer designing the session store
  notices: schema for timestamped observations, session vs video keys, versioning, columnar aggregates, how a new field is
    added
  p_typical: 0.7
- slug: retrieval-engineer
  who: Engineer who builds retrieval and ranking
  notices: chunking across video boundaries, hybrid search, metadata filters by player and step, reranking, when retrieval
    beats a table
  p_typical: 0.65
- slug: extraction-prompt-engineer
  who: Engineer who writes ingestion-time extraction
  notices: open vs closed fields, evidence requirements, per-step extraction, consistency across videos, self-verification
    passes
  p_typical: 0.6
- slug: query-planner-engineer
  who: Engineer who builds the chatbot's planner
  notices: classify question -> SQL vs retrieval vs backfill, cohort vs player, follow-ups, what to answer when the store
    has nothing
  p_typical: 0.6
- slug: studio-analyst-asker
  who: Analyst at a studio asking real questions
  notices: the 30 questions they actually ask, the ones that need numbers, the ones that need a clip
  p_typical: 0.8
- slug: game-designer-asker
  who: Designer tuning the tutorial
  notices: step-level timelines, why players stall, comparing versions, seeing 5 clips of the same failure
  p_typical: 0.55
- slug: question-generation-researcher
  who: Researcher who knows question-generation and information-extraction literature
  notices: ontology-driven QG, schema induction from data, open IE, slot filling, question banks learned from usage
  p_typical: 0.3
- slug: cv-frame-engineer
  who: Computer-vision engineer adding frames to the pipeline
  notices: screen-state classification, OCR, UI element detection, sampling rates, aligning frames with transcript timestamps
  p_typical: 0.5
- slug: eval-lead
  who: Person who owns correctness
  notices: golden sets, per-field accuracy, consistency checks, regression on prompt change, answer-with-evidence rules
  p_typical: 0.45
- slug: latency-cost-engineer
  who: Engineer who owns p95 latency and the inference bill
  notices: precomputation, caching, materialised aggregates, when to run the model at query time
  p_typical: 0.5
- slug: knowledge-graph-person
  who: Engineer who would model sessions as a graph
  notices: entities (player, step, mechanic, UI element), relations, temporal edges, graph queries vs tables
  p_typical: 0.25
- slug: long-context-skeptic
  who: Engineer who thinks a long-context model over raw transcripts beats any store
  notices: where raw beats structure, map-reduce over players, cost curves, where structure is still needed
  p_typical: 0.2
- slug: telemetry-data-scientist
  who: Studio data scientist with event telemetry
  notices: joining video observations to events, where telemetry already answers the question, where video adds
  p_typical: 0.4
- slug: session-stitcher
  who: Engineer responsible for n-hour sessions split into 15-minute videos
  notices: ordering, gaps, cross-video context, session-level fields vs video-level fields
  p_typical: 0.35
- slug: product-owner-jev
  who: The JEV product owner
  notices: time to onboard a new game, what must be per-game vs generic, what the studio sees first
  p_typical: 0.5
- slug: ask-your-data-veteran
  who: Person who shipped an 'ask your data' chatbot and watched it fail
  notices: trust collapse after one wrong number, need for evidence and sample sizes, question templates users actually use,
    guardrails
  p_typical: 0.15
- slug: statistician
  who: Statistician
  notices: sampling 500 players, confidence intervals in chatbot answers, denominators, multiple comparisons when a studio
    asks 50 questions
  p_typical: 0.12
- slug: privacy-counsel
  who: Privacy counsel
  notices: what to store from speech, retention, minors, per-studio isolation, model vendor terms
  p_typical: 0.12
- slug: observability-log-analytics-builder
  who: Engineer who built a log/event analytics store at scale (Splunk, Datadog, Honeycomb, ClickHouse-based observability)
  notices: 'Their whole product category exists to answer unknown questions fast over data that was written before anyone
    knew the question. Wide structured events with high-cardinality attributes; schema-on-read (JSON/variant columns) instead
    of a fixed answer table; columnar store plus inverted index; tiered retention (hot aggregates, warm events, cold raw media);
    query-time sampling with error bars; and automatic contrast ("BubbleUp": what attribute values differ between the slow/churned
    group and the baseline) so the user does not have to guess the question.

    '
  p_typical: 0.1
  added_by: stage-D
- slug: conversation-analytics-vendor
  who: Product/ML lead at a call-centre or sales conversation-intelligence vendor (Gong, CallMiner, Observe.AI, NICE)
  notices: 'Hours of recorded speech per customer, thousands of tenants, and each tenant asks its own questions. The patterns
    they converged on: customer-defined "trackers" (keyword + semantic + example-based) that are applied retroactively over
    the whole history overnight; universal pre-extracted primitives (talk ratio, silence, sentiment curve, topic segments,
    moments) computed for every call regardless of tenant; scorecards; and "smart trackers" learned from a few labelled examples.
    Also noticed: tracker libraries shared across tenants in the same vertical, which here means the same game genre.

    '
  p_typical: 0.1
  added_by: stage-D
- slug: ux-research-repository-vendor
  who: Builder of AI insight features over user-research session video (Dovetail, UserTesting/UserZoom AI insights, Condens,
    Lookback, PlaytestCloud)
  notices: 'Highlight reels, auto-tagging against a research taxonomy, theme clustering across sessions, "insight" objects
    that link to evidence clips, and a repository that researchers query months later. They know which features researchers
    trusted and which they ignored. They also know these vendors are the competition, and that they offer clip-first evidence
    rather than numbers-first.

    '
  p_typical: 0.1
  added_by: stage-D
- slug: clinical-data-abstraction-lead
  who: Clinical informatics lead (registry chart abstraction, OMOP common data model, phenotype libraries)
  notices: 'Their field solved "extract once from long unstructured records, then answer research questions nobody wrote yet,
    across many institutions with different local formats". The solution was a common data model with vocabulary mapping per
    site, which here means per game: standard concepts (step, mechanic, UI element, affect), with each game''s local names
    mapped onto them. On top of that sit reusable phenotype definitions (cohort logic as shareable artifacts), abstraction
    with source-span evidence, and inter-abstractor agreement as the quality metric.

    '
  p_typical: 0.1
  added_by: stage-D
- slug: ediscovery-tar-practitioner
  who: Legal e-discovery / technology-assisted review (TAR) practitioner
  notices: 'For "find all players who X" questions, recall matters more than precision. TAR solved this with seed sets, continuous
    active learning, and recall estimation by random sampling of the null set, with numbers you can defend. Their position:
    retrieval-then-LLM without a recall estimate is indefensible. They would also point out that privilege/redaction layers
    apply before anyone queries.

    '
  p_typical: 0.1
  added_by: stage-D
- slug: studio-data-team-rejector
  who: Head of data/analytics engineering at a client studio who believes they can build this in-house
  notices: 'They do not want a chatbot. They want raw observations exported into their warehouse (Snowflake/BigQuery share,
    Parquet drop, API) keyed by their player IDs, so they can join to telemetry and use their own BI and their own LLM. Their
    questions: why pay JEV if you hand us transcripts? What is the moat? Will your schema break our dbt models when you add
    a field?

    '
  p_typical: 0.1
  added_by: stage-D
- slug: studio-security-reviewer
  who: Studio infosec / vendor-risk reviewer
  notices: 'Pre-release footage under NDA is the studio''s most leak-sensitive asset. Their questions: which model vendor
    sees frames and audio, and is that data used for training? Where is data resident? Is there single-tenant or in-VPC deployment?
    Is SSO/RBAC per project? There is also prompt injection: player speech or on-screen text becomes LLM input at ingestion
    and query time. Cross-studio leakage through a shared ontology, shared question bank or shared cache is another risk.

    '
  p_typical: 0.1
  added_by: stage-D
- slug: publisher-portfolio-buyer
  who: Publisher-side user-research or portfolio insights director overseeing many studios/titles
  notices: 'Cross-title benchmarks ("is this tutorial''s step-3 stall rate bad compared with our other 12 titles?") require
    a shared, comparable representation, and per-studio bespoke questions destroy comparability. Buys annually and centrally,
    and wants standard reports plus drill-down. That is the opposite pull from per-game flexibility.

    '
  p_typical: 0.1
  added_by: stage-D
- slug: platform-owner
  who: Developer-relations / partner-success lead at a platform (console first party, PC store, mobile store, UGC platform
    like Roblox/UEFN)
  notices: 'They have thousands of small developers who cannot afford a research team. They want a self-serve, zero-config
    product embedded in the dev portal, with genre-default question banks and aggregate benchmarks across the platform. Every
    developer is "a new game", and onboarding time per game must be close to zero.

    '
  p_typical: 0.1
  added_by: stage-D
- slug: playtest-ops-protocol-designer
  who: Playtest operations lead who designs session protocol and recruits players
  notices: 'The cheapest way to answer more questions is to change what gets recorded: think-aloud prompting, in-game micro-survey
    popups at step boundaries, a post-session questionnaire, a webcam, telemetry SDK hooks, recruiting quotas so cohorts are
    big enough. Silent players produce empty transcripts and break speech-centric representations. Their view: a session starts
    at recruitment, so the data has a history before ingestion.

    '
  p_typical: 0.1
  added_by: stage-D
- slug: video-understanding-search-engineer
  who: Engineer from sports analytics / media archive search / video-native foundation models (Hudl, Second Spectrum, Twelve
    Labs, broadcast MAM)
  notices: 'Time-coded multimodal clip embeddings that support query-by-text and query-by-example ("find moments like this
    clip"). Event spotting models trained once per sport, which here means per genre. Hierarchical temporal indexes (frame
    → shot → play → game). Highlight generation. Their claim: you do not need a transcript-first representation.

    '
  p_typical: 0.1
  added_by: stage-D
- slug: games-user-research-lead
  who: GUR lead at a large studio (established playtest lab with biometrics, RITE, heuristic evaluation)
  notices: 'Decades of established question frameworks: usability heuristics for games, PXI/GEQ/PENS experience inventories,
    MDA, funnel/progression analysis. These are ready-made ontologies for question generation. They also know which questions
    researchers actually take to producers, which is usually a prioritised issue list with severity and frequency, not a Q&A.

    '
  p_typical: 0.1
  added_by: stage-D
