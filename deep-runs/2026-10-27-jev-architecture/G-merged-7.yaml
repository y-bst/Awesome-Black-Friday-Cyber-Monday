  mechanism: 'Changes tenancy-access-control: a screen function sits between tenant store and every shared artefact, with
    a log'
  example: '''Do players stall at the Ember Forge tutorial step?'' answers normally inside Studio A; the genre-shared question
    library stores the pattern as ''stall at [crafting-station] step'' only'
  cost: S
  depends_on: an ontology or any shared cross-studio structure (memo.md item 3)
  part: tenancy-access-control
  ingest_cost: S
  query_cost: S
