  p_typical: 0.04
  grounded: inferred
  evidence: 'spec.md: ''What a transcript contains (speech only, on-screen text, events)'' unspecified'
  proposed: Delimiters plus data-only instruction; strict JSON schema validation; injection suite in CI; log unparsed rate
