    loading, none-30s-max}, thumb_uri)
  shallow: false
  part: ingestion
  mechanism: TransNetV2 over decoded frames at 8 fps plus a UI-transition rule (over 60% of pixels change and a menu or dialog
    layout is detected) produce cut points; a 30-s maximum forces a cut inside long static or continuous play; the shots table
    is the join key for embeddings, captions, events and OCR
  example: Studio asks 'what happened right before players quit tutorial step 3'; the chatbot returns the last 3 shots before
    each exit (median 18 s of footage per player) for 212 of 500 players, as a shot list with thumbnails, no transcript needed
  cost: S
  ingest_cost: S
  query_cost: S
  better_than_fixed_table: The fixed table has one row per 15-minute file; a shot row localises any later field to a 6-s span
  depends_on: nothing
  perspective: vidsearch
