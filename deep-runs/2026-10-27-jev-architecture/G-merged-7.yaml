  p_typical: 0.05
  grounded: quote
  evidence: 'memo.md: ''Questions are generated from an ontology (entities x dimensions x outcomes), pruned by the game target'''
  proposed: 'Onboarding form: list of confidential terms (expected 20 to 200 per pre-release title); a term-screen runs before
