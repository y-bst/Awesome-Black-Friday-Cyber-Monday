  perspective: tar
- id: extract-35
  title: 'Redaction inside the extraction call: spoken names, emails, handles and addresses are replaced with typed placeholders
    in the stored quote (<=40 words), a redacted flag is set, and sessions whose profile marks the player as under 16 get
    affect and webcam fields set to unobserved'
  level: L4
  cell:
    part: tenancy-access-control
    modality: player-profile-metadata
    tenancy-and-deployment: logically-isolated-per-studio
    evidence-form: quote-with-timestamp
    mechanism-type: change-data-at-source
    extraction-trigger: at-ingestion
    delivery-surface: chatbot
  part: ingestion
  object: 'memo.md item 1: ''quote with timestamp as evidence'' ; spec.md ''Unspecified: ... who at the studio asks'''
  situation: A player says 'my brother Tom at tom99@mail.com showed me this'; the verbatim quote rule (extract-1) stores it
    and the chatbot can surface it to anyone at the studio
  consequence: Personal data of a third party sits in a queryable evidence column; a minors cohort has affect scores nobody
    agreed to collect
  mechanism: 'Extraction output includes quote_raw; a post-step runs NER plus regex on quote_raw and writes quote with placeholders
    ([NAME], [EMAIL], [HANDLE]) and redacted=true; quote_raw is dropped after validation (extract-1 substring check runs before
    redaction). Quote length capped at 40 words. If profile.age_band is under_16: affect fields and any webcam-derived field
    are forced to unobserved and the row carries minor_policy=true. Chatbot counts over affect exclude minor_policy rows with
    a coverage statement'
  example: Studio asks 'what did players say when they got lost in the tutorial?' Quotes appear as 'my brother [NAME] showed
    me this' and the footer reads 'affect unavailable for 40 players under 16'
  ingest_cost: S
  query_cost: S
  cost: XS
  depends_on: age band in player profile metadata; NER model
  better_than_fixed_table: The fixed table stores no quotes, so it had no exposure; adding evidence without this reintroduces
    it
  p_typical: 0.05
  grounded: inferred
  evidence: 'memo.md: ''quote with timestamp as evidence'''
  proposed: Redaction before storage, never at display time
  shallow: false
  perspective: extract
  variants_of:
  - tar-7
- id: gur-25
  title: 'REFUSED: cross-studio benchmark lines (''your step-3 drop-off is worse than 70% of games''); allowed only as opt-in,
    genre-normalised, with >= 20 contributing games and no per-game identification'
  level: L3
  cell:
    part: tenancy-access-control
    scope: cross-studio-benchmark
    tenancy-and-deployment: logically-isolated-per-studio
    question-type: compare-versions
    user-segment: publisher-portfolio
    uncertainty-policy: abstain-below-coverage
    granularity: tutorial-step
    effort: S-weeks
  object: 'spec.md Constraints: ''Buyers are gaming studios'''
  situation: A sales deck proposes 'benchmarks across our 40 games' as a differentiator
  consequence: A large-studio GUR lead will not allow their playtest data into a pool, and does not trust a benchmark that
    mixes a 3-step mobile tutorial with a 40-minute RPG tutorial; the refusal is a tenancy default, with the opt-in path specified
    so publishers can use it
  p_typical: 0.04
  grounded: inferred
  evidence: 'spec.md: ''Buyers are gaming studios'' and ''Their questions are not known in advance''; no cross-studio use
