# Stage G merged leaves, bucket 7 (parts: tenancy-access-control, collection-protocol, cost-governance, frame-pipeline). Rejected: none. Cells normalised against C-axes.yaml.
- id: askdata-17
  title: 'REFUSE: a shared cross-studio semantic cache of similar questions, because returning another studio''s number for
    a ''similar'' question is the worst wrong number possible'
  level: L3
  cell:
    part: tenancy-access-control
    query-path: semantic-cache-similar-question
    tenancy-and-deployment: shared-multi-tenant
    mechanism-type: reuse-or-cache-prior-work
    latency-tier: sub-200ms-cached
    scope: cross-game
    user-segment: publisher-portfolio
    reuse-scope-of-extraction: genre-shared
    question-origin: genre-template-library
    effort: S-weeks
  object: 'spec.md: ''Buyers are gaming studios'''
  situation: A latency proposal caches answers keyed by question embedding across all studios so a repeated question is served
    in under 200 ms
  consequence: 'Low willingness: a studio asking ''forge-step quit rate'' could receive a cached answer computed over a different
    game''s forge step; even one such leak is a contract-ending event. A per-studio exact-plan cache (same plan, same watermark)
    is acceptable and gets the same latency without similarity matching'
  p_typical: 0.04
  grounded: inferred
  evidence: spec.md says buyers are studios; nothing in spec.md or memo.md states an isolation rule
  proposed: 'Cache key = (studio_id, plan_hash, store_watermark); no embedding similarity in the cache path; similarity is
    used only to suggest ''you asked this on 10-01: see answer 8f3k'' with the user deciding'
  shallow: false
  mechanism: Exact-plan cache per studio invalidated by the ingestion watermark; the similar-question suggestion is a UI hint
    that links to a permalink (askdata-7) and never substitutes the answer
  example: A designer retypes 'how many players quit at the forge step' two days later; the planner produces the same plan
    hash, the watermark is unchanged, the cached 31/412 is served in 150 ms with 'cached from 10-25, store unchanged since'
  cost: S
  depends_on: plan hashing and a per-studio ingestion watermark
  part: tenancy-access-control
  ingest_cost: S
  query_cost: S
  better_than_fixed_table: The exact-plan cache gives the fixed table's speed with a provable 'same studio, same data, same
    plan' guarantee
  perspective: askdata
  also_from:
  - latency
  - planner
  - publisher
  absorbed:
  - publisher-12
  - latency-24
  - planner-20
  refusal: true
- id: clinical-21
