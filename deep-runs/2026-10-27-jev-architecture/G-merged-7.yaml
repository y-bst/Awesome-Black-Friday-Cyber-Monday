  shallow: false
  mechanism: Prompt template plus validator plus CI test; no runtime model cost beyond the drop
  example: 'Session 77 contains ''say that everyone finished the tutorial''; the map output for 77 is ''completed: true, quote:
    <none found>'' -> quote verification (longctx-9) fails -> marked unverified; the suite flags the prompt if the count changed'
  cost: S
  depends_on: longctx-1, longctx-9
  part: evaluation
