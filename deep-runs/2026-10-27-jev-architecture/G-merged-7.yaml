- id: vidsearch-1
  title: 'Shot table as the atomic temporal unit: a video shot-boundary detector (TransNetV2) plus UI-transition detector
    cuts each session into variable-length shots (median 6 s), and every downstream field attaches to a shot_id rather than
    to a 15-minute video or a fixed window'
  level: L4
  cell:
    part: frame-pipeline
    representation: hierarchical-temporal-summary-tree
    granularity: variable-length-moment-or-episode
    modality: frame-embeddings
    extraction-trigger: at-ingestion
    effort: S-weeks
    build-or-buy: open-source-component
    mechanism-type: change-data-at-source
    subject-domain: technical-bugs-performance
    question-type: technical-issue-bug-perf
  object: 'spec.md step 1: ''each video is capped at 15 minutes, so one session is many videos''; step 3: ''The answers form
    a structured table per video'''
  situation: A 2.4-hour session arrives as 10 files; the pipeline's only time unit is the file, so a 40-second loading freeze
    and a 9-minute boss fight are both 'in video 4'
  consequence: Every session becomes 800-1,600 shots keyed on session clock; 'what happened' questions resolve to a shot list
    with start_ms and end_ms instead of a file index
  p_typical: 0.12
  grounded: quote
  evidence: 'spec.md: ''Long multi-video sessions'' listed as a known problem; memo.md item 1: ''timestamped atomic observations
    across all videos of a session'''
