  object: 'memo.md item 3: ''Questions are generated from an ontology (entities x dimensions x outcomes)'''
  situation: Ontology learns entity 'Ember Forge' from Studio A's sessions; an induced question 'did the player open the Ember
    Forge menu' is proposed to Studio B six months before Studio A's announcement
  consequence: Cross-studio leakage via a shared ontology is the vendor-risk reviewer's objection; a per-studio confidentiality
