- id: stitch-1
  title: "Session manifest table built at ingestion: one row per video with session_id, segment_index, wall_clock_start, duration_ms, gap_before_ms, source_file, stitch_confidence"
  level: L4
  cell: {part: session-stitching, representation: timestamped-observation-log, granularity: session, extraction-trigger: at-ingestion, effort: XS-days, mechanism-type: precompute-more}
  object: "spec.md section 1: 'A session can be n hours; each video is capped at 15 minutes, so one session is many videos' and Unspecified: 'how videos of one session are linked'"
  situation: "A 2h40m session arrives as 11 files; nothing in the current pipeline records which file is first, and the answers table is per video"
  consequence: "Every session-level question (did the player finish the tutorial, how long did the whole session last) is unanswerable or answered off a single video picked at random"
  p_typical: 0.45
  grounded: quote
  evidence: "spec.md: 'The answers form a structured table per video'; Unspecified: 'how videos of one session are linked'"
  proposed: "Create table session_videos(session_id, segment_index, video_id, wall_clock_start, duration_ms, gap_before_ms, source_file, stitch_confidence 0-1) populated from file metadata and recorder timestamps before any extraction runs"
  mechanism: "Changes the store: a manifest keyed by session_id is written per upload batch; every downstream row (observation, answer) carries video_id and the manifest resolves video_id to session position; 11 rows for an 11-video session, each with duration_ms (900000 for a full segment) and gap_before_ms"
  example: "Studio asks 'how many of the 500 players quit during the tutorial'; the planner joins answers to session_videos, finds the last segment per session, and counts sessions whose last segment has tutorial_complete=false, instead of counting videos"
  cost: S
  depends_on: nothing
  part: session-stitching
  ingest_cost: S
  query_cost: S
  better_than_fixed_table: "Fixed table has no session key, so 'per player' counts today are really 'per 15-minute video' counts"
  shallow: false

- id: stitch-2
  title: "Every observation carries two clocks: (video_id, video_ms) for clip lookup and session_offset_ms = sum of prior segment durations plus gaps for duration arithmetic"
  level: L4
  cell: {part: store, representation: timestamped-observation-log, granularity: utterance, question-type: how-long, evidence-form: quote-with-timestamp, effort: XS-days}
  object: "memo.md item 1: 'timestamped atomic observations across all videos of a session'"
  situation: "Tutorial step 3 starts at 13:50 in video 2 and ends at 02:10 in video 3; a single video-local timestamp gives a negative duration"
  consequence: "Step durations that straddle a cut are dropped or negative; 'how long did step 3 take' over 500 players is biased toward short steps that fit inside one video"
  p_typical: 0.35
  grounded: quote
  evidence: "memo.md: 'timestamped atomic observations across all videos of a session'"
  proposed: "Observation schema gains session_offset_ms (int64) alongside video_id and video_ms; a SQL view computes step duration as max(session_offset_ms) - min(session_offset_ms) per (session_id, step)"
  mechanism: "Changes ingestion and store: the extractor writes video-local timestamps; a post-step adds session_offset_ms from the manifest (segment start offset plus video_ms); queries about duration use session_offset_ms, queries that need a clip use video_id+video_ms"
  example: "'Median time on tutorial step 3' becomes SELECT percentile(0.5, max(so)-min(so)) GROUP BY session_id, step=3 and returns 4m20s including the 20 players whose step 3 crossed a cut"
  cost: S
  depends_on: stitch-1
  part: store
  ingest_cost: S
  query_cost: S
  better_than_fixed_table: "Fixed table cannot express any duration longer than 15 minutes or crossing a cut"
  shallow: false

- id: stitch-3
  title: "Boundary re-extraction window: run the extractor a second time on the 120s tail of segment k concatenated with the 120s head of segment k+1, deduplicate against both single-video runs"
  level: L4
  cell: {part: ingestion-extraction, representation: timestamped-observation-log, granularity: variable-length-moment-or-episode, extraction-trigger: at-ingestion, modality: speech-transcript, mechanism-type: precompute-more}
  object: "spec.md: 'each video is capped at 15 minutes' and known problem 'Long multi-video sessions'"
  situation: "A player says 'okay I give up' at 14:58 of segment 4 and closes the game at 00:03 of segment 5; the per-video extractor sees the utterance without the quit and the quit without the utterance"
  consequence: "Quit-reason field for that session reads 'unknown'; for a 2.5h session with 10 cuts, roughly 10 x 4 minutes = 40 minutes (27%) of the session lies within 2 minutes of a cut"
  p_typical: 0.08
  grounded: inferred
  evidence: "spec.md: 'Each video is converted to a transcript' (per video, no cross-video context)"
  proposed: "Ingestion job emits, per cut, a 240s window (transcript lines plus sampled frames) and runs the same question set; observations whose session_offset_ms is within 2s and whose text cosine similarity is over 0.9 of an existing row are merged, others appended with source=boundary_window"
  mechanism: "Changes ingestion: for an n-segment session there are n-1 additional small extraction runs (each 240s of content) producing observation rows tagged source=boundary_window; the store dedupes on (session_id, session_offset_ms +-2000ms, text similarity)"
  example: "'Why did players quit during the tutorial' retrieves quit observations; 14 of 500 players had their quit utterance within 2 minutes of a cut and now have a quote-with-timestamp instead of 'unknown'"
  cost: S
  depends_on: stitch-2
  part: ingestion-extraction
  ingest_cost: M
  query_cost: S
  better_than_fixed_table: "Fixed per-video questions have no way to see an event split across two files"
  shallow: false

- id: stitch-4
  title: "Carry-forward state snapshot: the extractor for segment k+1 receives a 300-token JSON state emitted at the end of segment k (current step, level, last 3 friction signals, running sentiment, open goals)"
  level: L4
  cell: {part: ingestion-extraction, representation: hierarchical-temporal-summary-tree, granularity: video, extraction-trigger: at-ingestion, mechanism-type: precompute-more, effort: S-weeks}
  object: "spec.md section 3: 'The transcript is run through a fixed set of questions' (each video independently)"
  situation: "Segment 6 opens on a combat screen with the player silent for 3 minutes; without context the extractor cannot say whether this is tutorial step 5 (combat tutorial) or free play after the tutorial"
  consequence: "Step attribution for segments after the first is guessed from in-video cues alone; the 'which step were they on when they churned' answer is wrong whenever the step label was only stated in an earlier video"
  p_typical: 0.12
  grounded: inferred
  evidence: "spec.md: 'Transcript loses visual information'; memo.md item 1 asks for 'step on screen' per observation"
  proposed: "Extractor prompt gets a fixed prefix 'STATE AT START OF SEGMENT: {...}' and must emit 'STATE AT END OF SEGMENT' as its last field; segments are processed sequentially per session, in parallel across sessions"
  mechanism: "Changes ingestion: adds a sequential dependency within a session (segment k+1 waits for k), state JSON stored in session_videos.end_state; extraction latency per session becomes sum of segment latencies, not max"
  example: "'How many players churned on the combat tutorial step' counts sessions whose last segment's end_state.current_step = 'combat-tutorial' and tutorial_complete=false; players who entered that step in segment 5 and quit silently in segment 6 are now attributed correctly"
  cost: M
  depends_on: stitch-1
  part: ingestion-extraction
  ingest_cost: M
  query_cost: S
  better_than_fixed_table: "Fixed table answers each video blind; step labels stated once in video 1 are lost for videos 2 to n"
  shallow: false

- id: stitch-5
  title: "Gap typing: when wall_clock_start(k+1) minus wall_clock_end(k) exceeds 2000ms, emit a gap observation classified from the first 5 frames of k+1 into {recording-pause, crash-restart, afk-same-scene, main-menu-return, segment-lost}"
  level: L4
  cell: {part: session-stitching, question-type: technical-issue-bug-perf, modality: screen-state-classifier, granularity: variable-length-moment-or-episode, evidence-form: count-with-denominator, mechanism-type: auto-discover-without-question}
  object: "spec.md Unspecified: 'how videos of one session are linked'; known problem 'Long multi-video sessions'"
  situation: "Segment 3 ends at 14:59:58 and segment 4 starts 4 minutes later on the game's title screen"
  consequence: "A crash-and-relaunch is invisible to the question set; the studio's 'did anyone hit a crash in the tutorial' question returns 0 while 23 of 500 sessions have a 2-10 minute gap that reopens on the title screen"
  p_typical: 0.07
  grounded: inferred
  evidence: "spec.md: 'Ingestion time and cost are not a concern'"
  proposed: "Gap classifier (frame embedding of first 5 frames of k+1 vs last 5 of k, plus gap length) writes observation type=gap with gap_ms and gap_class; chatbot exposes gap_class counts with denominator = sessions"
  mechanism: "Changes session-stitching and ingestion: a new observation row per gap with closed enum gap_class and int gap_ms; frame embeddings for 10 frames per cut; count query is precomputed per game per build"
  example: "'Why did players quit the tutorial' answer now includes 'crash-restart gaps occurred in 23 of 500 sessions (4.6%), 17 of those 23 did not resume the tutorial afterwards' with 3 example clips"
  cost: S
  depends_on: stitch-1
  part: session-stitching
  ingest_cost: S
  query_cost: S
  better_than_fixed_table: "The fixed table only has fields about what is inside a video; a gap between videos is by construction never a field"
  shallow: false

- id: stitch-6
  title: "Content-based ordering when filenames and timestamps disagree: order segments by OCR'd in-game clock or level counter plus transcript continuity (embedding similarity of last 3 lines of k to first 3 lines of candidate), write ordering_confidence"
  level: L4
  cell: {part: session-stitching, modality: on-screen-text-ocr, granularity: video, uncertainty-policy: answer-with-ci-and-n, extraction-trigger: at-ingestion, effort: S-weeks}
  object: "spec.md Unspecified: 'how videos of one session are linked'"
  situation: "A recorder names files by upload time; two segments uploaded out of order give session_video_3.mp4 a wall_clock_start earlier than session_video_2.mp4"
  consequence: "Carry-forward state and session_offset_ms are computed in the wrong order; step funnel shows the player going from step 5 back to step 2"
  p_typical: 0.06
  grounded: inferred
  evidence: "spec.md: 'what is on screen is largely lost' (no OCR today)"
  proposed: "Ordering job computes three orderings (filename, wall clock, content) and stores the agreed ordering with ordering_confidence = fraction of adjacent pairs where all three agree; sessions under 0.8 are flagged and excluded from duration questions unless the studio opts in"
  mechanism: "Changes session-stitching: adds OCR of any HUD clock or level label on 1 frame per 30s and a transcript-continuity score per candidate pair; output is segment_index plus ordering_confidence in session_videos"
  example: "'Median tutorial duration' reports 'n=471 of 500 sessions (29 excluded for ordering_confidence under 0.8)' instead of silently including 29 scrambled sessions"
  cost: M
  depends_on: stitch-1
  part: session-stitching
  ingest_cost: M
  query_cost: S
  better_than_fixed_table: "Fixed table never checks ordering, so a scrambled session silently corrupts every duration answer"
  shallow: false

- id: stitch-7
  title: "Each generated question declares scope in {video, step, session, player} and, for scope above video, a reducer in {first, last, any, all, max, sum, latest-nonnull} applied over segment-level answers"
  level: L4
  cell: {part: question-generation, question-origin: ontology-generated, granularity: session, representation: fixed-mcq-answers, schema-evolution: append-only-versioned-fields, user-segment: studio-data-engineer}
  object: "memo.md item 3: questions generated 'each with an answer type and an evidence requirement'"
  situation: "The question 'did the player complete the tutorial' is asked per video: segment 1 says no, segment 4 says yes, segment 9 says no (free play, no tutorial visible)"
  consequence: "A naive aggregate over videos says 33% completed the tutorial for a player who completed it; without a declared reducer the chatbot picks one at random or averages booleans"
  p_typical: 0.2
  grounded: quote
  evidence: "memo.md: 'each with an answer type and an evidence requirement'; spec.md: 'The answers form a structured table per video'"
  proposed: "Question schema gains scope and reducer fields; ontology generator emits reducer by default from outcome type (completion -> any, quit -> last, max_frustration -> max, time_on_step -> sum)"
  mechanism: "Changes question-generation and query path: the planner rewrites a session-scope question as reducer(video answers) grouped by session_id; the reducer is part of the question's version so changing it creates a new field version"
  example: "'How many players completed the tutorial' = count(sessions where any(tutorial_complete)) = 312 of 500; 'where did they quit' = last(step_on_screen) over segments where tutorial_complete=false"
  cost: S
  depends_on: stitch-1
  part: question-generation
  ingest_cost: S
  query_cost: S
  better_than_fixed_table: "The fixed table has no notion of scope, so every answer is a video answer and session answers are undefined"
  shallow: false

- id: stitch-8
  title: "Hierarchical summary tree per session: leaf = 5-minute chunk summary (120 tokens), node = segment summary (200 tokens), root = session summary (300 tokens), each node storing child offsets; retrieval descends from root"
  level: L4
  cell: {part: store, representation: hierarchical-temporal-summary-tree, granularity: session, query-path: retrieval-then-llm, latency-tier: under-30s, question-type: what-happened}
  object: "spec.md section 4: 'Reading 500 transcripts per question was too slow and too much data'"
  situation: "Studio asks an open question 'what did players do right after finishing the tutorial' that no closed field covers"
  consequence: "Today the chatbot either cannot answer or reads 500 x 2.5h of transcript (about 500 x 25k tokens)"
  p_typical: 0.15
  grounded: quote
  evidence: "spec.md: 'Reading 500 transcripts per question was too slow and too much data, which is why the fixed-question table exists'"
  proposed: "Ingestion builds 3-level tree per session (about 30 leaves + 10 nodes + 1 root for a 2.5h session); planner reads 500 roots (150k tokens), selects sessions, descends to the segment nodes after the tutorial_complete offset, reads those 500 x 200 tokens"
  mechanism: "Changes store and query path: a summaries table (session_id, level 0-2, start_offset_ms, end_offset_ms, text, child_ids); query reads at most 2 levels for 500 sessions, about 250k tokens, in 2 parallel batches"
  example: "'What did players do after the tutorial' reads the root summaries, then the first post-tutorial segment node for the 312 completers, and answers '201 went to the shop, 78 started mission 1, 33 quit within 5 minutes' with 5 clip pointers"
  cost: M
  depends_on: stitch-2
  part: store
  ingest_cost: M
  query_cost: M
  better_than_fixed_table: "Answers a question no one wrote in advance in under 30s, with evidence pointers to the exact 5-minute chunk"
  shallow: false

- id: stitch-9
  title: "Session-end classifier on the last 60s of the final segment: {closed-game-from-menu, closed-game-mid-play, crash, recording-stopped-protocol, idle-timeout, segment-missing}"
  level: L4
  cell: {part: ingestion-extraction, modality: screen-state-classifier, granularity: session, question-type: who-are-the-churners-segment-discovery, subject-domain: onboarding-tutorial, uncertainty-policy: abstain-below-coverage}
  object: "spec.md section 3: 'The targets are mostly detecting churn in the tutorial and just after it'"
  situation: "A session ends at 2h14m with tutorial_complete=false; the recording protocol was a 2-hour playtest slot"
  consequence: "The player is counted as a tutorial churner although the recording was stopped by the protocol while they were still playing; churn rate is inflated by every protocol-stopped session"
  p_typical: 0.09
  grounded: quote
  evidence: "spec.md: 'detecting churn in the tutorial and just after it'"
  proposed: "Store session_end_class on the session row; 'churn' questions default to counting only closed-game-* and crash classes, and report 'n sessions excluded: recording-stopped-protocol' in the answer"
  mechanism: "Changes ingestion and session-stitching: one classifier call over the last 60s of frames plus transcript of the final segment per session; closed enum field on the session row used as a filter by the planner"
  example: "'Tutorial churn rate' answers '41 of 500 sessions (8.2%) closed the game before completing the tutorial; 38 further sessions ended by recording-stopped-protocol while in the tutorial and are excluded'"
  cost: S
  depends_on: stitch-1
  part: ingestion-extraction
  ingest_cost: S
  query_cost: S
  better_than_fixed_table: "The fixed table cannot distinguish quitting from the camera stopping, so churn is overcounted"
  shallow: false

- id: stitch-10
  title: "Step funnel state machine per player with transitions table (session_id, step_from, step_to, session_offset_ms, video_id, transition_kind in {advance, back, skip, restart, quit})"
  level: L4
  cell: {part: store, representation: step-funnel-state-machine-per-player, granularity: tutorial-step, query-path: sql-over-closed-fields, question-type: compare-steps, latency-tier: under-2s}
  object: "memo.md item 1: 'step on screen' as an observation; spec.md: 'churn in the tutorial'"
  situation: "A player reaches step 4 in segment 2, restarts the tutorial in segment 3 (back to step 1), reaches step 6 in segment 5"
  consequence: "Per-video answers record 'step 4', 'step 1', 'step 6' with no transition semantics; the restart, which is the strongest friction signal, is invisible"
  p_typical: 0.25
  grounded: quote
  evidence: "memo.md: 'step on screen, action, utterance, friction signal'"
  proposed: "Derive transitions from the ordered observation log using session_offset_ms; funnel queries (drop-off per step, restarts per step, time per step) are plain SQL over the transitions table"
  mechanism: "Changes store: a transitions table derived at ingestion from step observations across all segments of a session; 1 row per step change, typically 8-20 rows per session"
  example: "'Which tutorial step loses the most players' = count of sessions whose last transition_kind=quit grouped by step_from: step 4 = 19, step 2 = 11, step 6 = 7; plus 'step 4 also has 31 restarts'"
  cost: S
  depends_on: stitch-2
  part: store
  ingest_cost: S
  query_cost: S
  better_than_fixed_table: "Fixed table stores step-per-video; the funnel needs step-per-transition across videos"
  shallow: false

- id: stitch-11
  title: "REFUSED: keep per-video independent extraction with no session key and no cross-video context (the current spec), extended only by adding more questions"
  level: L3
  cell: {part: ingestion-extraction, representation: fixed-mcq-answers, granularity: video, extraction-trigger: at-ingestion, mechanism-type: precompute-more}
  object: "spec.md section 3: 'The answers form a structured table per video'"
  situation: "The owner adds 200 more questions to the per-video table to capture 'most of what is in the video'"
  consequence: "Refused by this persona: every session-level question still has undefined semantics; a 2.5h session yields 10 rows per question with no reducer, so more questions multiply the ambiguity rather than resolve it; 27% of session time near cuts stays blind"
  p_typical: 0.2
  grounded: quote
  evidence: "spec.md: 'The question set is small, so most of what is in the video and transcript is never captured'"
  proposed: "Do not build; the minimum alternative is stitch-1 plus stitch-7"
  mechanism: "No change to the pipeline; question count grows from the current set to a larger set, still keyed by video_id"
  example: "'How many players churned in the tutorial' continues to return a count of videos in which tutorial_complete=false, which for 500 players of 10 videos each can read 4,100"
  cost: S
  depends_on: nothing
  part: ingestion-extraction
  ingest_cost: M
  query_cost: S
  better_than_fixed_table: "Nothing; it is the fixed table with more columns"
  shallow: false

- id: stitch-12
  title: "REFUSED: concatenate all n segments into one transcript plus frames and run a single long-context extraction per session"
  level: L3
  cell: {part: ingestion-extraction, representation: per-session-summary, granularity: session, extraction-trigger: at-ingestion, evidence-form: clip, cost-governance: true}
  object: "memo.md item 1: 'a session-level observation log' and A-frame assumption 'a modern long-context multimodal model is available at ingestion'"
  situation: "A 4-hour session is 16 segments; at 1 frame per 2s plus transcript that is about 7,200 frames and 40k transcript tokens in one call"
  consequence: "Refused: a single call loses video provenance for clip evidence unless the model is forced to emit segment ids; one truncation or refusal discards the whole session; cannot start extraction until the final segment uploads, which for live playtests means hours of idle time; retry cost is the whole session"
  p_typical: 0.08
  grounded: inferred
  evidence: "memo.md: 'timestamped atomic observations across all videos of a session'"
  proposed: "Do not build as the only path; use per-segment extraction with carry-forward (stitch-4) and a session roll-up over observation rows (stitch-27)"
  mechanism: "Ingestion would make one multimodal call per session of up to 16 x 15 minutes of content"
  example: "'Show me the clip where the player quit the tutorial' returns a session-level timestamp 2:47:13 that must be mapped back to segment 12 at 02:13; if the model emitted 2:47 as 2:17 the clip is from the wrong segment"
  cost: M
  depends_on: nothing
  part: ingestion-extraction
  ingest_cost: L
  query_cost: S
  better_than_fixed_table: "Sees the whole session at once, but at the price of clip provenance and all-or-nothing failure"
  shallow: false

- id: stitch-13
  title: "Stitch-quality evaluation set: 50 hand-labelled sessions with 200 events that straddle a cut; metric = recall of straddling events under per-video, boundary-window and carry-forward extraction"
  level: L4
  cell: {part: evaluation, evidence-form: recall-estimate, granularity: variable-length-moment-or-episode, moment-in-journey: first-cohort-ingested, user-segment: jev-internal-ops, effort: S-weeks}
  object: "memo.md item 3: 'accuracy against hand-labelled sessions'"
  situation: "Accuracy is measured on events inside a video; no test exists for events split by the 15-minute cap"
  consequence: "A pipeline can score 95% accuracy on the current benchmark while missing every quit that happens at a cut"
  p_typical: 0.05
  grounded: quote
  evidence: "memo.md: 'judged by two tests: coverage of real studio questions and accuracy against hand-labelled sessions'"
  proposed: "Label 4 straddling events per session for 50 sessions (quit, step change, utterance split, crash gap); report recall per event kind per extraction mode in the evaluation dashboard"
  mechanism: "Changes evaluation: a labelled set keyed by (session_id, session_offset_ms, event_kind) and a scorer that matches extracted observations within 5s; run on every extractor or model change"
  example: "Tutorial-churn quits at cuts: per-video recall 0.31, boundary-window 0.84, carry-forward 0.71; the owner picks boundary-window for quit detection on numbers, not opinion"
  cost: S
  depends_on: stitch-2
  part: evaluation
  ingest_cost: S
  query_cost: S
  better_than_fixed_table: "The fixed table has no evaluation of cross-video events at all"
  shallow: false

- id: stitch-14
  title: "Recorder-side session stamping: the capture client writes a sidecar JSON per segment with session_id, segment_index, monotonic_start_ms, build_version, and records 3s of overlap at each cut"
  level: L4
  cell: {part: collection-protocol, mechanism-type: change-data-at-source, modality: build-version-metadata, granularity: video, moment-in-journey: game-onboarding-day-0, build-or-buy: build-in-house}
  object: "spec.md section 1: 'each video is capped at 15 minutes, so one session is many videos'"
  situation: "The cap is applied by the recorder, which already knows the session and the segment number at the moment it rolls the file"
  consequence: "Without the sidecar, stitching has to be inferred after the fact from filenames and content (stitch-6), at 1-5% error; with it, ordering is exact and the 3s overlap gives the boundary window a guaranteed anchor"
  p_typical: 0.09
  grounded: inferred
  evidence: "spec.md Unspecified: 'how videos of one session are linked'"
  proposed: "Change the capture client to emit {session_id, segment_index, monotonic_start_ms, build_version, player_id_hash} per file and to start each new file 3000ms before closing the previous one"
  mechanism: "Changes collection-protocol: data arrives already stitched; ingestion reads the sidecar into session_videos and trims the 3s overlap after boundary extraction"
  example: "'Which build had the worst tutorial churn' uses build_version from the sidecar rather than OCR; ordering_confidence is 1.0 for every session recorded with the new client"
  cost: S
  depends_on: nothing
  part: collection-protocol
  ingest_cost: S
  query_cost: S
  better_than_fixed_table: "Makes the session key a fact rather than an inference, which no post-hoc stitching achieves"
  shallow: false

- id: stitch-15
  title: "Two durations per step and per session: wall_clock_ms (including gaps) and recorded_ms (excluding gaps over 2s); chatbot shows both whenever they differ by more than 10%"
  level: L4
  cell: {part: query-path, question-type: how-long, granularity: tutorial-step, evidence-form: count-with-denominator, uncertainty-policy: answer-with-ci-and-n, user-segment: ux-researcher}
  object: "memo.md item 2: 'closed-field questions become aggregate queries over all players (instant)'"
  situation: "A player spent 6 minutes on step 3 but left for 25 minutes between segment 2 and 3 (afk gap)"
  consequence: "Time-on-step reads 31 minutes if gaps are included, 6 minutes if excluded; the studio cannot tell which the chatbot used, and a 'players take 30 minutes on step 3' finding leads to a redesign of a step that is fine"
  p_typical: 0.06
  grounded: quote
  evidence: "memo.md item 2 (aggregate queries over closed fields)"
  proposed: "Step and session rows carry both columns; the answer template is 'median 6m10s of recorded play (9m40s wall clock, n=471; 29 sessions with gaps over 10 minutes listed)'"
  mechanism: "Changes query path and store: gap_before_ms from the manifest is subtracted when computing recorded_ms; the planner's duration template always names which clock it used"
  example: "'How long does the tutorial take' answers 'median 24 minutes recorded play, 31 minutes wall clock; 62 of 500 sessions contain an afk gap over 5 minutes inside the tutorial'"
  cost: S
  depends_on: stitch-5
  part: query-path
  ingest_cost: S
  query_cost: S
  better_than_fixed_table: "The fixed table has one duration per video with no gap concept, so every multi-segment duration is wrong one way or the other"
  shallow: false

- id: stitch-16
  title: "Player timeline across sessions: player_sessions(player_id_hash, session_id, session_number, hours_since_previous_session) enabling 'returned after day 1' questions"
  level: L4
  cell: {part: store, granularity: player, question-type: find-players-who, scope: all-players, modality: player-profile-metadata, subject-domain: progression-difficulty}
  object: "spec.md section 3: 'detecting churn in the tutorial and just after it'"
  situation: "A player finishes the tutorial in session 1 on Monday and never records a session 2; another plays 3 sessions over a week"
  consequence: "'Just after the tutorial' churn means not returning, which is a between-session fact; a session-only store can only see within-session quits"
  p_typical: 0.12
  grounded: quote
  evidence: "spec.md: 'churn in the tutorial and just after it'"
