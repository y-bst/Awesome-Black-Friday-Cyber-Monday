- id: cv-1
  title: "Keyframe table from 1 fps sampling plus perceptual-hash change gate (dHash distance > 10 keeps a frame), replacing per-video transcript as the unit of visual ingestion"
  level: L4
  cell: {part: frame-pipeline, modality: frame-embeddings, granularity: frame, extraction-trigger: at-ingestion, representation: timestamped-observation-log, effort: S-weeks, build-or-buy: open-source-component, mechanism-type: change-data-at-source}
  object: "spec.md step 1: 'each video is capped at 15 minutes'; step 2: 'what is on screen is largely lost'"
  situation: "A 15-minute video at 30 fps is 27,000 frames; the pipeline today keeps 0 of them"
  consequence: "Every downstream visual field (screen state, OCR, UI elements) has a stable, sparse row set to attach to: typically 150-400 keyframes per video instead of 27,000"
  p_typical: 0.35
  grounded: quote
  evidence: "spec.md: 'The transcript alone is not enough; what is on screen is largely lost.'"
  proposed: "Table keyframes(session_id, video_id, video_idx, t_ms, phash64, keep_reason in {interval, change, scene_cut}, jpeg_uri)"
  shallow: false
  part: ingestion
  mechanism: "ffmpeg decodes at 1 fps; dHash computed per frame; frame kept if Hamming distance to last kept frame > 10 or 10 s elapsed; row written to keyframes table with absolute session time t_ms = video_idx*900000 + offset"
  example: "Studio asks 'how long did players sit on the step-2 crafting screen'; dwell is computed from consecutive keyframe t_ms where screen_state=step-2, no transcript needed; 500 players answered from a 200k-row table"
  cost: S
  ingest_cost: S
  query_cost: S
  better_than_fixed_table: "Visual facts exist at all; the fixed table has zero visual columns"
  depends_on: nothing

- id: cv-2
