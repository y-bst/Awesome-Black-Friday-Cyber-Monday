  p_typical: 0.3
  grounded: quote
  evidence: "memo.md: 'timestamped atomic observations across all videos of a session (step on screen, action, utterance...)'"
  proposed: "k-means (k=40) over SigLIP embeddings of 6,000 keyframes; one human labels 40 cluster medoids in 30 min; a linear head is trained; classifier writes screen_state + confidence per keyframe"
  shallow: false
  part: ingestion
  mechanism: "Per keyframe: embedding -> linear classifier -> (screen_state enum, confidence float); written into keyframes table; taxonomy stored per game with version number"
  example: "'Which tutorial step do players quit on?' becomes SELECT last screen_state WHERE screen_state LIKE 'tutorial-step-%' GROUP BY player; 500 players in under 1 s"
  cost: S
  ingest_cost: S
  query_cost: S
  better_than_fixed_table: "Step identity comes from pixels, not from the model guessing from speech; step list is not hand-written per game"
  depends_on: cv-1

