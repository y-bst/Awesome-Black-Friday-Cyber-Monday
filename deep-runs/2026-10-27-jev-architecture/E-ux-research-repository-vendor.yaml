- id: uxrepo-1
  title: "Highlight as the atomic stored unit: highlight(session_id, t_start_ms, t_end_ms, tags[], transcript_span, screen_text, source=auto|human, confidence) replaces the per-video answer row"
  level: L4
  cell: {part: store, representation: timestamped-observation-log, granularity: variable-length-moment-or-episode, evidence-form: clip, extraction-trigger: at-ingestion, reuse-scope-of-extraction: universal-primitives}
  object: "spec.md item 3: 'The answers form a structured table per video'"
  situation: "A studio asks 'why do players quit at tutorial step 3' and the answer table holds only the option letter chosen for 'reason_for_quit' per video, with no pointer back into the footage"
  consequence: "The designer cannot watch the moment; every number in the table is unverifiable and, in research repositories, unverifiable numbers were the first feature researchers stopped opening"
  p_typical: 0.25
  grounded: quote
  evidence: "spec.md: 'Reading 500 transcripts per question was too slow'; memo.md item 1: 'quote with timestamp as evidence'"
  proposed: "highlights(highlight_id, session_id, player_id, game_id, build_id, t_start_ms, t_end_ms, step_id, tags[], transcript_span, screen_text, source, confidence, extractor_run_id); every answer cites highlight_ids"
  shallow: false
  mechanism: "Ingestion emits 8-40 s highlights wherever a tag fires (confusion, retry, menu hunt, quit intent); the answers table becomes a view counting highlights by tag and step; the chatbot answers with counts plus the highlight ids behind them"
  example: "Ember Tactics, 500 players: 'quit at step 3' returns 91 players; each has a highlight 00:41:12-00:41:38 tagged [quit_intent, unit_select_confusion]; the designer clicks three and watches them in 90 s"
  cost: M
  depends_on: "a session-level millisecond clock across the 15-minute videos"
  part: store
  ingest_cost: M
  query_cost: S
  better_than_fixed_table: "Every count has a clickable moment under it; the table today has option letters with nothing to watch"

- id: uxrepo-2
  title: "Clip-first answer contract in the chatbot: any numeric answer renders with up to 6 evidence clips (8-15 s each) inline; a number with zero clips is shown greyed with the label 'unverified'"
  level: L4
  cell: {part: chatbot-ui, evidence-form: clip-montage-n-examples, delivery-surface: chatbot, question-type: why, uncertainty-policy: answer-with-ci-and-n, user-segment: game-designer}
  object: "spec.md item 4: 'A chatbot for the gaming studio answers the studio's questions from that table'"
  situation: "The chatbot answers '34% of players were confused at step 3' from a precomputed aggregate; the designer asks the producer where that number came from"
  consequence: "One wrong or unexplained percentage ends the studio's trust in the whole chatbot; a number with 6 clips beside it survives being wrong because the viewer sees the borderline cases"
  p_typical: 0.30
  grounded: quote
  evidence: "memo.md item 3: 'each with an answer type and an evidence requirement'"
  proposed: "Answer card = {claim, n, denominator, clips[<=6] sorted by confidence desc, 'see all 170' link}; renderer refuses to print a count whose highlight list is empty"
  shallow: false
  mechanism: "Query planner returns (count, denominator, highlight_ids[]); UI samples 6 highlights stratified by confidence (2 high, 2 mid, 2 low) so the viewer calibrates the tag; grey style and 'unverified' when highlight_ids is empty"
  example: "'How many players mis-selected a unit in step 3?' -> '170 of 500 (34%)' with 6 clips; the two low-confidence clips show a player merely hovering, so the designer reads the true rate as nearer 28%"
  cost: S
  depends_on: "uxrepo-1 highlight store"
  part: ui
  ingest_cost: S
  query_cost: S
  better_than_fixed_table: "The number carries its own audit sample; the fixed table shows an option count with no footage"

- id: uxrepo-3
  title: "Universal 36-tag research taxonomy applied per utterance and per screen change at ingestion (confusion, misread-ui, wayfinding, retry, delight, frustration, quit-intent, reads-tooltip, ignores-tooltip, ...), with studio-defined tags layered on top"
  level: L4
  cell: {part: ingestion-extraction, representation: customer-defined-trackers-over-universal-primitives, reuse-scope-of-extraction: customer-defined-on-top-of-universal, question-origin: established-gur-frameworks-heuristics-pxi-mda, granularity: utterance, extraction-trigger: at-ingestion}
  object: "spec.md item 3: 'a fixed set of questions with options, written per game target'"
  situation: "A new studio onboards a city-builder; nobody has written questions for it yet and the first cohort of 120 sessions arrives tomorrow"
  consequence: "With per-game questions the first cohort is captured by nothing; with a universal taxonomy 36 tags fire on day 0 and the studio's own tags (e.g. 'zoning_confusion') are added as rows, not as a schema change"
  p_typical: 0.20
  grounded: quote
  evidence: "spec.md: 'per-game hand-written questions do not scale' (A-frame assumption); memo.md item 3 ontology 'pruned by the game target'"
  proposed: "tags(tag_id, name, definition, positive_example_clip_ids[3], negative_example_clip_ids[3], scope=universal|studio|game, version); extractor prompt lists all tags in scope with their 3+3 example clips"
  shallow: false
  mechanism: "One multimodal pass per video emits highlights tagged from the universal list plus any studio/game tags in scope; tag definitions are few-shot from clips, not prose, which is how repository auto-taggers reached acceptable precision"
  example: "Day 0 on Ember Tactics: 'which tutorial step has the most confusion tags per player' is answerable from the universal 'confusion' tag before the studio has written a single question; the answer is step 3 at 0.9 tags/player vs 0.2 elsewhere"
  cost: M
  depends_on: "nothing"
  part: ingestion
  ingest_cost: M
  query_cost: S
  better_than_fixed_table: "Covers the first cohort of every new game with the same 36 fields, so cross-game comparison and day-0 answers both work"

- id: uxrepo-4
  title: "Per-tag accept/reject loop: each auto-tag shown in the UI has accept and reject buttons; a tag whose rolling 30-day reject rate exceeds 30% is demoted to 'suggested' and excluded from counts"
  level: L4
  cell: {part: feedback-loop-from-query-log, mechanism-type: human-in-the-loop, evidence-form: confidence-score, user-segment: ux-researcher, moment-in-journey: steady-state-weekly, uncertainty-policy: abstain-below-coverage}
  object: "memo.md item 3: 'judged by two tests: coverage of real studio questions and accuracy against hand-labelled sessions'"
  situation: "The 'delight' tag fires on sarcastic 'oh great' utterances; the studio's researcher rejects 14 of the first 30 she sees"
  consequence: "Without the loop the chatbot keeps reporting 'delight at step 4: 22%' and the researcher stops reading it; with the loop the tag drops out of counts after 30 verdicts and the extractor gets 14 negative examples"
  p_typical: 0.08
  grounded: inferred
  evidence: "memo.md evaluates against hand-labelled sessions once; no per-tag runtime feedback is specified"
  proposed: "tag_verdicts(highlight_id, tag_id, user_id, verdict, ts); nightly job computes reject_rate per (tag_id, game_id); reject_rate>0.30 over n>=30 sets tag status='suggested'"
  shallow: false
  mechanism: "Every rendered clip exposes accept/reject per tag; verdicts feed (a) the tag status per game and (b) the few-shot negative examples in the next extractor version"
  example: "Ember Tactics week 3: 'delight' demoted after 14/30 rejects; the chatbot now says 'delight is a suggested tag for this game (47% rejected), counts suppressed'; re-extraction with the 14 negatives brings reject rate to 9% in week 5"
  cost: S
  depends_on: "uxrepo-1 highlights; uxrepo-3 tag table"
  part: evaluation
  ingest_cost: S
  query_cost: S
  better_than_fixed_table: "A wrong question in the fixed table stays wrong forever; here a tag that researchers reject disables itself in one month"

- id: uxrepo-5
  title: "Weekly theme clustering over highlight embeddings: cluster all highlights of a game, name each cluster with 3 representative clips and a 12-word label, and surface clusters with n_players >= 15 as 'candidate themes'"
  level: L4
  cell: {part: question-generation, question-origin: emergent-topic-clustering-of-player-speech, mechanism-type: auto-discover-without-question, representation: clip-or-frame-embeddings, question-type: what-surprised-unknown-unknowns, extraction-trigger: scheduled-batch}
  object: "spec.md constraint: 'Their questions are not known in advance'"
  situation: "Nobody at the studio asked about the mini-map, but 60 of 500 players said a variant of 'where am I' during tutorial step 2 while panning the camera"
  consequence: "The fixed table never captures it; a cluster of 60 highlights labelled 'camera disorientation in step 2' appears in the weekly theme list with 3 clips, before anyone types a question"
  p_typical: 0.15
  grounded: quote
  evidence: "spec.md: 'most of what is in the video and transcript is never captured'"
  proposed: "Embed (transcript_span + screen_text + tags) per highlight; HDBSCAN weekly per game; themes(theme_id, label, n_highlights, n_players, representative_highlight_ids[3], first_seen_week, status=candidate|accepted|dismissed)"
  shallow: false
  mechanism: "Scheduled batch, no question needed; a theme becomes a durable tag only when a studio user clicks accept, which also writes a new tag definition from the cluster's 3 clips"
  example: "Week 2 digest for Ember Tactics lists 'camera disorientation, step 2, 60 players, 3 clips'; the designer accepts it; from week 3 it is a counted tag and 'did the mini-map fix work' is answerable pre/post"
  cost: M
  depends_on: "uxrepo-1 highlights with embeddings"
  part: question-generation
  ingest_cost: M
  query_cost: S
  better_than_fixed_table: "Finds the questions the studio did not know to ask; the fixed table only measures what was pre-written"

- id: uxrepo-6
  title: "Insight object saved from every chatbot answer the studio marks useful: insight(title, claim, n_players, denominator, supporting_highlight_ids[], build_id, author, created_at, status) searchable months later"
  level: L4
  cell: {part: store, representation: question-answer-bank-precomputed, query-path: cached-prior-answer, mechanism-type: reuse-or-cache-prior-work, moment-in-journey: steady-state-weekly, delivery-surface: chatbot}
  object: "memo.md item 2: 'result is cached as a new field, so the question set grows from real use'"
  situation: "In March the lead designer learned that 91 of 500 players quit at step 3 because of unit selection; in September a new designer asks the same thing and the chatbot recomputes from scratch and gets 88 because the extractor changed"
  consequence: "Two numbers for one fact; in research repositories the saved insight with its clips is the unit people actually re-find, and the team's memory lives there rather than in recomputed answers"
  p_typical: 0.12
  grounded: quote
  evidence: "spec.md unspecified: 'who at the studio asks and what they ask'"
  proposed: "Chatbot answer has 'save as insight'; insights are full-text searchable and listed before any recomputation when a new question's embedding is within cosine 0.92 of a saved insight's question"
  shallow: false
  mechanism: "A saved answer becomes an immutable object with its evidence highlight ids, the build version and the extractor run id; the planner checks insights first and offers 'here is what was found in March (build 1.2); recompute for build 1.4?'"
  example: "September question 'why do players quit step 3' returns the March insight (91/500, 6 clips, build 1.2) in 200 ms and a button to re-run against build 1.4 sessions"
  cost: S
  depends_on: "uxrepo-1 highlights"
  part: store
  ingest_cost: S
  query_cost: S
  better_than_fixed_table: "The table stores extracted facts; this stores the studio's conclusions with their evidence, which is what gets re-read six months on"

- id: uxrepo-7
  title: "Insight staleness flag: every insight is pinned to a build_id; when sessions from a newer build are ingested, the insight is re-evaluated and labelled 'pre-fix (build 1.2)', 'persists in 1.4' or 'resolved in 1.4' with both counts"
  level: L4
  cell: {part: schema-evolution, question-type: did-the-fix-work-pre-post, moment-in-journey: new-build-version, extraction-trigger: on-game-update, scope: build-version-pair, evidence-form: contrast-vs-baseline}
  object: "memo.md item 2: 'a one-time batch extraction over all sessions whose result is cached as a new field'"
  situation: "The studio ships build 1.4 with a reworked unit-select tooltip; 80 new sessions arrive; the March insight still says 'step 3 unit selection confuses 18%'"
  consequence: "Stale insights are the second reason researchers abandon repositories; the auto re-evaluation turns each insight into a pre/post test without anyone asking"
  p_typical: 0.06
  grounded: inferred
  evidence: "spec.md: targets are 'mostly detecting churn in the tutorial'; build versions are not mentioned in spec.md or memo.md"
  proposed: "insight_evaluations(insight_id, build_id, n, denominator, computed_at); UI badge compares latest build to insight.build_id with a two-proportion z-test at n>=50 per side"
  shallow: false
  mechanism: "Build metadata on every session; on ingest of a new build, a job re-runs each accepted insight's saved query over the new build's sessions and writes a comparison row"
  example: "March: 91/500 (18%) at build 1.2; after 80 sessions of 1.4: 6/80 (7.5%), badge 'resolved in 1.4, p=0.02, n=80'; the producer sees it in the Monday digest"
  cost: S
  depends_on: "uxrepo-6 insights; build-version-metadata on sessions"
  part: evaluation
  ingest_cost: S
  query_cost: S
  better_than_fixed_table: "The fixed table has no notion of a fact going stale; this makes 'did the fix work' automatic"

- id: uxrepo-8
  title: "Highlight reel renderer: for any tag x step filter, cut up to 12 clips of 8-15 s with a caption bar (player id, step name, t_session, tags) into one MP4 in under 3 minutes"
  level: L4
  cell: {part: export-integration, delivery-surface: clip-reel, evidence-form: clip-montage-n-examples, latency-tier: minutes, question-type: what-happened, user-segment: producer-exec}
  object: "spec.md item 1: 'A player's gameplay session is captured as video'"
  situation: "The producer needs to show the studio head why step 3 is being reworked and has a 10-minute slot on Thursday"
  consequence: "A 2-minute reel of 12 players failing unit selection ends the argument; a table row does not, which is why reels were the single most used export in research repositories"
  p_typical: 0.20
  grounded: quote
  evidence: "spec.md: 'each video is capped at 15 minutes, so one session is many videos' (clips must map session time back to video file and offset)"
  proposed: "POST /reels {game_id, filter:{tag, step_id, build_id}, max_clips:12, pad_ms:2000} -> job id; ffmpeg concat with drawtext caption; stored 90 days"
  shallow: false
  mechanism: "Reel job selects highlights by filter, maps t_session to (video_id, t_video) via the session_videos offset table, cuts and concatenates; stratified sampling across players so no player appears twice"
  example: "'Reel of step 3 quit moments, build 1.2' -> 12 clips, 12 distinct players, 2m 10s, ready in 140 s; opened 23 times by 7 studio staff in the first week"
  cost: M
  depends_on: "uxrepo-1 highlights; raw video retained (A-frame assumption)"
  part: ui
  ingest_cost: S
  query_cost: M
  better_than_fixed_table: "Produces the artifact studios actually forward; the table produces a number nobody forwards"

- id: uxrepo-9
