- id: uxrepo-15
  title: "Full-text search over transcripts and OCR with 'make highlight from result' as a first-class query path, because researchers used keyword search daily and ignored semantic 'ask the repository' until it cited clips"
  level: L4
  cell: {part: query-path, query-path: full-text-keyword-search, representation: inverted-full-text-index, question-type: what-said, build-or-buy: open-source-component, user-segment: ux-researcher}
  object: "memo.md item 2: 'open-field questions retrieve matching observation rows across players'"
  situation: "The designer wants every player who said 'flank' during the tutorial, because the flanking mechanic is unexplained"
  consequence: "A semantic retriever returns 'attack from the side' paraphrases with unknown recall; an inverted index returns exactly the 37 utterances containing 'flank' in 80 ms, and each can be turned into a highlight with one click"
  p_typical: 0.08
  grounded: quote
  evidence: "spec.md: 'Reading 500 transcripts per question was too slow'"
  proposed: "OpenSearch/Tantivy index over (transcript rows, ocr_spans) with fields session_id, player_id, step_id, t_session_ms; result row has 'create highlight' which writes a human-source highlight with the query as a tag"
  shallow: false
  mechanism: "Exact and phrase search with step and build filters; results feed the same highlight store, so a keyword search becomes a countable tag after one click"
  example: "'flank' AND step:3 -> 37 hits, 29 players; the designer saves it as tag 'mentions_flank'; 'how many players mention flanking per step' is a count from then on"
  cost: S
  depends_on: "transcript and OCR rows on the session clock"
