- id: uxrepo-10
  title: "Synchronised evidence player: click any quote or count and the video opens at t minus 5 s with a scrolling transcript, an OCR band of on-screen text and the fired tags on a timeline strip under the scrubber"
  level: L4
  cell: {part: chatbot-ui, query-path: clip-lookup, modality: on-screen-text-ocr, evidence-form: quote-with-timestamp, latency-tier: under-2s, user-segment: ux-researcher}
  object: "spec.md item 2: 'what is on screen is largely lost'"
  situation: "The researcher reads 'player said: I can't find the attack button' and wants to see whether the button was on screen"
  consequence: "The transcript-only view cannot answer it; the OCR band shows 'ATTACK' was rendered at the bottom right for the full 12 s of the utterance, turning a 'missing button' story into a 'button not noticed' story"
  p_typical: 0.15
  grounded: quote
  evidence: "spec.md known problem: 'Transcript loses visual information'"
  proposed: "Player component takes highlight_id; fetches video_id+offset, transcript rows within t-30s..t+30s, ocr_spans within the same window, tag timeline for the whole session"
  shallow: false
  mechanism: "All three tracks are keyed on the session clock; the player is a single HTML5 element with three synchronised side tracks; prefetch of the adjacent 15-minute video avoids the boundary stall"
  example: "Step 3 quote at 00:41:12 opens video 3 at 11:07; OCR band reads 'SELECT A UNIT TO MOVE' while the player says 'what do I do'; the researcher tags it 'ignores_tooltip'"
  cost: M
  depends_on: "OCR track at ingestion; session_videos offset table"
  part: ui
  ingest_cost: M
  query_cost: S
  better_than_fixed_table: "Shows what was on screen next to what was said; the table has neither"

- id: uxrepo-11
  title: "Silence as a friction observation: any think-aloud gap over 20 s while the screen state is unchanged becomes a highlight tagged 'stall', with the on-screen step and the last utterance before the gap"
  level: L4
  cell: {part: ingestion-extraction, modality: silence-or-absence-of-speech, representation: time-series-signals-affect-pace-silence, question-type: how-long, granularity: variable-length-moment-or-episode, subject-domain: onboarding-tutorial}
  object: "memo.md item 1: 'friction signal'"
  situation: "A player goes quiet for 48 s on the step 3 unit-select screen, then quits; the transcript has nothing to extract from"
  consequence: "Transcript-driven extraction records nothing for the most informative 48 s of the session; moderated-usability practice treats this silence as the strongest confusion signal there is"
  p_typical: 0.07
  grounded: inferred
  evidence: "spec.md: 'The transcript alone is not enough'"
  proposed: "stall highlight: {t_start, t_end, duration_ms, screen_state_before, screen_state_after, last_utterance, next_utterance}; fired when speech gap >= 20000 ms AND screen-state classifier label unchanged"
  shallow: false
  mechanism: "Speech activity detector plus screen-state classifier run per video; the combination (no speech, no screen change) is a closed field, so 'median stall per step' is one SQL aggregate"
  example: "'Where do players stall longest in the tutorial?' -> step 3: median 31 s, 212 of 500 players stalled >= 20 s; step 1: median 4 s; 6 clips of the longest stalls attached"
  cost: S
  depends_on: "screen-state classifier at ingestion"
  part: ingestion
  ingest_cost: S
  query_cost: S
  better_than_fixed_table: "Captures the players who said nothing, whom a transcript question cannot see"

- id: uxrepo-12
  title: "Unmoderated task segmentation: the screen-state classifier cuts each session into tutorial-step tasks with t_enter, t_exit, outcome in {completed, abandoned, skipped, timed_out} per player, like task timings in remote usability tools"
  level: L4
  cell: {part: session-stitching, representation: step-funnel-state-machine-per-player, granularity: tutorial-step, modality: screen-state-classifier, question-type: compare-steps, query-path: precomputed-aggregate}
  object: "spec.md item 1: 'A session can be n hours; each video is capped at 15 minutes'"
  situation: "Step 3 begins in video 4 and ends in video 5; the per-video table has one row per video with 'was step 3 completed' answered 'unclear' in both"
  consequence: "Step completion and time-on-task, the two numbers every usability report starts with, are wrong whenever a step spans a video boundary, which for a 15-minute cap is roughly one step in four"
  p_typical: 0.15
  grounded: quote
  evidence: "spec.md known problem: 'Long multi-video sessions'"
  proposed: "step_runs(player_id, session_id, step_id, t_enter_ms, t_exit_ms, outcome, attempts); built by a state machine over screen-state labels with a 3-frame hysteresis to suppress flicker"
  shallow: false
  mechanism: "Ingestion classifies screen state per 1 s; a per-player state machine on the session clock emits one row per step attempt; the funnel view is a GROUP BY step_id"
  example: "Ember Tactics tutorial funnel: step 1 100%, step 2 96%, step 3 64%, step 4 61%; step 3 median time 9m 40s vs 2m elsewhere; 'abandoned' outcome lists 91 players with clips"
  cost: M
  depends_on: "screen-state classifier trained on this game's step screens (uxrepo-3 day-0 bootstrap or 20 labelled sessions)"
  part: ingestion
  ingest_cost: M
  query_cost: S
  better_than_fixed_table: "Correct per-step completion and duration across video boundaries, computed once"

