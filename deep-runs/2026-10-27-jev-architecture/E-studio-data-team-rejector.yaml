- id: datateam-32
  title: "Long-format SIGNALS table at 10 s buckets (session_id, bucket_start_ms, affect_score, speech_rate_wpm, silence_share, input_rate_per_s, screen_change_count) so the studio's BI draws pace and affect curves and its own anomaly detection runs on them"
  level: L4
  cell: {part: store, representation: time-series-signals-affect-pace-silence, modality: silence-or-absence-of-speech, granularity: variable-length-moment-or-episode, delivery-surface: warehouse-share-or-export, user-segment: studio-data-engineer, effort: S-weeks, question-type: how-felt}
  object: "memo.md item 1: 'friction signal, sentiment'"
  situation: "A third of players are silent for most of the tutorial; utterance-based fields are NULL for them and the data team wants a signal that exists for every player"
  consequence: "A 3-hour session is 1,080 rows; 500 players is 540,000 rows; silent players still have input_rate and screen_change_count; the studio's own change-point detector flags 71 of 118 churners with an input_rate drop to under 0.2 per s in the 60 s before quitting"
  p_typical: 0.06
  grounded: quote
  evidence: "memo.md: 'friction signal, sentiment, quote with timestamp'"
  proposed: "SIGNALS built at ingestion from transcript timing, input events and frame diffs; bucket size 10 s; NULL only when the modality is absent"
  shallow: false
  part: store
  mechanism: "Universal numeric primitives per time bucket, independent of any question"
  example: "'What does the last minute before tutorial churn look like?' -> average of 6 buckets before session_end for churners: silence_share 0.91, input_rate 0.15 per s, 2 screen changes; completers at the same step: 0.62, 0.9, 5"
  cost: S
  ingest_cost: M
  query_cost: S
  better_than_fixed_table: "Silent players get a representation; a question-only table has nothing for them"
  depends_on: datateam-5

- id: datateam-33
  title: "REFUSED: JEV-originated alerts to the studio's Slack about tutorial anomalies; the data team routes all alerting through its own warehouse monitors (dbt tests, Monte Carlo) over the exported tables, and only accepts JEV alerts about data delivery (datateam-20)"
  level: L3
  cell: {part: feedback-loop-from-query-log, delivery-surface: alert, query-path: push-alert-no-query, mechanism-type: push-instead-of-pull, user-segment: studio-data-engineer, latency-tier: push-no-query, effort: XS-days}
  object: "spec.md Constraints: 'Their questions are not known in advance'"
  situation: "JEV proposes 'push an alert when step-3 quit rate rises above 15% in a new build' so the studio never has to ask"
  consequence: "Low willingness: a second alerting system with its own thresholds and on-call is rejected; the studio writes the same rule as a dbt test over STEP_FUNNEL (step=3 exit share > 0.15, min 100 players) and gets the Slack message from its own monitor; JEV's value is that the row exists by 06:00, not the alert"
  p_typical: 0.06
  grounded: inferred
  evidence: "spec.md: 'A chatbot for the gaming studio' is the only surface named; alerts are a new surface the studio already has"
  proposed: "JEV ships example monitor definitions (5 dbt tests on STEP_FUNNEL and SIGNALS) in the jev_core package rather than running alerts"
  shallow: false
  part: ui
  mechanism: "Push behaviour is delegated to the studio's monitoring over JEV's tables"
  example: "'Tell me when tutorial churn jumps' -> dbt test fails on build 1.4.3 (step-3 exit share 0.19, n=212) and posts to the studio's #live-ops channel through its existing hook"
  cost: S
  ingest_cost: S
