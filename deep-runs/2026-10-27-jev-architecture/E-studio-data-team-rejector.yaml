- id: datateam-3
  title: "A published schema contract: semver on schema_version, columns are only ever added (nullable, with first_populated_at), never renamed, retyped or removed, and a dbt sources.yml with column descriptions is generated from the same registry on every release"
  level: L4
  cell: {part: schema-evolution, schema-evolution: append-only-versioned-fields, user-segment: studio-data-engineer, delivery-surface: warehouse-share-or-export, mechanism-type: change-data-at-source, effort: S-weeks, moment-in-journey: steady-state-weekly}
  object: "memo.md item 2: 'genuinely new questions trigger a one-time batch extraction over all sessions whose result is cached as a new field, so the question set grows from real use'"
  situation: "JEV adds a field every week from the backfill loop; the studio's dbt models select specific columns and tests on accepted_values; an untyped rename breaks a nightly run at 03:00"
  consequence: "New field 'popup_dismiss_count' arrives as a new nullable column with first_populated_at=2026-11-03; schema_version goes 2.3.0 -> 2.4.0; dbt tests pass; a column removal would require a 3.0.0 bump, which is forbidden by the contract for 180 days after announcement"
  p_typical: 0.12
  grounded: quote
  evidence: "memo.md: 'cached as a new field' with no statement of how downstream consumers learn of it"
  proposed: "Registry table SCHEMA_FIELDS (field_name, type, enum_ref, added_in, deprecated_in, first_populated_at, description, extractor_prompt_hash); CI generates sources.yml and a CHANGELOG.md; a breaking change fails CI unless major bump + 180-day notice"
  shallow: false
  part: store
  mechanism: "Every new extraction field is registered before it is written; the contract is enforced in JEV's CI, not documented in prose; the studio's dbt project can vendor the generated sources.yml"
  example: "'Did players who quit the tutorial see the controls popup twice?' -> the new popup_dismiss_count column exists for sessions ingested after 2026-11-03 and is NULL before; the studio's query filters on first_populated_at and reports 44 of 97 churners vs 31 of 310 completers for the covered window"
  cost: S
  ingest_cost: S
  query_cost: S
  better_than_fixed_table: "Fields can grow weekly without breaking a single downstream model; the fixed table had no versioning at all"
  depends_on: datateam-1

