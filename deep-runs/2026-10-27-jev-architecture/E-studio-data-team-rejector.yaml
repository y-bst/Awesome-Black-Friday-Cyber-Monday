  p_typical: 0.1
  grounded: quote
  evidence: "spec.md Known problems: 'Long multi-video sessions'"
  proposed: "Drop the per-video answers table from the export; publish SESSIONS and VIDEOS; all OBSERVATIONS carry session_t_ms relative to session start"
  shallow: false
  part: store
  mechanism: "Stitching is done once by JEV and exposed as a manifest the studio can audit"
  example: "'How long until tutorial churners quit?' -> SESSIONS.total_duration_ms for 118 churners: median 23 min across 2 videos; the 3 sessions with a missing video are excluded with a coverage note (115 of 118)"
  cost: S
  ingest_cost: S
  query_cost: S
  better_than_fixed_table: "The unit is the player's session, not the 15-minute file, so counts are counts of players"
  depends_on: nothing

- id: datateam-30
  title: "In-VPC extraction container: JEV licenses the extraction prompts, schema registry and frame pipeline as a container the studio runs in its own cloud with its own model keys; JEV never receives video, and bills per licensed schema_version"
  level: L4
  cell: {part: ingestion-extraction, tenancy-and-deployment: studio-vpc-or-on-prem, build-or-buy: studio-owned-stack, user-segment: studio-data-engineer, effort: L-multi-quarter, reuse-scope-of-extraction: universal-primitives, mechanism-type: transfer-across-games, modality: frame-embeddings}
  object: "spec.md step 2: 'Each video is converted to a transcript'; memo.md item 1: 'Video frames add screen state and on-screen text'"
  situation: "Pre-release footage cannot leave the studio's cloud under its NDA policy; the studio has the engineers to run a container but not the 18 months to design the extraction"
  consequence: "docker pull jev/extractor:2.6.0 runs in the studio's VPC against its bucket; writes OBSERVATIONS into the studio's warehouse; JEV's revenue is a per-version licence; JEV's moat is reduced to prompts, schema and frame models, which the studio could copy, so the licence includes quarterly schema and model updates"
  p_typical: 0.07
  grounded: quote
  evidence: "memo.md: 'Video frames add screen state and on-screen text, because speech alone cannot answer where did they click'"
  proposed: "Container with pluggable model endpoint, pinned prompts, ENUM_REGISTRY, frame sampler at 1 fps, and a conformance test set the studio runs on install"
  shallow: false
  part: ingestion
  mechanism: "The extraction pipeline is distributed software, not a hosted service"
  example: "'Where did tutorial churners click before quitting?' -> the container's screen_state and ui_element fields exist in the studio's warehouse although JEV never saw a frame: 34 of 61 step-3 quitters opened the settings menu in the last 60 s"
  cost: L
  ingest_cost: L
  query_cost: S
  better_than_fixed_table: "Frame-derived fields for a studio that would otherwise send JEV nothing"
  depends_on: datateam-11

- id: datateam-31
  title: "Day-0 vocabulary map: the studio uploads its telemetry step and screen names, and JEV's extraction enums for step and screen_state are mapped onto them (VOCAB_MAP: jev_concept, studio_value, build_version) so exported rows use the studio's names and join without renaming"
  level: L4
  cell: {part: ingestion-extraction, representation: common-data-model-with-per-game-vocab-map, moment-in-journey: game-onboarding-day-0, question-origin: onboarding-interview-with-studio, user-segment: studio-data-engineer, effort: XS-days, reuse-scope-of-extraction: universal-primitives, extraction-trigger: on-new-game-onboarding}
  object: "memo.md item 3: 'pruned by the game target'"
  situation: "JEV calls the step 'tutorial_jump_intro' and telemetry calls it 'T01_JUMP'; every dbt model needs a CASE statement and the first join finds 0 matches"
  consequence: "Onboarding form takes the studio's 12 step names and 30 screen names; VOCAB_MAP is filled by name similarity plus 20 reviewed sessions; OBSERVATIONS.step emits studio_value; a new build with 2 renamed steps adds 2 rows to VOCAB_MAP without touching the extractor"
  p_typical: 0.08
  grounded: inferred
  evidence: "spec.md: 'written per game target' implies per-game names already exist in the prompts"
  proposed: "VOCAB_MAP table owned jointly; extraction prompt is parameterised with studio_value labels; unmapped values go to attrs.unmapped_step for review"
