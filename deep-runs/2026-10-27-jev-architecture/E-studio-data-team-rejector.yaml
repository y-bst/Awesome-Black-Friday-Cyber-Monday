- id: datateam-1
  title: "Deliver the observation log as a Snowflake secure share / BigQuery Analytics Hub listing: one table OBSERVATIONS keyed by studio_player_key, session_id, session_t_ms, refreshed within 1 h of ingestion, instead of a chatbot"
  level: L4
  cell: {part: export-integration, delivery-surface: warehouse-share-or-export, tenancy-and-deployment: export-only-no-hosting, representation: timestamped-observation-log, user-segment: studio-data-engineer, granularity: utterance, build-or-buy: managed-cloud-service, effort: S-weeks}
  object: "spec.md step 4: 'A chatbot for the gaming studio answers the studio's questions from that table'; memo.md item 1: 'session-level observation log'"
  situation: "The studio already runs Snowflake with 40 dbt models over its telemetry and a Looker instance; the head of data will not add a second query surface"
  consequence: "The studio joins OBSERVATIONS to its own PLAYER_RETENTION table in one SQL; JEV's extraction is used daily, the chatbot is never opened; JEV keeps the ingestion revenue and loses the UI argument"
  p_typical: 0.25
  grounded: quote
  evidence: "spec.md: 'Buyers are gaming studios. Their questions are not known in advance.' The warehouse already holds the questions they do know."
  proposed: "Share contains OBSERVATIONS (studio_player_key, session_id, video_idx, session_t_ms, wall_clock_utc, obs_type, step, screen_state, ui_element, action, utterance_text, ocr_text, sentiment, friction, confidence, extractor_version, schema_version, attrs VARIANT) plus SESSIONS and VIDEOS; grant per studio account; refresh every 60 min"
  shallow: false
  part: ui
  mechanism: "JEV's store becomes a producer table; the share is a zero-copy grant on a per-studio database; the studio reads with its own compute and its own roles"
  example: "'Which tutorial step do churners quit on?' -> studio SQL joins OBSERVATIONS obs_type='session_end' to its own D1_RETAINED flag: step 3 holds 61 of 118 non-retained players vs 22 of 382 retained; 1.2 s in Snowflake, no JEV call"
  cost: S
  ingest_cost: S
  query_cost: S
  better_than_fixed_table: "Every observation, not only the 30 answered questions, is joinable to telemetry and retention that JEV never sees"
  depends_on: nothing

