- id: datateam-5
  title: "Every observation row carries wall_clock_utc plus a per-video clock_offset_ms estimated from on-screen timestamps or the first telemetry-matched event, so video observations join telemetry events within a 2 s window"
  level: L4
  cell: {part: session-stitching, modality: on-screen-text-ocr, granularity: video, question-type: timeline, user-segment: studio-data-engineer, mechanism-type: change-data-at-source, effort: S-weeks, evidence-form: quote-with-timestamp}
  object: "spec.md step 1: 'each video is capped at 15 minutes, so one session is many videos'"
  situation: "Studio wants to know what the player said in the 10 s before the telemetry event tutorial_step_3_fail, but video timestamps are relative to each 15-minute file and telemetry is UTC"
  consequence: "Each VIDEOS row stores recording_start_utc (from the capture client) and clock_offset_ms (median difference between OCR'd in-game clock or a known HUD event and telemetry); observations get wall_clock_utc = recording_start_utc + video_t_ms + clock_offset_ms; the join ABS(diff) < 2000 ms matches 94 of 100 sampled events"
  p_typical: 0.08
  grounded: quote
  evidence: "spec.md Known problems: 'Long multi-video sessions'; spec.md Unspecified: 'whether game telemetry is joined'"
  proposed: "VIDEOS (session_id, video_idx, recording_start_utc, duration_ms, clock_offset_ms, offset_method ENUM('capture_clock','ocr_hud','telemetry_anchor'), offset_confidence)"
  shallow: false
  part: ingestion
  mechanism: "Capture client stamps UTC at record start; ingestion computes a per-video offset and confidence; the studio's dbt model does an ASOF join on wall_clock_utc"
  example: "'What did tutorial churners say in the 10 s before their third failed jump?' -> ASOF join of telemetry jump_fail to OBSERVATIONS utterance rows within 10 s: 38 of 61 churners have an utterance, 29 of those are negative sentiment, with quotes and timestamps"
  cost: M
  ingest_cost: M
  query_cost: S
  better_than_fixed_table: "Questions that combine telemetry and speech become a time join instead of a question nobody wrote"
  depends_on: datateam-4

