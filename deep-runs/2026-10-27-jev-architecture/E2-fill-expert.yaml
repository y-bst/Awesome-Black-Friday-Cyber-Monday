    effort: XS-days
  object: 'memo.md item 1: ''quote with timestamp as evidence'''
  situation: A studio quotes 'players said the raid was fine' in a deck; 30% of those 'fine' utterances were said with high
    arousal
  consequence: Quote-based affect answers overstate comfort, and the studio cannot see the gap because the evidence is a calm-looking
    quote
  p_typical: 0.03
  grounded: inferred
  evidence: 'memo.md: ''timestamped atomic observations across all videos of a session (step on screen, action, utterance,
    friction signal, sentiment, quote with timestamp as evidence)''; a quote shows the words but not how they were said'
  already_offered: false
  proposed: 'Answer shows three columns: text-negative, masked_tension, calm; clicking masked_tension plays the 5-s audio
    clips'
  shallow: false
  mechanism: Join utterance rows with the arousal track over the utterance span; tag masked_tension when text sentiment >=
    0 and max arousal_z > 2.0; aggregates are plain SQL over the tag
  example: Studio asks 'how did players feel about the first raid'; of 180 players, 41 negative by words, 33 masked_tension
    (said 'it's fine' or 'okay' with arousal z over 2), 106 calm; text-only would have put the 33 in calm
  cost: XS
  depends_on: The prosodic arousal track and per-utterance text sentiment
  part: query
  ingest_cost: S
  query_cost: S
  better_than_fixed_table: Shows where players' words and voices disagree, which a single sentiment option cannot
- id: expfill-27
