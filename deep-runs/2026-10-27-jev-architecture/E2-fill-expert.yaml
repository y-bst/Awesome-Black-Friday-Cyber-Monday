- id: expfill-28
  title: 'Noun-recall gate per field: any field whose extraction depends on a game noun (mention trackers, what-said about
    a named boss or item) is shown in the chatbot only when ASR recall on that noun is at least 0.85 on the game''s 200-term
    test set, else marked ''low transcript recall'''
  level: L4
  perspective: expert-fill
  cell:
    part: evaluation
    modality: speech-transcript
    uncertainty-policy: abstain-below-coverage
    evidence-form: recall-estimate
    question-type: what-said
    moment-in-journey: first-cohort-ingested
    subject-domain: narrative
    effort: XS-days
  object: 'memo.md item 3: ''accuracy against hand-labelled sessions'''
  situation: A narrative game's character names ('Ysolde', 'Caer Mhorn') are misheard 60% of the time even with boosting;
    a 'mentions Ysolde' count looks precise but finds 40% of mentions
  consequence: The studio concludes players do not talk about a character who is in fact the most-mentioned one
  p_typical: 0.03
  grounded: inferred
  evidence: 'memo.md: ''judged by two tests: coverage of real studio questions and accuracy against hand-labelled sessions.'';
    accuracy is measured on extracted answers, not on whether the transcript holds the noun at all'
  already_offered: false
  proposed: noun_recall(game_id, term, asr_version, recall, n) table; the planner checks it for every noun in a query and
    adds a recall line to the answer
  shallow: false
  mechanism: At onboarding, 20 minutes of audio per game are hand-transcribed for the 200 test terms; recall is computed per
    term and ASR version; at query time the planner extracts nouns from the question, looks up recall, and if below 0.85 prints
    'Ysolde is transcribed correctly about 41% of the time; counts are a lower bound'
  example: 'Studio asks ''how many players mention Ysolde after the chapter 3 betrayal cutscene''; answer ''52 of 300 (lower
    bound: Ysolde recall 0.41 on our test set; expect about 120)'''
  cost: XS
  depends_on: A per-game noun test set with hand-checked audio
  part: evaluation
  ingest_cost: S
  query_cost: S
  better_than_fixed_table: Says when a speech-based count is a lower bound because the transcript lost the noun
