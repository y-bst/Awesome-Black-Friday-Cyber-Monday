  object: 'memo.md item 1: ''sentiment'''
  situation: An off-the-shelf speech emotion API returns 'angry 0.71' per utterance; it is tempting to show per-player emotion
    profiles to the studio
  consequence: 'Low willingness: labels trained on acted speech misclassify non-native and quiet players, and per-player emotion
    profiles from voice raise consent and privacy issues; JEV would publish confident numbers that fail a hand-label check'
  p_typical: 0.04
  grounded: inferred
