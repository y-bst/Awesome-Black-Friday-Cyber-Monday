- id: retr-12
  title: "A written routing rule for table-vs-retrieval: use SQL when the question maps to a closed field; use retrieval only when the filter selects under 5% of rows or under 2,000 rows; otherwise trigger backfill extraction"
  level: L4
  cell: {part: query-path, query-path: sql-over-closed-fields, question-type: how-many, mechanism-type: defer-to-query-time, latency-tier: under-2s, uncertainty-policy: abstain-below-coverage}
  object: "memo.md item 2: three tiers (aggregate, retrieval, batch extraction)"
  situation: "Studio asks 'how many players skipped the tutorial'; the planner has no rule and picks retrieval because 'skipped' is not a column name"
  consequence: "A count comes from top-k retrieval, which cannot count; the number is wrong by an unknown amount"
  p_typical: 0.07
  grounded: quote
  evidence: "memo.md: 'closed-field questions become aggregate queries over all players (instant); open-field questions retrieve matching observation rows'"
  proposed: "Rule table: (a) field match by name or synonym -> SQL; (b) no field match AND estimated matching rows (from the filter count) under 2,000 -> retrieval with coverage line; (c) no field match AND matching rows over 2,000 AND question is how-many/find-players-who -> backfill extraction, answer 'ready in N minutes'; test: 0 counts produced from the retrieval path"
  mechanism: "Changes the planner: a deterministic decision table keyed on field match and filter cardinality, logged with each answer"
  example: "'How many players skipped the tutorial?' -> no field; filter (all players) = 500 sessions, 48,000 rows -> backfill 'tutorial_skipped: bool' over 500 sessions; the count 37/500 arrives in 6 minutes"
  cost: S
  depends_on: "exact filter counts from the store (retr-4) and the backfill path from memo.md item 2"
  part: query-path
  ingest_cost: S
  query_cost: S
  better_than_fixed_table: "The table answers counts only for pre-written questions; this routes every count question to a path that can actually count"
  shallow: false

