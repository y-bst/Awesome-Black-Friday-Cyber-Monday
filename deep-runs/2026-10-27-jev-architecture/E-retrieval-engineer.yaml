- id: retr-1
  title: "Chunk on the stitched session timeline (90s windows, 30s overlap) instead of per 15-minute video file, with session_id, video_index, t_session_start, t_session_end on every chunk"
  level: L3
  cell: {part: session-stitching, representation: transcript-chunks-with-embeddings, granularity: variable-length-moment-or-episode, query-path: retrieval-then-llm, scope: all-players, effort: S-weeks}
  object: "spec.md: 'each video is capped at 15 minutes, so one session is many videos' and 'how videos of one session are linked' is unspecified"
  situation: "A player quits the tutorial 40 seconds into video 3; the preceding 2 minutes of frustration sit at the end of video 2 and are a different retrieval unit"
  consequence: "Per-video chunks lose the cross-cut context for roughly 1 in 10 moments (a 15-minute file cut against a 90s window means 6.7% of windows straddle a cut, more with overlap); the chatbot answers 'nothing notable before exit'"
  p_typical: 0.35
  grounded: quote
  evidence: "spec.md: 'A session can be n hours; each video is capped at 15 minutes, so one session is many videos.'"
  proposed: "Stitcher orders videos by capture timestamp, concatenates transcripts into one session timeline, then windows: chunk = {session_id, player_id, chunk_idx, video_index_start, video_index_end, t_session_start_s, t_session_end_s, text, step_id_mode}; a chunk may span a file cut"
  mechanism: "Changes session-stitching and the index record shape: the retrieval unit is a window over the session clock, not the file; file boundaries become a metadata field, never a chunk boundary"
  example: "Studio asks 'what were players saying in the 2 minutes before they abandoned the tutorial'; filter t_session_end_s within 120s of session end, player has no later chunk; 38 of 500 players match, windows crossing the video-2/video-3 cut are returned whole"
  cost: S
  depends_on: "a session-level ordering of videos (capture timestamp or sequence number in the filename)"
  part: session-stitching
  ingest_cost: S
  query_cost: S
  better_than_fixed_table: "The table is per video (spec.md: 'a structured table per video'), so 'before exit' is cut at file edges; session-clock chunks are not"
  shallow: false

- id: retr-2
  title: "Step-aligned chunking: a chunk boundary is forced at every tutorial-step transition emitted by the screen-state classifier, and step_id is a filterable field on the chunk"
  level: L3
  cell: {part: ingestion-extraction, representation: transcript-chunks-with-embeddings, granularity: tutorial-step, modality: screen-state-classifier, query-path: retrieval-then-llm, subject-domain: onboarding-tutorial}
  object: "memo.md observation 'step on screen' and spec.md 'targets are mostly detecting churn in the tutorial'"
  situation: "A 90s window covers the end of step 2 and the start of step 3; a question filtered to step 3 either misses or mis-attributes the utterance"
  consequence: "Step-filtered retrieval precision drops because 20 to 30% of fixed windows straddle a step change in a tutorial with 8 steps of 2 to 4 minutes each"
  p_typical: 0.3
  grounded: inferred
  evidence: "memo.md: 'timestamped atomic observations across all videos of a session (step on screen, action, utterance, friction signal ...)'"
  proposed: "Chunker takes the step timeline (step_id, t_enter, t_exit) from the frame pipeline; windows are cut at t_enter of each step; a step longer than 180s is split into 90s sub-windows all carrying the same step_id and a sub_index"
  mechanism: "Changes ingestion chunking: boundaries come from screen state, not from token count; each chunk gets step_id, step_dwell_s, step_attempt_number"
  example: "'Why do players stall on step 3 (the crafting tutorial)?' becomes filter step_id=3 AND step_dwell_s>120 then semantic query 'confusion about crafting'; 61 chunks from 44 players come back, none containing step-2 speech"
  cost: M
  depends_on: "a screen-state classifier that emits step transitions with timestamps (memo.md item 1)"
  part: ingestion-extraction
  ingest_cost: M
  query_cost: S
  better_than_fixed_table: "The table has one answer per video per question; step-aligned chunks let any new question be scoped to a step without re-running extraction"
  shallow: false

