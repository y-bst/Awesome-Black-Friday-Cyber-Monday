- id: "stitch-2"
  case: "JEV should build the two-clock timestamp in the next quarter because the spec states that 'a session can be n hours; each video is capped at 15 minutes, so one session is many videos', and the memo's observation log promises 'timestamped atomic observations across all videos of a session' without saying which clock those timestamps use. Video-local time cannot express any duration that crosses a cut: in the option's own example, tutorial step 3 starts at 13:50 in video 2 and ends at 02:10 in video 3, which yields a negative duration. Adding session_offset_ms (segment start offset from the manifest plus video_ms) makes 'median time on tutorial step 3' a one-line SQL percentile and returns 4m20s including the 20 players whose step 3 straddled a cut. Without it, any duration question over 500 players is biased toward short steps that fit inside a single video, which is exactly the tutorial-churn question studios ask first (how long until they gave up, how long stuck on step 3, time to first success). The cost is small: ingestion is one post-step that adds an integer per row from the manifest, and query time is unchanged and instant because it is plain arithmetic on a stored column, so there is no latency risk. Keeping (video_id, video_ms) beside it preserves clip lookup, so evidence and clips still work. It is cheap, depends only on the manifest and stitch-1, and unlocks every dwell, time-to-event and ordering question, so it should be built as a foundation before any planner work."
- id: "qgen-1"
  case: "JEV should build typed answer contracts now because the memo already says each generated question comes 'with an answer type and an evidence requirement' but names no mechanism that makes the chatbot obey it, and the fixed table today stores per-video answer text with no type, so counts, durations and quotes are indistinguishable. The option makes question generation emit a schema row per question (answer_type, aggregation, unit, evidence rule, and a 'not-observable' null option) and gives the answers table a typed column per qid, so the planner routes on answer_type and refuses a route whose type does not match. Concretely, 'how long do players spend on tutorial step 3' matches dwell_time(step=3) with answer_type duration_s and aggregation p50 and returns 'p50 4m10s, n=487 of 500 observable, 13 not-observable (video cut before step 3)', instead of answering with the enum rate 'stalled on step 3: 41%' that the studio would read as a time. The consequence it prevents is trust loss: one wrong-kind number and the studio stops asking, which defeats the whole point of fast answers over hundreds of players. The explicit not-observable option also fixes a hidden bias in the fixed table, where unseen steps are silently counted as no. It depends only on a question registry keyed by qid, costs essentially nothing at ingestion (a few extra fields per question) and nothing at query time, and every later option (planner, backfill, cached new fields) needs these contracts to compile against, so it is the cheapest high-impact correctness gain in the batch."
- id: "stitch-7"
  case: "JEV should build declared scope and reducers in the next quarter because the spec says answers form 'a structured table per video' while the unit studios care about is the player or session, and nothing today defines how video answers roll up. The option makes every generated question declare scope in {video, step, session, player} and, above video, a reducer in {first, last, any, all, max, sum, latest-nonnull}, versioned with the question so a reducer change creates a new field version. In the option's example, 'did the player complete the tutorial' reads no, yes, no across segments 1, 4 and 9 (free play, no tutorial visible); a naive per-video aggregate reports 33% completion for a player who completed it, while any() gives 312 of 500 completers and last(step_on_screen) where tutorial_complete is false answers 'where did they quit' correctly. Without a declared reducer the chatbot picks one at random or averages booleans, so the headline tutorial-churn number is wrong in a way no studio can detect, and wrong numbers are what ends adoption. The cost is low: it adds two metadata fields per question at generation time and a deterministic rewrite in the planner, with query time staying a grouped SQL aggregate. It is a variant of qgen-1 but carries the multi-video correctness that qgen-1's answer type alone does not, and it directly addresses the owner's named problem of long multi-video sessions, so it should be built together with stitch-1 and qgen-1."
- id: "planner-1"
  case: "JEV should build the typed plan object now because it is the missing intermediate between a studio's question and an answer: the memo says 'the chatbot runs a query planner' and names three routes, but today the chatbot goes straight from question text to answer, so the route, fields and denominator are invisible and the same question can be answered two ways on two days. The plan is a small JSON, {route: sql|retrieval|backfill|clip, fields: [field_id@version], filters, cohort, group_by, evidence_form}, which the executor runs against the observation log while the LLM sees only the plan and the results. For 'how many players quit during the tutorial' the plan resolves to route sql over tutorial_outcome@v3 with a count-with-denominator evidence form and returns '137 of 512 sessions (26.8%)' in 0.4s, and the answer can print the plan as its own audit trail. This is what makes unknown studio questions answerable correctly: the planner can combine fields, filters and cohorts that no fixed question anticipated, and an unresolvable plan becomes an explicit backfill or clip request instead of a guess. Its fields carry versions, so a re-run after a question change is distinguishable rather than silently different. It affects every asker and every question, so it is the highest-impact item in this batch (impact 5), with only an LLM call of a few hundred tokens added at query time and no ingestion cost. It depends on the memo's observation log with closed fields keyed by session_id, which the memo already commits to, so the dependency is a plan item and not a new risk."
- id: "latency-16"
  case: "JEV should build the columnar layout now because the memo's central promise, 'closed-field questions become aggregate queries over all players (instant)', is only true with the right physical layout, and the memo does not specify one. The option's sizing is concrete: roughly 600k observation rows (500 players x ~1.2k observations) by about 12 columns costs 1 to 2 seconds per group-by in a row store, but in columnar storage with LowCardinality enum dictionaries for step, action, friction_signal and sentiment only the 2 or 3 needed columns are read, giving roughly 50 to 150 ms. A question like 'how many friction signals per step on build 1.4' then returns in about 90 ms, and partitioning by (game_id, build_id) keeps one studio's or one build's query from scanning another's data. That speed is what lets the chatbot run several plans per user question, retry a route, or compute a cohort comparison inside the few-seconds budget, which is the owner's stated constraint (ingestion cost is fine, query speed is not negotiable). It adds nothing to ingestion beyond a write path to Parquet or ClickHouse and nothing to query cost, and it depends on nothing beyond the memo's log. Without it the memo's architecture works functionally but misses its own latency claim as data grows past one studio, and the fix gets more expensive once rows and clients exist, so it is cheap to do first and costly to retrofit."
