# Stage G merged leaves, bucket 2 (part: ingestion-extraction). Rejected: none. Cells normalised against C-axes.yaml.
- id: clinical-8
  title: 'Source-span constraint: an extracted value is rejected at write time unless it carries evidence_span (video_id,
    t_start_ms, t_end_ms, modality, verbatim snippet up to 200 chars or frame_id); fields that cannot cite a span are stored
    as ''not documented'', never as a value'
  level: L4
  cell:
    part: ingestion-extraction
    evidence-form: quote-with-timestamp
    representation: timestamped-observation-log
    uncertainty-policy: abstain-below-coverage
    modality: speech-transcript
    extraction-trigger: at-ingestion
    effort: S-weeks
    granularity: utterance
    mechanism-type: precompute-more
  object: 'memo.md item 1: ''quote with timestamp as evidence'''
  situation: 'The extractor answers ''player felt confused by the crew UI: yes'' for a session where the player never speaks
    and the crew UI is never on screen'
  consequence: The write is rejected (no span); the field is 'not documented' for that session and drops out of the denominator;
    the studio never sees a hallucinated yes, and the unsupported-claim rate becomes measurable (rejected writes per 1,000)
  p_typical: 0.22
  grounded: quote
  evidence: 'memo.md item 1: ''quote with timestamp as evidence'''
  proposed: CHECK constraint evidence_span IS NOT NULL on observation and field_values; rejected_writes(extractor_run_id,
    field_id, reason) counted per run; span verified by re-reading the cited window (snippet must appear in transcript within
    the window, frame_id must exist)
  shallow: false
  mechanism: 'Ingestion: abstraction-with-evidence as a hard schema rule, with mechanical verification that the cited span
    exists and contains the snippet'
  example: 'Field ''quit_reason'' for player 217: value ''controls'' with span (video 3, 00:04:12-00:04:19, speech, ''these
    controls are so clunky I am done''); for player 304 the extractor cites a window with no speech, the write is rejected
    and quit_reason=''not documented'''
  cost: S
  depends_on: nothing
  part: ingestion-extraction
  ingest_cost: S
  query_cost: S
  better_than_fixed_table: No answer exists in the store that cannot be shown on a timeline
  perspective: clinical
  also_from:
  - eval
  also_from_ids:
  - eval-24
- id: clinical-9
  title: 'Transcript term table modelled on NOTE_NLP: one row per detected concept mention with offset, lexical_variant, negated,
    temporality in {present, past, hypothetical}, certainty, experiencer in {player, npc, stream_chat, other_voice}; prevalence
    queries exclude negated and hypothetical by default'
  level: L4
  cell:
    part: ingestion-extraction
    modality: speech-transcript
    question-type: prevalence-of-quoted-sentiment
    representation: timestamped-observation-log
    granularity: utterance
    query-path: sql-over-closed-fields
    effort: M-one-quarter
    extraction-trigger: at-ingestion
    evidence-form: count-with-denominator
    subject-domain: onboarding-tutorial
    mechanism-type: precompute-more
  object: 'spec.md item 2: ''Each video is converted to a transcript'''
  situation: Studio asks 'how many players said they would quit?'; transcripts contain 'I'd quit if this took any longer'
    (hypothetical), 'I didn't quit, I just alt-tabbed' (negated), and the NPC guide's line 'don't quit now!' (experiencer
    npc)
  consequence: A keyword count returns 212 of 500; the term table with modifiers returns 37 present, non-negated, player-experienced
    mentions, and the chatbot can show the 175 excluded with their modifier
  p_typical: 0.05
  grounded: inferred
  evidence: 'spec.md unspecified: ''What a transcript contains'''
  proposed: transcript_term(session_id, video_id, t_ms, offset_start, offset_end, lexical_variant, concept_id, negated BOOL,
    temporality, certainty in {certain, probable, possible}, experiencer, extractor_run_id); default query filter negated=false
    AND temporality='present' AND experiencer='player'
  shallow: false
  mechanism: 'Ingestion: a concept-mention pass over the transcript writes modifiers alongside the mention; the query planner
    applies the default modifier filter and reports what it excluded'
  example: 'Answer: ''37 of 500 players (7.4%) stated an intent to quit during the tutorial. Excluded: 118 hypothetical, 31
    negated, 26 spoken by the NPC guide.'' with 37 timestamped quotes'
  cost: M
  depends_on: speaker attribution between player voice and in-game voice lines
  part: ingestion-extraction
  ingest_cost: M
  query_cost: S
  better_than_fixed_table: '''How many said X'' stops counting people who said not-X or if-X'
  perspective: clinical
  variants_of:
  - kg-7
- id: clinical-25
  title: 'Backfill at the concept level, not the question level: when a new standard concept is added to the vocabulary (''accessibility_menu_opened''),
    one re-extraction pass runs over every game with a mapped source value, and every question over that concept on every
    game is served from the same pass'
  level: L4
  cell:
    part: ingestion-extraction
    extraction-trigger: on-new-field-added
    schema-evolution: eager-backfill-all-history
    reuse-scope-of-extraction: universal-primitives
    mechanism-type: precompute-more
    scope: cross-game
    latency-tier: overnight
    effort: M-one-quarter
    question-type: how-many
    evidence-form: count-with-denominator
  object: 'memo.md item 2: ''genuinely new questions trigger a one-time batch extraction over all sessions whose result is
    cached as a new field'''
  situation: Studio A asks 'how many players opened the accessibility menu?'; the memo's design extracts a new field for Studio
    A's 500 sessions; Studio B asks the same next month
  consequence: Concept-level backfill extracts 'accessibility_menu_opened' as an observation concept for all 9 games (4,100
    sessions) overnight once; Studio B's question is a 200 ms query, and 'what else happened in the same minute' works because
    it is an observation row, not a per-question answer
  p_typical: 0.07
  grounded: quote
  evidence: memo.md item 2
  proposed: vocabulary change request -> concept added with manual (clinical-12) -> mapping proposals per game (clinical-4)
    -> backfill job per game over sessions with mapped sources -> DQ check -> release; cost accounted per concept not per
    question
  shallow: false
  mechanism: 'Ingestion: the unit of extraction and backfill is a vocabulary concept shared across tenants, so one studio''s
    new question enriches the observation log for everyone'
  example: 'Night of 2026-10-28: concept 9031 accessibility_menu_opened backfilled across 4,100 sessions; next day Studio
    B''s ''how many opened accessibility?'' returns 61/520 (11.7%) in 180 ms'
  cost: M
  depends_on: clinical-1, clinical-4; isolated tenants still share the vocabulary, not the rows
  part: ingestion-extraction
  ingest_cost: L
  query_cost: S
  better_than_fixed_table: A new question paid for once serves every game, and the result is an observation others can join,
    not a cached answer
  perspective: clinical
