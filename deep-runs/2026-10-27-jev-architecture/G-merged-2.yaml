- id: convo-1
  title: 'Universal primitives computed for every session regardless of game: speech rate, silence ratio, sentiment at 10
    s windows, frustration-lexicon hits, screen-change rate; stored as time series, never as answers'
  level: L4
  cell:
    part: ingestion-extraction
    representation: time-series-signals-affect-pace-silence
    granularity: session
    extraction-trigger: at-ingestion
    modality: speech-transcript
    reuse-scope-of-extraction: universal-primitives
    mechanism-type: precompute-more
    effort: M-one-quarter
    subject-domain: onboarding-tutorial
    evidence-form: contrast-vs-baseline
    query-path: sql-over-closed-fields
    scope: cohort
  object: 'spec.md item 3: ''The transcript is run through a fixed set of questions with options, written per game target'''
  situation: A new game is onboarded with zero questions written; 200 sessions of 2 h each arrive in week 1
  consequence: With the fixed table nothing is extracted until someone writes questions; with primitives, 6 signals per 10
    s window (720 windows per 2 h session) exist for every session on day 0 and any later question over pace, silence or affect
    is a window-range aggregate
  p_typical: 0.25
  grounded: quote
  evidence: 'spec.md: ''The question set is small, so most of what is in the video and transcript is never captured'''
  proposed: primitives(session_id, t_window_start_ms, words_per_min, silence_ratio, sentiment_-1_1, frustration_hits, screen_changes,
    screen_class) with one row per 10 s; computed by one pass at ingestion; the same 6 columns for every tenant
  shallow: false
  mechanism: Ingestion adds a game-agnostic pass after transcription that emits 6 numeric signals per 10 s window into a primitives
    table; no game vocabulary needed; trackers and questions are layered on top later
  example: 'Studio asks ''do players go quiet before quitting the tutorial?'' Query: mean silence_ratio in the 120 s before
    session end for the 83 of 500 players whose last screen_class was tutorial, vs the 417 who passed; result 0.71 vs 0.34
    in 400 ms'
  cost: M
  depends_on: nothing
  part: ingestion
  ingest_cost: M
  query_cost: S
  better_than_fixed_table: Pace, silence and affect questions are answerable on day 0 for any game without a single hand-written
    question
  perspective: convo
  also_from:
  - latency
  - obs
  also_from_ids:
  - latency-26
  - obs-20
- id: convo-6
  title: 'Moments: variable-length episodes cut by change-points in the primitives (silence>20 s after >120 wpm, sentiment
    drop >0.6 in 30 s, 3+ screen changes in 10 s), each with a 1-line auto title and a 30 s clip'
  level: L4
  cell:
    part: ingestion-extraction
    representation: hierarchical-temporal-summary-tree
    granularity: variable-length-moment-or-episode
    mechanism-type: auto-discover-without-question
    question-type: what-surprised-unknown-unknowns
    evidence-form: clip
    extraction-trigger: at-ingestion
    effort: M-one-quarter
    subject-domain: onboarding-tutorial
  object: 'memo.md item 1: ''timestamped atomic observations across all videos of a session'''
  situation: A producer asks 'what happened to the players who quit the tutorial?' and no tracker or question matches
  consequence: Atomic observations are too fine to read across 83 quitters; moments give 8-15 titled episodes per hour, so
    the model reads 83 x ~6 = 500 titles, not 83 transcripts, and returns 'in 51 of 83, the last moment is a silence-after-fail
    episode in step 4'
  p_typical: 0.08
  grounded: inferred
  evidence: 'spec.md: ''Long multi-video sessions'' listed as a known problem'
  proposed: moments(session_id, t_start_ms, t_end_ms, trigger_rule, title_text, sentiment_mean, step_id, clip_url); 8-15 per
    hour; title generated by the model from the moment's transcript + 2 frames
  shallow: false
  mechanism: Ingestion adds a change-point detector over the 10 s primitive rows, cuts episodes at detected boundaries and
    asks the model to title each one; moments are the unit the query path reads when no closed field applies
  example: 'Studio asks why tutorial churn rose; the chatbot groups the last moment of 83 quitters by title: ''repeated failed
    craft attempt'' 31, ''inventory full, no prompt'' 14, ''silence on map screen'' 9'
  cost: M
  depends_on: convo-1 primitives; video frames at ingestion (A-frame assumption)
  part: ingestion
  ingest_cost: M
  query_cost: S
  better_than_fixed_table: Unknown-unknown questions get a read over 500 titles instead of 500 transcripts; the fixed table
    has nothing for a question it did not anticipate
  perspective: convo
