  object: 'memo.md point 1: ''a session-level observation log ... timestamped atomic observations across all videos of a session'''
  situation: Nightly batch has 9 new-field questions to run over 2,000 sessions; naive execution reads each ~60k-token session
    log 9 times = 1.08B input tokens
  consequence: With the session log as a cached prefix and the 9 questions as suffixes (or one multi-question suffix, latency-8),
    input cost drops to ~1 full read + 8 cached reads per session; at a 90% cached-token discount the bill is ~0.2x of naive
  p_typical: 0.07
  grounded: inferred
  evidence: 'memo.md: ''timestamped atomic observations across all videos of a session'''
  proposed: Batch runner orders calls session-major (all questions for session A, then session B), sets the session log as
    the cacheable prefix, keeps the prefix under the vendor's cache TTL (5 min) by running a session's questions back-to-back
  shallow: false
  mechanism: 'Ingestion/batch extraction: the call layout is reordered so the long static part (session log) is a cache-eligible
    prefix and the variable part (question + answer schema) is a short suffix'
  example: Nightly questions 'tried to skip cutscene', 'read hints aloud', 'mentioned a competitor' run over session S-1042
    as three calls within 40 s; the 58k-token log is billed once in full and twice at the cached rate
  cost: S
  depends_on: vendor prompt caching available on the ingestion model; session log materialised as text
  part: ingestion
  ingest_cost: S
  query_cost: S
  better_than_fixed_table: Fixed table reads each transcript once for a fixed question set and can never add a question cheaply;
    this makes adding the 10th question nearly free per session
  perspective: latency
