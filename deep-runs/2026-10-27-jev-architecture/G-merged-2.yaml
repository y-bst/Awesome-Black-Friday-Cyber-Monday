- id: cv-2
  title: Screen-state classifier over keyframes producing a closed enum per frame, taxonomy induced by clustering keyframe
    embeddings from the first 20 sessions then labelled once
  level: L4
  cell:
    part: ingestion-extraction
    modality: screen-state-classifier
    representation: step-funnel-state-machine-per-player
    granularity: tutorial-step
    extraction-trigger: on-new-game-onboarding
    question-origin: induced-from-data
    effort: S-weeks
    reuse-scope-of-extraction: game-specific
    subject-domain: onboarding-tutorial
    query-path: sql-over-closed-fields
    latency-tier: under-2s
  object: 'memo.md item 1: ''step on screen'' as an observation field'
  situation: A new game is onboarded and nobody has written its tutorial step list
  consequence: Within 20 sessions the system has a 15-40 class screen taxonomy (tutorial-step-1..N, main-menu, loading, dialog,
    death, reward, store, settings, unknown) that every later question filters on
  p_typical: 0.3
  grounded: quote
  evidence: 'memo.md: ''timestamped atomic observations across all videos of a session (step on screen, action, utterance...)'''
  proposed: k-means (k=40) over SigLIP embeddings of 6,000 keyframes; one human labels 40 cluster medoids in 30 min; a linear
    head is trained; classifier writes screen_state + confidence per keyframe
  shallow: false
  part: ingestion
  mechanism: 'Per keyframe: embedding -> linear classifier -> (screen_state enum, confidence float); written into keyframes
    table; taxonomy stored per game with version number'
  example: '''Which tutorial step do players quit on?'' becomes SELECT last screen_state WHERE screen_state LIKE ''tutorial-step-%''
    GROUP BY player; 500 players in under 1 s'
  cost: S
  ingest_cost: S
  query_cost: S
  better_than_fixed_table: Step identity comes from pixels, not from the model guessing from speech; step list is not hand-written
    per game
  depends_on: cv-1
  perspective: cv
