  depends_on: frame pipeline with OCR at 1 frame per 2 s
  part: ingestion
  ingest_cost: M
  query_cost: S
  better_than_fixed_table: The fixed table needs a hand-written option list of step names per game; the registry discovers
    the 12 steps from the prompts themselves.
