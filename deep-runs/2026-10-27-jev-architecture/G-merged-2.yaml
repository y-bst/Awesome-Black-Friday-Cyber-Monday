  object: 'memo.md item 1: ''step on screen'' as an observation field'
  situation: Two players see the same tutorial prompt but the model names it 'move tutorial' for one and 'WASD prompt' for
    the other; without resolution the per-step count is split across aliases.
  consequence: The Step registry holds exactly one node per prompt text hash; ATTEMPTED edges from all 500 players converge
    on it; the funnel count per step is a node degree.
  p_typical: 0.15
  grounded: inferred
  evidence: 'memo.md: ''Video frames add screen state and on-screen text, because speech alone cannot answer "where did they
    click".'''
  proposed: Step node key = sha1(normalised OCR prompt text) plus first-seen ordinal; aliases from the model's free text are
    stored as ALIAS_OF edges with a similarity score; merge when cosine over prompt text exceeds 0.92.
  shallow: false
  mechanism: At ingestion, every frame where a tutorial prompt is on screen yields the prompt text; the registry upserts a
    Step node; the player's interval on that prompt becomes one ATTEMPTED edge with t_start, t_end and outcome.
  example: 'Studio asks ''which step loses the most players''; the answer is the Step node with the highest ratio of ABANDONED
    to ATTEMPTED in-degree: step ''Equip your weapon'' (idx 4), 37 abandoned of 500 attempted (7.4%).'
