  mechanism: "Collection protocol: quota table per game; store: 2 columns on session; query: weighted aggregates"
  example: "'How many players miss the dodge prompt?' -> 'weighted 23% (CI 18-28%, n=500, 12 strata); mobile-touch stratum 41% vs PC-controller 9%'"
  cost: M
  depends_on: "telem-2; telemetry profile fields for the population"
  part: collection-protocol
  ingest_cost: S
  query_cost: S
  better_than_fixed_table: "the fixed table counts answers over whoever was recorded; this makes those counts estimates of the population with a stated error"

