  proposed: "Define metrics in YAML (dbt metrics) over the shared dataset; planner maps a question to (metric, dimensions, filters) with a 40-entry catalogue; metric changes are versioned and the answer prints metric@version; materialised views refresh nightly for the 40"
  shallow: false
  mechanism: "Query path: text-to-metric instead of text-to-SQL for closed questions; store: materialised views; schema evolution: metric deprecation with a 30-day dual-serve"
  example: "'Help-ask rate per step for mobile players' -> help_utterance_rate@3 BY step WHERE platform='mobile' -> 12 rows, 0.4 s, same numbers as the studio's Looker"
  cost: M
  depends_on: "telem-7 or telem-19 dataset; a studio data engineer to co-own definitions"
  part: query-path
  ingest_cost: S
  query_cost: S
  better_than_fixed_table: "the fixed table's option counts have no definition anyone can read; a metrics layer makes every number reproducible by the studio with their own tool"

- id: telem-29
  title: "Day-0 question seed from the studio's telemetry event catalogue: each of the 41 event names and its properties spawns what-happened / when / how-many templates and a video 'why' pair, before any video exists"
  level: L4
  cell: {part: question-generation, question-origin: induced-from-data, moment-in-journey: game-onboarding-day-0, modality: game-telemetry, extraction-trigger: on-new-game-onboarding, reuse-scope-of-extraction: game-specific, effort: XS-days}
  object: "memo.md 'Questions are generated from an ontology (entities x dimensions x outcomes), pruned by the game target'"
  situation: "Day 0 for a new game: the ontology needs the game's entities (steps, mechanics, UI elements); the studio's event schema already lists them (tutorial_step{step_id 1-12}, ability_used{ability}, menu_opened{menu}, death{cause})"
  consequence: "Entity list for the ontology comes from the event catalogue in 1 hour instead of an onboarding interview; 41 events x 3 templates = 123 questions with exact telemetry predicates, plus 41 'why' questions routed to video; the per-game hand-written step is removed"
  p_typical: 0.08
  grounded: quote
  evidence: "memo.md: 'pruned by the game target'; spec.md: 'written per game target'"
  proposed: "Onboarding ingests the event schema (JSON or dbt sources.yml); an entity extractor maps event/property names to ontology entities (step, mechanic, UI element, outcome); templates are instantiated with the telemetry predicate attached; the video extractor prompt receives the same entity names so observation fields and events share vocabulary"
  shallow: false
  mechanism: "Question generation: schema -> entities -> templated questions; ingestion: entity names injected into extraction prompts"
  example: "Event ability_used{ability in [dodge, parry, heal]} -> 'How many players used parry during the tutorial?' (telemetry) and 'Why did players who never used parry avoid it?' (video, cohort = no ability_used{parry})"
  cost: S
  depends_on: "studio provides its event schema at onboarding"
  part: question-generation
  ingest_cost: S
  query_cost: S
  better_than_fixed_table: "the fixed questions take a person-week per game; the event catalogue gives the game's own nouns on day 0 and ties each question to a predicate the studio can verify"

- id: telem-30
  title: "When the store cannot answer and the fact lives in telemetry JEV does not hold, the chatbot returns a ready-to-run SQL snippet against the studio's event names plus 'what video would add' instead of a guess"
  level: L4
  cell: {part: chatbot-ui, uncertainty-policy: escalate-to-human-analyst, query-path: human-analyst-escalation, question-origin: failed-query-log, user-segment: studio-analyst, latency-tier: under-2s, mechanism-type: narrow-or-clarify-the-question}
  object: "memo.md 'genuinely new questions trigger a one-time batch extraction over all sessions'"
  situation: "Analyst asks 'what is day-7 retention for players who completed the tutorial in under 2 minutes'; no video field answers it and no join exists (studio on export-only tenancy); the memo would trigger a batch extraction that cannot answer a retention question"
  consequence: "Answer in 2 s: a SQL snippet over the studio's own tables (from the event catalogue), a note that retention is not in video, and a 1-line offer ('I can tell you what fast finishers say during the tutorial: 112 recorded'); the failed-query log records 'telemetry-only' as the reason, not 'missing field'"
  p_typical: 0.03
  grounded: quote
  evidence: "memo.md: 'genuinely new questions trigger a one-time batch extraction'"
  proposed: "Planner adds a 'telemetry-only' outcome: generate SQL from the catalogue, do not trigger backfill, log the reason; weekly review of telemetry-only questions decides which joins (telem-19) are worth setting up"
  shallow: false
  mechanism: "Chatbot UI: 1 new answer type; feedback loop: failed-query log gains a reason enum {no-field, telemetry-only, coverage-too-low, ambiguous}"
  example: "'D7 retention for sub-2-minute tutorial finishers?' -> 'Not in video. Run in your warehouse: SELECT ... FROM events ... ; Video can add: 112 recorded sub-2-minute finishers; 31 said \"skip\" or \"boring\"'"
  cost: S
  depends_on: "event catalogue per studio"
  part: chatbot-ui
  ingest_cost: S
  query_cost: S
  better_than_fixed_table: "the fixed table either has the option or returns nothing; this hands the analyst the query they need and names what video can add, and it stops backfills that cannot succeed"

- id: telem-31
  title: "Extraction priority from telemetry: sessions are ranked by anomaly score (abandonment, retries, time-in-step z-score) and the full multimodal pass runs on the top 40% first; the rest get the cheap primitives (telem-13/15) only until a question needs them"
  level: L4
  cell: {part: cost-governance, extraction-trigger: on-first-question, mechanism-type: approximate-then-refine, modality: game-telemetry, schema-evolution: lazy-backfill-on-demand, latency-tier: minutes, granularity: session}
  object: "spec.md 'Ingestion time and cost are not a concern'; memo.md 'one-time batch extraction over all sessions'"
  situation: "Even with ingestion cost tolerated, re-extraction after every schema or model change over 500 x 3-hour sessions (1,500 hours of video) takes 2 days; most sessions are uneventful completions"
  consequence: "Re-extraction for a new field finishes on the 200 anomalous sessions in 10 hours; the 300 calm sessions get the field lazily if a cohort question needs them; coverage is printed as 'field available for 200 of 500 (telemetry-prioritised)'"
  p_typical: 0.06
  grounded: quote
  evidence: "spec.md: 'Ingestion time and cost are not a concern. Answering a studio's question must be fast.'"
  proposed: "Per-session anomaly score from telemetry (sum of z-scores over step durations, retries, abandonment flag); extraction queue ordered by score; field_coverage table per field; planner checks coverage before aggregating and triggers backfill on the remainder when a question touches it"
  shallow: false
  mechanism: "Cost governance: 1 score per session, 1 ordered queue, 1 coverage table; query: coverage check before any aggregate"
  example: "New field 'parry_prompt_misread' requested: extracted on 200 anomalous sessions by morning; analyst asks a cohort question touching 38 calm sessions -> backfill those 38 in 4 min, answer with coverage 238 of 500"
  cost: M
  depends_on: "telem-2, telem-5; coverage column per field"
  part: cost-governance
  ingest_cost: M
  query_cost: M
  better_than_fixed_table: "the fixed table is computed once for all videos at equal cost; this spends the expensive pass where telemetry says something happened and states coverage for the rest"

- id: telem-32
  title: "Player identity never crosses the boundary unhashed: JEV stores sha256(player_id || studio_salt); the salt lives in the studio's KMS; re-identification requires the studio to run the hash"
  level: L4
  cell: {part: tenancy-access-control, tenancy-and-deployment: logically-isolated-per-studio, modality: player-profile-metadata, user-segment: jev-internal-ops, build-or-buy: build-in-house, effort: XS-days}
  object: "spec.md 'A player's gameplay session is captured as video' (minors and speech are in scope per B-perspectives privacy-counsel)"
  situation: "Every join option above (telem-1 through telem-31) needs a player key; the studio's security reviewer asks whether JEV holds account IDs for players under 18"
  consequence: "JEV holds hashes only; a leak of the observation store exposes no account ID; the studio can still join because they hold the salt; a hash rotation (new salt) invalidates old joins, so the rotation procedure (re-hash from the studio side, 1 job) is written down before the first join"
  p_typical: 0.05
  grounded: inferred
  evidence: "spec.md Unspecified: 'whether game telemetry is joined'"
  proposed: "Intake form posts the raw ID to a studio-hosted hashing endpoint (or the studio exports a (hash) list); JEV stores player_hash and salt_version; export and federated SQL use player_hash only"
  shallow: false
  mechanism: "Tenancy: 1 hashing endpoint per studio, 1 salt_version column; access control: JEV staff cannot resolve a hash"
  example: "Studio asks 'why did step-3 abandoners quit' -> studio-side SQL hashes their 212 abandoners -> JEV matches 41 hashes -> answer; nobody at JEV sees an account ID"
  cost: S
  depends_on: "telem-2"
  part: tenancy-access-control
  ingest_cost: S
  query_cost: S
  better_than_fixed_table: "the fixed table has no player key and therefore no privacy exposure and no join; this gets the join with the same exposure as the fixed table"
