- id: telem-28
  title: "A metrics layer (dbt MetricFlow or Cube) defines each metric once over both telemetry and observation tables; the chatbot translates text to metric calls, never to raw SQL"
  level: L4
  cell: {part: query-path, query-path: text-to-semantic-layer-metrics, build-or-buy: open-source-component, representation: olap-cube-materialized-views, schema-evolution: deprecate-and-migrate, user-segment: studio-data-engineer, latency-tier: under-2s}
