- id: telem-1
  title: "Per-video clock offset row (video_id, telemetry_session_id, offset_ms, drift_ms_per_hour) computed at ingestion from one on-screen anchor"
  level: L4
  cell: {part: session-stitching, modality: game-telemetry, granularity: video, extraction-trigger: at-ingestion, representation: timestamped-observation-log, scope: one-player, effort: S-weeks}
  object: "spec.md 'each video is capped at 15 minutes, so one session is many videos' and 'whether game telemetry is joined' (Unspecified)"
  situation: "A studio has an event stream with wall-clock timestamps; the capture tool stamps each 15-minute video with its own start time; the two clocks differ by an unknown offset and drift"
  consequence: "Without the offset row, every observation timestamp in memo.md's log is unjoinable to any telemetry event; with it, every observation gets a telemetry_ts column and a join to events within +/-500 ms becomes a plain SQL join"
  p_typical: 0.35
  grounded: quote
  evidence: "spec.md: 'whether game telemetry is joined' is listed under Unspecified"
  proposed: "At ingestion, OCR one anchor per video (build/time overlay, or the first on-screen step banner) and match it to the nearest telemetry event of the same type; store 1 row per video in video_clock_sync; propagate telemetry_ts = video_ts + offset_ms onto every observation row"
  shallow: false
  mechanism: "Ingestion adds a sync pass per video: 1 anchor match, 1 row written; the observation log gains a telemetry_ts column; drift is re-estimated at the next anchor (step banner) and stored as drift_ms_per_hour"
  example: "Tutorial step 3: telemetry has tutorial_step_start{step=3} at 14:02:11.4 for player 0417; video 2 of 7 shows the step-3 banner at 00:03:50; offset = +14:02:11.4 - video2_start - 230 s; the player's utterance 'where is the dodge button' at video 00:04:40 now lands 49.6 s after the step-3 event and 3.2 s after input_pressed{button=A} x4"
  cost: S
  depends_on: "studio exports a telemetry session_id or player_id per recorded session (telem-2)"
  part: session-stitching
  ingest_cost: S
  query_cost: S
  better_than_fixed_table: "the fixed table has no timestamp that any telemetry row can join to; this makes every video-derived row joinable at 500 ms resolution"

- id: telem-2
  title: "Recruitment form captures the studio's player account ID; stored as sha256(player_id + studio_salt) on the session row so telemetry joins exist at all"
  level: L4
  cell: {part: collection-protocol, modality: player-profile-metadata, granularity: session, tenancy-and-deployment: logically-isolated-per-studio, mechanism-type: change-data-at-source, effort: XS-days}
  object: "spec.md 'A player's gameplay session is captured as video' with no mention of a player identity key; memo.md 'session-level observation log'"
  situation: "Studio wants to ask 'of the 212 players who abandoned step 3 in telemetry, what did the recorded ones say'; recorded players are only known by a recording filename"
  consequence: "Without a captured ID the join rate is 0 of 500; with it, every one of the 500 recorded sessions maps to exactly one telemetry player row; the salt lives at the studio so JEV cannot re-identify"
  p_typical: 0.30
  grounded: inferred
  evidence: "spec.md Unspecified: 'whether game telemetry is joined', 'how videos of one session are linked'"
  proposed: "Add 1 required field to the playtest intake (account ID or a QR shown in-game at session start); session table gets player_hash; studio receives the same hash function to apply in their warehouse"
  shallow: false
  mechanism: "Collection protocol change: 1 field at intake; store: 1 column on session; export: hash spec document (1 page) handed to the studio data team"
  example: "Studio asks 'why did step-3 abandoners quit'; planner selects player_hash IN (telemetry abandoners) -> 41 of the 500 recorded players match -> reads observation rows for those 41 only"
  cost: S
  depends_on: nothing
  part: collection-protocol
  ingest_cost: S
  query_cost: S
  better_than_fixed_table: "the fixed table answers only about the 500 recorded players in isolation; with a join key the same answers can be cross-checked against the studio's full population"

- id: telem-3
  title: "Planner routes how-many / how-long / when / did-the-fix-work questions to the studio's telemetry tables first; video observations are read only for why / how-felt / what-said"
  level: L3
  cell: {part: query-path, query-path: sql-over-closed-fields, question-type: how-long, modality: game-telemetry, latency-tier: under-2s, mechanism-type: narrow-or-clarify-the-question, user-segment: studio-analyst}
  object: "memo.md 'closed-field questions become aggregate queries over all players (instant)'"
  situation: "Studio asks 'how long do players spend on tutorial step 3'; the fixed MCQ table has an option bucket ('under 1 min / 1-3 min / over 3 min') estimated by the model from transcript; telemetry has step_start and step_complete events for 48,000 players"
  consequence: "Model-estimated bucket counts from 500 transcripts disagree with telemetry medians (exact, n=48,000) and the studio stops trusting the chatbot after the first mismatch; routing to telemetry returns the exact median (142 s) and p90 (401 s) with n"
  p_typical: 0.40
  grounded: quote
  evidence: "spec.md: 'The transcript is run through a fixed set of questions with options'"
  proposed: "Question classifier gets a 'telemetry-answerable' label with a per-studio mapping (metric name -> event pair); if matched, run SQL in the studio warehouse connection and append 'source: telemetry, n=48,000'; otherwise fall through to observation rows"
  shallow: false
  mechanism: "Query path: 1 extra classification step (telemetry-answerable yes/no) and 1 per-studio metric map (JSON: metric -> start_event, end_event, filter) maintained by the studio data engineer"
  example: "'How many players finished the tutorial in build 1.4.2?' -> SELECT count(distinct player_id) FROM events WHERE name='tutorial_complete' AND build='1.4.2' -> 31,204 of 48,117 (64.8%), 0 video rows read"
  cost: M
  depends_on: "studio warehouse connection (telem-19) or a telemetry extract loaded into JEV; metric map per studio"
  part: query-path
  ingest_cost: S
  query_cost: S
  better_than_fixed_table: "replaces 500-player model-estimated duration buckets with exact population numbers for the 4 question types telemetry covers"

- id: telem-4
  title: "Cohort for a video question is defined in telemetry SQL (step_3_abandoners), then only those players' observation rows are read"
  level: L4
  cell: {part: query-path, scope: query-time-defined-cohort, query-path: retrieval-then-llm, question-type: why, modality: game-telemetry, granularity: cohort, latency-tier: under-30s}
  object: "memo.md 'open-field questions retrieve matching observation rows across players and the model reads only those'"
  situation: "Designer asks 'why do players quit at step 3'; the memo's retrieval would match observation rows by text similarity to 'quit' and 'step 3', missing players who quit silently"
  consequence: "Cohort defined by telemetry (no step_complete{3} event within 30 min of step_start{3}) has exact membership (41 recorded players); the model reads 41 x ~60 = 2,460 observation rows instead of a similarity-ranked top-k with unknown recall"
  p_typical: 0.25
  grounded: quote
  evidence: "memo.md: 'retrieve matching observation rows across players and the model reads only those'"
  proposed: "Planner emits two statements: cohort SQL over telemetry (returns player_hash list) and observation SQL filtered by that list and by telemetry_ts window around the step; LLM summarises with 'n=41 of 500 recorded, 212 of 48,117 in telemetry'"
  shallow: false
  mechanism: "Query path: cohort step becomes a telemetry predicate rather than text retrieval; observation store needs an index on (player_hash, telemetry_ts)"
  example: "'Why do step-3 abandoners quit?' -> cohort: 41 players; window: step_start{3} to last event; rows: 2,460; answer: 'In 23 of 41, the last 60 s contains a dodge-button utterance; in 11 of 41, 45+ s of silence with no input'"
  cost: M
  depends_on: "telem-1 and telem-2"
  part: query-path
  ingest_cost: S
  query_cost: M
  better_than_fixed_table: "the fixed table cannot define a cohort by anything not in its options; telemetry predicates give arbitrary cohorts with exact membership and a denominator"

- id: telem-5
  title: "Telemetry step events, not the model, segment each session into tutorial-step windows; the extractor is run per telemetry-defined window"
  level: L4
  cell: {part: ingestion-extraction, modality: game-telemetry, granularity: tutorial-step, extraction-trigger: at-ingestion, representation: per-step-summary, mechanism-type: change-data-at-source, subject-domain: onboarding-tutorial}
  object: "memo.md observation field 'step on screen'"
  situation: "Ingestion must know which tutorial step the player is in at every observation; the memo infers 'step on screen' from frames and transcript, which fails when the step banner is off-screen (open menus, cutscenes) or when a player re-enters a step"
  consequence: "Step attribution error drops from an estimated 5-10% (model-inferred from frames) to the telemetry instrumentation error (near 0% for instrumented steps); the extractor prompt receives 'you are watching step 3 (Dodge), 00:03:50-00:09:12' as given context"
  p_typical: 0.12
  grounded: quote
  evidence: "memo.md: 'timestamped atomic observations across all videos of a session (step on screen, action, utterance...)'"
  proposed: "Ingestion reads tutorial_step_start/complete events for the session, builds step windows (step_id, start_ts, end_ts, attempt_no), and runs extraction once per window with the step name injected; 'step on screen' becomes a joined column rather than an extracted field"
  shallow: false
  mechanism: "Ingestion: windowing from telemetry (1 query per session), extraction per window; store: observation rows carry step_id and attempt_no from telemetry, plus a model_inferred_step column for the 2 games without step events"
  example: "Player 0417: telemetry shows step 3 attempted 3 times (attempt_no 1-3, durations 88 s, 140 s, 301 s); extraction per attempt yields 'attempt 2: says \"again?\" at +12 s; attempt 3: 70 s silence then quits'"
  cost: M
  depends_on: "telem-1; studios whose tutorial emits step events (ask at onboarding; fall back to frame inference otherwise)"
  part: ingestion-extraction
  ingest_cost: M
  query_cost: S
  better_than_fixed_table: "the fixed table is per video with no step boundary; this gives per-step, per-attempt rows with step identity taken from the game itself"

- id: telem-6
  title: "Divergence observation: a row written whenever telemetry says 'step complete' but video shows friction (3+ retries, a help utterance, or 30+ s idle) in the same window"
  level: L4
  cell: {part: ingestion-extraction, question-type: what-surprised-unknown-unknowns, modality: game-telemetry, representation: timestamped-observation-log, mechanism-type: auto-discover-without-question, evidence-form: clip, extraction-trigger: at-ingestion}
  object: "memo.md 'friction signal' observation field; spec.md target 'detecting churn in the tutorial and just after it'"
  situation: "Telemetry funnel shows step 2 at 97% completion, so the studio never asks about step 2; the recorded players completed it but 18 of 500 pressed the wrong button 5+ times and said 'what?' before succeeding"
  consequence: "The studio's own funnel hides the problem; a divergence row ('telemetry_ok, video_friction', step 2, 18 of 500) surfaces it without a question being asked"
  p_typical: 0.06
  grounded: inferred
  evidence: "memo.md lists 'friction signal' as an observation type but no comparison against telemetry outcome"
  proposed: "After extraction, join each step window's telemetry outcome (complete / abandon / time) with video friction count; write divergence rows of 4 kinds: telemetry_ok+video_friction, telemetry_abandon+video_calm, telemetry_fast+video_confused, telemetry_missing_event+video_shows_step; weekly digest lists the top 5 steps by divergence count"
  shallow: false
  mechanism: "Ingestion post-pass: 1 join per step window, 1 row per divergence; delivery: scheduled digest with clip links"
  example: "Digest line: 'Step 2 (Move): telemetry 97% complete, median 41 s; video friction in 18 of 500 (3.6%): 14 wrong-button x5+, 4 asked aloud what to do; 3 clips attached'"
  cost: M
  depends_on: "telem-1, telem-5"
  part: ingestion-extraction
  ingest_cost: M
  query_cost: S
  better_than_fixed_table: "the fixed table only answers questions that were written; divergence rows are generated from the disagreement between two data sources, which is where the unasked questions live"

- id: telem-7
  title: "Observation log exported into the studio's event stream as events named jev.<observation_type> with the studio's player_id, ts, and properties JSON"
  level: L4
  cell: {part: export-integration, delivery-surface: warehouse-share-or-export, representation: wide-event-schema-on-read, user-segment: studio-data-engineer, tenancy-and-deployment: federated-query-into-studio-warehouse, schema-evolution: append-only-versioned-fields, effort: S-weeks}
  object: "spec.md 'A chatbot for the gaming studio answers the studio's questions from that table'"
  situation: "Studio data team already has a funnel tool (Amplitude / Mixpanel / dbt models over BigQuery) and refuses to ask a chatbot; they want video observations to appear next to their events"
  consequence: "Each jev.utterance, jev.friction, jev.sentiment row becomes an event in their warehouse; their existing funnel builder answers 'step 3 abandoners with a help utterance' with zero JEV query infrastructure; new observation types appear as new event names with no schema migration"
  p_typical: 0.15
  grounded: quote
  evidence: "spec.md: 'Reading 500 transcripts per question was too slow and too much data, which is why the fixed-question table exists'"
  proposed: "Nightly Parquet drop (or Snowflake share) with columns event_name, player_hash, telemetry_ts, video_id, video_ts, properties (JSON), extractor_version; schema doc versioned; new fields only ever added inside properties"
  shallow: false
  mechanism: "Export: 1 nightly job; store: observation rows already in wide format; schema: append-only, new observation types = new event_name values"
  example: "Studio dbt model: tutorial_funnel LEFT JOIN jev_events ON player_hash AND ts BETWEEN step_start AND step_end WHERE event_name='jev.utterance' AND properties.intent='asks_for_help' -> help-ask rate per step in their own dashboard"
  cost: S
  depends_on: "telem-1, telem-2"
  part: export-integration
  ingest_cost: S
  query_cost: S
  better_than_fixed_table: "the fixed table is answers to JEV's questions; the export is raw observations in the studio's own event grammar, so the studio asks its own questions with tools it already trusts"

- id: telem-8
  title: "REFUSE: model-estimated durations ('how long on step 3') are never written to the store for games whose telemetry has step events; the field is populated from telemetry or left null"
  level: L4
  cell: {part: store, question-type: how-long, modality: speech-transcript, uncertainty-policy: abstain-below-coverage, evidence-form: extraction-provenance-model-and-schema-version, representation: fixed-mcq-answers}
  object: "spec.md 'fixed set of questions with options' (duration-bucket options, e.g. 'under 1 min / 1-3 min / over 3 min', estimated from a transcript)"
  situation: "The ontology generator in memo.md proposes a 'how long' dimension for every step; the extractor answers it from transcript pacing with +/-40% error"
  consequence: "Low willingness: a studio analyst who sees two step-3 durations (JEV bucket '1-3 min' for 61% of players; telemetry median 142 s, p90 401 s) will file the whole JEV table as unreliable; the data scientist refuses any numeric field the store has two sources for unless provenance says which one"
  p_typical: 0.08
  grounded: quote
  evidence: "spec.md: 'The transcript is run through a fixed set of questions with options, written per game target'"
  proposed: "Field registry marks each numeric field with source_policy: telemetry_only | video_only | telemetry_then_video; the generator skips 'how long' for games with step events; where video is the only source, store seconds with a +/- band, never a bucket"
  shallow: false
  mechanism: "Store: 1 source_policy column in the field registry; question generation: prune how-long for instrumented steps; extraction: duration fields written as (value_s, low_s, high_s, source)"
  example: "Game A (step events): how_long_step_3 = telemetry, 48,117 players; Game B (no events): how_long_step_3 = video, 500 players, 'about 150 s (110-190)'; chatbot prints the source on every number"
  cost: S
  depends_on: "telem-1; field registry with a source column"
  part: store
  ingest_cost: S
  query_cost: S
  better_than_fixed_table: "the fixed table has one unlabeled source for every answer; this removes the class of answer most likely to be contradicted by the studio's own numbers"

- id: telem-9
  title: "REFUSE: no cohort percentage leaves the chatbot without the recorded-sample denominator (n of 500) and, when a join exists, the matching telemetry population count"
  level: L4
  cell: {part: chatbot-ui, evidence-form: count-with-denominator, uncertainty-policy: answer-with-ci-and-n, scope: all-players, question-type: how-many, user-segment: producer-exec}
  object: "spec.md 'so that a question over, say, 500 players is fast'"
  situation: "Producer asks 'what share of players quit at step 3'; chatbot answers '42%' from 211 of 500 recorded players; the game has 48,117 tutorial starters of whom telemetry says 18% quit at step 3, because recorded players were recruited from a harder-to-reach segment"
  consequence: "Low willingness to ship a bare percentage: the 42% becomes a slide in a producer deck and is wrong by a factor of 2.3; mandatory format is '211 of 500 recorded (42%); telemetry: 8,661 of 48,117 (18%); recorded sample over-represents PC-controller players'"
  p_typical: 0.07
  grounded: quote
  evidence: "spec.md: 'a question over, say, 500 players'"
  proposed: "Answer template enforces numerator/denominator for every proportion; if a telemetry metric map exists for the same event, the planner runs both and prints the pair; if the sample share differs from telemetry by more than 10 points, append a 1-line sample-composition note from telem-18 weights"
  shallow: false
  mechanism: "Chatbot UI: answer formatter with 1 mandatory block per proportion; query path: optional second SQL against telemetry"
  example: "'How many players skip the dodge tutorial?' -> 'Recorded: 37 of 500 (7.4%). Telemetry (skip_tutorial_step{3}): 2,207 of 48,117 (4.6%). Recorded sample is 61% PC vs 29% in population.'"
  cost: S
  depends_on: "telem-3 for the telemetry pair; works without it in sample-only mode"
  part: chatbot-ui
  ingest_cost: S
  query_cost: S
  better_than_fixed_table: "the fixed table gives counts of options over 500 videos with no population context; this prints both numbers side by side"

- id: telem-10
  title: "Per-field precision/recall of video-derived churn-risk fields measured against telemetry day-1 return (returned_d1 = 0/1) as the label, per game, before a field is exposed"
  level: L4
  cell: {part: evaluation, modality: game-telemetry, evidence-form: confidence-score, question-type: who-are-the-churners-segment-discovery, extraction-trigger: on-cohort-size-threshold, scope: all-players}
  object: "memo.md 'judged by two tests: coverage of real studio questions and accuracy against hand-labelled sessions'; spec.md target 'detecting churn in the tutorial and just after it'"
  situation: "The memo evaluates fields against hand labels (does the extractor read the transcript correctly) but never against the outcome the studio cares about (did the player come back)"
  consequence: "A field like 'expressed frustration at step 3' may be extracted with 95% label agreement and still have zero association with churn; with telemetry labels, each field gets lift (P(churn | field=true) / P(churn)) and a sample size; fields with lift < 1.2 on n >= 200 are hidden from the ontology's churn questions"
  p_typical: 0.18
  grounded: quote
  evidence: "memo.md: 'accuracy against hand-labelled sessions'"
  proposed: "Weekly job joins observation fields (per player, boolean/count) to telemetry returned_d1 and returned_d7; stores a field_outcome_lift table (field, game, n, lift, ci_low, ci_high); chatbot shows lift next to any churn-related answer"
  shallow: false
  mechanism: "Evaluation: 1 weekly join and 1 table; question generation: pruning rule on lift; UI: 1 extra line per answer"
  example: "Field 'help_utterance_step_3': n=500, churn rate 31% with vs 14% without, lift 2.2 (1.6-3.0); field 'sighed_during_step_3': lift 1.05 (0.7-1.5) -> hidden from the churn question set"
  cost: M
  depends_on: "telem-2; telemetry retention events available for the recorded players"
  part: evaluation
  ingest_cost: S
  query_cost: S
  better_than_fixed_table: "the fixed table's questions were chosen by hand for churn; this measures which extracted fields actually predict churn and drops the ones that do not"

- id: telem-11
  title: "Questions generated by contrasting telemetry churners vs retainers over every observation field; a question is emitted for each field whose rate differs by 10+ points at n >= 100 per side"
  level: L4
  cell: {part: question-generation, question-origin: discriminative-contrast-churn-vs-retain, query-path: automatic-contrast-cohort-diff, mechanism-type: auto-discover-without-question, evidence-form: contrast-vs-baseline, moment-in-journey: first-cohort-ingested, scope: cohort}
  object: "memo.md 'Questions are generated from an ontology (entities x dimensions x outcomes), pruned by the game target'"
  situation: "Day 7 after the first 500 sessions are ingested; the ontology produced 340 questions for the tutorial; the studio does not know which 5 to read first"
  consequence: "Contrast over 180 boolean fields yields 9 fields with a 10+ point gap, each becoming a ranked question ('Why do churners open the settings menu during step 4 at 3x the rate?'); the studio starts from 9 questions, not 340"
  p_typical: 0.09
  grounded: quote
  evidence: "memo.md: 'ontology (entities x dimensions x outcomes), pruned by the game target'"
  proposed: "After each ingestion batch, compute per-field rate in churners (telemetry: no session on day 1-3) vs retainers; rank by absolute gap with a Benjamini-Hochberg cut at q=0.10; render as a 'what differs' list with 3 clips per side"
  shallow: false
  mechanism: "Question generation: a contrast job (1 pass over the per-player field matrix, 500 x 180) writes a ranked question list with gap, n, q-value; UI: a standing 'what differs' panel"
  example: "'Churners say a confused utterance in step 4 in 38 of 150 (25%) vs retainers 28 of 350 (8%); gap 17 points, q=0.02' -> generated question: 'What confuses players in step 4?' with the 38 clips"
  cost: M
  depends_on: "telem-2, telem-10's per-player field matrix"
  part: question-generation
  ingest_cost: M
  query_cost: S
  better_than_fixed_table: "the fixed questions were guessed before data existed; these are derived from where recorded churners and retainers actually differ"

- id: telem-12
  title: "KPI-backward generation: each step in the studio's telemetry funnel with a drop of 5+ points spawns 3 why-questions scoped to that step's window"
  level: L4
  cell: {part: question-generation, question-origin: kpi-backward-from-studio-metrics, question-type: why, granularity: tutorial-step, moment-in-journey: game-onboarding-day-0, subject-domain: onboarding-tutorial, user-segment: game-designer}
  object: "memo.md ontology 'pruned by the game target'; spec.md 'targets are mostly detecting churn in the tutorial and just after it'"
  situation: "Day 0 for a new game: no video yet, but the studio's funnel (tutorial_step_start/complete for 12 steps) already shows drops at step 3 (-11 points) and step 9 (-7 points)"
  consequence: "The question set starts at 6 targeted questions on the 2 steps that lose players, each with a window predicate; the first 50 recorded sessions already answer them, instead of 340 ontology questions with equal weight"
  p_typical: 0.09
  grounded: quote
  evidence: "memo.md: 'pruned by the game target'"
  proposed: "Onboarding reads the funnel (1 SQL over the studio's events), ranks steps by drop, and for each flagged step emits: 'What did players do in the 60 s before leaving step N', 'What did players say during step N', 'What was on screen when the last input on step N happened'; each carries the step window from telemetry"
  shallow: false
  mechanism: "Question generation: funnel query -> step ranking -> 3 templates per flagged step; extraction prioritises those windows in the first batch"
  example: "Step 3 drop 11 points -> 'What was on screen at the last input before leaving step 3?' -> after 50 sessions: 'in 19 of 22 abandoners, the dodge prompt was hidden behind the inventory panel'"
  cost: S
  depends_on: "studio funnel access at onboarding; telem-5 for windows"
  part: question-generation
  ingest_cost: S
  query_cost: S
  better_than_fixed_table: "fixed questions are written per game by hand; these are written by the studio's own funnel numbers, so the first questions point at the steps that lose players"

- id: telem-13
  title: "Idle-with-prompt friction signal: 20+ s with no input events while a prompt or tutorial banner is on screen, computed from input logs and screen state, no LLM"
  level: L4
  cell: {part: ingestion-extraction, modality: input-events, representation: time-series-signals-affect-pace-silence, granularity: variable-length-moment-or-episode, extraction-trigger: at-ingestion, evidence-form: clip, effort: S-weeks}
  object: "memo.md observation field 'friction signal'; spec.md 'what is on screen is largely lost'"
  situation: "Silent players (no speech) produce empty transcripts; their friction is invisible to the memo's utterance-based extraction"
  consequence: "Idle episodes are detected for 100% of players including the silent 30-40%; each episode row has start_ts, duration_s, screen_state, and the next input; 'where do silent players stall' becomes a SQL question"
  p_typical: 0.08
  grounded: quote
  evidence: "spec.md: 'The transcript alone is not enough; what is on screen is largely lost'"
  proposed: "Ingest the capture tool's input log (or telemetry input events) as a per-second input-rate series; combine with the screen-state classifier's prompt_visible flag; write 1 idle_episode row per run of 20+ s; clip = episode window +/-5 s"
  shallow: false
  mechanism: "Ingestion: 2 time series per session (input_rate, prompt_visible) and a run-length pass; store: idle_episode table; query: SQL count by step"
  example: "Step 3: 97 of 500 players have an idle episode of 20+ s with the dodge prompt visible (median 34 s); 61 of them are silent players who would have had zero friction rows under transcript-only extraction"
  cost: S
  depends_on: "input events (capture overlay or telemetry) and a screen-state classifier with a prompt_visible class"
  part: ingestion-extraction
  ingest_cost: S
  query_cost: S
  better_than_fixed_table: "the fixed table asks the model about the transcript; silent players answer nothing; this signal covers them with a deterministic rule"

- id: telem-14
  title: "AFK episodes (60+ s with no input, no speech, no telemetry event) are flagged and excluded from every duration and silence metric by default"
  level: L4
  cell: {part: store, modality: silence-or-absence-of-speech, question-type: how-long, representation: time-series-signals-affect-pace-silence, uncertainty-policy: always-answer, granularity: session}
  object: "spec.md 'A session can be n hours'; memo.md 'how long' style closed fields"
  situation: "Multi-hour sessions include bathroom breaks and phone calls; 'time on step 5' includes a 9-minute absence for 12 of 500 players and 'silence during step 5' reads 100% for them"
  consequence: "Step-5 mean duration drops from 311 s to 184 s after AFK exclusion; the chatbot reports both numbers with the exclusion count ('12 AFK episodes removed, total 71 min')"
  p_typical: 0.05
  grounded: inferred
  evidence: "spec.md: 'A session can be n hours; each video is capped at 15 minutes'"
  proposed: "Ingestion writes afk_episode rows from the 3-signal rule; metric SQL templates subtract AFK time; a flag include_afk=true re-includes it"
  shallow: false
