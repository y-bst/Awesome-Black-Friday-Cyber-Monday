  cost: S
  depends_on: nothing
  part: store
  ingest_cost: S
  query_cost: S
  better_than_fixed_table: "not applicable to the graph; the flat alternative beats the fixed table because every column is joinable to telemetry and exportable"

- id: telem-24
  title: "REFUSE: averaged LLM sentiment scores ('mean frustration 3.4/5 at step 3') in any aggregate; sentiment is stored as a categorical label with quote and only reported as 'n of m players said X' until a per-game inter-rater agreement of kappa >= 0.6 is on file"
  level: L4
  cell: {part: evaluation, question-type: how-felt, uncertainty-policy: abstain-below-coverage, evidence-form: quote-with-timestamp, representation: timestamped-observation-log, subject-domain: player-affect}
  object: "memo.md observation field 'sentiment'"
  situation: "The ontology emits 'how frustrated were players at step N' for 12 steps; the extractor returns a 1-5 number per utterance; the chatbot averages them"
  consequence: "Low willingness: an LLM 1-5 scale has no calibration across games or across model versions; a mean of 3.4 moves to 2.9 after a model upgrade with no change in players, and the studio reads it as a fix; the categorical form with quotes survives model upgrades and is checkable"
  p_typical: 0.06
  grounded: quote
  evidence: "memo.md: 'sentiment, quote with timestamp as evidence'"
  proposed: "Store sentiment as label in {frustrated, confused, bored, delighted, neutral} with quote and ts; evaluation keeps a 100-utterance per-game double-labelled set with kappa; chatbot prints counts and 3 quotes; numeric scales unlocked per game only above kappa 0.6"
  shallow: false
  mechanism: "Store: categorical column, no numeric; evaluation: kappa table per game and extractor version; chatbot: count-and-quote template for how-felt"
  example: "'How did players feel at step 3?' -> 'frustrated: 71 of 500 (14%); confused: 58 (12%); quotes: \"why won't it dodge\" (0417, 00:04:40) ...; kappa for this game 0.71'"
  cost: S
  depends_on: "double-labelled set per game (eval-lead)"
  part: evaluation
  ingest_cost: S
  query_cost: S
  better_than_fixed_table: "the fixed table reports option counts with no agreement measure; this reports counts with the agreement number next to them and refuses the one form (a mean score) most likely to mislead"

