- "id": "stitch-2"
  "case": "Fold this into obs-29 and stitch-1; it should not be a separate build item. obs-29 already defines session_t_ms with gap_ms rows and an ORDER BY over one session_id partition, and stitch-1 already stores duration_ms and gap_before_ms per segment, so 'session_offset_ms = sum of prior durations plus gaps' is a derived column of that manifest, not a new design choice. The memo also already asks for 'timestamped atomic observations across all videos of a session', so the second clock is how that sentence gets implemented, not an alternative to it. The option also depends on stitch-1 and on video-to-session linkage, which spec.md lists as unspecified ('how videos of one session are linked'). If capture metadata has no wall-clock or the recorder restarts, gaps are unknown and session_offset_ms only looks precise. The harder problem in its own example is not the clock. It is whether the extractor working on video 3 knows that the screen at 00:00 is still tutorial step 3 (extract-3's state card, extract-28's step chain), and without that the straddling step has no start in video 3 to subtract from. The '4m20s including 20 players' figure is illustrative, not measured. Verdict sought: keep the column, but merge it into the stitching option; it does not justify its own slot in the top 25."
- "id": "qgen-1"
  "case": "This largely restates the memo, and the new part moves the hard problem rather than solving it. memo.md item 3 already says each generated question carries 'an answer type and an evidence requirement', and that is the evidence this option cites. The additions (aggregation, unit, a 'not-observable' null) are fields in the same registry row, which the ontology generator has to produce anyway. 'Routes on answer_type, not on question text' still needs the planner to read the studio's free text and decide its answer type. That is easy for 'how long on step 3' but not for the questions that matter for unknown asks ('where do players get confused', 'what made them quit'), where duration, rate and quote are all plausible readings, so the misrouting it warns about comes back at classification time. Its storage choice also conflicts with the memo: 'a typed column per qid' in the answers table is the fixed per-video table with more columns. With ontology generation plus backfill adding fields from real use, that means schema migrations per new question, whereas the memo's observation log and planner-1's (field, value) rows absorb new fields without them. stitch-7 is listed as its variant, and planner-1's evidence_form already carries the answer form. The best course is to fold the not-observable null and the unit into the memo's registry and planner-1's plan, not to fund a separate component. This is a fold, not a reject: the idea is cheap and right, but it is not new."
- "id": "stitch-7"
  "case": "Defer or fold: this hardens the per-video answering model that the memo is replacing. Reducers over 'segment-level answers' only matter if questions are still asked once per 15-minute video and then combined, which is the spec's current 'structured table per video'. Under the memo's session-level observation log, 'did the player complete the tutorial' is a query for any tutorial_complete event in the session's rows; under stitch-27, one roll-up call over the whole session writes session-scope fields directly. In both cases there are no conflicting per-video booleans to reduce. Its own example shows the weakness: 'where did they quit = last(step_on_screen) over segments where tutorial_complete=false' is order-sensitive and needs a session clock and quit detection, which are stitch-2 and clinical-16, not a reducer. Putting the reducer into the question's version means every reducer change forks a field version, adding version churn to a registry that backfill is already growing. The option is listed as a variant of qgen-1 and depends on stitch-1, which is not built. At most, 'scope' becomes one more column in qgen-1's answer contract; a reducer algebra on top is cost without return once observations are session-native."
- "id": "planner-1"
  "case": "This is the memo's query planner (memo.md item 2: 'The chatbot runs a query planner'), with a JSON schema added. It is an implementation detail of something already decided, not a separate option to build or drop. The typed plan does not solve the part that decides correctness for unknown questions: mapping a studio's words onto the right field@version, filters and denominator. An LLM still makes that mapping, and a wrong field choice gives a confidently typed wrong answer. Typing makes the error inspectable, which is useful for audit, but it does not make the answer correct. The stated harm ('the same question answered two ways on two days') is fixed more cheaply by caching the resolved plan per normalised question. The option depends on an observation log with closed fields keyed by session_id, which does not exist yet, and its cohort and backfill routes assume cohort tables and a backfill executor that are other options. The retrieval route cannot fill 'count-with-denominator' without the session-level coding in tar-12 and stat-7, so the schema promises evidence forms that the routes cannot yet deliver. It costs M, against S for most peers. The '137 of 512 in 0.4 s' figure is illustrative. I cannot make a strong case to reject the idea: some intermediate plan object is needed. The case is that it should be folded into building the memo's planner, not ranked as a distinct top-10 choice."
- "id": "latency-16"
  "case": "Defer: this is premature infrastructure for a latency problem the stated scale does not have. 500 players x ~1.2k observations is about 600k rows. A plain Postgres table with indexes on (game_id, step_id) does a two-column GROUP BY over 600k narrow rows in the low hundreds of milliseconds, and DuckDB over a single Parquet file does it in tens of milliseconds with no server. The '1-2 s in a row store' premise is overstated, and partitioning by (game_id, build_id) does nothing at this size. The frame assumes 'a few seconds' of query-time budget, and the planner's own LLM call (planner-1) takes 1-3 s, so 90 ms versus 300 ms of storage time does not show in the studio's experience. Running ClickHouse adds ops cost for a team whose bottleneck is extraction quality. Fixed LowCardinality enum columns also conflict with the memo's growing question set: every backfilled field becomes a schema change, unless the log is stored as (field, value) rows as in planner-1, in which case the per-enum column layout this option specifies does not exist. Most importantly, it makes no unknown question answerable that was not answerable before. It only speeds up closed fields that already exist, so it does not serve the goal of answering correctly. Revisit when measured p95 latency on real query logs exceeds the budget or row counts grow about 100x; until then, store Parquet with DuckDB as the default and move on."
