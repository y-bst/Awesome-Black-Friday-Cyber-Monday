- id: convo-1
  title: "Universal primitives computed for every session regardless of game: speech rate, silence ratio, sentiment at 10 s windows, frustration-lexicon hits, screen-change rate; stored as time series, never as answers"
  level: L4
  cell: {part: ingestion-extraction, representation: time-series-signals-affect-pace-silence, granularity: session, extraction-trigger: at-ingestion, modality: speech-transcript, reuse-scope-of-extraction: universal-primitives, mechanism-type: precompute-more}
  object: "spec.md item 3: 'The transcript is run through a fixed set of questions with options, written per game target'"
  situation: "A new game is onboarded with zero questions written; 200 sessions of 2 h each arrive in week 1"
  consequence: "With the fixed table nothing is extracted until someone writes questions; with primitives, 6 signals per 10 s window (720 windows per 2 h session) exist for every session on day 0 and any later question over pace, silence or affect is a window-range aggregate"
  p_typical: 0.25
  grounded: quote
  evidence: "spec.md: 'The question set is small, so most of what is in the video and transcript is never captured'"
  proposed: "primitives(session_id, t_window_start_ms, words_per_min, silence_ratio, sentiment_-1_1, frustration_hits, screen_changes, screen_class) with one row per 10 s; computed by one pass at ingestion; the same 6 columns for every tenant"
  shallow: false
  mechanism: "Ingestion adds a game-agnostic pass after transcription that emits 6 numeric signals per 10 s window into a primitives table; no game vocabulary needed; trackers and questions are layered on top later"
  example: "Studio asks 'do players go quiet before quitting the tutorial?' Query: mean silence_ratio in the 120 s before session end for the 83 of 500 players whose last screen_class was tutorial, vs the 417 who passed; result 0.71 vs 0.34 in 400 ms"
  cost: M
  depends_on: nothing
  part: ingestion
  ingest_cost: M
  query_cost: S
  better_than_fixed_table: "Pace, silence and affect questions are answerable on day 0 for any game without a single hand-written question"

- id: convo-2
  title: "Customer-defined tracker object (name, 1-50 keywords, 1-10 semantic phrases, 3-20 positive example spans, scope filter) applied retroactively over the whole session history overnight, producing tracker_hits rows"
  level: L4
  cell: {part: question-generation, representation: customer-defined-trackers-over-universal-primitives, question-origin: studio-written-at-runtime, extraction-trigger: on-studio-tracker-defined, latency-tier: overnight, reuse-scope-of-extraction: customer-defined-on-top-of-universal, schema-evolution: lazy-backfill-on-demand}
  object: "memo.md item 2: 'genuinely new questions trigger a one-time batch extraction over all sessions whose result is cached as a new field'"
  situation: "A designer wants to know how often players complain about the crafting menu during the tutorial; no field exists"
  consequence: "Under the memo the planner has to turn a free-text question into an extraction prompt; a tracker makes the studio write the definition once (keywords + phrases + examples), and the next morning 500 sessions carry hit rows the chatbot counts in SQL"
  p_typical: 0.30
  grounded: quote
  evidence: "spec.md: 'Buyers are gaming studios. Their questions are not known in advance.'"
  proposed: "trackers(tracker_id, tenant_id, name, keywords[], phrases[], positive_spans[], negative_spans[], scope_json, version); tracker_hits(session_id, tracker_id, tracker_version, t_start_ms, t_end_ms, score, modality, evidence_span_id)"
  shallow: false
  mechanism: "Question generation moves from JEV writing MCQs to the studio defining trackers in a form; a nightly job scores every utterance and OCR window against every active tracker (keyword match OR cosine>0.80 to phrases/examples) and appends hits"
  example: "Tracker 'crafting-menu-confusion' = keywords [craft, recipe, workbench] + phrases ['where do I craft', 'how do I make'] + 6 example spans; next day: 142 of 500 players hit it, 97 of those inside tutorial step 4, median first hit at 00:11:30"
  cost: M
  depends_on: "convo-1 primitives table (for scope filters by screen_class) and an utterance/OCR window table with embeddings"
  part: question-generation
  ingest_cost: M
  query_cost: S
  better_than_fixed_table: "The studio adds a question without a JEV release; the answer covers all history, not only videos ingested after the question existed"

- id: convo-3
  title: "Smart tracker trained from 5-20 labelled example spans: centroid of example embeddings plus a learned threshold, validated on 50 sampled hits before activation"
  level: L4
  cell: {part: question-generation, question-origin: few-shot-tracker-from-examples, representation: transcript-chunks-with-embeddings, extraction-trigger: on-studio-tracker-defined, uncertainty-policy: abstain-below-coverage, evidence-form: confidence-score, user-segment: ux-researcher}
  object: "memo.md item 3: 'Questions are generated from an ontology (entities x dimensions x outcomes), pruned by the game target'"
  situation: "A UX researcher cannot write keywords for 'player is confused but does not say so' but can point at 8 transcript spans where it happened"
  consequence: "Keyword and ontology trackers miss it; a few-shot tracker fires on spans within cosine 0.78 of the example centroid, and the activation gate (precision on 50 sampled hits >= 0.70, judged by the researcher in 10 min) stops a bad tracker polluting counts"
  p_typical: 0.12
  grounded: inferred
  evidence: "spec.md: 'Transcript loses visual information' and 'most of what is in the video and transcript is never captured'"
  proposed: "smart_tracker = {examples: [span_id...], centroid: vec, threshold: float, precision_at_activation: float, labelled_by, labelled_at}; activation blocked while precision_at_activation < 0.70"
  shallow: false
  mechanism: "Tracker definition accepts example spans instead of words; the system embeds them with the same model used for utterance windows, computes a centroid and picks the threshold that keeps 90% of examples; a 50-hit review screen measures precision before the tracker goes live"
  example: "8 spans like 'wait, what am I supposed to do here... hm' -> tracker 'silent-confusion'; review shows 38/50 correct (0.76); activated; 214 of 500 players hit it in tutorial step 2, vs 41 in step 1"
  cost: M
  depends_on: "utterance window embeddings stored at ingestion (convo-12 or equivalent)"
  part: question-generation
  ingest_cost: S
  query_cost: S
  better_than_fixed_table: "Questions nobody can phrase as words or options become countable; precision is known before the number is shown"

