- id: convo-5
  title: "tracker_hits as the primary query store: one row per (session, tracker, span) with score and evidence span, so every studio question is a COUNT/GROUP BY over hits joined to the step timeline"
  level: L4
  cell: {part: store, representation: customer-defined-trackers-over-universal-primitives, query-path: sql-over-closed-fields, granularity: variable-length-moment-or-episode, latency-tier: under-2s, evidence-form: count-with-denominator}
  object: "spec.md item 4: 'A chatbot for the gaming studio answers the studio's questions from that table, so that a question over, say, 500 players is fast'"
  situation: "Studio asks 'what share of players who hit crafting-menu-confusion in step 4 quit before step 5?'"
  consequence: "The per-video MCQ table cannot join a free-text concept to the step timeline; the hits table answers with SELECT COUNT(DISTINCT player_id) FILTER (quit_step<5) / COUNT(DISTINCT player_id) FROM tracker_hits JOIN step_timeline in under 1 s"
  p_typical: 0.09
  grounded: quote
  evidence: "spec.md: 'Reading 500 transcripts per question was too slow and too much data, which is why the fixed-question table exists'"
  proposed: "tracker_hits(session_id, player_id, game_id, build_id, tracker_id, tracker_version, t_start_ms, t_end_ms, score, modality, evidence_span_id) with an index on (game_id, tracker_id, build_id); step_timeline(session_id, step_id, t_enter_ms, t_exit_ms, outcome)"
  shallow: false
  mechanism: "The answers table is replaced by a long, narrow hits table; the chatbot's planner compiles questions into SQL over hits x step_timeline x primitives, not into reads of transcripts"
  example: "Forge Quest: 142 players hit crafting-menu-confusion in step 4; 58 of them (41%) never entered step 5, vs 12% of the 358 who did not hit it; both numbers with denominators in one query"
  cost: S
  depends_on: "convo-2 trackers; a step timeline from screen state (convo-16 or the memo's observation log)"
  part: store
  ingest_cost: S
  query_cost: S
  better_than_fixed_table: "Any tracker can be crossed with any step or build in SQL; the fixed table only knows the questions it was built with"

- id: convo-6
  title: "Moments: variable-length episodes cut by change-points in the primitives (silence>20 s after >120 wpm, sentiment drop >0.6 in 30 s, 3+ screen changes in 10 s), each with a 1-line auto title and a 30 s clip"
  level: L4
