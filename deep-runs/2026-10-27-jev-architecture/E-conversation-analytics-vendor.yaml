  object: "memo.md item 1: 'timestamped atomic observations across all videos of a session'"
  situation: "A producer asks 'what happened to the players who quit the tutorial?' and no tracker or question matches"
  consequence: "Atomic observations are too fine to read across 83 quitters; moments give 8-15 titled episodes per hour, so the model reads 83 x ~6 = 500 titles, not 83 transcripts, and returns 'in 51 of 83, the last moment is a silence-after-fail episode in step 4'"
  p_typical: 0.08
  grounded: inferred
  evidence: "spec.md: 'Long multi-video sessions' listed as a known problem"
  proposed: "moments(session_id, t_start_ms, t_end_ms, trigger_rule, title_text, sentiment_mean, step_id, clip_url); 8-15 per hour; title generated by the model from the moment's transcript + 2 frames"
  shallow: false
  mechanism: "Ingestion adds a change-point detector over the 10 s primitive rows, cuts episodes at detected boundaries and asks the model to title each one; moments are the unit the query path reads when no closed field applies"
  example: "Studio asks why tutorial churn rose; the chatbot groups the last moment of 83 quitters by title: 'repeated failed craft attempt' 31, 'inventory full, no prompt' 14, 'silence on map screen' 9"
  cost: M
  depends_on: "convo-1 primitives; video frames at ingestion (A-frame assumption)"
  part: ingestion
  ingest_cost: M
  query_cost: S
  better_than_fixed_table: "Unknown-unknown questions get a read over 500 titles instead of 500 transcripts; the fixed table has nothing for a question it did not anticipate"

