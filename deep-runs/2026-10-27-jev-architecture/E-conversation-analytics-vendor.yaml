  consequence: "A fully shared store blocks the deal; strict single-tenant blocks the library (convo-4). The split answers both: definitions (text) are shared in a library table, every data table has tenant_id first in its key and a row-level security policy, and benchmarks (convo-18) are aggregate-only with k>=5"
  p_typical: 0.07
  grounded: inferred
  evidence: "spec.md: 'Buyers are gaming studios' (no tenancy stated)"
  proposed: "All data tables keyed (tenant_id, game_id, session_id, ...); RLS policy tenant_id = current_setting('jev.tenant'); tracker_library has no tenant_id; shared embedding model, per-tenant ANN index"
  shallow: false
  mechanism: "Store and access control separate the two kinds of reuse: definitions move across tenants, data never does"
  example: "Studio 3 adopts library tracker 'cannot-find-{craft_station}' written originally by studio 7; studio 3's hits live only in its partition; the benchmark line shows the genre median, never studio 7's number"
  cost: M
  depends_on: nothing
  part: store
  ingest_cost: S
  query_cost: S
  better_than_fixed_table: "Makes cross-studio question reuse possible without cross-studio data exposure"

