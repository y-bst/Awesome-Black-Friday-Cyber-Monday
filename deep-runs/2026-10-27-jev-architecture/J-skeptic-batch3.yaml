- id: "cv-1"
  case: "Defer as a standalone build and fold it into the observation-log work the memo already commits to. memo.md item 1 already says 'Video frames add screen state and on-screen text', so a frame sampler is plumbing inside that step, not a new option; the leaf adds only a threshold choice (dHash distance > 10, 10 s cap). The worked example does not stand on cv-1 alone: 'dwell is computed from consecutive keyframe t_ms where screen_state=step-2' needs a screen_state column, and a keyframe row has no screen_state until a vision model or OCR labels it, which is the expensive and error-prone part that this option leaves out. The perceptual-hash gate is also tuned to cuts and UI swaps, and games break it both ways: a 3D scene with constant camera motion, particles or a skybox drifts past distance 10 on nearly every frame and keeps most of the 900 frames per video, while a slow tutorial dialogue or a held loading screen changes too little and is cut to the 10 s cap, so friction signals such as hovering, repeated failed clicks or short flashes of an error toast fall between samples at 1 fps. The 150-400 keyframes per video figure is asserted with no measurement, and one threshold will not carry across studios whose art styles differ, which spec.md says 'each game differs' for. Ingestion cost is explicitly 'not a concern' in spec.md, so the saving from sparsity buys little; a long-context multimodal model can take dense frames directly and decide what matters per game. The depends_on is 'nothing' and its evidence is only the owner's complaint about lost visual information, so it proves a need, not this gate. Accept it as a sub-step of the frame pipeline, validate the gate against hand-labelled sessions before committing to the threshold, and do not schedule it as a separate quarter item."
- id: "owner-16"
  case: "Defer, and fold it with designer-14 into one churn-contrast job. Both are variants of obs-3 and compute the same thing: split players by churn flag, rank columns by difference, show the top 10 or top 5. Building two is waste; the only difference is whether the columns are 'universal primitives and per-step columns' or per-step metrics only, which is a column-list choice rather than a design. The job is only as good as its inputs: its depends_on lists owner-2 and owner-31 tables plus a churn definition in the profile, none of which exist, so it cannot start next quarter and is bounded by their delivery. The deeper problem is statistical. Ranking dozens or hundreds of columns by churner-versus-retainer rate difference on a few hundred players is a multiple-comparisons exercise, and the 'top 10 with denominators' will be dominated by noise and by columns that are consequences of churn rather than causes: 'silence run >60s: 44% vs 12%' is largely what leaving looks like, and anything measured near the end of a recording separates quitters by construction because quitters' recordings end earlier. Without effect-size intervals, correction, and a time-ordering guard, the report makes confident, wrong 'why they churn' claims, which breaks the requirement that answers be correct. Its evidence is the line 'The targets are mostly detecting churn in the tutorial and just after it' from spec.md, which supports that churn matters, not that an automatic ranker is the right instrument. A studio that gets a 10-row table of correlations will ask 'is that real' next, and the planner in memo.md item 2 already handles that follow-up as a closed-field aggregate once the columns exist. The tables are the work; the contrast is a few lines of SQL on top and can wait until the tables and a churn definition are validated."
- id: "designer-14"
  case: "Fold into owner-16 (or the reverse) and reject as a separate build. Both declare variants_of obs-3, both are a no-model SQL contrast between quitters and completers, and both quote the same line from spec.md ('The targets are mostly detecting churn in the tutorial and just after it'). This version is the narrower one: only per-step metrics, top 5, so it is a strict subset of owner-16's column set. It also depends on designer-1, designer-2 and designer-7, three unbuilt tables, which means it is blocked on work that has not been scoped and cannot show value next quarter. The statistical objections apply with full force: the example 'step 3 wrong_action opened_other_menu 61% vs 19%' compares group rates with no interval, and ranking every per-step metric across every step multiplies the number of comparisons, so on 500 players the top 5 will often include chance differences. Step-level contrast also has a built-in confound: quitters never reach later steps, so 'step 5 fail_screen count 3.2 vs 1.1' compares populations with different exposure, and without conditioning on reaching the step the comparison is misleading, a survivorship problem the leaf does not mention. The claim that the fixed table has 'no mechanism to compare the other columns between churners and the rest' is not a real gap: comparing a column across a churn flag is a GROUP BY that the memo's closed-field aggregate path already performs for any question the designer can name, and the consequence says the designer 'guesses a step and asks one question at a time', which an interface suggestion could address without a new component. Keep one contrast routine, make it the owner-16 version, and spend the quarter on the tables both depend on."
- id: "clinical-16"
  case: "Fold into the step state-machine table (latency-15) and the churn-definition work, and do not build it as its own store next quarter. It is a variant of store-23 and overlaps latency-15 directly: one row per player with last_step_concept and last_ui_concept is a view over the per-player step rows plus the final observation, and a separate churn_event table creates a second source of truth that must be kept consistent with them. The decisive weakness is that its enum is not observable from what spec.md says is available. Classifying churn_type as quit_to_menu, rage_quit, idle_over_300s, uninstall_seen or recording_end_unexplained requires reliably detecting a rage quit, an uninstall, or the difference between a player who stopped playing and one whose recording was cut, from video capped at 15 minutes and a transcript the owner says is insufficient. 'Rage_quit' and 'uninstall_seen' are inference from tone and screen state that today's models will label inconsistently, so the headline column would be the least trustworthy one, and the example's '12 rage_quit with a negative affect era in the preceding 60 s' reads as precision the pipeline does not have. It also depends on clinical-5, an upstream option that is not built. The 'under 100 ms' latency claim is not a differentiator: any indexed table over 500 players answers in milliseconds, and spec.md only requires answers 'fast', so a per-player last-event lookup does not need a dedicated store to meet that. Studio questions about churn will be about the definition (quit within 10 minutes of tutorial end, versus within the session, versus not returning for a day), which is why the churn flag belongs in a versioned game profile that owner-16 and designer-14 share, not hard-coded in a table whose enum was chosen before any studio was asked. Build the step table and a profile-driven churn flag; revisit a dedicated churn_event table if real questions show the view is too slow or too lossy."
- id: "latency-15"
  case: "Defer behind the observation log and fold the table into it as a materialised view, not a separate build. Its own depends_on says it needs an 'observation log with step_on_screen transitions (frame pipeline or OCR)', so it can only be produced after the hardest, least proven part of the memo works, namely reliably extracting which tutorial step is on screen across 15-minute video boundaries. The state machine is a fold over those transitions and is only as accurate as the step labels, and the table hides label errors behind clean-looking columns such as outcome enum, retries and seconds_silent; a missed transition or a mislabelled step silently moves seconds between steps and the 'seconds > 300 then quit' list is wrong with no evidence span to catch it. The performance case is also weaker than stated: the 600k observation figure and the '~1-3 s cold' self-join are estimates, 500 players is a small dataset for any columnar or indexed store, and spec.md asks only that queries be 'fast' with a few seconds of budget, so a plain index on player, step and time over the observation log already meets the target and the 12 ms versus 1-3 s gap does not change what a studio experiences. It also assumes a tutorial with a linear list of numbered steps, which is the shape of the game the examples use; open-world, sandbox or branching onboarding has no clean step_id, and 'each game differs' per spec.md, so the schema would need to be redefined per game, the per-game hand-written work the frame says does not scale. It is contested by telem-8, which would derive the same per-step rows from game telemetry where that exists with exact timestamps instead of vision guesses. The idea is sound as a rollup and is what latency-1 builds on, but it should come after the log and be sized by measured query times, not be a next-quarter commitment."
