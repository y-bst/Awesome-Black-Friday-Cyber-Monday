- id: publisher-1
  title: "Common data model with a per-title vocabulary map: every title's tutorial steps are mapped at onboarding onto 6 canonical phase concepts (ONB.FIRST_INPUT, ONB.FIRST_FAIL, ONB.FIRST_REWARD, ONB.CORE_VERB_INTRO, ONB.FREE_CHOICE, ONB.TUTORIAL_EXIT) so that 'step-3 stall rate' is comparable across 12 titles with 4 to 11 steps each"
  level: L4
  cell: {part: schema-evolution, representation: common-data-model-with-per-game-vocab-map, granularity: tutorial-step, scope: cross-game, user-segment: publisher-portfolio, reuse-scope-of-extraction: universal-primitives, moment-in-journey: game-onboarding-day-0, mechanism-type: transfer-across-games}
  object: "spec.md step 3: 'a fixed set of questions with options, written per game target'"
  situation: "The publisher asks whether title B's stall at its step 'Craft a torch' is bad; title A has no crafting step, title C calls the same phase 'Forge'"
  consequence: "Per-game question wording makes the three titles incomparable; with a vocab map each game's local step names resolve to one canonical phase id and the stall rate per phase has the same denominator definition in all 12 titles"
  p_typical: 0.15
  grounded: quote
  evidence: "spec.md: 'written per game target'; B-perspectives clinical-data-abstraction-lead: 'a common data model with vocabulary mapping per site, which here means per game'"
  proposed: "vocab_map.yaml per title: local_step_name -> canonical_phase_id (6 phases) plus optional sub-step; observation log rows carry both local_step and canonical_phase columns"
  shallow: false
  part: store
  mechanism: "Observation log and answers table get two columns per step reference (local_step, canonical_phase); the canonical set is 6 phase ids owned by the publisher, the local set is free text owned by the studio"
  example: "Publisher asks 'Which of our 12 titles has the worst FIRST_FAIL stall rate?'; SQL groups by canonical_phase = ONB.FIRST_FAIL across titles and returns title B at 41% of 480 players vs portfolio median 22%"
  cost: M
  depends_on: "an onboarding step that captures the step list per title; 6 canonical phase definitions written once"
  ingest_cost: S
  query_cost: S
  better_than_fixed_table: "The fixed table has one column per game-specific question; this gives one column shared by all titles, so cross-title GROUP BY works at all"

