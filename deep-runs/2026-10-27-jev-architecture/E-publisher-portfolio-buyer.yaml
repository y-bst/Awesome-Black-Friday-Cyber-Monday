  object: "spec.md constraint: 'Answering a studio's question must be fast'; memo.md item 2: 'closed-field questions become aggregate queries over all players (instant)'"
  situation: "Portfolio insights director opens the Monday review with 12 titles and wants stall, completion, time-to-exit per phase for each, already ranked"
  consequence: "Without the cube every portfolio view is 12 x 15 x 6 = 1,080 aggregate queries at open time; with it one table scan of 1,080 rows renders in under 200 ms"
  p_typical: 0.12
  grounded: quote
  evidence: "memo.md: 'aggregate queries over all players (instant)'; B-perspectives publisher-portfolio-buyer: 'wants standard reports plus drill-down'"
  proposed: "benchmark_cube table with columns title_id, build_id, canonical_phase, metric_id, value, n_players, portfolio_p25, portfolio_p50, portfolio_p75, computed_at, schema_version"
  shallow: false
  part: store
  mechanism: "A scheduled job aggregates the per-session answers into one row per (title, build, phase, metric) and writes portfolio percentiles beside each value; the dashboard reads only this table"
  example: "Director asks 'Is title B's step-3 stall rate bad?'; the cube row (B, 1.4.2, ONB.FIRST_FAIL, stall_rate) reads 0.41 with portfolio p75 = 0.29, n = 480, so the answer is 'worst quartile' with no model call"
  cost: S
  depends_on: "publisher-1 canonical phases; a per-session answers table with the 15 metrics"
  ingest_cost: S
  query_cost: S
  better_than_fixed_table: "The fixed table is per video per game; the cube is per title per phase with the portfolio distribution attached, so 'is this bad' is one row read"

- id: publisher-3
  title: "Frozen 'portfolio 15' metric set: 15 metric definitions (stall_rate_per_phase, tutorial_completion, median_seconds_to_exit, restart_count, help_seek_rate, silence_over_60s_rate, negative_affect_rate, quit_in_tutorial, quit_within_10min_after, first_fail_recovery_rate, menu_time_share, input_error_rate, skip_rate, repeat_phase_rate, confusion_utterance_rate) with frozen SQL definitions and a version tag, which studios cannot edit"
