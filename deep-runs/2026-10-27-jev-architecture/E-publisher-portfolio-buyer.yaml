  depends_on: "publisher-1 canonical columns"
  ingest_cost: S
  query_cost: S
  better_than_fixed_table: "The fixed table's questions differ per game; the 15 metrics are the same SQL for every title, so a number from title A and a number from title B mean the same thing"

- id: publisher-4
  title: "REFUSED: letting a studio rewrite core metric questions at runtime through the chatbot ('from now on count stall from 45 s'); the publisher persona will not buy a product where studio-written-at-runtime questions can alter a benchmarked field"
  level: L3
