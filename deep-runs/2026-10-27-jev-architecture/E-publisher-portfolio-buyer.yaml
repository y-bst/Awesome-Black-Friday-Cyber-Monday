  object: "memo.md item 2: 'genuinely new questions trigger a one-time batch extraction over all sessions whose result is cached as a new field'"
  situation: "A designer at one of 12 titles types a redefinition of a core field into the chatbot and the backfill overwrites the column used in the portfolio cube"
  consequence: "Low willingness: the director's quarterly deck now compares 11 titles on one definition and 1 on another; the persona would drop the vendor over this, so runtime rewrites must land in a studio-local namespace (studio_fields.*) and never in portfolio_metrics_v1"
  p_typical: 0.05
  grounded: inferred
  evidence: "B-perspectives publisher-portfolio-buyer: 'per-studio bespoke questions destroy comparability'; memo.md: 'cached as a new field'"
  proposed: "Planner routes any question that names a core metric id with a changed threshold to a new studio_fields column and appends '(studio-local definition)' to the answer"
  shallow: false
  part: query
  mechanism: "A namespace rule in the planner: writes from chatbot-triggered backfills go only to studio_fields.*; portfolio_metrics.* is read-only outside the publisher admin role"
  example: "Title B's designer asks for a 45 s stall; the chatbot creates studio_fields.stall_45s for title B only and answers from it, while the portfolio cube keeps stall_rate at 90 s"
  cost: S
  depends_on: "publisher-3 frozen core"
  ingest_cost: S
  query_cost: S
  better_than_fixed_table: "The fixed table has no notion of who may change a column; the namespace rule makes 'who changed this number' answerable"

- id: publisher-5
  title: "Two-layer question bank: a publisher core layer (the 15 metrics plus 40 canonical-phase questions, identical for all titles) and a studio extension layer (unbounded, per title), with the chatbot labelling every answer 'core' or 'studio-local'"
  level: L4
