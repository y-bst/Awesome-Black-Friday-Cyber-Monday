  evidence: "memo.md: 'the question set grows from real use'; B-perspectives publisher-portfolio-buyer: 'per-studio bespoke questions destroy comparability'"
  proposed: "portfolio_metrics_v1.yaml with 15 entries (id, SQL over the observation log, denominator rule, unit); write access restricted to the publisher tenant admin role"
