  evidence: "memo.md: 'pruned by the game target'; B-perspectives conversation-analytics-vendor: 'universal pre-extracted primitives ... computed for every call regardless of tenant'"
  proposed: "questions table gets a layer column (core | studio) and an owner column (publisher | title_id); the ontology generator writes studio-layer rows only"
  shallow: false
  part: question-generation
  mechanism: "Question records carry layer and owner; core-layer questions are instantiated for every title from the canonical phases, studio-layer questions come from the memo's ontology pruned per game"
  example: "Title C asks 'how many players failed the Forge step twice?'; the answer '71 of 410 (studio-local)' sits next to 'FIRST_FAIL repeat_phase_rate 17% (core, portfolio p50 = 12%)'"
  cost: M
  depends_on: "publisher-1, publisher-3"
  ingest_cost: M
  query_cost: S
  better_than_fixed_table: "The fixed table is all studio-local; the core layer gives every title 55 shared questions on day 0 and keeps them unpruned"

