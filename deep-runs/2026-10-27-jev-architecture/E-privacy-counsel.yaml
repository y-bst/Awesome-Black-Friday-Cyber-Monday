  willingness: high
  p_typical: 0.05
  grounded: quote
  evidence: 'spec: "whether game telemetry is joined" is unspecified'
  proposed: Telemetry ingest API with a field denylist enforced by schema validation
  shallow: false

- id: privacy-34
  title: Public reviews and community posts may seed question templates but are never linked to individual playtesters; the mining job stores topics, not authors
  level: L4
  part: question-generation
  cell: {part: question-generation, question-origin: public-reviews-and-community-mining, reuse-scope-of-extraction: game-specific, moment-in-journey: pre-launch-greenlight, scope: all-players, mechanism-type: auto-discover-without-question, effort: XS-days}
  object: memo item 3 question generation; spec problem "The question set is small"
  situation: Seeding questions for a game with a public beta or a predecessor title with reviews
  mechanism: >-
    Mining job ingests review text and forum threads, outputs topic phrases with frequency ("tutorial too long", 212
    mentions) and discards author handles, user ids and post URLs at the boundary. Topics become candidate closed fields
    for the game. No attempt is made to match review authors to playtesters.
  example: >-
    Predecessor's reviews mention "the tutorial does not explain crafting" 212 times; generator adds field
    crafting_explained_understood; first cohort answers 33/500 did not understand crafting at the tutorial bench.
  consequence: Public data sharpens the question set; the pipeline cannot be used to find a playtester's public posts
  better_than_fixed_table: The fixed set did not use public signal; this grows the set from public topics with no author linkage
  ingest_cost: S
  query_cost: S
  cost: S
  depends_on: ontology generator accepting candidate fields
  willingness: high
  p_typical: 0.03
  grounded: quote
  evidence: 'spec: "The question set is small, so most of what is in the video and transcript is never captured"'
  proposed: Mining job output schema has no author column by design
  shallow: false
