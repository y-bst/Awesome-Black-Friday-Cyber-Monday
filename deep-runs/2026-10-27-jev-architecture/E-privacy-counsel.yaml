- id: privacy-1
  title: Observation log stores each quote as a 15-word-max redacted snippet with t0/t1; raw transcript deleted 30 days after extraction unless the studio contract extends it
  level: L4
  part: ingestion
  cell: {part: ingestion-extraction, representation: timestamped-observation-log, modality: speech-transcript, evidence-form: quote-with-timestamp, granularity: utterance, tenancy-and-deployment: logically-isolated-per-studio, mechanism-type: precompute-more}
  object: memo item 1 "quote with timestamp as evidence"; spec "Each video is converted to a transcript"
  situation: Every observation row that cites speech; the transcript file itself after extraction has completed
  mechanism: >-
    At ingestion each observation row gets quote_snippet (max 15 words, post-redaction), quote_t0, quote_t1, quote_hash
    (sha256 of the full utterance) and the session gets transcript_retained_until = ingest_date + 30 days. A nightly job
    deletes transcripts past that date; observation rows and snippets stay. Full utterance is reconstructable only while
    the transcript exists.
  example: >-
    Studio asks "How many players said the crafting tutorial step was confusing?" Planner runs count over
    friction_signal = 'confusion' AND step = 'crafting' across 500 players: 12/500, with 12 snippets such as
    "no idea what this bench does" at 00:14:07; no transcript is read, and the answer is identical after day 30.
  consequence: >-
    Studio gets counts with verbatim evidence; speech retained long-term is reduced to the snippets the extractor chose.
    A question needing full utterances on sessions older than 30 days returns a coverage statement instead of a quote.
  better_than_fixed_table: The fixed table stores no evidence at all; this stores evidence while holding less speech than keeping transcripts
  ingest_cost: S
  query_cost: S
  cost: S
  depends_on: observation log (memo item 1)
  willingness: high
  p_typical: 0.15
  grounded: quote
  evidence: 'memo: "quote with timestamp as evidence"'
  proposed: Add quote_snippet, quote_hash, transcript_retained_until to the observation schema; nightly deletion job
  shallow: false

- id: privacy-2
  title: PII redaction pass on the transcript before any model sees it; names, emails, phones, addresses and third-party handles become typed placeholders with a per-studio encrypted map
  level: L4
  part: ingestion
  cell: {part: ingestion-extraction, modality: speech-transcript, extraction-trigger: at-ingestion, granularity: utterance, mechanism-type: change-data-at-source, effort: S-weeks, build-or-buy: open-source-component}
  object: spec stage 2 "Each video is converted to a transcript"; stage 3 "The transcript is run through a fixed set of questions"
  situation: Between transcription and extraction, for every video of every session
  mechanism: >-
    NER plus regex (email, phone, postal address, 8-plus-digit numbers) over the transcript; each hit replaced by a typed
    placeholder [NAME_1], [EMAIL_1], [HANDLE_2] stable within a session; the mapping encrypted with the studio key and kept
    14 days for correction, then destroyed. Extraction prompts see only placeholders.
  example: >-
    Player says "my brother Tom said this tutorial sucks, text me on 07700 900123". Observation row: sentiment = negative,
    step = tutorial-2, quote "[NAME_1] said this tutorial sucks". Studio question "What did players say about the tutorial?"
    returns the quote without the name or number.
  consequence: Extraction vendor and the chatbot never receive identifiers; a redaction false positive turns a game term (a character named "Tom") into [NAME_1], so the game's own name list is an allowlist
  better_than_fixed_table: Fixed table also sends unredacted transcript to the model; this removes identifiers before any model call
  ingest_cost: S
  query_cost: S
  cost: S
  depends_on: per-game allowlist of character and item names (available from onboarding)
  willingness: high
  p_typical: 0.22
  grounded: inferred
  evidence: 'spec: "Each video is converted to a transcript"'
  proposed: Run redaction as a separate stage with its own accuracy metric (measured on 50 hand-labelled transcripts)
  shallow: false

- id: privacy-3
  title: Frame OCR runs only inside a per-game viewport mask; OS notifications, overlay chat and browser tabs are cropped out before any text is stored
  level: L4
  part: ingestion
  cell: {part: frame-pipeline, modality: on-screen-text-ocr, granularity: frame, extraction-trigger: at-ingestion, moment-in-journey: game-onboarding-day-0, mechanism-type: change-data-at-source, subject-domain: ui-navigation}
  object: memo item 1 "Video frames add screen state and on-screen text"
  situation: Every sampled frame (1 per 2 seconds) before OCR and screen-state classification
  mechanism: >-
    At game onboarding, 5 calibration frames define a viewport polygon and an exclusion list (top-right notification area,
    Discord/Steam overlay regions, taskbar). OCR runs on the masked region only; text detected outside is discarded in
    memory and never written. Mask stored per game and build version.
  example: >-
    Studio asks "At which tutorial step do players first open the settings menu?" Screen-state classifier over masked
    frames answers step 3 for 61/500 players; a Discord popup reading "Mum: dinner in 10" on 9 frames never enters the store.
  consequence: Non-game text (private messages, other apps) is excluded by construction; game UI that moves outside the mask on a new build is missed until the mask is recalibrated
  better_than_fixed_table: Fixed table has no frames at all; this adds screen state while excluding the most privacy-sensitive on-screen content
  ingest_cost: S
  query_cost: S
  cost: S
  depends_on: frame pipeline (memo item 1)
  willingness: high
  p_typical: 0.08
  grounded: quote
  evidence: 'memo: "Video frames add screen state and on-screen text"'
  proposed: Store mask_version on every frame-derived observation so mask bugs can be traced
  shallow: false

- id: privacy-4
  title: Refuse webcam face and posture as an affect source; answer "how did players feel" from utterance classification, silence gaps and a one-tap micro-survey at step end
  level: L3
  part: ingestion
  cell: {part: collection-protocol, modality: webcam-face-and-posture, question-type: how-felt, subject-domain: player-affect, representation: time-series-signals-affect-pace-silence, mechanism-type: change-data-at-source, effort: XS-days}
  object: memo item 1 "friction signal, sentiment"; spec unspecified "What a transcript contains"
  situation: When the collection protocol is extended to answer how-felt questions with higher confidence
  mechanism: >-
    Webcam capture is not added. Affect per tutorial step = agreement of 3 signals: utterance sentiment class,
    silence ratio over the step (seconds silent / step seconds), and a 1-tap in-game prompt ("how was that? 1-5") at
    step end. Stored per step, not per utterance.
  example: >-
    Studio asks "Did players feel frustrated at the boss tutorial?" Answer: 88/500 players had 2 of 3 signals negative at
    that step (silence ratio over 0.7, sentiment negative, prompt 1-2), with 5 quote snippets.
  consequence: >-
    REFUSED option: facial expression and posture analysis is biometric and emotion-inference processing (GDPR Art. 9,
    EU AI Act emotion-recognition limits, BIPA in Illinois); consent per playtester plus retention rules would be needed
    for marginal accuracy. The three-signal substitute keeps the question answerable.
  better_than_fixed_table: Fixed table has one sentiment MCQ per video; this gives per-step affect from three sources with no biometric data
  ingest_cost: S
  query_cost: S
  cost: S
  depends_on: micro-survey prompt in the capture client (collection protocol)
  willingness: low
  p_typical: 0.06
  grounded: inferred
  evidence: 'memo: "friction signal, sentiment, quote with timestamp"'
  proposed: Write "no webcam, no voice biometrics" into the playtester consent notice and the studio DPA
  shallow: false

- id: privacy-5
  title: Refuse voiceprint speaker identification for stitching 15-minute videos into a session; stitch by capture-tool session_id plus video index, and persist only a speaker count per video
  level: L4
  part: ingestion
  cell: {part: session-stitching, modality: audio-non-speech, granularity: session, representation: timestamped-observation-log, mechanism-type: change-data-at-source, effort: XS-days, subject-domain: onboarding-tutorial}
  object: spec stage 1 "each video is capped at 15 minutes, so one session is many videos"; spec unspecified "how videos of one session are linked"
  situation: Linking n videos to one session and one player when the capture tool emits them separately
  mechanism: >-
    Capture client writes session_id, video_index (0..n), wall-clock start into each file's sidecar; stitching joins on
    those. Diarisation runs per video only to produce speaker_count and primary-speaker segments; speaker embeddings are
    discarded after the video is processed and never compared across videos or players.
  example: >-
    Studio asks "How long did players spend in the tutorial over their whole session?" Stitcher joins 8 videos by
    session_id, sums step durations across video boundaries: median 23 min, 500/500 sessions linked; no voice matching used.
  consequence: REFUSED option (voiceprints are biometric identifiers); if a sidecar is missing the session is flagged unlinked rather than voice-matched, and the coverage statement says so
  better_than_fixed_table: Fixed table is per video with no session key at all; this gives session-level answers without biometric linking
  ingest_cost: S
  query_cost: S
  cost: S
  depends_on: capture client writing a sidecar (collection protocol)
  willingness: low
  p_typical: 0.04
  grounded: quote
  evidence: 'spec: "how videos of one session are linked" is unspecified'
  proposed: Add session_id, video_index, linked_by to the session table; alert when linked_by is empty for more than 2% of sessions
  shallow: false

- id: privacy-6
  title: Age band from recruitment drives a restricted mode per session; under-18 sessions keep paraphrased quotes only, no clips, 14-day raw retention, and count only when cohort k is 10 or more
  level: L4
  part: ingestion
  cell: {part: collection-protocol, modality: player-profile-metadata, evidence-form: coverage-statement-n-of-m-players, scope: cohort, uncertainty-policy: abstain-below-coverage, user-segment: ux-researcher, granularity: player}
  object: memo item 1 observation fields; spec "Buyers are gaming studios" (teen-rated titles recruit minors)
  situation: Any session whose player-profile metadata carries age_band 13-15 or 16-17
  mechanism: >-
    Recruitment passes age_band (13-15, 16-17, 18+) into player metadata. restricted = age_band != '18+'. For restricted
    sessions the extractor writes quote_paraphrase instead of quote_snippet, clip_allowed = false, raw retention 14 days,
    and the planner includes them in counts only when the matching restricted cohort has k >= 10.
  example: >-
    Studio asks "Show me 5 clips of players failing the jump tutorial." Answer returns 5 clips from 18+ sessions and the
    line "3 further matching sessions are restricted (under 18) and excluded from clips; included in the 41/500 count."
  consequence: Teen playtesters' speech and image are never shown to studio staff; a cohort of 7 restricted players answers only at aggregate level with abstention on small splits
  better_than_fixed_table: Fixed table cannot distinguish evidence forms by player; this makes minors' data usable for counts without exposing them
  ingest_cost: S
  query_cost: S
  cost: M
  depends_on: age band collected at recruitment; clip evidence feature
  willingness: high
  p_typical: 0.12
  grounded: inferred
  evidence: none
  proposed: Add age_band and restricted to player metadata; planner checks restricted before any clip or quote
  shallow: false

- id: privacy-7
  title: Planner abstains on any count whose matching cohort is below 5 players and on any contrast where either side is below 5
  level: L4
  part: query
  cell: {part: query-path, query-path: sql-over-closed-fields, uncertainty-policy: abstain-below-coverage, evidence-form: count-with-denominator, scope: query-time-defined-cohort, question-type: how-many, latency-tier: under-2s}
  object: memo item 2 "closed-field questions become aggregate queries over all players (instant)"
  situation: Every aggregate or contrast query after filters are applied
  mechanism: >-
    After the WHERE clause, the planner computes n_match; if n_match < k (default 5, studio-configurable 5-10) it
    returns "fewer than k players match; widen the cohort" with no number. For automatic contrast, both the churned and
    retained side must have n >= k. The threshold is logged with the query.
  example: >-
    Studio asks "How many 16-17 year old controller players quit at tutorial step 4?" n_match = 3, so the chatbot answers
    "fewer than 5 players match" and offers "all controller players at step 4: 29/212".
  consequence: Small cohorts cannot be used to single out one playtester by narrowing filters; the studio loses answers on very small cohorts
  better_than_fixed_table: The fixed table lets the chatbot report n = 1 as a fact; this prevents re-identification by filter narrowing
  ingest_cost: S
  query_cost: S
  cost: S
  depends_on: query planner (memo item 2)
  willingness: high
  p_typical: 0.07
  grounded: quote
  evidence: 'memo: "aggregate queries over all players (instant)"'
  proposed: One check function in the planner; unit test with n = 4 and n = 5
  shallow: false

- id: privacy-8
  title: find-players-who answers return per-studio pseudonyms only; re-identification happens in the studio's own table, never in JEV
  level: L4
  part: query
  cell: {part: query-path, question-type: find-players-who, evidence-form: per-player-list, tenancy-and-deployment: logically-isolated-per-studio, delivery-surface: chatbot, user-segment: studio-analyst, granularity: player}
  object: memo item 2 "retrieve matching observation rows across players"; B-perspectives ediscovery note on "find all players who X"
  situation: Any question whose answer is a list of players
  mechanism: >-
    Player identity in JEV is pseudonym = HMAC(studio_key, studio_player_id). Lists are returned as pseudonym plus the
    matching observation (step, timestamp, snippet). The studio keeps the pseudonym-to-player mapping; JEV never stores
    email, name or platform account id.
  example: >-
    Studio asks "Which players quit during the tutorial and never returned?" Answer: 41 rows of (P-7f3a2c.., last_step = 4,
    t = 00:21:15, snippet) as a downloadable CSV; the studio joins P-7f3a2c.. to its own recruitment table.
  consequence: A leak of JEV's store exposes no directly identifying data; a studio analyst who wants to contact players needs their own join, which is one extra step
  better_than_fixed_table: Fixed table is keyed by whatever id the capture tool emitted; this makes every per-player output pseudonymous by default
  ingest_cost: S
  query_cost: S
  cost: S
  depends_on: per-studio HMAC key (privacy-9)
  willingness: high
  p_typical: 0.09
  grounded: inferred
  evidence: 'memo: "retrieve matching observation rows across players"'
  proposed: Return pseudonym lists as CSV with the column named studio_pseudonym
  shallow: false

- id: privacy-9
  title: Per-studio HMAC pseudonymisation of player ids at ingestion with the key in a studio-scoped KMS; destroying the key is crypto-erasure of the studio's whole store
  level: L4
  part: store
  cell: {part: tenancy-access-control, tenancy-and-deployment: logically-isolated-per-studio, granularity: player, build-or-buy: managed-cloud-service, delivery-surface: warehouse-share-or-export, effort: S-weeks, mechanism-type: precompute-more}
  object: spec stage 4 "a question over, say, 500 players"; memo item 1 session-level observation log
  situation: At the first write of any session for a studio, and at contract termination
  mechanism: >-
    player_pseudonym = HMAC-SHA256(studio_kms_key, raw_player_id); the raw id is dropped before the observation log is
    written. Export uses the same pseudonym so the studio can join. On termination the KMS key is scheduled for deletion
    (7-day window), after which no row can be linked to a player even if the store is retained for aggregates.
  example: >-
    Studio asks "How many of last month's 500 playtesters churned in the tutorial, and send me the list." Count 41/500 plus
    41 pseudonyms; after the contract ends the studio deletes its key and the 41 rows become unlinkable.
  consequence: Linking across studios is impossible by construction (different keys); a studio that loses its key loses the ability to join exports
  better_than_fixed_table: The fixed table carries whatever id arrived; this gives a defined, revocable identity boundary per tenant
  ingest_cost: S
  query_cost: S
  cost: S
  depends_on: nothing
  willingness: high
  p_typical: 0.14
  grounded: inferred
  evidence: 'spec: "a question over, say, 500 players"'
  proposed: One KMS key per studio; key_version stored on every session row
  shallow: false

- id: privacy-10
  title: Retention tiers (raw video 30 d, transcript 90 d, observation log 24 mo, aggregates indefinite) with a per-session reextractable_until, so lazy backfill reports which sessions can no longer be re-processed
  level: L4
  part: store
  cell: {part: cost-governance, query-path: lazy-backfill-extraction, extraction-trigger: on-new-field-added, schema-evolution: lazy-backfill-on-demand, evidence-form: coverage-statement-n-of-m-players, latency-tier: minutes, mechanism-type: defer-to-query-time}
  object: A-frame assumption "original videos remain available for re-processing, including frames"; memo item 2 "one-time batch extraction over all sessions"
  situation: A genuinely new question arrives for a game whose sessions span more than 30 days
  mechanism: >-
    Session row carries raw_until, transcript_until, reextractable_until = max(raw_until, transcript_until). Backfill
    selects only sessions with reextractable_until > now; the new field is written as null with reason = 'expired' for the
    rest; the planner's coverage line reports n extracted / m total / e expired.
  example: >-
    Nine months in, the studio asks "Did players read the tooltip at tutorial step 2 before moving on?" Backfill runs over
    the 140/500 sessions still within transcript retention: "62/140 read it; 360 sessions could not be re-processed
    (raw and transcript expired)."
  consequence: This contradicts the frame assumption that video is always available; the trade is a bounded retention of playtester footage against lower coverage for late questions, and the studio can buy longer retention per contract
  better_than_fixed_table: The fixed table silently has no answer for new questions; this answers with explicit coverage and a known retention policy
  ingest_cost: S
  query_cost: M
  cost: S
  depends_on: lazy backfill (memo item 2)
  willingness: high
  p_typical: 0.08
  grounded: inferred
  evidence: 'A-frame: "original videos remain available for re-processing"'
  proposed: Make retention days a per-studio contract field with defaults 30/90/730
  shallow: false

- id: privacy-11
  title: Purpose gate on backfill; a new question is classified against the purposes in the playtester consent notice and questions about the players themselves are blocked or escalated
  level: L4
  part: query
  cell: {part: query-path, question-type: outside-game-target, query-path: lazy-backfill-extraction, uncertainty-policy: escalate-to-human-analyst, mechanism-type: narrow-or-clarify-the-question, user-segment: jev-internal-ops, moment-in-journey: steady-state-weekly}
  object: memo item 2 "genuinely new questions trigger a one-time batch extraction over all sessions"
  situation: Before any batch extraction over sessions is launched for a question not already in the field set
  mechanism: >-
    Consent notice enumerates purposes (tutorial usability, difficulty, bugs, UI, narrative comprehension). A classifier
    maps the question to a purpose or to 'about-the-person' (age, location, health, identity, other products, income).
    Purpose match runs; about-the-person is blocked with a logged reason; ambiguous goes to a JEV ops reviewer within 1
    business day.
  example: >-
    "Which tutorial churners sound like they are under 13?" is blocked ("infers a protected attribute about players").
    "Which tutorial churners mention a competitor's game?" is escalated; "At which step do churners stop talking?" runs.
  consequence: Studios cannot turn the backfill engine into a profiling tool; some legitimate questions wait a day for review
  better_than_fixed_table: The fixed table had a hand-reviewed question set; this keeps a review step while letting the set grow
  ingest_cost: S
  query_cost: S
  cost: S
  depends_on: lazy backfill; consent notice with enumerated purposes
  willingness: high
  p_typical: 0.05
  grounded: quote
  evidence: 'memo: "genuinely new questions trigger a one-time batch extraction"'
  proposed: Store purpose_tag on every field so the records of processing can list fields by purpose
  shallow: false

- id: privacy-12
  title: Ontology pruning removes prohibited dimensions (health, religion, ethnicity, sexuality, politics, finances, inferred disability) and tags every generated question with a data category
  level: L4
  part: question-generation
  cell: {part: question-generation, question-origin: ontology-generated, subject-domain: accessibility, mechanism-type: narrow-or-clarify-the-question, granularity: game, moment-in-journey: game-onboarding-day-0, effort: XS-days}
  object: memo item 3 "Questions are generated from an ontology (entities x dimensions x outcomes), pruned by the game target"
  situation: The prune step of question generation, for every game
  mechanism: >-
    A denylist of dimensions is applied before the game-target prune. Each surviving question gets data_category in
    {gameplay, ui, speech-opinion, affect-step-level, technical}. Accessibility questions are allowed only in the form
    "did the player use option X" (observed UI action), never "does the player have condition Y".
  example: >-
    Generated question "Did the player mention a disability when stalling at tutorial step 3?" is dropped; "Did the
    player open the text-size option before step 3?" is kept with data_category = ui. Studio asking about churn at step 3
    gets the second as a closed field: 18/500.
  consequence: No special-category inference is ever a stored field; a studio that wants accessibility insight gets it as observed UI behaviour
  better_than_fixed_table: The fixed hand-written set had no category tags; this makes every field auditable by data category
  ingest_cost: S
  query_cost: S
  cost: S
  depends_on: ontology question generation (memo item 3)
  willingness: high
  p_typical: 0.06
  grounded: quote
  evidence: 'memo: "pruned by the game target"'
  proposed: Denylist as a versioned YAML file; unit test that no generated question lacks data_category
  shallow: false

- id: privacy-13
  title: Refuse topic clustering over all player speech; cluster only observation rows already tagged with a game entity, so off-game speech is never mined for unknown unknowns
  level: L4
  part: question-generation
  cell: {part: question-generation, question-origin: emergent-topic-clustering-of-player-speech, representation: transcript-chunks-with-embeddings, modality: speech-transcript, mechanism-type: auto-discover-without-question, question-type: what-surprised-unknown-unknowns, scope: all-players}
  object: memo item 1 observation fields "step on screen, action, utterance"; spec problem "most of what is in the video and transcript is never captured"
  situation: When the system proposes new questions by clustering what players said
  mechanism: >-
    Clustering input = observation rows where step or mechanic or ui_element is non-null (speech aligned to a game
    entity). Rows with no game entity (phone calls, household talk, other apps) are excluded from embeddings; those
    utterances are stored only as silence/off-task markers (duration, no text).
  example: >-
    Studio asks "What surprised players in the tutorial that we did not ask about?" Clustering over 3,100 tagged rows gives
    4 themes (inventory icon confusion, camera inversion, skip-prompt ignored, loot comparison); 420 off-game utterances
    were never embedded.
  consequence: REFUSED variant (embed everything) would build a searchable index of playtesters' private talk; the tagged-only variant still discovers in-game themes
  better_than_fixed_table: The fixed table cannot surface anything it did not ask; this surfaces new in-game themes while leaving private speech unindexed
  ingest_cost: M
  query_cost: S
  cost: M
  depends_on: entity alignment of utterances at ingestion
  willingness: low
  p_typical: 0.04
  grounded: quote
  evidence: 'spec: "most of what is in the video and transcript is never captured"'
  proposed: Store off_task_seconds per video instead of off-task text
  shallow: false

- id: privacy-14
  title: Every observation row records model vendor, version, region and zero-data-retention contract id; ingestion refuses a vendor without a ZDR flag
  level: L4
  part: ingestion
  cell: {part: ingestion-extraction, evidence-form: extraction-provenance-model-and-schema-version, build-or-buy: managed-cloud-service, tenancy-and-deployment: logically-isolated-per-studio, schema-evolution: append-only-versioned-fields, user-segment: studio-data-engineer, extraction-trigger: at-ingestion}
  object: A-frame assumption "a modern long-context multimodal model is available at ingestion"; B-perspectives studio-security-reviewer "which model vendor sees frames and audio"
  situation: Every model call at ingestion and at query time that receives transcript text or frames
  mechanism: >-
    Vendor registry with fields vendor, model, region, zdr_contract_id, training_opt_out = true, dpa_date. Extraction
    writes model_vendor, model_version, region, zdr_contract_id onto each row. A call to a vendor whose registry entry
    lacks zdr_contract_id fails closed. The studio dashboard lists vendors that touched its data.
  example: >-
    Studio asks "How many players quit before tutorial step 3?" Answer 41/500 carries provenance "extracted by vendor A
    model v3, EU region, ZDR contract 2026-04" so the studio's vendor-risk review can accept the number.
  consequence: A model upgrade to a vendor without ZDR cannot be deployed by accident; sub-processor disclosure to studios is generated from the registry
  better_than_fixed_table: The fixed table has no provenance; this makes every answer traceable to a contract and a model version
  ingest_cost: S
  query_cost: S
  cost: S
  depends_on: nothing
  willingness: high
  p_typical: 0.11
  grounded: inferred
  evidence: 'A-frame: "a modern long-context multimodal model is available at ingestion"'
  proposed: Vendor registry as a table; fail-closed check in the ingestion client
  shallow: false

- id: privacy-15
  title: Clip and frame embeddings go to a third-party video API only after the viewport mask and webcam-PiP check pass; otherwise an open-source embedding model inside the JEV VPC
  level: L4
  part: ingestion
  cell: {part: frame-pipeline, representation: clip-or-frame-embeddings, build-or-buy: third-party-video-understanding-api, query-path: query-by-example-clip, modality: frame-embeddings, tenancy-and-deployment: studio-vpc-or-on-prem, effort: M-one-quarter}
  object: B-perspectives video-understanding-search-engineer "time-coded multimodal clip embeddings"; memo item 1 "Video frames add screen state"
  situation: Choosing where clip embeddings are computed for query-by-example
  mechanism: >-
    Per clip: if mask_applied and no picture-in-picture camera region detected and studio flag external_video_api = true,
    send to the external API; else compute with an in-VPC open model. embedding_source stored per clip. Studios under NDA
    footage default to external_video_api = false.
  example: >-
    Designer drops a 10 s clip of a player wandering off the tutorial path and asks "find moments like this". 37 matches
    across 500 players from in-VPC embeddings; no frame left the JEV account.
  consequence: "REFUSED by default (low willingness) for the external API: pre-release frames plus any residual face region at a sub-processor is the studio's top leak risk; in-VPC costs more GPU at ingestion, which the spec says is acceptable"
  better_than_fixed_table: The fixed table has no visual search; this adds it with a per-studio control on where frames go
  ingest_cost: L
  query_cost: S
  cost: M
  depends_on: frame pipeline with viewport mask (privacy-3)
  willingness: low
  p_typical: 0.05
  grounded: inferred
  evidence: 'spec: "Ingestion time and cost are not a concern"'
  proposed: Default external_video_api = false; flip per studio after DPA sub-processor sign-off
