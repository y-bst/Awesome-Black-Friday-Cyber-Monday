- id: privacy-33
  title: Telemetry join happens on the studio side via pseudonym; JEV ingests telemetry only as session-scoped events with no platform account id, device id or IP
  level: L4
  part: ingestion
  cell: {part: export-integration, modality: game-telemetry, tenancy-and-deployment: federated-query-into-studio-warehouse, granularity: session, user-segment: studio-data-engineer, scope: query-time-defined-cohort, effort: S-weeks}
  object: spec unspecified "whether game telemetry is joined"; B-perspectives telemetry-data-scientist "joining video observations to events"
  situation: A studio wants telemetry (step_completed events, deaths, purchases) combined with video observations
  mechanism: >-
    Two paths. Federated: JEV exports pseudonymous observations and the studio joins in its warehouse. Ingested: the
    studio sends telemetry already keyed by the JEV pseudonym and session_id, with an allowlist of event names; any field
    named account_id, device_id, ip, email is rejected at the API boundary.
  example: >-
    Studio asks "Do players who the video shows stalling at tutorial step 2 also show 3 or more deaths in telemetry?"
    Ingested path: 31/500 stall at step 2 (video), of whom 19 have deaths >= 3 (telemetry), joined on pseudonym.
  consequence: Combining video and telemetry raises identifiability; keeping identifiers out of JEV keeps the join useful without making JEV a second identity store
  better_than_fixed_table: The fixed table has no telemetry; this adds it with the identifiers kept at the studio
