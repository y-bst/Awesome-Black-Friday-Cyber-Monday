- id: vidsearch-8
  title: Cross-player temporal alignment to a canonical tutorial timeline by DTW over shot-embedding sequences (reference
    = medoid session), yielding per-player step boundaries and dwell without a screen classifier or a hand-written step list
  level: L4
  cell:
    part: session-stitching
    representation: step-funnel-state-machine-per-player
    granularity: tutorial-step
    question-origin: induced-from-data
    extraction-trigger: on-cohort-size-threshold
    subject-domain: onboarding-tutorial
    effort: S-weeks
    mechanism-type: auto-discover-without-question
  object: 'spec.md step 3: ''The targets are mostly detecting churn in the tutorial and just after it'''
  situation: 50 sessions of a new game are in; step boundaries are needed to compute drop-off but the studio has not provided
    a step list
  consequence: A canonical timeline with 8-15 segments emerges from the data; each player's session is warped onto it, giving
    enter and exit times per segment for all 500 players
  p_typical: 0.05
  grounded: quote
  evidence: 'spec.md: ''The targets are mostly detecting churn in the tutorial and just after it.'''
  proposed: alignment(session_id, canonical_segment_id, t_enter_ms, t_exit_ms, warp_cost); canonical segments are change-points
    in the medoid session's embedding sequence, named later by one human from thumbnails
  shallow: false
  part: ingestion
  mechanism: Pick the medoid of the first 50 sessions' first-30-minute embedding sequences; segment it by change-point detection;
    DTW every session against it with a Sakoe-Chiba band of 20%; segments with warp_cost over the 90th percentile are flagged
    'off-path'
  example: '''Where do players fall off the tutorial?'' at day 3 with 50 sessions: drop-off per canonical segment, segment
    5 loses 31% of players; 7 ''off-path'' players shown as clips, no step list ever written'
  cost: S
  ingest_cost: S
  query_cost: S
  better_than_fixed_table: Step structure is induced, so the funnel exists before any question is authored
  depends_on: vidsearch-2
  _from_file: E-video-understanding-search-engineer.yaml
