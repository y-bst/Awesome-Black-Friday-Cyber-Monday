    spec.md unspecified: ''how videos of one session are linked'''
  situation: Title A's studio records 45-minute sessions (3 videos) and title B's records 3-hour sessions (12 videos); a per-video
    answers table makes B's stall count 4x A's for the same player behaviour
  consequence: Denominators differ by recording practice, not by game; with session as the unit, stall_rate is stalls per
