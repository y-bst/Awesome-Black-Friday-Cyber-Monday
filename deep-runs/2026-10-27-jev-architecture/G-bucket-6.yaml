  cost: S
  depends_on: stitch-1
  part: session-stitching
  ingest_cost: S
  query_cost: S
  better_than_fixed_table: Fixed table counts whatever videos exist; a duplicate video is a duplicate row
  shallow: false
  _from_file: E-session-stitcher.yaml
