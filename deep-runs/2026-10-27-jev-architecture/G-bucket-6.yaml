- id: stitch-17
  title: 'Progressive per-segment ingestion for live playtests: each segment is extracted on arrival with carry-forward; session
    rows carry session_complete=false until an end marker, and counts exclude or flag incomplete sessions'
  level: L4
  cell:
    part: session-stitching
    extraction-trigger: continuous-during-live-session
