  mechanism: 'Changes session-stitching and query path: the manifest is append-only during the session; carry-forward state
    (stitch-4) is the only cross-segment dependency, so latency from segment upload to queryable is one segment''s extraction
    time (about 2-4 minutes)'
  example: 'At hour 2: ''Tutorial completed by 180 of 220 sessions that have passed the tutorial window; 140 sessions still
    in progress and excluded'''
  cost: M
  depends_on: stitch-4
  part: session-stitching
  ingest_cost: M
  query_cost: S
  better_than_fixed_table: Fixed table is batch per video with no notion of a session still being recorded
  shallow: false
  _from_file: E-session-stitcher.yaml
- id: stitch-25
  title: 'Overlap and duplicate dedupe: when two segments overlap in wall clock (re-upload, 5s recorder overlap) observations
