    plus video index, and persist only a speaker count per video
  level: L4
  part: ingestion
  cell:
    part: session-stitching
    modality: audio-non-speech
    granularity: session
    representation: timestamped-observation-log
    mechanism-type: change-data-at-source
    effort: XS-days
    subject-domain: onboarding-tutorial
  object: spec stage 1 "each video is capped at 15 minutes, so one session is many videos"; spec unspecified "how videos of
    one session are linked"
  situation: Linking n videos to one session and one player when the capture tool emits them separately
  mechanism: Capture client writes session_id, video_index (0..n), wall-clock start into each file's sidecar; stitching joins
    on those. Diarisation runs per video only to produce speaker_count and primary-speaker segments; speaker embeddings are
    discarded after the video is processed and never compared across videos or players.
  example: 'Studio asks "How long did players spend in the tutorial over their whole session?" Stitcher joins 8 videos by
    session_id, sums step durations across video boundaries: median 23 min, 500/500 sessions linked; no voice matching used.'
  consequence: REFUSED option (voiceprints are biometric identifiers); if a sidecar is missing the session is flagged unlinked
    rather than voice-matched, and the coverage statement says so
  better_than_fixed_table: Fixed table is per video with no session key at all; this gives session-level answers without biometric
    linking
  ingest_cost: S
  query_cost: S
  cost: S
  depends_on: capture client writing a sidecar (collection protocol)
  willingness: low
  p_typical: 0.04
  grounded: quote
  evidence: 'spec: "how videos of one session are linked" is unspecified'
  proposed: Add session_id, video_index, linked_by to the session table; alert when linked_by is empty for more than 2% of
    sessions
  shallow: false
  _from_file: E-privacy-counsel.yaml
