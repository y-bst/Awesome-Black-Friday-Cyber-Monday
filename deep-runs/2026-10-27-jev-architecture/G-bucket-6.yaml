  part: session-stitching
  ingest_cost: S
  query_cost: S
  better_than_fixed_table: 'The table is per video (spec.md: ''a structured table per video''), so ''before exit'' is cut
    at file edges; session-clock chunks are not'
  shallow: false
  _from_file: E-retrieval-engineer.yaml
