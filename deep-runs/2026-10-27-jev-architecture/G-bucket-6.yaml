  level: L4
  cell:
    part: schema-evolution
    schema-evolution: model-upgrade-reextract
    extraction-trigger: on-model-upgrade
    evidence-form: extraction-provenance-model-and-schema-version
    representation: timestamped-observation-log
    user-segment: studio-data-engineer
  object: 'A-frame.yaml assumption: ''original videos remain available for re-processing'''
  situation: The extraction model is upgraded and the forge-step quit count moves from 31 to 55 on an unchanged 487-session
    set
  consequence: A studio that sees the number move with no explanation concludes the system is random; a studio that sees 'model
    v3 flagged 24 more quits; 20 of them were classified as stall under v2' can decide which to believe and ask for the 24
    clips
  p_typical: 0.07
  grounded: inferred
  evidence: memo.md item 2 caches new fields but does not say what happens to old values on re-extraction
  proposed: Observation rows carry extraction_version; aggregates default to the latest version; the chatbot runs the same
    plan on the previous version when the field changed in the last 14 days and prints the delta with a confusion count
  shallow: false
  mechanism: 'Append-only store: re-extraction writes new rows with version v3, old rows are kept; the planner adds version=latest;
    a change detector compares per-player values between versions and stores a per-field confusion matrix used in the answer
    footer'
  example: '''How many quit at the forge?'' Answer: ''55 of 412 (13.3%) with model v3. Under model v2 this was 31 (7.5%);
    24 players changed, 20 from stall to quit. Show the 24 clips?'''
  cost: M
  depends_on: append-only observation store with a version column
  part: schema-evolution
  ingest_cost: M
  query_cost: S
  better_than_fixed_table: The fixed table is overwritten on re-run; the old number is gone and the change is unexplainable
  _from_file: E-ask-your-data-veteran.yaml
