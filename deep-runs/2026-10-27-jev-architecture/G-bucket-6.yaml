- id: extract-6
  title: 'Open fields converge into closed ones: short open text (friction_cause, goal_stated) is clustered nightly into a
    controlled vocabulary of at most 30 labels per game, and the next day''s prompt offers those labels plus ''other'''
  level: L4
  cell:
    part: schema-evolution
    representation: learned-schema-from-data
    question-origin: induced-from-data
    extraction-trigger: scheduled-batch
    schema-evolution: append-only-versioned-fields
    mechanism-type: auto-discover-without-question
    granularity: game
  part: question-generation
  object: 'memo.md item 1: ''short open fields'' ; spec.md known problem ''The question set is small'''
  situation: friction_cause has 1,900 distinct strings over 500 sessions; 'can't find the map', 'where is the map', 'map button
    missing' are three strings
  consequence: Counting 'how many players could not find the map' needs a query-time LLM read over 1,900 strings instead of
    a WHERE clause
  mechanism: 'Nightly: embed open-field values, cluster (HDBSCAN, min cluster 8), name each cluster with a 3-5 word label
    by one model call, write vocab table(game_id, field, label, version, example_strings[5]). Extraction prompt for that field
    becomes ''choose one of: [labels] or other: <text>''. Rows extracted under older vocab versions keep their raw string
    plus a mapped label computed by nearest-centroid; mapping version stored on the row'
  example: 'Studio asks ''what are the top 3 reasons players stall in the tutorial?'' Day 1: retrieval-then-LLM over strings
    (30 s). Day 8: SELECT label, COUNT(*) over friction_cause_label (under 2 s): cannot_find_map 41, unclear_objective 29,
    combat_too_hard 17'
  ingest_cost: M
  query_cost: S
  cost: M
  depends_on: open-field extraction with raw strings stored
  better_than_fixed_table: The fixed table's options are written by hand once; here the options are induced from what players
    actually say and grow with the data
  p_typical: 0.08
  grounded: quote
  evidence: 'spec.md: ''The question set is small, so most of what is in the video and transcript is never captured'''
  proposed: Cap vocab growth at 30 labels per field; merge clusters under 8 members into other
  shallow: false
  _from_file: E-extraction-prompt-engineer.yaml
