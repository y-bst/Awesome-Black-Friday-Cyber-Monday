  p_typical: 0.06
  grounded: quote
  evidence: 'spec.md: ''A session can be n hours; each video is capped at 15 minutes'''
  proposed: Ingestion is triggered per segment; session_complete flips on the end marker (stitch-14) or after 30 minutes without
