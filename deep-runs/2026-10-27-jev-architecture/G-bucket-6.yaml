    user-segment: ux-researcher
  object: 'spec.md section 1: ''A session can be n hours'''
  situation: A studio runs a 4-hour playtest and asks at hour 2 'how many have finished the tutorial so far'
  consequence: If ingestion waits for the whole session, the answer is 0 until hour 4; if it does not flag incompleteness,
