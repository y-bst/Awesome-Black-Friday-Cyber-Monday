    scope: all-players
    effort: S-weeks
  object: 'spec.md: ''each video is capped at 15 minutes, so one session is many videos'' and ''how videos of one session
    are linked'' is unspecified'
  situation: A player quits the tutorial 40 seconds into video 3; the preceding 2 minutes of frustration sit at the end of
    video 2 and are a different retrieval unit
  consequence: Per-video chunks lose the cross-cut context for roughly 1 in 10 moments (a 15-minute file cut against a 90s
    window means 6.7% of windows straddle a cut, more with overlap); the chatbot answers 'nothing notable before exit'
  p_typical: 0.35
  grounded: quote
  evidence: 'spec.md: ''A session can be n hours; each video is capped at 15 minutes, so one session is many videos.'''
  proposed: 'Stitcher orders videos by capture timestamp, concatenates transcripts into one session timeline, then windows:
    chunk = {session_id, player_id, chunk_idx, video_index_start, video_index_end, t_session_start_s, t_session_end_s, text,
    step_id_mode}; a chunk may span a file cut'
  mechanism: 'Changes session-stitching and the index record shape: the retrieval unit is a window over the session clock,
    not the file; file boundaries become a metadata field, never a chunk boundary'
  example: Studio asks 'what were players saying in the 2 minutes before they abandoned the tutorial'; filter t_session_end_s
