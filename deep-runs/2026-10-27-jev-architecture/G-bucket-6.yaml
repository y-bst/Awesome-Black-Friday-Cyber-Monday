  object: 'spec.md section 3: ''The answers form a structured table per video'''
  situation: A tester re-uploads segment 4 after a failed upload; both copies are extracted
  consequence: 'Every count over that session is inflated for the 15-minute window: 2 quits, 2 restarts, 2 complaints from
    one player; over 500 players a 3% re-upload rate shifts churn counts by about 1.5 points'
  p_typical: 0.05
  grounded: inferred
  evidence: 'spec.md Unspecified: ''how videos of one session are linked'''
  proposed: Manifest detects overlapping wall-clock ranges; the later upload is superseded unless its duration is longer;
