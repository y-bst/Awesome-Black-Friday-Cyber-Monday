- id: retr-1
  title: Chunk on the stitched session timeline (90s windows, 30s overlap) instead of per 15-minute video file, with session_id,
    video_index, t_session_start, t_session_end on every chunk
  level: L3
  cell:
    part: session-stitching
    representation: transcript-chunks-with-embeddings
