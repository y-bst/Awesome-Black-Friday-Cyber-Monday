mode_collapse_note: Counts come from title regexes over the 786 positives (distinct perspective prefixes in brackets) and are approximate. Clip evidence (72 evidence-form cells) and screen-state/OCR frames (about 85 titles from 26 perspectives) are near-universal and are left out as themes. The memo direction (observation log + planner + lazy backfill) is confirmed by consensus. The two consensus additions the memo lacks are trackers backfilled over history and automatic contrast/push.
contested_themes:
- theme: Query-time map-reduce of an LLM over raw transcripts
  positives:
  - longctx-1
  - longctx-6
  - longctx-10
  - longctx-23
  - longctx-24
  - longctx-32
  refusals:
  - owner-20
  - askdata-16
  - convo-20
  - planner-29
  - store-26
  - publisher-25
  disagreement: "The skeptic prices it at about $1.30-13 and 25 s per 500-player question and argues it beats any schema for new questions. Owner, askdata and publisher refuse it for cohort numbers: it is not deterministic on re-run, too slow, and cannot be re-run to the same benchmark value. Accepted middle ground: single-session scope (planner-29), a labelled sample of 25 or fewer sessions (convo-20), or a standing nightly map (longctx-32)."
- theme: Entity-relation graph as store or query surface
  positives:
  - kg-1
  - kg-4
  - kg-30
  refusals:
  - store-25
  - analyst-31
  - kg-9
  - kg-24
  disagreement: "The graph person makes the temporal property graph the primary store. The store designer and the analyst refuse a graph DB and path queries; even kg refuses free text-to-Cypher and time-less edges. Consensus: if a graph is used at all, it stays hidden behind tables and templated patterns."
