# Stage H audit 1, ideate run, JEV architecture. Inputs: frame, perspectives, axes, spec, memo, critique, G-counts 1-7, G-titles-all (868 survivors, 82 refusals).
stage: H-audit
run: deep-runs/2026-10-27-jev-architecture
request_type: ideate
inputs_read:
- A-frame.yaml
- B-perspectives.yaml
- C-axes.yaml
- spec.md
- memo.md
- D-critique.yaml
- G-counts-1..7.md
- G-titles-all.txt
- G-merged-1..7.yaml (text search only, to test candidate empty cells)
list_summary:
  rows_in_buckets: 998
  absorbed_as_duplicates: 130
  duplicate_rate: 0.13
  surviving: 868
  refusals_kept: 82
  positives: 786
  survivors_carrying_variants_of: 406
  variant_share_of_survivors: 0.47
  uncategorised: 0
  method: Cell counts were summed over all seven G-merged files. Every axis value with 0 or 1 leaves, and every thin subject-domain value, was then searched in title, situation, mechanism, proposed and example text before being called empty.
empty_cells:
- cell:
    granularity: level-quest-match-mission
    part: store
    latency-tier: under-2s
  evidence: 0 leaves labelled. A text search for level, quest, mission, match, round, run and chapter as structural units found no option that defines one. Nearest are the generic episode or attempt segmenters (extract-14, convo-6, owner-30, designer-25, vidsearch-1, about 14 leaves), but none materialises a per-unit table or a precomputed aggregate. Every fast precomputed structure in the list is keyed by tutorial step (latency-1, latency-15, obs-6, owner-31, datateam-15, publisher-6).
  brief: Propose at least 10 ways to give non-linear or repeated play (level instance, match, roguelike run, quest instance, boss attempt) the same under-2s path the step funnel gives tutorials. Cover boundary detection (OCR, SFX, telemetry, event spotter), the per-unit row (unit_type, unit_id, attempt_n, outcome, duration, deaths), and the cube over it, each with a non-tutorial worked question such as "which run number do players quit after" or "which quest is abandoned at hour 2". Do not re-propose generic episode segmentation (extract-14, convo-6, owner-30) or the step funnel.
- cell:
    subject-domain: social-multiplayer
  evidence: 4 leaves labelled (privacy-26, sec-18, sec-19, tar-7). All four remove social data (drop party voice, transcribe only the own mic, exclude chat OCR, redact third-party voice). No option answers a multiplayer question.
  brief: Propose at least 10 options that answer multiplayer studio questions (party size and churn, matchmaking wait then quit, teammate toxicity, role and comms breakdown, being carried vs carrying) within the privacy constraints the list already set. Examples are multi-POV sync of several recorded players on a shared match clock, scoreboard and kill-feed OCR, aggregate-only teammate features, and an opt-in party-capture arm. Give each one an ingest/query cost and a worked example such as "do solo-queued players quit the first match more than partied ones".
- cell:
    subject-domain: economy-monetization
  evidence: 3 leaves labelled. Only cv-25 (HUD numeric OCR of gold/XP with resource-zero events) represents economy. planner-18 routes the word "shop" to retrieval, and publisher-20 names first-purchase rate as a KPI. Exports that join purchase telemetry on the studio side (store-28, latency-33) answer nothing inside JEV.
  brief: Propose at least 10 representations and query paths for economy and purchase questions. Examples are a source/sink ledger derived from HUD deltas, a shop-screen funnel (opened, item inspected, price seen, bought, backed out), currency-zero episodes, offer-popup dismissals, a spoken price-reaction tracker, and a telemetry purchase join. Give a worked example such as "why do players open the starter-pack offer and close it" or "where does the gold run out in hour 1".
- cell:
    subject-domain: narrative
  evidence: 1 leaf (cv-32, subtitle and NPC dialogue OCR as a text track). The other text hits only use a cutscene or lore panel as an example of a lazy backfill (latency-5, kg-16, analyst-23). No option represents story comprehension, dialogue choices or cutscene engagement.
  brief: "Propose at least 10 options for narrative questions: per-cutscene watch/skip/rewatch rows, a dialogue-choice capture from OCR, a goal-restatement utterance tracker (\"player can say why they are going to the village\"), a post-session comprehension probe, a lore-panel dwell, and confusion-after-cutscene contrast. Give each a worked example and say how it differs from a generic lazy backfill."
mislabelled_cells:
- cell:
    tenancy-and-deployment: single-tenant
  note: The only labelled leaf (privacy-29) is about data residency per region, not single tenancy. sec-12 (whole pipeline in the studio cloud account), datateam-30 (in-VPC extraction container) and datateam-12 (federated Snowflake/BigQuery app) describe the cell. Not a gap.
- cell:
    modality: controller-or-touch-heatmap
  note: Labelled on cv-24 and designer-16 only. The same situation also appears in ops-22 (controller and touch logging at 60 Hz), cv-6 (cursor hover dwell), extract-18 (unresponded input) and telem-13 (idle input with prompt). Not a gap.
- cell:
    effort: buy-or-integrate
  note: Labelled on vidsearch-19 and uxrepo-29 only, because the build-or-buy axis carries this information (46 open-source-component, 23 managed-cloud-service, 5 third-party-video-understanding-api). The effort value is redundant with that axis. Not a gap.
- cell:
    granularity: game-system
  note: Labelled on clinical-3, kg-19 and telem-29 only. The mechanic/system level appears in kg-6 and kg-7 (Mechanic nodes), gur-5 (MDA mechanic layer), clinical-3 (concept_ancestor roll-up) and convo-4 (genre tracker library). Not a gap.
- cell:
    modality: webcam-face-and-posture
  note: Its 3 leaves (gur-10, ops-23, privacy-4) are all refusals, and clinical-33 lists webcam only as a source enum value. This is a deliberate consensus refusal, not an unexplored cell. Do not brief it.
- cell:
    question-origin: public-reviews-and-community-mining / pilot-sessions-then-freeze
  note: "4 leaves each, plus more under other labels: owner-25, platform-26 and privacy-34 (refused by sec-29 for embargoed titles); owner-14, qgen-3 and convo-33 (pilot first). Thin but present."
under_used_perspectives:
- slug: all-perspectives (measure)
  brief: "No perspective has its leaves in only 1-2 values of `part`: the minimum is 7 parts (askdata, planner), and askdata/planner put 73-76% of their leaves in query-path and chatbot-ui. On `subject-domain`, however, every perspective sits in 1-2 values (tutorial, plus affect or ui-navigation). The briefs below target that concentration."
- slug: eval-lead
  brief: "0 of 32 leaves are outside the tutorial. Walk golden sets and accuracy gates for non-step units: match outcome labels, run-death attribution, economy ledger reconciliation against telemetry, and accuracy of narrative comprehension extraction."
- slug: store-designer
  brief: "0 non-tutorial leaves, and the stored keys are (player, step). Walk the schema for a game with no step list: unit-of-play table, hour-bucket rollups for 4-hour sessions, a currency ledger, and a match table with several players per match."
- slug: statistician
  brief: "1 non-tutorial leaf. Walk inference for repeated units: clustering of runs or matches within a player, survival over play-hours rather than steps, matched cohorts by skill for multiplayer, and economy distributions with heavy tails."
- slug: video-understanding-search-engineer
  brief: 1 non-tutorial leaf, despite a sports-analytics background that is native to matches and plays. Walk play/possession-style segmentation of matches and runs, scoreboard and kill-feed OCR, team-level event spotting, and highlight reels for non-tutorial moments.
- slug: query-planner-engineer
  brief: "1 non-tutorial leaf, and 17 of 29 leaves are query-path. Walk planning when the question names an entity with no step (a shop, a quest, a match mode): which unit to group by, how to detect that the store has no structure for it, and what the fast fallback is."
- slug: question-generation-researcher
  brief: 1 non-tutorial leaf. Walk ontology branches for core loop, economy, progression, social and narrative (MDA-, PENS- or genre-derived), and how a generated bank prunes them for a given game target.
uncategorised_suggest_axis: []
uncategorised_note: All seven buckets report 0 uncategorised items, so no missing axis is inferred from them. The tutorial finding below does suggest that subject-domain mixes topic with play structure. If the orchestrator adds an axis, it should be play-structure with values [linear-scripted-steps, level-based, match-or-round-based, run-based-roguelike, open-world-quest, persistent-live-service]. That is the property that decides whether a step funnel works.
tutorial_share:
  critique_warning: D-critique grid_notes said the mandatory tutorial-churn worked example plus the tutorial-step granularity would bias the run toward tutorials, although sessions are hours long.
  finding: The warning held, but mainly for worked examples and for the fast-path structures, not for most mechanisms.
  numbers:
    positives: 786
    worked_example_or_situation_on_tutorial_or_step: 679 (86%)
    worked_example_on_a_genuinely_non_tutorial_question: about 30 (4%), for example analyst-28 shop prices, cv-25 gold, cv-29 stutter, vidsearch-27 first boss, stitch-8 mission 1
    mechanism_only_works_with_an_ordered_enumerable_step_list: about 180-200 (23-25%). Regex on title/mechanism matched 184 (funnel, state machine, step list or boundaries, per-step tables, canonical tutorial phases, Tutorial Health); hand review of the wider 277-row step/tutorial group put roughly 80 of them in the generic class
    mechanism_generic_for_any_studio_question: "about 590 (75%): the tutorial appears only as the example or as a filter value"
    subject_domain_cell_counts: onboarding-tutorial 386, player-affect 40, ui-navigation 23, technical-bugs 10, progression 5, accessibility 5, core-loop 4, social-multiplayer 4 (all exclusions), economy 3, narrative 1, unset 387
    mechanisms_naming_hour_2_plus_or_post_tutorial_in_title: 0. About 8 leaves mention the post-tutorial window in their situation or example (extract-14, vidsearch-15, stitch-8, clinical-35, owner-16, owner-26, obs-3, vidsearch-3)
  gap: "Large where it matters most. Three in four mechanisms would transfer, but the components that make an unknown question fast are keyed by tutorial step: the materialised cube, per-player state rows, step-aligned chunks, canonical-phase benchmarks, and starter chips generated from steps[]. Their non-linear counterpart has 0 leaves (empty cell 1). Multiplayer (0 substantive), economy (1) and narrative (1) have no representation at all. Sessions are hours long, yet nothing materialises structure for hour 2+, and the spec target \"churn just after the tutorial\" is covered only incidentally. A studio asking about mid-game play would fall through to lazy backfill or map-reduce every time, which is the slow path the memo is trying to avoid."
  recommendation: Run one targeted fill pass on empty cells 1-4 with a non-tutorial worked example required. Do not run another full loop.
