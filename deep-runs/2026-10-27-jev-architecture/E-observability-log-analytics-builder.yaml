- id: obs-12
  title: "Cardinality budget per attribute: track distinct values per key per game daily; keys above 50,000 distinct values are moved out of LowCardinality into attrs and excluded from GROUP BY autocomplete and contrast; dashboard for JEV ops"
  level: L4
  cell: {part: cost-governance, representation: wide-event-schema-on-read, user-segment: jev-internal-ops, effort: XS-days, tenancy-and-deployment: shared-multi-tenant, schema-evolution: schema-on-read}
  object: "memo.md item 1: 'closed enum fields and short open fields'"
  situation: "An extractor starts emitting free-text 'action' values (one per utterance), the action column reaches 400k distinct strings and every GROUP BY action becomes a 20 s query"
  consequence: "Nightly job flags action as high-cardinality (>50k), the planner stops offering it as a group key, the extractor prompt is patched to a 40-value enum plus action_detail free text; query p95 stays under 2 s"
  p_typical: 0.04
  grounded: quote
  evidence: "memo.md: 'with closed enum fields and short open fields'"
  proposed: "SELECT key, uniqExact(value) FROM events ARRAY JOIN attrs GROUP BY key; thresholds 1k (warn), 50k (demote); per-studio query budget: rows scanned per day with a soft cap"
  shallow: false
  part: evaluation
  mechanism: "Cardinality is a first-class ingestion metric alongside row count; demotion is automatic; extraction prompt enums are regenerated from the top 40 values of a demoted key"
  example: "A tutorial-churn contrast on 'action' returns 2,000 one-off values and nothing useful; after demotion the enum 'open_inventory, craft, move, attack, read_tooltip, ...' makes 'read_tooltip: 12% of quitters vs 58%' visible"
  cost: S
  ingest_cost: S
  query_cost: S
  better_than_fixed_table: "Keeps open fields from silently destroying query speed; the fixed table avoids the problem by capturing nothing open"
  depends_on: obs-1

- id: obs-13
  title: "REFUSED: head-sample 20% of sessions at ingestion to cut LLM extraction cost"
  level: L3
  cell: {part: cost-governance, extraction-trigger: at-ingestion, scope: all-players, uncertainty-policy: always-answer, effort: XS-days, mechanism-type: approximate-then-refine}
