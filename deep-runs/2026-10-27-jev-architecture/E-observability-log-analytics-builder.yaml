- id: obs-15
  title: "REFUSED: per-session LLM summary (300 words) as the only stored representation, queried by reading summaries"
  level: L3
  cell: {part: store, representation: per-session-summary, question-type: what-surprised-unknown-unknowns, granularity: session, mechanism-type: precompute-more, query-path: map-reduce-over-raw}
  object: "spec.md Known problems: 'The question set is small, so most of what is in the video and transcript is never captured'"
