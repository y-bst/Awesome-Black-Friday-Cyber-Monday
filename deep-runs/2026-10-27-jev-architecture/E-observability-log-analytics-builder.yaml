  situation: "Someone proposes extracting only 100 of every 500 sessions to save 80% of ingestion spend"
  consequence: "Refused (willingness 0.1): a sampled store cannot answer find-players-who or any question whose answer is a specific player's clip, and every rare-event question (the 8 players who hit the crash) loses 80% of its evidence; ingestion is the cheap side per the spec, so sample at query time (obs-4), never at write time"
  p_typical: 0.03
  grounded: quote
  evidence: "spec.md: 'Ingestion time and cost are not a concern. Answering a studio's question must be fast.'"
  proposed: "Do not build; if cost pressure appears, drop frame rate or model size for low-signal segments (loading screens) instead of dropping sessions"
  shallow: false
  part: ingestion
  mechanism: "Would skip 400 of 500 sessions at extraction; rejected"
  example: "'Show me the players who got the Inventory full popup' would return 1-2 of the real 8; studio trust ends there"
  cost: S
  ingest_cost: S
  query_cost: S
  better_than_fixed_table: "Nothing; strictly worse coverage than the fixed table"
  depends_on: nothing

