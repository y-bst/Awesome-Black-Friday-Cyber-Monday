  part: query
  mechanism: "Same contrast engine as obs-3, triggered by a cohort-size threshold on build_version rather than by a question; Benjamini-Hochberg correction across the ~200 attributes tested"
  example: "'What changed in player behaviour after the patch?' is delivered unasked on day 2 of the build; the designer confirms 'step-2 negative sentiment up' and opens the 3 clips"
  cost: S
  ingest_cost: S
  query_cost: S
  better_than_fixed_table: "Surfaces what-surprised across all attributes; the fixed table only reports on named questions"
