- id: obs-1
  title: "Replace the per-video answers table with one wide-event table: one row per observation, 60 fixed columns plus an open attrs JSON column, ClickHouse MergeTree ordered by (game_id, build_version, session_id, session_t_ms)"
  level: L4
  cell: {part: store, representation: wide-event-schema-on-read, granularity: variable-length-moment-or-episode, schema-evolution: schema-on-read, build-or-buy: open-source-component, effort: S-weeks, mechanism-type: precompute-more}
  object: "spec.md step 3: 'The answers form a structured table per video'; memo.md item 1: 'closed enum fields and short open fields'"
  situation: "A studio asks a question whose answer needs an attribute the question writer never named (device model, menu depth, number of popups open) and the fixed table has 30 columns"
  consequence: "Every observation keeps every attribute the extractor emitted (target 80-200 per row); a question over 500 players scans 500 x ~2,000 rows = 1M rows, which a single ClickHouse node does in 200-800 ms; columns the studio never asks about cost disk only"
  p_typical: 0.18
  grounded: quote
  evidence: "spec.md: 'The question set is small, so most of what is in the video and transcript is never captured.'"
  proposed: "CREATE TABLE events (studio_id, game_id, build_version, player_id, session_id, video_idx UInt8, session_t_ms UInt64, event_type LowCardinality, step LowCardinality, screen_state LowCardinality, ui_element, action, utterance_text, ocr_text, sentiment Int8, friction UInt8, confidence Float32, extractor_version, attrs JSON) ENGINE=MergeTree ORDER BY (game_id, build_version, session_id, session_t_ms)"
  shallow: false
  part: store
  mechanism: "The ingestion extractor is told to emit every attribute it can name per observation as key-value pairs; known keys land in typed columns, unknown keys land in attrs JSON; nothing is dropped for not matching a question. Columnar compression (ZSTD) keeps 1M rows at roughly 150-300 MB"
  example: "'Which tutorial step do players quit on and what was on screen?' -> SELECT step, screen_state, count() FROM events WHERE event_type='session_end' GROUP BY step, screen_state over 500 players: 500 rows scanned by primary key, 40 ms"
  cost: S
  ingest_cost: M
  query_cost: S
  better_than_fixed_table: "Any attribute the extractor saw is queryable later; the fixed table only holds what 30 pre-written questions asked"
  depends_on: nothing

- id: obs-2
  title: "Full-text inverted index on utterance_text and ocr_text columns so 'find players who said X' is a keyword query answering in under 2 s over 1M rows, before any LLM is involved"
  level: L4
  cell: {part: query-path, representation: inverted-full-text-index, query-path: full-text-keyword-search, question-type: find-players-who, latency-tier: under-2s, modality: speech-transcript, build-or-buy: open-source-component}
  object: "spec.md step 4: 'Reading 500 transcripts per question was too slow and too much data'"
  situation: "Studio asks 'how many players said something like confusing or lost during the tutorial', which the fixed table has no column for"
  consequence: "Query returns 73 of 500 players with 112 matching utterances and timestamps in 0.4 s; the 500-transcript LLM read is never run; false negatives from synonyms are handled by a stemmed query plus a 20-word synonym list per concept"
  p_typical: 0.12
  grounded: quote
  evidence: "spec.md: 'Reading 500 transcripts per question was too slow and too much data, which is why the fixed-question table exists.'"
  proposed: "ALTER TABLE events ADD INDEX ft_utt utterance_text TYPE full_text(0) GRANULARITY 1; same for ocr_text; query hasToken(utterance_text, 'confus') OR hasToken(..., 'lost')"
  shallow: false
  part: query
  mechanism: "Tokenised, lowercased, stemmed inverted index built at insert time per granule; the planner routes any what-said or find-players-who question with a quotable term here first and only sends the matched rows (not transcripts) to the model if a reading is needed"
  example: "'How many players said they did not know where to click in step 2?' -> hasToken on 'click' AND step='tutorial-2' AND sentiment<0 returns 41 of 500 players, each with a session_t_ms, in 0.6 s"
  cost: S
  ingest_cost: S
  query_cost: S
  better_than_fixed_table: "Quoted-sentiment questions are answered with a count and a denominator without a pre-written column"
  depends_on: obs-1

- id: obs-3
  title: "BubbleUp contrast: given a churned-player selector, compute for all 80-200 attributes which values are over-represented versus the completing cohort, ranked by chi-square, in one query, so 'why' is answered without anyone naming the attribute"
  level: L4
  cell: {part: query-path, query-path: automatic-contrast-cohort-diff, question-type: why, mechanism-type: auto-discover-without-question, evidence-form: contrast-vs-baseline, scope: query-time-defined-cohort, latency-tier: under-2s, question-origin: discriminative-contrast-churn-vs-retain}
  object: "spec.md Constraints: 'Their questions are not known in advance'; memo.md item 2 handles only questions that are asked"
  situation: "Studio asks 'why do players quit at step 3' and no pre-written question covers the cause"
  consequence: "The answer lists the top 10 attributes where the step-3 quitters differ from completers, each with a lift and n: 'popup_count>=2: 68% of quitters vs 12% of completers (n=61 vs 439)'; the studio never had to guess 'is it popups'"
  p_typical: 0.08
  grounded: quote
  evidence: "spec.md: 'Buyers are gaming studios. Their questions are not known in advance.'"
  proposed: "One SQL per attribute family: SELECT attr, value, countIf(cohort) , countIf(baseline) FROM events ... GROUP BY attr, value; rank by chi-square with min support 5 players; return top 10 with lift and both denominators"
  shallow: false
  part: query
  mechanism: "Planner turns any 'why did cohort C do X' into cohort = players matching C, baseline = all others in same build; a single GROUP BY over all LowCardinality and attrs keys; results above 2x lift and n>=5 are returned as a ranked contrast table plus 3 example clips per top attribute"
  example: "'Why do players churn after the tutorial?' -> top contrasts: 'first_death_before_step_4 = true: 71% vs 19%', 'utterance_count in tutorial = 0: 44% vs 9%', 'settings_menu_opened: 38% vs 6%'; 0.9 s over 500 players"
  cost: M
  ingest_cost: S
  query_cost: S
  better_than_fixed_table: "Answers why-questions nobody wrote a question for; the fixed table can only confirm a cause someone already suspected"
  depends_on: obs-1

- id: obs-4
  title: "Query-time player sampling with a confidence interval for any question that needs the model to read rows: read 60 of 500 players, return 'approx 42% +/- 12%', and offer refine-to-all as a second step"
  level: L4
  cell: {part: query-path, query-path: sampled-map-reduce-with-ci, uncertainty-policy: answer-with-ci-and-n, latency-tier: under-30s, evidence-form: count-with-denominator, question-type: prevalence-of-quoted-sentiment, mechanism-type: approximate-then-refine}
  object: "spec.md Constraints: 'Answering a studio's question must be fast'; memo.md item 2: 'the model reads only those'"
  situation: "A question falls through to open-field reading over all 500 players (for example 'how many players misread the crafting tooltip as a button') and reading 500 x 40 rows would take 90 s"
  consequence: "First answer in 8 s from a random 60-player sample with a Wilson 95% interval; the studio can click 'run on all 500' which takes 90 s and replaces the estimate; no answer is ever a bare number without n"
  p_typical: 0.09
  grounded: quote
  evidence: "spec.md: 'Ingestion time and cost are not a concern. Answering a studio's question must be fast.'"
  proposed: "SAMPLE clause on player_id hash (SAMPLE 60/500); map step: model labels each player's matched rows; reduce: proportion with Wilson CI; UI shows 'estimate from 60 of 500 players'"
  shallow: false
  part: query
  mechanism: "Planner estimates read cost (rows x tokens); above 20k tokens it samples players by cityHash64(player_id) % 500 < 60, runs the model per player in parallel, and reports p, n, and CI; a background job completes the full run and caches it"
  example: "'What share of players thought the tutorial boss was optional?' -> sample 60: 25 yes -> '42% (95% CI 30-54%, n=60 of 500)' in 8 s; full run later: 39% of 500"
  cost: S
  ingest_cost: S
  query_cost: M
  better_than_fixed_table: "Questions outside the table get a defensible number in seconds instead of either no answer or a 90 s wait"
  depends_on: obs-1

- id: obs-5
  title: "Three-tier retention: hot pre-aggregated per-step-per-build rollups (forever), warm wide events (365 days), cold video and frames in object storage referenced by URI; the planner reads the cheapest tier that can answer"
  level: L4
  cell: {part: cost-governance, representation: olap-cube-materialized-views, latency-tier: sub-200ms-cached, moment-in-journey: steady-state-weekly, effort: S-weeks, mechanism-type: reuse-or-cache-prior-work, build-or-buy: managed-cloud-service}
  object: "A-frame assumption: 'original videos remain available for re-processing, including frames'; spec.md step 1: 'A session can be n hours'"
  situation: "After 12 months a studio has 40,000 sessions; a question like 'step-3 completion rate by build over the last year' must not scan 80M event rows"
  consequence: "Hot rollup table (step, build, day: players_entered, players_completed, p50_dwell, p90_dwell) is 1 row per step per build per day, under 1 MB per game; such questions answer in under 200 ms; raw video stays reprocessable for new extractions"
  p_typical: 0.07
  grounded: inferred
  evidence: "spec.md: 'Ingestion time and cost are not a concern.'"
  proposed: "Materialized view rollup_step_daily aggregating events on insert; TTL 365 DAY on events with move to S3 disk at 90 days; videos and keyframes in S3 with lifecycle to Glacier at 180 days"
  shallow: false
  part: store
  mechanism: "Planner checks whether the question's GROUP BY keys and metrics are a subset of a rollup; if yes reads rollup; else reads events; else schedules a re-extraction job over cold video"
  example: "'Did step-3 completion improve since build 1.4?' -> rollup rows for builds 1.3-1.6: 78%, 81%, 86%, 85% with n per build; 60 ms"
  cost: S
  ingest_cost: S
  query_cost: S
  better_than_fixed_table: "Year-scale questions stay fast; the fixed table has no aggregation layer and no cold path back to video"
  depends_on: obs-1

- id: obs-6
  title: "Materialized step-funnel-per-player view updated on insert: one row per player per build with entered_step_k, completed_step_k, dwell_k for k=1..N, so compare-versions questions are a two-row diff"
  level: L4
  cell: {part: store, representation: step-funnel-state-machine-per-player, query-path: precomputed-aggregate, question-type: compare-versions, scope: build-version-pair, granularity: build-version, extraction-trigger: at-ingestion}
  object: "spec.md step 3: 'The targets are mostly detecting churn in the tutorial and just after it'"
  situation: "Studio ships build 1.5 with a reworked step 2 and asks on Monday whether churn at step 2 dropped"
  consequence: "funnel_by_build returns entered/completed per step per build; answer 'step-2 drop-off 23% (n=410) in 1.4 vs 11% (n=380) in 1.5' in 50 ms with a two-proportion z-test p-value"
  p_typical: 0.15
  grounded: quote
  evidence: "spec.md: 'The targets are mostly detecting churn in the tutorial and just after it.'"
  proposed: "MV funnel_player(player_id, build_version, step, first_seen_ms, last_seen_ms, completed Bool) from events WHERE event_type IN ('step_enter','step_complete','session_end'); funnel_by_build aggregates it"
  shallow: false
  part: store
  mechanism: "Step enter and complete events are derived at ingestion from screen_state transitions; the view folds them per player; completion is defined as a step_complete event or a later step_enter"
  example: "'Compare tutorial churn before and after the 1.5 patch' -> per-step table for 1.4 vs 1.5 with deltas and n; the chatbot adds 'step-2 improved, step-4 worsened from 6% to 14%'"
  cost: S
  ingest_cost: S
  query_cost: S
  better_than_fixed_table: "Per-step numbers exist for every build automatically; the fixed table answers per video and has no build dimension"
  depends_on: obs-1

- id: obs-7
  title: "Derived columns defined by the studio at query time as expressions over existing attributes (stalled = dwell_ms > 60000 AND input_events = 0), stored as a named formula, no re-extraction"
  level: L4
  cell: {part: schema-evolution, schema-evolution: schema-on-read, question-origin: studio-written-at-runtime, mechanism-type: defer-to-query-time, user-segment: studio-analyst, latency-tier: under-2s, reuse-scope-of-extraction: customer-defined-on-top-of-universal}
  object: "memo.md item 2: 'genuinely new questions trigger a one-time batch extraction over all sessions'"
  situation: "A studio analyst wants 'stalled players' defined their way (no input for 60 s on a step) and the memo's path would run a batch LLM extraction for a thing that is arithmetic over existing fields"
  consequence: "Analyst saves derived column stalled_60 in 1 minute; it is available in every later question and in BubbleUp contrasts; zero model cost; changing the threshold to 45 s is an edit, not a backfill"
  p_typical: 0.05
  grounded: quote
  evidence: "memo.md: 'genuinely new questions trigger a one-time batch extraction over all sessions whose result is cached as a new field'"
  proposed: "Table derived_columns(studio_id, game_id, name, expression, created_by); planner inlines expression as a SQL alias; UI offers a formula box with autocomplete over column names"
  shallow: false
  part: query
  mechanism: "Expressions compile to ClickHouse SQL (arithmetic, boolean, string match, windowed lag/lead within a session); the planner checks whether a studio's question maps to an existing derived column before considering backfill"
  example: "'How many players stalled on the crafting step?' -> stalled_60 = dwell_ms>60000 AND input_events=0 -> 94 of 500 players in 0.3 s; previously an overnight batch extraction"
  cost: S
  ingest_cost: S
  query_cost: S
  better_than_fixed_table: "New fields that are combinations of old ones cost nothing and appear instantly"
  depends_on: obs-1

- id: obs-8
  title: "Model each session as a trace: session = root span, each video and each tutorial step = child span with start_ms, duration_ms, status; how-long questions are span-duration queries and the timeline is a waterfall"
  level: L4
  cell: {part: session-stitching, representation: hierarchical-temporal-summary-tree, granularity: session, question-type: how-long, evidence-form: chart, delivery-surface: dashboard-standard-report, question-type: timeline}
  object: "spec.md Known problems: 'Long multi-video sessions'; spec.md Unspecified: 'how videos of one session are linked'"
  situation: "A 3-hour session is 12 videos and the studio asks 'how long did this player spend from tutorial start to first match', which spans videos 1 to 4"
  consequence: "spans table answers with one row: span=tutorial, duration 47m12s, children step-1..6 with durations; the waterfall view shows a 9-minute gap in step 4 as an empty bar; cohort version is p50/p90 of the same span over 500 players"
  p_typical: 0.06
  grounded: quote
  evidence: "spec.md: 'A session can be n hours; each video is capped at 15 minutes, so one session is many videos.'"
  proposed: "spans(session_id, span_id, parent_span_id, kind in {session, video, step, menu, match, stall}, start_ms, duration_ms, status in {ok, abandoned, error}); built at ingestion from step_enter/step_complete events"
  shallow: false
  part: store
  mechanism: "Ingestion emits span open/close events on screen_state transitions across video boundaries using session_t_ms; a span that never closes before session_end gets status=abandoned; waterfall rendered from the table"
  example: "'How long do players spend in the tutorial, and where is the time going?' -> p50 tutorial span 31 min, step-4 p90 14 min vs 3 min for other steps, with 500-player distribution chart"
  cost: S
  ingest_cost: S
  query_cost: S
  better_than_fixed_table: "Durations across video boundaries are first-class; the per-video table cannot sum a step that spans two videos"
  depends_on: obs-29

- id: obs-9
  title: "Dwell heatmap per step: x = minutes since step entry (30 s buckets), y = step, colour = player density, with click-through to the players in a cell; replaces 'average time on step' with the shape of the distribution"
  level: L4
  cell: {part: chatbot-ui, delivery-surface: dashboard-standard-report, question-type: how-long, granularity: tutorial-step, evidence-form: chart, user-segment: game-designer, effort: XS-days}
  object: "memo.md item 1: 'friction signal'; spec.md step 3 'detecting churn in the tutorial'"
  situation: "Mean dwell on step 3 is 2.5 min, which hides that 420 players take 1 min and 80 players take 10+ min"
  consequence: "The designer sees a bimodal band on step 3, clicks the 8-12 min cell and gets the 80 players, 5 clips, and a BubbleUp contrast of that cell against the rest; one chart replaces 6 questions"
  p_typical: 0.05
  grounded: inferred
  evidence: "memo.md: 'timestamped atomic observations ... friction signal'"
  proposed: "SELECT step, intDiv(dwell_ms,30000) AS bucket, count() FROM spans WHERE kind='step' GROUP BY step, bucket; rendered as heatmap; cell click issues a find-players-who query with the bucket as a filter"
  shallow: false
  part: ui
  mechanism: "Standard chart on the game's dashboard built from the spans table; every cell is a saved cohort selector that feeds obs-3 contrast and obs-28 clips"
  example: "'Where in the tutorial do players get stuck?' -> heatmap shows step-3 long tail (80 of 500 beyond 8 min) and step-5 tight distribution; designer clicks the tail and reads 'inventory_full_popup: 74% vs 9%'"
  cost: S
  ingest_cost: S
  query_cost: S
  better_than_fixed_table: "Shows the distribution a studio would not know to ask about; a table column holds one number"
  depends_on: obs-8

- id: obs-10
  title: "Tutorial-completion SLO with burn-rate alerting: studio sets target (85% complete step 6 within 40 min); the system posts to Slack when the 24-hour rate burns the error budget 4x faster than target"
  level: L4
  cell: {part: query-path, query-path: push-alert-no-query, mechanism-type: push-instead-of-pull, delivery-surface: alert, latency-tier: push-no-query, moment-in-journey: live-ops-update, question-type: did-the-fix-work-pre-post, user-segment: live-ops-community}
  object: "spec.md step 4: 'A chatbot for the gaming studio answers the studio's questions'"
  situation: "A live-ops update silently breaks step 4 on Friday night; nobody asks the chatbot until Tuesday"
  consequence: "Alert fires after 40 new sessions show step-4 completion at 61% against an 85% target (burn rate 4.1x), with the link to the contrast and 3 clips; question was never typed"
  p_typical: 0.04
  grounded: inferred
  evidence: "spec.md: 'A chatbot for the gaming studio answers the studio's questions from that table'"
  proposed: "slo(game_id, name, numerator_expr, denominator_expr, target, window); evaluator runs every 15 min on rollup_step_daily; alert payload = current rate, n, burn rate, top 3 contrasts, 3 clip URIs"
  shallow: false
  part: query
  mechanism: "SLO definitions are saved queries over the rollup; a scheduler compares short (1h) and long (24h) windows against the target; multi-window burn-rate alerting (2% budget in 1h or 5% in 6h) suppresses noise from small n"
  example: "'Is the new build hurting tutorial completion?' is never asked: Slack message 'step-4 completion 61% (n=40) vs SLO 85%; top contrast: ocr_text contains \"Connection lost\" 55% vs 2%'"
  cost: M
  ingest_cost: S
  query_cost: S
  better_than_fixed_table: "Answers arrive before the question exists; the fixed table waits to be queried"
  depends_on: obs-5

- id: obs-11
  title: "New-build drift digest: on first 100 sessions of a new build, diff every attribute's distribution against the previous build and email the top 10 shifts with n and lift, before any studio question"
  level: L4
  cell: {part: query-path, query-path: automatic-contrast-cohort-diff, extraction-trigger: on-game-update, scope: build-version-pair, mechanism-type: auto-discover-without-question, delivery-surface: scheduled-digest, moment-in-journey: new-build-version}
  object: "memo.md item 2 handles asked questions only; spec.md Constraints: 'Their questions are not known in advance'"
  situation: "Build 1.6 reaches 100 ingested sessions; the studio changed 14 things and does not know which ones mattered"
  consequence: "Digest lists 'screen_state=settings_menu during tutorial: 31% -> 4%', 'utterance sentiment<0 on step 2: 22% -> 38%', 'first_death_step: 3 -> 2 (median)'; each row links to a saved query and 3 clips"
  p_typical: 0.05
  grounded: quote
  evidence: "spec.md: 'Buyers are gaming studios. Their questions are not known in advance.'"
  proposed: "Job build_drift(game_id, build_new, build_prev) runs obs-3's contrast with cohort=build_new, baseline=build_prev, min n 30 per side; output rendered as digest; rows below 1.5x lift suppressed"
