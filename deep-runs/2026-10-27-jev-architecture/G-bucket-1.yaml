  situation: A player withdraws, a studio deletes a build's sessions, or a key is revoked (sec-14) after answers citing those
    sessions were cached
  mechanism: cache entry adds source_session_ids (array) and source_schema_version. A nightly job joins the cache against
    a deleted_sessions table and marks matching entries stale; a stale hit recomputes before answering and the new answer
    carries "recomputed after n sessions were removed". Field-level backfill results (memo item 2) are per-session rows, so
    they delete with the session.
  example: Cached answer "84/500 players stalled at step 3" cites 500 session ids; 20 are deleted on a withdrawal batch; the
    next identical question recomputes to "80/480 (recomputed after 20 sessions were removed)" and the 5 clips attached to
    the old answer no longer resolve.
  consequence: Deletion obligations extend to derived answers, not only rows; nightly invalidation adds a recomputation burst
    after large deletions
  better_than_fixed_table: The fixed table has no cache and no deletion story for derived answers; this makes deletion propagate
    to everything that cited the session
