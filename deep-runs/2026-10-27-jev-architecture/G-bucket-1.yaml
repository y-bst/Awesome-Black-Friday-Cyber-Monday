- id: eval-17
  title: Backfilled fields are served as 'unvalidated' until 40 of their rows have been human-checked at 0.8 agreement; the
    memo's one-time batch extraction writes to a staging field, not a trusted one
  level: L4
  cell:
    part: query-path
    query-path: lazy-backfill-extraction
    schema-evolution: lazy-backfill-on-demand
    extraction-trigger: on-first-question
    uncertainty-policy: abstain-below-coverage
    question-type: outside-game-target
    latency-tier: minutes
  object: 'memo.md item 2: ''genuinely new questions trigger a one-time batch extraction over all sessions whose result is
    cached as a new field'''
  situation: A producer asks 'how many players mentioned the art style during the tutorial?'; the planner backfills a new
    field over 500 sessions in 4 minutes and would cache it as trusted
  consequence: 'The first answer says ''unvalidated: 62 of 500; 40 rows queued for a 2-hour check''; after the check the field
    is promoted or the answer is corrected; a wrong number is never cached as trusted'
  p_typical: 0.09
  grounded: quote
  evidence: 'memo.md: ''cached as a new field, so the question set grows from real use'''
  proposed: field_registry.status starts at 'staging'; a 40-row review task is created automatically; promotion to trusted
    sets status and re-sends the corrected answer to the asker
  shallow: false
  mechanism: The backfill job writes rows with status=staging; the planner can read staging rows but renders them with the
    unvalidated prefix; a reviewer tool shows 40 random rows with their 10 s clips; agreement >= 0.8 promotes
  example: '''Mentioned art style in the tutorial'' backfill returns 62; review of 40 rows finds 34 correct (0.85); field
    promoted and the producer gets a follow-up message ''62 of 500, now validated'''
  cost: S
  depends_on: backfill path from memo item 2; reviewer tool with clips
  part: query-path
  ingest_cost: M
  query_cost: M
  better_than_fixed_table: Fixed table cannot grow at all; this lets it grow without any new field being trusted on faith
  _from_file: E-eval-lead.yaml
- id: eval-23
  title: 'Aggregate-list reconciliation: every count the chatbot returns must equal the length of the per-player list produced
    by the same filter; a nightly job re-runs the last 200 count answers as list queries and any mismatch fails the release'
  level: L4
  cell:
    part: query-path
    query-path: precomputed-aggregate
    evidence-form: per-player-list
    question-type: how-many
    scope: all-players
    latency-tier: sub-200ms-cached
    representation: olap-cube-materialized-views
  object: 'memo.md item 2: ''closed-field questions become aggregate queries over all players (instant)'''
  situation: A materialised aggregate says 83 players confused; the per-player list from the raw observation rows has 79 because
    4 sessions were excluded by the stitching validator after the aggregate was built
  consequence: The mismatch is caught in the nightly job, not by the studio clicking 'show me the players' and counting 79
  p_typical: 0.04
  grounded: quote
  evidence: 'memo.md: ''aggregate queries over all players (instant)'' (instant implies materialisation, which implies staleness)'
  proposed: Reconciliation job over answer_log count answers; mismatch table (question_id, agg_count, list_count, cause);
    release gate
  shallow: false
  mechanism: Each count answer stores its filter; nightly, the filter runs as SELECT session_id against raw rows; counts compared;
    any delta > 0 is attributed (stale aggregate, exclusion, schema version) and blocks the next deploy until the aggregate
    is rebuilt
  example: '''83 of 500 confused in the tutorial'' vs list of 79; cause: 4 sessions excluded by eval-6 after the cube refresh;
    cube is rebuilt and the studio''s cached answer updated to 79'
  cost: S
  depends_on: eval-8 answer_log; materialised aggregates
  part: query-path
  ingest_cost: S
  query_cost: S
  better_than_fixed_table: Fixed table has one path so cannot disagree with itself; once aggregates are materialised, this
    is what keeps the fast path honest
  _from_file: E-eval-lead.yaml
- id: eval-28
  title: 'Pre/post comparison rule: ''did the fix work'' answers require both builds extracted under the same schema version
    and at least 50 sessions each; otherwise the chatbot re-extracts the older build (overnight) before answering, and says
    so'
  level: L4
  cell:
    part: query-path
    question-type: did-the-fix-work-pre-post
    scope: build-version-pair
    schema-evolution: eager-backfill-all-history
    uncertainty-policy: abstain-below-coverage
    latency-tier: overnight
    evidence-form: contrast-vs-baseline
  object: 'memo.md item 2: query planner; spec.md Constraints: ''Answering a studio''s question must be fast'''
  situation: Build 1.2 sessions were extracted under schema v6, build 1.3 under v7 with a changed friction definition; a designer
    asks whether the step-3 fix worked
  consequence: The chatbot answers 'comparison needs a re-extraction of 180 build-1.2 sessions under v7, running tonight'
    instead of a number that mixes definitions
  p_typical: 0.04
  grounded: inferred
  evidence: 'memo.md: nothing constrains comparisons across schema versions; spec.md Unspecified: build versions are not named'
  proposed: Planner rule compare_builds requires same schema_version and n >= 50 per side; otherwise schedules reextract(build,
    schema_version) and returns an ETA
  shallow: false
  mechanism: The planner reads provenance (eval-3) per build; a mismatch creates a batch job over the older build's sessions;
    the answer is sent to the asker when the job finishes
  example: '''Did the step-3 change in 1.3 reduce quits?'' -> ''Not yet comparable (v6 vs v7). Re-extracting 180 sessions
    of 1.2 tonight; answer tomorrow 09:00.'' Next day: ''28% -> 19%, same definition, 180 vs 220 sessions'''
  cost: S
  depends_on: eval-3 provenance; batch re-extraction job
  part: query-path
  ingest_cost: M
  query_cost: S
