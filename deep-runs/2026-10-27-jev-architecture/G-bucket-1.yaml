- id: sec-5
  title: Planner-generated SQL runs under a per-studio database role with row-level security on studio_id and game_id, an
    allowlist of 6 tables, and a 5,000-row cap; a query naming any other table or lacking a studio predicate is rejected before
    execution
  level: L4
  part: query
  cell:
    part: query-path
    query-path: sql-over-closed-fields
    tenancy-and-deployment: logically-isolated-per-studio
    latency-tier: under-2s
    question-type: how-many
    user-segment: studio-analyst
    scope: all-players
  object: memo item 2 "closed-field questions become aggregate queries over all players (instant)"
  situation: Every closed-field question the planner turns into SQL, including follow-ups that modify a prior query
  mechanism: 'The planner emits SQL as a parameter set (tables, filters, group-by, aggregates) rather than free text; a compiler
    renders it and the database role for studio S can read only observations, sessions, videos, steps, players, builds filtered
    by studio_id = S through row-level security policies. The compiler rejects: any table outside the 6; any missing game_id
    predicate when the studio has more than 1 game; result sets over 5,000 rows; any write verb. Rejections return the reason
    to the planner for one retry, then abstain.'
  example: 'Studio A asks "What share of players abandoned tutorial step 4 in build 1.3?" The compiler renders a count over
    step_exit rows with studio_id = A, game_id = 7, build = ''1.3'': 61/480 = 12.7%. The same question with an injected "union
    select from studio B" cannot be expressed because tables and predicates are parameters, not text.'
  consequence: A text-to-SQL mistake or an injected question cannot read another studio or a non-allowlisted table; some legitimate
    ad-hoc joins (to a telemetry table a studio uploads) need the table added to the allowlist by an admin
  better_than_fixed_table: The fixed table chatbot runs over one flat table; this keeps the instant path while making cross-tenant
    reads impossible by construction
  ingest_cost: S
  query_cost: S
  cost: S
  depends_on: observation log with studio_id and game_id on every row
  willingness: high
  p_typical: 0.2
  grounded: quote
  evidence: 'memo: "closed-field questions become aggregate queries over all players (instant)"'
  proposed: Parameterised query plan plus RLS roles and a 6-table allowlist
  shallow: false
