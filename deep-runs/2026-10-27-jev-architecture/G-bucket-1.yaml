    to group-by over closed fields plus a 20-row stratified sample of quotes, and says so
  level: L4
  cell:
    part: query-path
    query-path: retrieval-then-llm
    mechanism-type: narrow-or-clarify-the-question
    latency-tier: under-2s
    evidence-form: coverage-statement-n-of-m-players
    uncertainty-policy: answer-with-ci-and-n
    question-type: what-said
  object: 'memo.md point 2: ''the model reads only those'''
  situation: '''what did players say during the tutorial'' matches 180k observation rows'
  consequence: Without a ceiling the call either fails or costs ~20M tokens; with it the answer is 'sentiment by step (counts)
    + 20 sampled quotes stratified by step and sentiment; based on 20 of 180,412 rows' in 1.9 s
  p_typical: 0.09
  grounded: inferred
  evidence: 'spec.md: ''too slow and too much data'''
  proposed: 'Planner rule: if estimated_tokens(rows) > 30k then plan = closed-field group-by + stratified sample(20) + coverage
    statement; the asker gets a ''narrow to a step'' suggestion'
  shallow: false
  mechanism: Query path guard that rewrites over-broad retrieval plans into aggregate-plus-sample plans
  example: '''what did players say during the tutorial'' -> ''Negative sentiment peaks at step 3 (31% of 42k utterances);
    20 sampled quotes follow; narrow to a step for full coverage'''
  cost: S
  depends_on: latency-16 columnar log for the group-by
  part: query
  ingest_cost: S
  query_cost: S
  better_than_fixed_table: Keeps broad open questions inside the fixed table's latency while being explicit about coverage
    instead of silently truncating
  _from_file: E-latency-cost-engineer.yaml
