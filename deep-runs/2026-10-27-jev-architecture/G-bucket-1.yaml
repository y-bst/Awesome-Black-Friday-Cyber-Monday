  _from_file: E-latency-cost-engineer.yaml
- id: longctx-1
  title: 'Query-time map-reduce: 500 parallel calls, each reads one player''s whole stitched session transcript with the studio
    question, returns {answer, quote, timestamp} JSON; one reduce call aggregates'
  level: L4
  cell:
    part: query-path
    representation: raw-transcript-only
    query-path: map-reduce-over-raw
    granularity: session
    scope: all-players
    latency-tier: under-30s
    question-type: how-many
    mechanism-type: defer-to-query-time
    evidence-form: count-with-denominator
  object: 'spec.md step 4: ''Reading 500 transcripts per question was too slow and too much data, which is why the fixed-question
    table exists'''
  situation: A studio asks a question the fixed table has no column for; the store has 500 players with a 2-hour session each
    (8 videos, speech-only transcript about 26k tokens per session, 13M tokens total)
  consequence: The question is answered from the full transcript in one pass instead of being refused; the 'too slow' claim
    in spec.md was true for sequential reads and is false for 500 concurrent calls of 26k tokens each (each call returns in
    4-8 s; wall-clock 10-20 s)
  p_typical: 0.35
  grounded: quote
  evidence: 'spec.md: ''Reading 500 transcripts per question was too slow and too much data'''
  proposed: Fan out one call per session, require a JSON object per player, reduce with a second prompt; 13M input tokens
    at $1/M is $13 per question uncached, $1.30 with prefix caching
  shallow: false
  mechanism: Chatbot planner builds prompt = [session transcript as cached prefix] + [question + output schema]; 500 calls
    run with concurrency 500; map outputs (about 200 tokens each) are concatenated (100k tokens) into one reduce call that
    emits counts with denominators and 5 example quotes
  example: 'Studio asks ''How many of the 500 players quit during the tutorial, and at which step?''; each map call returns
    {quit_in_tutorial: true, step: ''build a farm'', quote: ''this is taking forever'', t: ''00:21:14''}; reduce reports ''quit
    in tutorial: 61/500 (12%); step 3 build-a-farm: 34 of the 61'''
  cost: M
  depends_on: session stitching into one ordered transcript per player (longctx-4); concurrency limit of at least 500 on the
    model API
  part: query
  ingest_cost: S
  query_cost: L
  better_than_fixed_table: Answers any question, including ones nobody wrote, with a per-player quote; the table answers only
    the questions written per game target
  _from_file: E-long-context-skeptic.yaml
- id: longctx-3
  title: 'Sampled map-reduce with a confidence interval: read 50 random sessions first and answer in about 3 s as ''k/50 (95%
    CI)'', then keep reading to 500 and tighten the number in the same chat message'
  level: L4
  cell:
    part: query-path
    query-path: sampled-map-reduce-with-ci
    latency-tier: progressive-streaming
    uncertainty-policy: give-range-then-refine
    evidence-form: count-with-denominator
    scope: all-players
    mechanism-type: approximate-then-refine
    question-type: how-many
  object: 'spec.md step 4: ''a question over, say, 500 players is fast'''
  situation: Question is a prevalence question (how many, what share); the full 500-session read would take 15-25 s
  consequence: The analyst sees a usable range in 3 s and the exact figure 20 s later; a question whose answer is 0/50 or
    50/50 can be stopped early (Wilson interval already tight enough for the decision)
  p_typical: 0.15
  grounded: inferred
  evidence: 'spec.md: ''Answering a studio''s question must be fast'''
  proposed: Planner samples n=50 uniformly by player id, computes a Wilson 95% interval, streams 'provisional 12/50 (24%,
    CI 14-37%)', then updates to '61/500 (12.2%, CI 9.6-15.4%)'
  shallow: false
  mechanism: Two-phase fan-out; phase 1 returns in parallel over 50 sessions; the chat message is a live object that the reduce
    step rewrites as phases complete; the CI is computed from counts, not by the model
  example: '''What share of players skipped the step-4 crafting tutorial?'' shows ''about 1 in 4 (CI 14-37%), reading the
    rest...'' at 3 s and ''23% (116/500, CI 20-27%)'' at 22 s'
  cost: M
  depends_on: longctx-1
  part: query
  ingest_cost: S
  query_cost: M
  better_than_fixed_table: First number arrives in the same time the table would take, for a question the table does not have,
    and it carries a CI the table never shows
  _from_file: E-long-context-skeptic.yaml
- id: longctx-6
  title: 'Cost-curve routing rule in the planner: estimate tokens = n_sessions x avg_session_tokens; under 20M tokens and
