- id: tar-2
  title: 'Continuous active learning (CAL) loop for find-players-who: seed from the first retrieval hits, train a per-question
    ranker over all 500 sessions, review the top 50 per round, retrain, stop when 3 consecutive rounds yield under 2 new positives'
  level: L3
  cell:
    part: query-path
    query-path: progressive-answer-then-refine
    question-type: find-players-who
    mechanism-type: approximate-then-refine
    latency-tier: progressive-streaming
    evidence-form: per-player-list
    effort: M-one-quarter
  object: 'memo.md item 2: ''genuinely new questions trigger a one-time batch extraction over all sessions'''
  situation: A new question with prevalence around 10% over 500 sessions; a flat batch extraction reads all 500 session logs
    before the first answer appears
  consequence: CAL reads about 150 to 200 session logs (rounds of 50) to reach stabilisation at 10% prevalence instead of
    500, and the studio sees a growing player list after round 1 (about 20 seconds) rather than after the full batch
  p_typical: 0.08
  grounded: quote
  evidence: 'memo.md: ''genuinely new questions trigger a one-time batch extraction over all sessions whose result is cached
    as a new field'''
  proposed: 'Ranker = logistic regression over TF-IDF of observation text plus closed-field one-hots per session; round r:
    score all unreviewed sessions, LLM-code top 50 against the protocol, add labels, retrain; emit the positive list after
    each round; stop rule: 3 rounds with under 2 new positives, then run tar-1 on the remainder'
  mechanism: 'Changes the query path for per-player-list questions: {question, protocol} produces a stream of {round, n_reviewed,
    n_positive, players[]} records and a final recall estimate, instead of one batch job'
  example: '''Find players who never discovered the dodge button in the tutorial'': round 1 seeds from 11 retrieval hits,
    round 4 has 48 positives after 200 sessions coded, rounds 5 to 7 add 1, 0, 1; stop; elusion on the 300 unread confirms
    recall 91%'
  cost: M
  depends_on: observation log rows per session (memo.md item 1); an LLM coder that returns a binary code per session for a
    protocol
  part: query-path
  ingest_cost: S
  query_cost: M
  better_than_fixed_table: A new question that is not in the table costs one ranked pass of 150 to 200 reads with a recall
    number, not a 500-read batch with none
  shallow: false
  _from_file: E-ediscovery-tar-practitioner.yaml
