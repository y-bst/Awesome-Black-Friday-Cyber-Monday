- id: "latency-12"
  case: "Defer it, and when it is built, fold it into the semantic cache (latency-2) rather than keeping it as its own option. spec.md sets the query budget at a few seconds, and the option's own example shows the memo's closed-field cube path already answers 700 of the 900 candidate questions in under 2 s, so the 110 ms bank hit buys speed the constraint does not ask for, while the cost is real: 200 questions x 9 cohorts = 1,800 natural-language answers that must be regenerated whenever players are added or a build changes. The speed also comes with a correctness risk that the owner's brief ('fast, correct') cares about more: matching a studio's paraphrase to a stored question at cosine similarity will sometimes return the answer to a nearby question with a different cohort, step or build filter, and it will do so confidently and in 110 ms. The option depends on an ontology generator that three contesting options (convo-21, longctx-8, qgen-16) refuse as the primary question source, and on a ranking signal that does not exist until a query log does; until then the 'top 200' is ranked by the owner's churn targets, which is the same tutorial-churn question set the fixed table already covers. Studio questions are stated to be unknown, so a bank of ontology guesses is a bet on the head of a distribution nobody has measured, and the long tail falls through to the planner anyway. The honest remaining value is as a warm-start seed for latency-2 after the first month of real queries, when the ranking is measured instead of guessed."
- id: "qgen-10"
  case: "Reject as a separate option and fold the useful part into owner-31 (the per-step table it is explicitly a variant of) and latency-15 (per-player step state-machine rows), both already in the top 25. It only helps tutorial questions, which is the one area the existing fixed table already targets (spec.md: targets are 'mostly detecting churn in the tutorial'), so it does little for the stated problem that most of the video is never captured outside the tutorial. The decisive weakness is the dependency: it needs a screen-state classifier that recognises step boundaries and a per-game step list from qgen-2, and neither is built; without them the six fields are filled by the model guessing from transcript, and exit_reason as an enum per step is exactly the kind of field where a model will pick a plausible label with no visual grounding. Only two of the six templates (entered, dwell_s) are cheap and reliable; first_utterance_after_enter is a trivial text lookup, and attempts and skipped are definitions that vary by game and by step. Fixing the count at exactly six, when owner-31 uses eight columns, is arbitrary, and a fixed per-step schema is the fixed-table approach again at finer granularity rather than a question-generation framework that generalises to games with no steps. Keeping the transition log as source with a materialised view is sound, but that is a store design that belongs to the per-step table, not a question-generation option."
- id: "extract-3"
  case: "Defer; the cross-video stall problem is real, but a carried card is the wrong mechanism and it is already covered by the session roll-up and stitching options (stitch-27, stitch-1, obs-29). Chaining makes video k+1 extraction depend on video k, which turns a parallel batch job into a serial one for a 12-video session and means any reprocessing of video 3 forces reprocessing of 4 through 12; the owner says ingestion cost is fine, but serial latency to first answer and the re-run blast radius are real operating costs. Worse, the card is an unaudited free-text summary written by the model: a wrong 'current_step' or a hallucinated open friction on video 3 is then injected as ground truth into every later prompt and compounds, with nothing in the design to detect it. The cost of the card is paid on every video to fix the minority of cases where video 5 begins with an unresolvable pronoun, and the free-string labels in open_frictions make the 'resolved_frictions references since_ts' matching fragile, since the model must reproduce a label verbatim. The stated example answer (median stuck time across videos) can be computed after the fact by merging friction rows with the same step across the stitched session timeline, with no serial dependency and with a model that reads the whole session's observation log in one pass; the frame's assumption of a modern long-context model makes that available. The spec also lists video linkage as unspecified, so the card has no reliable ordered input yet, and the stitching option has to be built first anyway."
- id: "extract-28"
  case: "Fold into the per-step table and the planner's answer rendering, and reject the fallback chain as a standalone ingestion build. The one valuable idea is the denominator statement ('step identified for 470 of 500 players') with a flag when coverage shifts between builds; that is cheap, belongs in answer formatting (planner-1 evidence form, stat-7), and needs no new ingestion machinery. The chain itself rests on a frame classifier that does not exist, trained per game on a specific build's screenshots, so the option builds a classifier-staleness problem and then a fallback to paper over it. The OCR stage needs a per-game glossary of step prompt strings, which is the hand-written per-game content that the frame says does not scale across many studios, and the speech stage with its 'conf<=0.6' and the 0.8 fuzzy threshold are invented numbers with no calibration plan or labelled sessions behind them. A modern multimodal model at ingestion, given the step list, can name the step from frames directly without a trained classifier, which removes both the stale-classifier scenario and the chain. The scenario motivating it (build 1.2 restyles the UI and two of nine steps collapse) is an edge case, and the option's evidence is a one-word quote from memo.md ('step on screen') that does not mention fallbacks or coverage. The confidence stored per window also multiplies row width across every ingested window for a benefit that is realised only at version-compare questions."
- id: "playfill-10"
  case: "Defer until the play_unit table (playfill-1) and its alias catalogue exist, and then fold into the typed planner (planner-1). It has a hard dependency on a per-game unit catalogue with aliases, which is hand-curated per-game content and the same scaling problem the frame warns about, and it is marked 'inferred' in its own evidence, with no spec or memo line asking for it. The scenario is non-tutorial play (bosses, matches, runs), while spec.md says the targets are mostly tutorial and the period just after it, so the first quarter's studio questions largely do not touch this path. The planner is a language model reading the question: if the catalogue's unit labels and aliases (a few hundred strings per game) are placed in its context, it resolves 'the Warden' to boss_warden_of_ash without a hand-built edit-distance and embedding pipeline, and handles nicknames and typos better than a 2-edit threshold or a 0.85 cosine cut that someone must tune. The 0.8 s versus 6-minute comparison is a straw man, since a planner with a schema-aware prompt would not start a backfill for a field that exists. OCR'd labels that feed the fuzzy match are themselves noisy, so the resolver's accuracy is capped by cv OCR quality that is not yet built. The hard-coded clarifying reply about 'match-or-round-based' also presupposes a manifest declaration that no other option guarantees. Keep the idea as a prompt-time catalogue injection, not a separate component."
