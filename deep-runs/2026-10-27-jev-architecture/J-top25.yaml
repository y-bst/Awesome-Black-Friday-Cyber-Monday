- id: extract-3
  title: 'Session state card carried across videos: after video k is extracted, a 200-token card (current step, unresolved
    friction, player traits, inventory) is prepended to the video k+1 prompt and stored per boundary'
  part: ingestion
  mechanism: 'Extraction output for each video includes a state_card object: {current_step, open_frictions: [{label, since_ts}],
    traits: [max 5 short strings], last_goal_stated}. The next video''s prompt starts with the card; the model must emit resolved_frictions
    referencing since_ts when a friction closes. Store table session_boundary(session_id, video_idx, state_card_json)'
  example: Studio asks 'how long did players who quit during the tutorial spend stuck before quitting?' Answer uses open_frictions
    since_ts to end-of-session timestamps across videos; median 14 min 20 s over 37 churners, rather than per-video durations
    capped at 15 min
  situation: Video 5 of a 12-video session begins with the player saying 'still can't find it'; extracted alone, 'it' is unresolvable
    and friction_type defaults to none
  consequence: Cross-video stalls (the ones most likely to precede churn) are undercounted; a 40-minute hunt for the map button
    appears as 3 unrelated low-severity rows
  grounded: quote
  evidence: 'spec.md: ''A session can be n hours; each video is capped at 15 minutes, so one session is many videos.''; ''Long
    multi-video sessions.'''
  scores:
    impact: 4.0
    confidence: 4.0
    fit: 4.0
    cost: 2.0
    query_speed: 5.0
  priority: 80.0
  depends_on: ordered video index per session (spec says linkage is unspecified)
  better_than_fixed_table: Fixed table answers per video and cannot express a friction that lasts across 3 videos
  contested_by: null
  variants_of: null
- id: extract-28
  title: 'Step identification with explicit fallback chain: step_id comes from the frame classifier, then OCR match of on-screen
    prompt text against the step list, then speech; the chosen source and a confidence are stored, and rows with step_id=unknown
    are excluded from step denominators with a coverage statement'
  part: ingestion
  mechanism: 'Per window: step_source in {frame_classifier, ocr_match, speech, unknown}, step_conf 0-1. OCR match: on-screen
    prompt text fuzzy-matched (>=0.8) against the glossary''s step prompt strings. Speech fallback: the model infers step
    from utterances with conf<=0.6. Materialised per game and build: step_coverage(step_id, n_players_identified, n_players_total).
    Chatbot: any per-step answer prints ''step identified for 470 of 500 players''; an answer where coverage differs by more
    than 10 points between two builds is flagged'
  example: 'Studio asks ''did the stealth step stall rate improve in 1.2?'' Answer: ''1.1: 22% (step identified for 480 of
    500); 1.2: 9% (step identified for 310 of 500, coverage drop flagged, classifier likely stale)'''
  situation: The frame classifier is trained on build 1.1 screenshots; build 1.2 restyles the tutorial UI and step_id confidence
    collapses for 2 of 9 steps
  consequence: Step-level counts for those 2 steps silently drop to near zero and a compare-versions answer says the steps
    were 'fixed'
  grounded: quote
  evidence: 'memo.md: ''step on screen'''
  scores:
    impact: 4.0
    confidence: 4.0
    fit: 4.0
    cost: 2.0
    query_speed: 5.0
  priority: 80.0
  depends_on: frame classifier; glossary with step prompt strings
  better_than_fixed_table: The fixed table does not know how it decided which step it was answering about
  contested_by: null
  variants_of: null
- id: playfill-10
  title: 'Planner unit resolver: question nouns (boss, match, run, level, quest, floor, round, mission) map to unit_type,
    named entities (''the Warden'', ''Drowned Bell'') fuzzy-match a unit_id from OCR''d labels, and the plan groups by play_unit
    instead of falling to retrieval; a noun with no unit_type in the manifest gets a clarifying reply naming the declared
    structure'
  part: query-path
  mechanism: 'Step 1: extract unit nouns and named entities. Step 2: map nouns to unit_type via lexicon; map names to unit_id
    by edit distance (2 or less) or embedding cosine 0.85 or more against catalogue labels and aliases. Step 3: emit plan
    over play_unit or cube. If no unit_type maps, reply ''This game is declared match-or-round-based; did you mean match?'''
  example: '''Who quit after the Warden fight in hour 3?'' -> ''Warden'' maps to boss_warden_of_ash (edit distance 2 from
    ''WARDEN OF ASH''); plan filters session_hour=2, outcome=failed, last in session: ''29 players, list with a clip of each
    final attempt'', 0.8 s instead of a 6-minute backfill'
  situation: Any non-step game (play-structure not in C-axes; nearest granularity level-quest-match-mission); the question
    names a boss by a nickname the studio uses, not the on-screen label
  consequence: Without the resolver the planner sees no matching closed field and starts a backfill of several minutes; with
    it the same question is a filtered SQL query in under 1 s
  grounded: inferred
  evidence: 'memo.md: ''closed-field questions become aggregate queries over all players (instant)'' (routing to the instant
    path depends on a closed field matching; mapping unit nouns and names to such a field is not described)'
  scores:
    impact: 4.0
    confidence: 4.0
    fit: 4.0
    cost: 2.0
    query_speed: 5.0
  priority: 80.0
  depends_on: playfill-1; unit catalogue with aliases
  better_than_fixed_table: The fixed table has no entity names beyond tutorial steps; the resolver lets studio vocabulary
    hit unit rows directly
  contested_by: null
  variants_of: null
