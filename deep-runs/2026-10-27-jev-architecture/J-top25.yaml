  - longctx-8
  - qgen-16
  variants_of: null
- id: qgen-10
  title: 'Per-step transition templates: for each tutorial step in the entity table, generate exactly 6 questions (entered,
    dwell_s, attempts, exit_reason enum, skipped, first_utterance_after_enter) from a step state machine'
  part: question-generation
  mechanism: question-generation emits the 6 templates per step; ingestion fills them from the screen-state classifier plus
    transcript; store keeps the transition log as the source and the 54 fields as a materialised view
  example: '''where do players drop in the tutorial'' -> exit_reason per step: step 7 has abandoned=18% vs <=4% elsewhere;
    dwell p50 at step 7 is 6m40s; first utterance after entering step 7 is ''what now'' for 61 players'
  situation: A tutorial has 9 steps; hand-written questions cover steps 1, 3 and 5 because those were the known problems
  consequence: A stall at step 7 is invisible until a studio reads transcripts
  grounded: quote
  evidence: 'spec.md Known problems: "The question set is small, so most of what is in the video and transcript is never captured."'
  scores:
