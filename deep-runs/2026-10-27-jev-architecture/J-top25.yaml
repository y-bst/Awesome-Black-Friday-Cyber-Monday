    per session with the coverage basis, so ''how many players never opened X'' has a denominator'
  part: ingestion
  mechanism: 'Session-level pass after all videos: for each step_id in the game''s step list, output {status: seen|not_seen|unknown,
    first_ts, basis: frames|speech|both|no_coverage}. unknown is forced when any video of the session is missing or when frame
    coverage for the session is under 80%. Store step_presence(session_id, step_id, status, basis)'
  example: 'Studio asks ''how many players never opened the inventory during the tutorial?'' Answer: ''85 of 445 players with
    full coverage (19.1%); 55 sessions excluded for missing video, so the range is 85-140'''
  situation: Studio asks how many players never reached the inventory tutorial; the store only has rows for things that happened,
    and absence of a row can mean 'did not happen' or 'video 7 was not processed'
  consequence: Chatbot reports 140 of 500 'never reached' when 55 of those are sessions with a missing video; the studio redesigns
    a step that was fine
  grounded: inferred
  evidence: 'memo.md: ''closed-field questions become aggregate queries over all players (instant)'' (an aggregate needs a
    denominator, and a missing row cannot distinguish absence from an unprocessed video)'
  scores:
    impact: 4.0
    confidence: 4.0
    fit: 4.0
    cost: 2.0
    query_speed: 5.0
  priority: 80.0
  depends_on: step list per game; session completeness flag from the stitcher
  better_than_fixed_table: The fixed table cannot distinguish 'no' from 'not observed'; this stores both
  contested_by: null
  variants_of: clinical-13
- id: stitch-27
  title: 'Session roll-up pass: after per-segment extraction, one LLM call reads the session''s concatenated observation rows
    (not raw transcript, about 2-4k tokens) and writes session-scope fields: quit_reason, churn_step, arc_summary, 3 representative
    evidence URIs'
  part: ingestion-extraction
  mechanism: 'Changes ingestion and store: one extra call per session over 2-4k tokens; outputs are session-scope closed fields
    queryable by SQL and an open summary for retrieval'
  example: '''Top 3 reasons players quit the tutorial'' = GROUP BY quit_reason: ''could not find objective'' 17, ''combat
    too hard'' 12, ''crash'' 8, each with 3 evidence URIs, in under 2s'
  situation: The observation log has 400 rows for a session; the studio's most common question, 'why did this player quit',
    needs a judgement over all of them
  consequence: Answering at query time means reading 500 x 400 rows per question; answering per video gives 10 contradictory
    quit reasons
  grounded: quote
  evidence: 'memo.md: ''Ingestion produces a session-level observation log, not answers'''
