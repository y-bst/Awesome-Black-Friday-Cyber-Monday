- id: latency-12
  title: 'Precomputed question-answer bank: the top 200 ontology-generated questions per game are answered at ingestion for
    the all-players cohort and the 8 standard segments, and the planner''s first branch is bank lookup'
  part: question-generation
  mechanism: Question generation output feeds an ingestion-time answer job; the chatbot's semantic cache (latency-2) is seeded
    with the bank
  example: 'Ontology question ''exit rate per tutorial step'' x segment ''mobile'' is precomputed; studio asks ''where do
    mobile players drop in the tutorial'' -> bank hit, 110 ms: ''step 3: 44% of 212 mobile players; step 1: 9%; ...'''
  situation: The ontology prunes to ~900 candidate questions; 200 of them (ranked by coverage of real studio questions, memo
    point 3) are worth precomputing
  consequence: Any studio question that paraphrases one of the 200 returns in under 200 ms with the stored evidence refs;
    the remaining 700 are answered by cube or column scan in under 2 s; bank size x 9 cohorts = 1,800 rows per game per build,
    trivial storage
  grounded: quote
  evidence: 'spec.md Constraints: "Ingestion time and cost are not a concern. Answering a studio''s question must be fast."'
  scores:
    impact: 4.0
    confidence: 4.0
    fit: 4.0
    cost: 2.0
    query_speed: 5.0
  priority: 80.0
  depends_on: ontology generator and a ranking signal (initially the owner's churn targets, later the query log)
  better_than_fixed_table: It is the fixed table done 10x wider and per segment, generated instead of hand-written, and demoted/promoted
    by usage rather than frozen
  contested_by:
