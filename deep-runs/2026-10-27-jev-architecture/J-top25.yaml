    fit: 4.0
    cost: 2.0
    query_speed: 5.0
  priority: 80.0
  depends_on: screen-state classifier that recognises step boundaries; step list per game (qgen-2)
  better_than_fixed_table: covers every step uniformly instead of the 3 someone guessed; timeline questions become a funnel
