- id: store-16
  title: "tutorial_steps table as the source of truth per (game_id, build_id): ordinal, name, expected_duration_s, screen_signature, success_condition"
  level: L4
  cell: {part: store, representation: step-funnel-state-machine-per-player, granularity: build-version, question-origin: onboarding-interview-with-studio, moment-in-journey: game-onboarding-day-0, subject-domain: onboarding-tutorial}
