  title: "queries log table (question_text, plan_type, fields_used, abstained, latency_ms, rating) feeding a weekly 'fields to add' proposal"
  level: L4
  cell: {part: feedback-loop-from-query-log, representation: question-answer-bank-precomputed, granularity: game, question-origin: failed-query-log, extraction-trigger: scheduled-batch, moment-in-journey: steady-state-weekly}
  object: "memo.md item 2: 'so the question set grows from real use'"
  situation: "Over a week the chatbot abstained 23 times; 9 of those asked, in different words, whether players noticed the crafting hint"
  consequence: "Without a log those 9 asks vanish; with it the Monday job clusters them (cosine>0.85) and proposes one field with 9 example questions attached"
  p_typical: 0.09
  grounded: quote
  evidence: "memo.md item 2 and item 3 'coverage of real studio questions'"
  proposed: "queries(query_id, studio_id, game_id, asked_at, question_text, embedding, plan_type enum{aggregate,sql,retrieval,backfill,cache,abstain}, fields_used[], latency_ms, abstained bool, user_rating, answer_id); weekly job writes proposed_fields rows"
  shallow: false
  mechanism: "Planner logs every ask; a scheduled job clusters abstained and low-rated asks and inserts proposals into the fields registry with origin=studio-question for review"
  example: "Proposal: field noticed_crafting_hint (bool, evidence_required), from 9 abstained questions; approved Monday, backfilled by Tuesday"
  cost: S
  depends_on: "store-4"
  part: feedback-loop-from-query-log
  ingest_cost: S
  query_cost: S
  better_than_fixed_table: "The question set grows from what studios actually asked and could not get"

- id: store-35
  title: "field_cost ledger (tokens_ingest, usd_ingest, queries_served_90d); fields unqueried for 90 days stop being extracted for new sessions"
  level: L4
  cell: {part: cost-governance, representation: question-answer-bank-precomputed, granularity: game, extraction-trigger: on-new-field-added, mechanism-type: reuse-or-cache-prior-work, user-segment: jev-internal-ops}
  object: "memo.md item 2: 'one-time batch extraction over all sessions'"
  situation: "After 6 months a game has 140 fields; 80 were asked once"
  consequence: "Extracting 140 fields per new session costs 3.5x the original 40; the ledger retires the 80 from the per-session prompt while keeping their history and allowing lazy re-enable"
  p_typical: 0.06
  grounded: inferred
  evidence: "spec.md: 'Ingestion time and cost are not a concern' (true at 40 fields, not at 400)"
  proposed: "field_cost(field_id, game_id, tokens_ingest_total, usd_ingest_total, queries_served_90d, last_queried_at, status enum{active,dormant}); ingestion prompt includes only active fields; a dormant field asked again moves to the backfill queue"
  shallow: false
  mechanism: "Store tracks cost per field from extractor_runs and usage from queries; a monthly job flips status"
  example: "noticed_crafting_hint served 11 queries in 90 days (active); 'mentions_music' served 0 (dormant); new sessions skip it; if asked, backfill runs over the gap"
  cost: S
  depends_on: "store-18, store-34"
  part: cost-governance
  ingest_cost: S
  query_cost: S
  better_than_fixed_table: "The question set can grow without the ingestion bill growing linearly forever"

- id: store-36
  title: "Boundary dedup rule: a step_change or utterance within 2,000 ms of a video boundary that matches the first observation of the next video is merged, with dedup_of recorded"
  level: L4
  cell: {part: session-stitching, representation: timestamped-observation-log, granularity: video, extraction-trigger: at-ingestion, question-type: how-many, evaluation: null}
  object: "spec.md item 1: 'each video is capped at 15 minutes'"
  situation: "Video 4 ends mid-sentence at 14:59.8; video 5's extraction re-emits the same 'where is the anvil' utterance and a second step_change into step 3"
  consequence: "Counts of attempts and quotes are inflated at every boundary (up to 16 boundaries per 4-hour session); the rule removes the duplicates and keeps a trace"
  p_typical: 0.05
  grounded: inferred
  evidence: "spec.md 'Long multi-video sessions'"
  proposed: "observations.dedup_of nullable obs_id; stitcher compares the last 2,000 ms of video k with the first 2,000 ms of video k+1 on (kind, step_id, normalised text) and marks the later row"
  shallow: false
  mechanism: "A post-extraction pass per session; queries exclude dedup_of IS NOT NULL by default"
  example: "player_step_state.attempts for step 3 drops from 2 to 1 for 38 of 500 players after dedup; the 'retried step 3' count goes from 51 to 13"
  cost: XS
  depends_on: "store-1, store-9"
  part: session-stitching
  ingest_cost: S
  query_cost: S
  better_than_fixed_table: "Per-video extraction artefacts stop showing up as player behaviour"

- id: store-37
  title: "asr_confidence and language on every utterance row; prevalence counts exclude rows under 0.6 and report the excluded count"
  level: L4
  cell: {part: store, representation: timestamped-observation-log, granularity: utterance, modality: speech-transcript, evidence-form: confidence-score, uncertainty-policy: answer-with-ci-and-n}
  object: "spec.md item 2: 'Each video is converted to a transcript'"
  situation: "A player mumbles over game audio; ASR emits 'I give up' at confidence 0.41 and the quit_reason extractor cites it"
  consequence: "Low-confidence words drive counts and quotes; a stored confidence lets rate queries filter and the UI mark the quote as uncertain"
  p_typical: 0.07
  grounded: quote
  evidence: "spec.md 'languages' unspecified; item 2"
  proposed: "observations.asr_confidence float, observations.lang char(2); evidence.asr_confidence; SQL rate templates add AND asr_confidence>=0.6 and return excluded_n"
  shallow: false
  mechanism: "Transcript stage passes word-level confidence through; ingestion averages per utterance; planner templates filter"
  example: "'Players who said they gave up at step 3': 29 at confidence>=0.6, 6 more below (listed separately for the designer to listen to)"
  cost: XS
  depends_on: "ASR that returns word confidences"
  part: store
  ingest_cost: S
  query_cost: S
  better_than_fixed_table: "Quotes and counts carry their transcription confidence instead of being taken as fact"
