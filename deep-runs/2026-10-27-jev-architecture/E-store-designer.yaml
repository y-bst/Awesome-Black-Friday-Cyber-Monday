- id: store-1
  title: "Session clock as primary key: observation rows keyed by (session_id, t_session_ms), with video_id and t_video_ms derived from a session_videos offset table"
  level: L4
  cell: {part: store, representation: timestamped-observation-log, granularity: session, query-path: sql-over-closed-fields, extraction-trigger: at-ingestion, schema-evolution: append-only-versioned-fields}
  object: "spec.md: 'each video is capped at 15 minutes, so one session is many videos' and 'The answers form a structured table per video'"
  situation: "A studio asks 'how long did players spend in tutorial step 3' and step 3 straddles video 2 and video 3 of a 6-video session"
  consequence: "With the per-video table the duration is split into two rows that nobody sums; with session-time keys the duration is t_exit - t_enter on one clock"
  p_typical: 0.30
  grounded: quote
  evidence: "spec.md 'Long multi-video sessions' listed as a known problem; 'how videos of one session are linked' listed as unspecified"
  proposed: "observations(session_id, t_session_ms, t_end_session_ms, video_id, t_video_ms, kind, ...) with t_session_ms = sum(duration_ms of earlier videos in session_videos) + t_video_ms"
  shallow: false
  mechanism: "Ingestion writes every observation on a per-session millisecond clock; a session_videos table (session_id, seq, video_id, capture_start, duration_ms) is the only place video order lives; video-level columns are derived, never primary"
  example: "Forge Quest, 500 players: step 3 'craft a pickaxe' entered at t=00:52:10 in video 4, abandoned at t=01:07:30 in video 5; one row pair gives 15m20s, the median over 500 players is one SQL query"
  cost: S
  depends_on: "a reliable video->session link (capture_start timestamps or a session manifest from the recorder)"
  part: store
  ingest_cost: S
  query_cost: S
  better_than_fixed_table: "Answers that cross a 15-minute video boundary (durations, 'what happened after') stop being wrong"

- id: store-2
  title: "Wide-event row: 14 fixed columns plus an attrs VARIANT/JSON column, so a new extracted attribute needs no DDL"
  level: L4
  cell: {part: store, representation: wide-event-schema-on-read, granularity: utterance, query-path: sql-over-closed-fields, schema-evolution: schema-on-read, build-or-buy: open-source-component}
  object: "memo.md item 1: 'closed enum fields and short open fields'"
  situation: "The planner adds a new field 'mentions_controls_confusing' after a studio question; 40,000 existing observation rows need it"
  consequence: "With a fixed-column answers table every new field is an ALTER TABLE plus a rewrite; with attrs it is a key written by the backfill job and read as attrs['mentions_controls_confusing']"
  p_typical: 0.20
  grounded: quote
  evidence: "spec.md: 'The question set is small, so most of what is in the video and transcript is never captured'"
  proposed: "Fixed: session_id, player_id, game_id, build_id, t_session_ms, t_end_session_ms, kind, step_id, confidence, extractor_run_id, evidence_id, modality, text, created_at. Everything else in attrs (ClickHouse JSON / Snowflake VARIANT / DuckDB STRUCT-less JSON)"
  shallow: false
  mechanism: "Store changes from one-column-per-question to one-row-per-observation with a typed JSON attrs map; closed fields that are queried more than 50 times a month get promoted to a real column by a nightly job"
  example: "Query 'players who hit an error message during step 3': SELECT player_id FROM observations WHERE step_id=3 AND kind='error_message' AND attrs.error_text ILIKE '%inventory%' runs in 300 ms over 500 players without any extraction"
  cost: S
  depends_on: nothing
  part: store
  ingest_cost: S
  query_cost: S
  better_than_fixed_table: "Unlimited attributes per row; adding the 41st question does not touch the table definition"

- id: store-3
  title: "Append-only field_values table with (session_id, field_id, field_version, extractor_run_id); no UPDATE ever; 'current' is a view"
  level: L4
  cell: {part: schema-evolution, representation: question-answer-bank-precomputed, granularity: session, schema-evolution: append-only-versioned-fields, evidence-form: extraction-provenance-model-and-schema-version, extraction-trigger: on-model-upgrade}
  object: "spec.md item 3: 'The answers form a structured table per video'"
  situation: "The extraction prompt for 'quit_reason' is rewritten in week 6; 1,200 sessions were answered with v1 and 300 with v2"
  consequence: "An in-place table silently mixes two definitions in one COUNT; append-only lets the chatbot say '1,200 under v1, 300 under v2' or restrict to one version"
  p_typical: 0.12
  grounded: inferred
  evidence: "memo.md item 2: 'result is cached as a new field, so the question set grows from real use' (implies fields change over time; no versioning stated)"
  proposed: "field_values(session_id, field_id, field_version, extractor_run_id, value_json, evidence_ids[], extracted_at); view current_field_values = latest field_version per (session_id, field_id)"
  shallow: false
  mechanism: "Every extracted answer is an immutable row; re-extraction appends; queries default to the current view and can pin a version"
  example: "Studio asks 'did the step-3 quit rate change after we fixed the prompt?' JEV ops answers from the same table: v1 says 18% of 500, v2 says 14% of 500; the chatbot shows both with version tags"
  cost: S
  depends_on: "store-18 extractor_runs table"
  part: store
  ingest_cost: S
  query_cost: S
  better_than_fixed_table: "Re-extraction never destroys the old answer, so prompt regressions are visible and reversible"

- id: store-4
  title: "fields registry table: one row per question with answer_type, options, evidence_required, ontology_path, origin, prompt_hash, game_scope"
  level: L4
  cell: {part: question-generation, representation: question-answer-bank-precomputed, granularity: game, question-origin: ontology-generated, schema-evolution: append-only-versioned-fields, reuse-scope-of-extraction: customer-defined-on-top-of-universal}
  object: "memo.md item 3: 'each with an answer type and an evidence requirement'"
  situation: "The chatbot planner must decide whether 'how many quit at step 3' is answerable by SQL: it needs to know a field exists, its type, and its coverage"
  consequence: "Without a registry the question list lives in prompt files; the planner cannot enumerate what it can answer, and the studio cannot see the list"
  p_typical: 0.09
  grounded: quote
  evidence: "memo.md item 3; spec.md 'current question count and answer types' unspecified"
  proposed: "fields(field_id, name, question_text, answer_type enum{enum,bool,int,duration_ms,text_short,timestamp_list,player_list}, options_json, evidence_required bool, ontology_path, origin enum{ontology,studio-question,backfill,genre-template}, game_scope enum{universal,genre,game}, prompt_hash, created_at, deprecated_at)"
  shallow: false
  mechanism: "Question generation writes rows into fields; extraction reads prompts from fields; the planner reads fields to route; the UI lists fields as 'what you can ask'"
  example: "fields row: name=step3_outcome, answer_type=enum, options=[completed,abandoned,skipped,session_ended], evidence_required=true, origin=ontology, game_scope=game. The planner sees it and routes 'how many abandoned step 3' to SQL"
  cost: S
  depends_on: nothing
  part: question-generation
  ingest_cost: S
  query_cost: S
  better_than_fixed_table: "The question set becomes data: countable, versionable, listable to the studio, and extensible by insert"

- id: store-5
  title: "player_step_state materialised from the observation log: one row per (player_id, step_id) with entered_at, exited_at, outcome, attempts"
  level: L4
  cell: {part: store, representation: step-funnel-state-machine-per-player, granularity: tutorial-step, query-path: precomputed-aggregate, question-type: how-many, subject-domain: onboarding-tutorial}
  object: "spec.md: 'The targets are mostly detecting churn in the tutorial and just after it'"
  situation: "Studio asks 'at which tutorial step do most players drop' across 500 players"
  consequence: "A per-video answer table cannot express 'reached step 4 but never step 5'; the state table answers it with one GROUP BY step_id, outcome"
  p_typical: 0.30
  grounded: quote
  evidence: "memo.md item 1 'step on screen' observation; spec.md churn target"
  proposed: "player_step_state(player_id, session_id, step_id, entered_at_ms, exited_at_ms, outcome enum{completed,abandoned,skipped,stuck_gt_threshold,session_ended,not_reached}, attempts int, derived_from_obs_ids[]) rebuilt per session on ingest"
  shallow: false
  mechanism: "A deterministic reducer over step_change observations emits one state row per step per player; threshold for stuck = 3x expected_duration_s from tutorial_steps"
  example: "Forge Quest: step 3 outcome counts over 500 players: completed 391, abandoned 72, session_ended 24, stuck 13; the chatbot answers 'step 3 loses 72 of 500 (14.4%)' in under 200 ms"
  cost: M
  depends_on: "store-16 tutorial_steps table with expected durations"
  part: store
  ingest_cost: S
  query_cost: S
  better_than_fixed_table: "Funnel questions (reached, dropped, retried) become joins on a state table instead of inferences across video rows"

- id: store-6
  title: "Nightly columnar rollup step_daily(game_id, build_id, step_id, date) with entered, completed, abandoned, p50/p90 duration, n"
  level: L4
  cell: {part: store, representation: olap-cube-materialized-views, granularity: cohort, query-path: precomputed-aggregate, latency-tier: sub-200ms-cached, mechanism-type: precompute-more}
  object: "spec.md: 'a question over, say, 500 players is fast'"
  situation: "The studio dashboard and chatbot both ask the same 6 step-level numbers every morning"
  consequence: "Without rollups every ask scans 40,000 observation rows; with rollups it reads 7 rows"
  p_typical: 0.30
  grounded: quote
  evidence: "spec.md: 'Answering a studio's question must be fast'"
  proposed: "Materialised view refreshed after each ingest batch; columns: entered_n, completed_n, abandoned_n, stuck_n, dur_p50_ms, dur_p90_ms, quotes_sample_ids[5]"
  shallow: false
  mechanism: "Store adds a refresh job per ingest; the planner routes how-many/how-long questions whose filters match the cube dimensions to the rollup"
  example: "'Median time in step 3 for build 1.2.0' = SELECT dur_p50_ms FROM step_daily WHERE build_id='1.2.0' AND step_id=3; returns 7m40s over n=500 in 40 ms"
  cost: S
  depends_on: "store-5 player_step_state"
  part: store
  ingest_cost: S
  query_cost: S
  better_than_fixed_table: "Percentiles and per-build splits are precomputed; the fixed table had only per-video booleans to count"

- id: store-7
  title: "Closed observation kind enum (11 kinds) with a per-kind payload schema validated at write time"
  level: L4
  cell: {part: ingestion-extraction, representation: timestamped-observation-log, granularity: utterance, modality: screen-state-classifier, extraction-trigger: at-ingestion, reuse-scope-of-extraction: universal-primitives}
  object: "memo.md item 1: 'step on screen, action, utterance, friction signal, sentiment, quote with timestamp'"
  situation: "Two extraction prompts write 'friction' once as kind='friction' with text and once as kind='frustration' with score; the planner cannot count friction"
  consequence: "Open kinds fragment the log into synonyms within 2 weeks; a closed enum keeps counts summable"
  p_typical: 0.09
  grounded: quote
  evidence: "memo.md item 1 lists observation kinds informally; no schema given"
  proposed: "kind enum{step_change, ui_action, utterance, friction, affect, error_message, menu_open, idle, death_or_fail, hint_shown, external_distraction}; payload JSON schema per kind, rejected on validation failure and logged to ingest_rejects"
  shallow: false
  mechanism: "Ingestion writes only the 11 kinds; anything else goes into attrs of the nearest kind or into ingest_rejects for the schema owner to review weekly"
  example: "Step-3 churn question: friction rows with step_id=3 across 500 players = 212; grouped by payload.friction_type: cannot_find_ui 94, unclear_goal 61, input_misfire 40, other 17"
  cost: S
  depends_on: nothing
  part: ingestion-extraction
  ingest_cost: S
  query_cost: S
  better_than_fixed_table: "Observation kinds are a universal vocabulary shared by every game, so a friction count means the same thing in every title"

- id: store-8
  title: "evidence table as first-class: every field value and observation references >=1 evidence row (video_id, t_start_ms, t_end_ms, modality, text)"
  level: L4
  cell: {part: store, representation: timestamped-observation-log, granularity: variable-length-moment-or-episode, evidence-form: quote-with-timestamp, query-path: clip-lookup, uncertainty-policy: abstain-below-coverage}
  object: "memo.md item 1: 'quote with timestamp as evidence'"
  situation: "Studio asks 'show me 5 players who quit at step 3 and what they said'; the answer must become 5 clips"
  consequence: "If evidence is a text column on the value row, clip generation needs a transcript re-search; a separate table makes a clip a lookup"
  p_typical: 0.12
  grounded: quote
  evidence: "memo.md item 1 and item 3 'evidence requirement'"
  proposed: "evidence(evidence_id, session_id, video_id, t_start_ms, t_end_ms, modality enum{speech,ocr,screen_state,frame}, text, asr_confidence); value rows carry evidence_ids[]; a NOT NULL constraint for fields where evidence_required=true"
  shallow: false
  mechanism: "Ingestion writes evidence first, then values pointing to it; query path for clip questions is value -> evidence -> ffmpeg cut from cold storage"
  example: "step3_outcome=abandoned for player 217 cites evidence 8891: video 5, 00:03:12-00:03:29, speech 'where is the anvil, I give up'; the clip reel is 5 such lookups"
  cost: S
  depends_on: "original videos retained (A-frame assumption)"
  part: store
  ingest_cost: S
  query_cost: S
  better_than_fixed_table: "Every number can be opened into its clips; the fixed table had answers with no pointer back"

- id: store-9
  title: "session_videos manifest with gap_before_ms and missing flag; durations spanning a gap are marked uncertain"
  level: L4
  cell: {part: session-stitching, representation: timestamped-observation-log, granularity: video, question-type: how-long, uncertainty-policy: answer-with-ci-and-n, evidence-form: coverage-statement-n-of-m-players}
  object: "spec.md: 'A session can be n hours; each video is capped at 15 minutes'"
  situation: "Video 3 of 6 failed to upload; step 3 starts in video 2 and ends in video 4"
  consequence: "Without a gap record the duration is computed 15 minutes short and silently wrong; with gap_before_ms the row carries duration_uncertain=true and the aggregate reports n=487 of 500"
  p_typical: 0.08
  grounded: inferred
  evidence: "spec.md 'how videos of one session are linked' unspecified"
  proposed: "session_videos(session_id, seq, video_id, capture_start, duration_ms, gap_before_ms, missing bool); player_step_state.duration_uncertain = any gap inside [entered_at, exited_at]"
  shallow: false
  mechanism: "Stitching stage compares recorder capture_start timestamps with cumulative durations; any gap over 2,000 ms is recorded; downstream aggregates exclude or flag uncertain rows"
  example: "'Median step-3 time' answer: '7m40s over 487 of 500 players; 13 excluded because a video was missing inside the step'"
  cost: S
  depends_on: "store-1 session clock"
  part: session-stitching
  ingest_cost: S
  query_cost: S
  better_than_fixed_table: "Missing videos become a visible denominator correction instead of a hidden error"

- id: store-10
  title: "per-step summary row: 2-4 sentences per (player_id, step_id) citing obs_ids, stored next to the state row"
  level: L4
  cell: {part: store, representation: per-step-summary, granularity: tutorial-step, query-path: retrieval-then-llm, question-type: why, latency-tier: under-30s}
  object: "spec.md item 4: 'Reading 500 transcripts per question was too slow'"
  situation: "Studio asks 'why do players abandon step 3' (open question, no closed field)"
  consequence: "Reading 500 x 4-hour transcripts is ~30M tokens; reading 72 abandoned players' step-3 summaries is ~15k tokens and answers in under 30 s"
  p_typical: 0.18
  grounded: quote
  evidence: "spec.md item 4"
  proposed: "step_summaries(player_id, step_id, summary_text <=120 words, cited_obs_ids[], extractor_run_id)"
  shallow: false
  mechanism: "Ingestion writes one summary per step per player from that step's observations; the planner filters by state outcome then feeds only matching summaries to the model"
  example: "Filter player_step_state.outcome='abandoned' AND step_id=3 -> 72 summaries -> model groups them: 'anvil not discoverable' 41, 'recipe menu confusing' 19, 'crashed' 7, other 5, each with 3 obs_ids"
  cost: M
  depends_on: "store-5 player_step_state"
  part: store
  ingest_cost: M
  query_cost: M
  better_than_fixed_table: "Open 'why' questions get an answer from 72 short texts instead of no answer or 500 transcripts"

- id: store-11
  title: "Hierarchical summary tree: nodes at minute -> step -> video -> session, each with text, embedding and child_ids, queried by descent"
  level: L4
  cell: {part: store, representation: hierarchical-temporal-summary-tree, granularity: session, query-path: retrieval-then-llm, question-type: what-happened, subject-domain: core-loop}
  object: "spec.md known problem: 'Long multi-video sessions'"
  situation: "Studio asks 'what did players do in the 20 minutes after finishing the tutorial', a region no step or field covers"
  consequence: "Flat observation rows for a 4-hour session are 2,000+ rows per player; the tree lets the model read 4 session nodes, pick 2 video nodes, then 8 minute nodes"
  p_typical: 0.08
  grounded: inferred
  evidence: "spec.md item 1 'A session can be n hours'"
  proposed: "summary_nodes(node_id, session_id, level enum{minute,step,video,session}, t_start_ms, t_end_ms, text, embedding vector(1024), parent_id, child_ids[])"
  shallow: false
  mechanism: "Ingestion builds the tree bottom-up (minute summaries from observations, then step, video, session); the query path descends from session nodes with a relevance threshold of 0.6 cosine"
  example: "'What happens after the tutorial': descend 500 session nodes -> 500 video nodes after step 7 -> 2,100 minute nodes; the model reads 500 video-node texts (~40k tokens) and reports 'first mine visit 61%, open map 22%, idle >3 min 9%'"
  cost: M
  depends_on: "store-1 session clock"
  part: store
  ingest_cost: M
  query_cost: M
  better_than_fixed_table: "Covers the hours outside the tutorial that the fixed question set never touched"

- id: store-12
  title: "Inverted full-text index over utterance text and OCR text with (session_id, t_session_ms) postings"
  level: L4
  cell: {part: store, representation: inverted-full-text-index, granularity: utterance, query-path: full-text-keyword-search, question-type: find-players-who, build-or-buy: open-source-component}
  object: "memo.md item 1: 'utterance' observations and 'on-screen text'"
  situation: "Studio asks 'which players said the word anvil during the tutorial'"
  consequence: "A keyword question needs no model; the index returns player_ids and timestamps in 50 ms; retrieval-then-LLM would cost a model call and may miss players"
  p_typical: 0.12
  grounded: quote
  evidence: "memo.md item 1"
  proposed: "Tantivy/OpenSearch/ClickHouse full-text index on observations.text with stored fields session_id, player_id, step_id, t_session_ms, modality"
  shallow: false
  mechanism: "Ingestion indexes text as it is written; planner routes what-said and find-players-who questions containing a quoted term to the index first and only sends hits to the model"
  example: "'anvil' AND step_id<=3: 183 utterances from 97 players; 61 of the 72 step-3 abandoners said it; the chatbot shows the count and 5 timestamped quotes"
  cost: S
  depends_on: nothing
  part: store
  ingest_cost: S
  query_cost: S
  better_than_fixed_table: "Any word in 2,000 hours of speech is findable; the fixed table captured none of the text"

- id: store-13
  title: "answers cache table keyed by question_hash and cohort_filter, invalidated by field_version bump or new sessions in the cohort"
  level: L4
  cell: {part: query-path, representation: question-answer-bank-precomputed, granularity: cohort, query-path: semantic-cache-similar-question, latency-tier: sub-200ms-cached, mechanism-type: reuse-or-cache-prior-work}
  object: "memo.md item 2: 'whose result is cached as a new field'"
  situation: "The same studio asks 'why do players abandon step 3' on Monday and again on Thursday after 40 new sessions arrived"
  consequence: "Without invalidation metadata the Thursday answer is Monday's with stale n; with it, the cache returns Monday's answer tagged 'computed on 500 sessions, 40 new since' and refreshes in background"
  p_typical: 0.09
  grounded: quote
  evidence: "memo.md item 2"
  proposed: "answers(answer_id, studio_id, question_text, question_embedding, question_hash, cohort_filter_json, result_json, sessions_n, field_versions_used_json, computed_at, stale_since)"
  shallow: false
  mechanism: "Planner checks cosine >0.92 against answers for the same studio and compatible cohort_filter; the ingest job marks rows stale when any used field_version changes or the cohort gains sessions"
  example: "Thursday ask returns in 120 ms: 'anvil not discoverable 41 of 72 (computed Monday on 500 sessions; 40 new sessions pending, refresh in ~2 min)'"
  cost: S
  depends_on: "store-3 field versions"
  part: query-path
  ingest_cost: S
  query_cost: S
  better_than_fixed_table: "Open-question answers are reused across asks instead of recomputed, with explicit staleness"

- id: store-14
  title: "backfill_jobs queue table; partial coverage served immediately with n-of-m and completed overnight"
  level: L4
  cell: {part: query-path, representation: question-answer-bank-precomputed, granularity: session, query-path: lazy-backfill-extraction, latency-tier: progressive-streaming, uncertainty-policy: give-range-then-refine}
  object: "memo.md item 2: 'genuinely new questions trigger a one-time batch extraction over all sessions'"
  situation: "A new field 'noticed_crafting_hint' is requested at 14:00 for 2,000 sessions; extraction takes 3 hours"
  consequence: "Without a queue the studio waits 3 hours for anything; with it the chatbot answers from the first 150 sessions at 14:05 and updates the answer as coverage grows"
  p_typical: 0.09
  grounded: quote
  evidence: "memo.md item 2"
  proposed: "backfill_jobs(job_id, field_id, session_id, priority, status enum{queued,running,done,failed}, attempts, tokens_used, finished_at); order by priority then by session recency"
  shallow: false
  mechanism: "Planner inserts jobs for all sessions in the asked cohort first, rest of history second; the answer endpoint reads field_coverage and streams updates"
  example: "'Did step-3 abandoners see the crafting hint?' at 14:05: 'so far 23 of 31 abandoners processed saw it (150 of 500 players covered); full answer tonight'; at 17:10: '48 of 72 abandoners saw it'"
  cost: M
  depends_on: "store-31 field_coverage"
  part: query-path
  ingest_cost: L
  query_cost: S
  better_than_fixed_table: "A question outside the fixed set gets a first answer in minutes, not a prompt-engineering ticket"

- id: store-15
  title: "Common data model with per-game vocab map: concepts table plus game_vocab_map(game_id, local_name, concept_id, step_ordinal)"
  level: L4
  cell: {part: schema-evolution, representation: common-data-model-with-per-game-vocab-map, granularity: game, scope: cross-game, reuse-scope-of-extraction: genre-shared, moment-in-journey: game-onboarding-day-0}
