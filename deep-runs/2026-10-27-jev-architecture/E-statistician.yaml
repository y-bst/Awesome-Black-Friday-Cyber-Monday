  p_typical: 0.07
  grounded: quote
  evidence: "spec.md: 'detecting churn in the tutorial and just after it'; 'one session is many videos'"
  proposed: "Per player row: (last_step_reached, minutes_to_last_step, event in {abandoned, completed, censored_session_end, censored_capture_gap}); chatbot renders Kaplan-Meier step curves with at-risk counts"
  shallow: false
  mechanism: "Screen-state classifier emits step transitions; ingestion folds them into one survival record per player; the aggregate path exposes hazard per step and median time-to-step; censoring is computed from stitching gaps over 2 minutes"
  example: "'Where do players churn in the tutorial?' -> 'Hazard peaks at step 4 (parry): 14% of players at risk abandon there (403 at risk at step 1, 212 at step 4); 31 players censored by capture gaps, shown separately'"
  cost: M
  depends_on: "Screen-state classifier from frames; stat-7 stitching"
  part: store
  ingest_cost: M
  query_cost: S
  better_than_fixed_table: "A yes/no per video becomes a curve with a denominator at every step and censoring made visible"

