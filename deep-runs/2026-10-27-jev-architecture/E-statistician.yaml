- id: stat-1
  title: "Every count answer carries a three-part denominator: n_positive / n_eligible / n_recorded, with the excluded players listed by reason"
  level: L4
  cell: {part: query-path, representation: fixed-mcq-answers, granularity: player, query-path: sql-over-closed-fields, question-type: how-many, evidence-form: count-with-denominator, uncertainty-policy: answer-with-ci-and-n, user-segment: producer-exec, scope: all-players}
  object: "spec.md item 3: 'The answers form a structured table per video'; item 4: 'a question over, say, 500 players is fast'"
  situation: "Studio asks 'how many players quit during the tutorial'. 500 players recorded; 61 sessions have no video covering the tutorial, 24 have a failed transcript, 12 answered 'not applicable' because the player skipped the tutorial"
  consequence: "Today the chatbot returns one integer (say 97) and the studio divides by whatever number it has in its head; 97/500 and 97/403 differ by 4.7 points, enough to change a roadmap call"
  p_typical: 0.35
  grounded: quote
  evidence: "spec.md: 'The answers form a structured table per video'; nothing in spec.md or memo.md names a denominator or a coverage field"
  proposed: "Answer template: '97 of 403 eligible players (24.1%); 97 excluded: 61 no tutorial footage, 24 transcript failed, 12 tutorial skipped'"
  shallow: false
  mechanism: "Add a per-question status enum to the answers table {positive, negative, not-applicable, no-coverage, extraction-failed}; the chatbot's aggregate path groups by status and renders the triple; status is written at ingestion for every (session, question) pair, never left null"
  example: "'Tutorial churn rate?' -> '97 of 403 eligible (24.1%); 500 recorded; 97 excluded (61 no footage, 24 failed, 12 skipped)'"
  cost: S
  depends_on: "Session stitching so that eligibility is counted per player, not per video (stat-7)"
  part: query
  ingest_cost: S
  query_cost: S
  better_than_fixed_table: "Same table, but the integer becomes a ratio whose base the studio can see and dispute"

- id: stat-2
  title: "Wilson 95% interval on every proportion the chatbot reports, suppressed to a range when n_eligible is under 30"
  level: L4
  cell: {part: chatbot-ui, query-path: precomputed-aggregate, question-type: how-many, evidence-form: confidence-score, uncertainty-policy: answer-with-ci-and-n, delivery-surface: chatbot, latency-tier: under-2s, user-segment: game-designer}
  object: "memo.md item 2: 'closed-field questions become aggregate queries over all players (instant)'"
  situation: "Designer asks 'what share of players failed the dodge prompt' and the studio has 38 recorded players for the new build"
  consequence: "A point estimate of 21% from 38 players is reported with the same typography as one from 900; the designer changes the dodge timing on a number whose true value is anywhere between 11% and 36%"
  p_typical: 0.30
  grounded: quote
  evidence: "memo.md: 'aggregate queries over all players (instant)' with no mention of interval or n"
  proposed: "Render '21% (95% CI 11-36%, n=38)'; below n=30 render only the interval, no point estimate"
  shallow: false
  mechanism: "The aggregate query returns (k, n); the chatbot formats Wilson score bounds; a config threshold n_min=30 switches the rendering to interval-only; cached answers store (k, n, computed_at) so the interval is reproducible"
  example: "'Did players get stuck on the dodge prompt?' -> 'Yes for 8 of 38 eligible players: 21% (11-36%). Interval is wide; 120 more players would narrow it to about +/-7 points'"
  cost: S
  depends_on: "stat-1 denominators"
  part: ui
  ingest_cost: S
  query_cost: S
  better_than_fixed_table: "The fixed table gives a count; this gives the count plus how much it could move"

- id: stat-3
  title: "Sequential sampled map-reduce for open-field questions: read random sessions until the Wilson interval is narrower than 10 points or 400 sessions, whichever first"
  level: L4
  cell: {part: query-path, query-path: sampled-map-reduce-with-ci, representation: timestamped-observation-log, question-type: why, latency-tier: under-30s, mechanism-type: approximate-then-refine, uncertainty-policy: answer-with-ci-and-n, scope: all-players}
  object: "spec.md item 4: 'Reading 500 transcripts per question was too slow'; memo.md item 2: 'open-field questions retrieve matching observation rows across players and the model reads only those'"
  situation: "Studio asks 'why do players leave at the crafting step', a why-question with no closed field; 2,100 sessions in the store"
  consequence: "Reading all 2,100 sessions takes minutes; reading 60 gives an answer with no stated precision; the memo's retrieval path answers only if the rows were extracted"
  p_typical: 0.12
  grounded: quote
  evidence: "spec.md: 'Reading 500 transcripts per question was too slow and too much data'"
  proposed: "Sample sessions in blocks of 40 with a fixed seed; after each block compute the share of sessions whose crafting-step observations contain a stated reason, and the top-3 reason shares with intervals; stop at CI width under 10 points or 400 sessions"
  shallow: false
  mechanism: "Query planner path: uniform random sample over sessions (not videos), model reads the crafting-step window of each sampled session, emits one closed reason label per session, aggregator computes Wilson bounds per label and a stopping rule; the sampled labels are written back as a partially-populated field with the sample mask"
  example: "'Why do players quit at crafting?' -> after 160 sessions: 'inventory full 38% (31-46%), recipe not found 22% (16-29%), no reason stated 27%; based on a random 160 of 2,100 sessions; full pass scheduled'"
  cost: M
  depends_on: "Session-level random sampling key; observation log windows per step (memo item 1)"
  part: query
  ingest_cost: S
  query_cost: M
  better_than_fixed_table: "Answers a question the table never had, in under 30 seconds, with a stated error bar instead of a full read"

- id: stat-4
  title: "Backfill a new field in two phases: stratified 200-session sample within 60 seconds, remainder overnight, with the answer labelled by phase"
  level: L4
  cell: {part: query-path, query-path: progressive-answer-then-refine, extraction-trigger: on-first-question, schema-evolution: lazy-backfill-on-demand, latency-tier: progressive-streaming, mechanism-type: approximate-then-refine, granularity: session, question-type: outside-game-target}
  object: "memo.md item 2: 'genuinely new questions trigger a one-time batch extraction over all sessions whose result is cached as a new field'"
  situation: "Producer asks 'how many players read the tooltip before the first boss', a field nobody extracted; 3,400 sessions across 4 build versions"
  consequence: "The memo's one-time batch over all sessions returns in hours; the producer gets nothing until then, or an unstratified first slice that over-represents the latest build"
  p_typical: 0.08
  grounded: quote
  evidence: "memo.md: 'one-time batch extraction over all sessions whose result is cached as a new field'"
  proposed: "Phase 1: 200 sessions drawn with strata proportional to build version and session length quartile; answer with CI and phase label. Phase 2: remaining 3,200 overnight; answer re-sent with the final count"
  shallow: false
  mechanism: "Backfill job keeps a strata table (build_version x length_quartile); phase-1 draws proportional allocation; the field is stored with a per-row extraction_phase value; the chatbot answer carries phase=1 or phase=2 and the sampled-n"
  example: "'Tooltip read before boss?' -> 60 s later: '31% (25-38%), stratified sample of 200 of 3,400; final count arrives tomorrow 06:00' -> next day: '29.4% of 3,312 eligible'"
  cost: M
  depends_on: "memo item 2 backfill path; build-version metadata per session"
  part: query
  ingest_cost: M
  query_cost: M
  better_than_fixed_table: "A new field gets a first answer in a minute instead of after the full batch, and the first answer is not biased toward whichever sessions were ingested last"

- id: stat-5
  title: "Per-studio question ledger with Benjamini-Hochberg correction across every comparison asked in the trailing 7 days"
  level: L4
  cell: {part: feedback-loop-from-query-log, question-type: compare-steps, query-path: sql-over-closed-fields, evidence-form: contrast-vs-baseline, uncertainty-policy: answer-with-ci-and-n, user-segment: studio-analyst, moment-in-journey: steady-state-weekly, mechanism-type: narrow-or-clarify-the-question}
  object: "spec.md item 4: 'A chatbot for the gaming studio answers the studio's questions from that table'"
  situation: "An analyst asks 52 'is step X worse than step Y' questions in one afternoon over 12 tutorial steps; at alpha 0.05, 2.6 of them are expected to come back significant by chance"
  consequence: "Three steps get flagged as problems and a sprint is spent on them; one is noise. Nobody at the studio knows how many questions were asked that week"
  p_typical: 0.07
  grounded: inferred
  evidence: "spec.md: questions 'are not known in advance'; no per-studio ledger of asked comparisons exists in spec.md or memo.md"
  proposed: "Each comparison answer is written to a ledger (studio, question hash, p, timestamp); the answer shows the raw p and the BH-adjusted q over the trailing 7 days: 'raw p=0.03, adjusted q=0.21 across 52 comparisons this week'"
  shallow: false
  mechanism: "Query planner tags any answer that contrasts two groups; ledger table keyed by studio; on each new comparison, recompute BH over the window and attach q; comparisons that were significant last week but drop below the threshold are listed in the weekly digest"
  example: "'Is the parry step worse than the dodge step?' -> 'Parry 31% vs dodge 22% abandonment (diff 9 pts, 2-16); raw p 0.03; across the 52 step comparisons you asked this week the adjusted q is 0.21, so this is not separable from noise yet'"
  cost: M
  depends_on: "Query log with per-answer statistics; stat-2"
  part: query
  ingest_cost: S
  query_cost: S
  better_than_fixed_table: "The table answers each question in isolation; this makes the number of questions asked part of the answer"

- id: stat-6
  title: "Automatic churner-vs-retainer contrast reports expected false discoveries: 'top 5 of 380 attributes, 19 expected by chance at alpha 0.05, 2 survive FDR 0.10'"
  level: L4
  cell: {part: query-path, query-path: automatic-contrast-cohort-diff, mechanism-type: auto-discover-without-question, question-type: who-are-the-churners-segment-discovery, representation: wide-event-schema-on-read, evidence-form: contrast-vs-baseline, uncertainty-policy: answer-with-ci-and-n, scope: cohort}
  object: "memo.md item 1: 'closed enum fields and short open fields'; D-critique observability perspective: automatic contrast of churned vs baseline"
  situation: "The system auto-diffs 380 closed fields between 97 tutorial churners and 306 retainers and surfaces the top 5 differences"
  consequence: "With 380 tests, 19 are expected to pass p<0.05 under no effect; without a correction the studio reads the top 5 as findings and three are noise"
  p_typical: 0.06
  grounded: inferred
  evidence: "memo.md item 1 names closed enum fields across all observations; D-critique names BubbleUp-style contrast. Neither mentions how many fields are tested"
  proposed: "Contrast output lists: attribute, churner rate, retainer rate, difference with CI, raw p, FDR q; header line states number of attributes tested and expected chance hits"
  shallow: false
  mechanism: "Contrast job runs a two-proportion test per closed field, applies Benjamini-Hochberg at q=0.10, ranks by effect size among survivors, and prints the count of attributes tested; attributes with fewer than 20 players in either arm are excluded and counted in the header"
  example: "'What separates tutorial churners?' -> '380 attributes tested, 19 expected by chance. Surviving FDR 0.10: inventory-full event before step 4 (churners 44% vs 12%), no speech in first 3 minutes (61% vs 29%). 3 more differences did not survive correction'"
  cost: M
  depends_on: "Closed-field observation log (memo item 1); player-level churn label"
  part: query
  ingest_cost: S
  query_cost: M
  better_than_fixed_table: "Finds the question the studio did not ask, and says how many of its findings are likely accidents"

- id: stat-7
  title: "Player is the unit of inference: stitch videos into sessions and sessions into players before any count, so n is players, never video rows"
  level: L3
  cell: {part: session-stitching, granularity: player, representation: step-funnel-state-machine-per-player, question-type: how-many, evidence-form: coverage-statement-n-of-m-players, scope: all-players, schema-evolution: append-only-versioned-fields, moment-in-journey: first-cohort-ingested}
  object: "spec.md item 1: 'each video is capped at 15 minutes, so one session is many videos'; item 3: 'structured table per video'; Unspecified: 'how videos of one session are linked'"
  situation: "A 3-hour session is 12 video rows; 'how many players said the tutorial was confusing' summed over rows counts one player who said it in 4 videos as 4"
  consequence: "Per-video counting inflates both numerator and denominator by the number of videos per session, so long-session players (who are the retainers) dominate every aggregate; churn rates are biased low"
  p_typical: 0.15
  grounded: quote
  evidence: "spec.md: 'The answers form a structured table per video'; 'how videos of one session are linked' is listed as unspecified"
  proposed: "Stitching key (player_id, session_id, video_index, start_offset_ms); a player-level view reduces each question with a declared reducer (any / max / first-time / last-value); every aggregate reads the player view"
  shallow: false
  mechanism: "Ingestion writes video rows with the stitching key; a materialised player view applies the per-question reducer declared in the question schema; the chatbot is forbidden from querying the video table for counts"
  example: "'Players who called the tutorial confusing' -> video table says 212 rows; player view says 88 of 403 players (21.8%)"
  cost: S
  depends_on: "A session id and player id in the capture metadata (spec lists linking as unspecified)"
  part: ingestion
  ingest_cost: S
  query_cost: S
  better_than_fixed_table: "Same questions, but counts are of players, and a player who speaks a lot no longer counts more than one who speaks once"

- id: stat-8
  title: "Cluster-robust intervals: when the unit counted is an utterance or step but the claim is about players, bootstrap over players (1,000 resamples)"
  level: L4
  cell: {part: query-path, granularity: utterance, query-path: precomputed-aggregate, evidence-form: confidence-score, uncertainty-policy: answer-with-ci-and-n, question-type: how-felt, representation: timestamped-observation-log, user-segment: ux-researcher}
  object: "memo.md item 1: 'timestamped atomic observations ... utterance, friction signal, sentiment'"
  situation: "Researcher asks 'what share of tutorial utterances are frustrated'; 4,800 utterances from 403 players, but 30 players produce 40% of utterances"
  consequence: "A naive binomial interval on 4,800 utterances is 3x too narrow; the researcher reports 'frustration up 4 points, significant' when the player-level bootstrap says the difference is inside noise"
  p_typical: 0.05
  grounded: quote
  evidence: "memo.md: observations are 'atomic' and per utterance; nothing states the inference unit"
  proposed: "Aggregates over sub-player units compute the interval by resampling players with replacement 1,000 times; the answer states both units: '18% of 4,800 utterances (player-bootstrap 95% CI 14-23%), 403 players'"
  shallow: false
  mechanism: "Aggregate query returns per-player (k_i, n_i); the chatbot's stats layer resamples players; intervals are cached by (question, cohort, data_version)"
  example: "'Frustrated utterances in tutorial?' -> '18% of 4,800 utterances; player-level CI 14-23% (not 17-19%); 30 players contribute 40% of utterances'"
  cost: S
  depends_on: "stat-7 player ids on every observation"
  part: query
  ingest_cost: S
  query_cost: S
  better_than_fixed_table: "The table's per-video rows make every utterance look independent; this makes the error bar honest about who is talking"

- id: stat-9
  title: "Measurement-error correction per question: hand-label 100 sessions per game, store sensitivity and specificity, report the Rogan-Gladen corrected prevalence"
  level: L4
  cell: {part: evaluation, extraction-trigger: on-new-game-onboarding, evidence-form: recall-estimate, uncertainty-policy: answer-with-ci-and-n, question-type: how-many, granularity: game, question-origin: ontology-generated, mechanism-type: human-in-the-loop}
  object: "memo.md item 3: questions 'judged by two tests: coverage of real studio questions and accuracy against hand-labelled sessions'"
  situation: "Question 'player abandoned during tutorial' has sensitivity 0.82 and specificity 0.95 on 100 labelled sessions; the raw table says 24%"
  consequence: "Raw prevalence 24% implies true prevalence (0.24-0.05)/(0.82-0.05) = 24.7%, but for a question with sensitivity 0.6 the same raw 24% means 34.5%; today accuracy is measured once and never flows into the answer"
  p_typical: 0.04
  grounded: quote
  evidence: "memo.md: 'accuracy against hand-labelled sessions' is a test on the question set, not a stored per-question parameter"
  proposed: "Store (sens, spec, n_labelled, labelled_at) per (game, question, model_version); chatbot shows raw and corrected prevalence with an interval that includes the labelling uncertainty"
  shallow: false
  mechanism: "Labelling job draws 100 sessions per game, two labellers, computes sens/spec with Clopper-Pearson bounds; the aggregate path applies the Rogan-Gladen estimator and propagates both uncertainties by parametric bootstrap"
  example: "'Tutorial churn?' -> 'Raw 24.1%; corrected for extractor error (sens 0.82, spec 0.95 on 100 labelled sessions) 24.7% (19-31%)'"
  cost: M
  depends_on: "A labelling tool and 2 labellers per game onboarding; model_version on every answer row"
  part: evaluation
  ingest_cost: M
  query_cost: S
  better_than_fixed_table: "The table reports what the extractor said; this reports what likely happened, with the extractor's error folded in"

- id: stat-10
  title: "Model-upgrade anchor set: re-extract a frozen 200-session panel on every model change and block mixed aggregates when per-field kappa falls under 0.7"
  level: L4
  cell: {part: schema-evolution, extraction-trigger: on-model-upgrade, schema-evolution: model-upgrade-reextract, evidence-form: extraction-provenance-model-and-schema-version, question-type: did-the-fix-work-pre-post, granularity: build-version, uncertainty-policy: abstain-below-coverage, moment-in-journey: new-build-version}
  object: "A-frame assumption: 'a modern long-context multimodal model is available at ingestion'; memo.md item 1 observation log"
  situation: "Build 1.3 sessions were extracted by model v2, build 1.4 sessions by model v3; the studio asks whether the new tutorial reduced churn"
  consequence: "A 6-point drop in churn is reported; 4 of those points are the new model being stricter about 'abandoned'. The studio ships a release note on a model artefact"
  p_typical: 0.05
  grounded: inferred
  evidence: "spec.md and memo.md do not mention model versioning; A-frame assumes the model can change"
  proposed: "Frozen panel of 200 sessions re-extracted on each model version; per-field Cohen's kappa stored; a pre/post query spanning two model versions on a field with kappa under 0.7 is refused with the kappa shown and a re-extraction of the older cohort offered"
  shallow: false
  mechanism: "Every answer row carries model_version; a drift table (field, v_old, v_new, kappa, n=200); the query planner checks drift before any compare-versions answer; re-extraction of old sessions is queued overnight when kappa is low"
  example: "'Did 1.4 fix tutorial churn?' -> 'Cannot compare yet: 1.3 extracted by v2, 1.4 by v3, kappa on abandoned=0.61. Re-extracting 1.3 with v3 tonight (1,100 sessions)'"
  cost: M
  depends_on: "Videos retained for re-processing (A-frame assumption); model_version column"
  part: evaluation
  ingest_cost: M
  query_cost: S
  better_than_fixed_table: "The table silently mixes extractors; this refuses to attribute a model change to the game"

- id: stat-11
  title: "Generated questions enter the production table only after two independent extraction runs agree at kappa 0.6 or better on 50 sessions; the rest are tagged exploratory"
  level: L4
  cell: {part: question-generation, question-origin: ontology-generated, evaluation: none, evidence-form: confidence-score, extraction-trigger: on-new-game-onboarding, granularity: tutorial-step, uncertainty-policy: abstain-below-coverage, mechanism-type: narrow-or-clarify-the-question}
  object: "memo.md item 3: 'Questions are generated from an ontology (entities x dimensions x outcomes), pruned by the game target, each with an answer type and an evidence requirement'"
  situation: "The ontology emits 640 questions for a new game; 'did the player understand the crafting UI' is one of them and two runs of the same model disagree on 38% of sessions"
  consequence: "Unreliable questions sit in the same table as reliable ones; the chatbot aggregates them with the same confidence; the studio learns which are junk only when a number contradicts their telemetry"
  p_typical: 0.08
  grounded: quote
  evidence: "memo.md: questions 'judged by two tests: coverage ... and accuracy' with no per-question admission threshold"
  proposed: "Admission gate: two runs (temperature or prompt-variant) on 50 sessions, kappa >= 0.6 to be 'production'; 0.4-0.6 'exploratory' (answers shown with a warning and no aggregate); under 0.4 dropped and logged for rewording"
  shallow: false
  mechanism: "Question-generation output goes to a staging table; a reliability job computes kappa per question; a status column {production, exploratory, rejected} gates the query planner's aggregate path"
  example: "640 generated -> 410 production, 140 exploratory, 90 rejected; 'Did players understand crafting UI?' is exploratory (kappa 0.48), chatbot says so and offers 10 clips instead of a percentage"
  cost: M
  depends_on: "memo item 3 ontology generator; 50-session staging sample per game"
  part: question-generation
  ingest_cost: M
  query_cost: S
  better_than_fixed_table: "The fixed table has no reliability column; this keeps unreliable questions from producing percentages"

- id: stat-12
  title: "Pre/post build comparisons are standardised on recorded player mix (platform, prior-genre-experience, session length) before the difference is reported"
  level: L4
  cell: {part: query-path, question-type: did-the-fix-work-pre-post, scope: build-version-pair, query-path: sql-over-closed-fields, evidence-form: contrast-vs-baseline, modality: player-profile-metadata, moment-in-journey: live-ops-update, uncertainty-policy: answer-with-ci-and-n}
