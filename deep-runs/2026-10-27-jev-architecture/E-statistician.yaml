  situation: "'What share of players skip the tutorial' was answered Monday over 403 players; Thursday 120 new players arrive and someone asks 'how many players skipped onboarding'"
  consequence: "A semantic cache serves Monday's 11% as Thursday's answer; the two questions also differ in denominator (all players vs players who reached the tutorial screen) and the cache does not know"
  p_typical: 0.06
