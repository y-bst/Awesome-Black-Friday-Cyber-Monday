  cost: S
  depends_on: "nothing"
  part: ui
  ingest_cost: S
  query_cost: S
  better_than_fixed_table: "Nothing; it is the fixed table's failure mode with a chat front end"

- id: stat-15
  title: "Cached prior answers expire when the eligible cohort grows by 10% or the denominator definition differs; the cache key includes (k, n, data_version)"
  level: L4
  cell: {part: query-path, query-path: semantic-cache-similar-question, mechanism-type: reuse-or-cache-prior-work, latency-tier: sub-200ms-cached, evidence-form: count-with-denominator, schema-evolution: append-only-versioned-fields, question-type: how-many, moment-in-journey: steady-state-weekly}
