- id: stat-13
  title: "Tutorial churn stored as a survival record per player: time-to-abandon in steps and minutes, with censoring flags for session end and video cap"
  level: L3
  cell: {part: store, representation: step-funnel-state-machine-per-player, granularity: tutorial-step, question-type: when, evidence-form: chart, subject-domain: onboarding-tutorial, query-path: precomputed-aggregate, modality: screen-state-classifier}
  object: "spec.md item 3: targets are 'detecting churn in the tutorial and just after it'; item 1: 'each video is capped at 15 minutes'"
