- "id": "obs-3"
  "case": "Fold this into owner-16 and designer-14 instead of building it on its own. All three run the same churner-vs-rest contrast, rank attributes by difference and attach denominators; obs-3 differs only in running the contrast at query time over 80-200 columns with chi-square. It also depends on obs-1, the 60-column wide-event table with an attrs JSON column. That table is not in the top 25 and replaces the memo's observation log rather than extending it, so the next quarter would have to settle the store before this option has any input. On 500 players the statistics are weak. A single GROUP BY that tests 200 attributes at a 2x-lift and n>=5 threshold will show several spurious 'causes' per question by chance (5% of 200 is 10 false hits before any correction), and the studio will file tickets against them. The worked example also mixes up cause and symptom. 'settings_menu_opened 38% vs 6%' and 'utterance_count = 0' are correlates, and a studio reading a ranked list as an answer to 'why' will treat them as reasons. Many attributes are also derived from each other (first death, step reached, dwell), so the top 10 rows tend to describe the same thing several times. The safer quarter-one form is owner-16's fixed job over a curated list of per-step columns, with a multiple-comparison correction and a 'correlate, not cause' label. Open-ended BubbleUp over every attrs key should wait until the store exists and someone has measured the false-discovery rate on hand-labelled sessions, as memo.md item 3 requires."
- "id": "analyst-15"
  "case": "Defer this, or treat it as a special case of stitch-27 and clinical-16. It is one query template ('why' + step -> GROUP BY friction_reason), not an architectural choice. It depends on two things that are not built: a per-genre friction_reason enum and analyst-2's step_state, which is not in the top 25. The enum is where the real cost and risk sit. memo.md item 3 already plans to generate closed fields from an ontology. A hand-defined per-genre reason enum duplicates that, and spec.md says 'each game differs, so per-game hand-written questions do not scale', which applies just as much to hand-written reason lists. The option's own example shows the problem: 'other 23' of 94 is 24% of quitters already falling outside the enum on the tutorial case it was designed for. On a studio's unknown question the 'other' bucket will be larger, and it is exactly the part the studio cares about. Assigning a single friction_reason to each stall at ingestion also asks today's models for a causal judgement from a 15-minute clip. That label is the least reliable thing an extractor produces, and the confident percentages hide the uncertainty. This option only helps tutorial 'why did they quit at step N' questions. Ship it as a planner template once the memo's ontology and stitch-27's session-scope quit_reason exist, not as a separate build."
- "id": "cv-3"
  "case": "The real case against this one is weak; the most I can argue is about scope and sequencing. It depends on cv-1, the keyframe table, which has to come first. Per-region classification (hud, objective-tracker, dialog, tooltip, error-popup, chat) needs a layout model or per-game region map, and per-game hand mapping does not scale (spec.md). A modern multimodal model reading keyframes at ingestion (A-frame assumption) can produce screen state and on-screen text in the same pass the memo already plans ('Video frames add screen state and on-screen text'). That makes a separate PaddleOCR pipeline with its own deduplication and inverted index a second visual extractor to maintain. Generic OCR also does badly on stylised game fonts, outlined HUD text and text over moving backgrounds. Exact-string search such as text='Inventory full' misses typo-variant and localised strings, and the spec leaves languages unspecified. In the 'did players see the craft prompt' example, text being on screen is not the same as the player reading it, so the count overstates exposure. Fold it into the memo's frame pass as an on_screen_text field on observations, without a separate OCR stack. Add region classes only for games whose HUD layout the step list already describes."
- "id": "extract-7"
  "case": "There is only a modest case for folding this rather than rejecting it. The seen / not_seen / unknown distinction is right, and without it a missing-video session is silently counted as 'never reached', so there is no case to drop the idea. The case is that it should not be a separate ingestion pass. It overlaps latency-15, whose per-player step state-machine rows already give one row per player per step with an outcome enum. A status of not_reached plus a coverage flag on those rows gives the same denominator, with no second step_presence table to keep consistent. It also depends on two things that are not built: a step list per game, and a session-completeness flag from the stitcher (obs-29 / stitch-1). The 80% frame-coverage threshold for forcing 'unknown' is arbitrary and untested. The option is graded 'inferred', not quoted, and the worked range '85-140' shows that on real data with 11% of sessions incomplete the answer becomes a wide interval that studios may find less useful than expected. It also covers only steps in a predeclared list, so a studio's unknown question about something off the list still cannot tell absence from no coverage. Build it as columns on latency-15's step rows plus a session coverage field, not as its own extraction pass."
- "id": "stitch-27"
  "case": "Defer this, and narrow it to closed fields. It depends on stitch-4, which is not among the top 25 options, and on per-segment extraction producing clean observation rows first. A one-shot LLM judgement of 'quit_reason' over 2-4k tokens of already-compressed rows stacks two layers of model abstraction. Any friction the per-segment pass did not log cannot appear in the quit_reason, so the session field inherits and hides the observation log's recall gaps. A free-form quit_reason has to be normalised before GROUP BY works. The example's 'could not find objective' 17 / 'combat too hard' 12 / 'crash' 8 implies a closed enum that the option does not define, so it either duplicates analyst-15's friction_reason enum or produces labels that will not group. It also overlaps clinical-16's churn_event table, which already stores churn_step, churn type and last step and UI, and it is a variant of latency-10. arc_summary is free text for retrieval, which the memo's open-field path already covers by retrieving matching rows. The useful part is churn_step and a quit cause with evidence URIs. That fits as two more columns in clinical-16's churn_event row, produced by the same session pass. A separate roll-up whose fields are fixed in advance also does not help with studio questions that are unknown."
