- id: designer-1
  title: "Per-player tutorial step funnel as a state machine with enter/exit timestamps per step, so 'where do they leave' is one SQL group-by"
  level: L4
  cell: {part: store, representation: step-funnel-state-machine-per-player, granularity: tutorial-step, query-path: precomputed-aggregate, question-type: how-long, user-segment: game-designer, latency-tier: under-2s}
  object: "spec.md stage 3: 'a fixed set of questions with options, written per game target ... The answers form a structured table per video'"
  situation: "Designer asks 'how long do players spend on step 3 (craft a pickaxe) and what share quit during it' across 500 players"
  consequence: "Today the table is per video and per question; a step that spans two videos has no single duration, and no per-step abandonment share exists unless a question was written for exactly that step"
  p_typical: 0.35
  grounded: quote
  evidence: "spec.md: 'The answers form a structured table per video'; memo.md item 1: 'step on screen, action'"
  proposed: "Table step_transitions(session_id, player_id, build_version, step_id, entered_at, exited_at, exit_type in {advanced, regressed, quit, session_end}, source_video_ids[])"
  shallow: false
  mechanism: "Ingestion emits one row per step entry/exit per player from the screen-state classifier plus transcript cues; the store keeps a p50/p90 duration, reached_n, abandoned_n per (game, build_version, step_id) as a materialised view refreshed on each ingested session"
  example: "'Step 3 median 94 s, p90 311 s, 500 reached, 61 quit during it (12.2%)' returned in under 1 s from the view; the 61 player_ids are one click away"
  cost: M
  depends_on: "a step list per game (designer-6 or designer-18) and a screen-state classifier that recognises each step's screen"
  part: store
  ingest_cost: M
  query_cost: S
  better_than_fixed_table: "Duration, reach and abandonment exist for every step without a question being written per step, and a step spanning video 3 and video 4 has one duration"

- id: designer-2
  title: "Stall observation: >=45 s on one screen state with no step progress, tagged with silence or a negative utterance, stored as a row with start/end and the on-screen state"
  level: L4
  cell: {part: ingestion-extraction, representation: timestamped-observation-log, modality: silence-or-absence-of-speech, granularity: variable-length-moment-or-episode, question-type: why, extraction-trigger: at-ingestion}
  object: "memo.md item 1: 'friction signal, sentiment, quote with timestamp as evidence'"
  situation: "Designer asks 'why do players stall on step 3' and wants the moments, not a sentiment average"
  consequence: "Without a defined stall object, 'friction signal' is a per-utterance label and silent stalls (player staring at the crafting menu saying nothing) produce no observation at all"
  p_typical: 0.12
  grounded: quote
  evidence: "memo.md: 'friction signal'; spec.md problem: 'Transcript loses visual information'"
  proposed: "stall(session_id, step_id, t_start, t_end, screen_state, cue in {silence, negative_utterance, repeated_action, menu_loop}, quote_or_null, resolution in {self_solved, hint_shown, quit, session_end})"
  shallow: false
  mechanism: "At ingestion a rule over the screen-state timeline plus the transcript: any window >=45 s with unchanged screen_state and no step transition becomes a stall row; the model fills cue, quote and resolution from the +/-15 s window"
  example: "'Step 3: 142 stalls across 118 players; 71% on screen_state=crafting_menu_open; 38% silent; top resolution self_solved after median 68 s; 24 quit' with 5 clip links"
  cost: M
  depends_on: "screen-state classifier with per-frame labels (frame-pipeline) and step_transitions (designer-1)"
  part: ingestion-extraction
  ingest_cost: M
  query_cost: S
  better_than_fixed_table: "A 'did the player struggle on step 3 (yes/no)' MCQ gives one bit; a stall row gives where, how long, what was on screen and how it ended, and catches silent players"

- id: designer-3
  title: "Every count answer carries [video_id, t_start, t_end] per contributing row so 'show me 5 players failing step 3' returns a 5-clip montage of 20 s each"
  level: L4
  cell: {part: chatbot-ui, evidence-form: clip-montage-n-examples, query-path: clip-lookup, question-type: find-players-who, user-segment: game-designer, delivery-surface: clip-reel}
  object: "spec.md stage 4: 'A chatbot for the gaming studio answers the studio's questions from that table'"
  situation: "Chatbot says '61 players quit on step 3'; designer asks 'show me 5 of them at the moment they quit'"
  consequence: "The answers table per video has no timestamp; the designer must open full 15-minute videos and scrub, so the number is never checked against footage and tuning decisions are made on the number alone"
  p_typical: 0.3
  grounded: inferred
  evidence: "spec.md: 'The answers form a structured table per video' (no timestamp column named); memo.md: 'quote with timestamp as evidence'"
  proposed: "Each observation row stores video_id, t_start, t_end; chatbot answer template: number, denominator, then 'Show 5 clips' which cuts t_start-10 s to t_end+10 s, capped at 20 s, and plays them in sequence"
  shallow: false
  mechanism: "Clip lookup is a key read: from the answer's contributing row ids select 5 by stratified sampling (longest stall, shortest, 3 random), cut from the original video with ffmpeg at request time (under 2 s per clip), cached by (video_id, t_start, t_end)"
  example: "'61 quit on step 3' -> montage: P-0412 video 2 @ 08:14-08:34 crafting menu open, says 'where is the wood'; P-0088 video 1 @ 13:50-14:10 silent, quits"
  cost: S
  depends_on: "original videos retained with frame access (A-frame assumption 1); timestamps on observation rows"
  part: chatbot-ui
  ingest_cost: S
  query_cost: S
  better_than_fixed_table: "The fixed table has no row-to-footage link; the designer can verify a number in 100 s of viewing instead of 75 minutes"

- id: designer-4
  title: "Build-version pair diff: same step funnel computed per build_version so 'did the step-3 fix work' returns stall rate and n for 1.3 vs 1.4 with a two-proportion CI"
  level: L4
  cell: {part: query-path, scope: build-version-pair, question-type: did-the-fix-work-pre-post, modality: build-version-metadata, evidence-form: contrast-vs-baseline, uncertainty-policy: answer-with-ci-and-n, moment-in-journey: new-build-version}
  object: "memo.md item 2: 'closed-field questions become aggregate queries over all players (instant)'"
  situation: "Designer shipped a crafting-hint change in build 1.4 and asks 'did it reduce step-3 stalls' two days after the new cohort was recorded"
  consequence: "Nothing in spec.md or memo.md keys sessions by build; the aggregate mixes 1.3 and 1.4 players and the designer cannot tell whether the fix worked"
  p_typical: 0.2
  grounded: inferred
  evidence: "spec.md 'Unspecified' omits build version; memo.md names no version key"
  proposed: "build_version column on session, captured from the on-screen version string via OCR on the title screen or from the recruitment manifest; chatbot 'compare builds' template"
  shallow: false
  mechanism: "Query planner recognises compare-versions questions, runs the per-step aggregate twice with a build filter, and renders 'stall rate 28% (n=180) -> 17% (n=95), diff -11 pts, 95% CI -21 to -1'"
  example: "'Step 3 stalls fell from 28% to 17% between 1.3 and 1.4; median stall shortened 68 s -> 41 s; 5 clips from 1.4 players still stalling'"
  cost: S
  depends_on: "designer-1 funnel table; a build_version field per session"
  part: query-path
  ingest_cost: S
  query_cost: S
  better_than_fixed_table: "The fixed table has no version axis; pre/post is the designer's most common question after any change"

- id: designer-5
  title: "Step timeline strip per player: coloured segment per tutorial step, markers for stall, quote, fail screen; click a marker to play the clip"
  level: L4
  cell: {part: chatbot-ui, question-type: timeline, granularity: player, delivery-surface: dashboard-standard-report, evidence-form: chart, representation: step-funnel-state-machine-per-player}
  object: "spec.md stage 1: 'A session can be n hours; each video is capped at 15 minutes, so one session is many videos'"
  situation: "Designer wants to look at one player's 3-hour session and see where the tutorial went wrong without scrubbing 12 videos"
  consequence: "Today the unit of display is a video; the designer cannot see a session as one object, so 'walk me through player P-0412's tutorial' is answered by reading 12 tables"
  p_typical: 0.15
  grounded: quote
  evidence: "spec.md: 'Long multi-video sessions' listed as a known problem"
  proposed: "One horizontal strip per session, 0 to N minutes, segments coloured by step_id, markers at stall.t_start, quote.t, fail_screen.t; hover shows the quote; click opens a 20 s clip; 50 strips stacked make a cohort view"
  shallow: false
  mechanism: "Rendered from step_transitions and the observation log (designer-1, designer-2); no model call at view time"
  example: "P-0412: step 1 0:00-1:10, step 2 1:10-3:40, step 3 3:40-14:50 with 3 stall markers and the quote 'where is the wood' at 8:14, quit at 14:50"
  cost: M
  depends_on: "designer-1, designer-2, session stitching of video order (designer-21)"
  part: chatbot-ui
  ingest_cost: S
  query_cost: S
  better_than_fixed_table: "The table shows answers per video; the strip shows the order and duration of events across all videos of a session"

- id: designer-6
  title: "Day-0 step list typed by the designer from the tutorial design doc (step_id, name, expected_seconds, required_action, screen cue) seeds the funnel before any session exists"
  level: L4
  cell: {part: question-generation, question-origin: design-doc-patch-notes-store-page-derived, moment-in-journey: game-onboarding-day-0, granularity: tutorial-step, user-segment: game-designer, reuse-scope-of-extraction: game-specific}
  object: "memo.md item 3: 'Questions are generated from an ontology (entities x dimensions x outcomes), pruned by the game target'"
  situation: "A new game is onboarded; the designer has a 9-step tutorial document with expected durations but the ontology has no idea what step 3 is"
  consequence: "Ontology-generated questions name generic entities; without the designer's step list the extraction cannot label 'crafting_menu_open' as step 3, and the first cohort is extracted against the wrong vocabulary"
  p_typical: 0.08
  grounded: quote
  evidence: "memo.md: 'pruned by the game target'; A-frame assumption: 'per-game hand-written questions do not scale'"
  proposed: "A 9-row form: step_id, name, expected_seconds, required_action (free text), success_screen_cue (free text), hint_text (exact string for OCR); the model turns each row into the classifier prompt and 4 generated questions (reached, duration, stalled, wrong action)"
  shallow: false
  mechanism: "Question generation takes the step list as the entity list for the tutorial branch of the ontology; expected_seconds becomes the threshold for 'overran' (3x expected)"
  example: "Row 'step 3, Craft a pickaxe, 60 s, open crafting menu and select pickaxe, pickaxe appears in hotbar, hint: Press C to craft' yields 'share of players who exceeded 180 s on step 3' with no further writing"
  cost: XS
  depends_on: "nothing"
  part: question-generation
  ingest_cost: S
  query_cost: S
  better_than_fixed_table: "10 minutes of typing replaces per-game MCQ authoring and gives the expected-vs-actual comparison the fixed table never had"

- id: designer-7
  title: "Wrong-action observation per step: what the player did instead of the required action (opened inventory, walked away, pressed the wrong key), closed category plus free text"
  level: L4
  cell: {part: ingestion-extraction, question-type: counterfactual-why-not, modality: screen-state-classifier, granularity: tutorial-step, representation: timestamped-observation-log, mechanism-type: precompute-more}
  object: "memo.md item 1: 'step on screen, action, utterance'"
  situation: "Designer asks 'what do players try before they find the crafting menu on step 3'"
  consequence: "'action' in the observation log records what happened, but not that it was not the required action for the current step; the designer's most useful question ('what did they try instead') has no field"
  p_typical: 0.06
  grounded: inferred
  evidence: "memo.md item 1 lists 'action' without reference to the required action"
  proposed: "wrong_action(session_id, step_id, t, category in {opened_other_menu, moved_away, repeated_prior_action, pressed_unbound_key, idle, interacted_wrong_object}, free_text, screen_state_before, screen_state_after)"
  shallow: false
  mechanism: "At ingestion the model receives the step's required_action (designer-6) plus the screen-state sequence inside the step, and labels each non-progress action window; stored as rows, counted per (step, category) in a view"
  example: "'Step 3: 212 wrong actions over 500 players; 44% opened_other_menu (inventory), 23% moved_away (left the workbench area), 12% pressed_unbound_key (E)'; 5 clips of the inventory case"
  cost: M
  depends_on: "designer-6 required_action per step; screen-state classifier"
  part: ingestion-extraction
  ingest_cost: M
  query_cost: S
  better_than_fixed_table: "The MCQ 'did the player find the crafting menu' cannot say what they tried instead, which is the thing the designer changes"

- id: designer-8
  title: "Hint visibility timing from OCR: seconds the tutorial hint text was on screen before the required action, flagging 'acted before reading' (<1 s) and 'ignored' (>20 s)"
  level: L4
  cell: {part: frame-pipeline, modality: on-screen-text-ocr, granularity: tutorial-step, question-type: why, representation: time-series-signals-affect-pace-silence, subject-domain: onboarding-tutorial}
  object: "memo.md item 1: 'Video frames add screen state and on-screen text, because speech alone cannot answer \"where did they click\"'"
  situation: "Designer suspects the step-3 hint 'Press C to craft' is not being read and wants to know if players saw it"
  consequence: "Without hint on-screen timing the designer cannot tell whether to make the hint bigger (not seen) or clearer (seen, not understood)"
  p_typical: 0.05
  grounded: quote
  evidence: "memo.md: 'on-screen text'"
  proposed: "hint_exposure(session_id, step_id, hint_text, first_seen_t, last_seen_t, seconds_visible, action_t, class in {acted_before_reading, read_then_acted, ignored, never_shown})"
  shallow: false
  mechanism: "OCR at 1 fps over frames; exact-match the hint_text from the step list (designer-6); compute visible span and compare with the step's required-action timestamp"
  example: "'Step 3 hint shown to 487/500; 31% ignored (>20 s visible, no craft); 9% never_shown (hint suppressed by the open inventory); median read-to-act 6 s'"
  cost: M
  depends_on: "frame access at 1 fps; hint_text strings from designer-6"
  part: frame-pipeline
  ingest_cost: M
  query_cost: S
  better_than_fixed_table: "The transcript-only MCQ cannot see whether a hint was on screen at all; this separates 'not shown' from 'shown and ignored'"

- id: designer-9
  title: "Overrun alert: when >=20% of the latest 50-player cohort exceed 3x expected_seconds on any step, push a Slack message with step, rate and 3 clips, with no question asked"
  level: L4
  cell: {part: feedback-loop-from-query-log, mechanism-type: push-instead-of-pull, delivery-surface: alert, latency-tier: push-no-query, question-type: what-to-fix-first-prioritised, extraction-trigger: on-cohort-size-threshold}
  object: "spec.md constraint: 'Their questions are not known in advance'"
  situation: "A new cohort is ingested overnight; the designer has not logged in and does not know step 5 broke in build 1.4"
  consequence: "A chatbot that waits for a question misses the week where the designer did not think to ask; the fixed table is only read when queried"
  p_typical: 0.07
  grounded: quote
  evidence: "spec.md: 'Their questions are not known in advance'; memo.md describes only pull (planner) paths"
  proposed: "Rule evaluated after every 50 ingested sessions per build: for each step, overrun_rate = n(duration > 3 x expected_seconds)/n(reached); fire when >=0.20 and n(reached) >= 30"
  shallow: false
  mechanism: "Post-ingestion job over the step aggregate view (designer-1) with thresholds from the step list (designer-6); message carries rate, n, delta vs previous cohort, and 3 clip links (designer-3)"
  example: "Slack: 'Build 1.4, step 5 (first combat): 34% of 50 players exceeded 180 s (prev cohort 11%). 3 clips attached.'"
  cost: S
  depends_on: "designer-1, designer-6, designer-3"
  part: feedback-loop-from-query-log
  ingest_cost: S
  query_cost: S
  better_than_fixed_table: "The table answers only what is asked; the alert surfaces the step nobody asked about"

- id: designer-10
  title: "Regression edges in the step state machine: count of returns to an already-completed step per player, answering 'how many players went back to step 2 after reaching step 4'"
  level: L4
  cell: {part: store, representation: step-funnel-state-machine-per-player, question-type: how-many, granularity: player, query-path: sql-over-closed-fields, subject-domain: onboarding-tutorial}
  object: "memo.md item 1: 'step on screen'"
  situation: "Designer asks whether players loop back to the gathering step because they ran out of wood during crafting"
  consequence: "A linear 'reached step N' MCQ records the furthest step; a player who went 2 -> 3 -> 2 -> 3 looks identical to one who went 2 -> 3, and the loop that signals a resource-balance problem is invisible"
  p_typical: 0.09
  grounded: inferred
  evidence: "memo.md names 'step on screen' as an observation but no transition type"
  proposed: "step_transitions.exit_type includes regressed; view regressions(step_from, step_to, n_players, n_events, median_seconds_in_regressed_step)"
  shallow: false
  mechanism: "The state machine (designer-1) allows backward transitions; each is a row; aggregated per (from, to) pair"
  example: "'3 -> 2 regressions: 87 players (17%), median 52 s back in step 2, 61 of them said a word in {wood, logs, more}'"
  cost: S
  depends_on: "designer-1"
  part: store
  ingest_cost: S
  query_cost: S
  better_than_fixed_table: "Furthest-step MCQ cannot represent a loop; the transition table can"

- id: designer-11
  title: "Quote-at-stall: the utterance within +/-10 s of each stall is attached to the stall row, then clustered into topics so 'what do players say when stuck on step 3' returns 5 topics with counts and timestamped quotes"
  level: L4
  cell: {part: query-path, question-type: what-said, question-origin: emergent-topic-clustering-of-player-speech, evidence-form: quote-with-timestamp, modality: speech-transcript, query-path: retrieval-then-llm}
  object: "memo.md item 2: 'open-field questions retrieve matching observation rows across players and the model reads only those'"
  situation: "Designer asks 'what are players saying when they stall on step 3' over 500 players"
  consequence: "Retrieval over all utterances returns speech from anywhere in the session; without the stall join the designer reads 400 quotes, most about unrelated moments"
  p_typical: 0.09
  grounded: quote
  evidence: "memo.md: 'the model reads only those'"
  proposed: "stall.quote populated at ingestion; query path: filter stall rows by step, embed quotes, k-means into 5 clusters, label each with the model, return count, 3 example quotes with video_id and t"
  shallow: false
  mechanism: "Join replaces retrieval: the stall row already holds the quote, so the model reads at most n_stalls quotes (142 for step 3), not the transcript"
  example: "'Step 3 stalls: cannot find crafting menu 38%, do not have enough wood 24%, hotkey C not working 11%, ...; e.g. P-0412 video 2 08:14 \"where is the wood\"'"
  cost: S
  depends_on: "designer-2"
  part: query-path
  ingest_cost: S
  query_cost: M
  better_than_fixed_table: "Open-ended speech at the stall moment, grouped, instead of a pre-written 'player expressed confusion (yes/no)'"

- id: designer-12
  title: "REFUSED: per-session summary paragraph as the main representation, because 'where did players stall' cannot be answered to a step and a timestamp from prose"
  level: L3
  cell: {part: store, representation: per-session-summary, granularity: session, question-type: when, user-segment: game-designer, evidence-form: none}
  object: "memo.md item 1: 'a session-level observation log, not answers'"
  situation: "A proposal replaces the fixed table with one 300-word model summary per session, searched by the chatbot"
  consequence: "Designer refuses: a summary says 'the player struggled with crafting' with no step_id, no timestamp, no duration; aggregating 500 summaries gives counts that change with wording, and a clip cannot be cut from a paragraph. Low willingness; keep summaries only as a display layer over rows"
  p_typical: 0.05
  grounded: inferred
  evidence: "memo.md argues for 'timestamped atomic observations' rather than summaries"
  proposed: "If summaries are built, generate them from the observation rows and keep the row ids as citations"
  shallow: false
  mechanism: "Store one free-text summary per session; chatbot embeds and retrieves summaries, then the model counts"
  example: "'How many stalled on step 3' -> model reads 500 summaries and says 'roughly 100'; re-run gives 'about 120'; no clip"
  cost: S
  depends_on: "nothing"
  part: store
  ingest_cost: S
  query_cost: M
  better_than_fixed_table: "Nothing for the designer; it loses the step and the timestamp that the fixed table at least pins to a video"

- id: designer-13
  title: "REFUSED for the weekly tuning loop: map-reduce over raw transcripts at query time, because a 3-minute wait and a number that moves between runs cannot drive a build decision"
  level: L3
  cell: {part: query-path, query-path: map-reduce-over-raw, representation: raw-transcript-only, latency-tier: minutes, question-type: how-many, uncertainty-policy: always-answer}
  object: "spec.md stage 4: 'Reading 500 transcripts per question was too slow and too much data, which is why the fixed-question table exists'"
  situation: "A proposal drops the store and sends 500 transcripts through a long-context model for every question"
  consequence: "Designer refuses as the default path: a 'how many stalled on step 3' answer that takes 3 minutes and returns 98 today and 112 tomorrow is not usable in a tuning meeting. Acceptable only as the backfill path for a brand-new field (designer-19), with the result cached"
  p_typical: 0.06
  grounded: quote
  evidence: "spec.md: 'Reading 500 transcripts per question was too slow'"
  proposed: "Allow map-reduce only when it writes a new closed field; never for a repeat question"
  shallow: false
  mechanism: "Query time: shard 500 transcripts, one model call each, reduce counts"
  example: "'Step 3 stalls?' -> 3 min, 98; same question next day -> 112; designer stops trusting both"
  cost: S
  depends_on: "nothing"
  part: query-path
  ingest_cost: S
  query_cost: L
  better_than_fixed_table: "Answers questions the table never had, but not fast and not reproducibly; the designer would not use it live"

- id: designer-14
  title: "Automatic contrast on the step funnel: for tutorial quitters vs completers, rank every per-step metric (duration, stalls, wrong actions, hint ignored, regressions) by difference and show the top 5"
  level: L4
  cell: {part: query-path, query-path: automatic-contrast-cohort-diff, question-type: who-are-the-churners-segment-discovery, mechanism-type: auto-discover-without-question, scope: cohort, evidence-form: contrast-vs-baseline}
  object: "spec.md stage 3: 'The targets are mostly detecting churn in the tutorial and just after it'"
  situation: "Designer asks 'what is different about players who quit in the tutorial' with no hypothesis"
  consequence: "The fixed table has churn as one column but no mechanism to compare the other columns between churners and the rest; the designer guesses a step and asks one question at a time"
  p_typical: 0.08
  grounded: quote
  evidence: "spec.md: 'detecting churn in the tutorial'"
  proposed: "contrast(group_a = quit before step 9, group_b = completed) over all numeric per-step fields; output sorted by absolute standardised difference with n per group"
  shallow: false
  mechanism: "SQL over the step aggregate and observation counts per player; no model call; the model only phrases the top 5 rows"
  example: "'Quitters (n=140) vs completers (n=360): step 3 wrong_action opened_other_menu 61% vs 19%; step 5 fail_screen count 3.2 vs 1.1; step 2 duration no difference'"
  cost: S
  depends_on: "designer-1, designer-2, designer-7"
  part: query-path
  ingest_cost: S
  query_cost: S
  better_than_fixed_table: "Finds the step that explains churn without the designer naming it"

- id: designer-15
  title: "Fail-screen spotting per frame: classifier recognises the game's death/retry/you-lost screen, counts fails per step per player"
  level: L4
  cell: {part: frame-pipeline, modality: screen-state-classifier, granularity: frame, question-type: how-many, subject-domain: progression-difficulty, extraction-trigger: at-ingestion}
  object: "spec.md known problem: 'Transcript loses visual information'"
  situation: "Designer asks 'how many times do players die in the first combat step (step 5) before they pass it'"
  consequence: "Players rarely say 'I died'; the transcript-based MCQ undercounts fails, and the designer cannot tune enemy health from a count that is wrong"
  p_typical: 0.09
  grounded: quote
  evidence: "spec.md: 'what is on screen is largely lost'"
  proposed: "fail_event(session_id, step_id, t, screen_state=fail_screen, seconds_to_retry); classifier trained from 20 designer-labelled frames of the fail screen at onboarding"
  shallow: false
  mechanism: "Frames sampled at 2 fps; a per-game image classifier flags fail_screen; debounced to one event per 3 s; joined to the current step"
  example: "'Step 5: median 2 fails, p90 6, 500 reached; 44 players with >=5 fails, of whom 29 quit; 5 clips of fail 5+'"
  cost: M
  depends_on: "frame access; 20 labelled frames per game"
  part: frame-pipeline
  ingest_cost: M
  query_cost: S
  better_than_fixed_table: "A count that comes from the screen, not from whether the player narrated the death"

- id: designer-16
  title: "Cursor or crosshair position sampled from frames at 2 fps, aggregated into a per-step heatmap across the cohort, answering 'where are players looking for the craft button'"
  level: L4
  cell: {part: frame-pipeline, modality: controller-or-touch-heatmap, granularity: tutorial-step, scope: cohort, evidence-form: chart, question-type: why}
  object: "memo.md item 1: 'speech alone cannot answer \"where did they click\"'"
  situation: "Designer asks where players hover during step 3 before finding the crafting menu"
  consequence: "The memo promises 'where did they click' but a screen-state label gives the menu, not the position; the designer cannot see that 40% hover over the inventory icon"
  p_typical: 0.04
  grounded: quote
  evidence: "memo.md: 'where did they click'"
  proposed: "cursor_sample(session_id, step_id, t, x_norm, y_norm) at 2 fps from a cursor detector; heatmap per (game, build, step) as a 64x36 grid"
  shallow: false
  mechanism: "Cursor/crosshair detector on frames (template match on the game's cursor sprite), normalised coordinates, binned per step; rendered as an overlay on a reference screenshot"
