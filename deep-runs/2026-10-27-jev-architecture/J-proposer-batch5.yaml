- "id": "latency-12"
  "case": "The spec states that 'Ingestion time and cost are not a concern. Answering a studio's question must be fast'. A precomputed answer bank is the most direct way to turn that asymmetry into speed: spend ingestion compute once, then answer from a lookup. Of the roughly 900 ontology candidates that memo point 3 generates, the top 200, ranked by coverage of real studio questions, are answered for the all-players cohort and 8 standard segments. That is 1,800 rows per game per build, so storage is trivial. A paraphrase such as 'where do mobile players drop in the tutorial' then returns in about 110 ms with its evidence refs ('step 3: 44% of 212 mobile players'), and the other 700 candidates still resolve by cube or column scan in under 2 s. Without the bank, every common question goes through planning, aggregation and model synthesis at query time, so the tutorial and segment questions studios ask most often pay full latency, and the memo's 'instant' tier exists only for fields that happen to match exactly. The bank also replaces the frozen hand-written table with one that is generated, 10x wider and segment-aware, and that is promoted or demoted by the query log. This is the memo's 'question set grows from real use' made concrete. It reuses the ontology generator the memo already commits to, so the main new pieces are an ingestion job and a cache seed, which fit within a quarter."
- "id": "qgen-10"
  "case": "The spec's first named problem is that 'The question set is small, so most of what is in the video and transcript is never captured'. In the tutorial this shows up as hand-written questions covering steps 1, 3 and 5 of 9, only because those were the known problems. Per-step transition templates fix this structurally: each step gets the same 6 questions (entered, dwell_s, attempts, exit_reason enum, skipped, first_utterance_after_enter), filled from the screen-state classifier plus the transcript. For a 9-step tutorial that gives 54 closed fields as a materialised view over a transition log. 'Where do players drop in the tutorial' then becomes a funnel query that returns in milliseconds. In the example, it shows step 7 with abandoned=18% against 4% or less elsewhere, a p50 dwell of 6m40s, and 'what now' as the first utterance for 61 players. Today that stall is invisible until someone at the studio reads transcripts. Because the templates are generated from a state machine, every new game with a step list gets uniform coverage for free, with no per-game hand-writing, which the frame assumes does not scale. The templates also apply memo point 3's ontology (entities x dimensions x outcomes) to the target the owner says matters most, tutorial churn, so they can ship first as the reference slice of the ontology generator. The store keeps the transition log as the source, so new per-step questions can be added later as views without re-extraction."
- "id": "extract-3"
  "case": "The spec names 'Long multi-video sessions' as a known problem and states that each video is capped at 15 minutes. As a result, every per-video extraction today starts blind: video 5 opens with 'still can't find it', 'it' is unresolvable, and friction_type defaults to none. A 200-token state card ({current_step, open_frictions with since_ts, traits, last_goal_stated}) is prepended to the next video's prompt and stored per boundary in session_boundary. It turns a 40-minute hunt for the map button from 3 unrelated low-severity rows into one friction with a true start and end time. That makes cross-video questions answerable with a fast aggregate, which per-video rows cannot express at all. One example is 'how long were tutorial quitters stuck before quitting', answered as a median of 14 min 20 s across 37 churners instead of durations capped at 15 minutes. These cross-video stalls are the frictions most likely to precede churn, the owner's main target, so undercounting them biases exactly the answers studios pay for. The cost is entirely at ingestion (one small sequential dependency and about 200 extra tokens per video), which the spec says is acceptable, while query cost is unchanged. It also strengthens the memo's session-level observation log, which needs friction rows that span video boundaries to be correct. The only prerequisite is an ordered video index per session, which JEV must build anyway because the spec lists video linkage as unspecified."
- "id": "extract-28"
  "case": "The memo makes 'step on screen' the backbone of the observation log, and nearly every tutorial-churn answer is a per-step rate. That makes it the highest-stakes field to get silently wrong. The failure it prevents is concrete and likely. A frame classifier trained on build 1.1 screenshots meets a restyled build 1.2, its confidence collapses on 2 of 9 steps, and the step-level counts fall to near zero. A compare-versions answer then tells the studio those steps were 'fixed', a confident and wrong answer to exactly the question studios ask after every patch. The fallback chain resolves step_id from the frame classifier first, then from OCR fuzzy-matching (0.8 or more) against the glossary's prompt strings, then from speech at confidence 0.6 or less, and stores step_source and step_conf. It also materialises step_coverage per game and build, so every per-step answer can print 'step identified for 470 of 500 players' and flag a coverage swing of more than 10 points between builds. The studio question 'did the stealth step stall rate improve in 1.2?' then gets '22% vs 9%, but coverage dropped from 480 to 310, classifier likely stale', which is correct and still a fast lookup. The cost is a few extra fields per window plus one small materialised table, which is negligible at ingestion and free at query time. Without the chain, JEV's speed advantage just delivers wrong per-step answers faster, and studios lose trust in the product."
- "id": "playfill-10"
  "case": "The memo routes closed-field questions to an 'instant' aggregate path, but it never says how a studio's words reach a closed field. Studios ask in their own vocabulary ('the Warden', 'the Drowned Bell', 'the match after the tutorial'), not in column names. Without a resolver, the planner sees no match and falls through to the memo's backfill tier. In the example, that means a 6-minute extraction for 'who quit after the Warden fight in hour 3' when the answer was already stored. The unit resolver maps question nouns (boss, match, run, level, quest, floor, round, mission) to unit_type through a lexicon, and named entities to unit_id by edit distance of 2 or less, or embedding cosine of 0.85 or more, against OCR'd catalogue labels and aliases. It then emits a filtered plan over play_unit, which returns '29 players, with a clip of each final attempt' in 0.8 s. When the game declares no such unit type, it replies with a clarifying question that names the declared structure instead of guessing. This matters because JEV's buyers are many studios with different genres, and the spec says their questions are unknown in advance. Anything past the tutorial in a non-step game is unreachable by the instant path today. The resolver is cheap: it runs at query time over a small catalogue in milliseconds, and nothing is added at ingestion beyond the aliases already captured in the unit catalogue. It is the piece that decides whether the memo's fast tier actually gets used."
