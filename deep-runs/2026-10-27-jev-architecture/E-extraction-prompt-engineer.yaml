  example: "Studio asks 'how many complaints about the tutorial camera were there?' Count goes from 231 (with double counting) to 204 after dedup; 27 merged rows are listed in the audit log"
  ingest_cost: S
  query_cost: S
  cost: XS
  depends_on: "ordered videos per session"
  better_than_fixed_table: "The fixed table has one row per video and silently double-answers boundary events"
  p_typical: 0.06
  grounded: quote
  evidence: "spec.md: 'one session is many videos'"
  proposed: "Overlap window 60 s; measure merged-row rate per game"
  shallow: false

