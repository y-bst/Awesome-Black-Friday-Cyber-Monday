  situation: "A player's complaint starts at 14:50 of video 3 and ends at 00:20 of video 4; without overlap the complaint is truncated; with overlap it is extracted twice"
  consequence: "Either undercounting (truncation drops the row) or overcounting (two rows per boundary complaint, roughly 1 extra row per 15 minutes per talkative player)"
