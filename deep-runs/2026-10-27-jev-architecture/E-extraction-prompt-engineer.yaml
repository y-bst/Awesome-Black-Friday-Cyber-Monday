  mechanism: "Group fields into families by shared input (affect family, navigation family, combat family, UI-read family); at most 12 fields per family; one call per family per window; shared transcript cache across calls. Families can be re-run independently when their prompt changes. Cost is roughly 15x one call but spec says ingestion cost is not a constraint"
  example: "Studio asks 'how many players misread the tutorial's quest marker?' The UI-read family (9 fields) is re-extractable alone when its prompt is fixed, so the answer changes within a night without touching the other 170 fields"
  ingest_cost: L
  query_cost: S
  cost: S
  depends_on: "nothing"
  better_than_fixed_table: "Same table shape, but each field is independently testable and re-runnable"
