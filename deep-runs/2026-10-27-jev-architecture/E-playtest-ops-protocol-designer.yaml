- id: ops-9
  title: "Two-channel audio at capture: mic on channel 1, game audio on channel 2, so ASR runs on clean speech and non-speech sounds (sighs, laughs) are detectable on the mic channel alone"
  level: L4
  cell: {part: collection-protocol, modality: audio-non-speech, representation: time-series-signals-affect-pace-silence, granularity: utterance, mechanism-type: change-data-at-source, question-type: how-felt, effort: XS-days}
  object: "spec.md section 2: 'Each video is converted to a transcript'"
  situation: "Game music and voice-over mixed into the mic track raise ASR word error by an estimated 10-20 points during combat tutorials; a sigh under music is undetectable"
  consequence: "Word error drops, and a frustration signal (sigh, groan, long exhale) becomes computable per step from the mic channel without any vision"
  p_typical: 0.08
  grounded: inferred
  evidence: "spec.md: 'The transcript alone is not enough'"
  proposed: "Capture client records mic and system audio as separate tracks in the same container; ingestion runs ASR on track 1 and a non-speech audio classifier (sigh, laugh, groan, silence) on track 1 with per-event rows"
  mechanism: "Changes collection-protocol and ingestion: adds an audio_events table {session_id, video_ms, class, confidence}; the question generator gains 'how-felt' primitives such as sighs per step per player"
  example: "'Which tutorial step frustrates players most' returns step 4 with 1.8 sighs or groans per player-minute (n=480) versus a cohort mean of 0.4"
  cost: S
  depends_on: nothing
  part: collection-protocol
  ingest_cost: M
  query_cost: S
  better_than_fixed_table: "Fixed table has sentiment only where words exist; this measures affect for silent players too"
  shallow: false

