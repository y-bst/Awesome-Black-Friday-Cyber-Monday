- id: ops-11
  title: "Recruitment quota table per game: minimum 30 players per cell of (genre experience x platform), 40% genre newcomers; the planner reports 'under-recruited' when a cohort split falls below 30"
  level: L4
  cell: {part: collection-protocol, scope: cohort, extraction-trigger: on-cohort-size-threshold, uncertainty-policy: abstain-below-coverage, evidence-form: coverage-statement-n-of-m-players, moment-in-journey: game-onboarding-day-0, user-segment: jev-internal-ops}
  object: "spec.md section 4: 'a question over, say, 500 players is fast'"
  situation: "A studio asks about mobile newcomers; the cohort recruited has 11 of them because recruitment was first-come"
  consequence: "Answers on sub-cohorts below 30 are reported with a recruiting gap and the number of extra players needed, not as a percentage that will be quoted in a greenlight deck"
  p_typical: 0.09
  grounded: inferred
  evidence: "spec.md: 'Buyers are gaming studios. Their questions are not known in advance.'"
  proposed: "quota table {game_id, cell_key, min_n, recruited_n}; recruitment tool blocks closing the cohort until all cells reach min_n; planner joins the answer's cohort to quota and appends the gap"
  mechanism: "Changes collection-protocol and evaluation: quota enforced at recruitment; at query time a cohort of size under 30 returns count-only plus 'recruit 19 more mobile newcomers to answer this at the usual confidence'"
  example: "'Mobile newcomer churn at step 4' returns '4 of 11 quit; cohort under quota (need 30), 19 more players scheduled for next week' instead of '36%'"
  cost: S
  depends_on: ops-10
  part: collection-protocol
  ingest_cost: S
  query_cost: S
  better_than_fixed_table: "Fixed table reports percentages at any n; this connects the answer to the recruiting pipeline that can fix it"
  shallow: false

- id: ops-12
  title: "Incentive type stored per session (hourly pay, completion bonus, unpaid volunteer, store credit); the planner refuses to compare churn across incentive types without a flag"
  level: L4
  cell: {part: collection-protocol, modality: player-profile-metadata, question-type: compare-versions, uncertainty-policy: ask-clarifying-question, scope: build-version-pair, mechanism-type: narrow-or-clarify-the-question}
  object: "spec.md section 3: 'detecting churn in the tutorial'"
  situation: "Cohort A (build 1.2) was paid a completion bonus; cohort B (build 1.3) was paid hourly; B shows 14% more tutorial quits"
  consequence: "Without the field the studio concludes build 1.3 made the tutorial worse; a completion bonus reduces natural quitting to near zero so the comparison is meaningless"
  p_typical: 0.04
  grounded: speculative
  evidence: "none"
  proposed: "session header gains incentive_type enum and incentive_amount; planner checks that both sides of any pre-post or version comparison share incentive_type and otherwise asks 'compare only hourly-paid cohorts (A n=120, B n=130)?'"
  mechanism: "Changes collection-protocol and query-path: one enum field; a comparison guard in the planner that lists confounded protocol fields (incentive_type, moderated, protocol_version) before emitting a diff"
  example: "'Did build 1.3 reduce tutorial churn' returns 'cohorts differ on incentive_type; restricted to hourly-paid players: 1.2 quit 18% (n=120), 1.3 quit 15% (n=130)'"
  cost: S
  depends_on: ops-10
  part: collection-protocol
  ingest_cost: S
  query_cost: S
  better_than_fixed_table: "Fixed table does not know how the player was paid, so every churn rate is confounded by the incentive"
  shallow: false

- id: ops-13
  title: "Natural-quit protocol: a cohort arm with no completion bonus and an explicit 'you may stop whenever you would stop at home' instruction, flagged natural_quit_allowed=true"
  level: L4
  cell: {part: collection-protocol, question-type: who-are-the-churners-segment-discovery, subject-domain: onboarding-tutorial, scope: cohort, mechanism-type: change-data-at-source, evidence-form: contrast-vs-baseline}
  object: "spec.md section 3: 'The targets are mostly detecting churn in the tutorial and just after it'"
  situation: "Paid testers told to play for 2 hours almost never quit a tutorial; the churn the studio fears happens at home with no incentive"
  consequence: "Churn becomes observable at all: in a natural-quit arm the quit rate is a usable estimate of real churn, and the non-natural arm still supplies step durations and friction"
  p_typical: 0.07
  grounded: inferred
  evidence: "spec.md: 'detecting churn in the tutorial and just after it'"
  proposed: "Per cohort, 50% of players in the natural-quit arm (paid a flat show-up fee, told they can stop any time, minimum 10 minutes); arm stored as a session header field; churn questions default to this arm"
  mechanism: "Changes collection-protocol: an arm field on the session header; the planner routes every 'quit' or 'churn' question to natural_quit_allowed=true sessions and reports the arm size"
  example: "'Tutorial churn rate' returns '24% of 250 natural-quit players stopped before step 6; the 250 full-session players are excluded from the rate but included in step timing'"
  cost: S
  depends_on: ops-12
  part: collection-protocol
  ingest_cost: S
  query_cost: S
  better_than_fixed_table: "Fixed table measures churn in sessions where quitting is not allowed; this creates sessions where it is"
  shallow: false

