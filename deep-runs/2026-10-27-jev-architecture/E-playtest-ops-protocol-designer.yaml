- id: ops-1
  title: "Mint session_id at recruitment scheduling and inject it into the capture app, so every 15-minute video file is named <session_id>_<segment_index> at the source"
  level: L4
  cell: {part: collection-protocol, granularity: session, extraction-trigger: at-ingestion, mechanism-type: change-data-at-source, moment-in-journey: first-cohort-ingested, effort: XS-days}
  object: "spec.md Unspecified: 'how videos of one session are linked'; spec.md section 1: 'each video is capped at 15 minutes, so one session is many videos'"
  situation: "A recruiter books player P-0412 for a 2-hour slot; today the capture app writes files named by wall-clock time and the stitcher must guess which 8 files belong together"
  consequence: "Stitching heuristics (gap thresholds, filename sorting) are replaced by a key that exists before the first frame is recorded; 0 orphan videos per cohort instead of the 2-5% that timestamp heuristics misassign"
  p_typical: 0.18
  grounded: quote
  evidence: "spec.md: 'how videos of one session are linked' is listed as Unspecified"
  proposed: "Scheduling tool issues session_id (ULID) and a one-time capture token; the capture client embeds session_id, segment_index, player_id, build_hash in each file name and in a sidecar JSON written at segment close"
  mechanism: "Changes collection-protocol and session-stitching: the sidecar JSON {session_id, segment_index, player_id, build_hash, started_at, protocol_version} is the primary key for the manifest; ingestion rejects any file with no sidecar instead of guessing"
  example: "Studio asks 'what share of 500 players quit before tutorial step 5'; the planner groups observations by session_id from the sidecar and reads the last segment per session, with no join on filename timestamps"
  cost: S
  depends_on: nothing
  part: collection-protocol
  ingest_cost: S
  query_cost: S
  better_than_fixed_table: "Fixed table is per video with no session key; this makes every per-player count correct by construction"
  shallow: false

- id: ops-2
  title: "Think-aloud nudge: capture app shows 'say what you are thinking' overlay after 90s of mic silence, logs each nudge as an observation row with origin=prompt"
  level: L4
  cell: {part: collection-protocol, modality: silence-or-absence-of-speech, representation: timestamped-observation-log, extraction-trigger: continuous-during-live-session, mechanism-type: change-data-at-source, subject-domain: onboarding-tutorial, question-type: why}
  object: "spec.md section 2: 'Each video is converted to a transcript'; memo.md item 1: 'utterance, friction signal, sentiment, quote with timestamp as evidence'"
  situation: "In a 300-player remote cohort, 35-45% of players speak fewer than 20 words in a 15-minute video, so the transcript-based fields are empty for them"
  consequence: "Silent players are not 'no friction'; they are missing data, and any 'why did they quit' answer is drawn from the vocal minority"
  p_typical: 0.22
  grounded: quote
  evidence: "spec.md: 'The transcript alone is not enough'"
  proposed: "Capture client measures mic RMS; after 90s below threshold it shows a 3s non-blocking overlay; nudge events (session_id, video_ms, count) are written to the observation log so the extractor can mark utterances within 20s of a nudge as prompted=true"
  mechanism: "Changes collection-protocol and store: adds a nudge event stream and a boolean prompted on utterance rows; silence_ratio per session is computed at ingestion as seconds-below-threshold / session seconds"
  example: "Question 'why do players quit at the inventory step': rows with prompted=true supply 40% more 'why' quotes than before; the answer states 'n=212 of 300 players had at least one utterance in step 4 (was n=140)'"
  cost: S
  depends_on: nothing
  part: collection-protocol
  ingest_cost: S
  query_cost: S
  better_than_fixed_table: "Fixed table answers 'unknown' for silent players; this raises per-step speech coverage from roughly 45% to 70% of players"
  shallow: false

- id: ops-3
  title: "Silence ratio and words-per-minute stored per session; the query planner states speech coverage (n of m players with >= 30 words in the step) on every speech-derived answer"
  level: L4
  cell: {part: evaluation, modality: silence-or-absence-of-speech, evidence-form: coverage-statement-n-of-m-players, uncertainty-policy: abstain-below-coverage, question-type: prevalence-of-quoted-sentiment, granularity: tutorial-step}
  object: "memo.md item 2: 'open-field questions retrieve matching observation rows across players and the model reads only those'"
  situation: "Studio asks 'what percent of players found the crafting tutorial confusing'; 180 of 500 players said nothing during that step"
  consequence: "Without a coverage statement the chatbot reports 22% confused with denominator 500 when the honest denominator is 320; the studio ships a fix sized to the wrong number"
  p_typical: 0.12
  grounded: inferred
  evidence: "spec.md Unspecified: 'What a transcript contains (speech only, on-screen text, events)'"
  proposed: "Per (session_id, step) store words, seconds, silence_ratio; planner computes speech-covered denominator and refuses a percentage when covered players are fewer than 30 or below 50% of the cohort, returning the covered count instead"
  mechanism: "Changes evaluation and query-path: a coverage table keyed by (session_id, step) is written at ingestion; every speech-derived aggregate is emitted with 'n_covered of n_total'; below the floor the answer switches to a count plus a recommendation to run think-aloud nudges"
  example: "'22% of players (71 of 320 who spoke during the step; 180 silent, excluded) called crafting confusing'"
  cost: S
  depends_on: ops-2
  part: evaluation
  ingest_cost: S
  query_cost: S
  better_than_fixed_table: "Fixed table has no notion of why a cell is empty; this separates 'silent' from 'no friction'"
  shallow: false

- id: ops-4
  title: "One-question micro-survey at tutorial step boundaries, fired by the studio SDK hook step_exit: 'How clear was that? 1-5' plus optional 10-word text, stored as a survey row keyed (session_id, step_id)"
  level: L4
  cell: {part: collection-protocol, modality: survey-or-in-game-prompt-response, granularity: tutorial-step, extraction-trigger: on-studio-tracker-defined, question-type: how-felt, subject-domain: onboarding-tutorial, evidence-form: count-with-denominator}
  object: "spec.md section 3: 'The targets are mostly detecting churn in the tutorial and just after it'"
  situation: "Studio wants per-step clarity scores across 500 players; speech sentiment inference from transcripts has unknown accuracy and misses silent players"
  consequence: "A direct 1-5 clarity score at every step boundary is available for every player who reached the step, with no model inference; response rate in remote playtests of this type is 85-95% when the prompt is one tap"
  p_typical: 0.2
  grounded: quote
  evidence: "spec.md: 'The targets are mostly detecting churn in the tutorial and just after it'"
  proposed: "SDK hook emits step_exit(step_id, build_hash); capture app overlays a 1-tap scale; row {session_id, step_id, clarity_1_5, text, asked_at_ms, answered_at_ms, skipped} lands in the store alongside observations"
  mechanism: "Changes collection-protocol and store: adds a survey_responses table; the question generator treats clarity_1_5 as a closed field so 'which step is least clear' is an aggregate query"
  example: "'Which tutorial step is least clear' returns step 4 (mean 2.3, n=412 of 500 reached, 391 answered) versus step 2 (mean 4.1)"
  cost: M
  depends_on: ops-7
  part: collection-protocol
  ingest_cost: S
  query_cost: S
  better_than_fixed_table: "Fixed table infers 'confused' from speech; this measures it from the player at the moment it happens"
  shallow: false

- id: ops-5
  title: "REFUSE: micro-survey prompts more often than once per step or inside a step; prompts themselves cause quits and contaminate the churn measurement"
  level: L3
  cell: {part: collection-protocol, modality: survey-or-in-game-prompt-response, granularity: utterance, subject-domain: onboarding-tutorial, question-type: how-felt, mechanism-type: change-data-at-source}
  object: "spec.md section 3: 'detecting churn in the tutorial'"
  situation: "A designer proposes a popup every 2 minutes asking 'how are you feeling' to feed the sentiment field"
  consequence: "Persona refuses: in prior remote tutorial tests, interruptions above one per step raised early quits by an estimated 5-10 percentage points, so the instrument changes the very outcome the pipeline is meant to measure; the answer to 'why did they churn' becomes 'the survey'"
  p_typical: 0.06
  grounded: speculative
  evidence: "none"
  proposed: "Protocol rule: at most one prompt per step boundary, none during the first 3 minutes of play, and a protocol_version field so any cohort that violated the rule is flagged in comparisons"
  mechanism: "Changes collection-protocol: a prompt budget (max 1 per step, max 8 per hour) enforced by the capture app; prompts beyond budget are dropped and counted in a prompts_suppressed field"
  example: "Studio asks 'did more players quit in cohort B than A'; the planner finds cohort B ran protocol_version 3 (prompt every 2 min) and attaches 'not comparable: prompt rate differs' instead of a bare percentage"
  cost: S
  depends_on: ops-4
  part: collection-protocol
  ingest_cost: S
  query_cost: S
  better_than_fixed_table: "Fixed table cannot tell whether churn was caused by the game or by the instrument; the prompt budget keeps the measurement clean"
  shallow: false

- id: ops-6
  title: "Quit-reason capture: when the capture app detects game process exit or the player taps 'I am done', show 6 fixed reasons plus free text; store as the churn_reason closed field"
  level: L4
  cell: {part: collection-protocol, modality: survey-or-in-game-prompt-response, question-type: why, subject-domain: onboarding-tutorial, representation: fixed-mcq-answers, evidence-form: count-with-denominator, mechanism-type: change-data-at-source}
  object: "spec.md section 3: 'a fixed set of questions with options, written per game target. The targets are mostly detecting churn in the tutorial'"
  situation: "Of 500 players, 90 quit during the tutorial; the transcript around the quit moment is usually silence or a sigh"
  consequence: "The single most-asked studio question ('why did they quit') is answered from a direct response for 70-80% of quitters instead of inferred from an empty transcript"
  p_typical: 0.15
  grounded: quote
  evidence: "spec.md: 'detecting churn in the tutorial and just after it'"
  proposed: "Options: bored, stuck, confusing, bug or crash, out of time, did not like the game; plus text; row {session_id, quit_at_ms, reason_enum, text, step_id_at_quit}"
  mechanism: "Changes collection-protocol and store: churn_reason becomes a closed field written at session end; the question generator maps every 'why quit' phrasing to this field first and only falls back to transcript retrieval when the field is null"
  example: "'Why did players quit during the tutorial' returns stuck 38 of 90, confusing 22, bug 11, bored 9, out of time 6, other 4; 12 quitters did not answer and are listed separately"
  cost: S
  depends_on: ops-1
  part: collection-protocol
  ingest_cost: S
  query_cost: S
  better_than_fixed_table: "Fixed table infers quit reason from 15 minutes of transcript; this asks the player at the quit moment"
  shallow: false

- id: ops-7
  title: "Studio telemetry SDK hook: the game emits step_enter, step_exit, death, menu_open with build_hash and monotonic ms; stored as the ground-truth step timeline instead of screen-state classification"
  level: L4
  cell: {part: ingestion-extraction, modality: game-telemetry, representation: step-funnel-state-machine-per-player, granularity: tutorial-step, extraction-trigger: at-ingestion, mechanism-type: change-data-at-source, user-segment: studio-data-engineer, build-or-buy: studio-owned-stack}
  object: "memo.md item 1: 'step on screen, action, utterance'; spec.md Unspecified: 'whether game telemetry is joined'"
  situation: "The memo plans to detect 'step on screen' from frames; most studios already fire analytics events at tutorial step boundaries and can forward them with a 1-day integration"
  consequence: "Step boundaries become exact (ms precision, 0 classifier error) for integrated studios; the frame pipeline is reserved for what telemetry does not carry (what the player hovered, what text they read)"
  p_typical: 0.25
  grounded: quote
  evidence: "spec.md: 'whether game telemetry is joined' is Unspecified"
  proposed: "SDK or webhook: POST /events {session_id, build_hash, event_name, step_id, t_ms}; capture app aligns t_ms with video time via a sync beep at session start; events become observation rows with origin=telemetry"
  mechanism: "Changes ingestion and store: a telemetry_events table joined to the manifest by session_id; the step funnel per player is computed from step_enter/step_exit; frames are only extracted inside steps with friction markers"
  example: "'Median time on step 3 across 500 players' is SELECT percentile_cont(0.5) over step_exit minus step_enter, returning 4m12s with no vision model in the loop"
  cost: M
  depends_on: ops-1
  part: ingestion-extraction
  ingest_cost: S
  query_cost: S
  better_than_fixed_table: "Fixed table has no step timestamps at all; this gives exact step durations and ordering per player"
  shallow: false

- id: ops-8
  title: "Audio sync beep and clock offset: capture app plays a 1 kHz tone at session start and logs the wall clock, so telemetry t_ms maps to video_ms with under 100 ms error"
  level: L4
  cell: {part: frame-pipeline, modality: audio-non-speech, granularity: session, extraction-trigger: at-ingestion, mechanism-type: change-data-at-source, effort: XS-days}
  object: "memo.md item 1: 'timestamped atomic observations across all videos of a session'"
  situation: "Telemetry events arrive with the game's monotonic clock; video has its own clock; without a sync point, step boundaries drift by 2-8 seconds and clips open on the wrong moment"
  consequence: "Every clip-with-timestamp evidence link for a telemetry-derived observation opens within 0.1 s of the event instead of several seconds off"
  p_typical: 0.05
  grounded: inferred
  evidence: "spec.md section 1: 'A player's gameplay session is captured as video'"
  proposed: "Capture app: at start, emit tone and write {session_id, tone_wall_clock_ms}; SDK: on init, write {session_id, init_wall_clock_ms, monotonic_ms}; ingestion detects the tone in the audio track and stores clock_offset_ms in the manifest"
  mechanism: "Changes frame-pipeline and session-stitching: one offset per session in the manifest; all telemetry rows get video_id and video_ms derived from it"
  example: "Studio clicks the evidence clip on 'player 212 died 3 times at step 4'; each clip starts 2 s before the death event at the correct frame"
  cost: S
  depends_on: ops-7
  part: frame-pipeline
  ingest_cost: S
  query_cost: S
