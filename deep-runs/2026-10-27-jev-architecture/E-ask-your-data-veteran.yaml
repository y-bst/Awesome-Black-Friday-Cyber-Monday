  example: "Studio: 'how many got stuck at the forge?' Chat: 'Interpreting as: players with at least one stall observation (no progress 45 s or more) at step forge, among 412 who reached it: 31 (7.5%). Did you mean players who said they were confused (18) or who retried 3+ times (44)?'"
