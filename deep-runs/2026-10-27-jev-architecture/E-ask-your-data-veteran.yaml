- id: askdata-1
  title: "Every rate answer carries numerator, denominator, and coverage: '23 of 412 players who reached step 3 (5.6%); 75 of 487 ingested have no step-3 observation'"
  level: L4
  cell: {part: chatbot-ui, evidence-form: count-with-denominator, uncertainty-policy: answer-with-ci-and-n, question-type: how-many, query-path: sql-over-closed-fields, scope: all-players, user-segment: studio-analyst}
  object: "spec.md stage 4: 'A chatbot for the gaming studio answers the studio's questions from that table, so that a question over, say, 500 players is fast'"
  situation: "The studio asks 'what share of players stalled at the forge step' and the store has the stall field for only 412 of 487 ingested sessions"
  consequence: "A bare '5.6%' later turns out to be computed over 412, the studio recomputes 23/487 = 4.7% from the export, and the chatbot is never trusted again; the three-number form makes the discrepancy visible on the first answer"
  p_typical: 0.35
  grounded: inferred
  evidence: "spec.md: 'The answers form a structured table per video' and 'a question over, say, 500 players is fast'; nothing in spec.md states a denominator rule"
  proposed: "Answer renderer template: '{num} of {den} {den_definition} ({pct}%); {missing} of {ingested} players have no observation for this field'"
  shallow: false
  mechanism: "Query path returns a 4-tuple (numerator, denominator, denominator_definition, missing_count) for every rate; the renderer refuses to print a percentage without all four; denominator_definition is a closed enum (ingested, reached_step, spoke_during_step, completed_tutorial)"
  example: "Studio: 'How many players quit during the forge tutorial step?' Answer: '31 of 412 players who reached the forge step quit before completing it (7.5%, 95% CI 5.3-10.5%). 75 of 487 ingested players never reached the forge step and are excluded.'"
  cost: S
  depends_on: "a per-player field marking which tutorial steps were reached (session-stitching must give per-player, not per-video, rows)"
  part: chatbot-ui
  ingest_cost: S
  query_cost: S
  better_than_fixed_table: "The fixed table has per-video rows with no stated denominator, so the same question yields different percentages depending on whether videos or players are counted"

- id: askdata-2
  title: "Abstain rule: any aggregate over fewer than 30 populated players returns 'not enough data (n=12)' plus a backfill offer, never a percentage"
  level: L4
  cell: {part: query-path, uncertainty-policy: abstain-below-coverage, evidence-form: coverage-statement-n-of-m-players, query-path: lazy-backfill-extraction, scope: query-time-defined-cohort, mechanism-type: narrow-or-clarify-the-question}
  object: "memo.md item 2: 'genuinely new questions trigger a one-time batch extraction over all sessions whose result is cached as a new field'"
  situation: "A studio filters to 'players on controller who reached step 5' and only 12 of 487 sessions have that combination populated"
  consequence: "Percentages over n=12 (8% vs 17% is one player) get quoted in a producer deck; the abstain response with the raw n stops the number from leaving the chat"
  p_typical: 0.2
  grounded: inferred
  evidence: "memo.md item 2 names backfill but not a minimum-n or coverage threshold"
  proposed: "Threshold config per field: min_n=30 for rates, min_n=5 for per-player lists; response text 'Only 12 players match; I will not report a rate under 30. Start a backfill over the 320 unprocessed sessions (est. 25 min)?'"
  shallow: false
  mechanism: "Query planner computes populated_n before the aggregate; if populated_n < min_n it returns an abstain object {n, min_n, backfillable: true|false, est_minutes} instead of a number; the UI renders the backfill button"
  example: "Studio: 'What percent of touch-screen players failed the forge step?' Answer: 'Only 12 touch-screen players have the forge-step field; I do not report rates under 30 players. 140 touch-screen sessions are unprocessed for this field; backfill takes about 25 minutes.'"
  cost: S
  depends_on: "populated_n is cheap to compute (field-level null counts in the store)"
  part: query-path
  ingest_cost: S
  query_cost: S
  better_than_fixed_table: "The fixed table answers every question with whatever rows exist; nothing stops a 3-of-12 answer from being read as 25%"

- id: askdata-3
  title: "Evidence drawer on every aggregate: click the number to get the per-player list with one timestamped quote each, and a 'show 5 clips' button"
  level: L4
  cell: {part: chatbot-ui, evidence-form: per-player-list, representation: timestamped-observation-log, question-type: find-players-who, delivery-surface: clip-reel, granularity: player}
  object: "memo.md item 1: 'quote with timestamp as evidence'"
  situation: "The chatbot says 31 players quit at the forge step; a designer wants to see who and why before taking it to the producer"
  consequence: "Without the drawer the designer asks a second question ('which players?') and a third ('show me one'), each a new LLM call that may disagree with the first number; with the drawer the 31 is the list"
  p_typical: 0.3
  grounded: quote
  evidence: "memo.md item 1: 'timestamped atomic observations ... quote with timestamp as evidence'"
  proposed: "Aggregate answer object carries the list of (player_id, session_id, video_index, timestamp, quote) rows that produced the count; UI renders a collapsed table and a clip-reel link"
  shallow: false
  mechanism: "SQL for a count is rewritten to also SELECT the evidence columns; the chatbot never computes a count without materialising the contributing rows, so count == len(rows) by construction"
  example: "Studio: 'How many players said the forge step was confusing?' Answer: '18 of 412 (4.4%)' with a drawer listing 18 players, e.g. P0231, video 3, 07:42, 'where do I even put the ore'; button 'play 5 random clips'"
  cost: M
  depends_on: "observation rows store video_index and timestamp per observation (memo item 1); a clip service that can cut 20-second windows from the original videos (A-frame assumption: originals remain available)"
  part: chatbot-ui
  ingest_cost: S
  query_cost: S
  better_than_fixed_table: "The fixed table stores an option letter per video, so a count cannot be traced back to a quote or a moment"

- id: askdata-4
  title: "Replace the free-text box with 12 slot-filled question templates learned from the first 90 days of query log, e.g. '[share] of [cohort] who [event] at [step]'"
  level: L3
  cell: {part: chatbot-ui, question-origin: learned-from-studio-usage, query-path: text-to-semantic-layer-metrics, mechanism-type: narrow-or-clarify-the-question, moment-in-journey: steady-state-weekly, user-segment: game-designer}
  object: "spec.md constraint: 'Buyers are gaming studios. Their questions are not known in advance.'"
  situation: "After 90 days the query log shows 80% of questions match a dozen shapes (share-of-cohort-at-step, time-to-step, top-reasons-at-step, compare-build, list-players-who)"
  consequence: "Free text invites questions the store cannot answer and invites the model to improvise; templates with dropdowns for step, cohort and metric make the unanswerable question un-typeable, and the free-text box stays as a secondary 'ask anything' path with a lower trust badge"
  p_typical: 0.08
  grounded: inferred
  evidence: "spec.md: questions 'are not known in advance'; the fixed-question table is itself evidence that a bounded set was workable once"
  proposed: "Weekly job clusters the query log by parsed intent; any cluster with 20 or more questions in 30 days becomes a template; template picker UI with slots populated from the field catalog"
  shallow: false
  mechanism: "Query log rows (question, parsed_plan, thumbs) are clustered on the parsed_plan signature; a template is a plan with free slots; the UI exposes templates as forms; template answers are deterministic SQL with no LLM in the numeric path"
  example: "Template 'share of [cohort] who [event] at [step]' filled as cohort=all, event=quit, step=forge gives '31 of 412 (7.5%)' from one SQL statement; the same question typed free-form goes through the planner and gets a 'planner-routed' badge"
  cost: M
  depends_on: "a query log with parsed plans (askdata-9) and at least 500 logged questions"
  part: chatbot-ui
  ingest_cost: S
  query_cost: S
  better_than_fixed_table: "The fixed table fixes the questions at ingestion; templates fix the question shapes at query time while the slots (step, cohort, metric) stay open"

- id: askdata-5
  title: "A semantic layer file (metrics.yaml) defines every named metric with its numerator, denominator and field; the chatbot may only compute metrics that exist in the file"
  level: L3
  cell: {part: query-path, query-path: text-to-semantic-layer-metrics, representation: olap-cube-materialized-views, uncertainty-policy: abstain-below-coverage, user-segment: studio-data-engineer, build-or-buy: open-source-component}
  object: "memo.md item 2: 'closed-field questions become aggregate queries over all players (instant)'"
  situation: "The studio asks for 'stall rate'; two engineers would write two different SQL statements (stall observations per video vs players with any stall per step)"
  consequence: "The chatbot invents a denominator per question and gives 9% on Monday and 12% on Tuesday for the same question; a named metric gives one definition, visible to the studio, and the planner maps text to metric names instead of to SQL"
  p_typical: 0.09
  grounded: inferred
  evidence: "memo.md item 2 says closed-field questions become aggregate queries but does not say who defines the aggregate"
  proposed: "metrics.yaml entry: step_stall_rate = count(distinct player where stall_flag at step S) / count(distinct player where reached step S); dimensions: step, build_version, input_device; the planner emits metric+dimensions, a metrics engine (open-source semantic layer such as cube or dbt metrics) emits SQL"
  shallow: false
  mechanism: "Text-to-metric instead of text-to-SQL: the LLM chooses a metric name and dimension values from a catalog of about 40 entries; SQL generation is deterministic from the catalog; unknown metric requests are refused with the nearest 3 metric names"
