- id: gur-1
  title: "Replace the per-video answers table as the producer-facing unit with an issue table: one row per (game, build, tutorial_step, issue_id) carrying severity 1-4, frequency n_affected/n_reached, 3 clip ids and a one-line fix note"
  level: L3
  cell: {part: store, representation: issue-list-with-severity-frequency, question-type: what-to-fix-first-prioritised, evidence-form: severity-frequency-matrix, user-segment: producer-exec, delivery-surface: dashboard-standard-report, mechanism-type: precompute-more}
  object: "spec.md step 3: 'The answers form a structured table per video'; spec.md step 4: 'A chatbot for the gaming studio answers the studio's questions from that table'"
  situation: "A producer opens the tool the Monday after 500 tutorial sessions were ingested and wants to know what to put in this sprint, not to type questions"
  consequence: "The first screen is a ranked list of at most 20 issues, each with severity, frequency and clips; the chatbot becomes the drill-down, not the entry point"
  p_typical: 0.3
  grounded: quote
  evidence: "spec.md: 'The targets are mostly detecting churn in the tutorial and just after it'; memo.md item 1 produces observations but no issue aggregation step"
  proposed: "Nightly job clusters friction observations by (step, action_pattern, heuristic) into issue rows; issue(game_id, build, step, issue_id, label, severity, n_affected, n_reached, clip_ids[3], fix_note, first_seen, last_seen)"
  shallow: false
  mechanism: "Ingestion keeps the observation log; a clustering pass over friction and stall observations (same step, same on-screen state, same action pattern) writes issue rows; severity from gur-2 rubric; frequency from gur-3 denominators; the dashboard reads issue rows sorted by severity*frequency"
  example: "Issue row 'Step 3 (crafting): 142 of 410 players who reached step 3 opened the wrong menu 2+ times; severity 3; 61 of them quit within 5 min' sits at rank 1 before anyone asks a question"
  cost: M
  depends_on: "observation log with step and friction fields (memo item 1)"
  part: store
  ingest_cost: M
  query_cost: S
  better_than_fixed_table: "The fixed table answers 'did X happen' per video; the issue table answers 'what should we fix first' across players, which is the artefact GUR actually hands to producers"

- id: gur-2
  title: "Severity as a closed 4-level enum computed from observable criteria at ingestion: 4 = quit within 300s or no step progress for 120s; 3 = 3+ failed attempts at the same action; 2 = wrong action recovered within 30s; 1 = verbal complaint with no behavioural trace"
  level: L4
  cell: {part: ingestion-extraction, representation: timestamped-observation-log, granularity: variable-length-moment-or-episode, modality: screen-state-classifier, extraction-trigger: at-ingestion, question-type: what-to-fix-first-prioritised}
  object: "memo.md item 1: 'friction signal, sentiment, quote with timestamp as evidence'"
  situation: "Two friction observations on step 3 look identical in the log, but one player quit 40 seconds later and the other shrugged and moved on"
  consequence: "Severity is not an LLM opinion word ('seems frustrated') but a reproducible level from timing and attempt counts, so two builds can be compared on it"
  p_typical: 0.08
  grounded: inferred
  evidence: "memo.md names 'friction signal' with no scale; spec.md step 3 has 'questions with options' but no severity"
  proposed: "Column friction.severity int 1-4 plus friction.severity_basis enum {quit_300s, stall_120s, attempts_3, recovered_30s, verbal_only}"
  shallow: false
  mechanism: "After the observation log exists, a deterministic pass per friction episode reads the next 300s of screen-state rows: exit event, step-progress absence, repeated action rows, recovery; assigns the highest matching level and records which rule fired"
  example: "'Which tutorial issues are critical?' -> 'Severity 4 on step 3: 61 players (stall 120s then quit); severity 3: 81 players (3+ wrong-menu attempts)'"
  cost: S
  depends_on: "screen-state classifier rows with step and action fields; session exit timestamp from session stitching"
  part: ingestion
  ingest_cost: S
  query_cost: S
  better_than_fixed_table: "The fixed table can say 'player struggled: yes/no'; this says how badly on a scale that maps to a sprint priority"

- id: gur-3
  title: "Every frequency on a tutorial step uses the funnel denominator n_reached(step), not n_players; the chatbot footer prints both numbers and refuses a percentage when n_reached < 20"
  level: L4
  cell: {part: query-path, representation: step-funnel-state-machine-per-player, question-type: how-many, evidence-form: count-with-denominator, uncertainty-policy: abstain-below-coverage, granularity: tutorial-step, query-path: sql-over-closed-fields}
  object: "spec.md step 4: 'a question over, say, 500 players is fast'"
  situation: "Studio asks 'what percent of players fail the boss tutorial at step 8?' and only 95 of 500 players reached step 8 because 405 churned earlier"
  consequence: "Answer reads '38% (36 of 95 who reached step 8; 500 started)' instead of '7%', which would have hidden a severe late-tutorial issue"
  p_typical: 0.15
  grounded: inferred
  evidence: "spec.md: 'The targets are mostly detecting churn in the tutorial and just after it'; a churn funnel makes n_reached shrink by step"
  proposed: "Materialised table funnel(game_id, build, step, n_reached, n_completed, median_s, p75_s); planner rewrites any per-step ratio to use funnel.n_reached"
  shallow: false
  mechanism: "Per player a state machine over screen-state rows yields reached[step], completed[step], t_enter, t_exit; aggregated nightly into funnel; the SQL template for how-many on a step joins funnel for the denominator and emits both counts"
  example: "'How many players quit at step 3?' -> '142 of 410 who reached step 3 (35%); 90 players never reached step 3'"
  cost: S
  depends_on: "step detection from screen state per video and session stitching so the funnel spans videos"
  part: query
  ingest_cost: S
  query_cost: S
  better_than_fixed_table: "Fixed table rows are per video, so a step rate is divided by videos or by all players; neither is the funnel-correct denominator"

- id: gur-4
  title: "Seed the question ontology from the Desurvire PLAY / Pinelle game usability heuristics: each of the ~40 heuristics becomes a tracker with a written observable violation signature (utterance pattern + screen-state pattern), stored as trackers before any game-specific question exists"
  level: L3
  cell: {part: question-generation, question-origin: established-gur-frameworks-heuristics-pxi-mda, reuse-scope-of-extraction: universal-primitives, moment-in-journey: game-onboarding-day-0, representation: customer-defined-trackers-over-universal-primitives, effort: S-weeks}
  object: "memo.md item 3: 'Questions are generated from an ontology (entities x dimensions x outcomes), pruned by the game target'"
  situation: "A new game is onboarded on day 0 with no usage log and no studio questions; the ontology needs a non-empty starting set that is not hand-written per game"
  consequence: "Day-0 extraction already carries ~40 named heuristic trackers (e.g. 'goals are clear', 'feedback on actions is immediate', 'controls are learnable') that transfer across every game"
  p_typical: 0.2
  grounded: quote
  evidence: "memo.md: 'entities x dimensions x outcomes'; B-perspectives: 'ready-made ontologies for question generation'"
  proposed: "Table heuristic_tracker(heuristic_id, name, source, violation_signature_text, utterance_regex_examples[], screen_state_pattern, answer_type) with 40 rows shipped with the product"
  shallow: false
  mechanism: "Each heuristic is rewritten as a violation an extractor can detect in a 15-min video: 'Provide clear goals' -> utterance expresses goal uncertainty ('what am I supposed to do') AND no objective marker on screen for 20s; the extractor emits heuristic_violation(heuristic_id, t, quote, confidence)"
  example: "'Why do players churn in the tutorial?' -> 'Top heuristic violations among churners: goals unclear (58 of 140), feedback on failed action missing (44 of 140), control mapping not shown (31 of 140)'"
  cost: M
  depends_on: "nothing"
  part: question-generation
  ingest_cost: M
  query_cost: S
  better_than_fixed_table: "Fixed questions are written per game target; heuristics are game-independent and come with 20 years of validation of which violations predict quitting"

- id: gur-5
  title: "Tag every observation with an MDA layer (mechanic / dynamic / aesthetic) and link rows M->D->A within a 60s window, so 'why' questions return a causal chain instead of a sentiment count"
  level: L3
  cell: {part: store, representation: entity-relation-graph, question-type: why, question-origin: established-gur-frameworks-heuristics-pxi-mda, granularity: variable-length-moment-or-episode, evidence-form: quote-with-timestamp}
  object: "memo.md item 1: 'timestamped atomic observations ... (step on screen, action, utterance, friction signal, sentiment, quote with timestamp as evidence)'"
  situation: "Studio asks 'why do players dislike the crafting step?' and the log has 300 negative-sentiment rows with no stated cause"
  consequence: "The answer names the mechanic (3-slot inventory), the dynamic it produced (player discards the quest item), and the aesthetic outcome (frustration utterance), with counts per link"
  p_typical: 0.06
  grounded: inferred
  evidence: "memo.md item 1 has sentiment as a flat field; no causal linking is specified"
  proposed: "Column obs.mda enum {M, D, A} plus edge table obs_link(from_obs, to_obs, relation in {produces, evokes}) written by the extractor for rows within 60s of each other"
  shallow: false
  mechanism: "The extractor prompt asks for each friction/sentiment row the preceding game rule (M) and emergent behaviour (D); rows and edges are written to the store; 'why' queries walk A<-D<-M and group by the M node"
  example: "'Why do players quit at crafting?' -> 'Chain in 47 of 61 quitters: inventory limit 3 (M) -> quest item discarded (D) -> \"this is pointless\" type utterance (A), median 90s before exit'"
  cost: M
  depends_on: "observation log; extractor prompt revision"
  part: store
  ingest_cost: M
  query_cost: S
  better_than_fixed_table: "The table stores 'frustrated: yes'; the chain stores what rule caused it, which is what a designer can change"

- id: gur-6
  title: "Tag friction and sentiment observations with one of the 10 PXI constructs (ease of control, progress feedback, audiovisual appeal, goals and rules, challenge, meaning, mastery, immersion, autonomy, curiosity) as a closed field; never emit a PXI score"
  level: L3
  cell: {part: ingestion-extraction, question-origin: established-gur-frameworks-heuristics-pxi-mda, representation: timestamped-observation-log, question-type: how-felt, granularity: utterance, reuse-scope-of-extraction: universal-primitives}
  object: "memo.md item 1: 'closed enum fields and short open fields'"
  situation: "A designer asks 'is the tutorial problem a control problem or a clarity problem?' and the log only has free-text friction descriptions"
  consequence: "Every friction row has a construct enum, so the answer is a 10-bucket histogram over 500 players rather than an LLM summary of 300 strings"
  p_typical: 0.07
  grounded: inferred
  evidence: "memo.md item 1 names 'friction signal' with no taxonomy; spec.md 'Unspecified: ... answer types'"
  proposed: "Column friction.pxi_construct enum of 10 values plus 'none'; extractor instructed with one example utterance per construct"
  shallow: false
  mechanism: "At ingestion, the extractor assigns the construct from the utterance and screen context; the chatbot planner treats how-felt questions as GROUP BY pxi_construct over friction rows with n_reached denominators"
  example: "'What is the tutorial experience like?' -> 'Friction by construct among 410 players reaching step 3: goals and rules 38%, ease of control 22%, progress feedback 17%, challenge 9%, other 14%'"
  cost: S
  depends_on: "friction observation rows"
  part: ingestion
  ingest_cost: S
  query_cost: S
  better_than_fixed_table: "Fixed table has one 'frustration' question; the construct field splits it into the 10 dimensions the PXI literature shows are actionable separately"

- id: gur-7
  title: "REFUSED: synthesising PXI, GEQ or PENS scale scores from speech and screen; instead inject a 10-item PXI prompt in-game at session end and join the self-report rows to the observation log by player_id"
  level: L3
  cell: {part: collection-protocol, modality: survey-or-in-game-prompt-response, mechanism-type: change-data-at-source, question-type: how-felt, question-origin: established-gur-frameworks-heuristics-pxi-mda, evidence-form: contrast-vs-baseline}
  object: "memo.md item 1: 'sentiment' as an extracted observation field"
  situation: "A producer asks 'what is our immersion score?' and the chatbot would be tempted to average inferred sentiment"
  consequence: "The GUR lead's refusal: inferred affect reported as a validated-scale score will be read as one by the studio and is wrong at the construct level; the answer must come from the 10-item self-report, with observation rows as explanation"
  p_typical: 0.05
  grounded: inferred
  evidence: "spec.md 'Unspecified: What a transcript contains (speech only ...)'; no self-report channel exists in spec.md or memo.md"
  proposed: "Session-end prompt with 10 PXI items (1-7) written to pxi_response(player_id, session_id, construct, score); planner answers scale questions only from this table and refuses otherwise"
  shallow: false
  mechanism: "Studio SDK or capture client shows the 10 items at session end (median 90s to answer); rows join to the observation log; how-felt questions over constructs read self-report first and attach the top observation rows for that construct as explanation"
  example: "'Is the tutorial fun?' -> 'PXI curiosity 4.9/7, mastery 3.1/7 (n=287 of 500 answered); low mastery coincides with 3+ failed attempts at step 3 in 112 of those 287'"
  cost: M
  depends_on: "studio willingness to add a session-end prompt to the build"
  part: ingestion
  ingest_cost: S
  query_cost: S
  better_than_fixed_table: "The fixed table cannot report a validated experience measure at all; this adds one without pretending inference is measurement"

- id: gur-8
  title: "Design-intent map per game: at onboarding the designer enters the intended tutorial step sequence with expected duration and expected action per step; extraction computes per-player deviation (skipped, reordered, 2x over expected time, wrong action) against it"
  level: L3
  cell: {part: question-generation, question-origin: onboarding-interview-with-studio, representation: step-funnel-state-machine-per-player, question-type: compare-steps, granularity: tutorial-step, moment-in-journey: game-onboarding-day-0, mechanism-type: narrow-or-clarify-the-question}
  object: "spec.md step 3: 'a fixed set of questions with options, written per game target'"
  situation: "A game has 12 tutorial steps; the designer expects step 5 to take 45s and the player to open the map; nobody has told the extractor this"
  consequence: "Deviation rows exist per player per step from day 1 and the question 'where does the tutorial not go as designed?' is answerable without any studio question"
  p_typical: 0.12
  grounded: quote
  evidence: "spec.md: 'written per game target'; memo.md: 'pruned by the game target'"
  proposed: "Table intent_step(game_id, step_idx, name, expected_action, expected_s, screen_marker); extractor emits deviation(player_id, step_idx, kind in {skipped, reordered, slow_2x, wrong_action}, t)"
  shallow: false
  mechanism: "A 30-minute onboarding form captures the designer's intended path; the step detector uses screen_marker to find steps; a per-player pass compares observed path and time to intent and writes deviation rows"
  example: "'Where does the tutorial break?' -> 'Step 5: 212 of 380 players took >90s (expected 45s); 97 opened inventory instead of map; step 9 skipped by 140'"
  cost: S
  depends_on: "step detection from frames; onboarding form in the studio UI"
  part: question-generation
  ingest_cost: S
  query_cost: S
  better_than_fixed_table: "Fixed questions ask 'did the player struggle'; the intent map asks 'did the player do what the designer meant', which is the GUR definition of a usability issue"

- id: gur-9
  title: "Research-question kickoff: a 45-minute structured interview with the design lead yields 5-10 worry statements ('we think players miss the dodge prompt'), each stored as a hypothesis with a named observable and a pass/fail threshold, and tracked as a first-class row"
  level: L3
  cell: {part: question-generation, question-origin: onboarding-interview-with-studio, moment-in-journey: game-onboarding-day-0, user-segment: game-designer, mechanism-type: narrow-or-clarify-the-question, evidence-form: count-with-denominator}
  object: "spec.md Constraints: 'Their questions are not known in advance'"
  situation: "Day 0 of a new studio; the ontology can generate 300 questions but nobody knows which 10 the team will actually act on"
  consequence: "The first report answers the team's own worries by name, which is how a GUR lab earns trust before the long tail"
  p_typical: 0.15
  grounded: quote
  evidence: "spec.md: 'Buyers are gaming studios. Their questions are not known in advance.'"
  proposed: "Table hypothesis(game_id, text, observable_field, threshold, owner, status); the digest opens with hypothesis rows marked confirmed / refuted / insufficient-n"
  shallow: false
  mechanism: "Interview script with 6 prompts (what worries you, where do you expect drop-off, what did the last playtest find, what changed in this build, who is the target player, what would make you cut a feature); each answer is mapped to an existing or new tracker"
  example: "Hypothesis 'players miss the dodge prompt at step 4' -> observable 'dodge not used within 20s of prompt' -> result '63% of 440 (confirmed, threshold 30%)'"
  cost: XS
  depends_on: "nothing"
  part: question-generation
  ingest_cost: S
  query_cost: S
  better_than_fixed_table: "The fixed table's questions were written by JEV guessing the target; the hypotheses are written by the people who will act on them"

- id: gur-10
  title: "REFUSED: webcam face and posture as an affect modality for frustration counts; permitted only as a per-player timeline overlay labelled 'unvalidated', never aggregated into a number"
  level: L3
  cell: {part: ingestion-extraction, modality: webcam-face-and-posture, question-type: how-felt, uncertainty-policy: abstain-below-coverage, mechanism-type: human-in-the-loop, evidence-form: none}
  object: "spec.md step 2: 'what is on screen is largely lost'; the pipeline extends to new modalities"
  situation: "Someone proposes adding webcam-based emotion classification to answer 'how many players were frustrated'"
  consequence: "A biometrics lab veteran refuses: facial affect classifiers in play contexts have shown weak agreement with self-report, players sit still and expressionless while furious; an aggregated 'frustrated 34%' from faces would be the first wrong number that collapses trust"
  p_typical: 0.05
  grounded: inferred
  evidence: "spec.md 'Unspecified' lists no webcam; the refusal is a design constraint the GUR lead would add"
  proposed: "If webcam exists, store face_event rows with confidence and show them only on the gur-11 storyboard; planner excludes modality=webcam from any COUNT"
  shallow: false
  mechanism: "Modality allow-list in the planner: aggregate queries may read speech, screen-state, input and self-report rows; webcam rows are display-only"
  example: "'How many players were frustrated at step 3?' -> answered from behavioural severity (gur-2) and PXI self-report (gur-7): '81 of 410 had 3+ failed attempts; 112 of 287 self-reported mastery <= 3'; face rows do not appear"
  cost: XS
  depends_on: "nothing"
  part: ingestion
  ingest_cost: S
  query_cost: S
  better_than_fixed_table: "Prevents a modality the fixed table never had from producing a confidently wrong aggregate"

- id: gur-11
  title: "Per-player session storyboard in the UI: a horizontal timeline across all videos of a session with step bands, friction markers by severity, speech-density and pace lanes, and clickable quotes, modelled on biometric storyboards"
  level: L3
  cell: {part: chatbot-ui, representation: time-series-signals-affect-pace-silence, granularity: session, question-type: timeline, delivery-surface: dashboard-standard-report, user-segment: ux-researcher, scope: one-player}
  object: "spec.md step 1: 'A session can be n hours; each video is capped at 15 minutes, so one session is many videos'"
  situation: "A researcher wants to see one churner's whole 2h10m session (9 videos) without watching it"
  consequence: "One screen shows where the 9 videos join, where the player stalled, and what they said, at 1 pixel per 5 seconds; a click opens the clip"
  p_typical: 0.06
  grounded: quote
  evidence: "spec.md: 'Long multi-video sessions' listed under known problems"
  proposed: "Storyboard component reading observation rows ordered by session_t (video_idx*900 + t_in_video) plus per-minute lanes speech_utterances, actions_per_min, step_id"
  shallow: false
  mechanism: "Session stitching provides a monotone session clock; a per-minute rollup table lane(session_id, minute, utterances, actions, step_id, max_severity) feeds the drawing; markers link to observation rows and clips"
  example: "Storyboard of player P042: step 3 band spans minutes 14-29 (expected 3), 4 severity-3 markers, speech lane drops to 0 at minute 24, exit at minute 29"
  cost: M
  depends_on: "session stitching with a session clock; per-minute rollup"
  part: ui
  ingest_cost: S
  query_cost: S
  better_than_fixed_table: "The table per video cannot show a 2-hour arc; the storyboard is how a GUR lab reads one participant"

- id: gur-12
  title: "Think-aloud compliance per player: utterances per minute computed at ingestion; players below 2 per minute are flagged speech-sparse and excluded from what-said and why denominators, and every such answer states 'n=312 of 500 talked enough'"
  level: L4
  cell: {part: evaluation, modality: silence-or-absence-of-speech, uncertainty-policy: answer-with-ci-and-n, evidence-form: coverage-statement-n-of-m-players, question-type: what-said, granularity: player}
  object: "spec.md step 2: 'Each video is converted to a transcript'"
  situation: "Studio asks 'what do players say about the crafting step?' and 188 of 500 players said fewer than 10 words in the whole session"
  consequence: "Silent players are not counted as 'said nothing negative'; the answer carries the real speaking population"
  p_typical: 0.08
  grounded: inferred
  evidence: "spec.md: 'The owner's view: the transcript alone is not enough'; no speech-density measure is specified"
  proposed: "Column player_session.utterances_per_min and flag speech_sparse (threshold 2.0); planner adds WHERE NOT speech_sparse for speech-derived questions and emits the coverage footer"
  shallow: false
  mechanism: "Transcript rows per video are counted per minute and averaged per session; the planner has a list of speech-derived fields and applies the filter and footer to any query on them"
  example: "'Why do players quit at step 3?' -> 'Among 93 of 142 step-3 quitters who talked (>= 2 utterances/min): 58 mention not knowing the goal; 49 quitters were silent and are not characterised'"
  cost: XS
  depends_on: "nothing"
  part: evaluation
  ingest_cost: S
  query_cost: S
  better_than_fixed_table: "The fixed table answers 'no' for silent players, which inflates 'no complaint' rates; this makes silence a coverage statement"

- id: gur-13
  title: "Cued retrospective recall added to the collection protocol: at session end the client auto-selects the 3 highest-severity friction clips and asks the player to narrate each for 60s; recall utterances are stored with a link to the original clip timestamp"
  level: L3
  cell: {part: collection-protocol, mechanism-type: change-data-at-source, modality: speech-transcript, question-type: why, extraction-trigger: continuous-during-live-session, evidence-form: quote-with-timestamp}
  object: "memo.md item 1: 'utterance, friction signal ... quote with timestamp as evidence'"
  situation: "The highest-severity stall at step 3 happened in silence; there is no utterance to explain it"
  consequence: "For 60-70% of severity-3+ episodes there is a first-person explanation recorded minutes later, attached to the exact clip"
  p_typical: 0.04
  grounded: inferred
  evidence: "spec.md 'Unspecified' includes what a transcript contains; no post-session protocol exists in spec.md or memo.md"
  proposed: "Client-side hook at session end reads friction rows from the live extractor, plays 3 clips, records answers; rows recall(player_id, clip_id, transcript, t_recorded)"
  shallow: false
  mechanism: "Requires near-live extraction of severity (gur-2) during the session; the capture client shows the clip and a record button; recall rows are a second utterance source the planner reads for 'why' on that episode"
  example: "'Why did players stall at step 3?' -> '41 recall narrations on step-3 clips: 29 say the crafting button looked disabled, 7 say they were reading the quest text'"
  cost: M
  depends_on: "live or near-live severity scoring; capture client change"
  part: ingestion
  ingest_cost: M
  query_cost: S
  better_than_fixed_table: "The fixed table only sees what was said during play; cued recall is the standard GUR fix for silent participants"

- id: gur-14
  title: "Stable issue fingerprint (step_id + heuristic_id + action_pattern hash) so the same issue keeps its row across builds; the pre/post view shows frequency per build and flags any issue whose frequency did not drop by at least 10 points after a fix was logged"
  level: L4
  cell: {part: store, question-type: did-the-fix-work-pre-post, scope: build-version-pair, moment-in-journey: new-build-version, representation: issue-list-with-severity-frequency, evidence-form: contrast-vs-baseline, modality: build-version-metadata}
  object: "memo.md item 2: 'genuinely new questions trigger a one-time batch extraction'; spec.md 'Unspecified: ... how videos of one session are linked' (no build linkage either)"
  situation: "Build 1.2 shipped a fix for the step-3 crafting issue; the studio asks whether it worked and the issue list was regenerated from scratch with new ids"
  consequence: "Issue #17 shows 35% (build 1.1, n_reached 410) vs 31% (build 1.2, n_reached 388) and is flagged 'fix did not land'"
  p_typical: 0.09
  grounded: inferred
  evidence: "memo.md has no build dimension; spec.md names 'churn in the tutorial' which is exactly what RITE cycles iterate on"
  proposed: "issue.fingerprint = sha(step_id, heuristic_id, action_pattern); issue_build(fingerprint, build, n_affected, n_reached); fix_log(fingerprint, build_fixed, note)"
  shallow: false
  mechanism: "Clustering (gur-1) assigns clusters to existing fingerprints when 80% of member observations match the pattern; the studio marks a fix in the UI; the digest compares the two most recent builds and alerts on < 10-point drop"
  example: "'Did the 1.2 patch fix step 3?' -> 'Issue #17 wrong-menu at step 3: 35% -> 31%, not fixed (threshold 10 pts); issue #22 missed dodge prompt: 63% -> 18%, fixed'"
  cost: S
  depends_on: "issue table (gur-1); build version captured per session"
  part: store
  ingest_cost: S
  query_cost: S
  better_than_fixed_table: "Fixed-table answers per video cannot be lined up by issue across builds; RITE needs the issue to be the unit of comparison"

- id: gur-15
  title: "Issue admission rule: an issue reaches the producer list only when seen in >= 5 players and >= 5% of n_reached; below that it sits on a watch list that is re-evaluated when the cohort grows by 50 players"
  level: L4
  cell: {part: cost-governance, uncertainty-policy: abstain-below-coverage, extraction-trigger: on-cohort-size-threshold, question-type: what-to-fix-first-prioritised, representation: issue-list-with-severity-frequency, user-segment: producer-exec}
  object: "spec.md step 4: 'a question over, say, 500 players'"
  situation: "After 60 sessions the clustering produces 140 issue rows, 110 of them seen by 1-2 players"
  consequence: "The producer sees 14 issues, not 140; the watch list keeps the long tail from being lost and promotes items automatically"
  p_typical: 0.07
  grounded: inferred
  evidence: "memo.md item 2 has no cohort-size rule; GUR practice reports issues observed in multiple participants"
  proposed: "issue.status in {watch, listed}; promotion job runs on cohort growth of 50 sessions"
  shallow: false
  mechanism: "Admission computed from issue_build rows; status transitions logged; the digest and the dashboard filter on status=listed and show the watch count"
