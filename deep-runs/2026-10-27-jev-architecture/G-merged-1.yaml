# Stage G merged leaves, bucket 1 (part: query-path, ideate run). Rejected: none. Cells normalised against C-axes.yaml.
- id: askdata-2
  title: 'Abstain rule: any aggregate over fewer than 30 populated players returns ''not enough data (n=12)'' plus a backfill
    offer, never a percentage'
  level: L4
  perspective: askdata
  cell:
    part: query-path
    granularity: tutorial-step
    query-path: lazy-backfill-extraction
    question-type: how-many
    extraction-trigger: on-first-question
    scope: query-time-defined-cohort
    evidence-form: coverage-statement-n-of-m-players
    effort: S-weeks
    mechanism-type: narrow-or-clarify-the-question
    subject-domain: onboarding-tutorial
    schema-evolution: lazy-backfill-on-demand
    uncertainty-policy: abstain-below-coverage
  object: 'memo.md item 2: ''genuinely new questions trigger a one-time batch extraction over all sessions whose result is
    cached as a new field'''
  situation: A studio filters to 'players on controller who reached step 5' and only 12 of 487 sessions have that combination
    populated
  consequence: Percentages over n=12 (8% vs 17% is one player) get quoted in a producer deck; the abstain response with the
    raw n stops the number from leaving the chat
  p_typical: 0.2
  grounded: inferred
  evidence: memo.md item 2 names backfill but not a minimum-n or coverage threshold
  proposed: 'Threshold config per field: min_n=30 for rates, min_n=5 for per-player lists; response text ''Only 12 players
    match; I will not report a rate under 30. Start a backfill over the 320 unprocessed sessions (est. 25 min)?'''
  shallow: false
  mechanism: 'Query planner computes populated_n before the aggregate; if populated_n < min_n it returns an abstain object
    {n, min_n, backfillable: true|false, est_minutes} instead of a number; the UI renders the backfill button'
  example: 'Studio: ''What percent of touch-screen players failed the forge step?'' Answer: ''Only 12 touch-screen players
    have the forge-step field; I do not report rates under 30 players. 140 touch-screen sessions are unprocessed for this
    field; backfill takes about 25 minutes.'''
  cost: S
  depends_on: populated_n is cheap to compute (field-level null counts in the store)
  part: query-path
  ingest_cost: S
  query_cost: S
  better_than_fixed_table: The fixed table answers every question with whatever rows exist; nothing stops a 3-of-12 answer
    from being read as 25%
  variants_of:
  - planner-2
- id: askdata-5
  title: A semantic layer file (metrics.yaml) defines every named metric with its numerator, denominator and field; the chatbot
    may only compute metrics that exist in the file
  level: L3
  perspective: askdata
  cell:
    part: query-path
    representation: olap-cube-materialized-views
    granularity: tutorial-step
    query-path: text-to-semantic-layer-metrics
    question-type: how-many
    latency-tier: under-2s
    question-origin: established-gur-frameworks-heuristics-pxi-mda
    evidence-form: count-with-denominator
    effort: M-one-quarter
    mechanism-type: narrow-or-clarify-the-question
    user-segment: studio-data-engineer
    delivery-surface: chatbot
    subject-domain: onboarding-tutorial
    reuse-scope-of-extraction: genre-shared
    schema-evolution: append-only-versioned-fields
    uncertainty-policy: abstain-below-coverage
    build-or-buy: open-source-component
  object: 'memo.md item 2: ''closed-field questions become aggregate queries over all players (instant)'''
  situation: The studio asks for 'stall rate'; two engineers would write two different SQL statements (stall observations
    per video vs players with any stall per step)
  consequence: The chatbot invents a denominator per question and gives 9% on Monday and 12% on Tuesday for the same question;
    a named metric gives one definition, visible to the studio, and the planner maps text to metric names instead of to SQL
  p_typical: 0.09
  grounded: inferred
  evidence: memo.md item 2 says closed-field questions become aggregate queries but does not say who defines the aggregate
  proposed: 'metrics.yaml entry: step_stall_rate = count(distinct player where stall_flag at step S) / count(distinct player
    where reached step S); dimensions: step, build_version, input_device; the planner emits metric+dimensions, a metrics engine
    (open-source semantic layer such as cube or dbt metrics) emits SQL'
  shallow: false
  mechanism: 'Text-to-metric instead of text-to-SQL: the LLM chooses a metric name and dimension values from a catalog of
    about 40 entries; SQL generation is deterministic from the catalog; unknown metric requests are refused with the nearest
    3 metric names'
  example: 'Studio: ''where in the tutorial do players stall most?'' Planner emits metric=step_stall_rate, group_by=step;
    result: forge 7.5% (31/412), smelt 3.1% (14/451), mine 1.2% (6/487)'
  cost: M
  depends_on: closed fields keyed by player and step (session-stitching); a metrics catalog maintained by JEV ops
  part: query-path
  ingest_cost: S
  query_cost: S
  better_than_fixed_table: The fixed table has answers but no metric definitions, so aggregates are improvised per question;
    the catalog makes the same question return the same number
  also_from:
  - analyst
  - planner
  - platform
  absorbed:
  - planner-10
  - analyst-29
  - platform-31
- id: askdata-7
  title: 'Answer permalink: every answer gets an id; re-running the id returns the same number from the same snapshot, and
    the answer page shows snapshot date, n, schema version and model version'
  level: L4
  perspective: askdata
  cell:
    part: query-path
    granularity: session
    query-path: cached-prior-answer
    latency-tier: sub-200ms-cached
    evidence-form: extraction-provenance-model-and-schema-version
    effort: M-one-quarter
    mechanism-type: reuse-or-cache-prior-work
    user-segment: producer-exec
    moment-in-journey: pre-launch-greenlight
    schema-evolution: append-only-versioned-fields
    uncertainty-policy: answer-with-ci-and-n
  object: 'memo.md item 2: ''whose result is cached as a new field'''
  situation: A producer pastes '7.5% quit at the forge' into a greenlight deck; three weeks later a designer asks the same
    question and gets 9.1% because 120 more sessions were ingested and the extraction model was upgraded
  consequence: Two numbers for one question in the same studio is the single event that ended the previous product's use;
    a permalink answers 'which is right' with 'both, here is what changed between snapshot 2026-10-01 (n=487, model v2) and
    2026-10-22 (n=607, model v3)'
  p_typical: 0.06
  grounded: inferred
  evidence: memo.md item 2 caches results as fields; spec.md says nothing about versioning answers
  proposed: 'Answer table: (answer_id, question, plan, snapshot_ts, n, schema_version, extraction_model_version, result_json);
    UI link ''jev.app/a/8f3k''; a ''what changed'' diff when the same plan is re-run'
  shallow: false
  mechanism: Query path records the plan and the store snapshot (ingestion watermark) with every answer; re-running an answer_id
    executes the plan against the watermark, not the live store; a diff view runs the plan on both watermarks and lists n
    delta, field-version delta
  example: 'Producer opens jev.app/a/8f3k: ''Forge-step quit rate 7.5% (31/412), snapshot 2026-10-01, extraction model v2,
    schema 1.4''. Clicking ''rerun today'' shows ''9.1% (55/602), snapshot 2026-10-22, model v3; 52 of the 55 come from sessions
    ingested after 10-01, 3 from re-extraction'''
  cost: M
  depends_on: ingestion watermark per session and versioned field values (askdata-13)
  part: query-path
  ingest_cost: S
  query_cost: S
  better_than_fixed_table: The fixed table is overwritten per video and has no answer history, so a number quoted last month
    cannot be reproduced
  also_from:
  - publisher
  absorbed:
  - publisher-27
- id: askdata-16
  title: 'REFUSE: query-time map-reduce of an LLM over 500 raw transcripts for numeric questions, because the same question
    run twice yields different counts'
  level: L3
  perspective: askdata
  cell:
    part: query-path
    representation: raw-transcript-only
    query-path: map-reduce-over-raw
    question-type: how-many
    modality: speech-transcript
    scope: all-players
    latency-tier: minutes
    effort: S-weeks
    mechanism-type: narrow-or-clarify-the-question
    uncertainty-policy: always-answer
  object: 'spec.md stage 4: ''Reading 500 transcripts per question was too slow and too much data, which is why the fixed-question
    table exists'''
  situation: A proposal to drop the store and have a long-context model count directly over raw transcripts at query time
  consequence: 'Low willingness: in the previous product a model-counted answer varied by up to 20% between runs on identical
    input, and the studio noticed within a week; non-determinism in the numeric path is a trust failure independent of accuracy.
    Accept raw map-reduce only for open ''what did players say about X'' questions, labelled as a non-numeric reading'
  p_typical: 0.05
  grounded: quote
  evidence: 'spec.md: ''Reading 500 transcripts per question was too slow and too much data'''
  proposed: 'Planner rule: question-type in {how-many, how-long, compare-versions, did-the-fix-work-pre-post} may never route
    to map-reduce-over-raw; such questions without a field go to backfill (askdata-14) which writes a field and then counts
    with SQL'
  shallow: false
  mechanism: A routing allow-list keyed by question type; map-reduce is reachable only for what-said and what-surprised question
    types and its output is rendered with a 'reading, not a count' label
  example: '''How many players quit at the forge?'' is never answered by reading 487 transcripts; it is answered by SQL over
    the quit field or refused until backfilled. ''What did players say about the forge?'' may be answered by map-reduce with
    a ''reading of 487 transcripts, not a count'' label'
  cost: S
  depends_on: nothing
  part: query-path
  ingest_cost: S
  query_cost: L
  better_than_fixed_table: Not better; this option is the one the fixed table was built to avoid, and the refusal keeps that
    property
  refusal: true
  variants_of:
  - owner-20
