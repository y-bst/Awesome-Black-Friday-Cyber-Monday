  object: 'spec.md ''Unspecified'': ''how videos of one session are linked'' and no build version field is named'
  situation: A studio ships a forge-step fix in build 1.3 and asks 'did the fix work' with 412 players on 1.2 and 19 on 1.3
  consequence: '''Quit rate fell from 7.5% to 5.3%'' on 19 players is one player; stated as a result it leads to a shipped
    decision; the guard returns ''not yet: 19 players on 1.3, need 30'' and the question auto-re-runs when the threshold is
    met'
  p_typical: 0.08
  grounded: inferred
  evidence: spec.md lists linking of videos as unspecified; build version is not mentioned in spec.md or memo.md
  proposed: Guard checks in the planner; refusal message with the three numbers; a 'notify me when 1.3 reaches 30 players'
    button that creates a push rule
  shallow: false
  mechanism: Planner computes n per build and missing-build share before any comparison; failure returns a typed refusal;
    a watcher row re-runs the plan at each ingestion batch and pushes the comparison when all guards pass
  example: '''Did the 1.3 forge fix work?'' Chat: ''Not yet comparable: 412 players on 1.2, 19 on 1.3 (minimum 30). I will
    post the comparison when 1.3 reaches 30 players.'' Six days later: ''Build 1.3 (n=34): forge quit 2 of 34 (5.9%, CI 1.6-19%)
    vs 1.2: 31 of 412 (7.5%). Difference not distinguishable from zero at this n.'''
