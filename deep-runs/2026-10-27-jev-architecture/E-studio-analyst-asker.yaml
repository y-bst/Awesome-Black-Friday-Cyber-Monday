  object: "spec.md Constraints: 'Buyers are gaming studios. Their questions are not known in advance.'; memo.md item 3 'coverage of real studio questions'"
  situation: "Day 0 for a new game; the analyst already has a list of questions from the last playtest report (step completion, stall points, first purchase, crash count) that nobody at JEV has asked for"
  consequence: "Ontology-generated questions are judged against 30 real ones from day 0 instead of after the first cohort; the analyst's first chatbot session returns answers to questions they wrote themselves"
  p_typical: 0.30
  grounded: quote
  evidence: "memo.md: 'judged by two tests: coverage of real studio questions and accuracy against hand-labelled sessions'"
  proposed: "A 45-minute onboarding form: question text, answer_type enum {count, pct, list, clip, quote, duration}, denominator (players / sessions / players-who-reached-step), priority 1-3"
  shallow: false
  mechanism: "Question-generation stage takes the 30 seed rows as required coverage; each seed must map to at least one generated field or is flagged 'uncovered' on the onboarding report"
  example: "Seed Q7 'what % of players quit before the first combat' maps to field tutorial.step_reached (closed enum) with denominator = all players; Q19 'show me players confused by the crafting UI' maps to an open field friction.crafting_quote needing a clip"
  cost: S
  depends_on: "nothing"
  part: question-generation
  ingest_cost: S
  query_cost: S
  better_than_fixed_table: "The fixed table was written by JEV per game target; this starts from the buyer's own question list and measures coverage against it"

- id: analyst-2
  title: "Per-player step-funnel table (player_id, step_id, reached_at, completed_at, quit_here bool, attempts int) built at ingestion so 'what % reached step N' is a GROUP BY under 2 s"
  level: L4
  cell: {part: store, representation: step-funnel-state-machine-per-player, granularity: tutorial-step, query-path: sql-over-closed-fields, question-type: how-many, latency-tier: under-2s, scope: all-players, evidence-form: count-with-denominator}
  object: "spec.md item 3: 'The targets are mostly detecting churn in the tutorial and just after it. The answers form a structured table per video.'"
  situation: "Analyst asks 'how many of the 500 players reached the boss fight at step 8 and how many quit at step 3?' and the per-video table has no per-step row, only per-video MCQ answers"
  consequence: "Funnel questions return a table of 8 rows with reached / completed / quit counts and the denominator 500 in one query; today the chatbot has to reconcile multiple per-video answers per player"
  p_typical: 0.35
  grounded: quote
  evidence: "spec.md: 'a question over, say, 500 players is fast. Reading 500 transcripts per question was too slow'"
  proposed: "Table step_state(player_id, session_id, step_id, reached_at_ms, completed_at_ms, quit_here, attempts, evidence_video_id, evidence_offset_ms)"
  shallow: false
  mechanism: "Ingestion runs a step detector over frames plus transcript across all videos of the session, emitting one state-transition row per (player, step); the step list comes from the game's tutorial step vocabulary (analyst-16)"
  example: "500 players: step 3 reached 471, completed 362, quit_here 94 (20.0% of reached); analyst pastes the 8-row funnel into the Monday deck"
  cost: M
  depends_on: "tutorial step vocabulary per game; session stitching so a step that spans video 2 and 3 is one row"
  part: store
  ingest_cost: M
  query_cost: S
  better_than_fixed_table: "One row per player per step instead of one MCQ answer per video, so funnel maths has a correct denominator"

