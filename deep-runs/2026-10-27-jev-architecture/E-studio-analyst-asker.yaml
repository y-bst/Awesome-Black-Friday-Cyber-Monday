  level: L4
  cell: {part: chatbot-ui, evidence-form: coverage-statement-n-of-m-players, uncertainty-policy: answer-with-ci-and-n, question-type: how-many, user-segment: studio-analyst, delivery-surface: chatbot, mechanism-type: narrow-or-clarify-the-question}
