  level: L4
  cell: {part: query-path, uncertainty-policy: abstain-below-coverage, query-path: lazy-backfill-extraction, schema-evolution: lazy-backfill-on-demand, latency-tier: minutes, delivery-surface: slack-jira-integration, user-segment: studio-analyst}
  object: "memo.md item 2: 'genuinely new questions trigger a one-time batch extraction over all sessions whose result is cached as a new field'"
  situation: "A field added last week covers 212 of 500 players; analyst asks a question that needs it for all 500"
  consequence: "Analyst sees 'coverage 42%, backfill?' instead of a number computed on a biased recent subset; the backfill result arrives in Slack 35 minutes later"
  p_typical: 0.08
  grounded: quote
  evidence: "memo.md: 'one-time batch extraction over all sessions whose result is cached as a new field'"
  proposed: "Coverage threshold 80% configurable per studio; backfill job with ETA = sessions x median extraction seconds; Slack message with the answer link"
  shallow: false
  mechanism: "Planner checks field coverage over the cohort before aggregating; below threshold it returns an abstain card with a backfill action instead of the aggregate"
  example: "'Used dodge in tutorial?' coverage 212/500 → abstain → backfill queued → 35 min later: '38% (190/500)'"
  cost: S
  depends_on: "per-field coverage tracking (analyst-3); backfill job runner (memo.md item 2)"
  part: query-path
  ingest_cost: L
  query_cost: M
  better_than_fixed_table: "The fixed table silently has 100% coverage of few fields; this makes growing fields safe to query"

