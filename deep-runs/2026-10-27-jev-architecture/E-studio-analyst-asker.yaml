  consequence: "Answer reads '41% (87 of 212 players with field; 288 of 500 not yet extracted)' instead of '41%'; the analyst does not put a number from 212 players into a 500-player claim"
  p_typical: 0.15
  grounded: inferred
  evidence: "memo.md: 'result is cached as a new field, so the question set grows from real use' (implies fields with partial coverage of history)"
  proposed: "Answer footer template: 'count / denominator (pct) | field coverage n/m | extracted by schema vX on date'"
  shallow: false
  mechanism: "Query planner computes coverage = rows with non-null field over rows in the cohort for every aggregate and injects it into the response template; the chatbot cannot emit a percentage without it"
  example: "'Stalled >60 s at step 3: 94 of 471 who reached step 3 (20.0%); step field coverage 500/500'"
  cost: S
  depends_on: "per-field extraction coverage tracked in the store (schema version and extracted_at per row)"
  part: chatbot-ui
  ingest_cost: S
  query_cost: S
  better_than_fixed_table: "The fixed table has no coverage concept because every video gets every question; growing fields need one"

