- name: mechanism-type
  question: The C-axes contract for ideate requires a mechanism-type axis, and it is absent. Without it every option is "where
    in the pipeline". Cells like push-instead-of-pull (alert the studio about anomalies nobody asked about) or auto-discover-without-question
    (contrast churners with retainers automatically) never get generated, and those are the most direct answers to "unknown
    questions".
  values:
  - precompute-more
  - defer-to-query-time
  - reuse-or-cache-prior-work
  - approximate-then-refine
  - narrow-or-clarify-the-question
  - push-instead-of-pull
  - transfer-across-games
  - change-data-at-source
  - human-in-the-loop
  - auto-discover-without-question
  added_by: stage-D
- name: user-segment
  question: 'Required by the ideate contract. The grid assumes one generic asker. Option value differs sharply by segment:
    a producer wants a ranked issue list, a data engineer wants a schema contract, an indie wants zero config.'
  values:
  - studio-analyst
  - game-designer
  - ux-researcher
  - producer-exec
  - studio-data-engineer
  - live-ops-community
  - publisher-portfolio
  - platform-devrel
  - indie-solo-dev
  - jev-internal-ops
  added_by: stage-D
- name: moment-in-journey
  question: Required by the ideate contract. Question generation at day 0 (no data, no usage log) is a different problem from
    steady state (usage log exists, prior answers cacheable). The grid has extraction-trigger, but not the studio-side journey
    that decides which lever is even available.
  values:
  - game-onboarding-day-0
  - first-cohort-ingested
  - first-studio-question
  - steady-state-weekly
  - new-build-version
  - pre-launch-greenlight
  - live-ops-update
  - renewal-review
  added_by: stage-D
- name: delivery-surface
  question: Required by the ideate contract (channel/surface). "chatbot-ui" is a single part value. Several of the cheapest
    ways to make answers fast are to precompute a standard report or push a digest so the question is never typed.
  values:
  - chatbot
  - dashboard-standard-report
  - warehouse-share-or-export
  - api-sdk
  - notebook
  - slack-jira-integration
  - scheduled-digest
  - clip-reel
  - alert
  added_by: stage-D
- name: subject-domain
  question: The leaf test forces a tutorial-churn worked example, and granularity has "tutorial-step". Together they bias
    the whole run toward tutorials, although the frame says sessions are hours long. Representations that work for linear
    tutorials (step funnels) fail for open-ended mid-game play, economy, or multiplayer.
  values:
  - onboarding-tutorial
  - core-loop
  - progression-difficulty
  - economy-monetization
  - social-multiplayer
  - narrative
  - ui-navigation
  - technical-bugs-performance
  - accessibility
  - player-affect
  added_by: stage-D
- name: tenancy-and-deployment
  question: 'This decides which representations are allowed at all: a cross-game learned schema or shared semantic cache is
    impossible under strict isolation. The security and publisher perspectives pull in opposite directions on it.'
  values:
  - shared-multi-tenant
  - logically-isolated-per-studio
  - single-tenant
  - studio-vpc-or-on-prem
  - export-only-no-hosting
  - federated-query-into-studio-warehouse
  added_by: stage-D
- name: reuse-scope-of-extraction
  question: This is the main lever conversation-analytics and clinical CDM vendors use to make onboarding cheap. question-origin
    says where questions come from, but not how far an extraction investment transfers.
  values:
  - game-specific
  - genre-shared
  - universal-primitives
  - customer-defined-on-top-of-universal
  added_by: stage-D
- name: schema-evolution
  question: Unknown questions guarantee that new fields arrive continuously. How old sessions get the new field, and what
    happens to answers computed under the old schema or model, is a design space in its own right. Today it is only half-covered
    by extraction-trigger.
  values:
  - frozen-schema
  - append-only-versioned-fields
  - schema-on-read
  - eager-backfill-all-history
  - lazy-backfill-on-demand
  - deprecate-and-migrate
  - model-upgrade-reextract
  added_by: stage-D
- name: uncertainty-policy
  question: evidence-form says what is shown, not what the system does when it does not know. The ask-your-data-veteran's
    "trust collapse after one wrong number" calls for this as a lever, not a display choice.
  values:
  - always-answer
  - answer-with-ci-and-n
  - abstain-below-coverage
  - ask-clarifying-question
  - give-range-then-refine
  - escalate-to-human-analyst
  added_by: stage-D
- name: build-or-buy
  question: Effort S/M/L hides that several cells (inverted index, OLAP, clip embeddings, conversation trackers) are already
    available off the shelf. The owner's build/prototype/drop decision needs this.
  values:
  - build-in-house
  - open-source-component
  - managed-cloud-service
  - third-party-video-understanding-api
  - studio-owned-stack
  added_by: stage-D
