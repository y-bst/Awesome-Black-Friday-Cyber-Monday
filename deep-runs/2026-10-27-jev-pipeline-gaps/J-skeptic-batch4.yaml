- "id": "privacy-1"
  "case": "Defer: this is a compliance chore, not a pipeline gap that has to be fixed before onboarding. The spec never mentions a 'precomputed cohort count' or any cached aggregate; it says the chatbot 'answers the studio's questions from that table', so the aggregate half of this leaf is invented, and a count that is computed live from the table drops the player as soon as the rows go. The answer rows are 'a structured table per video', so they are almost certainly keyed by video id, and a foreign key with ON DELETE CASCADE (or one DELETE ... WHERE video_id IN (...) in the existing deletion script) removes them in the same step that deletes the video and transcript. That is an hour of work and can be added when the first withdrawal arrives. Withdrawals from paid, recruited playtests are rare, and none has been reported. A full deletion manifest with receipts across 'every extraction-run-id' is a reasonable later hardening task. The honest weakness of this case is that once a withdrawal does happen, keeping derived data about that player is a legal exposure no matter how rare it is, so the minimum cascade rule should be written down even if the manifest waits."
- "id": "fillA-21"
  "case": "Defer: this leaf fixes a metric inside a measurement step that the leaf itself says does not exist ('No transcript-quality-measurement step ... exists'), so it is a second-order refinement of work nobody has started. The '30% of sampled videos' figure has no source in the spec, which only says 'Each video is converted to a transcript'. Invented text on silence is a well-known ASR failure, and the usual defaults handle it upstream: voice-activity detection before decoding, or dropping segments with a high no-speech probability. That removes the inserted text instead of just counting it. Once the team builds a reference-transcript QA step, adding an 'insertions per non-speech minute' column is one line in the scoring script. The spec also says 'Ingestion time and cost are not a concern', so if transcripts turn out to be polluted, every video can be re-transcribed and re-answered cheaply later. The fix does not have to land before the next studio relies on answers; it is cheap to do afterwards."
- "id": "fillB-3"
  "case": "Defer, or merge into the general 'state the interpretation and filters applied' rule (see fillB-1), because this is one instance of that rule and not a separate gap. The 120 returning players are a made-up scenario: the spec says the targets are 'mostly detecting churn in the tutorial', and tutorial playtests normally recruit players who are new to the game, so for the main use case the cohort is new by construction and the dropped qualifier changes nothing. Where returning players do exist, the real gap is missing player metadata (no first-session or build field), and the chatbot cannot fix that by wording its reply. Telling an LLM to 'list any qualifier you could not map to a column' is one line in the prompt and can be added whenever echoing filters is designed. Building a dedicated rule for the word 'new' ahead of that general fix is narrow work with little payoff."
- "id": "fillB-12"
  "case": "Weak case for deferral, stated honestly. The specific failure depends on a schema the spec does not describe: the leaf's own evidence is that 'current question count and answer types' are unspecified, and a sensible engineer would store 'not processed' as a missing row or NULL rather than the code '-1', and 'not reached' as a named option. Whether the chatbot writes SQL at all is an assumption in the frame ('the answers table (or a query over it)'). If it does, the fix is a cheap view (answers_valid) or a few prompt lines listing the missing-value codes, and it can be added at any time without re-ingesting anything. That said, if sentinel codes do exist, the result is a quietly wrong headline rate (15.5% against 20%) that nobody would notice, and the fix costs almost nothing. I cannot make a strong case to defer it beyond 'check the schema first'."
- "id": "stitch-8"
  "case": "Defer: the leaf overstates the effect, and the fix belongs to the session-stitching work the owner already lists under 'Long multi-video sessions'. Do the arithmetic for a 4-minute stall that starts at a uniformly random time. It is lost only when the boundary splits it into two parts that are each 3 minutes or less, which means a start time inside a 2-minute window per 15-minute video: about 13%, not 'about 1 stall in 5'. Stalls longer than 6 minutes always exceed 3 minutes in at least one video, so the bias only affects stalls of 3 to 6 minutes. Most tutorials, which are the main target, fall in the first 15-minute video, before any boundary. An LLM estimating 'more than 3 minutes' from think-aloud speech is already off by a minute or more, so the boundary error is within the question's own noise. The spec also says 'Ingestion time and cost are not a concern', so once stitching exists (overlapping windows, or session-level duration fields), every stored transcript can be re-run cheaply. That makes this cheap to fix later instead of urgent now."
