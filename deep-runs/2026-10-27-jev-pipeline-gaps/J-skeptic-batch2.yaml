- "id": "l10n-3"
  "case": "This leaf is graded speculative with no evidence at all: the spec never names an ASR vendor, and the common defaults (Whisper, Google Speech-to-Text, AWS Transcribe, Deepgram) do not mask profanity unless asked to, so whether the problem exists at all is a one-minute config check, not a design gap. Its central claim, that the masking is 'invisible in the stored transcript', is wrong for the masking variant it quotes: 'what the **** am I supposed to do here' carries visible asterisks, and an LLM extractor reading a question-shaped sentence with a masked expletive in the middle of a tutorial will very likely still answer 'frustrated'. Profanity is also rarely the only frustration signal in a 15-minute think-aloud; the same player usually sighs, repeats, asks 'what do I do' or quits, all of which survive masking, so the claimed undercount 'by every swearing player' overstates the effect. The fix is cheap whenever it is done: flip one ASR flag, and because the spec says ingestion time and cost are not a concern, any affected videos can simply be re-transcribed and re-extracted later. It belongs in an ASR-config checklist item for the next onboarding, not on a must-fix-now list ahead of gaps that are certain to occur."
- "id": "eval-13"
  "case": "The spec describes no benchmark or eval suite at all, so this leaf asks the team to change the composition of a test set that does not yet exist; it is a design note for when one is built, not a gap in the running pipeline. The underlying failure, silent substitution of the nearest fixed question, is already carried by chat-3 and fillB-2 in this same top 25, and the fix there (the planner says 'not covered by the question set' and prints the matched question text) removes the harm directly; an eval that measures the false-answer rate only tells you how often that harm happens. Building unanswerable test items is cheap and can be added on the day an eval harness is written, with no loss of data or rework in the meantime, since nothing about the answers table changes. The 20% share is arbitrary and the right ratio depends on what studios actually ask, which the spec says is not yet known, so fixing it now risks tuning to a guessed distribution. Defer it as a sub-item of the chat-3 fix rather than ranking it as an independent must-fix."
- "id": "speech-1"
  "case": "A 0-word transcript is the edge case of a think-aloud study, not the norm: the pipeline exists because players narrate, sessions are recorded for that purpose, and per the frame assumptions the transcript also contains game audio, so truly empty transcripts should be rare and easy to spot. For many of the fixed questions 'No' is arguably the correct literal answer ('Did the player express confusion?' -- they did not express it), and an LLM given an empty transcript with an 'Other' or 'cannot tell' option will often pick it unprompted, so the claimed systematic undercount is an inference with no observed case behind it. The remedy is cheap to apply later: word count can be computed from stored transcripts at any time, and because the spec says ingestion cost is not a concern, extraction for low-speech videos can be re-run with answer=NULL in a single backfill without losing anything now. It also duplicates analyst-24, which is the same root cause seen from the per-player side, so it should be merged and handled with one abstain rule rather than counted as two urgent items. Accept as-is for now with a known caveat in onboarding notes, and fold the NULL-state rule into the next schema change."
- "id": "chat-1"
  "case": "I cannot make a strong case against this one. The best available argument is that the spec says only 'a structured table per video' and does not say the chatbot writes raw SQL against it; if the chatbot is given a session- or player-level view, or the table already carries player_id and the planner prompt says 'count players', the double-counting never happens, and a single DISTINCT view is a one-line fix that can ship at any time without re-ingestion. But the error it describes is likely, large (off by the videos-per-session factor), and invisible in a reply that just says '4%', so deferring it is hard to justify."
- "id": "analyst-24"
  "case": "This is the same root cause as speech-1 (near-empty transcripts are still forced into an answer) and should be merged into it rather than ranked as a separate must-fix; one rule, abstain or flag below a word-count threshold, covers both. The scenario it uses, an analyst asking 'Why did player 301 quit?', is a single-player lookup, while the spec states the table exists for fast questions 'over, say, 500 players', where one low-evidence row barely moves a cohort percentage. A player saying 4 words in 15 minutes of a think-aloud session is rare, and an extractor 'confidence' field is poorly calibrated in practice, so storing it adds a column people will over-trust without making the answer more correct; the 50-word threshold is also arbitrary. Word count is derivable from the stored transcripts at any time and extraction can be re-run at no constraint cost, so the 'low evidence' prefix can be added later without losing data. Defer and merge with speech-1."
