- id: cost-30
  title: Diarisation added to stop moderator words being credited to the player increases transcription cost and delays ingest-to-queryable
  level: L3
  cell:
    stage: transcription
    data-element: utterance
    speech-shape: moderator-speaking-or-leading
    correctness-failure: moderator-words-attributed-to-player
    latency: ingest-to-queryable (hours or days after session)
  object: Step 2 'Each video is converted to a transcript'
  situation: Speaker separation on 8,000 videos adds a second pass per video; a typical diarisation pass runs in about 0.3x
    real time, so 15 minutes of audio costs about 4.5 more minutes.
  consequence: Per cohort that is about 600 extra compute hours; if skipped, the moderator's 'try the button on the left'
    is read by extraction as the player's behaviour. The trade is made nowhere because cost is declared irrelevant.
  p_typical: 0.03
  grounded: speculative
  evidence: none
  proposed: Decide per game whether sessions are moderated and enable diarisation only for those; record the flag on the session.
  shallow: false
  perspective: cost
  variants_of:
  - moderator-5
