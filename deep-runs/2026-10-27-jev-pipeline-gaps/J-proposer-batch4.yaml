- id: "privacy-1"
  case: "A consent withdrawal is the one request that cannot be deferred, and the spec gives engineers nothing to execute it against. Step 3 says only that 'The answers form a structured table per video', so when player 212 of 500 withdraws, the obvious actions (delete the video file and the transcript) leave the 6 answer rows for that player intact, plus any precomputed cohort count that included them. Those rows are exactly the derived data the studio chatbot reads, for example 'quit at tutorial step 3, frustrated', so the player stays queryable and counted after the team has told them and the studio that they were removed. The leaf's consequence line states it directly: the deletion is incomplete and the cohort count still includes the player. The failure is invisible to the engineers who ran the deletion, because nothing reports completion, and it compounds with every extraction run, since re-extraction under a new run-id adds more rows that no deletion job knows about. The exposure falls on the studio and on the vendor as data controller, and it grows with every onboarding, because each new cohort adds players who will eventually withdraw. The fix (a per-player manifest covering video, transcript, answer rows across all run-ids, cached aggregates with a stated recompute window, and a completion receipt) is cheap (cost_to_address 2) and has to exist before the table holds more data, since retrofitting keys onto rows that already exist is the expensive path."
- id: "fillA-21"
  case: "The pipeline's trust in everything downstream rests on step 2, 'Each video is converted to a transcript', yet no measurement step exists that could show whether the transcript invents text, and the standard metric is structurally blind to the worst case. WER divides by reference word count, so on a reference with 0 words (a silent or music-only minute) it is undefined, and the sample either drops those minutes or scores 0/0. About 30% of sampled videos contain such minutes, so the exclusion removes the exact condition under which speech recognisers emit 'Thanks for watching'-style hallucinations. Silent players are not an edge case in a think-aloud study: they are the players who are stuck, confused or about to churn, which is the tutorial-churn target the fixed questions exist for. Those invented words then flow into step 3, where an LLM answers the multiple-choice questions with confident options for a player who said nothing, and into the table the studio chatbot aggregates over hundreds of players. Because the headline WER number looks healthy, no one has a reason to look, so the defect is both likely (occurrence 4) and undetectable by the current metric (detectability 5). The fix is a separate insertions-per-silent-minute metric with a threshold (for example under 1 word per 10 minutes), which is cheap to add (cost_to_address 2) and must exist before studios rely on answers derived from silent stretches."
- id: "fillB-3"
  case: "This is a silent wrong answer on the most natural question a studio will ask, and the spec leaves it unhandled: 'Buyers are gaming studios. Their questions are not known in advance.' 'How many new players quit the tutorial?' has at least three readings (first session ever, first session on this build, genre-new from the screener), and no column encodes any of them. In the leaf's scenario, 120 of the 500 players are returning from an earlier build's playtest, so the planner drops the qualifier and answers over all 500 without saying the filter was ignored. Returning players already know the tutorial, so including them lowers the quit rate the studio believes is a first-time rate, and the studio may conclude the tutorial works better than it does. The reply never echoes the filter set it applied, so the studio cannot see the dropped word, and nobody on the JEV side sees it either. Severity is high because the decision (rework the onboarding or not) is exactly what the product is bought for, and detectability is 5 because nothing in the output signals the error. The fix is cheap: when any filter word maps to no column, the reply opens with a line such as 'Could not apply: new players (no first-session field)' and gives the unfiltered count only after it. This should ship before more studios rely on chatbot answers, since every studio uses qualifiers like 'new', 'returning', 'mobile' or 'paying' and each one is a potential silent drop."
- id: "fillB-12"
  case: "The chatbot's headline numbers are computed by generated SQL, and the spec leaves the table's semantics undefined: 'current question count and answer types' is explicitly listed as unspecified. The leaf's scenario shows what that costs. The answers table encodes 'not processed', 'not observed' and 'not applicable' as sentinel option ids ('-1', 'NA', 'X'), so the planner's COUNT(*) FILTER (WHERE option_id='B') * 1.0 / COUNT(*) over 4,000 rows includes 900 rows that are not answers. The studio sees 620/4,000 = 15.5% instead of 620/3,100 = 20%, a 4.5-point understatement from a single missing exclusion. Nothing in the schema says '-1' and 'NA' must be excluded, so each generated query decides on its own, and two phrasings of one question can return different rates, which destroys the credibility of the table the whole architecture depends on. The number looks plausible, so no one is prompted to check it (detectability 5), and the error recurs on every rate query across every question. The fix is a machine-readable dictionary per column, with allowed values, which codes mean missing and why, and a default denominator filter injected into the planner prompt. It is cheap (cost_to_address 2) and must land before more studios build decisions on percentages from this table."
- id: "stitch-8"
  case: "This gap is grounded directly in two spec sentences that together guarantee it: 'A session can be n hours; each video is capped at 15 minutes, so one session is many videos' and 'The answers form a structured table per video.' A duration question such as 'stuck more than 3 minutes?' is answered once per video, so a stall that straddles a boundary is split. In the leaf's example, a 4-minute stall on tutorial step 3 puts 1 minute at the end of video 2 and 3 minutes at the start of video 3, and both videos answer 'No' to a >3 minute threshold. The player who struggled most is therefore recorded as never having been stuck, and 'how many players got stuck >3 min at step 3' undercounts every such player. Under uniform timing, a 4-minute stall crosses a 15-minute mark about 27% of the time, and in roughly half of those cases both fragments fall under 3 minutes; the leaf's own estimate is about 1 in 5. The bias also grows with longer thresholds and hours-long sessions, because more stalls span cuts. The undercount lands on the highest-value signal for the studio, the players stuck long enough to churn, and no query can repair it afterwards, since the per-video rows carry no state that links adjacent videos. The fix (answer duration questions at session level from per-video start/end-of-state fields, or extract over a window spanning adjacent videos) changes the schema, so it must be settled before the table grows further, while re-extraction is still affordable (ingestion cost is explicitly not a concern)."
