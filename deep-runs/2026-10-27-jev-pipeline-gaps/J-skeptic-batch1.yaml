- id: "fillB-1"
  case: "The 112 / 31 / 64 split and the 22% vs 13% swing are the author's invented illustration; the spec contains no churn definition, no question count and no statement that three competing churn readings exist, and it says only that targets are 'mostly detecting churn in the tutorial and just after it', which suggests one churn question (or a small family) written per game target by the team, so the ambiguity may not exist in the stored set at all. Where it does exist, the framing is a product-owner decision about what a studio chatbot is, not a pipeline defect: churn definitions are agreed with each studio at onboarding because the questions are 'written per game target', so the studio already knows what the churn question means. A 'Computed as:' line is a prompt or template tweak that can be added in an afternoon after the first real studio complaint, with no data migration, because it reads existing question text and ids and does not touch ingestion; deferring it loses nothing. The proposed clarifying-question step has its own cost: it slows an answer path whose stated constraint is that 'answering a studio's question must be fast', and it risks annoying analysts who asked a plain question. Ambiguity of natural-language metrics is also ordinary in every analytics chatbot and is normally handled by a short definition note, not by blocking replies. The real fix (print the definition) is cheap, reversible and rides on chat-3 and fillB-2, so it should be bundled there rather than treated as a separate must-fix-now item. Recommendation: defer, folded into the general 'state the question used' reply template."
- id: "fillB-2"
  case: "This is the same mechanism as fillB-1 and chat-3 with a different example: the chatbot maps a studio word ('stuck') to a stored question and does not show the question wording. The specific scenario (designer means 3+ retries, store has a 3-minute stall question, a 2-minute stall with 5 retries is missed) rests on an invented question and an invented studio intent; the spec gives no question list, and a transcript of think-aloud speech with no telemetry could not measure retries in the first place, so a retry-based count would not exist to be 'double' (the consequence's 'if it existed' concedes this). Any fix that prints the matched question text under every count is the same one-line template change as fillB-1, and once it exists, a designer who sees 'no progress for more than 3 minutes' can judge the fit themselves, which is the whole remedy. Treating it as a separate item to fix now double-counts one gap three ways (fillB-1, fillB-2, chat-3) and inflates its priority. The honest case is not that the problem is unreal but that it is one cheap, late-bindable template rule, not an independent blocker. Recommendation: defer or merge into chat-3; the evidence quoted ('Their questions are not known in advance') supports the general risk but not this particular threshold story."
- id: "chat-3"
  case: "I cannot call this unreal: silently answering 'camera complaints' with control-frustration data is a plausible failure for an LLM planner, the spec says questions are 'not known in advance' and the question set is 'small', and the leaf is marked as a direct quote with four independent perspectives agreeing. The strongest honest case for deferral is narrower. The 0.85 similarity threshold is a made-up number, the 112 / 22% figures are illustrative, and the spec says the chatbot is 'an LLM given the answers table (or a query over it)'; a modern LLM given the table's column names and question wording will often itself say 'we track control frustration, not camera complaints', so occurrence may be lower than the author assumes and the real rate is measurable only by testing the actual bot. The fix is mostly prompt and reply-template work (cite the question ids used, say 'not tracked' when no question matches) plus eval cases, none of which needs re-ingestion or schema change, so it can be added after a short pilot without losing data. It overlaps with eval-13, which tests the same behaviour. If the team does only one reply-honesty fix before more studios rely on answers, this is the one, but it is a days-sized prompt change, not a pipeline redesign. Recommendation: weak defer at best; if forced, accept the risk only for a first pilot with a stated limitation."
- id: "fillB-5"
  case: "The scenario assumes the only churn question 'covers tutorial plus the first 10 minutes after it'; the '10 minutes', the 112 / 71 / 41 split and the 'first-mission screen no one opens' are all invented, and the spec only says targets detect churn 'in the tutorial and just after it', which describes the research goal of a studio engagement (the window of interest), not necessarily the wording of a single pooled question. If the pooled question exists it was written that way on purpose by the question author for that game target, because 'tutorial and just after it' is exactly what the studio commissioned; a studio that asked for that window and gets that window is not being misled. Where a finer split is wanted, adding a second question is a normal question-set change, and the spec's own framing (ingestion cost is not a concern) means old videos can be re-run over the transcript later to backfill it, so deferring loses no data. The reply-disclosure half ('includes the period just after the tutorial') is the same template rule as fillB-1 and fillB-2. This is therefore a question-authoring choice per engagement, not a pipeline gap, and it is arguably the same defect as fillB-1 (what does churn mean) seen from the other side. Recommendation: reject as a separate gap or defer; fold the disclosure into the shared reply template."
- id: "stitch-9"
  case: "This is the hardest of the five to dismiss, and I will say so: if each video is answered independently, 'completed tutorial' will plausibly be No in later videos because the event is absent from their transcripts, and the spec says only that 'the answers form a structured table per video' with 'how videos of one session are linked' unspecified. The case for deferral is limited to timing and cost. First, the 20% vs 80% swing is an assertion with no measured basis; the number depends on session length, on how often later videos mention the tutorial, and on how the chatbot aggregates, and the spec names none of these. Second, the fix is a registry field per question (any / all / first / last / sum / max) plus an extra 'did not occur' answer option, which is a metadata and prompt change that can be applied by re-running extraction over stored transcripts, which the spec says is cheap ('ingestion time and cost are not a concern'), so deferral is reversible and no data is lost. Third, the target is mostly the tutorial and just after it, which often fits within the first one or two 15-minute videos, so for much of the early use the multi-video rollup problem is small, and a pilot restricted to first-video questions would sidestep it. Fourth, it overlaps with speech-1 and other 'absent vs No' leaves, so a single 'unknown / not in this video' answer option may close several gaps at once. Recommendation: this one reasonably stays a keep for any cohort question over multi-video sessions; I can argue only for sequencing it right after the reply-honesty template work, not for dropping it."
