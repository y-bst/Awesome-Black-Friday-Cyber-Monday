- id: speech-1
  title: "Silent player: empty transcript flows into extraction and every 'did the player say/do X' question is answered 'No' instead of 'unknown'"
  level: L4
  cell: {"stage": "transcription", "speech-shape": "silent-player", "processing-status": "transcript-empty", "correctness-failure": "null-treated-as-no"}
  object: "Step 3 'The transcript is run through a fixed set of questions with options' applied to a 15-minute video whose transcript is 0 words"
  situation: "A player who does not think aloud produces a 0-word transcript; the fixed questions (e.g. 'Did the player express confusion at tutorial step 2?') are still run once per video"
  consequence: "The answers table holds 'No' / 'Other' for that video; the cohort count 'how many players were confused' undercounts silent players and the studio reads silence as satisfaction"
  p_typical: 0.30
  grounded: inferred
  evidence: "The transcript is run through a fixed set of questions with options, written per game target."
  proposed: "Skip extraction when word count < N and write answer=NULL with reason=no_speech; the chatbot reports the denominator of players with speech"
  shallow: false
