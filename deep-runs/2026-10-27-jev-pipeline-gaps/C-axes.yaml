axes:
  - name: stage
    values: [video-capture, 15-minute-split, session-stitching, transcription, fixed-question-set, answer-options, per-video-answers, session-level-aggregation, answers-table, chatbot-query-planning, chatbot-answer, evidence-display, studio-ui]
  - name: data-element
    values: [session, video, transcript, utterance, timestamp, question, option, answer, player, cohort, game-version, game-target, tutorial-step, screen-state]
  - name: session-shape
    values: [one-video, 2-4-videos, 5-20-videos, missing-middle-video, videos-out-of-order, overlapping-videos, session-ends-mid-sentence]
  - name: speech-shape
    values: [silent-player, continuous-think-aloud, game-audio-dominates, two-speakers, non-english, mixed-language, profanity-or-slang, inaudible-segments]
  - name: question-shape
    values: [fits-an-option, fits-no-option, fits-two-options, answer-spans-videos, answer-is-a-count, answer-is-a-time, answer-is-a-why, answer-needs-visuals, question-not-in-set]
  - name: studio-question-type
    values: [one-player-what-happened, cohort-count, cohort-why, compare-two-versions, compare-two-steps, find-players-who, timeline-of-one-player, quote-me-evidence, follow-up-question, question-outside-game-target]
  - name: scale
    values: [1-player, 50-players, 500-players, 5000-players, 10-games-at-once]
  - name: correctness-failure
    values: [hallucinated-answer, forced-choice-bias, inconsistent-across-videos, stale-after-prompt-change, wrong-denominator, right-answer-wrong-player, confident-no-evidence]
  - name: time-and-change
    values: [first-game-onboarded, game-update-changes-tutorial, question-set-revised, model-upgraded, a-year-of-data, studio-asks-at-3am]
  - name: latency
    values: [under-2s, under-30s, minutes, batch-overnight]
example_cells:
