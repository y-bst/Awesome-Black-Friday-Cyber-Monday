    stage: recruitment-and-consent
    data-element: consent-record
    speech-shape: continuous-think-aloud
    scale: 5000-players
    tenancy: many-studios-shared-infra
  object: consent-record (not mentioned anywhere in the pipeline description)
  situation: A player says 'my mom said I can play till 8' in video 2; the session carries no age, no guardian consent, and is included in a 5000-player cohort.
  consequence: Data from an under-16 player enters a third-party studio's chatbot with no parental consent on file; the extraction questions treat it as ordinary speech.
  p_typical: 0.12
  grounded: speculative
  evidence: none
  proposed: Store age band and guardian-consent flag per player; exclude sessions without them from cohort queries and flag speech cues ('my mom') for review.
