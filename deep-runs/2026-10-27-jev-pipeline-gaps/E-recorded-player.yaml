  level: L3
  cell:
    stage: session-stitching
    session-shape: session-split-by-crash-into-two
    data-element: session
    time-and-change: player-deletion-request
    recovery-action: delete-and-propagate
  object: two sessions that belong to one player
  situation: A crash at hour 1 restarts capture; the restart gets a new session id and a new player id; deletion for the original id covers 4 of 9 videos.
  consequence: 5 videos stay linked to a different id and are still queryable and quotable.
  p_typical: 0.04
  grounded: inferred
  evidence: how videos of one session are linked
  proposed: Link sessions by consent id (not session id) and apply deletion on the consent id.
  shallow: false
- id: player-33
  title: Deleted player's rows remain in the LLM context cache so the chatbot still answers from them
  level: L3
  cell:
    stage: chatbot-query-planning
    fast-path-dependency: table-fits-in-llm-context
    latency: fast-but-stale
    time-and-change: player-deletion-request
    chatbot-response-behaviour: differs-on-re-ask
  object: table pasted into the chatbot context
  situation: The table (300 players) is pasted into a prompt cached for 24 hours; player 212 is deleted at 09:00; at 11:00 the chatbot still lists their answers.
  consequence: The studio sees a deleted player's data for up to 24 hours; re-asking after the cache expires gives a different answer with no explanation.
  p_typical: 0.05
  grounded: speculative
  evidence: none
  proposed: Cache key includes a table version bumped on any deletion; the cache is flushed on deletion.
  shallow: false
- id: player-34
