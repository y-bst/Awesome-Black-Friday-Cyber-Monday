    chatbot-response-behaviour: answers-correctly
  object: chatbot answers for the studio
  situation: Player signed 'research use' only; the table row has no consent column; the studio analyst asks 'quote three players who hated the tutorial' and the chatbot returns 3 verbatim quotes with player ids.
  consequence: The player's words reach a commercial audience beyond the signed scope; the studio cannot tell which rows are quotable.
