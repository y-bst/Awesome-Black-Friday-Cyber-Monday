- id: player-1
  title: Deletion of player 212 removes answer rows but the cached cohort aggregate still counts that player
  level: L4
  cell:
    stage: retention-and-deletion
    data-element: cached-aggregate
    time-and-change: player-deletion-request
    recovery-action: delete-and-propagate
    fast-path-dependency: precomputed-aggregate-exists
    scale: 500-players
  object: precomputed cohort aggregate behind the chatbot's fast answer over 500 players
  situation: Player 212 of 500 requests deletion; their per-video answer rows are deleted, but the stored aggregate '38% quit at tutorial step 3' (190 of 500) was computed with their rows and is served unchanged.
  consequence: The deleted player still shapes every number the studio sees; the deletion is incomplete and cannot be shown to the player or a regulator. Aggregate and table disagree by 1 player until the next recompute.
  p_typical: 0.12
  grounded: inferred
  evidence: The answers form a structured table per video. / A chatbot for the gaming studio answers the studio's questions from that table
  proposed: Every cached aggregate records the player ids it used or is keyed to a table version; deletion invalidates every aggregate that listed that player and recomputes before the next read.
  shallow: false
- id: player-2
  title: 'Deletion request has no defined list of stores: video, transcript, answer rows, aggregate and chatbot conversation log'
  level: L3
  cell:
    stage: retention-and-deletion
    data-element: chatbot-conversation-log
    answer-afterlife: cited-after-player-deletion
    tenancy: many-studios-shared-infra
    time-and-change: player-deletion-request
  object: chatbot conversation log in the studio chatbot
  situation: Three weeks before the request an analyst asked 'quote players who quit at step 3'; the chat log holds the player's verbatim sentence. Deletion removes the video, the transcript and the 15-20 answer rows, not the log.
  consequence: The player's words stay readable in the studio's chat history and in any follow-up question that reuses that history; the deletion confirmation sent to the player is false.
  p_typical: 0.08
  grounded: inferred
  evidence: none
  proposed: 'Write a dependency inventory (5 stores: video, transcript, answer rows, aggregate, conversation log) and a deletion job that reports a per-store result.'
  shallow: false
- id: player-3
  title: A studio's CSV export of 500 players' answers cannot be recalled when one player deletes
  level: L3
  cell:
    stage: export-and-share
    data-element: answer
    answer-afterlife: exported-csv
    time-and-change: player-deletion-request
    tenancy: one-studio-one-game
  object: studio export of the answers table
  situation: The studio exported 500 rows to its own drive on day 10; player 212 asks for deletion on day 40.
  consequence: A copy of the player's answers (and any quote column) lives outside the pipeline with no way to find or delete it; the player was promised deletion.
  p_typical: 0.05
  grounded: speculative
  evidence: none
  proposed: Exports carry a pseudonymous id only, are logged per studio, and the studio contract obliges a deletion notice to be forwarded to every studio that exported that player.
  shallow: false
- id: player-4
  title: Backfill started before a deletion request writes new answer rows for the deleted player after deletion
  level: L4
  cell:
    stage: rerun-and-backfill
    processing-status: superseded-by-rerun
    recovery-action: backfill-after-model-upgrade
    time-and-change: player-deletion-request
    data-element: extraction-run-id
  object: backfill job snapshot of the player list
  situation: A model-upgrade backfill snapshots 500 player ids at 10:00; player 212 is deleted at 10:02; the job reaches that player's videos at 10:40 from a cached copy and writes 12 new answer rows.
  consequence: The player's data is resurrected after deletion; the table lists them as 'complete' and the next aggregate counts them again.
  p_typical: 0.04
  grounded: inferred
  evidence: none
  proposed: Backfill workers re-check a deletion list per video before writing, and a deleted-player tombstone blocks inserts for that player id.
  shallow: false
- id: player-5
  title: Raw video that failed transcription or arrived as a duplicate upload is invisible to a deletion keyed on answer rows
  level: L3
  cell:
    stage: retention-and-deletion
    processing-status: transcription-failed
    batch-failure-mix: one-video-of-session-failed
    session-shape: duplicate-upload
    data-element: video
  object: video object of a session with 8 videos where 1 failed
  situation: Video 5 of 8 failed transcription and has no transcript or answer rows; video 6 was uploaded twice under two video ids. A deletion that walks the answers table finds 6 of the 9 stored video files.
  consequence: 3 recordings of the player's voice remain in storage after the player was told everything was deleted.
  p_typical: 0.05
  grounded: inferred
  evidence: A session can be n hours; each video is capped at 15 minutes, so one session is many videos.
  proposed: Deletion walks storage by player and session id, not by answers-table rows; a nightly job lists video files with no matching live player.
  shallow: false
- id: player-6
  title: Player says full name, home address or school aloud and the verbatim transcript carries it into answers and quotes
  level: L3
  cell:
    stage: transcription
    speech-shape: continuous-think-aloud
    data-element: utterance
    studio-question-type: quote-me-evidence
    scale: 500-players
  object: transcript of a think-aloud video
  situation: In minute 4 of a video a player says 'I'm Jamal, I go to Lincoln High, my address is...'; the sentence is in the transcript passed to the question runner and is retrievable by 'quote me evidence'.
  consequence: A named, locatable person appears in a studio-facing answer; the studio sees personal data it never asked for and the pipeline has no scrub step.
  p_typical: 0.12
  grounded: inferred
  evidence: What a transcript contains (speech only, on-screen text, events)
  proposed: Run a PII detector on every transcript (names, addresses, school names, phone numbers) and redact before the transcript reaches the question runner and before any quote is stored.
  shallow: false
- id: player-7
