- id: player-9
  title: Player told the session lasts 30 minutes, capture continues for 3 hours and yields 12 videos
  level: L3
  cell:
    stage: video-capture
    data-element: consent-record
    session-shape: 10-plus-hour-session
    scale: 1-player-10-hour-session
    processing-status: queued
  object: session duration versus the 15-minute video cap
  situation: Consent text says 30 minutes (2 videos); recorder keeps running for 3 hours (12 videos); the player forgot it was on and had a phone call in hour 2.
  consequence: 10 videos exist outside what the player agreed to, are transcribed and extracted, and may hold private speech.
  p_typical: 0.06
  grounded: inferred
  evidence: A session can be n hours; each video is capped at 15 minutes, so one session is many videos.
  proposed: Capture has a hard stop at the consented duration plus a 10-minute grace, and a visible recording indicator; videos past the stop are quarantined, not queued.
  shallow: false
- id: player-10
  title: Spoken 'stop recording' is transcribed and extracted as a churn signal instead of a consent withdrawal
  level: L3
  cell:
    stage: per-video-answers
    speech-shape: continuous-think-aloud
    question-shape: fits-an-option
    session-shape: session-ends-mid-sentence
    processing-status: extracting
  object: per-video answer to the tutorial-churn question
  situation: At 41:20 the player says 'okay stop recording, I'm done'; video 3 ends there; the extractor picks the option 'player expressed wish to leave the game'.
  consequence: Withdrawal of consent is counted as tutorial churn in the cohort and the player's later videos (4 and 5) are still processed.
  p_typical: 0.04
  grounded: speculative
  evidence: none
  proposed: A withdrawal-phrase detector (stop recording, delete this) routes the session to a human before extraction and halts processing of later videos for that player.
  shallow: false
- id: player-11
  title: Non-native speaker's halting speech is read as confusion at the tutorial text
  level: L3
  cell:
    stage: per-video-answers
    speech-shape: inaudible-segments
    transcription-subsystem: low-confidence-segments-dropped-silently
    correctness-failure: forced-choice-bias
    question-shape: answer-is-a-why
  object: transcript with dropped low-confidence segments
  situation: A player speaking English as a second language pauses 3-5 seconds between words; the transcript drops 30% of segments; the extractor picks 'confused by instructions' for 6 of 8 videos.
  consequence: The 'confused by instructions' rate for Brazilian and Indian players looks 2x the US rate, the studio rewrites tutorial text, and the real cause (accent and recognition errors) is invisible.
  p_typical: 0.08
  grounded: inferred
  evidence: languages
  proposed: Store per-video transcript coverage (% of audio minutes transcribed) with each answer and bar answers on videos under 70% coverage from segment comparisons.
  shallow: false
- id: player-12
  title: Mixed-language speech is mis-detected as English and the model invents words that are quoted as the player's own
  level: L3
  cell:
    stage: language-detection
    speech-shape: mixed-language
    transcription-subsystem: wrong-language-detected
    correctness-failure: transcription-hallucination-propagated
    studio-question-type: quote-me-evidence
  object: transcript of a Portuguese-English video
  situation: A player switches between Portuguese and English; language is set to English for the 15-minute video; 40% of the transcript is phonetic nonsense or invented English.
  consequence: The chatbot quotes a sentence the player never said, attached to a player id.
  p_typical: 0.07
  grounded: inferred
  evidence: languages (listed under Unspecified)
  proposed: Detect language per segment, keep the original-language text beside any translation, and mark quotes from low-confidence segments as not quotable.
  shallow: false
