- id: "percep-29"
  case: "This is mostly a presentation problem for the chatbot answer, not a pipeline defect, and it is cheap to fix later. The pipeline stores a per-video answer table; the percentages in the example are a rendering choice made at query time, and a one-line caveat in the chatbot's system prompt ('percentages are over reasons observable from speech; visual causes are not captured') fixes it without touching ingestion or any stored data, so nothing is lost by deferring. The scenario also depends on the question set having no visual option and no 'other' bucket that absorbs unobservable causes, but the example itself already shows an 'other 4%' row and 'unclear 18%', which are exactly where unclassifiable cases land. The owner already names visual loss as a known problem, so the studio is told in onboarding that the transcript is speech-based; this leaf adds a second, narrower instance of a gap that is already acknowledged and that the real fix (adding a visual channel to capture) will remove at the source. Fixing the reply wording now, before that upstream change, risks building a caveat that becomes wrong or redundant once visual features exist. It is also near-duplicate of qauthor-18 and uxr-28, which cover the same missing-visual-cause root, so spending a separate fix on it double-counts. Occurrence is plausible but the harm requires a studio to infer absence of visibility problems from silence, which a competent studio researcher accustomed to think-aloud data will usually not do. Defer; bundle with the one-time chatbot prompt and caveat work."
- id: "uxr-5"
  case: "Narration decay is a well-known property of think-aloud studies and is not specific to this pipeline; studios that buy think-aloud data already expect it, and the effect sits in the source data, not in anything the pipeline does wrong. The claim is also mostly an inference: the evidence quote says only that sessions span many videos and says nothing about narration density, so the numbers (120 wpm falling to under 20) are illustrative, not observed. The remedy is cheap and entirely downstream: words-per-minute can be computed from the existing transcript at any time, after the fact, for all stored videos, because ingestion keeps the transcripts. Nothing is lost by deferring, and the flag can be added to the aggregation layer when someone first sees a suspicious trend. The primary targets are the tutorial and the window just after it, which fall mostly in the first one to four videos of a session, where narration is still dense, so the biggest distortion lands outside the window the owner cares about. Where the question asks something like 'did the player express frustration', the answer on a sparse video is legitimately 'no evidence', and a stricter fix of excluding low-wpm videos could itself bias the sample towards talkative players. Defer until a real cohort shows the trend; the threshold of 30 wpm is arbitrary and would need calibrating on real data anyway."
- id: "qauthor-18"
  case: "This is a question-authoring convention, and the proposed fix, an option such as 'cannot tell from audio', is a standard item in any well-written multiple-choice schema, so it is covered by a reasonable default and is trivially cheap to add per question when a question is written. It has no pipeline-level cost: the option can be added to any single question in minutes and the affected videos re-answered, since ingestion time and cost are explicitly not a concern in the spec. The scenario is also one specific example (a low-contrast arrow, 90 seconds of silence, then quitting) built to be misclassified; a competent LLM answering with an 'other' or 'cannot tell' option present will often choose it when the transcript contains 90 seconds of silence, and silence is itself a signal question authors can use. The example question list already contains an 'other' option, which is the designed escape hatch. The underlying visual-blindness problem is acknowledged by the owner and will be addressed upstream by capture changes, which makes this a symptom of an acknowledged gap rather than a new one, and it overlaps with percep-29 and extract-23. Mandating the option on every why question and reporting its share is a good habit, but it is a guideline for the question-writing framework, not an urgent defect. Defer to the question-framework work."
- id: "eval-1"
  case: "The absence of a gold set is true of almost every early-stage LLM extraction product and is a process gap, not a defect in the pipeline's behaviour; it does not by itself make any answer wrong. The spec says nothing about whether labelling exists, so the claim is inferred from silence, and the leaf's own grounding is 'inferred'. The prescribed remedy, 150 human-labelled videos for every question for every game, is expensive and slow, which makes it a poor fit as an immediate must-fix: at per-game scale it would cost far more than the ingestion cost the owner says is not a concern, and it would be done before a game's question set has stabilised, so the labels would be wasted when questions are reworded. Accuracy can be measured later and cheaply on a sample of the questions that studios actually rely on, once usage shows which ones matter, using a smaller set (30 to 50 videos) and a spot-check by the owner. The owner is also a domain expert who can eyeball outputs on a handful of videos today, which gives a coarse sanity check. Every LLM-based product ships with unknown error rates; this is a good practice to schedule, not a gating blocker. Defer, and target it at the few highest-traffic questions first."
- id: "uxr-28"
  case: "The pipeline is deliberately built as a fixed-question table for fast answers, and the owner already names the small question set as a known problem and has explicitly stated the goal of improving the framework so that any type of question can be answered, so this leaf largely restates an acknowledged limitation with one added proposal. The proposed open-ended 'notable problems' extraction is a product feature, not a bug fix: it is an additive column that can be added at any time and run retroactively over stored transcripts, because ingestion cost and time are not a concern, so there is no data lost by waiting. Nothing about the current design prevents a studio from commissioning a researcher to watch the videos for emergent issues, which is the method the leaf says researchers already use. The example (a soft-lock seen by 40 of 500 players) is vivid but it is a visual or game-state event, and the transcript-only input is exactly what the owner says loses visual information, so a free-text extraction over speech would catch it only when players happen to say something, and would miss it when they stay silent; the benefit is therefore smaller than the proposal implies. Free-text extraction also adds its own risks, such as noisy clustering and hallucinated problems, which need design work before they can be trusted. Defer to the question-framework redesign where open-ended capture belongs."
