- id: ops-16
  title: "Deletion request completes while an extraction job for the same video is in flight; the job then writes 8 answer rows for a deleted player"
  level: L3
  cell: {stage: retention-and-deletion, recovery-action: delete-and-propagate, processing-status: extracting, time-and-change: player-deletion-request, data-element: answer}
  object: "player -> video -> transcript -> answers chain (spec items 1-3)"
  situation: "Delete job removes video, transcript and existing answer rows at 10:00:00; an extraction worker that loaded the transcript at 09:59:50 writes its results at 10:00:20"
  consequence: "Orphan answer rows reference a deleted video_id; the player keeps appearing in cohort counts; a deletion audit would show the player 'deleted' while their data is still queryable"
  p_typical: 0.03
  grounded: speculative
  evidence: "none"
  proposed: "Deletion writes a tombstone (player_id, deleted_at) first; every writer checks the tombstone in the same transaction as the insert; post-delete sweep at +1h re-deletes stragglers"
  shallow: false
- id: ops-17
  title: "Precomputed cohort aggregate still includes a player deleted by request; chatbot cites the old count after deletion"
  level: L3
  cell: {stage: aggregate-cache, processing-status: deleted-by-request, data-element: cached-aggregate, answer-afterlife: cited-after-player-deletion, fast-path-dependency: precomputed-aggregate-exists}
  object: "fast path behind 'a question over, say, 500 players is fast' (spec item 4)"
  situation: "Player deletion removes base rows; the cached '% quit at tutorial step 2' for that game was built yesterday and has no dependency on player ids"
  consequence: "Answer still reflects 500 players, one of whom no longer exists; on-call has no list of caches that touched that player"
  p_typical: 0.04
  grounded: inferred
  evidence: "so that a question over, say, 500 players is fast"
  proposed: "Cache entries store the set or count of session ids they cover; deletion marks every cache containing that session dirty; rebuild within 24h"
