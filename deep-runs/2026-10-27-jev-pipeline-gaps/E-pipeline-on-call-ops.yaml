- id: ops-15
  title: "Manual override of one disputed answer is silently overwritten by the next model-upgrade backfill"
  level: L3
  cell: {stage: rerun-and-backfill, recovery-action: manual-override-answer, answer-afterlife: disputed-by-studio, time-and-change: model-upgraded, data-element: answer}
  object: "answers table row (spec item 3)"
  situation: "Studio disputes 'player 217 quit due to difficulty'; an analyst watches the video and sets the answer to 'crash'; 3 weeks later the backfill rewrites all rows for that game"
  consequence: "Correction lost; the studio sees the disputed answer return; no audit trail shows the override ever existed"
  p_typical: 0.03
  grounded: inferred
  evidence: "The answers form a structured table per video."
  proposed: "Override stored as a separate row (source=human, author, timestamp) that the read path prefers over source=model; backfill skips (video, question) pairs with a human override and reports the count skipped"
