- id: ops-21
  title: "Extraction call refused or filtered by the LLM vendor on a profanity-heavy transcript; the runner maps the refusal to the 'Other' option instead of extraction-failed"
  level: L3
  cell: {stage: extraction-prompt, processing-status: extraction-failed, speech-shape: profanity-or-slang, correctness-failure: other-option-overused, batch-failure-mix: some-questions-failed-in-one-video}
  object: "fixed question set with options (spec item 3)"
  situation: "Frustrated player swears continuously in video 2; vendor content filter returns a refusal for 3 of 8 questions; fallback code picks the last option"
  consequence: "'Other' rises to 18% for the angriest players, the very cohort the churn target is about; ops sees no failures"
