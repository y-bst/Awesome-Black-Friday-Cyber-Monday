- id: ops-1
  title: "Session of 8 videos where 6 transcribe and 2 hit transcription-failed: no 'partial' session status, and session-level aggregation still emits a session row as if all 8 were read"
  level: L3
  cell: {stage: session-level-aggregation, session-shape: 5-20-videos, processing-status: transcription-failed, batch-failure-mix: one-video-of-session-failed, recovery-action: retry-one-video}
  object: "session -> video -> transcript chain; spec item 1 'one session is many videos' and item 3 'a structured table per video'"
  situation: "Videos 3 and 7 of an 8-video, 2-hour session fail speech-to-text (vendor 5xx, then retries exhausted); videos 1,2,4,5,6,8 reach extraction and write answer rows"
  consequence: "Session-level answer 'player quit during tutorial: No' is computed from 6 of 8 videos (75% coverage); the 30 missing minutes may contain the quit; the cohort count includes this session at full weight and nobody sees that it is partial"
  p_typical: 0.15
  grounded: inferred
  evidence: "A session can be n hours; each video is capped at 15 minutes, so one session is many videos."
  proposed: "Session status = min over its videos (complete only when 8/8 complete); store videos_expected and videos_complete per session; aggregation excludes or flags sessions with coverage < 100%; per-video retry button keyed on (session_id, video_index)"
  shallow: false
- id: ops-2
  title: "Answers table has no row for a queued video and the chatbot reads the missing row as 'No' for 'did the player abandon the tutorial'"
  level: L4
  cell: {stage: answers-table, data-element: null-vs-no, processing-status: queued, correctness-failure: null-treated-as-no, chatbot-response-behaviour: mixes-null-with-no}
  object: "answers table per video (spec item 3); the chatbot answering 'from that table' (spec item 4)"
  situation: "120 of 500 players' tutorial videos are still queued for extraction when the studio asks 'how many players abandoned the tutorial?'; a LEFT JOIN or an LLM reading the table sees no 'Yes' for those 120 and counts them as not abandoning"
  consequence: "Reported abandonment = 95/500 = 19% instead of 95/380 = 25%; the 120 unprocessed players silently lower the rate by 6 points"
  p_typical: 0.2
  grounded: inferred
  evidence: "The answers form a structured table per video."
  proposed: "Write a placeholder row per (video, question) at ingest with status=pending and answer=NULL; test: query returning count must report pending=120 separately; chatbot prompt forbids treating pending as No"
  shallow: false
- id: ops-3
  title: "Question Q5 fails extraction on 3 of 12 videos (LLM returned an option string not in the list) while Q1-Q4 and Q6-Q8 succeed; video status says 'extracted', no per-question status exists"
  level: L3
  cell: {stage: per-video-answers, processing-status: extraction-partial-some-questions, batch-failure-mix: some-questions-failed-in-one-video, recovery-action: retry-one-question, correctness-failure: null-treated-as-no}
  object: "fixed set of questions with options per transcript (spec item 3)"
  situation: "Model output for Q5 is 'Partially - the player found the menu later' which matches none of the 4 option ids; the parser drops it and marks the video done"
  consequence: "Q5 has 9 answers for 12 videos with no record that 3 failed; the only retry path is re-running the whole video, which re-calls all 8 questions and can flip the 7 answers that were already stored"
  p_typical: 0.06
  grounded: inferred
  evidence: "The transcript is run through a fixed set of questions with options, written per game target."
  proposed: "Status per (video_id, question_id) with values ok / parse_failed / model_error; retry endpoint scoped to one (video_id, question_id); daily count of parse_failed per question with alert above 2%"
  shallow: false
- id: ops-4
  title: "Re-run after a prompt change reaches 470 of 500 players before the job stalls; cohort counts mix prompt v1 rows (30 players) and v2 rows (470) with nothing in the answer saying so"
  level: L3
  cell: {stage: rerun-and-backfill, scale: 500-players, processing-status: rerun-in-progress, recovery-action: backfill-after-question-set-change, correctness-failure: mixed-version-aggregation, studio-question-type: cohort-count}
  object: "answers table rows per video; prompt-version (no field for it in spec)"
  situation: "Extraction prompt for 'reason for leaving tutorial' is reworded; backfill job processes players in id order and dies on a rate-limit at player 471; nobody restarts it for 4 days"
  consequence: "'Instructions unclear' share = blend of v1 (which over-picks it) and v2; on-call has no query listing which 30 players are still on v1 because rows carry no prompt_version"
  p_typical: 0.08
  grounded: inferred
  evidence: "the framework for generating the questions so that any type of question can be answered."
  proposed: "Every answer row stores prompt_version and extraction_run_id; backfill progress table (players_total=500, players_done=470) shown in the ops dashboard; chatbot only reads rows where prompt_version = active version, and reports '470/500 on current version'"
  shallow: false
- id: ops-5
  title: "Non-idempotent retry inserts a second answer row for (video 4, Q2); 'players who quit at step 3' counts this player twice"
  level: L4
  cell: {stage: answers-table, batch-failure-mix: retry-produced-duplicate, correctness-failure: duplicate-counted, data-element: extraction-run-id, recovery-action: retry-one-video}
  object: "answers table per video (spec item 3)"
  situation: "Worker writes rows, then times out before acking the queue message; the message is redelivered and the worker inserts 8 more rows with new auto-increment ids"
  consequence: "Check 'SELECT video_id, question_id, COUNT(*) FROM answers GROUP BY 1,2 HAVING COUNT(*) > 1' returns rows; cohort count of 'quit at step 3' is 41 instead of 40; with nondeterministic LLM output the two rows may also disagree (one Yes, one No)"
  p_typical: 0.08
  grounded: inferred
  evidence: "The answers form a structured table per video."
  proposed: "Unique key (video_id, question_id, question_set_version, prompt_version); writes are upserts; nightly duplicate check with zero tolerance"
  shallow: false
- id: ops-6
  title: "A game's daily ingest drops from ~40 sessions to 0 after a build update broke the capture uploader; no alert fires for 9 days"
  level: L4
  cell: {stage: upload-and-ingest, processing-status: not-yet-uploaded, scale: 10-games-at-once, time-and-change: game-update-changes-tutorial, latency: "ingest-to-queryable (hours or days after session)"}
  object: "video capture -> upload path (spec item 1); 'how videos of one session are linked' is unspecified"
  situation: "Studio ships build 1.4 with the new tutorial; the capture SDK version in that build fails auth on upload; sessions are played but nothing arrives"
  consequence: "The exact cohort the studio wants (new tutorial) is empty; the chatbot answers 'compare old vs new tutorial' from the old build only or says nothing; ops sees no failed jobs because no jobs were created"
  p_typical: 0.05
  grounded: inferred
  evidence: "A player's gameplay session is captured as video."
  proposed: "Per-game ingest-volume monitor: alert when sessions/day < 20% of trailing 7-day median for 24h; alert includes last build_id seen"
  shallow: false
- id: ops-7
  title: "Video 4 of a 9-video session arrives 2 days after session-level aggregation ran; session row and cached cohort aggregate are never recomputed"
  level: L3
  cell: {stage: aggregate-cache, batch-failure-mix: late-arriving-video-after-aggregation, session-shape: missing-middle-video, fast-path-dependency: cache-stale-after-rerun, latency: fast-but-stale}
  object: "session-level aggregation and precomputed aggregate behind 'a question over, say, 500 players is fast' (spec item 4)"
  situation: "Upload of video 4 retried from the player's machine after a network outage; it is transcribed and extracted on arrival, but the session aggregate was finalised when videos 1-3 and 5-9 were complete"
  consequence: "Video 4 holds the tutorial quit; the session still reads 'completed tutorial'; cohort quit rate stays 1 player low until someone rebuilds the cache by hand"
  p_typical: 0.05
  grounded: inferred
  evidence: "A chatbot for the gaming studio answers the studio's questions from that table, so that a question over, say, 500 players is fast."
  proposed: "Any per-video answer write emits session_dirty(session_id); aggregation and cache keyed on session re-run on dirty; session never finalises while a gap in video_index exists without a 'gap confirmed' flag"
  shallow: false
- id: ops-8
  title: "Silent player's video yields an empty transcript; status goes to 'complete' and extraction runs on an empty string, returning a forced option for all 8 questions"
  level: L4
  cell: {stage: per-video-answers, processing-status: transcript-empty, speech-shape: silent-player, correctness-failure: hallucinated-answer, transcription-subsystem: empty-transcript-for-non-empty-video}
  object: "transcript (spec item 2) fed to fixed question set (spec item 3)"
  situation: "Player plays 15 minutes without speaking and game audio is low; speech-to-text returns 0 words; the extraction prompt still asks 'why did the player leave the tutorial' with 4 options and no 'cannot tell'"
  consequence: "Answer rows exist with confident options for a video with no evidence; empty-transcript share per game is not measured, so a cohort of quiet players looks like 'lost interest'"
  p_typical: 0.07
  grounded: inferred
  evidence: "Each video is converted to a transcript. The owner's view: the transcript alone is not enough"
  proposed: "If transcript word count < 20 for a 15-minute video, set status transcript-empty, skip extraction, write answer=NULL reason=no_speech; dashboard shows % transcript-empty per game per day"
  shallow: false
- id: ops-9
  title: "Video that fails transcription 3 times sits in a dead-letter queue with no owner; its session never completes and the chatbot drops it from cohorts without a count"
  level: L3
  cell: {stage: job-orchestration-and-status, processing-status: transcription-failed, batch-failure-mix: some-sessions-failed-in-cohort, recovery-action: skip-and-mark-unknown, studio-question-type: cohort-count}
  object: "job pipeline between video and transcript (spec item 2); no failure state defined in spec"
  situation: "14 of 500 sessions have at least one video in the DLQ after a vendor incident; DLQ has no TTL, no daily report and no 'give up and mark unknown' action"
  consequence: "Those 14 sessions are excluded or half-included indefinitely; on-call learns about it only when a studio asks why a named player is missing"
  p_typical: 0.06
  grounded: inferred
  evidence: "Each video is converted to a transcript."
  proposed: "DLQ items older than 48h trigger a page; an action 'mark video unknown' lets the session complete with coverage < 100% and a visible flag"
  shallow: false
- id: ops-10
  title: "Session whose upload produced zero videos (game crashed at launch) never creates a session row, so the players most likely to churn are absent from the denominator"
  level: L3
  cell: {stage: session-level-aggregation, session-shape: zero-videos-session-failed, processing-status: not-yet-uploaded, correctness-failure: wrong-denominator, studio-question-type: cohort-count}
  object: "session (spec item 1); the 500-player cohort the chatbot counts over (spec item 4)"
  situation: "12 of 500 recruited players' sessions crash before the capture writes its first video; the pipeline is video-driven, so no record of these sessions exists"
  consequence: "Tutorial churn computed over 488 players; the 12 who churned hardest (could not start) are invisible; ops cannot list 'sessions expected vs received'"
  p_typical: 0.04
  grounded: inferred
  evidence: "A player's gameplay session is captured as video."
  proposed: "Create the session record at recording start with status not-yet-uploaded; sessions with 0 videos after 24h become status zero-videos and are reported in every cohort answer as a separate count"
  shallow: false
- id: ops-11
  title: "Transcription vendor outage of 6 hours fails every job in a 50,000-video backfill; exponential retries without a global rate cap create a retry storm when the vendor recovers"
  level: L3
  cell: {stage: transcription, batch-failure-mix: all-failed, scale: 50000-videos, recovery-action: rerun-whole-session, latency: batch-overnight}
  object: "transcription stage (spec item 2); 'Ingestion time and cost are not a concern'"
  situation: "Vendor returns 503 for 6h; 50,000 queued jobs each retry 5 times then dead-letter; on recovery, a manual 'rerun all' re-submits all sessions, including the 30% that had already succeeded"
  consequence: "Duplicate transcription spend on ~15,000 videos and a second wave of 429 rate-limit failures; the overnight batch finishes 2 days late, and status per video cannot tell 'failed in outage' from 'failed on content'"
  p_typical: 0.05
  grounded: inferred
  evidence: "Ingestion time and cost are not a concern. Answering a studio's question must be fast."
  proposed: "Circuit breaker on vendor error rate > 50% over 5 min pauses the queue instead of failing jobs; rerun selects only videos with status transcription-failed and failure_reason=vendor_unavailable"
  shallow: false
- id: ops-12
  title: "Extraction model deprecated by vendor forces a backfill of all videos; during the multi-day backfill the table holds rows from two extraction models with no extraction_model_version column"
  level: L3
  cell: {stage: rerun-and-backfill, time-and-change: extraction-vendor-deprecates-model, recovery-action: backfill-after-model-upgrade, processing-status: superseded-by-rerun, data-element: extraction-model-version}
  object: "answers table (spec item 3) produced by an LLM over transcripts"
  situation: "Vendor gives 30 days' notice; backfill over 50,000 videos x 8 questions = 400,000 calls runs for 5 days; new rows overwrite old rows in place as each video finishes"
  consequence: "For 5 days any cohort answer mixes two models whose option distributions differ; after cutover there is no way to compare old vs new on the same videos because old rows were overwritten"
  p_typical: 0.06
  grounded: inferred
  evidence: "The answers form a structured table per video."
  proposed: "Backfill writes to a shadow table tagged with model version; switch the chatbot's read pointer only when shadow coverage = 100%; keep the old table 30 days for a diff report per question"
  shallow: false
- id: ops-13
  title: "Rerun appends new rows without flagging the old ones as superseded; chatbot reads both versions of Q3 for the same video"
  level: L4
  cell: {stage: rerun-and-backfill, processing-status: superseded-by-rerun, correctness-failure: duplicate-counted, question-set-version-state: mixed-versions-in-table, chatbot-response-behaviour: invents-number}
  object: "answers table rows per video (spec item 3)"
  situation: "Re-extraction after a question set edit inserts rows with question_set_version=2 but the read path filters only on game_target, not version"
  consequence: "Sum of option counts for Q3 = 2x the number of videos for re-run videos; the chatbot reports '1.6 reasons per player'; test: for each (video, question) the read path returns exactly 1 row"
  p_typical: 0.05
  grounded: inferred
  evidence: "The transcript is run through a fixed set of questions with options, written per game target."
  proposed: "Column is_current set false on old rows in the same transaction that inserts new rows; read path filters is_current = true"
  shallow: false
- id: ops-14
  title: "Studio asks at 3am while a backfill is 60% done; the same question asked at 9am gives a different number and the 3am number is already in a deck"
  level: L3
  cell: {time-and-change: rerun-in-progress-while-queried, processing-status: rerun-in-progress, chatbot-response-behaviour: differs-on-re-ask, latency: fast-but-stale, answer-afterlife: copied-into-deck}
  object: "chatbot answer from the table (spec item 4)"
  situation: "Backfill after a prompt change runs overnight; at 03:00 42% of rows are v1 and 58% v2; the answer carries no run id or 'backfill in progress' notice"
  consequence: "Deck says 31% tutorial churn, chatbot says 27% at 09:00; nobody can reproduce 31% because the v1 rows were overwritten"
  p_typical: 0.06
  grounded: inferred
  evidence: "Answering a studio's question must be fast."
