  cell: {stage: session-stitching, scale: 1-player-10-hour-session, transcription-subsystem: truncated-at-length-limit, processing-status: complete, session-shape: 10-plus-hour-session}
  object: "'Long multi-video sessions' (spec, known problems)"
  situation: "40 videos x ~2,000 words = ~80,000 words; session-level questions get the first N tokens only"
