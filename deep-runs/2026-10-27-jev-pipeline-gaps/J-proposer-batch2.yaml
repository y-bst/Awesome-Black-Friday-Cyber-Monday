- id: "l10n-3"
  case: "The spec says the fixed questions target 'churn in the tutorial and just after it', and frustration at a tutorial step is the single most direct churn signal those questions can catch. Most cloud speech-to-text vendors ship with profanity masking on by default, so a player who says 'what the f*** am I supposed to do here' at 07:12 is stored as 'what the **** am I supposed to do here' or has the word dropped. The extractor then reads a sanitised sentence and, with no emphatic marker, can answer 'No frustration', which is exactly the player the studio most needs to hear about. The masking is invisible in the stored transcript, so nobody reviewing answers can tell a calm player from a censored one, and the bias is one-directional: every swearing player is undercounted, in every video, for every cohort. The spec itself lists 'languages' and 'what a transcript contains' as unspecified, so no one has confirmed the vendor setting, and because ingestion cost is explicitly not a concern, re-transcribing is cheap now and gets more expensive in lock-in as the studio-facing table grows. The fix is a one-line ASR parameter plus a per-video profanity_masked flag, so a studio that sees 'frustration at tutorial step 2: 18%' today is being told a floor, not a measurement, and the flag lets us find and redo every video already processed before more chatbot answers rely on them."
- id: "eval-13"
  case: "The spec states that 'their questions are not known in advance' and that 'the question set is small, so most of what is in the video and transcript is never captured', which together mean that most real studio questions will fall outside the stored questions. The only defence against the bot answering those from the nearest stored question is an evaluation that checks for it, and a benchmark built only from answerable questions cannot. Take 'How many players struggled with the crafting step?' against a set that only covers the combat tutorial: the bot returns the combat number with full confidence, and a benchmark with no unanswerable items scores that as correct or never tests it, so the team sees 100% and ships. This is a measurement gap, not a one-off bug: every later change to the planner, embedding threshold or prompt is judged by a gauge that is blind to the dominant failure mode, so regressions cannot be seen and improvements cannot be credited. The studio that acts on a confidently wrong crafting number (a redesign, a tutorial rewrite) pays for it, and the team learns of it only from a complaint. Adding at least 20% unanswerable items with the expected reply 'not covered by the question set' costs a few hours of question writing and has to exist before the planner is tuned further, otherwise every tuning decision is made against a misleading score."
- id: "speech-1"
  case: "The spec says the transcript 'alone is not enough' and that the fixed questions are run on it once per video, with no unknown or not-assessable answer state described. A player who does not think aloud produces a zero-word or near-zero-word transcript, and the fixed questions (for example 'Did the player express confusion at tutorial step 2?') are still run, so the extractor must pick from the options and 'No' or 'Other' is the natural pick. Those rows then enter the answers table as real negatives, indistinguishable from a talkative player who calmly completed the step. Silent players are typically a large share of any think-aloud cohort and are plausibly the ones who quietly quit, so the cohort count 'how many players were confused' is biased downward exactly where it matters, and the studio reads silence as satisfaction. This is not recoverable downstream: once 'No' is stored, the chatbot cannot distinguish absence of evidence from evidence of absence, and no denominator of players-with-speech exists to report. The fix is cheap and purely at ingestion: skip extraction under a word-count threshold, write NULL with reason no_speech, and have the chatbot print the speech-bearing denominator. Doing it before onboarding avoids wrong answers that cannot be repaired later without re-running the questions."
- id: "chat-1"
  case: "The spec says 'the answers form a structured table per video' and that sessions run to n hours in 15-minute videos, so the unit of the table is the video while the unit of every studio question is the player. A planner generating SQL over that table will, by default, COUNT(*) or COUNT(answer='quit') over video rows. With 500 players at about 8 videos each, the denominator becomes roughly 4,000 and a player who answered 'quit' in two videos is counted twice in the numerator, so the bot reports about 4% where the truth is about 30%, or more than 100% when numerator and denominator disagree on the unit. The product exists to answer exactly this kind of cohort-percentage question quickly, so the headline use case is the one affected, and nothing in the reply signals the error because the number looks plausible. A studio deciding whether to rebuild its tutorial on an order-of-magnitude-wrong churn rate pays the highest price, and the wrong number is stored in dashboards and slide decks. The fix is a planner rule that every cohort count resolves to COUNT(DISTINCT player_id) over a session-level view, with a test asserting denominator equals distinct players in scope and the reply printing 'n = 500 players'. It is cheap, testable, and has to exist before any studio relies on a percentage from this bot."
- id: "analyst-24"
  case: "The spec says 'the transcript alone is not enough; what is on screen is largely lost', and for a player who spoke four words in fifteen minutes there is almost nothing to ground an answer to 'Primary reason for leaving'. The question still has to be answered once per video from fixed options, so the extractor picks something such as 'Bored', and no abstain, confidence or evidence field is described anywhere in the pipeline. The chatbot then replies 'Player 301 quit because they were bored.' in the same assured tone it uses for a player who explained their reasoning for ten minutes. An analyst or designer reads that as a finding about player psychology and may quote it in a report, when it is closer to a coin flip over the option list. Aggregates inherit the problem: 'top reason for leaving' across 500 players is quietly dominated by guesses for silent players, shifting the distribution toward whatever option the model defaults to. Storing the transcript word count and extractor confidence alongside every answer costs almost nothing at ingestion, where cost is not a concern, and lets the bot prefix 'low evidence (4 words spoken)' or filter by evidence level. Without it, studios cannot calibrate trust in any single-player answer, and trust once lost on a confidently wrong reply is hard to regain."
