  consequence: "v1 'Confusing' (200 players) outranks the two halves of v2; bot reports 'Confusing' as #1; an hour later the answer flips"
  p_typical: 0.05
  grounded: inferred
  evidence: "The transcript is run through a fixed set of questions with options, written per game target."
