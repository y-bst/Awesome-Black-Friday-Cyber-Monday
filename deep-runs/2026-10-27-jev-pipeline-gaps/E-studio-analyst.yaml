- id: analyst-1
  title: "Studio question with no matching fixed question is silently answered from the nearest fixed question"
  level: L4
  cell: {stage: chatbot-query-planning, studio-question-type: question-outside-game-target, question-shape: question-not-in-set, chatbot-response-behaviour: substitutes-nearest-fixed-question, latency: under-2s}
  object: "fixed question set per game target; chatbot answering 'from that table'"
  situation: "Analyst asks 'What % of players complained about the music?'; the set only has 'Primary reason for leaving the tutorial' with option 'Audio/visual annoyance'; the bot maps the question to that column in under 2 s"
  consequence: "Analyst reads '7% complained about music' when the 7% is players whose primary quit reason was audio/visual; players who complained but kept playing are invisible; the number goes into a readout"
  p_typical: 0.35
  grounded: quote
  evidence: "Their questions are not known in advance. / The question set is small, so most of what is in the video and transcript is never captured."
  proposed: "Query planner emits a 'mapped to question Qn: <text>' line on every answer and refuses with 'not in question set vN' when semantic match to any question is below a set threshold"
  shallow: false
- id: analyst-2
  title: "No evidence span per answer row, so 'show me the clip where player 214 quits' has no target"
  level: L3
  cell: {stage: evidence-display, data-element: evidence-span, studio-question-type: show-me-raw-transcript-or-clip, correctness-failure: confident-no-evidence}
  object: "'The answers form a structured table per video' (answer only, no span)"
  situation: "Bot says player 214 'quit due to unclear objective' in video 3; analyst clicks or asks for the moment; the row stores video id + option, no start/end timestamp or quoted utterance"
  consequence: "Analyst must scrub a 15-minute video manually or trust the label; disputes cannot be settled; the analyst stops trusting cohort numbers built from labels they cannot audit"
  p_typical: 0.4
  grounded: inferred
  evidence: "The answers form a structured table per video."
  proposed: "Each answer row stores evidence_start_ms, evidence_end_ms and verbatim quote; chat answer links each cited row to a clip starting 10 s before evidence_start_ms"
  shallow: false
- id: analyst-3
  title: "Cohort count over per-video rows counts one player up to n times"
  level: L4
  cell: {stage: session-level-aggregation, studio-question-type: cohort-count, scale: 500-players, session-shape: 5-20-videos, correctness-failure: duplicate-counted}
  object: "per-video answers table; 'one session is many videos'"
  situation: "Q 'Did the player express frustration?' = Yes in 6 of 12 videos for player 41; analyst asks 'How many of the 500 players were frustrated?'"
  consequence: "Bot's COUNT(*) WHERE answer='Yes' returns 1,840 'players' out of 500, or a % above 100, or (if it divides by row count) a % that weights long sessions 12x"
  p_typical: 0.15
  grounded: inferred
  evidence: "The answers form a structured table per video. / each video is capped at 15 minutes, so one session is many videos."
  proposed: "Define per-question session rollup rule (any/first/last/majority) and expose a session- and player-level view the bot must query for cohort counts"
  shallow: false
- id: analyst-4
  title: "Failed transcriptions shrink the denominator with no 'n=470 of 500' disclosure"
  level: L4
  cell: {stage: chatbot-answer, processing-status: transcription-failed, batch-failure-mix: some-sessions-failed-in-cohort, correctness-failure: wrong-denominator, studio-question-type: cohort-count}
  object: "chatbot answer over 'say, 500 players'"
  situation: "30 of 500 sessions have transcription-failed on their tutorial video; analyst asks 'What % churned in the tutorial?'"
  consequence: "Bot answers '32%' computed over 470, without saying 30 players are missing; if failures correlate with churn (players who quit in 2 minutes produce near-empty audio), the % is biased low"
  p_typical: 0.08
  grounded: inferred
  evidence: "A chatbot for the gaming studio answers the studio's questions from that table, so that a question over, say, 500 players is fast."
  proposed: "Every numeric answer prints 'n = answered / cohort size, k missing (reason)'"
  shallow: false
- id: analyst-5
  title: "Tutorial questions answered 'No' on post-tutorial videos are counted as players who failed the step"
  level: L4
  cell: {data-element: null-vs-no, question-shape: event-did-not-happen-in-this-video, correctness-failure: null-treated-as-no, studio-question-type: find-players-who, session-shape: 5-20-videos}
  object: "fixed question 'Did the player complete tutorial step 3?' run on every video"
  situation: "Player finished step 3 in video 1; videos 2-12 are post-tutorial and the extractor answers 'No' because step 3 is not in them; analyst asks 'find players who never completed step 3'"
  consequence: "Bot returns players who did complete it, because any 'No' row matches; list is inflated by every multi-video session"
  p_typical: 0.07
  grounded: inferred
  evidence: "The transcript is run through a fixed set of questions with options, written per game target."
  proposed: "Every question gets a 'not applicable in this video' option distinct from 'No', and the bot query for 'never' uses session rollup with NA excluded"
  shallow: false
- id: analyst-6
  title: "Analyst cannot ask the bot what it can answer; the question catalog is not exposed"
  level: L3
  cell: {stage: studio-ui, studio-question-type: what-can-you-answer, data-element: question-set-version, chatbot-response-behaviour: refuses-answerable-question}
  object: "fixed question set per game target (not visible to the studio)"
  situation: "Analyst types 'What can you tell me about this playtest?' or phrases a covered question in different words ('drop-off at onboarding' for 'tutorial churn')"
  consequence: "Bot either lists generic abilities or says 'I don't have that data' for a question the table covers under other wording; analyst guesses phrasing for 20 minutes"
  p_typical: 0.12
  grounded: inferred
  evidence: "who at the studio asks and what they ask ... (Unspecified)"
  proposed: "Studio UI shows the active question set (id, text, options, version, cohort coverage) and the bot answers 'what can you answer' from that list"
  shallow: false
- id: analyst-7
  title: "Same cohort question asked twice returns two different numbers"
  level: L4
  cell: {chatbot-response-behaviour: differs-on-re-ask, fast-path-dependency: text-to-sql-generated-correctly, answer-afterlife: copied-into-deck, scale: 500-players}
  object: "chatbot over the answers table"
  situation: "Analyst asks 'How many players churned in tutorial?' at 10:00 (bot filters option='Quit'); re-asks at 10:05 in a new chat (bot filters option IN ('Quit','Paused and did not return'))"
  consequence: "Deck says 112, colleague's screenshot says 147; nobody can tell which query ran"
  p_typical: 0.09
  grounded: inferred
  evidence: "A chatbot for the gaming studio answers the studio's questions from that table"
  proposed: "Show the generated query/filter in an expandable 'how this was computed' panel and cache canonical query per (question id, option set)"
  shallow: false
- id: analyst-8
  title: "Table larger than the LLM context is silently truncated before the bot counts"
  level: L4
  cell: {fast-path-dependency: table-fits-in-llm-context, chatbot-response-behaviour: silently-truncates-rows, scale: 500-players, latency: under-30s}
  object: "'answers ... from that table' when the table is passed as context"
  situation: "500 players x 12 videos x 10 questions = 60,000 rows; context holds about 8,000 rows; analyst asks a cohort count"
  consequence: "Bot answers over the first ~67 players in row order, presents it as the 500-player answer, no warning"
  p_typical: 0.12
  grounded: inferred
  evidence: "so that a question over, say, 500 players is fast. Reading 500 transcripts per question was too slow and too much data"
  proposed: "Counts are computed by a query engine, never by the LLM reading rows; if rows are ever passed, the answer states rows_used / rows_total"
  shallow: false
- id: analyst-9
  title: "Version comparison question has no game-version column to split on"
  level: L3
  cell: {studio-question-type: compare-two-versions, data-element: game-version, stage: build-and-metadata-tagging, correctness-failure: mixed-version-aggregation, time-and-change: game-update-changes-tutorial}
  object: "answers table keyed per video; 'how videos of one session are linked' unspecified"
  situation: "Studio shipped tutorial v1.3 mid-playtest; 200 sessions on v1.2, 300 on v1.3; analyst asks 'Did v1.3 reduce tutorial churn?'"
  consequence: "Bot either refuses, splits by upload date as a proxy (wrong for sessions recorded on older builds), or reports one blended number"
  p_typical: 0.14
  grounded: inferred
  evidence: "whether game telemetry is joined ... how videos of one session are linked (Unspecified)"
  proposed: "Session row carries build_id and game_version as required fields at ingest; bot rejects version comparisons when >5% of sessions lack the tag and says how many"
  shallow: false
- id: analyst-10
  title: "Which-step-loses-most question cannot be answered because rows are per 15-minute video, not per tutorial step"
  level: L3
  cell: {studio-question-type: compare-two-steps, data-element: tutorial-step, stage: per-video-answers, question-shape: answer-needs-visuals}
  object: "'a structured table per video'"
  situation: "Video 1 covers tutorial steps 1-6; analyst asks 'Is step 4 or step 5 where players give up?'"
  consequence: "Bot answers 'video 1' or picks the step mentioned in an option label; step boundaries are on screen, not in speech, so no row identifies them"
  p_typical: 0.12
  grounded: quote
  evidence: "Transcript loses visual information. / The answers form a structured table per video."
  proposed: "Add a per-session question 'last tutorial step reached' with one option per step id from the game's tutorial map"
  shallow: false
- id: analyst-11
  title: "Timeline of one player sorts videos lexically and resets timestamps per video"
  level: L4
  cell: {studio-question-type: timeline-of-one-player, transcription-subsystem: timestamps-reset-per-video, correctness-failure: answer-attached-to-wrong-video-index, session-shape: 5-20-videos}
  object: "video ids within a session; 'how videos of one session are linked' unspecified"
  situation: "Analyst asks 'What happened to player 88 in order?' for a 12-video session named video_1 ... video_12"
  consequence: "Bot narrates video_10, 11, 12 before video_2, and cites '03:12' twice for events 90 minutes apart; analyst's timeline in the report is wrong"
  p_typical: 0.05
  grounded: inferred
  evidence: "how videos of one session are linked (Unspecified)"
  proposed: "Store integer video_index and session_offset_ms per row; timeline answers print session-absolute hh:mm:ss"
  shallow: false
- id: analyst-12
  title: "Follow-up 'why?' drops the cohort filter from the previous turn"
  level: L4
  cell: {studio-question-type: follow-up-question, stage: chatbot-query-planning, data-element: chatbot-conversation-log, correctness-failure: wrong-denominator}
  object: "studio chatbot multi-turn conversation"
  situation: "Turn 1: 'How many Android players quit in the tutorial?' -> 38. Turn 2: 'Why did they quit?'"
  consequence: "Turn 2 reason distribution is computed over all 500 players (or all quitters on all platforms), presented as 'their' reasons"
  p_typical: 0.06
  grounded: speculative
  evidence: "none"
  proposed: "Bot echoes the active cohort filter ('Android, quit in tutorial, n=38') at the top of every follow-up answer"
  shallow: false
- id: analyst-13
  title: "'Other' is the top quit reason and has no text behind it"
  level: L4
  cell: {stage: answer-options, question-shape: fits-no-option, correctness-failure: other-option-overused, studio-question-type: cohort-why}
  object: "fixed options for 'Primary reason for leaving'"
  situation: "Options are Too hard / Confusing / Bored / Technical issue / Other; 41% of quitters are 'Other'"
  consequence: "Analyst asks 'what does Other mean?' and the bot has nothing; the single biggest bucket is the one the studio learns nothing about"
  p_typical: 0.15
  grounded: quote
  evidence: "The question set is small, so most of what is in the video and transcript is never captured."
  proposed: "'Other' rows store a 1-sentence free-text reason; bot clusters them on request and alerts the question author when Other exceeds 15%"
  shallow: false
- id: analyst-14
  title: "'What should we change?' gets generic game-design advice phrased as if from the data"
  level: L3
  cell: {studio-question-type: recommendation-what-should-we-change, chatbot-response-behaviour: answers-from-general-game-knowledge, correctness-failure: confident-no-evidence, stage: chatbot-answer}
  object: "chatbot answer"
  situation: "Analyst asks 'What should we change in the tutorial to cut churn?'"
  consequence: "Bot writes 'Shorten the tutorial and add skip options' with no row cited; reads as a finding of the playtest"
  p_typical: 0.11
  grounded: speculative
  evidence: "none"
  proposed: "Recommendation answers separate 'From your data (rows cited)' from 'General suggestion (not from data)' as labelled sections"
  shallow: false
- id: analyst-15
  title: "Time-to-quit distribution only resolvable to the 15-minute video index"
  level: L4
  cell: {studio-question-type: distribution-not-count, question-shape: answer-is-a-time, stage: answer-options, data-element: timestamp}
  object: "15-minute video cap; option-based answers"
  situation: "Analyst asks 'Show the distribution of minutes before players quit'"
  consequence: "Only buckets 0-15, 15-30, 30-45 exist (video index of the quit); a tutorial lasting 8 minutes collapses into one bucket; bot may invent minute-level values"
  p_typical: 0.06
  grounded: quote
  evidence: "each video is capped at 15 minutes, so one session is many videos."
  proposed: "Store quit_offset_ms (session-absolute) as a numeric field from the evidence span instead of an option"
  shallow: false
- id: analyst-16
  title: "Analyst's wrong correction is accepted by the bot and changes later answers"
  level: L3
  cell: {studio-question-type: correction-that-is-wrong, stage: studio-feedback-loop, recovery-action: manual-override-answer, answer-afterlife: disputed-by-studio}
  object: "chatbot conversation; answers table"
  situation: "Analyst says 'No, player 12 finished the tutorial' (confusing player 12 with player 21); bot replies 'You're right, updated: 112 -> 111'"
  consequence: "Either the bot's in-chat number drifts from the table, or an override is written to the table by someone with no evidence; no audit row records who changed what"
  p_typical: 0.04
  grounded: speculative
  evidence: "none"
  proposed: "Corrections create a dispute record with the cited evidence span; table values change only through a reviewed override with author and timestamp"
  shallow: false
- id: analyst-17
  title: "Morning-after question answered over the 12 sessions that finished processing, not the 50 recorded"
  level: L4
  cell: {processing-status: transcribing, latency: "ingest-to-queryable (hours or days after session)", studio-question-type: cohort-count, scale: 50-players}
  object: "'Ingestion time and cost are not a concern.'"
  situation: "50-player playtest ends at 18:00; at 09:00 next day 38 sessions are queued or transcribing; analyst asks 'tutorial churn for yesterday's playtest?'"
