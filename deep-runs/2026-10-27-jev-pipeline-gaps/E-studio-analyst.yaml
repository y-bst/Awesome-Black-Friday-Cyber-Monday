  grounded: quote
  evidence: "Ingestion time and cost are not a concern. Answering a studio's question must be fast."
  proposed: "Answer header shows 'processed 12/50 sessions, ETA hh:mm'; bot declines cohort % when coverage < 80% unless analyst confirms"
  shallow: false
- id: analyst-18
  title: "Query during a re-extraction mixes old and new option sets with no version shown"
  level: L4
  cell: {time-and-change: rerun-in-progress-while-queried, question-set-version-state: mixed-versions-in-table, correctness-failure: mixed-version-aggregation, scale: 500-players-x-3-question-set-versions}
