- id: exec-1
  title: Chatbot headline percentage ('62% quit at the inventory step') carries no n and no denominator definition
  level: L4
  cell:
    stage: chatbot-answer
    studio-question-type: cohort-count
    scale: 500-players
    correctness-failure: wrong-denominator
    answer-afterlife: copied-into-deck
  object: chatbot answer to a cohort-count question over the answers table
  situation: Exec asks 'what share of our 500 players quit in the tutorial?'; 41 players have no complete session, 12 have only 1 of n videos processed; bot returns one percentage
  consequence: Slide says 62% with no base; the true base could be 447 or 500 or 388 and the exec cannot tell which; a reader challenges the number in the review and nobody can state n
  p_typical: 0.3
  grounded: inferred
  evidence: The answers form a structured table per video. (no per-player or per-cohort denominator is defined)
  proposed: Every cohort number returns 'k of n players (n = players with all videos complete), m excluded and why' as a fixed suffix
  shallow: false
- id: exec-2
  title: Same question asked twice in one afternoon returns two different percentages
  level: L4
  cell:
    stage: chatbot-answer
    chatbot-response-behaviour: differs-on-re-ask
    studio-question-type: cohort-count
    correctness-failure: hallucinated-answer
    fast-path-dependency: text-to-sql-generated-correctly
  object: chatbot answer; the LLM turns the studio question into a query or reads the table
  situation: Exec asks the same 'how many players failed the first boss' question in the morning (41%) and again before the meeting (36%); the query plan or LLM summarisation differs between runs, no temperature
    or plan is pinned
  consequence: Exec stops trusting every number from the bot, or worse picks the nicer one for the deck
  p_typical: 0.25
  grounded: inferred
  evidence: Their questions are not known in advance.
  proposed: Persist query plan and result per (question text, table version); a re-ask of an identical question returns the stored result with its timestamp
  shallow: false
- id: exec-3
  title: Number pasted in a deck cannot be reproduced after the table is re-extracted
  level: L4
  cell:
    stage: rerun-and-backfill
    answer-afterlife: copied-into-deck
    correctness-failure: stale-after-prompt-change
    data-element: prompt-version
    time-and-change: model-upgraded
  object: chatbot answer text (no table version, question-set-version, prompt-version or timestamp attached)
  situation: Exec pastes '38% hesitated at the crafting tutorial' into a board deck on day 1; on day 20 extraction is re-run with a revised prompt and the same question now yields 44%
  consequence: Board sees 38%, a later audit sees 44%, and there is no record of which table state produced 38%
  p_typical: 0.08
  grounded: speculative
  evidence: none
  proposed: Stamp every answer with table_version, question_set_version, prompt_version, extraction_model_version and as-of time; keep immutable snapshots for 12 months
  shallow: false
- id: exec-4
  title: 40 players with failed sessions are silently excluded from the exec's cohort percentage
  level: L3
  cell:
    batch-failure-mix: some-sessions-failed-in-cohort
    processing-status: transcription-failed
    stage: chatbot-answer
    correctness-failure: wrong-denominator
    scale: 500-players
  object: answers table rows for sessions whose videos have processing-status transcription-failed
  situation: 40 of 500 sessions have at least one failed video; the failed sessions are the ones with long or noisy audio and therefore the most likely churners
  consequence: Reported churn is biased low (survivorship), the exec presents 'only 14% churn' and the real figure is higher; nothing in the answer says 40 sessions are missing
  p_typical: 0.08
  grounded: inferred
  evidence: Ingestion time and cost are not a concern.
  proposed: Chatbot states excluded session count and reason, and the failure mix, next to any cohort figure
  shallow: false
- id: exec-5
  title: Exec asks 'why do players leave?' and the bot answers from general game knowledge instead of the table
  level: L3
  cell:
    studio-question-type: cohort-why
    chatbot-response-behaviour: answers-from-general-game-knowledge
    question-shape: question-not-in-set
    stage: chatbot-query-planning
  object: chatbot query planning for a cohort-why question with no matching fixed question
  situation: The fixed set has 12 churn-reason options; none covers 'confusing economy'; the LLM fills the gap with typical F2P tutorial advice not drawn from any of the 500 transcripts
  consequence: Exec quotes generic advice as if it were player evidence; studio ships a change justified by nothing in the data
  p_typical: 0.07
  grounded: speculative
  evidence: The question set is small, so most of what is in the video and transcript is never captured.
  proposed: Planner must tag each sentence of a reply as table-derived or model-general; general knowledge is refused or labelled
  shallow: false
- id: exec-6
  title: Recommendation request ('what should we change?') answered from verbal options when the cause was visual
  level: L3
  cell:
    studio-question-type: recommendation-what-should-we-change
    question-shape: perceptual-cause-not-verbalised
    correctness-failure: perceptual-cause-attributed-to-verbal-option
    stage: chatbot-answer
    speech-shape: silent-player
  object: chatbot recommendation built on the churn-reason option 'instructions unclear'
  situation: The 9 players who stalled at the crafting prompt said nothing because the cue was low-contrast; extractor picked 'instructions unclear' for 7 of them; bot recommends rewriting tutorial text
  consequence: Studio rewrites text, churn does not move; the real fix (cue contrast) was never visible in a transcript
  p_typical: 0.06
  grounded: quote
  evidence: Transcript loses visual information.
  proposed: Bot appends 'not observable from audio' caveat on any why-answer where more than 30% of rows came from silent segments
  shallow: false
- id: exec-7
  title: Cross-studio benchmark question ('how does our tutorial compare to other games') answered with invented or wrong-tenant numbers
  level: L3
  cell:
    studio-question-type: cross-game-or-cross-studio-benchmark
    tenancy: cross-studio-benchmark-request
    chatbot-response-behaviour: invents-number
    stage: access-control
    data-element: studio-tenant
  object: chatbot query planning when the question names no game target of the asking studio
  situation: Exec at studio A asks for the industry average tutorial completion; table holds rows of studios B and C; the bot either refuses with no explanation or returns a figure from B and C or a made-up
    benchmark
  consequence: Studio A sees competitor data (tenancy breach) or quotes a fabricated benchmark in a funding deck
  p_typical: 0.07
  grounded: speculative
  evidence: Buyers are gaming studios.
  proposed: 'Define the behaviour: refuse with a named reason, never mix tenants, never produce a benchmark not in the table'
  shallow: false
- id: exec-8
  title: CSV export of the answers table drops confidence, null-vs-No distinction and version columns
  level: L3
  cell:
    stage: export-and-share
    answer-afterlife: exported-csv
    data-element: answer-confidence
    correctness-failure: null-treated-as-no
  object: export of per-video answers rows
  situation: Exec's analyst exports 500 players x 12 questions; a question that was not answerable in a video is exported as empty and read in Excel as 0 or No
  consequence: Pivot table treats 'not asked or not answerable' as 'No', inflating no-rates; exec decks built on it cannot be traced back
  p_typical: 0.06
  grounded: speculative
  evidence: none
  proposed: Export carries answered / not-observed / not-processed as separate values plus version columns
  shallow: false
- id: exec-9
  title: Shared chatbot link keeps working after the studio is offboarded
  level: L3
  cell:
    stage: export-and-share
    answer-afterlife: shared-link
    tenancy: studio-offboarded
    time-and-change: studio-offboarded
    data-element: chatbot-conversation-log
  object: a shared link to a chatbot answer that quotes player speech
  situation: Exec shared a conversation link with an agency in month 3; studio contract ends in month 9; the link and the quoted transcripts are still reachable on day 300
  consequence: Player speech stays readable by third parties after the contract that allowed it ended
  p_typical: 0.04
  grounded: speculative
  evidence: none
  proposed: Shared links expire at 30 days or at studio offboarding, whichever first
  shallow: false
- id: exec-10
  title: Answer quoted in a deck still cites a player after that player's deletion request
  level: L3
  cell:
    answer-afterlife: cited-after-player-deletion
    time-and-change: player-deletion-request
    stage: aggregate-cache
    data-element: cached-aggregate
    recovery-action: delete-and-propagate
  object: cached aggregate and chatbot conversation log that include the deleted player's rows
  situation: Player deletes consent on day 40; video, transcript, 12 answer rows are removed, but a cached 'quit reasons' aggregate and 3 stored chat conversations still hold the quote
  consequence: Quote lives in cache and in the exec's deck export; the deletion promise is false
  p_typical: 0.05
  grounded: speculative
  evidence: none
  proposed: Deletion job lists every cache key and conversation containing the player id and invalidates it; deck exports carry a notice that quotes may be withdrawn
  shallow: false
- id: exec-11
  title: Exec runs the question at 3am before a 9am board meeting and the answer times out or streams a partial number
  level: L3
  cell:
    time-and-change: studio-asks-at-3am
    latency: first-token-vs-complete-answer
    chatbot-response-behaviour: times-out
    fast-path-dependency: cold-start
    stage: chatbot-query-planning
  object: chatbot first call after hours with no warm cache
  situation: Cold start on a 5000-player table; the first token appears in 3s with 'about 40%' and the complete answer 45s later says 31%; exec screenshots the early text
  consequence: A screenshot of an unfinished answer ends up in the deck
  p_typical: 0.04
  grounded: speculative
  evidence: Answering a studio's question must be fast.
  proposed: Stream only after the number is final, or mark streamed numbers as provisional until the end token
  shallow: false
- id: exec-12
  title: Quote shown to the exec as evidence is the moderator's leading line, credited to the player
  level: L3
  cell:
    stage: evidence-display
    studio-question-type: quote-me-evidence
    speech-shape: moderator-speaking-or-leading
    correctness-failure: moderator-words-attributed-to-player
    data-element: utterance
  object: utterance in a transcript with two speakers and no diarisation
  situation: Moderator says 'try the button on the left' at 03:12; transcript has one speaker label; extractor answers 'player followed hint' and the quote tool returns that sentence as the player's
  consequence: Exec reads out the moderator's sentence as a player's words in front of the studio
  p_typical: 0.06
  grounded: inferred
  evidence: The answers form a structured table per video.
  proposed: Quotes need a speaker label and a timestamp; unlabelled speakers cannot be shown as a player quote
