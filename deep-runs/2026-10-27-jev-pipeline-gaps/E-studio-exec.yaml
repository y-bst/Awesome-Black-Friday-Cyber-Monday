  level: L3
  cell:
    stage: evidence-display
    studio-question-type: quote-me-evidence
    transcription-subsystem: hallucinated-text-on-silence-or-music
    speech-shape: silent-player
    correctness-failure: transcription-hallucination-propagated
  object: evidence-span for an answer such as 'player said the tutorial was boring'
  situation: Speech-to-text emits 'thanks for watching' or an invented sentence during 40 s of silence; extractor treats it as speech; the quote tool returns it with a timestamp
  consequence: A line the player never said appears under the player id in a deck
