- id: "extract-1"
  case: "The spec's own design guarantees this fires on every multi-video session: 'each video is capped at 15 minutes, so one session is many videos', 'the answers form a structured table per video', and the targets are 'mostly detecting churn in the tutorial and just after it'. A 3-hour session has 12 videos, the tutorial lives in one or two of them, yet every video is asked 'Why did the player leave the tutorial?' with only content options A-D, so the extractor must pick a reason for 10 videos that contain no tutorial at all. Those 10 fabricated rows land in the same column as the 2 real ones, so a cohort count of 'reason = unclear instructions' can be inflated up to 10x per player, and the inflation grows with session length, which the owner already names as a known problem. The studio designer who asks the chatbot 'what is the top tutorial churn reason?' gets a ranking driven by long-session noise and reprioritises tutorial work on it. Because the bad values are well-formed options, nothing downstream can filter them out later; every row ingested today without a NOT_APPLICABLE value is permanently contaminated and must be re-extracted. The fix is two reserved options plus one labelled-set assertion (NOT_APPLICABLE >= 95% on videos with no tutorial speech), a one-day change to the question schema that must land before more studios' tables are filled."
- id: "ops-1"
  case: "The spec says 'a session can be n hours; each video is capped at 15 minutes, so one session is many videos', which makes partial failure a matter of when, not if: an 8-video session gives the speech-to-text vendor eight chances to 5xx, and at hundreds of players per cohort some sessions will always be missing videos. Today there is no 'partial' status, so when videos 3 and 7 fail, the session-level answer 'player quit during tutorial: No' is computed from 6 of 8 videos and stored as if complete, even though the missing 30 minutes may be exactly where the quit happened. The chatbot then counts that session at full weight in a 500-player churn figure, and neither the studio analyst nor the JEV on-call engineer has any field that reveals the gap, so the error is invisible by construction. Because 'ingestion time and cost are not a concern', there is no excuse for silently accepting incomplete input: retrying a failed video is cheap, a wrong churn number given to a paying studio is not. The fix is small and mechanical (videos_expected, videos_complete, session status = min over videos, aggregation flags coverage < 100%, retry keyed on session_id and video_index), but it must exist before more data accumulates, because sessions already aggregated without these fields cannot be told apart from complete ones afterwards. Every onboarding that happens before this ships adds churn numbers that may be quietly computed on three-quarters of the evidence."
- id: "design-32"
  case: "The spec says 'the transcript is run through a fixed set of questions with options', and nothing defines what happens when a player gives two real reasons, which is the normal case in think-aloud: 'I do not get the roll and also the enemy hits too hard' names both controls and difficulty. A single-choice extractor must drop one, and LLMs systematically favour the first-listed option under ambiguity, so the stored label is decided by the question author's option order rather than by the player. That label is exactly what the studio's designer acts on: the chatbot reports 'controls confusing' as the top tutorial churn cause and the team spends a sprint reworking the roll input while the enemy damage that also drove players away stays untouched. Because the bias is consistent across all 500 players, it does not average out; it produces a confident, stable, wrong ranking that looks like signal. Nothing in the answers table records that a second cause was present, so the studio cannot recover it later without re-reading transcripts, which is the very cost the table exists to avoid. Allowing multi-select with a primary flag and randomising option order in the prompt is a schema and prompt change, cheap now and expensive after every studio's historical table has been filled with order-biased single labels."
- id: "skeptic-8"
  case: "The spec defines questions as 'a fixed set of questions with options, written per game target' and the frame says each has 3-6 options answered once per video by an LLM, with no abstain or 'other' option, so the model is forced to pick even when the player's real reason (a phone call, a battery warning, dinner) is on no list. An LLM forced to choose will pick the most semantically nearby option, typically 'boring', so every off-list cause is silently converted into a design verdict about the game. The owner already says 'the question set is small, so most of what is in the video and transcript is never captured', which means off-list causes are not an edge case but the expected majority of the uncaptured mass. The studio then sees a cohort chart in which boredom is inflated by every interruption and every unlisted reason, and may cut or re-pace tutorial content that was never the problem. Worse, with no 'not discussed' or 'other (free text)' bucket, JEV has no measurement of how often the option list fails, so the question framework the owner wants to improve (goal b) has no feedback signal at all. Adding the two options and tracking their weekly share per question is a small change that both stops the inflation and gives the question authors the data they need to grow the set; every week without it adds forced picks that cannot be distinguished from genuine answers."
- id: "ds-1"
  case: "The spec says 'the answers form a structured table per video' and gives no coding for a missing or failed answer, so when question 7 fails extraction on 40 of 500 players' videos, the cell is empty and the chatbot's SQL either counts it as 'No' or drops it without saying so. The studio asking 'how many players were confused at step 2?' then gets 31% of 500 when the valid figure is 33.7% of 460, and no reply can say which denominator was used because the table itself does not know. This is the core promise of the product, fast answers over hundreds of players, failing at its most basic layer: every percentage the chatbot produces has an undefined denominator, and the error grows with each extraction failure, vendor outage, or new question added mid-cohort. The people harmed are the studio analyst and exec who compare cohorts or builds week over week, since a shift in failure rate will masquerade as a shift in player behaviour. It also blocks the owner's goal (a), improving how the chatbot answers from the store, because no answer-quality work can be trusted while 'No', 'failed' and 'not applicable' share one representation. A status column per (video, question) and an n_answered next to every n_total is a cheap schema change today; after more studios' tables are populated, backfilling which blanks meant failure versus absence is impossible."
