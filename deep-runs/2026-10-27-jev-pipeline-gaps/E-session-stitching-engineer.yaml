  cell: {stage: session-stitching, data-element: session, session-shape: same-player-multiple-sessions, correctness-failure: answer-attached-to-wrong-video-index, scale: 500-players}
  object: "Unspecified: 'how videos of one session are linked'"
  situation: "Player P plays 10:00-10:45 (3 videos) and 16:00-18:00 (8 videos) on 2026-10-27; with no session_id written at capture time, stitching by player id + date produces one 11-video session with a 5-hour hole between video 3 and video 4."
  consequence: "Session duration reads 8 h instead of 2 h 45 min; 'did the player quit after the tutorial' is answered from the second sitting; the 10:45 quit is lost as a churn event."
  p_typical: 0.25
  grounded: quote
  evidence: "Unspecified: ... how videos of one session are linked."
  proposed: "Recorder mints session_id at capture start and writes it plus video_index into every video's metadata; stitching never infers sessions from player id + date."
  shallow: false
