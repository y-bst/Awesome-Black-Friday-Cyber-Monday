  object: "'each video is capped at 15 minutes, so one session is many videos'; per-video rows of the answers table"
  situation: "Upload of video 3 of an 8-video session fails, is retried 40 minutes later and lands after videos 4 and 5; the pipeline assigns index by arrival order."
  consequence: "Answer 'player first got stuck in video 3 (30-45 min)' becomes 'video 5 (60-75 min)'; a timeline query for that player shows the stuck moment after the quit-intent moment."
  p_typical: 0.12
  grounded: inferred
  evidence: "A session can be n hours; each video is capped at 15 minutes, so one session is many videos."
  proposed: "Order by recorder-written video_index (monotonic per session_id); test: shuffle upload order of 8 videos, assert identical stored indexes."
  shallow: false
