  object: Session-level build_id tag; Step 1 'one session is many videos'
  situation: "A store-forced update lands at 00:47 of a 2-hour session; the player restarts the client, the recorder keeps the same session id, and videos 5-8 run on 1.4.3, whose post-tutorial first quest was rewritten. build_id was read once at record start and written to the session row; no video row says 1.4.3."
  consequence: In a 300-session cohort where 40 sessions straddle the patch, about 160 post-patch videos are counted under 1.4.2. 'Did churn just after the tutorial drop in 1.4.3?' compares a 1.4.2 arm that already contains 1.4.3 behaviour, shrinking the measured difference.
