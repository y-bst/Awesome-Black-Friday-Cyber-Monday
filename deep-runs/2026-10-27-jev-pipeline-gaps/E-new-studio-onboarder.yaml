- id: onboard-15
  title: "No acceptance test before go-live: CS cannot show the studio that 20 answers match a human's reading"
  level: L3
  cell: {stage: studio-feedback-loop, data-element: answer, correctness-failure: hallucinated-answer, answer-afterlife: disputed-by-studio, time-and-change: first-game-onboarded}
  object: "Spec has no accuracy or review step between extraction and the table"
  situation: "On day 3 the studio's UX lead watches 1 video and sees that the table says 'no confusion' where she saw a player stuck for 90 seconds."
  consequence: "There is no sampling procedure, no labelled sample, no per-question accuracy, so CS cannot say whether it is 1 error in 10 or in 2; trust is lost with the first disputed row."
  p_typical: 0.2
