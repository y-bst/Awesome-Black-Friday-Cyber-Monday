- id: onboard-1
  title: "New game with 0 players has no question set row in the registry, so the first studio question gets an undefined reply"
  level: L3
  cell: {stage: question-set-registry, scale: 0-players-new-game, time-and-change: first-game-onboarded, studio-question-type: what-can-you-answer, chatbot-response-behaviour: says-no-data-correctly}
  object: "Step 3: 'a fixed set of questions with options, written per game target'"
  situation: "A CS person creates the studio's tenant on day 0 and the studio analyst opens the chatbot before any session is uploaded; the table has 0 rows and possibly 0 questions for this game target."
  consequence: "The bot may return an empty result, a generic answer from another game's table, or a made-up one; the first impression of the product is an unspecified behaviour."
  p_typical: 0.15
  grounded: inferred
  evidence: "The transcript is run through a fixed set of questions with options, written per game target."
  proposed: "Define the 0-row reply: 'No sessions processed for <game> yet; question set v0 has N questions' and test it for N=0 and N>0."
  shallow: false
- id: onboard-2
  title: "No stated time budget from signed studio to first queryable answer"
  level: L4
  cell: {stage: upload-and-ingest, time-and-change: first-game-onboarded, latency: "ingest-to-queryable (hours or days after session)", processing-status: queued, scale: 50-players}
  object: "Constraints: 'Ingestion time and cost are not a concern.'"
  situation: "The first 50 players record on Monday; each 3-hour session is 12 videos of 15 minutes (600 videos); the studio expects a demo on Tuesday."
  consequence: "Nothing in the spec says how many hours from upload to a row in the table; CS cannot promise a date, and a queue of 600 videos behind another studio's backfill is invisible."
  p_typical: 0.2
  grounded: quote
  evidence: "Ingestion time and cost are not a concern. Answering a studio's question must be fast."
  proposed: "Set an ingest-to-queryable target (for example p95 under 24 hours for a session) and show per-session status to CS."
  shallow: false
- id: onboard-3
  title: "Tutorial-less game: 'where in the tutorial did they quit' questions are forced into an option"
  level: L3
  cell: {stage: answer-options, question-shape: fits-no-option, correctness-failure: forced-choice-bias, data-element: tutorial-step, time-and-change: first-game-onboarded}
  object: "Step 3: 'targets are mostly detecting churn in the tutorial and just after it'"
  situation: "A sandbox or open-world game has no tutorial; the standard churn question 'Which tutorial step did the player stop at?' with options Step 1 to Step 5 is copied from the template and run over 12 videos."
  consequence: "The LLM must pick one of 5 steps or Other, so the table fills with invented steps and the studio sees a tutorial-drop-off funnel for a tutorial that does not exist."
  p_typical: 0.2
  grounded: inferred
  evidence: "The targets are mostly detecting churn in the tutorial and just after it."
  proposed: "Require every question to carry a 'not applicable to this game' option and a per-game applicability flag set at onboarding."
  shallow: false
- id: onboard-4
  title: "Studio target is mid-game retention, but the set only covers 'tutorial and just after it'"
  level: L3
  cell: {stage: fixed-question-set, time-and-change: game-target-changes-beyond-tutorial, question-shape: question-not-in-set, studio-question-type: question-outside-game-target, recovery-action: backfill-after-question-set-change}
  object: "Step 3: targets 'mostly detecting churn in the tutorial and just after it'"
  situation: "In week 2 the studio asks 'why do players stop at level 8'; the 500 sessions already ingested were only asked tutorial-era questions."
  consequence: "Answering requires re-running extraction over 500 players x about 8 videos = 4000 videos, or raw transcripts (the thing the table was built to avoid); no rule says which."
  p_typical: 0.3
  grounded: quote
  evidence: "The question set is small, so most of what is in the video and transcript is never captured."
  proposed: "Write the escalation rule: if the question is outside the set, offer a queued backfill with an ETA, and log the question for the next set revision."
  shallow: false
- id: onboard-5
  title: "A 5-player pilot is reported as percentages with no sample size"
  level: L4
  cell: {stage: chatbot-answer, scale: 1-player, studio-question-type: cohort-count, correctness-failure: wrong-denominator, time-and-change: first-game-onboarded}
  object: "Constraint: 'a question over, say, 500 players is fast'"
  situation: "The pilot has 5 players, 2 of whom have sessions still transcribing; the analyst asks 'what share of players got lost in the first 5 minutes'."
  consequence: "Bot answers '60%' (3 of 5) when the denominator is 3 completed sessions out of 5 enrolled; the studio takes a 5-person pilot as a finding."
  p_typical: 0.09
  grounded: inferred
  evidence: "a question over, say, 500 players is fast"
  proposed: "Every count answer states 'n completed of N enrolled' and warns below a minimum n (for example 30)."
  shallow: false
- id: onboard-6
  title: "Second game from the same studio reuses the tenant and the bot joins both games' tables"
  level: L3
  cell: {stage: answers-table, tenancy: one-studio-many-games, question-set-version-state: per-game-fork, studio-question-type: compare-two-steps, correctness-failure: right-answer-wrong-player}
  object: "Step 3: 'written per game target'; Step 4: 'the answers form a structured table per video'"
  situation: "A studio onboards game B after game A; both share question id 'tut_confusion' but with different option lists; the analyst asks about 'the tutorial' without naming a game."
  consequence: "Rows from game A and B are summed under one question id, or the bot picks a game silently; no spec rule says whether game is a required filter."
  p_typical: 0.07
  grounded: speculative
  evidence: "none"
  proposed: "Make game_id a mandatory key on every row and make the bot ask which game when the studio has 2 or more."
  shallow: false
- id: onboard-7
  title: "Question template copied from a previous studio's game carries that game's mechanic names and answers"
  level: L3
  cell: {stage: question-set-registry, question-set-version-state: per-game-fork, tenancy: many-studios-shared-infra, data-element: question, time-and-change: first-game-onboarded}
  object: "Step 3: 'written per game target'"
  situation: "To meet a 2-day onboarding, CS clones studio X's question set for studio Y; option text still says 'Forge screen' and 'Gold chest', terms studio X's players used."
  consequence: "Studio Y sees option labels from a competitor's game (leak of studio X's design vocabulary), and the extraction LLM maps Y's players to X's words, producing wrong answers."
  p_typical: 0.05
  grounded: speculative
  evidence: "none"
  proposed: "Clone only from a game-neutral template library and diff option text for game-specific nouns before activation."
  shallow: false
- id: onboard-8
  title: "Studio edits options in week 1 after seeing first answers, leaving 3 versions in the table"
  level: L4
  cell: {stage: rerun-and-backfill, question-set-version-state: mixed-versions-in-table, scale: 500-players-x-3-question-set-versions, correctness-failure: mixed-version-aggregation, recovery-action: backfill-after-question-set-change}
  object: "Step 3 answers 'form a structured table per video'; no version column is described"
  situation: "Players 1-120 answered under v1, 121-300 under v2 (option 'Unclear UI' split into 'Unclear text' and 'Unclear icon'), 301-500 under v3; backfill of v1 rows is still running."
  consequence: "'Unclear UI' count is computed over 120 rows, 'Unclear text' over 380, and the percentages sum to over 100% when the bot adds them."
  p_typical: 0.09
  grounded: inferred
  evidence: "none"
  proposed: "Store question_set_version on each row; the bot filters to one version or states the mix; show backfill progress (rows at v3 / total)."
  shallow: false
- id: onboard-9
  title: "Studio in Brazil or Japan: option text in English, speech in another language, no onboarding language check"
  level: L3
  cell: {stage: language-detection, speech-shape: non-english, question-shape: fits-an-option, correctness-failure: forced-choice-bias, transcription-subsystem: wrong-language-detected}
  object: "Unspecified: 'languages'"
  situation: "A Japanese studio onboards; 40% of its testers speak Japanese, 60% English; the question set is authored in English only."
  consequence: "Transcript of Japanese speech is mis-detected as English for some of the 12 videos per session; answers skew to 'No complaint' and the studio sees fewer problems among Japanese players."
  p_typical: 0.08
  grounded: quote
  evidence: "Unspecified: ... languages"
  proposed: "Onboarding form lists expected languages; an acceptance test runs 3 sample videos per language and reports transcript word error rate before go-live."
  shallow: false
- id: onboard-10
  title: "New studio's playtest moderators lead players and no onboarding step trains or detects it"
  level: L3
  cell: {stage: recruitment-and-consent, speech-shape: moderator-speaking-or-leading, data-element: moderator, correctness-failure: moderator-words-attributed-to-player, time-and-change: first-game-onboarded}
  object: "Step 2: 'Each video is converted to a transcript'"
  situation: "Studio staff, not our playtest ops, run the first 20 sessions and say 'try tapping the left button' at minute 3; the transcript has no speaker label."
  consequence: "The question 'Did the player find the next action unaided' answers Yes because the instruction is credited to the player; tutorial clarity looks 20 points better than reality."
  p_typical: 0.05
  grounded: inferred
  evidence: "none"
  proposed: "Moderator guide in the onboarding kit; diarisation or a moderator-present flag per session that the question runner receives."
  shallow: false
- id: onboard-11
  title: "New game's anti-cheat or DRM yields a black capture while audio is fine, found only after 100 sessions"
  level: L4
  cell: {stage: video-capture, capture-integrity: video-black-or-frozen, processing-status: complete, question-shape: answer-needs-visuals, time-and-change: first-game-onboarded}
  object: "Step 2: 'what is on screen is largely lost'"
  situation: "Capture of the new game's exclusive-fullscreen window returns black frames; the speech transcript is normal, so every job ends in status complete."
  consequence: "No one is told that the video holds no visual information; if visual analysis is added later it silently runs on 100 black sessions; CS discovers it when the studio asks for a clip."
  p_typical: 0.05
  grounded: inferred
  evidence: "The owner's view: the transcript alone is not enough; what is on screen is largely lost."
  proposed: "Onboarding smoke test: record 1 session and check mean frame luminance and frame-difference rate above thresholds; alert on sessions below them."
  shallow: false
- id: onboard-12
  title: "Mobile game recorded via emulator or screen-cast: device-platform tag says PC"
  level: L3
  cell: {stage: build-and-metadata-tagging, data-element: device-platform, capture-integrity: wrong-window-captured, studio-question-type: compare-two-versions, correctness-failure: right-answer-wrong-player}
  object: "Step 1: 'a player's gameplay session is captured as video'"
  situation: "A mobile studio tests on a desktop emulator for convenience, and the upload form default device is 'PC'; 30 of 100 sessions carry the wrong tag."
  consequence: "'Compare iOS and Android drop-off' includes touch-vs-mouse differences, and tap errors that exist only on real phones are missed."
  p_typical: 0.04
  grounded: speculative
  evidence: "none"
  proposed: "Make device, build and game_version required fields with no default, with a validation list per studio set at onboarding."
  shallow: false
- id: onboard-13
  title: "Music-heavy or voiced-NPC game: game audio dominates and the transcript is full of NPC lines credited to the player"
  level: L3
  cell: {stage: transcription, speech-shape: game-audio-dominates, transcription-subsystem: game-lyrics-or-npc-voice-transcribed-as-player, correctness-failure: transcription-hallucination-propagated, question-shape: unknowable-from-audio}
  object: "Assumption: 'transcript is speech-to-text of the player's think-aloud plus any game audio'"
  situation: "The new game has a fully voiced tutorial narrator speaking 60% of the first 10 minutes and the player says little."
  consequence: "The question 'Did the player express confusion' reads the narrator's 'Don't worry, you can do it!' as player speech and answers Yes; the table fills with NPC confusion."
  p_typical: 0.08
  grounded: quote
  evidence: "transcript is speech-to-text of the player's think-aloud plus any game audio"
  proposed: "Per-game audio setup in onboarding: record the mic and the game on separate channels, or tag NPC lines, and test with 1 sample."
  shallow: false
- id: onboard-14
  title: "Casual mobile players never talk; 50 sessions yield an all-unknown table"
  level: L4
