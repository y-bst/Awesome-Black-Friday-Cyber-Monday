  object: "Step 2: 'The owner's view: the transcript alone is not enough'"
  situation: "A hyper-casual studio recruits 50 players, none instructed to think aloud; 42 of 50 transcripts are empty."
  consequence: "The question 'Did the player say they were confused' stores No for 42 rows; the bot reports '16% confused' (8 of 50) with no sign that 84% of rows carry no signal."
  p_typical: 0.09
  grounded: inferred
  evidence: "none"
  proposed: "Pre-onboarding fit check: sample 5 sessions and compute speech minutes per hour; if under a threshold (for example 5 minutes), warn the studio that this pipeline is speech-dependent."
