  level: L4
  cell: {"stage": "language-detection", "speech-shape": "non-english", "processing-status": "complete", "transcription-subsystem": "wrong-language-detected", "scale": "500-players"}
  object: "Unspecified: 'languages'; Step 2 'Each video is converted to a transcript'"
  situation: "A 500-player cohort recruited across EU markets is transcribed with a fixed en-US setting; 180 players spoke German, French or Italian"
  consequence: "180 players' videos produce English-looking nonsense ('I'm the cheese of the garden'), are answered with high 'other' rates and counted in every denominator; no row distinguishes them from English speakers"
  p_typical: 0.25
  grounded: quote
  evidence: "languages"
  proposed: "Add a language-detection stage that writes transcript_language and detection_confidence per video and routes to a per-language ASR configuration; block extraction when confidence is below 0.6"
  shallow: false
- id: l10n-27
  title: "A word-count threshold for 'silent player' counts a 300-character Japanese transcript as 1 word because the script has no spaces"
  level: L4
  cell: {"stage": "transcription", "transcription-subsystem": "empty-transcript-for-non-empty-video", "processing-status": "transcript-empty", "speech-shape": "non-english", "recovery-action": "skip-and-mark-unknown", "data-element": "null-vs-no"}
  object: "Any rule of the form 'skip extraction when word count < N' applied to Step 2 output"
  situation: "A talkative Osaka player produces 300 characters of unspaced Japanese per video; the word counter splits on whitespace and returns 1"
  consequence: "Every video of the player is marked silent and skipped (or answered unknown); the Japanese cohort's effective sample size collapses to the few players whose ASR inserted spaces"
  p_typical: 0.02
  grounded: inferred
  evidence: "none"
  proposed: "Measure speech by seconds of voiced audio or by tokenizer token count, never whitespace words; set the threshold per language"
  shallow: false
- id: l10n-28
  title: "Token-heavy scripts (Thai, Japanese, Burmese) push a 15-minute transcript past the extraction context limit, so the last minutes are silently truncated for those languages only"
  level: L4
  cell: {"stage": "extraction-prompt", "transcription-subsystem": "truncated-at-length-limit", "speech-shape": "non-english", "question-shape": "answer-changes-within-video", "correctness-failure": "confident-no-evidence"}
  object: "Step 3 extraction prompt that includes the full per-video transcript plus questions"
  situation: "A continuous Thai think-aloud video tokenizes to 2.5-3x the tokens of the same speech in English; with a 50-question set the prompt exceeds the context and the tail of the transcript is cut"
  consequence: "The quit moment at 13:50 is never seen by the extractor for Thai players; 'did the player quit in this video' is answered No with confidence, and the pattern never appears in English cohorts"
  p_typical: 0.04
  grounded: inferred
  evidence: "The transcript is run through a fixed set of questions with options"
  proposed: "Count tokens per transcript before extraction and chunk or summarise above 80% of the limit; store tokens_in and truncated=true/false on every extraction-run-id"
  shallow: false
