- id: l10n-31
  title: "Low-confidence segment dropping removes 2-3x more speech from non-English transcripts, so non-English cohorts are systematically shorter and under-answer every 'did the player say' question"
  level: L4
  cell: {"stage": "transcription", "transcription-subsystem": "low-confidence-segments-dropped-silently", "speech-shape": "non-english", "scale": "500-players", "correctness-failure": "wrong-denominator"}
  object: "Step 2 transcript and the per-video answers it feeds"
  situation: "The ASR vendor's mean confidence is 0.91 for en-US and 0.74 for vi-VN on the same mic setup; a 0.7 drop threshold removes 4% of English segments and 31% of Vietnamese segments"
  consequence: "Vietnamese players appear to say less, express less and quit less; any cohort comparison that includes them is biased in the direction of 'fine' and the stored transcript carries no count of dropped segments"
  p_typical: 0.03
  grounded: inferred
  evidence: "Each video is converted to a transcript."
  proposed: "Store segments_dropped and mean_confidence per video; have the chatbot attach a per-language confidence note when a cohort mixes languages whose mean confidence differs by more than 0.1"
  shallow: false
- id: l10n-32
  title: "The chatbot answers a question about a feature by its English wiki name when the studio's localised build calls it something else, inventing a step that never existed in that cohort's game"
  level: L4
  cell: {"stage": "chatbot-answer", "chatbot-response-behaviour": "answers-from-general-game-knowledge", "studio-question-type": "question-about-a-step-the-set-never-asked", "data-element": "game-target", "speech-shape": "non-english"}
  object: "Step 4 chatbot with no game string table; Step 3 question set per game target"
  situation: "A Korean analyst asks about '대장간 단계' (the Forge step); the table has no row for it because the question set was written for 'Smithy'; the chatbot answers from its own knowledge of the English game"
  consequence: "The answer describes a step by a name the Korean build never used and cites no row; the analyst cannot tell it is not from the table"
  p_typical: 0.03
