- id: l10n-1
  title: "Options written in English are matched against a Japanese transcript with no translation step, so the extraction LLM translates on the fly and the mapping is undefined"
  level: L4
  cell: {"stage": "extraction-prompt", "speech-shape": "non-english", "data-element": "option", "correctness-failure": "other-option-overused", "question-shape": "fits-an-option"}
  object: "Step 3 'a fixed set of questions with options, written per game target' and the Unspecified line 'languages'"
  situation: "A 15-minute video whose transcript is Japanese ('むずすぎ、どこ押せばいいの') is run against the English option list [confused by controls / lost interest / instructions unclear / other]"
  consequence: "The same utterance lands on 'confused by controls' in one run and 'instructions unclear' in the next because the model translates before matching; across 500 players the 'other' share for Japanese sessions runs 2-3x the English share with no field recording that the transcript language differed from the option language"
  p_typical: 0.30
  grounded: quote
  evidence: "languages"
  proposed: "Store transcript_language per video; ship question/option text in the transcript language (per-language fork keyed on the same option id) and reject extraction when transcript_language has no matching option-set language"
  shallow: false
- id: l10n-2
  title: "Language is auto-detected per 15-minute video, so one bilingual session is transcribed in two languages and answered against two option sets"
  level: L4
  cell: {"stage": "language-detection", "transcription-subsystem": "language-flips-between-videos", "session-shape": "5-20-videos", "speech-shape": "mixed-language", "correctness-failure": "inconsistent-across-videos"}
  object: "Step 2 'Each video is converted to a transcript' applied per video, with no session-level language field"
  situation: "A Montreal player speaks French for videos 1-4, switches to English for video 5 (a friend joins), back to French for 6-8; the ASR detects language on the first 30 seconds of each video"
  consequence: "Video 5's transcript is English and its answers use the English option labels; session-level aggregation sees a row whose option ids match but whose source language flipped; a 'did the player ever say X' count for that player depends on which video the query reads"
  p_typical: 0.15
  grounded: inferred
  evidence: "Each video is converted to a transcript."
  proposed: "Detect language once per session (majority over all videos, stored on session) and pass it as a forced language hint to every video's ASR; record per-video detected language as a secondary field and flag sessions where it disagrees"
  shallow: false
- id: l10n-3
  title: "Speech-to-text vendor masks profanity, so the strongest frustration signal is removed before the 'expressed frustration' question is asked"
  level: L4
  cell: {"stage": "transcription", "transcription-subsystem": "profanity-masked-by-vendor", "speech-shape": "profanity-or-slang", "question-shape": "fits-an-option", "correctness-failure": "null-treated-as-no"}
  object: "Step 2 transcript feeding Step 3 question 'Did the player express frustration during the tutorial?'"
  situation: "The player says 'what the f*** am I supposed to do here' at 07:12; the vendor's default profanity filter emits 'what the **** am I supposed to do here' or drops the word"
  consequence: "The extractor reads a neutral question and answers 'No frustration'; on a 500-player cohort the frustration count for the tutorial step is understated by every swearing player, and nobody can tell because the masking is invisible in the stored transcript"
  p_typical: 0.20
  grounded: inferred
  evidence: "Each video is converted to a transcript."
  proposed: "Disable vendor profanity masking at the ASR call (profanity_filter=false) and store a per-video flag profanity_masked so old transcripts can be identified and re-transcribed"
  shallow: false
- id: l10n-4
  title: "Gaming slang ('this is cooked', 'gg', 'mid', 'skill issue') is mapped to the wrong option by the extractor"
  level: L4
  cell: {"stage": "per-video-answers", "speech-shape": "profanity-or-slang", "question-shape": "fits-two-options", "correctness-failure": "perceptual-cause-attributed-to-verbal-option", "data-element": "utterance"}
  object: "Step 3 options for the churn question, e.g. [too hard / boring / confusing / other]"
  situation: "Player says 'nah this tutorial is cooked, gg' at 11:40 and quits; 'cooked' here means broken/hopeless and 'gg' means giving up, not a win"
  consequence: "The extractor picks 'boring' or 'other' for a player who quit because the step felt broken; a studio count of 'players who found the tutorial broken' misses the players who used the most current slang, which skews younger"
  p_typical: 0.12
  grounded: inferred
  evidence: "The transcript is run through a fixed set of questions with options, written per game target."
  proposed: "Maintain a per-game slang glossary (term, meaning, example, date added) injected into the extraction prompt, and add a regression set of 30 slang utterances with expected options re-run on every prompt or model change"
  shallow: false
- id: l10n-5
  title: "A studio analyst asks in Korean about English-language sessions and the chatbot has no rule for which language the answer, the option labels and the quoted evidence come back in"
  level: L3
  cell: {"stage": "chatbot-answer", "studio-question-type": "one-player-what-happened", "speech-shape": "non-english", "chatbot-response-behaviour": "differs-on-re-ask", "data-element": "studio-tenant"}
  object: "Step 4 'A chatbot for the gaming studio answers the studio's questions from that table'"
  situation: "A Seoul analyst types '튜토리얼 2단계에서 혼란스러워한 플레이어는 몇 명?' against a cohort whose transcripts and option labels are English"
  consequence: "The reply is Korean in one conversation and English in the next; option label 'instructions unclear' is rendered as three different Korean phrases across answers, so the analyst cannot tell whether two answers refer to the same option"
  p_typical: 0.08
  grounded: quote
  evidence: "A chatbot for the gaming studio answers the studio's questions from that table"
  proposed: "Define reply_language = analyst's question language; always print option id and the canonical option label in the option-set language in brackets after any translated label"
  shallow: false
- id: l10n-6
  title: "Code-switched speech (Hinglish, Taglish, Spanglish) inside one utterance is transcribed with a single-language ASR so one half of every sentence is garbled"
  level: L4
  cell: {"stage": "transcription", "speech-shape": "mixed-language", "transcription-subsystem": "wrong-language-detected", "question-shape": "unknowable-from-audio", "correctness-failure": "transcription-hallucination-propagated"}
  object: "Step 2 'Each video is converted to a transcript' with language unspecified"
  situation: "A Manila player says 'ang hirap nito, where is the attack button ba?'; the ASR locked to en-PH renders 'ang hirap nito' as 'and here up neato'"
  consequence: "The frustration phrase (ang hirap = this is hard) is lost and the English fragment is kept, so 'too hard' is never selected; the garbled text can also be read as nonsense and pushed to 'other'"
  p_typical: 0.07
  grounded: inferred
  evidence: "Each video is converted to a transcript."
  proposed: "Use an ASR mode that supports code-switching for the session's locale pair (configured from the player's country and game locale) and store per-segment language tags in the transcript"
  shallow: false
- id: l10n-7
  title: "A last video under 1 minute has too few words for language detection, is detected as the wrong language and stored as gibberish with status complete"
  level: L4
  cell: {"stage": "language-detection", "session-shape": "last-video-under-1-minute", "transcription-subsystem": "wrong-language-detected", "processing-status": "complete", "data-element": "video"}
  object: "Step 1 'each video is capped at 15 minutes' leaving a final short remainder video"
  situation: "The final 40-second video of an English session contains only 'ok, done, danke' as the player signs off to a German-speaking moderator; the detector picks de-DE and transcribes the 40 seconds as German"
  consequence: "The session's last video, which carries the quit moment, is a German-language nonsense transcript answered against English options; the 'why did the player stop' question for that session is answered from noise, and the row shows complete"
  p_typical: 0.05
  grounded: inferred
  evidence: "each video is capped at 15 minutes, so one session is many videos."
  proposed: "Below 20 seconds of speech or 30 words, inherit the session language instead of detecting; store detection_confidence and refuse to extract below 0.6"
  shallow: false
- id: l10n-8
  title: "Per-language translation of the question set merges or splits options, so the Japanese fork has 4 options where the English has 5 under the same question-set-version id"
  level: L3
  cell: {"stage": "question-set-registry", "question-set-version-state": "per-game-fork", "data-element": "question-set-version", "correctness-failure": "mixed-version-aggregation", "studio-question-type": "cohort-count"}
  object: "Step 3 'written per game target' with no mention of a per-language variant"
  situation: "A translator renders 'instructions unclear' and 'confusing UI' as one Japanese option because the distinction does not translate; the registry stores the Japanese set under the same version id as the English set"
  consequence: "A cohort count of 'instructions unclear' over 500 players sums English option 3 with a Japanese option that also contains English option 4; the number is not reproducible and no field records that the option cardinality differs by language"
  p_typical: 0.05
  grounded: inferred
  evidence: "written per game target"
  proposed: "Make language a dimension of question-set-version (set_id, version, language); require option id sets to be identical across languages and fail registry validation when counts differ"
  shallow: false
- id: l10n-9
  title: "Option labels localised with stable ids drift in meaning ('confused' / 'perdido' / '困惑') so cross-language cohort counts compare different concepts"
  level: L3
  cell: {"stage": "answer-options", "data-element": "option", "speech-shape": "non-english", "studio-question-type": "segment-by-metadata (device, country, build)", "correctness-failure": "mixed-version-aggregation"}
  object: "Step 3 option text and Step 4 cohort counting over the answers table"
  situation: "Spanish option 'perdido' (lost, spatially) was chosen as the translation of English 'confused' (cognitively); Spanish players who say 'no entiendo' are not matched to 'perdido' while English players who say 'I don't get it' are matched to 'confused'"
  consequence: "A studio comparison of confusion rate Spain vs UK shows 11% vs 29% and the studio concludes the Spanish tutorial is better; the difference is the translation"
  p_typical: 0.04
  grounded: inferred
  evidence: "The transcript is run through a fixed set of questions with options, written per game target."
  proposed: "Back-translate every localised option and store a definition line per option id that the extractor sees in all languages; run a 50-utterance bilingual parity test per option before a language fork ships"
  shallow: false
- id: l10n-10
  title: "Chatbot reply language is undefined, so an analyst who asks in Portuguese gets an English answer and an English column name they must translate themselves"
  level: L4
  cell: {"stage": "chatbot-answer", "studio-question-type": "cohort-why", "chatbot-response-behaviour": "answers-correctly", "data-element": "studio-tenant", "latency": "under-2s"}
  object: "Step 4 chatbot, Constraint 'Answering a studio's question must be fast'"
  situation: "A Sao Paulo analyst asks 'por que os jogadores abandonam o tutorial?'; the table's option labels and the prompt are English"
  consequence: "The answer comes back in English with option labels 'instructions unclear (41%)'; the analyst pastes it into a Portuguese deck with their own translation, which differs from a colleague's translation of the same label"
  p_typical: 0.08
  grounded: quote
  evidence: "Answering a studio's question must be fast."
  proposed: "Reply in the question's language; localise option labels from the registry's per-language fork rather than ad hoc, and show the option id"
  shallow: false
- id: l10n-11
  title: "Evidence quote shown to a Korean analyst is a machine translation of a Japanese utterance presented as verbatim"
  level: L4
  cell: {"stage": "evidence-display", "studio-question-type": "quote-me-evidence", "data-element": "evidence-span", "speech-shape": "non-english", "answer-afterlife": "copied-into-deck"}
  object: "Step 4 chatbot answer plus the evidence it quotes from the transcript"
  situation: "The analyst asks 'show me what the player said when they quit' and the chatbot translates 'もういいや' (I'm done / whatever) into Korean inline, in quotation marks, with no marker that it is translated"
  consequence: "The quote is pasted into a deck as the player's words; a dispute later cannot be settled because the original Japanese is not shown and the translation ('포기할게' vs '됐어') changes meaning"
  p_typical: 0.05
  grounded: inferred
  evidence: "A chatbot for the gaming studio answers the studio's questions from that table"
  proposed: "Always show the original-language span first with video id and timestamp, then a translation labelled 'machine translation'; never put a translation inside quotation marks"
  shallow: false
- id: l10n-12
  title: "Right-to-left transcripts (Arabic, Hebrew) mixed with Latin option labels and timestamps render in the wrong order in the studio UI"
  level: L4
  cell: {"stage": "studio-ui", "speech-shape": "non-english", "data-element": "timestamp", "studio-question-type": "show-me-raw-transcript-or-clip", "answer-afterlife": "shared-link"}
  object: "Step 4 chatbot answer with evidence spans in the studio UI"
  situation: "An Arabic utterance at 03:15 is displayed with '[03:15]' and the option label 'instructions unclear' inline; bidi rules render the timestamp and label on the wrong side of the sentence"
  consequence: "The analyst reads the timestamp as belonging to the previous line and the clip link opens 40 seconds early; a shared link to the answer shows different ordering in different browsers"
  p_typical: 0.02
  grounded: inferred
  evidence: "none"
  proposed: "Wrap each utterance in a bidi isolate (dir=auto) and keep timestamp and option label in their own LTR cells, not inline"
  shallow: false
- id: l10n-13
  title: "A transcription model upgrade adds Thai support, so Thai sessions transcribed before the upgrade are empty and after it are full, with no field to separate them"
  level: L3
  cell: {"stage": "transcription", "time-and-change": "transcription-model-upgraded", "data-element": "transcription-model-version", "transcription-subsystem": "empty-transcript-for-non-empty-video", "recovery-action": "backfill-after-model-upgrade"}
  object: "Step 2 transcript store and the Unspecified 'languages'"
  situation: "Vendor model v3 (no Thai) produced 0-20 word transcripts for 60 Bangkok players in March; v4 (Thai supported) transcribes 600-word videos from April; the answers table holds both"
  consequence: "A trend-over-time query for the Thai cohort shows confusion jumping from 3% to 35% in April; the studio attributes it to a game update that shipped the same week"
  p_typical: 0.04
  grounded: inferred
  evidence: "languages"
  proposed: "Store transcription_model_version and supported_languages per video; when a model adds a language, queue every prior video of that language for re-transcription and mark the old rows superseded"
  shallow: false
- id: l10n-14
  title: "English accent variants (en-IN, en-NG, en-SG) are transcribed with an en-US model and churn keywords are mis-heard"
  level: L4
  cell: {"stage": "transcription", "speech-shape": "continuous-think-aloud", "transcription-subsystem": "low-confidence-segments-dropped-silently", "studio-question-type": "segment-by-metadata (device, country, build)", "correctness-failure": "wrong-denominator"}
  object: "Step 2 transcript with no locale field on the session"
