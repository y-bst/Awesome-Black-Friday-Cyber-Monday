- id: l10n-16
  title: "The game's localised item and step names differ from the English names used in the question text, so a player on the Japanese build never 'mentions' the step"
  level: L4
  cell: {"stage": "build-and-metadata-tagging", "data-element": "tutorial-step", "speech-shape": "non-english", "question-shape": "negation-player-never-did-x", "correctness-failure": "confident-no-evidence"}
