  cell: {"stage": "chatbot-query-planning", "chatbot-response-behaviour": "differs-on-re-ask", "fast-path-dependency": "text-to-sql-generated-correctly", "studio-question-type": "cohort-count", "answer-afterlife": "disputed-by-studio"}
  object: "Step 4 chatbot query planning over the answers table with English option labels"
  situation: "'설명이 불명확해서 그만둔 플레이어 수' generates WHERE option = 'unclear instructions' (no match, 0 rows); the English question generates WHERE option = 'instructions unclear' (41 rows)"
  consequence: "Two analysts in the same studio report 0 and 41 for the same question; the dispute cannot be resolved because neither answer shows the SQL or the option id it filtered on"
