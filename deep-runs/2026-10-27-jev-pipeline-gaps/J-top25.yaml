- id: fillB-3
  title: '''How many new players quit the tutorial?'' has three readings (first session ever, first session on this build,
    genre-new from screener) and the bot counts all 500 as new'
  situation: Cohort of 500 players includes 120 returning from an earlier build's playtest. 'New' has no column, so the planner
    drops the qualifier and answers over all 500 without saying the filter was ignored.
  consequence: Returning players already know the tutorial; including them lowers the quit rate the studio believes is a first-time
    rate. A dropped qualifier is invisible because the reply never echoes the filter set it applied.
