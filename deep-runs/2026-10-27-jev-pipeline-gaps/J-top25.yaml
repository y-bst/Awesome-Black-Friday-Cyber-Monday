- id: fillB-1
  title: '''How many players churned in the tutorial?'' is answered ''112 of 500 (22%)'' with no line saying which of three
    churn readings the planner used'
  situation: 'Readings available in a 500-player cohort: session ended before the ''completed tutorial'' question turned Yes
    (112), player pressed the tutorial skip (31), player never recorded a second session (64). No asks-clarifying-question-or-states-interpretation
    behaviour exists: the planner neither asks back nor prints ''churn = session ended before tutorial end''.'
  consequence: The studio reads 22% as 'players lost for good'; a reader who meant non-return would expect 13%. The reply
    gives no way to see that a reading was chosen.
  proposed: Every cohort-count reply carries a 'Computed as:' line naming question id, option and unit; when two or more stored
    definitions match, the planner asks one multiple-choice clarifying question before running SQL.
  grounded: inferred
  evidence: '"The targets are mostly detecting churn in the tutorial and just after it." -- churn is the named target, but
    no churn definition and no rule that the reply states the definition it used'
  scores:
    severity: 4.0
    occurrence: 5.0
    detectability: 5.0
    cost_to_address: 1.0
  priority: 100.0
  also_from: null
- id: fillB-2
  title: '''How many players got stuck at the crafting step?'' maps to the stored ''stuck more than 3 minutes?'' question
    and the reply never says ''3 minutes'''
  situation: 'Studio designer means ''retried the recipe 3+ times''; planner silently uses the 3-minute question. Reply: ''87
    players got stuck at crafting''. A 2-minute stall with 5 retries counts as not stuck.'
  consequence: Designer sizes a crafting redesign on 87; the retry-based count, if it existed, could be double. The threshold
    lives only in the question text the studio never sees.
  proposed: Reply template prints the matched question's full text ('stuck = no progress for more than 3 minutes') under every
    count; the planner states 'no stored question measures retries' when the wording names retries.
  grounded: inferred
  evidence: '"Buyers are gaming studios. Their questions are not known in advance." -- studio words like ''stuck'' must be
    mapped to a fixed question whose threshold the reply does not show'
  scores:
    severity: 4.0
    occurrence: 5.0
    detectability: 5.0
    cost_to_address: 1.0
  priority: 100.0
  also_from: null
