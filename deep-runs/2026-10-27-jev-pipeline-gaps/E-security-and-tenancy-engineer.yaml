  object: "Studio chatbot (step 4) with unknown question space ('Their questions are not known in advance')"
  situation: "A curious or hostile studio user prompt-injects the chatbot directly"
  consequence: "Full answers table across all tenants returned; a contractual breach for every other studio"
  p_typical: 0.07
  grounded: inferred
  evidence: "Their questions are not known in advance."
  proposed: "Chatbot DB credential is per-tenant and read-only; red-team suite of 30 jailbreak prompts must return 0 foreign rows"
  shallow: false
- id: sec-7
  title: "'How does our tutorial churn compare to other studios?' answered with another studio's raw per-game numbers from the shared table"
  level: L3
  cell: {studio-question-type: cross-game-or-cross-studio-benchmark, tenancy: cross-studio-benchmark-request, chatbot-response-behaviour: answers-in-wrong-tenant-scope, stage: chatbot-answer, data-element: cached-aggregate}
  object: "Step 4 chatbot; Constraint 'Their questions are not known in advance'"
  situation: "Benchmark request with no defined benchmark product; the bot either queries other tenants or falls back to general knowledge"
  consequence: "Either a leak of a named competitor's metric or an invented 'industry average' (chatbot-response-behaviour answers-from-general-game-knowledge) presented as data"
  p_typical: 0.10
  grounded: inferred
  evidence: "Buyers are gaming studios. Their questions are not known in advance."
  proposed: "Define one of two behaviours in spec: fixed refusal string, or a precomputed benchmark aggregate with min 5 studios and min 200 players each, labelled as such"
  shallow: false
- id: sec-8
  title: "Benchmark aggregate over a genre with only 2 studios lets studio A subtract its own number and recover studio B's tutorial churn exactly"
  level: L4
  cell: {stage: aggregate-cache, tenancy: cross-studio-benchmark-request, data-element: cached-aggregate, scale: 10-games-at-once, studio-question-type: distribution-not-count}
  object: "Cross-studio aggregate built from per-game answers tables"
  situation: "Benchmark filtered by genre or platform leaves k=2 contributing studios"
  consequence: "Differencing attack: (benchmark x total_players - own count) reveals the competitor's count"
  p_typical: 0.03
  grounded: speculative
  evidence: "The answers form a structured table per video."
  proposed: "Suppress any benchmark cell with fewer than 5 contributing studios; no single studio may contribute >40% of rows; test the suppression on a 2-studio fixture"
  shallow: false
- id: sec-9
  title: "Game target 'tutorial churn' is shared across studios, so the context loader for the 'table fits in LLM context' path loads every studio's tutorial-churn rows"
  level: L3
  cell: {fast-path-dependency: table-fits-in-llm-context, data-element: game-target, tenancy: many-studios-shared-infra, scale: 500-players, chatbot-response-behaviour: answers-in-wrong-tenant-scope}
  object: "Step 3: 'written per game target. The targets are mostly detecting churn in the tutorial'"
  situation: "Rows are keyed by game_target, and the target name is a generic category reused by every studio"
  consequence: "Chatbot context holds 500 own players plus thousands from other studios; answers mix tenants and exceed the context, so rows get silently truncated"
  p_typical: 0.06
  grounded: quote
  evidence: "The targets are mostly detecting churn in the tutorial and just after it."
  proposed: "Primary key must be (studio_id, game_id, game_target, question_set_version); loader asserts a single studio_id before building context"
  shallow: false
- id: sec-10
  title: "Aggregate cache keyed on normalised question text: studio 2 asks 'what % quit in the tutorial' and gets studio 1's cached answer"
  level: L4
  cell: {stage: aggregate-cache, fast-path-dependency: cache-hit, data-element: cached-aggregate, tenancy: many-studios-shared-infra, latency: under-2s}
  object: "Fast-answer requirement: 'Answering a studio's question must be fast'"
  situation: "A semantic or text cache is added to meet the latency goal and its key omits tenant and game"
  consequence: "Wrong-tenant answer returned in under 2 s, with no visible sign it came from cache"
  p_typical: 0.05
  grounded: inferred
  evidence: "Answering a studio's question must be fast."
  proposed: "Cache key = hash(studio_id, game_id, question_set_version, table_version, normalised question); test two tenants issuing identical text"
  shallow: false
