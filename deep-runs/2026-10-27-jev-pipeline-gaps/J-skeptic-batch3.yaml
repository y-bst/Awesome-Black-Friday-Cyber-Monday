- id: "extract-1"
  case: "This is real but it is the same defect as skeptic-8 (no abstain or not-observed option) and should be judged once, as a default in the question-authoring template, not as a separate urgent fix. The 10x inflation figure assumes every non-tutorial video is asked the tutorial-churn question and that the extractor always picks a reason; the spec only says the targets are mostly tutorial churn and just after it, and gives no question count, so the worst case is asserted, not shown. A reasonable default already covers much of it: any competent extraction prompt tells the model to answer from the transcript and most models will pick an 'other' or 'none' style option if one exists, and the table can be filtered by the video index at query time, since videos are already ordered within a session. Where the question is tutorial-scoped, a cheap pre-filter (only ask tutorial questions of videos 1..k, or gate on a one-line 'is the tutorial being played in this video' question) fixes it without redesigning options. Ingestion cost is stated as not a concern, so re-running extraction after adding the two options later is cheap and nothing is lost, because transcripts are retained. The proposed 95% NOT_APPLICABLE acceptance test needs a labelled set that does not exist yet, so that part cannot start tomorrow and would stall the cheap part. Defer to the question-framework rework the owner already wants, and ship the two reserved options there."
- id: "ops-1"
  case: "The gap is plausible, but it is an operations and bookkeeping rule, not a correctness flaw in the pipeline design, and it is cheap to add later because no data is lost: failed videos can be re-transcribed and the session re-aggregated at any time, since ingestion time and cost are explicitly not a concern. The evidence is inferred, not quoted; the spec says nothing about transcription failures, and the 2-of-8 failure scenario is a hypothetical that depends on vendor error rates the spec does not give. Most pipelines already have a per-job status and a retry queue by default, and a session that has missing videos will usually show as a gap in video indices once anyone looks. The consequence also overstates the harm: a session row built from 6 of 8 videos is still real evidence, and the studio question is about cohort trends over hundreds of players, where a few partial sessions move a percentage by little. Session-level 'quit during tutorial: No' is also an aggregation choice that the spec does not say exists; if sessions are not aggregated this early, the leaf is moot. It overlaps with ds-1, since a per-(video, question) status column would surface the missing videos too. Defer until session stitching is designed; do not block studio onboarding on it."
- id: "design-32"
  case: "This is a real property of single-choice questions, but it is a question-design matter that the question author controls, and not a pipeline defect. The spec says options are written per game target, so the author can already write mutually exclusive options, add a combined option, or split the item into two questions; none of that needs a framework change. The claim that the extractor picks the first-listed option in about the same share of cases is stated with no measurement, and the evidence is only implied from the word 'options'. Randomising option order in the prompt makes per-video answers non-reproducible across re-runs and complicates the answers table, so the proposed fix has its own cost, and multi-select with a primary flag changes the table schema that the chatbot reads, which is a heavy change for a case where the player mentions two causes in one sentence. The harm path, a designer reworking controls when enemy damage was the cause, runs through a human reading a cohort chart with many players, where a mislabel on one video is diluted. Accept as-is for the first studios and revisit once the label agreement against human coders is measured; if the owner wants the general framework improvement, this belongs inside it, so it is a duplicate of the broader question-framework work."
- id: "skeptic-8"
  case: "This is the same underlying issue as extract-1 (no not-observed option), and only the 'off-list cause' half is distinct; the case for acting now is weaker than the priority suggests. The spec does not say the options lack an 'other' choice; the evidence is inferred from silence, and well-written per-game question sets almost always end with 'other' or 'not stated', so the leaf may describe a badly authored question, not a pipeline flaw. The scenario (a phone call as the reason for quitting) is a rare cause, and even if it is forced into 'boring', it shifts one player's tag; a cohort chart across hundreds of players moves little unless off-list causes are common, and the spec gives no rate. Adding 'other (free text)' also adds a free-text column the chatbot must read and the table must store, which conflicts with the goal of a compact structured table, and measuring the share of each option per question per week is a monitoring feature, not a fix. Because transcripts are kept and ingestion cost is not a concern, adding the two options later and re-running extraction recovers everything. Merge into extract-1 as one item in the question-authoring template, and defer."
- id: "ds-1"
  case: "I cannot make a strong case that this is unreal: with no coding for failed or missing answers, a denominator problem is a plausible silent error, and a status column is cheap. The honest counter is about timing and scale. The scenario assumes a partial extraction failure writes an empty cell, which is an implementation detail the spec does not state; if the pipeline writes rows only on full success, or retries until all questions answer, the leaf disappears. The effect in the example is 31% against 33.7%, which is a small shift for a studio asking a broad cohort question, and the evidence is inferred, not quoted. Adding a status column is cheap at any point because the table is rebuilt from retained transcripts, so deferring does not lock in bad data, and the denominator can be fixed in the chatbot's query layer before onboarding. It also overlaps with ops-1 and with the not-applicable handling in extract-1, so one table-level status design would cover all three and should be judged once. Defer to the same schema change, not a separate urgent fix."
