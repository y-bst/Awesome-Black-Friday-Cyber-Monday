  object: Step 4 chatbot answering 'the studio's questions from that table'; the churn target in step 3
  situation: "Readings available in a 500-player cohort: session ended before the 'completed tutorial' question turned Yes (112), player pressed the tutorial skip (31), player never recorded a second session (64). No asks-clarifying-question-or-states-interpretation behaviour exists: the planner neither asks back nor prints 'churn = session ended before tutorial end'."
  consequence: The studio reads 22% as 'players lost for good'; a reader who meant non-return would expect 13%. The reply gives no way to see that a reading was chosen.
