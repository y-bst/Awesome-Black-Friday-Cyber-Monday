topic: "JEV pipeline (multi-video session -> transcript -> fixed questions -> answers table -> studio chatbot): where data, correctness or speed is lost"
request_type: gaps
unit: "a gap: a situation in which the pipeline loses information, answers wrongly, answers slowly, or has no defined behaviour"
leaf_test: >
  Concrete object = a named pipeline stage (video capture, 15-minute split, transcription, fixed question set, answer options,
  answers table, chatbot, studio question), a named data element (session, video, transcript, question, answer, player, cohort),
  or a quoted spec sentence. "Act tomorrow" = an engineer or PM can write the missing rule, test, or design change from the line alone.
audience: "the JEV product owner and engineers deciding what to fix before the next studio onboarding"
artifact_description: >
  A short description of a pipeline that turns hours-long gameplay sessions (split into 15-minute videos) into transcripts,
  runs a small fixed set of multiple-choice questions per game target (mostly tutorial churn) over each transcript, stores
  the answers, and lets a gaming studio's chatbot answer questions from that table fast across hundreds of players.
  Constraints: ingestion cost is fine, queries must be fast, studio questions are unknown in advance.
artifacts:
  - path: deep-runs/2026-10-27-jev-pipeline-gaps/spec.md
    kind: other
    objects: pipeline stages, data elements, constraints, named problems, unspecified items
assumptions:
  - transcript is speech-to-text of the player's think-aloud plus any game audio; no on-screen text; no telemetry joined
  - questions are multiple-choice with 3-6 options, answered once per video by an LLM
  - the chatbot is an LLM given the answers table (or a query over it) and the studio's question
rubric: fmea
quota_per_perspective: 25
mode: full
