  situation: 'Minute 2: ''this is easy, nice''; minute 14: ''I''m done with this''; question ''Player attitude toward the tutorial'''
  consequence: Model picks 'positive' on one run and 'negative' on another; the moment closest to churn (the end) is not privileged
  p_typical: 0.07
  grounded: inferred
  evidence: '"The answers form a structured table per video." -- implied: one answer per question per video, with no rule for a state that changes within the video'
  already_specified: false
  proposed: Each state-like question names its temporal rule in the prompt (e.g. 'state at end of video' or 'worst state observed') and returns start/end timestamps of the deciding span
  shallow: false
