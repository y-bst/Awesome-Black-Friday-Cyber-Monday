# Stage G merged survivors, bucket 3 (stages: extraction-prompt, session-level-aggregation, rerun-and-backfill, answer-options)
# also_from lists absorbed duplicate ids (same situation on the same object); variants_of points at the root of the same mechanism on a different part or scope.
- id: cost-3
  title: One LLM call per question re-sends the same 3k-token transcript 50 times for a 50-question set
  level: L4
  perspective: cost
  cell:
    stage: extraction-prompt
    data-element:
    - transcript
    - question
    scale: question-set-of-50-questions
    correctness-failure: inconsistent-across-videos
    latency: batch-overnight
  object: Step 3 'The transcript is run through a fixed set of questions with options'
  situation: A 15-minute think-aloud video yields about 2,250 words (roughly 3,000 tokens). If each of 50 questions is a separate call, 150,000 input tokens per video; 8,000 videos = 1.2 billion input tokens.
    If instead all 50 go in one prompt, the output must hold 50 answers and the context shares attention across them.
  consequence: Spec does not say one call per question or per video. The choice sets the bill (50x on input without prompt caching) and also answer quality (cross-question interference in a single prompt).
  p_typical: 0.06
  grounded: inferred
  evidence: '"The transcript is run through a fixed set of questions with options, written per game target." -- implied: the spec does not say whether the questions run as one call per video or one call per question'
  already_specified: false
  proposed: Specify one call per video with all questions batched in a structured-output schema, or one cached-prefix call per question, and measure both on 200 videos.
  shallow: false
  variants_of: extract-13
- id: cost-22
  title: Serial per-video extraction at 40 s each for a 50-question set takes 89 hours for 8,000 videos
  level: L4
  perspective: cost
  cell:
    stage:
    - extraction-prompt
    - job-orchestration-and-status
    data-element: video
    scale:
    - 500-players
    - question-set-of-50-questions
    time-and-change: first-game-onboarded
    latency:
    - batch-overnight
    - ingest-to-queryable (hours or days after session)
    question-set-version-state: single-version
  object: Constraint 'Ingestion time and cost are not a concern'
  situation: '50 questions per video, 40 s total per video, 8,000 videos run sequentially: 320,000 s = 89 hours. At parallelism 20 it is 4.4 hours.'
  consequence: The word 'not a concern' covers hours but not days; a studio onboarding on Monday gets first answers on Friday if the pipeline runs serially, and there is no stated ingest-to-queryable target.
  p_typical: 0.05
  grounded: inferred
  evidence: '"Ingestion time and cost are not a concern." -- implied: no ingest-to-queryable target is stated, so a multi-day serial run is not ruled out'
  already_specified: false
  proposed: State an ingest-to-queryable target (e.g. a 500-player cohort queryable within 24 h) and size the worker pool for it.
  shallow: false
  variants_of: pipe-28
