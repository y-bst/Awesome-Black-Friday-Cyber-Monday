- id: extract-1
  title: Per-video question 'Why did the player leave the tutorial?' has no 'not observed in this video' option, so video 7 of 12 (tutorial finished in video 2) still gets a reason picked
  level: L4
  perspective: extract
  cell:
    stage:
    - extraction-prompt
    - per-video-answers
    - answer-options
    data-element:
    - null-vs-no
    - question
    - option
    session-shape: 5-20-videos
    question-shape: event-did-not-happen-in-this-video
    studio-question-type: cohort-count
    correctness-failure:
    - forced-choice-bias
    - null-treated-as-no
  object: fixed question set with options, run per video ('The transcript is run through a fixed set of questions with options')
  situation: Session of 12 x 15-minute videos; tutorial ends in video 2; videos 3-12 contain no tutorial content, yet each is asked the tutorial-churn question with options A-D only
  consequence: 10 of 12 rows carry a churn reason for a tutorial the player never left in that video; a cohort count of 'reason = unclear instructions' is inflated by up to 10x per player
  p_typical: 0.35
  grounded: quote
  evidence: '"The targets are mostly detecting churn in the tutorial and just after it." / "The answers form a structured table per video." / "each video is capped at 15 minutes, so one session is many videos."'
  already_specified: false
  proposed: Every question gets two reserved options, NOT_APPLICABLE (event absent from this video) and INSUFFICIENT_EVIDENCE, stored as distinct values from any content option; assert on a labelled set
    that videos with no tutorial speech return NOT_APPLICABLE >= 95% of the time
  shallow: false
  variants_of: skeptic-8
- id: extract-5
