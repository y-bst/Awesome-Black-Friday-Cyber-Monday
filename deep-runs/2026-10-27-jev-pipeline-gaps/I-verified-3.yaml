    scale: 500-players
    correctness-failure: other-option-overused
  object: Step 3 'a fixed set of questions with options, written per game target' and the Unspecified line 'languages'
  situation: A 15-minute video whose transcript is Japanese ('むずすぎ、どこ押せばいいの') is run against the English option list [confused by controls / lost interest / instructions unclear / other]
  consequence: The same utterance lands on 'confused by controls' in one run and 'instructions unclear' in the next because the model translates before matching; across 500 players the 'other' share for
    Japanese sessions runs 2-3x the English share with no field recording that the transcript language differed from the option language
  p_typical: 0.3
  grounded: quote
  evidence: '"latency and cost limits per query, languages, how videos of one session are linked."'
  already_specified: false
  proposed: Store transcript_language per video; ship question/option text in the transcript language (per-language fork keyed on the same option id) and reject extraction when transcript_language has no
