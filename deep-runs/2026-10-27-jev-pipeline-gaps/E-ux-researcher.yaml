  grounded: quote
  evidence: "the transcript alone is not enough; what is on screen is largely lost."
  proposed: "Diff transcript against the game's tutorial string table and tag matched spans as 'read-aloud', excluded from comprehension evidence"
  shallow: false
- id: uxr-23
  title: "Deictic references ('this thing', 'over here', 'that one') cannot be resolved to a UI element without the screen"
