- id: uxr-1
  title: "Silent final 60-120 s before quit: per-video answer for 'why did the player leave' is taken from an utterance minutes earlier, with no evidence-span check"
  level: L4
  cell: {stage: per-video-answers, speech-shape: silent-player, question-shape: perceptual-cause-not-verbalised, session-shape: last-video-under-1-minute, correctness-failure: confident-no-evidence}
  object: "per-video answers table row for the last video of a session; churn question of the 'fixed set of questions with options'"
  situation: "Player stops talking 60-120 s before closing the game (the classic pre-quit silence); the last video is under 1 minute and contains no speech at all"
  consequence: "Extractor either answers the quit-reason question for the last video from nothing (hallucinated option) or the session aggregate inherits a reason from a joke made 4+ minutes earlier; the moment a researcher most wanted to watch is the one with zero transcript content"
  p_typical: 0.12
  grounded: inferred
  evidence: "The targets are mostly detecting churn in the tutorial and just after it."
  proposed: "Assert in test: if the evidence span of a quit-reason answer ends more than 60 s before session end, answer is stored as 'unknown - silent before quit', and the trailing silence duration is a column"
  shallow: false
- id: uxr-2
  title: "Pause lengths between utterances (hesitation) are discarded when the transcript is reduced to text, so 'where did players hesitate' has no column"
  level: L3
  cell: {stage: transcription, data-element: timestamp, speech-shape: continuous-think-aloud, question-shape: answer-is-a-time, studio-question-type: compare-two-steps}
  object: "transcript (spec item 2: 'Each video is converted to a transcript'); per-utterance timestamps"
  situation: "Player talks continuously but pauses 8-15 s at one tutorial screen (reading, deciding) and 1-2 s elsewhere"
  consequence: "The LLM reads only words; a 12 s hesitation and a 1 s gap look identical, so the strongest observational struggle signal a researcher used is absent from every answer and from the chatbot"
  p_typical: 0.07
  grounded: inferred
  evidence: "Unspecified ... What a transcript contains (speech only, on-screen text, events)"
  proposed: "Keep utterance start/end times; compute per-video pause count over 5 s and longest pause with its timestamp as stored columns"
  shallow: false
- id: uxr-3
  title: "Repeated mis-taps on the wrong button produce no speech, or only 'huh?', so 'did the player understand the control' is answered Yes"
  level: L3
  cell: {stage: per-video-answers, data-element: screen-state, question-shape: answer-needs-visuals, speech-shape: silent-player, correctness-failure: perceptual-cause-attributed-to-verbal-option}
  object: "fixed question about control comprehension; transcript of a tutorial video"
  situation: "Player taps a non-interactive area 6 times before finding the real button, saying nothing or a single 'huh'"
  consequence: "Answer row records 'understood control' or 'no issue'; the mis-tap pattern a researcher logged by watching is unrecoverable because the screen is not in the transcript"
  p_typical: 0.15
  grounded: quote
  evidence: "the transcript alone is not enough; what is on screen is largely lost."
  proposed: "Mark visual-only questions with answer_source=audio and allow option 'cannot tell from audio'; store input-event counts if telemetry is ever joined"
  shallow: false
- id: uxr-4
  title: "'Player never noticed the tutorial arrow' and 'noticed it and ignored it' both produce silence; the table stores one value for both"
  level: L3
  cell: {stage: answer-options, question-shape: negation-player-never-did-x, data-element: null-vs-no, studio-question-type: cohort-why, correctness-failure: null-treated-as-no}
  object: "answer options of a question like 'Did the player follow the tutorial prompt?'"
  situation: "Highlighted arrow or pulsing button on screen; player does not mention it in a 15-minute video"
  consequence: "Option 'No' conflates 'did not see' (a visibility problem) with 'chose not to' (a motivation problem); cohort-why answers to 'why do players skip step 3' give the wrong fix direction"
  p_typical: 0.06
  grounded: inferred
  evidence: "Transcript loses visual information."
  proposed: "Split option into 'mentioned and ignored' / 'never mentioned' / 'cannot tell' and forbid the chatbot from reading 'never mentioned' as 'did not notice'"
  shallow: false
- id: uxr-5
  title: "Think-aloud decays after the first 15-30 minutes, so videos 3-20 have sparse transcripts and per-video answers drift to 'no issue' over the session"
  level: L4
  cell: {session-shape: 5-20-videos, speech-shape: silent-player, stage: session-level-aggregation, correctness-failure: null-treated-as-no, studio-question-type: trend-over-time}
  object: "per-video answers across videos 1..n of one session; 'just after' the tutorial target"
  situation: "Words per minute falls from ~120 in video 1 to under 20 by video 4 because the player stops narrating, not because the experience got better"
  consequence: "Observable: per-video rate of 'frustrated' answers drops monotonically with video index across the cohort; the chatbot reports 'frustration falls after the tutorial', which is an artefact of narration fatigue in exactly the 'just after' window the owner targets"
  p_typical: 0.05
  grounded: inferred
  evidence: "A session can be n hours; each video is capped at 15 minutes, so one session is many videos."
  proposed: "Store words-per-minute per video and have aggregation exclude or flag videos under 30 wpm as low-signal instead of 'no issue'"
  shallow: false
- id: uxr-6
  title: "Moderator's leading hint ('try the button on the left') is followed by player success; extractor records the player as having discovered the mechanic unaided"
  level: L3
  cell: {speech-shape: moderator-speaking-or-leading, stage: per-video-answers, data-element: moderator, correctness-failure: moderator-words-attributed-to-player, question-shape: fits-an-option}
  object: "transcript without diarisation; question 'Did the player figure out X without help?'"
  situation: "Moderator intervenes once after 40 s of player struggle; transcript has no speaker labels"
  consequence: "Answer 'figured out unaided' for a step that in the wild would cause churn; the intervention that a researcher would code as a critical incident disappears"
  p_typical: 0.09
  grounded: inferred
  evidence: "Unspecified ... What a transcript contains (speech only, on-screen text, events)"
  proposed: "Diarise; add boolean column 'assisted' per step-question with evidence span of the non-player speaker"
  shallow: false
- id: uxr-7
  title: "Prompted confusion ('What are you thinking now?' -> 'I'm a bit confused') is counted the same as spontaneous confusion"
  level: L3
  cell: {speech-shape: moderator-speaking-or-leading, stage: extraction-prompt, data-element: utterance, studio-question-type: cohort-count, correctness-failure: moderator-words-attributed-to-player}
  object: "confusion question in the fixed set; utterance-level transcript"
  situation: "Moderator uses a standard probe every 5 minutes in cohort A and never in cohort B"
  consequence: "Cohort A shows 2-3x more 'confused' answers; a compare-two-versions query between cohorts reports a difference caused by probing protocol, not by the build"
  p_typical: 0.04
  grounded: speculative
  evidence: "none"
  proposed: "Add per-answer flag 'prompted' (evidence utterance follows a non-player question within 10 s) and a session field for moderation protocol"
  shallow: false
- id: uxr-8
  title: "Sarcasm ('oh great, another popup') is mapped to a positive sentiment option"
  level: L3
  cell: {speech-shape: profanity-or-slang, question-shape: fits-two-options, stage: per-video-answers, correctness-failure: forced-choice-bias, data-element: answer}
  object: "sentiment or 'how did the player feel about the tutorial popups' question options"
  situation: "Player uses ironic praise 3 times in a 15-minute video with flat or annoyed prosody that speech-to-text does not carry"
  consequence: "Answer 'positive' for a video a researcher would code as annoyed; tone carried only by voice is stripped before the LLM sees the words"
  p_typical: 0.11
  grounded: inferred
  evidence: "Each video is converted to a transcript."
  proposed: "Golden-set test with 10 ironic utterances; require an evidence quote and allow option 'ambiguous tone'"
  shallow: false
- id: uxr-9
  title: "Sighs, groans and laughs are dropped by speech-to-text, so emotional-only frustration leaves an empty transcript region"
  level: L3
  cell: {stage: transcription, transcription-subsystem: low-confidence-segments-dropped-silently, data-element: utterance, question-shape: unknowable-from-audio, correctness-failure: null-treated-as-no}
  object: "transcript produced in spec item 2; frustration question"
  situation: "Player sighs loudly 4 times and groans once at a failed tutorial jump but says no words"
  consequence: "Transcript shows nothing for that 2-minute span; frustration answer = 'none'; the vocal signal a researcher heard is gone before any question runs"
  p_typical: 0.06
  grounded: inferred
  evidence: "Unspecified ... What a transcript contains (speech only, on-screen text, events)"
  proposed: "Emit non-speech vocal event tags ([sigh], [laugh], [groan]) with timestamps into the transcript and count them per video"
  shallow: false
- id: uxr-10
  title: "Muttered or whispered self-talk at the frustration peak is the speech most likely to be low-confidence and dropped"
  level: L3
  cell: {speech-shape: whispering, stage: transcription, transcription-subsystem: low-confidence-segments-dropped-silently, capture-integrity: audio-and-video-ok, correctness-failure: confident-no-evidence}
  object: "transcript; frustration and quit-intent questions"
  situation: "Player drops voice to a mutter ('why won't this... ugh, whatever') in the 30 s before quitting"
  consequence: "The quieter the speech, the more relevant it tends to be to churn, and the more likely STT drops it; quit-intent answer comes back 'no intent expressed'"
  p_typical: 0.04
  grounded: speculative
  evidence: "none"
  proposed: "Keep low-confidence segments marked [low-conf] instead of dropping; report count of dropped seconds per video"
  shallow: false
- id: uxr-11
  title: "Say-do gap: player says 'this is easy' while failing the same step 3 times; table records 'tutorial clear'"
  level: L3
  cell: {stage: per-video-answers, question-shape: answer-needs-visuals, speech-shape: continuous-think-aloud, correctness-failure: perceptual-cause-attributed-to-verbal-option, studio-question-type: cohort-why}
  object: "tutorial clarity question; per-video answer"
  situation: "Verbal self-report contradicts on-screen outcome (failure screen shown 3 times)"
  consequence: "Researchers trust behaviour over self-report; the transcript-only pipeline can only trust self-report, so clarity rates are inflated for confident-talking players"
  p_typical: 0.1
  grounded: quote
  evidence: "Transcript loses visual information."
  proposed: "Tag each answer with source 'self-report' vs 'observed'; chatbot must say which when quoting a rate"
  shallow: false
- id: uxr-12
  title: "Post-session debrief recorded in the last video: retrospective 'I'd have quit because it was boring' is stored as the in-moment quit cause"
  level: L3
  cell: {stage: per-video-answers, question-shape: answer-is-a-why, session-shape: 2-4-videos, correctness-failure: answer-attached-to-wrong-video-index, data-element: evidence-span}
  object: "quit-reason question; last video of session containing moderator debrief"
  situation: "Moderator asks 'why would you stop playing here?' after gameplay ended; player gives a rationalised reason that differs from what they said during play ('this camera is awful')"
  consequence: "Answer row for the final video holds the debrief reason, and session aggregation picks it as the latest statement; retrospective rationalisation overrides in-play evidence"
  p_typical: 0.05
  grounded: speculative
  evidence: "none"
  proposed: "Session field 'gameplay_end_ts'; answers with evidence after it are stored in a separate debrief column"
  shallow: false
- id: uxr-13
  title: "No session-end reason (player quit / moderator stopped / time cap / crash), so 'churned in tutorial' is inferred from transcripts that end the same way in all four cases"
  level: L3
  cell: {data-element: session, session-shape: session-ends-mid-sentence, stage: build-and-metadata-tagging, studio-question-type: cohort-count, correctness-failure: hallucinated-answer}
  object: "session record; churn target ('detecting churn in the tutorial')"
  situation: "Of 500 sessions, some end because the 60-minute slot ran out mid-tutorial, some because of a crash, some because the player chose to stop"
  consequence: "cohort-count 'how many players quit in the tutorial' counts time-cap and crash endings as churn; the most important label in a churn study is never captured at source"
  p_typical: 0.14
  grounded: quote
  evidence: "The targets are mostly detecting churn in the tutorial and just after it."
  proposed: "Required session field end_reason with 4 values set by the moderator tool; extractor never infers it"
  shallow: false
- id: uxr-14
  title: "Moderated playtesters rarely quit; 'would have churned' is a counterfactual the fixed questions answer as if observed"
  level: L3
  cell: {stage: fixed-question-set, question-shape: unknowable-from-audio, data-element: game-target, studio-question-type: recommendation-what-should-we-change, correctness-failure: confident-no-evidence}
  object: "fixed question set 'written per game target' for tutorial churn"
  situation: "Paid participants in a moderated session continue through a frustrating tutorial they would abandon at home"
  consequence: "Observed quit rate near 0%; extractor answers 'churn risk' from frustration words; the chatbot presents a predicted churn number to the studio as a measured one"
  p_typical: 0.07
  grounded: inferred
  evidence: "The targets are mostly detecting churn in the tutorial and just after it."
  proposed: "Name the column 'expressed frustration' or 'quit-intent stated', not 'churned'; chatbot answer template states 'stated, not observed'"
  shallow: false
- id: uxr-15
  title: "Recording starts after the tutorial's first screens, so the first 30-90 s (highest drop-off in FTUE) is absent and answers read 'no confusion'"
  level: L3
  cell: {session-shape: tutorial-started-before-recording, data-element: tutorial-step, stage: video-capture, correctness-failure: null-treated-as-no, studio-question-type: compare-two-steps}
  object: "video 1 of a session; tutorial-step questions"
  situation: "Moderator presses record after the game boots; title screen, permissions prompt and first tutorial screen are not captured"
  consequence: "Step-1 questions get 'no issue' instead of 'not observed'; compare-two-steps reports step 1 as smoother than step 3 for every player"
  p_typical: 0.06
  grounded: inferred
  evidence: "A player's gameplay session is captured as video."
  proposed: "Per-session field 'first_observed_step'; step questions before it are stored as not-observed"
  shallow: false
- id: uxr-16
  title: "Time-on-step cannot be computed: no tutorial-step boundaries in a transcript, so 'how long did players spend on step 3' is guessed"
  level: L3
  cell: {question-shape: answer-is-a-time, data-element: tutorial-step, stage: per-video-answers, studio-question-type: compare-two-steps, chatbot-response-behaviour: invents-number}
  object: "answers table 'per video'; tutorial-step data element"
  situation: "Studio asks the chatbot for median seconds on step 3 vs step 4 across 500 players"
  consequence: "The table holds categorical answers per 15-minute video; the chatbot either refuses or estimates from video counts; a researcher's core metric (time on task) is unavailable"
  p_typical: 0.13
  grounded: quote
  evidence: "The answers form a structured table per video."
  proposed: "Store step-entered timestamps (from telemetry or a visual detector) as a separate event table the chatbot can query"
  shallow: false
- id: uxr-17
  title: "Failed attempts at one obstacle, split across two 15-minute videos, are counted as 'multiple' and 'once' in different rows"
  level: L4
  cell: {question-shape: answer-is-a-count, session-shape: 2-4-videos, stage: 15-minute-split, correctness-failure: inconsistent-across-videos, data-element: video}
  object: "count-type option ranges ('0 / 1-2 / 3+'); 15-minute video cap"
  situation: "Player fails the tutorial jump 2 times at 14:20-14:59 of video 1 and 2 more times at 00:00-00:40 of video 2"
  consequence: "Observable: each video answers '1-2', the session never reaches '3+'; 'how many players failed the jump 3+ times' under-counts"
  p_typical: 0.08
  grounded: quote
  evidence: "each video is capped at 15 minutes, so one session is many videos."
  proposed: "Store raw integer counts per video and sum at session level; never bucket before aggregation"
  shallow: false
- id: uxr-18
  title: "Frustration-then-resolution within one video ('ugh... oh! got it') collapses to one answer, losing the aha moment and its order"
  level: L3
  cell: {question-shape: answer-changes-within-video, stage: per-video-answers, data-element: answer, studio-question-type: timeline-of-one-player, correctness-failure: inconsistent-across-videos}
  object: "one answer per question per video"
  situation: "Player is stuck for 4 minutes, then solves the step and says 'oh that's cool' in the same video"
  consequence: "Answer is 'frustrated' or 'positive' depending on which the LLM weights; a researcher would report 'stuck 4 min then recovered', which is the difference between a fix and no fix"
  p_typical: 0.07
  grounded: quote
  evidence: "The answers form a structured table per video."
  proposed: "Allow per-question answer sequences with timestamps (state changes) instead of a single value"
  shallow: false
- id: uxr-19
  title: "Evidence clip for 'why did they quit' must start 30-60 s before the quote; the table has no timestamp to seek to at all"
  level: L4
  cell: {stage: evidence-display, studio-question-type: show-me-raw-transcript-or-clip, transcription-subsystem: timestamps-reset-per-video, data-element: evidence-span, latency: under-30s}
  object: "chatbot answer; answers table per video (no evidence-span field described)"
  situation: "Analyst asks 'show me what happened before player 214 said this is stupid'"
  consequence: "Observable: no link to a video id plus offset; even with the quote, the lead-in that shows the cause is in the preceding seconds or the previous 15-minute video"
  p_typical: 0.18
  grounded: inferred
  evidence: "Unspecified ... how videos of one session are linked."
  proposed: "Store evidence span as (session_id, absolute_offset_s); clip player opens at offset minus 45 s, crossing video boundaries"
  shallow: false
- id: uxr-20
  title: "'Quote me evidence' returns quotes from the most talkative players, so quiet players' experiences never appear in studio decks"
  level: L3
  cell: {studio-question-type: quote-me-evidence, data-element: cohort, scale: 500-players, answer-afterlife: copied-into-deck, chatbot-response-behaviour: answers-correctly}
  object: "chatbot quoting from evidence spans across 500 players"
  situation: "20% of players produce 70% of words; quote selection favours articulate, quotable utterances"
  consequence: "Each quote is real, but the deck's narrative over-represents a vocal minority; silent strugglers who churn hardest are invisible"
  p_typical: 0.04
  grounded: speculative
  evidence: "none"
  proposed: "Quote sampler capped at 1 quote per player per answer and reports how many players had no quotable speech"
  shallow: false
- id: uxr-21
  title: "Cohort rates scale with talkativeness: '% players confused' measures who narrates, not who is confused"
  level: L4
  cell: {studio-question-type: cohort-count, speech-shape: silent-player, correctness-failure: wrong-denominator, scale: 500-players, data-element: player}
  object: "answers table aggregated per cohort"
  situation: "Silent or low-verbal players (under 20 words per minute) get 'not confused' by default"
  consequence: "Observable: correlation between per-player word count and 'confused' rate above 0.5; a build with quieter recruits looks clearer"
  p_typical: 0.06
  grounded: inferred
  evidence: "Reading 500 transcripts per question was too slow and too much data, which is why the fixed-question table exists."
  proposed: "Denominator = players with enough speech to judge; chatbot reports 'x of y judgeable players'"
  shallow: false
- id: uxr-22
  title: "Player reading tutorial text aloud is the only way on-screen copy enters the transcript, and the extractor treats it as the player's own words"
  level: L3
  cell: {speech-shape: player-reading-chat-or-overlay-aloud, stage: per-video-answers, data-element: utterance, correctness-failure: hallucinated-answer, question-shape: fits-two-options}
  object: "transcript; questions about comprehension of tutorial instructions"
  situation: "Player reads 'Drag to aim, release to fire' aloud, then fails to do it"
  consequence: "Extractor answers 'understood instruction' because the instruction appears in the player's speech; readers also get better coverage of tutorial copy than non-readers, skewing comparisons"
