- id: skeptic-9
  title: When the extractor picks 'Other', the words that made it pick Other are not kept, so the cheapest signal for new
    options is discarded
  level: L3
  cell:
    stage: answer-options
    question-shape: fits-no-option
    correctness-failure: other-option-overused
    question-set-version-state: option-added
  object: answer option 'Other' in the answers table
  situation: '''Other'' reaches 30% of answers for ''Why did the player stop?'' across 500 players'
  consequence: Question author cannot see what the 150 'Other' players said without reading 150 transcripts; the option list
    stays wrong
  p_typical: 0.07
  grounded: inferred
  evidence: The question set is small, so most of what is in the video and transcript is never captured.
  proposed: Store other_text (<=30 words) with each Other answer; cluster other_text weekly and propose new options when a
