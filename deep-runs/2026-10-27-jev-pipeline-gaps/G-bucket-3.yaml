- id: cost-3
  title: One LLM call per question re-sends the same 3k-token transcript 50 times for a 50-question set
  level: L4
  cell:
    stage: extraction-prompt
    data-element: transcript
    scale: question-set-of-50-questions
    correctness-failure: inconsistent-across-videos
    latency: batch-overnight
  object: Step 3 'The transcript is run through a fixed set of questions with options'
  situation: A 15-minute think-aloud video yields about 2,250 words (roughly 3,000 tokens). If each of 50 questions is a separate
    call, 150,000 input tokens per video; 8,000 videos = 1.2 billion input tokens. If instead all 50 go in one prompt, the
    output must hold 50 answers and the context shares attention across them.
  consequence: Spec does not say one call per question or per video. The choice sets the bill (50x on input without prompt
    caching) and also answer quality (cross-question interference in a single prompt).
  p_typical: 0.06
  grounded: inferred
  evidence: The transcript is run through a fixed set of questions with options
  proposed: Specify one call per video with all questions batched in a structured-output schema, or one cached-prefix call
    per question, and measure both on 200 videos.
  shallow: false
  _from_file: E-cost-and-latency-engineer.yaml
