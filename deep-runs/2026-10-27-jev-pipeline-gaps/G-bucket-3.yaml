  title: Multiple-choice with 3-6 options and no abstain option forces a pick when the transcript holds no evidence for any
    option
  level: L4
  cell:
    stage: answer-options
    question-shape: fits-no-option
    correctness-failure: forced-choice-bias
    data-element: option
  object: '''a fixed set of questions with options'''
  situation: 'Player''s reason for quitting is a phone call (not on the list of 4 options: confusing, boring, too hard, bug)'
  consequence: LLM picks 'boring'; the cohort chart shows boredom inflated by every off-list cause
  p_typical: 0.4
  grounded: quote
  evidence: The transcript is run through a fixed set of questions with options, written per game target.
  proposed: Every question gets 'not discussed' and 'other (free text)' options; measure the share of each per question per
