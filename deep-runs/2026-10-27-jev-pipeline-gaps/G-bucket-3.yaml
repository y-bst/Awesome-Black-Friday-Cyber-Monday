- id: analyst-33
  title: Count question ('how many deaths in the tutorial?') stored as per-video buckets that cannot be summed
  level: L4
  cell:
    question-shape: answer-is-a-count
    studio-question-type: cohort-count
    stage: answer-options
    session-shape: 2-4-videos
  object: multiple-choice answer options
  situation: Option set 0 / 1-2 / 3+ per video; tutorial spans videos 1-2; analyst asks 'average deaths before finishing the
    tutorial'
  consequence: Bot adds bucket midpoints or picks the max bucket; '3+' in two videos becomes 6 or 3; reported average is an
    artefact of bucket choice
