- id: uxr-4
  title: '''Player never noticed the tutorial arrow'' and ''noticed it and ignored it'' both produce silence; the table stores
    one value for both'
  level: L3
  cell:
    stage: answer-options
    question-shape: negation-player-never-did-x
    data-element: null-vs-no
    studio-question-type: cohort-why
    correctness-failure: null-treated-as-no
  object: answer options of a question like 'Did the player follow the tutorial prompt?'
  situation: Highlighted arrow or pulsing button on screen; player does not mention it in a 15-minute video
  consequence: Option 'No' conflates 'did not see' (a visibility problem) with 'chose not to' (a motivation problem); cohort-why
    answers to 'why do players skip step 3' give the wrong fix direction
  p_typical: 0.06
  grounded: inferred
  evidence: Transcript loses visual information.
  proposed: Split option into 'mentioned and ignored' / 'never mentioned' / 'cannot tell' and forbid the chatbot from reading
    'never mentioned' as 'did not notice'
  shallow: false
  _from_file: E-ux-researcher.yaml
- id: uxr-27
  title: Options carry no severity, so a 'recommendation' query cannot rank a blocker hit by 5% against a minor annoyance
    hit by 60%
  level: L3
  cell:
    stage: answer-options
    studio-question-type: recommendation-what-should-we-change
    data-element: option
    chatbot-response-behaviour: answers-from-general-game-knowledge
    scale: 500-players
  object: answer options (3-6 per question)
  situation: Studio asks 'what should we fix first in the tutorial?'
  consequence: Chatbot ranks by frequency only, or fills in from general game-design knowledge; researchers rank by severity
    x frequency (blocker / major / minor / cosmetic)
  p_typical: 0.06
  grounded: inferred
  evidence: Buyers are gaming studios. Their questions are not known in advance.
  proposed: Per issue answer add a 4-level severity field with definitions (1 = blocked progress ... 4 = cosmetic)
  shallow: false
  _from_file: E-ux-researcher.yaml
