- id: moderator-1
  title: Moderator tags build 1.4.2 on a session actually played on 1.4.3, so a compare-two-versions answer is built on a
    mislabelled cohort
  level: L4
  cell:
    stage: build-and-metadata-tagging
    data-element: build-id
    studio-question-type: compare-two-versions
    correctness-failure: right-answer-wrong-player
    time-and-change: game-update-changes-tutorial
  object: step 3 'fixed set of questions ... written per game target' plus the Unspecified list, which never says where build
    or game-version comes from
  situation: A moderator types the build by hand at session start; 6 of 40 sessions in the 1.4.3 cohort are tagged 1.4.2 after
    a mid-day build swap, and nothing in the video or transcript carries the build
  consequence: The studio asks 'did tutorial churn drop after 1.4.3?' and the chatbot reports a drop that is partly 1.4.2
    players; the studio ships or reverts a tutorial change on a contaminated 15% of the cohort
  p_typical: 0.08
  grounded: inferred
  evidence: 'Unspecified: ... how videos of one session are linked. (build/version tagging is not mentioned anywhere in spec.md)'
  proposed: Read build-id from the capture client at record start and store the moderator-typed value as a separate field;
    flag sessions where the two disagree
  shallow: false
- id: moderator-2
  title: A player ID typed twice for two different players merges both into one player row and one timeline
  level: L3
  cell:
    stage: recruitment-and-consent
    data-element: player
    session-shape: same-player-multiple-sessions
    correctness-failure: right-answer-wrong-player
    studio-question-type: timeline-of-one-player
  object: step 3 'structured table per video' keyed implicitly by player; no player identity rule exists in spec.md
  situation: Moderator reuses ID P-117 for a walk-in replacement after the first P-117 no-showed; both sessions upload with
    the same player ID
  consequence: '''Timeline of P-117'' shows two different voices as one person, and a find-players-who query counts one player
    where there were two (500 players reads as 499)'
  p_typical: 0.07
  grounded: speculative
  evidence: none
  proposed: Issue player IDs from the recruitment system, never typed, and reject an upload whose ID already has a session
    with a different consent record
  shallow: false
