- id: skeptic-1
  title: "Studio asks about a tutorial step no fixed question covers; with no raw-transcript fallback the chatbot answers from the nearest column instead of saying 'not captured'"
  level: L4
  cell: {stage: chatbot-query-planning, studio-question-type: question-about-a-step-the-set-never-asked, fast-path-dependency: question-requires-raw-transcript-fallback, chatbot-response-behaviour: substitutes-nearest-fixed-question}
  object: "fixed question set -> chatbot; spec item 4 (chatbot answers 'from that table')"
  situation: "Analyst asks 'how many players skipped the inventory pop-up?'; the set only has 'Did the player express confusion during the tutorial?' with 4 options"
  consequence: "Bot reports the confusion count as if it were the skip count; analyst gets a confident number for a question the table never asked"
  p_typical: 0.35
  grounded: quote
  evidence: "Their questions are not known in advance. / A chatbot for the gaming studio answers the studio's questions from that table"
  proposed: "Query planner must emit a coverage verdict (exact column / partial / none) and on 'none' route to a raw-transcript path or reply 'not in the captured questions' with the list of nearest columns"
  shallow: false
- id: skeptic-2
  title: "No 'minutes' answer tier: an uncovered studio question could be answered by extracting one new column over 500 players x ~12 videos (~6,000 LLM calls) but the spec only defines 'fast' or nothing"
  level: L3
  cell: {stage: rerun-and-backfill, scale: 500-players, latency: minutes, recovery-action: backfill-after-question-set-change, question-shape: question-not-in-set}
  object: "constraint 'Answering a studio's question must be fast' vs 'Ingestion time and cost are not a concern'"
  situation: "Studio asks a question outside the set; ingestion-side extraction is cheap by the owner's own constraint, so a 6,000-call backfill parallelised at 200 concurrent calls finishes in roughly 3-5 minutes"
  consequence: "Question is either refused or mis-answered when a correct answer was available in 5 minutes; the cheap side of the system (ingest) is never used for unknown questions"
  p_typical: 0.08
  grounded: inferred
  evidence: "Ingestion time and cost are not a concern. Answering a studio's question must be fast."
  proposed: "Add an async path: chatbot replies 'not precomputed; extracting over 500 players, ETA 5 min', runs a one-off column job, notifies the analyst, and stores the column"
  shallow: false
- id: skeptic-3
  title: "No promotion rule from repeated studio questions into the fixed question set, so the set never grows toward what studios actually ask"
  level: L3
  cell: {stage: question-set-registry, data-element: question-set-version, question-shape: question-not-in-set, time-and-change: question-set-revised}
  object: "fixed question set 'written per game target'; spec goal (b) 'the framework for generating the questions so that any type of question can be answered'"
  situation: "Three analysts at one studio ask variants of 'did players notice the daily reward?' within 7 days; no log of uncovered questions feeds the question author"
  consequence: "The set stays at its launch size; the owner's named problem 'The question set is small' is never reduced by real demand"
  p_typical: 0.06
  grounded: inferred
  evidence: "The question set is small, so most of what is in the video and transcript is never captured."
  proposed: "Log every uncovered question with its coverage verdict; when a cluster reaches 3 asks in 14 days, open a draft question+options for the question author and backfill it"
  shallow: false
- id: skeptic-4
  title: "Per-video rows for tutorial-only questions: in a 12-video session, 11 videos answer 'did not happen', and a count over rows uses videos (6,000) not players (500) as the denominator"
  level: L4
  cell: {stage: per-video-answers, session-shape: 5-20-videos, question-shape: event-did-not-happen-in-this-video, correctness-failure: wrong-denominator}
  object: "'The answers form a structured table per video.' + targets 'mostly detecting churn in the tutorial'"
  situation: "Question 'Did the player quit during the tutorial?' is run on every video of a 3-hour session; the tutorial lives in video 1"
  consequence: "Bot reports '4% of sessions quit in tutorial' when it divided 240 'Yes' by 6,000 video rows; true player rate is 48%"
  p_typical: 0.12
  grounded: quote
  evidence: "The answers form a structured table per video."
  proposed: "Store answers per session (or per tutorial window) for session-scoped questions; tag each question with its unit (video, session, player) and assert the denominator unit in the SQL"
  shallow: false
- id: skeptic-5
  title: "Answers table stores the option but not the evidence span (utterance + timestamp), so no answer can be re-checked against the transcript later"
  level: L4
  cell: {stage: answers-table, data-element: evidence-span, studio-question-type: quote-me-evidence, correctness-failure: confident-no-evidence}
  object: "answers table row (video, question, option)"
  situation: "Analyst asks 'show me what player 0417 said that made you pick confusing-controls'"
  consequence: "The bot must re-read the 15-minute transcript to find a quote, which takes the slow path the table was built to avoid, or it fabricates a quote"
  p_typical: 0.2
  grounded: inferred
  evidence: "The answers form a structured table per video."
  proposed: "Add evidence_span {video_id, start_s, end_s, quote<=40 words} to every answer row; assert non-null for any option other than 'not mentioned'"
  shallow: false
- id: skeptic-6
  title: "Replacing the table with a long-context model over raw transcripts does not recover the named visual loss; both paths attribute a colour-only cue miss to a verbal option"
  level: L3
  cell: {stage: transcription, speech-shape: silent-player, question-shape: answer-needs-visuals, correctness-failure: perceptual-cause-attributed-to-verbal-option}
  object: "spec item 2 'what is on screen is largely lost'"
  situation: "Silent player stands for 4 minutes next to a glowing quest marker they never notice, then quits"
  consequence: "Table picks 'lost interest'; a long-context model over the same transcript has the same blind spot, so the structure-vs-raw debate does not touch the first lossy step"
  p_typical: 0.15
  grounded: quote
  evidence: "The owner's view: the transcript alone is not enough; what is on screen is largely lost."
  proposed: "Decide the visual channel separately (sampled frames every 5 s, OCR, or telemetry join) before redesigning the question layer; tag questions whose answer needs visuals as 'unanswerable from audio'"
  shallow: false
- id: skeptic-7
  title: "Spec does not say whether the chatbot loads the table into LLM context or queries it; with 50 questions x 12 videos x 500 players (300,000 rows) the context path silently truncates"
  level: L4
  cell: {stage: chatbot-query-planning, scale: question-set-of-50-questions, fast-path-dependency: table-fits-in-llm-context, chatbot-response-behaviour: silently-truncates-rows}
  object: "spec item 4 'answers the studio's questions from that table'; Unspecified 'latency and cost limits per query'"
  situation: "The set grows from 8 to 50 questions to answer more studio questions; the table no longer fits a 200k-token context"
  consequence: "Bot answers from the first N rows it was given; counts drop with no warning; growing the set (the owner's fix) breaks the fast path"
  p_typical: 0.09
  grounded: inferred
  evidence: "current question count and answer types, latency and cost limits per query"
  proposed: "Fix the fast path as SQL/aggregates; assert in the planner that rows_read == rows_matching and print n in every answer"
  shallow: false
- id: skeptic-8
  title: "Multiple-choice with 3-6 options and no abstain option forces a pick when the transcript holds no evidence for any option"
  level: L4
  cell: {stage: answer-options, question-shape: fits-no-option, correctness-failure: forced-choice-bias, data-element: option}
  object: "'a fixed set of questions with options'"
  situation: "Player's reason for quitting is a phone call (not on the list of 4 options: confusing, boring, too hard, bug)"
  consequence: "LLM picks 'boring'; the cohort chart shows boredom inflated by every off-list cause"
  p_typical: 0.4
  grounded: quote
  evidence: "The transcript is run through a fixed set of questions with options, written per game target."
  proposed: "Every question gets 'not discussed' and 'other (free text)' options; measure the share of each per question per week"
  shallow: false
- id: skeptic-9
  title: "When the extractor picks 'Other', the words that made it pick Other are not kept, so the cheapest signal for new options is discarded"
  level: L3
  cell: {stage: answer-options, question-shape: fits-no-option, correctness-failure: other-option-overused, question-set-version-state: option-added}
  object: "answer option 'Other' in the answers table"
  situation: "'Other' reaches 30% of answers for 'Why did the player stop?' across 500 players"
  consequence: "Question author cannot see what the 150 'Other' players said without reading 150 transcripts; the option list stays wrong"
  p_typical: 0.07
  grounded: inferred
  evidence: "The question set is small, so most of what is in the video and transcript is never captured."
  proposed: "Store other_text (<=30 words) with each Other answer; cluster other_text weekly and propose new options when a cluster exceeds 5% of answers"
  shallow: false
- id: skeptic-10
  title: "No per-session free-text summary layer between transcript and table; a 500-token summary per player would let a long-context model read 500 players (~250k tokens) for cohort-why"
  level: L3
  cell: {stage: session-level-aggregation, studio-question-type: cohort-why, scale: 500-players, latency: under-30s, fast-path-dependency: table-fits-in-llm-context}
  object: "spec item 4 'Reading 500 transcripts per question was too slow and too much data'"
  situation: "Analyst asks 'why do players who quit in the tutorial say they quit?'; the table holds only option counts"
  consequence: "Bot answers with option percentages, never with reasons the options did not anticipate; a cheaper middle layer than full transcripts was never evaluated"
  p_typical: 0.06
  grounded: quote
  evidence: "Reading 500 transcripts per question was too slow and too much data, which is why the fixed-question table exists."
  proposed: "At ingest, write a structured free-text session summary (tutorial events, quit moment, top 3 complaints, <=500 tokens); chatbot reads filtered summaries for why-questions"
  shallow: false
- id: skeptic-11
  title: "Per-video answers for one session contradict (video 1 'confused', video 3 'bored') and no rule picks the session answer"
  level: L4
  cell: {stage: session-level-aggregation, session-shape: 5-20-videos, question-shape: answer-spans-videos, correctness-failure: inconsistent-across-videos}
  object: "'one session is many videos' + 'a structured table per video'"
  situation: "Question 'Main frustration?' answered on each of 8 videos of a 2-hour session gives 3 different options"
  consequence: "A cohort count either counts the player 3 times or picks one by an unstated rule; the same player appears in three 'why' buckets"
  p_typical: 0.2
  grounded: quote
  evidence: "A session can be n hours; each video is capped at 15 minutes, so one session is many videos."
  proposed: "Run session-scoped questions once over the stitched session transcript; for per-video questions define the session roll-up (first, last, any, majority) per question"
  shallow: false
- id: skeptic-12
  title: "The 15-minute capture cap is carried into extraction: a 3-hour transcript (~35k tokens) fits one long-context call, yet each question sees only one video"
  level: L3
  cell: {stage: extraction-prompt, session-shape: 5-20-videos, question-shape: answer-depends-on-prior-video, data-element: transcript}
  object: "'each video is capped at 15 minutes' and 'Each video is converted to a transcript'"
  situation: "Question 'Did the player return to the tutorial after failing it?' needs video 2 (fail) and video 5 (return)"
  consequence: "Video 5's extraction has no context of the earlier fail, answers 'No'; a split that exists only because of capture limits causes the error"
  p_typical: 0.07
  grounded: quote
  evidence: "each video is capped at 15 minutes, so one session is many videos."
  proposed: "Stitch transcripts per session before extraction when total tokens < 100k; keep per-video timestamps as offsets"
  shallow: false
- id: skeptic-13
  title: "10-hour session (~120k transcript tokens) exceeds a whole-session extraction budget; no chunking rule is defined for either the table or a long-context path"
  level: L3
  cell: {stage: session-stitching, session-shape: 10-plus-hour-session, scale: 1-player-10-hour-session, transcription-subsystem: truncated-at-length-limit}
  object: "named problem 'Long multi-video sessions.'"
  situation: "One player streams 10 hours (40 videos); stitched transcript at ~150 words/min is ~90k words"
  consequence: "Whole-session questions are either truncated after the first N tokens (losing the end, where long-session churn happens) or fall back to per-video answers with contradictions"
  p_typical: 0.05
  grounded: quote
  evidence: "Long multi-video sessions."
  proposed: "Define a hierarchical rule: per-hour summaries, then session pass over summaries; assert session_token_count is logged and truncation raises a flag on the row"
  shallow: false
- id: skeptic-14
  title: "Spec does not say transcripts are kept after extraction; if they are discarded, no new question can ever be answered for past sessions"
  level: L3
  cell: {stage: retention-and-deletion, data-element: transcript, time-and-change: question-set-revised, recovery-action: backfill-after-question-set-change}
  object: "Unspecified list; answers table as the only stored product"
  situation: "Question set v2 adds 'Did the player notice the map?' six months after 500 sessions were processed"
  consequence: "If only the table was retained, v2 is blank for all historical players and version comparisons over time are impossible"
  p_typical: 0.08
  grounded: inferred
  evidence: "What a transcript contains (speech only, on-screen text, events) ... how videos of one session are linked."
  proposed: "Declare raw transcripts (with timestamps) the source of truth and the table a rebuildable view; set a retention period and backfill policy per question-set version"
  shallow: false
- id: skeptic-15
  title: "Questions target the tutorial, so for a 3-hour session roughly 90% of recorded minutes (videos 2-12) produce no captured answers beyond 'did not happen'"
  level: L4
  cell: {stage: fixed-question-set, time-and-change: game-target-changes-beyond-tutorial, studio-question-type: question-outside-game-target, chatbot-response-behaviour: answers-from-general-game-knowledge}
  object: "'The targets are mostly detecting churn in the tutorial and just after it.'"
  situation: "Studio asks 'what did players say about the shop at hour 2?'"
  consequence: "No column exists; bot answers from general knowledge of the genre or refuses; 165 of 180 minutes per session were transcribed and paid for but never queryable"
  p_typical: 0.06
  grounded: quote
  evidence: "The targets are mostly detecting churn in the tutorial and just after it."
  proposed: "Measure minutes-with-any-non-null-answer / recorded minutes per session; add a generic per-video summary or topic tags for minutes outside the target"
  shallow: false
- id: skeptic-16
  title: "Chatbot cannot tell the analyst what it can answer: no catalogue of fixed questions, options and versions is exposed"
  level: L4
  cell: {stage: chatbot-answer, studio-question-type: what-can-you-answer, chatbot-response-behaviour: refuses-answerable-question, question-set-version-state: single-version}
  object: "fixed question set; studio chatbot"
  situation: "New analyst asks 'what can you tell me?' and then asks a near-miss wording of an existing question"
  consequence: "Bot refuses a question that is in the set under different wording, or the analyst never learns the boundary the table imposes"
  p_typical: 0.09
  grounded: inferred
  evidence: "Their questions are not known in advance."
  proposed: "Expose the question/option catalogue with versions and sample sizes as a chatbot tool; on refusal, list the 3 nearest catalogue questions"
  shallow: false
- id: skeptic-17
  title: "Time-valued questions binned into options ('<2 min / 2-5 / >5') cannot answer duration distributions, and per-video timestamps reset at 0 so durations across videos are not computable"
  level: L4
  cell: {question-shape: answer-is-a-time, studio-question-type: distribution-not-count, transcription-subsystem: timestamps-reset-per-video, data-element: timestamp}
  object: "multiple-choice options; per-video transcript timestamps"
  situation: "Analyst asks 'median time to finish tutorial step 3' where step 3 starts at 14:10 of video 1 and ends at 02:30 of video 2"
  consequence: "Bot returns bucket counts or a wrong median; the 2:20 span is read as two unrelated partial events"
  p_typical: 0.06
  grounded: inferred
  evidence: "each video is capped at 15 minutes, so one session is many videos."
  proposed: "Store event timestamps as session offsets (video_index*900 + t); allow numeric answer types alongside options"
  shallow: false
- id: skeptic-18
  title: "Count-valued questions answered as option buckets per video ('0 / 1-2 / 3+') cannot be summed across a session's videos"
  level: L4
  cell: {stage: session-level-aggregation, question-shape: answer-is-a-count, session-shape: 2-4-videos, correctness-failure: wrong-denominator}
  object: "multiple-choice options per video"
  situation: "'How many times did the player die in the tutorial?' gives '1-2' in video 1 and '1-2' in video 2"
  consequence: "Session total could be 2 to 4; the bot reports '1-2' or '2-4' with no rule; a deaths-per-player chart is wrong"
  p_typical: 0.05
  grounded: inferred
  evidence: "The transcript is run through a fixed set of questions with options"
  proposed: "Integer answer type for count questions, summed at session roll-up; reject bucketed options for any question tagged 'count'"
  shallow: false
- id: skeptic-19
  title: "'Find players who never did X' over a table that records 'not mentioned' per video conflates never-did with never-said"
  level: L4
  cell: {studio-question-type: find-players-who, question-shape: negation-player-never-did-x, data-element: null-vs-no, correctness-failure: null-treated-as-no}
  object: "answers table rows per video"
  situation: "Analyst asks for players who never opened settings; 410 of 500 have no mention in any video"
  consequence: "Bot returns 410 'never opened settings' players; many opened it silently, which audio cannot show"
  p_typical: 0.08
  grounded: inferred
  evidence: "Transcript loses visual information."
  proposed: "Distinguish 'observed no', 'not mentioned' and 'unknowable from audio' in stored answers; bot must label negation answers as 'not mentioned' unless evidence exists"
  shallow: false
- id: skeptic-20
  title: "A raw-transcript fallback built on top-k retrieval answers a cohort count from a 50-chunk sample out of 6,000 videos and reports it as the cohort rate"
  level: L4
  cell: {fast-path-dependency: question-requires-raw-transcript-fallback, scale: 500-players, correctness-failure: wrong-denominator, chatbot-response-behaviour: invents-number}
  object: "spec item 4 'Reading 500 transcripts per question was too slow'"
  situation: "Team adds a vector-search fallback for uncovered questions; analyst asks 'what % mentioned the camera?'"
  consequence: "Retrieval returns 50 chunks from 31 players; bot says '62% mentioned the camera' (31/50) instead of an unknown share of 500"
  p_typical: 0.04
  grounded: inferred
  evidence: "Reading 500 transcripts per question was too slow and too much data"
  proposed: "Retrieval fallback may answer 'which players / quotes' but never a percentage; percentages only from a full-coverage column with n stated"
  shallow: false
- id: skeptic-21
  title: "An uncovered question answered once on the slow path is not written back as a column, so the next analyst asking it waits again"
  level: L3
  cell: {stage: aggregate-cache, fast-path-dependency: cache-hit, latency: minutes, question-shape: question-not-in-set}
  object: "answers table as the only fast store"
  situation: "Analyst A waits 5 minutes for 'did players read the controls card?'; analyst B asks the same thing the next day"
  consequence: "Second ask pays the full slow path; slow-path answers for A and B may differ (different run), so two decks show two numbers"
  p_typical: 0.04
  grounded: inferred
  evidence: "Answering a studio's question must be fast."
  proposed: "Persist every slow-path extraction as a versioned ad-hoc column with run id; later asks hit it in under 2 s and cite the run id"
  shallow: false
- id: skeptic-22
  title: "Options that name tutorial steps ('stuck at crafting step') become invalid when a game update removes that step; the table is only comparable within one tutorial layout"
  level: L3
  cell: {question-set-version-state: per-game-version-fork, time-and-change: game-update-changes-tutorial, studio-question-type: compare-two-versions, data-element: game-version}
  object: "'a fixed set of questions with options, written per game target'"
  situation: "Build 1.4 merges crafting into the inventory step; studio asks 'did 1.4 reduce tutorial churn vs 1.3?'"
  consequence: "1.4 answers forced into 1.3 options; the comparison mixes incompatible option sets and shows a fake change"
  p_typical: 0.1
  grounded: quote
  evidence: "The transcript is run through a fixed set of questions with options, written per game target."
  proposed: "Key question sets by game_version; a version comparison is allowed only on question ids marked stable across both versions"
  shallow: false
- id: skeptic-23
  title: "Single-player questions are routed through the table even though one 3-hour transcript (~35k tokens) fits one long-context call in under 30 s"
  level: L3
  cell: {studio-question-type: timeline-of-one-player, scale: 1-player, fast-path-dependency: question-requires-raw-transcript-fallback, latency: under-30s}
  object: "spec item 4: the table exists because 500 transcripts per question was too slow"
  situation: "Analyst asks 'walk me through what player 0417 did in their first hour'"
  consequence: "Bot stitches 4 videos' option rows into a thin timeline when the raw transcript would answer fully; the table's reason (500 transcripts) does not apply at n=1"
  p_typical: 0.07
  grounded: quote
  evidence: "so that a question over, say, 500 players is fast. Reading 500 transcripts per question was too slow"
  proposed: "Planner routes by scope: n <= 5 players -> raw transcript; n > 5 -> table/aggregates"
  shallow: false
- id: skeptic-24
  title: "No hybrid plan of 'filter with the table, explain with transcripts': 500 -> 40 tutorial quitters -> read only their video-1 transcripts (~40 x 2.5k = 100k tokens)"
  level: L3
  cell: {stage: chatbot-query-planning, studio-question-type: cohort-why, scale: 500-players, fast-path-dependency: precomputed-aggregate-exists}
  object: "answers table + transcripts; spec item 4"
  situation: "Analyst asks why tutorial quitters quit; the table identifies the 40 quitters"
  consequence: "Without the hybrid, the bot either gives option counts only or reads 500 transcripts (the rejected path); the 40-player read is fast enough but unused"
  p_typical: 0.05
  grounded: inferred
  evidence: "Reading 500 transcripts per question was too slow and too much data, which is why the fixed-question table exists."
  proposed: "Two-step planner: SQL selects players and video windows; long-context call reads only those windows, capped at 150k tokens, and cites player ids"
  shallow: false
- id: skeptic-25
  title: "All fixed questions answered in one prompt per video, so answers are correlated (a 'frustrated' pick pulls 'confusing' and 'too hard' toward yes) though one call per question is affordable at ingest"
  level: L4
  cell: {stage: extraction-prompt, correctness-failure: forced-choice-bias, data-element: prompt-version, question-shape: two-options-both-partly-true}
  object: "'The transcript is run through a fixed set of questions'; Unspecified 'current question count and answer types'"
  situation: "8 questions in one prompt; player says 'ugh' 6 times"
  consequence: "Cross-question correlation inflates co-occurrence charts (frustrated AND confused) that the studio reads as a finding"
  p_typical: 0.05
  grounded: inferred
  evidence: "Ingestion time and cost are not a concern."
  proposed: "A/B 50 videos: batched prompt vs one call per question; if pairwise agreement differs by >10 points, split calls"
  shallow: false
- id: skeptic-26
  title: "The table erases speaker provenance, so a moderator's leading line becomes a player answer and nobody can see it afterwards"
  level: L3
  cell: {stage: transcription, speech-shape: moderator-speaking-or-leading, correctness-failure: moderator-words-attributed-to-player, data-element: utterance}
  object: "transcript -> per-video answers"
  situation: "Moderator says 'a lot of people find this part confusing'; player says 'yeah'"
  consequence: "Answer 'found tutorial confusing = Yes' with no speaker; a raw-transcript reader with diarisation would see the lead, the table cannot"
  p_typical: 0.06
  grounded: inferred
  evidence: "What a transcript contains (speech only, on-screen text, events)"
  proposed: "Diarise; pass speaker labels to extraction; store evidence_speaker and drop answers whose only evidence is non-player speech"
  shallow: false
- id: skeptic-27
  title: "Speech-to-text hallucinates words over a silent 15-minute video with game music, and the extractor converts them into a confident option row"
  level: L4
  cell: {transcription-subsystem: hallucinated-text-on-silence-or-music, speech-shape: silent-player, correctness-failure: transcription-hallucination-propagated, processing-status: transcribed}
  object: "transcription stage -> per-video answers"
  situation: "Player is silent; transcript contains 3 repeated lines of song lyrics and 'thanks for watching'"
  consequence: "Table shows 'engaged / positive' for that video; the table form hides that the source text was noise"
  p_typical: 0.06
  grounded: inferred
  evidence: "Each video is converted to a transcript."
  proposed: "Store per-video speech_seconds and ASR confidence; skip extraction and write 'unknown' when player speech < 30 s"
  shallow: false
- id: skeptic-28
  title: "No offline benchmark that measures how much the table loses versus a raw-transcript answer on the same studio questions"
  level: L4
  cell: {stage: answers-table, correctness-failure: confident-no-evidence, studio-question-type: cohort-why, scale: 50-players}
  object: "named problem 'most of what is in the video and transcript is never captured'"
  situation: "Team debates adding questions vs a raw-transcript path with no data on which answers differ"
  consequence: "The redesign is chosen on opinion; the share of studio questions the table answers correctly is unknown"
  p_typical: 0.05
  grounded: quote
  evidence: "The question set is small, so most of what is in the video and transcript is never captured."
  proposed: "Build a 50-session, 20-question gold set; report per question: table-path accuracy, raw-path accuracy, latency; decide per question type"
  shallow: false
- id: skeptic-29
  title: "A raw-transcript or on-demand path is non-deterministic: a number pasted into a deck cannot be reproduced on re-ask, whereas the table answer can"
  level: L4
  cell: {answer-afterlife: copied-into-deck, chatbot-response-behaviour: differs-on-re-ask, fast-path-dependency: question-requires-raw-transcript-fallback, data-element: extraction-run-id}
  object: "chatbot answer; answers table"
  situation: "PM pastes '38% mentioned the camera' into a deck; re-asked two weeks later the raw path says 34%"
  consequence: "Answer cannot be defended in review; this is the table design's real strength and the spec does not name it as a requirement to keep"
  p_typical: 0.04
  grounded: inferred
  evidence: "Answering a studio's question must be fast."
  proposed: "Every answer carries extraction_run_id and question-set version; raw-path answers are persisted and re-served by id"
  shallow: false
- id: skeptic-30
  title: "A shared transcript index for a raw-text fallback returns chunks from another studio's sessions when no tenant filter is applied"
  level: L4
  cell: {stage: access-control, tenancy: many-studios-shared-infra, fast-path-dependency: question-requires-raw-transcript-fallback, chatbot-response-behaviour: answers-in-wrong-tenant-scope}
  object: "chatbot for 'the gaming studio'; Buyers are gaming studios"
  situation: "Studio A asks 'what do players say about stamina systems?'; the nearest chunks are from studio B's game"
  consequence: "Studio A sees studio B's player quotes; the per-game table scoped by game id did not have this exposure"
  p_typical: 0.03
  grounded: inferred
  evidence: "Buyers are gaming studios."
  proposed: "Partition the index by studio_tenant; test: query as tenant A, assert 0 results with tenant_id != A"
