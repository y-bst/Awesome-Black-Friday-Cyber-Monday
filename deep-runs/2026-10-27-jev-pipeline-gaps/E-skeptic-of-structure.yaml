- id: skeptic-31
  title: "Player deletion must purge transcript, answer rows, ad-hoc columns, session summaries and the vector index; the more raw text is kept for flexibility, the more places to purge"
  level: L3
  cell: {stage: retention-and-deletion, time-and-change: player-deletion-request, recovery-action: delete-and-propagate, processing-status: deleted-by-request}
  object: "transcripts and answers table"
  situation: "Player 0417 requests deletion after their quotes were cached in a slow-path column and a session summary"
  consequence: "Table rows deleted but quotes survive in summaries or embeddings and resurface in a chatbot answer"
  p_typical: 0.03
  grounded: speculative
  evidence: "none"
  proposed: "Register every derived store keyed by player_id; deletion job asserts zero rows for the player in each registered store"
