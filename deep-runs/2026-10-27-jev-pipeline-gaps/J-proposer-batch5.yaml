- id: "percep-29"
  case: "The spec itself says 'Transcript loses visual information' and 'most of what is in the video and transcript is never captured', yet the cohort 'why did they leave' answer is normalised to 100% over five verbal causes, so the table is structurally incapable of recording a visibility cause and the chatbot still reports a complete-looking distribution ('lost interest 41%, too hard 30%, unclear 18%, bug 7%, other 4%'). The harm is not a missing number but a false one: a studio reading that breakdown concludes there are no visibility or UI-readability problems in the tutorial, which is exactly the class of failure a think-aloud transcript cannot see. Tutorial churn is the named target of the whole pipeline, and 'why do players leave the tutorial' is the first question every studio will ask, so this fires on the headline use case rather than an edge case. Detectability is the worst score possible (5): nothing in the answer, the table or the chatbot signals that a cause class was unobservable, so neither the studio nor JEV will notice until a playtest contradicts a shipped design decision. The fix is cheap and local to the answer layer: state which cause classes the question set can observe, compute shares over 'reasons observable from speech', and add an explicit 'not observable from speech' row. Doing it now, before more studios onboard, prevents a library of confidently wrong cause breakdowns from becoming the reference numbers studios quote internally and that JEV later has to walk back."
- id: "uxr-5"
  case: "The spec says 'A session can be n hours; each video is capped at 15 minutes, so one session is many videos', but nothing in the pipeline accounts for the well-known decay of think-aloud narration, so by video 3-4 a player may be speaking under 20 words per minute against ~120 in video 1. Per-video LLM answers on a near-empty transcript default to 'no issue' or 'not frustrated', and when aggregated by video index the cohort shows frustration falling steadily after the tutorial. That artefact lands precisely in the 'just after the tutorial' window the owner names as a core target ('detecting churn in the tutorial and just after it'), so the studio is told its post-tutorial experience is fine because players stopped talking, not because they stopped struggling. The error is invisible in the answers table (detectability 5), occurs in essentially every long session (occurrence 4), and inverts the direction of a finding a studio would act on. The proposed fix is small and mechanical: store words-per-minute per video at ingestion, which is already allowed to be slow and costly, and have aggregation exclude or flag sub-30-wpm videos as low-signal instead of counting them as 'no issue'. Fixing it now matters because every cohort trend already computed over video index carries this bias, and each new onboarding adds more long sessions that dilute real post-tutorial signals with silent videos."
- id: "qauthor-18"
  case: "Why-questions such as 'Why did the player stall?' offer only verbal causes ('boring', 'confusing text', 'controls', 'other'), while the spec states plainly that 'Transcript loses visual information', so a player who misses a low-contrast arrow, goes silent for 90 seconds and quits is forced into a motivation or text category by the LLM. Multiple-choice extraction has no abstain path here, so the model answers with apparent confidence and the table records a visual failure as 'boring', which the studio then tries to fix with pacing or reward changes that cannot work. This is a correctness gap in the core artefact the chatbot reads, not a presentation issue, and it recurs on every why-question for every game targeting tutorial churn, the pipeline's main target. It also corroborates a second independent finding (extract-23), so two perspectives reached the same failure from the question-authoring and extraction sides. Detection is effectively impossible downstream (score 5) because a wrong option looks identical to a right one in the table. The fix is a one-line change to the question framework the owner already wants to improve ('the framework for generating the questions'): add 'cannot tell from audio (possible visual cause)' to every why-question and report its share. Doing it before more studios rely on chatbot answers stops misattributed causes from accumulating in the store, which cannot be corrected later without re-running every video."
- id: "eval-1"
  case: "The spec describes a 'fixed set of questions with options, written per game target' run by an LLM over each transcript, but there is no labelled gold set for any question, so nobody at JEV can say whether a given question is right 95% or 60% of the time. Every number the studio chatbot returns, from tutorial churn counts to cause breakdowns, inherits that unknown error rate, and studios asking about 500 players have no way to tell a real effect from extraction noise. This is the precondition for evaluating every other gap in this list: without per-question accuracy, the team cannot verify that fixes for visual causes, narration decay or churn definitions actually helped, nor detect regressions when prompts or models change. Occurrence is certain (5) because it applies to every question for every onboarded game today. The spec explicitly allows ingestion cost and time to be high ('Ingestion time and cost are not a concern'), so labelling around 150 videos per question set before go-live is within the stated budget and reuses videos that already exist. Doing it now, before the next studio onboarding, means the first numbers that studio sees come with a published accuracy and interval instead of an implicit promise JEV cannot back if a studio challenges a result."
- id: "uxr-28"
  case: "The owner names this as a known problem in the spec: 'The question set is small, so most of what is in the video and transcript is never captured.' The consequence is concrete: an issue nobody wrote a question for, such as a soft-lock hit by 40 of 500 players, never enters the answers table, and when a studio asks about it the chatbot answers from the nearest fixed question and the studio concludes the issue does not exist. Usability research practice is that the most important findings are the ones researchers did not plan to look for, and the constraint that 'Their questions are not known in advance' means the fixed set will always lag what studios need. Because absence in the table is indistinguishable from absence in the game (detectability 5), the cost is silent and falls on the studio that ships with a known-to-the-recordings bug. The fix fits the spec's own trade-off: ingestion cost is acceptable, so add one open-ended per-video extraction of 'notable problems not covered by the set', store it as text plus embeddings, and run a weekly clustering report that also feeds candidate new questions into the question framework. Starting now means every video ingested from this point carries that signal, rather than requiring a full re-run of all past videos once the gap is finally admitted."
