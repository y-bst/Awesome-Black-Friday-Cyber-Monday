expert_missing:
- Transcription stage has no human reference transcripts per language, accent, device and game-audio level, so word error rate is unknown and a per-question accuracy figure cannot separate ASR error from
  extraction error.
- Rows that are low-confidence, 'Other', vendor-refused or parse-repaired go straight from extraction into the answers table; no sampled human spot-check (for example 2% of rows per game per week, 100%
  of a new game's first cohort) gates publication.
- 'Text-to-SQL planner sees the answers table with no data dictionary: question ids, option ids, the null codes ''not processed / not observed / not applicable'' and the ''players who reached step N'' denominator
  are undocumented, so each query re-derives ''tutorial churn rate''.'
- Studio asks 'how many players churned in the tutorial?' and the chatbot silently picks one reading (quit the session, skipped the tutorial, never returned) without asking back or stating the definition
  in the answer.
- Post-session questionnaire ('would you keep playing?', self-rated confusion) and recruitment screener (genre experience, age band, platform) are collected by playtest ops but never joined to the session
  row, so extracted churn answers cannot be checked against self-report or segmented by experience.
- Game is hot-patched or a remote-config tutorial variant flips at video 4 of an 8-video session, but build_id is tagged once per session, so compare-two-versions credits post-patch behaviour to the old
  build.
- Speech-to-text keeps only words, so raised volume, rising pitch, faster speech and exhales over neutral words ('okay. okay. OKAY.') never reach the 'expressed frustration' question; no per-utterance acoustic
  feature column exists.
- When on-screen frames are added to fix the visual loss, no rule fixes frame sampling rate against sub-second tutorial cues, OCR language for localised UI, alignment of frame time to utterance time across
  the 15:00 cut, or an answer_source column (audio, vision, both), so audio-only and vision-derived rows are summed in one cohort count.
yield_estimate: 0.08
yield_reasoning: No single axis value is empty; 8 cells remain (1 on-axis combination, 7 off-axis). At about 10 leaves per brief that is about 80 raw leaves; discounting by the observed 29% G-stage duplicate
  rate (higher for targeted briefs per the smoke test) gives about 45 to 55 new leaves, roughly 0.08 of 601.
stop_recommendation: yield_estimate is below 0.10. Stop looping; fold the 8 expert_missing lines in directly or run one targeted brief per off-axis cell instead of another full generation loop.
