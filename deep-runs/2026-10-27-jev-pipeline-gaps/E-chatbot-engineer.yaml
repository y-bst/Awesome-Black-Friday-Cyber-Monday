    data-element: null-vs-no
    chatbot-response-behaviour: mixes-null-with-no
    processing-status: extracting
    studio-question-type: cohort-count
  object: answers table cell for a question with options Yes/No per video
  situation: 37 of 500 sessions are in 'extracting'; their rows are absent or NULL; the query uses NOT (answer='Yes') or a
    LEFT JOIN with COALESCE to 'No'.
  consequence: 37 players are counted as 'did not reach the step', inflating tutorial drop-off by 7.4 percentage points with
    no caveat in the reply.
  p_typical: 0.12
  grounded: inferred
  evidence: The answers form a structured table per video.
  proposed: 'Add a status column (pending/answered/failed) per (video, question); planner excludes non-answered rows from
    both numerator and denominator and the reply states ''excluded: 37 pending''.'
  shallow: false
