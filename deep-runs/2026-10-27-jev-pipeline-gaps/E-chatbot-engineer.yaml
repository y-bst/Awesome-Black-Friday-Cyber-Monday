- id: chat-1
  title: Cohort churn count over the per-video answers table counts video rows, not distinct players, so '% of 500 players
    who quit in the tutorial' uses ~4,000 rows as the denominator
  level: L4
  cell:
    stage: chatbot-query-planning
    data-element: player
    studio-question-type: cohort-count
    correctness-failure: wrong-denominator
    scale: 500-players
  object: answers table, one row per video ('The answers form a structured table per video')
  situation: Analyst asks 'what % of players quit during the tutorial?'; the generated query is COUNT(answer='quit')/COUNT(*)
    over video rows; 500 players average 8 videos each, so denominator is ~4,000 video rows and a player who answered 'quit'
    in 2 videos counts twice in the numerator.
  consequence: Bot reports ~4% instead of ~30% (or >100% when numerator counts per-video 'Yes' and denominator counts players);
    a studio decision is made on a number off by roughly the videos-per-session factor.
  p_typical: 0.3
  grounded: quote
  evidence: The answers form a structured table per video. ... so that a question over, say, 500 players is fast.
  proposed: 'Planner rule: every cohort-count resolves to COUNT(DISTINCT player_id) over a session-level view; a test asserts
    denominator == distinct players in scope and the reply prints ''n = 500 players''.'
  shallow: false
- id: chat-2
  title: Bot reports 'never reached step X' counts that include videos still extracting, because the table has no row for
    'not processed yet' distinct from answer 'No'
  level: L4
  cell:
