  grounded: inferred
  evidence: '"A session can be n hours; each video is capped at 15 minutes, so one session is many videos." -- a multi-hour
    session can span a game update, and no per-video build field is described.'
  already_specified: false
  proposed: Read build_id from the client at the start of every video and after every client restart, store it on the video
    row, and set build_straddle=true on sessions with more than one value.
  shallow: false
  perspective: audit-fill
  from_fill: true
