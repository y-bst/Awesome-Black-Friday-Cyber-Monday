  level: L4
  cell:
    question-shape: two-options-both-partly-true
    correctness-failure: forced-choice-bias
    studio-question-type: cohort-why
    data-element: answer
  object: multiple-choice 'Primary reason for leaving'
  situation: Player says 'too hard, and honestly kind of boring'; extractor picks 'Too hard'; across cohort, 62% 'Too hard'
  consequence: Analyst reports difficulty as the dominant cause; boredom (co-present in maybe a third) never surfaces
  p_typical: 0.12
  grounded: inferred
  evidence: fixed set of questions with options
  proposed: Cause questions are multi-select with a primary flag; bot reports both primary-only and any-mention rates
  shallow: false
  _from_file: E-studio-analyst.yaml
- id: analyst-38
  title: Crash that split one session into two is counted as a tutorial quit
  level: L3
  cell:
    session-shape: session-split-by-crash-into-two
    studio-question-type: cohort-count
    data-element: session
    correctness-failure: wrong-denominator
  object: session linking ('how videos of one session are linked' unspecified)
  situation: Game crashes at step 5; player relaunches and finishes; pipeline stores session A (ends mid-tutorial) and session
    B (starts mid-tutorial)
  consequence: Session A counts as churn, session B as a separate player; churn rate inflated and the crash (a bug the studio
    wants) is reported as a design problem
  p_typical: 0.04
  grounded: inferred
  evidence: how videos of one session are linked ... (Unspecified)
  proposed: Sessions from one player within 10 minutes are merged with a 'crash_restart' marker; churn excludes sessions ending
    in a crash
  shallow: false
  _from_file: E-studio-analyst.yaml
- id: analyst-39
  title: Version comparison reports percentages on 13 vs 487 sessions with no sample size
  level: L4
  cell:
    studio-question-type: compare-two-versions
    scale: 50-players
    data-element: cohort
    correctness-failure: wrong-denominator
  object: chatbot numeric answer
  situation: Only 13 sessions on build 1.4; analyst asks 'Is 1.4 tutorial churn better than 1.3?'
  consequence: 'Bot says ''1.4: 15% vs 1.3: 31%, 16 points better''; 2 of 13 is noise; the studio ships on it'
  p_typical: 0.11
  grounded: inferred
  evidence: so that a question over, say, 500 players is fast
  proposed: Every comparison prints n per group and a 95% interval; bot adds 'too few sessions' below n = 30
  shallow: false
  _from_file: E-studio-analyst.yaml
