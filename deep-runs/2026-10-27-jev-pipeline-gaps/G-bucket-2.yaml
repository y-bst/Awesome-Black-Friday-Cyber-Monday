- id: uxr-33
  title: Non-native speakers think aloud less and pause more; hesitation from language load is read as confusion or as no
    signal
  level: L3
  cell:
    speech-shape: non-english
    data-element: utterance
    studio-question-type: compare-two-versions
    correctness-failure: inconsistent-across-videos
    scale: 500-players
  object: transcript of a think-aloud given in a second language
  situation: Cohort for build B recruited in Brazil narrating in English as a second language; build A cohort native English
  consequence: Fewer words and more fillers ('uh', 'how to say') shift answers; the version comparison mixes language effects
    into the build difference
  p_typical: 0.04
  grounded: inferred
  evidence: Unspecified ... languages
  proposed: Record session narration language and native language; chatbot warns when compared cohorts differ on it
  shallow: false
