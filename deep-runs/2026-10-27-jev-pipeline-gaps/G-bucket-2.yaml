- id: uxr-20
  title: '''Quote me evidence'' returns quotes from the most talkative players, so quiet players'' experiences never appear
    in studio decks'
  level: L3
  cell:
    studio-question-type: quote-me-evidence
    data-element: cohort
    scale: 500-players
    answer-afterlife: copied-into-deck
    chatbot-response-behaviour: answers-correctly
  object: chatbot quoting from evidence spans across 500 players
  situation: 20% of players produce 70% of words; quote selection favours articulate, quotable utterances
  consequence: Each quote is real, but the deck's narrative over-represents a vocal minority; silent strugglers who churn
    hardest are invisible
  p_typical: 0.04
  grounded: speculative
  evidence: none
  proposed: Quote sampler capped at 1 quote per player per answer and reports how many players had no quotable speech
  shallow: false
