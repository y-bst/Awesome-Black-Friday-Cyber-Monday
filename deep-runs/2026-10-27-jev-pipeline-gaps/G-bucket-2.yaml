- id: uxr-21
  title: 'Cohort rates scale with talkativeness: ''% players confused'' measures who narrates, not who is confused'
  level: L4
  cell:
    studio-question-type: cohort-count
    speech-shape: silent-player
    correctness-failure: wrong-denominator
    scale: 500-players
    data-element: player
  object: answers table aggregated per cohort
  situation: Silent or low-verbal players (under 20 words per minute) get 'not confused' by default
  consequence: 'Observable: correlation between per-player word count and ''confused'' rate above 0.5; a build with quieter
    recruits looks clearer'
  p_typical: 0.06
  grounded: inferred
  evidence: Reading 500 transcripts per question was too slow and too much data, which is why the fixed-question table exists.
  proposed: Denominator = players with enough speech to judge; chatbot reports 'x of y judgeable players'
  shallow: false
  _from_file: E-ux-researcher.yaml
- id: uxr-24
  title: AFK break (mic muted, phone call, bathroom) inflates tutorial duration and is read as being stuck
  level: L3
  cell:
    speech-shape: mic-muted-for-a-period
    capture-integrity: mic-muted-for-a-period
    question-shape: answer-is-a-time
    studio-question-type: distribution-not-count
    correctness-failure: confident-no-evidence
  object: session duration; 'was the player stuck' question
  situation: Player mutes for 6 minutes mid-tutorial while game sits idle on one screen
  consequence: Silence plus no progress looks like being stuck; time-in-tutorial distribution gets a long tail that is breaks,
    not friction
  p_typical: 0.05
  grounded: inferred
  evidence: A session can be n hours
  proposed: Detect mute/idle intervals over 120 s and store them as excluded time; stuck questions ignore them
  shallow: false
  _from_file: E-ux-researcher.yaml
