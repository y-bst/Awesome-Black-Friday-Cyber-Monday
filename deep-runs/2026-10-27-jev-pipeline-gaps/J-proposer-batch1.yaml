- id: "fillB-1"
  case: "Churn is the one target the spec names ('The targets are mostly detecting churn in the tutorial and just after it'), so 'how many players churned in the tutorial?' is the first question every studio will ask, and today the chatbot answers it with a bare '112 of 500 (22%)'. The same cohort supports at least three defensible readings (session ended before tutorial completion = 112, pressed skip = 31, never returned for a second session = 64), and the reply gives no sign that one was chosen over the others. A studio that reads 22% as 'players lost for good' when the non-return figure is 13% will over-invest in tutorial fixes or misreport retention to its publisher, and because the number looks precise nobody will think to challenge it. This is high occurrence (every churn question), invisible to the reader (detectability 5), and the fix is a reply template plus one disambiguation rule, scored cost 1.0, the cheapest item in the top 25. The spec says studio questions 'are not known in advance', so the planner will keep meeting ambiguous wording; without a 'Computed as:' line naming question id, option and unit, every churn answer already given is unauditable after the fact. Each additional studio onboarded before this lands adds answers that cannot be reconciled later, so it should ship before the next onboarding, not after."
- id: "fillB-2"
  case: "The spec fixes the question set in advance while saying studio questions 'are not known in advance', which guarantees that studio vocabulary like 'stuck' gets mapped onto a stored question with a hidden threshold, here 'no progress for more than 3 minutes'. The reply '87 players got stuck at crafting' never prints that threshold, so a designer who means 'retried the recipe 3+ times' silently gets a different measure; a 2-minute stall with five retries counts as not stuck, and the true retry-based count could be double. The designer then sizes a crafting redesign on the wrong number, and the error surfaces only after the redesign underperforms, if ever. Severity 4, occurrence 5 and detectability 5 all reflect that this happens on routine questions and is invisible in the output. The proposed fix, printing the matched question's full text under every count and saying 'no stored question measures retries' when the wording names retries, is a template change with cost 1.0. Studios trust a chatbot answer exactly as far as they can see what it measured, and right now they cannot see it at all. Fixing this before more studios rely on the chatbot is far cheaper than walking back numbers already used in design decisions."
- id: "chat-3"
  case: "This is the most direct failure of the spec's own design: the question set is small ('most of what is in the video and transcript is never captured') and studio questions are 'not known in advance', so many studio questions will have no matching stored question, and the chatbot currently answers them anyway from the nearest one. An analyst asking 'how many players complained about the camera?' receives '112 players (22%) complained about the camera' when the figure actually counts control frustration, with no trace of the substitution. That is not an imprecise answer but a wrong one stated as fact, which is the worst outcome for a product whose value is trusted answers across hundreds of players. The leaf was raised independently by four other perspectives (analyst, exec, qauthor, skeptic), scores severity 5 and detectability 5, and is grounded in direct spec quotes rather than inference. The fix is small and mechanical: the planner outputs the question id(s) used, and below a similarity threshold the reply says 'not tracked; closest tracked question is X' with X's wording verbatim. It also feeds goal (b) in the spec, because logging 'not tracked' answers is exactly the signal needed to decide which questions to add next. Every day this stays, the chatbot manufactures confident numbers for things the pipeline never measured."
- id: "fillB-5"
  case: "The spec states the target as churn 'in the tutorial and just after it', and the stored churn question inherits that pooling, so a studio asking for tutorial-only churn is answered with a figure that includes post-tutorial quits. In the leaf's cohort 41 of the 112 quitters left after the tutorial-complete screen, so the tutorial redesign is sized on 112 when only 71 quit inside it, and the 41 who left at the first-mission screen point at a problem no one will look at. This misdirects the exact decision the pipeline exists to inform, tutorial versus early-game investment, and it happens on the most common question type (occurrence 5) with no visible cue (detectability 5). The cause is a question-definition choice, not a model limitation, and it is grounded in a direct spec quote. Splitting the churn question into 'quit inside tutorial' and 'quit within N minutes after tutorial end' is a cost-2 change at ingestion, where the spec says time and cost 'are not a concern', and the interim caveat line is near-free. Because re-running questions over stored transcripts gets more expensive with each studio's backlog, the split should be made before the next onboarding rather than retrofitted."
- id: "stitch-9"
  case: "The spec says 'each video is capped at 15 minutes, so one session is many videos' and 'the answers form a structured table per video', but defines no way to combine per-video answers into a per-player or per-session answer, which is the unit every studio question is about. In an 8-video session where the tutorial is completed in video 2, videos 3-8 answer 'completed tutorial = No' simply because the event is absent from their transcripts, so majority and last-video rollups say No while 'any' says Yes. Cohort tutorial-completion rate can therefore swing between roughly 20% and 80% depending on which rollup the chatbot or its SQL happens to choose, and the choice is silent. That is the headline metric of the product's primary target, and it is wrong in a way that grows with session length, which the owner already names as a known problem ('Long multi-video sessions'). This leaf scores severity 5 and occurrence 5 and was raised independently by three other perspectives (auditor, skeptic, extraction). The fix is well defined: each question declares its rollup (any / all / first / last / sum / max) in the registry, and the per-video answer distinguishes 'did not occur in this video' from No. That second part changes the stored schema, so every video ingested before it lands will need re-extraction, which is the strongest reason to do it now rather than later."
