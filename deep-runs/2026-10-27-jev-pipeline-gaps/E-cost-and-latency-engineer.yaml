  proposed: "Add extraction-run-id as a required column and a 'serving' pointer per game, so a shadow run never appears in chatbot queries."
  shallow: false
- id: cost-17
  title: "Overnight backfill and a studio asking at 3am share one LLM quota, so the chatbot's p99 becomes minutes"
  level: L4
  cell: {stage: chatbot-answer, studio-question-type: cohort-why, time-and-change: studio-asks-at-3am, latency: batch-overnight, fast-path-dependency: concurrent-studio-load}
