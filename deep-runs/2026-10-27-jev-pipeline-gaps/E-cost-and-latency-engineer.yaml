- id: cost-1
  title: "A question-set revision forces re-extraction of every video: 500 players x 16 videos x 30 questions = 240,000 answer cells and nobody owns the budget"
  level: L4
  cell: {stage: rerun-and-backfill, data-element: extraction-run-id, scale: 500-players, time-and-change: question-set-revised, recovery-action: backfill-after-question-set-change}
  object: "Spec constraint 'Ingestion time and cost are not a concern' versus step 3 'a fixed set of questions with options, written per game target'"
  situation: "A PM rewords 6 of 30 questions. Session length 4 h = 16 videos per player; 500 players = 8,000 videos. Spec does not say whether all 30 questions or only the 6 changed are re-run."
  consequence: "Full re-run is 240,000 question answers (8,000 videos x 30) per revision; re-run of only the 6 changed is 48,000. The cost is a 5x difference decided by an unwritten rule, repeated at every revision."
  p_typical: 0.2
  grounded: inferred
  evidence: "Ingestion time and cost are not a concern."
  proposed: "Write the rule: a revision re-runs only questions whose text or options changed, keyed by question id + version; record the estimated call count before launch."
  shallow: false
- id: cost-2
  title: "'Cost is not a concern' has no ceiling, so a backfill that is 20x larger than expected is not detected"
  level: L3
  cell: {stage: rerun-and-backfill, data-element: question-set-version, scale: 500-players-x-3-question-set-versions, recovery-action: backfill-after-question-set-change, question-set-version-state: mixed-versions-in-table}
  object: "Spec 'Unspecified' list: 'latency and cost limits per query'; constraint 'Ingestion time and cost are not a concern'"
  situation: "Three versions of the question set are kept live for 500 players (8,000 videos): 3 x 240,000 = 720,000 answers. Spec gives no per-run or per-month spend limit, only the claim that cost is fine."
  consequence: "A mistaken backfill (wrong game filter, 10 games instead of 1) runs to completion at 10x the expected bill; nobody is alerted because no limit exists."
  p_typical: 0.08
  grounded: quote
  evidence: "latency and cost limits per query"
  proposed: "Define a dry-run call count and a hard spend cap per backfill job; require confirmation above the cap."
  shallow: false
- id: cost-3
  title: "One LLM call per question re-sends the same 3k-token transcript 50 times for a 50-question set"
  level: L4
  cell: {stage: extraction-prompt, data-element: transcript, scale: question-set-of-50-questions, correctness-failure: inconsistent-across-videos, latency: batch-overnight}
  object: "Step 3 'The transcript is run through a fixed set of questions with options'"
  situation: "A 15-minute think-aloud video yields about 2,250 words (roughly 3,000 tokens). If each of 50 questions is a separate call, 150,000 input tokens per video; 8,000 videos = 1.2 billion input tokens. If instead all 50 go in one prompt, the output must hold 50 answers and the context shares attention across them."
  consequence: "Spec does not say one call per question or per video. The choice sets the bill (50x on input without prompt caching) and also answer quality (cross-question interference in a single prompt)."
  p_typical: 0.06
  grounded: inferred
  evidence: "The transcript is run through a fixed set of questions with options"
  proposed: "Specify one call per video with all questions batched in a structured-output schema, or one cached-prefix call per question, and measure both on 200 videos."
  shallow: false
- id: cost-4
  title: "A 10-hour single-player session produces 40 videos; any session-level aggregation over the transcripts overflows the context window"
  level: L4
  cell: {stage: session-level-aggregation, data-element: session, session-shape: 10-plus-hour-session, scale: 1-player-10-hour-session, question-shape: answer-spans-videos}
  object: "Known problem 'Long multi-video sessions' and step 1 'A session can be n hours; each video is capped at 15 minutes'"
  situation: "10 h = 40 videos x about 3,000 tokens = about 120,000 tokens of transcript for one player. A question such as 'did the player ever return to the tutorial after quitting it' needs the whole session in one prompt."
  consequence: "Either the aggregation call truncates silently at the model limit, or it is split into 40 per-video calls whose answers are then merged by an unspecified rule. Latency of one such session-level call is tens of seconds and the cost is 40x a per-video call."
  p_typical: 0.05
  grounded: inferred
  evidence: "A session can be n hours; each video is capped at 15 minutes, so one session is many videos."
  proposed: "Define the session-level answer as a rollup of per-video answers (any / first / last / count) computed in code, and mark questions that need a cross-video LLM call."
  shallow: false
- id: cost-5
  title: "Chatbot p99 under concurrent studio users has no target; spec gives 'fast' but no number"
  level: L4
  cell: {stage: chatbot-answer, studio-question-type: cohort-count, scale: many-concurrent-studio-users, latency: p99-tail-under-concurrency, chatbot-response-behaviour: times-out}
  object: "Constraint 'Answering a studio's question must be fast' and Unspecified item 'latency and cost limits per query'"
  situation: "20 analysts at 3 studios ask cohort questions in the same minute. Each question runs plan + query + LLM summary. LLM provider rate limit applies to the whole account."
  consequence: "Median may be 4 s but p99 can pass 30 s when requests queue on the shared rate limit; with no number written there is nothing to alert or load-test against."
  p_typical: 0.12
  grounded: quote
  evidence: "Answering a studio's question must be fast"
  proposed: "State p50 under 5 s and p99 under 15 s for a cohort-count question at 20 concurrent users and add a load test at that figure."
  shallow: false
- id: cost-6
  title: "Giving the whole answers table to the chatbot works at 50 players and breaks at 500: about 240,000 rows is millions of tokens"
  level: L4
  cell: {stage: chatbot-query-planning, data-element: answer, scale: 500-players, fast-path-dependency: table-fits-in-llm-context, chatbot-response-behaviour: silently-truncates-rows}
  object: "Step 4 'A chatbot for the gaming studio answers the studio's questions from that table, so that a question over, say, 500 players is fast'"
  situation: "500 players x 16 videos x 30 questions = 240,000 rows; at about 15 tokens per row that is 3.6 million tokens, far above any context window. At 50 players it is 360,000 tokens, also above most limits."
  consequence: "If the chatbot loads rows into the prompt, rows are cut at the limit and the count reported to the studio is wrong with no warning; if it uses SQL instead, the spec does not say so."
  p_typical: 0.12
  grounded: inferred
  evidence: "answers the studio's questions from that table, so that a question over, say, 500 players is fast"
  proposed: "Specify that the chatbot never reads rows into context, only aggregates from a query, and that any result over N rows returns counts, not rows."
  shallow: false
- id: cost-7
  title: "Question not in the fixed set sends the chatbot back to raw transcripts, the exact path the spec said was too slow and too large"
  level: L4
  cell: {stage: chatbot-query-planning, studio-question-type: question-about-a-step-the-set-never-asked, scale: 500-players, fast-path-dependency: question-requires-raw-transcript-fallback, latency: minutes}
  object: "Step 4 'Reading 500 transcripts per question was too slow and too much data' and Constraint 'Their questions are not known in advance'"
  situation: "Studio asks 'how many players mentioned the shop before step 3'. No fixed question covers it. A fallback scan reads 8,000 transcripts x 3,000 tokens = 24 million tokens."
  consequence: "One such question costs on the order of 24M input tokens and takes minutes; if three analysts ask similar questions the day's bill exceeds the entire cost of ingesting those players. The spec has no rule for allowing or refusing the fallback."
  p_typical: 0.12
  grounded: quote
  evidence: "Reading 500 transcripts per question was too slow and too much data"
  proposed: "Add an explicit fallback tier with a stated row cap (e.g. 50 transcripts sampled), an estimated cost shown before running, and a label 'sampled' in the answer."
  shallow: false
- id: cost-8
  title: "Table growth over a year turns a full-scan chatbot query from sub-second into tens of seconds with no index on game target and version"
  level: L3
  cell: {stage: answers-table, data-element: game-version, time-and-change: a-year-of-data, fast-path-dependency: index-on-game-target-and-version, latency: under-2s}
  object: "Step 3 'The answers form a structured table per video'"
  situation: "Table holds 240,000 rows per 500-player cohort per question-set version. After 12 monthly cohorts and 3 games: about 8.6 million rows. Queries filter by game-version and question id."
  consequence: "Without a composite index on (game-target, game-version, question-id, session-id) each count scans all rows; the studio sees seconds where the spec promised 'fast'."
  p_typical: 0.06
  grounded: inferred
  evidence: "The answers form a structured table per video."
  proposed: "Name the table key and add a composite index; test count query latency at 10 million rows."
  shallow: false
- id: cost-9
  title: "First-token latency hides a long plan phase: the chatbot streams text after 1 s but the number arrives after 20 s"
  level: L4
  cell: {stage: chatbot-answer, studio-question-type: compare-two-versions, latency: first-token-vs-complete-answer, chatbot-response-behaviour: answers-correctly, fast-path-dependency: text-to-sql-generated-correctly}
  object: "Constraint 'Answering a studio's question must be fast'"
  situation: "Plan step (1 LLM call, 3 s), SQL run (2 s), retry on SQL error (3 s + 2 s), summary call (4 s). If the UI streams a preamble sentence in under 1 s, a latency test measuring first token passes."
  consequence: "Analyst waits about 14 s for the figure while the dashboard metric says 1 s; the target 'fast' is met on paper only."
  p_typical: 0.06
  grounded: speculative
  evidence: "none"
  proposed: "Measure time to complete answer with the number present, not time to first token; set the target on that."
  shallow: false
- id: cost-10
  title: "Cached cohort aggregate is not invalidated by a re-run, so the chatbot answers fast and wrong"
  level: L4
  cell: {stage: aggregate-cache, data-element: cached-aggregate, time-and-change: model-upgraded, fast-path-dependency: cache-stale-after-rerun, latency: fast-but-stale}
  object: "Step 4 'so that a question over, say, 500 players is fast'"
  situation: "Cohort count 'players who quit at step 2' is cached at 61% for 24 h. Extraction model is upgraded and 500 players are re-extracted, giving 54%. The cache key is game + question id, not extraction run id."
  consequence: "Studio sees 61% for up to 24 h after the table says 54%; two analysts comparing screenshots disagree."
  p_typical: 0.08
  grounded: speculative
  evidence: "none"
  proposed: "Key every cached aggregate by (table version, question-set version, cohort definition); invalidate on any run completion."
  shallow: false
- id: cost-11
  title: "Chatbot is queried while a 3-day backfill is half done and returns a fast answer that mixes two prompt versions"
  level: L4
  cell: {stage: rerun-and-backfill, data-element: prompt-version, processing-status: rerun-in-progress, time-and-change: rerun-in-progress-while-queried, correctness-failure: mixed-version-aggregation}
  object: "Constraint 'Ingestion time and cost are not a concern'"
  situation: "Prompt change re-extracts 8,000 videos at 2,700 per day. After day 1, 2,700 rows are new and 5,300 are old. Studio asks 'what share of players quit at step 2'."
  consequence: "The answer is computed over a blend of old and new prompt versions and carries no marker; because ingestion time was declared not a concern, a multi-day window of mixed data was never treated as a query-time problem."
  p_typical: 0.07
  grounded: inferred
  evidence: "Ingestion time and cost are not a concern."
  proposed: "Serve queries from the last complete table version until the backfill finishes, then switch atomically; show 'table version N, complete' on the answer."
  shallow: false
- id: cost-12
  title: "Silent or music-only video still gets transcribed and extracted: 30 question calls run on a hallucinated transcript"
  level: L4
  cell: {stage: transcription, data-element: transcript, speech-shape: silent-player, session-shape: video-with-no-audio-track, transcription-subsystem: hallucinated-text-on-silence-or-music, capture-integrity: no-audio-track}
  object: "Step 2 'Each video is converted to a transcript'"
  situation: "Silent player or missing audio track for a 15-minute video. Speech model emits filler text ('thank you for watching') for the silence. Extraction then runs all 30 questions over it."
  consequence: "30 LLM calls spent on a transcript with no signal and 30 invented answer rows entered in the table; a cheap pre-check (audio energy under a threshold for 15 minutes) would skip both."
  p_typical: 0.05
  grounded: inferred
  evidence: "Each video is converted to a transcript."
  proposed: "Add a voice-activity check before transcription; below 5% speech, write status 'no speech' and skip extraction."
  shallow: false
- id: cost-13
  title: "Non-idempotent retry of a failed question doubles both the LLM spend and the row count"
  level: L4
  cell: {stage: job-orchestration-and-status, data-element: extraction-run-id, batch-failure-mix: retry-produced-duplicate, recovery-action: retry-one-question, correctness-failure: duplicate-counted}
  object: "Step 3 'The answers form a structured table per video'"
  situation: "Question 14 of 30 times out on 400 of 8,000 videos. A blanket retry re-runs the full video job; 29 questions that had succeeded are re-answered and inserted again."
  consequence: "29 x 400 = 11,600 wasted calls and 11,600 duplicate rows; the count query now reports 1.05x for players who were retried."
  p_typical: 0.07
  grounded: inferred
  evidence: "none"
  proposed: "Key each answer row by (video id, question id, question-set version) with upsert and retry only missing keys."
  shallow: false
- id: cost-14
  title: "Vendor deprecates the extraction model with a 60-day notice and re-extraction of a year of data hits provider rate limits"
  level: L4
  cell: {stage: rerun-and-backfill, data-element: extraction-model-version, time-and-change: extraction-vendor-deprecates-model, recovery-action: backfill-after-model-upgrade, scale: 50000-videos}
  object: "Constraint 'Ingestion time and cost are not a concern'"
  situation: "A year of data is 50,000 videos x 30 questions = 1.5 million calls. At a 500 requests per minute quota that is 50 hours of continuous running, competing with live ingest."
  consequence: "The 'ingestion time is not a concern' assumption fails at the deadline: either old rows are served from a retired model version or the backfill starves new sessions."
  p_typical: 0.07
  grounded: inferred
  evidence: "Ingestion time and cost are not a concern."
  proposed: "Estimate re-extraction hours at the provider quota, schedule it 30 days before cut-off, and reserve quota share for live ingest."
  shallow: false
- id: cost-15
  title: "Transcription model upgrade chains into a full re-extraction: 8,000 videos re-transcribed, then 240,000 answers re-run"
  level: L3
  cell: {stage: transcription, data-element: transcription-model-version, time-and-change: transcription-model-upgraded, transcription-subsystem: transcription-model-version-differs-across-videos, recovery-action: backfill-after-model-upgrade}
  object: "Step 2 transcript and step 3 table, derived one from the other"
  situation: "Speech-to-text vendor ships a better model. Re-transcribing only new videos leaves one session with videos 1-8 on the old model and 9-16 on the new; re-transcribing all triggers re-extraction of every answer."
  consequence: "Either a session mixes transcription versions (different punctuation, profanity handling, number formatting) or the full chain re-runs at 8,000 transcriptions + 240,000 extractions."
  p_typical: 0.06
