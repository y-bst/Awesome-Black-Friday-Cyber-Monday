- id: cost-16
  title: "Validating a model upgrade needs a second full table in parallel, which doubles storage and query surface"
  level: L3
  cell: {stage: rerun-and-backfill, data-element: extraction-model-version, time-and-change: model-upgraded, processing-status: superseded-by-rerun, fast-path-dependency: table-growth-over-a-year}
  object: "Step 3 answers table per video"
  situation: "To compare the old and new extraction model, QA needs both answer sets for the same 500 players: 2 x 240,000 rows. Spec has no concept of a shadow table or a version column."
  consequence: "Either old answers are overwritten before comparison (no regression check possible) or both live in one table and every chatbot query must filter on version or it double counts."
  p_typical: 0.05
