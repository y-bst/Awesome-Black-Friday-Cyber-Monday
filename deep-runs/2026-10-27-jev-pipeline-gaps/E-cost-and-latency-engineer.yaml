  title: "Text-to-SQL self-correction loops 3 times at 4 s each, breaking an under-2s expectation on a simple count"
  level: L4
  cell: {stage: chatbot-query-planning, studio-question-type: cohort-count, fast-path-dependency: text-to-sql-generated-correctly, latency: under-2s, chatbot-response-behaviour: times-out}
  object: "Constraint 'Answering a studio's question must be fast'; frame assumption 'a query over it'"
  situation: "The planner writes SQL against a 30-column answers table; the first query references a renamed option column and fails, the repair attempt fails on the join to question versions, the third succeeds. Each LLM turn is about 4 s."
  consequence: "A count that should run in 100 ms returns after 12 s or hits a 30 s timeout; the user sees 'something went wrong' with no partial answer."
  p_typical: 0.06
  grounded: speculative
  evidence: "none"
  proposed: "Give the planner a typed query API (game, version, question id, filter) instead of free SQL and cap repair attempts at 1."
  shallow: false
- id: cost-29
  title: "Same question asked twice returns different numbers; caching the chatbot answer fixes latency but freezes a wrong answer"
  level: L4
  cell: {stage: chatbot-answer, studio-question-type: cohort-count, chatbot-response-behaviour: differs-on-re-ask, fast-path-dependency: cache-hit, answer-afterlife: re-asked-after-rerun}
  object: "Chatbot answer built from table plus studio question"
  situation: "Analyst asks 'how many players quit before step 3' and gets 212; asks again an hour later and gets 198 because the planner chose a different filter. A response cache keyed on question text would return 212 for 24 h, including after a re-run changes the table."
  consequence: "Caching hides the inconsistency in one case and serves stale data in the other; neither a determinism setting nor a cache key (table version + normalised query) is specified."
  p_typical: 0.05
  grounded: speculative
  evidence: "none"
  proposed: "Cache the planned query keyed by table version, not the text answer, and run the query fresh each time."
  shallow: false
- id: cost-30
  title: "Diarisation added to stop moderator words being credited to the player increases transcription cost and delays ingest-to-queryable"
  level: L3
  cell: {stage: transcription, data-element: utterance, speech-shape: moderator-speaking-or-leading, correctness-failure: moderator-words-attributed-to-player, latency: ingest-to-queryable (hours or days after session)}
  object: "Step 2 'Each video is converted to a transcript'"
  situation: "Speaker separation on 8,000 videos adds a second pass per video; a typical diarisation pass runs in about 0.3x real time, so 15 minutes of audio costs about 4.5 more minutes."
  consequence: "Per cohort that is about 600 extra compute hours; if skipped, the moderator's 'try the button on the left' is read by extraction as the player's behaviour. The trade is made nowhere because cost is declared irrelevant."
  p_typical: 0.03
  grounded: speculative
  evidence: "none"
  proposed: "Decide per game whether sessions are moderated and enable diarisation only for those; record the flag on the session."
  shallow: false
- id: cost-31
  title: "One failed video leads to 'rerun-whole-session', re-transcribing and re-extracting 16 videos to repair 1"
  level: L4
  cell: {stage: job-orchestration-and-status, data-element: session, batch-failure-mix: one-video-of-session-failed, recovery-action: rerun-whole-session, session-shape: 5-20-videos}
  object: "Step 1 'one session is many videos'"
  situation: "Video 9 of 16 fails transcription. If the only recovery unit is the session, videos 1-8 and 10-16 are re-run too: 16 transcriptions + 480 question calls instead of 1 + 30."
  consequence: "Repair costs 16x what it should and, if model versions changed in between, the repaired session now mixes old and new transcripts."
  p_typical: 0.06
  grounded: inferred
  evidence: "none"
  proposed: "Make video the retry unit, keyed by (session id, video index), and rebuild the session aggregate afterwards."
  shallow: false
- id: cost-32
  title: "No per-stage cost and latency metering, so nobody can say which of 30 questions or which game drives the inference bill"
  level: L3
  cell: {stage: job-orchestration-and-status, data-element: question, question-set-version-state: per-game-fork, scale: 10-games-at-once, tenancy: one-studio-many-games}
  object: "Unspecified list: 'latency and cost limits per query'"
  situation: "A 'why did the player quit' question needs a 300-token answer while a yes/no question needs 5; 5 of 30 questions produce 70% of output tokens. Bill is only visible per provider account."
  consequence: "Cost cuts are guesses; deleting the 5 verbose questions would cut output spend roughly 70%, but without per-question token counts no one finds them."
  p_typical: 0.04
  grounded: speculative
  evidence: "latency and cost limits per query"
  proposed: "Log input and output tokens and wall time per (video id, question id, run id) and report top 10 by spend weekly."
  shallow: false
- id: cost-33
  title: "'What can you answer' at 50,000 videos needs coverage statistics computed on the fly across every question and version"
  level: L4
  cell: {stage: chatbot-query-planning, studio-question-type: what-can-you-answer, scale: 50000-videos, fast-path-dependency: cold-start, latency: under-30s}
  object: "Constraint 'Their questions are not known in advance' and the fixed question set per game target"
  situation: "Analyst's first message to a new session is 'what can you tell me about my players'. The chatbot must list question ids, coverage (answered n of N videos) and versions across 50,000 videos, from a cold connection."
  consequence: "A full-table coverage count takes tens of seconds on the first call; the bot may instead list question titles from memory and claim coverage it has not checked."
  p_typical: 0.04
  grounded: speculative
  evidence: "none"
  proposed: "Maintain a small coverage table (question id, version, answered count, total videos) updated at ingest and have the bot read only that."
  shallow: false
- id: cost-34
  title: "Offboarded studio's data stays in hot storage and in cached aggregates, so cost continues after the contract ends"
  level: L3
  cell: {stage: retention-and-deletion, data-element: studio-tenant, time-and-change: studio-offboarded, tenancy: studio-offboarded, answer-afterlife: shared-link}
  object: "Buyers are 'gaming studios' (spec constraints); no retention rule in spec"
  situation: "A studio with 500 players (8,000 videos, about 24 million transcript tokens, 240,000 answer rows) leaves; no job expires its hot data, caches or shared links."
  consequence: "Storage and cache cost continue indefinitely and shared links keep serving that studio's aggregates; no one is assigned to decide when the data is cold-archived or deleted."
  p_typical: 0.03
  grounded: speculative
  evidence: "none"
  proposed: "Define an offboarding job: revoke shared links at day 0, drop caches at day 7, archive at day 30, delete at the contract-stated date."
  shallow: false
