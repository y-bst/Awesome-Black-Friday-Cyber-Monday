  consequence: "Chatbot calls queue behind 1.5 million backfill calls and the answer takes minutes; the two stated constraints (cheap slow ingest, fast query) conflict at the shared quota."
  p_typical: 0.06
  grounded: inferred
  evidence: "Answering a studio's question must be fast."
