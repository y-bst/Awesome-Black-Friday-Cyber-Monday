  cell: {stage: answer-options, data-element: option, correctness-failure: forced-choice-bias, question-shape: two-options-both-partly-true, question-set-version-state: option-added}
  object: "assumption: 'multiple-choice with 3-6 options'"
  situation: "a fifth option is inserted at position 1 for Q3; 300 existing rows had the previous first option as the tie winner"
  consequence: "share of the old option falls 9 points because of position, not behaviour; no rule says option order is randomised or recorded"
  p_typical: 0.06
  grounded: speculative
  evidence: "questions are multiple-choice with 3-6 options"
  proposed: "record option order in the extraction run and randomise it per call; add new options at the end for the first comparison"
