- id: "qauthor-35"
  title: "A question set that targets one churn moment gives no coverage metric for how much of each transcript is captured"
  level: L3
  cell: {stage: fixed-question-set, data-element: transcript, scale: 500-players, studio-question-type: what-can-you-answer, question-shape: question-not-in-set}
  object: "Known problems: 'most of what is in the video and transcript is never captured'"
  situation: "8 questions are run on 500 transcripts of about 4000 words each; no measure says which share of transcript content (topics, utterances) maps to any question"
  consequence: "the PM cannot say whether adding 5 questions captures 10% or 40% more; no stopping rule exists for extending the set"
  p_typical: 0.12
  grounded: quote
  evidence: "The question set is small, so most of what is in the video and transcript is never captured."
  proposed: "sample 20 transcripts, tag every topic mentioned, and report the share of topics covered by at least one question"
  shallow: false
