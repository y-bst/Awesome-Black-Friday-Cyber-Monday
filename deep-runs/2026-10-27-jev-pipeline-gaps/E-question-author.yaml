- id: "qauthor-1"
  title: "First question set for a new game is written with 0 transcripts, so options reflect the PM's guess, not what players say"
  level: L3
  cell: {stage: fixed-question-set, data-element: question, time-and-change: first-game-onboarded, scale: 0-players-new-game, question-shape: fits-no-option}
  object: "step 3: 'a fixed set of questions with options, written per game target'"
  situation: "PM writes the churn questions and 4-6 options for a new game before any session has been transcribed; no pilot of even 5 players is defined between authoring and the 500-player run"
  consequence: "options miss the real churn reasons, the first 500 players are forced into 'other' or a wrong option, and the whole batch must be re-extracted after the first look at data"
  p_typical: 0.20
  grounded: quote
  evidence: "The transcript is run through a fixed set of questions with options, written per game target."
  proposed: "add a pilot step - run a draft question set on 5-10 transcripts, read the 'other' share and revise options before the full ingest"
  shallow: false
- id: "qauthor-2"
  title: "A 'why did the player quit' question runs on all 12 videos of a session though quitting can only occur in the last one"
  level: L3
  cell: {stage: per-video-answers, data-element: question, session-shape: 5-20-videos, question-shape: event-did-not-happen-in-this-video, correctness-failure: forced-choice-bias}
  object: "step 3: 'The answers form a structured table per video.'"
  situation: "question 'Primary reason for leaving' is asked of video 3 of 12, where the player did not leave; options contain no 'did not leave in this video' value"
  consequence: "the LLM picks the nearest reason (for example 'frustrated by controls') on 11 of 12 videos, producing 11 false churn reasons per session in the table"
  p_typical: 0.12
  grounded: inferred
  evidence: "The answers form a structured table per video."
  proposed: "give every event question an explicit 'did not occur in this video' option and a scope flag (any video / last video only)"
  shallow: false
- id: "qauthor-3"
  title: "No 'other / none of these' option is mandated, so a question where no option fits is answered with the closest wrong option"
  level: L3
  cell: {stage: answer-options, data-element: option, question-shape: fits-no-option, correctness-failure: forced-choice-bias, scale: 500-players}
  object: "assumption: questions are multiple-choice with 3-6 options, answered once per video"
  situation: "a churn question has 4 options, the real reason (e.g. 'could not find the pause menu') is none of them, over 500 players"
  consequence: "500-player counts for the 4 options are inflated by players who belong to none of them; the chatbot reports 'most players quit because of X' with no 'unknown' share visible"
  p_typical: 0.25
  grounded: inferred
  evidence: "questions are multiple-choice with 3-6 options, answered once per video by an LLM"
  proposed: "reserve one option id per question for 'none of these' with an optional short free-text reason, and report its share beside every count"
  shallow: false
- id: "qauthor-4"
  title: "When 'other' is mandated, a PM never reads its free text, so new churn reasons stay invisible"
  level: L3
  cell: {stage: answer-options, data-element: option, correctness-failure: other-option-overused, scale: 5000-players, studio-question-type: cohort-why}
  object: "the 'other' option of any churn question in the answers table"
  situation: "22% of 5000 players land on 'other' for 'reason for quitting'; the table stores only the option id, no reason text"
  consequence: "the largest single bucket is unexplained and the PM cannot tell which new option to add; the chatbot answers 'cohort-why' with the top named option, which is the second-largest"
  p_typical: 0.08
  grounded: speculative
  evidence: "none"
  proposed: "store a 10-word reason string with every 'other' answer and cluster it monthly to propose new options"
  shallow: false
- id: "qauthor-5"
  title: "Two options are both partly true for one video and the question is single-select"
  level: L3
  cell: {stage: answer-options, question-shape: two-options-both-partly-true, correctness-failure: forced-choice-bias, data-element: answer}
  object: "assumption: 'answered once per video' with 3-6 options"
  situation: "player says 'I don't get what the arrow means and also this is boring' - options 'instructions unclear' and 'lost interest' both apply"
  consequence: "the LLM picks one by option order or wording; the other cause is lost from a table meant to detect tutorial churn, and which one wins is not reproducible"
  p_typical: 0.09
  grounded: inferred
  evidence: "answered once per video by an LLM"
  proposed: "per question declare single-select or multi-select; for multi-select store a list of option ids"
  shallow: false
- id: "qauthor-6"
  title: "Option text renamed under the same option id silently changes the meaning of 6 months of stored answers"
  level: L3
  cell: {stage: question-set-registry, data-element: option, question-set-version-state: option-renamed-same-id, time-and-change: question-set-revised, correctness-failure: mixed-version-aggregation}
  object: "the answers table stores option answers per video; no versioning of the question set is described"
  situation: "option 'C: UI confusing' is reworded to 'C: could not find the next objective' while keeping id C; old rows still say C"
  consequence: "a 12-month trend of C mixes two different meanings; a chart shows a step change on the rename date that is not a player change"
  p_typical: 0.05
  grounded: speculative
  evidence: "none"
  proposed: "option ids are immutable; a rename or redefinition creates a new option id and a mapping row in the question-set registry"
  shallow: false
- id: "qauthor-7"
  title: "Question reworded under the same question id leaves old and new answers in one column"
  level: L3
  cell: {stage: question-set-registry, data-element: question-set-version, question-set-version-state: question-reworded-same-id, correctness-failure: mixed-version-aggregation, answer-afterlife: copied-into-deck}
  object: "Constraints: 'the framework for generating the questions so that any type of question can be answered'"
  situation: "'Did the player complete the first quest?' becomes 'Did the player complete the first quest without help?' at id Q4, after 200 of 500 players are extracted"
  consequence: "the 'yes' rate for Q4 drops 18 points between cohorts for a wording reason; a deck slide copied last week quotes the old number with no version label"
  p_typical: 0.05
  grounded: speculative
  evidence: "none"
  proposed: "every wording change bumps question version; the table row carries question_id plus question_version"
  shallow: false
- id: "qauthor-8"
  title: "A retired question leaves a column that is all null for new players and the chatbot reads null as No"
  level: L3
  cell: {stage: answers-table, data-element: null-vs-no, question-set-version-state: question-retired, chatbot-response-behaviour: mixes-null-with-no, correctness-failure: null-treated-as-no}
  object: "step 4: 'A chatbot ... answers the studio's questions from that table'"
  situation: "question Q9 retired after player 300 of 500; players 301-500 have no Q9 value"
  consequence: "'what share did X' answers 60% yes of 500 when the true denominator is 300; or 'No' for 200 players who were never asked"
  p_typical: 0.07
  grounded: inferred
  evidence: "A chatbot for the gaming studio answers the studio's questions from that table"
  proposed: "write a 'not asked (question retired)' marker per row, distinct from 'asked, option No', and exclude it from denominators"
  shallow: false
- id: "qauthor-9"
  title: "Question set is forked per game, so 'compare our two games' has no shared columns"
  level: L3
  cell: {stage: fixed-question-set, question-set-version-state: per-game-fork, studio-question-type: cross-game-or-cross-studio-benchmark, tenancy: one-studio-many-games, scale: 10-games-at-once}
  object: "step 3: 'written per game target'"
  situation: "a studio with 2 games asks 'which game loses more players in the first 10 minutes'; game A has Q1-Q8, game B was authored separately with Q1-Q11, with different option sets for 'reason for quitting'"
  consequence: "the chatbot can only compare questions with the same id and options; it either refuses or silently maps non-equivalent options and returns a misleading ranking"
  p_typical: 0.08
  grounded: quote
  evidence: "written per game target"
  proposed: "maintain a small core question block (completion, quit moment, quit reason) shared by all games, with per-game blocks on top"
  shallow: false
- id: "qauthor-10"
  title: "A game update removes tutorial step 4 but the question 'Did the player finish the crafting step' stays in the set"
  level: L3
  cell: {stage: question-set-registry, data-element: tutorial-step, time-and-change: game-update-changes-tutorial, question-set-version-state: per-game-version-fork, studio-question-type: compare-two-versions}
  object: "step 3: 'The targets are mostly detecting churn in the tutorial and just after it.'"
  situation: "build 1.4 removes the crafting step; the PM keeps one question set for both builds; build 1.4 players are asked about a step that does not exist"
  consequence: "build 1.4 gets 'No' or hallucinated 'Yes' for a step they never saw, so 'compare 1.3 vs 1.4 crafting completion' shows a crash from 80% to 5% that is an artifact"
  p_typical: 0.12
  grounded: inferred
  evidence: "The targets are mostly detecting churn in the tutorial and just after it."
  proposed: "bind each question to a tutorial-step id and a build range; questions outside the range are 'not applicable', not asked"
  shallow: false
- id: "qauthor-11"
  title: "A step the question set never asked about is the cause of churn, and the chatbot has nothing to say about it"
  level: L3
  cell: {stage: chatbot-answer, studio-question-type: question-about-a-step-the-set-never-asked, question-shape: question-not-in-set, chatbot-response-behaviour: says-no-data-correctly, data-element: tutorial-step}
  object: "Known problems: 'The question set is small, so most of what is in the video and transcript is never captured.'"
  situation: "studio asks 'do players struggle with the dodge-roll prompt in step 6'; no question mentions step 6"
  consequence: "best case the bot says it has no data although 500 transcripts contain the answer; worst case it substitutes the nearest question ('struggled with controls') and reports it as the answer"
  p_typical: 0.45
  grounded: quote
  evidence: "The question set is small, so most of what is in the video and transcript is never captured."
  proposed: "when no question maps, bot states 'not in the fixed set', logs the question, and offers a targeted re-extraction over stored transcripts"
  shallow: false
- id: "qauthor-12"
  title: "A 50-question set run in one prompt per video produces position bias and earlier answers leaking into later ones"
  level: L3
  cell: {stage: extraction-prompt, scale: question-set-of-50-questions, correctness-failure: forced-choice-bias, data-element: prompt-version, time-and-change: model-upgraded}
  object: "Constraint: 'Ingestion time and cost are not a concern.'"
  situation: "because cost is no concern the PM grows the set from 8 to 50 questions answered in a single call per video"
  consequence: "answer quality drops for questions 30-50 (context fatigue); correlated errors appear (all 'frustrated' options chosen together); nobody measures it because there is no per-question accuracy"
  p_typical: 0.08
  grounded: inferred
  evidence: "Ingestion time and cost are not a concern."
  proposed: "cap questions per call at a tested number (e.g. 8-10) and run groups as separate calls; compare 50-in-one vs 5x10 on 20 labelled videos"
  shallow: false
- id: "qauthor-13"
  title: "Skip logic between questions is undefined, so a follow-up is answered when its parent was 'No'"
  level: L3
  cell: {stage: fixed-question-set, data-element: question, question-shape: answer-depends-on-prior-video, correctness-failure: hallucinated-answer}
  object: "step 3: 'a fixed set of questions with options'"
  situation: "Q5 'Did the player see the tutorial popup?' = No on video 2, but Q6 'How did the player react to the popup?' still gets answered"
  consequence: "Q6 contains an invented reaction for 100% of players who answered No on Q5; counts of reaction options include people who never saw the popup"
  p_typical: 0.07
  grounded: speculative
  evidence: "none"
  proposed: "add a 'depends_on: Q5=Yes' field to question definitions; when unmet the answer is 'not applicable'"
  shallow: false
- id: "qauthor-14"
  title: "Count question 'how many times did the player die' has bucketed options and per-video values that cannot be summed to a session"
  level: L3
  cell: {stage: session-level-aggregation, question-shape: answer-is-a-count, session-shape: 5-20-videos, data-element: answer, correctness-failure: wrong-denominator}
