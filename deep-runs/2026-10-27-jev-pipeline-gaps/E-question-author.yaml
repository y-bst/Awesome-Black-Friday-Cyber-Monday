- id: "qauthor-19"
  title: "Question definitions carry no 'unknowable from audio' flag, so thresholds are measured by an LLM with no clock"
  level: L3
  cell: {stage: fixed-question-set, question-shape: unknowable-from-audio, speech-shape: silent-player, correctness-failure: hallucinated-answer, data-element: utterance}
  object: "assumption: 'transcript is speech-to-text of the player's think-aloud plus any game audio; no on-screen text; no telemetry joined'"
  situation: "option 'Player stuck for more than 2 minutes' for a player who stays silent for 3 minutes; the transcript has no utterances in that span"
  consequence: "the LLM can only guess duration from the absence of text, answering 'No' (nothing said) or 'Yes' with no evidence; both are unfalsifiable"
  p_typical: 0.07
