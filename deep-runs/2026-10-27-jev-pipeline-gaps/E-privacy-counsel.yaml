  proposed: "Write an access log row (user, tenant, player id, asset, time) on every clip or transcript read; keep it 12 months."
  shallow: false
- id: privacy-20
  title: "Deletion removes the latest extraction rows but older superseded runs keep the player's answers"
  level: L3
  cell: {stage: rerun-and-backfill, processing-status: superseded-by-rerun, data-element: extraction-run-id, time-and-change: player-deletion-request, recovery-action: backfill-after-question-set-change}
  object: "Answers table after a rerun: 'a re-run after a prompt change' keeps prior rows"
  situation: "Question set v2 was backfilled over v1; v1 rows were flagged superseded but not removed; the player then asks for deletion and the job deletes by current run-id only."
  consequence: "2 older answer rows per video stay in the table and in backups, still holding the player's id."
  p_typical: 0.05
  grounded: inferred
  evidence: "none"
  proposed: "Key deletion on player id across all extraction-run-ids and superseded rows; add a test that counts rows by player id after deletion."
  shallow: false
- id: privacy-21
  title: "A backfill job writes new answer rows for a player after the deletion request was processed"
  level: L3
  cell: {stage: rerun-and-backfill, processing-status: rerun-in-progress, time-and-change: player-deletion-request, recovery-action: delete-and-propagate, batch-failure-mix: retry-produced-duplicate}
  object: "Rerun job and deletion job running against the same player's videos"
  situation: "A 6-hour rerun after a model upgrade has already read the player's transcript into memory at hour 1; deletion completes at hour 2; the rerun writes at hour 5, and a retry duplicates the write."
  consequence: "The deleted player's answers reappear in the table; the deletion receipt is wrong."
  p_typical: 0.04
  grounded: speculative
  evidence: "none"
  proposed: "Check a deleted-players list in the answer writer before every insert, and fail the job write if the player id is tombstoned."
  shallow: false
- id: privacy-22
  title: "Player id is reused or swapped between two players, so a deletion request removes the wrong person's data or misses the right one"
  level: L3
  cell: {stage: build-and-metadata-tagging, data-element: player, session-shape: same-player-multiple-sessions, correctness-failure: right-answer-wrong-player, time-and-change: player-deletion-request}
  object: "Player and session tagging done by playtest ops (spec: 'how videos of one session are linked' is unspecified)"
