  cell: {stage: answers-table, data-element: utterance, studio-question-type: find-players-who, question-shape: question-not-in-set, speech-shape: continuous-think-aloud}
  object: "Fixed question set cannot capture this ('The question set is small'), so it survives only in the transcript"
  situation: "A player says 'I'm colour-blind so I can't see the arrow'; a studio asks 'which players mentioned a disability?' and the raw-transcript fallback returns 6 players by id."
