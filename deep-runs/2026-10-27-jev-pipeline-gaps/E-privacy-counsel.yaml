- id: privacy-19
  title: "No audit log of which studio user viewed which player's clip or transcript"
  level: L3
  cell: {stage: access-control, scale: many-concurrent-studio-users, data-element: studio-tenant, studio-question-type: show-me-raw-transcript-or-clip, tenancy: one-studio-many-games}
  object: "Studio-facing chatbot (spec step 4); roles and users are 'who at the studio asks' (unspecified)"
  situation: "40 analysts and contractors from one studio's 3 games can request raw transcripts and clips; the pipeline stores no viewer id, timestamp or purpose."
  consequence: "After a complaint or breach the vendor cannot say who saw a given child's recording, and cannot answer an access request about disclosures."
  p_typical: 0.08
  grounded: inferred
