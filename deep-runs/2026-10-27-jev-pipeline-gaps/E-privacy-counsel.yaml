  level: L3
  cell: {stage: build-and-metadata-tagging, data-element: player, session-shape: same-player-multiple-sessions, tenancy: many-studios-shared-infra, scale: 10-games-at-once}
  object: "Spec step 3 per-game question sets with a shared answers table"
