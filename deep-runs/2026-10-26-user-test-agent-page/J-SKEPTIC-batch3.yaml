- id: participant-1
  case: >-
    This leaf is graded "grounded: speculative" with "evidence: none", and the spec never mentions consent, withdrawal,
    erasure or retention, so it rests on a chain of assumptions: the participant withdraws consent, the researcher
    handles that by deleting on the Videos page alone, and the Report names the participant. The feature under spec is the
    agent page (Report, Ask question, History). Data-subject erasure is a company-wide privacy and retention policy that
    covers transcripts, ingestion indexes, backups and exports along with History entries. It belongs to the
    privacy/data-retention owner and the Videos page's deletion design, not to a line in this PRD. Writing "redact every
    derived entry" here, without the wider retention model, would add a cross-system cascade (which derivative, partial
    redaction of a multi-video report, follow-up threads) to a first build that has not yet defined entry statuses. Users
    cannot change derived entries before the cascade exists, because the spec gives History no edit and no share, so it
    can be added later without migrating anything users rely on. In the meantime History is per user and private, so the
    exposure is held in one researcher's account. Defer to the privacy/retention workstream with a tracking note, and do
    not specify it in this feature.
- id: participant-31
  case: >-
    The proposed default ("Participant 1..N in selection order") is a one-line output-formatting rule. It costs 1 to
    address, and it is a prompt-template change the agent team can ship or alter at any time without UI or data-model
    work. That makes it cheap to fix later, and it does not need to be a PM decision before build. Whether sessions are
    pseudonymised is a study-level promise made in consent forms the product never sees. Many internal UX teams name
    participants by first name on purpose, so a forced "Participant N" default would be wrong for them. The leaf's own
    occurrence is low (p_typical 0.06). The harm also needs an export or share path, and its cell names
    "share-or-export-not-in-spec": the spec has no sharing, and History is per user, so a named report stays with the
    researcher who already watched the video and knows the name. Accept the model's behaviour as-is for v1. Let the
    researcher write "use pseudonyms" in the optional prompt field the spec already provides. Revisit when sharing or a
    workspace privacy setting is specified.
- id: contract-5
  case: >-
    This is a matter of report-writing quality, not a gap in the feature's behaviour, and the spec already provides the
    lever: "Prompt / instructions (optional)". A researcher who wants "N of M" can ask for it. The leaf's evidence is an
    inference about what the agent might write with an empty prompt. Its p_typical is 0.06, and the mitigation (a content
    rule in the system prompt) costs 1, can be tuned after launch from real outputs, and touches no UI, state or data.
    Hard-coding a ban on "most, many, several, few" in the PRD before anyone has seen a real report fixes one style
    issue and leaves the larger accuracy question open (contract-12, modality-1). The rule also cannot be met when the
    agent cannot count reliably (missed or merged participants), so an "N of M" can look more precise than it is.
    Defer to the agent-prompt and evaluation work, where output style is tested against real study videos. Do not add it
    to this spec.
- id: lowvision-25
  case: >-
    I cannot make a strong case. The skeptic's best points: the spec defines no badge design, and the statuses
    themselves are still listed as unspecified. Never relying on colour alone (WCAG 1.4.1) is a baseline standard that a
    competent design system already applies to every status chip, so it is covered by a reasonable default and does not
    need a feature-specific line. It is also cheap to fix after build (cost 1, CSS and icon only). Still, the fix costs
    almost nothing to write down, and p_typical 0.22 is the highest in this batch. Defer only if the team's design system
    is known to enforce text plus shape on status badges. Otherwise this is a fair one-line acceptance criterion.
- id: contract-12
  case: >-
    "A Report produces one output covering all selected videos" defines the output's scope, not its analytical method.
    How much evidence a theme needs to count as a finding is a research-method choice that differs by team and study: in
    a 5-participant usability test, one participant failing checkout is often a valid headline finding. A fixed
    "single-video items go under 'Single observations'" rule would demote real severe issues and would override the
    researcher's judgment, which the spec already supports through the optional prompt. The leaf's occurrence is 0.05,
    and the consequence ("stakeholder acts on a single remark") needs the researcher to forward an unread AI report
    without checking it against the videos they selected. That is a review-practice problem, not missing feature
    behaviour. The cheaper fix, after real outputs exist, is a default "seen in N of M videos" annotation (overlapping
    contract-5) that the agent team can tune in the system prompt. Defer to the output-quality and evaluation work, and
    keep it out of the build spec.
