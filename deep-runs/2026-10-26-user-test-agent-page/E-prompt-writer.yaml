  p_typical: 0.02
  grounded: speculative
  evidence: "Prompt / instructions (optional)"
  proposed: "Field is a plain textarea; paste is converted to plain text; zero-width characters stripped"
  shallow: false

- id: prompt-28
  title: "Arabic or Hebrew run name breaks column order in the history row without bidi isolation"
