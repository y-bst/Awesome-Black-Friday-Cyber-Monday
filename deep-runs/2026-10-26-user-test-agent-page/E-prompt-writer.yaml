- id: prompt-33
  title: "Whitespace-only question ('   ') passes a non-empty check if the check is on raw length"
  level: L4
  cell: {surface: question-field, mode: ask-question, text-input-state: question-empty, action: type-question}
  object: "Ask question field"
  situation: "User types 3 spaces, Submit becomes enabled"
  consequence: "Entry created with a blank question; History row (if titled by question) is blank"
