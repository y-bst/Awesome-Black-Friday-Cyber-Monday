- id: prompt-34
  title: "Picking a suggested question: whether it submits immediately or fills the editable field is undefined"
  level: L3
  cell: {surface: suggested-questions, text-input-state: question-picked-from-suggested, action: pick-suggested-question, mode: ask-question}
  object: "'Suggested questions are shown and can be picked'"
  situation: "User clicks 'What did users struggle with most?' intending to add 'in the onboarding flow'"
  consequence: "If picking submits immediately, the user cannot edit and gets an off-target answer plus an unwanted History entry"
  p_typical: 0.10
  grounded: quote
  evidence: "Suggested questions are shown and can be picked"
  proposed: "Picking fills the question field and focuses it with the caret at the end; only Submit sends"
  shallow: false

- id: prompt-35
  title: "Picking a suggested question while the field already holds typed text: replace, append, or confirm is undefined"
  level: L4
  cell: {surface: suggested-questions, text-input-state: question-picked-from-suggested, action: pick-suggested-question, thread-state: first-question}
  object: "Suggested questions; question field"
  situation: "User has typed 400 chars, then clicks a suggestion"
  consequence: "Silent replace loses 400 chars with no undo"
  p_typical: 0.04
  grounded: inferred
  evidence: "Suggested questions are shown and can be picked"
  proposed: "If the field is non-empty, picking replaces it and shows 'Undo' for 5 s (Ctrl+Z also restores)"
  shallow: false

- id: prompt-36
  title: "Edited suggested question: History has no rule on whether it is recorded as suggested or typed, and analytics on suggestion use break"
  level: L3
  cell: {surface: history-entry-detail, text-input-state: question-picked-from-suggested, action: pick-suggested-question, thread-state: thread-opened-from-history}
  object: "Suggested questions; History entry 'with whatever was submitted'"
  situation: "User picks a suggestion and appends 6 words before submitting"
  consequence: "Entry shows the final text, but product cannot measure whether suggestions are used as-is or edited; if the entry stores the suggestion id, it may display the unedited text"
  p_typical: 0.03
  grounded: inferred
  evidence: "Suggested questions are shown and can be picked"
  proposed: "Entry stores and displays the final submitted text only; event log records suggestion id plus 'edited: true'"
  shallow: false

- id: prompt-37
  title: "Suggested question picked, then the video set changed: if suggestions are derived from videos, the picked text no longer matches the selection"
  level: L3
  cell: {surface: suggested-questions, text-input-state: question-picked-from-suggested, action: deselect-video, videos-selected: 2-5}
  object: "Suggested questions; 'Whether suggested questions are static or derived from the selected videos.'"
  situation: "User selects 3 videos, picks 'Why did P2 abandon the checkout?', then deselects P2's video"
  consequence: "Question refers to a video not in the run; the answer says it cannot find P2 or invents an answer"
  p_typical: 0.03
  grounded: quote
  evidence: "Whether suggested questions are static or derived from the selected videos."
  proposed: "When suggestions are derived, the suggestion list refreshes on selection change; already-filled question text is kept unchanged"
  shallow: false

- id: prompt-38
  title: "Question unrelated to the selected videos ('What's the weather in Berlin?') has no defined agent response"
  level: L4
  cell: {surface: question-field, text-input-state: question-unrelated-to-videos, mode: ask-question, run-status: done}
  object: "'A question about the selected videos'"
  situation: "User asks a general-knowledge question with 2 videos selected"
  consequence: "Agent either answers from general knowledge (looks like a video finding) or returns a refusal stored as a Done entry"
  p_typical: 0.08
  grounded: quote
  evidence: "A question about the selected videos, typed by the user"
  proposed: "Agent answers only from the selected videos and states 'The selected videos don't cover this' when nothing matches"
  shallow: false

- id: prompt-39
  title: "Question or follow-up has no maximum length; a 5,000-char follow-up has no counter or rejection rule"
  level: L3
  cell: {surface: follow-up-thread, thread-state: follow-up-10, action: ask-follow-up, mode: ask-question}
  object: "'Follow-up questions are supported after the first answer.'"
  situation: "On follow-up 10 the user pastes a 5,000-char transcript excerpt and asks about it"
  consequence: "Thread context plus pasted text may exceed limits; failure shows up only as a failed follow-up with no reason"
  p_typical: 0.04
  grounded: inferred
  evidence: "Follow-up questions are supported after the first answer."
  proposed: "Question and follow-up max 2,000 chars with counter; spec states the follow-up count limit per thread"
  shallow: false

- id: prompt-40
  title: "Follow-up text asking 'now turn this into a full report' has no defined path from Ask question to Report"
  level: L3
  cell: {surface: follow-up-thread, thread-state: follow-up-1, mode: ask-question, text-input-state: prompt-contradicts-report-mode}
  object: "Follow-up thread; Report mode"
  situation: "After an answer about 5 videos, the user types 'Write this up as a report I can share'"
  consequence: "Answer is a long report-like message inside a question thread; no Report entry exists in History; it cannot be renamed or exported"
  p_typical: 0.03
  grounded: inferred
  evidence: "Ask question supports follow-ups."
  proposed: "Either: the agent replies in-thread and the UI offers 'Create report from these videos' pre-filled with the same selection; or spec says out of scope"
  shallow: false

- id: prompt-41
  title: "Prompt with participant names, emails or phone numbers is stored in History indefinitely with no retention or deletion rule"
  level: L3
  cell: {surface: prompt-field, actor: admin, action: delete-entry-not-in-spec, time-and-connection: after-a-year}
  object: "'Prompt / instructions (optional)'; History tab; 'History is per user, currently.'"
  situation: "Prompt says 'Focus on Maria Lopez (maria@acme.com, +1 555 0101), she churned last month'"
  consequence: "Personal data sits in History with no delete action; when 'per user, currently' changes to shared, it is exposed to the workspace; admin access is undefined"
  p_typical: 0.04
  grounded: quote
  evidence: "History is per user, currently."
  proposed: "Add delete-entry (removes prompt, question and output); spec states retention period and whether admins can read entry text"
  shallow: false

- id: prompt-42
  title: "Run name or question containing participant personal data becomes the history row title, visible on screen shares"
  level: L3
  cell: {surface: history-entry-row, actor: creator-owner, text-input-state: run-name-duplicate-of-existing, history-state: 100-entries}
  object: "History tab entry row"
  situation: "Run named 'Maria Lopez churn interview'; user shares screen in a team meeting with History open"
  consequence: "Names of 20 participants are visible in row titles at once; no rename to remove them (rename not in spec)"
  p_typical: 0.02
  grounded: inferred
  evidence: "Lists past and current submissions from both modes."
  proposed: "Add rename-entry; placeholder copy for Run name says 'Avoid participant names'"
  shallow: false

- id: prompt-43
  title: "No way to reuse a long prompt from a past entry: no copy button and no re-run with the same instructions"
  level: L3
  cell: {surface: history-entry-detail, action: re-run-not-in-spec, text-input-state: prompt-5000-chars, history-state: 100-entries}
  object: "History entry detail; Report form"
  situation: "User wants to run the same 3,000-char instructions on next week's 8 new videos"
  consequence: "User selects and copies text manually from the entry (if shown) or rewrites it; prompts drift between weekly reports"
  p_typical: 0.07
  grounded: inferred
  evidence: "a new entry appears with whatever was submitted"
  proposed: "Entry detail offers 'Use these instructions' which opens Report mode with run name and prompt pre-filled and no videos selected"
  shallow: false

- id: prompt-44
  title: "History has no search, so run names cannot be used to find a past report among 1,000 entries"
  level: L3
  cell: {surface: history-tab, history-state: 1000-entries, text-input-state: run-name-duplicate-of-existing, action: search}
  object: "History tab"
  situation: "User looks for 'Q1 pricing' report among 1,000 entries after a year"
  consequence: "Only scrolling; run names give no benefit"
  p_typical: 0.08
  grounded: quote
  evidence: "Lists past and current submissions from both modes."
  proposed: "History search over run name, prompt and question text; spec states page size (e.g. 50) and sort (newest first)"
  shallow: false

- id: prompt-45
  title: "Typo in a run name cannot be fixed after submit; rename is not in spec"
  level: L3
  cell: {surface: history-entry-row, action: rename-entry-not-in-spec, text-input-state: run-name-empty, run-status: running}
  object: "History entry; 'Run name (optional)'"
  situation: "User notices 'Q3 onbaording' on the new row right after the redirect, or wants to name a run submitted blank"
  consequence: "Wrong or missing name stays for the life of the entry"
  p_typical: 0.07
  grounded: inferred
  evidence: "Run name (optional)"
  proposed: "Inline rename on the row and detail header, allowed in any status"
  shallow: false

- id: prompt-46
  title: "Prompt referencing a video by name that is not selected ('compare with the Oct 12 session') has no defined agent response"
  level: L3
  cell: {surface: prompt-field, text-input-state: prompt-contradicts-report-mode, videos-selected: 2-5, library-state: 50-videos}
  object: "'Prompt / instructions (optional)'; Add video pop-up selection"
  situation: "User selects 3 videos and writes instructions that name a 4th video from the library"
  consequence: "Agent cannot access it and may fabricate the comparison, or quietly skip it; the user believes the comparison was done"
  p_typical: 0.04
  grounded: inferred
  evidence: "Videos are selected from already-uploaded, ingested videos via the Add video pop-up"
  proposed: "Agent states in the report which requested items it could not cover because they were not selected"
  shallow: false

- id: prompt-47
  title: "Prompt containing URLs ('also read https://notion.so/...') has no rule on whether the agent fetches external content"
  level: L3
  cell: {surface: prompt-field, text-input-state: text-contains-html-or-markdown, actor: background-agent-job, mode: report}
  object: "'Prompt / instructions (optional)'"
  situation: "Prompt includes 2 links to a research plan and a competitor site"
  consequence: "If fetched: a new injection and data-exfiltration surface. If ignored: user thinks the context was used"
  p_typical: 0.02
  grounded: speculative
  evidence: "Prompt / instructions (optional)"
  proposed: "Spec states the agent uses only the selected videos and the typed text; links are not opened"
  shallow: false

- id: prompt-48
  title: "Prompt text that is valid in Report mode but submitted with 0 videos: whether Submit is blocked or a prompt-only run is created is undefined"
  level: L4
  cell: {surface: submit-button, videos-selected: 0, text-input-state: prompt-5000-chars, mode: report}
  object: "Report mode Submit; Add video"
  situation: "User writes a long prompt and clicks Submit before adding any video"
  consequence: "Either an entry that fails after redirect (with the prompt only recoverable from History) or a validation error whose copy is undefined"
  p_typical: 0.09
  grounded: quote
  evidence: "Minimum and maximum number of videos per run"
  proposed: "Submit disabled with helper text 'Add at least 1 video' until a video is selected; typed text untouched"
  shallow: false
