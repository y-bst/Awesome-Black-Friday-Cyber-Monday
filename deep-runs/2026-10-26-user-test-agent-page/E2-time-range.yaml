- id: range-18
  title: "A 3-hour video that exceeds context is truncated silently, yet a range is the obvious remedy and nothing prompts the user to use one"
  level: L3
  cell: {surface: "selected-videos-list", video-state: "3-hour-long", mode: "report", per-video-outcome-within-run: "video-truncated-to-fit-context", action: "select-time-range-within-video"}
  object: "Selected videos list row for the 3-hour video, and the truncated per-video outcome"
  situation: "A 3-hour video plus 5 others exceeds one model context; the agent keeps part of the transcript"
  consequence: "User receives a truncated Report with no way to say which part matters; a range would make the cut a user choice rather than a silent one"
  p_typical: 0.05
  grounded: inferred
  evidence: "Minimum and maximum number of videos per run; video length and size limits."
  proposed: "When estimated transcript exceeds context, the row shows 'Too long; choose a range' and Submit explains which rows exceed"
