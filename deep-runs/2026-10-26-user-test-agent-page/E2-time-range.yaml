- id: range-16
  title: "Range handle on a 3-hour timeline at 360px: one pixel is about 30 seconds, so a segment boundary cannot be set precisely and keyboard or screen-reader operation is unspecified"
  level: L4
  cell: {surface: "selected-videos-list", video-state: "3-hour-long", mode: "report", action: "select-time-range-within-video", popup-session-state: "first-open"}
  object: "A draggable start/end timeline on the selected-videos-list row"
