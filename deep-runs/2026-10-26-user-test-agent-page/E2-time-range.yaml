- id: range-1
  title: "Selected-videos list row has no range control, so a 3-hour video can only be analysed whole or not at all"
  level: L3
  cell: {surface: "selected-videos-list", video-state: "3-hour-long", mode: ["report", "ask-question"], action: "select-time-range-within-video"}
  object: "Selected videos list on the Report form and Ask question form, one row per video chosen in the Add video pop-up"
  situation: "User adds one 3-hour (180 min) usability session and wants only part of it; the row offers remove, and nothing else is specified"
  consequence: "User either accepts a report over all 180 minutes (cost, noise, truncation risk) or does not run the analysis; no way to express 'only this part'"
  p_typical: 0.12
  grounded: quote
  evidence: "A Report produces one output covering all selected videos, not one per video."
  proposed: "Decide explicitly: no range in v1 (state it) or a per-row 'Analyse part of video' control with start and end"
  shallow: false
- id: range-2
  title: "No way to skip the first 20 minutes of warm-up (intro, consent, tech check) in a 3-hour session; open-ended 'from 0:20:00 to end' is not a defined range shape"
  level: L3
  cell: {surface: "selected-videos-list", video-state: "3-hour-long", mode: "report", action: "select-time-range-within-video", videos-selected: "1"}
  object: "Selected videos list row for the 3-hour video; Report mode Prompt / instructions (optional)"
  situation: "Moderator spends 0:00:00-0:20:00 on consent and a mic check; the user wants findings from 0:20:00 to the end and types 'ignore the first 20 minutes' into Prompt"
  consequence: "The prompt is advice to a model, not a boundary: the 20 minutes are still read, billed and can surface in the report; a range with only a start needs a defined end default"
  p_typical: 0.06
  grounded: inferred
  evidence: "Prompt / instructions (optional)"
  proposed: "If ranges exist, allow start-only (end defaults to video end) and end-only (start defaults to 0:00:00); test: a start-only range of 0:20:00 on a 3:00:00 video yields citations only at or after 0:20:00"
  shallow: false
- id: range-3
  title: "Choosing one task segment (e.g. 1:12:00-1:41:30 of one video) while other selected videos run whole: per-video versus run-level range is unspecified"
  level: L3
  cell: {surface: "selected-videos-list", video-state: "3-hour-long", mode: "report", videos-selected: "2-5", action: "select-time-range-within-video"}
  object: "Selected videos list with 4 videos, one of them 3 hours long"
  situation: "User wants task 3 of the 3-hour session (29.5 minutes) plus three short 10-minute clips in full, in one Report"
  consequence: "If a range is a run-level setting it would apply to the 10-minute clips too (range past their end); if per video, each row needs its own control and the form needs a summary of what each row covers"
  p_typical: 0.05
  grounded: speculative
  evidence: "A Report produces one output covering all selected videos, not one per video."
  proposed: "Specify range as a property of each selected-video row, default 'whole video'; the row shows '1:12:00-1:41:30 (29m 30s)' once set"
  shallow: false
- id: range-4
  title: "Range entry format for a 3-hour video: hh:mm:ss versus mm:ss, so '90:00' can mean 90 minutes or be rejected"
  level: L4
  cell: {surface: "selected-videos-list", video-state: "3-hour-long", mode: "ask-question", text-input-state: "whitespace-only", action: "select-time-range-within-video"}
  object: "Start and end fields of a range control on a selected-videos-list row"
  situation: "User types '90:00' to '120:00' for a segment of a 3:00:00 video, or types ' ' (whitespace) in the end field, or '1:30' meaning 1 h 30 min"
  consequence: "'1:30' is read as 1 min 30 s instead of 1 h 30 min and the answer is about the wrong 90 seconds; a blank end silently becomes the video end"
  p_typical: 0.04
  grounded: speculative
  evidence: "none"
  proposed: "Accept h:mm:ss and mm:ss, echo the parsed result as '1h 30m 00s' under the field; blank end shows 'to end (3:00:00)'"
  shallow: false
- id: range-5
  title: "Invalid ranges on submit (start after end, end 3:10:00 on a 3:00:00 video, zero-length) have no validation rule or message"
  level: L4
  cell: {surface: "selected-videos-list", video-state: "3-hour-long", mode: "report", run-status: "failed-before-start-validation", action: "select-time-range-within-video"}
  object: "Submit button on the Report form with a range set on a selected video"
  situation: "User sets 2:50:00-3:10:00 on a 3:00:00 video, or start 1:00:00 and end 0:45:00, then presses Submit"
  consequence: "With no loading page, Submit redirects to History and the entry later fails or covers only 2:50:00-3:00:00; user sees the error away from the field that caused it"
  p_typical: 0.04
  grounded: inferred
  evidence: "On submit the user is redirected to the **History** tab, where a new entry appears with whatever was submitted."
  proposed: "Validate before redirect: end <= duration, start < end, minimum length (e.g. 1 minute); error shown on the row and Submit blocked"
  shallow: false
- id: range-6
  title: "Uploader trims the 3-hour video to 2 hours after a user chose 2:30:00-2:45:00: the range lies past the new end and the spec has no rule for a range that became invalid"
  level: L3
  cell: {surface: "selected-videos-list", video-state: "re-ingesting-after-edit", mode: "report", actor: "video-uploader-other-than-runner", action: "select-time-range-within-video"}
  object: "Selected videos list row holding a range, versus the video after the uploader trims and re-ingests it"
  situation: "User A has a range 2:30:00-2:45:00 on a 3:00:00 video in an unsubmitted form; uploader B trims it to 2:00:00 and ingestion re-runs; A submits"
  consequence: "Run covers nothing for that video but may still finish Done, or fails the whole Report over one video; per-video outcome (unusable) is not defined for ranges"
  p_typical: 0.06
  grounded: inferred
  evidence: "Whether a video that is still ingesting, or failed ingestion, can be selected."
  proposed: "On submit and on run start compare range to current duration; mark the row 'range outside video (now 2:00:00)' and treat it as unusable video, not as empty output"
  shallow: false
- id: range-7
  title: "Uploader trims 10 minutes off the start: the stored range 1:00:00-1:30:00 stays numerically valid but now points at different content"
  level: L3
  cell: {surface: "selected-videos-list", video-state: "re-ingesting-after-edit", mode: "ask-question", actor: "video-uploader-other-than-runner", action: "select-time-range-within-video"}
  object: "Stored start and end of a range on the selected row, and the timeline of the re-ingested video"
  situation: "A range was set for the task segment at 1:00:00-1:30:00; the uploader removes the first 10 minutes, so that task now sits at 0:50:00-1:20:00; the range still fits within the video"
  consequence: "Answer is about the wrong 30 minutes and cites plausible timestamps; no error exists to alert the user, and nothing records that the range predates the trim"
  p_typical: 0.04
  grounded: speculative
  evidence: "none"
  proposed: "Store the range with the ingestion version it was set against; if the version differs at submit, show 'video was edited; confirm range' and block until confirmed"
  shallow: false
- id: range-8
  title: "History entry row and detail do not show the chosen range, so two entries on the same 3-hour video with different ranges look identical"
  level: L3
  cell: {surface: "history-entry-row", video-state: "3-hour-long", mode: "report", history-state: "report-and-question-entries-interleaved", action: "select-time-range-within-video"}
  object: "History tab entry row and entry detail, 'a new entry appears with whatever was submitted'"
  situation: "User runs the same video three times on 0:20:00-1:00:00, 1:00:00-2:00:00 and 2:00:00-3:00:00 with blank run names"
  consequence: "Three rows read the same video name and differ only by timestamp; user cannot tell which segment each report covers without opening each"
  p_typical: 0.07
  grounded: quote
  evidence: "a new entry appears with whatever was submitted."
  proposed: "Row subtitle shows '1 video, 1:00:00-2:00:00' for single-range runs and '3 videos, 1 with range' otherwise; detail lists each video with its range"
  shallow: false
- id: range-9
  title: "Citations in an entry made with a range: timestamps relative to the range start (00:05:12) versus the full video (1:17:12) is undefined"
  level: L3
  cell: {surface: "cited-video-timestamp-player", video-state: "3-hour-long", mode: "ask-question", action: "open-cited-timestamp", history-state: "1-entry"}
  object: "Cited video timestamps in the answer, which open the video player"
  situation: "Range 1:12:00-1:41:30; the answer cites '5:12'; the user clicks it"
  consequence: "If relative to range start, the player opens 5:12 into the full video (wrong moment by 1h 12m); if the full-video time, the answer reads '1:17:12', which must match the player scale"
  p_typical: 0.07
  grounded: inferred
  evidence: "Citations to video + timestamp are unspecified"
  proposed: "Cite in full-video time always; player opens at that time; test: range start 1:12:00, a quote spoken 5:12 in is cited as 1:17:12"
  shallow: false
- id: range-10
  title: "Follow-up in a thread started with a range: unspecified whether follow-ups stay inside the range or may read the rest of the 3-hour video"
  level: L3
  cell: {surface: "follow-up-thread", video-state: "3-hour-long", mode: "ask-question", thread-state: "follow-up-1", action: "ask-follow-up"}
  object: "Follow-up questions are supported after the first answer."
  situation: "First question was about 1:12:00-1:41:30; follow-up asks 'what did the participant say just before this?' and the answer lies at 1:08:00"
  consequence: "Agent either answers 'not in the selected segment' or silently reads outside the range (more cost, scope differs from what the entry row says)"
  p_typical: 0.05
  grounded: quote
  evidence: "Follow-up questions are supported after the first answer."
  proposed: "Follow-ups inherit the range; thread header shows it; changing it starts a new thread (no widening mid-thread)"
  shallow: false
- id: range-11
  title: "Cost per range: whether a 29.5-minute range of a 180-minute video is billed for 29.5 minutes or for the whole 180 is unspecified"
  level: L3
  cell: {surface: "selected-videos-list", video-state: "3-hour-long", mode: "report", permission-and-plan: "quota-remaining", action: "select-time-range-within-video"}
  object: "Run cost and quota consumption for a run with a selected row holding a range"
  situation: "User runs 1:12:00-1:41:30 of a 3:00:00 video; transcript is already ingested in full"
  consequence: "If charged on full video, range gives no saving and user sees it as a broken promise; if on range, cost differs per run and a quota preview is needed (no cost preview exists today)"
  p_typical: 0.06
  grounded: inferred
  evidence: "Minimum and maximum number of videos per run; video length and size limits."
  proposed: "Bill on analysed minutes (range length); show '29m 30s of 3h 00m' on the row and quota effect at Submit"
  shallow: false
- id: range-12
  title: "Length limit applied to the video or to the range: a 3-hour video over the (undefined) limit may become valid with a 30-minute range, and sum-of-ranges counting is unspecified"
  level: L3
  cell: {surface: "selected-videos-list", video-state: "3-hour-long", mode: "report", videos-selected: "exceeds-limit-once-defined", action: "select-time-range-within-video"}
  object: "'video length and size limits' (listed under Still unspecified) and the selected-videos-list"
  situation: "Product defines a 2-hour per-video limit and a 6-hour per-run limit; user selects the 3-hour video with a 40-minute range, plus 3 other videos of 2 hours"
  consequence: "If limits count full video length the 3-hour video is rejected despite the range; if they count range length the run totals 6h 40m or 6h 00m depending on rule; messages cannot be written without the rule"
  p_typical: 0.06
  grounded: quote
  evidence: "Minimum and maximum number of videos per run; video length and size limits."
  proposed: "Limits count analysed minutes (range length, or full length if no range); the over-limit message names the total, e.g. '6h 40m of 6h'"
  shallow: false
- id: range-13
  title: "Same 3-hour video selected twice with two different ranges (task 2 and task 4 segments): duplicate selection rule and Report structure are undefined"
  level: L3
  cell: {surface: "selected-videos-list", video-state: "3-hour-long", mode: "report", videos-selected: "selection-with-duplicate-uploads-of-same-session", action: "select-time-range-within-video"}
  object: "Selected videos list, which lists each video once as chosen in the Add video pop-up"
  situation: "User wants segments 0:40:00-1:10:00 and 2:05:00-2:35:00 of the same video in one Report and adds the video a second time"
  consequence: "Pop-up probably ticks a video once, so the second segment is impossible; if allowed, the Report may treat them as two videos and the video count reads 2 for one file"
  p_typical: 0.03
  grounded: speculative
  evidence: "A Report produces one output covering all selected videos, not one per video."
  proposed: "Allow multiple ranges per video row ('+ add another range'); video count counts files, range count shown separately"
  shallow: false
- id: range-14
  title: "A range that falls on silence or a break (e.g. 1:30:00-1:45:00 lunch pause) gives Done with empty output and no explanation naming the range"
  level: L4
  cell: {surface: "selected-videos-list", video-state: "silent-or-no-transcript", mode: "report", run-status: "done-with-empty-output", action: "select-time-range-within-video"}
  object: "History entry detail for a Done Report whose only range has no transcript"
  situation: "User picks 1:30:00-1:45:00 of a 3:00:00 recording where the participant left the room; the transcript has 0 words in that span"
  consequence: "Entry shows Done with an empty or generic report; user cannot tell whether the agent failed or the segment was silent"
  p_typical: 0.03
  grounded: speculative
  evidence: "none"
  proposed: "If a range has 0 transcript words, mark the video unusable for that range with the text 'No speech between 1:30:00 and 1:45:00'"
  shallow: false
