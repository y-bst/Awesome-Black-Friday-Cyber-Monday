    mode:
    - report
    - ask-question
    run-status: done
    actor: creator-owner
    output-review-action (off-axis): flag-claim
  object: A flag or thumbs-down on a History entry (not in spec)
  situation: Owner flags a report as 'wrong participant attribution' on a Friday
  consequence: If flags only land in an analytics table, nobody reads them; if they open support tickets, support gets 50+ tickets per launch week with no runbook; if they feed the eval set, the owner's
    video content is copied into it
  p_typical: 0.04
  grounded: speculative
  evidence: none
  already_specified: false
  proposed: 'Spec line: thumbs-down goes to analytics only; a claim flag opens a triage item in queue X, owner Y, reviewed within 5 business days, and is added to the eval candidate pool only with consent'
  shallow: false
