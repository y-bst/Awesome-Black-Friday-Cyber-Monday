- id: review-20
  title: No acceptance threshold for output quality gates launch or agent version changes
  level: L4
  cell:
    surface: history-entry-detail
    mode:
    - report
    - ask-question
    run-status: done
    time-and-connection: agent-model-version-changed-since-entry
    output-review-action (off-axis): compare-with-previous-version
  object: Release criteria for the agent page (absent from spec)
