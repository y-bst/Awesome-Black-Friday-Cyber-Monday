  object: Flag action on a Done Report whose body quotes a named test participant
  situation: Owner flags a report; the flag payload includes the full output, the prompt and links to the 6 source videos
  consequence: Support staff or an eval vendor view a test participant's face and words without the participant's consent covering that use; owner never saw a notice
  p_typical: 0.03
  grounded: speculative
  evidence: none
  already_specified: false
  proposed: Flag dialog states what is shared (output text only / output + video excerpts) and whether it may be used for model evaluation or training; default is output text only
