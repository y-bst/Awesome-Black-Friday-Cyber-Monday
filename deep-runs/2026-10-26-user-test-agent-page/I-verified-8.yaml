    - ask-question
    run-status: done
    history-state: 100-entries
    output-review-action (off-axis): flag-claim
  object: 'History entry status badge; spec: "Lists past and current submissions from both modes"'
  situation: Owner flags 3 of 100 Done entries as containing a fabricated quote, then returns 2 weeks later to reuse a report
  consequence: The flagged entries look identical to trusted ones, so the owner re-shares a report already known to be wrong
  p_typical: 0.04
