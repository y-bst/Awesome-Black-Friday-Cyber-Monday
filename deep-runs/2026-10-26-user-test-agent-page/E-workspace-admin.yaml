- id: admin-1
  title: Viewer-role member opens Agent page - spec never says whether Submit is shown, disabled or hidden
  level: L3
  cell: {surface: submit-button, actor: viewer-role-member, permission-and-plan: viewer-role, action: open-agent-page}
  object: Agent page Submit button (Report and Ask question modes)
  situation: A member with a viewer role lands on the Agent page and fills in the form, or only looks at it
  consequence: Viewer either runs jobs they should not, or clicks Submit and gets an unexplained error after the redirect; the owner cannot tell who may run the agent
  p_typical: 0.12
  grounded: inferred
  evidence: "Spec lists Submit under both modes and says nothing about roles or permissions"
  proposed: Add a permission line - viewer sees Submit disabled with the text 'Your role cannot run the agent' (or the page is hidden from nav)
  shallow: false
- id: admin-2
  title: Workspace on a trial or plan without the agent - nav entry, page and old History entries not specified
  level: L3
  cell: {surface: agent-page-mode-switch, permission-and-plan: trial-or-plan-without-agent, entry-point-and-lifecycle-phase: arriving-from-nav, actor: workspace-owner}
  object: Agent page (Report / Ask question modes) and History tab
  situation: Owner's workspace is on a trial or lower plan that does not include the agent, and a member clicks the Agent page in navigation
  consequence: Member sees a working form that cannot submit, or a blank page; owner gets support tickets and has no upgrade prompt to point to
  p_typical: 0.11
  grounded: speculative
  evidence: "none - spec is silent on plan gating"
  proposed: Specify an upsell state with copy and who sees the upgrade button (owner/admin only)
  shallow: false
- id: admin-3
  title: Submit when the workspace quota is exhausted - no defined result, redirect still happens?
  level: L4
  cell: {surface: quota-or-limit-message, permission-and-plan: quota-exhausted-at-submit, action: submit, surface-secondary: redirect-transition, run-status: failed-before-start-validation}
  object: "Submit and the rule 'On submit the user is redirected to the History tab, where a new entry appears'"
  situation: Quota is at 0 when a member presses Submit in Report mode with 5 videos selected
  consequence: Because there is no loading page, the member is redirected and sees either a Failed entry with a quota reason or no entry at all; test would assert which, and whether the form text is kept
  p_typical: 0.14
  grounded: quote
  evidence: "There is no loading page, to save the user's time. On submit the user is redirected to the **History** tab, where a new entry appears with whatever was submitted."
  proposed: Block Submit before redirect with an inline quota message, keep run name, prompt and selection in the form
  shallow: false
- id: admin-4
  title: Quota scope not defined - per user or per workspace - when two members submit against the last unit
  level: L3
  cell: {surface: quota-or-limit-message, actor: other-user-same-workspace, permission-and-plan: quota-remaining, time-and-connection: steady-state, action: submit}
  object: Submit button on Agent page, quota-or-limit-message
  situation: Workspace quota has 1 run left; member A and member B both press Submit within the same second
  consequence: Both get entries but only one can run, or both run and the workspace goes to -1; one member sees an entry that fails with a reason the other did not
  p_typical: 0.06
  grounded: speculative
  evidence: "none"
  proposed: Spec that quota is checked and reserved atomically at Submit, and what the loser sees
  shallow: false
- id: admin-5
  title: Quota unit undefined - a Report over 21-100 videos and a follow-up in Ask question may count as 1 unit or many
  level: L3
  cell: {surface: submit-button, videos-selected: 21-100, permission-and-plan: quota-remaining, thread-state: follow-up-10, mode: ask-question}
  object: Ask question 'Follow-up questions are supported after the first answer' and Report 'one output covering all selected videos'
  situation: Owner sets a monthly quota of 100 and a member runs one Report on 100 videos then asks 10 follow-ups
  consequence: Quota is drained by 1 run or by 100+ units; owner cannot predict spend or explain the counter to members
  p_typical: 0.07
  grounded: inferred
  evidence: "A Report produces one output covering all selected videos, not one per video. / Ask question supports follow-ups."
  proposed: State the metering unit (per Submit, per video, per video-minute, per follow-up) and show it in the quota message
  shallow: false
- id: admin-6
  title: Failed or partially failed runs - does the quota unit come back?
  level: L3
  cell: {surface: history-entry-status-badge, run-status: failed, permission-and-plan: quota-remaining, actor: background-agent-job}
  object: History entry with status Failed (assumed Queued / Running / Done / Failed)
  situation: A run fails after 30 minutes because the agent service errored, not because of the user's input
  consequence: Member loses quota for a platform fault; owner receives complaints and no rule on refunds
  p_typical: 0.06
  grounded: inferred
  evidence: "Statuses an entry can have on the History tab ... [unspecified]"
  proposed: Add a rule - quota is released when status is Failed for a system reason, kept when the failure is input-related
  shallow: false
- id: admin-7
  title: Admin cannot see or manage a member's history - 'History is per user, currently' leaves the admin case open
  level: L3
  cell: {surface: history-tab, actor: admin, history-state: 100-entries, permission-and-plan: full-access, action: open-history-entry}
  object: "History tab, clarification 'History is per user, currently.'"
  situation: Admin needs to check why a colleague's report was run on a customer's videos, or why spend spiked
  consequence: Admin has no route to see the entries; the only fallback is asking the member or support-staff impersonation
  p_typical: 0.12
  grounded: quote
  evidence: "History is per user, currently."
  proposed: Add a decision - admin can/cannot view other members' entries; if yes, a member filter on the History tab and read-only entry detail
  shallow: false
- id: admin-8
  title: Workspace owner deletes another member's history entry or whole history - not specified, and delete-entry is not in spec at all
  level: L3
  cell: {surface: history-entry-row, actor: workspace-owner, action: delete-entry-not-in-spec, history-state: 1000-entries}
  object: History entry row
  situation: Owner must remove an entry that holds a participant's personal data from a member's history
  consequence: No delete control exists for owner or member, so the data stays; a data-removal request cannot be met
  p_typical: 0.05
  grounded: speculative
  evidence: "none"
  proposed: Spec delete for the entry owner, plus an owner/admin delete with a confirmation naming the member
  shallow: false
- id: admin-9
  title: Member removed from workspace while a run is Running - job fate not specified
  level: L3
  cell: {surface: history-entry-status-badge, actor: removed-or-deactivated-user, run-status: running, permission-and-plan: member-removed-from-workspace}
  object: History entry with status Running
  situation: Owner removes a member 10 minutes into a Report over 20 videos
  consequence: Job either finishes and bills the workspace for output nobody can open, or is killed and leaves a Running entry forever; no one is told
  p_typical: 0.08
  grounded: speculative
  evidence: "none - spec does not mention membership changes"
  proposed: Spec that running jobs are cancelled on removal (status Cancelled by admin) or finish and are kept for the owner
  shallow: false
- id: admin-10
  title: Removed member's history entries - kept, purged or transferred, and who can open them
  level: L3
  cell: {surface: history-tab, actor: removed-or-deactivated-user, permission-and-plan: member-removed-from-workspace, history-state: 100-entries, time-and-connection: after-a-year}
  object: History tab ('History is per user')
  situation: A member with 100 entries leaves; a year later the owner asks for what was analysed about a customer
  consequence: Entries are lost with the user record, or stay forever with no viewer because history is bound to the removed user
  p_typical: 0.06
  grounded: inferred
  evidence: "History is per user, currently."
  proposed: Define retention for removed users (e.g. 30 days then purge) and an owner export before purge
  shallow: false
- id: admin-11
  title: Video library sharing vs per-user history - popup may list videos uploaded by teammates, and the entry then references videos the runner cannot later open
  level: L3
  cell: {surface: add-video-popup, actor: other-user-same-workspace, library-state: mixed-ownership-library, video-state: owned-by-another-user, permission-and-plan: video-owned-by-other-user}
  object: "Add video pop-up: 'selects videos from their ingested videos'"
  situation: Workspace library holds 50 videos uploaded by 4 members; member A opens the pop-up
  consequence: Unclear whether A sees only A's 'their' videos or all 50; if all, A's history holds entries about B's videos that B (or admin) cannot see, since history is per user while library may be shared
  p_typical: 0.10
  grounded: quote
  evidence: "selects videos from their ingested videos"
  proposed: State library scope (own vs workspace) and whether history entries show video names the viewer lacks access to
  shallow: false
- id: admin-12
  title: Admin deletes a video on the Videos page that appears in other members' history entries
  level: L3
  cell: {surface: history-entry-detail, actor: admin, video-state: deleted-after-run, history-state: entry-referencing-deleted-video, action: open-history-entry}
  object: History entry detail, Videos page
  situation: Admin deletes 1 of 8 videos used in a done Report owned by a member
  consequence: Member's report shows a dead video name or lost citations, with no warning to admin before deletion about how many entries reference it
  p_typical: 0.06
  grounded: inferred
  evidence: "Videos page: users upload videos; uploaded videos get ingested."
  proposed: On delete, show 'Used in N history entries' and spec how entries display the removed video
  shallow: false
- id: admin-13
  title: No audit trail of who ran what on which videos - History tab is the only record and is per user
  level: L3
  cell: {surface: history-entry-row, actor: workspace-owner, history-state: report-and-question-entries-interleaved, action: search-history, permission-and-plan: full-access}
  object: History entry row fields (run name, mode, status) and 'History is per user'
  situation: Compliance asks which members ran the agent on videos of one customer in the last 90 days
  consequence: Owner cannot answer without opening each user's account; deletion of an entry by its owner erases the only evidence
  p_typical: 0.07
  grounded: inferred
  evidence: "Lists past and current submissions from both modes. History is per user."
  proposed: Add a workspace audit log (user, mode, timestamp, video ids, prompt/question hash) kept independent of user-deletable entries
  shallow: false
- id: admin-14
  title: Member demoted to viewer or access revoked while a run is Running
  level: L3
  cell: {surface: history-entry-status-badge, actor: viewer-role-member, run-status: running, permission-and-plan: access-revoked-mid-run, observer-location-at-status-change: other-tab}
  object: History entry with status Running and follow-up thread
  situation: Owner changes a member's role from member to viewer 5 minutes into a run, and the member has a follow-up open in another tab
  consequence: Run completes under old rights; the member can still press Ask follow-up on a thread whose rights were removed
  p_typical: 0.04
  grounded: speculative
  evidence: "none"
  proposed: Specify that permission is checked at Submit and at each follow-up, not only at page load
  shallow: false
- id: admin-15
  title: Queued runs of a deactivated user are neither cancelled nor attributed
  level: L3
  cell: {surface: history-entry-status-badge, actor: removed-or-deactivated-user, run-status: queued, time-and-connection: deploy-during-run, history-state: several-running-at-once}
  object: History entry with status Queued
  situation: User is deactivated with 3 Queued entries behind a long run
  consequence: Queued jobs start later and consume workspace quota after the user is gone
  p_typical: 0.04
  grounded: speculative
  evidence: "none"
  proposed: Cancel Queued entries on deactivation and mark them Cancelled
  shallow: false
- id: admin-16
  title: Plan ends (trial expiry or downgrade) with runs Running and a History tab full of entries
  level: L3
  cell: {surface: history-tab, permission-and-plan: trial-or-plan-without-agent, run-status: running, actor: workspace-owner, time-and-connection: after-a-year}
  object: History tab, entries with status Running and Done
  situation: Trial ends at 00:00 while 2 runs are Running and 40 Done entries exist
  consequence: Entries become unreadable behind a paywall, or stay readable with no way to ask follow-ups; owner does not know which until a member complains
  p_typical: 0.04
  grounded: speculative
  evidence: "none"
  proposed: State read-only access to existing History for N days after plan end and the status of in-flight runs
  shallow: false
- id: admin-17
  title: Quota message copy does not say who can fix it - member vs owner/admin
  level: L4
  cell: {surface: quota-or-limit-message, actor: viewer-role-member, permission-and-plan: quota-exhausted-at-submit, surface-secondary: error-toast-or-banner, action: submit}
  object: quota-or-limit-message
  situation: A non-admin member hits the limit; the message says 'Quota reached'
  consequence: Member cannot act, and does not know whom to ask; test would assert the message names the workspace owner or contact and offers an upgrade button only to owner/admin
  p_typical: 0.07
  grounded: speculative
  evidence: "none"
  proposed: Two copy variants - member ('Ask your workspace admin to raise the limit') and owner ('Upgrade or add quota')
  shallow: false
- id: admin-18
  title: Draft form content (run name, prompt, selection) after a blocked Submit
  level: L3
  cell: {surface: prompt-field, permission-and-plan: quota-exhausted-at-submit, text-input-state: prompt-5000-chars, action: return-to-draft}
  object: Prompt / instructions field and Add video selection
  situation: Member wrote a 5000-char prompt and selected 12 videos; Submit is rejected for quota, and they return after the owner raises the quota 1 hour later
  consequence: Form is empty and the member retypes the prompt and reselects 12 videos
  p_typical: 0.05
  grounded: speculative
  evidence: "none"
  proposed: Keep the draft in the browser for the session and show a 'Restore draft' prompt on return
  shallow: false
- id: admin-19
  title: Owner has no cost attribution - 3-hour videos in a 100-video Report cost far more than quota counts suggest, and no per-member usage view exists
  level: L3
  cell: {surface: quota-or-limit-message, actor: workspace-owner, videos-selected: 21-100, video-state: 3-hour-long, library-state: library-at-plan-max}
  object: Report mode Add video selection ('Minimum and maximum number of videos per run; video length and size limits' unspecified)
  situation: One member submits 100 videos of 3 hours each (300 video-hours)
  consequence: One run exhausts the plan; owner learns only when the next member's Submit fails
  p_typical: 0.05
  grounded: quote
  evidence: "Minimum and maximum number of videos per run; video length and size limits."
  proposed: Define limits per run in video-minutes, tie them to plan, and show remaining minutes on the form
  shallow: false
- id: admin-20
  title: No heads-up to owner or admin when the quota nears exhaustion
  level: L3
  cell: {surface: notification-email-or-in-app, actor: workspace-owner, permission-and-plan: quota-remaining, time-and-connection: steady-state, run-status: done}
  object: notification-email-or-in-app surface
  situation: Workspace is at 90% of its quota with 8 days left in the period
  consequence: Quota reaches zero mid-week; members hit the Submit block with no previous notice
  p_typical: 0.04
  grounded: speculative
  evidence: "none"
  proposed: Send in-app and email notice to owner/admin at 80% and 100%
  shallow: false
- id: admin-21
  title: Videos uploaded by a removed member vanish with the account, breaking other users' entries and the shared library
  level: L3
  cell: {surface: videos-page, actor: removed-or-deactivated-user, video-state: owned-by-another-user, history-state: entry-referencing-deleted-video, permission-and-plan: member-removed-from-workspace}
  object: Videos page library and History entry referencing the removed member's videos
  situation: Member who uploaded 30 videos is removed; 3 teammates have Done entries that cite them
  consequence: Entries show deleted videos, cited timestamps open nothing, and the owner has no option to transfer video ownership first
  p_typical: 0.05
  grounded: inferred
  evidence: "Videos page: users upload videos; uploaded videos get ingested."
  proposed: On removal, force an owner choice - transfer videos to owner, keep read-only, or delete - and state the effect on entries
  shallow: false
- id: admin-22
  title: Data-subject deletion - a test participant asks to be erased; spec does not say what happens to derived reports, answers and follow-ups
  level: L3
  cell: {surface: history-entry-detail, actor: test-participant-data-subject, actor-secondary: workspace-owner, video-state: deleted-after-run, run-status: done, text-input-state: text-contains-participant-personal-data}
  object: History entry detail (Report output and follow-up thread)
  situation: Participant requests deletion of their session video; 6 members have entries whose output quotes them
  consequence: Video is deleted but outputs and follow-up threads in 6 per-user histories keep the quotes; owner cannot find them because History is per user
  p_typical: 0.06
  grounded: inferred
  evidence: "History is per user, currently."
  proposed: Add a rule that deleting a video flags or redacts dependent entries, and a workspace search for entries by video
  shallow: false
- id: admin-23
  title: Participant personal data typed into the Prompt or question field is stored in a history only the typist sees
  level: L3
  cell: {surface: prompt-field, text-input-state: text-contains-participant-personal-data, actor: admin, history-state: 100-entries}
  object: Prompt / instructions (optional) and question field
  situation: A member writes 'Focus on what Maria Lopez (maria@acme.com) said about pricing'
  consequence: Personal data now lives in History text that the admin cannot review, export or delete, and no guidance is shown on the field
  p_typical: 0.04
  grounded: speculative
  evidence: "Prompt / instructions (optional)"
  proposed: Decide whether admin can search and delete prompt text, and add a one-line data notice under the field
  shallow: false
- id: admin-24
  title: Support-staff impersonation reads a member's history - no marker or logging specified
  level: L3
  cell: {surface: history-entry-detail, actor: support-staff-impersonating, history-state: 1-entry, permission-and-plan: full-access, observer-location-at-status-change: inside-entry-detail}
  object: History entry detail
  situation: Support impersonates a member to debug a failed run and opens an entry containing customer videos
  consequence: Owner is not informed that a vendor employee viewed per-user history, which may breach customer agreements
  p_typical: 0.03
  grounded: speculative
  evidence: "none"
  proposed: Log support views to the workspace audit log and show an 'Opened by support' marker visible to owner
  shallow: false
- id: admin-25
  title: Viewer-role member opens History tab - empty, hidden or read-only
  level: L3
  cell: {surface: history-tab, actor: viewer-role-member, permission-and-plan: viewer-role, history-state: empty, surface-secondary: empty-state}
  object: History tab empty state
  situation: Viewer has never been allowed to run; they open History
  consequence: They see an empty-state copy inviting them to 'Run your first report', which they cannot do
  p_typical: 0.06
  grounded: inferred
  evidence: "Lists past and current submissions from both modes."
  proposed: Role-specific empty-state copy, or hide the tab for viewers
  shallow: false
- id: admin-26
  title: Per-user history is 'currently' so - what happens to existing entries when workspace-wide history is introduced
  level: L3
  cell: {surface: history-tab, actor: workspace-owner, history-state: 1000-entries, time-and-connection: after-a-year, permission-and-plan: full-access}
  object: "Clarification: 'History is per user, currently.'"
  situation: Next release adds shared history; 1000 existing private entries from 12 members carry prompts written under a private assumption
  consequence: Entries become visible to teammates with no consent, or stay private forever and make shared history inconsistent
  p_typical: 0.05
  grounded: quote
  evidence: "History is per user, currently."
  proposed: Add an entry-level visibility field now (private default) so a later change does not expose old entries
  shallow: false
- id: admin-27
  title: Workspace-wide concurrency cap - 10 members submit at once and entries sit in Queued or Rate-limited with no explanation
  level: L3
  cell: {surface: history-entry-status-badge, actor: other-user-same-workspace, run-status: rate-limited-waiting, history-state: several-running-at-once, time-and-connection: rate-limit-at-submit}
  object: History entry status badge (assumed Queued / Running / Done / Failed)
  situation: 10 members submit Reports of 20 videos within 1 minute and the workspace can run 3
  consequence: 7 entries show Queued with no position or time estimate; owner cannot tell if a job is stuck or waiting
  p_typical: 0.06
  grounded: inferred
  evidence: "Statuses an entry can have on the History tab ... [unspecified]"
  proposed: Add status 'Waiting for capacity' with queue position and a workspace-level concurrency number in the spec
  shallow: false
- id: admin-28
  title: Admin cannot cancel another member's runaway run, and cancel is not in spec even for the owner of the run
  level: L3
  cell: {surface: history-entry-row, actor: admin, run-status: stuck-over-1h, action: cancel-run-not-in-spec, permission-and-plan: quota-remaining}
  object: History entry with status Running for over 1 hour
  situation: A run stays Running for 3 hours and consumes capacity while quota ticks down
  consequence: Admin has no control; member may not notice; the run blocks the queue for the rest of the workspace
  p_typical: 0.05
  grounded: inferred
  evidence: "none - cancel not in spec"
  proposed: Specify cancel for the run owner and workspace admin plus an automatic timeout (for example 2 hours) with status Failed
  shallow: false
- id: admin-29
  title: Video in a folder or project the runner can no longer see - selection and history entry still reference it
  level: L3
  cell: {surface: selected-videos-list, video-state: access-revoked, permission-and-plan: video-in-folder-user-cannot-see, library-state: videos-in-folders-or-projects, actor: creator-owner}
  object: Selected videos list and History entry detail
