  shallow: false
- id: admin-30
  title: Admin disables export or sharing of outputs - and reports can be copied out by a member to a person without workspace access
  level: L3
  cell: {surface: export-or-copy-output, actor: report-recipient-without-access, action: share-or-export-not-in-spec, permission-and-plan: viewer-role}
  object: History entry detail output (copy / export not in spec)
