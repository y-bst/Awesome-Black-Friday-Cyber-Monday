- id: admin-36
  title: Role rules per mode - viewer may be allowed to ask questions on existing outputs but not start a Report
  level: L3
  cell: {surface: agent-page-mode-switch, actor: viewer-role-member, mode: ask-question, permission-and-plan: viewer-role, action: switch-mode}
  object: Mode switch between Report and Ask question
  situation: Owner wants viewers to use Ask question (cheap) but not Report (expensive)
  consequence: Spec has one permission for the page, so the owner must choose all or nothing
  p_typical: 0.04
  grounded: speculative
  evidence: "Agent page: two modes, Report and Ask question, plus a History tab."
  proposed: State permissions per mode, or state that both modes share one permission
  shallow: false
- id: admin-37
  title: A follow-up on an old entry after the member has lost access to the source videos or the workspace plan changed
  level: L3
  cell: {surface: follow-up-thread, thread-state: follow-up-after-video-deleted, permission-and-plan: access-revoked-mid-run, actor: creator-owner, action: ask-follow-up}
  object: Follow-up thread in an Ask question entry
  situation: Member opens a 4-month-old thread and types follow-up 11 after their access to 2 of 3 videos was revoked
  consequence: Answer cites videos the member can no longer open, or fails with an unexplained error; owner revoked access intending to stop exactly this
  p_typical: 0.05
  grounded: inferred
  evidence: "Follow-up questions are supported after the first answer."
  proposed: Re-check video access on each follow-up and disable the input with a stated reason
  shallow: false
- id: admin-38
  title: Owner-set quota or limit changes while a member is composing - form shows stale remaining count
  level: L3
  cell: {surface: quota-or-limit-message, time-and-connection: page-open-for-hours, permission-and-plan: quota-remaining, actor: same-user-second-tab, action: submit}
  object: quota-or-limit-message and Submit
  situation: Page was loaded with '12 runs left'; two other tabs and a teammate used 12 runs in the last 3 hours
  consequence: Form still says 12 left; Submit is rejected after redirect, or accepted and Queued without capacity
  p_typical: 0.04
  grounded: speculative
  evidence: "none"
  proposed: Re-check quota on Submit and refresh the displayed count every 60 seconds or on focus
  shallow: false
