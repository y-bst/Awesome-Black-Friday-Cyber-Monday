- id: admin-35
  title: Removed user with an open session submits - session still valid for a short time
  level: L3
  cell: {surface: submit-button, actor: removed-or-deactivated-user, time-and-connection: session-expired-at-submit, permission-and-plan: member-removed-from-workspace, action: submit}
  object: Submit button and redirect to the History tab
