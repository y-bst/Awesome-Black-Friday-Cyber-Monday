- id: limits-1
  title: "Pop-up selection count shows only 'N selected'; whether it also shows total selected duration (e.g. '4 selected, 11 h 02 min') is unspecified, so a user cannot see a 3-hour-video pile growing"
  level: L3
  cell: {surface: popup-selection-count, video-state: 3-hour-long, videos-selected: 6-20, action: select-video}
  object: "Add video pop-up selection count and footer"
  situation: "User ticks 6 videos, 4 of them 3 hours long, in a pop-up that shows a count but no duration total"
  consequence: "User reaches 12 h of footage without any signal; the over-limit result appears only at Submit or in a failed History entry"
  p_typical: 0.06
  grounded: inferred
  evidence: "Minimum and maximum number of videos per run; video length and size limits."
  proposed: "Footer reads '6 selected, 12 h 03 min of 20 h max' and updates on every checkbox change"
  shallow: false
- id: limits-2
  title: "Per-video length cap: a single 3-hour video ticked in the pop-up has no defined behaviour (row disabled with reason, tick allowed then error, or silent truncation)"
  level: L4
  cell: {surface: add-video-popup, video-state: 3-hour-long, videos-selected: 1, action: select-video}
  object: "Add video pop-up row checkbox for a 3-hour video"
  situation: "Library has one 3:00:00 video; a per-video cap of e.g. 2 h is later defined; user clicks the checkbox"
  consequence: "QA has 3 possible expected results; a user may spend 5 minutes composing a prompt for a video that can never run"
  p_typical: 0.07
  grounded: quote
  evidence: "video length and size limits."
  proposed: "Checkbox disabled with row note 'Longer than 2 h limit'; row stays visible and searchable"
  shallow: false
- id: limits-3
  title: "Per-video file size cap: a 40 GB very-large-file that is ingested has no stated rule in the pop-up (size shown? blocked? allowed because ingestion already accepted it?)"
  level: L3
  cell: {surface: selected-videos-list, video-state: very-large-file, videos-selected: 1, action: select-video}
  object: "Add video pop-up row and selected videos list for a very large ingested file"
  situation: "Ingestion accepted a 40 GB file; the run's size cap is 10 GB per video"
  consequence: "Two limits (upload/ingest vs agent run) disagree; user sees an ingested video that the agent refuses, with no size shown to explain"
  p_typical: 0.05
  grounded: inferred
  evidence: "video length and size limits."
  proposed: "Pop-up row shows size next to duration; rows over the agent size cap are disabled with 'Too large for agent runs (max 10 GB)'"
  shallow: false
- id: limits-4
  title: "Minimum video length: a 3-second clip can be ticked and counts toward the video cap; whether a minimum (e.g. 5 s) blocks selection at the checkbox is unspecified"
  level: L4
  cell: {surface: add-video-popup, video-state: 3-second-clip, videos-selected: 1, action: select-video}
  object: "Add video pop-up row for a 3-second clip"
  situation: "User ticks a 3-second clip as the only selection"
  consequence: "Submit succeeds and the Report is near-empty; if a minimum exists, no pop-up copy says so"
  p_typical: 0.08
  grounded: quote
  evidence: "Minimum and maximum number of videos per run"
  proposed: "Clips under 5 s show disabled checkbox with 'Too short for analysis (min 5 s)'"
  shallow: false
- id: limits-5
  title: "Minimum applies to total duration, not per video: 20 clips of 3 seconds (60 s total) selected together, rule and copy unspecified"
  level: L3
  cell: {surface: popup-selection-count, video-state: 3-second-clip, videos-selected: 6-20, action: select-video}
  object: "Add video pop-up selection count; 'Minimum and maximum number of videos per run'"
  situation: "User ticks 20 three-second clips, 60 s total, to compare them in one Report"
  consequence: "Count minimum is met (20) but content minimum may not be; no pop-up message says whether the selection is enough"
  p_typical: 0.03
  grounded: speculative
  evidence: "Minimum and maximum number of videos per run; video length and size limits."
  proposed: "Spec states whether the minimum is per video or total; footer shows a warning below total 30 s"
  shallow: false
- id: limits-6
  title: "Cap reached on the Nth checkbox: whether the remaining unticked rows become disabled immediately, with what tooltip, and whether the count turns to 'N of N max' is unspecified"
  level: L4
  cell: {surface: popup-selection-count, videos-selected: exceeds-limit-once-defined, popup-session-state: at-max-selection, action: select-video}
  object: "Add video pop-up checkboxes and selection count"
  situation: "Cap defined as 20; user ticks the 20th video, then clicks the 21st"
  consequence: "Click silently does nothing, or ticks and later errors; keyboard and screen-reader users get no announcement"
  p_typical: 0.15
  grounded: inferred
  evidence: "Minimum and maximum number of videos per run"
  proposed: "At 20, all unticked rows disabled with tooltip 'Maximum 20 videos per run'; count reads '20 of 20'"
  shallow: false
- id: limits-7
  title: "Select-all-filtered over cap: tag filter matches 60 videos with cap 20; selects first 20 (by which order), refuses all, or selects 60 and errors, is unspecified"
  level: L4
  cell: {surface: popup-selection-count, videos-selected: exceeds-limit-once-defined, action: select-all-filtered, library-state: 50-videos}
  object: "Add video pop-up tag filter plus select-all-filtered action"
  situation: "Library of 50-videos plus; filter by one tag returns 38 videos; user clicks select-all-filtered with cap 20"
  consequence: "User gets an arbitrary 20 (newest? first alphabetically?) without noticing, and the Report silently omits 18 videos of that tag"
  p_typical: 0.09
  grounded: inferred
  evidence: "The pop-up supports filtering by the tags the user has applied to videos, and searching by name."
  proposed: "Select-all selects nothing past the cap and shows 'Selected 20 of 38 (limit 20)' with the order rule stated"
  shallow: false
- id: limits-8
  title: "Select-all-filtered where some matches are individually over the per-video length cap: skipped silently or blocks the whole action, with no count of skipped rows"
  level: L3
  cell: {surface: popup-selection-count, video-state: 3-hour-long, action: select-all-filtered, popup-session-state: select-all-filtered}
  object: "Select-all-filtered result in the pop-up"
  situation: "Filter matches 12 videos, 3 of them 3 hours long over a 2 h cap"
  consequence: "Count shows 9 selected, user expects 12; or shows 12 and Submit fails"
  p_typical: 0.04
  grounded: speculative
  evidence: "none"
  proposed: "Footer after select-all: '9 selected, 3 skipped (over length limit)' with the 3 rows flagged"
  shallow: false
- id: limits-9
  title: "Limits that differ by mode: Report may accept 20 videos while Ask question accepts fewer (follow-ups carry the transcripts); a mode switch with 15 videos selected has no rule"
  level: L3
  cell: {surface: selected-videos-list, mode: switching-mode-after-selecting-videos, videos-selected: exceeds-limit-once-defined, action: switch-mode}
  object: "Report mode and Ask question mode sharing 'the same pop-up'"
  situation: "User selects 15 videos in Report mode (cap 20), then switches to Ask question mode with cap 5"
  consequence: "Selection kept at 15 with an over-limit state in the new mode, trimmed silently to 5, or switch blocked; no copy exists for any of the three"
  p_typical: 0.05
  grounded: inferred
  evidence: "Add video (same pop-up as Report mode)"
  proposed: "Switch keeps selection but selected list shows 'Over Ask question limit (5). Remove 10 to submit'"
  shallow: false
- id: limits-10
  title: "Pop-up limit copy does not say which mode's limit applies: the same pop-up shows the same message text in Report and Ask question although the numbers differ"
  level: L4
  cell: {surface: quota-or-limit-message, mode: ask-question, videos-selected: exceeds-limit-once-defined, action: select-video}
  object: "quota-or-limit-message inside the Add video pop-up"
  situation: "Ask question cap 5, Report cap 20; user in Ask question ticks a 6th video"
  consequence: "Message 'Maximum 20 videos' (Report value) shown in Ask question, or user told 'limit reached' with no number"
  p_typical: 0.04
  grounded: speculative
  evidence: "Add video (same pop-up as Report mode)"
  proposed: "Message built from mode: 'Ask question accepts up to 5 videos. Switch to Report for up to 20.'"
  shallow: false
- id: limits-11
  title: "Preselected from the Videos page: user arrives with 1 three-hour video preselected that is over the per-video length cap; selected list shows it, but the limit message location and copy are unspecified"
  level: L3
  cell: {surface: selected-videos-list, video-state: 3-hour-long, entry-point-and-lifecycle-phase: arriving-from-videos-page-with-preselection, action: select-video}
  object: "Agent page selected videos list after arrival from the Videos page"
  situation: "User clicks an action on a 3-hour video on the Videos page; Agent page opens with it already in the list; cap is 2 h"
  consequence: "No pop-up was opened, so no checkbox state shows the problem; user types a prompt, clicks Submit and meets the limit only then"
  p_typical: 0.04
  grounded: inferred
  evidence: "Videos are selected from already-uploaded, ingested videos via the Add video pop-up"
  proposed: "Preselected row renders inline 'Longer than 2 h limit, remove to continue' and Submit stays disabled"
  shallow: false
- id: limits-12
  title: "Preselection of 25 videos from the Videos page (bulk select there) exceeds the 20-video cap: whether the first 20, none, or all 25 arrive is unspecified, with no copy"
  level: L3
  cell: {surface: selected-videos-list, videos-selected: exceeds-limit-once-defined, entry-point-and-lifecycle-phase: arriving-from-videos-page-with-preselection, action: select-video}
  object: "Selected videos list on arrival from the Videos page"
  situation: "User bulk-selects 25 videos on the Videos page and chooses the agent action"
  consequence: "List shows 25 with an over-limit state nobody described, or silently 20, hiding 5 the user expected in the Report"
  p_typical: 0.06
  grounded: inferred
  evidence: "Videos page: users upload videos; uploaded videos get ingested."
  proposed: "Arrive with all 25 listed, over-limit banner 'Remove 5 videos (limit 20)', Submit disabled"
  shallow: false
- id: limits-13
  title: "A selection valid yesterday under a limit of 50 videos is held in a draft or reopened form after the limit is lowered to 20; the form's revalidation, copy and whether videos are auto-trimmed are unspecified"
  level: L3
  cell: {surface: selected-videos-list, videos-selected: exceeds-limit-once-defined, time-and-connection: after-a-year, action: select-video}
  object: "Selected videos list restored when returning to a draft (return-to-draft)"
  situation: "Draft saved Monday with 40 videos under limit 50; Tuesday the limit becomes 20; user returns to the form"
  consequence: "Submit rejected with an error naming no video, or the form silently drops 20 videos; the user cannot tell which ones to remove"
  p_typical: 0.03
  grounded: speculative
  evidence: "none"
  proposed: "Restored list shows 'Over new limit: 40 of 20' with Submit disabled; no videos removed automatically"
  shallow: false
- id: limits-14
