  level: L3
  cell: {surface: selected-videos-list, video-state: re-ingesting-after-edit, popup-session-state: reopen-with-prior-selection, action: select-video}
  object: "Pop-up reopen-with-prior-selection list"
  situation: "User ticked a 90-minute video; after re-ingest it is 3 hours; user reopens the pop-up with prior selection"
  consequence: "Checkbox stays ticked on a row that would be disabled for a fresh selection; the total shown becomes wrong or stale"
  p_typical: 0.02
  grounded: speculative
