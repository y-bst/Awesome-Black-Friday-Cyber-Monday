- id: a11y-12
  title: Status change from Queued to Running to Done is not announced and may be shown by colour or icon only
  level: L4
  cell:
    surface:
    - history-entry-row
    - history-entry-status-badge
    run-status:
    - running
    - queued
    - done
    actor: background-agent-job
    action: open-history-entry
    mode: report
    observer-location-at-status-change: on-history-tab-top
  object: 'History entry status (statuses unspecified in the spec: ''Statuses an entry can have on the History tab'')'
  situation: User keeps the History tab open while a Report moves Queued, Running, Done over about 90 seconds.
  consequence: Screen-reader user must re-navigate to the row to learn it is done; a colour-blind user sees a green or amber dot with no text; no status message reaches either.
  p_typical: 0.12
  grounded: quote
  evidence: Statuses an entry can have on the History tab, and what opening an entry shows while running, when done, and when failed.
  proposed: 'Status as visible text in the row; changes announced via a polite role=status region that names the entry (''Q4 test: Done'').'
  shallow: false
- id: a11y-14
  title: 'History row interaction model is unspecified: whole-row click target versus a real link, and which element receives focus'
  level: L3
  cell:
    surface: history-entry-row
    action: open-history-entry
    history-state: 100-entries
    actor: creator-owner
  object: History tab entry list
  situation: Rows are clickable in the mouse design; the spec only says 'Lists past and current submissions'.
  consequence: A div with an onClick handler is not focusable, so a keyboard user cannot open any of the 100 entries; if it is a link wrapping the whole row, the accessible name becomes a long string of name, mode, status, time, video count.
  p_typical: 0.1
  grounded: quote
  evidence: Lists past and current submissions from both modes.
  proposed: One link per row, whose text is the entry title; status and time outside the link but inside the list item.
  shallow: false
- id: backend-10
