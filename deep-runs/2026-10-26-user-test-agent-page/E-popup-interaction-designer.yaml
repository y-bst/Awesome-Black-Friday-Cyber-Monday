- id: popup-1
  title: "Add video pop-up has no stated close paths, so confirm, X, Esc and click-outside may each keep or discard the selection differently"
  level: L3
  cell: {surface: "add-video-popup", action: "close-popup-without-confirm", videos-selected: "2-5", mode: "report"}
  object: "Add video pop-up, selection state when closed"
  situation: "User ticks 4 videos in the pop-up, then clicks outside the pop-up, presses Esc or clicks X instead of a confirm control (the spec names no confirm control at all)"
  consequence: "User believes 4 videos are on the Report form; the form shows 0 and the run is submitted with the wrong set, or the reverse: a stray click-outside throws away the selection"
  p_typical: 0.30
  grounded: inferred
  evidence: "clicking \"Add video\" opens a pop-up where the user selects videos from their ingested videos."
  proposed: "Specify one confirm button ('Add 4 videos'); X, Esc and click-outside discard, with a discard prompt when selection differs from what the form holds"
  shallow: false
