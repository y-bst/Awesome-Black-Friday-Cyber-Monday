- id: modality-1
  case: 'The spec says only that ''uploaded videos get ingested'' and never says what ingestion extracts, yet Ask question mode invites any ''question about the selected videos, typed by the user'', and ''where did they click first?'' is the most basic user-test question there is. If the build team picks the cheap path (transcript only), the agent will answer behavioural questions from narration: the participant says ''let me try sign up'' at 00:41 after silently clicking Pricing at 00:38, and the answer comes back ''They clicked Sign up first (00:41)'' with a timestamp citation that makes it look verified. Unlike a vague or empty answer, this is a wrong fact with a citation, and it is the worst kind to detect (detectability 5): the researcher has no reason to scrub the video and pastes it into the readout, where it drives design decisions. This cannot be fixed cheaply later because the ingestion modality determines the index, the cost model and every downstream prompt; changing it after
    launch means re-ingesting every video. The fix needed now is a single spec line naming the modalities ingestion produces (speech, on-screen events, frames) plus an acceptance criterion that, when only speech is indexed, action questions are answered as ''inferred from speech, clicks not observed''. Without that line, engineering decides the product''s truthfulness by default, and nobody on the PM side will find out until a researcher''s finding is contradicted by the video.'
- id: backend-1
  case: 'The owner''s clarification is unambiguous that ''A Report produces one output covering all selected videos, not one per video'', and the spec''s own ''Still unspecified'' list admits there is no minimum or maximum video count and no length or size limit. Twenty moderated sessions of up to three hours is a normal study, not an edge case (p_typical 0.25), and at roughly 60 hours of transcript that is near a million tokens, beyond a single model context. With no cap and no chunk-and-merge strategy, one of two things happens: the job fails after spending the tokens, which with no loading page means the user discovers it only by revisiting History, or, worse, the backend silently truncates and the report covers the first six videos while its header claims all twenty. The silent-truncation path is undetectable by the user (detectability 5) and produces confident conclusions missing most of the study''s evidence. This has to be decided before build because it shapes the Add video pop-up
    (does it show a running total and block Submit?), the Submit validation copy, and the backend architecture (single pass versus per-video summaries merged in a final pass); retrofitting a cap after users have run large reports also breaks their expectations. The PM can write it tomorrow: a per-run transcript budget enforced at Submit with copy naming the overage, and a stated merge strategy for runs above one context.'
- id: firsttime-30
  case: 'User-test sessions are often captured as screen recordings with the microphone off or muted (unmoderated tests, accessibility sessions, recordings where the participant was told to stay silent), and the spec gives no rule for a video that ingests successfully but yields no speech. Because the spec only distinguishes ''ingested'' from not, such a video sits in the Add video pop-up looking identical to any other, and the first-time user who asks ''What did the participant struggle with?'' gets either a generic answer or one invented from the model''s priors, with nothing telling them the evidence was empty. That is a trust-destroying first experience: the user cannot tell the answer is unsupported (detectability 5), and if they do discover it later they will distrust every subsequent answer. The cost to address is low (cost 2): a ''No speech detected'' flag on the pop-up row and in the answer header, and an acceptance criterion that answers on such videos cite timestamps only or decline.
    The evidence here is speculative rather than quoted, but the spec''s own open item, ''whether a video that is still ingesting, or failed ingestion, can be selected'', shows the PM has not yet defined video readiness states, so this is the moment to add ''ingested with no transcript'' as one of them rather than leave it to whatever the pipeline happens to return.'
- id: output-10
  case: This is the Report-mode twin of the silent-video gap, and it is worse in Report mode because a report reads as an authoritative deliverable. The spec defines selectability only by 'ingested', so a video whose transcript has zero words passes every check, can be selected alone, and the agent is asked to write a report from nothing; with an empty prompt (which the spec explicitly allows, 'Prompt / instructions (optional)') the model will fill the template with plausible findings and even invented quotes, or return an empty document with no explanation. Either outcome lands on the History entry with no warning, and the user cannot tell from the report that its source was empty (detectability 5). In a multi-video report the same video silently contributes nothing while the header implies it was covered, which skews findings toward the narrated sessions. The spec already lists 'whether a video that is still ingesting, or failed ingestion, can be selected' as unresolved, so the PM is about
    to define video states anyway; adding 'ingested, no speech' and the rule for it (not selectable, or selectable with the report stating 'no speech found' for that video) is a two-line addition at cost 2 that, if skipped, gets decided implicitly by the prompt engineer.
- id: speaker-2
  case: 'The product is named ''User Test'', so its input is moderated research sessions where a moderator and a participant both speak, yet the spec says nothing about speaker roles and states that ''A Report produces one output covering all selected videos''. A leading moderator question (''So you found checkout confusing, right?'') followed by a participant''s ''yeah, I guess'' is a textbook research bias, and a transcript-based summariser with no speaker attribution will reliably turn it into the key finding ''Participant found checkout confusing''. Across 6 to 20 sessions with an empty prompt, these planted findings get aggregated and ranked alongside genuine unprompted observations, and the reader of the report cannot distinguish them without rewatching each session (detectability 5). The consequence is concrete: the design team prioritises fixing a problem the participant never raised, and the tool''s core promise, saving the researcher from watching the videos, is what makes the
    error go unnoticed. Deciding this before build matters because it requires diarisation and role labelling at ingestion and a report contract that marks findings ''prompted'' with the moderator question quoted; adding speaker roles after launch means re-ingesting the library. The PM can write the acceptance criterion directly from this item.'
