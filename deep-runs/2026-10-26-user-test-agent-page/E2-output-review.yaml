- id: review-1
  title: "Done Report or answer has no thumbs-up/down control, so a wrong output leaves no recorded signal"
  level: L4
  cell: {surface: history-entry-detail, mode: [report, ask-question], run-status: done, output-review-action (off-axis): rate}
  object: "History entry detail of a Done entry; spec lists only Run name, Add video, Prompt, Submit and the History tab"
  situation: "Owner opens a Done Report on 8 videos, finds 3 of 10 findings are wrong, and looks for a way to say so"
  consequence: "No rating exists, so the team has 0 data on the share of Done outputs users consider wrong; the owner's only outlets are a support ticket or silence"
  p_typical: 0.15
  grounded: inferred
  evidence: "Statuses an entry can have on the History tab, and what opening an entry shows while running, when done, and when failed."
  proposed: "Add a thumbs-up/down pair on every Done Report and on every answer bubble, stored with entry id, user id, agent version and timestamp"
  shallow: false
- id: review-2
  title: "Feedback is per entry only: the owner cannot flag one wrong finding inside a 12-finding report"
  level: L3
  cell: {surface: history-entry-detail, mode: report, run-status: done, videos-selected: 6-20, output-review-action (off-axis): flag-claim}
  object: "Report output, \"A Report produces one output covering all selected videos, not one per video\""
  situation: "Report on 15 videos has 12 findings; finding 7 attributes a complaint to the wrong participant, the other 11 are right"
  consequence: "An entry-level thumbs-down marks 11 correct findings as bad and tells triage nothing about which claim failed; eval labelling needs claim-level granularity"
  p_typical: 0.06
  grounded: inferred
  evidence: "A Report produces one output covering all selected videos, not one per video."
  proposed: "Define flag granularity: a flag control per paragraph or per finding (hover menu), storing the character range of the flagged text"
  shallow: false
- id: review-3
  title: "'This quote is not in the video': no action jumps from a quoted line to the transcript to check it, and no outcome when it is absent"
  level: L4
  cell: {surface: history-entry-detail, mode: [report, ask-question], run-status: done, video-state: ingested, output-review-action (off-axis): flag-claim}
  object: "Quoted participant text inside a Done output; ingested transcript of the cited video (spec has no citation or transcript view)"
  situation: "Report quotes \"I would never pay for this\" for video 4; the owner scrubs the 45-minute video and cannot find it"
  consequence: "Owner spends 10-45 minutes per suspicious quote, and a fabricated quote that reaches a stakeholder deck damages trust in every later report"
  p_typical: 0.05
  grounded: inferred
  evidence: "Videos are selected from already-uploaded, ingested videos via the Add video pop-up"
  proposed: "Each quote gets a 'Show in transcript' link; if the string is not found (fuzzy match below 0.9), the quote shows 'Not found in transcript' and a one-click 'Quote not in video' flag"
  shallow: false
- id: review-4
  title: "No post-generation check that each quoted string exists in the cited transcript before the entry turns Done"
  level: L4
  cell: {surface: history-entry-detail, mode: report, run-status: done, per-video-outcome-within-run: all-videos-used, output-review-action (off-axis): flag-claim}
  object: "Transition of a History entry to Done (statuses unspecified in \"Still unspecified\")"
  situation: "Agent output contains 14 quotes; 2 are paraphrases presented in quotation marks and 1 does not occur in any selected transcript"
  consequence: "Entry shows Done with 3 unverifiable quotes that look identical to 11 verbatim ones; the owner discovers this only by manual checking, if at all"
  p_typical: 0.05
  grounded: inferred
  evidence: "Statuses an entry can have on the History tab ... when done"
  proposed: "Acceptance criterion: before Done, every quoted span is matched against its cited video's transcript; unmatched spans render with an 'unverified' marker and are counted in entry metadata"
  shallow: false
- id: review-5
  title: "Destination of a flag is unspecified: support queue, eval set, product analytics, or nowhere"
  level: L3
  cell: {surface: history-entry-detail, mode: [report, ask-question], run-status: done, actor: creator-owner, output-review-action (off-axis): flag-claim}
  object: "A flag or thumbs-down on a History entry (not in spec)"
  situation: "Owner flags a report as 'wrong participant attribution' on a Friday"
  consequence: "If flags only land in an analytics table, nobody reads them; if they open support tickets, support gets 50+ tickets per launch week with no runbook; if they feed the eval set, the owner's video content is copied into it"
  p_typical: 0.04
  grounded: speculative
  evidence: "none"
  proposed: "Spec line: thumbs-down goes to analytics only; a claim flag opens a triage item in queue X, owner Y, reviewed within 5 business days, and is added to the eval candidate pool only with consent"
  shallow: false
- id: review-6
  title: "Flagging sends participant quotes and video excerpts to reviewers or into training with no disclosure to the owner"
  level: L3
  cell: {surface: history-entry-detail, mode: report, run-status: done, text-input-state: text-contains-participant-personal-data, output-review-action (off-axis): flag-claim}
  object: "Flag action on a Done Report whose body quotes a named test participant"
  situation: "Owner flags a report; the flag payload includes the full output, the prompt and links to the 6 source videos"
  consequence: "Support staff or an eval vendor view a test participant's face and words without the participant's consent covering that use; owner never saw a notice"
  p_typical: 0.03
  grounded: inferred
  evidence: "History is per user, currently."
  proposed: "Flag dialog states what is shared (output text only / output + video excerpts) and whether it may be used for model evaluation or training; default is output text only"
  shallow: false
- id: review-7
  title: "Flagged entry keeps a plain Done badge on the History row; no Flagged or Disputed state exists"
  level: L4
  cell: {surface: history-entry-status-badge, mode: [report, ask-question], run-status: done, history-state: 100-entries, output-review-action (off-axis): flag-claim}
  object: "History entry status badge; spec: \"Lists past and current submissions from both modes\""
  situation: "Owner flags 3 of 100 Done entries as containing a fabricated quote, then returns 2 weeks later to reuse a report"
  consequence: "The flagged entries look identical to trusted ones, so the owner re-shares a report already known to be wrong"
  p_typical: 0.04
  grounded: inferred
  evidence: "Lists past and current submissions from both modes."
  proposed: "Decide whether flag is a status (Done -> Flagged) or a secondary marker next to Done; either way it is visible on the History row and filterable"
  shallow: false
- id: review-8
  title: "No edit-in-place of report text before Copy or export, so the owner fixes errors in a second tool every time"
  level: L3
  cell: {surface: export-or-copy-output, mode: report, run-status: done, action: copy-output, output-review-action (off-axis): edit-before-share}
  object: "Done Report in history entry detail (no edit, copy or export control in spec)"
  situation: "Owner removes 2 wrong findings and rewords 1 before sending the report to a PM"
  consequence: "The corrected version lives only in a Google Doc; the History entry still holds the wrong text, and the next copy from History reintroduces the error"
  p_typical: 0.05
  grounded: inferred
  evidence: "On submit the user is redirected to the History tab, where a new entry appears with whatever was submitted."
  proposed: "Specify either 'output is read-only' (explicit) or an Edit mode that saves an edited version alongside the agent original"
  shallow: false
- id: review-9
  title: "If edit exists: edited text carries no 'edited by user' marker, and export mixes human and agent text indistinguishably"
  level: L4
  cell: {surface: export-or-copy-output, mode: report, run-status: done, actor: report-recipient-without-access, output-review-action (off-axis): edit-before-share}
  object: "Exported or copied Report text after owner edits"
  situation: "Owner adds a recommendation of their own into an agent report and exports it to a client"
  consequence: "Recipient attributes the human claim to 'the AI analysis of 12 sessions', or blames the agent for an owner-introduced error"
  p_typical: 0.03
  grounded: speculative
  evidence: "none"
  proposed: "Entry detail shows 'Edited by <name> on <date>' with a toggle to view the agent original; export footer states 'Contains user edits'"
  shallow: false
- id: review-10
  title: "Follow-up after an edited report: agent context is the original or the edited text, unspecified"
  level: L3
  cell: {surface: follow-up-thread, mode: ask-question, run-status: done, thread-state: wanting-to-ask-about-a-report-entry, output-review-action (off-axis): edit-before-share}
  object: "\"Follow-up questions are supported after the first answer\"; edited output"
  situation: "Owner deletes a wrong finding from answer 1, then asks follow-up 2 'expand on the second finding'"
  consequence: "Agent numbers findings from its unedited answer and expands the deleted, wrong finding, which the owner had already removed"
  p_typical: 0.02
  grounded: inferred
  evidence: "Follow-up questions are supported after the first answer."
  proposed: "Rule: follow-ups use the agent original as context unless the user edited, in which case the edited text is sent and a note says so"
  shallow: false
- id: review-11
  title: "Regenerate on a Done entry: new History entry or new version inside the same entry, and which one the row shows, is undefined"
  level: L4
  cell: {surface: history-entry-detail, mode: report, run-status: superseded-by-re-run, history-state: 100-entries, output-review-action (off-axis): regenerate}
  object: "History entry for a Done Report; spec: \"a new entry appears with whatever was submitted\" (only on submit)"
  situation: "Owner dislikes a Done report and regenerates with identical videos and prompt"
  consequence: "Either History gains a near-duplicate row with the same run name (count goes 100 -> 101) or the original disappears; the owner cannot keep the better of the two"
  p_typical: 0.12
  grounded: inferred
  evidence: "On submit the user is redirected to the History tab, where a new entry appears with whatever was submitted."
  proposed: "Regenerate adds version v2 inside the same entry with a v1/v2 switcher; the row shows the latest version and a 'v2' tag; v1 is kept unless deleted"
  shallow: false
- id: review-12
  title: "Regenerate takes no correction note, so the same wrong quote or wrong count comes back"
  level: L3
  cell: {surface: history-entry-detail, mode: report, run-status: done, text-input-state: prompt-empty, output-review-action (off-axis): regenerate}
  object: "Prompt / instructions (optional) field; regenerate action (not in spec)"
  situation: "Owner flags 'video 3 is a moderator dry run, exclude it' and presses Regenerate"
  consequence: "Regeneration reruns the same inputs, includes video 3 again, and bills a second full run on 20 videos"
  p_typical: 0.04
  grounded: inferred
  evidence: "Prompt / instructions (optional)"
  proposed: "Regenerate opens a dialog prefilled with the original prompt and video list, plus a 'What was wrong?' field appended to the prompt; flagged claims are passed as negative examples"
  shallow: false
- id: review-13
  title: "No side-by-side diff between the original and regenerated report"
  level: L4
  cell: {surface: history-entry-detail, mode: report, run-status: done, videos-selected: 6-20, output-review-action (off-axis): compare-with-previous-version}
  object: "Two versions of a Report on the same 12 videos"
  situation: "Owner regenerates; v1 had 9 findings, v2 has 11 with 6 overlapping and different wording"
  consequence: "Owner reads both 1500-word reports manually to find what changed and which findings are stable across runs"
  p_typical: 0.03
  grounded: speculative
  evidence: "none"
  proposed: "Compare view: findings present in both versions, only in v1, only in v2, with each finding's citations"
  shallow: false
- id: review-14
  title: "Regenerating answer 1 of an Ask question thread with follow-ups 2-5 already answered: follow-ups kept, invalidated or branched is unspecified"
  level: L3
  cell: {surface: follow-up-thread, mode: ask-question, run-status: done, thread-state: follow-up-10, output-review-action (off-axis): regenerate}
  object: "Ask question thread; \"Follow-up questions are supported after the first answer\""
  situation: "Thread has 5 answers; owner regenerates answer 1 because its quote is fabricated"
  consequence: "Follow-ups 2-5 still reference the fabricated quote; if kept, the thread is inconsistent; if discarded, 4 answers of work disappear without warning"
  p_typical: 0.02
  grounded: inferred
  evidence: "Follow-up questions are supported after the first answer."
  proposed: "Regenerate is offered only on the last answer, or regenerating an earlier answer creates a branch and marks later answers 'based on previous version'"
  shallow: false
- id: review-15
  title: "Rating applies to which unit in a thread: each answer bubble or the whole Ask question entry"
  level: L3
  cell: {surface: follow-up-thread, mode: ask-question, run-status: done, thread-state: follow-up-10, output-review-action (off-axis): rate}
  object: "Ask question thread with 10 follow-ups"
  situation: "Answers 1-9 are fine, follow-up 10 cites a video not in the selection; owner gives a thumbs-down"
  consequence: "An entry-level rating attributes the failure to the whole thread and to the first question, skewing quality metrics by question type"
  p_typical: 0.03
  grounded: inferred
  evidence: "Follow-up questions are supported after the first answer."
  proposed: "Ratings are per answer bubble, keyed to thread position and follow-up count"
  shallow: false
- id: review-16
  title: "Flag reason taxonomy undefined, so free-text flags cannot be counted by failure type"
  level: L4
  cell: {surface: history-entry-detail, mode: [report, ask-question], run-status: done, actor: creator-owner, output-review-action (off-axis): flag-claim}
  object: "Flag dialog (not in spec)"
  situation: "200 flags arrive in launch month, all as free text in 3 languages"
  consequence: "Nobody can answer 'what share of flags are fabricated quotes vs wrong timestamps vs wrong participant'; fixes are prioritised by anecdote"
  p_typical: 0.03
  grounded: speculative
  evidence: "none"
  proposed: "Fixed reasons: quote not in video, wrong timestamp, wrong participant, wrong count, video not in selection, missed a video, harmful or personal data, other (free text)"
  shallow: false
- id: review-17
  title: "Flag outcome never reaches the owner: no notification when a flag is reviewed or the agent is fixed"
  level: L3
  cell: {surface: notification-email-or-in-app, mode: report, run-status: done, time-and-connection: agent-model-version-changed-since-entry, output-review-action (off-axis): flag-claim}
  object: "Flag on a History entry; notification surface (not in spec)"
  situation: "Owner flags a fabricated quote; 3 weeks later the agent version changes and fixes the cause"
  consequence: "Owner keeps distrusting the feature and hand-checks every quote, or stops using it; flagged entries stay flagged forever"
  p_typical: 0.02
  grounded: speculative
  evidence: "none"
  proposed: "Flag shows state (Sent / Reviewed / Fixed in version N); a resolved flag offers 'Regenerate with the current version'"
  shallow: false
- id: review-18
  title: "Deleting a flagged entry or erasing a participant: whether the copy held in the flag queue or eval set is also removed"
  level: L3
  cell: {surface: history-entry-detail, mode: report, run-status: deleted-entry, actor: test-participant-data-subject, output-review-action (off-axis): flag-claim}
  object: "Flag payload stored outside History; entry deletion (\"delete-entry\" not in spec)"
  situation: "Owner flags a report quoting participant P, later deletes the entry after P withdraws consent"
  consequence: "Quote survives in the eval set or support ticket; erasure request is only partly fulfilled"
  p_typical: 0.02
  grounded: speculative
  evidence: "History is per user, currently."
  proposed: "Flag records reference the entry id and are deleted or redacted when the entry or source video is deleted"
  shallow: false
- id: review-19
  title: "No pre-launch eval set of user-test videos with expected answers for Report and Ask question"
  level: L3
  cell: {surface: history-entry-detail, mode: [report, ask-question], run-status: done, video-state: ingested, output-review-action (off-axis): compare-with-previous-version}
  object: "Report mode and Ask question mode as a whole; spec has no quality section"
  situation: "Feature ships; the first quality signal is a customer saying a quote was invented"
  consequence: "No baseline to compare agent versions against, so a model or prompt change that doubles fabricated quotes is undetectable before release"
  p_typical: 0.06
  grounded: inferred
  evidence: "Still unspecified (left for the engine to surface)"
  proposed: "Build an eval set of at least 30 sessions (mix of 1, 5 and 20 videos; silent, non-English, 3-hour) with human-written reference findings and 50 reference questions, rerun on every agent version change"
  shallow: false
- id: review-20
  title: "No acceptance threshold for output quality gates launch or agent version changes"
  level: L4
  cell: {surface: history-entry-detail, mode: [report, ask-question], run-status: done, time-and-connection: agent-model-version-changed-since-entry, output-review-action (off-axis): compare-with-previous-version}
  object: "Release criteria for the agent page (absent from spec)"
  situation: "Agent version N+1 is ready; nobody has defined what score it must reach"
  consequence: "Ship decision is made on demo impressions; a version with 4% fabricated quotes ships because no threshold said 1%"
  p_typical: 0.04
  grounded: inferred
  evidence: "none"
  proposed: "Thresholds, e.g. 100% of quotes match a selected transcript at fuzzy 0.9, 0 citations to non-selected videos, >=95% timestamps within 10 s of the quoted line, >=80% reference findings recalled"
  shallow: false
- id: review-21
  title: "No post-launch thumbs-down rate threshold that triggers investigation or rollback"
  level: L4
  cell: {surface: history-entry-detail, mode: [report, ask-question], run-status: done, time-and-connection: steady-state, output-review-action (off-axis): rate}
  object: "Ratings on Done entries (proposed, not in spec)"
  situation: "Weekly thumbs-down rate rises from 8% to 22% after an agent version change"
  consequence: "Without a defined alert line and owner, the rise is seen at a quarterly review, after weeks of wrong reports"
  p_typical: 0.03
  grounded: speculative
  evidence: "none"
  proposed: "Dashboard tracks thumbs-down and claim-flag rate per agent version and mode; above 15% weekly (or +5 points week on week) pages the feature owner"
  shallow: false
- id: review-22
  title: "Rating given by support staff while impersonating the owner counts as the owner's feedback"
  level: L3
  cell: {surface: history-entry-detail, mode: report, run-status: done, actor: support-staff-impersonating, output-review-action (off-axis): rate}
  object: "Rating stored with user id on a History entry (History is per user)"
  situation: "Support impersonates the owner to reproduce a bug and thumbs-down 6 entries while testing"
  consequence: "Quality metrics and eval candidate pools include staff-generated labels attributed to a customer"
  p_typical: 0.01
  grounded: speculative
  evidence: "History is per user, currently."
  proposed: "Ratings and flags made under impersonation are stored with the staff actor id and excluded from customer metrics"
  shallow: false
- id: review-23
  title: "Regenerate after the source video was re-ingested: v2 differs because the transcript changed, not the agent, and nothing says so"
  level: L3
  cell: {surface: history-entry-detail, mode: report, run-status: done-then-source-video-changed-stale, video-state: re-ingesting-after-edit, output-review-action (off-axis): compare-with-previous-version}
  object: "Two versions of a Report; ingested video state"
  situation: "Video 2 was re-ingested with a corrected transcript between v1 and v2"
  consequence: "Owner compares v1 and v2, attributes the fixed quote to the regenerate, and trusts regenerate as a cure for fabrication"
  p_typical: 0.02
  grounded: inferred
  evidence: "users upload videos; uploaded videos get ingested."
  proposed: "Each version records transcript version per video and agent version; the compare view lists which inputs changed between versions"
  shallow: false
