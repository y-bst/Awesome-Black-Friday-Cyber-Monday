- id: a11y-16
  title: Suggested questions have no stated element type, and picking one has no stated effect on the Question field or focus
  level: L4
  cell:
    surface: suggested-questions
    text-input-state: question-picked-from-suggested
    action: pick-suggested-question
    mode: ask-question
  object: '''Suggested questions are shown and can be picked'''
  situation: User activates a suggested question. The spec does not say whether it fills the Question field, submits immediately, or both.
  consequence: If rendered as links (navigation semantics) the screen reader says 'link' for something that behaves like a button; if it submits at once, a keyboard user pressing Enter on it triggers a
    redirect they did not expect; if it fills the field, nothing announces that the field now has text.
  p_typical: 0.08
  grounded: quote
  evidence: Suggested questions are shown and can be picked
  proposed: Render as buttons inside a labelled group 'Suggested questions'; picking fills the Question field, moves focus to it, and does not submit.
  shallow: false
  _from_file: E-accessibility-reviewer.yaml
