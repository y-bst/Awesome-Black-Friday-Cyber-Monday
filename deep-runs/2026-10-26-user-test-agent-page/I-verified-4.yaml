    surface: follow-up-thread
    thread-state: follow-up-while-first-still-running
    action: ask-follow-up
    run-status: running
    mode: ask-question
  object: Follow-up input in the thread
  situation: The first question is still Running; the follow-up field is disabled with a native disabled attribute.
  consequence: Disabled fields drop out of the Tab order, so a keyboard user never finds the field or the reason it is unavailable; a sighted user sees grey and guesses. The spec says nothing on whether
