- id: mobile-1
  title: Add video pop-up grid has no touch multi-select spec (tap toggles vs long-press, selected indicator, tap-target size) at 360px
  level: L3
  cell: {surface: add-video-popup, action: select-video, videos-selected: 6-20, library-state: 50-videos}
  object: Add video pop-up, "the user selects videos from their ingested videos"
  situation: On a 360px-wide phone the grid shows about 2 columns; the user taps 8 videos in a row with a thumb, with no hover state to preview selection
  consequence: Mis-taps select the wrong video or toggle one off; without a visible checkmark and running count the user cannot tell which 8 are selected
  p_typical: 0.12
  grounded: inferred
  evidence: "selects videos from their ingested videos"
  proposed: Spec tap-to-toggle, a checkmark overlay, minimum 44px tap target and a "8 selected" counter pinned in the pop-up
  shallow: false
- id: mobile-2
  title: Pop-up has no confirm/close rule on mobile, so a backdrop tap or system back gesture may discard the selection
  level: L3
  cell: {surface: add-video-popup, action: close-popup-without-confirm, videos-selected: 2-5, mode: report}
  object: Add video pop-up (no Done/Confirm control is named in the spec)
  situation: User has selected 4 videos, then swipes back (Android) or taps outside the pop-up while reaching for the search box
  consequence: Selection of 4 videos is lost or silently kept; user cannot tell which, and must reselect on a slow connection
  p_typical: 0.08
  grounded: inferred
  evidence: "clicking \"Add video\" opens a pop-up where the user selects videos"
  proposed: Spec an explicit Done button showing the count, and say whether dismiss keeps or discards the in-progress selection
  shallow: false
- id: mobile-3
  title: Tag filter chips with 200 tags wrap into many rows and push the video grid off the first screen at 360px
  level: L3
  cell: {surface: tag-filter, library-state: 200-tags, action: filter-by-tag, videos-selected: 1}
  object: Pop-up tag filter, "filtering by the tags the user has applied to videos"
  situation: 200 tags rendered as wrapping chips at 360px, roughly 3 chips per row, about 65 rows
  consequence: The video grid is pushed below several screens of chips; user scrolls past chips to see any video and may think the pop-up is empty
  p_typical: 0.07
  grounded: inferred
  evidence: "filtering by the tags the user has applied to videos"
  proposed: Cap visible chips to one row with horizontal scroll or a "Tags" bottom sheet with its own search
  shallow: false
- id: mobile-4
  title: Search box keyboard covers the results list in the pop-up (keyboard takes about 45% of a 640px-tall viewport)
  level: L3
  cell: {surface: search-box, action: search, library-state: 2000-videos, videos-selected: 2-5}
  object: Pop-up search box, "searching by name"
  situation: User taps the search box, the on-screen keyboard opens, 1 to 2 result rows remain visible above it
  consequence: User cannot see or tap results without dismissing the keyboard; if the pop-up is sized to 100vh it may also hide the search box itself
  p_typical: 0.09
  grounded: inferred
  evidence: "searching by name"
  proposed: Spec that results area scrolls above the keyboard, the search field stays sticky at top, and Search/Enter key dismisses the keyboard
  shallow: false
- id: mobile-5
  title: Done/Submit control inside the pop-up is not specified to stay visible above the keyboard after typing in search
  level: L3
  cell: {surface: add-video-popup, action: search, videos-selected: 6-20, library-state: 50-videos, mode: ask-question}
  object: Add video pop-up footer (not specified)
  situation: User types "launch" in search, selects 3 results with the keyboard still open
  consequence: The only way to close the pop-up is blind back-gesture, which may discard the 3 selections (see mobile-2)
  p_typical: 0.05
  grounded: speculative
  evidence: none
  proposed: Spec a sticky footer with "Add 3 videos" that rides above the keyboard
  shallow: false
- id: mobile-6
  title: Prompt/instructions field accepts 5000 characters but the spec gives no height, scroll, or counter behaviour on a phone
  level: L3
  cell: {surface: prompt-field, text-input-state: prompt-5000-chars, action: type-prompt, mode: report}
  object: "Prompt / instructions (optional)" field
  situation: User pastes 5000 characters (about 70 screen lines at 360px) into the field
  consequence: Field either grows to push Submit 70 lines down or becomes a tiny inner scroll box; user loses their place and cannot review what was pasted
  p_typical: 0.10
  grounded: inferred
  evidence: "Prompt / instructions (optional)"
  proposed: Spec a max length (a number), a counter from 80% of it, an auto-grow cap of about 6 lines, then inner scroll
  shallow: false
- id: mobile-7
  title: Submit button position when the prompt field is long and the keyboard is open is unspecified (fixed footer vs end of form)
  level: L3
  cell: {surface: submit-button, text-input-state: prompt-5000-chars, action: submit, mode: report, videos-selected: 2-5}
  object: Report form "Submit"
  situation: After editing a long prompt the keyboard is up; Submit sits at the bottom of a form roughly 4 screens tall at 360px
  consequence: User hunts for Submit, may tap a video chip or Run name by mistake, or think the form has no way to finish
  p_typical: 0.06
  grounded: inferred
  evidence: "- Submit"
  proposed: Spec a sticky bottom Submit bar that shows disabled/enabled state and sits above the keyboard
  shallow: false
- id: mobile-8
  title: On a slow connection the redirect lands on History before the entry exists, showing an empty or old list with no sign the submit worked
  level: L4
  cell: {surface: redirect-transition, time-and-connection: redirect-lands-before-entry-exists, run-status: submitted-not-yet-visible-in-history, action: submit, videos-selected: 2-5}
  object: "On submit the user is redirected to the History tab, where a new entry appears"
  situation: Mobile on 3G, submit returns after 4 s, History list fetch returns in 1 s with the old list
  consequence: User sees the previous entries only, assumes submit failed, goes back and submits again, creating duplicates; assert instead that a "Submitting..." placeholder row appears within 100 ms of redirect
  p_typical: 0.20
  grounded: quote
  evidence: "There is no loading page, to save the user's time. On submit the user is redirected to the History tab, where a new entry appears with whatever was submitted."
  proposed: Insert an optimistic row with status text immediately, and reconcile when the server entry arrives
  shallow: false
- id: mobile-9
  title: Without a loading page there is no pressed or in-flight state on Submit, so impatient taps on a slow link double-submit
  level: L3
  cell: {surface: submit-button, action: double-submit, run-status: submitted-not-yet-visible-in-history, time-and-connection: steady-state}
  object: Submit button and "There is no loading page"
  situation: Mobile connection takes 6 s to respond; the user taps Submit 3 times in 4 s
  consequence: Up to 3 identical entries (or 3 reports processed) appear in History; no duplicate guard is specified
  p_typical: 0.15
  grounded: inferred
  evidence: "There is no loading page, to save the user's time."
  proposed: Spec Submit disabling on first tap with a spinner, plus a server-side idempotency key
  shallow: false
- id: mobile-10
  title: App or browser backgrounded during submit (user switches to a message for 30 s) with no rule for whether the submission reached the server
  level: L3
  cell: {surface: redirect-transition, time-and-connection: offline-at-submit, action: submit, actor: creator-owner}
  object: Submit then redirect to History
  situation: User taps Submit, the OS suspends the mobile browser tab within 2 s before the response arrives, and tab is resumed 30 s later
  consequence: The request may be dropped, completed, or retried; user returns to the form with prompt filled, unsure if a run exists, and History may show 0 or 1 entries
  p_typical: 0.04
  grounded: speculative
  evidence: none
  proposed: Spec that on resume the page checks History for a matching entry within 60 s before allowing resubmit, and shows "Sent" or "Not sent"
  shallow: false
- id: mobile-11
  title: Submit succeeds but the redirect fails on a flaky phone connection, leaving the form in place with a created entry hidden in History
  level: L3
  cell: {surface: redirect-transition, time-and-connection: submit-succeeds-redirect-fails, action: refresh-after-redirect, run-status: queued}
  object: "redirected to the History tab"
  situation: Server accepts the submission (entry Queued), the navigation request to History times out at 30 s; the user pulls to refresh the form page
  consequence: Form reloads (maybe cleared), user resubmits, producing a second entry; or form keeps stale state and user is unsure
  p_typical: 0.06
  grounded: inferred
  evidence: "On submit the user is redirected to the History tab"
  proposed: Spec a banner "Your run was submitted, open History" when the response succeeded but navigation did not
  shallow: false
- id: mobile-12
  title: History row for an entry with a blank run name has no spec for what text identifies it at narrow width
  level: L3
  cell: {surface: history-entry-row, history-state: entries-with-blank-run-name, text-input-state: run-name-empty, mode: report}
  object: "Run name (optional)" and history entry row
  situation: Report submitted with no run name; the row at 360px has room for about 28 characters of title
  consequence: Row shows a blank title or "Untitled" repeated for several rows; user cannot find their report; status and video count may also be pushed off-screen
  p_typical: 0.18
  grounded: quote
  evidence: "Run name (optional)"
  proposed: Spec fallback title, for example "Report, 3 videos, 26 Oct 14:02"
  shallow: false
- id: mobile-13
  title: History row at 360px has no layout rule for status badge and video count, so one truncates or wraps
  level: L3
  cell: {surface: history-entry-row, run-status: queued, videos-selected: 2-5, history-state: 100-entries}
  object: History tab entries, "Lists past and current submissions from both modes"
  situation: Row has to show title, mode, status ("Queued"/"Running"/"Done"/"Failed" per assumption), video count, and time within about 328px of width
  consequence: Status text clipped to "Que..." or wrapped to a second line, making a 100-entry list uneven and hard to scan; which field drops first is unspecified
  p_typical: 0.10
  grounded: inferred
  evidence: "Lists past and current submissions from both modes."
  proposed: Spec a two-line mobile row with title line, then a line with status chip, count, and relative time; title truncates first
  shallow: false
- id: mobile-14
  title: Ask question entries have no title field, so the row at narrow width must show the question text with no truncation rule
  level: L3
  cell: {surface: history-entry-row, history-state: report-and-question-entries-interleaved, mode: ask-question, text-input-state: question-picked-from-suggested}
  object: History entry for Ask question (no Run name exists in Ask question mode)
  situation: A 160-character question appears next to Report rows that use a short run name
  consequence: Row heights vary between 1 line and 4 lines, status chip position jumps, and a Report row is hard to tell from a question row without an icon or label
  p_typical: 0.06
  grounded: inferred
  evidence: "Ask question mode: Add video, A question about the selected videos, Suggested questions, Submit (no run name)"
  proposed: Spec a mode icon, a 2-line clamp on question text, and the full text shown only in the detail view
  shallow: false
- id: mobile-15
  title: Three-way navigation (Report, Ask question, History) has no spec for how the mode tabs fit at 360px
  level: L3
  cell: {surface: agent-page-mode-switch, mode: switching-mode-after-selecting-videos, action: switch-mode, time-and-connection: steady-state}
  object: "Agent page: two modes, Report and Ask question, plus a History tab"
  situation: Report, Ask question, and History labels share one tab bar at 360px (about 110px each)
  consequence: "Ask question" wraps or truncates, and it is unclear whether History is a peer tab of the modes or a separate navigation; the redirect then switches a tab the user did not tap
  p_typical: 0.08
  grounded: quote
  evidence: "two modes, **Report** and **Ask question**, plus a **History** tab"
  proposed: Spec a segmented control for the two modes and a separate History entry, with short labels at under 400px
  shallow: false
- id: mobile-16
  title: Accidental tap on the mode tab with 5 videos and a 5000-character prompt entered may wipe or silently keep the form
  level: L3
  cell: {surface: report-form, mode: switching-mode-after-selecting-videos, text-input-state: prompt-5000-chars, action: switch-mode, videos-selected: 2-5}
  object: Mode switch between Report and Ask question
  situation: User scrolls with a thumb near the top tab bar and taps "Ask question" by mistake after typing a 5000-character prompt
  consequence: Prompt is lost or hidden, selected videos may carry across, and no undo or confirm is specified; retyping 5000 characters on a phone is costly
  p_typical: 0.07
  grounded: inferred
  evidence: "Same pop-up as Report mode"
  proposed: Spec that each mode keeps its own draft in memory for the session, and videos carry across
  shallow: false
- id: mobile-17
  title: Follow-up box has no spec for being pinned above the keyboard in the thread on phone
  level: L3
  cell: {surface: follow-up-thread, action: ask-follow-up, thread-state: follow-up-10, run-status: done}
  object: "Follow-up questions are supported after the first answer."
  situation: Thread has 10 follow-ups (about 20 messages); user taps the follow-up box at the end of a thread on a 360px phone
  consequence: Keyboard covers the latest answer, the box scrolls away while typing, and the user cannot read the answer they are following up on
  p_typical: 0.10
  grounded: quote
  evidence: "Follow-up questions are supported after the first answer."
  proposed: Spec a bottom-pinned composer with an auto-scrolling thread that keeps the last answer visible
  shallow: false
- id: mobile-18
  title: Follow-up sent while the first answer is still running, on a slow link, has no spec for disabled composer or queueing
  level: L3
  cell: {surface: follow-up-thread, thread-state: follow-up-while-first-still-running, run-status: running, action: ask-follow-up, time-and-connection: steady-state}
  object: Follow-up box under a Running entry
  situation: User opens a Running entry from History, sees a follow-up box, types and sends after 20 s
  consequence: Follow-up is rejected, queued, or answered out of order; with no loading page the user sees no sign either way
  p_typical: 0.12
  grounded: inferred
  evidence: "Follow-up questions are supported after the first answer."
  proposed: Spec that the follow-up box is disabled with the text "Available when the first answer is ready" until status is Done
  shallow: false
- id: mobile-19
  title: Selected videos list with 21-100 items on a phone pushes Submit far below, with no collapse or count-only view
  level: L3
  cell: {surface: selected-videos-list, videos-selected: 21-100, action: deselect-video, mode: report}
  object: List of videos the user added via "Add video"
  situation: 60 videos selected, each row about 56px tall at 360px, list height about 3360px
  consequence: User scrolls about 5 screens to reach Prompt and Submit; removing one video requires finding its row and a remove control with a small tap target
  p_typical: 0.07
  grounded: inferred
  evidence: "Add video: clicking \"Add video\" opens a pop-up where the user selects videos"
  proposed: Spec a collapsed "60 videos" summary with expand, and a max number of rows shown (for example 5)
  shallow: false
- id: mobile-20
  title: Pop-up with more videos than fit at once has no spec for paging, infinite scroll or load-more on a slow link
  level: L3
  cell: {surface: add-video-popup, videos-selected: more-than-popup-shows-at-once, library-state: 2000-videos, time-and-connection: steady-state}
  object: Add video pop-up grid
  situation: Library has 2000 ingested videos; the grid loads 24 at a time over 3G taking about 3 s per page
  consequence: Users scroll to a blank gap with no spinner, tap-selects get lost during re-render, and select state across pages is unspecified
  p_typical: 0.08
  grounded: inferred
  evidence: "selects videos from their ingested videos"
  proposed: Spec page size, an inline loading row, and that selection persists across pages
  shallow: false
- id: mobile-21
  title: Video thumbnails in the pop-up have no placeholder or lazy-load rule, so a 24-tile grid downloads all images on a slow connection
  level: L3
  cell: {surface: add-video-popup, library-state: 50-videos, time-and-connection: first-ever-use, action: open-add-video-popup}
  object: Add video pop-up grid thumbnails
  situation: First open of the pop-up on a 3G phone with 50 videos at about 80 KB per thumbnail, about 4 MB in total
  consequence: Pop-up opens as a blank or jumping grid for 10+ s; tapping tiles before images load selects the wrong item as layout shifts
  p_typical: 0.05
  grounded: speculative
  evidence: none
  proposed: Spec fixed-size tiles with a name label shown first, lazy thumbnails below the fold, and a max thumbnail size of about 20 KB
  shallow: false
- id: mobile-22
  title: Suggested questions layout on touch (chips wrapping vs horizontal scroll) and whether tapping fills or submits is unspecified
  level: L3
  cell: {surface: suggested-questions, text-input-state: question-picked-from-suggested, action: pick-suggested-question, mode: ask-question}
  object: "Suggested questions are shown and can be picked"
  situation: 6 suggested questions of about 60 characters each shown on a 360px screen; user taps one
  consequence: Chips take about 6 rows and push Submit down; a tap may fill the question field (so the keyboard opens) or submit instantly, and an accidental tap cannot be undone
  p_typical: 0.15
  grounded: quote
  evidence: "Suggested questions are shown and can be picked"
  proposed: Spec that tap fills the question field without submitting and does not open the keyboard
  shallow: false
- id: mobile-23
  title: Run name of 200 characters has no truncation rule in the History row and detail header at 360px
  level: L3
  cell: {surface: history-entry-row, text-input-state: run-name-200-chars, mode: report, history-state: 1-entry}
  object: "Run name (optional)" shown in the History entry
  situation: User pastes a 200-character name with no spaces (a long URL) into Run name
  consequence: Unbroken string overflows the row and causes horizontal page scroll at 360px, hiding the status chip
  p_typical: 0.05
  grounded: inferred
  evidence: "Run name (optional)"
  proposed: Spec a max length (for example 80 characters) on the field and word-break plus 2-line clamp in the row
  shallow: false
- id: mobile-24
  title: Done report output with wide tables or long markdown has no mobile rendering rule when opened from History
  level: L3
  cell: {surface: history-entry-detail, run-status: done, action: open-history-entry, mode: report, text-input-state: text-contains-html-or-markdown}
  object: "what opening an entry shows" (listed as unspecified)
  situation: A report covering 6 videos contains a 5-column comparison table and 3 levels of headings, opened at 360px
  consequence: Table forces horizontal scroll inside or outside the page, or the markdown shows as raw symbols; reading takes much longer on a phone
  p_typical: 0.08
  grounded: quote
  evidence: "what opening an entry shows while running, when done, and when failed"
  proposed: Spec a single-column reading view where tables scroll inside their own container
  shallow: false
- id: mobile-25
  title: Back gesture after redirect returns to the filled form on mobile, enabling an accidental resubmit
  level: L3
  cell: {surface: redirect-transition, action: back-button-after-redirect, run-status: queued, mode: report, videos-selected: 2-5}
  object: Redirect to History tab after Submit
  situation: After landing on History, the user does an edge-swipe back on a 360px phone
  consequence: Form reappears with prompt and 3 videos still filled (or empty), a second Submit creates a duplicate run
  p_typical: 0.12
  grounded: inferred
  evidence: "On submit the user is redirected to the History tab"
  proposed: Spec that the redirect replaces the form history entry and the form is cleared after a successful submit
  shallow: false
- id: mobile-26
  title: Phone left in the background for hours then Submit hits an expired session, with the typed 5000-character prompt lost
  level: L3
  cell: {surface: submit-button, time-and-connection: session-expired-at-submit, text-input-state: prompt-5000-chars, action: submit, actor: creator-owner}
  object: Submit with a long prompt after the page stays open
  situation: User fills the form, switches to another app for 3 hours, returns and taps Submit; the session token expired after 60 minutes
  consequence: Redirect goes to login and the prompt and selected videos are discarded; mobile OS may also have reloaded the tab, clearing the form
  p_typical: 0.05
  grounded: speculative
  evidence: none
  proposed: Spec draft persistence for at least 24 h and re-auth returning to the form with state restored
  shallow: false
- id: mobile-27
  title: Pull-to-refresh on a History tab with 100 entries has no spec for page size or data cost per refresh
  level: L3
  cell: {surface: history-tab, history-state: 100-entries, action: refresh-after-redirect, time-and-connection: steady-state}
  object: "Lists past and current submissions from both modes"
  situation: Phone on a metered 3G link; user pulls to refresh after being redirected, and the list returns all 100 entries (estimated 300 KB)
  consequence: Slow refresh with a blank list and no skeleton; scroll position resets so the newest entry may not be seen; no ordering rule is stated
  p_typical: 0.06
  grounded: inferred
  evidence: "Lists past and current submissions from both modes."
  proposed: Spec newest-first ordering, a first page of 20 entries, skeleton rows, and keeping the scroll position at top after a refresh
  shallow: false
- id: mobile-28
  title: Status of a Running entry is not refreshed after the app returns from the background, so the row shows stale status
  level: L3
  cell: {surface: history-entry-row, run-status: running, time-and-connection: page-open-for-hours, actor: background-agent-job, action: open-history-entry}
  object: History entry status, "Lists past and current submissions"
  situation: Entry shows Running at 14:02, phone sleeps 40 minutes while the run finishes; user returns at 14:42
  consequence: Row still says Running until a manual refresh; user opens the entry and sees a mismatch between row and detail; no polling or visibility-change refresh interval is specified
  p_typical: 0.09
  grounded: inferred
  evidence: "Lists past and current submissions from both modes."
  proposed: Spec refresh on tab visibility and a 15 s poll while any entry is Queued or Running
  shallow: false
- id: mobile-29
  title: First-time phone user with an empty library opens the pop-up and sees an empty grid with no route to the Videos page
  level: L3
  cell: {surface: empty-state, library-state: empty-library, time-and-connection: first-ever-use, action: open-add-video-popup, videos-selected: 0}
  object: Add video pop-up and Videos page ("users upload videos")
  situation: User has uploaded nothing, taps Add video on the Agent page
  consequence: Blank pop-up; user does not know that uploading happens on a different page; leaving to upload may discard the typed run name and prompt
  p_typical: 0.20
  grounded: inferred
  evidence: "**Videos page**: users upload videos; uploaded videos get ingested."
  proposed: Spec empty-state copy "No ingested videos yet" with a link to the Videos page and draft preservation on return
  shallow: false
- id: mobile-30
  title: Still-ingesting video shown in the pop-up with no touch-accessible explanation, since hover tooltips do not exist on phones
  level: L3
  cell: {surface: add-video-popup, video-state: still-ingesting, action: select-video, library-state: 50-videos, actor: ingestion-job}
  object: "Whether a video that is still ingesting, or failed ingestion, can be selected." (listed as unspecified)
  situation: 3 of 50 videos are still ingesting; user taps one and nothing happens, or it selects and later fails
  consequence: User thinks the tap is broken; a disabled tile with a hover-only reason is unreadable on touch
  p_typical: 0.10
  grounded: quote
  evidence: "Whether a video that is still ingesting, or failed ingestion, can be selected."
  proposed: Spec visible "Processing" label on the tile and a tap message "Ready in a few minutes"
  shallow: false
- id: mobile-31
  title: Video names truncated in the grid at 360px make re-uploaded same-name videos indistinguishable when searching by name
  level: L3
  cell: {surface: add-video-popup, video-state: re-uploaded-same-name, action: search, videos-selected: 2-5}
  object: "searching by name" in the pop-up
  situation: Two videos called "Interview_final_v2.mp4" (one re-uploaded) are shown with names clamped to about 18 characters on a 2-column phone grid
  consequence: Both tiles read "Interview_final_v..." with no date or length shown, so the user selects the wrong version
  p_typical: 0.06
  grounded: inferred
  evidence: "searching by name"
  proposed: Spec a second line with upload date and duration on each tile
  shallow: false
- id: mobile-32
  title: Error toast during agent outage appears behind the keyboard or auto-dismisses before a slow reader sees it
  level: L3
  cell: {surface: error-toast-or-banner, time-and-connection: during-agent-outage, action: submit, text-input-state: prompt-5000-chars}
  object: Error feedback on Submit (not specified anywhere in the spec)
  situation: Submit fails with a 503; the toast is shown for 3 s at the bottom of the screen while the keyboard is still up
  consequence: Toast is hidden under the keyboard; the user thinks nothing happened and taps again; prompt content may be retained or cleared, unspecified
  p_typical: 0.05
  grounded: speculative
  evidence: none
  proposed: Spec an inline banner at the top of the form that persists until dismissed, with form content preserved
  shallow: false
- id: mobile-33
  title: Tag chip filter selected by the user is renamed or deleted elsewhere while the pop-up is open, leaving a ghost chip
  level: L3
  cell: {surface: tag-filter, library-state: tag-renamed-or-deleted-after-filtering, action: filter-by-tag, actor: same-user-second-tab}
  object: Pop-up tag filter, "tags the user has applied to videos"
  situation: User has a second browser tab open on the Videos page (common on mobile since tabs persist), deletes tag "promo" while the first tab's pop-up has "promo" active with 7 results
  consequence: The chip stays active over a stale list, or the list shows 0 results with an active chip the user cannot find to turn off
  p_typical: 0.03
  grounded: speculative
  evidence: none
  proposed: Spec that on a missing tag the filter drops it and shows a brief "Tag no longer exists" note
  shallow: false
- id: mobile-34
  title: Search box on a phone keyboard with autocorrect, autocapitalize, and IME composition for non-English names has no matching rule
  level: L3
  cell: {surface: search-box, text-input-state: non-english-text, action: search, video-state: non-english-audio}
  object: Pop-up search, "searching by name"
  situation: User types "reunión" with accent input, or a name in Hindi using an IME where composition fires 4 search requests before the word is committed
  consequence: Autocorrect changes "q3" to "Q3" or a different word and gives 0 results; case, accent, and substring matching are unspecified, and IME composition triggers flicker over a slow link
  p_typical: 0.04
  grounded: speculative
  evidence: none
  proposed: Spec case-insensitive, accent-insensitive substring matching, and a 300 ms debounce that waits for composition to end
  shallow: false
- id: mobile-35
  title: Same phone user with two browser tabs open submits from both, producing near-identical entries with no cross-tab view
  level: L3
  cell: {surface: history-tab, actor: same-user-second-tab, history-state: two-entries-same-second, action: double-submit}
  object: "History is per user."
  situation: The mobile browser restores a second tab with the same form; the user submits in both tabs within 2 s
  consequence: Two entries with the same run name and same second timestamp; the order is undefined and the first tab's History does not show the entry from the second until refresh
  p_typical: 0.03
  grounded: inferred
  evidence: "History is per user."
  proposed: Spec tie-break ordering by server id and a refresh on tab focus
  shallow: false
- id: mobile-36
  title: Submit disabled state with 0 videos or an empty question gives no explanation on touch (no hover, no tooltip)
  level: L3
  cell: {surface: submit-button, videos-selected: "0", text-input-state: question-empty, mode: ask-question, action: submit}
  object: Ask question "Submit"
  situation: User taps a greyed-out Submit with 0 videos and no question; or taps an enabled Submit that returns an error
  consequence: Nothing visible happens; the spec does not say whether Submit is disabled or validates on tap, and a 0-video Report is not ruled out either
  p_typical: 0.14
  grounded: inferred
  evidence: "Prompt / instructions (optional)" is optional but Add video and question are not marked optional or required
  proposed: Spec Submit enabled only with at least 1 video and, in Ask question mode, a non-empty question, with inline hint text under the field
  shallow: false
- id: mobile-37
  title: Video deleted from the Videos page while a phone user leaves the form open for hours, then Submit includes a deleted video
  level: L3
  cell: {surface: selected-videos-list, video-state: deleted-after-selection-before-run, time-and-connection: page-open-for-hours, action: submit, videos-selected: 2-5}
  object: Selected videos, run submission
  situation: 4 videos selected at 09:00, one deleted at 10:30 from a desktop session, the phone user submits at 12:00
  consequence: Run fails, silently skips the video, or errors with no per-video message; the user sees a "Failed" row on History and does not know why
  p_typical: 0.05
  grounded: inferred
  evidence: "Whether a video that is still ingesting, or failed ingestion, can be selected."
  proposed: Spec a server check at submit that returns the names of missing videos and keeps the form filled
  shallow: false
- id: mobile-38
  title: Partial-failure report on 6-20 videos has no mobile layout for listing which videos were unusable
  level: L3
  cell: {surface: history-entry-detail, run-status: partial-some-videos-unusable, videos-selected: 6-20, action: open-history-entry, video-state: silent-or-no-transcript}
  object: "what opening an entry shows ... when done, and when failed"
  situation: 8 videos selected; 2 have no transcript; detail screen on a 360px phone has to show a report plus the 2 skipped names
  consequence: Notice of the 2 skipped videos is below a long report body, so the user reads conclusions drawn from 6 videos while thinking all 8 were used
  p_typical: 0.07
  grounded: inferred
  evidence: "A Report produces one output covering all selected videos, not one per video."
  proposed: Spec a top banner "Based on 6 of 8 videos" that expands to the skipped names
  shallow: false
- id: mobile-39
  title: Rotating the phone to landscape with the keyboard open in the pop-up leaves about 150px of visible content
  level: L3
  cell: {surface: add-video-popup, action: search, videos-selected: 6-20, library-state: 50-videos, mode: report}
  object: Add video pop-up with search box
  situation: Landscape at 640x360 with the keyboard taking roughly 200px, search box and 1 row of tiles visible
  consequence: User cannot see selected state or results; pop-up may be clipped with no scroll and no close control reachable
  p_typical: 0.02
  grounded: speculative
  evidence: none
  proposed: Spec that the pop-up becomes a full-screen sheet with a scrollable body and sticky header in both orientations
  shallow: false
- id: mobile-40
  title: History tab with 1000 entries over a slow link has no loading strategy and a user on mobile data may download all rows
  level: L3
  cell: {surface: history-tab, history-state: 1000-entries, time-and-connection: after-a-year, action: open-agent-page}
  object: "Lists past and current submissions from both modes."
  situation: A year of use; 1000 entries opened on 3G, roughly 3 MB of list payload if unpaged
  consequence: History is blank for 15+ s after the redirect, exactly when the user is looking for the entry just submitted
  p_typical: 0.04
  grounded: inferred
  evidence: "Lists past and current submissions from both modes."
  proposed: Spec page size of 20, newest first, and that the just-submitted entry is always shown first regardless of paging
  shallow: false
- id: mobile-41
  title: Question field with voice dictation can insert a long transcript or auto-send on the keyboard Go key
  level: L3
  cell: {surface: question-field, mode: ask-question, text-input-state: question-unrelated-to-videos, action: type-question, time-and-connection: steady-state}
  object: "A question about the selected videos, typed by the user"
  situation: User dictates 40 seconds of speech (about 100 words) and hits the keyboard Go key; the key may submit the form
  consequence: Form submits a long, rambling question with 0 chance to review; the Enter-key behaviour (newline or submit) is unspecified
  p_typical: 0.05
  grounded: speculative
  evidence: none
  proposed: Spec that Enter inserts a newline in question-field and only the Submit button sends
