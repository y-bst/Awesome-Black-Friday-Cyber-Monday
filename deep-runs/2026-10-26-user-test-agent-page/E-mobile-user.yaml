- id: mobile-42
  title: Run name field keyboard autofill suggests the user's name or email, and duplicate names across entries are shown with no disambiguation
  level: L3
  cell: {surface: run-name-field, text-input-state: run-name-duplicate-of-existing, action: type-run-name, history-state: 100-entries}
  object: "Run name (optional)"
  situation: Mobile autofill offers the previous run name "Weekly review"; user accepts it for the 9th time
  consequence: Nine History rows read "Weekly review" with only a small time to tell them apart at 360px; whether names must be unique is unspecified
  p_typical: 0.05
