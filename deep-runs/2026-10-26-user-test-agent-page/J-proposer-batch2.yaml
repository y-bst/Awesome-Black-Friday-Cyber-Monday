- id: range-18
  case: >-
    The spec lists "Minimum and maximum number of videos per run; video length and size limits" under "Still unspecified",
    so nothing stops a user from adding a 3-hour session plus five others to one Report, and the clarification that "A Report
    produces one output covering all selected videos" means all of that must fit into a single agent pass.
    When it does not, the build team will have to pick a behaviour on the spot, and the cheapest one (keep the first N tokens and
    drop the rest) is invisible to the user: the Report looks complete, but the last two hours of the long session never informed it.
    Because there is no loading page and the user is redirected straight to History, there is no moment before the run at which
    a warning would naturally appear unless the spec puts one in the Add video pop-up or the Submit step.
    The researcher who trusts that Report will present findings that silently omit the part of the session where the key task
    happened, and the detectability score of 5 reflects that no one can tell from the output alone.
    The fix is one spec line (a per-row "Too long; choose a range" state plus a Submit message naming the rows over the limit),
    and it has to be decided now because it determines whether the pop-up and selected-videos list carry a range control at all,
    which is far more expensive to retrofit than to design in.
- id: contract-15
  case: >-
    The clarification "A Report produces one output covering all selected videos" makes the Report the deliverable stakeholders
    will lift from, and in user-test reporting the most-lifted element is the participant quote.
    The spec says nothing about what the output may put inside quotation marks, so the default model behaviour applies: it
    removes fillers, repairs grammar and stitches sentences said 30 seconds apart into one tidy "quote".
    A PM pastes that line onto a slide as the participant's words; when someone plays the cited timestamp the words differ,
    and the credibility of every Report from this feature takes the hit, not just that one quote.
    Nothing in the History entry or the output marks the difference, which is why the leaf scores detectability 5: the error is
    only found by someone who goes back to the video, which is exactly what the feature exists to save people from doing.
    The rule is cheap to state today (quotation marks only around exact, contiguous transcript text; paraphrase unquoted and
    labelled "Paraphrase:"), and it shapes the prompt, the output contract and QA acceptance (spot-check 10 quotes per report),
    none of which can be written correctly without it.
    Leaving it for later means the first reports ship with fabricated-looking quotes and the trust problem precedes the fix.
- id: modality-3
  case: >-
    The Ask question mode invites "A question about the selected videos, typed by the user", and for usability-test videos the
    most natural questions are about what was on screen: "What error appeared?", "Which button did they click?".
    The spec says only that "uploaded videos get ingested" and never says whether ingestion reads the screen, so if it is
    transcript-only the agent will receive a question whose answer it cannot see and, with no rule telling it otherwise,
    will produce a plausible answer such as "Invalid card number" when the toast actually said "Card declined (code 402)".
    The user cannot detect this from the answer (detectability 5); they will file a bug against the wrong error or tell
    engineering the wrong copy needs fixing.
    The expected behaviour is concrete and writable from the leaf: when a question asks for on-screen text the agent states
    "On-screen text is not available to the agent" and points to the nearest speech timestamp (here 03:12, "huh, that's weird").
    It must be specified now because it is both an ingestion scope decision (OCR or not) and a response-copy decision, and the
    suggested questions list, also unspecified, will otherwise happily suggest screen questions the agent cannot answer.
    An agent that invents evidence in its very first release teaches users to distrust every answer, including the correct ones.
- id: speaker-1
  case: >-
    The spec's entire description of ingestion is "users upload videos; uploaded videos get ingested", which leaves open whether
    the transcript the agent reads distinguishes the moderator from the participant.
    In a moderated 45-minute session the moderator often speaks a third or more of the words, including leading prompts like
    "so that was pretty confusing, right?", and an unlabelled transcript lets the Report attribute those words to the participant.
    The PM reading the Report on the History entry then sees findings such as "participant found checkout confusing" that are
    actually the moderator's framing, and has no way to tell from the output; this leaf has the highest occurrence score in the
    batch (5, p_typical 0.12) because moderated sessions are the common case, not an edge.
    This cannot be fixed later in the agent page alone: it is a contract on what "ingested" means, owned by the Videos page and
    the ingestion pipeline, and every Report and answer produced before it is fixed is silently contaminated.
    The spec line is ready to adopt: ingestion output carries per-segment speaker labels with a role of moderator / participant /
    unknown, and "ingested" means labels exist or are explicitly marked absent so the agent can caveat its findings.
    Deciding now costs a sentence; deciding after launch means re-ingesting every video already uploaded.
- id: participant-37
  case: >-
    The spec says Submit sends the selected videos to "the agent" and that History is per user, but it never says where the
    participant's video, transcript and the user's prompt go when the agent runs, and in practice that is an external model API.
    User-test videos contain participants' faces, voices and often personal details spoken aloud, and those participants
    consented to a research session, not to an unnamed third party retaining their data or training on it.
    If the vendor keeps 30-day logs or has training enabled, a participant's erasure request handled in this product does not
    reach those copies, and the team cannot truthfully say where the data went, which is a compliance failure (severity 5),
    not a UX glitch, and one no user of the page will ever notice (detectability 5).
    The leaf is admittedly speculative in grounding (no spec sentence names a vendor), but that silence is the gap: the decision
    has to be made before the first Submit sends real participant data, because data already sent cannot be recalled.
    The fix is a short spec statement of vendor retention (e.g. 0-day or 30-day), no-training terms, and the vendor deletion
    steps in the erasure procedure, all of which are procurement and configuration choices that are cheap before launch and
    impossible to apply retroactively.
