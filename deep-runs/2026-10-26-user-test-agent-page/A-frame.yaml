topic: User Test agent page (Report mode, Ask question mode, History tab) — situations the spec does not specify
unit: a gap — a situation for which the spec specifies no behaviour, state, copy, limit or owner
leaf_test: >
  Concrete object = a named surface (Videos page, Agent page, Report form, Ask question form, Add video pop-up,
  tag filter, search box, suggested questions, run name field, prompt/instructions field, question field, Submit,
  redirect, History tab, history entry, entry detail, follow-up thread), a named state (ingested / ingesting), or a
  quoted spec sentence. "Act tomorrow" = the PM can write the missing spec line or acceptance criterion from the item alone.
audience: the PM and designer finalising the feature before build; per gap they decide add-to-spec / defer / accept
artifact_description: >
  A spec for an "agent page" with two modes and a History tab. Report mode: optional run name, Add video pop-up
  (select from ingested videos, filter by tags, search), optional prompt/instructions, Submit; one report per run
  covering all selected videos. Ask question mode: same video selection, a typed question or a suggested question,
  Submit, follow-ups supported. No loading page: submit redirects to the History tab where the new entry appears.
  History is per user. Videos come from a separate Videos page where users upload and videos get ingested.
  Unspecified by the owner: video count/size limits, entry statuses, what opening an entry shows, whether suggested
  questions are static or derived, whether ingesting or failed videos are selectable.
artifacts:
  - path: deep-runs/2026-10-26-user-test-agent-page/spec.md
    kind: prd
    objects: surfaces, fields, modes, pop-up controls, redirect rule, history rule, clarifications, listed unknowns
assumptions:
  - no stated limit on videos per run
  - entry statuses assumed Queued / Running / Done / Failed until specified
  - suggested questions assumed a static list until specified
rubric: fmea
quota_per_perspective: 30
mode: full
