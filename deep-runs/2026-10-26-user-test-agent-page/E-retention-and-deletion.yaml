  level: L3
  cell: {surface: submit-button, action: submit, text-input-state: prompt-5000-chars, time-and-connection: steady-state}
  object: "Submit button event"
  situation: "Each Submit sends an analytics event; if the payload includes the prompt (up to 5000 characters) it lands in a third-party analytics tool."
