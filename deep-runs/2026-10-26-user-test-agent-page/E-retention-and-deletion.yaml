- id: privacy-1
  title: Deleting a video on the Videos page while a Done report that summarises it sits in History has no stated effect on the report text
  level: L3
  cell: {surface: history-entry-detail, video-state: deleted-after-run, run-status: done, mode: report}
  object: "History entry detail of a Report run; the Videos page delete action"
  situation: "User deletes video V on the Videos page 2 days after a Report run (5 videos) finished. The report text still contains summaries and verbatim lines from V."
  consequence: "The uploader believes V is gone, but the derived report keeps V's content indefinitely. A data-subject erasure request for V is only half executed, and the entry may show a dangling video name or a broken thumbnail."
  p_typical: 0.18
  grounded: inferred
  evidence: "A Report produces one output covering all selected videos, not one per video."
  proposed: "Spec one rule: deleting a video either leaves reports intact with the video shown as Deleted video, or purges quotes from every referencing report. Add a confirm dialog on the Videos page reading Used in N history entries."
  shallow: false
- id: privacy-2
  title: Deleting a video that an open Ask question thread already used leaves the thread able to answer from it
  level: L3
  cell: {surface: follow-up-thread, thread-state: follow-up-after-video-deleted, video-state: deleted-after-run, action: ask-follow-up}
  object: "Follow-up thread; spec line Follow-up questions are supported after the first answer."
  situation: "Thread with 3 answers on video V. V is deleted. The user types follow-up 4 and presses Submit."
  consequence: "Either the follow-up is answered from a retained copy of V's transcript (deleted content still in use), or it fails with no explanation. Both outcomes are unspecified."
  p_typical: 0.08
  grounded: inferred
  evidence: "Follow-up questions are supported after the first answer."
  proposed: "State that follow-ups after deletion use only already-given answers, or are blocked with the copy Source video deleted, ask a new question."
  shallow: false
- id: privacy-3
  title: Video deleted while a run that selected it is Running; spec does not say whether the running job keeps and uses its transcript copy
  level: L3
  cell: {surface: videos-page, video-state: deleted-after-selection-before-run, run-status: running, per-video-outcome-within-run: video-skipped-because-deleted}
  object: "Videos page delete versus a Running history entry"
  situation: "Run of 6 videos is Running at minute 4 of about 10; the uploader deletes video 3 at minute 5."
  consequence: "The job either finishes using video 3 (content produced after a deletion request, stored in a report that outlives it) or silently drops it and the report claims to cover 6 videos."
  p_typical: 0.06
  grounded: speculative
  evidence: "none"
  proposed: "Define deletion as cancelling that video's use in all Queued and Running jobs, and mark the report Partial 5/6 videos."
  shallow: false
- id: privacy-4
  title: No delete action exists for a history entry, so a report or question containing personal data cannot be removed by its owner
  level: L3
  cell: {surface: history-entry-row, action: delete-entry-not-in-spec, run-status: done, actor: creator-owner}
  object: "History tab row; spec line Lists past and current submissions from both modes."
  situation: "User submitted a prompt naming a participant (Maria G., clinic interview) and now wants the entry gone. The History tab lists entries but offers no removal."
  consequence: "Only a support request can remove it, with no stated owner or turnaround; erasure obligations (for example a 30-day response window) cannot be met from the product."
  p_typical: 0.22
  grounded: quote
  evidence: "Lists past and current submissions from both modes."
  proposed: "Add Delete on the row and in the detail view, with a confirm stating exactly what is removed."
  shallow: false
- id: privacy-5
  title: Deleting an Ask question entry does not say whether the 10 follow-up turns, their answers and the original question go with it
  level: L3
  cell: {surface: history-entry-row, thread-state: follow-up-10, action: delete-entry-not-in-spec, mode: ask-question}
  object: "Ask question history entry plus its follow-up thread"
  situation: "Entry with a first question and 10 follow-ups is deleted from the History tab."
  consequence: "If the thread is stored as separate records keyed by thread id, the entry row disappears while 11 question and answer texts remain in the database and in provider conversation state."
  p_typical: 0.06
  grounded: speculative
  evidence: "none"
  proposed: "Spec the deletion set per entry type: Report = report, prompt, run name, logs, transcript snapshots; Ask question = all turns, answers, logs, transcript snapshots."
  shallow: false
- id: privacy-6
  title: Derived copies made at ingestion (transcripts, embeddings, thumbnails) are not named in any deletion rule
  level: L3
  cell: {actor: ingestion-job, surface: videos-page, video-state: deleted-after-run, action: delete-entry-not-in-spec}
  object: "Spec line uploaded videos get ingested."
  situation: "User deletes a video and its history entries. Ingestion produced a transcript, a search index entry for the name search, and frame thumbnails."
  consequence: "The file is deleted but the transcript and index entry persist, so the video can still surface in search and in follow-ups. No owner or retention period is given for these derivatives."
  p_typical: 0.07
  grounded: inferred
  evidence: "Videos page: users upload videos; uploaded videos get ingested."
  proposed: "List every derived artefact per video and require each to be deleted within a stated number of days (for example 7) of the delete action."
  shallow: false
- id: privacy-7
  title: No retention period for reports and threads; an entry from a year ago is retained and openable
  level: L3
  cell: {surface: history-entry-row, time-and-connection: after-a-year, entry-point-and-lifecycle-phase: long-after-retention-window, history-state: 1000-entries}
  object: "History tab list (past submissions) and entry detail"
  situation: "A user with 1000 entries opens the History tab 13 months after the oldest run."
  consequence: "Reports quoting participants live forever by default. If a retention window is later added (for example 365 days), the spec does not say what the row and a bookmarked entry show after expiry."
  p_typical: 0.15
  grounded: inferred
  evidence: "Lists past and current submissions from both modes."
  proposed: "Add a retention rule: entries and threads auto-delete N days after last activity (N set by the owner), with an expiry notice 14 days before."
  shallow: false
- id: privacy-8
  title: History is per user, so a deactivated member's reports, threads and prompts have no stated owner or fate
  level: L3
  cell: {actor: removed-or-deactivated-user, permission-and-plan: member-removed-from-workspace, history-state: 100-entries, surface: history-tab}
  object: "Spec line History is per user."
  situation: "Workspace owner removes an analyst who has 100 entries; the analyst's reports quote participants and cite other members' videos."
  consequence: "Entries are either orphaned and retained forever, deleted without the workspace owner getting a chance to export them, or stay readable to nobody. Offboarding is a gap with no owner."
  p_typical: 0.12
  grounded: quote
  evidence: "History is per user."
  proposed: "Spec offboarding: on removal, entries are retained 30 days, exportable by the workspace owner, then deleted."
  shallow: false
- id: privacy-9
  title: Workspace owner or admin access to another user's history is neither allowed nor ruled out
  level: L3
  cell: {actor: workspace-owner, surface: history-tab, history-state: 100-entries, permission-and-plan: full-access}
  object: "Spec line History is per user."
  situation: "Workspace owner needs to review what a member asked about participant videos (a compliance review of 100 entries)."
  consequence: "Per user may mean strictly private (owner cannot comply with a review) or merely the default view (owner can read everything silently). Users cannot know who can read their prompts."
  p_typical: 0.07
  grounded: quote
  evidence: "History is per user."
  proposed: "State in one line who besides the creator can read an entry (nobody / workspace owner / admin) and show that on the History tab."
  shallow: false
- id: privacy-10
  title: The word currently in History is per user, currently implies a later change to shared history, with no rule for existing entries
  level: L3
  cell: {surface: history-tab, actor: other-user-same-workspace, time-and-connection: after-a-year, history-state: 1000-entries}
  object: "Clarification line History is per user, currently."
  situation: "In a later release history becomes workspace-wide. 1000 existing private entries per user were written under the per-user promise."
  consequence: "Prompts, questions and reports become visible to colleagues retroactively, without the author's consent; a participant-sensitive prompt written privately is exposed."
  p_typical: 0.04
  grounded: quote
  evidence: "History is per user, currently."
  proposed: "Spec that any sharing change applies only to entries created after release, or requires per-entry opt-in."
  shallow: false
- id: privacy-11
  title: Copy output and export are absent, so a report with participant quotes leaves the product with no control over it
  level: L3
  cell: {surface: export-or-copy-output, action: copy-output, run-status: done, actor: report-recipient-without-access}
  object: "Report output in the entry detail"
  situation: "User selects the report text and pastes it into a slide or chat for a colleague who has no access to the videos."
  consequence: "Deleting the entry or video later cannot recall the pasted copy; the spec neither offers a watermark nor a notice saying the report may contain participant quotes and names."
  p_typical: 0.05
  grounded: speculative
  evidence: "none"
  proposed: "Decide if copy is allowed and add a line above the report: Contains quotes from N videos; remove names before sharing."
  shallow: false
- id: privacy-12
  title: No right-of-access export of a user's own history (prompts, questions, reports, threads)
  level: L3
  cell: {surface: history-tab, action: share-or-export-not-in-spec, actor: test-participant-data-subject, entry-point-and-lifecycle-phase: after-done-consuming-output}
  object: "History tab"
  situation: "A data subject or a user requests a copy of all their data; the History tab has no export and the spec names no owner for producing it."
  consequence: "Support must query the database by hand for each of N entries and threads; the response window (for example 30 days) is at risk and output format is undefined."
  p_typical: 0.04
  grounded: inferred
  evidence: "Lists past and current submissions from both modes."
  proposed: "Add Export my history (JSON plus text) in account settings, covering entries, threads, prompts, run names."
  shallow: false
- id: privacy-13
  title: Spec does not say whether a report quotes participants verbatim, names them, or paraphrases
  level: L3
  cell: {surface: history-entry-detail, mode: report, actor: test-participant-data-subject, video-state: ingested}
  object: "Report mode output (one output covering all selected videos)"
  situation: "Participant says their full name and employer in the video; the report copies a line verbatim with the name, attributed to that video."
  consequence: "Identifiable personal data is reproduced in a text artefact that is stored separately from the video, is copyable, and outlives it. Without a rule the output varies by prompt and model."
  p_typical: 0.1
  grounded: speculative
  evidence: "A Report produces one output covering all selected videos, not one per video."
  proposed: "Add an output rule: quotes limited to 25 words, speaker shown as Participant n, spoken names masked, unless the prompt explicitly asks otherwise."
  shallow: false
- id: privacy-14
  title: Cited video timestamps in a report keep working after the report is copied or the viewer lacks video rights
  level: L3
  cell: {surface: cited-video-timestamp-player, action: open-cited-timestamp, actor: report-recipient-without-access, permission-and-plan: video-owned-by-other-user}
  object: "Cited timestamp player opened from a report"
  situation: "User A ran a report over a video owned by user B and opens a cited timestamp at 12:41 after B revoked sharing."
  consequence: "The player either plays video A should no longer see (access bypass via the report) or fails silently. The report text itself still shows B's content."
  p_typical: 0.05
  grounded: speculative
  evidence: "none"
  proposed: "Check video access on every timestamp open and show Video no longer shared with you; decide whether report text is redacted at that moment."
  shallow: false
- id: privacy-15
  title: Where the prompt text is stored and for how long is not stated, although the entry shows it back to the user
  level: L3
  cell: {surface: prompt-field, text-input-state: text-contains-participant-personal-data, action: submit}
  object: "Prompt / instructions (optional) field and the new History entry showing whatever was submitted"
  situation: "User pastes 5000 characters of interview notes with a participant's name, health condition and phone number into Prompt / instructions."
  consequence: "The text is stored in the entry, copied into server logs and request traces, and sent to the agent provider; retention of each copy is unspecified and survives entry deletion unless named."
  p_typical: 0.09
  grounded: quote
  evidence: "a new entry appears with whatever was submitted."
  proposed: "List each store holding prompt text (entry table, application log, trace, provider) with a retention in days, and exclude it from logs."
  shallow: false
- id: privacy-16
  title: Question text and thread turns kept by the agent provider outlive deletion of the History entry
  level: L3
  cell: {surface: question-field, mode: ask-question, thread-state: follow-up-10, action: delete-entry-not-in-spec}
  object: "Question field and follow-up thread"
  situation: "10 follow-ups re-send the transcript context each time to the agent provider; the user later deletes the entry."
  consequence: "Up to 11 copies of transcript-derived content may sit in provider logs for the provider's own retention (commonly 30 days), outside the user's deletion."
  p_typical: 0.05
  grounded: speculative
  evidence: "none"
  proposed: "Spec the provider contract term (no training, zero or 30-day retention) and the deletion call made to the provider on entry delete."
  shallow: false
- id: privacy-17
  title: Data residency of the agent provider is unspecified for videos that contain EU or other regional participants
  level: L3
  cell: {surface: submit-button, actor: background-agent-job, permission-and-plan: full-access, videos-selected: 6-20}
  object: "Submit action that triggers the agent run on selected videos"
  situation: "A workspace in the EU submits a Report over 12 videos; the agent provider processes in a US region."
  consequence: "Cross-border transfer of participant data with no notice to the user, and a customer contract clause requiring in-region processing is silently broken."
  p_typical: 0.08
  grounded: speculative
  evidence: "none"
  proposed: "State processing region per workspace and the sub-processor name; show a one-line notice on the agent page."
  shallow: false
- id: privacy-18
  title: During an agent outage or model change, the run may be re-routed to another provider or region without notice
  level: L3
  cell: {surface: history-entry-status-badge, time-and-connection: during-agent-outage, run-status: retrying, actor: background-agent-job}
  object: "Entry with status Retrying or Running during an outage"
  situation: "Primary provider is down for 40 minutes; the system falls back to a secondary provider in a different region."
  consequence: "Residency and retention terms differ from the ones advertised; the entry gives no indication which provider produced the report."
  p_typical: 0.03
  grounded: speculative
  evidence: "none"
  proposed: "Forbid failover outside the contracted region, or record provider and region on the entry."
  shallow: false
- id: privacy-19
  title: Transcription at ingestion may use a different vendor and region from the agent provider, and the spec names neither
  level: L3
  cell: {actor: ingestion-job, video-state: non-english-audio, surface: videos-page, library-state: 50-videos}
  object: "Spec line uploaded videos get ingested."
  situation: "Non-English audio is sent to a speech-to-text service on upload, before any agent run exists."
  consequence: "Participant audio leaves the product the moment it is uploaded; the residency answer for the agent provider does not cover this second transfer."
  p_typical: 0.04
  grounded: inferred
  evidence: "uploaded videos get ingested."
  proposed: "Add ingestion vendor and region to the data-flow statement, with retention of the raw audio copy."
  shallow: false
- id: privacy-20
  title: Run name appears in History rows and any notification, so a name like Interview Maria Gomez leaves the page
  level: L3
  cell: {surface: run-name-field, text-input-state: text-contains-participant-personal-data, run-status: done}
  object: "Run name (optional) field"
  situation: "User types Interview with Maria Gomez, oncology as run name (200-char limit not specified); a Done email or badge later shows the name."
  consequence: "Personal data appears in email subjects, lock-screen previews and browser tab titles, which are outside the retention and deletion model."
