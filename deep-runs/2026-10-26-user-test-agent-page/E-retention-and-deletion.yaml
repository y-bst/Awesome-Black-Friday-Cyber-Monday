- id: privacy-21
  title: History row shows the submitted question and prompt in full, visible to anyone viewing the screen
  level: L3
  cell: {surface: history-entry-row, text-input-state: text-contains-participant-personal-data, observer-location-at-status-change: on-history-tab-top, mode: ask-question}
  object: "History entry row showing whatever was submitted"
  situation: "User shares their screen in a 10-person call with the History tab open; the top 5 rows show full question text."
  consequence: "Sensitive question text is displayed to the audience; no truncation length (for example 80 characters) or mask is specified."
  p_typical: 0.03
