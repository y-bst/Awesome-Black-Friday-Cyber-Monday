  shallow: false
- id: privacy-22
  title: Failed run entry may echo prompt or transcript fragments in the error banner and error tracking
  level: L3
  cell: {surface: error-toast-or-banner, run-status: failed, text-input-state: text-contains-participant-personal-data, actor: background-agent-job}
  object: "Error toast or banner and the Failed entry detail"
  situation: "Agent job fails with a provider error that embeds the first 200 characters of the request."
  consequence: "Participant data is written to the banner, the entry, and an error-tracking service with its own retention, none of which are covered by entry deletion."
