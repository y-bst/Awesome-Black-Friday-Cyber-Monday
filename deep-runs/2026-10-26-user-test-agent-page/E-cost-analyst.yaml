  situation: "User uploads 200 hours of video (ingestion cost incurred once per video) and later edits one video, which triggers re-ingestion"
  consequence: "Finance cannot separate one-time ingestion cost from per-run read cost; re-ingestion on edit pays ingestion again with no spec line about it"
  p_typical: 0.05
  grounded: quote
  evidence: "Videos page: users upload videos; uploaded videos get ingested."
