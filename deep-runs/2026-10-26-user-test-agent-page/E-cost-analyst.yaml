- id: cost-35
  title: "A removed or deactivated user's running job keeps charging the workspace and its output is unreachable"
  level: L3
  cell: {surface: history-entry-row, actor: removed-or-deactivated-user, permission-and-plan: member-removed-from-workspace, run-status: running}
  object: "History is per user."
  situation: "Admin removes a member while that member's 40-video Report is Running"
  consequence: "Job may finish and bill the workspace with history tied to a removed user; nobody can open the result"
  p_typical: 0.03
  grounded: speculative
  evidence: "History is per user, currently."
  proposed: "Cancel running jobs on removal, or transfer entries to the workspace owner"
  shallow: false
- id: cost-36
  title: "Trial or no-agent plan user opening the agent page: what shows and whether first runs are free is unspecified"
  level: L3
  cell: {surface: agent-page-mode-switch, permission-and-plan: trial-or-plan-without-agent, time-and-connection: first-ever-use, action: open-agent-page}
  object: "Agent page with Report and Ask question modes"
  situation: "User on a plan without the agent opens the page for the first time"
  consequence: "Page may show full forms that fail on Submit, or a locked state; free trial runs, if any, have no counter"
  p_typical: 0.07
  grounded: speculative
  evidence: none
  proposed: "Show a locked state with the plan name needed, or show \"3 free runs left\" on the form"
