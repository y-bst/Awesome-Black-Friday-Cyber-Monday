- id: cost-16
  title: "Run cost is not shown on the history entry row, so spend cannot be traced to a run"
  level: L3
  cell: {surface: history-entry-row, history-state: 100-entries, mode: report, actor: creator-owner}
  object: "History tab entry row (\"a new entry appears with whatever was submitted\")"
