- id: cost-41
  title: "Logging out or closing the app while a run is Running leaves the charge in place with no stated delivery of the output"
  level: L3
  cell: {surface: notification-email-or-in-app, action: logout-while-running, entry-point-and-lifecycle-phase: app-closed-while-running, observer-location-at-status-change: logged-out}
  object: "\"No loading page\" design; History entry while Running"
  situation: "User submits a 60-video Report and closes the laptop; the run completes 50 minutes later"
  consequence: "Spend occurred with no notification; the user may resubmit the same run next day because nothing shows it finished"
  p_typical: 0.04
  grounded: inferred
  evidence: "There is no loading page, to save the user's time."
  proposed: "Send an in-app or email notice on Done or Failed, including the units charged"
