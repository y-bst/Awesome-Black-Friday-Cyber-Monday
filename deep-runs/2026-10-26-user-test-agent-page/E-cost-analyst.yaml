- id: cost-18
  title: "A Running entry with no cancel keeps accruing cost when stuck over 1 hour"
  level: L3
  cell: {surface: history-entry-status-badge, run-status: stuck-over-1h, action: cancel-run-not-in-spec, mode: report}
  object: "History entry status (statuses unspecified) and the absence of cancel in the spec"
