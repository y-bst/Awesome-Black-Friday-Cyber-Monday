  proposed: "Mark the entry \"1 video changed since this report\" and offer rerun on changed videos only, priced per video"
  shallow: false
- id: cost-43
  title: "Retry of failed videos only versus retry of the whole run is not in the spec, and the whole-run retry re-bills successful videos"
  level: L3
  cell: {surface: history-entry-detail, action: retry-failed-videos-only, run-status: partial-some-videos-unusable, per-video-outcome-within-run: some-videos-unusable}
  object: "History entry detail for a partial run"
  situation: "3 of 20 videos failed and the user wants a complete report"
  consequence: "Only option may be a new run over all 20, paying for 17 twice and getting a second separate report"
  p_typical: 0.04
  grounded: inferred
  evidence: "A Report produces one output covering all selected videos, not one per video."
  proposed: "Offer \"retry 3 failed videos\" that merges into the same report and charges only those 3"
