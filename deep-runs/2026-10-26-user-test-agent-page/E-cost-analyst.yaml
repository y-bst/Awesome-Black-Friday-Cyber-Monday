- id: cost-37
  title: "Outputs and history entries are kept indefinitely with no retention rule, so storage cost accrues per entry"
  level: L3
  cell: {surface: history-tab, history-state: 1000-entries, entry-point-and-lifecycle-phase: long-after-retention-window, time-and-connection: after-a-year}
  object: "History tab \"Lists past and current submissions\""
  situation: "A user has 1000 entries after a year, each with a report of about 5 pages and a follow-up thread"
  consequence: "Stored output and threads grow without bound, with no delete (delete-entry is not in spec) and no expiry, so storage cost cannot be capped"
  p_typical: 0.03
  grounded: inferred
  evidence: "Lists past and current submissions from both modes."
  proposed: "State a retention period (for example 12 months) and a delete-entry action that removes stored output"
  shallow: false
- id: cost-38
  title: "Follow-up after the video set changed or a video was deleted is priced and answered on an unspecified set"
  level: L3
  cell: {surface: follow-up-thread, thread-state: follow-up-after-video-deleted, video-state: deleted-after-run, action: ask-follow-up, mode: ask-question}
  object: "Follow-up thread; Videos page where users delete videos"
  situation: "One of 4 videos is deleted from the Videos page a week after the first answer, then the user asks a follow-up"
  consequence: "Follow-up reads 3 videos or fails or answers from cache of 4; the price and the content of the answer differ and the entry gives no sign of which"
  p_typical: 0.04
  grounded: inferred
  evidence: "Videos page: users upload videos; uploaded videos get ingested."
  proposed: "Show \"1 video no longer available\" on the thread and state the follow-up uses remaining videos"
  shallow: false
- id: cost-39
  title: "Follow-up after a model or agent version change is priced and answered by a different model than the first answer"
  level: L3
  cell: {surface: follow-up-thread, thread-state: follow-up-after-agent-version-change, time-and-connection: agent-model-version-changed-since-entry, history-state: entries-from-older-agent-version}
  object: "Follow-up thread opened from History"
  situation: "A thread started in March is continued in October after the model changed and its price per video-hour rose"
  consequence: "Follow-up costs a different amount than earlier turns; answer style may shift mid-thread; nothing records which version answered"
  p_typical: 0.03
  grounded: speculative
  evidence: none
  proposed: "Record agent version on each answer and state whether old threads continue on the old version"
  shallow: false
- id: cost-40
  title: "Billing-day boundary for an entry depends on a timestamp whose timezone is unspecified"
  level: L3
  cell: {surface: history-entry-row, time-and-connection: timezone-of-entry-timestamp, actor: admin, history-state: two-entries-same-second}
  object: "History entry timestamp"
  situation: "Run submitted at 23:50 UTC on the last day of the period by a user in UTC+5:30, so local date is the first of next month"
  consequence: "Usage resets and invoices attribute the run to different periods than the History timestamp shows; Finance reconciliation is off by one period for boundary runs"
  p_typical: 0.03
  grounded: speculative
  evidence: none
  proposed: "Show timestamps in the user's timezone with the UTC date available on hover, and bill by UTC submit time"
