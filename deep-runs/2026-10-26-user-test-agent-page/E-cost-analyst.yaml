- id: cost-42
  title: "Re-ingestion of an edited video makes a Done report stale, and refreshing it costs a full new run"
  level: L3
  cell: {surface: history-entry-detail, run-status: done-then-source-video-changed-stale, video-state: re-ingesting-after-edit, action: retry-whole-run}
  object: "History entry detail of a Done Report"
  situation: "A source video is replaced by a re-upload after the report was produced"
  consequence: "No stale marker; user reruns the whole report over 30 videos to refresh one, paying for the 29 unchanged"
  p_typical: 0.03
  grounded: speculative
