- id: cost-1
  title: "Report run over 50 videos of 2 hours each starts with no cost or time preview at Submit"
  level: L3
  cell: {surface: submit-button, videos-selected: "21-100", video-state: 3-hour-long, mode: report, action: submit}
  object: "Report form Submit button and the redirect to the History tab"
  situation: "User selects 50 two-hour videos (100 video-hours) in the Add video pop-up and presses Submit; the spec says \"On submit the user is redirected to the History tab\" with no confirmation step"
  consequence: "The most expensive possible run is one click away, with no estimate of price or duration shown before or after; Finance cannot say what a worst-case run costs"
  p_typical: 0.30
  grounded: quote
  evidence: "There is no loading page, to save the user's time. On submit the user is redirected to the History tab"
  proposed: "Show an estimate (video-hours, expected cost band, expected duration) beside Submit, with a confirm step above a stated threshold such as 10 video-hours"
  shallow: false
- id: cost-2
  title: "No maximum videos per run in the spec, so cost per run is unbounded"
  level: L3
  cell: {surface: selected-videos-list, videos-selected: exceeds-limit-once-defined, mode: report, popup-session-state: at-max-selection}
  object: "Spec section \"Still unspecified\", first bullet"
  situation: "The spec lists \"Minimum and maximum number of videos per run; video length and size limits\" as unspecified; the pop-up has no defined at-max-selection state"
  consequence: "Cost per run has no ceiling, so budget forecasts cannot use a per-run maximum; the pop-up cannot show a \"N of max\" counter"
  p_typical: 0.35
  grounded: quote
  evidence: "Minimum and maximum number of videos per run; video length and size limits."
  proposed: "Add a cap in videos and a cap in total video-minutes per run, and state the message shown when the cap is hit"
  shallow: false
- id: cost-3
  title: "One click on select-all-filtered in a 2000-video library creates a run of unbounded cost"
  level: L3
  cell: {surface: add-video-popup, library-state: 2000-videos, videos-selected: all-videos-in-library, popup-session-state: select-all-filtered, action: select-all-filtered}
  object: "Add video pop-up (select from ingested videos, filter by tags, search)"
  situation: "Library holds 2000 ingested videos; user filters by a broad tag or no tag and uses select-all (the spec does not say whether select-all exists)"
  consequence: "A single gesture can select 2000 videos; with 100 videos costing X per run this is 20X, plus 20X again for every follow-up that re-reads them"
  p_typical: 0.08
  grounded: inferred
  evidence: "The pop-up supports filtering by the tags the user has applied to videos, and searching by name."
  proposed: "Either disallow select-all or apply the per-run video cap to it and show the count against the cap"
  shallow: false
- id: cost-4
  title: "Each follow-up in Ask question mode may re-read all selected videos, so a thread's cost grows linearly with its length"
  level: L3
  cell: {surface: follow-up-thread, mode: ask-question, thread-state: follow-up-10, videos-selected: "21-100", action: ask-follow-up}
  object: "Ask question mode, \"Follow-up questions are supported after the first answer.\""
  situation: "A user picks 30 videos, asks a first question and then 10 follow-ups; the spec does not say whether videos are re-read, cached or summarised after the first answer"
  consequence: "Thread cost is somewhere between 1x and 11x the first-question cost; Finance cannot model per-thread cost without knowing which"
  p_typical: 0.20
  grounded: quote
  evidence: "Follow-up questions are supported after the first answer."
  proposed: "State the context strategy for follow-ups (re-read, cached, or transcript-only) and the resulting price per follow-up relative to the first question"
  shallow: false
- id: cost-5
  title: "No limit on follow-ups per thread, so one thread can run indefinitely"
  level: L3
  cell: {surface: follow-up-thread, thread-state: follow-up-limit-reached, mode: ask-question, action: ask-follow-up}
  object: "Follow-up thread in Ask question mode"
  situation: "User keeps asking follow-ups (100 or more) in the same thread; the spec states no maximum thread length and no message for reaching one"
  consequence: "Unbounded per-thread spend; also unbounded context growth that raises the per-follow-up price as the thread lengthens"
  p_typical: 0.12
  grounded: inferred
  evidence: "Follow-up questions are supported after the first answer."
  proposed: "Set a maximum of N follow-ups per thread (for example 20) and specify the \"start a new question\" prompt at the limit"
  shallow: false
- id: cost-6
  title: "Re-running the same videos with the same prompt is billed again with no reuse of the earlier result"
  level: L3
  cell: {surface: history-entry-detail, action: re-run-not-in-spec, run-status: superseded-by-re-run, videos-selected: "6-20"}
  object: "History entry (no re-run in spec); Report form re-submitted with the same videos"
  situation: "User submits a Report on the same 12 videos with a new prompt wording, or the same prompt, minutes after a Done run"
  consequence: "The run pays the full ingestion-derived read cost again; nothing tells the user a Done report on the same video set exists"
  p_typical: 0.08
  grounded: inferred
  evidence: "Lists past and current submissions from both modes."
  proposed: "On Submit, detect an identical video set plus prompt in History and offer \"open existing\" before charging"
  shallow: false
- id: cost-7
  title: "Failed runs: whether the failed entry is charged is not specified"
  level: L3
  cell: {surface: history-entry-status-badge, run-status: failed, permission-and-plan: quota-remaining, mode: report}
  object: "History tab entry statuses (spec: \"Statuses an entry can have ... unspecified\")"
  situation: "A run fails after 40 minutes of processing 30 videos; the entry shows Failed"
  consequence: "Unclear whether quota is deducted, refunded or partly kept; support tickets asking for credit back; Finance cannot book a failure rate into unit cost"
  p_typical: 0.15
  grounded: quote
  evidence: "Statuses an entry can have on the History tab, and what opening an entry shows while running, when done, and when failed."
  proposed: "State that Failed runs are not charged to quota, or state the partial-charge rule, and show it on the Failed entry"
  shallow: false
- id: cost-8
  title: "Partial run where 3 of 12 videos are unusable: charge basis for the unusable videos is unspecified"
  level: L3
  cell: {surface: history-entry-detail, run-status: partial-some-videos-unusable, per-video-outcome-within-run: some-videos-unusable, videos-selected: "6-20"}
  object: "History entry detail for a Report over 12 videos"
  situation: "3 of 12 videos have silent audio or failed ingestion and the report covers 9"
  consequence: "User may be billed for 12 videos while receiving a report on 9, or for 9 with the rule undocumented; the entry shows no count of videos used"
  p_typical: 0.06
  grounded: inferred
  evidence: "A Report produces one output covering all selected videos, not one per video."
  proposed: "Bill only videos actually used and show \"9 of 12 videos used\" on the entry"
  shallow: false
- id: cost-9
  title: "Quota exhausted at Submit: no message, no state and no redirect rule"
  level: L3
  cell: {surface: quota-or-limit-message, permission-and-plan: quota-exhausted-at-submit, action: submit, mode: report}
  object: "Submit button and the redirect rule \"On submit the user is redirected to the History tab\""
  situation: "User has used all of the plan's runs or video-minutes and presses Submit after composing a 2000-character prompt"
  consequence: "Spec does not say whether Submit is disabled, shows an error, redirects to History with a Failed or Queued entry, or loses the typed prompt"
  p_typical: 0.12
  grounded: quote
  evidence: "On submit the user is redirected to the History tab, where a new entry appears with whatever was submitted."
  proposed: "Disable Submit and show remaining quota before the user composes; if exhausted at Submit, stay on the form and keep the inputs"
  shallow: false
- id: cost-10
  title: "Quota rejection arrives only after the redirect because there is no loading page"
  level: L3
  cell: {surface: redirect-transition, time-and-connection: redirect-lands-before-entry-exists, run-status: failed-before-start-validation, permission-and-plan: quota-exhausted-at-submit}
  object: "Redirect to the History tab with no loading page"
  situation: "Submit is accepted by the client and redirects at once; the server then rejects the run because quota ran out between page load and Submit (page open for hours)"
  consequence: "User sees a new entry flip to Failed with no reason text, or never appears; the spec's no-wait design means validation errors have no place to show"
  p_typical: 0.05
  grounded: inferred
  evidence: "There is no loading page, to save the user's time."
  proposed: "Specify an entry status and reason string \"Not run: quota exhausted\" and that the inputs can be reopened from the entry"
  shallow: false
- id: cost-11
  title: "Quota unit is not defined: runs, videos or video-minutes"
  level: L3
  cell: {surface: quota-or-limit-message, permission-and-plan: quota-remaining, videos-selected: "2-5", mode: ask-question}
  object: "Spec has no quota or plan section; Submit button"
  situation: "Plan allows \"100 units\"; a 3-video Ask question and a 90-video Report both exist"
  consequence: "Without a unit the UI cannot show remaining quota, and Finance cannot price a plan tier; follow-ups may or may not deduct"
  p_typical: 0.07
  grounded: speculative
  evidence: none
  proposed: "Define the metered unit (video-minutes read, plus follow-ups) and the text of the remaining-quota label"
  shallow: false
- id: cost-12
  title: "No usage meter anywhere on the agent page or History tab"
  level: L3
  cell: {surface: history-tab, permission-and-plan: quota-remaining, time-and-connection: steady-state, entry-point-and-lifecycle-phase: arriving-from-nav}
  object: "Agent page and History tab (neither lists a usage or balance element)"
  situation: "User opens the agent page late in a billing period after 30 runs"
  consequence: "User cannot see runs or minutes left until Submit fails; Finance gets surprise-overage complaints"
  p_typical: 0.12
  grounded: inferred
  evidence: "Lists past and current submissions from both modes. History is per user."
  proposed: "Add a usage line \"X of Y video-hours used this period, resets <date>\" at the top of the agent page"
  shallow: false
- id: cost-13
  title: "Double-click on Submit may create two entries and two charges"
  level: L3
  cell: {surface: submit-button, action: double-submit, run-status: submitted-not-yet-visible-in-history, time-and-connection: redirect-lands-before-entry-exists}
  object: "Submit button and the redirect"
  situation: "Slow network; user clicks Submit twice within 1 second before the redirect occurs"
  consequence: "Two History entries with identical content, both billed; the spec gives no idempotency rule"
  p_typical: 0.08
  grounded: inferred
  evidence: "a new entry appears with whatever was submitted."
  proposed: "Disable Submit on first click and create the entry with a client-generated id so duplicates are rejected"
  shallow: false
- id: cost-14
  title: "Redirect fails after the server accepted the run and the user resubmits"
  level: L4
  cell: {surface: redirect-transition, time-and-connection: submit-succeeds-redirect-fails, action: submit, run-status: submit-accepted-but-entry-never-created}
  object: "Redirect to the History tab"
  situation: "Submit returns 200 and the run is billed, but the navigation to History fails or the entry is not visible after 10 seconds; user presses Submit again"
  consequence: "Test: after two Submits, History shows 2 entries and quota drops by 2 runs; user believes only one was charged"
  p_typical: 0.04
  grounded: speculative
  evidence: none
  proposed: "Make the run id appear on the form after Submit and refuse a second Submit with the same inputs within 60 seconds"
  shallow: false
- id: cost-15
  title: "Ingestion cost is separate from run cost but the spec does not say who pays or whether uploads draw on the same quota"
