- id: contract-1
  title: "Empty-prompt Report over 12 videos has no fixed default section list or order, so two done reports on the same study cannot be compared side by side"
  level: L4
  cell: {surface: history-entry-detail, mode: report, videos-selected: 6-20, text-input-state: prompt-empty, run-status: done, output-claim-type: recommendation}
  object: "Report mode field 'Prompt / instructions (optional)'; History entry detail of a done Report"
  situation: "Runner submits 12 videos with an empty prompt in week 1 and 14 videos with an empty prompt in week 3; opens both entries"
  consequence: "Week 1 report has 'Summary / Themes / Quotes'; week 3 has 'Overview / Pain points / Recommendations'. Stakeholder cannot see which themes moved because headings and order differ run to run"
  p_typical: 0.09
  grounded: quote
  evidence: "Prompt / instructions (optional)"
  proposed: "Spec line: empty prompt yields exactly these H2 sections in this order: Summary, Coverage, Findings, Conflicting evidence, Recommendations, Not answerable; a section with no content still renders with 'None'"
  shallow: false
- id: contract-2
  title: "'One output covering all selected videos' does not say whether the default Report contains 12 per-video sections, only cross-video themes, or both"
  level: L3
  cell: {surface: history-entry-detail, mode: report, videos-selected: 6-20, text-input-state: prompt-empty, run-status: done, output-claim-type: cross-video-comparison}
  object: "Clarification 'A Report produces one output covering all selected videos, not one per video.'"
  situation: "Empty prompt, 12 videos selected; no instruction on structure"
  consequence: "Agent may return 12 per-video summaries stitched together (one output, but no synthesis) or themes with no per-video trace; stakeholder wanting 'what did session 7 show' or 'what is the pattern' gets only one of the two"
  p_typical: 0.12
  grounded: quote
  evidence: "A Report produces one output covering all selected videos, not one per video."
  proposed: "Spec line: default Report is cross-video themes first; per-video detail appears only as a collapsed appendix of one paragraph per video, max 80 words each"
  shallow: false
- id: contract-3
  title: "'N of M' count denominator is undefined: videos, sessions or participants, which differ when one video has 2 participants or 2 uploads are the same session"
  level: L4
  cell: {surface: history-entry-detail, mode: report, videos-selected: 6-20, text-input-state: prompt-empty, run-status: done, output-claim-type: count-or-proportion, video-state: duplicate-name-different-content}
  object: "Report output finding lines; Add video pop-up selection of 12 videos"
  situation: "12 videos selected: 1 is a paired session with 2 participants, 2 are the same session uploaded in two parts"
  consequence: "Report says '5 of 12 participants' when there are 12 videos, 11 sessions and 12 people; stakeholder quotes the wrong denominator in a roadmap review"
  p_typical: 0.05
  grounded: inferred
  evidence: "the user selects videos from their ingested videos"
  proposed: "Spec line: counts are stated as 'N of M videos' unless a participant id is known per video; the unit word is mandatory in every count"
  shallow: false
- id: contract-4
  title: "Denominator after an unusable video: a finding reads '5 of 12' when 1 silent video contributed nothing, instead of '5 of 11 usable'"
  level: L4
  cell: {surface: history-entry-detail, mode: report, videos-selected: 6-20, text-input-state: prompt-empty, run-status: done, output-claim-type: count-or-proportion, per-video-outcome-within-run: one-video-unusable}
  object: "Report output counts; video-state silent-or-no-transcript inside a 12-video selection"
  situation: "1 of 12 selected videos has no audio track; run still completes"
  consequence: "Every proportion in the report is understated by one video, and a finding that is actually a majority (6 of 11) reads as a minority (6 of 12)"
  p_typical: 0.04
  grounded: inferred
  evidence: "A Report produces one output covering all selected videos"
  proposed: "Acceptance criterion: count denominators use usable videos and the Coverage section states 'Counts use 11 of 12 videos; excluded: <name> (no audio)'"
  shallow: false
- id: contract-5
  title: "Unquantified words ('most users', 'many participants', 'a few') are allowed in the default Report, so a stakeholder cannot tell 3 of 12 from 10 of 12"
  level: L4
  cell: {surface: history-entry-detail, mode: report, videos-selected: 6-20, text-input-state: prompt-empty, run-status: done, output-claim-type: count-or-proportion}
  object: "Findings section of the Report output on the History entry detail"
  situation: "Empty prompt; agent writes in default narrative style"
  consequence: "'Most participants struggled with filters' is forwarded to the exec; 'most' turns out to be 4 of 12 when someone checks the videos"
  p_typical: 0.06
  grounded: inferred
  evidence: "Prompt / instructions (optional)"
  proposed: "Content rule: every frequency claim carries an explicit 'N of M videos'; the words most, many, several, few never appear without one on the same line"
  shallow: false
- id: contract-6
  title: "Percentages over small N: '42% of participants' printed for 5 of 12 videos implies a precision the sample does not have"
  level: L4
  cell: {surface: history-entry-detail, mode: report, videos-selected: 6-20, text-input-state: prompt-empty, run-status: done, output-claim-type: count-or-proportion}
  object: "Count-or-proportion claims in the Report output"
  situation: "Agent converts counts to percentages for a 12-video selection"
  consequence: "Slide deck shows '42%' next to survey data from 2,000 respondents; readers weigh both equally"
  p_typical: 0.03
  grounded: speculative
  evidence: "none"
  proposed: "Content rule: when M < 20 the report prints fractions ('5 of 12') and no percentages"
  shallow: false
- id: contract-7
  title: "Findings that conflict across videos (4 of 12 found checkout easy, 5 of 12 got stuck) have no presentation rule, so the agent may average them into 'mixed feedback'"
  level: L4
  cell: {surface: history-entry-detail, mode: report, videos-selected: 6-20, text-input-state: prompt-empty, run-status: done, output-claim-type: cross-video-comparison}
  object: "Single synthesis Report ('one output covering all selected videos')"
  situation: "Videos disagree on the same task; prompt is empty so no instruction on disagreement"
  consequence: "Either the minority view disappears or both collapse to 'mixed'; stakeholder cannot see the split or which participant segment held which view"
  p_typical: 0.07
  grounded: quote
  evidence: "A Report produces one output covering all selected videos, not one per video."
  proposed: "Content rule: a conflicting finding lists each side with its own 'N of M' and at least 1 quote per side, under a 'Conflicting evidence' heading"
  shallow: false
- id: contract-8
  title: "Severity or priority labels in the default Report have no defined scale (P0-P3, High/Med/Low, Nielsen 0-4) or basis (frequency, impact, both)"
  level: L3
  cell: {surface: history-entry-detail, mode: report, videos-selected: 6-20, text-input-state: prompt-empty, run-status: done, output-claim-type: severity-or-priority}
  object: "Findings in the Report output; spec has no output format section"
  situation: "Empty prompt; agent labels some findings 'Critical' and others 'P1' in the same report"
  consequence: "PM imports the report into a backlog that uses P0-P3; 'Critical' and 'High' have no mapping, and a 1-of-12 finding is ranked above an 8-of-12 one with no stated reason"
  p_typical: 0.08
  grounded: inferred
  evidence: "none"
  proposed: "Spec line: default severity is High/Medium/Low, defined as High = blocks task completion in at least 1 video, Medium = causes delay or error recovered, Low = cosmetic or preference; the definition is printed in the report footer"
  shallow: false
- id: contract-9
  title: "Re-running the same 12 videos with an empty prompt can move a finding from High to Medium, and the entry stores no severity rubric to explain the change"
  level: L4
  cell: {surface: history-entry-detail, mode: report, videos-selected: 6-20, text-input-state: prompt-empty, run-status: superseded-by-re-run, output-claim-type: severity-or-priority}
  object: "Two History entries with identical video sets and empty prompts"
  situation: "Runner re-submits the same selection a day later to get a fresh copy"
  consequence: "Stakeholder who received both versions sees the 'filter discoverability' issue drop a severity level with no change in evidence and loses trust in all labels"
  p_typical: 0.03
  grounded: speculative
  evidence: "none"
  proposed: "Acceptance criterion: severity assignment follows the printed rubric; QA runs the same 12-video input 3 times and severity labels match in at least 90% of findings"
  shallow: false
- id: contract-10
  title: "Whether an empty-prompt Report includes Recommendations at all is unspecified; some research teams forbid design recommendations in findings reports"
  level: L3
  cell: {surface: history-entry-detail, mode: report, videos-selected: 6-20, text-input-state: prompt-empty, run-status: done, output-claim-type: recommendation}
  object: "Prompt / instructions (optional) left empty; Report output"
  situation: "Research lead forwards the report to engineering; it contains 'Add a tooltip to the filter icon'"
  consequence: "Engineering builds the agent's recommendation as if it were the research team's decision; the research lead had wanted findings only"
  p_typical: 0.06
  grounded: quote
  evidence: "Prompt / instructions (optional)"
  proposed: "Spec line: default Report includes a Recommendations section labelled 'Agent-suggested, not reviewed'; placeholder text in the prompt field says 'Leave empty for findings + suggested recommendations'"
  shallow: false
- id: contract-11
  title: "Recommendations are not required to cite the finding they address, so a recommendation like 'add dark mode' can appear with no evidence in any of the 12 videos"
  level: L4
  cell: {surface: history-entry-detail, mode: report, videos-selected: 6-20, text-input-state: prompt-empty, run-status: done, output-claim-type: recommendation}
  object: "Recommendations section of the Report output"
  situation: "Agent adds generic product advice from training data rather than from the videos"
  consequence: "Stakeholder cannot tell evidence-backed recommendations from model boilerplate; one generic item undermines the rest"
  p_typical: 0.04
  grounded: speculative
  evidence: "none"
  proposed: "Content rule: each recommendation references 1 or more finding ids (F1, F2...); a recommendation with no finding id is not emitted"
  shallow: false
- id: contract-12
  title: "Minimum evidence for a finding is undefined: a behaviour seen in 1 of 12 videos can be stated as a finding with the same weight as one seen in 9 of 12"
  level: L4
  cell: {surface: history-entry-detail, mode: report, videos-selected: 6-20, text-input-state: prompt-empty, run-status: done, output-claim-type: insufficient-evidence-statement}
  object: "Findings section of the Report output"
  situation: "One participant comments on pricing; no other video mentions it"
  consequence: "'Users find pricing unclear' appears as a headline finding; the stakeholder acts on a single remark"
  p_typical: 0.05
  grounded: inferred
  evidence: "A Report produces one output covering all selected videos"
  proposed: "Content rule: a finding needs at least 1 verbatim quote with timestamp and a count; items seen in exactly 1 video go under 'Single observations', not Findings"
  shallow: false
- id: contract-13
  title: "No rule that each finding carries a quote plus video name plus timestamp, or the citation format ('[Session 4 - 12:31]'), so some findings have quotes and some have none"
  level: L4
  cell: {surface: history-entry-detail, mode: report, videos-selected: 6-20, text-input-state: prompt-empty, run-status: done, output-claim-type: timestamp-citation, observer-location-at-status-change: inside-entry-detail}
  object: "Finding entries in the Report output; cited-video-timestamp-player surface"
  situation: "Stakeholder checks the 3 highest-severity findings before a decision meeting"
  consequence: "2 of 3 findings have no citation, so the stakeholder must scrub 12 videos (several hours) to verify them or take them on trust"
  p_typical: 0.07
  grounded: inferred
  evidence: "none"
  proposed: "Content rule: every finding shows at least 1 citation as '\"<quote>\" - <video name>, mm:ss' (hh:mm:ss for videos over 60 min), and the timestamp is a link that opens the player at that second"
  shallow: false
- id: contract-14
  title: "Findings based on silent behaviour (participant hovers 40 s, says nothing) have no citation form, since there is no quote to give"
  level: L3
  cell: {surface: history-entry-detail, mode: report, videos-selected: 6-20, text-input-state: prompt-empty, run-status: done, output-claim-type: timestamp-citation}
  object: "Quote-plus-timestamp citation in the Report; video-state silent-or-no-transcript"
  situation: "Agent infers hesitation from screen activity in 3 of 12 videos"
  consequence: "Either the finding is dropped for lack of a quote, or the agent invents a quote; the stakeholder cannot distinguish observed behaviour from speech"
  p_typical: 0.03
  grounded: speculative
  evidence: "none"
  proposed: "Content rule: non-verbal evidence is cited as a time range with a description in brackets: '[hovers over Filters, no click] - Session 7, 04:10-04:52'"
  shallow: false
- id: contract-15
  title: "Text inside quotation marks may be a cleaned or paraphrased transcript line, with no marker separating verbatim quotes from paraphrase"
  level: L4
  cell: {surface: history-entry-detail, mode: report, videos-selected: 6-20, text-input-state: prompt-empty, run-status: done, output-claim-type: verbatim-quote}
  object: "Quoted participant text in the Report output"
  situation: "Agent removes 'um', fixes grammar, or merges two sentences 30 s apart into one quote"
  consequence: "Stakeholder puts the quote on a slide as the participant's words; on playback at the cited timestamp the words differ"
  p_typical: 0.06
  grounded: inferred
  evidence: "none"
  proposed: "Content rule: quotation marks only around exact transcript text from one contiguous segment; paraphrase has no quotation marks and is prefixed 'Paraphrase:'; QA spot-checks 10 quotes per report against the transcript"
  shallow: false
- id: contract-16
  title: "Moderator speech can be quoted as participant evidence ('So this part is confusing?' - 'Yeah'), because no speaker-attribution rule exists for quotes"
  level: L4
  cell: {surface: history-entry-detail, mode: report, videos-selected: 6-20, text-input-state: prompt-empty, run-status: done, output-claim-type: verbatim-quote}
  object: "Quotes in the Report output; ingested transcripts of moderated sessions"
  situation: "6 of 12 videos are moderated; moderator asks leading questions"
  consequence: "Report counts a leading question answered 'yeah' as the participant finding the step confusing, inflating the count"
  p_typical: 0.04
  grounded: speculative
  evidence: "none"
  proposed: "Content rule: only participant-attributed speech is quoted as evidence; if speaker labels are missing for a video, the Coverage section says so for that video"
  shallow: false
- id: contract-17
  title: "No explicit 'Not answerable from the selected videos' outcome: a default section (e.g. task success rate) is filled with invented numbers when the 12 videos are interviews with no tasks"
  level: L4
  cell: {surface: history-entry-detail, mode: report, videos-selected: 6-20, text-input-state: prompt-empty, run-status: done, output-claim-type: insufficient-evidence-statement}
  object: "Default Report sections on the History entry detail"
  situation: "Empty prompt; videos are open-ended interviews rather than task-based tests"
  consequence: "Report shows 'Task completion: 75%' derived from nothing; stakeholder repeats it"
  p_typical: 0.05
  grounded: speculative
  evidence: "none"
  proposed: "Content rule: a default section the videos cannot support renders the literal line 'Not answerable from the selected videos: <one-line reason>' instead of content"
  shallow: false
- id: contract-18
  title: "Whole-run insufficiency (12 selected videos are product demos, not tests) has no defined outcome: Done with a placeholder report, Done with a warning, or Failed"
  level: L3
  cell: {surface: history-entry-detail, mode: report, videos-selected: 6-20, text-input-state: prompt-empty, run-status: done-with-empty-output, output-claim-type: insufficient-evidence-statement, history-state: 1-entry}
  object: "History entry status (spec lists entry statuses as unspecified); Report output"
  situation: "Runner selects 12 marketing videos by tag mistake; nothing in them is user-test content"
  consequence: "Entry shows Done and a confident generic report, or a short apology; stakeholder receives either with no status signal that the input was unfit"
  p_typical: 0.04
  grounded: quote
  evidence: "Statuses an entry can have on the History tab, and what opening an entry shows while running, when done, and when failed."
  proposed: "Spec line: when no finding meets the minimum evidence rule, the entry is Done with a 'No findings' banner and the output is a single 'Not answerable from the selected videos' statement plus the coverage list"
  shallow: false
- id: contract-19
  title: "Cross-video comparison table has no rule for cells with no evidence, so a blank cell reads as 'did not happen' when it means 'not observed or not asked'"
  level: L4
  cell: {surface: history-entry-detail, mode: report, videos-selected: 6-20, text-input-state: prompt-empty, run-status: done, output-claim-type: cross-video-comparison}
  object: "Comparison table in the Report output (videos as rows, themes as columns)"
  situation: "Session 9 ends before the checkout task; table shows nothing under 'Checkout issues' for Session 9"
  consequence: "Stakeholder counts Session 9 as a clean checkout and reports 'only 3 of 12 had checkout issues' when only 8 reached checkout"
  p_typical: 0.03
  grounded: speculative
  evidence: "none"
  proposed: "Content rule: comparison cells use 3 explicit values - observed (with citation), not observed, not covered in video - never blank"
  shallow: false
- id: contract-20
  title: "Default Report length and finding count are unbounded for 6-20 videos; no target such as 'top 10 findings, max 1,500 words' is set"
  level: L4
  cell: {surface: history-entry-detail, mode: report, videos-selected: 6-20, text-input-state: prompt-empty, run-status: done, output-claim-type: severity-or-priority}
  object: "Report output on the History entry detail; prompt field left empty"
  situation: "20 videos of 60 minutes each, no instructions"
  consequence: "One run gives 4 findings, another gives 37; a stakeholder reading on a phone between meetings cannot find the top issues"
  p_typical: 0.06
  grounded: quote
  evidence: "Prompt / instructions (optional)"
  proposed: "Spec line: default Report caps Findings at 10 ordered by severity then count, with remaining items listed one line each under 'Other observations'"
  shallow: false
- id: contract-21
  title: "Default Report may list only problems; whether a 'What worked' section with its own counts and quotes appears is unspecified"
  level: L3
  cell: {surface: history-entry-detail, mode: report, videos-selected: 6-20, text-input-state: prompt-empty, run-status: done, output-claim-type: paraphrase}
  object: "Default Report sections when 'Prompt / instructions (optional)' is empty"
  situation: "10 of 12 participants complete onboarding quickly; 2 hit a bug"
  consequence: "Report reads as entirely negative; stakeholder deprioritises an onboarding flow that works for most participants"
  p_typical: 0.04
  grounded: inferred
  evidence: "Prompt / instructions (optional)"
  proposed: "Spec line: default Report includes 'What worked' with the same N-of-M and citation rules as Findings"
  shallow: false
- id: contract-22
  title: "Summary paragraph is a paraphrase with no link to the findings it condenses, so a claim in the summary may have no supporting finding below"
  level: L4
  cell: {surface: history-entry-detail, mode: report, videos-selected: 6-20, text-input-state: prompt-empty, run-status: done, output-claim-type: paraphrase}
  object: "Summary at the top of the Report output"
  situation: "Stakeholder reads only the summary (first 5 lines) and forwards it"
  consequence: "Summary says 'participants disliked the new nav'; no finding, quote or count below supports it"
  p_typical: 0.04
  grounded: speculative
  evidence: "none"
  proposed: "Content rule: every summary sentence ends with the finding ids it condenses '(F2, F5)'; QA asserts each id exists in Findings"
  shallow: false
- id: contract-23
  title: "Claims not observable in video (participant age, job title, 'power users') can appear as findings, since the Report has no rule restricting claims to what the videos show"
  level: L4
  cell: {surface: history-entry-detail, mode: report, videos-selected: 6-20, text-input-state: prompt-empty, run-status: done, output-claim-type: count-or-proportion}
  object: "Report output; Videos page metadata (name, tags only)"
  situation: "Agent infers 'participants aged 25-34' from voices or appearance, or segments by 'experienced users' with no source"
  consequence: "Stakeholder segments the roadmap by a demographic split the agent guessed; inferring age or ethnicity from appearance also raises a privacy issue"
  p_typical: 0.03
  grounded: speculative
  evidence: "The pop-up supports filtering by the tags the user has applied to videos, and searching by name."
  proposed: "Content rule: participant attributes appear only if stated in the video or in a video tag, and are cited as such; no inference from voice or appearance"
  shallow: false
