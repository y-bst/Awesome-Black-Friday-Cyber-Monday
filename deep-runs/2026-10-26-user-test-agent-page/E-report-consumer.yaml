- id: consumer-1
  title: "Report entry detail (done) has no specified copy, export, PDF or share control, so the runner screenshots the report to send it to the exec"
  level: L3
  cell: {surface: export-or-copy-output, action: share-or-export-not-in-spec, run-status: done, actor: report-recipient-without-access, mode: report}
  object: "History entry detail of a Report run; spec section 'History tab'"
  situation: "Run is done; runner wants to send the single report covering 8 videos to a client who has no account"
  consequence: "Only path out of the History tab is screenshots or manual select-and-copy; long reports are split across 4-6 images, citations are lost, recipient cannot search the text"
  p_typical: 0.35
  grounded: quote
  evidence: "History tab: Lists past and current submissions from both modes. History is per user."
  proposed: "Spec line: entry detail (status done) shows Copy (markdown + rich text), Download PDF and Copy link; each disabled while status is not done"
  shallow: false
- id: consumer-2
  title: "A copied entry URL opened by a teammate hits 'History is per user': the page shown (404, 'no access', request-access) is unspecified"
  level: L4
  cell: {surface: history-entry-detail, actor: other-user-same-workspace, action: share-or-export-not-in-spec, history-state: 1-entry}
  object: "Spec sentence 'History is per user, currently.'; History entry detail URL"
  situation: "Runner pastes the browser URL of an entry into Slack; a designer in the same workspace clicks it"
  consequence: "Designer lands on their own empty History tab or a generic 404 with no hint that the entry exists but is private; runner believes they shared it"
  p_typical: 0.25
  grounded: quote
  evidence: "History is per user, currently."
  proposed: "Acceptance criterion: non-owner opening an entry URL sees 'This entry belongs to <name>; ask them to share it' and no output content"
  shallow: false
- id: consumer-3
  title: "Report output that contains a markdown table comparing 6-20 videos is pasted into Slack, where the table renders as raw pipes and dashes"
  level: L4
  cell: {surface: export-or-copy-output, action: copy-output, videos-selected: 6-20, mode: report}
  object: "Report output (one output covering all selected videos); output format is not specified anywhere in the spec"
  situation: "Report compares 12 videos in a 12-row table; runner selects the text on entry detail and pastes into a Slack thread and into a Google Doc"
  consequence: "Slack shows '| Video | Issue | Severity |' lines unaligned; Google Doc receives either plain text with pipes or an HTML table depending on what the copy put on the clipboard; exec reads neither"
  p_typical: 0.06
  grounded: inferred
  evidence: "A Report produces one output covering all selected videos, not one per video."
  proposed: "Spec the output format (markdown) and the clipboard payload: text/html for docs plus a Slack-safe plain-text variant where tables become bullet lists"
  shallow: false
- id: consumer-4
  title: "Copied or exported report carries no provenance block: video list, prompt, run date and agent version are absent from what the recipient receives"
  level: L4
  cell: {surface: export-or-copy-output, action: copy-output, mode: report, time-and-connection: agent-model-version-changed-since-entry}
  object: "Report output; Run name (optional), Prompt / instructions (optional), Add video selection"
  situation: "Exec receives a pasted report 3 weeks later and asks 'which sessions is this based on and what did you ask it?'"
  consequence: "Recipient cannot tell if the report covers 5 or 50 sessions, whether a leading prompt shaped it, or which agent version wrote it; runner must reconstruct from memory"
  p_typical: 0.08
  grounded: inferred
  evidence: "On submit the user is redirected to the History tab, where a new entry appears with whatever was submitted."
  proposed: "Every copy and export starts with a header: run name, N videos (names), prompt text, submitted date-time with timezone, agent version id"
  shallow: false
- id: consumer-5
  title: "Citations to video timestamps (if the output has them) open the cited-video player, which a recipient without access cannot load"
  level: L4
  cell: {surface: cited-video-timestamp-player, actor: report-recipient-without-access, action: open-cited-timestamp, mode: report}
  object: "Report output citations; Videos page (ingested videos); spec is silent on whether outputs cite videos or timestamps at all"
  situation: "Client clicks 'Session 4 at 12:31' in a forwarded report"
  consequence: "Link goes to a login wall or a 403 for the video; the evidence behind each claim is unverifiable for the person deciding on it"
  p_typical: 0.05
  grounded: inferred
  evidence: "none"
  proposed: "Spec whether outputs cite video + timestamp, the link target, and the fallback text in exports ('Session 4, 12:31' as plain text, plus optional 30-second public clip)"
  shallow: false
- id: consumer-6
  title: "Report submitted with blank run name is exported or shared under an unspecified title, producing several identical 'Untitled' files in the recipient's inbox"
  level: L4
  cell: {surface: run-name-field, text-input-state: run-name-empty, history-state: entries-with-blank-run-name, action: share-or-export-not-in-spec}
  object: "Run name (optional)"
  situation: "Runner leaves run name empty on 4 runs in one week and exports each one"
  consequence: "Exec receives Report.pdf, Report (1).pdf, Report (2).pdf and cannot tell them apart without opening each"
  p_typical: 0.07
  grounded: quote
  evidence: "Run name (optional)"
  proposed: "Spec the default title when run name is empty: '<mode> - <first video name> +N - <YYYY-MM-DD HH:mm>', used in History row, export file name and share preview"
  shallow: false
- id: consumer-7
  title: "Exporting an Ask question thread at follow-up 10: whether the export is the whole thread, the first answer, or the last answer is unspecified"
  level: L3
  cell: {surface: follow-up-thread, thread-state: follow-up-10, action: share-or-export-not-in-spec, mode: ask-question}
  object: "Spec sentence 'Follow-up questions are supported after the first answer.'"
  situation: "Runner asked 1 question and 10 follow-ups; only answers 3 and 9 matter to the designer"
  consequence: "Designer receives 11 Q&A pairs including dead ends, or only the last answer which refers to 'as above' content they never saw"
  p_typical: 0.04
  grounded: quote
  evidence: "Follow-up questions are supported after the first answer."
  proposed: "Spec per-message copy plus 'export thread' that includes all question/answer pairs with numbering; allow excluding selected turns"
  shallow: false
- id: consumer-8
