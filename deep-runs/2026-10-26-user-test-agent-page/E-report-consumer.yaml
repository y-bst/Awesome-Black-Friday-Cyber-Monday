  level: L4
  cell: {surface: follow-up-thread, thread-state: follow-up-1, action: ask-follow-up, actor: other-user-same-workspace}
  object: "Follow-up thread on a History entry; History entry detail"
  situation: "Runner shares the entry on Monday, adds 2 follow-ups on Tuesday that partly contradict the first answer; exec reopens the link Wednesday"
  consequence: "Exec quotes the Monday answer in a decision meeting while the live page now shows a revised conclusion; no timestamp tells them which version they read"
  p_typical: 0.03
  grounded: inferred
  evidence: "Follow-up questions are supported after the first answer."
  proposed: "Shared view is a snapshot at share time with a banner 'Owner added 2 follow-ups after this was shared (view latest)'"
