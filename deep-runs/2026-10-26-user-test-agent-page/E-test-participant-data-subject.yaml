  object: "History entry: 'a new entry appears with whatever was submitted'"
  situation: "Erasure request names one session video. Entries store run name, prompt and output text, but the spec does not say the selected video IDs are persisted on the entry."
  consequence: "Purge relies on text search for the participant's name, missing entries that quote them without naming them; derived data survives silently."
  p_typical: 0.05
  grounded: inferred
  evidence: "On submit the user is redirected to the History tab, where a new entry appears with whatever was submitted."
  proposed: "Acceptance criterion: every entry and every follow-up answer stores the immutable list of source video IDs; a lookup 'entries derived from video X' returns results in under 5 s."
  shallow: false
