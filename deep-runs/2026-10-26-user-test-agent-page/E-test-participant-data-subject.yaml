- id: participant-1
  title: "Source video deleted after run, but the Report entry on History keeps verbatim quotes attributed to the participant by name"
  level: L3
  cell: {surface: history-entry-detail, actor: test-participant-data-subject, video-state: deleted-after-run, run-status: done, mode: report}
  object: "History tab entry detail of a Report run; Videos page deletion"
  situation: "Participant withdraws consent 3 weeks after the session; the researcher deletes the video on the Videos page. The Report generated 2 weeks earlier still sits in the runner's History."
  consequence: "The video is gone but its most sensitive derivative (quotes plus name) lives on indefinitely; the erasure is cosmetic and the company holds personal data it promised to delete."
  p_typical: 0.12
  grounded: inferred
  evidence: "Lists past and current submissions from both modes."
  proposed: "Spec line: deleting a video triggers redaction or deletion of every History entry derived from it; entry detail shows 'Source removed: content redacted on <date>'."
  shallow: false
- id: participant-2
  title: "Multi-video Report has one combined output, so erasing 1 of 12 participants leaves no rule for whether the whole report is deleted, regenerated from 11, or redacted in place"
  level: L3
  cell: {mode: report, videos-selected: 6-20, video-state: deleted-after-run, per-video-outcome-within-run: all-videos-used, actor: test-participant-data-subject}
  object: "Clarification: 'A Report produces one output covering all selected videos, not one per video.'"
  situation: "Report covers 12 sessions; participant in session 7 requests erasure. Their statements are blended into themes like '4 of 12 users abandoned checkout'."
  consequence: "Deleting the report destroys 11 consenting sessions' analysis; keeping it keeps the withdrawn participant's data, including counts and paraphrases that cannot be stripped by find-and-replace."
  p_typical: 0.06
  grounded: quote
  evidence: "A Report produces one output covering all selected videos, not one per video."
  proposed: "Define erasure for multi-video entries: regenerate from remaining videos and mark entry 'Regenerated after source removal (11 of 12 videos)', or delete; pick one in spec."
  shallow: false
- id: participant-3
  title: "No stored lineage from History entry to source video IDs, so an erasure job cannot find which entries (out of 1000+) were derived from video X"
