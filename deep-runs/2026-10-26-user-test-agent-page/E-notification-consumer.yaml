  cell: {surface: history-entry-status-badge, run-status: failed, observer-location-at-status-change: other-page-in-app, entry-point-and-lifecycle-phase: app-closed-while-running}
  object: "Entry statuses 'when failed' (listed as unspecified)"
  situation: "Report on 6 videos fails at minute 2 (agent error); the user closed the app at minute 1 and returns 3 days later, expecting the report."
  consequence: "Three days of waiting for nothing; the stakeholder meeting the report was for has passed."
  p_typical: 0.08
  grounded: quote
  evidence: "Statuses an entry can have on the History tab, and what opening an entry shows while running, when done, and when failed."
  proposed: "Failed entries notify on the same channels as Done and carry a distinct red unread marker; the notification copy says 'failed', not 'finished'."
  shallow: false
