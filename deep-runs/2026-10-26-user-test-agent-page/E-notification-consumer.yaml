- id: notify-1
  title: "Run turns Done while the submitter is on the Videos page: the spec names no channel (toast, badge, email) that tells them"
  level: L3
  cell: {surface: notification-email-or-in-app, run-status: done, observer-location-at-status-change: other-page-in-app, entry-point-and-lifecycle-phase: post-submit-elsewhere-in-app}
  object: "History tab, 'a new entry appears with whatever was submitted'; no notification surface exists in the spec"
  situation: "User submits a Report on 4 videos, lands on History, leaves after 5 seconds for the Videos page to upload more; the run finishes 6 minutes later."
  consequence: "The only way to learn the run finished is to go back to the History tab and look; the 'save the user's time' rationale is lost to repeated manual checking."
  p_typical: 0.35
  grounded: quote
  evidence: "There is no loading page, to save the user's time. On submit the user is redirected to the History tab, where a new entry appears with whatever was submitted."
  proposed: "Spec line: on status change to Done or Failed, show an in-app toast on any page of the app with the run name and an 'Open' link, visible for 8s."
  shallow: false
- id: notify-2
  title: "Redirect copy never says 'you can leave this page; we will tell you when it is done', so the user does not know leaving is safe or how they will be told"
  level: L3
  cell: {surface: redirect-transition, run-status: queued, entry-point-and-lifecycle-phase: post-submit-same-screen, action: submit}
  object: "Redirect to History tab after Submit"
  situation: "First arrival on History after Submit with the new entry in Queued state and no expected duration or notification promise shown."
  consequence: "User either sits on History for 10+ minutes refreshing, or leaves and forgets; both outcomes follow from the missing one-line expectation."
  p_typical: 0.15
  grounded: quote
  evidence: "There is no loading page, to save the user's time."
  proposed: "Banner on redirect: 'Running. You can leave this page; we will notify you in-app [and by email] when it is ready.'"
  shallow: false
- id: notify-3
  title: "No expected duration shown for a run of 21-100 videos, so the user cannot choose between waiting 2 minutes and coming back tomorrow"
  level: L3
  cell: {surface: history-entry-status-badge, videos-selected: "21-100", video-state: 3-hour-long, run-status: running}
  object: "History entry for a run; 'Minimum and maximum number of videos per run; video length and size limits' listed as unspecified"
  situation: "User submits a Report covering 40 videos, several of them 3 hours long; the entry shows only a running state."
  consequence: "User has no basis for deciding whether to wait or leave; they check back at the wrong time and see 'Running' again with no progress."
  p_typical: 0.08
  grounded: inferred
  evidence: "Minimum and maximum number of videos per run; video length and size limits."
  proposed: "Show an ETA range on the entry row derived from total ingested minutes (e.g., '~15-25 min for 40 videos, 31 h of footage')."
  shallow: false
- id: notify-4
  title: "What 'unread' means is undefined: row seen in the list, detail opened, or output scrolled to the end"
  level: L4
  cell: {surface: history-entry-row, run-status: done-but-unread, action: mark-read, history-state: 100-entries}
  object: "History tab rows ('Lists past and current submissions from both modes')"
  situation: "User returns to History with 3 newly Done entries among 100; the list paints all 3 rows in the viewport."
  consequence: "If 'seen in list' counts as read, the unread marker vanishes before the user opens anything; if 'opened' counts, a quick glance at a detail clears an output never read."
  p_typical: 0.06
  grounded: inferred
  evidence: "Lists past and current submissions from both modes."
  proposed: "Acceptance criterion: an entry is unread from Done/Failed until its detail is opened; opening the detail marks it read; a manual 'Mark unread' exists."
  shallow: false
- id: notify-5
  title: "Entry already in view at redirect while Queued: does seeing it then count as 'read', so it is never flagged unread when it later turns Done?"
  level: L4
  cell: {surface: redirect-transition, run-status: queued, action: mark-read, observer-location-at-status-change: on-history-tab-top}
  object: "The new entry that 'appears' on History immediately after Submit"
  situation: "User lands on History, the new Queued row is the first row, user leaves; 7 minutes later the run turns Done."
  consequence: "If read-state is set by viewing, the Done entry looks identical to the ones already reviewed; the user has no cue to come back to it."
  p_typical: 0.03
  grounded: inferred
  evidence: "On submit the user is redirected to the History tab, where a new entry appears with whatever was submitted."
  proposed: "Unread state starts at the transition to Done/Failed, never at creation; viewing a non-terminal entry does not mark it read."
  shallow: false
- id: notify-6
  title: "A Failed entry is not counted in any unread badge, so a run that failed 2 minutes after the user left is discovered days later"
