- id: privacy-19
  case: >-
    This is not this feature's job. The frame scopes the work to the agent page (Report, Ask question, History), and the
    spec treats the Videos page and ingestion as an existing, separate system ("Videos come from a separate Videos page
    where users upload and videos get ingested"). Ingestion already runs today, before any agent run exists, so whatever
    transcription vendor and region it uses is a fact of the shipped product, not something this agent page introduces or
    can change; adding the agent page creates no new transfer at upload time. The evidence is purely inferred: nothing in
    the spec says transcription happens at ingestion, that a separate vendor is involved, or that non-English audio is
    routed differently, and the leaf's own p_typical is 0.04. The real data-flow question for this feature (what the agent
    vendor receives, retains or trains on) is already captured by participant-37 in this same top 25, so this leaf mostly
    duplicates it from the wrong surface. The right home is the company's DPA / subprocessor list or a Videos-page
    ticket, which can be answered by legal at any time without touching the agent page build. Defer to the ingestion owner.
- id: contract-4
  case: >-
    Defer: this is a report-quality tuning detail that sits downstream of a decision the PM must make anyway in
    backend-3 (does a report with one transcript-less video fail or complete without it) and popup-25 / firsttime-30
    (is a silent video flagged at all). Once the spec says "a video with no transcript is excluded and listed as
    excluded", the correct denominator follows as a reasonable default and a prompt-level instruction; it does not need its
    own acceptance criterion. The scenario is narrow (p_typical 0.04: a silent video inside a 6-20 video report whose output
    happens to state a count-style proportion), and the harm is an off-by-one that the reader can see if the report lists its
    source videos. It is also cheap to fix after launch: denominator wording lives in the agent's output template / system
    prompt and can be changed without UI, schema or migration work. Specifying count-denominator rules now is
    over-specifying model output before anyone has seen a real report; fold it into the backend-3 decision rather than
    keeping it as a separate spec line.
- id: popup-25
  case: >-
    Largely a duplicate and partly improbable. firsttime-30, output-10 and backend-3 in this same top 25 already cover the
    silent-video case (no warning, confident output, report-level failure handling); this leaf only moves the warning to
    the pop-up row, which is a design choice inside the fix, not a separate gap. Its own grounding is "speculative" with
    evidence "none": the spec says only ingested videos are selectable, and a pipeline that knows it produced an empty
    transcript can just as reasonably mark that ingestion as failed, which the spec already lists as an open question
    ("whether a video that... failed ingestion can be selected") that the PM will answer anyway. User-test recordings are
    overwhelmingly think-aloud sessions with speech, so a silent 4-minute screen recording being chosen for Ask question is
    rare (p_typical 0.05). A badge is a cheap, additive UI change that can ship in a later iteration once ingestion exposes
    a "no speech" flag. Accept the ingested/failed decision as the cover and defer the badge.
- id: backend-16
  case: >-
    Covered by a reasonable default. "Follow-up questions are supported after the first answer" already implies a
    conversation about "the selected videos"; every chat-over-documents implementation an engineer would build keeps the
    original context (the same transcripts) in the thread, and answering a follow-up only from the prior answer text would
    be a bug, not a plausible reading of the spec. The PM does not need to specify that the second question can see the
    same videos as the first any more than they need to specify that it can see the question. Where real choices exist
    (context window budget, whether to re-retrieve or cache) they are engineering implementation details that the backend
    owner decides and can change later without user-visible spec impact, and the context-size question is already raised
    by backend-1. If anything is worth a line, it is a one-sentence clarification in the engineering ticket, not a product
    decision gating build. Accept as implied; at most add a single acceptance test.
- id: contract-17
  case: >-
    The scenario rests on an assumption the spec does not make: that Report mode has fixed "default sections" such as task
    success rate. The spec defines no output template at all, so the "invented 75% task completion" failure only exists if
    the team later chooses a rigid template, and whoever writes that template decides its empty-section behaviour at the same
    time. The users here are UX researchers who know whether their 12 videos are interviews or task tests and, when they
    leave the prompt empty, get whatever generic summary the agent produces; a well-written system prompt ("only report
    what the videos support") is the standard default and handles this without a literal spec string. The broader
    "don't fabricate" concern is already carried by several items in the top 25 (output-10, modality-3, contract-12), so
    this adds a specific copy line rather than a new gap. p_typical is 0.05 and the evidence is inferred. Defer until
    the report template exists; then the not-answerable wording is a one-line copy decision that is cheap to add.
