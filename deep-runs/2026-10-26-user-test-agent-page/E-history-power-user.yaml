- id: history-1
  title: "Row label for a run with a blank run name is unspecified; 250 of 500 rows would have no title"
  level: L3
  cell: {surface: history-entry-row, history-state: entries-with-blank-run-name, text-input-state: run-name-empty, action: open-history-entry}
  object: "Report form 'Run name (optional)' and the History tab entry row"
  situation: "User has 500 entries, about 250 submitted with the run name left empty, and scans the list to find one"
  consequence: "250 rows render as empty or identical lines; the only way to tell them apart is to open each one (up to 250 opens)"
  p_typical: 0.30
  grounded: quote
  evidence: "Run name (optional)"
  proposed: "Specify the fallback row label (for example first 60 chars of prompt, else video names, else 'Untitled report' plus timestamp)"
