- id: a11y-13
  title: Failed entry gives no stated error text or focus target for screen-reader users
  level: L4
  cell:
    surface: history-entry-detail
    run-status: failed
    action: open-history-entry
    actor: creator-owner
  object: Entry detail while 'failed' (spec leaves 'what opening an entry shows ... when failed' unspecified)
  situation: User opens a Failed entry; detail shows a red banner.
  consequence: Banner not in a role=alert or not focused; screen-reader user reads the original prompt and the video list first and never reaches the reason for failure; no accessible retry cue because
    re-run is not in the spec.
  p_typical: 0.05
  grounded: inferred
  evidence: none
  proposed: Failure reason as the first element after the entry heading, rendered as text with an icon that has a text alternative.
  shallow: false
- id: a11y-37
  title: Opening a History entry has no stated focus target, heading, or return path to the same row
  level: L4
  cell:
    surface: history-entry-detail
    action: open-history-entry
    history-state: 100-entries
    run-status: done
  object: '''what opening an entry shows while running, when done, and when failed'''
  situation: Keyboard user opens entry 47 of 100, reads it, and closes it (Esc or a Back link).
  consequence: If detail is an in-page panel with no focus move, the screen reader says nothing and the user keeps reading the list; on close, focus returns to the top of the list and they must Tab 47 times
    to get back.
  p_typical: 0.08
  grounded: quote
  evidence: what opening an entry shows while running, when done, and when failed
  proposed: Open to a page with the entry title as h1 and focus on it; on back, focus returns to the originating row.
  shallow: false
- id: a11y-38
  title: Markdown or HTML typed in the prompt or question is echoed in the History entry and may be read as markup
  level: L4
  cell:
    surface: history-entry-detail
    text-input-state: text-contains-html-or-markdown
    action: open-history-entry
    mode: report
  object: '''a new entry appears with whatever was submitted'''
  situation: Prompt contains '## Summary' and '<b>bold</b>' or a 400-character line of asterisks.
  consequence: If rendered as markdown, a heading level 2 appears inside the echoed prompt and breaks the page's heading outline; if rendered as raw text, screen readers read 'hash hash Summary' and each
    symbol; if sanitised silently, the echoed prompt no longer matches what the user typed.
  p_typical: 0.02
  grounded: quote
  evidence: a new entry appears with whatever was submitted
  proposed: Echo prompt as plain text in a labelled block; render only the agent output as markdown with headings starting at h3.
  shallow: false
  also_from:
  - prompt-26
- id: a11y-39
  title: Report output on done has no stated structure, so headings, tables and lists in a multi-video Report may be unnavigable
  level: L4
  cell:
    surface: history-entry-detail
    run-status: done
    videos-selected: 21-100
    mode: report
  object: '''A Report produces one output covering all selected videos, not one per video.'''
  situation: One Report covers 40 videos; the output is a single long block with no per-video sections.
  consequence: Screen-reader user cannot jump to the section about video 23; a table rendered as divs is read as a flat run of cells; the output heading level may start at h1 and duplicate the page title.
  p_typical: 0.04
  grounded: quote
  evidence: A Report produces one output covering all selected videos, not one per video.
  proposed: Require the output to use real headings per video name and real table markup, nested under the entry's h1.
  shallow: false
