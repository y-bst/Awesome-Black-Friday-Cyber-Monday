- id: modality-1
  verdict: keep
  confidence: 0.7
  reason: What the agent can see (speech only vs screen events/frames) decides whether Ask question answers behavioural questions truthfully; it is fixed by the index and costly to change after launch, and one line closes it.
- id: backend-1
  verdict: keep
  confidence: 0.8
  reason: Spec mandates one report over all selected videos yet sets no limit; silent truncation behind a "covers all 20" header can't be detected, and the cap shapes pop-up/Submit validation, so it must be decided before build.
- id: firsttime-30
  verdict: accept
  confidence: 0.7
  reason: Same root as output-10 (ingested video with no speech); one shared no-speech rule covers Ask question too, so no separate spec line is needed.
- id: output-10
  verdict: keep
  confidence: 0.55
  reason: The spec already has to define video readiness states (open item); adding "ingested, no speech" and its rule is cheap, and otherwise a fabricated report from an empty source can't be detected.
- id: speaker-2
  verdict: defer
  confidence: 0.65
  reason: Telling leading-question assent apart from real findings is a judgement-heavy eval concern with no reliably testable criterion; the speaker-label contract it depends on is handled under speaker-1.
- id: range-18
  verdict: defer
  confidence: 0.75
  reason: Silent truncation is removed by backend-1's cap/merge rule; what's left is a time-range selector, which is a new feature that can be added later without breaking anything.
- id: contract-15
  verdict: keep
  confidence: 0.6
  reason: Quotes are what readers lift from a research report; "quotation marks only around exact transcript text" is a cheap, testable output-contract line, and fabricated-looking quotes erode trust before any later fix.
- id: modality-3
  verdict: accept
  confidence: 0.7
  reason: One instance of modality-1's rule (say so when a needed modality isn't indexed); a separate on-screen-text copy line adds nothing once that rule exists.
- id: speaker-1
  verdict: keep
  confidence: 0.6
  reason: Moderated sessions are the common input, and whether "ingested" includes speaker roles decides report correctness and requires re-ingestion if found late; even the skeptic concedes the PM must confirm it before build.
- id: participant-37
  verdict: keep
  confidence: 0.55
  reason: Submit creates a new flow of participant data to a model vendor that can't be recalled once sent; naming the retention/no-training terms and their owner costs little and must happen before real data flows.
- id: participant-1
  verdict: defer
  confidence: 0.6
  reason: A real erasure gap, but it belongs to a cross-system retention model; History is private per user and entries already record what was submitted, so the cascade can be added later without migration.
- id: participant-31
  verdict: accept
  confidence: 0.6
  reason: There is no sharing/export path and History is per user; naming practice varies by team and the optional prompt lets researchers ask for pseudonyms, so accept model default for v1.
- id: contract-5
  verdict: defer
  confidence: 0.6
  reason: A style rule for the system prompt with no UI/state impact, cheap to tune once real reports exist; the optional prompt field is the lever until then.
- id: lowvision-25
  verdict: keep
  confidence: 0.65
  reason: Statuses must be specified anyway and the History badge is the only success/failure signal after redirect; adding "text + icon, not colour alone" to that same line costs nothing (skeptic conceded).
- id: contract-12
  verdict: defer
  confidence: 0.65
  reason: How much evidence a finding needs is a research-method choice that varies by study (one participant failing can be a valid headline); leave it to output evals, not a fixed build rule.
- id: backend-3
  verdict: keep
  confidence: 0.65
  reason: A multi-video run where one video contributes nothing needs a defined outcome (fail whole vs done-with-warnings listing skipped videos); this is part of the status model the spec already flags and is cheapest to set now.
- id: cost-1
  verdict: defer
  confidence: 0.65
  reason: The cap from backend-1 bounds worst-case cost; a cost/time preview or confirm assumes usage billing and runs against the stated no-loading-page intent, so add it later if heavy runs appear.
- id: review-19
  verdict: defer
  confidence: 0.55
  reason: An offline eval set is a launch-readiness item for the ML owner, not page behaviour/state/copy; at most name an output-quality owner, without gating build on the eval design.
- id: popup-5
  verdict: keep
  confidence: 0.8
  reason: The shared pop-up mixes selection with filter/search, and hidden-but-submitted selections silently widen report scope; a one-line "count independent of filter" criterion is nearly free (skeptic conceded).
- id: modality-14
  verdict: accept
  confidence: 0.6
  reason: It assumes a sampling pipeline the spec doesn't describe; the real need (hedge absence claims) is covered by modality-1's grounding rule, and sampling-rate copy would go stale.
- id: privacy-19
  verdict: defer
  confidence: 0.65
  reason: Ingestion and its transcription vendor predate this feature and run before any agent run; the agent page adds no transfer at upload, so this belongs to the ingestion/DPA owner.
- id: contract-4
  verdict: accept
  confidence: 0.65
  reason: Once backend-3 says excluded videos are listed, "count usable videos" follows as a prompt-level default; it is narrow and cheap to adjust later.
- id: popup-25
  verdict: defer
  confidence: 0.6
  reason: Duplicates the no-speech state settled under output-10; the pop-up badge is a design choice inside that fix and can ship later once ingestion exposes the flag.
- id: backend-16
  verdict: accept
  confidence: 0.6
  reason: Follow-ups "about the selected videos" sensibly default to keeping the same video context, and answering only from prior text would be a bug; at most add one acceptance test.
- id: contract-17
  verdict: defer
  confidence: 0.6
  reason: The spec defines no report template with fixed sections; whoever writes the template sets empty-section behaviour, and general anti-fabrication is already carried by modality-1/output-10.
