- id: backend-3
  case: >-
    Defer this as a sub-case of a gap the spec already lists. "Statuses an entry can have on the History tab,
    and what opening an entry shows ... when failed" is in the spec's own Still unspecified list, so the PM
    already has to write the status model. A partial-success rule falls out of that work without a separate
    leaf. The leaf itself is graded speculative with no evidence, and its trigger is unlikely in practice.
    User tests are usually think-aloud recordings, so a fully silent or near-empty transcript in a 20-video
    batch is an edge case, and p_typical 0.15 is an unsupported guess. There is also a sensible engineering
    default that needs no PM decision: a video with an empty transcript gives the model nothing to cite, so
    the report completes from the other 19 and never fails. Adding a "skipped: no speech" note to the entry
    detail later is a small, local change that does not affect the schema or UX of the run. The real risk is
    an over-claiming "covers all 20" headline. That belongs under the report-contract leaves (sources and
    coverage lines), not in a separate failure-policy decision before build.
- id: cost-1
  case: >-
    Reject the proposed fix and fold the risk into the video-count and length limits the spec already lists as
    unspecified ("Minimum and maximum number of videos per run; video length and size limits"). Once a maximum
    exists, the "most expensive possible run" is bounded server-side, and that, not a pre-submit UI, is what
    answers Finance's worst-case question. A price or cost-band preview assumes per-run, usage-based billing,
    and nothing in the spec says users pay per run. On a seat or subscription plan, a cost estimate shown to
    the user is meaningless, and computing an accurate one is extra work. A confirm step above 10 video-hours
    also goes against the owner's stated intent ("no loading page, to save the user's time"). The occurrence
    estimate looks inflated too: p_typical 0.3 for a 50 x 2-hour selection is not plausible for typical
    user-test sessions of 20-60 minutes. If heavy runs appear after launch, a duration hint beside Submit is
    cheap to add. Before build, the PM only needs the cap.
- id: review-19
  case: >-
    This is real engineering hygiene, but it is not a gap in this spec and should be deferred to the agent or ML
    team's launch checklist. The frame defines a gap as a missing "behaviour, state, copy, limit or owner" of
    the agent page, Report form, Ask question form or History tab. An offline eval set is none of these. Users
    never see it, and the designer cannot act on it. The leaf is speculative with no evidence and p_typical
    0.06. It also scores cost_to_address 4: 30 human-annotated sessions plus 50 reference questions is
    research-ops work, not a spec line, and requiring it before build would block UI work that does not depend
    on it. Its stated harm is regressions between agent versions, which only becomes possible after a second
    version exists. So the eval set can be built after launch and before the first model or prompt change at no
    loss. At most, the PM should name an owner for output quality and leave the eval design to that owner.
- id: popup-5
  case: >-
    The skeptic case here is weak. The best version: this is a standard multi-select-with-filter interaction
    that any competent designer handles by default, with selection kept across filters and the counter showing
    the total. That makes it design-review and QA detail, not a product decision the PM must settle before
    build. The leaf's own scores support this framing: cost_to_address 1 and p_typical 0.04. Getting it wrong
    is also caught cheaply, because the History entry shows "whatever was submitted", so the user can see that
    8 videos went in. Against that, five separate perspectives raised it independently, and the failure is a
    silent wrong-scope report. Honestly, accepting a one-line acceptance criterion ("selected count is
    independent of filter and search") costs almost nothing, so I cannot make a strong case to defer or reject
    it.
- id: modality-14
  case: >-
    Reject as a speculative implementation detail, or defer it to prompt tuning. The leaf assumes a pipeline
    (frames sampled every 5 s or on scene change) that the spec never describes and that may not exist. A
    native video model or a dense OCR pass would not have this failure. It has no evidence, p_typical 0.03,
    and depends on a stack of coincidences: a toast shorter than the sampling interval, a participant who says
    nothing, a question that asks for a negative, and a researcher who files no ticket without checking the
    timestamp. The proposed fix is to expose the sampling rate in product copy. That is an implementation
    detail leaking into the UI, and it would go stale whenever the pipeline changes. The real need, that
    absence claims are hedged ("not observed" rather than "did not happen"), is a single system-prompt
    instruction the agent team can add or change at any time without a spec change. If the PM wants anything
    now, it belongs inside a broader "answers cite sources and state their coverage" contract leaf, not
    sampling-rate copy.
