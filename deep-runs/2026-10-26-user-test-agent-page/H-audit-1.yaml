# Stage H audit, loop 1. Inputs: 844 surviving leaves (G-counts-all.md, G-titles-all.txt, G-merged-all.yaml).
# Every empty cell below was searched in titles AND situation/consequence text before listing.
# Search terms and hit counts are given in each brief's "checked:" note.
# Keys marked (off-axis) are dimensions that no C-axes value covers; see uncategorised_suggest_axis.

empty_cells:
  - cell: {surface: history-entry-detail, mode: [report, ask-question], run-status: done, action (off-axis): rate-or-flag-or-correct-output}
    brief: >
      output-skeptic: 10+ leaves on what the owner can do once a Done output is wrong. Cover thumbs/flag on a claim, "this quote is not in the video",
      editing the output before copy/export, regenerate (keep or replace the original), where flags go (support, eval set), and whether a flagged
      entry changes status. checked: feedback|thumbs|rate|flag|edit the output|annotate = 0 hits in 844 titles and full leaf text.
  - cell: {surface: history-entry-detail, mode: report, videos-selected: 6-20, text-input-state: prompt-empty, run-status: done, output-claim-type (off-axis): [count-or-proportion, cross-video-comparison, severity]}
    brief: >
      report-consumer: 10+ leaves on the content contract of a Report written with an empty Prompt/instructions field. Cover default sections,
      per-video sections vs one synthesis, "N of M participants" counts, findings that conflict across videos, severity/priority labels,
      recommendations, and the minimum evidence a finding needs. checked: firsttime-31, a11y-39 and prompt-21 touch this; severity|theme|insight|finding|"of N participants" = 0 to 2 incidental hits.
  - cell: {video-state: ingested, mode: [report, ask-question], session-composition (off-axis): [moderator-plus-participant, multiple-participants, bystander-speaking], surface: history-entry-detail}
    brief: >
      ingestion-engineer: 10+ leaves on speaker roles in the ingested transcript. Cover whether ingestion labels moderator vs participant, moderator
      leading questions reported as participant findings, two participants in one session, participant identity across videos for counts, a
      moderator's think-aloud prompts quoted as user sentiment, and how the entry shows who said a quote. checked: moderator|speaker|diariz = 1 title (participant-39, privacy angle only).
  - cell: {video-state: ingested, mode: ask-question, text-input-state (off-axis): question-about-on-screen-behaviour, surface: [question-field, follow-up-thread], run-status: done}
    brief: >
      agent-backend-engineer: 10+ leaves on questions that need visual evidence from videos that DO have audio. Examples: "where did they click
      first", "what error appeared", "how long on the pricing page". Cover whether the agent sees frames/OCR/cursor or only the transcript,
      what the answer says when it cannot see, cited timestamps for silent actions, and labelling in the pop-up or the answer. checked: ingest-41 and firsttime-30 cover silent videos only; vision|frames|on-screen = 2 relevant hits.
  - cell: {surface: [popup-selection-count, selected-videos-list, quota-or-limit-message], video-state: [very-large-file, 3-hour-long, 3-second-clip], videos-selected: exceeds-limit-once-defined, action: select-video}
    brief: >
      qa-lead: 10+ test-plan leaves on the limits the spec lists as unspecified, enforced at selection time and not at Submit. Cover total selected
      duration shown in the pop-up, per-video size and length caps, a minimum length, the cap reached on the Nth checkbox vs select-all-filtered,
      limits that differ by mode, and limit copy when a long video is preselected from the Videos page. checked: very-large-file = 0; total duration|file size|GB = 0; only qa-lead-32 and prompt-19 address caps.
  - cell: {surface: prompt-field, mode: report, text-input-state: prompt-empty, action: type-prompt, study-context (off-axis): [test-script, task-list, research-questions, participant-segments]}
    brief: >
      prompt-writer: 10+ leaves on giving the agent study context it cannot infer from video. Cover pasting a discussion guide or task list into
      Prompt/instructions, attaching it as a file, per-video participant metadata (segment, persona) from tags, saved prompt templates for repeat
      studies, Ask question with no prompt field at all, and context that is lost on follow-ups. checked: discussion guide|test script|task list|research goal|template = 0 hits.
  - cell: {surface: history-entry-detail, run-status: running, observer-location-at-status-change: inside-entry-detail, mode: [ask-question, report], action: open-history-entry}
    brief: >
      redirect-skeptic: 10+ leaves treating the History entry as the loading page that replaced the one removed. Cover streamed or partial answer
      text, per-video progress, elapsed time and ETA, what a 30-second Ask question vs a 40-minute Report shows, whether the follow-up box is usable,
      and leaving and returning mid-stream. checked: stream = 0; partial output = 2 (realtime-21 scroll reset, one proposed line); qa-lead-14 and sre-9 cover progress and queue ETA only.
  - cell: {surface: selected-videos-list, video-state: 3-hour-long, action (off-axis): select-time-range-within-video, mode: [report, ask-question]}
    brief: >
      popup-interaction-designer: 10+ leaves on analysing part of a video. Cover skipping the warm-up, choosing one task segment, ranges that become
      invalid after the uploader trims the video, how History shows the range, citations relative to range or full video, and cost and limits per
      range. checked: time range|segment|trim = 3 hits, all about context truncation or uploader trims, none about a user-chosen range.

