under_used_perspectives:
  - slug: output-skeptic
    brief: >
      22 leaves, 13 of them on history-entry-detail, for the core AI-quality lens. Walk the off-axis output-claim-type values: counts, verbatim vs
      paraphrased quotes, severity, recommendations. Also walk answers that should say "not in these videos", the same question asked against 1
      video vs 20, and outputs in the follow-up-thread and export-or-copy-output surfaces.
  - slug: tag-librarian
    brief: >
      18 leaves, all on tag-filter or add-video-popup. Walk tags beyond the pop-up: whether the history entry records which tag filter built the
      selection (only tags-31 does), filtering History by video tag, tags as participant metadata the agent could use (segment, persona), and
      tag-based preselection from the Videos page.
  - slug: popup-interaction-designer
    brief: >
      29 leaves, 93% on add-video-popup or tag-filter. Walk the selected-videos-list after confirm (reorder, remove, total duration), selection
      restored from a history entry for re-run, the pop-up opened from inside a follow-up thread to change videos, and the pop-up at
      popup-session-state at-max-selection (2 leaves).
  - slug: history-power-user
    brief: >
      21 leaves on 7 surfaces. Walk history-filter-or-sort-controls once they exist, mode-tab-on-history-entry, entries-from-older-agent-version
      (4), mix-of-done-and-failed (3), pin/archive/bulk delete, and duplicating an entry into a pre-filled form.
  - slug: redirect-skeptic
    brief: >
      16 leaves, the fewest, 75% on the history row and redirect. Walk observer-location values other than history-tab-top: composing the next
      run (3) and inside detail (6). Also walk the redirect on mobile, the redirect when the user had a draft in the other mode, and what the
      Agent form shows when the user comes back with the tab button vs Back.
  - slug: support-agent
    brief: >
      16 leaves, wide but thin. Walk the support toolkit: a visible entry id (only sre-17), what support may see under support-staff-impersonating
      (7), canned explanations for done-with-empty-output and partial runs, and a user-facing "report a problem" on an entry.

uncategorised_suggest_axis:
  # G reports 0 uncategorised leaves. These axes are suggested because the empty cells above fit no C-axes value.
  - name: evidence-modality
    values: [speech-transcript, speaker-labelled-transcript, on-screen-visual, burned-in-text-ocr, cursor-or-interaction-events, participant-metadata-from-tags, study-context-from-prompt, none-available]
  - name: session-composition
    values: [one-participant-plus-moderator, unmoderated-think-aloud, silent-unmoderated, multiple-participants, moderator-only-stretch, bystander-present]
  - name: output-claim-type
    values: [verbatim-quote, translated-quote, paraphrase, count-or-proportion, severity-or-priority, recommendation, timestamp-citation, cross-video-comparison, insufficient-evidence-statement]
  - name: output-review-action
    values: [rate, flag-claim, edit-before-share, regenerate, compare-with-previous-version, promote-answer-to-report]

expert_missing:
  - "L3 | Report output (Prompt/instructions empty) | no content contract: sections, one synthesis vs per-video sections, findings with severity, quote+timestamp per finding"
  - "L3 | History entry detail, Done | no grounding rule: each claim cites video+timestamp, and an explicit 'not answerable from the selected videos' outcome instead of a confident answer"
  - "L3 | 'ingested' state | spec does not say which modalities the agent reads (transcript only, frames, OCR, cursor), so on-screen questions on user-test screen recordings have no defined answer"
  - "L3 | ingested transcript | no speaker diarisation rule (moderator vs participant, participant id per video), so 'N of M participants' counts and quote attribution are unreliable"
  - "L3 | History entry detail | no feedback control (rate, flag a claim) and no pre-launch eval set or acceptance threshold for Report and Ask question quality"
  - "L3 | History entry while Running | the entry replaces the removed loading page but has no streaming, progress or ETA rule for a 30-second answer vs a 40-minute Report"
  - "L3 | Prompt / instructions field | no way to give study context (discussion guide, task list, research questions, participant segments) and no saved prompt templates for repeat studies"
  - "L3 | Add video pop-up / selected videos list | no total selected duration, time or cost estimate, and no per-video time range (skip warm-up, analyse task 2 only)"
  - "L3 | Report entry / export-or-copy-output | no 'ask about this report' bridge into Ask question and no highlight-clip export of cited moments for stakeholders"
  - "L3 | Agent page as a whole | no success metrics or instrumentation (runs per user, Done/Failed rate, time to first output, follow-up rate, flag rate), so launch quality cannot be judged"

# 8 empty cells x ~12 raw leaves = ~96; x (1 - 0.31 in-bucket duplicate rate) = ~66;
# 66 / 844 = 0.078. This is BELOW 0.10, so another full loop is not justified.
# At most, run the 8 empty-cell briefs once as a targeted pass and stop.
yield_estimate: 0.08
