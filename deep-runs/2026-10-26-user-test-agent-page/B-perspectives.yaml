# Stage B perspectives, patched by Stage D (added_by: stage-D)
- slug: qa-lead
  who: QA lead writing the test plan for both modes and the History tab
  notices: selection x ingestion-state x submit x entry status combinations; what the entry shows at each status; what "appears" means on redirect
  p_typical: 0.8
- slug: support-agent
  who: Support agent reading "my report never came", "my video is not in the pop-up", "history is empty"
  notices: the states users describe that the spec has no word for; what the user can do about a stuck or failed entry
  p_typical: 0.7
- slug: agent-backend-engineer
  who: Engineer running the agent job over N videos
  notices: one report across 20 three-hour videos; context and token limits; one unusable video inside a batch; retries; idempotency; what "done" means
  p_typical: 0.5
- slug: redirect-skeptic
  who: Designer who argued for a loading page and lost
  notices: 'the first 2 seconds after Submit: did it submit, where did I land, which row is mine, double submit, back button returning to a filled form'
  p_typical: 0.45
- slug: history-power-user
  who: User with 500 history entries, half with blank run names
  notices: finding a run, naming, ordering, re-running, filtering by mode, entries referencing deleted videos
  p_typical: 0.4
- slug: first-time-user
  who: User who just uploaded one video and opens the Agent page for the first time
  notices: empty library, no tags, empty history, which mode to pick, what a suggested question is
  p_typical: 0.55
- slug: tag-librarian
  who: User with 200 tags and 2,000 videos
  notices: tag filter with many tags, combining tag filter and search, renamed or deleted tags, untagged videos, selection surviving a filter change
  p_typical: 0.2
- slug: ingestion-engineer
  who: Engineer owning the Videos page ingestion pipeline
  notices: videos still ingesting or failed when the pop-up opens, deleted after selection but before the run, re-uploaded with the same name, silent videos with no transcript
  p_typical: 0.25
- slug: question-asker
  who: User in a long Ask question thread
  notices: follow-up context, follow-up while the first answer is still running, changing the video set mid-thread, suggested questions after the first answer, thread length
  p_typical: 0.35
- slug: prompt-writer
  who: User who types long or odd instructions into the optional prompt
  notices: empty vs 5,000 chars, instructions that contradict Report mode, non-English, instructions that tell the agent to ignore its rules, prompt lost on mode switch
  p_typical: 0.2
- slug: accessibility-reviewer
  who: Screen-reader and keyboard-only reviewer
  notices: multi-select pop-up with keyboard, mode switch announcement, redirect with no announcement, the new row's accessible name
  p_typical: 0.3
- slug: mobile-user
  who: User on a 360px phone
  notices: pop-up multi-select on touch, tag filter chips wrapping, redirect on mobile, the history row's content at narrow width
  p_typical: 0.25
- slug: double-submitter
  who: User who clicks Submit twice, or submits in two tabs within a second
  notices: two entries, one entry, an error; what the redirect shows for each
  p_typical: 0.09
- slug: security-reviewer
  who: Appsec engineer
  notices: video ids across users in the pop-up and history URLs; "history per user" leaks via shared links; prompt injection through video transcripts and through the instructions field; suggested questions
    as an injection surface
  p_typical: 0.08
- slug: cost-analyst
  who: Finance person modelling agent cost
  notices: a run over 50 two-hour videos with no preview of cost or time; follow-ups re-reading all videos; no limit anywhere
  p_typical: 0.07
- slug: output-skeptic
  who: Reviewer of the agent's actual output
  notices: empty report, report that cites a video not selected, wrong timestamps, answer that ignores the question, report in the wrong language, report longer than the videos
  p_typical: 0.09
- slug: notification-consumer
  who: User who left the History tab after the redirect
  notices: with no loading page, how are they told the run finished; coming back after an hour; a Failed entry nobody told them about
  p_typical: 0.09
- slug: retention-and-deletion
  who: Privacy counsel
  notices: deleting a video referenced by a history entry; deleting a history entry; retention of reports and threads; "per user currently" and offboarding
  p_typical: 0.06
- slug: future-sharing-pm
  who: PM who will make history shared across the team next quarter
  notices: what in the current spec assumes per-user (entry naming, follow-ups, deletes) and breaks when shared
  p_typical: 0.05
- slug: localisation-vendor
  who: Translator shipping this in German and Japanese
  notices: suggested questions language, report language vs video language, mode labels in a tab bar at 360px
  p_typical: 0.05
- slug: low-vision-perception-reviewer
  who: Reviewer with low vision or colour-blindness, checking contrast and non-colour cues on media-heavy surfaces
  notices: selected-state checkmark or overlay drawn on top of video thumbnails that are white, black or busy; ingesting/failed badges that differ only by colour; status badges (Queued/Running/Done/Failed)
    on history rows told apart by hue only; the "new entry" highlight after redirect being a pale tint; tag chips with user-chosen colours that vanish on the background; disabled (not-selectable) videos
    that look the same as selectable ones
  p_typical: 0.1
  added_by: stage-D
- slug: realtime-consistency-engineer
  who: Engineer who owns how the History tab learns that an entry exists and that its status changed
  notices: whether the entry is created synchronously before the redirect or by the job later (read-after-write); polling vs push vs manual refresh for status; a history list that is cached, paginated,
    filtered or sorted so the new row is not on screen; two tabs showing different statuses; status change while the user is inside entry detail; what happens when submit returns success but enqueue fails,
    so no entry ever appears; a page left open for hours never updating
  p_typical: 0.1
  added_by: stage-D
- slug: popup-interaction-designer
  who: Designer treating the Add video pop-up as a small app with its own state, lifecycle and controls
  notices: confirm vs close vs click-outside (is selection kept or discarded); reopening the pop-up (prior selection pre-checked? filter and search remembered?); selected videos hidden by the current filter
    or search; select-all on a filtered set; selection count and clear-all; sort order and what identifies a video when names collide (date, duration, uploader, thumbnail); pagination or virtual scroll
    across 2,000 videos; a video finishing ingestion or being deleted while the pop-up is open; zero results for a tag+search combination; a max-selection limit and how it is shown
  p_typical: 0.1
  added_by: stage-D
- slug: workspace-admin
  who: Workspace owner or admin managing members, roles, plan and data
  notices: who is allowed to use the agent page at all (viewer roles, trial plans); per-user or per-workspace quotas and what Submit does when exceeded; whether an admin can see or delete another member's
    history; what happens to a removed member's running jobs and history; whether the video library is per-user or shared while history is per-user
  p_typical: 0.1
  added_by: stage-D
- slug: other-video-uploader
  who: Teammate who uploaded, renamed, retagged, trimmed or deleted a video that someone else used in a run
  notices: deleting a video referenced by another user's running job, report or open thread; re-tagging while another user has the pop-up filtered by that tag; replacing or re-ingesting a video after a
    report cites its timestamps; whether the uploader sees that the video is used and by whom
  p_typical: 0.1
  added_by: stage-D
- slug: test-participant-data-subject
  who: A person recorded in a user-test video who later withdraws consent or asks for erasure
  notices: video deleted for consent reasons but quotes, names, faces described, and timestamps live on in reports and threads; suggested questions or report text exposing participant names; whether derived
    outputs are traced back to source videos so they can be purged; reports exported before the deletion
  p_typical: 0.1
  added_by: stage-D
- slug: report-consumer
  who: Stakeholder (designer, exec) who receives a report or answer from the runner after the entry is done
  notices: how output leaves the History tab (copy, export, link, PDF); whether citations link to video timestamps and what a recipient without access sees; markdown/tables surviving copy-paste; whether
    a report shows which videos, prompt, date and agent version produced it; a shared link hitting "history is per user"
  p_typical: 0.1
  added_by: stage-D
- slug: interrupted-composer
  who: User who starts composing a run, leaves to upload or fix a video on the Videos page, and comes back
  notices: form state (run name, selection, long prompt, typed question) lost on navigation, session expiry or refresh before submit; arriving on the agent page from the Videos page with videos preselected
    (or not); deep link or bookmark to a mode; browser back from History returning a filled or empty form; validation errors after submit when the form is already gone because of the redirect
  p_typical: 0.1
  added_by: stage-D
- slug: sre-on-call
  who: On-call engineer during an agent or model provider outage, queue backlog, or deploy mid-run
  notices: hundreds of entries stuck Running after an outage; whether jobs resume, restart or fail on deploy; per-user concurrency and fair queueing; what users see when the agent is degraded at submit
    time; bulk-retrying or bulk-failing entries; model or agent version changing between a report and its follow-ups
  p_typical: 0.1
  added_by: stage-D
