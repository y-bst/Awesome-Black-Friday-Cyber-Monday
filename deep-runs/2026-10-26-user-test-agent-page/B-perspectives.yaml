# primary
- slug: qa-lead
  who: "QA lead writing the test plan for both modes and the History tab"
  notices: "selection x ingestion-state x submit x entry status combinations; what the entry shows at each status; what \"appears\" means on redirect"
  p_typical: 0.80
- slug: support-agent
  who: "Support agent reading \"my report never came\", \"my video is not in the pop-up\", \"history is empty\""
  notices: "the states users describe that the spec has no word for; what the user can do about a stuck or failed entry"
  p_typical: 0.70
- slug: agent-backend-engineer
  who: "Engineer running the agent job over N videos"
  notices: "one report across 20 three-hour videos; context and token limits; one unusable video inside a batch; retries; idempotency; what \"done\" means"
  p_typical: 0.50
- slug: redirect-skeptic
  who: "Designer who argued for a loading page and lost"
  notices: "the first 2 seconds after Submit: did it submit, where did I land, which row is mine, double submit, back button returning to a filled form"
  p_typical: 0.45
- slug: history-power-user
  who: "User with 500 history entries, half with blank run names"
  notices: "finding a run, naming, ordering, re-running, filtering by mode, entries referencing deleted videos"
  p_typical: 0.40
- slug: first-time-user
  who: "User who just uploaded one video and opens the Agent page for the first time"
  notices: "empty library, no tags, empty history, which mode to pick, what a suggested question is"
  p_typical: 0.55
- slug: tag-librarian
  who: "User with 200 tags and 2,000 videos"
  notices: "tag filter with many tags, combining tag filter and search, renamed or deleted tags, untagged videos, selection surviving a filter change"
  p_typical: 0.20
- slug: ingestion-engineer
  who: "Engineer owning the Videos page ingestion pipeline"
  notices: "videos still ingesting or failed when the pop-up opens, deleted after selection but before the run, re-uploaded with the same name, silent videos with no transcript"
  p_typical: 0.25
- slug: question-asker
  who: "User in a long Ask question thread"
  notices: "follow-up context, follow-up while the first answer is still running, changing the video set mid-thread, suggested questions after the first answer, thread length"
  p_typical: 0.35
- slug: prompt-writer
  who: "User who types long or odd instructions into the optional prompt"
  notices: "empty vs 5,000 chars, instructions that contradict Report mode, non-English, instructions that tell the agent to ignore its rules, prompt lost on mode switch"
  p_typical: 0.20
- slug: accessibility-reviewer
  who: "Screen-reader and keyboard-only reviewer"
  notices: "multi-select pop-up with keyboard, mode switch announcement, redirect with no announcement, the new row's accessible name"
  p_typical: 0.30
- slug: mobile-user
  who: "User on a 360px phone"
  notices: "pop-up multi-select on touch, tag filter chips wrapping, redirect on mobile, the history row's content at narrow width"
  p_typical: 0.25
# tail
- slug: double-submitter
  who: "User who clicks Submit twice, or submits in two tabs within a second"
  notices: "two entries, one entry, an error; what the redirect shows for each"
  p_typical: 0.09
- slug: security-reviewer
  who: "Appsec engineer"
  notices: "video ids across users in the pop-up and history URLs; \"history per user\" leaks via shared links; prompt injection through video transcripts and through the instructions field; suggested questions as an injection surface"
  p_typical: 0.08
- slug: cost-analyst
  who: "Finance person modelling agent cost"
  notices: "a run over 50 two-hour videos with no preview of cost or time; follow-ups re-reading all videos; no limit anywhere"
  p_typical: 0.07
- slug: output-skeptic
  who: "Reviewer of the agent's actual output"
  notices: "empty report, report that cites a video not selected, wrong timestamps, answer that ignores the question, report in the wrong language, report longer than the videos"
  p_typical: 0.09
- slug: notification-consumer
  who: "User who left the History tab after the redirect"
  notices: "with no loading page, how are they told the run finished; coming back after an hour; a Failed entry nobody told them about"
  p_typical: 0.09
- slug: retention-and-deletion
  who: "Privacy counsel"
  notices: "deleting a video referenced by a history entry; deleting a history entry; retention of reports and threads; \"per user currently\" and offboarding"
  p_typical: 0.06
- slug: future-sharing-pm
  who: "PM who will make history shared across the team next quarter"
  notices: "what in the current spec assumes per-user (entry naming, follow-ups, deletes) and breaks when shared"
  p_typical: 0.05
- slug: localisation-vendor
  who: "Translator shipping this in German and Japanese"
  notices: "suggested questions language, report language vs video language, mode labels in a tab bar at 360px"
  p_typical: 0.05
