# Stage D: critique of the decomposition (A-frame, B-perspectives, C-axes) against misses.md.
# Written without seeing findings and without reading spec.md.

missing_perspectives:
  - slug: low-vision-perception-reviewer
    who: Reviewer with low vision or colour-blindness, checking contrast and non-colour cues on media-heavy surfaces
    notices: >
      selected-state checkmark or overlay drawn on top of video thumbnails that are white, black or busy; ingesting/failed
      badges that differ only by colour; status badges (Queued/Running/Done/Failed) on history rows told apart by hue only;
      the "new entry" highlight after redirect being a pale tint; tag chips with user-chosen colours that vanish on the
      background; disabled (not-selectable) videos that look the same as selectable ones
    why_missing: >
      accessibility-reviewer is scoped to screen reader and keyboard, and no axis describes what the media itself looks like.
      This is exactly the miss-001 shape (white play button on white thumbnails) and the pop-up is a thumbnail grid.
  - slug: realtime-consistency-engineer
    who: Engineer who owns how the History tab learns that an entry exists and that its status changed
    notices: >
      whether the entry is created synchronously before the redirect or by the job later (read-after-write); polling vs push
      vs manual refresh for status; a history list that is cached, paginated, filtered or sorted so the new row is not on
      screen; two tabs showing different statuses; status change while the user is inside entry detail; what happens when
      submit returns success but enqueue fails, so no entry ever appears; a page left open for hours never updating
    why_missing: >
      the "no loading page" decision moves all feedback onto the History tab, but every perspective looks at what the row
      shows, none owns the mechanism that makes the row exist and update. redirect-skeptic sees the first 2 seconds;
      notification-consumer sees the user who left; nobody owns the minutes in between on the same screen.
  - slug: popup-interaction-designer
    who: Designer treating the Add video pop-up as a small app with its own state, lifecycle and controls
    notices: >
      confirm vs close vs click-outside (is selection kept or discarded); reopening the pop-up (prior selection pre-checked?
      filter and search remembered?); selected videos hidden by the current filter or search; select-all on a filtered set;
      selection count and clear-all; sort order and what identifies a video when names collide (date, duration, uploader,
      thumbnail); pagination or virtual scroll across 2,000 videos; a video finishing ingestion or being deleted while the
      pop-up is open; zero results for a tag+search combination; a max-selection limit and how it is shown
    why_missing: >
      the grid treats add-video-popup as one surface value and select/deselect as two actions. The pop-up's own open/close
      lifecycle, its internal state and its live-updating content have no axis and no owner; tag-librarian only covers the
      filter, ingestion-engineer only covers video state.
  - slug: workspace-admin
    who: Workspace owner or admin managing members, roles, plan and data
    notices: >
      who is allowed to use the agent page at all (viewer roles, trial plans); per-user or per-workspace quotas and what
      Submit does when exceeded; whether an admin can see or delete another member's history; what happens to a removed
      member's running jobs and history; whether the video library is per-user or shared while history is per-user
    why_missing: >
      admin is listed as an actor value on the axis, but no perspective is that person, so no item will be generated from
      their goals. Plan limits and roles sit before the agent page is ever opened.
  - slug: other-video-uploader
    who: Teammate who uploaded, renamed, retagged, trimmed or deleted a video that someone else used in a run
    notices: >
      deleting a video referenced by another user's running job, report or open thread; re-tagging while another user has
      the pop-up filtered by that tag; replacing or re-ingesting a video after a report cites its timestamps; whether
      the uploader sees that the video is used and by whom
    why_missing: >
      every perspective is the person running the agent or an engineer. The library is shared input with a different owner
      than the per-user history, and the cross-user effects of edits on the Videos page have no voice.
  - slug: test-participant-data-subject
    who: A person recorded in a user-test video who later withdraws consent or asks for erasure
    notices: >
      video deleted for consent reasons but quotes, names, faces described, and timestamps live on in reports and threads;
      suggested questions or report text exposing participant names; whether derived outputs are traced back to source videos
      so they can be purged; reports exported before the deletion
    why_missing: >
      retention-and-deletion looks at the customer's own deletion and retention; nobody represents the third party whose
      data is in the videos. In a user-testing product this is the main personal-data subject and is outside the actor list.
  - slug: report-consumer
    who: Stakeholder (designer, exec) who receives a report or answer from the runner after the entry is done
    notices: >
      how output leaves the History tab (copy, export, link, PDF); whether citations link to video timestamps and what a
      recipient without access sees; markdown/tables surviving copy-paste; whether a report shows which videos, prompt,
      date and agent version produced it; a shared link hitting "history is per user"
    why_missing: >
      output-skeptic judges the content; nobody covers what happens after "done" when the output is consumed elsewhere.
      share-or-export is listed as an action "not in spec" but no perspective will push on it.
  - slug: interrupted-composer
    who: User who starts composing a run, leaves to upload or fix a video on the Videos page, and comes back
    notices: >
      form state (run name, selection, long prompt, typed question) lost on navigation, session expiry or refresh before
      submit; arriving on the agent page from the Videos page with videos preselected (or not); deep link or bookmark to a
      mode; browser back from History returning a filled or empty form; validation errors after submit when the form is
      already gone because of the redirect
    why_missing: >
      the grid starts at open-agent-page and ends at the entry. Entry points into the page and the round trip to the Videos
      page (the only way to fix "my video is not here") are not modelled, and draft persistence has no value anywhere.
  - slug: sre-on-call
    who: On-call engineer during an agent or model provider outage, queue backlog, or deploy mid-run
    notices: >
      hundreds of entries stuck Running after an outage; whether jobs resume, restart or fail on deploy; per-user concurrency
      and fair queueing; what users see when the agent is degraded at submit time; bulk-retrying or bulk-failing entries;
      model or agent version changing between a report and its follow-ups
    why_missing: >
      agent-backend-engineer looks at one job's correctness over N videos; nobody looks at the fleet of jobs, outages, and
      operational recovery. "during-agent-outage" exists as an axis value with no perspective pushing on it.

missing_axes:
  - name: media-appearance
    values: [thumbnail-near-white, thumbnail-near-black, thumbnail-busy-or-high-detail, no-thumbnail-yet, generic-placeholder-thumbnail, identical-thumbnails-across-videos, thumbnail-with-burned-in-text, portrait-or-odd-aspect-ratio]
    why_missing: >
      the pop-up is a media picker and no axis varies the media content itself, which is the miss-001 failure class
      (overlays, checkmarks, badges and play icons drawn on top of thumbnails).
  - name: per-video-outcome-within-run
    values: [all-videos-used, one-video-unusable, some-videos-unusable, all-videos-unusable, video-truncated-to-fit-context, video-skipped-because-deleted, video-replaced-mid-run]
    why_missing: >
      run-status is one value per entry; "partial" is a single value with no breakdown of which videos failed, why, and
      how that is shown or retried per video. This is the miss-002 shape at the within-run level.
  - name: entry-point-and-lifecycle-phase
    values: [before-first-ingestion-completes, arriving-from-nav, arriving-from-videos-page-with-preselection, deep-link-to-mode, returning-mid-compose, post-submit-same-screen, post-submit-elsewhere-in-app, app-closed-while-running, after-done-consuming-output, long-after-retention-window]
    why_missing: >
      the brief asked for before-open and after-done; the grid has a time-and-connection axis about network and sessions
      but no axis for where the user is in the journey, so draft loss, entry points and post-done consumption fall through.
  - name: observer-location-at-status-change
    values: [on-history-tab-top, on-history-tab-scrolled-or-filtered, inside-entry-detail, on-agent-form-composing-next-run, other-page-in-app, other-tab, other-device, logged-out]
    why_missing: >
      the "no loading page" decision silently depends on the user seeing the status change; where the user is when it
      changes decides whether they ever learn the outcome, and no axis varies it.
  - name: permission-and-plan
    values: [full-access, viewer-role, trial-or-plan-without-agent, quota-remaining, quota-exhausted-at-submit, access-revoked-mid-run, member-removed-from-workspace, video-owned-by-other-user, video-in-folder-user-cannot-see]
    why_missing: >
      the frame names "history is per user" but nothing varies who may do what; limits are listed as unknown but there is no
      axis for hitting one.
  - name: popup-session-state
    values: [first-open, reopen-with-prior-selection, closed-without-confirm, selection-hidden-by-filter, filter-yields-zero, library-changed-while-open, at-max-selection, select-all-filtered]
    why_missing: the pop-up as its own small app has state that the surface and action axes flatten away.

missing_values:
  - axis: actor
    add: [video-uploader-other-than-runner, workspace-owner, viewer-role-member, removed-or-deactivated-user, support-staff-impersonating, test-participant-data-subject, report-recipient-without-access]
    why: the list has the runner, engines and a generic admin; the people whose actions or data cross into a per-user history are missing.
  - axis: surface
    add: [notification-email-or-in-app, global-running-indicator-or-badge, history-entry-status-badge, popup-footer-confirm-cancel, popup-selection-count, popup-zero-results, video-thumbnail-overlay, cited-video-timestamp-player, export-or-copy-output, history-filter-or-sort-controls, mode-tab-on-history-entry, quota-or-limit-message, onboarding-or-help-for-suggested-questions]
    why: >
      the surfaces stop at the agent page and history; nothing covers how a finished run is announced, how output leaves the
      app, or the small sub-surfaces inside the pop-up where most selection bugs live.
  - axis: video-state
    add: [ingestion-queued-not-started, re-ingesting-after-edit, ingested-with-partial-transcript, multi-language-audio, duplicate-name-different-content, very-large-file, owned-by-another-user, access-revoked, moved-to-hidden-folder, ingested-but-thumbnail-missing]
    why: states between "ingesting" and "ingested", and ownership/access states, are absent; the frame lists only ingested/ingesting by name.
  - axis: run-status
    add: [submit-accepted-but-entry-never-created, failed-before-start-validation, retrying, timed-out, rate-limited-waiting, done-but-unread, done-then-source-video-changed-stale, deleted-entry, superseded-by-re-run]
    why: >
      the assumed Queued/Running/Done/Failed set hides the states the no-loading-page design depends on (accepted but
      invisible, never created) and post-done states (unread, stale).
  - axis: history-state
    add: [mix-of-done-and-failed-across-recent-runs, filtered-so-new-entry-hidden, scrolled-to-page-3-at-redirect, sorted-not-by-newest, several-running-at-once, entries-from-older-agent-version, filtered-to-zero]
    why: the redirect assumes the new row is visible at the top of an unfiltered list; nothing tests that.
  - axis: action
    add: [retry-failed-videos-only, retry-whole-run, clear-all-selection, select-all-filtered, navigate-away-mid-compose, return-to-draft, edit-and-resubmit-from-entry, filter-history-by-mode-or-status, search-history, copy-output, open-cited-timestamp, mark-read, logout-while-running, follow-up-from-two-tabs]
    why: the action list has retry only as re-run-not-in-spec and nothing for draft round-trips or consuming output.
  - axis: text-input-state
    add: [whitespace-only, emoji-or-rtl, newline-pasted-into-run-name, suggested-question-edited-after-pick, question-exceeds-limit, text-contains-participant-personal-data]
    why: edge inputs short of "5000 chars" and "non-english" are missing, and PII in free text is a retention concern.
  - axis: time-and-connection
    add: [deploy-during-run, two-devices-same-user, timezone-of-entry-timestamp, session-expired-while-composing-long-prompt, rate-limit-at-submit, agent-model-version-changed-since-entry]
    why: operational events and display of time are not represented.
  - axis: library-state
    add: [all-videos-still-ingesting, mixed-ownership-library, library-changing-while-popup-open, videos-in-folders-or-projects, library-at-plan-max]
    why: the library is treated as static and single-owner while the pop-up is open.
  - axis: thread-state
    add: [thread-where-an-answer-failed, follow-up-limit-reached, follow-up-after-agent-version-change, follow-up-from-second-tab-simultaneously, wanting-to-ask-about-a-report-entry]
    why: failure inside a thread and crossing from a Report entry into questions are not represented.
  - axis: videos-selected
    add: [exceeds-limit-once-defined, selection-with-duplicate-uploads-of-same-session, selection-where-all-become-unusable-before-run]
    why: the cardinality list has no boundary at the (undefined) limit and no degenerate selections.

past_misses_check:
  - miss: miss-001
    caught_by: NOT CAUGHT
    note: >
      no perception perspective (accessibility-reviewer is screen-reader/keyboard only) and no axis varying thumbnail content.
      Patched above: low-vision-perception-reviewer x {surface: add-video-popup, media-appearance: thumbnail-near-white,
      action: select-video} (selected checkmark or ingesting badge invisible on white thumbnails), plus
      {surface: history-entry-status-badge, run-status: failed} for colour-only status.
  - miss: miss-002
    caught_by: "qa-lead x {surface: history-entry-detail, videos-selected: 2-5, run-status: partial-some-videos-unusable, action: re-run-not-in-spec}"
    note: >
      caught only partially. The single "partial" value catches the existence of a mixed run, but there is no per-video
      outcome breakdown, no "retry failed videos only" action, and no history-state for several recent runs where some
      failed (the literal miss-002 shape across entries). Patched above with the per-video-outcome-within-run axis,
      action retry-failed-videos-only, and history-state mix-of-done-and-failed-across-recent-runs; strongest cell after
      patching is qa-lead x {surface: history-entry-detail, videos-selected: 2-5, per-video-outcome-within-run:
      some-videos-unusable, action: retry-failed-videos-only}.
