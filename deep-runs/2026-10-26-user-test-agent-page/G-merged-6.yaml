  p_typical: 0.05
  grounded: speculative
  evidence: '"There is no loading page, to save the user''s time."'
  proposed: Attach a client-generated idempotency key per form instance, reused on retry; server returns the original entry for a repeated key
  shallow: false
- id: dup-8
