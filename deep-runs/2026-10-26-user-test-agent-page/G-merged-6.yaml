- id: dup-7
  title: User retries Submit after "nothing happened" on a slow or offline connection - the first request may already have created an entry
  level: L3
  cell:
    surface: submit-button
    time-and-connection: offline-at-submit
    run-status: submit-accepted-but-entry-never-created
    action: submit
    videos-selected: 6-20
  object: '"There is no loading page, to save the user''s time."'
  situation: Connection drops after the request left the browser; no spinner exists, the form stays on screen for 10 s; the user clicks Submit again once the connection returns
  consequence: The server may hold the first run (created, not yet visible) plus a second run; the spec has no offline message, no retry rule, and no idempotency key, so a retry of the same payload creates
