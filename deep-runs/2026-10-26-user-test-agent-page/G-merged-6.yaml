- id: a11y-6
  title: Mode switch between Report and Ask question has no stated control type or announcement
  level: L3
  cell:
    surface: agent-page-mode-switch
    mode: switching-mode-after-selecting-videos
    action: switch-mode
  object: '''Agent page: two modes, Report and Ask question'''
  situation: Screen-reader user switches from Report to Ask question; the Run name and Prompt fields disappear and the Question field and suggested questions appear.
  consequence: If the switch is two buttons with no pressed state, the user cannot tell which mode is active; the form content changes under them with no announcement, and they keep typing a prompt into
    a field that no longer exists.
  p_typical: 0.15
  grounded: inferred
  evidence: two modes, **Report** and **Ask question**
  proposed: Use role=tablist or radio group with the active mode exposed; announce 'Ask question mode' in a status region; keep focus on the switch.
  shallow: false
- id: a11y-31
  title: Submit with no videos or an empty Question has no stated error pattern for keyboard and screen-reader users
  level: L4
  cell:
    surface: submit-button
    videos-selected: '0'
    text-input-state: question-empty
    mode: ask-question
    action: submit
  object: Submit button in Ask question mode; minimum videos per run is unspecified
  situation: User presses Enter on Submit with 0 videos and an empty Question.
  consequence: A disabled Submit (native disabled) is skipped by Tab and gives no reason; an enabled Submit with a toast error is announced only if role=alert; focus stays on Submit instead of the first
    invalid field, so the user cannot find what to fix.
  p_typical: 0.07
  grounded: inferred
  evidence: Minimum and maximum number of videos per run
  proposed: Keep Submit enabled; on press, show an error summary and focus the first invalid field with aria-invalid and aria-describedby.
  shallow: false
  also_from:
  - support-37
- id: a11y-33
  title: Double-submit by keyboard auto-repeat or double Enter creates two entries, with no stated disabled state announced
  level: L4
  cell:
    surface: submit-button
    action: double-submit
    time-and-connection: steady-state
    run-status: queued
  object: Submit button; 'no loading page'
  situation: User holds Enter for 600 ms on Submit before the redirect occurs (auto-repeat about 30 per second after a 500 ms delay).
  consequence: Two or more identical entries with the same name and second appear; the screen reader has no 'submitting' state to say the button is busy, since no loading page exists.
  p_typical: 0.05
  grounded: quote
  evidence: There is no loading page, to save the user's time.
  proposed: Set aria-busy and aria-disabled on the first activation; one submission per form instance.
  shallow: false
- id: a11y-36
