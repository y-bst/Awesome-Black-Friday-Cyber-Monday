- id: dup-1
  title: Submit clicked twice within 500 ms in Report mode with 3 videos selected - spec does not say whether the result is one entry, two entries, or an error
  level: L4
  cell:
    surface: submit-button
    action: double-submit
    mode: report
    videos-selected: 2-5
    run-status: submitted-not-yet-visible-in-history
  object: '"Submit" button on the Report form; "On submit the user is redirected to the History tab, where a new entry appears"'
  situation: User double-clicks Submit (or clicks again because the page has not moved yet); two identical requests carrying the same run name, prompt and 3 video ids reach the server about 300 ms apart
  consequence: Two Report runs execute over the same 3 videos (double compute, possibly double quota), or the second request returns an error that surfaces as a toast on top of the History tab the user
    was just redirected to; the user cannot tell which happened
  p_typical: 0.3
  grounded: inferred
  evidence: '"On submit the user is redirected to the **History** tab, where a new entry appears with whatever was submitted."'
  proposed: 'State the rule: second Submit within N seconds with an identical payload is collapsed into the first entry (single entry), and the button is disabled after the first click'
  shallow: false
  also_from:
  - backend-7
  - cost-13
  - firsttime-33
  - mobile-9
  - prompt-6
  - qa-lead-22
  - realtime-26
  - redirect-7
  - sre-23
  - support-18
