  object: Redirect from Agent page to History tab
  situation: User submits, lands on History, presses browser Back (Alt+Left).
  consequence: Form is either blank (the user may resubmit the same Report, duplicating it) or restored with the previous videos, and focus is at the top of the document; a screen-reader user gets no cue
