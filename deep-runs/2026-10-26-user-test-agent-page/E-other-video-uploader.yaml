- id: uploader-1
  title: Videos page delete confirmation shows no count of runs, reports or threads that reference the video
  level: L4
  cell: {surface: videos-page, actor: video-uploader-other-than-runner, video-state: deleted-after-run, history-state: entry-referencing-deleted-video}
  object: "Videos page (users upload videos; uploaded videos get ingested)"
  situation: "Uploader deletes 'Session 07 - checkout' which 3 teammates used in 4 Report entries and 1 Ask question thread over the last month"
  consequence: "Delete dialog reads like any delete; uploader has no idea 5 history entries now point to a missing video; the 3 teammates discover it only when they open their entries"
  p_typical: 0.12
  grounded: inferred
  evidence: "Videos page: users upload videos; uploaded videos get ingested."
  proposed: "Spec the delete dialog to state 'Used in N runs by M people' (count only) before confirm; assert N = 5 in this scenario"
  shallow: false
