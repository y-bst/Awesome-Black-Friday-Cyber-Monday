- id: tags-1
  title: Add video pop-up tag filter with 200 tags has no stated layout, so finding one tag means scrolling an unbounded list
  level: L3
  cell: {surface: tag-filter, library-state: 200-tags, action: filter-by-tag}
  object: "tag filter in the Add video pop-up"
  situation: "User has 200 tags and opens the pop-up; spec says only 'filtering by the tags the user has applied to videos'"
  consequence: "All 200 tags render as one flat list or chip wall; user scrolls to find 'Q3-interviews'; no tag search, no sort order (alphabetical vs most-used), no cap on visible tags"
  p_typical: 0.18
  grounded: inferred
  evidence: "The pop-up supports filtering by the tags the user has applied to videos"
  proposed: "Spec a type-ahead search inside the tag filter, a sort order, and a visible-chip cap (for example 20 shown, rest behind 'more')"
  shallow: false
- id: tags-2
