  level: L4
  cell: {surface: tag-filter, library-state: 2000-videos, action: filter-by-tag}
  object: "tag filter in the Add video pop-up"
  situation: "User ticks tags 'onboarding' and 'churn'; video A has only 'onboarding', video B has both"
  consequence: "With OR, 2000-video library returns perhaps 700 rows; with AND, perhaps 40; user cannot predict which, and the result count differs 17x between interpretations"
  p_typical: 0.22
  grounded: speculative
  evidence: "filtering by the tags the user has applied to videos"
  proposed: "State AND or OR as the rule, or add an explicit Match all / Match any toggle; assert row count updates after each tag tick"
  shallow: false
