  object: "History tab: 'Lists past and current submissions from both modes'"
  situation: "List sorted by completion time, by run name, or with running items grouped below completed ones; 20 rows per page"
  consequence: "A Queued row with no completion time sorts last and sits on page 5; user concludes the submit did not happen"
  p_typical: 0.12
  grounded: quote
  evidence: "Lists past and current submissions from both modes."
  proposed: "Spec line: History sorted by created time descending; the newly submitted entry is row 1 on page 1 after redirect"
  shallow: false
