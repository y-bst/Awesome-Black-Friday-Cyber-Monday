  level: L3
  cell: {surface: history-tab, history-state: 100-entries, action: submit, time-and-connection: steady-state}
  object: "History tab list after redirect"
  situation: "User opened History 10 min ago (list cached in the SPA query cache with a 5-min stale time), then went to Report mode and submitted"
  consequence: "Cached 100-row list paints first with no new entry; the row pops in 1-2 s later or never if the cache is considered fresh"
  p_typical: 0.08
  grounded: inferred
  evidence: "On submit the user is redirected to the History tab, where a new entry appears"
  proposed: "Acceptance criterion: a successful Submit invalidates the cached History list and inserts the returned row before navigation"
  shallow: false
- id: realtime-4
