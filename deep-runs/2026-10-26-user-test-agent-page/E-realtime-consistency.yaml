- id: realtime-1
  title: "Spec does not say whether the History entry is written before Submit returns; if the job worker creates it, the History tab renders right after redirect without the new row"
  level: L4
  cell: {surface: redirect-transition, run-status: submitted-not-yet-visible-in-history, time-and-connection: redirect-lands-before-entry-exists, action: submit, actor: background-agent-job}
  object: "After submit sentence + History tab list"
  situation: "Submit API enqueues the job and returns 202; the history row is inserted by the worker when it picks the job up 0.5-30 s later; client redirects on the 202 and fetches the list immediately"
  consequence: "User lands on History and sees no new entry, contradicting 'a new entry appears'; many will press Back and submit again"
  p_typical: 0.25
  grounded: quote
  evidence: "On submit the user is redirected to the History tab, where a new entry appears with whatever was submitted."
  proposed: "Acceptance criterion: Submit returns 2xx only after the history row is committed with status Queued and its id; the first History render after redirect contains that id with no manual reload"
  shallow: false
- id: realtime-2
  title: "History list read from a replica can lag the primary write, so the row committed at Submit is absent from the first list fetch after redirect"
  level: L3
  cell: {surface: history-tab, run-status: submitted-not-yet-visible-in-history, time-and-connection: redirect-lands-before-entry-exists, actor: creator-owner}
  object: "History tab list fetch immediately after the redirect"
  situation: "Row written to primary at t=0; History GET at t=150 ms served by a read replica with 200 ms-5 s replication lag"
  consequence: "Entry missing for up to 5 s, intermittently, and only under load, so it passes QA and fails in production"
  p_typical: 0.05
  grounded: inferred
  evidence: "where a new entry appears with whatever was submitted"
  proposed: "Spec line: the redirect carries the new entry id; History renders that row from the Submit response (or reads it from primary) regardless of list freshness"
  shallow: false
- id: realtime-3
