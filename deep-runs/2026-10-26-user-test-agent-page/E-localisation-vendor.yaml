- id: l10n-1
  title: "Suggested questions have no stated language, so a German or Japanese UI may show English chips above videos spoken in a third language"
  level: "L3"
  cell: {surface: suggested-questions, mode: ask-question, video-state: non-english-audio, text-input-state: question-picked-from-suggested}
  object: "Ask question mode: 'Suggested questions are shown and can be picked'"
  situation: "UI locale is de-DE, user selected 3 Japanese-audio videos, the suggested list is a static list. The spec does not say whether the list is translated per UI locale, kept in English, or written in the video language."
  consequence: "A German user sees English chips, picks one, and the question is sent in English about Japanese content; or translators receive the strings with no context and the chips drift from the agent's tested wording."
  p_typical: 0.14
  grounded: "quote"
  evidence: "Whether suggested questions are static or derived from the selected videos."
  proposed: "Add a line to the spec - static suggested questions are translated per UI locale (en, de, ja) and stored as keys, not as English text."
  shallow: false
- id: l10n-2
  title: "A picked suggested question is stored as submitted text, so the History entry keeps the old UI language after the user switches locale"
  level: "L3"
  cell: {surface: history-entry-row, text-input-state: question-picked-from-suggested, history-state: report-and-question-entries-interleaved, action: pick-suggested-question}
  object: "History entry row: 'a new entry appears with whatever was submitted'"
  situation: "User picks the German chip 'Was sind die größten Probleme?', submits, then switches the UI to Japanese. The entry row shows the German string while the mode badge and date are in Japanese."
  consequence: "One row mixes two languages; the user cannot tell if the question was typed or picked, and a translator cannot fix the stored string after release."
  p_typical: 0.05
  grounded: "inferred"
  evidence: "On submit the user is redirected to the History tab, where a new entry appears with whatever was submitted."
  proposed: "Spec states that entry content is stored verbatim in the language it was submitted and only UI chrome (badges, dates, mode names) follows the current locale."
  shallow: false
- id: l10n-3
  title: "Report language is unspecified when Prompt / instructions is empty and the UI language differs from the video language"
  level: "L3"
  cell: {surface: history-entry-detail, mode: report, text-input-state: prompt-empty, video-state: non-english-audio}
  object: "Report mode field 'Prompt / instructions (optional)'"
  situation: "UI is German, the 5 selected videos are all Japanese-audio, the prompt is left empty and Submit is pressed. Nothing says if the report is written in German, Japanese or English."
  consequence: "The same input gives a Japanese report one day and an English report the next; the German user cannot read it, and acceptance tests have no expected language."
  p_typical: 0.14
  grounded: "quote"
  evidence: "Prompt / instructions (optional)"
  proposed: "Add rule - when the prompt is empty, the report is written in the UI locale (de), with quotes from videos left in the original language."
  shallow: false
- id: l10n-4
  title: "One Report across videos in several spoken languages has no rule for output language or for quoting"
  level: "L3"
  cell: {surface: report-form, mode: report, videos-selected: "2-5", video-state: multi-language-audio}
  object: "Clarification: 'A Report produces one output covering all selected videos, not one per video.'"
  situation: "Selection is 4 videos - Japanese, German, English, Portuguese - with a German prompt. A single output must cover all four."
  consequence: "Quotes from the Japanese video appear untranslated inside a German paragraph, or are translated silently so the user cannot verify them against the video."
  p_typical: 0.06
  grounded: "quote"
  evidence: "A Report produces one output covering all selected videos, not one per video."
  proposed: "Spec states quotes are shown in the original language followed by a translation in the report language, marked as translated."
  shallow: false
- id: l10n-5
  title: "Cited quotes and timestamps from a Japanese video inside a German answer have no rule for original versus translated text"
  level: "L3"
  cell: {surface: cited-video-timestamp-player, text-input-state: non-english-text, video-state: non-english-audio, action: open-cited-timestamp}
  object: "Ask question answer with cited timestamps and the Add video selection"
  situation: "Question typed in German about a Japanese-audio video; answer cites 00:12:40 with a quote. User clicks the timestamp."
  consequence: "The user opens the player, hears Japanese, and cannot match the German paraphrase to what was said; no way to see the original line or the transcript language."
  p_typical: 0.05
  grounded: "inferred"
  evidence: "A question about the selected videos, typed by the user"
  proposed: "Add to spec - each citation shows the original-language transcript line, with the translation below it."
  shallow: false
- id: l10n-6
  title: "Mode tab labels \"Report\", \"Ask question\" and \"History\" have no length budget at 360px in German"
  level: "L3"
  cell: {surface: agent-page-mode-switch, mode: report, action: switch-mode, time-and-connection: first-ever-use}
  object: "Agent page: two modes, Report and Ask question, plus a History tab"
  situation: "Viewport 360px wide, UI in German. The labels become 'Bericht', 'Frage stellen' (or 'Fragen stellen') and 'Verlauf', three tabs in one row, with Japanese labels 'レポート', '質問する', '履歴' being much shorter."
  consequence: "'Frage stellen' wraps or is cut to 'Frage ste…'; tabs shift width when the locale changes; no acceptance criterion says wrap, truncate or scroll."
  p_typical: 0.08
  grounded: "inferred"
  evidence: "**Agent page**: two modes, **Report** and **Ask question**, plus a **History** tab."
  proposed: "Spec sets a max label length of 14 characters per tab, and the German label for Ask question is fixed as 'Frage' by the translator."
  shallow: false
- id: l10n-7
  title: "Selected-video count in the Add video pop-up needs plural forms that differ across English, German and Japanese"
  level: "L3"
  cell: {surface: popup-selection-count, videos-selected: "1", popup-session-state: reopen-with-prior-selection, action: select-video}
  object: "Add video pop-up (no selection count is specified)"
  situation: "Pop-up footer shows a count after 1, 2 and 6 videos are selected. English and German need singular and plural ('1 Video', '2 Videos'), Japanese needs one form ('2本の動画'), and the spec has no count text at all."
  consequence: "A string like 'selected videos: ' + n gets built by concatenation in code and cannot be translated; '1 videos selected' ships in German."
  p_typical: 0.04
  grounded: "speculative"
  evidence: "none"
  proposed: "Spec adds the count string and requires ICU plural keys for it (one, other)."
  shallow: false
- id: l10n-8
  title: "History entry row timestamp format is not specified per locale"
  level: "L3"
  cell: {surface: history-entry-row, history-state: "100-entries", time-and-connection: timezone-of-entry-timestamp, entry-point-and-lifecycle-phase: arriving-from-nav}
  object: "History tab: 'Lists past and current submissions from both modes.'"
  situation: "The same entry submitted at 2026-10-26 14:05 reads '26.10.2026, 14:05' in German, '2026年10月26日 14:05' in Japanese and '10/26/2026, 2:05 PM' in English; the spec shows no timestamp field at all."
  consequence: "Row width differs by about 6 characters per locale at 360px; a user in Tokyo reading a day-month-year string cannot tell 03.10 from 10.03 if the locale is mixed with the browser setting."
  p_typical: 0.07
  grounded: "inferred"
  evidence: "Lists past and current submissions from both modes."
  proposed: "Spec adds a timestamp to the row, formatted with the UI locale using Intl.DateTimeFormat, in the user's profile time zone."
  shallow: false
- id: l10n-9
  title: "Add video pop-up search does not say if full-width/half-width and hiragana/katakana forms match each other"
  level: "L3"
  cell: {surface: search-box, action: search, library-state: "50-videos", text-input-state: non-english-text}
  object: "Add video pop-up: 'searching by name'"
  situation: "Video named 'ユーザーテスト_田中' (katakana long vowel mark, full-width) and the user types 'ﾕｰｻﾞｰﾃｽﾄ' (half-width katakana), 'ゆーざーてすと' (hiragana) or 'ユーザーテスト' typed with a Latin keyboard layout."
  consequence: "3 of 4 reasonable inputs return 'no results' in a 50-video library; the pop-up looks empty although the video exists."
  p_typical: 0.03
  grounded: "speculative"
  evidence: "none"
  proposed: "Spec states search folds full/half-width and hiragana/katakana (NFKC plus kana folding) before comparing."
  shallow: false
- id: l10n-10
  title: "Search does not say if umlauts and ß match their ASCII spellings or Unicode normalisation forms"
  level: "L3"
  cell: {surface: search-box, action: search, video-state: duplicate-name-different-content, text-input-state: non-english-text}
  object: "Add video pop-up: 'searching by name'"
  situation: "A file uploaded from macOS is named 'Nutzertest_Müller.mp4' in NFD (u + combining diaeresis); the user types 'Müller' in NFC, 'Mueller' or 'Muller'. Also 'Straße' versus 'Strasse'."
  consequence: "Typing the visible name finds nothing because the byte sequences differ; two uploads that look identical in the list do not both match."
  p_typical: 0.03
  grounded: "speculative"
  evidence: "none"
  proposed: "Spec requires NFC normalisation on upload and on query, and states whether ü matches ue and u."
  shallow: false
- id: l10n-11
  title: "Search box reacts to every keystroke during Japanese IME composition"
  level: "L3"
  cell: {surface: search-box, action: search, popup-session-state: first-open, library-state: "2000-videos"}
  object: "Add video pop-up: 'searching by name'"
  situation: "User types 'ゆーざー' with an IME; the field fires input events for each unconverted kana, and Enter confirms the conversion and may also submit or select a row."
  consequence: "In a 2000-video library the list flickers through 4 or more result sets per word, and the confirming Enter picks the first row as a selection."
  p_typical: 0.02
  grounded: "speculative"
  evidence: "none"
  proposed: "Spec adds - the search runs only after compositionend, with a 300 ms debounce, and Enter during composition does nothing."
  shallow: false
- id: l10n-12
  title: "Tag filter list order for German and Japanese tag names is not defined"
  level: "L3"
  cell: {surface: tag-filter, library-state: "200-tags", text-input-state: non-english-text, action: filter-by-tag}
  object: "Add video pop-up: 'filtering by the tags the user has applied to videos'"
  situation: "200 tags including 'Ärger', 'Zahlung', 'アンケート', '面接', 'onboarding'. A plain code-point sort puts 'Ärger' after 'Zahlung' and puts all Japanese tags after Latin ones in no reading order."
  consequence: "The user scanning for 'Ärger' under A does not find it; kanji tags are ordered by code point, which is meaningless to a Japanese reader."
  p_typical: 0.02
  grounded: "speculative"
  evidence: "none"
  proposed: "Spec says tags are sorted with Intl.Collator for the UI locale (de, ja) and Latin and CJK tags are grouped."
  shallow: false
- id: l10n-13
  title: "Right-to-left run name loses its order and punctuation in the History entry row"
  level: "L3"
  cell: {surface: history-entry-row, text-input-state: emoji-or-rtl, history-state: "entries-with-blank-run-name", action: type-run-name}
  object: "Report mode field 'Run name (optional)'"
  situation: "A user types the Arabic or Hebrew name 'اختبار المستخدم (2)' mixed with 'v2' and a trailing date; the row is laid out left-to-right with the mode badge to the left."
  consequence: "The '(2)' jumps to the wrong end and the digits attach to the neighbouring badge; the row reads as a different name."
  p_typical: 0.02
  grounded: "speculative"
  evidence: "none"
  proposed: "Spec asks that user-entered text be rendered in an element with dir='auto' so each name picks its own direction."
  shallow: false
- id: l10n-14
  title: "Right-to-left video names in the selected-videos list put the file extension on the wrong side"
  level: "L3"
  cell: {surface: selected-videos-list, video-state: duplicate-name-different-content, text-input-state: emoji-or-rtl, videos-selected: "6-20"}
  object: "Add video pop-up selection and the selected videos after confirm"
  situation: "Videos named 'مقابلة_1.mp4' and 'مقابلة_2.mp4' in a left-to-right layout, 6-20 of them; trailing '.mp4' and the number order are visually reordered."
  consequence: "'1_مقابلة.mp4'-style display means the user cannot tell _1 from _2 and may remove the wrong video."
  p_typical: 0.02
  grounded: "speculative"
  evidence: "none"
  proposed: "Spec requires dir='auto' on video-name elements and an isolated extension span."
  shallow: false
- id: l10n-15
  title: "Error text from the agent provider reaches a failed History entry in English only"
  level: "L3"
  cell: {surface: history-entry-detail, run-status: failed, time-and-connection: during-agent-outage, mode: report}
  object: "Unspecified: 'what opening an entry shows while running, when done, and when failed'"
  situation: "The provider returns 'Request failed: context length exceeded' or 'Service overloaded, try again later'. UI is German or Japanese and the failed entry detail prints the string as received."
  consequence: "A German user sees one English sentence in a German screen; the string cannot be translated because it is free text, not a code, and support receives screenshots in 3 languages."
  p_typical: 0.10
  grounded: "quote"
  evidence: "what opening an entry shows while running, when done, and when failed."
  proposed: "Spec states failed entries show a translated message chosen from a fixed list of error codes (at least 6), with the raw provider text only in a collapsed 'Details' block."
  shallow: false
- id: l10n-16
  title: "Entry status badge labels Queued, Running, Done, Failed grow in German and may not fit at 360px"
  level: "L3"
  cell: {surface: history-entry-status-badge, run-status: "partial-some-videos-unusable", history-state: "several-running-at-once", time-and-connection: steady-state}
  object: "Assumed statuses Queued / Running / Done / Failed (frame assumption), History entry row"
  situation: "German labels are 'In Warteschlange', 'Wird ausgeführt', 'Abgeschlossen', 'Fehlgeschlagen', and 'Teilweise abgeschlossen' for partial; 6 to 23 characters against 4 to 7 in English."
  consequence: "Badges wrap to two lines or are cut to 'Fehlgeschla…' on a 360px row, so Done and Failed look alike at a glance."
  p_typical: 0.06
  grounded: "inferred"
  evidence: "Statuses an entry can have on the History tab"
  proposed: "Spec sets a max badge width of 120px and requires a status icon plus a tooltip with the full label."
  shallow: false
- id: l10n-17
  title: "Run name limit of 200 characters is not defined in characters, bytes or width, and CJK and long German words overflow the row"
  level: "L3"
  cell: {surface: run-name-field, text-input-state: run-name-200-chars, history-state: "entries-with-blank-run-name", action: type-run-name}
  object: "Report mode field 'Run name (optional)'"
  situation: "A 200-character Japanese name has no spaces, and a German name contains 'Nutzerfreundlichkeitstestergebnisse' (35 letters). Emoji count as 2 UTF-16 units."
  consequence: "A 120-character byte limit cuts a Japanese name at 40 characters; the row cannot wrap at word boundaries and pushes the status badge off screen at 360px."
  p_typical: 0.03
  grounded: "speculative"
  evidence: "none"
  proposed: "Spec fixes a limit of 100 characters (grapheme clusters, not bytes) and requires overflow-wrap:anywhere with a two-line clamp in the row."
  shallow: false
- id: l10n-18
  title: "Fallback row title for a blank run name is a translated string or a stored string, and is not specified"
  level: "L3"
  cell: {surface: history-entry-row, text-input-state: run-name-empty, history-state: "entries-with-blank-run-name", mode: report}
  object: "Run name (optional)"
  situation: "The user leaves Run name empty and 40 entries get a title. If the server writes 'Untitled report' at submit time it stays English; if the client renders 'Unbenannter Bericht' it changes with the locale; if it derives the title from the first 40 characters of the prompt, Japanese is cut at 40 characters."
  consequence: "A German user sees a column of 'Untitled report' rows, or two entries read differently after a locale change; a Japanese prompt gives a title of 40 characters with no spaces."
  p_typical: 0.04
  grounded: "inferred"
  evidence: "Run name (optional)"
  proposed: "Spec states blank names are stored as null and the fallback 'Bericht vom <date>' is rendered at display time."
  shallow: false
- id: l10n-19
  title: "Question and prompt limits counted in characters mean very different amounts of content in Japanese than in English or German"
  level: "L3"
  cell: {surface: question-field, text-input-state: question-exceeds-limit, mode: ask-question, action: type-question}
  object: "Ask question mode: 'A question about the selected videos, typed by the user'"
  situation: "A limit of 5000 characters (frame state prompt-5000-chars) lets a Japanese user send about 10000 or more tokens while an English user sends about 1200; the limit message says 'Maximum 5,000 characters'."
  consequence: "The same limit permits a 4x difference in request size; German users with 5000 characters of compound words reach the cost ceiling much earlier than the counter implies."
  p_typical: 0.03
  grounded: "speculative"
  evidence: "none"
  proposed: "Spec defines the limit as a token or grapheme count and shows a live counter 'n / 5000' that treats a CJK character as 1."
  shallow: false
- id: l10n-20
  title: "Follow-up asked in a different language than the first question has no rule for answer language"
  level: "L3"
  cell: {surface: follow-up-thread, thread-state: "follow-up-1", text-input-state: non-english-text, action: ask-follow-up}
  object: "Ask question mode: 'Follow-up questions are supported after the first answer.'"
  situation: "First question typed in German gets a German answer; the user types follow-up 1 in Japanese ('もう少し詳しく') or just 'more detail' in English."
  consequence: "The answer language flips mid-thread, or stays German against the user's language; the thread contains 2 languages with no indicator."
  p_typical: 0.04
  grounded: "quote"
  evidence: "Follow-up questions are supported after the first answer."
  proposed: "Spec states each answer follows the language of the latest user message unless the prompt fixed a language."
  shallow: false
- id: l10n-21
  title: "Same user on two devices with different UI languages sees one entry rendered by two locales"
  level: "L3"
  cell: {surface: history-entry-detail, time-and-connection: two-devices-same-user, history-state: "report-and-question-entries-interleaved", observer-location-at-status-change: other-device}
  object: "Clarification: 'History is per user, currently.'"
  situation: "Desktop in Japanese, phone in German; the entry created on the desktop is opened on the phone while status changes from Running to Done."
  consequence: "Badge, dates and mode names switch language, but the stored answer text stays Japanese; whether the locale is a per-user setting or per-browser setting is not in the spec."
  p_typical: 0.03
  grounded: "inferred"
  evidence: "History is per user, currently."
  proposed: "Spec says the UI locale is stored on the user profile, not the browser, and lists which fields are generated content (not translated)."
  shallow: false
- id: l10n-22
  title: "Japanese text in a German-locale page renders with Chinese glyph variants when lang is missing on user content"
  level: "L3"
  cell: {surface: selected-videos-list, text-input-state: non-english-text, video-state: multi-language-audio, popup-session-state: first-open}
  object: "Selected videos list showing names chosen in the Add video pop-up"
  situation: "The page has lang='de'; video names like '直' and '骨' in Japanese appear with Simplified-Chinese forms in some fonts; 0 elements carry lang='ja'."
  consequence: "A Japanese user sees wrong kanji shapes in their own video names and run names; the default font stack has no Japanese font and shows boxes on 1 of 5 test devices."
  p_typical: 0.02
  grounded: "speculative"
  evidence: "none"
  proposed: "Spec requires lang set from the detected language of user text, and a font stack with Noto Sans JP and Yu Gothic."
  shallow: false
- id: l10n-23
  title: "Partial status message 'x of y videos used' is composed by concatenation and breaks in German and Japanese word order"
  level: "L3"
  cell: {surface: history-entry-detail, run-status: "partial-some-videos-unusable", per-video-outcome-within-run: some-videos-unusable, videos-selected: "6-20"}
  object: "Unspecified: 'what opening an entry shows ... when done, and when failed'"
  situation: "8 of 12 videos used. English 'Report based on 8 of 12 videos', German 'Bericht basiert auf 8 von 12 Videos', Japanese '12本中8本の動画に基づくレポート' put the numbers in different places."
  consequence: "Code that joins 'Report based on ' + n + ' of ' + m yields wrong sentences in 2 of 3 languages; translators need one sentence with named placeholders."
  p_typical: 0.03
  grounded: "inferred"
  evidence: "what opening an entry shows while running, when done, and when failed."
  proposed: "Spec lists the partial string as a single message with {used} and {total} placeholders and plural rules."
  shallow: false
- id: l10n-24
  title: "Spec names the same object submission, entry, output and run, which become 4 different words in German and Japanese"
  level: "L3"
  cell: {surface: history-tab, mode: report, history-state: "report-and-question-entries-interleaved", action: open-history-entry}
  object: "Spec sentences 'Lists past and current submissions', 'a new entry appears' and 'A Report produces one output'"
  situation: "Translators render 'submission' as 'Einreichung', 'entry' as 'Eintrag', 'output' as 'Ergebnis' and the run name field as 'Name des Durchlaufs'; Japanese picks 送信, エントリ, 出力, 実行."
  consequence: "The tab, the row, the empty state and the Run name label each use a different noun for one thing; users search help for the wrong word."
  p_typical: 0.03
  grounded: "quote"
  evidence: "Lists past and current submissions from both modes."
  proposed: "Spec adds a glossary with one UI term for run, entry, output, report and ask, and one translation per language."
  shallow: false
- id: l10n-25
  title: "Videos page does not say which language a video is transcribed in, so Japanese audio can be ingested as German"
  level: "L3"
  cell: {surface: videos-page, video-state: non-english-audio, actor: video-uploader-other-than-runner, entry-point-and-lifecycle-phase: before-first-ingestion-completes}
  object: "Videos page: 'users upload videos; uploaded videos get ingested.'"
  situation: "A German user uploads a Japanese interview; ingestion uses the UI language or a default of English. The video reaches state ingested with a wrong or empty transcript."
  consequence: "The video is selectable in the pop-up, the Report is built on a garbled transcript, and nothing marks the problem; the user blames the agent."
  p_typical: 0.05
  grounded: "inferred"
  evidence: "uploaded videos get ingested."
  proposed: "Spec states the transcript language is auto-detected, stored per video, and shown as a language chip (de, ja, en) on the video."
  shallow: false
- id: l10n-26
  title: "Add video pop-up has no way to filter by spoken language, so a mixed library cannot be narrowed to one language"
  level: "L3"
  cell: {surface: tag-filter, library-state: "50-videos", video-state: multi-language-audio, action: filter-by-tag}
  object: "Add video pop-up: 'filtering by the tags the user has applied to videos'"
  situation: "50 videos, 30 Japanese, 12 German, 8 English; the only filters are user-applied tags, which the user has not applied for language."
  consequence: "To make a Japanese-only Report the user opens 30 rows one at a time; language chips would be missing in the list."
  p_typical: 0.04
  grounded: "inferred"
  evidence: "The pop-up supports filtering by the tags the user has applied to videos, and searching by name."
  proposed: "Spec adds an automatic language filter populated from detected transcript language."
  shallow: false
- id: l10n-27
  title: "The words 'ingested' and 'ingesting' have no user-facing translation, and the pop-up state for a still-ingesting video has no copy"
  level: "L3"
  cell: {surface: add-video-popup, video-state: still-ingesting, library-state: all-videos-still-ingesting, popup-session-state: first-open}
  object: "Spec: 'selects videos from their ingested videos'; unspecified: 'Whether a video that is still ingesting ... can be selected.'"
  situation: "German translators choose 'verarbeitet', 'indiziert' or 'aufgenommen'; Japanese choose 取り込み済み or 処理済み. The pop-up shows the label on a disabled or hidden row."
  consequence: "The Videos page says 'Verarbeitung' and the pop-up says 'Indizierung' for the same state; a user whose 10 videos are all ingesting sees an empty pop-up with no explanation in their language."
  p_typical: 0.04
  grounded: "quote"
  evidence: "Whether a video that is still ingesting, or failed ingestion, can be selected."
  proposed: "Spec supplies final user-facing wording in English for ingesting, ingested and failed and a one-sentence context note for translators."
  shallow: false
- id: l10n-28
  title: "The notification when a run finishes (if added) is sent in the server locale, not the recipient's"
  level: "L3"
  cell: {surface: notification-email-or-in-app, run-status: done, observer-location-at-status-change: logged-out, actor: background-agent-job}
  object: "No notification is specified; 'No loading page' means the user may leave before the run is done"
  situation: "A Japanese user submits a Report and leaves; the background job finishes 12 minutes later and sends an email or in-app message with subject 'Your report is ready'."
  consequence: "The mail arrives in English, includes the entry name in Japanese and a date in US format; the job has no access to the browser locale, only to the user profile if the locale was saved there."
  p_typical: 0.03
  grounded: "speculative"
  evidence: "There is no loading page, to save the user's time."
  proposed: "Spec states notifications use the profile locale and a fallback of English, and the subject carries the run name."
  shallow: false
- id: l10n-29
  title: "Copying or exporting a Japanese or German report has no rule for encoding or font"
  level: "L3"
  cell: {surface: export-or-copy-output, action: copy-output, mode: report, text-input-state: non-english-text}
  object: "Report output in the entry detail (copy and export are not in the spec)"
  situation: "A user copies the report into Excel or exports CSV or PDF; the file is UTF-8 without BOM, the PDF font has no CJK glyphs."
