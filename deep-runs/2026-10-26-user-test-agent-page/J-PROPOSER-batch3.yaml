- id: participant-1
  case: >-
    The spec gives video data two lifecycles and never connects them. The Videos page lets users upload videos, and the
    History tab "Lists past and current submissions" with no expiry. A Report is "one output covering all selected
    videos", so it is a distilled derivative of every participant in the run: verbatim quotes, timestamps and often
    names. When a participant withdraws consent and the researcher deletes the video, the most portable and most
    forwarded copy of that person's data stays in the runner's History indefinitely. The researcher believes they have
    honoured an erasure request when they have not, and nothing on either surface tells them otherwise. This is a
    compliance failure (GDPR Art. 17 and standard research-consent terms) and the company's legal exposure, not the
    researcher's. It has to be specified before build because it decides the data model: entries must store which video
    IDs they came from, and that link is cheap to add now and painful to backfill across every existing entry later. The
    evidence is speculative (p=0.12, scored 75 on severity 5 / detectability 5), but the fix is one spec line: deleting
    a video redacts or deletes every derived entry and shows "Source removed: content redacted on <date>".
- id: participant-31
  case: >-
    "Prompt / instructions (optional)" means the default Report, written with an empty prompt, is the most common
    output, and the spec gives the agent no rule about how to refer to people. Real names reach the transcript in the
    first minute of most moderated sessions ("Thanks for joining, Dana"). The obvious agent behaviour is to use them,
    giving lines like "Dana struggled with the coupon field". Those lines then go into decks and stakeholder emails, which
    breaks the pseudonymity many studies promise participants. Detection is poor (scored 4): the researcher reading the
    report sees a natural sentence, not a privacy breach, and the harm surfaces only after the report has travelled. The
    cost to address is the lowest in the batch (1): one default of "Participant 1..N in selection order, real names only
    if a workspace setting allows". That default also makes cross-video references unambiguous. Leaving it unspecified
    lets the prompt engineer decide a consent question by accident, so the PM should own it now.
- id: contract-5
  case: >-
    The spec defines the Report only as "one output covering all selected videos" and makes instructions optional, so
    with an empty prompt the agent's default narrative style sets how frequency is worded. LLM summaries default to
    "most users", "many participants" and "a few". Over a 6-20 video selection, those words hide exactly the number a
    stakeholder needs: "most participants struggled with filters" reads the same whether it was 4 or 10 of 12. The person
    harmed is downstream. An exec acts on an overstated finding and the researcher's credibility takes the hit when
    someone checks the videos. Detectability is low because nothing in the text looks wrong. Unlike open-ended "quality"
    concerns, this one can be written as a single testable acceptance criterion: every frequency claim carries an
    explicit "N of M videos", and the vague quantifiers never appear without a count on the same line. QA can check it
    automatically, and it costs almost nothing to add to the prompt contract now (cost 1). Fixing it after launch means
    changing the voice of reports users have already learned to trust.
- id: lowvision-25
  case: >-
    The spec admits that entries have statuses ("Statuses an entry can have on the History tab" is listed as
    unspecified). Because there is no loading page, the History row badge is the only signal of whether a run succeeded:
    "On submit the user is redirected to the History tab". The default rendering a designer or component library will
    produce is a coloured dot or pill, green for Done and red for Failed, with the same shape. About 8% of men have
    red-green colour-vision deficiency. For them, scanning a 100-entry history, Failed and Done look identical, so they
    open or share a failed or empty report as if it were finished. It also fails WCAG 1.4.1 (Use of Color), which is a
    procurement blocker for many enterprise buyers. The fix costs almost nothing if specified with the status set (cost
    1): each badge carries a text word plus a distinct icon shape (clock, spinner, check, exclamation) at 4.5:1 contrast.
    Since the PM must define the statuses before build anyway, the badge treatment should go in the same spec line
    rather than become an accessibility bug ticket after launch.
- id: contract-12
  case: >-
    "A Report produces one output covering all selected videos, not one per video" asks the agent to aggregate, and the
    spec sets no threshold for what counts as a finding. With an empty optional prompt, a single participant's remark
    about pricing can come out as the headline "Users find pricing unclear". It carries the same weight and format as a
    pattern seen in 9 of 12 videos, and the stakeholder acts on one comment. This is the main way a synthesis tool loses
    trust: the error is invisible in the output and only shows up when someone rewatches the footage, which few do.
    Specifying it now is cheap (cost 2) and gives the Report structure a firm shape. A finding needs at least one verbatim
    quote with a timestamp plus an "N of M" count, and items seen in exactly one video go under "Single observations". That
    contract also shapes the History entry detail layout and the evaluation set the backend team needs before tuning
    prompts, so leaving it until after build means redoing both.
