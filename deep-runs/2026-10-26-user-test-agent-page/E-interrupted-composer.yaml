- id: draft-1
  title: Report form with 4 videos, run name and a 3,000-char prompt is wiped when the user clicks over to the Videos page and returns
  level: L3
  cell: {surface: report-form, action: navigate-away-mid-compose, entry-point-and-lifecycle-phase: returning-mid-compose, text-input-state: prompt-5000-chars}
  object: 'Agent page, Report mode: Run name, Add video, Prompt / instructions, Submit'
  situation: User spends 5 minutes writing a prompt, remembers one video is not ingested, opens the Videos page, uploads or fixes it (about 10 minutes), then clicks Agent page in the nav.
  consequence: Run name, prompt and selection are gone unless a draft is kept. The user retypes a long prompt and may abandon the run.
  p_typical: 0.30
  grounded: inferred
  evidence: 'The spec lists the form fields but states nothing on whether form state survives leaving the page.'
  proposed: Add a line stating whether the form is kept for the session, kept until Submit, or discarded, and show a leave-page warning if discarded.
  shallow: false
- id: draft-2
  title: Selection of 3 videos in the Add video pop-up is retained or reset after a round trip to the Videos page is unspecified
  level: L3
  cell: {surface: selected-videos-list, videos-selected: 2-5, action: return-to-draft, popup-session-state: reopen-with-prior-selection}
  object: 'Add video pop-up and the selected-videos list on the Agent page'
  situation: User confirms 3 videos in the pop-up, leaves for the Videos page, comes back and clicks Add video again.
  consequence: Pop-up opens with 0 checked or 3 checked; the user cannot tell whether the earlier selection still counts and may add duplicates or lose it.
  p_typical: 0.12
  grounded: inferred
  evidence: 'clicking "Add video" opens a pop-up where the user selects videos from their ingested videos'
  proposed: State that reopening the pop-up shows prior selection checked, and where the draft selection lives (session, local storage, server).
  shallow: false
- id: draft-3
  title: Arriving on the Agent page from the Videos page with videos preselected is not specified (mode, selection, count)
  level: L3
  cell: {surface: videos-page, entry-point-and-lifecycle-phase: arriving-from-videos-page-with-preselection, videos-selected: 1, mode: report}
  object: 'Videos page and Agent page, Add video pop-up'
  situation: User uploads a video, opens it on the Videos page and expects to jump to the agent with that one video already selected.
  consequence: If there is no such entry point the user must navigate manually and re-find the video among 50. If there is, the target mode (Report or Ask question) and whether it replaces a half-written draft are undefined.
  p_typical: 0.08
  grounded: speculative
  evidence: 'Videos come from a separate Videos page where users upload and videos get ingested; the spec names no link between the Videos page and the Agent page.'
  proposed: Decide whether the Videos page has an Analyse or Ask action, which mode it opens, and whether preselection is merged with or replaces the existing draft.
  shallow: false
- id: draft-4
  title: Preselection from the Videos page that includes a video still ingesting has no rule (blocked, dropped silently, or kept)
  level: L3
  cell: {surface: videos-page, entry-point-and-lifecycle-phase: arriving-from-videos-page-with-preselection, video-state: still-ingesting, videos-selected: 2-5}
  object: 'Still unspecified: "Whether a video that is still ingesting, or failed ingestion, can be selected."'
  situation: User ticks 4 videos on the Videos page, one is still ingesting, and continues to the Agent page.
  consequence: Selected list shows 4, 3, or 4 with one unusable; Submit outcome is undefined.
  p_typical: 0.06
  grounded: inferred
  evidence: 'Whether a video that is still ingesting, or failed ingestion, can be selected.'
  proposed: Specify that preselected non-ingested videos are dropped with a visible message naming them, or kept in a pending state.
  shallow: false
- id: draft-5
  title: Video uploaded while the user was away does not appear in a pop-up that was loaded before the upload (or appears greyed with no ready notice)
  level: L3
  cell: {surface: add-video-popup, video-state: still-ingesting, entry-point-and-lifecycle-phase: returning-mid-compose, library-state: library-changing-while-popup-open}
  object: 'Add video pop-up, videos "from their ingested videos"'
  situation: User uploads a 40-minute video on the Videos page, ingestion takes 8 minutes, user returns to the draft after 3 minutes and opens the pop-up.
  consequence: User cannot find the video, searches the name, gets zero results, and does not know whether it is missing, still ingesting, or failed; no way to be told when it becomes selectable.
  p_typical: 0.10
  grounded: inferred
  evidence: 'selects videos from their ingested videos'
  proposed: Show ingesting videos in the pop-up as disabled rows with a status label, or show a count line like "1 video still processing".
  shallow: false
- id: draft-6
  title: Deep link or bookmark to Ask question mode has no URL rule, so a bookmark opens Report mode or loses the mode on refresh
  level: L3
  cell: {surface: agent-page-mode-switch, entry-point-and-lifecycle-phase: deep-link-to-mode, mode: ask-question, action: open-agent-page}
  object: 'Agent page, two modes, Report and Ask question'
  situation: User bookmarks the Agent page while in Ask question mode, or shares a link to a colleague, and opens it next day.
  consequence: Lands in the default mode; refresh after switching mode resets to Report; History tab is also not addressable.
  p_typical: 0.07
  grounded: speculative
  evidence: 'Agent page: two modes, **Report** and **Ask question**, plus a **History** tab.'
  proposed: Add a rule that mode and tab are part of the URL (for example a query parameter) and survive refresh.
  shallow: false
- id: draft-7
  title: Text typed in one mode is kept or cleared when the user switches mode, leaves, and returns
  level: L3
  cell: {surface: agent-page-mode-switch, mode: switching-mode-after-selecting-videos, text-input-state: prompt-5000-chars, entry-point-and-lifecycle-phase: returning-mid-compose}
  object: 'Report mode Prompt / instructions field and Ask question mode question field'
  situation: User writes a 2,000-char prompt in Report mode with 5 videos, clicks Ask question to try a question, then goes to the Videos page and comes back.
  consequence: Selection is shared between modes (same pop-up) but text is per mode; no rule for which survive, so the prompt, the question, or both may be gone.
  p_typical: 0.12
  grounded: inferred
  evidence: 'Add video (same pop-up as Report mode)'
  proposed: State that selection is shared across modes and that each mode keeps its own text until Submit or explicit clear.
  shallow: false
- id: draft-8
  title: Session expires while composing a long prompt; login redirect returns to a blank form
  level: L3
  cell: {surface: report-form, time-and-connection: session-expired-while-composing-long-prompt, text-input-state: prompt-5000-chars, action: submit}
  object: 'Prompt / instructions field, Submit'
  situation: User composes for 45 minutes with a break to the Videos page; session timeout (assumed 30 minutes idle) fires; user clicks Submit.
  consequence: Submit returns an auth error or redirects to login; after login the page loads empty, a 5,000-char prompt is lost, and the user is unsure whether the run was created.
  p_typical: 0.10
  grounded: inferred
  evidence: 'On submit the user is redirected to the **History** tab'
  proposed: Add a rule that on session expiry the form content is preserved client-side and re-populated after login.
  shallow: false
- id: draft-9
  title: Submit while the session has expired may land on History with no new entry and no message
  level: L3
  cell: {surface: redirect-transition, time-and-connection: session-expired-at-submit, run-status: submit-accepted-but-entry-never-created, action: submit}
  object: 'Redirect to the History tab after Submit'
  situation: Submit request is rejected 401 but the client has already navigated because there is no loading page.
  consequence: User sees History without the new entry, assumes it is still loading, and waits; run never exists.
  p_typical: 0.06
  grounded: inferred
  evidence: 'There is no loading page, to save the user''s time. On submit the user is redirected to the **History** tab'
  proposed: Specify that redirect happens only after the server confirms creation, or that a failed create adds a visible failed entry or banner.
  shallow: false
- id: draft-10
  title: Browser tab refresh or crash restore with a half-filled form for 2 hours has no draft rule
  level: L3
  cell: {surface: report-form, time-and-connection: page-open-for-hours, action: navigate-away-mid-compose, text-input-state: prompt-5000-chars}
  object: 'Agent page form (Run name, Prompt / instructions, selected videos)'
  situation: Page open for 2 hours, user presses F5 or the browser restores tabs after a crash before clicking Submit.
  consequence: All fields reset; the pop-up selection list may also be stale compared with the library.
  p_typical: 0.06
  grounded: speculative
  evidence: 'none'
  proposed: Decide whether drafts are autosaved (local or server) and for how long, with a stated retention (for example 7 days).
  shallow: false
- id: draft-11
  title: Browser Back from the History tab returns a filled form, enabling a second submit of the same run
  level: L3
  cell: {surface: redirect-transition, action: back-button-after-redirect, run-status: submitted-not-yet-visible-in-history, text-input-state: run-name-duplicate-of-existing}
  object: 'Redirect to History tab; Agent page form'
  situation: User submits, sees History, presses Back to check the prompt wording; browser restores the page with all fields and 4 videos still filled.
  consequence: Clicking Submit again creates a second entry with the same run name; two reports run and use two quota units.
  p_typical: 0.12
  grounded: inferred
  evidence: 'On submit the user is redirected to the **History** tab, where a new entry appears with whatever was submitted.'
  proposed: Specify that after a successful submit the form is cleared, so Back shows an empty form, and say what Back shows.
  shallow: false
- id: draft-12
  title: Browser Back from History after Submit shows an empty form with no way to see what was just submitted
  level: L3
  cell: {surface: redirect-transition, action: back-button-after-redirect, mode: ask-question, text-input-state: question-picked-from-suggested}
  object: 'Ask question form; History entry created on Submit'
  situation: User picks a suggested question, submits, then presses Back wanting to ask a different suggested question on the same 3 videos.
  consequence: Selection is gone and has to be rebuilt; the user cannot reuse the last selection.
  p_typical: 0.07
  grounded: speculative
  evidence: 'none'
  proposed: Offer "ask another question on these videos" from the entry, or keep selection after Submit.
  shallow: false
- id: draft-13
  title: A validation error after Submit has no place to show because the form is already gone after the redirect
  level: L3
  cell: {surface: error-toast-or-banner, run-status: failed-before-start-validation, text-input-state: question-exceeds-limit, action: submit}
  object: 'Submit, redirect to History tab, Ask question field'
  situation: User pastes a 6,000-char question; client does not block; server rejects it after the redirect has happened.
  consequence: User sits on History, sees either nothing, a failed entry with no reason, or a toast on the wrong page; the typed question is not recoverable.
  p_typical: 0.10
  grounded: inferred
  evidence: 'There is no loading page, to save the user''s time. On submit the user is redirected to the **History** tab'
  proposed: Specify that all validation (length, 0 videos, non-ingested video) runs client-side before redirect, and that server rejections create a Failed entry that shows the reason and the original input.
  shallow: false
- id: draft-14
  title: Video deleted on the Videos page between selection and Submit causes a post-redirect failure with no way back to the draft
  level: L3
  cell: {surface: history-entry-row, video-state: deleted-after-selection-before-run, run-status: failed-before-start-validation, action: edit-and-resubmit-from-entry}
  object: 'History entry with "whatever was submitted"; selected-videos list'
  situation: User has 3 videos selected, deletes one on the Videos page in another tab, returns and presses Submit.
  consequence: Entry fails or runs on 2 videos; the user wants to fix and resubmit but the form is gone.
  p_typical: 0.08
  grounded: inferred
  evidence: 'a new entry appears with whatever was submitted'
  proposed: Specify validity check at Submit and a "Copy to new run" action on the entry that refills form fields and selection.
  shallow: false
- id: draft-15
  title: A Failed entry cannot be turned back into a form (no edit-and-resubmit), so recovery needs full retyping
  level: L3
  cell: {surface: history-entry-detail, action: edit-and-resubmit-from-entry, run-status: failed, text-input-state: prompt-5000-chars}
  object: 'History entry detail; Still unspecified: "what opening an entry shows while running, when done, and when failed"'
  situation: A report with a 4,000-char prompt fails after the user fixed a video on the Videos page.
  consequence: User has to copy the prompt text from the entry (if shown) and reselect 8 videos by hand.
  p_typical: 0.15
  grounded: quote
  evidence: 'Statuses an entry can have on the History tab, and what opening an entry shows while running, when done, and when failed.'
  proposed: Add a "Run again with edits" action on Failed and Done entries that prefills name, prompt and video set.
  shallow: false
- id: draft-16
  title: Draft started on a laptop is not available on a phone or second device
  level: L3
  cell: {surface: report-form, time-and-connection: two-devices-same-user, action: return-to-draft, entry-point-and-lifecycle-phase: returning-mid-compose}
  object: 'Agent page form; History is per user'
  situation: User starts a Report on desktop, closes the laptop, opens the Agent page on a tablet the next morning.
  consequence: Form is empty; the user may assume the draft was saved because History is per user and account-wide.
  p_typical: 0.04
  grounded: speculative
  evidence: 'History is per user.'
  proposed: Say explicitly that drafts are device-local (or account-wide) so support can answer the question.
  shallow: false
- id: draft-17
  title: Two tabs of the same user composing different runs share or overwrite one draft
  level: L3
  cell: {actor: same-user-second-tab, surface: report-form, observer-location-at-status-change: other-tab, action: submit}
  object: 'Agent page form and History tab, per user'
  situation: Tab A holds a Report draft with 5 videos, tab B was opened from the Videos page with 1 preselected video; user submits in B first.
  consequence: If drafts are stored per user, B overwrites A; if per tab, A keeps stale selection pointing to a video that B just changed. Tab A History does not show B entry until refresh.
  p_typical: 0.04
  grounded: speculative
  evidence: 'none'
  proposed: Decide draft scope (per tab or per user) and whether History updates across open tabs.
  shallow: false
- id: draft-18
  title: Closing the Add video pop-up without confirming discards 15 checked videos selected through a tag filter
  level: L3
  cell: {surface: popup-footer-confirm-cancel, popup-session-state: closed-without-confirm, action: close-popup-without-confirm, videos-selected: 6-20}
  object: 'Add video pop-up (filter by tags, search); footer confirm or cancel'
  situation: User spent 3 minutes filtering by tag and ticking 15 videos, then clicks outside the pop-up or presses Esc.
  consequence: Selection is lost with no confirmation prompt, and nothing in the spec says whether Esc, outside click and a Cancel button behave the same.
  p_typical: 0.10
  grounded: inferred
  evidence: 'clicking "Add video" opens a pop-up where the user selects videos ... filtering by the tags ... and searching by name.'
  proposed: Specify the pop-up has an explicit Confirm and Cancel, that outside click equals Cancel, and whether a discard prompt shows for 5 or more checked videos.
  shallow: false
- id: draft-19
  title: Tag filter and search text in the pop-up are reset on reopen after the user edited tags on the Videos page
  level: L3
  cell: {surface: tag-filter, library-state: tag-renamed-or-deleted-after-filtering, popup-session-state: selection-hidden-by-filter, entry-point-and-lifecycle-phase: returning-mid-compose}
  object: 'Pop-up tag filter and search box'
  situation: User filtered by tag "interview-oct", ticked 6 videos, left, renamed the tag to "interviews-oct" on the Videos page, and returns.
  consequence: Saved filter points to a tag that no longer exists; selected videos hidden by the filter or filter shows zero results while the selection still holds 6.
  p_typical: 0.05
  grounded: inferred
  evidence: 'filtering by the tags the user has applied to videos'
  proposed: Specify that filter and search reset on every open, and that selected videos remain visible in a "Selected" section regardless of filter.
  shallow: false
- id: draft-20
  title: A video the user tagged after leaving does not appear under the tag filter in a pop-up that was loaded earlier
  level: L3
  cell: {surface: tag-filter, video-state: untagged, time-and-connection: page-open-for-hours, library-state: all-untagged}
  object: 'Pop-up tag filter list'
  situation: User opens the Agent page at 9:00 with 0 tags in the library, tags 10 videos on the Videos page in another tab, then reopens the pop-up without reload.
  consequence: Tag list is empty, so the user concludes tagging does not work with the agent page; the spec has no refresh or live-update rule for pop-up data.
  p_typical: 0.05
  grounded: speculative
  evidence: 'filtering by the tags the user has applied to videos'
  proposed: Specify that pop-up data is fetched on every open.
  shallow: false
- id: draft-21
  title: A typed question or edited suggested question is lost when the user leaves to fix a video
  level: L3
  cell: {surface: question-field, text-input-state: suggested-question-edited-after-pick, action: navigate-away-mid-compose, mode: ask-question}
  object: 'Ask question mode: question field and suggested questions'
  situation: User picks a suggested question, edits 3 words to fit their case, then discovers a missing video and leaves for the Videos page.
  consequence: On return the field shows empty or the original suggestion, so the user must remember the edit.
  p_typical: 0.07
  grounded: inferred
  evidence: 'Suggested questions are shown and can be picked'
  proposed: Treat the question field as part of the draft with the same persistence as Report mode.
  shallow: false
- id: draft-22
  title: If suggested questions are derived from the selected videos, a picked question becomes stale when the selection changes after the return
  level: L3
  cell: {surface: suggested-questions, text-input-state: question-picked-from-suggested, entry-point-and-lifecycle-phase: returning-mid-compose, video-state: re-ingesting-after-edit}
  object: 'Suggested questions list; Still unspecified: "Whether suggested questions are static or derived from the selected videos."'
  situation: User picked a derived question about video A, left to replace video A on the Videos page, returned with video A removed.
  consequence: Question text references content no longer selected; the suggestion list reshuffles and the user cannot find their original pick.
  p_typical: 0.05
  grounded: quote
  evidence: 'Whether suggested questions are static or derived from the selected videos.'
  proposed: If derived, say whether the picked question is cleared, kept, or flagged when the selection changes.
