- id: draft-25
  title: User replaces a video (same name) on the Videos page while a run using it is Running; which version the report used is not shown
  level: L3
  cell: {video-state: re-uploaded-same-name, per-video-outcome-within-run: video-replaced-mid-run, run-status: running, surface: history-entry-detail}
