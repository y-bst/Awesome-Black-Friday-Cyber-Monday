- id: draft-23
  title: Follow-up being typed in an open thread is lost when the user navigates away, and its draft rule differs from the first question
  level: L3
  cell: {surface: follow-up-thread, thread-state: thread-opened-from-history, action: ask-follow-up, entry-point-and-lifecycle-phase: returning-mid-compose}
  object: 'Follow-up thread; Follow-up questions are supported after the first answer.'
  situation: User opens a Done Ask entry from History, starts typing a follow-up of 300 chars, goes to the Videos page, and returns to History.
  consequence: Follow-up box is empty; unspecified whether draft text is kept per thread.
  p_typical: 0.06
  grounded: inferred
  evidence: 'Follow-up questions are supported after the first answer.'
  proposed: State that an unsent follow-up persists per thread for the session.
  shallow: false
- id: draft-24
  title: No in-app or email notice when a run finishes while the user is on the Videos page
  level: L3
  cell: {surface: notification-email-or-in-app, observer-location-at-status-change: other-page-in-app, run-status: done, entry-point-and-lifecycle-phase: post-submit-elsewhere-in-app}
  object: 'History tab entry; "There is no loading page, to save the user''s time."'
  situation: User submits a report on 12 videos, is redirected to History, goes to the Videos page for 10 minutes to fix an upload, and the run finishes meanwhile.
  consequence: No badge on nav, no toast; the user returns to the Agent page and sees a Done entry only by opening History, possibly hours later.
  p_typical: 0.10
  grounded: inferred
  evidence: 'There is no loading page, to save the user''s time.'
