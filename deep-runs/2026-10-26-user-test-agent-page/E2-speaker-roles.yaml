- id: speaker-1
  title: "Spec does not say whether ingestion labels speakers at all, so the Report on the history entry detail cannot tell moderator lines from participant lines"
  level: L3
  cell: {video-state: ingested, mode: report, surface: history-entry-detail, session-composition: one-participant-plus-moderator, actor: ingestion-job}
  object: "Videos page 'uploaded videos get ingested'; history entry detail (Report output)"
  situation: "Moderated 45-minute session; ingestion produces one undifferentiated transcript with no speaker labels; user submits a Report over it"
  consequence: "Report findings mix what the moderator said with what the participant said; the PM reading the entry cannot tell whose opinion a finding is"
  p_typical: 0.12
  grounded: inferred
  evidence: "Videos page: users upload videos; uploaded videos get ingested."
  proposed: "Spec line: ingestion output includes per-segment speaker labels with a role (moderator / participant / unknown); 'ingested' means labels exist or are explicitly marked absent"
  shallow: false

- id: speaker-2
  title: "Moderator's leading question ('So you found checkout confusing, right?') answered 'yeah' is reported as a participant finding 'checkout was confusing'"
  level: L4
  cell: {video-state: ingested, mode: report, surface: history-entry-detail, session-composition: one-participant-plus-moderator, per-video-outcome-within-run: all-videos-used}
  object: "Report output on history entry detail; 'A Report produces one output covering all selected videos'"
  situation: "At 12:40 the moderator asks a leading question; the participant replies 'yeah, I guess'; the Report lists 'Participant found checkout confusing' as a key finding"
  consequence: "A finding the moderator planted is presented as unprompted user evidence; the design team prioritises a fix the participant never raised"
  p_typical: 0.05
  grounded: inferred
  evidence: "A Report produces one output covering all selected videos, not one per video."
  proposed: "Acceptance criterion: a finding whose only support is assent to a moderator statement is marked 'prompted' with the moderator question quoted next to it"
  shallow: false

- id: speaker-3
  title: "Moderator think-aloud prompts ('Tell me what you're thinking', 'How does that feel?') quoted in the Report as participant sentiment"
  level: L4
  cell: {video-state: ingested, mode: report, surface: history-entry-detail, session-composition: one-participant-plus-moderator, text-input-state: prompt-empty}
  object: "Report output quotes on history entry detail"
  situation: "Moderator repeats 'how does that feel?' 9 times in a 30-minute session; Report with an empty prompt lists 'How does that feel?' under 'User quotes' or summarises the session as 'user frequently questioned how things felt'"
  consequence: "Quote section contains the moderator's words attributed to the user; the report reader loses trust in every quote on the entry"
  p_typical: 0.04
  grounded: inferred
  evidence: "Prompt / instructions (optional)"
  proposed: "Acceptance criterion: segments labelled moderator are never emitted under a 'participant quote' heading; test with a fixture where the moderator speaks 40% of words"
  shallow: false

- id: speaker-4
  title: "Entry detail shows a quote with no speaker label, so the reader cannot see whether 'this is really annoying' came from the participant or the moderator"
  level: L4
  cell: {video-state: ingested, mode: ask-question, surface: history-entry-detail, session-composition: one-participant-plus-moderator, thread-state: first-question}
  object: "History entry detail; 'what opening an entry shows ... when done' (listed as unspecified)"
  situation: "User asks 'What frustrated people most?' over 3 moderated videos; the answer cites 5 quotes as plain text with a video name and timestamp only"
  consequence: "Reader must open the cited timestamp for each quote to check who spoke; with 5 quotes x 3 videos that is 15 seeks"
  p_typical: 0.07
  grounded: quote
  evidence: "Statuses an entry can have on the History tab, and what opening an entry shows while running, when done, and when failed."
  proposed: "Spec line: every quote on entry detail renders as '<role or label> · <video name> · <mm:ss>', e.g. 'Participant · session-04 · 12:31'"
  shallow: false

- id: speaker-5
  title: "Two participants in one session (paired test) are merged into a single 'the user' in the Report"
  level: L3
  cell: {video-state: ingested, mode: report, surface: history-entry-detail, session-composition: multiple-participants, videos-selected: 1}
  object: "Report output on history entry detail"
  situation: "One 60-minute video shows a couple shopping together; diarisation finds 3 speakers (moderator + 2); the Report says 'the user first wanted X, then rejected X'"
  consequence: "Disagreement between the two participants reads as one person contradicting themselves; the finding is wrong rather than vague"
  p_typical: 0.03
  grounded: inferred
  evidence: "A Report produces one output covering all selected videos, not one per video."
  proposed: "Spec line: Report output refers to participants as 'P1', 'P2' per video when diarisation finds more than one non-moderator speaker"
  shallow: false

- id: speaker-6
  title: "Report counts '7 of 8 participants' using videos as the unit, though one video has 2 participants and two videos are the same participant on different days"
  level: L4
  cell: {video-state: ingested, mode: report, surface: history-entry-detail, session-composition: multiple-participants, videos-selected: 6-20, action: open-history-entry}
  object: "Report output counts; Add video pop-up selection of 8 videos"
  situation: "8 videos selected: video 3 has 2 participants, videos 6 and 7 are P05's day-1 and day-2 sessions; Report says '7 of 8 participants abandoned onboarding'"
  consequence: "The real denominator is 8 people across 8 videos by coincidence but with different membership; the percentage the PM quotes upward is unverifiable"
  p_typical: 0.03
  grounded: inferred
  evidence: "the user selects videos from their ingested videos. The pop-up supports filtering by the tags the user has applied to videos"
  proposed: "Spec line: counts in a Report state their unit ('7 of 8 videos' vs '7 of 9 speakers labelled participant'); no cross-video participant identity is assumed unless a participant tag links videos"
  shallow: false

- id: speaker-7
  title: "No way to tell the agent that two videos are the same participant, so cross-video identity relies on the agent guessing from voice or spoken name"
  level: L3
  cell: {video-state: ingested, mode: report, surface: tag-filter, session-composition: one-participant-plus-moderator, library-state: 50-videos}
  object: "Tag filter in the Add video pop-up; 'tags the user has applied to videos'"
  situation: "User tags videos 'P05' on the Videos page; spec does not say whether tags are passed to the agent as context or only used to filter the pop-up"
  consequence: "Agent treats P05's two sessions as two people, or merges two different people who both said 'I'm Sam'"
  p_typical: 0.04
  grounded: quote
  evidence: "The pop-up supports filtering by the tags the user has applied to videos"
  proposed: "Spec line: state whether video tags are sent to the agent with each video; if so, document a 'participant:<id>' tag convention used for counting"
  shallow: false

- id: speaker-8
  title: "Unmoderated think-aloud video has one speaker; if ingestion assumes a moderator, it may label the participant's self-questions ('what does this button do?') as moderator"
  level: L4
  cell: {video-state: ingested, mode: report, surface: history-entry-detail, session-composition: unmoderated-think-aloud, actor: ingestion-job}
  object: "Ingested transcript speaker labels; Report output"
  situation: "Role classifier assigns 'moderator' to any question-shaped utterance; in a 20-minute unmoderated session 30% of the participant's lines are questions to themselves"
  consequence: "The participant's most diagnostic confusion moments are filtered out of the findings as 'moderator prompts'"
  p_typical: 0.02
  grounded: speculative
  evidence: "Videos page: users upload videos; uploaded videos get ingested."
  proposed: "Acceptance criterion: role assignment is per speaker cluster, not per utterance; a single-speaker video gets role 'participant' for all segments"
  shallow: false

- id: speaker-9
  title: "Moderator-only stretch (moderator explains the task for 6 minutes) is summarised as part of the participant's experience"
  level: L4
  cell: {video-state: ingested, mode: report, surface: history-entry-detail, session-composition: moderator-only-stretch, per-video-outcome-within-run: video-truncated-to-fit-context}
  object: "Report output; 3-minute-plus intro in each selected video"
  situation: "Each of 12 videos opens with a 6-minute moderator briefing that describes the prototype's intended flow; Report says 'participants understood the intended flow'"
  consequence: "The moderator's description is read as participant comprehension; if long videos are truncated to fit context, the briefing may crowd out participant speech entirely"
  p_typical: 0.02
  grounded: speculative
  evidence: "Minimum and maximum number of videos per run; video length and size limits."
  proposed: "Spec line: when truncation is needed, moderator-only segments are dropped before participant segments, and the entry detail says how many minutes per video were read"
  shallow: false

- id: speaker-10
  title: "Bystander voice (partner, child, colleague off-camera) in a remote session is diarised as a second participant and quoted"
  level: L4
  cell: {video-state: ingested, mode: ask-question, surface: history-entry-detail, session-composition: bystander-present, thread-state: first-question}
  object: "Ask question answer on history entry detail"
  situation: "At 22:10 someone off-camera says 'just click the blue one'; user asks 'Where did participants get stuck?'; answer says 'the participant was told to click the blue button'"
  consequence: "Bystander's hint is cited as participant behaviour or as a design cue; the stuck point is hidden because a non-participant solved it"
  p_typical: 0.03
  grounded: inferred
  evidence: "Ask question mode: A question about the selected videos, typed by the user"
  proposed: "Spec line: speakers who are neither moderator nor the tagged participant are labelled 'other' and excluded from participant quotes and counts"
  shallow: false

- id: speaker-11
  title: "Report run on a video whose diarisation is missing has no stated behaviour: refuse, proceed silently, or proceed with a warning on the entry"
  level: L3
  cell: {video-state: ingested-with-partial-transcript, mode: report, surface: history-entry-detail, session-composition: one-participant-plus-moderator, run-status: done}
  object: "History entry status; 'what opening an entry shows ... when done'"
  situation: "Transcript ingested but speaker diarisation step failed or was skipped for 2 of 6 videos; status reads Done"
  consequence: "Entry looks identical to a fully-labelled run; the reader trusts quotes from the 2 unlabelled videos as much as the 4 labelled ones"
  p_typical: 0.04
  grounded: quote
  evidence: "Statuses an entry can have on the History tab, and what opening an entry shows while running, when done, and when failed."
  proposed: "Acceptance criterion: entry detail shows a banner 'Speaker labels unavailable for 2 of 6 videos: quotes from these videos are not attributed' and lists the 2 video names"
  shallow: false

- id: speaker-12
  title: "Add video pop-up does not show whether a video has speaker labels, so the user cannot exclude unlabelled videos before running"
  level: L4
  cell: {video-state: ingested, mode: report, surface: add-video-popup, session-composition: one-participant-plus-moderator, action: select-video}
  object: "Add video pop-up rows; 'select videos from their ingested videos'"
  situation: "Library of 50 videos where 8 older uploads were ingested before diarisation existed"
  consequence: "User learns only after reading the Report that some quotes are unattributed, and must re-run without those 8 videos"
  p_typical: 0.02
  grounded: inferred
  evidence: "the user selects videos from their ingested videos"
  proposed: "Spec line: pop-up rows show a 'no speaker labels' marker for videos ingested without diarisation"
  shallow: false

- id: speaker-13
  title: "Speaker labels are cluster ids ('Speaker 1', 'Speaker 2') with no role, and the role mapping differs per video, so 'Speaker 1' is the moderator in one video and the participant in the next"
  level: L4
  cell: {video-state: ingested, mode: report, surface: history-entry-detail, session-composition: one-participant-plus-moderator, videos-selected: 2-5}
  object: "Quote attribution on history entry detail for a multi-video Report"
  situation: "Report over 4 videos prints 'Speaker 1: I would never pay for this' citing video A (moderator reading a script) and video B (participant)"
  consequence: "Same label means different roles across the combined output; attributions are wrong in about half the quotes"
  p_typical: 0.03
  grounded: inferred
  evidence: "A Report produces one output covering all selected videos, not one per video."
  proposed: "Spec line: entry detail never shows raw diarisation cluster ids; it shows a role, or 'Speaker n (video name)' scoped per video"
  shallow: false

- id: speaker-14
  title: "No way to correct a wrong speaker role after ingestion, so every Report and follow-up repeats the same misattribution"
  level: L3
  cell: {video-state: ingested, mode: ask-question, surface: history-entry-detail, session-composition: one-participant-plus-moderator, thread-state: follow-up-1}
  object: "Videos page (ingestion owner); follow-up thread on history entry"
  situation: "User notices on the entry that the moderator and participant roles are swapped in 'session-11' and asks a follow-up 'the other speaker is the participant'"
  consequence: "Correction lives only in that thread; the next Report on the same video repeats the swap; re-uploading to fix it creates a duplicate"
  p_typical: 0.02
  grounded: inferred
  evidence: "Follow-up questions are supported after the first answer."
  proposed: "Spec line: Videos page lets the owner reassign speaker roles per video; existing entries keep a 'labels changed since this run' notice"
  shallow: false

- id: speaker-15
  title: "Report prompt 'only include what participants said, ignore the moderator' cannot be honoured on unlabelled transcripts, and the entry does not say it was ignored"
  level: L4
  cell: {video-state: ingested, mode: report, surface: history-entry-detail, session-composition: one-participant-plus-moderator, text-input-state: prompt-contradicts-report-mode}
  object: "Prompt / instructions (optional) field; Report output on entry detail"
  situation: "User writes that instruction in the prompt; 3 of 5 videos have no speaker labels; output still contains moderator lines from those 3"
  consequence: "User believes the filter applied because nothing on the entry says otherwise"
  p_typical: 0.03
  grounded: quote
  evidence: "Prompt / instructions (optional)"
  proposed: "Acceptance criterion: when a prompt asks for role filtering and labels are missing for any video, the entry detail lists those videos as 'filter not applied'"
  shallow: false

- id: speaker-16
  title: "Suggested questions phrased around 'participants' are shown for an unmoderated or moderator-only selection where the roles do not exist"
  level: L4
  cell: {video-state: ingested, mode: ask-question, surface: suggested-questions, session-composition: unmoderated-think-aloud, videos-selected: 1}
  object: "Suggested questions; 'Whether suggested questions are static or derived from the selected videos'"
  situation: "Static suggestion 'What did the moderator ask most often?' is offered for a single unmoderated think-aloud video"
  consequence: "Picking it yields an answer that invents a moderator or returns an empty answer marked Done"
  p_typical: 0.03
  grounded: quote
  evidence: "Whether suggested questions are static or derived from the selected videos."
  proposed: "Spec line: suggestions that reference a role are hidden when no selected video has that role labelled"
  shallow: false

- id: speaker-17
  title: "Moderator's live paraphrase ('so what you're saying is the price is too high') is quoted as the participant's verbatim words"
  level: L4
  cell: {video-state: ingested, mode: ask-question, surface: history-entry-detail, session-composition: one-participant-plus-moderator, action: open-cited-timestamp}
  object: "Quote with cited timestamp on entry detail; cited-video-timestamp player"
  situation: "Answer quotes 'the price is too high' at 18:02; opening the timestamp shows the moderator saying it, the participant having said 'hmm, it's a lot'"
  consequence: "The stronger moderator wording replaces the participant's hedged wording in the deliverable; detected only if someone opens the timestamp"
  p_typical: 0.03
  grounded: inferred
  evidence: "Ask question mode: A question about the selected videos, typed by the user"
  proposed: "Acceptance criterion: quotes shown inside quotation marks must come from a single segment labelled participant; paraphrases are shown without quotation marks"
  shallow: false

- id: speaker-18
  title: "Moderator is identified by name in the transcript, so the Report names an employee while participants are pseudonymised"
  level: L3
  cell: {video-state: ingested, mode: report, surface: history-entry-detail, session-composition: one-participant-plus-moderator, actor: test-participant-data-subject}
  object: "Report output on entry detail"
  situation: "Moderator introduces themself as 'Hi, I'm Dana from the research team'; Report writes 'Dana pushed the participant toward option B'"
  consequence: "An internal critique of a named colleague circulates with the report; no rule says whether moderator names are kept"
  p_typical: 0.02
  grounded: speculative
  evidence: "History is per user, currently."
  proposed: "Spec line: moderator is referred to by role ('Moderator') in outputs unless the prompt asks otherwise"
  shallow: false
