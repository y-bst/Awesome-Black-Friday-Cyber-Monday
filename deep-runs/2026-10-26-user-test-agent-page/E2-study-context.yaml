- id: context-1
  title: "Empty 'Prompt / instructions' gives the agent no test script, so a 12-task usability session report cannot say which tasks passed; the spec does not say the agent infers tasks from the video"
  level: L3
  cell: {surface: prompt-field, mode: report, text-input-state: prompt-empty, action: type-prompt, study-context: test-script, videos-selected: 6-20}
  object: "Report mode field 'Prompt / instructions (optional)'"
  situation: "Researcher selects 8 moderated-session videos from a study with a 12-task script and leaves Prompt empty, because the field is labelled optional"
  consequence: "Report is a generic summary of what was said; no per-task success/fail or time-on-task, and the researcher re-runs after learning the script was needed"
  p_typical: 0.18
  grounded: quote
  evidence: "Prompt / instructions (optional)"
  proposed: "Field helper text under the label: 'Paste your test script or task list so the report can be organised by task'; empty-prompt default (task-agnostic summary) stated in the entry detail"
  shallow: false

- id: context-2
  title: "Pasting a discussion guide (about 1,800 words, numbered sections, nested bullets) into Prompt / instructions has no stated formatting or length behaviour; line breaks and numbering may be flattened"
  level: L3
  cell: {surface: prompt-field, mode: report, text-input-state: prompt-empty, action: type-prompt, study-context: test-script, videos-selected: 2-5}
  object: "Report mode field 'Prompt / instructions (optional)'"
  situation: "User pastes a 1,800-word guide (about 11,000 characters) copied from Notion into the empty Prompt field"
  consequence: "Either the field truncates silently at an unstated limit, collapses newlines so 'Task 3' and 'Task 4' merge into one paragraph, or the guide is accepted and the agent mixes guide questions with the report instruction"
  p_typical: 0.07
  grounded: inferred
  evidence: "Prompt / instructions (optional)"
  proposed: "State plain-text multi-line input with a character limit (for example 10,000) and a visible counter; preserve newlines; reject over-limit with the count"
  shallow: false

- id: context-3
  title: "No way to attach the discussion guide or task list as a file (PDF, DOCX, CSV) to a Report run; the only input is the Prompt text field"
  level: L3
  cell: {surface: prompt-field, mode: report, text-input-state: prompt-empty, action: type-prompt, study-context: task-list, library-state: empty-library}
  object: "Report mode fields: 'Prompt / instructions (optional)' and the 'Add video' pop-up, which lists only ingested videos"
  situation: "Researcher's task list lives in a 4-page PDF with a table of tasks and success criteria; the form offers no attach control"
  consequence: "Researcher retypes or pastes the table, losing column structure; or uploads the PDF on the Videos page, where it fails ingestion or appears in the pop-up as a non-video"
  p_typical: 0.09
  grounded: inferred
  evidence: "Add video: clicking \"Add video\" opens a pop-up where the user selects videos from their ingested videos."
  proposed: "Either state 'text only, no attachments' in helper text beside the field, or add an 'Attach file' control (PDF, DOCX, TXT, up to 5 MB) that fills the context the agent receives"
  shallow: false

- id: context-4
  title: "Participant segment (new vs returning, free vs paid) lives only in video tags; the spec does not say whether the agent receives a video's tags as metadata, so 'compare new vs returning users' cannot be answered"
  level: L3
  cell: {surface: prompt-field, mode: report, text-input-state: prompt-empty, action: type-prompt, study-context: participant-segments, videos-selected: 6-20, library-state: 200-tags}
  object: "Add video pop-up 'filtering by the tags the user has applied to videos'; Report 'Prompt / instructions (optional)'"
  situation: "User tags 10 videos 'segment:new' and 10 'segment:returning', selects all 20, and types 'compare the two segments' in Prompt"
  consequence: "If tags are not passed to the agent, it sees 20 unlabelled transcripts and either invents a split from speech content or refuses; the report's comparison is unreliable and the user cannot tell which"
  p_typical: 0.08
  grounded: inferred
  evidence: "The pop-up supports filtering by the tags the user has applied to videos"
  proposed: "State that each selected video's name and tags are passed to the agent with its transcript; show 'Tags will be shared with the agent' under the selected-videos list"
  shallow: false

- id: context-5
  title: "Persona or participant details (age, role, device, 'P7 is a nurse') have no per-video field; the only route is typing them into the shared Prompt, where they cannot be tied to one video among many"
  level: L3
  cell: {surface: prompt-field, mode: report, text-input-state: prompt-empty, action: type-prompt, study-context: participant-segments, videos-selected: 2-5}
  object: "Report 'Prompt / instructions (optional)'; selected videos list in the Add video pop-up"
  situation: "User selects 4 videos named 'session_a.mp4' to 'session_d.mp4' and types 'a = nurse, b = student, c = retiree, d = nurse' into Prompt"
  consequence: "Mapping depends on the agent matching 'a' to a filename; with 20 videos named 'IMG_4021.MOV' the mapping is ambiguous and persona claims in the report may be attached to the wrong participant"
  p_typical: 0.05
  grounded: inferred
  evidence: "A Report produces one output covering all selected videos, not one per video."
  proposed: "Per selected video, an optional one-line 'Note for agent' (200 chars) next to its row in the selected list, sent alongside that video's transcript"
  shallow: false

- id: context-6
  title: "Prompt text referring to videos by position or nickname ('the first two sessions', 'Maria's run') has no stated resolution rule, because the selection order and display names are not fixed"
  level: L3
  cell: {surface: prompt-field, mode: report, text-input-state: prompt-empty, action: type-prompt, study-context: test-script, videos-selected: 6-20}
  object: "Report 'Prompt / instructions (optional)'; selected videos list order"
  situation: "User selects 9 videos in the pop-up in the order they tick them, then types 'focus on the first three sessions' in Prompt"
  consequence: "Agent receives the videos in an unspecified order (upload date, name, selection order) and 'first three' may map to different videos than the user means"
  p_typical: 0.04
  grounded: inferred
  evidence: "selects videos from their ingested videos"
  proposed: "Define a stable order (selection order) and show it numbered in the selected list; the same numbering is given to the agent"
  shallow: false

- id: context-7
  title: "Research questions typed into Prompt in Report mode ('Why do users abandon at checkout?') are not distinguished from report instructions; whether the report is organised around the questions is unspecified"
  level: L3
  cell: {surface: prompt-field, mode: report, text-input-state: prompt-empty, action: type-prompt, study-context: research-questions, videos-selected: 6-20}
  object: "Report 'Prompt / instructions (optional)'"
  situation: "User types 3 research questions into Prompt and selects 10 videos"
  consequence: "Report may give one narrative summary that touches the questions loosely instead of one answered section per question; user cannot tell whether a question went unanswered because the videos lacked evidence or because it was ignored"
  p_typical: 0.1
  grounded: inferred
  evidence: "Prompt / instructions (optional)"
  proposed: "Entry detail shows each research question as a heading with an answer or 'not enough evidence in the selected videos'"
  shallow: false

- id: context-8
  title: "Saved prompt templates for repeat studies do not exist: a researcher running 6 weekly rounds re-pastes the same 700-word guide into Prompt each time"
  level: L3
  cell: {surface: prompt-field, mode: report, text-input-state: prompt-empty, action: type-prompt, study-context: test-script, history-state: 100-entries}
  object: "Report mode form; History tab"
  situation: "Weekly study round 4: Prompt field opens empty on every visit to the Report form"
  consequence: "Each round costs a copy-paste from an external doc; small edits drift between rounds so reports are not comparable; a missed paragraph changes what the agent evaluates"
  p_typical: 0.06
  grounded: inferred
  evidence: "Prompt / instructions (optional)"
  proposed: "Defer, or add 'Use a previous prompt' dropdown listing the last 10 distinct prompts from the user's History, which fills the field"
  shallow: false

- id: context-9
  title: "History entry has no 'Run again with same prompt' or 'Reuse prompt' control, so the History tab cannot serve as the template store for repeat studies"
  level: L3
  cell: {surface: history-entry-detail, mode: report, text-input-state: prompt-empty, action: edit-and-resubmit-from-entry, study-context: test-script}
  object: "History tab entry 'with whatever was submitted'"
  situation: "User opens last week's Report entry whose prompt held the full task list and wants the same prompt on new videos"
  consequence: "Only way to reuse is to select-all and copy the prompt text out of the entry detail (if shown at all), then paste into a new form"
  p_typical: 0.07
  grounded: inferred
  evidence: "a new entry appears with whatever was submitted"
  proposed: "Entry detail button 'Start new report from this' that opens the Report form with Prompt prefilled and Run name set to '<name> (copy)', videos empty"
  shallow: false

- id: context-10
  title: "Ask question mode has no Prompt / instructions field at all, so a user with a task list cannot give study context there; the spec lists only a question field and suggested questions"
  level: L3
  cell: {surface: question-field, mode: ask-question, text-input-state: question-empty, action: type-question, study-context: task-list}
  object: "Ask question mode field list: 'A question about the selected videos, typed by the user'"
  situation: "User wants 'Did the participant complete task 3 of our script?' but the script is only in their head or doc; no field takes it"
  consequence: "User pastes the script into the question box (a 3,000-character 'question'), or the answer is generic; the same script must be repeated in each of 10 follow-ups"
  p_typical: 0.1
  grounded: quote
  evidence: "A question about the selected videos, typed by the user"
  proposed: "Either state that Ask question takes no instructions and that task context belongs in the question text, or add an optional collapsed 'Context for the agent' field shared by the whole thread"
  shallow: false

- id: context-11
  title: "Study context given with the first Ask question message is not stated to persist across follow-ups; follow-up 4 may be answered without the pasted guide"
  level: L3
  cell: {surface: follow-up-thread, mode: ask-question, text-input-state: question-empty, action: ask-follow-up, study-context: test-script, thread-state: follow-up-10}
  object: "Spec line 'Follow-up questions are supported after the first answer.'"
  situation: "User pastes a 2,000-word task list in question 1, then asks 9 short follow-ups ('what about task 5?')"
  consequence: "If the agent keeps only the last N messages or a summary, 'task 5' no longer resolves to the guide's task 5 and the answer invents or says it cannot find it; no warning that context was dropped"
  p_typical: 0.07
  grounded: quote
  evidence: "Follow-up questions are supported after the first answer."
  proposed: "State that the first message and the video set are always kept in the thread context; show a note when older turns are dropped"
  shallow: false

- id: context-12
  title: "A report's prompt (task list, research questions) is not available to a follow-up: 'wanting to ask about a report entry' has no defined path, so the follow-up thread starts with no study context"
  level: L3
  cell: {surface: follow-up-thread, mode: report, text-input-state: prompt-empty, action: ask-follow-up, study-context: research-questions, thread-state: wanting-to-ask-about-a-report-entry}
  object: "Report mode (no follow-ups in spec) vs 'Follow-up questions are supported after the first answer'"
  situation: "User finishes a Report built from a 12-task script and wants to ask 'why did 4 of 8 fail task 7?'; they open Ask question and reselect the 8 videos"
  consequence: "New Ask question thread has none of the Report's prompt, so the user pastes the script again; answer may contradict the report because it used different context"
  p_typical: 0.06
  grounded: inferred
  evidence: "Ask question supports follow-ups."
  proposed: "On a Done Report entry, 'Ask about this report' opens Ask question with the same videos selected and the report's prompt supplied as context"
  shallow: false

- id: context-13
  title: "Switching Report to Ask question after pasting a task list discards or keeps the Prompt text with no stated rule, and the task list is the most expensive thing for the user to retype"
  level: L3
  cell: {surface: prompt-field, mode: switching-mode-after-selecting-videos, text-input-state: prompt-5000-chars, action: switch-mode, study-context: task-list}
  object: "Agent page mode switch; Report 'Prompt / instructions (optional)'"
  situation: "User pastes a 4,500-character task list into Prompt, selects 6 videos, then switches to Ask question to check one answer first"
  consequence: "Prompt is cleared (task list lost, no undo) or hidden but still submitted with the question; user cannot tell which"
  p_typical: 0.12
  grounded: inferred
  evidence: "Agent page: two modes, Report and Ask question"
  proposed: "Keep Prompt text in the page state when switching modes; show a 'Use as context' chip in Ask question mode that sends it with the question"
  shallow: false

- id: context-14
  title: "Session expiry or accidental navigation while a pasted 3,000-word guide sits in Prompt discards it; no draft is saved for repeat-study context"
  level: L3
  cell: {surface: prompt-field, mode: report, text-input-state: prompt-empty, action: navigate-away-mid-compose, study-context: test-script, time-and-connection: session-expired-while-composing-long-prompt}
  object: "Report mode field 'Prompt / instructions (optional)'; Submit"
  situation: "Researcher pastes a guide, spends 25 minutes picking 15 videos and tagging, session expires at Submit"
  consequence: "Login redirect returns an empty form; the guide, video selection and run name are gone"
  p_typical: 0.08
  grounded: speculative
  evidence: "none"
  proposed: "Keep the unsent Prompt in browser draft storage for 24 hours per user and restore it with a 'Restored your unsent prompt' note"
  shallow: false

- id: context-15
  title: "Tag-derived context (tag 'task:checkout') is silently dropped when a tag is renamed after submit, so a re-run of the same prompt gives the agent different segment labels"
  level: L3
  cell: {surface: prompt-field, mode: report, text-input-state: prompt-empty, action: type-prompt, study-context: participant-segments, library-state: tag-renamed-or-deleted-after-filtering}
  object: "Add video pop-up tag filter; Report 'Prompt / instructions (optional)'"
  situation: "Prompt says 'compare the segment:new and segment:returning groups'; user later renames the tag 'segment:new' to 'seg-new' and re-runs the copied prompt"
  consequence: "Prompt names tags that no longer exist; agent sees 'seg-new' and cannot match it, so the comparison is built wrongly or skipped"
  p_typical: 0.03
  grounded: speculative
  evidence: "none"
  proposed: "Entry stores tag names as they were at submit time; on re-run show 'Prompt mentions tag names that changed: segment:new'"
  shallow: false
