- id: support-37
  title: "Submit with 0 videos selected - button state and message not specified"
  level: L4
  cell: {surface: submit-button, videos-selected: "0", mode: ask-question, text-input-state: question-empty, action: submit}
  object: 'Spec lists "Minimum and maximum number of videos per run" as unspecified'
  situation: "User opens Agent page, presses Submit with no videos and an empty question."
  consequence: "Either an empty entry appears in History (support sees a Failed entry with no videos) or nothing happens with no message."
  p_typical: 0.2
  grounded: quote
  evidence: '"Minimum and maximum number of videos per run"'
  proposed: "Submit disabled until 1 video is selected (and in Ask question mode a non-empty question); inline hint names what is missing."
