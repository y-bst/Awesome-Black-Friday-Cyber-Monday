  object: 'History entry detail when failed (unspecified)'
  situation: "User opens a Failed entry and sees only the word Failed; the cause could be a failed-ingestion video, an agent outage, or a timeout."
  consequence: "Ticket \"it failed, why?\" needs engineering log lookup; support has no failure category list (video unusable / agent error / timeout) to answer from."
  p_typical: 0.12
  grounded: inferred
  evidence: '"what opening an entry shows ... when failed" (unspecified)'
