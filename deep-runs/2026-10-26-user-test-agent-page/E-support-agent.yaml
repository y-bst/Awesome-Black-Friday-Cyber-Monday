- id: support-1
  title: "Ticket \"it said submitted but nothing is there\" - the entry may not exist yet when the redirect lands on the History tab"
  level: L4
  cell: {surface: redirect-transition, run-status: submitted-not-yet-visible-in-history, time-and-connection: redirect-lands-before-entry-exists, action: submit, videos-selected: "2-5"}
  object: 'After submit section: "On submit the user is redirected to the History tab, where a new entry appears with whatever was submitted"'
  situation: "User submits a Report with 3 videos; the History tab loads before the backend has written the entry, so the list shows nothing (or the old list) with no placeholder."
  consequence: "User concludes the submit failed and submits again (duplicate run) or files a ticket; support sees 1 or 2 runs and cannot tell which one the user means."
  p_typical: 0.15
  grounded: quote
  evidence: '"there is no loading page" / "a new entry appears"'
  proposed: "Write the entry (status Queued, run name or first 60 chars of question) before the redirect fires; AC - entry row is visible within 1 s of landing on History, never an empty list right after submit."
  shallow: false
- id: support-2
  title: "Submit succeeds on the server but the redirect to History fails; user sees an error and re-submits"
  level: L4
  cell: {surface: error-toast-or-banner, time-and-connection: submit-succeeds-redirect-fails, action: double-submit, run-status: submitted-not-yet-visible-in-history}
  object: 'Redirect rule: "On submit the user is redirected to the History tab"'
  situation: "The submit request returns 200 and the run is created, but the network drops before the navigation to the History tab; the page shows a generic error or stays on the form."
  consequence: "User presses Submit a second time; 2 identical runs exist (2x agent cost). Ticket reads \"I only asked once but there are two\"."
  p_typical: 0.05
  grounded: inferred
  evidence: none
  proposed: "Spec a client-generated submit token so a repeated Submit within the same form session returns the existing entry; banner copy says \"Your request may have been sent, check History before retrying\"."
  shallow: false
- id: support-3
  title: "Offline at submit with a 5000-character prompt - the typed prompt and selected videos are lost"
  level: L3
  cell: {surface: submit-button, time-and-connection: offline-at-submit, text-input-state: prompt-5000-chars, mode: report, action: submit}
  object: 'Prompt / instructions (optional) field and the Submit button'
  situation: "User spent 10 minutes writing a 5000-character instruction, picked 12 videos, loses connectivity, presses Submit; no state is specified for failed submit."
  consequence: "Form either clears or keeps; unspecified. If it clears, the user loses the prompt and the 12-video selection and opens a ticket."
  p_typical: 0.05
  grounded: speculative
  evidence: none
  proposed: "Keep all form fields and the selected-videos list on any failed submit; show an inline banner with a Retry on the same form."
  shallow: false
- id: support-4
  title: "Session expired at submit after the page sat open for hours - what happens to the form content"
  level: L3
  cell: {surface: submit-button, time-and-connection: session-expired-at-submit, actor: creator-owner, action: submit, mode: ask-question}
  object: 'Ask question mode: "A question about the selected videos, typed by the user" and Submit'
  situation: "User leaves the Agent page open 6 hours, types a question, presses Submit; the session token has expired."
  consequence: "User is sent to login and returns to a blank Agent page (question and videos lost), or the submit silently fails; spec names neither."
  p_typical: 0.04
  grounded: speculative
  evidence: none
  proposed: "On 401 at submit, keep the form in memory, re-authenticate in place, then replay the submit once."
  shallow: false
- id: support-5
  title: "No word for \"stuck\" - an entry Running for over 1 hour has no timeout, no state and no user action"
  level: L4
  cell: {surface: history-entry-row, run-status: stuck-over-1h, actor: background-agent-job, action: open-history-entry, time-and-connection: steady-state}
  object: 'Still unspecified: "Statuses an entry can have on the History tab"'
  situation: "Background job dies after 20 minutes with no failure event; the entry still reads Running 65 minutes after submit."
  consequence: "Ticket \"my report never came\". User cannot tell slow from dead; support has no defined threshold for calling it failed."
  p_typical: 0.08
  grounded: quote
  evidence: '"Statuses an entry can have on the History tab" (unspecified)'
  proposed: "Define a hard run timeout (for example 60 min) that moves the entry to Failed with reason \"Timed out\"; AC - no entry stays Running past the timeout."
  shallow: false
- id: support-6
  title: "Failed Report with 40 videos - no re-run, so the user must re-select all 40 videos by hand"
  level: L4
  cell: {surface: history-entry-detail, run-status: failed, action: re-run-not-in-spec, videos-selected: "21-100", mode: report}
  object: 'Spec has no re-run control; "what opening an entry shows ... when failed" is unspecified'
  situation: "A Report over 40 videos with a 300-character prompt fails; user wants to try again with the same inputs."
  consequence: "User re-opens Add video pop-up and re-picks 40 videos one by one and retypes the prompt; common support ask \"can you just re-run it\"."
  p_typical: 0.12
  grounded: quote
  evidence: '"what opening an entry shows while running, when done, and when failed" (unspecified)'
  proposed: "Failed entry detail shows a Run again button that pre-fills run name, prompt and the 40 videos on the Report form."
  shallow: false
- id: support-7
