  cell: {surface: history-entry-row, video-state: 3-hour-long, run-status: running, videos-selected: "2-5", action: open-history-entry}
  object: 'Still unspecified: "video length and size limits"'
  situation: "User picks one 3-hour recording and four 3-minute clips; the entry reads Running for 50 minutes while 4 of 5 are done."
  consequence: "Ticket \"stuck at Running\"; user cannot tell progress (4 of 5) vs hang."
  p_typical: 0.08
  grounded: quote
  evidence: '"video length and size limits."'
