  object: 'Add video pop-up and History tab empty state'
  situation: "New user opens the Agent page before uploading anything; Add video opens an empty list; History shows an empty list."
  consequence: "User thinks the feature is broken; ticket \"Add video does nothing\"."
  p_typical: 0.15
  grounded: inferred
  evidence: none
  proposed: "Pop-up empty copy \"No videos yet\" with a link to the Videos page; History empty copy \"Your reports and questions appear here\"."
