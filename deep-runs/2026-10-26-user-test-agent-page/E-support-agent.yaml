  cell: {surface: agent-page-mode-switch, mode: switching-mode-after-selecting-videos, videos-selected: "21-100", text-input-state: prompt-5000-chars, action: switch-mode}
  object: 'Two modes "Report" and "Ask question" on one Agent page'
  situation: "User has 40 videos and a 5000-character prompt in Report mode, clicks Ask question."
  consequence: "Videos persist but the prompt vanishes (or neither persists); user redoes 10 minutes of work; ticket \"mode switch erased my work\"."
