  cell: {surface: add-video-popup, action: close-popup-without-confirm, videos-selected: "6-20", mode: report, actor: creator-owner}
  object: 'Pop-up: "selects videos from their ingested videos" (no confirm or cancel control named)'
  situation: "User ticks 15 videos, clicks outside the pop-up or presses Esc."
  consequence: "Selected-videos list shows 0 videos, or 15; user submits a Report that covers fewer videos than intended."
  p_typical: 0.1
  grounded: inferred
  evidence: none
  proposed: "Pop-up has a Done button with the count (\"Add 15 videos\"); Esc or outside-click keeps the picks."
  shallow: false
- id: support-35
