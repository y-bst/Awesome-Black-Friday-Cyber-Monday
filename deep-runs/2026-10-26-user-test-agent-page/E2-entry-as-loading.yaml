- id: loading-1
  title: "Entry opened in the first second after redirect, before any job state exists: status badge and detail body have no defined content"
  level: L4
  cell: {surface: history-entry-detail, run-status: submitted-not-yet-visible-in-history, observer-location-at-status-change: inside-entry-detail, time-and-connection: redirect-lands-before-entry-exists, action: open-history-entry}
  object: "History entry detail, 'a new entry appears with whatever was submitted'"
  situation: "Entry row is written at Submit but the job record is created a moment later (queue write lag); user clicks the new row within 1 second and the detail loads with status = null."
  consequence: "Detail renders an empty badge, a blank body or a 404, so the removed loading page is replaced by a screen that looks broken at the exact moment the user is checking that the submit worked."
  p_typical: 0.07
  grounded: inferred
  evidence: "what opening an entry shows while running, when done, and when failed (listed as unspecified; the pre-job instant is not listed at all)"
  proposed: "Acceptance criterion: an entry with no job state renders as 'Starting...' with the submitted inputs; never a blank badge or 404."
  shallow: false
- id: loading-2
  title: "Ask question detail at t=0 shows the typed question over an empty answer area with no 'Answering...' text, indistinguishable from a render failure"
  level: L3
  cell: {surface: history-entry-detail, mode: ask-question, run-status: running, observer-location-at-status-change: inside-entry-detail, action: open-history-entry}
  object: "entry detail of an Ask question entry; 'A question about the selected videos, typed by the user'"
  situation: "User opens an Ask question entry 3 seconds into a run that will take 30 seconds; the answer region has nothing to show yet."
  consequence: "A blank region under the question reads as 'answer missing' and user refreshes or resubmits, creating a second entry for the same question."
  p_typical: 0.08
  grounded: inferred
  evidence: "There is no loading page, to save the user's time."
  proposed: "Answer region shows 'Answering your question...' plus elapsed seconds until the first answer text arrives."
  shallow: false
- id: loading-3
  title: "Spec does not say whether an Ask question answer streams as partial text or appears whole at Done, so a 30-second wait is either a live answer or 30 seconds of blank"
  level: L3
  cell: {surface: history-entry-detail, mode: ask-question, run-status: running, observer-location-at-status-change: inside-entry-detail, action: open-history-entry}
  object: "entry detail while running; 'Follow-up questions are supported after the first answer'"
  situation: "Single-video Ask question that takes about 30 seconds; the model can emit text from second 5 onward, but no spec line says the detail may show it."
  consequence: "Engineering picks whole-answer-at-end by default; users in a 30-second flow stare at 'Running' for the full 30 seconds, and a design that assumed streaming is not buildable from the spec."
  p_typical: 0.12
  grounded: inferred
  evidence: "Statuses an entry can have on the History tab, and what opening an entry shows while running, when done, and when failed."
  proposed: "State: Ask question answer streams into the detail; Report shows no partial text until Done (or vice versa)."
  shallow: false
- id: loading-4
  title: "Stream dies at about 80 percent of the answer: partial text stays under a Failed badge or is wiped, and the follow-up box's state is unspecified"
  level: L3
  cell: {surface: history-entry-detail, mode: ask-question, run-status: failed, observer-location-at-status-change: inside-entry-detail, action: open-history-entry}
  object: "entry detail with streamed partial answer; status Failed"
  situation: "Provider error after 400 of 500 words of an Ask question answer have rendered in the open detail."
  consequence: "If kept, a truncated answer sits under a Failed badge and may be copied as if complete; if wiped, the user loses 400 words they already read and cannot quote them."
  p_typical: 0.06
  grounded: speculative
  evidence: "none"
  proposed: "Keep partial text, collapse it under 'Incomplete answer (stopped at 80%)' and offer Retry; disable follow-up."
  shallow: false
- id: loading-5
  title: "Auto-scroll rule while answer text streams: pinned to bottom or stays at reader's position, and no 'jump to latest' control is specified"
  level: L3
  cell: {surface: history-entry-detail, mode: ask-question, run-status: running, observer-location-at-status-change: inside-entry-detail, action: open-history-entry}
  object: "entry detail scroll container during streamed output (distinct from realtime-21, which covers the final swap)"
  situation: "A 1,200-word answer streams for 60 seconds; user scrolls up 2 screens to re-read the first paragraph while new text keeps arriving."
  consequence: "Auto-scroll to bottom throws the user out of the paragraph they were reading every few hundred milliseconds; no auto-scroll leaves the newest text out of view with no cue it exists."
  p_typical: 0.05
  grounded: speculative
  evidence: "none"
  proposed: "Auto-scroll only while the user is within 80px of the bottom; otherwise show a 'New text below' pill."
  shallow: false
- id: loading-6
  title: "Screen reader announcement of streamed text: a live region that announces every token flood (hundreds of announcements) or none at all"
  level: L3
  cell: {surface: history-entry-detail, mode: ask-question, run-status: running, observer-location-at-status-change: inside-entry-detail, action: open-history-entry}
  object: "streamed answer region in the entry detail"
  situation: "Screen-reader user opens a Running Ask question entry; text grows by about 5 words per 200 ms for 40 seconds."
  consequence: "With aria-live=polite on the whole region the reader repeats the growing paragraph from the start on each update; with no live region the user hears nothing and never learns the answer has arrived."
  p_typical: 0.03
  grounded: speculative
  evidence: "none"
  proposed: "Announce 'Answer started' once and 'Answer complete' once; keep the text region out of the live region."
  shallow: false
- id: loading-7
  title: "Report entry running 40 minutes shows no elapsed time and no start time, and Queued wait and Running time are not separated"
  level: L3
  cell: {surface: history-entry-detail, mode: report, run-status: running, observer-location-at-status-change: inside-entry-detail, action: open-history-entry}
  object: "entry detail header for a Report over 6-20 videos"
  situation: "User opens the entry 25 minutes after Submit; the run waited 10 minutes in Queued and has been Running for 15."
  consequence: "Detail cannot say 'Running for 15 min' versus 'submitted 25 min ago'; user cannot judge if 40 minutes is normal, and the elapsed clock starting at submit makes the queue wait look like slow processing."
  p_typical: 0.08
  grounded: inferred
  evidence: "Statuses an entry can have on the History tab, and what opening an entry shows while running"
  proposed: "Detail shows 'Submitted 14:02 - Started 14:12 - Running 15 min' with the clock ticking client-side from the server start time."
  shallow: false
- id: loading-8
  title: "ETA shown on a 40-minute Report has no rule for what appears when the estimate is exceeded (negative or 0 minutes remaining)"
  level: L4
  cell: {surface: history-entry-detail, mode: report, run-status: running, observer-location-at-status-change: inside-entry-detail, action: open-history-entry}
  object: "ETA text in the Running entry detail (ETA itself is not in the spec; sre-9 covers queue ETA only)"
  situation: "ETA computed from total selected duration (for example 12 videos of 1 hour) says 'about 40 min'; at minute 41 the run is still Running."
  consequence: "Detail reads 'about 0 min remaining' or a negative number for 20 more minutes, and the user concludes the run is stuck and resubmits."
  p_typical: 0.05
  grounded: speculative
  evidence: "none"
  proposed: "After the estimate passes, switch to 'Taking longer than expected (41 min so far)' and never show 0 or negative minutes."
  shallow: false
- id: loading-9
  title: "Per-video progress for a Report has no unit for the final synthesis step, so a 'video 8 of 8' bar sits full while the report is still being written"
  level: L4
  cell: {surface: history-entry-detail, mode: report, run-status: running, observer-location-at-status-change: inside-entry-detail, action: open-history-entry}
  object: "progress indicator in Running Report detail; 'A Report produces one output covering all selected videos, not one per video'"
  situation: "8 videos are read in 14 minutes, then one combined synthesis takes 9 more minutes; the per-video counter reached 8 of 8 at minute 14."
  consequence: "Progress shows complete for 9 minutes while the status is still Running; user assumes it is frozen. qa-lead-14 asks spinner versus per-video count but not this second phase."
  p_typical: 0.05
  grounded: quote
  evidence: "A Report produces one output covering all selected videos, not one per video."
  proposed: "Two stages in the detail: 'Reading videos 8/8' then 'Writing report' with its own indeterminate state."
  shallow: false
- id: loading-10
  title: "Progress UI threshold: a 1-video, 30-second Ask question shows a per-video progress block that appears for under a second and then jumps to the answer"
  level: L3
  cell: {surface: history-entry-detail, mode: ask-question, run-status: running, observer-location-at-status-change: inside-entry-detail, action: open-history-entry}
  object: "progress element in the Running entry detail"
  situation: "Ask question over 1 video; per-video progress '0 of 1' then '1 of 1' within about 2 seconds before the answer begins."
  consequence: "A progress counter with a single step flashes and reflows the page under the user's cursor; the same component must also carry a 100-video Report, and no rule says when it is hidden."
  p_typical: 0.04
  grounded: speculative
  evidence: "none"
  proposed: "Show per-video progress only when selected videos is 3 or more; otherwise one status line."
  shallow: false
- id: loading-11
  title: "Follow-up box on a Running Report entry is absent with no explanation, while the same box on a Running Ask question entry is present or disabled"
  level: L3
  cell: {surface: history-entry-detail, mode: report, run-status: running, observer-location-at-status-change: inside-entry-detail, action: open-history-entry}
  object: "follow-up box, 'Follow-up questions are supported after the first answer' (Ask question section only)"
  situation: "User opens a Running Report entry expecting the same input they saw on Ask question; there is no box and no sentence explaining that reports take no follow-ups (or that they will after Done)."
  consequence: "User concludes the page failed to load the input, or types the question into the Prompt field of a new Report instead. thread-8 and a11y-21 cover Report follow-ups and the disabled box, not the absent-box copy while running."
  p_typical: 0.05
  grounded: inferred
  evidence: "Follow-up questions are supported after the first answer."
  proposed: "Report detail shows 'Follow-up questions are available for Ask question entries' or a disabled box; state which."
  shallow: false
- id: loading-12
  title: "Text typed into a disabled-while-running follow-up box is cleared or loses focus when the answer finishes and the box enables"
  level: L4
  cell: {surface: follow-up-thread, thread-state: follow-up-while-first-still-running, mode: ask-question, run-status: running, observer-location-at-status-change: inside-entry-detail, action: open-history-entry}
  object: "follow-up box state swap at Running to Done"
  situation: "User starts typing a 60-character follow-up at second 20 of a 30-second answer; the box becomes enabled at second 30 and the answer region re-renders."
  consequence: "Draft is wiped or focus jumps to the answer, so the user loses the sentence they composed while waiting; if the box is truly disabled the user cannot type ahead at all."
  p_typical: 0.04
  grounded: speculative
  evidence: "none"
  proposed: "Box accepts typing while Running, keeps its text across the status swap, and enables Submit only at Done."
  shallow: false
- id: loading-13
  title: "Leaving a Running entry at 60 percent streamed and returning 5 minutes later: stream resumes from the start, from the current point, or shows the saved partial text, and may duplicate text"
  level: L3
  cell: {surface: history-entry-detail, mode: ask-question, run-status: running, observer-location-at-status-change: other-page-in-app, entry-point-and-lifecycle-phase: post-submit-elsewhere-in-app, action: open-history-entry}
  object: "entry detail re-opened from the History row while its status is Running"
  situation: "User opens an Ask question entry, reads 300 words, goes back to History, reopens the same entry 20 seconds later while the answer is at 500 words."
  consequence: "Client that reconnects to the stream and also loads the stored partial text shows the first 300 words twice; one that shows only new tokens shows a sentence fragment as the first line."
  p_typical: 0.06
  grounded: speculative
  evidence: "none"
  proposed: "Detail loads stored partial text first, then appends tokens by offset so reconnects never duplicate."
  shallow: false
- id: loading-14
  title: "Laptop sleep or dropped connection while the detail streams: panel keeps showing 'Running' with frozen text and no 'reconnecting' or 'last updated' cue"
  level: L3
  cell: {surface: history-entry-detail, mode: report, run-status: running, time-and-connection: page-open-for-hours, observer-location-at-status-change: inside-entry-detail, action: open-history-entry}
  object: "Running entry detail live connection"
  situation: "User opens a 40-minute Report entry, closes the laptop lid for 20 minutes during which the run finishes, reopens it; the connection died silently."
  consequence: "Detail still says Running with a timer; the output exists but is not shown until a manual refresh, and the user cannot tell a stalled run from a dead connection. realtime-16 covers the History list at 401, not the detail."
  p_typical: 0.07
  grounded: speculative
  evidence: "none"
  proposed: "Detail shows 'Last updated 20 min ago - reconnecting' after 30 seconds without an event and re-fetches on tab focus."
  shallow: false
- id: loading-15
  title: "Submitted inputs (a 5,000-char prompt) are rendered above the status line, pushing the Running status and progress indicator below the first screen"
  level: L3
  cell: {surface: history-entry-detail, mode: report, text-input-state: prompt-5000-chars, run-status: running, observer-location-at-status-change: inside-entry-detail, action: open-history-entry}
  object: "entry detail layout: submitted inputs versus status and progress region (prompt-16 covers the output being pushed down, not the status)"
  situation: "Report with a 5,000-character prompt and 15 selected video names is opened while Running."
  consequence: "At 360px wide the first 3 screens are prompt text, so the opened entry looks like a static form; user scrolls past nothing that says it is running."
  p_typical: 0.06
  grounded: inferred
