- id: loading-17
  title: "Streamed text is rewritten at Done (citations resolved, markdown finalised, a sentence removed), so the paragraph the user was reading changes under them"
  level: L3
  cell: {surface: history-entry-detail, mode: ask-question, run-status: running, observer-location-at-status-change: inside-entry-detail, action: open-history-entry}
  object: "streamed answer text versus final stored answer in the entry detail"
  situation: "Partial text shows raw '[v3 04:12]' markers and unclosed markdown while streaming; at Done the stored answer replaces it with links and a table."
  consequence: "Layout jumps by hundreds of pixels, a sentence the user quoted is no longer there, and nothing marks that the final differs from what was read live."
  p_typical: 0.05
