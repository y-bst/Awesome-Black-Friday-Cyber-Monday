- id: loading-21
  title: "Text selected and copied from the streaming answer is lost on each re-render, so the user cannot copy a paragraph before Done"
  level: L4
  cell: {surface: history-entry-detail, mode: ask-question, run-status: running, observer-location-at-status-change: inside-entry-detail, action: open-history-entry}
  object: "streamed answer region in the entry detail"
  situation: "User drags to select a finished paragraph while later tokens keep arriving; the answer node is replaced on every update."
  consequence: "Selection collapses within about 200 ms of each update, so copy gets nothing or a partial line; users wait until Done for a paragraph they already had."
  p_typical: 0.03
  grounded: speculative
  evidence: "none"
  proposed: "Append tokens to existing nodes instead of re-rendering the region; test: select the first sentence at second 10, selection persists to second 30."
