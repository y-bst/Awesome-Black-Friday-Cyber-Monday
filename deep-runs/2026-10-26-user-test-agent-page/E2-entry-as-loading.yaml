- id: loading-19
  title: "Running Report detail does not tell the user it is safe to leave, so users keep the tab open for 40 minutes or resubmit"
  level: L3
  cell: {surface: history-entry-detail, mode: report, run-status: running, entry-point-and-lifecycle-phase: app-closed-while-running, observer-location-at-status-change: inside-entry-detail, action: open-history-entry}
  object: "Running entry detail copy; 'There is no loading page, to save the user's time'"
  situation: "User opens a 40-minute Report entry and has no sentence saying the run continues if the tab is closed and that the entry will be in History later."
  consequence: "The removed loading page used to carry exactly this reassurance; without it users sit on the page for 40 minutes (defeating the time-saving rationale) or submit again out of doubt."
  p_typical: 0.08
  grounded: quote
  evidence: "There is no loading page, to save the user's time."
  proposed: "Running detail shows 'This can take up to 40 minutes. You can leave this page; the result will be here.'"
  shallow: false
