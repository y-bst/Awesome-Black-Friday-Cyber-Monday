- id: loading-16
  title: "Video becomes unusable at minute 9 of a 20-minute Report: per-video progress denominator changes from 8 of 20 to 8 of 19, or a skipped marker appears, while the user is watching"
  level: L4
  cell: {surface: history-entry-detail, mode: report, run-status: running, per-video-outcome-within-run: one-video-unusable, observer-location-at-status-change: inside-entry-detail, action: open-history-entry}
