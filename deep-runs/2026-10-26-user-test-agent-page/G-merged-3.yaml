- id: a11y-1
  title: Add video pop-up thumbnails have no stated selection semantics, so keyboard and screen-reader users cannot tell how to multi-select
  level: L3
  cell:
    surface: add-video-popup
    videos-selected: 6-20
    action: select-video
  object: Add video pop-up, 'the user selects videos from their ingested videos'
  situation: A keyboard-only user wants to pick 8 videos from the pop-up grid. The spec says 'selects' but not whether each thumbnail is a checkbox (Space toggles), a button with aria-pressed, or a click-only
    div; not whether Tab or arrow keys move between thumbnails; not whether Shift+Space or Shift+click selects a range.
  consequence: If thumbnails are click-only divs, a keyboard user cannot pick any video and the Report and Ask question forms are unusable for them. If each is a checkbox, 8 picks cost at least 8 Tab presses
    plus 8 Space presses, with the selected state announced as 'checked'.
  p_typical: 0.18
  grounded: quote
  evidence: clicking 'Add video' opens a pop-up where the user selects videos from their ingested videos
  proposed: Add acceptance criterion 'each video in the pop-up is a native checkbox with the video name and duration as its label; Space toggles; selected state is exposed to assistive tech'.
  shallow: false
  also_from:
  - popup-27
- id: a11y-3
  title: Pop-up has no stated focus trap, so Tab walks out of the pop-up into the page behind it
  level: L4
  cell:
    surface: add-video-popup
    action: open-add-video-popup
    actor: creator-owner
    library-state: 50-videos
  object: Add video pop-up
  situation: Keyboard user activates 'Add video' and presses Tab 6 times in a library of 50 videos.
  consequence: Focus passes behind the overlay to Run name, Prompt and Submit, which are visually covered; the user edits fields they cannot see, or submits the form while believing the pop-up is still
    open.
  p_typical: 0.12
  grounded: inferred
  evidence: none
  proposed: Acceptance criterion 'focus moves into the pop-up on open, cycles inside it, and the background is inert (aria-modal, inert attribute)'.
  shallow: false
- id: a11y-5
  title: Pop-up has no stated accessible name or heading, so the screen reader announces an unnamed dialog
  level: L4
  cell:
    surface: add-video-popup
    action: open-add-video-popup
    library-state: 1-video
  object: Add video pop-up (title text not specified)
  situation: Screen-reader user opens the pop-up; the spec names no title, role or label.
  consequence: Announcement is 'dialog' with no name, or nothing at all if the role is missing; the user cannot tell whether they are in the pop-up or on the page.
  p_typical: 0.05
  grounded: inferred
  evidence: none
  proposed: Title 'Select videos' as an h2 referenced by aria-labelledby on a role=dialog element.
  shallow: false
- id: a11y-23
  title: Filtering or searching in the pop-up changes the visible list with no announced result count
  level: L4
  cell:
    surface:
    - search-box
    - popup-zero-results
    action: search
    library-state: 50-videos
    videos-selected: '0'
  object: Search box ('searching by name') and tag filter
  situation: User types 'demo' and the 50 videos reduce to 7 (or 0).
  consequence: Screen-reader user hears nothing after typing; cannot tell 7 results from 0; with 0 results the empty state text may not be read.
  p_typical: 0.07
  grounded: quote
  evidence: searching by name
  proposed: Status region reads '7 videos match' after a 300 ms debounce; the empty state is the same region ('No videos match demo').
  shallow: false
- id: a11y-27
  title: Re-uploaded videos with the same name give identical accessible names for different thumbnails
  level: L4
  cell:
    surface: add-video-popup
    video-state: re-uploaded-same-name
    action: select-video
    library-state: 50-videos
  object: Pop-up thumbnails; search is 'by name'
  situation: The library holds 'standup.mp4' three times (3 uploads).
  consequence: Screen reader reads 'standup.mp4, checkbox' three times; the user selects the wrong one; thumbnails with empty alt text make the images useless to blind users, and duplicates are indistinguishable.
  p_typical: 0.04
  grounded: inferred
  evidence: searching by name
  proposed: 'Accessible name adds upload date and duration: ''standup.mp4, 12 Oct, 4 min 10 s''.'
  shallow: false
- id: a11y-28
  title: Still-ingesting or failed videos, if shown disabled, are unfocusable and their reason is never reachable by keyboard or screen reader
  level: L4
  cell:
    surface: add-video-popup
    video-state: still-ingesting
    action: select-video
    mode: report
    library-state: 50-videos
  object: '''Whether a video that is still ingesting, or failed ingestion, can be selected.'''
  situation: 3 of 50 videos are ingesting; the design greys them out and attaches a hover tooltip 'Ingesting'.
  consequence: Native disabled checkboxes are skipped by Tab; the tooltip never shows to keyboard or touch users; a blind user sees 47 videos and does not know 3 exist, then wonders why a just-uploaded
    video is missing.
  p_typical: 0.06
  grounded: quote
  evidence: Whether a video that is still ingesting, or failed ingestion, can be selected.
  proposed: Keep them in the list with aria-disabled and visible status text 'Ingesting' or 'Ingestion failed' as part of the accessible name.
  shallow: false
- id: a11y-29
  title: Hover-only video preview in thumbnails has no keyboard or reduced-motion equivalent
  level: L3
  cell:
    surface: add-video-popup
    video-state: 3-second-clip
    action: select-video
    actor: creator-owner
  object: Pop-up video thumbnails (preview behaviour not specified)
  situation: Common pattern is a muted autoplay on hover to help users pick; the spec says nothing about previews.
  consequence: Keyboard users get no preview and so cannot tell similar videos apart; if autoplay is added, a 3-second clip loops and violates the 5-second pause/stop rule for moving content; users with
    reduced-motion settings still see motion.
  p_typical: 0.02
  grounded: speculative
  evidence: none
  proposed: State 'no autoplay; preview on explicit Play button only', and that previews are keyboard-operable.
  shallow: false
- id: a11y-30
  title: Duration of 3-hour videos in the pop-up is shown as a timestamp that screen readers read as a clock time
  level: L4
  cell:
    surface:
    - add-video-popup
    - video-thumbnail-overlay
    video-state: 3-hour-long
    action: select-video
    videos-selected: '1'
  object: Pop-up thumbnail duration label (not specified; length limits are listed as unknown)
  situation: Duration label '3:00:00' or '180:00' on a thumbnail.
  consequence: Screen reader says 'three colon zero zero colon zero zero' or 'three o'clock'; the user cannot judge whether the video is long enough to delay a Report.
  p_typical: 0.01
  grounded: speculative
  evidence: video length and size limits
  proposed: Visually hidden text '3 hours' in the accessible name alongside the visual time format.
  shallow: false
- id: a11y-43
  title: Pop-up for 2000 videos has no stated way to reach the pop-up's action buttons or hear the total count
  level: L4
  cell:
    surface: add-video-popup
    library-state: 2000-videos
    videos-selected: more-than-popup-shows-at-once
    action: select-video
  object: Add video pop-up list; 'more than the pop-up shows at once' is a spec gap
  situation: Library of 2000 videos with a scrolling grid of 40 shown at once (lazy load or virtualisation).
  consequence: Tab through 40 checkboxes triggers load of more, so the end of the list moves away; a virtualised grid reports 'checkbox 1 of 40' instead of 2000; the keyboard user cannot reach the pop-up's
    close or confirm button without 2000 Tab presses unless it is placed before the list.
  p_typical: 0.03
  grounded: speculative
  evidence: none
  proposed: Place close and confirm controls before or sticky after the list in DOM order; set aria-setsize to the true total; add a 'Load more' button instead of scroll-triggered load.
  shallow: false
- id: a11y-44
  title: No select-all means keyboard users picking all videos in a 50-video library press Space 50 times
  level: L4
  cell:
    surface: add-video-popup
    videos-selected: all-videos-in-library
    library-state: 50-videos
    action: select-video
    mode: report
  object: Add video pop-up selection controls
  situation: User wants a Report covering every video; the spec has no select-all and no maximum.
  consequence: 50 Tab-and-Space pairs, 100 key presses, with the risk of missing one; with the filter applied it is unclear whether select-all would cover only the filtered subset.
  p_typical: 0.05
  grounded: inferred
  evidence: Minimum and maximum number of videos per run
  proposed: Add 'Select all N shown' checkbox; state it applies to the current filter and announces the count.
  shallow: false
- id: backend-44
  title: Selecting 'all videos in library' (e.g. 2000) has no server-side cap; the request payload and job fan-out are unbounded
  level: L3
  cell:
    videos-selected: all-videos-in-library
    library-state: 2000-videos
    surface:
    - add-video-popup
    - tag-filter
    action:
    - submit
    - select-all-filtered
    popup-session-state: select-all-filtered
  object: Add video pop-up; listed unknown 'maximum number of videos per run'
  situation: Pop-up has a select-all on a filtered tag with 2000 matches
  consequence: One run fans out 2000 per-video calls; queue blocked for hours for every user
  p_typical: 0.06
  grounded: quote
  evidence: Minimum and maximum number of videos per run; video length and size limits.
  proposed: Hard server cap (e.g. 50 videos/run) returned as 400 with the limit in the message, mirrored in the pop-up counter
  shallow: false
- id: cost-3
  title: One click on select-all-filtered in a 2000-video library creates a run of unbounded cost
  level: L3
  cell:
    surface:
    - add-video-popup
    - tag-filter
    library-state: 2000-videos
    videos-selected: all-videos-in-library
    popup-session-state: select-all-filtered
    action: select-all-filtered
  object: Add video pop-up (select from ingested videos, filter by tags, search)
  situation: Library holds 2000 ingested videos; user filters by a broad tag or no tag and uses select-all (the spec does not say whether select-all exists)
  consequence: A single gesture can select 2000 videos; with 100 videos costing X per run this is 20X, plus 20X again for every follow-up that re-reads them
  p_typical: 0.08
  grounded: inferred
  evidence: The pop-up supports filtering by the tags the user has applied to videos, and searching by name.
  proposed: Either disallow select-all or apply the per-run video cap to it and show the count against the cap
  shallow: false
- id: cost-26
  title: Selecting a still-ingesting video lets the run start on a partial transcript and pay again for a rerun after ingestion
  level: L3
