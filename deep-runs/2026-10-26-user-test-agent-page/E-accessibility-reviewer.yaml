- id: a11y-1
  title: "Add video pop-up thumbnails have no stated selection semantics, so keyboard and screen-reader users cannot tell how to multi-select"
  level: L3
  cell: {surface: add-video-popup, videos-selected: "6-20", action: select-video}
  object: "Add video pop-up, 'the user selects videos from their ingested videos'"
  situation: "A keyboard-only user wants to pick 8 videos from the pop-up grid. The spec says 'selects' but not whether each thumbnail is a checkbox (Space toggles), a button with aria-pressed, or a click-only div; not whether Tab or arrow keys move between thumbnails; not whether Shift+Space or Shift+click selects a range."
  consequence: "If thumbnails are click-only divs, a keyboard user cannot pick any video and the Report and Ask question forms are unusable for them. If each is a checkbox, 8 picks cost at least 8 Tab presses plus 8 Space presses, with the selected state announced as 'checked'."
  p_typical: 0.18
  grounded: quote
  evidence: "clicking 'Add video' opens a pop-up where the user selects videos from their ingested videos"
  proposed: "Add acceptance criterion 'each video in the pop-up is a native checkbox with the video name and duration as its label; Space toggles; selected state is exposed to assistive tech'."
  shallow: false
- id: a11y-2
  title: "No live count of selected videos in the pop-up, so a screen-reader user cannot confirm how many they have picked"
  level: L4
  cell: {surface: selected-videos-list, videos-selected: "2-5", action: select-video, mode: report}
  object: "Add video pop-up and the list of selected videos shown on the Report form after the pop-up closes"
  situation: "User selects the 4th of 5 videos; there is no counter and no polite live region."
  consequence: "Screen-reader user hears nothing after Space except possibly 'checked'; they submit with 3 or 5 videos without knowing, and a Report covers a different video set than intended."
  p_typical: 0.07
  grounded: inferred
  evidence: "none"
  proposed: "Visible text '4 selected' in the pop-up footer, inside a role=status region, updated on every toggle."
  shallow: false
- id: a11y-3
  title: "Pop-up has no stated focus trap, so Tab walks out of the pop-up into the page behind it"
  level: L4
  cell: {surface: add-video-popup, action: open-add-video-popup, actor: creator-owner}
  object: "Add video pop-up"
  situation: "Keyboard user activates 'Add video' and presses Tab 6 times in a library of 50 videos."
  consequence: "Focus passes behind the overlay to Run name, Prompt and Submit, which are visually covered; the user edits fields they cannot see, or submits the form while believing the pop-up is still open."
  p_typical: 0.12
  grounded: inferred
  evidence: "none"
  proposed: "Acceptance criterion 'focus moves into the pop-up on open, cycles inside it, and the background is inert (aria-modal, inert attribute)'."
  shallow: false
- id: a11y-4
  title: "Closing the pop-up with Esc or a close control has no stated outcome for selections or for where focus goes"
  level: L4
  cell: {surface: add-video-popup, action: close-popup-without-confirm, videos-selected: "2-5"}
  object: "Add video pop-up close behaviour; the spec lists no confirm button"
  situation: "User has ticked 3 videos and presses Esc. The spec does not say whether the 3 are kept, discarded, or whether a Done button is required."
  consequence: "A sighted user sees the chips appear or not; a screen-reader user hears nothing, and focus drops to the top of the document if it is not returned to the 'Add video' button. They may redo the 3 selections twice."
  p_typical: 0.09
  grounded: speculative
  evidence: "none"
  proposed: "Decide 'Esc keeps selections' or 'Esc discards with confirmation'; focus returns to the 'Add video' button in both cases; the outcome is announced ('3 videos added')."
  shallow: false
- id: a11y-5
  title: "Pop-up has no stated accessible name or heading, so the screen reader announces an unnamed dialog"
  level: L4
  cell: {surface: add-video-popup, action: open-add-video-popup, library-state: "1-video"}
  object: "Add video pop-up (title text not specified)"
  situation: "Screen-reader user opens the pop-up; the spec names no title, role or label."
  consequence: "Announcement is 'dialog' with no name, or nothing at all if the role is missing; the user cannot tell whether they are in the pop-up or on the page."
  p_typical: 0.05
  grounded: inferred
  evidence: "none"
  proposed: "Title 'Select videos' as an h2 referenced by aria-labelledby on a role=dialog element."
  shallow: false
- id: a11y-6
  title: "Mode switch between Report and Ask question has no stated control type or announcement"
  level: L3
  cell: {surface: agent-page-mode-switch, mode: switching-mode-after-selecting-videos, action: switch-mode}
  object: "'Agent page: two modes, Report and Ask question'"
  situation: "Screen-reader user switches from Report to Ask question; the Run name and Prompt fields disappear and the Question field and suggested questions appear."
  consequence: "If the switch is two buttons with no pressed state, the user cannot tell which mode is active; the form content changes under them with no announcement, and they keep typing a prompt into a field that no longer exists."
  p_typical: 0.15
  grounded: inferred
  evidence: "two modes, **Report** and **Ask question**"
  proposed: "Use role=tablist or radio group with the active mode exposed; announce 'Ask question mode' in a status region; keep focus on the switch."
  shallow: false
- id: a11y-7
  title: "Fields hidden by a mode switch are removed from the accessibility tree, and typed prompt text is lost without notice"
  level: L4
  cell: {surface: prompt-field, mode: switching-mode-after-selecting-videos, text-input-state: prompt-5000-chars, action: switch-mode}
  object: "Prompt / instructions field (Report mode) and the mode switch"
  situation: "Dictation user has entered a 5000-character prompt, then accidentally activates the Ask question switch with a single key press."
  consequence: "The 5000 characters are either lost or retained invisibly; no announcement says which. Re-entering by voice costs minutes."
  p_typical: 0.04
  grounded: speculative
  evidence: "none"
  proposed: "State 'mode switch keeps Report fields in memory for the session' or show a confirmation when the prompt is non-empty."
  shallow: false
- id: a11y-8
  title: "Redirect to History after Submit gives no announcement that the submit worked or what page the user is now on"
  level: L4
  cell: {surface: redirect-transition, action: submit, run-status: submitted-not-yet-visible-in-history, time-and-connection: steady-state}
  object: "'On submit the user is redirected to the History tab, where a new entry appears with whatever was submitted.'"
  situation: "Screen-reader user activates Submit. There is no loading page, so no page title change or message is guaranteed."
  consequence: "Screen reader goes silent or re-reads the page title; user cannot tell whether the submit succeeded, failed, or whether they are on History; they press Submit again from memory, or tab around 20 rows to look for the new entry."
  p_typical: 0.10
  grounded: quote
  evidence: "On submit the user is redirected to the **History** tab, where a new entry appears"
  proposed: "After redirect, move focus to the new entry row and announce 'Report submitted. Status: Queued.' in a role=status region."
  shallow: false
- id: a11y-9
  title: "Redirect can land before the entry exists, leaving a screen-reader user on an empty or stale list with no later announcement"
  level: L4
  cell: {surface: history-tab, time-and-connection: redirect-lands-before-entry-exists, action: submit, history-state: "1-entry"}
  object: "History tab list after redirect"
  situation: "The list renders with the previous 1 entry; the new entry is added 1 to 3 seconds later when the server responds."
  consequence: "A sighted user sees a row slide in; a screen-reader user hears 'list, 1 item' and nothing about the new row. If focus is on a row that is then replaced, focus is lost to the document body."
  p_typical: 0.06
  grounded: inferred
  evidence: "none"
  proposed: "Insert the row in a role=status region or announce 'New entry added: <name>'; never re-render rows that hold focus."
  shallow: false
- id: a11y-10
  title: "Entry with a blank run name has no stated accessible name, so the row is read as an unnamed link or empty text"
  level: L4
  cell: {surface: history-entry-row, history-state: entries-with-blank-run-name, text-input-state: run-name-empty, mode: report}
  object: "Run name (optional) field and the History entry row"
  situation: "User leaves Run name empty (allowed) and submits; 5 such entries now sit in History. The spec does not say what the row title shows."
  consequence: "The row's accessible name is empty or just the timestamp; a screen-reader user navigating by links hears 'link, link, link' 5 times and cannot tell the entries apart. Sighted users cannot either."
  p_typical: 0.08
  grounded: quote
  evidence: "Run name (optional)"
  proposed: "Fallback title built from mode, video count and time, for example 'Report - 3 videos - 26 Oct 14:32'; used as the row's accessible name."
  shallow: false
- id: a11y-11
  title: "Two entries with the same run name or same timestamp are indistinguishable in the screen-reader list"
  level: L4
  cell: {surface: history-entry-row, text-input-state: run-name-duplicate-of-existing, history-state: two-entries-same-second, action: open-history-entry}
  object: "History entry row title and timestamp"
  situation: "User submits two Reports named 'Q4 test' within the same second (double-click or two tabs)."
  consequence: "Both rows read 'Q4 test, 26 Oct 14:32'; screen-reader user opens the wrong one with no way to tell which is the first; order between them is undefined."
  p_typical: 0.03
  grounded: inferred
  evidence: "none"
  proposed: "Secondary line with video count and status in the accessible name; define tie-break order by creation id."
  shallow: false
- id: a11y-12
  title: "Status change from Queued to Running to Done is not announced and may be shown by colour or icon only"
  level: L4
  cell: {surface: history-entry-row, run-status: running, actor: background-agent-job, action: open-history-entry}
  object: "History entry status (statuses unspecified in the spec: 'Statuses an entry can have on the History tab')"
  situation: "User keeps the History tab open while a Report moves Queued, Running, Done over about 90 seconds."
  consequence: "Screen-reader user must re-navigate to the row to learn it is done; a colour-blind user sees a green or amber dot with no text; no status message reaches either."
  p_typical: 0.12
  grounded: quote
  evidence: "Statuses an entry can have on the History tab, and what opening an entry shows while running, when done, and when failed."
  proposed: "Status as visible text in the row; changes announced via a polite role=status region that names the entry ('Q4 test: Done')."
  shallow: false
- id: a11y-13
  title: "Failed entry gives no stated error text or focus target for screen-reader users"
  level: L4
  cell: {surface: history-entry-detail, run-status: failed, action: open-history-entry, actor: creator-owner}
  object: "Entry detail while 'failed' (spec leaves 'what opening an entry shows ... when failed' unspecified)"
  situation: "User opens a Failed entry; detail shows a red banner."
  consequence: "Banner not in a role=alert or not focused; screen-reader user reads the original prompt and the video list first and never reaches the reason for failure; no accessible retry cue because re-run is not in the spec."
  p_typical: 0.05
  grounded: inferred
  evidence: "none"
  proposed: "Failure reason as the first element after the entry heading, rendered as text with an icon that has a text alternative."
  shallow: false
- id: a11y-14
  title: "History row interaction model is unspecified: whole-row click target versus a real link, and which element receives focus"
  level: L3
  cell: {surface: history-entry-row, action: open-history-entry, history-state: "100-entries", actor: creator-owner}
  object: "History tab entry list"
  situation: "Rows are clickable in the mouse design; the spec only says 'Lists past and current submissions'."
  consequence: "A div with an onClick handler is not focusable, so a keyboard user cannot open any of the 100 entries; if it is a link wrapping the whole row, the accessible name becomes a long string of name, mode, status, time, video count."
  p_typical: 0.10
  grounded: quote
  evidence: "Lists past and current submissions from both modes."
  proposed: "One link per row, whose text is the entry title; status and time outside the link but inside the list item."
  shallow: false
- id: a11y-15
  title: "History with 1000 entries has no stated skip mechanism, so keyboard users face up to 1000 tab stops"
  level: L4
  cell: {surface: history-tab, history-state: "1000-entries", action: open-history-entry, actor: creator-owner}
  object: "History tab list; no pagination, search or filter is specified"
  situation: "Heavy user with 1000 entries wants the 3 most recent Ask question entries."
  consequence: "One Tab per row means about 1000 key presses to reach the end; with infinite scroll, focus can jump back to the top on each load, and screen-reader 'list, 1000 items' gives no way to filter by mode."
  p_typical: 0.03
  grounded: speculative
  evidence: "none"
  proposed: "Decide page size (for example 25 rows with a 'Load more' button that keeps focus) and a mode filter."
  shallow: false
- id: a11y-16
  title: "Suggested questions have no stated element type, and picking one has no stated effect on the Question field or focus"
  level: L4
  cell: {surface: suggested-questions, text-input-state: question-picked-from-suggested, action: pick-suggested-question, mode: ask-question}
  object: "'Suggested questions are shown and can be picked'"
  situation: "User activates a suggested question. The spec does not say whether it fills the Question field, submits immediately, or both."
  consequence: "If rendered as links (navigation semantics) the screen reader says 'link' for something that behaves like a button; if it submits at once, a keyboard user pressing Enter on it triggers a redirect they did not expect; if it fills the field, nothing announces that the field now has text."
  p_typical: 0.08
  grounded: quote
  evidence: "Suggested questions are shown and can be picked"
  proposed: "Render as buttons inside a labelled group 'Suggested questions'; picking fills the Question field, moves focus to it, and does not submit."
  shallow: false
- id: a11y-17
  title: "Picking a suggested question when the Question field already holds typed text silently replaces it, with no announcement"
  level: L4
  cell: {surface: question-field, text-input-state: question-picked-from-suggested, action: pick-suggested-question, videos-selected: "1"}
  object: "Question field and suggested questions"
  situation: "User has typed 120 characters, then picks a suggestion."
  consequence: "Typed text is overwritten; screen-reader user does not hear that the content changed and only discovers it after Submit, when the History entry shows the wrong question."
  p_typical: 0.04
  grounded: speculative
  evidence: "none"
  proposed: "Specify replace versus append; announce 'Question set to: <text>'."
  shallow: false
- id: a11y-18
  title: "Suggested questions that are derived from the selected videos would reflow under the user's focus when the selection changes"
  level: L4
  cell: {surface: suggested-questions, videos-selected: "2-5", action: deselect-video, mode: ask-question}
  object: "'Whether suggested questions are static or derived from the selected videos.'"
  situation: "If derived, removing 1 of 4 videos regenerates the list; assistive tech user has focus on suggestion 2."
  consequence: "Focused button is replaced and focus falls to the body; the regenerated list is not announced; a delay of several seconds may leave an empty region read as 'group, empty'."
  p_typical: 0.02
  grounded: inferred
  evidence: "Whether suggested questions are static or derived from the selected videos."
  proposed: "If derived, update in a status region with a count ('4 new suggestions'), keep existing elements in place and do not steal focus."
  shallow: false
- id: a11y-19
  title: "Follow-up thread has no stated structure, so a screen-reader user cannot jump between questions and answers"
  level: L4
  cell: {surface: follow-up-thread, thread-state: follow-up-10, action: ask-follow-up, mode: ask-question}
  object: "'Follow-up questions are supported after the first answer.'"
  situation: "Thread has 10 follow-ups, so 11 questions and 11 answers on the page."
  consequence: "With no headings or list semantics, a screen-reader user must read linearly through 22 blocks to find answer 4; navigating by heading finds nothing."
  p_typical: 0.05
  grounded: quote
  evidence: "Follow-up questions are supported after the first answer."
  proposed: "Each question as an h3 'You asked' or list item with an accessible label 'Question 4 of 11'; newest answer reachable by a skip link."
  shallow: false
- id: a11y-20
  title: "After submitting a follow-up, focus and announcement of the new answer are unspecified"
  level: L4
  cell: {surface: follow-up-thread, action: ask-follow-up, thread-state: follow-up-1, run-status: running}
  object: "Follow-up input and the thread below it"
  situation: "User presses Enter in the follow-up field; the answer streams or appears 5 to 30 seconds later."
  consequence: "Screen reader says nothing when the answer arrives; if the answer streams token by token into an aria-live region, the user hears a constant stream; if the input is cleared and focus is lost, the user has to find it again."
  p_typical: 0.05
  grounded: inferred
  evidence: "none"
  proposed: "Keep focus in the follow-up field; announce 'Answer ready' once, not per token; the answer itself is not in a live region."
  shallow: false
- id: a11y-21
  title: "Follow-up field disabled while the first answer is running becomes unfocusable and unexplained"
  level: L4
  cell: {surface: follow-up-thread, thread-state: follow-up-while-first-still-running, action: ask-follow-up, run-status: running}
  object: "Follow-up input in the thread"
  situation: "The first question is still Running; the follow-up field is disabled with a native disabled attribute."
  consequence: "Disabled fields drop out of the Tab order, so a keyboard user never finds the field or the reason it is unavailable; a sighted user sees grey and guesses. The spec says nothing on whether queuing a follow-up is allowed."
  p_typical: 0.06
  grounded: inferred
  evidence: "none"
  proposed: "Use aria-disabled with visible helper text 'Waiting for the first answer', keep the field in Tab order, and state whether follow-ups queue."
  shallow: false
- id: a11y-22
  title: "Tag filter with 200 tags has no stated control pattern or keyboard model"
  level: L4
  cell: {surface: tag-filter, library-state: "200-tags", action: filter-by-tag, videos-selected: "21-100"}
  object: "'The pop-up supports filtering by the tags the user has applied to videos'"
  situation: "User has 200 tags; filter is a row of chips, a dropdown, or a multi-select combobox; the spec says none."
  consequence: "200 chips are 200 tab stops; a custom dropdown without listbox roles is unreadable; multiple tags selected cannot be heard back. Whether tags combine with AND or OR is also unspecified, so a screen-reader user cannot predict the result count."
  p_typical: 0.04
  grounded: quote
  evidence: "filtering by the tags the user has applied to videos"
  proposed: "Searchable multi-select with checkbox options; selected tags listed as 'Filtered by: a, b'; combine rule stated in helper text."
  shallow: false
- id: a11y-23
  title: "Filtering or searching in the pop-up changes the visible list with no announced result count"
  level: L4
  cell: {surface: search-box, action: search, library-state: "50-videos", videos-selected: "0"}
  object: "Search box ('searching by name') and tag filter"
  situation: "User types 'demo' and the 50 videos reduce to 7 (or 0)."
  consequence: "Screen-reader user hears nothing after typing; cannot tell 7 results from 0; with 0 results the empty state text may not be read."
  p_typical: 0.07
  grounded: quote
  evidence: "searching by name"
  proposed: "Status region reads '7 videos match' after a 300 ms debounce; the empty state is the same region ('No videos match demo')."
  shallow: false
- id: a11y-24
  title: "Selected videos that were ticked and then hidden by a new filter or search keep their state invisibly"
  level: L4
  cell: {surface: add-video-popup, action: filter-by-tag, videos-selected: "2-5", library-state: "50-videos"}
  object: "Pop-up selection state across filter and search changes"
  situation: "User ticks 3 videos, then searches for a term that hides those 3, then ticks 2 more."
  consequence: "The footer count says 5 but only 2 are visible; screen-reader user cannot review the hidden 3; submitting covers 5 videos the user can no longer see in the pop-up."
  p_typical: 0.06
  grounded: inferred
  evidence: "none"
  proposed: "Keep a 'Selected (5)' review list reachable inside the pop-up that ignores the filter."
  shallow: false
- id: a11y-25
  title: "Tag renamed or deleted while the user's filter is active leaves a stale chip with no announcement"
  level: L4
  cell: {surface: tag-filter, library-state: tag-renamed-or-deleted-after-filtering, action: filter-by-tag, actor: same-user-second-tab}
  object: "Tag filter chip in the pop-up"
  situation: "In a second tab the user deletes the tag 'interviews' while the pop-up in the first tab still filters by it."
  consequence: "The list shows 0 videos with the filter chip still present, or silently reverts to all videos; a screen-reader user gets no message either way and may think the library is empty."
  p_typical: 0.02
  grounded: speculative
  evidence: "none"
  proposed: "Re-validate filters on pop-up focus; show 'Tag removed' in a status region."
  shallow: false
- id: a11y-26
  title: "Selected videos shown on the form have no stated remove control name or focus return after removal"
  level: L4
  cell: {surface: selected-videos-list, action: deselect-video, videos-selected: "6-20", mode: report}
  object: "Selected videos list on the Report form (after 'Add video')"
  situation: "User removes video 4 of 12 using a keyboard."
  consequence: "Remove buttons all named 'Remove' or 'x' are read 12 times without the video name; after removal the focused button is deleted and focus resets to the page top, so the user must Tab through the form again to remove a second video."
  p_typical: 0.07
  grounded: inferred
  evidence: "none"
  proposed: "Button name 'Remove <video name>'; focus moves to the next remove button, or to 'Add video' when the list becomes empty; announce '11 videos selected'."
  shallow: false
- id: a11y-27
  title: "Re-uploaded videos with the same name give identical accessible names for different thumbnails"
  level: L4
  cell: {surface: add-video-popup, video-state: re-uploaded-same-name, action: select-video, library-state: "50-videos"}
  object: "Pop-up thumbnails; search is 'by name'"
  situation: "The library holds 'standup.mp4' three times (3 uploads)."
  consequence: "Screen reader reads 'standup.mp4, checkbox' three times; the user selects the wrong one; thumbnails with empty alt text make the images useless to blind users, and duplicates are indistinguishable."
  p_typical: 0.04
  grounded: inferred
  evidence: "searching by name"
  proposed: "Accessible name adds upload date and duration: 'standup.mp4, 12 Oct, 4 min 10 s'."
  shallow: false
- id: a11y-28
  title: "Still-ingesting or failed videos, if shown disabled, are unfocusable and their reason is never reachable by keyboard or screen reader"
  level: L4
  cell: {surface: add-video-popup, video-state: still-ingesting, action: select-video, mode: report}
  object: "'Whether a video that is still ingesting, or failed ingestion, can be selected.'"
  situation: "3 of 50 videos are ingesting; the design greys them out and attaches a hover tooltip 'Ingesting'."
  consequence: "Native disabled checkboxes are skipped by Tab; the tooltip never shows to keyboard or touch users; a blind user sees 47 videos and does not know 3 exist, then wonders why a just-uploaded video is missing."
  p_typical: 0.06
  grounded: quote
  evidence: "Whether a video that is still ingesting, or failed ingestion, can be selected."
  proposed: "Keep them in the list with aria-disabled and visible status text 'Ingesting' or 'Ingestion failed' as part of the accessible name."
  shallow: false
- id: a11y-29
  title: "Hover-only video preview in thumbnails has no keyboard or reduced-motion equivalent"
  level: L3
  cell: {surface: add-video-popup, video-state: 3-second-clip, action: select-video, actor: creator-owner}
  object: "Pop-up video thumbnails (preview behaviour not specified)"
  situation: "Common pattern is a muted autoplay on hover to help users pick; the spec says nothing about previews."
  consequence: "Keyboard users get no preview and so cannot tell similar videos apart; if autoplay is added, a 3-second clip loops and violates the 5-second pause/stop rule for moving content; users with reduced-motion settings still see motion."
  p_typical: 0.02
  grounded: speculative
  evidence: "none"
  proposed: "State 'no autoplay; preview on explicit Play button only', and that previews are keyboard-operable."
  shallow: false
- id: a11y-30
  title: "Duration of 3-hour videos in the pop-up is shown as a timestamp that screen readers read as a clock time"
  level: L4
  cell: {surface: add-video-popup, video-state: 3-hour-long, action: select-video, videos-selected: "1"}
  object: "Pop-up thumbnail duration label (not specified; length limits are listed as unknown)"
  situation: "Duration label '3:00:00' or '180:00' on a thumbnail."
  consequence: "Screen reader says 'three colon zero zero colon zero zero' or 'three o'clock'; the user cannot judge whether the video is long enough to delay a Report."
  p_typical: 0.01
  grounded: speculative
  evidence: "video length and size limits"
  proposed: "Visually hidden text '3 hours' in the accessible name alongside the visual time format."
  shallow: false
- id: a11y-31
  title: "Submit with no videos or an empty Question has no stated error pattern for keyboard and screen-reader users"
  level: L4
  cell: {surface: submit-button, videos-selected: "0", text-input-state: question-empty, mode: ask-question, action: submit}
  object: "Submit button in Ask question mode; minimum videos per run is unspecified"
  situation: "User presses Enter on Submit with 0 videos and an empty Question."
  consequence: "A disabled Submit (native disabled) is skipped by Tab and gives no reason; an enabled Submit with a toast error is announced only if role=alert; focus stays on Submit instead of the first invalid field, so the user cannot find what to fix."
  p_typical: 0.07
  grounded: inferred
  evidence: "Minimum and maximum number of videos per run"
  proposed: "Keep Submit enabled; on press, show an error summary and focus the first invalid field with aria-invalid and aria-describedby."
  shallow: false
- id: a11y-32
  title: "Pressing Enter in the Run name field may submit the form implicitly and trigger the redirect"
  level: L4
  cell: {surface: run-name-field, action: type-run-name, mode: report, text-input-state: run-name-empty}
  object: "Run name (optional) field inside the Report form"
  situation: "User types a name and presses Enter to confirm it, as they would in a dialog; the field sits in a form with a Submit button."
  consequence: "Implicit submit fires with 0 videos and no prompt (all optional per spec), producing a History entry the user did not intend; keyboard and dictation users hit this far more than mouse users."
  p_typical: 0.04
  grounded: inferred
  evidence: "Run name (optional)"
  proposed: "Acceptance criterion 'Enter in Run name does not submit; submit only via the Submit button, or ask for confirmation'."
  shallow: false
- id: a11y-33
  title: "Double-submit by keyboard auto-repeat or double Enter creates two entries, with no stated disabled state announced"
  level: L4
  cell: {surface: submit-button, action: double-submit, time-and-connection: steady-state, run-status: queued}
  object: "Submit button; 'no loading page'"
  situation: "User holds Enter for 600 ms on Submit before the redirect occurs (auto-repeat about 30 per second after a 500 ms delay)."
  consequence: "Two or more identical entries with the same name and second appear; the screen reader has no 'submitting' state to say the button is busy, since no loading page exists."
  p_typical: 0.05
  grounded: quote
  evidence: "There is no loading page, to save the user's time."
  proposed: "Set aria-busy and aria-disabled on the first activation; one submission per form instance."
  shallow: false
- id: a11y-34
  title: "Offline or failed submit shows an error that disappears or is not announced, and the form content may be lost"
  level: L4
  cell: {surface: error-toast-or-banner, time-and-connection: offline-at-submit, action: submit, text-input-state: prompt-5000-chars}
  object: "Submit, with no loading page and no stated error state"
  situation: "User on a train submits with a 5000-character prompt; the request fails after 10 seconds."
  consequence: "A toast that auto-dismisses after 4 to 5 seconds is gone before a screen-reader user can read it (WCAG 2.2.1 time-limited message); the prompt may be cleared, forcing re-entry; no focus move."
  p_typical: 0.06
  grounded: inferred
  evidence: "none"
  proposed: "Persistent inline error with role=alert, retry button, form values preserved; no auto-dismiss under 20 seconds or at all."
  shallow: false
- id: a11y-35
  title: "Session expiry at submit sends the user to login and loses the form, with no explanation to assistive tech"
  level: L4
  cell: {surface: redirect-transition, time-and-connection: session-expired-at-submit, action: submit, videos-selected: "6-20"}
  object: "Redirect rule 'On submit the user is redirected to the History tab'"
  situation: "Page was open 3 hours; Submit returns 401 and the app redirects to the login page."
  consequence: "Screen-reader user hears a new page title with no context; after login they land on History or the Agent page with the 12 selected videos and prompt gone; the redirect goal of 'saving time' is reversed."
  p_typical: 0.03
  grounded: inferred
  evidence: "none"
  proposed: "Preserve form state in session storage, return to the Agent page after login, announce 'Session expired. Sign in to submit.'"
  shallow: false
- id: a11y-36
  title: "Back button after the redirect returns to the Agent page with unspecified focus and form state"
  level: L4
  cell: {surface: agent-page-mode-switch, action: back-button-after-redirect, time-and-connection: steady-state, mode: report}
  object: "Redirect from Agent page to History tab"
  situation: "User submits, lands on History, presses browser Back (Alt+Left)."
  consequence: "Form is either blank (the user may resubmit the same Report, duplicating it) or restored with the previous videos, and focus is at the top of the document; a screen-reader user gets no cue which of the two it is."
  p_typical: 0.05
  grounded: inferred
  evidence: "none"
  proposed: "State 'Agent page resets after submit' and set page title and heading focus on load so the reset is announced."
  shallow: false
- id: a11y-37
  title: "Opening a History entry has no stated focus target, heading, or return path to the same row"
  level: L4
  cell: {surface: history-entry-detail, action: open-history-entry, history-state: "100-entries", run-status: done}
  object: "'what opening an entry shows while running, when done, and when failed'"
  situation: "Keyboard user opens entry 47 of 100, reads it, and closes it (Esc or a Back link)."
  consequence: "If detail is an in-page panel with no focus move, the screen reader says nothing and the user keeps reading the list; on close, focus returns to the top of the list and they must Tab 47 times to get back."
  p_typical: 0.08
  grounded: quote
  evidence: "what opening an entry shows while running, when done, and when failed"
  proposed: "Open to a page with the entry title as h1 and focus on it; on back, focus returns to the originating row."
  shallow: false
- id: a11y-38
  title: "Markdown or HTML typed in the prompt or question is echoed in the History entry and may be read as markup"
  level: L4
  cell: {surface: history-entry-detail, text-input-state: text-contains-html-or-markdown, action: open-history-entry, mode: report}
  object: "'a new entry appears with whatever was submitted'"
  situation: "Prompt contains '## Summary' and '<b>bold</b>' or a 400-character line of asterisks."
  consequence: "If rendered as markdown, a heading level 2 appears inside the echoed prompt and breaks the page's heading outline; if rendered as raw text, screen readers read 'hash hash Summary' and each symbol; if sanitised silently, the echoed prompt no longer matches what the user typed."
  p_typical: 0.02
  grounded: quote
  evidence: "a new entry appears with whatever was submitted"
  proposed: "Echo prompt as plain text in a labelled block; render only the agent output as markdown with headings starting at h3."
  shallow: false
- id: a11y-39
  title: "Report output on done has no stated structure, so headings, tables and lists in a multi-video Report may be unnavigable"
  level: L4
  cell: {surface: history-entry-detail, run-status: done, videos-selected: "21-100", mode: report}
  object: "'A Report produces one output covering all selected videos, not one per video.'"
  situation: "One Report covers 40 videos; the output is a single long block with no per-video sections."
  consequence: "Screen-reader user cannot jump to the section about video 23; a table rendered as divs is read as a flat run of cells; the output heading level may start at h1 and duplicate the page title."
  p_typical: 0.04
  grounded: quote
  evidence: "A Report produces one output covering all selected videos, not one per video."
  proposed: "Require the output to use real headings per video name and real table markup, nested under the entry's h1."
  shallow: false
- id: a11y-40
  title: "Partial result where some videos were unusable shows warnings by icon only and not tied to the video names"
  level: L4
  cell: {surface: history-entry-detail, run-status: partial-some-videos-unusable, video-state: silent-or-no-transcript, videos-selected: "6-20"}
  object: "History entry detail for a Report covering 8 videos, 2 with no usable transcript"
  situation: "Report finishes with 6 videos used and 2 skipped; the spec lists no partial status."
  consequence: "A warning triangle icon with no text alternative is skipped by screen readers; the user believes all 8 are covered and acts on a Report that omitted 25 percent of the input."
  p_typical: 0.04
  grounded: speculative
  evidence: "none"
  proposed: "Text line 'Used 6 of 8 videos' at the top of the output, followed by a list of skipped video names with reasons."
  shallow: false
- id: a11y-41
  title: "Done entry with empty output reads as a successful status followed by silence"
  level: L4
  cell: {surface: history-entry-detail, run-status: done-with-empty-output, action: open-history-entry, mode: ask-question}
  object: "Entry detail when status is done and the answer text is empty"
  situation: "Ask question run on a silent video returns an empty string."
  consequence: "Screen reader announces 'Done' then reaches the follow-up field; the user does not know whether the answer is blank or still loading, and may add a follow-up that has nothing to refer to."
  p_typical: 0.03
  grounded: speculative
  evidence: "none"
  proposed: "Explicit text 'No answer was produced for these videos' in the output region."
  shallow: false
- id: a11y-42
  title: "Status polling re-renders the History list and moves the screen-reader cursor or focus"
  level: L4
  cell: {surface: history-tab, time-and-connection: page-open-for-hours, run-status: running, history-state: "100-entries"}
  object: "History tab showing 'current submissions' as well as past ones"
  situation: "Tab has been open 4 hours with 3 entries Running; the list auto-refreshes every 5 to 10 seconds."
  consequence: "Each refresh replaces 100 DOM rows; a screen-reader user at row 60 is thrown back to the top of the list or hears the list re-announced; keyboard focus on a row is lost."
  p_typical: 0.03
  grounded: inferred
  evidence: "Lists past and current submissions from both modes."
  proposed: "Update only the changed status text in place; do not replace rows; no auto-refresh while focus is inside the list."
  shallow: false
- id: a11y-43
  title: "Pop-up for 2000 videos has no stated way to reach the pop-up's action buttons or hear the total count"
  level: L4
  cell: {surface: add-video-popup, library-state: "2000-videos", videos-selected: more-than-popup-shows-at-once, action: select-video}
  object: "Add video pop-up list; 'more than the pop-up shows at once' is a spec gap"
  situation: "Library of 2000 videos with a scrolling grid of 40 shown at once (lazy load or virtualisation)."
  consequence: "Tab through 40 checkboxes triggers load of more, so the end of the list moves away; a virtualised grid reports 'checkbox 1 of 40' instead of 2000; the keyboard user cannot reach the pop-up's close or confirm button without 2000 Tab presses unless it is placed before the list."
  p_typical: 0.03
  grounded: speculative
  evidence: "none"
  proposed: "Place close and confirm controls before or sticky after the list in DOM order; set aria-setsize to the true total; add a 'Load more' button instead of scroll-triggered load."
  shallow: false
- id: a11y-44
  title: "No select-all means keyboard users picking all videos in a 50-video library press Space 50 times"
  level: L4
  cell: {surface: add-video-popup, videos-selected: all-videos-in-library, library-state: "50-videos", action: select-video}
  object: "Add video pop-up selection controls"
  situation: "User wants a Report covering every video; the spec has no select-all and no maximum."
  consequence: "50 Tab-and-Space pairs, 100 key presses, with the risk of missing one; with the filter applied it is unclear whether select-all would cover only the filtered subset."
  p_typical: 0.05
  grounded: inferred
  evidence: "Minimum and maximum number of videos per run"
  proposed: "Add 'Select all N shown' checkbox; state it applies to the current filter and announces the count."
  shallow: false
- id: a11y-45
  title: "Empty library gives a pop-up with no videos and no announced route to the Videos page"
  level: L4
  cell: {surface: empty-state, library-state: empty-library, time-and-connection: first-ever-use, action: open-add-video-popup}
  object: "Add video pop-up when no ingested videos exist; Videos page upload"
  situation: "First-time user clicks 'Add video' with 0 ingested videos (or only ones still ingesting)."
  consequence: "A dialog opens with an empty list; the screen reader announces the dialog and then nothing; the user does not know to go to the Videos page; the empty-state link, if present, must not close the pop-up and lose the Report form."
  p_typical: 0.08
  grounded: inferred
  evidence: "**Videos page**: users upload videos; uploaded videos get ingested."
  proposed: "Empty-state text 'No ingested videos yet' with a link 'Upload on the Videos page', first in DOM order and focused when the pop-up opens."
  shallow: false
- id: a11y-46
  title: "Entry that references a deleted video shows a blank or broken video name to screen readers"
  level: L4
  cell: {surface: history-entry-detail, history-state: entry-referencing-deleted-video, video-state: deleted-after-run, action: open-history-entry}
  object: "Video list inside a History entry"
  situation: "1 of 4 videos in an old Report has been deleted from the Videos page."
  consequence: "Row shows a grey thumbnail with no text, or a link to a page that returns 404; a screen reader reads 'link' or 'image'; the user cannot tell which video produced which part of the output."
  p_typical: 0.03
  grounded: inferred
  evidence: "none"
  proposed: "Keep the stored name as plain text with the suffix '(deleted)'; no link."
  shallow: false
- id: a11y-47
  title: "Non-English prompts, answers and video names have no stated language attribute, so screen readers mispronounce them"
  level: L4
  cell: {surface: history-entry-detail, text-input-state: non-english-text, video-state: non-english-audio, action: open-history-entry}
  object: "History entry detail text (prompt, question, answer) in a Hindi or Japanese session"
  situation: "Prompt typed in Hindi on an English interface; the agent answers in Hindi."
  consequence: "With no lang attribute a screen reader using an English voice reads Devanagari text as silence or spelled-out symbols; answer quality is unaffected but unusable to the blind user."
  p_typical: 0.02
  grounded: speculative
  evidence: "none"
  proposed: "Set lang on the echoed prompt and answer blocks from detected language; state the interface locale and answer-language rule."
  shallow: false
- id: a11y-48
  title: "Relative timestamps on History rows ('2 min ago') go stale and are read out inconsistently"
  level: L4
  cell: {surface: history-entry-row, time-and-connection: after-a-year, history-state: "100-entries", action: open-history-entry}
  object: "History entry time (format not specified)"
  situation: "Entries from 12 months ago show '1y ago' or a date without a year; two entries from 26 Oct 2025 and 26 Oct 2026 look the same."
  consequence: "A screen-reader user cannot place an entry in time; relative strings never update on an open tab; a tooltip with the full date is hover-only."
  p_typical: 0.02
  grounded: speculative
  evidence: "none"
  proposed: "Use a time element with an absolute date in its accessible text; show the year once older than 365 days."
  shallow: false
- id: a11y-49
  title: "Another user in the workspace or an admin viewing History would see per-user data with no stated indicator for assistive tech"
  level: L4
  cell: {surface: history-tab, actor: admin, history-state: report-and-question-entries-interleaved, action: open-agent-page}
  object: "'History is per user, currently.'"
  situation: "Admin opens History and sees (or does not see) another user's entries; the heading does not state whose history it is."
  consequence: "Screen-reader user has no way to confirm 'My history' vs another person's; mixed Report and Ask question rows with no mode word in the row name are indistinguishable when interleaved."
  p_typical: 0.02
  grounded: quote
  evidence: "History is per user, currently."
  proposed: "Page heading 'Your history'; each row names its mode ('Report' or 'Question') first in the accessible name."
  shallow: false
- id: a11y-50
  title: "Agent page has no stated heading or landmark structure and unclear tab order between Add video, selected videos and Submit"
  level: L4
  cell: {surface: report-form, action: open-agent-page, mode: report, time-and-connection: first-ever-use}
  object: "Report form order: Run name, Add video, Prompt, Submit"
  situation: "Screen-reader user opens the Agent page and navigates by heading or landmark."
  consequence: "No h1 or form label means the page opens with no context; if the selected-videos list is placed after Submit in the DOM, the user reaches Submit before hearing the 5 chosen videos and submits without review."
  p_typical: 0.06
  grounded: quote
  evidence: "Run name (optional); Add video; Prompt / instructions (optional); Submit"
  proposed: "Page h1, form with a label, selected-videos list placed between Add video and Prompt in DOM order."
