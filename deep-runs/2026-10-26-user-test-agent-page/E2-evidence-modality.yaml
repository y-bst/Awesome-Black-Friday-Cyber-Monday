- id: modality-1
  title: "'Where did they click first?' on a narrated screen recording: a transcript-only agent answers from what the participant said ('I'll try Sign up') and cites the utterance, not the click"
  level: L3
  cell: {surface: question-field, mode: ask-question, video-state: ingested, run-status: done, evidence-modality: speech-transcript, text-input-state: question-unrelated-to-videos}
  object: "Ask question mode, 'A question about the selected videos, typed by the user'; Videos page 'uploaded videos get ingested' (ingestion output never defined)"
  situation: "Participant says 'let me try sign up' at 00:41 but actually clicks the 'Pricing' nav link at 00:38 without speaking; user asks 'Where did they click first?'"
  consequence: "Answer states 'They clicked Sign up first (00:41)', a wrong fact delivered with a citation, and the researcher puts it in the readout"
  p_typical: 0.12
  grounded: inferred
  evidence: "Videos page: users upload videos; uploaded videos get ingested."
  proposed: "Spec line: ingestion produces <list of modalities>; when a question asks about an action and only speech is indexed, the answer must say 'inferred from speech, clicks not observed'"
  shallow: false
- id: modality-2
  title: "Done answer carries no 'evidence used' line: History entry detail should read 'Sources: transcript (5 videos); screen frames: not analysed; on-screen text: not analysed'"
  level: L4
  cell: {surface: history-entry-detail, mode: ask-question, video-state: ingested, run-status: done, evidence-modality: none-available, action: open-history-entry}
  object: "History entry detail (opening an entry is listed as unspecified); entry 'with whatever was submitted'"
  situation: "Any Ask question answer on screen recordings with audio, opened from History"
  consequence: "Reader cannot tell a speech-derived answer from an observed one; visual-sounding claims ('the error banner') are trusted equally"
  p_typical: 0.08
  grounded: quote
  evidence: "Statuses an entry can have on the History tab, and what opening an entry shows while running, when done, and when failed."
  proposed: "Acceptance criterion: every answer block ends with a fixed-format Sources line listing each modality as used / not available / not analysed"
  shallow: false
- id: modality-3
  title: "'What error appeared?': participant says 'huh, that's weird' at 03:12; with no OCR the agent paraphrases a plausible error message instead of saying the on-screen text was not read"
  level: L4
  cell: {surface: question-field, mode: ask-question, video-state: ingested, run-status: done, evidence-modality: burned-in-text-ocr, per-video-outcome-within-run: all-videos-used}
  object: "Question field; Ask question Submit"
  situation: "Checkout error toast 'Card declined (code 402)' visible 03:10-03:14; transcript at 03:12 is 'huh, that's weird... ok'"
  consequence: "Answer reads 'A payment error appeared' or invents 'Invalid card number'; expected L4 output is 'On-screen text is not available to the agent; at 03:12 the participant reacted with surprise'"
  p_typical: 0.07
  grounded: inferred
  evidence: "A question about the selected videos, typed by the user"
  proposed: "Spec the refusal copy for questions that ask for on-screen text when OCR is absent, with the nearest speech timestamp offered as a pointer"
  shallow: false
- id: modality-4
  title: "'How long on the pricing page?' answered as the gap between the first and last spoken mention of 'pricing', presented as dwell time"
  level: L4
  cell: {surface: question-field, mode: ask-question, video-state: ingested, run-status: done, evidence-modality: speech-transcript, videos-selected: 2-5}
  object: "Question field; answer in History entry detail"
  situation: "Participant mentions 'pricing' at 02:05 and 02:40, then stays on the pricing page silently until 08:30"
  consequence: "Answer says '35 seconds' while true dwell is 6 min 25 s; across 5 videos an averaged figure ('about 40 s') understates hesitation by about 10x"
  p_typical: 0.05
  grounded: inferred
  evidence: "none"
  proposed: "Duration questions require page-change detection from frames; without it the answer must say 'duration cannot be measured from speech' and give the mention timestamps only"
  shallow: false
- id: modality-5
  title: "Cited timestamp for a silent click snaps to the start of the enclosing transcript segment, so cited-video-timestamp-player opens up to 30 s before the action"
  level: L4
  cell: {surface: cited-video-timestamp-player, mode: ask-question, video-state: ingested, run-status: done, evidence-modality: speech-transcript, action: open-cited-timestamp}
  object: "Answer citations (format unspecified); cited-video-timestamp-player"
  situation: "Transcript segments are 20-30 s long; the click at 05:47 sits in a segment starting 05:20 with no speech after 05:26"
  consequence: "User scrubs manually to find the moment, or concludes the citation is wrong; trust in every other citation drops"
  p_typical: 0.06
  grounded: inferred
  evidence: "none"
  proposed: "Spec citation precision: speech-derived citations carry segment range '05:20-05:50'; frame-derived citations carry a point timestamp to 1 s"
  shallow: false
- id: modality-6
  title: "Static suggested questions such as 'Where did users get stuck?' or 'What did they click first?' imply the agent watches the screen when it only reads speech"
  level: L3
  cell: {surface: suggested-questions, mode: ask-question, video-state: ingested, run-status: done, evidence-modality: none-available, text-input-state: question-picked-from-suggested}
  object: "'Suggested questions are shown and can be picked'; unknown 'Whether suggested questions are static or derived'"
  situation: "First-time user picks a click-or-screen suggestion on 3 narrated recordings in a transcript-only build"
  consequence: "The product's own suggestion produces a speech-guessed answer; the user reasonably believes the agent saw the screen"
  p_typical: 0.09
  grounded: quote
  evidence: "Suggested questions are shown and can be picked"
  proposed: "Rule: a suggested question is shown only if every modality it depends on is available for all selected videos; tag each suggestion with its required modality in the suggestion list config"
  shallow: false
- id: modality-7
  title: "No pre-submit hint when the typed question contains visual verbs (click, see, appear, scroll, screen, button) and the selected videos have no visual index"
  level: L4
  cell: {surface: question-field, mode: ask-question, video-state: ingested, run-status: done, evidence-modality: on-screen-visual, action: type-question}
  object: "Question field; Submit (no loading page, user redirected)"
  situation: "User types 'Which button did each participant hover over before leaving?' and submits; redirect to History; answer arrives 2 min later"
  consequence: "User learns only after the run that the question could not be answered visually; one quota unit and 2 minutes spent"
  p_typical: 0.04
  grounded: quote
  evidence: "There is no loading page, to save the user's time. On submit the user is redirected to the History tab"
  proposed: "Inline note under the question field: 'This agent reads speech only; clicks and on-screen text are not visible to it' when a keyword list matches"
  shallow: false
- id: modality-8
  title: "Add video pop-up rows show no per-video evidence badges (Transcript / Frames / On-screen text / Click log), so the user cannot pick recordings that can answer a visual question"
  level: L3
  cell: {surface: add-video-popup, mode: ask-question, video-state: ingested, run-status: done, evidence-modality: cursor-or-interaction-events, library-state: 50-videos}
  object: "Add video pop-up 'select videos from their ingested videos'"
  situation: "Library of 50 recordings, 12 with audio only indexed and 38 with frames, all shown as identical 'ingested' rows"
  consequence: "User selects a mix by tag and gets an answer that silently covers fewer videos for the visual part"
  p_typical: 0.05
  grounded: quote
  evidence: "the user selects videos from their ingested videos. The pop-up supports filtering by the tags"
  proposed: "Each pop-up row shows modality badges; add a filter 'has screen analysis'"
  shallow: false
- id: modality-9
  title: "Selection mixes recordings ingested before and after a visual pipeline launch: 'where did they click first' answered for 2 of 5 videos with no per-video coverage statement"
  level: L4
  cell: {surface: history-entry-detail, mode: ask-question, video-state: ingested, run-status: done, evidence-modality: on-screen-visual, videos-selected: 2-5, per-video-outcome-within-run: some-videos-unusable}
  object: "History entry detail; 'Ask question' answer over selected videos"
  situation: "3 videos ingested in September (transcript only), 2 ingested in October (frames + OCR); no re-ingest rule"
  consequence: "Answer reads 'Participants first clicked Pricing' generalising from 2; expected output: 'Visual evidence for 2 of 5 videos (P4, P5); P1-P3 transcript only'"
  p_typical: 0.03
  grounded: inferred
  evidence: "Videos page: users upload videos; uploaded videos get ingested."
  proposed: "Store ingest_pipeline_version and modalities per video; answer prints coverage per modality; offer 're-ingest for screen analysis' on old videos"
  shallow: false
- id: modality-10
  title: "Frame analysis at question time on a 60-min recording at 1 fps is about 3,600 images per video; cost and latency per question are 50-100x a transcript-only answer, with no limit or estimate in the spec"
  level: L3
  cell: {surface: submit-button, mode: ask-question, video-state: ingested, run-status: done, evidence-modality: on-screen-visual, videos-selected: 6-20, permission-and-plan: quota-remaining}
  object: "Submit; unknown 'video length and size limits'"
  situation: "User asks 'what error appeared' over 10 one-hour recordings; agent samples frames on demand rather than at ingestion"
  consequence: "One question takes 10+ minutes and consumes the cost of hundreds of transcript questions; same one 'quota unit' if quota counts runs"
  p_typical: 0.06
  grounded: quote
  evidence: "Minimum and maximum number of videos per run; video length and size limits."
  proposed: "Decide frames-at-ingest (one-time cost) vs frames-at-question; if at question, show an estimate ('~8 min, uses 10 credits') before Submit"
  shallow: false
- id: modality-11
  title: "Follow-up 'look at the screen at 04:12, what does the dialog say?' in a transcript-only thread: whether a follow-up can escalate to visual analysis, and how the refusal reads, is unspecified"
  level: L3
  cell: {surface: follow-up-thread, mode: ask-question, video-state: ingested, run-status: done, evidence-modality: on-screen-visual, thread-state: follow-up-1}
  object: "'Follow-up questions are supported after the first answer.'"
  situation: "First answer was speech-based; user pins an exact timestamp and asks about on-screen content"
  consequence: "Agent either answers with 'The dialog likely says…' (fabricated) or a generic 'I cannot help with that'; no path to get the frame read"
  p_typical: 0.05
  grounded: quote
  evidence: "Follow-up questions are supported after the first answer."
  proposed: "Spec follow-up refusal copy naming the missing modality, plus an optional 'analyse frames 04:00-04:30' action if frame analysis exists"
  shallow: false
- id: modality-12
  title: "User asserts visual facts in a follow-up ('a red banner appears at 3:10, right?'); a transcript-only agent agrees and restates them as findings with a citation"
  level: L4
  cell: {surface: follow-up-thread, mode: ask-question, video-state: ingested, run-status: done, evidence-modality: none-available, thread-state: follow-up-10}
  object: "Follow-up thread"
  situation: "Researcher misremembers which participant saw the banner and asks leading follow-ups"
  consequence: "Thread output 'Yes, at 03:10 a red error banner appears' with no evidence source; the false memory is now a cited finding in History"
  p_typical: 0.02
  grounded: inferred
  evidence: "Follow-up questions are supported after the first answer."
  proposed: "Acceptance test: agent never confirms a visual claim it has no modality for; answer reads 'I cannot see the screen; the transcript at 03:10 contains: <quote>'"
  shallow: false
- id: modality-13
  title: "Interaction logs exported by test tools (click/URL event JSON) cannot be uploaded on the Videos page, so exact 'first click' and 'time on page' data that exists is never available to the agent"
  level: L3
  cell: {surface: videos-page, mode: ask-question, video-state: ingested, run-status: done, evidence-modality: cursor-or-interaction-events, library-state: 50-videos}
  object: "Videos page 'users upload videos'"
  situation: "Team records sessions in a tool that exports a per-session events.json with timestamps for clicks and page URLs"
  consequence: "Agent guesses from speech or frames what a 2 KB side-car file states exactly; 'how long on pricing' could be computed to the second"
  p_typical: 0.03
  grounded: quote
  evidence: "Videos page: users upload videos; uploaded videos get ingested."
  proposed: "Decide in or out of scope: side-car event file per video (format, timestamp alignment to video 00:00) or explicit 'video only' line"
  shallow: false
- id: modality-14
  title: "Sparse frame sampling misses a 1-second error toast, and the answer states 'no error appeared' as a negative fact instead of 'none seen in sampled frames'"
  level: L4
  cell: {surface: question-field, mode: ask-question, video-state: ingested, run-status: done, evidence-modality: on-screen-visual, per-video-outcome-within-run: all-videos-used}
  object: "Ask question answer in History entry detail"
  situation: "Frames sampled every 5 s or on scene change; toast visible 07:21.4-07:22.3; participant says nothing"
  consequence: "Researcher reports 'no errors in checkout' to the product team; the bug is not filed"
  p_typical: 0.03
  grounded: inferred
  evidence: "none"
  proposed: "Spec states sampling rate in the Sources line ('frames every 5 s') and negative answers use 'not observed at this sampling rate'"
  shallow: false
- id: modality-15
  title: "Screen recorded at 2560x1440 and downscaled to about 768 px for vision: 12 px error text becomes unreadable, and the answer neither quotes it nor says it was too small"
  level: L4
  cell: {surface: question-field, mode: ask-question, video-state: very-large-file, run-status: done, evidence-modality: burned-in-text-ocr, media-appearance: thumbnail-with-burned-in-text}
  object: "Question field; unspecified 'video length and size limits'"
  situation: "User asks 'what did the validation message under the email field say?'"
  consequence: "Answer: 'a validation message appeared' with no text; or a guessed text; user cannot tell resolution was the cause"
  p_typical: 0.02
  grounded: quote
  evidence: "Minimum and maximum number of videos per run; video length and size limits."
  proposed: "Define OCR input resolution (or crop-and-zoom on text regions) and an answer phrase 'text present but too small to read at <res>'"
  shallow: false
- id: modality-16
  title: "Picture-in-picture webcam overlay in the corner of a user-test recording covers where toasts render; visual answers describe the participant's face instead of the screen"
  level: L3
  cell: {surface: question-field, mode: ask-question, video-state: ingested, run-status: done, evidence-modality: on-screen-visual, media-appearance: portrait-or-odd-aspect-ratio}
  object: "Ask question answer; Add video pop-up (no layout metadata per video)"
  situation: "Recording tool places a 320x240 webcam bubble bottom-right; question 'what error appeared?'"
  consequence: "Answer: 'participant looked confused'; the toast under the bubble is never read"
  p_typical: 0.01
  grounded: speculative
  evidence: "none"
  proposed: "Note webcam-overlay as a known limitation in help copy, or let uploader mark overlay region at upload"
  shallow: false
- id: modality-17
  title: "A question that is entirely visual returns status Done with a non-answer ('The transcript does not mention clicks'); no distinct status or badge marks it as unanswerable"
  level: L4
  cell: {surface: history-entry-status-badge, mode: ask-question, video-state: ingested, run-status: done-with-empty-output, evidence-modality: none-available}
  object: "History tab entry status (statuses unspecified; assumed Queued / Running / Done / Failed)"
  situation: "User submits 'where did they click first' on 4 recordings and moves on; checks History later"
  consequence: "Row shows the same green Done as a useful answer; user opens it expecting results; quota counted"
  p_typical: 0.06
  grounded: quote
  evidence: "Statuses an entry can have on the History tab"
  proposed: "Add 'Answered: insufficient evidence' status or a warning icon on the row, and decide whether such runs consume quota"
  shallow: false
- id: modality-18
  title: "Old entry re-asked after frame analysis ships returns a different answer; neither entry records which modalities it used, so the two cannot be reconciled"
  level: L3
  cell: {surface: history-entry-detail, mode: ask-question, video-state: ingested, run-status: done, evidence-modality: on-screen-visual, history-state: entries-from-older-agent-version}
  object: "History tab 'Lists past and current submissions'"
  situation: "March entry (speech only) says first click was 'Sign up'; October re-ask (frames) says 'Pricing'"
  consequence: "Researcher cannot tell which is right or why they differ; earlier readouts built on the March answer are silently wrong"
  p_typical: 0.04
  grounded: quote
  evidence: "Lists past and current submissions from both modes."
  proposed: "Store agent version + modalities on each entry and show them in entry detail"
  shallow: false
- id: modality-19
  title: "'How long on the pricing page?' answer gives a range '02:05-08:30' but cited-video-timestamp-player supports only point seeks, so the range cannot be played or checked"
  level: L4
  cell: {surface: cited-video-timestamp-player, mode: ask-question, video-state: ingested, run-status: done, evidence-modality: on-screen-visual, action: open-cited-timestamp}
  object: "Answer citations; cited-video-timestamp-player"
  situation: "Duration answers derived from frames cite a start and end"
  consequence: "Clicking opens 02:05; user must watch 6 min to verify the end boundary"
  p_typical: 0.02
  grounded: inferred
  evidence: "none"
  proposed: "Citation format supports ranges; player shows start/end markers and a 'jump to end' control"
  shallow: false
- id: modality-20
  title: "OCR of screen recordings indexes what the participant typed (email, card last 4, address) and the answer to 'what error appeared' quotes the form contents around it"
  level: L3
  cell: {surface: question-field, mode: ask-question, video-state: ingested, run-status: done, evidence-modality: burned-in-text-ocr, actor: test-participant-data-subject}
  object: "Ask question answer stored in per-user History"
  situation: "Error 'Email already registered: priya.k@...' appears on screen; OCR captures it verbatim"
  consequence: "Participant PII enters History text, exports and copied output; transcript-level redaction (if any) does not cover OCR text"
  p_typical: 0.04
  grounded: inferred
  evidence: "History is per user."
  proposed: "Apply the same PII redaction to OCR text as to transcripts, or exclude form-field regions from OCR"
  shallow: false
