example_cells:
- surface: redirect-transition
  videos-selected: 2-5
  run-status: submitted-not-yet-visible-in-history
  time-and-connection: redirect-lands-before-entry-exists
  action: submit
- surface: add-video-popup
  video-state: still-ingesting
  library-state: 50-videos
  action: select-video
- surface: history-entry-detail
  mode: report
  videos-selected: 6-20
  run-status: partial-some-videos-unusable
  action: open-history-entry
- surface: follow-up-thread
  thread-state: follow-up-while-first-still-running
  action: ask-follow-up
- surface: report-form
  mode: switching-mode-after-selecting-videos
  text-input-state: prompt-5000-chars
  action: switch-mode
pruned_cells:
- cell:
    mode: report
    thread-state: follow-up-1
  reason: 'follow-ups exist only in Ask question mode (which is itself a gap to record: can a report be followed up?)'
- cell:
    videos-selected: 0
    run-status: done
  reason: a run with no videos cannot complete, unless the spec allows submitting with none, which is a gap
- cell:
    surface: videos-page
    action: ask-follow-up
  reason: follow-ups live on the agent page / history entry
