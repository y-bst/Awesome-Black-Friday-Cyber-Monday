axes:
  - name: surface
    values: [videos-page, agent-page-mode-switch, report-form, ask-question-form, add-video-popup, tag-filter, search-box, selected-videos-list, suggested-questions, run-name-field, prompt-field, question-field, submit-button, redirect-transition, history-tab, history-entry-row, history-entry-detail, follow-up-thread, empty-state, error-toast-or-banner]
  - name: actor
    values: [creator-owner, same-user-second-tab, other-user-same-workspace, admin, background-agent-job, ingestion-job]
  - name: videos-selected
    values: [0, 1, 2-5, 6-20, 21-100, all-videos-in-library, more-than-popup-shows-at-once]
  - name: video-state
    values: [ingested, still-ingesting, ingestion-failed, deleted-after-selection-before-run, deleted-after-run, re-uploaded-same-name, silent-or-no-transcript, 3-hour-long, 3-second-clip, untagged, non-english-audio]
  - name: library-state
    values: [empty-library, 1-video, 50-videos, 2000-videos, all-untagged, 200-tags, tag-renamed-or-deleted-after-filtering]
  - name: mode
    values: [report, ask-question, switching-mode-after-selecting-videos]
  - name: text-input-state
    values: [run-name-empty, run-name-duplicate-of-existing, run-name-200-chars, prompt-empty, prompt-5000-chars, prompt-contradicts-report-mode, question-empty, question-picked-from-suggested, question-unrelated-to-videos, non-english-text, text-contains-instructions-to-ignore-rules, text-contains-html-or-markdown]
  - name: run-status
    values: [submitted-not-yet-visible-in-history, queued, running, done, failed, partial-some-videos-unusable, cancelled-not-in-spec, stuck-over-1h, done-with-empty-output]
  - name: thread-state
    values: [first-question, follow-up-1, follow-up-10, follow-up-while-first-still-running, follow-up-after-video-deleted, follow-up-with-changed-video-set, thread-opened-from-history]
  - name: history-state
    values: [empty, 1-entry, 100-entries, 1000-entries, report-and-question-entries-interleaved, entry-referencing-deleted-video, two-entries-same-second, entries-with-blank-run-name]
  - name: time-and-connection
    values: [first-ever-use, steady-state, offline-at-submit, submit-succeeds-redirect-fails, redirect-lands-before-entry-exists, session-expired-at-submit, page-open-for-hours, during-agent-outage, after-a-year]
  - name: action
    values: [open-agent-page, switch-mode, open-add-video-popup, filter-by-tag, search, select-video, deselect-video, close-popup-without-confirm, type-run-name, type-prompt, pick-suggested-question, type-question, submit, double-submit, back-button-after-redirect, refresh-after-redirect, open-history-entry, re-run-not-in-spec, delete-entry-not-in-spec, rename-entry-not-in-spec, ask-follow-up, cancel-run-not-in-spec, share-or-export-not-in-spec]
example_cells:
  - {surface: redirect-transition, videos-selected: 2-5, run-status: submitted-not-yet-visible-in-history, time-and-connection: redirect-lands-before-entry-exists, action: submit}
  - {surface: add-video-popup, video-state: still-ingesting, library-state: 50-videos, action: select-video}
  - {surface: history-entry-detail, mode: report, videos-selected: 6-20, run-status: partial-some-videos-unusable, action: open-history-entry}
  - {surface: follow-up-thread, thread-state: follow-up-while-first-still-running, action: ask-follow-up}
  - {surface: report-form, mode: switching-mode-after-selecting-videos, text-input-state: prompt-5000-chars, action: switch-mode}
pruned_cells:
  - cell: {mode: report, thread-state: follow-up-1}
    reason: follow-ups exist only in Ask question mode (which is itself a gap to record: can a report be followed up?)
  - cell: {videos-selected: 0, run-status: done}
    reason: a run with no videos cannot complete, unless the spec allows submitting with none, which is a gap
  - cell: {surface: videos-page, action: ask-follow-up}
    reason: follow-ups live on the agent page / history entry
