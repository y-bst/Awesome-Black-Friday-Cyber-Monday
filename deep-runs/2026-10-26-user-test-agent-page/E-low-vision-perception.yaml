- id: lowvision-1
  title: "Add video pop-up: selected-state checkmark drawn over a white or near-white thumbnail has no defined contrast backing, so a white tick on a white slide-deck frame is invisible"
  level: L4
  cell: {surface: add-video-popup, action: select-video, videos-selected: 2-5, video-state: ingested}
  object: "Add video pop-up, video thumbnail tile, selected state"
  situation: "User selects a video whose thumbnail is a mostly white frame (title slide, whiteboard, screen recording of a white web page) on a phone at full brightness outdoors"
  consequence: "User cannot tell which of the 2-5 tiles are selected, re-taps and accidentally deselects; the report then covers the wrong set of videos"
  p_typical: 0.14
  grounded: inferred
  evidence: "clicking \"Add video\" opens a pop-up where the user selects videos from their ingested videos"
  proposed: "Selected tile = check icon inside a filled circle with a 2px dark outline plus a 3px border around the whole tile; check-on-thumbnail contrast at least 3:1 against both #FFFFFF and #000000 thumbnails"
  shallow: false
- id: lowvision-2
  title: "Add video pop-up: a selected state expressed only as a translucent coloured tint over the thumbnail disappears on thumbnails whose dominant hue matches the tint"
  level: L4
  cell: {surface: add-video-popup, action: select-video, library-state: 50-videos, video-state: ingested}
  object: "Add video pop-up, thumbnail selection overlay"
  situation: "Selection rendered as a 30% brand-blue overlay; one of the 50 thumbnails is a blue-screen or sky shot"
  consequence: "Selected and unselected blue thumbnails look the same; colour-blind users cannot see the tint on any thumbnail at all"
  p_typical: 0.05
  grounded: speculative
  evidence: "the user selects videos from their ingested videos"
  proposed: "Spec line: selection must be shown by a shape cue (check icon + border) and never by tint alone (WCAG 1.4.1)"
  shallow: false
- id: lowvision-3
  title: "Add video pop-up: black or first-frame-black thumbnails make a dark check overlay and a dark selection border invisible"
  level: L4
  cell: {surface: add-video-popup, action: select-video, video-state: silent-or-no-transcript, videos-selected: 1}
  object: "Add video pop-up, thumbnail of a video whose first frame is black (fade-in, screen-off start)"
  situation: "Thumbnail is generated from frame 0 and the video opens on a black frame; user selects it"
  consequence: "Tile is a black square with an invisible dark tick; user cannot see the thumbnail content or the selection"
  p_typical: 0.04
  grounded: speculative
  evidence: "Videos page: users upload videos; uploaded videos get ingested."
  proposed: "Spec the thumbnail frame rule (first non-black frame, or frame at 10% of duration) and test the check overlay on a #000000 tile"
  shallow: false
- id: lowvision-4
  title: "Ingesting vs ingestion-failed badges in the Add video pop-up differ only by colour (amber vs red), indistinguishable under deuteranopia/protanopia"
  level: L4
  cell: {surface: add-video-popup, video-state: ingestion-failed, library-state: 50-videos, action: open-add-video-popup}
  object: "Add video pop-up, per-video state badge (ingesting / failed ingestion)"
  situation: "Pop-up shows both still-ingesting and failed videos (selectability is listed as unspecified) using same-shape coloured dots"
  consequence: "User waits for a failed video to finish ingesting, or abandons a video that would have finished in 2 minutes"
  p_typical: 0.18
  grounded: quote
  evidence: "Whether a video that is still ingesting, or failed ingestion, can be selected."
  proposed: "Badges carry a text word ('Ingesting', 'Failed') plus a distinct icon (spinner vs exclamation triangle); never colour alone"
  shallow: false
- id: lowvision-5
  title: "Add video pop-up: not-selectable (ingesting or failed) tiles shown only at reduced opacity look identical to selectable tiles on dark or busy thumbnails"
  level: L4
  cell: {surface: add-video-popup, video-state: still-ingesting, action: select-video, library-state: 50-videos}
  object: "Add video pop-up, disabled tile state"
  situation: "Non-selectable tiles rendered at 50% opacity; the thumbnail is already dark or visually noisy"
  consequence: "Low-vision user taps a disabled tile, nothing happens, no reason shown; user concludes the pop-up is broken"
  p_typical: 0.09
  grounded: quote
  evidence: "Whether a video that is still ingesting, or failed ingestion, can be selected."
  proposed: "Disabled tile = greyscale thumbnail + lock/clock icon + text 'Not ready – ingesting' visible without hover; tap shows inline reason"
  shallow: false
- id: lowvision-6
  title: "Add video pop-up: selection checkbox revealed only on hover is unreachable on a phone and invisible to screen-magnifier users who never hover the corner"
  level: L3
  cell: {surface: add-video-popup, action: select-video, videos-selected: 6-20, time-and-connection: steady-state}
  object: "Add video pop-up, tile checkbox affordance"
  situation: "Grid follows the common pattern of showing a corner checkbox on hover only"
  consequence: "On touch there is no visible affordance; at 4x magnification the corner checkbox is outside the magnified area"
  p_typical: 0.04
  grounded: speculative
  evidence: "the user selects videos from their ingested videos"
  proposed: "Checkbox (empty circle) always visible on every tile, at least 24x24 CSS px"
  shallow: false
- id: lowvision-7
  title: "Add video pop-up: keyboard focus ring on a thumbnail tile has no contrast rule and vanishes on thumbnails of the same hue as the ring"
  level: L4
  cell: {surface: add-video-popup, action: select-video, library-state: 2000-videos, actor: creator-owner}
  object: "Add video pop-up grid, focus indicator"
  situation: "Keyboard user tabs/arrows through 2000 tiles; default 2px blue focus outline sits on a blue thumbnail"
  consequence: "User loses position in the grid and selects the wrong video"
  p_typical: 0.03
  grounded: speculative
  evidence: "The pop-up supports filtering by the tags the user has applied to videos, and searching by name."
  proposed: "Focus = two-tone ring (2px dark + 2px white) offset 2px outside the tile, meeting WCAG 2.4.13 3:1"
  shallow: false
- id: lowvision-8
  title: "Videos with identical thumbnails (re-uploads, same intro card) are told apart in the pop-up only by a small truncated name"
  level: L4
  cell: {surface: add-video-popup, video-state: re-uploaded-same-name, library-state: 50-videos, action: search}
  object: "Add video pop-up, tile caption (name)"
  situation: "Two uploads of 'Usability session 3.mp4' or 10 videos starting with the same branded title card; name truncated at ~20 chars in 12px grey"
  consequence: "User cannot identify which copy is which and picks the older, possibly broken one"
  p_typical: 0.07
  grounded: inferred
  evidence: "The pop-up supports ... searching by name."
  proposed: "Each tile shows name (2 lines, at least 14px, 4.5:1), duration and upload date; full name on long-press/focus"
  shallow: false
- id: lowvision-9
  title: "Thumbnails with burned-in text (slide titles, captions) compete with the filename caption and mislead low-vision users who read the bigger thumbnail text"
  level: L3
  cell: {surface: add-video-popup, action: search, video-state: ingested, library-state: 50-videos}
  object: "Add video pop-up, thumbnail image vs name caption"
  situation: "Thumbnail shows large burned-in text 'Session 1' while the filename is 'P07_final.mp4'; search 'Session 1' returns nothing"
  consequence: "User believes the video is missing from the library, or selects by the burned-in text which matches the wrong video"
  p_typical: 0.02
  grounded: speculative
  evidence: "searching by name"
  proposed: "Accept or spec: search covers name only; caption must be the visually dominant label under each tile"
  shallow: false
- id: lowvision-10
  title: "Duration badge (white text on thumbnail corner) has no scrim, unreadable on bright thumbnails, so a 3-second clip and a 3-hour video look the same"
  level: L4
  cell: {surface: add-video-popup, video-state: 3-second-clip, videos-selected: 2-5, action: select-video}
  object: "Add video pop-up, tile duration label"
  situation: "Duration overlay '0:03' or '3:02:11' drawn directly on a white-background screen recording"
  consequence: "User adds a 3-second test clip or a 3-hour recording by mistake; report quality or run time surprises them"
  p_typical: 0.03
  grounded: speculative
  evidence: "Minimum and maximum number of videos per run; video length and size limits."
  proposed: "Duration in a dark pill (#000 at 75%) with white 12px+ text, contrast at least 4.5:1 on any thumbnail"
  shallow: false
- id: lowvision-11
  title: "Ingestion-failed videos may have no thumbnail; the empty tile looks like a still-loading skeleton placeholder"
  level: L4
  cell: {surface: add-video-popup, video-state: ingestion-failed, library-state: 1-video, action: open-add-video-popup}
  object: "Add video pop-up, placeholder tile for a video without a generated thumbnail"
  situation: "Ingestion failed before thumbnail extraction; tile renders a pale grey block identical to the loading skeleton"
  consequence: "User waits for the tile to 'load'; with 1 video in the library the whole pop-up appears stuck"
  p_typical: 0.03
  grounded: inferred
  evidence: "Whether a video that is still ingesting, or failed ingestion, can be selected."
  proposed: "Failed tile = broken-film icon + text 'Ingestion failed' on a neutral tile; skeleton only while the request is in flight"
  shallow: false
- id: lowvision-12
  title: "Tag filter chips coloured by user choice have no text-contrast rule; a yellow chip with white text on a white pop-up is about 1.1:1"
