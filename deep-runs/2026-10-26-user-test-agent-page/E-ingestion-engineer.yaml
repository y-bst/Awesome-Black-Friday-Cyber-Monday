  cell: {surface: history-entry-row, actor: ingestion-job, video-state: ingestion-failed, run-status: partial-some-videos-unusable}
  object: "History entry row status"
  situation: "User submits 5 videos, 1 still ingesting; its ingestion fails 6 minutes later"
