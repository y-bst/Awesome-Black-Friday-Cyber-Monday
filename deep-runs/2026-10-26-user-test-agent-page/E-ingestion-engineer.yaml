- id: ingest-1
  title: "Add video pop-up has no rule for a video still ingesting when the pop-up opens: hidden, listed-disabled with a status badge, or selectable"
  level: L3
  cell: {surface: add-video-popup, video-state: still-ingesting, library-state: 50-videos, action: open-add-video-popup}
  object: "Add video pop-up; 'select videos from their ingested videos'"
  situation: "User uploaded 3 videos 2 minutes ago, they are mid-ingestion, user opens the pop-up from Report mode"
  consequence: "If hidden, the user thinks the upload was lost and re-uploads, creating duplicates; if selectable, the run has no transcript to read"
  p_typical: 0.35
  grounded: quote
  evidence: "Whether a video that is still ingesting, or failed ingestion, can be selected."
  proposed: "Spec line: still-ingesting videos are listed greyed with an 'Ingesting' badge and are not selectable"
  shallow: false

- id: ingest-2
  title: "Pop-up list does not refresh when a listed video finishes ingesting while the pop-up is open"
  level: L4
  cell: {surface: add-video-popup, actor: ingestion-job, video-state: still-ingesting, time-and-connection: steady-state, action: open-add-video-popup}
  object: "Add video pop-up video list"
  situation: "Pop-up open for 4 minutes; ingestion-job flips video 'demo-07' from ingesting to ingested at minute 2"
  consequence: "Row stays greyed until the user closes and reopens the pop-up, losing any selections made so far"
  p_typical: 0.08
  grounded: inferred
  evidence: "the user selects videos from their ingested videos"
  proposed: "Acceptance criterion: pop-up polls ingestion status every 10 s (or on push) and enables the row in place without clearing selections"
  shallow: false

- id: ingest-3
  title: "Video re-ingested after an edit on the Videos page between selection and Submit: run uses old transcript, new one, or blocks"
  level: L3
  cell: {surface: submit-button, actor: ingestion-job, video-state: ingested, action: submit}
  object: "Submit button; Videos page 'uploaded videos get ingested'"
  situation: "User selects 'interview-3' (ingested), trims it on the Videos page in a second tab, re-ingestion starts, user clicks Submit 30 s later"
  consequence: "Run either reads a half-overwritten transcript or the old untrimmed one; the report quotes content the user cut out"
  p_typical: 0.04
  grounded: inferred
  evidence: "Videos page: users upload videos; uploaded videos get ingested."
  proposed: "Spec line: a video under re-ingestion counts as 'ingesting'; Submit is rejected for it with copy naming the video"
  shallow: false

- id: ingest-4
  title: "Video selected in the pop-up then deleted on the Videos page before Submit: Submit behaviour is unspecified"
  level: L3
  cell: {surface: selected-videos-list, actor: same-user-second-tab, video-state: deleted-after-selection-before-run, action: submit}
  object: "Selected videos list on Report form; Submit"
  situation: "4 videos selected; user deletes 1 of them in another tab, then clicks Submit"
  consequence: "Server may accept a dangling video id; the run later fails or silently covers 3 of 4 videos while History shows 4"
  p_typical: 0.12
  grounded: inferred
  evidence: "Videos are selected from already-uploaded, ingested videos via the Add video pop-up"
  proposed: "Server revalidates every id at Submit; on a missing id return an error banner naming the video and keep the form intact"
  shallow: false

- id: ingest-5
  title: "Video deleted after Submit while the run is still queued: run snapshots content at Submit or reads it at start"
  level: L3
  cell: {surface: history-entry-row, actor: background-agent-job, video-state: deleted-after-selection-before-run, run-status: queued}
  object: "History entry row status"
  situation: "Run queued behind 10 others for 3 minutes; user deletes 1 of its 5 videos during the wait"
  consequence: "Entry flips to Failed or to partial with no explanation; the user never connects it to the delete"
  p_typical: 0.05
  grounded: inferred
  evidence: "a new entry appears with whatever was submitted"
  proposed: "Spec line: content is resolved at run start; a deleted video yields status 'Partial' with 'video X was deleted before the run started'"
  shallow: false

- id: ingest-6
  title: "History entry detail for a done run whose video was later deleted: thumbnail, name and link to the video are unspecified"
  level: L4
  cell: {surface: history-entry-detail, video-state: deleted-after-run, history-state: entry-referencing-deleted-video, action: open-history-entry}
  object: "History entry detail, list of videos covered"
  situation: "Report on 6 videos done last week; user deleted 2 of them yesterday and opens the entry"
  consequence: "Broken thumbnails and dead links, or the 2 names vanish and the report text cites videos the entry no longer lists"
  p_typical: 0.09
  grounded: inferred
  evidence: "History tab: Lists past and current submissions from both modes."
  proposed: "Entry stores video name at submit; deleted videos render as '<name> (deleted)' with placeholder thumbnail and no link"
  shallow: false

- id: ingest-7
  title: "Videos page delete confirmation shows no count of History entries and threads that reference the video"
  level: L4
  cell: {surface: videos-page, actor: creator-owner, video-state: deleted-after-run, history-state: entry-referencing-deleted-video}
  object: "Videos page delete action"
  situation: "User deletes a video used in 3 reports and 1 open question thread"
  consequence: "User unknowingly breaks follow-ups and source links in 4 History entries"
  p_typical: 0.03
  grounded: speculative
  evidence: "Videos page: users upload videos; uploaded videos get ingested."
  proposed: "Delete dialog copy: 'Used in 4 History entries. They will keep their output but lose access to this video.'"
  shallow: false

- id: ingest-8
  title: "Follow-up asked after one of the thread's videos was deleted: agent source for the answer is unspecified"
  level: L3
  cell: {surface: follow-up-thread, thread-state: follow-up-after-video-deleted, video-state: deleted-after-run, action: ask-follow-up}
  object: "Follow-up thread; 'Follow-up questions are supported after the first answer.'"
  situation: "Thread over 3 videos; video 2 deleted; user asks follow-up 'what did participant 2 say about pricing?'"
  consequence: "Agent answers from cached transcript the user thought was deleted (privacy surprise) or answers without it and does not say so"
  p_typical: 0.06
  grounded: quote
  evidence: "Ask question supports follow-ups."
  proposed: "Spec line: deleting a video purges its transcript; follow-ups in affected threads show a banner 'video X deleted, answers exclude it'"
  shallow: false

- id: ingest-9
  title: "Two videos re-uploaded with the same name appear as identical rows in the pop-up with no disambiguator"
  level: L4
  cell: {surface: add-video-popup, video-state: re-uploaded-same-name, library-state: 50-videos, action: search}
  object: "Add video pop-up, 'searching by name'"
  situation: "User re-uploads 'session-1.mp4' after a bad first upload; search 'session-1' returns 2 rows"
  consequence: "User picks the wrong copy (the bad one) 50% of the time"
  p_typical: 0.07
  grounded: quote
  evidence: "The pop-up supports filtering by the tags the user has applied to videos, and searching by name."
  proposed: "Each pop-up row shows upload date, duration and thumbnail; same-name rows get a '(2)' suffix"
  shallow: false

- id: ingest-10
  title: "Re-upload with the same name after deleting the original: History entries must not rebind to the new video by name"
  level: L3
  cell: {surface: history-entry-detail, video-state: re-uploaded-same-name, history-state: entry-referencing-deleted-video, action: open-history-entry}
  object: "History entry detail video references"
  situation: "User deletes 'kickoff.mp4', uploads a different file named 'kickoff.mp4', opens an old report"
  consequence: "If references resolve by name, the old report links to and follow-ups query a video it never covered"
  p_typical: 0.02
  grounded: speculative
  evidence: "a new entry appears with whatever was submitted"
  proposed: "Acceptance criterion: entries reference video ids, never names; old entry shows 'kickoff.mp4 (deleted)'"
  shallow: false

- id: ingest-11
  title: "Selected-video chip shows only the name, so a same-name re-upload in another tab makes the selection ambiguous"
  level: L3
  cell: {surface: selected-videos-list, actor: same-user-second-tab, video-state: re-uploaded-same-name, action: select-video}
  object: "Selected videos list in Report and Ask question forms"
  situation: "User has 'test-A' selected, re-uploads a corrected 'test-A' in a second tab, returns to the form"
  consequence: "User believes the corrected file is selected; the run uses the old one"
  p_typical: 0.02
  grounded: speculative
  evidence: "Add video: clicking 'Add video' opens a pop-up where the user selects videos"
  proposed: "Selected chip shows thumbnail + upload timestamp; hover shows video id short code"
  shallow: false

- id: ingest-12
  title: "Ingestion-failed video in the pop-up: hidden or listed disabled with the failure reason and a link to retry on the Videos page"
  level: L3
  cell: {surface: add-video-popup, video-state: ingestion-failed, library-state: 50-videos, action: open-add-video-popup}
  object: "Add video pop-up"
  situation: "1 of 50 videos failed ingestion (unsupported codec); user searches for it by name"
