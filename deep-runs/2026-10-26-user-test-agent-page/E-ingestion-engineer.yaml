- id: ingest-14
  title: "If runs may wait on ingestion, no maximum wait or distinct History status for 'waiting for ingestion'"
  level: L4
  cell: {surface: history-entry-row, video-state: still-ingesting, run-status: stuck-over-1h, videos-selected: "2-5"}
  object: "History entry status column"
  situation: "Run includes a 3-hour video whose ingestion takes 70 minutes"
