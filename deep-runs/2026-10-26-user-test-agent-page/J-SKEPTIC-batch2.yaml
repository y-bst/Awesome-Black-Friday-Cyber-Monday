- id: range-18
  case: >-
    Defer. The root problem here, a run whose transcript exceeds one model context, is backend-1 (position 2 in this
    top 25), and its proposed fix (a total transcript budget enforced at Submit, plus chunk-and-merge for runs above one
    context) removes the silent truncation this leaf depends on. Once that is in the spec, the remaining ask is a
    time-range selector inside the Add video pop-up or selected-videos list. That is a new feature, not a missing
    behaviour line: the spec describes no per-video range control anywhere, and adding one widens the pop-up design,
    the selection model and the backend contract before launch. The leaf's own p_typical is 0.05 and its grounding is
    inferred, with no evidence that users want partial-video analysis. A range control is cheap to add later as a pure
    addition, once real usage shows how often single long videos hit the budget. The right pre-build line is "over-budget
    runs are blocked at Submit with copy naming the overage" (backend-1), and range selection waits for data.
- id: contract-15
  case: >-
    Accept the default and tune after launch. Whether quoted text is verbatim is a property of the agent's output
    instructions, not of the page, the form, the redirect or the History tab that this spec describes; it is set in the
    system prompt and can change on any day without a UI or schema change, so the cost of fixing it later is near zero.
    Any competent build of a research-report agent will already tell the model to quote exactly and cite a timestamp, and
    the leaf itself notes that quotes come with a cited timestamp, which is what lets a reader check the words against
    playback. The scenario is inferred, not quoted (the spec never mentions quotes), and p_typical is 0.06. The proposed
    "QA spot-checks 10 quotes per report" is a test-plan item for the eval team, not a spec line the PM and designer must
    settle before build. Write it into the agent prompt and the eval set, not the product spec.
- id: modality-3
  case: >-
    Reject as a separate item and fold into modality-1. This is the same root gap as modality-1 (position 1): the spec
    does not say what ingestion extracts. Once the PM writes the one line modality-1 proposes, "ingestion produces
    <modalities>; when a question needs a modality that is not indexed, the answer says so", the OCR case is covered as
    one instance of that rule. A separate refusal copy for on-screen text adds nothing a single general rule does not
    already give. Beyond that, "do not invent facts the evidence does not contain" is the baseline grounding instruction
    for any question-answering agent, not a page-spec decision. The copy is cheap to iterate post-launch, and p_typical
    is 0.07 with inferred grounding. Keeping it as its own leaf double-counts one decision.
- id: speaker-1
  case: >-
    Weaker case than the others, but still defer. Speaker labelling is a property of the ingestion pipeline on the
    Videos page, which the spec treats as a separate, existing feature ("uploaded videos get ingested"). It is not
    something the agent page can specify or own. Mainstream speech-to-text services return speaker diarization by
    default, so "Speaker 1 / Speaker 2" labels are the likely default without any spec line. Mapping those to moderator
    and participant roles is a model-side inference the report prompt can attempt and improve after launch without UI
    changes. Unmoderated sessions, common in user testing, have one speaker and are not affected at all. Honestly, if
    ingestion really does produce an unlabelled transcript, moderated-session reports will be misleading, so the PM
    should confirm in one sentence with the ingestion owner what is produced today. That is a question to ask, not a
    spec section to write before build.
- id: participant-37
  case: >-
    Not this feature's job. Vendor data retention and no-training terms are set once, company-wide, in the data
    processing agreement and the model-API account settings (for example, zero-retention options). They are owned by
    legal, security and procurement, not by the PM and designer finalising an agent page. Nothing in the page, form,
    redirect or History tab changes based on the answer, so it does not block build. The leaf is graded speculative
    with "evidence: none", and the Videos page already ingests (and likely transcribes) participant video, so the same
    vendor question exists upstream regardless of this feature. Fixing it costs a contract or account setting rather
    than code, and that can happen at any time before or after launch. Route it to the DPA owner as a launch-checklist
    item, not a spec gap for this page.
