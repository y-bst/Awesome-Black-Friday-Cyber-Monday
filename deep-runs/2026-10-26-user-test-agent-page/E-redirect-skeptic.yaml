- id: redirect-1
  title: "First 2s after Submit: no acknowledgement that the submission was accepted before the History list renders"
  level: L3
  cell: {surface: redirect-transition, run-status: submitted-not-yet-visible-in-history, time-and-connection: steady-state, action: submit}
  object: "'There is no loading page' + 'redirected to the History tab'"
  situation: "User clicks Submit on the report-form; the Agent page is replaced by the History tab within the first 2 seconds, with no toast, banner or button state change specified."
  consequence: "User sees a different page and cannot tell whether the click registered or whether they are looking at someone else's list; the saved-time goal ('to save the user's time') is paid for with doubt."
  p_typical: 0.25
  grounded: quote
  evidence: "There is no loading page, to save the user's time. On submit the user is redirected to the History tab, where a new entry appears with whatever was submitted."
  proposed: "Specify a confirmation (toast 'Submitted' for 3s or a first-row state label) shown on arrival at History."
  shallow: false
- id: redirect-2
