  object: "History tab, 'a new entry appears'"
  situation: "Slow network: the History list request returns after the redirect but before the server has written the entry (write and read race); entry appears only on a later refresh."
  consequence: "User sees the old list, concludes the submit was lost, goes back and submits again, creating a duplicate run."
  p_typical: 0.18
  grounded: inferred
  evidence: "a new entry appears with whatever was submitted (no timing given)"
  proposed: "Acceptance criterion: the new entry is rendered in the first paint of History (client-side placeholder) or the redirect waits for the create call to return."
  shallow: false
