- id: power-creator-1
  title: Runs table with exactly 25 rows - PRD does not say whether a page-2 control appears
  level: L4
  cell: {surface: pagination-control, batch-size: exactly-25-rows, action: paginate}
  object: "Runs table, 'Page size is 25' and the pagination control"
  situation: A creator has exactly 25 runs in total, so page 1 is full and page 2 would hold 0 rows
  consequence: The control may show an enabled 'Next' or a '2' button that opens an empty page with no empty state, or may be hidden, and the creator cannot tell whether the list is complete
  p_typical: 0.10
  grounded: quote
  evidence: "Page size is 25."
  proposed: "Show the page control only when total rows > 25; at exactly 25 rows show no 'Next' and no '2'; acceptance test asserts this for totals 24, 25, 26"
  shallow: false
- id: power-creator-2
  title: Submitting 5 files into an exactly-25-row table pushes the 5 oldest rows onto an unannounced page 2
  level: L4
  cell: {surface: runs-table, batch-size: exactly-25-rows, action: paginate}
  object: "Submit dialog sentence 'the new rows appear at the top of the table with status Queued'"
  situation: Table holds exactly 25 runs, creator submits 5 files, the dialog closes and page 1 still shows 25 rows (5 new Queued plus the 20 newest old ones)
  consequence: 5 previously visible runs vanish from page 1 and no page-2 control existed a moment ago; the creator thinks the 5 runs were deleted
  p_typical: 0.06
  grounded: inferred
  evidence: "The dialog closes and the new rows appear at the top of the table with status Queued."
  proposed: "After submit, the page control appears with '2' and the footer reads 'Showing 1-25 of 30'"
  shallow: false
- id: power-creator-3
  title: Deleting the only row on page 2 leaves the creator on an empty page 2 with no empty state
  level: L4
  cell: {surface: pagination-control, batch-size: 26-rows-then-delete-one-on-page-1, action: bulk-select-delete}
  object: "Runs table Delete action and pagination control"
  situation: Table has 26 runs; creator is on page 2 (1 row) and deletes it, or is on page 1 and deletes any row so that row 26 moves up and total becomes 25
  consequence: Page 2 now has 0 rows; the table body is blank (the empty state in the PRD is not defined for this case) and the control may still show '2' until refresh
  p_typical: 0.07
  grounded: inferred
  evidence: "Actions: Open, Delete."
  proposed: "When the current page index exceeds the last page after a delete, redirect to the last page and drop the '2' button"
  shallow: false
- id: power-creator-4
  title: Open a run from page 4 then browser Back returns to page 1 at scroll top
  level: L4
  cell: {surface: runs-table, batch-size: table-26-plus-rows-multiple-pages, action: refresh-or-back}
  object: "Runs table, 'Clicking the thumbnail opens the run'"
  situation: Creator is on page 4 (rows 76-100), scrolled to row 90, clicks the thumbnail of row 90, then presses Back
  consequence: Table returns to page 1 (or page 4 at top), so the creator loses their place among 40+ pages and must page forward 3 times to continue triage
  p_typical: 0.12
  grounded: quote
  evidence: "Clicking the thumbnail opens the run."
  proposed: "Page number lives in the URL (?page=4) and scroll position is restored on Back; acceptance test opens row 90 on page 4 and asserts return to page 4, row 90 in view"
  shallow: false
- id: power-creator-5
  title: Pagination control shape for 3,000 runs (120 pages) is unspecified
  level: L3
  cell: {surface: pagination-control, batch-size: table-1000-plus-rows, time-and-connection: after-a-year-thousands-of-runs, action: paginate}
  object: "Runs table, 'Page size is 25'"
  situation: After a year of daily use a creator has 3,000 runs, which at 25 per page is 120 pages
  consequence: Without a page-jump box or last-page button, reaching page 100 takes 99 clicks on 'Next'; if the control renders every page number, 120 buttons overflow the viewport at 375 px width
  p_typical: 0.07
  grounded: inferred
  evidence: "Page size is 25."
  proposed: "Specify a windowed control (first, prev, current +/-2, next, last) plus a go-to-page input"
  shallow: false
- id: power-creator-6
  title: Finding one run from last March among 3,000 has no title search, date filter or sort
  level: L4
  cell: {surface: runs-table, batch-size: table-1000-plus-rows, time-and-connection: after-a-year-thousands-of-runs, action: change-sort-or-filter}
  object: "Runs table sentence 'Rows are sorted by submitted-at descending'"
  situation: Creator needs the run submitted 2026-03-14 while today is 2026-10-26; about 220 days at roughly 8 runs per day is around 1,750 runs back, which is page 70 of 120
  consequence: The only route is repeated 'Next' clicks across about 70 pages with no way to jump by date or search by title; the PRD offers no search, filter or sort control
  p_typical: 0.14
  grounded: quote
  evidence: "Rows are sorted by submitted-at descending."
  proposed: "Add a title search box and a submitted-at date-range filter; sort toggle on 'submitted at' and 'duration' columns"
  shallow: false
- id: power-creator-7
  title: Five rows titled IMG_0001.MOV cannot be told apart and the PRD has no rename action
  level: L4
  cell: {surface: runs-table, batch-size: table-1000-plus-rows, action: rename-title}
  object: "Runs table 'title' column; Actions: Open, Delete"
  situation: Phone and camera exports repeat names, so 5 rows in the 3,000-row table all read 'IMG_0001.MOV'; thumbnails are all dark first frames
  consequence: Creator opens up to 5 runs to find the right one; they cannot rename because the actions are only Open and Delete, and the PRD does not say where title comes from (filename, or user text)
  p_typical: 0.05
  grounded: quote
  evidence: "Actions: Open, Delete."
  proposed: "State title defaults to filename, add Rename in the row actions, and show the submitted-at second in a tooltip to separate duplicates"
  shallow: false
- id: power-creator-8
  title: 25 thumbnails per page on a 3,000-run account have no load-time or placeholder spec
  level: L4
  cell: {surface: runs-table, batch-size: table-1000-plus-rows, time-and-connection: after-a-year-thousands-of-runs, action: open}
  object: "Runs table sentence 'The thumbnail shows the first frame of the uploaded video with a white play icon centred on it'"
  situation: Page 1 loads 25 first-frame thumbnails; the source uploads can be up to 2 GB each and a year of use means older thumbnails may come from cold storage
  consequence: Table paints with 25 empty boxes for several seconds on a slow link, and the PRD gives no target (for example 2 s to first row) and no placeholder or lazy-load rule
  p_typical: 0.05
  grounded: inferred
  evidence: "The thumbnail shows the first frame of the uploaded video with a white play icon centred on it."
  proposed: "Set a budget: table text visible in under 1 s, thumbnails lazy-loaded with a grey placeholder at fixed size"
  shallow: false
- id: power-creator-9
  title: "The 'submitted at' column shows no timezone, so after flying IST to PST the same run reads 12.5 hours different"
  level: L4
  cell: {surface: runs-table, time-and-connection: timezone-change-or-travel, action: refresh-or-back}
  object: "Runs table column 'submitted at'"
  situation: Creator submits a run at 21:00 IST on 3 Nov, flies to Los Angeles, and reloads the table on a laptop set to PST
  consequence: The same row now shows 08:30 on 3 Nov (or stays at 21:00 if the server formats it); the creator cannot tell which and cannot match the row to a note in their calendar
  p_typical: 0.06
  grounded: inferred
  evidence: "Columns: thumbnail, title, status, submitted at, duration, actions."
  proposed: "Render in the browser's timezone with a visible abbreviation (IST, PST) and the full ISO time with offset on hover"
  shallow: false
- id: power-creator-10
  title: Daylight-saving fall-back makes descending 'submitted at' look out of order
  level: L4
  cell: {surface: runs-table, time-and-connection: timezone-change-or-travel, batch-size: table-26-plus-rows-multiple-pages}
  object: "Runs table sentence 'Rows are sorted by submitted-at descending'"
  situation: On 1 Nov (US fall-back) three runs are submitted at 01:50 PDT, 01:10 PST and 01:40 PST, local clock repeats 01:00-01:59
  consequence: Sorted by true time the column reads 01:40, 01:10, 01:50 from top to bottom, which looks unsorted to the creator
  p_typical: 0.02
  grounded: inferred
  evidence: "Rows are sorted by submitted-at descending."
  proposed: "Show the UTC offset on any local time in the repeated hour, or show the timezone abbreviation on every row"
  shallow: false
- id: power-creator-11
  title: Stale page-3 tab shows a duplicated row after 'Next' when new runs arrived from another device
  level: L4
  cell: {surface: pagination-control, time-and-connection: page-open-for-hours-stale, action: paginate}
  object: "Runs table 'Page size is 25' and the sort 'submitted-at descending'"
  situation: Tab sits on page 3 (rows 51-75) for 6 hours; the creator submits 5 runs from a phone; then clicks 'Next' on the laptop
  consequence: With offset paging, page 4 is computed on the new list, so rows 71-75 of the old view appear again as rows 76-80 (5 duplicates) and nothing says the table changed
  p_typical: 0.04
  grounded: inferred
  evidence: "Rows are sorted by submitted-at descending. Page size is 25."
  proposed: "Cursor-based paging on (submitted-at, id), or a 'New runs available' banner on page 3+ that prompts a refresh"
  shallow: false
- id: power-creator-12
  title: Browser tab title for Runs table and run detail is unspecified, so 8 open tabs read the same
  level: L4
  cell: {surface: browser-tab-title, time-and-connection: page-open-for-hours-stale, action: open}
  object: "Runs table and Run detail page (no tab-title text in the PRD)"
  situation: Creator keeps the Runs page, plus 7 run detail tabs, open for hours while processing
  consequence: Every tab shows the same generic app name, so the Done notification cannot be matched to a tab, and a Queued to Done change is not visible without switching
  p_typical: 0.06
  grounded: speculative
  evidence: none
  proposed: "Runs table tab: 'Runs (2 processing) - page 3'; detail tab: '<run title> - Done'"
  shallow: false
- id: power-creator-13
  title: Five detail tabs titled 'IMG_0001.MOV' make browser history search and tab switching ambiguous
  level: L3
  cell: {surface: browser-tab-title, time-and-connection: after-a-year-thousands-of-runs, action: rename-title}
  object: "Run detail page header and the 'title' column"
  situation: 5 runs share the title 'IMG_0001.MOV'; the creator searches browser history for it a year later
  consequence: 5 identical history entries with no date or id; if the tab title is the run title the creator cannot identify the right one, and without a rename action they cannot fix it
  p_typical: 0.03
  grounded: speculative
  evidence: none
  proposed: "Tab title format '<title> - <submitted date> - Runs'"
  shallow: false
- id: power-creator-14
  title: Cleaning up a year of up-to-2 GB uploads needs 3,000 single deletes and no select-all
  level: L4
  cell: {surface: runs-table, batch-size: table-1000-plus-rows, time-and-connection: after-a-year-thousands-of-runs, action: bulk-select-delete}
  object: "Runs table Actions: Open, Delete"
  situation: Creator wants to free storage from 3,000 runs (up to 3,000 x 2 GB = 6 TB of source files) and the only action is a per-row Delete
  consequence: At 25 rows per page that is 120 pages x 25 Delete clicks plus a confirm each, about 3,000 confirmations; the PRD has no checkbox column, no select-all and no storage-used figure
  p_typical: 0.06
  grounded: quote
  evidence: "Actions: Open, Delete."
  proposed: "Add a checkbox column, 'Select all 25 on this page', and 'Delete selected (N)' with one confirm showing total size freed"
  shallow: false
- id: power-creator-15
  title: Select-all and delete of 25 rows on page 1 of a 26-row table shifts row 26 into view with the selection state undefined
  level: L4
  cell: {surface: runs-table, batch-size: 26-rows-then-delete-one-on-page-1, action: bulk-select-delete}
  object: "Runs table page 1 and page 2"
  situation: Creator selects all 25 rows on page 1 and deletes them; the table had 26 rows
  consequence: Row 26 moves to page 1 and page 2 vanishes; if 'select all' meant all pages, 26 are deleted, if page only, 25; the PRD gives neither the count in the confirm nor the post-delete page
  p_typical: 0.04
  grounded: inferred
  evidence: "Page size is 25."
  proposed: "Confirm text states 'Delete 25 runs on this page' and offers 'Select all 26' as a separate link"
  shallow: false
- id: power-creator-16
  title: Deep link to ?page=70 breaks after the creator deletes enough runs to leave only 60 pages
  level: L4
  cell: {surface: pagination-control, batch-size: table-1000-plus-rows, time-and-connection: after-a-year-thousands-of-runs, action: refresh-or-back}
  object: "Runs table pagination control and page URL (the PRD does not define a page URL)"
  situation: Creator bookmarks page 70 of 120, later deletes 1,000 runs (40 pages), and opens the bookmark
  consequence: Page 70 no longer exists; the table may be blank, return a 404, or silently show page 1, and the PRD does not say which
  p_typical: 0.03
  grounded: speculative
  evidence: none
  proposed: "Clamp to the last page and show a banner 'Page 70 no longer exists, showing page 60'"
  shallow: false
- id: power-creator-17
  title: Five runs with the same submitted-at second straddling rows 25 and 26 may appear on both pages or neither
  level: L4
  cell: {surface: pagination-control, batch-size: table-26-plus-rows-multiple-pages, action: paginate}
  object: "Runs table sentence 'Rows are sorted by submitted-at descending'"
  situation: A 5-file submit creates 5 runs with an identical submitted-at to the second; rows 23-27 are these 5, so the page boundary falls inside the tie
  consequence: With no tie-breaker, the database order between ties can differ per query; one run shows on both page 1 and 2 and another on neither
  p_typical: 0.03
  grounded: inferred
  evidence: "The user picks 1 to 5 video files (mp4, mov; max 2 GB each) and clicks Submit. One run is created per file."
  proposed: "Sort by submitted-at descending, then by run id descending; acceptance test with 5 equal timestamps across the page boundary"
  shallow: false
