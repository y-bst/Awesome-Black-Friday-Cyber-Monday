# primary
- slug: support-agent
  who: Support agent who reads every "my run is stuck / my video is gone" ticket
  notices: the states users describe that the PRD has no word for (stuck in Processing for an hour, Failed with an unreadable error, deleted by a teammate)
  p_typical: 0.70
- slug: qa-lead
  who: QA lead writing the test plan for the Runs table
  notices: every combination of batch size x per-row status x action, and that the table has no state for "some of my 5 failed"
  p_typical: 0.80
- slug: oncall-sre
  who: On-call engineer for the processing service
  notices: what happens to Queued/Processing rows when the service restarts, when the error message is 4 KB of stack trace, when a webhook arrives twice
  p_typical: 0.55
- slug: power-creator
  who: Creator with 3,000 runs after a year of use
  notices: 25-row paging with no filter or search, scroll position after Open then Back, "submitted at" without timezone
  p_typical: 0.50
- slug: brand-new-creator
  who: Creator opening the Runs page for the first time with zero runs
  notices: empty table, no guidance, Submit dialog is the only path, no sample
  p_typical: 0.60
- slug: team-admin
  who: Team admin who sees everyone's runs
  notices: whose run is whose (no owner column), can an admin delete a creator's run, notification goes to whom
  p_typical: 0.45
- slug: low-contrast-viewer
  who: Colour-blind / low-vision user, also anyone on a bright phone screen outdoors
  notices: white play icon over whatever the first frame happens to be; status conveyed by colour only
  p_typical: 0.12
- slug: mobile-2g-user
  who: User on a 360px phone on a slow mobile connection uploading a 1.8 GB file
  notices: upload progress, dialog closing before upload finished, retry after connection drop, 2 GB over cellular
  p_typical: 0.20
- slug: finance-analyst
  who: Finance person modelling processing cost per run
  notices: 5 x 2 GB per submit with no rate limit, Delete during Processing still bills, Failed runs still cost
  p_typical: 0.15
- slug: accessibility-reviewer
  who: Screen-reader user and keyboard-only reviewer
  notices: thumbnail is the click target with no accessible name, status badge not announced on change, dialog focus trap
  p_typical: 0.30
- slug: data-migration-engineer
  who: Engineer who will add a status or rename Failed in v0.5
  notices: statuses are strings in a PRD with no "unknown" fallback; notification only on Done, never on Failed
  p_typical: 0.10
- slug: incident-3am
  who: The creator whose run failed at 3am during a service incident
  notices: no Failed notification, error text is the service's internal message, no retry, run sits Failed forever
  p_typical: 0.25
# tail
- slug: flat-frame-uploader
  who: Creator whose videos always start on a title card (solid white, solid black, or a logo on white)
  notices: the thumbnail is a flat colour and the white play icon vanishes or the row looks broken
  p_typical: 0.05
- slug: audio-only-uploader
  who: User who uploads an mp4 with no video track, or a 0-second file, or a corrupt file that passes the extension check
  notices: there is no first frame to show; what is the thumbnail, does the run Fail or Process
  p_typical: 0.06
- slug: two-tab-user
  who: User with the Runs table open in two tabs, or two teammates on the same workspace at once
  notices: Delete in one tab while Open in the other; status changes without refresh; duplicate submits of the same file
  p_typical: 0.08
- slug: legal-privacy
  who: Privacy counsel
  notices: Delete semantics (soft/hard, output video retained?), suggestions derived from video content, retention of Failed inputs
  p_typical: 0.07
- slug: localisation-vendor
  who: Translator shipping this in German and Japanese
  notices: status strings in a 90px column, error messages from the service are English-only, "submitted at" date format
  p_typical: 0.05
- slug: deprecator
  who: Engineer who has to turn the Runs page off in two years
  notices: no export, no archive, Delete is the only lifecycle end, 1,000s of Done runs with videos
  p_typical: 0.04
- slug: suggestion-skeptic
  who: Creator who gets 0 suggestions, or 400, or a suggestion that is wrong
  notices: empty suggestions list, unbounded list, Accept with no visible effect, Dismiss with no undo
  p_typical: 0.09
- slug: demo-sales-engineer
  who: Sales engineer demoing to a prospect on a projector
  notices: Processing takes an unknown time, nothing to show while waiting, Failed in front of a customer with a raw error
  p_typical: 0.06
# added by Stage D critique
- slug: security-reviewer
  who: Pentester / appsec engineer reviewing the Runs page before launch
  notices: guessable run IDs across workspaces, filename-derived title rendered unescaped, polyglot files passing the extension check, long-lived unsigned output URLs, container metadata (GPS, device) in the metadata block
  p_typical: 0.20
- slug: accept-implementer
  who: Engineer who has to build what Accept / Dismiss actually does
  notices: Accept cannot modify output (non-goal), so what does it produce; reversibility; per-user or per-run; Accept on a Failed run
  p_typical: 0.15
- slug: upload-stage-frontend-dev
  who: Front-end engineer building the Submit dialog
  notices: no Uploading status before Queued, no progress, no cancel, when the row is created, dialog closed mid-upload, 1 of 5 files invalid
  p_typical: 0.25
- slug: output-downloader
  who: Creator whose job is to get the finished video into an editor or scheduler
  notices: no Download action, output format/codec unspecified, retention after Delete
  p_typical: 0.20
- slug: departing-user-admin
  who: Team admin offboarding a creator who left
  notices: runs of a removed user: visible, deletable, orphaned, quota, ownership transfer, no owner column
  p_typical: 0.08
- slug: duplicate-and-tiebreak-tester
  who: QA engineer testing idempotency and ordering
  notices: same file twice, five rows sharing a submitted-at second with no tie-break, five rows titled IMG_0001.MOV, double-click Submit / Delete
  p_typical: 0.10
- slug: partial-run-failure-engineer
  who: Backend engineer owning a pipeline where encoding and suggestion generation are separate steps
  notices: output succeeded but suggestions failed is indistinguishable from "Done, nothing to suggest"; error message has no contract (length, language, PII, code)
  p_typical: 0.07
- slug: notification-consumer
  who: Creator receiving 5 Done notifications in 30 seconds, or clicking one three days later
  notices: no read/unread, no coalescing, click target when run deleted, arrives while on that run's page, app closed
  p_typical: 0.12
