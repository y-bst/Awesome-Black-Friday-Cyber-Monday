- id: support-agent-32
  title: "Runs table with 0 rows on first use has no empty-state copy or Submit prompt"
  level: L3
  cell: {surface: empty-state, time-and-connection: first-ever-use, batch-size: 0-files}
  object: "Runs table (no empty state listed) and Submit dialog entry point"
  situation: "A new user opens the Runs page with 0 runs, and later deletes their last run."
  consequence: "A header row over nothing, with no guidance on how to submit. The same blank table shows during a load failure, so users cannot tell no runs from a failed load."
  p_typical: 0.15
  grounded: inferred
  evidence: "Columns: thumbnail, title, status, submitted at, duration, actions."
  proposed: "Specify empty-state copy with a Submit call to action, distinct from the load error banner."
  shallow: false

- id: support-agent-33
  title: "Delete has no stated confirmation, undo or retention, so 'deleted by mistake' tickets have no recovery path"
  level: L3
  cell: {surface: delete-confirm-dialog, action: undo-delete, status-mix: all-done}
