# Stage H audit 1: runs-page-prd (quick mode; 4 of 28 perspectives ran; 84 surviving leaves)
# Counts for actor and time-and-connection were not in G-counts.md; computed from G-merged.yaml:
#   actor: read-only-or-viewer-role 0, other-creator-same-workspace 1, owner-removed-from-workspace 1, api-or-automation-caller 1
#   time-and-connection: after-a-year-thousands-of-runs 0, first-ever-use 1, offline-mid-upload 1, timezone-change-or-travel 1
empty_cells:
  - cell: {surface: run-detail, suggestion-state: [none-acted-on, all-accepted, all-dismissed, acted-on-by-teammate, "1", "50"], action: [accept-suggestion, dismiss-suggestion]}
    brief: >
      Suggestion-state has 6 of 10 values at 0 and dismiss-suggestion has 0 leaves. Run accept-implementer: walk what Accept produces
      given the non-goal 'Editing the output video', Dismiss with no undo, per-user vs per-run decisions, a teammate acting first,
      Accept on a Failed or deleted run, and the list at 1 vs 50 items (order, paging, bulk Accept all). Target 10+ leaves.
  - cell: {surface: run-detail, action: download-output, status-mix: [all-done, done-but-output-missing, deleted-while-processing]}
    brief: >
      download-output has 0 leaves and the PRD lists no Download action anywhere. Run output-downloader: output container/codec/resolution,
      download of a 3-hour or 4K output, link expiry, filename of the downloaded file, Download after Delete or by a removed owner,
      and how 'Sharing runs outside the workspace' (non-goal) constrains a copied download URL. Target 10+ leaves.
  - cell: {surface: [runs-table, pagination-control], batch-size: [exactly-25-rows, table-1000-plus-rows], time-and-connection: after-a-year-thousands-of-runs, action: [change-sort-or-filter, paginate, open, refresh-or-back]}
    brief: >
      table-1000-plus-rows, exactly-25-rows and after-a-year-thousands-of-runs all have 0 leaves. Run power-creator: 40+ pages with
      'Page size is 25' and no search/filter/sort control, scroll and page position after Open then Back, deep page URLs, exactly 25
      rows (is a page 2 control shown), load time of 25 thumbnails, finding one run from last March. Target 10+ leaves.
  - cell: {actor: [read-only-or-viewer-role, team-admin, other-creator-same-workspace], surface: [runs-table, run-detail, in-app-notification], action: [delete, accept-suggestion, dismiss-suggestion, open]}
    brief: >
      read-only-or-viewer-role has 0 leaves, team-admin 2, other-creator-same-workspace 1. Run team-admin: build the role x action matrix
      (Open, Delete, Accept, Dismiss, Submit) the PRD never states, the missing owner column, who receives the Done notification for
      another creator's run, whether a creator sees teammates' runs at all, and admin filters by creator. Target 10+ leaves.
  - cell: {owner-lifecycle: [owner-account-deleted, workspace-deleted, workspace-plan-downgraded-or-over-quota, owner-removed-from-workspace], surface: [runs-table, in-app-notification]}
    brief: >
      owner-account-deleted and workspace-deleted have 0 leaves; removed-owner and over-quota have 1 each. Run departing-user-admin:
      runs and pending notifications of a deleted account, Queued/Processing runs when the workspace is deleted, ownership transfer,
      downgrade that caps runs (what happens to the 26th+ run), and whether a removed owner's Done runs still count. Target 10+ leaves.
  - cell: {surface: submit-dialog, status-mix: [upload-cancelled, uploading-pre-queued], action: cancel-upload, time-and-connection: [offline-mid-upload, session-expired-mid-upload]}
    brief: >
      cancel-upload and upload-cancelled have 0 leaves. Run upload-stage-frontend-dev: when the row is created relative to 'The dialog
      closes', cancel of 1 file of 5, closing the tab or navigating away mid-upload, resumable vs restart for a 1.9 GB file, per-file
      progress, Submit dialog reopened while an upload runs, and what row (if any) a cancelled file leaves. Target 10+ leaves.
  - cell: {batch-size: [1-file, 2-5-files-one-submit], media-content: [ordinary-footage-first-frame, 3-second-clip], surface: [empty-state, runs-table, run-detail], time-and-connection: first-ever-use}
    brief: >
      The baseline path has 0 leaves: 1-file, 2-5-files-one-submit (named in past miss-002), ordinary-footage-first-frame and 3-second-clip
      are all empty; empty-state has 1. Run brand-new-creator: first Submit, what the new user sees while Queued, the first Done, a
      3-second clip (thumbnail, duration '0:03', suggestions), and a 3-file submit where 1 fails. Target 10+ leaves.
  - cell: {surface: in-app-notification, notification-state: [single, unread-for-days, app-closed-when-fired], action: [notification-click, mark-notification-read]}
    brief: >
      notification-state single and unread-for-days have 0 surviving leaves; app-closed-when-fired has 1. Run notification-consumer:
      notification content (title, thumbnail, link target), read/unread model, where the list lives, retention of old notifications,
      no email/push when the app is closed, a click from another workspace, and a click while the run is now Failed. Target 10+ leaves.
under_used_perspectives:
  - slug: flat-frame-uploader
    brief: >
      14 of 21 leaves sit on runs-table x media-content (thumbnail rendering). It never walked the same flat frame on the delete-confirm-dialog,
      the empty-state, dark theme, a 360px phone row, a projector, or a screen reader (status and play icon conveyed visually only); nor
      a flat-frame Failed row, where 'blank tile' and 'failed' collide. Also unwalked: thumbnail regeneration or a user-picked poster frame.
  - slug: qa-lead
    brief: >
      11 of 23 leaves use batch-size exactly-5-files and 9 use status-mix some-done-some-failed. It should walk 1-file and 2-5-files-one-submit
      (miss-002 cell), exactly-25-rows, the suggestion-state matrix (0, 1, 50, 400-plus x Accept/Dismiss), notification-state x status,
      owner-lifecycle, and a test-data plan for media-content values (corrupt-but-valid-extension, 3-second-clip) that have 0 leaves.
  - slug: partial-run-failure-engineer
    brief: >
      Leaves cluster on run-detail x failure-point (processing-crash, output-encoding, suggestion-generation-only). Unwalked: upload-transfer
      and client-validation failures as seen on the Runs table, delete-failed for a Queued run still in the queue, notification on a
      partial result, owner removed or workspace over quota mid-run, and the error-message contract across localisation and support tooling.
unrun_perspectives_ranked:
  - slug: accept-implementer
    why: Suggestion-state is the emptiest axis (6 of 10 values at 0, dismiss-suggestion 0) and Accept's meaning under the 'Editing the output video' non-goal has no leaf at all.
  - slug: security-reviewer
    why: No leaf touches run-ID guessing across workspaces, filename-derived title escaping, polyglot files, unsigned output URLs or GPS/device fields in 'the run's metadata'; an entirely new gap class with no overlap.
  - slug: power-creator
    why: Scale cells are all 0 (table-1000-plus-rows, exactly-25-rows, after-a-year-thousands-of-runs); search, filter, sort and scroll restoration are unaddressed beyond one filter leaf.
  - slug: output-downloader
    why: download-output has 0 leaves and the PRD has no Download action; output format, retention and link-expiry gaps are untouched.
  - slug: accessibility-reviewer
    why: Only 1 of 84 leaves (flat-frame-27) covers accessibility; status-badge announcements, colour-only status, dialog focus trap and player controls are all open.
  - slug: team-admin
    why: read-only-or-viewer-role has 0 leaves and team-admin 2; the role x action permission matrix, owner column and notification recipient rules would yield many leaves not yet covered.
uncategorised_suggest_axis:
  - name: notification-state (add values)
    values: [read, unread, dismissed-from-list, expired-from-list]
  - name: presentation-context
    values: [light-theme, dark-theme, 360px-phone, projector, screen-reader, keyboard-only, forced-colors-high-contrast, 200pct-zoom]
  - name: trust-and-data-sensitivity
    values: [cross-workspace-id-access, filename-with-html-or-script, container-metadata-gps-or-device, signed-vs-unsigned-output-url, content-violating-policy, gdpr-erasure-request]
  - name: locale
    values: [en, de-long-strings, ja, rtl, 12h-vs-24h-clock, non-latin-filename]
expert_missing:
  - "L3: Run detail page has no Download action and no output spec (container, codec, resolution and bitrate of the 'output video' relative to the uploaded mp4/mov)."
  - "L3: Suggestions list items carry no timestamp or seek-to-moment link into the output video player, and Accept has no stated outcome given the non-goal 'Editing the output video'."
  - "L3: PRD Summary has no success metrics or instrumentation events (submits per user, time-to-Done, Failed rate, Accept rate), so v0.4 cannot be evaluated after launch."
  - "L3: Submit dialog has no content-policy or moderation scan on uploaded video, and no status or user-facing message for a run rejected by policy."
  - "L3: Submit dialog limits '1 to 5 video files (mp4, mov; max 2 GB each)' omit maximum duration, resolution and frame rate, and show no estimated processing time before Submit."
  - "L3: Runs page shows no workspace usage or quota meter (processing minutes, storage of 2 GB uploads) and no warning before a Submit that would exceed it."
  - "L3: Runs table 'title' column has no Rename action and no search by title, so five IMG_0001.MOV rows are the only identifiers a creator has."
  - "L3: Runs table columns 'thumbnail, title, status, submitted at, duration, actions' have no layout or column-priority rule at 360px phone width."
yield_estimate: 0.80  # about 67 new leaves on top of 84: ~170 raw (6 x 15 + 8 x 10), minus ~35% duplicate rate seen in G and overlap between empty-cell briefs and the ranked perspectives that run them
