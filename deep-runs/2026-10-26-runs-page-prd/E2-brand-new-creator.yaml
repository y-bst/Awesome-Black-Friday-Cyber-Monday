- id: new-creator-1
  title: "Runs table with 0 rows: PRD gives no empty-state copy and no Submit entry point on the page"
  level: L3
  cell: {surface: empty-state, time-and-connection: first-ever-use, action: submit}
  object: "Runs table (Columns: thumbnail, title, status, submitted at, duration, actions) and Submit dialog"
  situation: "A creator opens the Runs page for the first time with 0 runs; the table has a header row of 6 columns and no body rows"
  consequence: "The creator sees six column headings over blank space, with no sentence saying what a run is and no stated place to open the Submit dialog; the PRD describes the dialog but never says which control opens it"
  p_typical: 0.30
  grounded: quote
  evidence: "The Runs page lets a user submit one or more video processing runs"
  proposed: "Add an empty-state line ('No runs yet') plus a Submit button that opens the Submit dialog, shown only when the row count is 0"
  shallow: false

- id: new-creator-2
  title: "First submit of 1 file from an empty table: the moment the first row appears versus the moment the dialog closes is unspecified"
  level: L3
  cell: {surface: runs-table, batch-size: 1-file, time-and-connection: first-ever-use, action: submit}
  object: "Submit dialog sentence 'The dialog closes and the new rows appear at the top of the table with status Queued'"
  situation: "Creator picks 1 mp4 (for example 800 MB), clicks Submit; upload of 800 MB takes a visible amount of time on a home connection"
  consequence: "Either the dialog stays open for the whole upload with no progress copy, or it closes at once and the table still shows its empty state while the file uploads; the creator cannot tell whether the click worked and may click Submit again"
  p_typical: 0.08
  grounded: quote
  evidence: "The dialog closes and the new rows appear at the top of the table with status Queued."
  proposed: "State that the row is created at click time with status Queued, before upload finishes, and that the empty state is replaced at that moment"
  shallow: false

- id: new-creator-3
  title: "Thumbnail of a Queued row: PRD says first frame of the uploaded video, but no frame has been extracted yet"
  level: L3
  cell: {surface: runs-table, batch-size: 2-5-files-one-submit, media-content: ordinary-footage-first-frame, status-mix: all-queued}
  object: "Runs table thumbnail column: 'The thumbnail shows the first frame of the uploaded video with a white play icon centred on it'"
  situation: "3 ordinary mp4 files submitted at once; all 3 rows are Queued; the processing service has not started"
  consequence: "The 3 rows show either 3 grey placeholders, 3 broken-image icons or 3 first frames with a play icon, and the PRD does not say which; the creator cannot tell which row is which file if the placeholders look identical"
  p_typical: 0.07
  grounded: inferred
  evidence: "The thumbnail shows the first frame of the uploaded video with a white play icon centred on it."
  proposed: "Specify a neutral placeholder thumbnail until the first frame exists, and say who extracts the frame (browser at upload or backend)"
  shallow: false

- id: new-creator-4
  title: "Duration cell of a Queued or Processing row has no stated value, and no stated meaning (input length or output length)"
  level: L3
  cell: {surface: runs-table, batch-size: 2-5-files-one-submit, media-content: ordinary-footage-first-frame, status-mix: all-processing}
  object: "Runs table column 'duration'"
  situation: "3 files, all with status Processing; duration for each is not yet measured by the output pipeline"
  consequence: "The 3 duration cells show blank, '0:00' or the input length; a creator reading '0:00' on a 4-minute video thinks the file is empty; the PRD never says whether duration is the uploaded video's length or the output video's length"
  p_typical: 0.09
  grounded: speculative
  evidence: "Columns: thumbnail, title, status, submitted at, duration, actions."
  proposed: "Define duration as the input file length read at upload, shown from the Queued state; or show a dash until Done"
  shallow: false

- id: new-creator-5
  title: "'Submitted at' format and time zone are unspecified for a first-ever row"
  level: L3
  cell: {surface: runs-table, batch-size: 1-file, time-and-connection: first-ever-use, action: submit}
  object: "Runs table column 'submitted at'"
  situation: "Creator submits 1 file at 23:58 local time; the server stores UTC and the workspace may be set to another zone"
  consequence: "The cell may read '2026-10-27 04:58' (UTC), '11:58 PM', or 'just now'; a creator who sees tomorrow's date for a run just submitted decides the app is broken; the PRD gives no format, no zone and no rule for relative versus absolute"
  p_typical: 0.06
  grounded: speculative
  evidence: "Rows are sorted by submitted-at descending."
  proposed: "Specify absolute local-time format 'MMM D, h:mm a' with the browser zone, tooltip with full ISO timestamp"
  shallow: false

- id: new-creator-6
  title: "3 files in one submit: row order inside the batch is undefined when submitted-at values tie"
  level: L3
  cell: {surface: runs-table, batch-size: 2-5-files-one-submit, action: submit}
  object: "Runs table sort rule 'Rows are sorted by submitted-at descending' and Submit dialog 'One run is created per file'"
  situation: "Creator picks a.mp4, b.mp4, c.mp4 in that order and clicks Submit; the 3 runs get the same submitted-at to the second"
  consequence: "The 3 new rows appear in an order the creator did not choose (for example c, a, b) and may swap order on reload; the creator cannot match row 2 to the second file they picked"
  p_typical: 0.07
  grounded: quote
  evidence: "One run is created per file. ... Rows are sorted by submitted-at descending."
  proposed: "Add a tiebreak: file picker order, with the first picked file at the top of the 3 new rows"
  shallow: false

- id: new-creator-7
  title: "Failed row in a 3-file batch shows only the word Failed; the reason is reachable only inside the detail page"
  level: L3
  cell: {surface: runs-table, batch-size: 2-5-files-one-submit, status-mix: some-done-some-failed}
  object: "Runs table status column and 'A Failed run shows an error message from the processing service in the detail page.'"
  situation: "3 files submitted; 2 reach Done and 1 reaches Failed; the creator is looking at the table"
  consequence: "The creator sees 2 Done badges and 1 Failed badge with no reason text, tooltip or icon; to learn why, they must open the run, and a creator who sees 'Failed' on 1 of 3 ordinary files does not know whether the file or the service is at fault"
  p_typical: 0.15
  grounded: quote
  evidence: "A Failed run shows an error message from the processing service in the detail page."
  proposed: "Show the first 80 characters of the error message as a tooltip on the Failed badge"
  shallow: false

- id: new-creator-8
  title: "Retry: the Failed row offers only Open and Delete, so the creator's only way to retry is delete then re-pick the same file"
  level: L3
  cell: {surface: runs-table, status-mix: some-done-some-failed, action: retry-not-in-prd}
  object: "Runs table 'Actions: Open, Delete.' on the Failed row"
  situation: "1 of 3 submitted files is Failed; the creator wants to process that one file again and does not want to touch the 2 Done rows"
  consequence: "There is no Retry button, so the creator must find the original file on disk, open the Submit dialog, pick it again and submit; the old Failed row stays unless they also click Delete; if they forget the file's location the work is lost"
  p_typical: 0.25
  grounded: quote
  evidence: "Actions: Open, Delete."
  proposed: "Either add a Retry action on Failed rows only (creates a new run from the stored upload) or state in the PRD that retry is a non-goal and the empty copy says 'submit the file again'"
  shallow: false

- id: new-creator-9
  title: "Re-submitting the failed file gives two rows with identical titles; the PRD never says where title comes from"
  level: L3
  cell: {surface: runs-table, batch-size: 1-file, status-mix: some-done-some-failed, action: retry-not-in-prd}
  object: "Runs table column 'title'"
  situation: "Creator re-submits intro.mp4 after its first run Failed; the table now holds a Failed row and a Queued row, both titled 'intro.mp4' (if title is the filename)"
  consequence: "Two rows with the same title, thumbnail and size differ only by submitted-at and status; a creator scanning for 'the one I retried' may open or delete the wrong one, and title is never stated to be editable or taken from the filename"
  p_typical: 0.06
  grounded: speculative
  evidence: "Columns: thumbnail, title, status, submitted at, duration, actions."
  proposed: "State title defaults to the filename and that duplicates are allowed; optionally show a '(retry)' suffix"
  shallow: false

- id: new-creator-10
  title: "Table updates while the creator waits: the PRD says 'watch their progress' but states no live refresh or polling interval"
  level: L3
  cell: {surface: runs-table, batch-size: 2-5-files-one-submit, status-mix: all-queued, time-and-connection: first-ever-use}
  object: "Summary sentence 'watch their progress' and 'Status transitions: Queued -> Processing -> Done'"
  situation: "A first-time creator submits 3 files and stays on the page; the 3 rows say Queued"
  consequence: "If the table does not poll, the 3 rows say Queued until the creator presses reload; the creator waits 10 minutes, sees no change, and concludes the product is frozen; if it polls, the interval (5 s, 30 s) is unstated"
  p_typical: 0.12
  grounded: quote
  evidence: "The Runs page lets a user submit one or more video processing runs, watch their progress"
  proposed: "Specify that status badges refresh without reload at most every 10 seconds while any row is Queued or Processing"
  shallow: false

- id: new-creator-11
  title: "Processing rows show a bare status word with no progress, no estimate and no stuck threshold for a first-time creator"
  level: L3
  cell: {surface: runs-table, batch-size: 2-5-files-one-submit, status-mix: all-processing, time-and-connection: first-ever-use}
  object: "Runs table status column value 'Processing'"
  situation: "3 files are Processing for 6 minutes; the creator has never seen how long a run takes"
  consequence: "The word Processing looks the same at minute 1 and minute 60; the creator has no way to tell normal from stuck and no instruction on what to do after a given wait; no copy such as 'usually takes about N minutes' is specified"
  p_typical: 0.08
  grounded: inferred
  evidence: "Queued -> Processing -> Done"
  proposed: "Add a spinner and the line 'Most runs finish in under N minutes' on the status badge tooltip, with N set by the PM"
  shallow: false

- id: new-creator-12
  title: "Opening a Queued or Processing run: the detail page has no output video to show, but the PRD describes only the finished layout"
  level: L3
  cell: {surface: run-detail, status-mix: all-queued, action: open}
  object: "Run detail page: 'Shows the output video player, a list of suggestions (text, each with Accept / Dismiss), and the run's metadata'"
  situation: "Creator clicks Open (or the thumbnail) on a Queued row 20 seconds after submitting"
  consequence: "The output video player has no source and the suggestions list has 0 items; the page may show a broken player, a black box or a blank area; the only thing the PRD guarantees is that 'Status badge in the header mirrors the table', which reads Queued"
  p_typical: 0.09
  grounded: quote
  evidence: "Shows the output video player, a list of suggestions (text, each with Accept / Dismiss), and the run's metadata."
  proposed: "For Queued and Processing, replace the player and suggestions with the text 'Output not ready yet' and keep metadata visible"
  shallow: false

- id: new-creator-13
  title: "Failed run detail shows the service's raw error text with no next step for a creator who cannot retry"
  level: L3
  cell: {surface: run-detail, status-mix: some-done-some-failed, action: open}
  object: "Run detail page and 'A Failed run shows an error message from the processing service in the detail page.'"
  situation: "Creator opens the 1 Failed run among 3; the processing service returns a string such as 'ffmpeg exited with code 1' or an empty string"
  consequence: "The page shows an engineer-facing sentence (or nothing, if the service returns an empty message) and the player and suggestions areas have no content; with no Retry in Actions, the creator reads an error and has no stated next action"
  p_typical: 0.08
  grounded: quote
  evidence: "A Failed run shows an error message from the processing service in the detail page."
  proposed: "Show the service message under a fixed heading 'This run failed', a fallback line when the message is empty, and a line telling the creator to submit the file again"
  shallow: false

- id: new-creator-14
  title: "White play icon on thumbnails of rows that have nothing to play (Queued, Processing, Failed)"
  level: L3
  cell: {surface: runs-table, media-content: ordinary-footage-first-frame, status-mix: some-done-some-failed, action: open}
  object: "Runs table thumbnail: 'with a white play icon centred on it. Clicking the thumbnail opens the run.'"
  situation: "3 ordinary files: 2 Done, 1 Failed; all 3 thumbnails carry the play icon"
  consequence: "The Failed row's thumbnail promises playback, but clicking it lands on a detail page with no output video; the creator clicks the play icon on the Failed row, gets an error page instead of video, and concludes the whole batch is broken"
  p_typical: 0.09
  grounded: quote
  evidence: "The thumbnail shows the first frame of the uploaded video with a white play icon centred on it."
  proposed: "Show the play icon only on Done rows; show a warning icon on Failed rows"
  shallow: false

- id: new-creator-15
  title: "3-second clip can pass through Queued and Processing between two table refreshes, so the creator never sees either status"
  level: L3
  cell: {surface: runs-table, batch-size: 1-file, media-content: 3-second-clip, time-and-connection: first-ever-use, action: submit}
  object: "Status transitions 'Queued -> Processing -> Done' and Runs table status column"
  situation: "Creator submits a 3-second mp4 as a first test; processing completes in a few seconds, faster than the refresh interval"
  consequence: "The row goes from Queued straight to Done on the next refresh, or appears already Done on reload; the first-ever Done notification fires within seconds of the dialog closing, before the creator has looked at the table, so the 'in-app notification' arrives with no visible cause"
  p_typical: 0.05
  grounded: inferred
  evidence: "When a run reaches Done, the user receives an in-app notification."
  proposed: "Specify that skipped intermediate states are allowed and that the notification still fires once"
  shallow: false

- id: new-creator-16
  title: "Duration cell for a 3-second clip: display format below 1 minute is unspecified"
  level: L4
  cell: {surface: runs-table, media-content: 3-second-clip, batch-size: 1-file}
  object: "Runs table column 'duration'"
  situation: "A Done run whose output is 3.04 seconds long"
  consequence: "The cell reads '0:03', '3s', '00:00:03' or '0:00' (if rounded down to minutes); an assertion cannot be written because the PRD names no format; a creator reading '0:00' on a clip they know is 3 seconds suspects the output is empty"
  p_typical: 0.05
  grounded: speculative
  evidence: "Columns: thumbnail, title, status, submitted at, duration, actions."
  proposed: "Assert that a 3.04 s output shows '0:03' (round to nearest second, m:ss format)"
  shallow: false

- id: new-creator-17
  title: "Done run detail for a 3-second clip may have 0 suggestions, and the PRD gives no empty-list copy"
  level: L3
  cell: {surface: run-detail, media-content: 3-second-clip, batch-size: 1-file, action: open}
  object: "Run detail page 'a list of suggestions (text, each with Accept / Dismiss)'"
  situation: "A first Done run from a 3-second clip produces 0 suggestions; the creator opens it from the notification"
  consequence: "The suggestions area is blank under a working video player; a first-time creator cannot tell whether suggestions failed to load, are still coming, or do not apply to a clip this short"
  p_typical: 0.07
  grounded: inferred
  evidence: "a list of suggestions (text, each with Accept / Dismiss)"
  proposed: "Show 'No suggestions for this video' when a Done run has 0 suggestions"
  shallow: false

- id: new-creator-18
  title: "Failed row in the table: duration cell content is undefined when the run never produced output"
  level: L3
  cell: {surface: runs-table, status-mix: some-done-some-failed, batch-size: 2-5-files-one-submit}
  object: "Runs table column 'duration' on a Failed row"
  situation: "1 of 3 rows is Failed; the other 2 show '0:42' and '1:15'"
  consequence: "The Failed row shows blank, '0:00' or the input length; with '0:00' beside two real values the creator reads it as a zero-length result; no rule says if a Failed row keeps the input duration"
  p_typical: 0.06
  grounded: speculative
  evidence: "Columns: thumbnail, title, status, submitted at, duration, actions."
  proposed: "Show a dash in duration for Failed rows"
  shallow: false

- id: new-creator-19
  title: "3-file batch with 2 Done and 1 Failed: the only notification is for the 2 Done runs, so a creator who left the page is never told about the Failed one"
  level: L3
  cell: {surface: runs-table, batch-size: 2-5-files-one-submit, status-mix: some-done-some-failed, time-and-connection: first-ever-use}
  object: "Notifications section: 'When a run reaches Done, the user receives an in-app notification.'"
  situation: "Creator submits 3 files, switches to another tab, returns 10 minutes later to 2 notifications and a table with 1 Failed row"
  consequence: "2 notifications say Done and 0 say Failed; a first-time creator who only reads notifications assumes 3 of 3 succeeded and never discovers the Failed file"
  p_typical: 0.10
  grounded: quote
  evidence: "When a run reaches Done, the user receives an in-app notification."
  proposed: "Add one notification per Failed run, or one batch summary '2 of 3 runs finished, 1 failed'"
  shallow: false
