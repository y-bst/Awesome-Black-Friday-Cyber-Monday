- id: flat-frame-1
  title: White play icon is invisible on a solid-white first frame, so the thumbnail reads as a blank square
  level: L4
  cell: {surface: runs-table, media-content: first-frame-flat-white-or-near-white, action: open}
  object: "Runs table, thumbnail column: 'a white play icon centred on it'"
  situation: Creator uploads a video that opens on a solid white title card (#FFFFFF); the table renders white icon on white frame
  consequence: Row shows an empty white box with no visible play affordance; creator cannot tell the thumbnail is clickable or whether it failed to load
  p_typical: 0.22
  grounded: quote
  evidence: "The thumbnail shows the first frame of the uploaded video with a white play icon centred on it."
  proposed: "Acceptance criterion: play icon has a dark scrim or 1px outline so contrast against any frame is at least 3:1 (checked on #FFFFFF, #F5F5F5, #000000 frames)"
  shallow: false
