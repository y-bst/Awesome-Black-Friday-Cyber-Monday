  level: L3
  cell: {failure-point: queue-timeout-never-picked-up, status-mix: stuck-queued-over-1h, surface: run-detail}
  object: "PRD sentence: 'A Failed run shows an error message from the processing service'"
  situation: "A run never reaches a worker (queue backlog, upload never completed) and a timeout job flips it to Failed; the processing service never saw it."
  consequence: "Detail page shows 'Failed' with a blank error area, or 'null'; the user has nothing to act on."
  p_typical: 0.04
  grounded: quote
  evidence: "A Failed run shows an error message from the processing service in the detail page."
  proposed: "Every Failed transition must carry a failure_code from a single enum regardless of which component wrote it; blank message is a test failure."
  shallow: false
