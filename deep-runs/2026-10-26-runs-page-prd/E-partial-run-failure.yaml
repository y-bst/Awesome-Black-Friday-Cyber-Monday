  object: "Runs table 'Actions: Open, Delete.'"
  situation: "A run fails at encode due to a transient worker crash; the source file is already in storage."
  consequence: "User deletes and re-submits, paying a 2 GB upload again; a new row with a new submitted-at replaces the history of the failure."
  p_typical: 0.25
  grounded: quote
  evidence: "Actions: Open, Delete."
  proposed: "Add 'Retry' on Failed rows that re-enqueues from the stored source when failure_stage is retryable; hide it for failure_code=unsupported_codec."
