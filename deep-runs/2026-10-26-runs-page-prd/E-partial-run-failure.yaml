  cell: {action: retry-not-in-prd, status-mix: failed-after-retry, time-and-connection: page-open-for-hours-stale}
  object: "Submit dialog 'max 2 GB each' uploads; Failed status"
  situation: "Storage lifecycle deletes source uploads after N days to save cost; user clicks a Failed run 10 days later to retry."
  consequence: "Retry fails a second time with a missing-input error, or the team keeps 2 GB per failed run forever."
  p_typical: 0.04
  grounded: inferred
  evidence: "The user picks 1 to 5 video files (mp4, mov; max 2 GB each)"
