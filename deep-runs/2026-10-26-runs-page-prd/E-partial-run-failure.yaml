- id: partial-failure-1
  title: "Output video encoded but suggestion generation failed: none of Queued/Processing/Done/Failed describes the run"
  level: L3
  cell: {status-mix: some-done-some-failed, failure-point: suggestion-generation-only, surface: run-detail}
  object: "Statuses: Queued, Processing, Done, Failed. / Run detail page: output video player + list of suggestions"
  situation: "Encode step writes a playable output; the suggestion step then throws (model timeout, 5xx from the model service). The run has a usable output and 0 suggestions."
  consequence: "Marking it Failed hides a usable output video behind an error; marking it Done shows an empty suggestions list with no explanation. Either way the creator cannot tell what they got."
  p_typical: 0.15
  grounded: inferred
  evidence: "Queued -> Processing -> Done / Queued -> Processing -> Failed"
  proposed: "Add a per-step status (output_status, suggestions_status) and a table label 'Done - suggestions unavailable' with a 'Retry suggestions' action on the detail page."
  shallow: false
- id: partial-failure-2
  title: "Done with 0 suggestions is indistinguishable from a suggestion step that crashed and wrote an empty list"
  level: L4
  cell: {status-mix: done-with-zero-suggestions, suggestion-state: 0-suggestions, surface: run-detail}
  object: "Run detail page: 'a list of suggestions (text, each with Accept / Dismiss)'"
  situation: "Suggestion worker catches an exception, logs it, and persists suggestions=[]; run transitions to Done."
  consequence: "Detail page renders an empty list for a crash; support cannot tell a genuine 'nothing to suggest' video from a silent failure; the crash rate is invisible in metrics."
  p_typical: 0.06
  grounded: inferred
  evidence: "When a run reaches Done, the user receives an in-app notification."
  proposed: "Persist suggestions_status in {generated, generated_empty, failed}; detail page copy 'No suggestions for this video' only for generated_empty; alert when generated_empty share exceeds 5% of runs per hour."
  shallow: false
- id: partial-failure-3
  title: "Failed has one label for 6 failure stages that need 6 different user remedies"
  level: L3
  cell: {failure-point: processing-crash, status-mix: all-failed, surface: runs-table}
  object: "Status 'Failed' in the Runs table and 'A Failed run shows an error message from the processing service in the detail page.'"
  situation: "Runs fail at: upload transfer, queue timeout, probe/unsupported codec, encode crash, suggestion generation, output storage. Remedies differ: re-upload, wait and retry, re-export the file, retry, retry suggestions only, contact support."
  consequence: "Table shows the same red 'Failed' for all 6; the user must open each run to learn whether re-trying can help or the file itself is the problem."
  p_typical: 0.07
  grounded: quote
  evidence: "A Failed run shows an error message from the processing service in the detail page."
  proposed: "Define a failure_stage enum (6 values) and a failure_code; map each to user copy and a remedy action; show a short reason under 'Failed' in the status column."
  shallow: false
- id: partial-failure-4
  title: "'Error message from the processing service' may be raw ffmpeg stderr or a stack trace with internal hostnames and storage keys"
  level: L4
  cell: {failure-point: output-encoding, surface: run-detail, actor: creator-owner}
  object: "PRD sentence: 'A Failed run shows an error message from the processing service in the detail page.'"
  situation: "Encode worker fails; the service's error field holds e.g. 'Error while decoding stream #0:1 ... s3://prod-media-internal/ws_123/...' or a Python traceback."
  consequence: "Creators see unreadable text; internal bucket names, worker hostnames and other workspace ids leak to customers."
  p_typical: 0.05
  grounded: quote
  evidence: "A Failed run shows an error message from the processing service in the detail page."
  proposed: "Detail page shows mapped user copy keyed by failure_code; raw service error stored server-side only, viewable by support staff, plus a run id for tickets."
  shallow: false
- id: partial-failure-5
  title: "Raw service error text has no length cap; ffmpeg stderr for a 3-hour file can exceed 50 KB"
  level: L4
  cell: {media-content: 3-hour-video, failure-point: output-encoding, surface: run-detail}
  object: "Run detail page error message area (implied by 'shows an error message from the processing service')"
  situation: "A long or damaged input makes ffmpeg emit thousands of warning lines before failing; the whole buffer is passed through as the message."
  consequence: "Detail page renders a multi-screen wall of text above the (empty) player; DB row for the run grows by tens of KB."
  p_typical: 0.03
  grounded: inferred
  evidence: "A Failed run shows an error message from the processing service in the detail page."
  proposed: "Cap stored user-facing message at 500 characters; keep full log in object storage for 30 days referenced by run id."
  shallow: false
- id: partial-failure-6
