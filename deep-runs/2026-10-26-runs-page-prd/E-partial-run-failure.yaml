  level: L3
  cell: {status-mix: failed-after-retry, failure-point: processing-crash, surface: runs-table}
  object: "Status transitions: 'Queued -> Processing -> Done / Queued -> Processing -> Failed'"
  situation: "Worker is OOM-killed on a 4K HDR file; the queue redelivers the job and it goes back to waiting."
  consequence: "Either the table shows Processing during a 20-minute wait for a free worker (wrong) or flips back to Queued (a transition the PRD forbids); users see a run 'go backwards'."
  p_typical: 0.05
  grounded: quote
  evidence: "Queued -> Processing -> Done / Queued -> Processing -> Failed"
  proposed: "Specify max automatic attempts (e.g. 3), whether Processing -> Queued is allowed, and show 'Retrying (2/3)' in the status column."
  shallow: false
- id: partial-failure-10
