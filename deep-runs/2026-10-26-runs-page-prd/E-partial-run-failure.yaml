  level: L4
  cell: {status-mix: failed-after-retry, surface: run-detail, actor: support-staff-impersonating}
  object: "Run detail page error message; run's metadata"
  situation: "Attempt 1 fails on worker OOM, attempt 2 on storage timeout, attempt 3 on encode error; only the last is stored."
  consequence: "Support diagnoses the wrong root cause; metadata has no attempt count to show the run was retried at all."
  p_typical: 0.03
  grounded: inferred
  evidence: "Shows ... the run's metadata."
  proposed: "Store an attempts list (started_at, ended_at, failure_code) per run; metadata shows 'Attempts: 3'."
  shallow: false
- id: partial-failure-11
  title: "Double-click on Submit with 5 files creates 10 runs; no idempotency key per submit"
  level: L4
  cell: {action: double-click-submit, batch-size: exactly-5-files, surface: submit-dialog}
  object: "Submit dialog: 'One run is created per file. The dialog closes and the new rows appear at the top of the table'"
  situation: "User double-clicks Submit, or the create request times out at 30 s and the client retries."
  consequence: "10 rows appear, 10 jobs consume processing capacity, user deletes 5 by hand (no bulk delete)."
  p_typical: 0.12
  grounded: quote
  evidence: "One run is created per file."
  proposed: "Client sends an idempotency key per (submit, file index); server returns the existing run for a repeated key within 24 h; Submit disabled after first click."
