- id: partial-failure-13
  title: "Late or out-of-order status events can regress a Done row back to Processing"
  level: L4
  cell: {status-mix: all-processing, actor: background-processing-service, time-and-connection: during-service-incident}
  object: "Runs table status column; 'Status badge in the header mirrors the table.'"
  situation: "A delayed 'Processing' heartbeat from the encode step is applied after the 'Done' event from the suggestion step."
  consequence: "Row flips Done -> Processing; Open shows a run with output but a Processing badge; notification already fired."
  p_typical: 0.03
  grounded: inferred
  evidence: "Queued -> Processing -> Done"
  proposed: "Terminal statuses are final; status updates carry a monotonic sequence number and older updates are dropped."
  shallow: false
