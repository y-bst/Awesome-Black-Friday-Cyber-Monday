  consequence: "Row shows Processing for days; user cannot Retry and may not Delete (unspecified for Processing); no Failed message exists."
  p_typical: 0.12
  grounded: inferred
  evidence: "Queued -> Processing -> Failed"
  proposed: "Worker heartbeat every 30 s; reaper marks Failed with failure_code=worker_lost after 5 min without heartbeat or after 3x expected duration for the video length."
