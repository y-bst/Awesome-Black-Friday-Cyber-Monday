- id: partial-failure-12
  title: "At-least-once job delivery fires the Done in-app notification twice for one run"
  level: L4
  cell: {notification-state: burst-of-5-in-one-minute, actor: background-processing-service, status-mix: all-done}
  object: "Notifications: 'When a run reaches Done, the user receives an in-app notification.'"
  situation: "Worker writes Done, then its ack to the queue times out; the job is redelivered, finishes again and emits a second Done event."
  consequence: "User gets duplicate notifications; a 5-file submit can produce 10; suggestions may be written twice (duplicate rows in the list)."
  p_typical: 0.04
  grounded: quote
  evidence: "When a run reaches Done, the user receives an in-app notification."
  proposed: "Notification keyed on (run_id, terminal_status) with unique constraint; status write is compare-and-set from Processing; suggestions replaced, not appended, per attempt."
