- id: qa-lead-1
  title: "Runs table, 5 files in one submit, 2 reach Failed and 3 reach Done: no batch row, no 'partial (3/5)' summary, rows are indistinguishable from unrelated runs"
  level: L3
  cell: {surface: runs-table, batch-size: exactly-5-files, status-mix: some-done-some-failed, action: open}
  object: "Submit dialog sentence 'One run is created per file.' and Runs table columns 'thumbnail, title, status, submitted at, duration, actions'"
  situation: "User submits 5 files at once; processing service fails 2 of them and completes 3"
  consequence: "There is no column, grouping or aggregate state that answers 'how did my submit of 5 go'; the user must scan 5 rows and count; a QA test cannot assert any batch-level outcome because none exists"
  p_typical: 0.25
  grounded: quote
  evidence: "One run is created per file. The dialog closes and the new rows appear at the top of the table with status Queued."
  proposed: "Either state explicitly 'no batch entity; each row is independent' or add a batch id and a summary line 'Submitted 5: 3 Done, 2 Failed'"
  shallow: false
