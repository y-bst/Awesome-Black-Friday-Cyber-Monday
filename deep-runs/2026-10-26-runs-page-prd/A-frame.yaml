topic: Runs page PRD v0.3 — situations the PRD does not specify
unit: a gap — a situation for which the PRD specifies no behaviour, state, copy, limit or owner
leaf_test: >
  Concrete object = a named screen (Runs table, Submit dialog, Run detail page, in-app notification),
  a named column/status/action, a stated limit (1-5 files, 2 GB, 25 rows, mp4/mov), or a quoted PRD sentence.
  "Act tomorrow" = a PM could write the missing spec line or acceptance criterion from the item alone.
audience: the PM writing v0.4; for each gap they decide add-to-spec / defer / accept-as-unspecified
artifacts:
  - path: .claude/skills/deep/examples/sample-prd-runs-page.md
    kind: prd
    objects: screens, columns, statuses (Queued/Processing/Done/Failed), actions (Open/Delete/Accept/Dismiss/Submit), transitions, limits, notification rule, non-goals
rubric: fmea
quota_per_perspective: 15
mode: quick
